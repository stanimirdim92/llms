[project]
name = "portfolio-ai"
version = "0.0.1"
description = "AI services for portfolio.ai"
authors = [
    {name="Stanimir Dimitrov", email="stanimirdim92@gmail.com"}
]
maintainers = [
    {name="Stanimir Dimitrov", email="stanimirdim92@gmail.com"}
]
readme = "README.md"
license = "Apache-2.0"

# 3.13, lowered from 3.14. The 3.14 floor existed for `uuid.uuid7()`, and the comment
# here claimed api/routers/documents.py and streamlit_app/Home.py used it -- stale, since
# those call sites went away when `session_id` became an auth-derived `tenant_id`. It
# survived in `scripts/create_tenant.py` only, which is not even copied into the image;
# `app/ids.py` now provides it with an RFC 9562 fallback, so 3.13 is honestly supported.
# Docker and CI still run 3.14 -- a runtime newer than the floor is the normal case. The
# floor is what the code *requires*, and nothing here requires 3.14 any more.
requires-python = ">=3.13,<4.0"
dependencies = [
    "gunicorn[http2]>=26.0.0,<30.0.0",
    "pillow>=12.3.0,<13.0.0",
    "redis[hiredis]>=8.0.0,<9.0.0",
    # Rate-limit counting only; the policy around it is app/rate_limit.py. Deliberately WITHOUT
    # an extra: `limits[redis]` would drag in `redis>3,<8.0.0` and conflict with the line above,
    # while `limits[async-redis]` adds coredis for nothing. `limits.aio` with
    # `implementation="redispy"` uses the redis-py already here.
    "limits>=5.8.0,<6.0.0",
    "fastapi[standard]>=0.140.13,<0.150.0",
    "uvicorn>=0.51.0,<0.60.0",
    "sqlmodel>=0.0.39,<0.0.50",

    # AI Engineer Portfolio (track) — RAG / eval / agent additions.
    # Generation, embeddings, vector store, and reranking all go through LangChain's
    # integration packages (not the raw provider SDKs) so Epic 1 is built on the same
    # framework Epic 3's LangGraph agent runs on, per the original plan.
    "langchain>=1.3.14,<2.0.0",
    "langchain-core>=1.5.1,<2.0.0",
    "langchain-community>=0.4.2,<0.5.0",
    "langchain-openai>=1.4.1,<2.0.0",
    "langgraph-checkpoint-postgres>=3.1.1,<4.0.0",
    "langgraph>=1.2.9,<2.0.0",
    "langchain-anthropic>=1.5.2,<2.0.0",
    "langchain-voyageai>=0.4.0,<1.0.0",
    "langchain-qdrant>=1.1.0,<2.0.0",
    "qdrant-client>=1.18.0,<2.0.0",
    "psycopg[binary]>=3.3.4,<4.0.0",
    # Postgres, not the sqlite checkpointer: this project runs one database engine.
    "pydantic-settings>=2.14.2,<3.0.0",
    "docling>=2.115.0,<3.0.0",
    "structlog>=26.1.0,<27.0.0",
    "streamlit>=1.60.0,<2.0.0",
    "procrastinate>=3.9",
    # Declared because `scripts/fetch_corpus.py` imports it, not because anything would be
    # missing otherwise: `fastapi[standard]`, `anthropic` and `qdrant-client` all pull it in.
    # It replaced the `arxiv` client, which only ever resolved a URL that is deterministic.
    "httpx>=0.28.1,<0.29.0",
]

[project.optional-dependencies]
dev = [
  "devtools>=0.12.2",
  "ruff>=0.16.0",
  "ty>=0.0.63",
  "memory-profiler>=0.61.0,<1",
  "pytest>=9.1.1,<10",
  "pyrefly>=1.2",
  # Auth is the one path where a silent regression means cross-tenant data access, so it
  # gets database-backed tests. They run against a real Postgres (see tests/db/) and skip
  # when none is reachable, rather than substituting SQLite -- testing on an engine the
  # app never uses is how a backend-specific bug hides.
  "pytest-asyncio>=1.3.0,<2",
  # Randomises test order every run, and reseeds `random` per test. Replaced a working
  # agreement to "run the suite three times before calling it green" -- three identical runs
  # use the same order every time, so they can only catch timing races and state leaking
  # *between* runs, never a test that passes solely because another ran first. That was the
  # thing the rule was reaching for. The seed is printed and `-p randomly --randomly-seed=N`
  # reproduces any failure exactly, so a red CI run stays actionable.
  "pytest-randomly>=4.0.0,<5",
  # Drives .pre-commit-config.yaml. Every project-tool hook there is a `local` hook calling
  # `uv run`, so pre-commit orchestrates but does not own tool versions -- those stay in uv.lock.
  "pre-commit>=4.5.0,<5",
  # CVE scan over the exported lockfile; the same command CI runs, available locally.
  "pip-audit>=2.10.1,<3",
]
local-reranker = [
  "sentence-transformers>=5.6.1,<6.0.0",
  # CrossEncoderReranker moved out of `langchain` into this package in the 1.0 split
  "langchain-classic>=1.0.8,<2.0.0",
]


[project.urls]
homepage = "https://github.com/stanimirdim92/llms/tree/main/portfolio"
repository = "https://github.com/stanimirdim92/llms/tree/main/portfolio"
documentation = "https://github.com/stanimirdim92/llms/tree/main/portfolio"

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"
[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.pytest.ini_options]
# asyncio_mode = auto so `async def test_...` runs without decorating every test.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
