# This file lives in .docker/, but the build context for api/streamlit is `..` (the
# portfolio/ root) -- their COPY paths inside Dockerfile are relative to that root, not
# to wherever the Dockerfile itself sits. Compose resolves `context`/`env_file`/volume
# paths against this file's own location rather than the cwd, so those work either way.
#
# ALWAYS pass --env-file, from portfolio/:
#
#     docker compose -f .docker/docker-compose.yml --env-file .env up
#
# or from .docker/: `docker compose --env-file ../.env up`. This is not optional and not
# cosmetic. The `${VAR:-default}` substitutions below are resolved by Compose itself,
# which reads them from the shell or from a `.env` in the *project directory* -- that is
# `.docker/`, not portfolio/ and not the cwd. Verified both invocation styles: with a
# value set only in ../.env and no --env-file, both silently used the fallback default.
# `env_file: ../.env` on individual services is a different mechanism (it populates a
# container's environment) and does not help here.
#
# The consequence is worse than a wrong default, because the two halves disagree: the
# api container reads the real value from ../.env via env_file, while this file's port
# mappings and the nginx build args get the fallback. So PORT=9000 in ../.env alone
# yields gunicorn bound to 9000, a published mapping of 8000:8000, and an nginx upstream
# pointing at api:8000 -- three values, one of them right, no error anywhere.
#
# PORT (set it in ../.env, defaults to 8000) is the one source of truth for the api
# service's actual port: it drives gunicorn's --bind inside the container (Dockerfile's
# CMD reads it directly from the runtime environment), this file's port mapping for
# `api` below, and nginx's upstream block (baked in at nginx's own build time via the
# API_PORT build arg below, sourced from the same PORT value). GUNICORN_TIMEOUT and
# MAX_UPLOAD_SIZE_MB work the same way, for the same reason -- see the nginx service's
# build args.
#
# Runs today: api + worker (background ingestion) + streamlit + qdrant (vector store) +
# postgres (document registry *and* the job queue) +
# redis (rate-limit counters) + nginx
# (reverse proxy in front of api only -- HTTP-only for now via conf.d/default.conf,
# whose own comments describe what to change once there's a real domain to provision
# TLS for; the 443 port mapping below is just reserved, nothing listens there yet).
# nginx lives at .docker/nginx/ (a sibling of this file), not ../nginx like redis --
# everything else here follows the reference project's "each infra piece is a sibling
# of .docker/" convention, but nginx specifically was asked to live inside .docker/
# instead. A worker and phoenix service still aren't included since there's nothing
# real for them to run yet.
#
# Note on ../data permissions: the images run as a non-root `appuser`. A bind mount
# takes on the host directory's ownership, so if you hit permission errors writing to
# data/uploads, data/raw_pdfs, etc., either `chmod -R o+rwX ../data` once on the host, or
# switch the volumes below to a named volume (`portfolio_data:` instead of `../data`).
# `qdrant`/`postgres` deliberately use named volumes (not `../data`) instead -- each
# image manages that volume's ownership itself, so there's no equivalent permission
# dance to do for them. `redis` needs no volume at all: its conf disables persistence
# (it's a pure cache), so there's nothing to keep across a restart.
#
# Pinned below rather than left to Compose's default (the containing directory's
# basename) -- without this, running from `.docker/` names containers `docker-api-1`
# etc., while running from `portfolio/` names them `portfolio-api-1`, and each gets
# treated as a separate project. That's how a stale container from one invocation
# style silently survives and collides on the same host port when you later run it
# the other way.
name: portfolio

services:
  qdrant:
    # Kept in step with pyproject.toml's qdrant-client pin (1.18.x) -- Qdrant's own
    # compatibility policy wants major.minor to match between client and server;
    # mismatched versions (this was v1.12.5 against a 1.18.0 client) don't necessarily
    # break anything outright but throw a real warning and aren't a supported pairing.
    image: qdrant/qdrant:v1.18.3
    restart: unless-stopped
    ports:
      # Loopback only. `- "6333:6333"` binds 0.0.0.0 on the host, and Docker inserts its
      # forwarding rules into the DOCKER chain *ahead* of the filter rules ufw and firewalld
      # write -- so a published port on a cloud VM is reachable from the internet even with
      # the host firewall reporting the port as blocked. Nothing outside this network needs
      # any of these three; the api/worker/streamlit services reach them by service name.
      # The mapping is kept, rather than deleted, because `psql`, `redis-cli` and Qdrant's
      # dashboard from the host are how this stack gets debugged.
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      # No curl/wget in this image (deliberately, per the maintainers) -- a bash
      # TCP-connect check only proves the port is listening, not that /healthz
      # returns 200, but that's enough to gate startup ordering here.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    ports:
      # Loopback only -- see the qdrant service for why `0.0.0.0` is what you get otherwise.
      - "127.0.0.1:5432:5432"
    # POSTGRES_USER/PASSWORD/DB come from ../.env via env_file, the same way api/
    # streamlit already load it -- not the `${POSTGRES_USER:-portfolio}` compose-time
    # substitution this used to use. That substitution resolves against the shell env or
    # a `.env` next to *this* compose file, never ../.env, so a real override in
    # ../.env would have silently been ignored here while still reaching the app
    # containers below. `.env.example` uncomments these three (a password is required
    # for the image to start) so they're never actually unset.
    env_file:
      - ../.env
    environment:
      # Explicit, not inherited from the image/locale default -- psycopg 3 negotiates
      # client encoding against whatever this is, so pin it rather than assume it.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C.UTF-8 --lc-ctype=C.UTF-8"
    volumes:
      # `/var/lib/postgresql`, NOT `/var/lib/postgresql/data`. From postgres 18 the official
      # images store data in a major-version-specific subdirectory (`18/docker`) so that
      # `pg_upgrade --link` can run without crossing a mount-point boundary. Mounting at
      # `/data` -- correct for 17 and earlier -- makes the 18 entrypoint refuse to start:
      #   "there appears to be PostgreSQL data in: /var/lib/postgresql/data (unused
      #    mount/volume)"
      # which reads like a corrupt volume rather than a wrong mount path. This was missed
      # when the image was bumped 17-alpine -> 18-alpine; the mount was left behind.
      #
      # The volume is also renamed rather than reused. Pointing the old `postgres_data` at
      # the new path would nest a v17 data directory at the volume root, where the image
      # expects a `18/` subdir -- so it would initdb alongside the old files and leave both.
      # A new name gets a clean volume and leaves the stale one on disk to inspect or delete
      # deliberately (`docker volume rm portfolio_postgres_data`).
      - postgres_data_v18:/var/lib/postgresql
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # docker-entrypoint.sh runs as root on first boot to chown $PGDATA to the postgres
    # user (`gosu`, i.e. setuid/setgid) before initdb -- cap_drop: ALL alone breaks
    # bootstrapping a fresh volume. This is a minimal allowlist, not "give up and drop
    # nothing": CHOWN/SETUID/SETGID are the hard requirements; DAC_OVERRIDE/FOWNER
    # avoid corner-case permission failures during initdb.
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    healthcheck:
      # $POSTGRES_USER/$POSTGRES_DB here are the *container's own* shell-expanded env
      # vars at healthcheck-execution time (single $, evaluated inside the container by
      # CMD-SHELL) -- not compose's `${...}` substitution, which (see the env_file note
      # above) can't see ../.env. Using compose substitution here would check the
      # fallback default even when the container itself is running with a real
      # ../.env-provided override, breaking the healthcheck for anyone who customizes it.
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    build:
      context: ../redis
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # Loopback only, and this is the service where it matters most: `redis.conf` sets
      # `protected-mode no` with no `requirepass`, so anything that can open the port has
      # unauthenticated access to the rate-limit counters and to `CONFIG SET` -- which is a
      # known remote-code-execution path (write a module or a cron file via `CONFIG SET dir`).
      # Published on 0.0.0.0, as it was, that is an open Redis on any host with a public
      # interface. Internet-wide scans for exactly this take minutes, not days.
      - "127.0.0.1:${REDIS_PORT:-6379}:${REDIS_PORT:-6379}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: .docker/Dockerfile
      target: api
    restart: unless-stopped
    ports:
      # Loopback, like the three data services. nginx is the intended front door -- it is what
      # carries `client_max_body_size`, the timeouts and the security headers -- so a publicly
      # published `api` bypasses all of it, and `docs/IDEAS.md` now proposes edge rate limiting
      # there too. `http://localhost:8000` from the host, as the README documents, still works.
      # **nginx itself is deliberately NOT loopback-bound** (80/443 below): it is the one service
      # that is supposed to be reachable.
      - "127.0.0.1:${PORT:-8000}:${PORT:-8000}"
    env_file:
      - ../.env
    environment:
      QDRANT_URL: http://qdrant:6333
      # POSTGRES_USER/PASSWORD/DB reach app/config.py's Settings straight from ../.env
      # via env_file above -- no DATABASE_URL or DB_USER/PASSWORD/NAME to construct or
      # keep in sync here. Only DB_HOST needs overriding: config.py's default
      # ("localhost") is right for a bare/local run, but inside this compose network
      # postgres is reachable by its service name instead. DB_PORT stays the default
      # 5432 either way, so it's not repeated here.
      DB_HOST: postgres
      # Rate-limit counters (app/rate_limit.py) -- must be shared across gunicorn workers,
      # which is why they live in Redis rather than in process memory.
      REDIS_HOST: redis
    volumes:
      - ../data:/app/data
      # Persists Docling's HuggingFace/torch/RapidOCR model downloads across container
      # recreates (~1 min of cold-start downloads otherwise). Named volume, not a bind
      # mount, so it inherits the image's appuser ownership -- see the Dockerfile's
      # XDG_CACHE_HOME block. Shared with `worker` and `streamlit`: all three run the same
      # ingestion code, so they'd otherwise each download their own copy.
      #
      # All three mounting one volume is also why the Dockerfile must leave `.cache` empty.
      # Docker copies the image's content at that path into a fresh volume during container
      # *create*, and three concurrent creates race that copy -- `mkdir _data/torch: file
      # exists`, which failed this stack outright. Keep the mount point empty in the image.
      - model_cache:/home/appuser/.cache
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
      # Rate limiting fails open when Redis is unreachable, so without this the api would
      # start serving unthrottled for however long redis took to come up -- a silent gap
      # rather than a visible failure, which is the worse kind.
      redis:
        condition: service_healthy

  worker:
    # Consumes the ingest queue. Same image and same ../data mount as `api` -- it runs the
    # identical ingest_document code, so the file the api wrote must be at the same path here.
    build:
      context: ..
      dockerfile: .docker/Dockerfile
      target: worker
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      QDRANT_URL: http://qdrant:6333
      DB_HOST: postgres
      # No REDIS_HOST: the worker doesn't rate-limit anything. Its queue is Postgres.
    volumes:
      - ../data:/app/data
      # Same named volume as `api`, so the ~1min of Docling model downloads is paid once
      # across both rather than per container.
      - model_cache:/home/appuser/.cache
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      # No dependency on `api`: the queue is in Postgres, so the worker is useful the moment
      # the database is up, and coupling them would mean an api restart takes ingestion down.
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  nginx:
    build:
      context: nginx
      dockerfile: Dockerfile
      args:
        API_PORT: ${PORT:-8000}
        # Both must match what the api service runs with -- nginx sits in front, so
        # whichever limit is smaller is the one that actually applies, silently. See
        # nginx/Dockerfile for what each failure looks like when they drift.
        REQUEST_TIMEOUT: ${GUNICORN_TIMEOUT:-600}
        MAX_UPLOAD_MB: ${MAX_UPLOAD_SIZE_MB:-20}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Root's usual "superpowers" are themselves capability-gated, not just UID-0 --
    # cap_drop: ALL removes them from root too. NET_BIND_SERVICE for binding port 80 (a
    # privileged port), SETUID/SETGID for the master process's privilege drop to the
    # `user www-data;` worker processes nginx.conf configures. CHOWN *is* needed --
    # correcting an earlier assumption here: the stock image's own
    # docker-entrypoint.sh/docker-entrypoint.d/*.sh scripts genuinely don't chown
    # anything (that part was checked correctly), but nginx's own master process does,
    # internally, chowning its cache/temp dirs (/var/cache/nginx/*) to the `user`
    # directive's UID before dropping privileges -- that's a different layer than the
    # shell entrypoint scripts, and missing it meant nginx crash-looped on every start
    # with `chown(...) failed (1: Operation not permitted)` until this was added.
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
      - CHOWN
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # No curl/wget in the stock nginx image -- same TCP-connect approach as qdrant's
      # healthcheck above.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/80' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  streamlit:
    build:
      context: ..
      dockerfile: .docker/Dockerfile
      target: streamlit
    restart: unless-stopped
    ports:
      # Published on all interfaces, unlike `api` and the three data services, and deliberately:
      # nginx fronts only `portfolio_api` (see nginx/conf.d/default.conf), so loopback-binding
      # this would leave the UI reachable over an SSH tunnel and nowhere else. What makes that
      # acceptable is that the page does nothing until a key is pasted -- Home.py returns at
      # `if not api_key` and 1_API_keys.py resolves a Principal before rendering anything -- so
      # what is exposed is a login form, not a tenant's documents. Front it with nginx before
      # putting this on a public box, because then it also gets the timeouts, the body-size cap
      # and the security headers that the api service only has by sitting behind the proxy.
      - "8501:8501"
    env_file:
      - ../.env
    environment:
      QDRANT_URL: http://qdrant:6333
      # POSTGRES_USER/PASSWORD/DB reach app/config.py's Settings straight from ../.env
      # via env_file above -- no DATABASE_URL or DB_USER/PASSWORD/NAME to construct or
      # keep in sync here. Only DB_HOST needs overriding: config.py's default
      # ("localhost") is right for a bare/local run, but inside this compose network
      # postgres is reachable by its service name instead. DB_PORT stays the default
      # 5432 either way, so it's not repeated here.
      DB_HOST: postgres
      # Rate-limit counters (app/rate_limit.py) -- must be shared across gunicorn workers,
      # which is why they live in Redis rather than in process memory.
      REDIS_HOST: redis
    volumes:
      - ../data:/app/data
      # Persists Docling's HuggingFace/torch/RapidOCR model downloads across container
      # recreates (~1 min of cold-start downloads otherwise). Named volume, not a bind
      # mount, so it inherits the image's appuser ownership -- see the Dockerfile's
      # XDG_CACHE_HOME block. Shared with `streamlit`: both run the same ingestion code,
      # so they'd otherwise each download their own copy.
      - model_cache:/home/appuser/.cache
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      # No dependency on `api`, and that is the same reasoning the `worker` service already
      # carries: Streamlit calls the ingestion and answer code *in process*, never over HTTP, so
      # it needs Qdrant, Postgres and its provider keys -- not a running API. It used to wait on
      # `api: service_healthy`, which meant Streamlit refused to start while api was merely
      # restarting, or while api was failing its own boot-time credential check, for a reason
      # that has nothing to do with Streamlit. The inconsistency was the tell: two services with
      # identical needs declared different dependencies.
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  qdrant_data:
  # Renamed from `postgres_data` when the image moved to 18 -- see the mount comment on the
  # postgres service. The old volume is intentionally not reused and not auto-removed.
  postgres_data_v18:
  model_cache:
