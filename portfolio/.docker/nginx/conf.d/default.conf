# HTTP only for now -- no real domain to point Let's Encrypt at yet. Once there is one:
# 1. Add a certbot service (see the redis/postgres/qdrant services in
#    .docker/docker-compose.yml for the pattern) and provision certs against this
#    domain via the HTTP-01 challenge (the `location ~ /.well-known/acme-challenge/`
#    block below is already here for that).
# 2. Add a `listen 443 ssl http2 ...` server block with `ssl_certificate`/
#    `ssl_certificate_key`/`ssl_trusted_certificate` pointing at the provisioned certs,
#    and change this block's `location /` to a 301 redirect to https, matching the
#    pattern this file was adapted from.
# nginx.conf's ssl_protocols/ssl_ciphers/resolver are already in place for that step.
server {
    listen 80 default_server reuseport backlog=1024;
    server_name _;

    location ~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    access_log /var/log/nginx/portfolio.access.log main buffer=512k flush=1m;
    error_log /var/log/nginx/portfolio.error.log warn;

    # Both zones are defined in nginx.conf, which also holds why this is keyed on IP while the app
    # keys on API key, and why health is exempted with an empty map value.
    #
    # **At server level deliberately, not in `location /`.** A `location` that declares its own
    # `limit_req` does not inherit the ones above it, so putting these in one location means any
    # location added later is silently unlimited -- the same inheritance trap nginx.conf documents
    # for `add_header`, with a quieter failure. Every location here inherits both because none of
    # them declares a `limit_req` of its own; if one ever needs a different budget, it must repeat
    # both lines, not just add the one it wants.
    #
    # `nodelay` matters more than it looks: without it nginx *queues* excess requests up to `burst`
    # and releases them at the configured rate, so a client sending a legitimate burst sees added
    # latency rather than a refusal, and a slow client is indistinguishable from a shed one. With
    # it, anything inside the burst allowance is served immediately and only genuine excess is 429'd.
    # `burst` is not optional either -- `rate=Nr/s` is enforced as one request every 1/N seconds, so
    # a burstless zone rejects the second request of a pair arriving in the same millisecond.
    limit_req zone=api_general burst=__EDGE_BURST_GENERAL__ nodelay;
    limit_req zone=api_upload  burst=__EDGE_BURST_UPLOAD__  nodelay;

    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        # https://stackoverflow.com/questions/24453388/nginx-reverse-proxy-causing-504-gateway-timeout/36589120#36589120
        # https://www.f5.com/company/blog/nginx/avoiding-top-10-nginx-configuration-mistakes#no-keepalives see point 3
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_ignore_headers    X-Accel-Expires Expires Cache-Control Set-Cookie;
        proxy_redirect off;
        proxy_buffering off;
        proxy_buffer_size 24k;
        proxy_busy_buffers_size 24k;
        proxy_buffers 64 4k;
        # proxy_read_timeout is the one that matters: it bounds the gap between reads
        # from the upstream, so it covers both a long synchronous ingest and a streaming
        # /ask response that pauses between tokens. Substituted from REQUEST_TIMEOUT so
        # it can never drift below gunicorn's --timeout -- see nginx/Dockerfile.
        #
        # proxy_connect_timeout stays at 75s deliberately, and is NOT wired to
        # REQUEST_TIMEOUT: nginx documents that this timeout "cannot usually exceed 75
        # seconds", so the 315s previously set here was never real. Connecting to a
        # container on the compose network either succeeds in milliseconds or the
        # upstream is down; a large value here buys nothing and misleads the reader into
        # thinking it is the request budget.
        proxy_connect_timeout  75s;
        proxy_send_timeout  __REQUEST_TIMEOUT__s;
        proxy_read_timeout  __REQUEST_TIMEOUT__s;
        proxy_pass http://portfolio_api;
        proxy_next_upstream error timeout http_500;

        aio threads;
    }

    location = /favicon.ico {
        log_not_found off;
    }

    location = /robots.txt {
        log_not_found off;
    }

    location ~* /\.(?!well-known\/) {
      deny all;
    }

    # Block access to files that can expose sensitive information.
    location ~* (?:#.*#|\.(?:bak|conf|dist|fla|in[ci]|log|orig|psd|sh|sql|sw[op])|~)$ {
      deny all;
    }
}
