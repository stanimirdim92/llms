user www-data;
worker_processes auto;
worker_rlimit_nofile 65535;
# worker_cpu_affinity 0001 0010 xxxx or auto;

include /etc/nginx/modules-enabled/*.conf;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;


events {
    #
    # Let each process accept multiple connections.
    # Accept as many connections as possible, after nginx gets notification
    # about a new connection.
    # May flood worker_connections, if that option is set too low.
    #
    multi_accept off;
    accept_mutex off;

    #
    # Determines how many clients will be served by each worker process.
    # (Max clients = worker_connections * worker_processes)
    # Should be equal to `ulimit -n / worker_processes`
    #
    worker_connections  10000;
    use epoll;
}

http {
    server_tokens off;
    charset utf-8;
    log_not_found          off;
    sendfile on;
    # send file in chunk of 512K
    sendfile_max_chunk 512k;

    # Tcp_nopush causes nginx to attempt to send its HTTP response head in one
    # packet, instead of using partial frames. This is useful for prepending
    # headers before calling sendfile, or for throughput optimization.
    tcp_nopush on;
    tcp_nodelay on;
    types_hash_max_size 2048;
    # Substituted at build time from MAX_UPLOAD_MB, which docker-compose.yml passes from
    # the same MAX_UPLOAD_SIZE_MB the app reads -- see nginx/Dockerfile's comment. nginx
    # rejects an oversized body before the app ever sees it, so a smaller figure here
    # silently overrides app/config.py rather than conflicting visibly with it.
    client_max_body_size __MAX_UPLOAD_MB__m;
    types_hash_bucket_size 64;
    client_body_buffer_size 512k;
    client_header_buffer_size 8k;
    large_client_header_buffers 8 64k;
    keepalive_timeout  62;
    keepalive_requests      1000;
    variables_hash_max_size 2048;
    variables_hash_bucket_size 128;
    server_names_hash_bucket_size 256; # this seems to be required for some vhosts
    server_names_hash_max_size 4096;
    # server_name_in_redirect off;

    #
    # Allow the server to close the connection after a client stops
    # responding.
    # Frees up socket-associated memory.
    #
    reset_timedout_connection on;

    map_hash_max_size 2048;
    map_hash_bucket_size 2048;

    # limit_req_log_level warn;
    # limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

    # client_body_timeout is the gap allowed *between reads* of the request body, not the
    # total upload duration -- but it was 32s, and that is short enough to kill real
    # uploads on a slow or stalling link: a 20MB file from a phone on mobile data pauses
    # for longer than that routinely, and the client gets a 408 that looks like a server
    # fault. This is the one timeout an async job queue will NOT make irrelevant -- the
    # body still has to arrive over the wire synchronously no matter what happens to it
    # afterwards. Header timeout stays short: headers are small and a client that can't
    # send them promptly is a slowloris, not a slow uploader.
    client_body_timeout __REQUEST_TIMEOUT__;
    client_header_timeout 32;
    charset_types
        text/css
        text/plain
        text/vnd.wap.wml
        text/javascript
        text/markdown
        text/calendar
        text/x-component
        text/vcard
        text/cache-manifest
        text/vtt
        application/json
        application/manifest+json;

    log_format  main  '"$host" - $remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" [$request_time $upstream_response_time]';

    access_log  /var/log/nginx/access.log  main buffer=512k;
    include mime.types;
    default_type application/octet-stream;


    # HEADERS
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           DENY always;
    add_header Referrer-Policy           "same-origin" always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Cache-Control             "no-transform";
    add_header Timing-Allow-Origin       "*";
    # add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests; http: https: data: blob: 'unsafe-inline'" always;

    #  https://hstspreload.org/#deployment-recommendations
    #add_header Strict-Transport-Security "max-age=16070400; includeSubDomains" always;
    # (1) Enable your site for HSTS preload inclusion.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy accelerometer=(),autoplay=(),camera=(),display-capture=(),document-domain=(),encrypted-media=(),fullscreen=(),geolocation=(),gyroscope=(),magnetometer=(),microphone=(),midi=(),payment=(),picture-in-picture=(),publickey-credentials-get=(),screen-wake-lock=(),sync-xhr=(self),usb=(),web-share=(),xr-spatial-tracking=() always;

    gzip on;
    gzip_disable "msie6";
    gzip_min_length 1240;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 32 4k;
    gzip_http_version 1.1;
    gzip_types
        application/javascript
        application/rss+xml
        application/vnd.ms-fontobject
        application/x-font
        application/x-font-opentype
        application/x-font-otf
        application/x-font-truetype
        application/x-font-ttf
        application/x-javascript
        application/xhtml+xml
        application/xml
        font/opentype
        font/otf
        font/ttf
        image/svg+xml
        image/x-icon
        text/css
        text/javascript
        text/plain
        text/xml
        application/atom+xml
        application/geo+json
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/wasm
        application/x-web-app-manifest+json
        font/eot
        image/bmp
        image/vnd.microsoft.icon
        text/cache-manifest
        text/calendar
        text/markdown
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/x-cross-domain-policy;

    # FILE CACHE
    open_file_cache max=20000 inactive=20s;
    open_file_cache_valid   30s;
    open_file_cache_min_uses    2;
    open_file_cache_errors  on;


    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # "api" is the docker-compose service name for the FastAPI container -- nginx
    # resolves it via the compose network's DNS. __API_PORT__ is substituted at image
    # build time (see nginx/Dockerfile*'s sed step) from the same PORT value
    # docker-compose.yml uses for the api service's own bind/port mapping, so both stay
    # in sync from one source of truth. Deliberately NOT using nginx's runtime envsubst
    # templating (COPY into /etc/nginx/templates/*.template) for this: that mechanism
    # substitutes every $-prefixed token via envsubst, which would just as happily wipe
    # out nginx's own variables ($scheme, $remote_addr, $http_upgrade, etc.) throughout
    # this file with empty strings unless carefully scoped -- a plain, non-$-prefixed
    # placeholder token substituted once at build time has no such collision risk.
    upstream portfolio_api {
        # https://www.f5.com/company/blog/nginx/avoiding-top-10-nginx-configuration-mistakes
        # 9th point
        hash $binary_remote_addr consistent;

        # 10th point
        zone upstreams 64K;
        server api:__API_PORT__ max_fails=3 fail_timeout=6s;
        keepalive 200;
    }

    # TLS scaffolding: inert until conf.d/default.conf actually adds a `listen 443 ssl`
    # server block with real certificate paths -- see that file's comments. Kept here
    # so wiring up HTTPS later is just adding a server block, not also relearning this.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
    resolver               1.1.1.1 1.0.0.1 8.8.8.8 8.8.4.4 208.67.222.222 208.67.220.220 valid=60s;
    resolver_timeout       3s;
    ssl_stapling on;
    ssl_stapling_verify on;


    include /etc/nginx/conf.d/*.conf;
#     include /etc/nginx/sites-enabled/*;
}
