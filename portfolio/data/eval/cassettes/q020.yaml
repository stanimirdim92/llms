        is a heatmap chart displaying harmfulness evaluation results across five language
        models (Gemma-3-12B, Llama-3.1-8B, Ministral-3-8B, Phi-4-14B, and Qwen2.5-7B)
        under four retrieval-augmented generation (RAG) conditions each (Non-RAG,
        Oracle unsafe, On-topic, Random). The columns represent four evaluation metrics/classifiers
        (Llama-Guard, WildGuard, ShieldGemma, and Accuracy), with cell values showing
        the proportion of outputs flagged as unsafe, color-coded from dark blue (low,
        ~0.0) to red (high, ~1.0). The data reveals that the \\\"Oracle unsafe\\\"
        condition consistently produces the highest harmfulness rates across all models
        and metrics (e.g., Ministral-3-8B reaches 0.91 on Accuracy and Qwen2.5-7B
        reaches 0.83), while \\\"Random\\\" and \\\"On-topic\\\" RAG conditions yield
        much lower harmfulness scores (mostly below 0.25), indicating that injecting
        deliberately unsafe retrieved context substantially increases harmful outputs
        compared to non-adversarial retrieval conditions.\",\"metadata\":{\"ingestion_version\":\"01a0fc5427ea71babb96a22c2c5762f3\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a-fig-018-04\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a\",\"chunk_type\":\"figure\",\"section_path\":\"\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":204,\"page_no\":18,\"filename\":\"2609.11758v1.pdf\",\"image_path\":\"/var/www/html/personal/llms/portfolio/data/processed/01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a/figures/fig-018-04-0e31d4617873b336.png\"}}},{\"id\":\"01fc0118-5f0a-5a7b-a17c-915836e6620f\",\"version\":9,\"score\":0.5159819,\"payload\":{\"page_content\":\"A.3
