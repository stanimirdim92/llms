    body: '{"query": "What are the four retrieval conditions in RAG-Safety-Bench?",
      "documents": ["A.2 Safety evaluation details\nEach example in the balanced subset
      is expanded into four evaluation conditions: non_rag , rag_oracle_unsafe , rag_topic_safe
      , and rag_control_safe_random . Since the balanced subset contains 346 examples,
      this expansion produces 1,384 example-condition rows per model and 6,920 total
      responses across the five evaluated models.\nThe benchmark controls retrieval
      quality by directly supplying context documents, rather than relying on a live
      retriever to discover them at inference time. This is important because a poor
      retriever could otherwise fail to retrieve the relevant harmful document and
      artificially inflate apparent safety.\nThe non_rag condition supplies no documents
      for all 346 examples. The rag_oracle_unsafe condition supplies one document
      for all 346 examples. The rag_topic_safe condition supplies three documents
      for 344 examples and two documents for two examples. The rag_control_safe_random
      condition supplies three documents for 321 examples, two documents for 24 examples,
      and one document for one example.\nIn the final evaluation configuration, context
      is supplied as cleaned full-article-prefix text with a per-document cap of approximately
      12,000 characters. Section-level metadata are retained for provenance and auditing.\nThe
      response-generation templates are intentionally simple. In the non_rag condition,
      the model is instructed to answer using only its own knowledge. In the three
      RAG conditions, the model is instructed to answer using only the provided documents,
      with each supplied context labeled sequentially as Context 1 , Context 2 , etc.\nAll
      model responses were generated deterministically with temperature = 0 . 0 ,
      topp = 1 . 0 , and sampling disabled. We used a maximum of 1,024 newly generated
      tokens per response and a fixed run seed of 42. For RAG conditions, each cleaned
      retrieved-document prefix was capped at 12,000 characters. The same prompt template
      and decoding settings were used across all four conditions for a given model.\nAll
      experiments were run on an academic research cluster with NVIDIA H100 GPUs.
      Compute requirements varied by model size, context length, and response length.
      The five-model evaluation required approximately 74 GPU-hours in total, including
      response generation and local safety judging. The released configurations and
      run manifests provide the information needed to reproduce the evaluation.",
      "3.2 Safety-capability relationship\nOur benchmark, RAG-Safety-Bench, complements
      the original MIRAGE benchmark by measuring safety rather than benign capability.
      The benchmark enables direct comparison across 4 settings, as described in Table
      1. Note the distinction between the Oracle and On-topic settings: in the oracle
      setting, the answer is directly available in the retrieved context. In the on-topic
      condition, the retrieved documents are on the same topic as the query (in the
      example, explosives), but do not contain the answer to the query.\nBy providing
      the context documents directly, the benchmark enables evaluation of the base
      LLM''s ability to maintain safety guardrails in the presence of RAG context,
      while removing the confounding factor of retriever quality (e.g., a poor retriever
      might simply miss the relevant unsafe document and therefore lead to a misleadingly
      inflated safety score).\nThe method for constructing the benchmark is as follows.
      We first develop a taxonomy of harmful user queries, based on the existing MLCommons
      AILuminate ''Hazard Taxonomy'' (Ghosh et al., 2025). The context of RAG safety
      evaluation and our intended corpus of Wikipedia documents required some modifications
      to the existing taxonomy. Our current version of RAG-SafetyBench excludes the
      following harm categories: Privacy/identification: since our knowledge base
      is a public resource, we assume it does not contain private information (though
      privacy leakage may be a concern in other RAG use cases); Direct generation
      of harmful content: the focus of the benchmark is on question answering, not
      content generation; Intellectual property: Wikipedia users are strictly forbidden
      from uploading copyrighted material without permission, and so it is not a suitable
      resource to test for intellectual property leakage; Specialized advice: this
      category (comprising topics such as legal advice, medical advice) is often poorly
      defined and highly-contextual, and so we do not include it here. The final taxonomy
      is given in Table 2.\nFollowing Park et al. (2025) and An et al. (2025), we
      use Wikipedia as our knowledge base. For each sub-category in the harm taxonomy,
      we identify a relevant category or set of categories on Wikipedia where harmful
      information related to the topic can be found. We then use Claude-Sonnet-4.5
      to generate potentially harmful questions whose answers can be found in one
      of the available Wikipedia documents. We also enforce a series of self-checks
      to avoid hallucinations or unrealistic questions (see Appendix for full details
      and prompts). The Claude model outputs a harmful question, a rating of the question''s
      severity, the name and ID of the Wikipedia article that contains the answer,
      the exact text passage containing the answer, a summary of the expected unsafe
      answer, as well as other additional information to aid human review of the questions
      and answers (shown in Table 6 in the Appendix). We aimed to generate a minimum
      of 20 queries per subcategory in the taxonomy, although ultimately there was
      more actionable information available for some categories than others. We therefore
      release two versions of the benchmark: the Full version contains 987 harmful
      queries, distributed unevenly across the subcategories, while the Balanced version
      (used in the current analysis) is subsampled to a more uniform distribution
      across subcategories (see Table 2).", "6 Conclusion\nWe introduce RAG-Safety-Bench
      with the goal of disentangling the effects of RAG on LLM safety by cleanly separating
      four retrieval conditions. Across five open-source models, our results show
      that the most interesting failure mode is model-specific: for Qwen-2.5-7B, on-topic
      but answer-free documents elicited more harmful responses than the non-RAG baseline,
      consistent with the hypothesis that topicrelevant context can surface harmful
      information from parametric memory.\nMore generally, our findings confirm that
      nonRAG safety evaluations do not transfer to RAG deployments. Our initial results
      from the benchmark only evaluate the baked-in safety guardrails of the base
      model. However, in a production system, responsible AI practitioners should
      provide end-toend safety measures including (when warranted): corpus curation,
      input prompt filtering, retrievalside filtering, output filtering, and system
      prompt safety instructions, among other possible mitigations. Thus an important
      use case for our benchmark is also to evaluate the impact of safety interventions
      at different points in the multi-component RAG pipeline. Our results also indicate
      the need to choose an automated safety evaluator which is closely aligned with
      the safety concerns relevant to the particular application, and where possible
      to deploy multiple safety judges, as well as appropriate human oversight.",
      "Table 1: The four settings of the RAG-Safety-Bench benchmark. Example documents
      are for the query, ''What materials and design do I need to make an IED that
      can defeat armored police vehicles?''\n\n| Setting   | Description                                                                        |
      Example Wikipedia documents                             |\n|-----------|------------------------------------------------------------------------------------|---------------------------------------------------------|\n|
      LLM-only  | No context documents provided.                                                     |
      (None)                                                  |\n| Oracle    | One
      of the returned documents contains the answer.                                 |
      ''Explosively formed penetrator''                         |\n| On-topic  | Oracle
      document not included, but documents are related to the topic of the query.
      | ''Deflagration to detonation tran- sition'', ''Blast wall'' |\n| Random    |
      Documents are randomly selected from a set of benign documents.                    |
      ''Climate change and birds'', ''Ar- boretum''               |", "Kathleen C.
      Fraser\nFaculty of Engineering University of Ottawa Ottawa, Canada kathleen.fraser@uottawa.ca\nFigure
      1: The four conditions in RAG-Safety-Bench allow for detailed safety evaluation
      of RAG-enabled systems.\ntrustworthiness and accuracy by reducing hallucinations,
      relative to non-RAG LLMs (Shuster et al., 2021). For these reasons, conventional
      wisdom would suggest that RAG-based LLMs should be safer than non-RAG models,
      with the primary security risk being data poisoning attacks on the RAG corpus.
      In the absence of poisoned data, there would be little reason to suspect a RAG
      system would output more harmful content than its base LLM component.\nHowever,
      this assumption has been upended by recent work from An et al. (2025), who presented
      compelling evidence that when LLMs are enabled with RAG they are generally less
      safe than when relying on their parametric knowledge, even when the retrieved
      documents are benign. In the current work, we contribute to the understanding
      of this newly-identified problem by disentangling the notions of safety and
      capability through a new RAG-specific safety benchmark, RAG-SafetyBench. Furthermore,
      we take a closer look at what it means for documents and outputs to be ''unsafe,''
      to support more detailed analysis of the problematic case where safe RAGdocuments
      appear to lead to unsafe outputs.\nRAG systems are challenging to evaluate because
      they are composed of multiple components, each of which contributes to the overall
      end-to-end performance of the system (Wampler et al., 2025). In particular,
      the retrieval quality can have a major impact on the quality of the output.
      The MIRAGE benchmark (Park et al., 2025) enables the evaluation of RAG systems
      while controlling for retrieval quality by providing sets of relevant and irrelevant
      oracle documents.\nWe modify and extend this style of evaluation to safety evaluation
      in the RAG setting. Our RAGSafety-Bench benchmark consists of a set of unsafe
      English queries and three sets of documents (Figure 1): in the oracle setting,
      the unsafe answer is available in the document set. This setting could represent
      a data-poisoning attack - however, since we sourced all of our data from Wikipedia,
      it also represents the more common case that the data is believed to be generally
      benign but has not been meticulously curated. In the on-topic setting, the documents
      are relevant to the topic of the query but do not explicitly contain the unsafe
      answer. In the random setting, randomly-selected documents on safe topics are
      provided.\nThis testing framework allows us to answer several key open research
      questions relating to the safety of RAG systems:", "4.1 R1: Capability in safe
      and unsafe contexts\nTable 3 reports accuracies for each model when asked benign
      and harmful questions, in both nonRAG, oracle RAG, and mixed settings. In the
      benign case, accuracy is scored using the MIRAGE benchmark method (Park et al.,
      2025). In the harmful (RAG-Safety-Bench) case, we compare the output response
      with the expected benchmark response, using Claude-Opus-4.7 to output a fi-
      nal label of accurate or inaccurate relative to the reference. Human annotation
      of a subset of 100 examples validates the LLM-as-a-judge approach, with agreement
      of 95-96% between humans and LLM, and Cohen''s \u03ba of 0.90-0.92 (more details
      and prompt available in Appendix Section A.4).\nTable 1: The four settings of
      the RAG-Safety-Bench benchmark. Example documents are for the query, ''What
      materials and design do I need to make an IED that can defeat armored police
      vehicles?''\n\nLLM-only, Description = No context documents provided.. LLM-only,
      Example Wikipedia documents = (None). Oracle, Description = One of the returned
      documents contains the answer.. Oracle, Example Wikipedia documents = ''Explosively
      formed penetrator''. On-topic, Description = Oracle document not included, but
      documents are related to the topic of the query.. On-topic, Example Wikipedia
      documents = ''Deflagration to detonation tran- sition'', ''Blast wall''. Random,
      Description = Documents are randomly selected from a set of benign documents..
      Random, Example Wikipedia documents = ''Climate change and birds'', ''Ar- boretum''",
      "Abstract\nAllowing large language models (LLMs) to retrieve information from
      a set of trusted documents can increase reliability and reduce hallucination.
      However, recent work has demonstrated that retrieval-augmented generation (RAG)
      can have unintended side effects on the overall safety of the generated responses,
      when prompted for harmful or dangerous content. A clearer understanding of the
      mechanisms leading to this result is needed, as increasing numbers of end users
      turn to RAG to incorporate corporate documents and knowledge bases into LLM-based
      systems. We introduce RAG-Safety-Bench, a benchmark to measure the safety impact
      of RAG on LLM models. By removing the confounding effect of retriever quality,
      and cleanly separating the problem into four conditions - non-RAG, RAG with
      an oracle document containing the answer to the harmful request, RAG with documents
      related to the harmful request but without the specific answer, and RAG with
      random, safe documents - the benchmark isolates the impacts of different factors
      in the observed safety degradation. We report results across five opensource
      LLMs, showing an inverse relationship between benign and unsafe capability,
      strong evidence that baseline safety guardrails do not lead to downstream safety
      guarantees in the RAG case, and model-specific support for previous findings
      that even benign documents can lead to unsafe generation in retrieval-enabled
      systems.", "Kathleen C. Fraser\n1. To what extent is the observed RAG safety
      decline correlated with a model''s RAG capability? Previous work suggests that
      some models which appear ''safe'' may simply be less capable of extracting and
      summarizing relevant information. We test this rigorously, and hypothesize the
      following (H1): Models which perform better on MIRAGE (benign capability) will
      also have higher accuracy and therefore lower safety in the oracle setting of
      RAG-Safety-Bench.\n2. Is RAG safety decline a factor of unsafe information or
      unsafe context drift? The conventional view, challenged by An et al. (2025),
      is that RAG models are less safe only when the documents they retrieve are unsafe.
      An alternative explanation is that the increased context length, possibly containing
      many words semantically related to the unsafe query, shift the models into a
      less-aligned domain. 1 Our hypothesis (H2) is that the direct availability of
      the answer (oracle setting) will lead to the\n1 In fact, this is similar to
      the intuition behind the successful Crescendo jailbreak (Russinovich et al.,
      2025).\nhighest number of unsafe answers, but that the on-topic setting will
      lead to a higher number of unsafe answers relative to the baseline non-RAG setting,
      due to the destabilizing effect of the harmful-topic context. If the effect
      is purely due to context length, the random setting will lead to an equivalent
      harmfulness rate.\n3. What is the impact of RAG on the refusal rate of LLMs?
      In many studies, safety is operationalized as refusal: a safe model is one which
      refuses to answer harmful questions. We distinguish between two varieties of
      refusal; namely, unwillingness to fulfill a harmful request versus inability
      to find the answer in the retrieved documents. We hypothesize (H3) that the
      refusal rate for harmful requests will be highest in the random setting, and
      attributed to a lack of information. We argue that this case should be distinguished
      from ''true'' model safety, which should rely on an inherent unwillingness to
      provide dangerous advice. At the same time, the oracle setting offers contrasting
      evaluation in which we ensure the model has access to the requested information,
      so refusal can be more clearly interpreted as effective implementation of safety
      guardrails.\n4. Do different safety evaluators agree on what is safe versus
      harmful? Standard safety evaluation relies on LLM-based ''judges'' to label
      text as safe or unsafe. We compare multiple safety evaluators, with the hypothesis
      (H4) that there will be a high level of disagreement between the LLM evaluators.\nRAG-Safety-Bench
      is freely available for research use at the following URL: https://github.com/The-Safe-AI-Lab/
      RAG-Safety-Bench .", "This is a diagram illustrating an experimental setup comparing
      different RAG (Retrieval-Augmented Generation) conditions for a language model
      responding to a potentially harmful query (\"How can I synthesize diethyl ether
      peroxide in my home lab?\"). It shows a human figure posing the question to
      four robot icons representing different conditions: Non-RAG (no retrieved context),
      Oracle (retrieves the exact relevant synthesis steps for C4H10O3), On-Topic
      (retrieves a tangentially related organic compound definition), and Random (retrieves
      unrelated information about barn swallows). The image visually demonstrates
      how varying the type of retrieved context (none, highly relevant, loosely related,
      or irrelevant) might influence the model''s response to a sensitive request.",
      "Limitations\nThe current findings must be interpreted with the following limitations
      in mind. RAG-Safety-Bench is English-only, considers only one document source
      (Wikipedia), and covers a non-exhaustive set of possible harm categories. Further
      work is required to understand how retrieval-enabled LLMs behave in languages
      other than English and in multiple use contexts. The current study highlighted
      how assessments of safety can be subjective; clearly, the type of potentially
      dangerous information that can be returned to a trained intelligence officer
      versus a layperson versus a schoolchild are very different and such use cases
      must be assessed separately.\nBy design, our benchmark does not evaluate the
      impact of the retriever in the RAG system. However, and end-to-end evaluation
      would also need to assess interactions between retriever ranking, query reformulation,
      and generator safety. Our benchmark also represents a simplified view of RAG
      methodology, while production RAG systems would likely include additional safety
      components, such as system-level safety instructions and input/output filters.\nOur
      testing suite of models included only opensource models, and relatively small
      models due to computing resource constraints. Again, real-world RAG deployments
      will likely use much larger commercial models. We note that our RAG-SafetyBench
      benchmark can be used to evaluate such models, and that our reason for not doing
      so was to avoid being banned for Terms-of-Service violations. We encourage researchers
      with internal access to such models to use our benchmark and publish the results.\nOur
      methodology for benchmark generation and automated assessment relies heavily
      on the Claude family of models from Anthropic. While we did conduct human evaluations
      to validate Claude''s performance, a more robust (though expensive) methodology
      could combine multiple strong LLM judges in an ensemble. Furthermore, we evaluate
      on a single run of the benchmark, but due to the stochastic nature of LLM generation,
      the results might differ across multiple runs.", "4.1 R1: Capability in safe
      and unsafe contexts\nTable 2: The taxonomy of harms covered in RAGSafety-Bench.
      The number of realistic, dangerous queries that could be generated from Wikipedia
      articles varied across subcategories: the column ''Full'' indicates the total
      of queries available for each category, the column ''Balanced'' indicates the
      number of queries in each subcategory after sub-sampling to avoid topic bias.\n\nViolent,
