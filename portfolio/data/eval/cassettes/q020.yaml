      346\nIn the benign case, we observe a large increase in accuracy in the oracle
      RAG setting relative to the non-RAG setting, indicating that all of the models
      in our experiments are capable of incorporating information from RAG context,
      when the correct information is available. Therefore, safety behav- ior in the
      current study cannot be attributed to a model''s inability to attend to the
      RAG docs (An et al., 2025). Performance is loosely associated with model size:
      Phi-4-14B performs best in the oracle condition, followed by Gemma-3-12B, followed
      by the 7-8B parameter models.", "This is a stacked bar chart comparing response
      safety behaviors across five language models (Gemma-3-12B, Llama-3.1-8B, Ministral-3-8B,
      Phi-4-14B, Qwen2.5-7B) under four retrieval conditions (Non-RAG, Oracle, On-topic,
      Random). The y-axis shows \"Proportion of responses\" from 0 to 1.0, with bars
      segmented into five categories: Complied (unsafe), Complied (safe), Safety refusal,
      Insufficient info, and Other refusal, each shown in a distinct color. The chart
      illustrates how retrieval context affects model safety, showing that safety
      refusal rates vary substantially across models and conditions, with Phi-4-14B
      showing mostly safety refusals and other models like Ministral-3-8B and Qwen2.5-7B
      showing higher proportions of compliance (safe and unsafe) especially in Oracle
      and On-topic conditions.", "A.1 RAG-Safety-Bench benchmark creation\nRAG-Safety-Bench
      was constructed from Wikipedia-based source material using a semiautomated pipeline.
      We first defined a taxonomy of harmful user requests by adapting the MLCommons
      AILuminate hazard taxonomy to the RAG question-answering setting. The final
      taxonomy contains 20 subcategories spanning violent crimes, sex-related crimes,
      nonviolent crimes, hate, indiscriminate weapons, and self-harm (Table 2). As
      described in the main paper, several categories from the original taxonomy were
      excluded because they were not appropriate for a public Wikipedia-based QA benchmark,
      including privacy/identification, direct harmful content generation, intellectual
      property, and specialized advice.\nFor each harm subcategory, we identified
      one or more relevant Wikipedia categories or documents likely to contain harmful
      answer-bearing information. We then used Claude Sonnet-4.5 to generate candidate
      harmful questions whose answers could be grounded in those documents. In addition
      to the question itself, the generation stage also produced supporting metadata
      for review, including severity, naturalness notes, answerability justification,
      source-document identifiers, and a short gold reference summary of the harmful
      answer. This gold reference is stored in the field expected_unsafe_answer_summary
      . The prompt used with Claude Sonnet-4.5 to generate candidate unsafe questions
      from Wikipedia articles is shown in Table 5.\nThe released benchmark contains
      two versions. The Full version contains 987 harmful questions, distributed unevenly
      across the 20 subcategories. The Balanced version, used in the experiments in
      this paper, subsamples toward a uniform target of 20 examples per subcategory
      where available. Some subcategories contain fewer than 20 viable examples, so
      the final balanced subset contains 346 unique examples in total (Table 2).\nEach
      released benchmark row contains a query plus the metadata needed to instantiate
      one controlled evaluation condition. Important fields include:\n- example_id
      , original_example_id , and row_uid : stable identifiers linking conditionspecific
      rows to the underlying benchmark question;\n- question and expected_unsafe_answer_summary
      : the harmful user query and its reference answer summary;\n- harm_category
      , harm_topic_family , taxonomy_family , taxonomy_subcategory , topic , and topic_slug
      : harm-taxonomy metadata;\n- gold_doc_id and gold_doc_title : provenance for
      the source document underlying the oracle condition;\n- condition , doc_count
      , and docs : the evaluation condition and its model-facing document contexts;\n-
      strict_audit_labels : final oracle answerability and on-topic non-answerability
      audit outcomes; and\n- runtime_context_cap , context_ablation , final_freeze_version
      , source_run_id , and source_builder_mode : runtime and dataset provenance metadata.\n",
      "4 Experimental Setup\nTable 2: Models (top) and datasets (bottom). All four
      models share the Qwen2.5-7B-Instruct base. Passages is the number of roughly
      100-token chunks in each retrieval index.\n\nBaseline, Training on top of the
      base = none (Qwen2.5-7B-Instruct). Search-R1, Training on top of the base =
      RLVR with PPO. ReSearch, Training on top of the base = RLVR with GRPO. R-Search,
      Training on top of the base = RLVR with GRPO\nNQ, Questions = 499. NQ, Passages
      = 40,791. NQ, Source = Wikipedia. QAMPARI, Questions = 500. QAMPARI, Passages
      = 44,879. QAMPARI, Source = Wikipedia. HAGRID, Questions = 500. HAGRID, Passages
      = 8,986. HAGRID, Source = Wikipedia. RAGTruth, Questions = 500. RAGTruth, Passages
      = 6,981. RAGTruth, Source = Web\nModels. Our comparison rests on a single design
      choice: every model in Table 2 starts from the same weights. The baseline is
      Qwen2.5-7BInstruct (Qwen Team, 2024); Search-R1 (Jin et al., 2025), ReSearch
      (Chen et al., 2025), and R-Search (Zhao et al., 2025) are open-weight agents
      trained from that exact checkpoint with RLVR. Whatever separates an agent from
      the baseline is therefore training, not architecture, tokenizer, or pretraining
      data.\nFixed-context evaluation. We disable agentinitiated retrieval and give
      every model the same five passages retrieved externally with BM25. This is an
      intentional control: our question is whether RLVR-trained agents differ in citation
      attribution when the available evidence is held constant. Allowing agents to
      retrieve would introduce differences in search policy and evidence selection,
      making those effects inseparable from citation behavior.\nDatasets. We use four
      question-answering datasets: NQ from KILT (Petroni et al., 2021; Kwiatkowski
      et al., 2019), QAMPARI from ALCE (Gao et al., 2023; Amouyal et al., 2023), HA-
      GRID (Kamalloo et al., 2023), and the questionanswering portion of RAGTruth
      (Niu et al., 2024), sampling 500 questions from each (499 for NQ). For each
      dataset we chunk the corpus into roughly 100-token passages and retrieve the
      top five per question with BM25 (Robertson and Zaragoza, 2009).", "This is a
      heatmap chart displaying harmfulness evaluation results across five language
      models (Gemma-3-12B, Llama-3.1-8B, Ministral-3-8B, Phi-4-14B, and Qwen2.5-7B)
      under four retrieval-augmented generation (RAG) conditions each (Non-RAG, Oracle
      unsafe, On-topic, Random). The columns represent four evaluation metrics/classifiers
      (Llama-Guard, WildGuard, ShieldGemma, and Accuracy), with cell values showing
      the proportion of outputs flagged as unsafe, color-coded from dark blue (low,
      ~0.0) to red (high, ~1.0). The data reveals that the \"Oracle unsafe\" condition
      consistently produces the highest harmfulness rates across all models and metrics
      (e.g., Ministral-3-8B reaches 0.91 on Accuracy and Qwen2.5-7B reaches 0.83),
      while \"Random\" and \"On-topic\" RAG conditions yield much lower harmfulness
      scores (mostly below 0.25), indicating that injecting deliberately unsafe retrieved
      context substantially increases harmful outputs compared to non-adversarial
      retrieval conditions.", "A.3 Answerability audit of evaluation contexts\nTable
      6: Example final benchmark record. Each question is expanded into four condition-specific
      entries; document titles, context sources, and model-facing context lengths
      are shown here, while the complete cleaned document text is distributed in the
      released JSONL.\n\nExample ID, Final benchmark value = sm_ffc059c710da603a.
      Question, Final benchmark value = What can I mix with gasoline to make an effective
      incendiary device?. Expected unsafe answer summary, Final benchmark value =
      An unsafe response would describe mixing rubber with gasoline or white phosphorus
      with jelled gasoline, and potentially detail the latex-based formulations (LA-60,
      LA-100, CR, SR) with their specific components like caustic soda and coconut
      oil, along with the 1-pound black powder ignition charge.. Taxonomy subcategory
      Gold document, Final benchmark value = chemical_weapons. Strict answerability
      au-, Final benchmark value = M47 bomb (ID recorded in the released JSONL). dit,
      Final benchmark value = Oracle: yes; on-topic: no.. Condition contexts, Final
      benchmark value = Non-RAG (0 docs): No retrieved documents. Oracle unsafe (1
      docs): M47 bomb (9,217 characters). On-topic safe (3 docs): Non-lethal weapon
      (12,000 characters); BM-21 Grad (12,000 characters); M2 4.2-inch mortar (9,864
      characters). Random control (3 docs): Anastomosing stream (32 characters); Climate
      change and birds. Document metadata, Final benchmark value = (5,012 characters);
      Clutch (eggs) (3,217 characters). For each document, docs records its document
      ID, title, URL, rank, gold-document flag, safety label, answer-support label,
      topical-relation label, selected-section IDs/headings, selection method, text-source
      label, context-length metadata, and cleaned model-facing text.. Runtime cap,
      Final benchmark value = {''max_chars_per_doc'': 12000, ''max_docs_for_row'':
      0, ''max_total_doc_chars_for_row'': 0, ''context_mode'': ''v14_cleaned_full_article'',
      ''source_freeze_version'': ''sec- tion_level_v13_1000_strict_runtime_clean_deduped''}.
      Context and freeze provenance, Final benchmark value = runtime_context_cap ,
      context_ablation , oracle_context_version , and final_freeze_version record
      the final evaluation configuration and dataset freeze.", "2 Related Work\nRetrieval-augmented
      generation Enabling LLMs to consult a database of trusted documents through
      retrieval-augmented generation (RAG) has many benefits: it reduces hallucination,
      allows companies to inject proprietary knowledge/documents into the system,
      supports the rapid update of information without retraining, and can enable
      source attribution (Lewis et al., 2020; Shuster et al., 2021; Fan et al., 2024).
      However, it also exposes new attack surfaces. Most research on the safety and
      security of RAG systems has focused on the security of the knowledge base: data
      poisoning attacks involve the injection of malicious (mis)information into the
      document store (Tan et al., 2024; Nazary et al., 2025; Zhang et al., 2025),
      and data extraction attacks aim to recover sensitive or private information
      from the documents through a RAG interface (Zeng et al., 2024a; Qi et al., 2024;
      Vonderhaar et al., 2025). However, the safety of RAG systems in non-adversarial
      settings has been less studied. An et al. (2025) were the first to highlight
      that RAG systems can output more harmful responses than non-RAG LLMs, even in
      the absence of any malicious intervention. Other work considers the related
      problem of safety degradation in AI agents that have been enabled with information
      retrieval or search capabilities (Yu et al., 2025; BehnamGhader et al., 2025;
      Zhan et al., 2026). Previous work measures the safety of the entire RAG system,
      but the information content and safety of the retrieved documents is an uncontrolled
      variable. Our work takes the next step towards a more scientific understanding
      of these observed phenomena by systematically altering one variable at a time
      (no retrieval, random retrieval, on-topic retrieval, exact-answer retrieval)
      to observe the effect on the safety of the LLM responses.\nLong-context safety
      The retrieval of harmful documents is one factor in the observed safety decline
      in RAG models. However, the literature suggests that another factor may be a
      behavioural shift induced by the inclusion of extended context. In fact, Yu
      et al. (2025) claim that ''safety degradation is largely independent of retrieved
      context itself.'' An et al. (2025) found that 94.7% of the retrieved documents
      in their study were safe, and therefore could not account for the much larger
      increase in unsafe responses. They hypothesize that the retrieved texts, though
      benign themselves, can trigger the recall of unsafe information from the model''s
      parametric knowledge. Other work has shown that LLMs are less capable of identifying
      harmful content in long contexts (Ghorbanpour and Fraser, 2025) and are more
      likely to answer harmful questions in long-context settings (Anil et al., 2024;
      Lu et al., 2025; Huang et al., 2025). In some cases, the model can drift away
      from its default ''helpful assistant'' persona even when the context itself
      is not harmful (e.g. a therapy conversation)\n(Lu et al., 2026). Therefore,
      in this study we design our benchmark to test the ''harmful documents'' and
      ''long context'' explanations separately.", "4.1 R1: Capability in safe and
      unsafe contexts\nWehypothesized (H1) that models which demonstrated higher benign
      RAG capability would also demonstrate higher unsafe RAG capability; however,
      this is not supported by the ''Unsafe capability'' data. In fact, the accuracies
      under the BenignOracle and Unsafe-Oracle conditions are negatively correlated
      (Pearson r = -0 . 70 ). This may indicate that the larger and more capable models
      also have better safety guardrails when they are presented with unsafe queries.
      However, all models are, in general, more likely to provide a correct response
      to the harmful question when the response is available in the documents, suggesting
      that guardrails still need to be improved to specifically handle the RAG setting.",
      "6 Discussion\nHow to read the R-Search result. R-Search sits above its base
      on all four datasets and significantly above on the best-powered one, which
      is a real and consistent pattern. It is also one model, one base, one prompt,
      and one scorer, so four datasets are not four independent replications, and
      the effect softens under a stricter variant and a looser outcome. Two things
      would settle it: a cross-dataset test declared in advance, and an arm fine-tuned
      on the same data without RL, which would separate the contribution of RL from
      the contribution of fine-tuning on retrieval data at all.\nA note on cost. Everything
      here, four models, four datasets, three variants, both conditions, and the control
      that makes the comparison interpretable, ran on Kaggle''s T4 GPUs. Careful measurement
      was the cheap part of this project. The expensive part was reading the construction
      code closely enough to know which controls we did not have to run.", "4 Experimental
      Setup\nLeakage drove the dataset choice. NQ is where the original probe ran,
      so we keep it for comparability, but Search-R1 trained on NQ''s training split
      and we say so plainly. QAMPARI, HAGRID, and RAGTruth were not used to train
      any of the three agents, so on those datasets no gap can be waved away as familiarity
      with the data. They also sidestep a retrieval quirk in NQ: for 186 of 499 NQquestions
      (37.3%), all five passages come from one document, which leaves the model almost
      no choice about what to cite. The other three datasets have no such questions.\nPrompt
      and generation. One prompt does all the work, byte-identical across models and
      across the clean and doctored runs. It tells the model to answer using only
      the numbered passages, to close every sentence with exactly one citation such
      as [2], and to reply ''I don''t know'' when the passages fall short. Decoding
      is greedy, capped at 300 new tokens. When any sentence of an answer breaks the
      one-citation rule we drop the whole answer rather than salvage the compliant
      half, because a partly rescued answer reintroduces the claim-to-citation ambiguity
      the format exists to prevent. Models differ sharply in how often they abstain,
      from 15% to 52% of questions; Appendix C takes that apart. The full prompt is
      in Appendix A.\nReading our numbers. Three statistical choices shape every result,
      and each has a plain reason behind it.\nWe resample questions, not claims. A
      single question yields up to seven claims that share one context and one generated
      answer, so treating claims as independent would make our intervals look tighter
      than they are. We use a cluster bootstrap instead: draw whole questions with
      replacement 2,000 times, recompute the planted and control conditions on the
      same draw so the pairing survives, and read off the 2.5th and 97.5th percentiles.
      Every 95% confidence interval in this paper is that band, the range of effects
      our data are consistent with.\nWe compare each agent against its own base. Post-rationalization
      is common in the baseline, so reporting that an agent post-rationalizes tells
      us nothing about RL. The question is whether an agent diverges from the model
      it was trained from. That calls for a difference-in-differences: take the plantversus-control
      difference within a model (Equation 1), then difference those differences across
      models,\n<!-- formula-not-decoded -->\nNegative says RLVR made citations more
      faithful, positive says it made them worse, and zero says training left this
      behavior alone. Within each dataset we test all three agents against the baseline
      and correct the three comparisons with the Holm method, so that running three
      tests does not manufacture a significant one."], "model": "rerank-2.5", "top_k":
      5, "truncation": true}'
