      exact relevant synthesis steps for C4H10O3), On-Topic (retrieves a tangentially
      related organic compound definition), and Random (retrieves unrelated information
      about barn swallows). The image visually demonstrates how varying the type of
      retrieved context (none, highly relevant, loosely related, or irrelevant) might
      influence the model's response to a sensitive request.\"},\"title\":\"2609.11758v1.pdf
      [01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a] (figure,
      page 1)\",\"citations\":{\"enabled\":true}},{\"type\":\"document\",\"source\":{\"type\":\"text\",\"media_type\":\"text/plain\",\"data\":\"This
      is a stacked bar chart comparing response safety behaviors across five language
      models (Gemma-3-12B, Llama-3.1-8B, Ministral-3-8B, Phi-4-14B, Qwen2.5-7B) under
      four retrieval conditions (Non-RAG, Oracle, On-topic, Random). The y-axis shows
      \\\"Proportion of responses\\\" from 0 to 1.0, with bars segmented into five
      categories: Complied (unsafe), Complied (safe), Safety refusal, Insufficient
