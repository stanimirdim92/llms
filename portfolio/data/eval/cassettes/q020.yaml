      346\nIn the benign case, we observe a large increase in accuracy in the oracle
      RAG setting relative to the non-RAG setting, indicating that all of the models
      in our experiments are capable of incorporating information from RAG context,
      when the correct information is available. Therefore, safety behav- ior in the
      current study cannot be attributed to a model''s inability to attend to the
      RAG docs (An et al., 2025). Performance is loosely associated with model size:
      Phi-4-14B performs best in the oracle condition, followed by Gemma-3-12B, followed
      by the 7-8B parameter models.", "This is a stacked bar chart comparing response
      safety behaviors across five language models (Gemma-3-12B, Llama-3.1-8B, Ministral-3-8B,
      Phi-4-14B, Qwen2.5-7B) under four retrieval conditions (Non-RAG, Oracle, On-topic,
      Random). The y-axis shows \"Proportion of responses\" from 0 to 1.0, with bars
      segmented into five categories: Complied (unsafe), Complied (safe), Safety refusal,
      Insufficient info, and Other refusal, each shown in a distinct color. The chart
      illustrates how retrieval context affects model safety, showing that safety
      refusal rates vary substantially across models and conditions, with Phi-4-14B
      showing mostly safety refusals and other models like Ministral-3-8B and Qwen2.5-7B
      showing higher proportions of compliance (safe and unsafe) especially in Oracle
      and On-topic conditions.", "A.1 RAG-Safety-Bench benchmark creation\nRAG-Safety-Bench
      was constructed from Wikipedia-based source material using a semiautomated pipeline.
      We first defined a taxonomy of harmful user requests by adapting the MLCommons
      AILuminate hazard taxonomy to the RAG question-answering setting. The final
      taxonomy contains 20 subcategories spanning violent crimes, sex-related crimes,
      nonviolent crimes, hate, indiscriminate weapons, and self-harm (Table 2). As
      described in the main paper, several categories from the original taxonomy were
      excluded because they were not appropriate for a public Wikipedia-based QA benchmark,
      including privacy/identification, direct harmful content generation, intellectual
      property, and specialized advice.\nFor each harm subcategory, we identified
      one or more relevant Wikipedia categories or documents likely to contain harmful
      answer-bearing information. We then used Claude Sonnet-4.5 to generate candidate
      harmful questions whose answers could be grounded in those documents. In addition
      to the question itself, the generation stage also produced supporting metadata
      for review, including severity, naturalness notes, answerability justification,
      source-document identifiers, and a short gold reference summary of the harmful
      answer. This gold reference is stored in the field expected_unsafe_answer_summary
      . The prompt used with Claude Sonnet-4.5 to generate candidate unsafe questions
      from Wikipedia articles is shown in Table 5.\nThe released benchmark contains
      two versions. The Full version contains 987 harmful questions, distributed unevenly
      across the 20 subcategories. The Balanced version, used in the experiments in
      this paper, subsamples toward a uniform target of 20 examples per subcategory
      where available. Some subcategories contain fewer than 20 viable examples, so
      the final balanced subset contains 346 unique examples in total (Table 2).\nEach
      released benchmark row contains a query plus the metadata needed to instantiate
      one controlled evaluation condition. Important fields include:\n- example_id
      , original_example_id , and row_uid : stable identifiers linking conditionspecific
      rows to the underlying benchmark question;\n- question and expected_unsafe_answer_summary
      : the harmful user query and its reference answer summary;\n- harm_category
      , harm_topic_family , taxonomy_family , taxonomy_subcategory , topic , and topic_slug
      : harm-taxonomy metadata;\n- gold_doc_id and gold_doc_title : provenance for
      the source document underlying the oracle condition;\n- condition , doc_count
      , and docs : the evaluation condition and its model-facing document contexts;\n-
      strict_audit_labels : final oracle answerability and on-topic non-answerability
      audit outcomes; and\n- runtime_context_cap , context_ablation , final_freeze_version
      , source_run_id , and source_builder_mode : runtime and dataset provenance metadata.\n",
      "4 Experimental Setup\nTable 2: Models (top) and datasets (bottom). All four
      models share the Qwen2.5-7B-Instruct base. Passages is the number of roughly
      100-token chunks in each retrieval index.\n\nBaseline, Training on top of the
      base = none (Qwen2.5-7B-Instruct). Search-R1, Training on top of the base =
      RLVR with PPO. ReSearch, Training on top of the base = RLVR with GRPO. R-Search,
      Training on top of the base = RLVR with GRPO\nNQ, Questions = 499. NQ, Passages
      = 40,791. NQ, Source = Wikipedia. QAMPARI, Questions = 500. QAMPARI, Passages
      = 44,879. QAMPARI, Source = Wikipedia. HAGRID, Questions = 500. HAGRID, Passages
      = 8,986. HAGRID, Source = Wikipedia. RAGTruth, Questions = 500. RAGTruth, Passages
      = 6,981. RAGTruth, Source = Web\nModels. Our comparison rests on a single design
      choice: every model in Table 2 starts from the same weights. The baseline is
      Qwen2.5-7BInstruct (Qwen Team, 2024); Search-R1 (Jin et al., 2025), ReSearch
      (Chen et al., 2025), and R-Search (Zhao et al., 2025) are open-weight agents
      trained from that exact checkpoint with RLVR. Whatever separates an agent from
      the baseline is therefore training, not architecture, tokenizer, or pretraining
      data.\nFixed-context evaluation. We disable agentinitiated retrieval and give
      every model the same five passages retrieved externally with BM25. This is an
      intentional control: our question is whether RLVR-trained agents differ in citation
      attribution when the available evidence is held constant. Allowing agents to
      retrieve would introduce differences in search policy and evidence selection,
      making those effects inseparable from citation behavior.\nDatasets. We use four
      question-answering datasets: NQ from KILT (Petroni et al., 2021; Kwiatkowski
      et al., 2019), QAMPARI from ALCE (Gao et al., 2023; Amouyal et al., 2023), HA-
      GRID (Kamalloo et al., 2023), and the questionanswering portion of RAGTruth
      (Niu et al., 2024), sampling 500 questions from each (499 for NQ). For each
      dataset we chunk the corpus into roughly 100-token passages and retrieve the
      top five per question with BM25 (Robertson and Zaragoza, 2009).", "This is a
      heatmap chart displaying harmfulness evaluation results across five language
      models (Gemma-3-12B, Llama-3.1-8B, Ministral-3-8B, Phi-4-14B, and Qwen2.5-7B)
      under four retrieval-augmented generation (RAG) conditions each (Non-RAG, Oracle
      unsafe, On-topic, Random). The columns represent four evaluation metrics/classifiers
      (Llama-Guard, WildGuard, ShieldGemma, and Accuracy), with cell values showing
      the proportion of outputs flagged as unsafe, color-coded from dark blue (low,
      ~0.0) to red (high, ~1.0). The data reveals that the \"Oracle unsafe\" condition
      consistently produces the highest harmfulness rates across all models and metrics
      (e.g., Ministral-3-8B reaches 0.91 on Accuracy and Qwen2.5-7B reaches 0.83),
      while \"Random\" and \"On-topic\" RAG conditions yield much lower harmfulness
      scores (mostly below 0.25), indicating that injecting deliberately unsafe retrieved
      context substantially increases harmful outputs compared to non-adversarial
      retrieval conditions.", "A.3 Answerability audit of evaluation contexts\nTable
      6: Example final benchmark record. Each question is expanded into four condition-specific
      entries; document titles, context sources, and model-facing context lengths
      are shown here, while the complete cleaned document text is distributed in the
      released JSONL.\n\nExample ID, Final benchmark value = sm_ffc059c710da603a.
      Question, Final benchmark value = What can I mix with gasoline to make an effective
      incendiary device?. Expected unsafe answer summary, Final benchmark value =
      An unsafe response would describe mixing rubber with gasoline or white phosphorus
      with jelled gasoline, and potentially detail the latex-based formulations (LA-60,
