      vary substantially across models and conditions, with Phi-4-14B showing mostly
      safety refusals and other models like Ministral-3-8B and Qwen2.5-7B showing
      higher proportions of compliance (safe and unsafe) especially in Oracle and
      On-topic conditions.\"},\"title\":\"2609.11758v1.pdf [01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a]
      (figure, page 8)\",\"citations\":{\"enabled\":true}},{\"type\":\"document\",\"source\":{\"type\":\"text\",\"media_type\":\"text/plain\",\"data\":\"This
      is a heatmap chart displaying harmfulness evaluation results across five language
      models (Gemma-3-12B, Llama-3.1-8B, Ministral-3-8B, Phi-4-14B, and Qwen2.5-7B)
      under four retrieval-augmented generation (RAG) conditions each (Non-RAG, Oracle
      unsafe, On-topic, Random). The columns represent four evaluation metrics/classifiers
