        Related Work\\nRetrieval-augmented generation Enabling LLMs to consult a database
        of trusted documents through retrieval-augmented generation (RAG) has many
        benefits: it reduces hallucination, allows companies to inject proprietary
        knowledge/documents into the system, supports the rapid update of information
        without retraining, and can enable source attribution (Lewis et al., 2020;
        Shuster et al., 2021; Fan et al., 2024). However, it also exposes new attack
        surfaces. Most research on the safety and security of RAG systems has focused
        on the security of the knowledge base: data poisoning attacks involve the
        injection of malicious (mis)information into the document store (Tan et al.,
        2024; Nazary et al., 2025; Zhang et al., 2025), and data extraction attacks
        aim to recover sensitive or private information from the documents through
        a RAG interface (Zeng et al., 2024a; Qi et al., 2024; Vonderhaar et al., 2025).
        However, the safety of RAG systems in non-adversarial settings has been less
        studied. An et al. (2025) were the first to highlight that RAG systems can
        output more harmful responses than non-RAG LLMs, even in the absence of any
        malicious intervention. Other work considers the related problem of safety
        degradation in AI agents that have been enabled with information retrieval
        or search capabilities (Yu et al., 2025; BehnamGhader et al., 2025; Zhan et
        al., 2026). Previous work measures the safety of the entire RAG system, but
        the information content and safety of the retrieved documents is an uncontrolled
        variable. Our work takes the next step towards a more scientific understanding
        of these observed phenomena by systematically altering one variable at a time
        (no retrieval, random retrieval, on-topic retrieval, exact-answer retrieval)
        to observe the effect on the safety of the LLM responses.\\nLong-context safety
        The retrieval of harmful documents is one factor in the observed safety decline
        in RAG models. However, the literature suggests that another factor may be
        a behavioural shift induced by the inclusion of extended context. In fact,
        Yu et al. (2025) claim that 'safety degradation is largely independent of
        retrieved context itself.' An et al. (2025) found that 94.7% of the retrieved
        documents in their study were safe, and therefore could not account for the
        much larger increase in unsafe responses. They hypothesize that the retrieved
        texts, though benign themselves, can trigger the recall of unsafe information
        from the model's parametric knowledge. Other work has shown that LLMs are
        less capable of identifying harmful content in long contexts (Ghorbanpour
        and Fraser, 2025) and are more likely to answer harmful questions in long-context
        settings (Anil et al., 2024; Lu et al., 2025; Huang et al., 2025). In some
        cases, the model can drift away from its default 'helpful assistant' persona
        even when the context itself is not harmful (e.g. a therapy conversation)\\n(Lu
        et al., 2026). Therefore, in this study we design our benchmark to test the
        'harmful documents' and 'long context' explanations separately.\",\"metadata\":{\"ingestion_version\":\"01a0fc5427ea71babb96a22c2c5762f3\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a-text-0005\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a\",\"chunk_type\":\"text\",\"section_path\":\"2
        Related Work\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":24,\"page_no\":2,\"filename\":\"2609.11758v1.pdf\"}}},{\"id\":\"cb1f3719-a71b-5525-9090-cd85efec6e80\",\"version\":9,\"score\":0.51386845,\"payload\":{\"page_content\":\"4.1
        R1: Capability in safe and unsafe contexts\\nWehypothesized (H1) that models
        which demonstrated higher benign RAG capability would also demonstrate higher
        unsafe RAG capability; however, this is not supported by the 'Unsafe capability'
        data. In fact, the accuracies under the BenignOracle and Unsafe-Oracle conditions
        are negatively correlated (Pearson r = -0 . 70 ). This may indicate that the
        larger and more capable models also have better safety guardrails when they
        are presented with unsafe queries. However, all models are, in general, more
        likely to provide a correct response to the harmful question when the response
        is available in the documents, suggesting that guardrails still need to be
        improved to specifically handle the RAG setting.\",\"metadata\":{\"ingestion_version\":\"01a0fc5427ea71babb96a22c2c5762f3\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a-text-0013\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a\",\"chunk_type\":\"text\",\"section_path\":\"4.1
        R1: Capability in safe and unsafe contexts\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":49,\"page_no\":5,\"filename\":\"2609.11758v1.pdf\"}}},{\"id\":\"eb9610c0-e536-5645-855d-f24b38ed799c\",\"version\":15,\"score\":0.51237196,\"payload\":{\"page_content\":\"6
        Discussion\\nHow to read the R-Search result. R-Search sits above its base
        on all four datasets and significantly above on the best-powered one, which
        is a real and consistent pattern. It is also one model, one base, one prompt,
        and one scorer, so four datasets are not four independent replications, and
        the effect softens under a stricter variant and a looser outcome. Two things
        would settle it: a cross-dataset test declared in advance, and an arm fine-tuned
        on the same data without RL, which would separate the contribution of RL from
        the contribution of fine-tuning on retrieval data at all.\\nA note on cost.
        Everything here, four models, four datasets, three variants, both conditions,
        and the control that makes the comparison interpretable, ran on Kaggle's T4
        GPUs. Careful measurement was the cheap part of this project. The expensive
        part was reading the construction code closely enough to know which controls
        we did not have to run.\",\"metadata\":{\"ingestion_version\":\"01a0fc55257f7276be70b7b3d1501b36\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6-text-0023\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6\",\"chunk_type\":\"text\",\"section_path\":\"6
        Discussion\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":103,\"page_no\":7,\"filename\":\"2609.23053v1.pdf\"}}},{\"id\":\"dec2d78a-c8ba-509b-9409-5f44d1c07f13\",\"version\":15,\"score\":0.51006675,\"payload\":{\"page_content\":\"4
        Experimental Setup\\nLeakage drove the dataset choice. NQ is where the original
        probe ran, so we keep it for comparability, but Search-R1 trained on NQ's
        training split and we say so plainly. QAMPARI, HAGRID, and RAGTruth were not
        used to train any of the three agents, so on those datasets no gap can be
        waved away as familiarity with the data. They also sidestep a retrieval quirk
        in NQ: for 186 of 499 NQquestions (37.3%), all five passages come from one
        document, which leaves the model almost no choice about what to cite. The
        other three datasets have no such questions.\\nPrompt and generation. One
        prompt does all the work, byte-identical across models and across the clean
        and doctored runs. It tells the model to answer using only the numbered passages,
        to close every sentence with exactly one citation such as [2], and to reply
        'I don't know' when the passages fall short. Decoding is greedy, capped at
        300 new tokens. When any sentence of an answer breaks the one-citation rule
        we drop the whole answer rather than salvage the compliant half, because a
        partly rescued answer reintroduces the claim-to-citation ambiguity the format
        exists to prevent. Models differ sharply in how often they abstain, from 15%
        to 52% of questions; Appendix C takes that apart. The full prompt is in Appendix
        A.\\nReading our numbers. Three statistical choices shape every result, and
        each has a plain reason behind it.\\nWe resample questions, not claims. A
        single question yields up to seven claims that share one context and one generated
        answer, so treating claims as independent would make our intervals look tighter
        than they are. We use a cluster bootstrap instead: draw whole questions with
        replacement 2,000 times, recompute the planted and control conditions on the
        same draw so the pairing survives, and read off the 2.5th and 97.5th percentiles.
        Every 95% confidence interval in this paper is that band, the range of effects
        our data are consistent with.\\nWe compare each agent against its own base.
        Post-rationalization is common in the baseline, so reporting that an agent
        post-rationalizes tells us nothing about RL. The question is whether an agent
        diverges from the model it was trained from. That calls for a difference-in-differences:
        take the plantversus-control difference within a model (Equation 1), then
        difference those differences across models,\\n<!-- formula-not-decoded -->\\nNegative
        says RLVR made citations more faithful, positive says it made them worse,
        and zero says training left this behavior alone. Within each dataset we test
        all three agents against the baseline and correct the three comparisons with
        the Holm method, so that running three tests does not manufacture a significant
        one.\",\"metadata\":{\"ingestion_version\":\"01a0fc55257f7276be70b7b3d1501b36\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6-text-0011\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6\",\"chunk_type\":\"text\",\"section_path\":\"4
        Experimental Setup\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":64,\"page_no\":4,\"filename\":\"2609.23053v1.pdf\"}}}]},\"status\":\"ok\",\"time\":0.000648188}"
