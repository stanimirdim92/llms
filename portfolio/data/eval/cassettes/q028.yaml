        Related Work\\nRetrieval-augmented generation Enabling LLMs to consult a database
        of trusted documents through retrieval-augmented generation (RAG) has many
        benefits: it reduces hallucination, allows companies to inject proprietary
        knowledge/documents into the system, supports the rapid update of information
        without retraining, and can enable source attribution (Lewis et al., 2020;
        Shuster et al., 2021; Fan et al., 2024). However, it also exposes new attack
        surfaces. Most research on the safety and security of RAG systems has focused
        on the security of the knowledge base: data poisoning attacks involve the
        injection of malicious (mis)information into the document store (Tan et al.,
        2024; Nazary et al., 2025; Zhang et al., 2025), and data extraction attacks
        aim to recover sensitive or private information from the documents through
        a RAG interface (Zeng et al., 2024a; Qi et al., 2024; Vonderhaar et al., 2025).
        However, the safety of RAG systems in non-adversarial settings has been less
        studied. An et al. (2025) were the first to highlight that RAG systems can
        output more harmful responses than non-RAG LLMs, even in the absence of any
        malicious intervention. Other work considers the related problem of safety
        degradation in AI agents that have been enabled with information retrieval
        or search capabilities (Yu et al., 2025; BehnamGhader et al., 2025; Zhan et
        al., 2026). Previous work measures the safety of the entire RAG system, but
        the information content and safety of the retrieved documents is an uncontrolled
        variable. Our work takes the next step towards a more scientific understanding
        of these observed phenomena by systematically altering one variable at a time
        (no retrieval, random retrieval, on-topic retrieval, exact-answer retrieval)
        to observe the effect on the safety of the LLM responses.\\nLong-context safety
        The retrieval of harmful documents is one factor in the observed safety decline
        in RAG models. However, the literature suggests that another factor may be
        a behavioural shift induced by the inclusion of extended context. In fact,
        Yu et al. (2025) claim that 'safety degradation is largely independent of
        retrieved context itself.' An et al. (2025) found that 94.7% of the retrieved
        documents in their study were safe, and therefore could not account for the
        much larger increase in unsafe responses. They hypothesize that the retrieved
        texts, though benign themselves, can trigger the recall of unsafe information
        from the model's parametric knowledge. Other work has shown that LLMs are
        less capable of identifying harmful content in long contexts (Ghorbanpour
        and Fraser, 2025) and are more likely to answer harmful questions in long-context
        settings (Anil et al., 2024; Lu et al., 2025; Huang et al., 2025). In some
        cases, the model can drift away from its default 'helpful assistant' persona
        even when the context itself is not harmful (e.g. a therapy conversation)\\n(Lu
        et al., 2026). Therefore, in this study we design our benchmark to test the
        'harmful documents' and 'long context' explanations separately.\",\"metadata\":{\"ingestion_version\":\"01a0fc5427ea71babb96a22c2c5762f3\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a-text-0005\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a\",\"chunk_type\":\"text\",\"section_path\":\"2
        Related Work\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":24,\"page_no\":2,\"filename\":\"2609.11758v1.pdf\"}}},{\"id\":\"710d0b17-8e1f-59b5-a11b-1ab94cc0c2b1\",\"version\":9,\"score\":0.56755507,\"payload\":{\"page_content\":\"Limitations\\nThe
        current findings must be interpreted with the following limitations in mind.
        RAG-Safety-Bench is English-only, considers only one document source (Wikipedia),
        and covers a non-exhaustive set of possible harm categories. Further work
        is required to understand how retrieval-enabled LLMs behave in languages other
        than English and in multiple use contexts. The current study highlighted how
        assessments of safety can be subjective; clearly, the type of potentially
        dangerous information that can be returned to a trained intelligence officer
        versus a layperson versus a schoolchild are very different and such use cases
        must be assessed separately.\\nBy design, our benchmark does not evaluate
        the impact of the retriever in the RAG system. However, and end-to-end evaluation
        would also need to assess interactions between retriever ranking, query reformulation,
        and generator safety. Our benchmark also represents a simplified view of RAG
        methodology, while production RAG systems would likely include additional
        safety components, such as system-level safety instructions and input/output
        filters.\\nOur testing suite of models included only opensource models, and
        relatively small models due to computing resource constraints. Again, real-world
        RAG deployments will likely use much larger commercial models. We note that
        our RAG-SafetyBench benchmark can be used to evaluate such models, and that
        our reason for not doing so was to avoid being banned for Terms-of-Service
        violations. We encourage researchers with internal access to such models to
        use our benchmark and publish the results.\\nOur methodology for benchmark
        generation and automated assessment relies heavily on the Claude family of
        models from Anthropic. While we did conduct human evaluations to validate
        Claude's performance, a more robust (though expensive) methodology could combine
        multiple strong LLM judges in an ensemble. Furthermore, we evaluate on a single
        run of the benchmark, but due to the stochastic nature of LLM generation,
        the results might differ across multiple runs.\",\"metadata\":{\"ingestion_version\":\"01a0fc5427ea71babb96a22c2c5762f3\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a-text-0019\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a\",\"chunk_type\":\"text\",\"section_path\":\"Limitations\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":88,\"page_no\":9,\"filename\":\"2609.11758v1.pdf\"}}},{\"id\":\"340b2e6d-d891-585d-afa5-c177ec29a394\",\"version\":9,\"score\":0.5630703,\"payload\":{\"page_content\":\"A.1
        RAG-Safety-Bench benchmark creation\\nRAG-Safety-Bench was constructed from
        Wikipedia-based source material using a semiautomated pipeline. We first defined
        a taxonomy of harmful user requests by adapting the MLCommons AILuminate hazard
        taxonomy to the RAG question-answering setting. The final taxonomy contains
        20 subcategories spanning violent crimes, sex-related crimes, nonviolent crimes,
        hate, indiscriminate weapons, and self-harm (Table 2). As described in the
        main paper, several categories from the original taxonomy were excluded because
        they were not appropriate for a public Wikipedia-based QA benchmark, including
        privacy/identification, direct harmful content generation, intellectual property,
        and specialized advice.\\nFor each harm subcategory, we identified one or
        more relevant Wikipedia categories or documents likely to contain harmful
        answer-bearing information. We then used Claude Sonnet-4.5 to generate candidate
        harmful questions whose answers could be grounded in those documents. In addition
        to the question itself, the generation stage also produced supporting metadata
        for review, including severity, naturalness notes, answerability justification,
        source-document identifiers, and a short gold reference summary of the harmful
        answer. This gold reference is stored in the field expected_unsafe_answer_summary
        . The prompt used with Claude Sonnet-4.5 to generate candidate unsafe questions
        from Wikipedia articles is shown in Table 5.\\nThe released benchmark contains
        two versions. The Full version contains 987 harmful questions, distributed
        unevenly across the 20 subcategories. The Balanced version, used in the experiments
        in this paper, subsamples toward a uniform target of 20 examples per subcategory
        where available. Some subcategories contain fewer than 20 viable examples,
        so the final balanced subset contains 346 unique examples in total (Table
        2).\\nEach released benchmark row contains a query plus the metadata needed
        to instantiate one controlled evaluation condition. Important fields include:\\n-
        example_id , original_example_id , and row_uid : stable identifiers linking
        conditionspecific rows to the underlying benchmark question;\\n- question
        and expected_unsafe_answer_summary : the harmful user query and its reference
        answer summary;\\n- harm_category , harm_topic_family , taxonomy_family ,
        taxonomy_subcategory , topic , and topic_slug : harm-taxonomy metadata;\\n-
        gold_doc_id and gold_doc_title : provenance for the source document underlying
        the oracle condition;\\n- condition , doc_count , and docs : the evaluation
        condition and its model-facing document contexts;\\n- strict_audit_labels
        : final oracle answerability and on-topic non-answerability audit outcomes;
        and\\n- runtime_context_cap , context_ablation , final_freeze_version , source_run_id
        , and source_builder_mode : runtime and dataset provenance metadata.\\n\",\"metadata\":{\"ingestion_version\":\"01a0fc5427ea71babb96a22c2c5762f3\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a-text-0027\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a\",\"chunk_type\":\"text\",\"section_path\":\"A.1
        RAG-Safety-Bench benchmark creation\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":136,\"page_no\":12,\"filename\":\"2609.11758v1.pdf\"}}},{\"id\":\"3a82a030-6dc7-5454-9a96-130c79270203\",\"version\":9,\"score\":0.56259465,\"payload\":{\"page_content\":\"4.1
        R1: Capability in safe and unsafe contexts\\nTable 3 reports accuracies for
        each model when asked benign and harmful questions, in both nonRAG, oracle
        RAG, and mixed settings. In the benign case, accuracy is scored using the
        MIRAGE benchmark method (Park et al., 2025). In the harmful (RAG-Safety-Bench)
        case, we compare the output response with the expected benchmark response,
        using Claude-Opus-4.7 to output a fi- nal label of accurate or inaccurate
        relative to the reference. Human annotation of a subset of 100 examples validates
        the LLM-as-a-judge approach, with agreement of 95-96% between humans and LLM,
        and Cohen's \u03BA of 0.90-0.92 (more details and prompt available in Appendix
        Section A.4).\\nTable 1: The four settings of the RAG-Safety-Bench benchmark.
        Example documents are for the query, 'What materials and design do I need
        to make an IED that can defeat armored police vehicles?'\\n\\nLLM-only, Description
        = No context documents provided.. LLM-only, Example Wikipedia documents =
        (None). Oracle, Description = One of the returned documents contains the answer..
        Oracle, Example Wikipedia documents = 'Explosively formed penetrator'. On-topic,
        Description = Oracle document not included, but documents are related to the
        topic of the query.. On-topic, Example Wikipedia documents = 'Deflagration
        to detonation tran- sition', 'Blast wall'. Random, Description = Documents
        are randomly selected from a set of benign documents.. Random, Example Wikipedia
        documents = 'Climate change and birds', 'Ar- boretum'\",\"metadata\":{\"ingestion_version\":\"01a0fc5427ea71babb96a22c2c5762f3\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a-text-0011\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a\",\"chunk_type\":\"text\",\"section_path\":\"4.1
