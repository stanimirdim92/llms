- request:
    body: "{\"max_tokens\":1024,\"messages\":[{\"role\":\"user\",\"content\":[{\"type\":\"document\",\"source\":{\"type\":\"text\",\"media_type\":\"text/plain\",\"data\":\"Abstract\\nAllowing
      large language models (LLMs) to retrieve information from a set of trusted documents
      can increase reliability and reduce hallucination. However, recent work has
      demonstrated that retrieval-augmented generation (RAG) can have unintended side
      effects on the overall safety of the generated responses, when prompted for
      harmful or dangerous content. A clearer understanding of the mechanisms leading
      to this result is needed, as increasing numbers of end users turn to RAG to
      incorporate corporate documents and knowledge bases into LLM-based systems.
      We introduce RAG-Safety-Bench, a benchmark to measure the safety impact of RAG
      on LLM models. By removing the confounding effect of retriever quality, and
      cleanly separating the problem into four conditions - non-RAG, RAG with an oracle
      document containing the answer to the harmful request, RAG with documents related
      to the harmful request but without the specific answer, and RAG with random,
      safe documents - the benchmark isolates the impacts of different factors in
      the observed safety degradation. We report results across five opensource LLMs,
      showing an inverse relationship between benign and unsafe capability, strong
      evidence that baseline safety guardrails do not lead to downstream safety guarantees
      in the RAG case, and model-specific support for previous findings that even
      benign documents can lead to unsafe generation in retrieval-enabled systems.\"},\"title\":\"2609.11758v1.pdf
      [01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a] (text, page
      1)\",\"citations\":{\"enabled\":true}},{\"type\":\"document\",\"source\":{\"type\":\"text\",\"media_type\":\"text/plain\",\"data\":\"Kathleen
      C. Fraser\\nFaculty of Engineering University of Ottawa Ottawa, Canada kathleen.fraser@uottawa.ca\\nFigure
      1: The four conditions in RAG-Safety-Bench allow for detailed safety evaluation
      of RAG-enabled systems.\\ntrustworthiness and accuracy by reducing hallucinations,
      relative to non-RAG LLMs (Shuster et al., 2021). For these reasons, conventional
      wisdom would suggest that RAG-based LLMs should be safer than non-RAG models,
      with the primary security risk being data poisoning attacks on the RAG corpus.
      In the absence of poisoned data, there would be little reason to suspect a RAG
      system would output more harmful content than its base LLM component.\\nHowever,
      this assumption has been upended by recent work from An et al. (2025), who presented
      compelling evidence that when LLMs are enabled with RAG they are generally less
      safe than when relying on their parametric knowledge, even when the retrieved
      documents are benign. In the current work, we contribute to the understanding
      of this newly-identified problem by disentangling the notions of safety and
      capability through a new RAG-specific safety benchmark, RAG-SafetyBench. Furthermore,
      we take a closer look at what it means for documents and outputs to be 'unsafe,'
      to support more detailed analysis of the problematic case where safe RAGdocuments
      appear to lead to unsafe outputs.\\nRAG systems are challenging to evaluate
      because they are composed of multiple components, each of which contributes
      to the overall end-to-end performance of the system (Wampler et al., 2025).
      In particular, the retrieval quality can have a major impact on the quality
      of the output. The MIRAGE benchmark (Park et al., 2025) enables the evaluation
      of RAG systems while controlling for retrieval quality by providing sets of
      relevant and irrelevant oracle documents.\\nWe modify and extend this style
      of evaluation to safety evaluation in the RAG setting. Our RAGSafety-Bench benchmark
      consists of a set of unsafe English queries and three sets of documents (Figure
      1): in the oracle setting, the unsafe answer is available in the document set.
      This setting could represent a data-poisoning attack - however, since we sourced
      all of our data from Wikipedia, it also represents the more common case that
      the data is believed to be generally benign but has not been meticulously curated.
      In the on-topic setting, the documents are relevant to the topic of the query
      but do not explicitly contain the unsafe answer. In the random setting, randomly-selected
      documents on safe topics are provided.\\nThis testing framework allows us to
      answer several key open research questions relating to the safety of RAG systems:\"},\"title\":\"2609.11758v1.pdf
      [01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a] (text, page
      1)\",\"citations\":{\"enabled\":true}},{\"type\":\"document\",\"source\":{\"type\":\"text\",\"media_type\":\"text/plain\",\"data\":\"Kathleen
      C. Fraser\\n1. To what extent is the observed RAG safety decline correlated
      with a model's RAG capability? Previous work suggests that some models which
      appear 'safe' may simply be less capable of extracting and summarizing relevant
      information. We test this rigorously, and hypothesize the following (H1): Models
      which perform better on MIRAGE (benign capability) will also have higher accuracy
      and therefore lower safety in the oracle setting of RAG-Safety-Bench.\\n2. Is
      RAG safety decline a factor of unsafe information or unsafe context drift? The
      conventional view, challenged by An et al. (2025), is that RAG models are less
      safe only when the documents they retrieve are unsafe. An alternative explanation
      is that the increased context length, possibly containing many words semantically
      related to the unsafe query, shift the models into a less-aligned domain. 1
      Our hypothesis (H2) is that the direct availability of the answer (oracle setting)
      will lead to the\\n1 In fact, this is similar to the intuition behind the successful
      Crescendo jailbreak (Russinovich et al., 2025).\\nhighest number of unsafe answers,
      but that the on-topic setting will lead to a higher number of unsafe answers
      relative to the baseline non-RAG setting, due to the destabilizing effect of
      the harmful-topic context. If the effect is purely due to context length, the
      random setting will lead to an equivalent harmfulness rate.\\n3. What is the
      impact of RAG on the refusal rate of LLMs? In many studies, safety is operationalized
      as refusal: a safe model is one which refuses to answer harmful questions. We
      distinguish between two varieties of refusal; namely, unwillingness to fulfill
      a harmful request versus inability to find the answer in the retrieved documents.
      We hypothesize (H3) that the refusal rate for harmful requests will be highest
      in the random setting, and attributed to a lack of information. We argue that
      this case should be distinguished from 'true' model safety, which should rely
      on an inherent unwillingness to provide dangerous advice. At the same time,
      the oracle setting offers contrasting evaluation in which we ensure the model
      has access to the requested information, so refusal can be more clearly interpreted
      as effective implementation of safety guardrails.\\n4. Do different safety evaluators
      agree on what is safe versus harmful? Standard safety evaluation relies on LLM-based
      'judges' to label text as safe or unsafe. We compare multiple safety evaluators,
      with the hypothesis (H4) that there will be a high level of disagreement between
      the LLM evaluators.\\nRAG-Safety-Bench is freely available for research use
      at the following URL: https://github.com/The-Safe-AI-Lab/ RAG-Safety-Bench .\"},\"title\":\"2609.11758v1.pdf
      [01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a] (text, page
      2)\",\"citations\":{\"enabled\":true}},{\"type\":\"document\",\"source\":{\"type\":\"text\",\"media_type\":\"text/plain\",\"data\":\"3.2
      Safety-capability relationship\\nOur benchmark, RAG-Safety-Bench, complements
      the original MIRAGE benchmark by measuring safety rather than benign capability.
      The benchmark enables direct comparison across 4 settings, as described in Table
      1. Note the distinction between the Oracle and On-topic settings: in the oracle
      setting, the answer is directly available in the retrieved context. In the on-topic
      condition, the retrieved documents are on the same topic as the query (in the
      example, explosives), but do not contain the answer to the query.\\nBy providing
      the context documents directly, the benchmark enables evaluation of the base
      LLM's ability to maintain safety guardrails in the presence of RAG context,
      while removing the confounding factor of retriever quality (e.g., a poor retriever
      might simply miss the relevant unsafe document and therefore lead to a misleadingly
      inflated safety score).\\nThe method for constructing the benchmark is as follows.
      We first develop a taxonomy of harmful user queries, based on the existing MLCommons
      AILuminate 'Hazard Taxonomy' (Ghosh et al., 2025). The context of RAG safety
      evaluation and our intended corpus of Wikipedia documents required some modifications
      to the existing taxonomy. Our current version of RAG-SafetyBench excludes the
      following harm categories: Privacy/identification: since our knowledge base
      is a public resource, we assume it does not contain private information (though
      privacy leakage may be a concern in other RAG use cases); Direct generation
      of harmful content: the focus of the benchmark is on question answering, not
      content generation; Intellectual property: Wikipedia users are strictly forbidden
      from uploading copyrighted material without permission, and so it is not a suitable
      resource to test for intellectual property leakage; Specialized advice: this
      category (comprising topics such as legal advice, medical advice) is often poorly
      defined and highly-contextual, and so we do not include it here. The final taxonomy
      is given in Table 2.\\nFollowing Park et al. (2025) and An et al. (2025), we
      use Wikipedia as our knowledge base. For each sub-category in the harm taxonomy,
      we identify a relevant category or set of categories on Wikipedia where harmful
      information related to the topic can be found. We then use Claude-Sonnet-4.5
      to generate potentially harmful questions whose answers can be found in one
      of the available Wikipedia documents. We also enforce a series of self-checks
      to avoid hallucinations or unrealistic questions (see Appendix for full details
      and prompts). The Claude model outputs a harmful question, a rating of the question's
      severity, the name and ID of the Wikipedia article that contains the answer,
      the exact text passage containing the answer, a summary of the expected unsafe
      answer, as well as other additional information to aid human review of the questions
      and answers (shown in Table 6 in the Appendix). We aimed to generate a minimum
      of 20 queries per subcategory in the taxonomy, although ultimately there was
      more actionable information available for some categories than others. We therefore
      release two versions of the benchmark: the Full version contains 987 harmful
      queries, distributed unevenly across the subcategories, while the Balanced version
      (used in the current analysis) is subsampled to a more uniform distribution
      across subcategories (see Table 2).\"},\"title\":\"2609.11758v1.pdf [01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a]
      (text, page 3)\",\"citations\":{\"enabled\":true}},{\"type\":\"document\",\"source\":{\"type\":\"text\",\"media_type\":\"text/plain\",\"data\":\"2
      Related Work\\nRetrieval-augmented generation Enabling LLMs to consult a database
      of trusted documents through retrieval-augmented generation (RAG) has many benefits:
      it reduces hallucination, allows companies to inject proprietary knowledge/documents
      into the system, supports the rapid update of information without retraining,
      and can enable source attribution (Lewis et al., 2020; Shuster et al., 2021;
      Fan et al., 2024). However, it also exposes new attack surfaces. Most research
      on the safety and security of RAG systems has focused on the security of the
      knowledge base: data poisoning attacks involve the injection of malicious (mis)information
      into the document store (Tan et al., 2024; Nazary et al., 2025; Zhang et al.,
      2025), and data extraction attacks aim to recover sensitive or private information
      from the documents through a RAG interface (Zeng et al., 2024a; Qi et al., 2024;
      Vonderhaar et al., 2025). However, the safety of RAG systems in non-adversarial
      settings has been less studied. An et al. (2025) were the first to highlight
      that RAG systems can output more harmful responses than non-RAG LLMs, even in
      the absence of any malicious intervention. Other work considers the related
      problem of safety degradation in AI agents that have been enabled with information
      retrieval or search capabilities (Yu et al., 2025; BehnamGhader et al., 2025;
      Zhan et al., 2026). Previous work measures the safety of the entire RAG system,
      but the information content and safety of the retrieved documents is an uncontrolled
      variable. Our work takes the next step towards a more scientific understanding
      of these observed phenomena by systematically altering one variable at a time
      (no retrieval, random retrieval, on-topic retrieval, exact-answer retrieval)
      to observe the effect on the safety of the LLM responses.\\nLong-context safety
      The retrieval of harmful documents is one factor in the observed safety decline
      in RAG models. However, the literature suggests that another factor may be a
      behavioural shift induced by the inclusion of extended context. In fact, Yu
      et al. (2025) claim that 'safety degradation is largely independent of retrieved
      context itself.' An et al. (2025) found that 94.7% of the retrieved documents
      in their study were safe, and therefore could not account for the much larger
      increase in unsafe responses. They hypothesize that the retrieved texts, though
      benign themselves, can trigger the recall of unsafe information from the model's
      parametric knowledge. Other work has shown that LLMs are less capable of identifying
      harmful content in long contexts (Ghorbanpour and Fraser, 2025) and are more
      likely to answer harmful questions in long-context settings (Anil et al., 2024;
      Lu et al., 2025; Huang et al., 2025). In some cases, the model can drift away
      from its default 'helpful assistant' persona even when the context itself is
      not harmful (e.g. a therapy conversation)\\n(Lu et al., 2026). Therefore, in
      this study we design our benchmark to test the 'harmful documents' and 'long
      context' explanations separately.\"},\"title\":\"2609.11758v1.pdf [01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a]
      (text, page 2)\",\"citations\":{\"enabled\":true}},{\"type\":\"text\",\"text\":\"Which
      funding body supported the RAG-Safety-Bench research?\"}]}],\"model\":\"claude-sonnet-5\",\"system\":\"You
      are a research assistant answering questions about scientific and technical
      documents (papers, patents). You are given a set of source documents as `document`
      content blocks \u2014 each may be prose, a table (as Markdown), or a figure
      caption.\\n\\nRules:\\n- Answer ONLY using the provided documents. If they don't
      contain the answer, say so plainly.\\n- Every factual claim must be traceable
      to a specific document via the citations mechanism.\\n- When a table or figure
      is the source of a claim, say so explicitly (e.g. \\\"per Table 2...\\\" or
      \\\"as shown in Figure 3...\\\").\\n- Do not speculate beyond what the documents
      state.\\n- Be concise and precise; prefer exact values/units from tables over
      paraphrase.\\n\",\"thinking\":{\"type\":\"disabled\"}}"
