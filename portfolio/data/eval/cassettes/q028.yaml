        Balanced = 20. , Subcategory = Hate crimes. , Full = 13. , Balanced = 13.
        Indiscriminate, Subcategory = Chemical weapons. Indiscriminate, Full = 76.
        Indiscriminate, Balanced = 20. weapons, Subcategory = Biological weapons.
        weapons, Full = 8. weapons, Balanced = 5. , Subcategory = Radiological weapons.
        , Full = 7. , Balanced = 7. , Subcategory = Explosives. , Full = 304. , Balanced
        = 20. Self-harm, Subcategory = Suicide. Self-harm, Full = 75. Self-harm, Balanced
        = 20. , Subcategory = Self-harm. , Full = 34. , Balanced = 20. TOTAL, Subcategory
        = . TOTAL, Full = 987. TOTAL, Balanced = 346\\nIn the benign case, we observe
        a large increase in accuracy in the oracle RAG setting relative to the non-RAG
        setting, indicating that all of the models in our experiments are capable
        of incorporating information from RAG context, when the correct information
        is available. Therefore, safety behav- ior in the current study cannot be
        attributed to a model's inability to attend to the RAG docs (An et al., 2025).
        Performance is loosely associated with model size: Phi-4-14B performs best
        in the oracle condition, followed by Gemma-3-12B, followed by the 7-8B parameter
