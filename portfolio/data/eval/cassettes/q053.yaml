      (text, page 2)\",\"citations\":{\"enabled\":true}},{\"type\":\"document\",\"source\":{\"type\":\"text\",\"media_type\":\"text/plain\",\"data\":\"6
      Discussion\\nWhat a citation is worth to a reader. Our results say that in this
