      0.8 | 0.08     | 0 . 31 n =929 | 0.04          | 0.20          |", "Answer (after
      planting):\n- A no-planting control as an improvement to the existing methodology
      , to get a more accurate idea about post-rationalization.\n- The first controlled
      measurement of postrationalization in RLVR search agents , holding the base
      model, retrieval corpus, prompt, and scorer fixed across four datasets.\n- Evidence
      that answer-only rewards leave citation faithfulness exactly where they found
      it , with a stated detection bound, plus a concrete proposal for folding attribution
      into the reward.\n- A full reproduction on free-tier hardware , replacing the
      104B Command R+ model of the original study with an open 7B model on two T4s.",
      "7 Conclusion\nWe asked whether training RAG search agents for correct answers
      also teaches them to cite honestly under fixed-context inference. We find no
      detectable improvement. Getting to that answer meant repairing the measurement
      first: we reproduced the planting probe of Wallat et al. (2025) on an open 7B
      model, added the no-planting control it lacked, and showed that the control
      is 0 by construction for the main variant, 100% for another, and a small measured
      quantity for the third. With that in hand, post-rationalization turns out to
      be common in an instruction-tuned model, roughly one cited sentence in seven
      on Wikipedia-based questions, and three RLVR agents trained from that model
      reproduce its rate, with one landing slightly worse. Faithful citation is not
      a side effect of answer accuracy. It has to be rewarded, measured, and reported
      on its own, and the probe we describe here is cheap enough to do all three inside
      an existing training loop.", "5.1 What the control changes\nTable 3: What the
      no-planting control changes, for the baseline model. Planted and Control are
      cited records over all records ( k/n ); Attr. is the attributable rate in pp
      (Eq. 1). For CITED-OTHER the control is 100%, and the attributable rate is negative
