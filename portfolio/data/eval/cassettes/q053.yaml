      (text, page 5)\",\"citations\":{\"enabled\":true}},{\"type\":\"document\",\"source\":{\"type\":\"text\",\"media_type\":\"text/plain\",\"data\":\"5.1
      What the control changes\\nREL-UNCITED: the raw rate survives untouched. Read
