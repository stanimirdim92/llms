- request:
    body: '{"query": "What size of effect could the citation-faithfulness study have
      detected, and with what power?", "documents": ["4 Experimental Setup\nWe know
      what size of effect we could have caught. Our sample sizes give 80% power to
      detect a difference of roughly 7 percentage points (pp). Plainly: had RLVR moved
      post-rationalization by 7pp or more in either direction, this design would almost
      certainly have caught it. Shifts of a couple of points stay inside our blind
      spot, which is why we report a bounded null rather than a flat absence of effect.
      We fixed the primary outcome and the family of corrected comparisons in writing
      before the scorer ran.\nCompute. Everything ran on Kaggle''s free tier, two
      T4s or a single P100 per session: 48 GPU jobs yielding 36,690 scored records
      across four models, four datasets, three variants, and both conditions. The
      original study used a 104B model; the controlled version of the same measurement
      fits on hardware anyone can get for free, and that is the part we would most
      like other groups to borrow.", "5.3 RLVR does not make citations more faithful\nIt
      does not. Search-R1 moves by -1.2, +4.3, -0.9, and +1.3pp across the four datasets;
      ReSearch by +0.1, -1.6, -1.2, and +0.8pp. Both wander around zero with no pattern,
      every interval covers zero, and the smallest Holm-adjusted p -value in either
      row is 0.267, nowhere near signif- icance. Set that against our detection bound:
      with 80% power at about 7pp, an improvement of that size would have been hard
      to miss, and nothing close to it appears. Training these agents to produce verifiably
      correct answers moved their citation faithfulness by an amount we cannot distinguish
      from nothing.\nThat result is less surprising once you look at what the reward
      measures. RLVR compares the final answer with a reference and pays out accordingly;
      R-Search also rewards steps along its search trajectory. No term anywhere in
      these objectives asks whether the citation attached to a sentence is the passage
      that produced it. Citing the wrong passage is free, so the behavior the agents
      inherit from Qwen2.5-7B-Instruct rides through training untouched.", "5.1 What
      the control changes\nREL-UNCITED: the raw rate survives untouched. Read the
      top block: 52 of 371 NQ claims follow the plant, and 0 of those same 371 records
      cite the doctored passage when we take the span away. The control column is
      0/ n on all four datasets, which is what Section 3.3 predicted, because removing
      four appended words restores the clean context exactly and the clean answer
      never cited that passage for that claim. Prediction and measurement agree, so
      +14.0pp on NQ is not a raw rate that needs an asterisk; it is the attributable
      effect.\nRANDOM: the control is real but tiny. Swapping in a passage from an
      unrelated question does occasionally earn a citation on its own, as the 4/433
      on HAGRID and 1/864 on RAGTruth show, but the effect is small: 0.2% pooled across
      the 7,625 control records, with 7 of 16 model-dataset cells at exactly zero
      and the rest between 0.1% and 0.9% (Appendix D). Between 83% and 100% of each
      raw rate survives as attributable, 97% on average. The confound we built this
      control to catch turned out to be genuine and negligible, which is worth knowing
      precisely because we could not have assumed it.\nCITED-OTHER: the raw rate lies,
      and the control catches it. The bottom block is the reason we care about all
      this. Planted rates run from 78.9% to 89.6%, many times the REL-UNCITED rates,
      and any paper could report them as evidence of rampant post-rationalization.
      The control column explains them away: 69/69, 123/123, 61/61, 623/623. Every
      single control record cites the doctored passage, because this variant selects
      a passage the clean answer already cited elsewhere. Subtract, and the attributable
      effect is negative on all four datasets, from -10.4pp to -21.1pp, with intervals
      that exclude zero. A raw rate of 79-90% here measures our sampling rule and
      nothing else. Under the stricter claim-aligned outcome the same records do show
      genuine post-rationalization, +10.6 to +19.7pp (Appendix D), though only RAGTruth
      has enough questions to pin it down.\nThe moral generalizes past this probe:
      whenever a measurement edits an input and counts how often the output changes,
      report the unedited baseline, and demonstrate rather than assume that it is
      zero.", "4.2 Statistical Analysis and Metric Audit\nCommon cohorts and estimands.
      Primary summaries and comparisons use the intersection of successful question
      IDs across identity and all twenty compressed settings. Each question has equal
      weight in citation precision, citation recall, answer quality, and evidence
      F1; claims and citations are not pooled across questions. Undefined evidence
      or recovery metrics remain undefined rather than becoming zeros. Verification-rate
      means exclude answers with zero claims; paired verification comparisons exclude
      a question if ei- ther member has zero claims. The analysis artifacts report
      those exclusions and retain full-cohort descriptive means separately.\nInference.
      We use pointwise 95% percentile bootstrap intervals for each paired mean difference
      (Dror et al., 2018), resampling 944 questions on ASQA and 271 papers on QASPER
      with replacement. All retained questions from a sampled QASPER paper travel
      together, and each replicate divides its total difference by the number of sampled
      questions, preserving the questionweighted estimand. Every QASPER contrast retains
      all 271 papers after metric-specific exclusions. Two-sided randomization tests
      swap paired labels within questions on ASQA and jointly within papers on QASPER.
      These tests assume label exchangeability within a resampling unit under the
      null. Both procedures use 10,000 replicates and seed 13, with independent random-number
      streams for bootstrap sampling and randomization. Monte Carlo p -values use
      ( b + 1) / (10 , 000 + 1) , where b counts randomizations at least as extreme
      as the observed absolute difference. The initial plan specified 134 core contrasts
      and 10 recoverythreshold contrasts before inspecting the revised inferential
      results. After that analysis and a cachecoverage audit, we added four recovered-source
      versus summary-verification contrasts at nominal 0.25 for RECOMP and LLMLingua-2
      on both datasets. The extension plan was recorded before running these four
      tests, and Holm adjustment was recomputed over all 148 raw p -values. We denote
      Holm-adjusted values by p H . All reported adjusted values use this expanded
      family; original effects, intervals, and raw p -values are unchanged. This is
      a post hoc camera-ready analysis, not a preregistration. Intervals are pointwise,
      not simultaneous; statistical-support statements use p H < 0 . 05 . Failure
      to reject a difference does not establish equivalence or preservation. All inference
      is conditional on the fixed generator outputs, recovery procedure, and evaluator.\nPrecision-code
      audit. The manuscript''s precision definition requires the concatenated cited
      evidence to entail a claim before any individual citation receives credit. A
      code audit found that the previous implementation could credit an individually
      supporting citation even when joint entailment failed. A saved ASQA answer reproduced
      this discrepancy, and a regression test now checks the required gate through
      the evaluation pipeline.\n", "5.3 RLVR does not make citations more faithful\nTable
      5: Each agent''s attributable rate on REL-UNCITED minus the baseline''s (DiD,
      pp), with a 95% bootstrap CI and a Holm-adjusted p -value within each dataset.
      Negative would mean the agent post-rationalizes less than its base. Bold marks
      the only comparison with p < 0 . 05 .\n\nSearch-R1 vs., DiD = baseline. Search-R1
      vs., 95% CI = . Search-R1 vs., Holm p = . NQ, DiD = - 1.2. NQ, 95% CI = [ -
      6.9, 4.2]. NQ, Holm p = 1.000. QAMPARI, DiD = +4.3. QAMPARI, 95% CI = [ - 0.5,
      9.7]. QAMPARI, Holm p = 0.267. HAGRID, DiD = - 0.9. HAGRID, 95% CI = [ - 4.9,
      3.2]. HAGRID, Holm p = 1.000. RAGTruth, DiD = +1.3. RAGTruth, 95% CI = [ - 0.5,
      3.0]. RAGTruth, Holm p = 0.334. ReSearch vs., DiD = baseline. ReSearch vs.,
      95% CI = . ReSearch vs., Holm p = . NQ, DiD = +0.1. NQ, 95% CI = [ - 3.9, 4.2].
      NQ, Holm p = 1.000. QAMPARI, DiD = - 1.6. QAMPARI, 95% CI = [ - 5.1, 2.3]. QAMPARI,
      Holm p = 0.415. HAGRID, DiD = - 1.2. HAGRID, 95% CI = [ - 4.9, 2.5]. HAGRID,
      Holm p = 1.000. RAGTruth, DiD = +0.8. RAGTruth, 95% CI = [ - 0.7, 2.2]. RAGTruth,
      Holm p = 0.334. R-Search vs., DiD = baseline. R-Search vs., 95% CI = . R-Search
      vs., Holm p = . NQ, DiD = +0.7. NQ, 95% CI = [ - 4.6, 5.0]. NQ, Holm p = 1.000.
      QAMPARI, DiD = +3.1. QAMPARI, 95% CI = [ - 1.4, 7.3]. QAMPARI, Holm p = 0.324.
      HAGRID, DiD = +3.8. HAGRID, 95% CI = [ - 0.3, 8.0]. HAGRID, Holm p = 0.234.
      RAGTruth, DiD = +3.0. RAGTruth, 95% CI = [1.2, 4.8]. RAGTruth, Holm p = 0.002",
      "5.4 One agent drifts the wrong way\nR-Search is the exception, and it leans
      worse rather than better. Its DiD is positive on all four datasets (+0.7, +3.1,
      +3.8, +3.0pp) and significant on RAGTruth, our largest cell, at +3.0pp with
      a 95% CI of [1.2, 4.8] and a Holm-adjusted p of 0.002. That was the pre-registered
      condition for claiming a model-specific effect, and it is met.\nWe report it
      with the caveats it deserves. On the RANDOM variant R-Search is again higher
      on three of four datasets but significant on none, the closest p being 0.063.
      Under the looser cited-anywhere outcome it dips slightly below the baseline
      on NQ ( -0.5pp) and reaches significance nowhere (Appendix D). The direction
      is consistent; the evidence for its size is not. What we can say is that no
      agent improved, and the one that moved measurably moved the wrong way.", "Table
      3: What the no-planting control changes, for the baseline model. Planted and
      Control are cited records over all records ( k/n ); Attr. is the attributable
      rate in pp (Eq. 1). For CITED-OTHER the control is 100%, and the attributable
      rate is negative (all 95% CIs exclude 0).\n\n| Dataset                      |
      Planted                      | Control                      | Attr.                        |\n|------------------------------|------------------------------|------------------------------|------------------------------|\n|
      REL-UNCITED (claim-aligned)  | REL-UNCITED (claim-aligned)  | REL-UNCITED (claim-aligned)  |
      REL-UNCITED (claim-aligned)  |\n| NQ                           | 52/371                       |
      0/371                        | +14.0                        |\n| QAMPARI                      |
      29/319                       | 0/319                        | +9.1                         |\n|
