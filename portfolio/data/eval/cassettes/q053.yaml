      no declared source evidence reaches the span verifier, so claims fail without
      an entailment judgment. These values do not establish that all claims lack recoverable
      source support. Recovered-source verification now supplies a direct claim-level
      comparison: for RECOMP, unsupported rates are 0.88 on ASQA and 0.95 on QASPER.
      Their paired differences from summary checking are 0.712 (CI [0.683, 0.739])
      and 0.450 [0.417, 0.483], both p H = 0 . 0148 . LLMLingua-2''s recovered-source
      rates are 0.90 and 0.91, with differences 0.394 [0.362, 0.426] and 0.253 [0.225,
      0.282] (both p H = 0 . 0148 ). These gaps persist when recovery is attempted,
      but remain conditional on the bounded search and shared NLI evaluator. For provenance-declaring
      methods, displayed rate differences are below 0.01 in magnitude; no mode comparison
      survives Holm correction, which does not establish equivalence.", "| Dataset   |
      Planted   | Control   |   Attr. | 95% CI       |\n|-----------|-----------|-----------|---------|--------------|\n|
      NQ        | 9/69      | 0/69      |   +13.0 | [5.5, 22.5]  |\n| QAMPARI   |
      16/123    | 0/123     |   +13.0 | [7.3, 19.7]  |\n| HAGRID    | 12/61     |
      0/61      |   +19.7 | [10.8, 31.3] |\n| RAGTruth  | 67/623    | 1/623     |   +10.6
      | [7.9, 13.5]  |", "Limitations\nEvaluation format differs from training. The
      RLVR agents were trained to search, read, and answer across multiple turns in
      their own tagged format, whereas our evaluation supplies five fixed passages
      and requests a single citation-bearing response. This was necessary for the
      controlled attribution comparison, but it may affect how the agents behave:
      for example, an agent that would normally issue another query may instead abstain.
      The large differences in abstention and format compliance are consistent with
      this possibility, although our data cannot establish the mechanism. An interactive
      evaluation would be needed to determine whether the attribution effect differs
      in the agents'' native search setting.\nWe cannot isolate RL itself. Each agent
      differs from the baseline in three ways at once: it was fine-tuned at all, fine-tuned
      on retrieval data, and fine-tuned with reinforcement learning. Without an arm
      fine-tuned on the same data without RL, our comparison is associational. This
      is the single most valuable addition a follow-up could make.\nSearch-R1 saw
      NQ in training. It was trained on NQ''s training split and we evaluate it on
      KILTNQ. QAMPARI, HAGRID, and RAGTruth are clean for all three agents, and R-Search''s
      pattern is in fact strongest away from NQ, but we have not quantified the overlap.\nThe
      span always lands at the end of the passage. Any positional bias in how models
      pick citations is therefore mixed in with the effect of the plant. Randomizing
      the injection point is the obvious next experiment.\nCITED-OTHER is underpowered
      outside RAGTruth. NQ, QAMPARI, and HAGRID yield only 13-43 question clusters
      for this variant, too few for intervals we would defend. RAGTruth alone is large
      enough.\nWhat a flag means. Our scorer is deterministic string matching, so
      each flag is exactly reproducible: the model cited the doctored passage for
      the aligned claim. Reading that as postrationalization is an interpretation
      we inherit from Wallat et al. (2025), and a competing reading exists. After
      planting, the claim''s words genuinely sit in the doctored passage, so citing
      it could be scored as obedience to ''answer from the passages'' rather than
      as unfaithfulness. Hand-checking a sample of flagged cases would settle how
      often each reading applies, and we have not done it.\nScope. Three RLVR agents
      from one line of work, one base model, English only, one prompt, one decoding
      setting. Citation behavior may well shift with the prompt, so our numbers describe
      this setup until someone varies it.", "5.3 RLVR does not make citations more
      faithful\nRaw rates alone cannot answer the RL question, since a model could
      post-rationalize heavily and still be no worse than the model it came from.
      Table 5 therefore reports the difference-indifferences: each agent''s attributable
      rate minus its base model''s, on the same dataset. If RLVR taught these agents
      anything about grounding, this column would run negative.", "4 Experimental
      Setup\nLeakage drove the dataset choice. NQ is where the original probe ran,
      so we keep it for comparability, but Search-R1 trained on NQ''s training split
      and we say so plainly. QAMPARI, HAGRID, and RAGTruth were not used to train
      any of the three agents, so on those datasets no gap can be waved away as familiarity
      with the data. They also sidestep a retrieval quirk in NQ: for 186 of 499 NQquestions
      (37.3%), all five passages come from one document, which leaves the model almost
      no choice about what to cite. The other three datasets have no such questions.\nPrompt
      and generation. One prompt does all the work, byte-identical across models and
      across the clean and doctored runs. It tells the model to answer using only
      the numbered passages, to close every sentence with exactly one citation such
      as [2], and to reply ''I don''t know'' when the passages fall short. Decoding
      is greedy, capped at 300 new tokens. When any sentence of an answer breaks the
      one-citation rule we drop the whole answer rather than salvage the compliant
      half, because a partly rescued answer reintroduces the claim-to-citation ambiguity
      the format exists to prevent. Models differ sharply in how often they abstain,
      from 15% to 52% of questions; Appendix C takes that apart. The full prompt is
      in Appendix A.\nReading our numbers. Three statistical choices shape every result,
      and each has a plain reason behind it.\nWe resample questions, not claims. A
      single question yields up to seven claims that share one context and one generated
      answer, so treating claims as independent would make our intervals look tighter
      than they are. We use a cluster bootstrap instead: draw whole questions with
      replacement 2,000 times, recompute the planted and control conditions on the
      same draw so the pairing survives, and read off the 2.5th and 97.5th percentiles.
      Every 95% confidence interval in this paper is that band, the range of effects
      our data are consistent with.\nWe compare each agent against its own base. Post-rationalization
      is common in the baseline, so reporting that an agent post-rationalizes tells
      us nothing about RL. The question is whether an agent diverges from the model
      it was trained from. That calls for a difference-in-differences: take the plantversus-control
      difference within a model (Equation 1), then difference those differences across
      models,\n<!-- formula-not-decoded -->\nNegative says RLVR made citations more
      faithful, positive says it made them worse, and zero says training left this
      behavior alone. Within each dataset we test all three agents against the baseline
      and correct the three comparisons with the Holm method, so that running three
      tests does not manufacture a significant one.", "3.2 Emitted vs. Grounded Citations\nWescore
      every run under two views. We write precision as P and recall as R , with subscripts
      e for emitted and g for grounded. Emitted scores citations against the unit
      texts the generator actually saw; it measures consistency with the compressed
      context, and is what one implicitly measures when compressed units are treated
      as citable documents. Grounded fi rst resolves each citation to retrieved source
      spans and scores against those. Units with declared provenance resolve to their
      declared sids. Units without declared provenance pass through our re-attributability
      protocol: rank source snippets by lexical similarity to the unit, run NLI on
      the top 10 candidates, and keep those judged to individually entail the unit
      at \u03c4 . A citation with no recovered span receives no precision credit and
      cannot support recall under this protocol. The reattribution rate is the fraction
      of units without declared provenance with at least one recovered span, averaged
      across examples.\nEvaluator dependence. The same NLI model filters recovered
      spans and scores citation support, creating a circularity risk: selection and
      evaluation errors can be correlated. Lexical retrieval can miss paraphrases,
      and the single-snippet test can reject units supported only by combined evidence.
      Thus failed recovery does not establish that support is absent from the source,
      and the direction of overall scoring bias is unknown. Appendix C reports a second-evaluator
      sensitivity check; human calibration remains absent.\nThe emitted -grounded
      gap is an operational diagnostic of attribution laundering : claims receive
      credit against compressed text that is not supported through the source mappings
      accepted by our protocol. It does not by itself distinguish missing evidence
      from recovery or NLI errors.\nNominal vs. achieved compression. Budgets are
      nominal fractions { 0 . 5 , 0 . 25 , 0 . 1 , 0 . 05 } of each example''s retrieved
      context, enforced in generator-tokenizer tokens. Extractive families track their
      budgets closely, but abstractive compressors emit what their decoder emits:
      RECOMP realizes achieved ratios of 0 . 05 -0 . 08 on ASQA and \u2248 0 . 015
      on QASPER across all four nominal budgets-distinct nominal operating points
      collapse together. All curves therefore use the achieved ratio on the compression
