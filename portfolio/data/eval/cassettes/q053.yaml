      Control = 623/623. RAGTruth, Attr. = - 10.4", "5 Results\n0.42 across achieved
      ratios 0.51, 0.26, 0.11, and 0.06. Relative to identity, precision is lower
      at nominal 0.50 and 0.05 ( p H = 0 . 0148 ); the intermediate differences are
