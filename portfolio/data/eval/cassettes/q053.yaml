      supported ( p H = 0 . 0148 ). ASQA reranking at nominal 0.25 increases precision
      from 0.51 to 0.69 ( \u2206 = 0 . 184 , CI [0.149, 0.219], p H = 0 . 0148 ),
      while recall rises from 0.56 to 0.63 and str-EM falls from 0.34 to 0.25 (both
      p H = 0 . 0148 ). The corresponding QASPER precision difference is negative
      ( \u2206 = -0 . 089 , CI [ -0 . 124 , -0 . 052 ], p H = 0 . 0148 ). These dataset-specific
      results do not isolate a causal effect of citation granularity.\nDeclared provenance
      determines verification coverage (H4). Table 1 contrasts declared-span and summary
      checking. For RECOMP on ASQA the unsupported rates are 1.00 and 0.17, respectively;
      the corresponding QASPER values are 1.00 and 0.50. LLMLingua-2 has rates of
