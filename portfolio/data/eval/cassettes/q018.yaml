        and Results\\nBaselines. We compare AdaMem against hardcompression methods
        (RECOMP, LLMLingua, and LLMLingua-2), and soft-compression methods (xRAG,
        PISCO, and OSCAR). No Context answers without retrieved evidence, while Full
        Context provides all retrieved passages without compression. PISCO and OSCAR
        are the closest soft-compression baselines because they support large retrieved
        candidate pools and integrate compression with the retrieval pipeline. PISCO
        uses query-independent passage compression, whereas OSCAR, like AdaMem, performs
        query-conditioned compression and relevance scoring. Both assign memory uniformly
        across retained passages, while AdaMem allocates a fixed global budget according
        to passage relevance. To isolate this difference, we train PISCO, OSCAR, and
        AdaMem using identical data splits, hyperparameters, and training stages.
        Consequently, the comparison with OSCAR directly measures the effect of relevance-aware
        memory allocation under a matched setup.\\nMain Results. Table 1 reports results
        with 25 retrieved documents. At the reference compression rate of 16 \xD7
        , AdaMem achieves the best performance among compressed methods on five of
        six benchmarks. The only exception is BioASQ, where LLMLingua-2 achieves the
        strongest compressed result. Nevertheless, AdaMem outperforms all evaluated
        soft-compression baselines.\\nHard-compression methods exhibit a clear trade-off
        between compression and answer quality. RECOMP achieves the highest compression
        rate (200 \xD7 ), but its performance remains only moderately above the No
        Context baseline; for example, it improves HotpotQA from 32.3 to 37.0. Conversely,
        LLMLingua and LLMLingua-2 operate at only 2 \xD7 compression, retaining a
        substantially larger text budget, yet generally remain below AdaMem. For instance,
        at 16 \xD7 , AdaMem improves over LLMLingua-2 by 3.3 points on TriviaQA, 3.0
        points on HotpotQA, and 17.3 points on PopQA. Thus, hard compression either
        requires aggressive token removal, which leaves limited useful evidence, or
        preserves much larger context without reaching the effectiveness of soft compression.\\nAmong
        soft-compression methods, AdaMem consistently outperforms OSCAR under the
        same 16 \xD7 memory budget and yields substantial gains over PISCO. xRAG performs
        poorly in this setting because it is designed to compress a single document.
        When applied to long multi-document contexts, its compressed tokens become
        less informative and fail to preserve passage-specific, query-relevant evidence.\\nBoth
        AdaMem and OSCAR are trained at 16 \xD7 compression. We evaluate higher compression
        ratios exclusively at inference time, without additional training or fine-tuning.
        At 32 \xD7 , AdaMem outperforms OSCAR at its training-time compression ratio
        of 16 \xD7 across all benchmarks, indicating that it can use approximately
        half as many memory embeddings while maintaining answer quality. Even at 64
        \xD7 , AdaMemsurpasses OSCAR at 16 \xD7 on five of six benchmarks. Moreover,
        AdaMem retains a clear advantage over OSCAR at the same\\n64 \xD7 compression
        rate. For example, on TriviaQA, increasing compression from 16 \xD7 to 64
        \xD7 reduces performance by only 0.7 points for AdaMem, compared with 5.3
        points for OSCAR. This robustness suggests that relevance-aware allocation
        preserves salient evidence when the memory budget is severely constrained.\",\"metadata\":{\"ingestion_version\":\"01a0fc53885372038a1c6d0df171e569\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d-text-0010\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d\",\"chunk_type\":\"text\",\"section_path\":\"Experiments
        and Results\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":52,\"page_no\":5,\"filename\":\"2609.22100v1.pdf\"}}},{\"id\":\"315946dc-a850-55d9-97af-3742f684e651\",\"version\":7,\"score\":0.44507217,\"payload\":{\"page_content\":\"Query-Conditioned
        Compression and Adaptive Allocation. For each query-passage pair, we form\\nThree-Stage
        Training. We train AdaMem in three stages. Stage 1 pretrains the compressor
        and projection module with query-independent autoencoding and text-continuation
        objectives, teaching it to encode text into decoder-consumable representations.
        Stage 2 performs joint query-dependent training on an intermediate retrieval-augmented
        corpus, generating teacher answers from query-conditioned passage memories
        while initializing the reranker head via teacherscore distillation, adapting
        the compressor from generic to query-aware evidence representation. Stage
        3 fi ne-tunes the full model on the filtered KILT-SCR corpus with full retrieved
        candidate pools, jointly optimizing generation and reranker distillation so
        that relevance scores directly determinepassageordering and memory allocation
        under the fixed budget at the target retrieval scale.\",\"metadata\":{\"ingestion_version\":\"01a0fc53885372038a1c6d0df171e569\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d-text-0008\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d\",\"chunk_type\":\"text\",\"section_path\":\"Query-Conditioned
        Compression and Adaptive Allocation. For each query-passage pair, we form\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":45,\"page_no\":4,\"filename\":\"2609.22100v1.pdf\"}}},{\"id\":\"59a855a5-5d91-566d-af5b-7c35dc4e52a2\",\"version\":7,\"score\":0.44307652,\"payload\":{\"page_content\":\"Abstract\\nRetrieval-augmented
        generation (RAG) improves language modelswithretrieved evidence, but processing
        many long passages is costly and can introduce distracting information. Soft
        compression addresses this challenge by encoding passages as compact sequences
        of continuous memory embeddings before generation. However, existing methods
        typically assign each retained passage an identical number of memory embeddings,
        irrespective of its query-specific relevance. To address this, we propose
        AdaMem, a relevance-guided soft-compression framework that maps learned passage-relevance
        estimates to a query-dependent allocation of a fixed memory-token budget.
        A shared query-conditioned compressor produces both continuous passage memories
        and relevance scores in a single pass; a deterministic allocation rule assigns
        more memory tokens to higher-scoring passages and can omit low-scoring ones.
        Across six open-domain QA benchmarks, AdaMem consistently outperforms OSCAR
        (the closely matched softcompression baseline that uses uniform allocation)
        as well as other soft-compression methods at matched memory budgets. Under
        standard 16 \xD7 compression, AdaMem improves sub-string match by up to 3.2
        points (5.5%) over uniform allocation baseline, with an average relative gain
        of 3.4%; under aggressive 64 \xD7 compression the average relative gain grows
        to 14.6%, with a maximum of 9.8 points (19.7%) on PopQA. AdaMem matches the
        answer quality of the uncompressed at up to 4 \xD7 lower inference latency
        than full context baseline. AdaMem retains an efficiency profile comparable
        to the uniform-compression baseline, while achieving up to 4 \xD7 lower inference
        latency than full-context inference. Thus, relevance-guided memory allocation
        is particularly effective when retrieval pools are large and the available
        memory budget is tight.\",\"metadata\":{\"ingestion_version\":\"01a0fc53885372038a1c6d0df171e569\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d-text-0001\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d\",\"chunk_type\":\"text\",\"section_path\":\"Abstract\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":3,\"page_no\":1,\"filename\":\"2609.22100v1.pdf\"}}},{\"id\":\"db1ed309-fabe-5b95-bf4b-ccbf6c4871cc\",\"version\":7,\"score\":0.4425733,\"payload\":{\"page_content\":\"AdaMem:
        Adaptive Memory Token Allocation for Soft Compression in Retrieval-Augmented
        Generation\\nArtem Sakhno, Grigorii Davydenko, Omar Zoloev, Julia Belikova,
        Andrey Savchenko, Maksim Makarenko \u2217\",\"metadata\":{\"ingestion_version\":\"01a0fc53885372038a1c6d0df171e569\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d-text-0000\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d\",\"chunk_type\":\"text\",\"section_path\":\"AdaMem:
        Adaptive Memory Token Allocation for Soft Compression in Retrieval-Augmented
        Generation\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":1,\"page_no\":1,\"filename\":\"2609.22100v1.pdf\"}}},{\"id\":\"376db314-03f8-550f-b3ca-a6811171d657\",\"version\":5,\"score\":0.4377628,\"payload\":{\"page_content\":\"B.
        Accuracy Degradation\\nOne detail in Table I needs to be read carefully. The
        0 / 3 row still shows a fooled rate near 10% and an accuracy about 9 points
        below the clean arm, even though no passage is rewritten and both answers
        see the same retrieved list. That residual is therefore not a retrieval mismatch.
        It comes from decoding noise under temperature 0.1 across two independent
        generations, plus a strict keyword matcher that can disagree on near-paraphrases.
        Recomputing from the 588-run table, clean and poisoned answers are identical
        in only 76.9% of the 0 / 3 runs. The residual is large relative to some attack
        increments (the rise from 9.5% to 15.0% fooled between 0 / 3 and 1 / 3 is
        5.5 points), so strategy contrasts at light poisoning should be read as suggestive
        until decoding is controlled (fixed seeds, repeated draws) and labels are
        less brittle. We therefore read the clean-arm column, not the 0 / 3 poisoned
        cell, as the true no-attack baseline.\",\"metadata\":{\"ingestion_version\":\"01a0fc53392f724b972307d03a9f94d9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead-text-0009\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead\",\"chunk_type\":\"text\",\"section_path\":\"B.
        Accuracy Degradation\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":41,\"page_no\":3,\"filename\":\"2609.09243v1.pdf\"}}}]},\"status\":\"ok\",\"time\":0.001933551}"
