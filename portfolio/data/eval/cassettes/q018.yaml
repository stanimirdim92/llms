      1)\",\"citations\":{\"enabled\":true}},{\"type\":\"document\",\"source\":{\"type\":\"text\",\"media_type\":\"text/plain\",\"data\":\"Conclusion\\nWe
      introduced AdaMem, a relevance-aware allocation framework for soft-compressed
      RAG. Instead of uniformly representing retained passages, AdaMem converts querydependent
      relevance scores into a non-uniform allocation of a fixed global memory budget,
      concentrating capacity on answer-bearing evidence while retaining limited capacity
      for complementary passages. The resulting allocation is the exact optimum of
      a proportional-fair objective under an assumed logarithmic utility model, and
      is a first-order approximation to the reverse-water-filling optimum of classical
      exponential-distortion bit allocation.\\nFigure 6: Optimal allocation temperature
      on TriviaQA across compression rates. The analytically predicted schedule (
      \u03C4 \u221D B ( \u03C1 ) , anchored at 16 \xD7 ) follows the empirical optimum
      and consistently outperforms a fixed \u03C4 = 1 .\\nAdaMem establishes a new
      state of the art among softcompression methods across six evaluated QA benchmarks.
      At 16 \xD7 compression, it improves over baselines, the strongest prior soft-compression
      method, by an average of 3 . 4% in relative terms. The advantage becomes substantially
      larger as the memory budget decreases. At 64 \xD7 compression, the average relative
      improvement reaches 14 . 6% , with gains of up to 21 . 8% on HotpotQA. At 32
      \xD7 , AdaMem exceeds OSCAR at 16 \xD7 on every benchmark, achieving an average
      relative improvement of 2 . 9% . These results show that adaptive allocation
      is particularly effective under aggressive compression, where large retrieval
      pools must be represented within strict memory constraints.\\nFinally, we introduce
      KILT-SCR, a training and evaluation resource for the joint study of reranking
      and compression. Constructed to retain answer-bearing retrieved evidence and
      answer-consistent teacher targets, it enables controlled comparison of reranking
      and memory-allocation strategies over large candidate pools with heterogeneous
      passage utility.\\nSeveral future research directions remain open. The temperature
      could be learned or predicted per query rather than set per compression rate,
      allowing allocation sharpness to adapt to the confidence of the relevance estimates.
      The budget-allocation view itself is not specific to QA or memory embeddings
