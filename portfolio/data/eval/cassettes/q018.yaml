      on average?", "documents": ["Table 2: Effect of filtered fine-tuning data on
      Match (%) at compression rate 16. Both models are trained for one epoch.\n\n|
      Training data   |   TriviaQA |   NQ |   HotpotQA |\n|-----------------|------------|------|------------|\n|
      Unfiltered      |       80.3 | 62.8 |       42.6 |\n| Filtered        |       82.8
      | 63.3 |       44.5 |\n| Difference      |       +2.5 | +0.6 |       +2.0 |",
      "Experiments and Results\nEfficiency-Performance Tradeoff. Figure 5 relates
      TriviaQA Match to per-query inference latency across compression rates (theoretical
      optimal \u03c4 is used) . AdaMem operates at the same low latency as prior soft
      compression while delivering uncompressed-quality answers roughly 4 \u00d7 more
      efficiently than Full Context: at 32 \u00d7 compression it matches Full Context
      quality (84.4 Match) at 4 . 0 \u00d7 lower latency and 3 . 6 \u00d7 less compute.
      The two methods also trade quality for speed in sharply different ways. Lowering
      the budget moves OSCAR down a steep curve, losing 5.3 Match points between 16
      \u00d7 and 64 \u00d7 compression, whereas AdaMem stays within 0.5 points over
      the same range: relevance-aware allocation converts compression into latency
      savings almost without quality cost. As a result, AdaMem at 64 \u00d7 is both
      faster and more accurate than uniform compression at 16 \u00d7 . Appendix B
      provides additional efficiency discussion with detailed measurements, including
      throughput, compute, and memory information.\nEffect of Training-Data Filtering.
      We evaluate the impact of filtered fine-tuning data. KILT-SCR retains instances
      where the retrieved pool contains a gold-answer alias and the teacher target
      is answer-consistent, reducing noise in both retrieval supervision and generation
      targets.\nFor a controlled comparison, we train the same AdaMem model for one
      epoch on either filtered or unfiltered data under identical settings. Using
      25 passages and a compression rate of 16, Table 2 shows that KILT-SCR improves
      performance by 1.7 points on average, indicating better alignment between relevance
      estimation and answer generation.\nAblation of Training Stages. Table 3 ablates
      the contribution of the three training stages. Removing Stage 1 causes the largest
      performance drop across all datasets, particularly on NQandHotpotQA.Thisresultshowsthatdirectly
      optimizing query-dependent generation and relevance-supervision objectives is
      insufficient to learn effective continuous passage representations from scratch.
      Removing either Stage 2 or Stage 3 produces smaller but consistent degradations.
      Without Stage 2, the model loses the intermediate adaptation from generic soft
      compression to query-conditioned evidence representation. Without Stage 3, it
      is not optimized for relevance estimation and memory allocation over the full
      retrieved candidate pools used at inference time.\nTable 2: Effect of filtered
      fine-tuning data on Match (%) at compression rate 16. Both models are trained
      for one epoch.\n\nUnfiltered, TriviaQA = 80.3. Unfiltered, NQ = 62.8. Unfiltered,
      HotpotQA = 42.6. Filtered, TriviaQA = 82.8. Filtered, NQ = 63.3. Filtered, HotpotQA
      = 44.5. Difference, TriviaQA = +2.5. Difference, NQ = +0.6. Difference, HotpotQA
      = +2.0", "Top-25 QA robustness under stronger compression\nFigure 7: LLM-as-a-judge
      accuracy under increasingly strong inference-time compression. AdaMem consistently
      retains higher answer quality than OSCAR as the memory budget decreases.", "6
      Discussion\nHow to read the R-Search result. R-Search sits above its base on
      all four datasets and significantly above on the best-powered one, which is
      a real and consistent pattern. It is also one model, one base, one prompt, and
      one scorer, so four datasets are not four independent replications, and the
      effect softens under a stricter variant and a looser outcome. Two things would
      settle it: a cross-dataset test declared in advance, and an arm fine-tuned on
      the same data without RL, which would separate the contribution of RL from the
      contribution of fine-tuning on retrieval data at all.\nA note on cost. Everything
      here, four models, four datasets, three variants, both conditions, and the control
      that makes the comparison interpretable, ran on Kaggle''s T4 GPUs. Careful measurement
      was the cheap part of this project. The expensive part was reading the construction
      code closely enough to know which controls we did not have to run.", "Experiments
      and Results\nFinally, at 16 \u00d7 , AdaMem closely approaches Full Context
      performance despite replacing the retrieved text with a substantially shorter
      continuous representation. On TriviaQA, it is within 0.4 points of Full Context,
      while on PopQA it exceeds Full Context by 1.4 points. Hence, selective memory
      allocation can both reduce computational cost and mitigate interference from
      irrelevant retrieved passages.\nFigure 4: Memory-token allocation by document
      relevance rank at 64 \u00d7 compression. The dashed line denotes OSCAR''s fixed
      16 \u00d7 allocation.\nMemory Allocation Behavior. Figure 4 illustrates the
      allocation mechanism under this highly constrained 64 \u00d7 setting. For the
      most relevant documents, AdaMem allocates a median of roughly 10 memory tokens,
      already exceeding OSCAR''s fixed budget of 9 tokens per document at 16 \u00d7
      . The 90th percentile is substantially higher, indicating that for some queries,
      AdaMem assigns considerably more capacity to the most relevant document. In
      contrast, the allocation decreases sharply with relevance rank and approaches
      zero for lower-ranked documents. Thus, AdaMem concentrates capacity on query-relevant
      evidence while assigning minimal capacity to noisy passages, reducing their
      potential interference in the compressed context.\nRobustness to Retrieval Depth
      and Compression. Figure 3 compares AdaMem and OSCAR across retrieval depths
      k \u2208 { 5 , 10 , 15 , 20 , 25 } and compression ratios of 16 \u00d7 , 32
      \u00d7 , and 64 \u00d7 at \u03c4 =1. AdaMem benefits more consistently from
      deeper retrieval, whereas OSCAR remains nearly constant as additional lower-ranked
      documents are introduced.\nThis difference is most pronounced under aggressive
      compression. At 64 \u00d7 , increasing k from 5 to 25 improves AdaMem by 3.5
      points on TriviaQA, 5.4 on Natural Questions, and 4.2 on HotpotQA, while OSCAR
      changes only marginally over the same range. A similar pattern holds at 32 \u00d7
      , particularly on Natural Questions and HotpotQA.\nThese results suggest that
      AdaMem can extract useful evidence from less-relevant documents without allocating
      them the same budget as highly relevant ones. In contrast, OSCAR''s fixed per-document
      allocation provides limited benefit from deeper retrieval, as its representation
      capacity is uniformly spread over an increasingly noisy document set. The effect
      is weaker at 16 \u00d7 , where both methods have sufficient capacity for shallow
      retrieval pools, but becomes increasingly clear as the memory budget is reduced.\nFigure
      5: Quality-latency tradeoff on TriviaQA. AdaMem shows similar latency as OSCAR
      and matches Full Context quality at 4 . 0 \u00d7 lower latency.", "This is a
      grouped bar chart comparing the performance of two methods, AdaMem (blue) and
      OSCAR (yellow hatched), across three question-answering datasets: TriviaQA,
      NQ, and HotpotQA. The y-axis shows \"Llama-3 judge (%)\" scores ranging from
      0 to about 90, while the x-axis shows compression rates of 16\u00d7, 32\u00d7,
      and 64\u00d7 for each dataset. Across all datasets and compression rates, AdaMem
      consistently outperforms OSCAR, with the performance gap widening as compression
      rate increases (e.g., in HotpotQA, AdaMem scores 62.4% vs OSCAR''s 55.3% at
      64\u00d7 compression), indicating AdaMem maintains accuracy better under higher
      compression.", "Conclusion\nWe introduced AdaMem, a relevance-aware allocation
      framework for soft-compressed RAG. Instead of uniformly representing retained
      passages, AdaMem converts querydependent relevance scores into a non-uniform
      allocation of a fixed global memory budget, concentrating capacity on answer-bearing
      evidence while retaining limited capacity for complementary passages. The resulting
      allocation is the exact optimum of a proportional-fair objective under an assumed
      logarithmic utility model, and is a first-order approximation to the reverse-water-filling
      optimum of classical exponential-distortion bit allocation.\nFigure 6: Optimal
      allocation temperature on TriviaQA across compression rates. The analytically
      predicted schedule ( \u03c4 \u221d B ( \u03c1 ) , anchored at 16 \u00d7 ) follows
      the empirical optimum and consistently outperforms a fixed \u03c4 = 1 .\nAdaMem
      establishes a new state of the art among softcompression methods across six
      evaluated QA benchmarks. At 16 \u00d7 compression, it improves over baselines,
      the strongest prior soft-compression method, by an average of 3 . 4% in relative
      terms. The advantage becomes substantially larger as the memory budget decreases.
      At 64 \u00d7 compression, the average relative improvement reaches 14 . 6% ,
      with gains of up to 21 . 8% on HotpotQA. At 32 \u00d7 , AdaMem exceeds OSCAR
      at 16 \u00d7 on every benchmark, achieving an average relative improvement of
      2 . 9% . These results show that adaptive allocation is particularly effective
      under aggressive compression, where large retrieval pools must be represented
      within strict memory constraints.\nFinally, we introduce KILT-SCR, a training
      and evaluation resource for the joint study of reranking and compression. Constructed
      to retain answer-bearing retrieved evidence and answer-consistent teacher targets,
      it enables controlled comparison of reranking and memory-allocation strategies
      over large candidate pools with heterogeneous passage utility.\nSeveral future
      research directions remain open. The temperature could be learned or predicted
      per query rather than set per compression rate, allowing allocation sharpness
      to adapt to the confidence of the relevance estimates. The budget-allocation
      view itself is not specific to QA or memory embeddings and extends naturally
      to other bounded representations, such as KV-cache compression and long-context
      summarization.\nAllal, L. B.; Lozhkov, A.; Bakouch, E.; Bl\u00e1zquez, G. M.;
      Penedo, G.; Tunstall, L.; Marafioti, A.; Kydl\u00ed\u010dek, H.; Lajar\u00edn,
      A. P.; Srivastav, V.; Lochner, J.; Fahlgren, C.; Nguyen, X.-S.; Fourrier, C.;
      Burtenshaw, B.; Larcher, H.; Zhao, H.; Zakka, C.; Morlon, M.; Raffel, C.; von
      Werra, L.; and Wolf, T. 2025. SmolLM2: When Smol Goes Big - Data-Centric Training
      of a Small Language Model. arXiv:2502.02737.", "D Judge Metrics\nWe use Substring
      Match as the primary metric because it is deterministic and consistent with
      standard open-domain QA evaluation. However, it can overestimate answer quality
      when a model lists multiple candidate answers: the prediction receives full
      credit whenever it contains a gold-answer alias as a substring, even if the
      response is ambiguous, unsupported, or includes incorrect alternatives. We therefore
      additionally report LLM-as-a-judge scores, which evaluate the correctness of
      the generated answer in the context of the question and reference answer. The
      judge assigns a score of 1 for a correct answer, 0.5 for a partially correct
      answer, and 0 for a wrong answer; we report the mean score as a percentage.
      This complementary evaluation penalizes answer enumeration and verifies that
      improvements in Match correspond to genuinely correct answers rather than increased
      lexical overlap with the reference.\nTable 5: Training schedule for the three-stage
      procedure.\n\nStage 1, Examples = 2,000,000. Stage 1, Epochs = 1. Stage 2, Examples
      = 500,000. Stage 2, Epochs = 1. Stage 3 (KILT-SCR), Examples = 196,916. Stage
      3 (KILT-SCR), Epochs = 3\nFor each example, we provide the judge with the question,
      the reference answer, and the model prediction. We use the following prompt:\nSystem
      prompt: You are an evaluation tool. Answer with one of: 1: Correct, 0.5: Partially
      correct, 0: Wrong.\nUser prompt: Here is a question, a golden answer, and an
      AI-generated answer. Can you judge whether the AIgenerated answer is correct
      according to the question and golden answer? Simply answer with one of: 1: Correct,
      0.5: Partially correct, 0: Wrong.\nQuestion:\n{question}\nGolden answer:\n{answer}\nGenerated
      answer: {prediction}\nFigure 7 corroborates the Match-based robustness trends.
      At the training-time compression rate of 16 \u00d7 , AdaMem matches or exceeds
      OSCAR across all three benchmarks, improving by 1.8 points on TriviaQA and 2.4
      points on NQ, while the methods are effectively tied on HotpotQA. The advantage
      grows under stronger inference-time compression. At 64 \u00d7 , AdaMem exceeds
      OSCAR by 6.1 points on TriviaQA and NQ, and by 7.1 points on HotpotQA. In contrast
      to OSCAR, AdaMem remains stable as the memory budget shrinks: its judge score
      decreases by only 0.9, 3.3, and 1.4 points from 16 \u00d7 to 64 \u00d7 on TriviaQA,
      NQ, and HotpotQA, respectively, compared with drops of 5.2, 7.0, and 8.7 points
      for OSCAR. These results show that relevance-aware allocation preserves answer-critical
      information under severe compression, rather than merely improving lexical overlap
      with reference answers.", "This is a line chart grid comparing two retrieval-augmented
      QA methods, OSCAR (red) and AdaMem (green), across three datasets (TriviaQA,
      NQ, HotpotQA) and three compression ratios (16x, 32x, 64x), forming a 3x3 panel
      layout. The x-axis in each subplot represents the number of retrieved documents
      (k = 5, 10, 15, 20, 25), while the y-axis shows task performance scores (ranging
      roughly from 36 to 84 depending on the dataset/compression level). Across nearly
      all panels, AdaMem consistently outperforms OSCAR, with the performance gap
      generally widening as compression increases (64x) and as more documents are
      retrieved, demonstrating AdaMem''s superior robustness under higher compression
      and larger retrieval sets.", "Experiments and Results\nKILT-SCR. Weconstruct
      KILT-SCR as a large-candidatepool resource with training and evaluation splits.
      Its training split is derived from the training sets of Natural Questions (Kwiatkowski
      et al. 2019), HotpotQA (Yang et al. 2018), and TriviaQA (Joshi et al. 2017).
      The evaluation split contains examples from the evaluation sets of these three
      datasets, together with PopQA (Mallen et al. 2023), ASQA (Stelmakh et al. 2022),
      and BioASQ (Krithara et al. 2023; Tsatsaronis et al. 2015). For every query,
      we retrieve a fixed pool of 25 passages from KILT-100w (Petroni et al. 2021)
      using BAAI/bge-large-en-v1.5 (Xiao et al. 2024).\nFor each training query, we
      score candidates with cross-encoder/ms-marco-MiniLM-L6-v2 (Bajaj et al. 2018)
      and provide the ten highest-scoring passages to Mistral-7B-Instruct-v0.2 (Jiang
      et al. 2023a) to generate answer targets. We retain only instances for which
      a goldanswer alias occurs both in at least one retrieved passage and in the
      generated target, yielding 196,916 examples; teacher scores are globally standardized
      over this split. In contrast, we apply no answer-support or teacher-target filtering
      to KILTSCR evaluation split, which contains 2,000 examples each from Natural
      Questions, HotpotQA, TriviaQA, and PopQA, 948 from ASQA, and 1,609 from BioASQ.
      At evaluation time, the learned reranker scores the fixed candidate pool before
      answer generation.\nExperimental Setup. AdaMem uses a Llama-3.2-1BInstruct (Grattafiori
      et al. 2024) compressor and a Mistral-7B-Instruct-v0.2 decoder adapted with
      LoRA (Hu et al. 2022). We first pretrain the compressor and AdaMem projection
      module on two million examples sampled from EleutherAI/SmolLM2-135M-10B (Allal
      et al. 2025), using autoencoding and language-modeling objectives. We then perform
      query-dependent fine-tuning on maxoul/pisco_finetuning_data (Louis, D\u00e9jean,
      and Clinchant 2025), following the OSCAR training setup. Finally, we train on
      KILT-SCR with the joint answergeneration and reranker-distillation objectives.
      For all experiments, we report Substring Match as the primary evaluation metric.
      We provide additional LLM-as-a-judge metrics in the Supplementary Material.\nFigure
      3: Match (%) versus retrieval depth. AdaMem benefits from deeper retrieval more
      consistently than OSCAR, particularly under stronger compression.", "This is
      a line chart comparing TriviaQA match performance against compression rate (16x,
      32x, 64x, 128x on x-axis) for three memory allocation methods. The \"AdaMem
      (ours)\" method (blue line) maintains the highest accuracy across all compression
      rates, starting near 84 and ending around 82 (only -2.08% drop from full context),
      outperforming \"Uniform(Oscar)\" (orange line, dropping to -7.34%) and \"Uniform(Pisco)\"
      (purple line, dropping to -7.52%). A dashed green line at the top indicates
      \"Full Context\" performance (~84.5) as the reference baseline, and a schematic
      above the chart illustrates how AdaMem allocates variable-length document representations
      (d1-d4) compared to Uniform''s equal-length allocation.", "B Inference Efficiency\nTable
      4 reports per-query latency, throughput, total compute, and peak GPU memory
      on TriviaQA with k = 25 retrieved passages, for all inference-time compression
      rates used in the main text.\nAll compressed configurations are substantially
      cheaper than Full Context: latency drops by 3 . 5 \u00d7 to 4 . 9 \u00d7 and
      compute by 2 . 9 \u00d7 to 5 . 0 \u00d7 , confirming that soft compression removes
      the dominant cost of processing large retrieval pools. Relative to OSCAR at
      the same compression rate, AdaMem adds the cost of relevance scoring and of
      encoding the fixed candidate memory bank before selection. This overhead is
      confined to the compressor and does not grow with the decoder context, so its
      share shrinks as compression increases: from 36.3 ms (23%) at 16 \u00d7 to 10.0
      ms (7%) at 64 \u00d7 and 7.6 ms (6%) at 128 \u00d7 . Because the quality of
      AdaMem is nearly flat in the compression rate, it can be operated at aggressive
      compression where this overhead is smallest: at 64 \u00d7 and 128 \u00d7 , AdaMem
      matches or improves on OSCAR at 16 \u00d7 in latency, throughput, and compute
      while providing higher answer quality. Peak memory remains moderately higher
      than OSCAR because the candidate bank for the full pool is encoded before allocation,
      yet at 64 \u00d7 it is already below the Full Context footprint (44.4 versus
      53.5 GB), and the gap narrows further with compression.", "Experiments and Results\nTable
      3: Effect of the three-stage training procedure at 16 \u00d7 compression with
      k = 25 .\n\nw/o Stage 1, TriviaQA = 71.30. w/o Stage 1, NQ = 44.45. w/o Stage
      1, HotpotQA = 29.35. w/o Stage 2, TriviaQA = 81.35. w/o Stage 2, NQ = 61.65.
      w/o Stage 2, HotpotQA = 43.10. w/o Stage 3, TriviaQA = 81.05. w/o Stage 3, NQ
      = 59.30. w/o Stage 3, HotpotQA = 42.70. Full three-stage training, TriviaQA
      = 82.80. Full three-stage training, NQ = 63.30. Full three-stage training, HotpotQA
      = 44.50\nOverall, the results show that each stage addresses a distinct requirement:
      learning general-purpose soft memories, adapting them to query-dependent evidence,
      and aligning relevance-aware allocation with the target retrieval setting.\nEffect
      of Allocation Temperature. The temperature \u03c4 controls allocation sharpness:
      larger values approach uniform allocation, while smaller values concentrate
      memory on the most relevant passages. Our allocation view predicts that \u03c4
      should decrease as compression becomes stronger, since a smaller memory budget
      must be focused on fewer high-utility passages.\nFigure 6 confirms this prediction
      on TriviaQA. The optimal temperature decreases from \u03c4 \u2217 = 1 . 0 at
      16 \u00d7 compression to 0 . 7 at 32 \u00d7 and 0 . 5 at 64 \u00d7 and 128 \u00d7
      . Moreover, a theoretically predicted schedule, \u03c4 \u221d B ( \u03c1 ) anchored
      at 16 \u00d7 , consistently outperforms a fixed \u03c4 = 1 and closely tracks
      the empirical optimum, despite a small gap at higher compression.\nThis effect
      contributes to the robustness in Figure 1, which uses the theoretical temperature
      schedule without any empirical tuning.", "Introduction\nMotivated by these limitations,
      we propose AdaMem , a framework that transforms reranking from binary selection
      into relevance-aware memory allocation. A shared compressor produces query-conditioned
      memories and scores; a principled softmax allocation, grounded in logarithmic
      utility theory, distributes a fixed total memory budget across passages according
      to their estimated utility. The temperature interpolates between uniform allocation
      and hard topk selection. Here are our main contributions:\n- We introduce relevance-aware
      memory allocation for soft-compressed RAG: each document receives an adaptive
      memory budget determined by its estimated relevance (Figure 1), concentrating
      capacity on answer-bearing evidence while preserving compact representations
      for complementary context. This adaptivity makes AdaMem substantially more robust
