        retrieval sets.\",\"metadata\":{\"ingestion_version\":\"01a0fc53885372038a1c6d0df171e569\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d-fig-005-02\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d\",\"chunk_type\":\"figure\",\"section_path\":\"\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":50,\"page_no\":5,\"filename\":\"2609.22100v1.pdf\",\"image_path\":\"/var/www/html/personal/llms/portfolio/data/processed/01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d/figures/fig-005-02-a8d9c5fa3b5abf00.png\"}}},{\"id\":\"a0ce46ce-16e2-53f9-b82c-0a975e84f980\",\"version\":7,\"score\":0.46539214,\"payload\":{\"page_content\":\"Experiments
        and Results\\nKILT-SCR. Weconstruct KILT-SCR as a large-candidatepool resource
        with training and evaluation splits. Its training split is derived from the
        training sets of Natural Questions (Kwiatkowski et al. 2019), HotpotQA (Yang
        et al. 2018), and TriviaQA (Joshi et al. 2017). The evaluation split contains
        examples from the evaluation sets of these three datasets, together with PopQA
        (Mallen et al. 2023), ASQA (Stelmakh et al. 2022), and BioASQ (Krithara et
        al. 2023; Tsatsaronis et al. 2015). For every query, we retrieve a fixed pool
        of 25 passages from KILT-100w (Petroni et al. 2021) using BAAI/bge-large-en-v1.5
        (Xiao et al. 2024).\\nFor each training query, we score candidates with cross-encoder/ms-marco-MiniLM-L6-v2
        (Bajaj et al. 2018) and provide the ten highest-scoring passages to Mistral-7B-Instruct-v0.2
        (Jiang et al. 2023a) to generate answer targets. We retain only instances
        for which a goldanswer alias occurs both in at least one retrieved passage
        and in the generated target, yielding 196,916 examples; teacher scores are
        globally standardized over this split. In contrast, we apply no answer-support
        or teacher-target filtering to KILTSCR evaluation split, which contains 2,000
        examples each from Natural Questions, HotpotQA, TriviaQA, and PopQA, 948 from
        ASQA, and 1,609 from BioASQ. At evaluation time, the learned reranker scores
        the fixed candidate pool before answer generation.\\nExperimental Setup. AdaMem
        uses a Llama-3.2-1BInstruct (Grattafiori et al. 2024) compressor and a Mistral-7B-Instruct-v0.2
        decoder adapted with LoRA (Hu et al. 2022). We first pretrain the compressor
        and AdaMem projection module on two million examples sampled from EleutherAI/SmolLM2-135M-10B
        (Allal et al. 2025), using autoencoding and language-modeling objectives.
        We then perform query-dependent fine-tuning on maxoul/pisco_finetuning_data
        (Louis, D\xE9jean, and Clinchant 2025), following the OSCAR training setup.
        Finally, we train on KILT-SCR with the joint answergeneration and reranker-distillation
        objectives. For all experiments, we report Substring Match as the primary
        evaluation metric. We provide additional LLM-as-a-judge metrics in the Supplementary
        Material.\\nFigure 3: Match (%) versus retrieval depth. AdaMem benefits from
        deeper retrieval more consistently than OSCAR, particularly under stronger
        compression.\",\"metadata\":{\"ingestion_version\":\"01a0fc53885372038a1c6d0df171e569\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d-text-0009\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d\",\"chunk_type\":\"text\",\"section_path\":\"Experiments
