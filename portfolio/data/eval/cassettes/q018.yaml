        |\",\"metadata\":{\"ingestion_version\":\"01a0fc53885372038a1c6d0df171e569\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d-table-0001\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d\",\"chunk_type\":\"table\",\"section_path\":\"\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":71,\"page_no\":7,\"filename\":\"2609.22100v1.pdf\",\"markdown\":\"Table
        2: Effect of filtered fine-tuning data on Match (%) at compression rate 16.
        Both models are trained for one epoch.\\n\\n| Training data   |   TriviaQA
        |   NQ |   HotpotQA |\\n|-----------------|------------|------|------------|\\n|
        Unfiltered      |       80.3 | 62.8 |       42.6 |\\n| Filtered        |       82.8
        | 63.3 |       44.5 |\\n| Difference      |       +2.5 | +0.6 |       +2.0
        |\"}}},{\"id\":\"212db6cd-800c-5025-8b59-1b2eeb918b24\",\"version\":7,\"score\":0.6328738,\"payload\":{\"page_content\":\"Experiments
        and Results\\nEfficiency-Performance Tradeoff. Figure 5 relates TriviaQA Match
        to per-query inference latency across compression rates (theoretical optimal
        \u03C4 is used) . AdaMem operates at the same low latency as prior soft compression
        while delivering uncompressed-quality answers roughly 4 \xD7 more efficiently
        than Full Context: at 32 \xD7 compression it matches Full Context quality
        (84.4 Match) at 4 . 0 \xD7 lower latency and 3 . 6 \xD7 less compute. The
        two methods also trade quality for speed in sharply different ways. Lowering
        the budget moves OSCAR down a steep curve, losing 5.3 Match points between
        16 \xD7 and 64 \xD7 compression, whereas AdaMem stays within 0.5 points over
        the same range: relevance-aware allocation converts compression into latency
        savings almost without quality cost. As a result, AdaMem at 64 \xD7 is both
        faster and more accurate than uniform compression at 16 \xD7 . Appendix B
        provides additional efficiency discussion with detailed measurements, including
        throughput, compute, and memory information.\\nEffect of Training-Data Filtering.
        We evaluate the impact of filtered fine-tuning data. KILT-SCR retains instances
        where the retrieved pool contains a gold-answer alias and the teacher target
        is answer-consistent, reducing noise in both retrieval supervision and generation
        targets.\\nFor a controlled comparison, we train the same AdaMem model for
        one epoch on either filtered or unfiltered data under identical settings.
        Using 25 passages and a compression rate of 16, Table 2 shows that KILT-SCR
        improves performance by 1.7 points on average, indicating better alignment
        between relevance estimation and answer generation.\\nAblation of Training
        Stages. Table 3 ablates the contribution of the three training stages. Removing
        Stage 1 causes the largest performance drop across all datasets, particularly
        on NQandHotpotQA.Thisresultshowsthatdirectly optimizing query-dependent generation
        and relevance-supervision objectives is insufficient to learn effective continuous
        passage representations from scratch. Removing either Stage 2 or Stage 3 produces
        smaller but consistent degradations. Without Stage 2, the model loses the
        intermediate adaptation from generic soft compression to query-conditioned
        evidence representation. Without Stage 3, it is not optimized for relevance
        estimation and memory allocation over the full retrieved candidate pools used
        at inference time.\\nTable 2: Effect of filtered fine-tuning data on Match
        (%) at compression rate 16. Both models are trained for one epoch.\\n\\nUnfiltered,
        TriviaQA = 80.3. Unfiltered, NQ = 62.8. Unfiltered, HotpotQA = 42.6. Filtered,
        TriviaQA = 82.8. Filtered, NQ = 63.3. Filtered, HotpotQA = 44.5. Difference,
        TriviaQA = +2.5. Difference, NQ = +0.6. Difference, HotpotQA = +2.0\",\"metadata\":{\"ingestion_version\":\"01a0fc53885372038a1c6d0df171e569\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d-text-0012\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d\",\"chunk_type\":\"text\",\"section_path\":\"Experiments
        and Results\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":67,\"page_no\":6,\"filename\":\"2609.22100v1.pdf\"}}},{\"id\":\"fb1a6069-d311-50a7-8e9b-00b12ec5e4e2\",\"version\":7,\"score\":0.5105996,\"payload\":{\"page_content\":\"Top-25
        QA robustness under stronger compression\\nFigure 7: LLM-as-a-judge accuracy
        under increasingly strong inference-time compression. AdaMem consistently
        retains higher answer quality than OSCAR as the memory budget decreases.\",\"metadata\":{\"ingestion_version\":\"01a0fc53885372038a1c6d0df171e569\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d-text-0028\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d\",\"chunk_type\":\"text\",\"section_path\":\"Top-25
