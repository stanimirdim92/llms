      lower inference latency than full context baseline. AdaMem retains an efficiency
      profile comparable to the uniform-compression baseline, while achieving up to
      4 \u00d7 lower inference latency than full-context inference. Thus, relevance-guided
      memory allocation is particularly effective when retrieval pools are large and
      the available memory budget is tight.", "AdaMem: Adaptive Memory Token Allocation
      for Soft Compression in Retrieval-Augmented Generation\nArtem Sakhno, Grigorii
      Davydenko, Omar Zoloev, Julia Belikova, Andrey Savchenko, Maksim Makarenko \u2217",
      "B. Accuracy Degradation\nOne detail in Table I needs to be read carefully.
      The 0 / 3 row still shows a fooled rate near 10% and an accuracy about 9 points
      below the clean arm, even though no passage is rewritten and both answers see
      the same retrieved list. That residual is therefore not a retrieval mismatch.
      It comes from decoding noise under temperature 0.1 across two independent generations,
      plus a strict keyword matcher that can disagree on near-paraphrases. Recomputing
      from the 588-run table, clean and poisoned answers are identical in only 76.9%
      of the 0 / 3 runs. The residual is large relative to some attack increments
      (the rise from 9.5% to 15.0% fooled between 0 / 3 and 1 / 3 is 5.5 points),
      so strategy contrasts at light poisoning should be read as suggestive until
      decoding is controlled (fixed seeds, repeated draws) and labels are less brittle.
      We therefore read the clean-arm column, not the 0 / 3 poisoned cell, as the
      true no-attack baseline."], "model": "rerank-2.5", "top_k": 5, "truncation":
