    body: "{\"max_tokens\":16000,\"messages\":[{\"role\":\"user\",\"content\":\"You
      check whether an answer is supported by its sources.\\n\\nQuestion: How much
      does filtering the fine-tuning data improve AdaMem on average?\\n\\nSources
      the answer was written from:\\n[1] Experiments and Results\\nEfficiency-Performance
      Tradeoff. Figure 5 relates TriviaQA Match to per-query inference latency across
      compression rates (theoretical optimal \u03C4 is used) . AdaMem operates at
      the same low latency as prior soft compression while delivering uncompressed-quality
      answers roughly 4 \xD7 more efficiently than Full Context: at 32 \xD7 compression
      it matches Full Context quality (84.4 Match) at 4 . 0 \xD7 lower latency and
      3 . 6 \xD7 less compute. The two methods also trade quality for speed in sharply
      different ways. Lowering the budget moves OSCAR down a steep curve, losing 5.3
      Match points between 16 \xD7 and 64 \xD7 compression, whereas AdaMem stays within
      0.5 points over the same range: relevance-aware allocation converts compression
      into latency savings almost without quality cost. As a result, AdaMem at 64
      \xD7 is both faster and more accurate than uniform compression at 16 \xD7 .
      Appendix B provides additional efficiency discussion with detailed measurements,
      including throughput, compute, and memory information.\\nEffect of Training-Data
      Filtering. We evaluate the impact of filtered fine-tuning data. KILT-SCR retains
      instances where the retrieved pool contains a gold-answer alias and the teacher
      target is answer-consistent, reducing noise in both retrieval supervision and
      generation targets.\\nFor a controlled comparison, we train the same AdaMem
      model for one epoch on either filtered or unfiltered data under identical settings.
      Using 25 passages and a compression rate of 16, Table 2 shows that KILT-SCR
      improves performance by 1.7 points on average, indicating better alignment between
      relevance estimation and answer generation.\\nAblation of Training Stages. Table
      3 ablates the contribution of the three training stages. Removing Stage 1 causes
      the largest performance drop across all datasets, particularly on NQandHotpotQA.Thisresultshowsthatdirectly
      optimizing query-dependent generation and relevance-supervision objectives is
      insufficient to learn effective continuous passage representations from scratch.
      Removing either Stage 2 or Stage 3 produces smaller but consistent degradations.
      Without Stage 2, the model loses the intermediate adaptation from generic soft
      compression to query-conditioned evidence representation. Without Stage 3, it
      is not optimized for relevance estimation and memory allocation over the full
      retrieved candidate pools used at inference time.\\nTable 2: Effect of filtered
      fine-tuning data on Match (%) at compression rate 16. Both models are trained
      for one epoch.\\n\\nUnfiltered, TriviaQA = 80.3. Unfiltered, NQ = 62.8. Unfiltered,
      HotpotQA = 42.6. Filtered, TriviaQA = 82.8. Filtered, NQ = 63.3. Filtered, HotpotQA
      = 44.5. Difference, TriviaQA = +2.5. Difference, NQ = +0.6. Difference, HotpotQA
      = +2.0\\n\\n[2] Table 2: Effect of filtered fine-tuning data on Match (%) at
      compression rate 16. Both models are trained for one epoch.\\n\\n| Training
      data   |   TriviaQA |   NQ |   HotpotQA |\\n|-----------------|------------|------|------------|\\n|
      Unfiltered      |       80.3 | 62.8 |       42.6 |\\n| Filtered        |       82.8
      | 63.3 |       44.5 |\\n| Difference      |       +2.5 | +0.6 |       +2.0 |\\n\\n[3]
      Abstract\\nRetrieval-augmented generation (RAG) improves language modelswithretrieved
      evidence, but processing many long passages is costly and can introduce distracting
      information. Soft compression addresses this challenge by encoding passages
      as compact sequences of continuous memory embeddings before generation. However,
      existing methods typically assign each retained passage an identical number
      of memory embeddings, irrespective of its query-specific relevance. To address
      this, we propose AdaMem, a relevance-guided soft-compression framework that
      maps learned passage-relevance estimates to a query-dependent allocation of
      a fixed memory-token budget. A shared query-conditioned compressor produces
      both continuous passage memories and relevance scores in a single pass; a deterministic
      allocation rule assigns more memory tokens to higher-scoring passages and can
      omit low-scoring ones. Across six open-domain QA benchmarks, AdaMem consistently
      outperforms OSCAR (the closely matched softcompression baseline that uses uniform
      allocation) as well as other soft-compression methods at matched memory budgets.
      Under standard 16 \xD7 compression, AdaMem improves sub-string match by up to
      3.2 points (5.5%) over uniform allocation baseline, with an average relative
      gain of 3.4%; under aggressive 64 \xD7 compression the average relative gain
      grows to 14.6%, with a maximum of 9.8 points (19.7%) on PopQA. AdaMem matches
      the answer quality of the uncompressed at up to 4 \xD7 lower inference latency
      than full context baseline. AdaMem retains an efficiency profile comparable
      to the uniform-compression baseline, while achieving up to 4 \xD7 lower inference
      latency than full-context inference. Thus, relevance-guided memory allocation
      is particularly effective when retrieval pools are large and the available memory
      budget is tight.\\n\\n[4] Conclusion\\nWe introduced AdaMem, a relevance-aware
      allocation framework for soft-compressed RAG. Instead of uniformly representing
      retained passages, AdaMem converts querydependent relevance scores into a non-uniform
      allocation of a fixed global memory budget, concentrating capacity on answer-bearing
      evidence while retaining limited capacity for complementary passages. The resulting
      allocation is the exact optimum of a proportional-fair objective under an assumed
      logarithmic utility model, and is a first-order approximation to the reverse-water-filling
      optimum of classical exponential-distortion bit allocation.\\nFigure 6: Optimal
      allocation temperature on TriviaQA across compression rates. The analytically
      predicted schedule ( \u03C4 \u221D B ( \u03C1 ) , anchored at 16 \xD7 ) follows
      the empirical optimum and consistently outperforms a fixed \u03C4 = 1 .\\nAdaMem
      establishes a new state of the art among softcompression methods across six
      evaluated QA benchmarks. At 16 \xD7 compression, it improves over baselines,
      the strongest prior soft-compression method, by an average of 3 . 4% in relative
      terms. The advantage becomes substantially larger as the memory budget decreases.
      At 64 \xD7 compression, the average relative improvement reaches 14 . 6% , with
      gains of up to 21 . 8% on HotpotQA. At 32 \xD7 , AdaMem exceeds OSCAR at 16
      \xD7 on every benchmark, achieving an average relative improvement of 2 . 9%
      . These results show that adaptive allocation is particularly effective under
      aggressive compression, where large retrieval pools must be represented within
      strict memory constraints.\\nFinally, we introduce KILT-SCR, a training and
      evaluation resource for the joint study of reranking and compression. Constructed
      to retain answer-bearing retrieved evidence and answer-consistent teacher targets,
      it enables controlled comparison of reranking and memory-allocation strategies
      over large candidate pools with heterogeneous passage utility.\\nSeveral future
      research directions remain open. The temperature could be learned or predicted
      per query rather than set per compression rate, allowing allocation sharpness
      to adapt to the confidence of the relevance estimates. The budget-allocation
      view itself is not specific to QA or memory embeddings and extends naturally
      to other bounded representations, such as KV-cache compression and long-context
      summarization.\\nAllal, L. B.; Lozhkov, A.; Bakouch, E.; Bl\xE1zquez, G. M.;
      Penedo, G.; Tunstall, L.; Marafioti, A.; Kydl\xED\u010Dek, H.; Lajar\xEDn, A.
      P.; Srivastav, V.; Lochner, J.; Fahlgren, C.; Nguyen, X.-S.; Fourrier, C.; Burtenshaw,
      B.; Larcher, H.; Zhao, H.; Zakka, C.; Morlon, M.; Raffel, C.; von Werra, L.;
      and Wolf, T. 2025. SmolLM2: When Smol Goes Big - Data-Centric Training of a
      Small Language Model. arXiv:2502.02737.\\n\\n[5] Introduction\\nMotivated by
      these limitations, we propose AdaMem , a framework that transforms reranking
      from binary selection into relevance-aware memory allocation. A shared compressor
      produces query-conditioned memories and scores; a principled softmax allocation,
      grounded in logarithmic utility theory, distributes a fixed total memory budget
      across passages according to their estimated utility. The temperature interpolates
      between uniform allocation and hard topk selection. Here are our main contributions:\\n-
      We introduce relevance-aware memory allocation for soft-compressed RAG: each
      document receives an adaptive memory budget determined by its estimated relevance
      (Figure 1), concentrating capacity on answer-bearing evidence while preserving
      compact representations for complementary context. This adaptivity makes AdaMem
      substantially more robust to extreme compression: between 16 \xD7 and 128 \xD7
      its quality degrades by only about 2%, compared with over 7% for uniform-allocation
      baselines such as OSCAR.\\n- Across six open-domain QA benchmarks, AdaMem outperforms
      every evaluated compression baseline at matched budgets: at 16 \xD7 it improves
      over uniform allocation by 3 . 4% on average (up to 5 . 5% ) and over the strongest
      hard-compression baseline by 9 . 7% despite an 8 \xD7 smaller context. Quality
      is also more stable under inference-time compression: moving from 16 \xD7 to
      64 \xD7 costs AdaMem 2 . 8% on average, against 12 . 2% for uniform allocation.
      At different compression rates, AdaMem retains up to 99% of full-context quality
      at 4 \xD7 lower latency.\\n- We release KILT-SCR (Soft Compression and Reranking),
      a large-candidate-pool resource for reranking and context compression, with
      25 passages per query, 196,916\\ntraining instances, and evaluation data from
      six QA benchmarks. The training split use answer-grounded filtration to ensure
      supporting retrieved evidence and goldconsistent generated targets.\\n\\nAnswer:
      Filtering the fine-tuning data (KILT-SCR) improves AdaMem's performance by an
      average of 1.7 points in Match (%) at compression rate 16, using 25 passages:
      Using 25 passages and a compression rate of 16, Table 2 shows that KILT-SCR
      improves performance by 1.7 points on average, indicating better alignment between
      relevance estimation and answer generation.\\n\\nBreaking this down per benchmark,
      per Table 2:\\n\\n| Training data | TriviaQA | NQ | HotpotQA |\\n|---|---|---|---|\\n|
      Unfiltered | 80.3 | 62.8 | 42.6 |\\n| Filtered | 82.8 | 63.3 | 44.5 |\\n| Difference
      | +2.5 | +0.6 | +2.0 |\\n\\nAs shown in the table, Unfiltered training yields
      80.3 on TriviaQA, 62.8 on NQ, and 42.6 on HotpotQA, while Filtered training
      yields 82.8, 63.3, and 44.5 respectively, with differences of +2.5, +0.6, and
      +2.0 points.\\n\\nPass only if every factual claim in the answer is stated in,
