        introduced AdaMem, a relevance-aware allocation framework for soft-compressed
        RAG. Instead of uniformly representing retained passages, AdaMem converts
        querydependent relevance scores into a non-uniform allocation of a fixed global
        memory budget, concentrating capacity on answer-bearing evidence while retaining
        limited capacity for complementary passages. The resulting allocation is the
        exact optimum of a proportional-fair objective under an assumed logarithmic
        utility model, and is a first-order approximation to the reverse-water-filling
        optimum of classical exponential-distortion bit allocation.\\nFigure 6: Optimal
        allocation temperature on TriviaQA across compression rates. The analytically
        predicted schedule ( \u03C4 \u221D B ( \u03C1 ) , anchored at 16 \xD7 ) follows
        the empirical optimum and consistently outperforms a fixed \u03C4 = 1 .\\nAdaMem
        establishes a new state of the art among softcompression methods across six
        evaluated QA benchmarks. At 16 \xD7 compression, it improves over baselines,
        the strongest prior soft-compression method, by an average of 3 . 4% in relative
        terms. The advantage becomes substantially larger as the memory budget decreases.
        At 64 \xD7 compression, the average relative improvement reaches 14 . 6% ,
        with gains of up to 21 . 8% on HotpotQA. At 32 \xD7 , AdaMem exceeds OSCAR
        at 16 \xD7 on every benchmark, achieving an average relative improvement of
        2 . 9% . These results show that adaptive allocation is particularly effective
        under aggressive compression, where large retrieval pools must be represented
        within strict memory constraints.\\nFinally, we introduce KILT-SCR, a training
        and evaluation resource for the joint study of reranking and compression.
        Constructed to retain answer-bearing retrieved evidence and answer-consistent
        teacher targets, it enables controlled comparison of reranking and memory-allocation
        strategies over large candidate pools with heterogeneous passage utility.\\nSeveral
        future research directions remain open. The temperature could be learned or
        predicted per query rather than set per compression rate, allowing allocation
        sharpness to adapt to the confidence of the relevance estimates. The budget-allocation
        view itself is not specific to QA or memory embeddings and extends naturally
        to other bounded representations, such as KV-cache compression and long-context
        summarization.\\nAllal, L. B.; Lozhkov, A.; Bakouch, E.; Bl\xE1zquez, G. M.;
        Penedo, G.; Tunstall, L.; Marafioti, A.; Kydl\xED\u010Dek, H.; Lajar\xEDn,
        A. P.; Srivastav, V.; Lochner, J.; Fahlgren, C.; Nguyen, X.-S.; Fourrier,
        C.; Burtenshaw, B.; Larcher, H.; Zhao, H.; Zakka, C.; Morlon, M.; Raffel,
        C.; von Werra, L.; and Wolf, T. 2025. SmolLM2: When Smol Goes Big - Data-Centric
        Training of a Small Language Model. arXiv:2502.02737.\",\"metadata\":{\"ingestion_version\":\"01a0fc53885372038a1c6d0df171e569\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d-text-0014\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d\",\"chunk_type\":\"text\",\"section_path\":\"Conclusion\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":80,\"page_no\":7,\"filename\":\"2609.22100v1.pdf\"}}},{\"id\":\"b23e9f67-cdcc-54fe-a4f0-6c338b605762\",\"version\":7,\"score\":0.4700718,\"payload\":{\"page_content\":\"D
        Judge Metrics\\nWe use Substring Match as the primary metric because it is
        deterministic and consistent with standard open-domain QA evaluation. However,
        it can overestimate answer quality when a model lists multiple candidate answers:
        the prediction receives full credit whenever it contains a gold-answer alias
        as a substring, even if the response is ambiguous, unsupported, or includes
        incorrect alternatives. We therefore additionally report LLM-as-a-judge scores,
        which evaluate the correctness of the generated answer in the context of the
        question and reference answer. The judge assigns a score of 1 for a correct
        answer, 0.5 for a partially correct answer, and 0 for a wrong answer; we report
        the mean score as a percentage. This complementary evaluation penalizes answer
        enumeration and verifies that improvements in Match correspond to genuinely
        correct answers rather than increased lexical overlap with the reference.\\nTable
        5: Training schedule for the three-stage procedure.\\n\\nStage 1, Examples
        = 2,000,000. Stage 1, Epochs = 1. Stage 2, Examples = 500,000. Stage 2, Epochs
        = 1. Stage 3 (KILT-SCR), Examples = 196,916. Stage 3 (KILT-SCR), Epochs =
        3\\nFor each example, we provide the judge with the question, the reference
        answer, and the model prediction. We use the following prompt:\\nSystem prompt:
        You are an evaluation tool. Answer with one of: 1: Correct, 0.5: Partially
        correct, 0: Wrong.\\nUser prompt: Here is a question, a golden answer, and
        an AI-generated answer. Can you judge whether the AIgenerated answer is correct
        according to the question and golden answer? Simply answer with one of: 1:
        Correct, 0.5: Partially correct, 0: Wrong.\\nQuestion:\\n{question}\\nGolden
        answer:\\n{answer}\\nGenerated answer: {prediction}\\nFigure 7 corroborates
        the Match-based robustness trends. At the training-time compression rate of
        16 \xD7 , AdaMem matches or exceeds OSCAR across all three benchmarks, improving
        by 1.8 points on TriviaQA and 2.4 points on NQ, while the methods are effectively
        tied on HotpotQA. The advantage grows under stronger inference-time compression.
        At 64 \xD7 , AdaMem exceeds OSCAR by 6.1 points on TriviaQA and NQ, and by
        7.1 points on HotpotQA. In contrast to OSCAR, AdaMem remains stable as the
        memory budget shrinks: its judge score decreases by only 0.9, 3.3, and 1.4
        points from 16 \xD7 to 64 \xD7 on TriviaQA, NQ, and HotpotQA, respectively,
        compared with drops of 5.2, 7.0, and 8.7 points for OSCAR. These results show
        that relevance-aware allocation preserves answer-critical information under
        severe compression, rather than merely improving lexical overlap with reference
        answers.\",\"metadata\":{\"ingestion_version\":\"01a0fc53885372038a1c6d0df171e569\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d-text-0026\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d\",\"chunk_type\":\"text\",\"section_path\":\"D
        Judge Metrics\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":148,\"page_no\":11,\"filename\":\"2609.22100v1.pdf\"}}},{\"id\":\"d38374ae-d6ab-58f2-ad34-e0f193d69594\",\"version\":7,\"score\":0.46585894,\"payload\":{\"page_content\":\"This
        is a line chart grid comparing two retrieval-augmented QA methods, OSCAR (red)
        and AdaMem (green), across three datasets (TriviaQA, NQ, HotpotQA) and three
        compression ratios (16x, 32x, 64x), forming a 3x3 panel layout. The x-axis
        in each subplot represents the number of retrieved documents (k = 5, 10, 15,
        20, 25), while the y-axis shows task performance scores (ranging roughly from
        36 to 84 depending on the dataset/compression level). Across nearly all panels,
        AdaMem consistently outperforms OSCAR, with the performance gap generally
        widening as compression increases (64x) and as more documents are retrieved,
