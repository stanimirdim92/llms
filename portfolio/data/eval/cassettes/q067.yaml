      Samuel Joseph Amouyal, Tomer Wolfson, Ohad Rubin, Ori Yoran, Jonathan Herzig,
      and Jonathan Berant. 2023. QAMPARI: An open-domain question answering benchmark
      for questions with many answers from multiple paragraphs. Preprint , arXiv:2205.12665.\n-
      Mingyang Chen, Linzhuang Sun, Tianpeng Li, Haoze Sun, Yijie Zhou, Chenzheng
      Zhu, Haofen Wang, Jeff Z. Pan, Wen Zhang, Huajun Chen, Fan Yang, Zenan Zhou,
      and Weipeng Chen. 2025. ReSearch: Learning to reason with search for LLMs via
      reinforcement learning. Preprint , arXiv:2503.19470.\n- Tianyu Gao, Howard Yen,
      Jiatong Yu, and Danqi Chen. 2023. Enabling large language models to generate
      text with citations. In Proceedings of the 2023 Conference on Empirical Methods
      in Natural Language Processing , pages 6465-6488, Singapore. Association for
