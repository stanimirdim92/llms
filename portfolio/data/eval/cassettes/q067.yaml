      [1.2, 4.8]    |    0.002 |", "This is a set of three line/scatter plots comparing
      context compression methods for retrieval-augmented generation, plotting \"Achieved
      context fraction\" (x-axis, reversed from 1.0 to 0.0) against three metrics:
      Grounded citation precision, Grounded citation recall, and Declared-evidence
      F1 (y-axes, 0.0 to 1.0 or 0.0 to 0.20 scales). Six methods are compared: Identity
      (full context, green dot at x=1.0), Extractive (orange), Rerank top-k (brown),
      ECR (blue), RECOMP (purple, near x=0), and LLMLingua-2 (red). ECR consistently
      achieves the highest precision and recall among compression methods across context
      fractions (~0.4-0.55), while LLMLingua-2 performs poorly (near 0.0-0.15) on
      citation precision/recall; for Declared-evidence F1, ECR and Extractive show
      increasing values (up to ~0.17) as context fraction decreases, outperforming
      Rerank top-k, which stays low (~0.05-0.08).", "6 Discussion\nHow to read the
      R-Search result. R-Search sits above its base on all four datasets and significantly
      above on the best-powered one, which is a real and consistent pattern. It is
      also one model, one base, one prompt, and one scorer, so four datasets are not
      four independent replications, and the effect softens under a stricter variant
      and a looser outcome. Two things would settle it: a cross-dataset test declared
      in advance, and an arm fine-tuned on the same data without RL, which would separate
      the contribution of RL from the contribution of fine-tuning on retrieval data
      at all.\nA note on cost. Everything here, four models, four datasets, three
      variants, both conditions, and the control that makes the comparison interpretable,
      ran on Kaggle''s T4 GPUs. Careful measurement was the cheap part of this project.
      The expensive part was reading the construction code closely enough to know
      which controls we did not have to run.", "This is a line chart grid comparing
      two retrieval-augmented QA methods, OSCAR (red) and AdaMem (green), across three
      datasets (TriviaQA, NQ, HotpotQA) and three compression ratios (16x, 32x, 64x),
      forming a 3x3 panel layout. The x-axis in each subplot represents the number
      of retrieved documents (k = 5, 10, 15, 20, 25), while the y-axis shows task
      performance scores (ranging roughly from 36 to 84 depending on the dataset/compression
      level). Across nearly all panels, AdaMem consistently outperforms OSCAR, with
      the performance gap generally widening as compression increases (64x) and as
      more documents are retrieved, demonstrating AdaMem''s superior robustness under
      higher compression and larger retrieval sets.", "References\n- Fabio Petroni,
      Aleksandra Piktus, Angela Fan, Patrick Lewis, Majid Yazdani, Nicola De Cao,
      James Thorne, Yacine Jernite, Vladimir Karpukhin, Jean Maillard, Vassilis Plachouras,
