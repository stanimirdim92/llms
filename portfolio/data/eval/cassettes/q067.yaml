        is a set of three line/scatter plots comparing context compression methods
        for retrieval-augmented generation, plotting \\\"Achieved context fraction\\\"
        (x-axis, reversed from 1.0 to 0.0) against three metrics: Grounded citation
        precision, Grounded citation recall, and Declared-evidence F1 (y-axes, 0.0
        to 1.0 or 0.0 to 0.20 scales). Six methods are compared: Identity (full context,
        green dot at x=1.0), Extractive (orange), Rerank top-k (brown), ECR (blue),
        RECOMP (purple, near x=0), and LLMLingua-2 (red). ECR consistently achieves
        the highest precision and recall among compression methods across context
        fractions (~0.4-0.55), while LLMLingua-2 performs poorly (near 0.0-0.15) on
        citation precision/recall; for Declared-evidence F1, ECR and Extractive show
        increasing values (up to ~0.17) as context fraction decreases, outperforming
        Rerank top-k, which stays low (~0.05-0.08).\",\"metadata\":{\"ingestion_version\":\"01a0fc54ff9a70d3af0e9b49e864b8b9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde-fig-006-01\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde\",\"chunk_type\":\"figure\",\"section_path\":\"\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":52,\"page_no\":6,\"filename\":\"2609.14245v1.pdf\",\"image_path\":\"/var/www/html/personal/llms/portfolio/data/processed/01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde/figures/fig-006-01-a0e259bb5c9608cc.png\"}}},{\"id\":\"eb9610c0-e536-5645-855d-f24b38ed799c\",\"version\":15,\"score\":0.5890784,\"payload\":{\"page_content\":\"6
        Discussion\\nHow to read the R-Search result. R-Search sits above its base
        on all four datasets and significantly above on the best-powered one, which
        is a real and consistent pattern. It is also one model, one base, one prompt,
        and one scorer, so four datasets are not four independent replications, and
        the effect softens under a stricter variant and a looser outcome. Two things
        would settle it: a cross-dataset test declared in advance, and an arm fine-tuned
        on the same data without RL, which would separate the contribution of RL from
        the contribution of fine-tuning on retrieval data at all.\\nA note on cost.
        Everything here, four models, four datasets, three variants, both conditions,
        and the control that makes the comparison interpretable, ran on Kaggle's T4
        GPUs. Careful measurement was the cheap part of this project. The expensive
        part was reading the construction code closely enough to know which controls
        we did not have to run.\",\"metadata\":{\"ingestion_version\":\"01a0fc55257f7276be70b7b3d1501b36\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6-text-0023\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6\",\"chunk_type\":\"text\",\"section_path\":\"6
