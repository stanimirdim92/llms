      0/61      |   +19.7 | [10.8, 31.3] |\n| RAGTruth  | 67/623    | 1/623     |   +10.6
      | [7.9, 13.5]  |", "References\n- Jonas Wallat, Maria Heuss, Maarten de Rijke,
      and Avishek Anand. 2025. Correctness is not faithfulness in retrieval augmented
      generation attributions. In Proceedings of the 2025 International ACM SIGIR
      Conference on Innovative Concepts and Theories in Information Retrieval , ICTIR
      ''25, pages 2232. Association for Computing Machinery.\n- Sarah Wiegreffe and
      Yuval Pinter. 2019. Attention is not not explanation. In Proceedings of the
      2019 Conference on Empirical Methods in Natural Language Processing and the
      9th International Joint Conference on Natural Language Processing (EMNLPIJCNLP)
      , pages 11-20, Hong Kong, China. Association for Computational Linguistics.\n-
      Adina Williams, Nikita Nangia, and Samuel R. Bowman. 2018. A broad-coverage
      challenge corpus for sentence understanding through inference. In Proceedings
      of the 2018 Conference of the North American Chapter of the Association for
      Computational Linguistics: Human Language Technologies,\nVolume 1 (Long Papers)
      , pages 1112-1122, New Orleans, Louisiana. Association for Computational Linguistics.\n-
      Theodora Worledge, Tatsunori Hashimoto, and Carlos Guestrin. 2024. The extractive-abstractive
      spectrum: Uncovering verifiability trade-offs in LLM generations. Preprint ,
      arXiv:2411.17375.\n- Fangyuan Xu, Weijia Shi, and Eunsol Choi. 2024. RECOMP:
      Improving retrieval-augmented LMs with compression and selective augmentation.
      In International Conference on Learning Representations .\n- Jiajie Zhang, Yushi
      Bai, Xin Lv, Wanjun Gu, Danqing Liu, Minhao Zou, Shulin Cao, Lei Hou, Yuxiao
      Dong, Ling Feng, and Juanzi Li. 2025. LongCite: Enabling LLMs to generate fine-grained
      citations in long-context QA. In Findings of the Association for Computational
      Linguistics: ACL 2025 , pages 5098-5122, Vienna, Austria. Association for Computational
      Linguistics.\n- Yuan Zhang, Jason Baldridge, and Luheng He. 2019. PAWS: Paraphrase
      adversaries from word scrambling. In Proceedings of the 2019 Conference of the
      North American Chapter of the Association for Computational Linguistics: Human
      Language Technologies, Volume 1 (Long and Short Papers) , pages 1298-1308, Minneapolis,
      Minnesota. Association for Computational Linguistics.\n- Qiming Zhu, Shunian
      Chen, Rui Yu, Zhehao Wu, and Benyou Wang. 2026. From lossy to verified: A provenance-aware
      tiered memory for agents. Preprint , arXiv:2602.17913.", "D Judge Metrics\nWe
      use Substring Match as the primary metric because it is deterministic and consistent
      with standard open-domain QA evaluation. However, it can overestimate answer
      quality when a model lists multiple candidate answers: the prediction receives
      full credit whenever it contains a gold-answer alias as a substring, even if
      the response is ambiguous, unsupported, or includes incorrect alternatives.
      We therefore additionally report LLM-as-a-judge scores, which evaluate the correctness
      of the generated answer in the context of the question and reference answer.
      The judge assigns a score of 1 for a correct answer, 0.5 for a partially correct
      answer, and 0 for a wrong answer; we report the mean score as a percentage.
      This complementary evaluation penalizes answer enumeration and verifies that
      improvements in Match correspond to genuinely correct answers rather than increased
      lexical overlap with the reference.\nTable 5: Training schedule for the three-stage
      procedure.\n\nStage 1, Examples = 2,000,000. Stage 1, Epochs = 1. Stage 2, Examples
      = 500,000. Stage 2, Epochs = 1. Stage 3 (KILT-SCR), Examples = 196,916. Stage
      3 (KILT-SCR), Epochs = 3\nFor each example, we provide the judge with the question,
      the reference answer, and the model prediction. We use the following prompt:\nSystem
      prompt: You are an evaluation tool. Answer with one of: 1: Correct, 0.5: Partially
      correct, 0: Wrong.\nUser prompt: Here is a question, a golden answer, and an
      AI-generated answer. Can you judge whether the AIgenerated answer is correct
      according to the question and golden answer? Simply answer with one of: 1: Correct,
      0.5: Partially correct, 0: Wrong.\nQuestion:\n{question}\nGolden answer:\n{answer}\nGenerated
      answer: {prediction}\nFigure 7 corroborates the Match-based robustness trends.
      At the training-time compression rate of 16 \u00d7 , AdaMem matches or exceeds
      OSCAR across all three benchmarks, improving by 1.8 points on TriviaQA and 2.4
      points on NQ, while the methods are effectively tied on HotpotQA. The advantage
      grows under stronger inference-time compression. At 64 \u00d7 , AdaMem exceeds
      OSCAR by 6.1 points on TriviaQA and NQ, and by 7.1 points on HotpotQA. In contrast
      to OSCAR, AdaMem remains stable as the memory budget shrinks: its judge score
      decreases by only 0.9, 3.3, and 1.4 points from 16 \u00d7 to 64 \u00d7 on TriviaQA,
      NQ, and HotpotQA, respectively, compared with drops of 5.2, 7.0, and 8.7 points
      for OSCAR. These results show that relevance-aware allocation preserves answer-critical
      information under severe compression, rather than merely improving lexical overlap
      with reference answers.", "Experiments and Results\nEfficiency-Performance Tradeoff.
      Figure 5 relates TriviaQA Match to per-query inference latency across compression
      rates (theoretical optimal \u03c4 is used) . AdaMem operates at the same low
      latency as prior soft compression while delivering uncompressed-quality answers
      roughly 4 \u00d7 more efficiently than Full Context: at 32 \u00d7 compression
      it matches Full Context quality (84.4 Match) at 4 . 0 \u00d7 lower latency and
      3 . 6 \u00d7 less compute. The two methods also trade quality for speed in sharply
      different ways. Lowering the budget moves OSCAR down a steep curve, losing 5.3
      Match points between 16 \u00d7 and 64 \u00d7 compression, whereas AdaMem stays
      within 0.5 points over the same range: relevance-aware allocation converts compression
      into latency savings almost without quality cost. As a result, AdaMem at 64
      \u00d7 is both faster and more accurate than uniform compression at 16 \u00d7
      . Appendix B provides additional efficiency discussion with detailed measurements,
      including throughput, compute, and memory information.\nEffect of Training-Data
      Filtering. We evaluate the impact of filtered fine-tuning data. KILT-SCR retains
      instances where the retrieved pool contains a gold-answer alias and the teacher
      target is answer-consistent, reducing noise in both retrieval supervision and
      generation targets.\nFor a controlled comparison, we train the same AdaMem model
      for one epoch on either filtered or unfiltered data under identical settings.
      Using 25 passages and a compression rate of 16, Table 2 shows that KILT-SCR
      improves performance by 1.7 points on average, indicating better alignment between
      relevance estimation and answer generation.\nAblation of Training Stages. Table
      3 ablates the contribution of the three training stages. Removing Stage 1 causes
      the largest performance drop across all datasets, particularly on NQandHotpotQA.Thisresultshowsthatdirectly
      optimizing query-dependent generation and relevance-supervision objectives is
      insufficient to learn effective continuous passage representations from scratch.
      Removing either Stage 2 or Stage 3 produces smaller but consistent degradations.
      Without Stage 2, the model loses the intermediate adaptation from generic soft
      compression to query-conditioned evidence representation. Without Stage 3, it
      is not optimized for relevance estimation and memory allocation over the full
      retrieved candidate pools used at inference time.\nTable 2: Effect of filtered
      fine-tuning data on Match (%) at compression rate 16. Both models are trained
      for one epoch.\n\nUnfiltered, TriviaQA = 80.3. Unfiltered, NQ = 62.8. Unfiltered,
      HotpotQA = 42.6. Filtered, TriviaQA = 82.8. Filtered, NQ = 63.3. Filtered, HotpotQA
      = 44.5. Difference, TriviaQA = +2.5. Difference, NQ = +0.6. Difference, HotpotQA
      = +2.0", "Experiments and Results\nFinally, at 16 \u00d7 , AdaMem closely approaches
      Full Context performance despite replacing the retrieved text with a substantially
      shorter continuous representation. On TriviaQA, it is within 0.4 points of Full
      Context, while on PopQA it exceeds Full Context by 1.4 points. Hence, selective
      memory allocation can both reduce computational cost and mitigate interference
      from irrelevant retrieved passages.\nFigure 4: Memory-token allocation by document
      relevance rank at 64 \u00d7 compression. The dashed line denotes OSCAR''s fixed
      16 \u00d7 allocation.\nMemory Allocation Behavior. Figure 4 illustrates the
      allocation mechanism under this highly constrained 64 \u00d7 setting. For the
      most relevant documents, AdaMem allocates a median of roughly 10 memory tokens,
      already exceeding OSCAR''s fixed budget of 9 tokens per document at 16 \u00d7
      . The 90th percentile is substantially higher, indicating that for some queries,
      AdaMem assigns considerably more capacity to the most relevant document. In
      contrast, the allocation decreases sharply with relevance rank and approaches
      zero for lower-ranked documents. Thus, AdaMem concentrates capacity on query-relevant
      evidence while assigning minimal capacity to noisy passages, reducing their
      potential interference in the compressed context.\nRobustness to Retrieval Depth
      and Compression. Figure 3 compares AdaMem and OSCAR across retrieval depths
      k \u2208 { 5 , 10 , 15 , 20 , 25 } and compression ratios of 16 \u00d7 , 32
      \u00d7 , and 64 \u00d7 at \u03c4 =1. AdaMem benefits more consistently from
      deeper retrieval, whereas OSCAR remains nearly constant as additional lower-ranked
      documents are introduced.\nThis difference is most pronounced under aggressive
      compression. At 64 \u00d7 , increasing k from 5 to 25 improves AdaMem by 3.5
      points on TriviaQA, 5.4 on Natural Questions, and 4.2 on HotpotQA, while OSCAR
      changes only marginally over the same range. A similar pattern holds at 32 \u00d7
      , particularly on Natural Questions and HotpotQA.\nThese results suggest that
      AdaMem can extract useful evidence from less-relevant documents without allocating
      them the same budget as highly relevant ones. In contrast, OSCAR''s fixed per-document
      allocation provides limited benefit from deeper retrieval, as its representation
      capacity is uniformly spread over an increasingly noisy document set. The effect
      is weaker at 16 \u00d7 , where both methods have sufficient capacity for shallow
      retrieval pools, but becomes increasingly clear as the memory budget is reduced.\nFigure
      5: Quality-latency tradeoff on TriviaQA. AdaMem shows similar latency as OSCAR
      and matches Full Context quality at 4 . 0 \u00d7 lower latency.", "Abstract\nContext
      compression reduces generator input in retrieval-augmented generation, but answer
      quality alone does not characterize citation attribution. We measure citation
      attribution across compression methods and budgets, comparing reranking, extractive
      selection, abstractive summarization, token pruning, and an extract-cluster-rewrite
      construction on ASQA and QASPER under a fixed generator and primary entailment
      evaluator. On ASQA at a nominal 0.25 budget (achieved compression 0.08), a RECOMP-style
      compressor''s citations score 0.86 precision against its summaries but 0.12
      against source spans under our re-attributability protocol. These estimates
      depend on a shared NLI model for span recovery and citation scoring and lack
      independent human calibration. Extractive selection''s observed grounded precision
      ranges from 0.43 to 0.49 across nominal budgets from one-half to one-tenth of
      the ASQA context, while answer quality declines. For the same RECOMP setting,
      claim verification after source recovery yields an unsupported rate of 0.88
      versus 0.17 when checking summaries. This gap persists beyond structural rejection
      of missing provenance, but remains evaluator-dependent. A 200-question TRUE
      T5-XXL audit also finds emitted-grounded gaps under both fixed and recomputed
      source mappings, without establishing human-calibrated support rates.", "Table
      2: Models (top) and datasets (bottom). All four models share the Qwen2.5-7B-Instruct
      base. Passages is the number of roughly 100-token chunks in each retrieval index.\n\n|
      Model     | Training on top of the base   |\n|-----------|-------------------------------|\n|
      Baseline  | none (Qwen2.5-7B-Instruct)    |\n| Search-R1 | RLVR with PPO                 |\n|
      ReSearch  | RLVR with GRPO                |\n| R-Search  | RLVR with GRPO                |"],
      "model": "rerank-2.5", "top_k": 30, "truncation": true}'
