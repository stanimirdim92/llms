        Judge Metrics\\nWe use Substring Match as the primary metric because it is
        deterministic and consistent with standard open-domain QA evaluation. However,
        it can overestimate answer quality when a model lists multiple candidate answers:
        the prediction receives full credit whenever it contains a gold-answer alias
        as a substring, even if the response is ambiguous, unsupported, or includes
        incorrect alternatives. We therefore additionally report LLM-as-a-judge scores,
        which evaluate the correctness of the generated answer in the context of the
        question and reference answer. The judge assigns a score of 1 for a correct
        answer, 0.5 for a partially correct answer, and 0 for a wrong answer; we report
        the mean score as a percentage. This complementary evaluation penalizes answer
        enumeration and verifies that improvements in Match correspond to genuinely
        correct answers rather than increased lexical overlap with the reference.\\nTable
        5: Training schedule for the three-stage procedure.\\n\\nStage 1, Examples
        = 2,000,000. Stage 1, Epochs = 1. Stage 2, Examples = 500,000. Stage 2, Epochs
        = 1. Stage 3 (KILT-SCR), Examples = 196,916. Stage 3 (KILT-SCR), Epochs =
        3\\nFor each example, we provide the judge with the question, the reference
        answer, and the model prediction. We use the following prompt:\\nSystem prompt:
        You are an evaluation tool. Answer with one of: 1: Correct, 0.5: Partially
        correct, 0: Wrong.\\nUser prompt: Here is a question, a golden answer, and
        an AI-generated answer. Can you judge whether the AIgenerated answer is correct
        according to the question and golden answer? Simply answer with one of: 1:
        Correct, 0.5: Partially correct, 0: Wrong.\\nQuestion:\\n{question}\\nGolden
        answer:\\n{answer}\\nGenerated answer: {prediction}\\nFigure 7 corroborates
        the Match-based robustness trends. At the training-time compression rate of
        16 \xD7 , AdaMem matches or exceeds OSCAR across all three benchmarks, improving
        by 1.8 points on TriviaQA and 2.4 points on NQ, while the methods are effectively
        tied on HotpotQA. The advantage grows under stronger inference-time compression.
        At 64 \xD7 , AdaMem exceeds OSCAR by 6.1 points on TriviaQA and NQ, and by
        7.1 points on HotpotQA. In contrast to OSCAR, AdaMem remains stable as the
        memory budget shrinks: its judge score decreases by only 0.9, 3.3, and 1.4
        points from 16 \xD7 to 64 \xD7 on TriviaQA, NQ, and HotpotQA, respectively,
        compared with drops of 5.2, 7.0, and 8.7 points for OSCAR. These results show
        that relevance-aware allocation preserves answer-critical information under
        severe compression, rather than merely improving lexical overlap with reference
        answers.\",\"metadata\":{\"ingestion_version\":\"01a0fc53885372038a1c6d0df171e569\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d-text-0026\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d\",\"chunk_type\":\"text\",\"section_path\":\"D
        Judge Metrics\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":148,\"page_no\":11,\"filename\":\"2609.22100v1.pdf\"}}},{\"id\":\"212db6cd-800c-5025-8b59-1b2eeb918b24\",\"version\":7,\"score\":0.52393043,\"payload\":{\"page_content\":\"Experiments
        and Results\\nEfficiency-Performance Tradeoff. Figure 5 relates TriviaQA Match
        to per-query inference latency across compression rates (theoretical optimal
        \u03C4 is used) . AdaMem operates at the same low latency as prior soft compression
        while delivering uncompressed-quality answers roughly 4 \xD7 more efficiently
        than Full Context: at 32 \xD7 compression it matches Full Context quality
        (84.4 Match) at 4 . 0 \xD7 lower latency and 3 . 6 \xD7 less compute. The
        two methods also trade quality for speed in sharply different ways. Lowering
        the budget moves OSCAR down a steep curve, losing 5.3 Match points between
        16 \xD7 and 64 \xD7 compression, whereas AdaMem stays within 0.5 points over
        the same range: relevance-aware allocation converts compression into latency
        savings almost without quality cost. As a result, AdaMem at 64 \xD7 is both
        faster and more accurate than uniform compression at 16 \xD7 . Appendix B
        provides additional efficiency discussion with detailed measurements, including
        throughput, compute, and memory information.\\nEffect of Training-Data Filtering.
        We evaluate the impact of filtered fine-tuning data. KILT-SCR retains instances
        where the retrieved pool contains a gold-answer alias and the teacher target
        is answer-consistent, reducing noise in both retrieval supervision and generation
        targets.\\nFor a controlled comparison, we train the same AdaMem model for
        one epoch on either filtered or unfiltered data under identical settings.
        Using 25 passages and a compression rate of 16, Table 2 shows that KILT-SCR
        improves performance by 1.7 points on average, indicating better alignment
        between relevance estimation and answer generation.\\nAblation of Training
        Stages. Table 3 ablates the contribution of the three training stages. Removing
        Stage 1 causes the largest performance drop across all datasets, particularly
        on NQandHotpotQA.Thisresultshowsthatdirectly optimizing query-dependent generation
        and relevance-supervision objectives is insufficient to learn effective continuous
        passage representations from scratch. Removing either Stage 2 or Stage 3 produces
        smaller but consistent degradations. Without Stage 2, the model loses the
        intermediate adaptation from generic soft compression to query-conditioned
        evidence representation. Without Stage 3, it is not optimized for relevance
        estimation and memory allocation over the full retrieved candidate pools used
        at inference time.\\nTable 2: Effect of filtered fine-tuning data on Match
        (%) at compression rate 16. Both models are trained for one epoch.\\n\\nUnfiltered,
        TriviaQA = 80.3. Unfiltered, NQ = 62.8. Unfiltered, HotpotQA = 42.6. Filtered,
        TriviaQA = 82.8. Filtered, NQ = 63.3. Filtered, HotpotQA = 44.5. Difference,
        TriviaQA = +2.5. Difference, NQ = +0.6. Difference, HotpotQA = +2.0\",\"metadata\":{\"ingestion_version\":\"01a0fc53885372038a1c6d0df171e569\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d-text-0012\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d\",\"chunk_type\":\"text\",\"section_path\":\"Experiments
        and Results\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":67,\"page_no\":6,\"filename\":\"2609.22100v1.pdf\"}}},{\"id\":\"09d71dcc-3870-588d-8449-c5583e657121\",\"version\":7,\"score\":0.5235431,\"payload\":{\"page_content\":\"Experiments
        and Results\\nFinally, at 16 \xD7 , AdaMem closely approaches Full Context
        performance despite replacing the retrieved text with a substantially shorter
        continuous representation. On TriviaQA, it is within 0.4 points of Full Context,
        while on PopQA it exceeds Full Context by 1.4 points. Hence, selective memory
        allocation can both reduce computational cost and mitigate interference from
        irrelevant retrieved passages.\\nFigure 4: Memory-token allocation by document
        relevance rank at 64 \xD7 compression. The dashed line denotes OSCAR's fixed
        16 \xD7 allocation.\\nMemory Allocation Behavior. Figure 4 illustrates the
        allocation mechanism under this highly constrained 64 \xD7 setting. For the
        most relevant documents, AdaMem allocates a median of roughly 10 memory tokens,
        already exceeding OSCAR's fixed budget of 9 tokens per document at 16 \xD7
        . The 90th percentile is substantially higher, indicating that for some queries,
        AdaMem assigns considerably more capacity to the most relevant document. In
        contrast, the allocation decreases sharply with relevance rank and approaches
        zero for lower-ranked documents. Thus, AdaMem concentrates capacity on query-relevant
        evidence while assigning minimal capacity to noisy passages, reducing their
        potential interference in the compressed context.\\nRobustness to Retrieval
        Depth and Compression. Figure 3 compares AdaMem and OSCAR across retrieval
        depths k \u2208 { 5 , 10 , 15 , 20 , 25 } and compression ratios of 16 \xD7
        , 32 \xD7 , and 64 \xD7 at \u03C4 =1. AdaMem benefits more consistently from
        deeper retrieval, whereas OSCAR remains nearly constant as additional lower-ranked
        documents are introduced.\\nThis difference is most pronounced under aggressive
        compression. At 64 \xD7 , increasing k from 5 to 25 improves AdaMem by 3.5
        points on TriviaQA, 5.4 on Natural Questions, and 4.2 on HotpotQA, while OSCAR
        changes only marginally over the same range. A similar pattern holds at 32
        \xD7 , particularly on Natural Questions and HotpotQA.\\nThese results suggest
        that AdaMem can extract useful evidence from less-relevant documents without
        allocating them the same budget as highly relevant ones. In contrast, OSCAR's
        fixed per-document allocation provides limited benefit from deeper retrieval,
        as its representation capacity is uniformly spread over an increasingly noisy
        document set. The effect is weaker at 16 \xD7 , where both methods have sufficient
        capacity for shallow retrieval pools, but becomes increasingly clear as the
        memory budget is reduced.\\nFigure 5: Quality-latency tradeoff on TriviaQA.
        AdaMem shows similar latency as OSCAR and matches Full Context quality at
        4 . 0 \xD7 lower latency.\",\"metadata\":{\"ingestion_version\":\"01a0fc53885372038a1c6d0df171e569\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d-text-0011\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d\",\"chunk_type\":\"text\",\"section_path\":\"Experiments
        and Results\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":58,\"page_no\":6,\"filename\":\"2609.22100v1.pdf\"}}},{\"id\":\"77f26e0a-bd5e-5a63-a1d7-18e0907f7612\",\"version\":13,\"score\":0.5228633,\"payload\":{\"page_content\":\"Abstract\\nContext
        compression reduces generator input in retrieval-augmented generation, but
        answer quality alone does not characterize citation attribution. We measure
        citation attribution across compression methods and budgets, comparing reranking,
        extractive selection, abstractive summarization, token pruning, and an extract-cluster-rewrite
        construction on ASQA and QASPER under a fixed generator and primary entailment
        evaluator. On ASQA at a nominal 0.25 budget (achieved compression 0.08), a
        RECOMP-style compressor's citations score 0.86 precision against its summaries
        but 0.12 against source spans under our re-attributability protocol. These
        estimates depend on a shared NLI model for span recovery and citation scoring
        and lack independent human calibration. Extractive selection's observed grounded
        precision ranges from 0.43 to 0.49 across nominal budgets from one-half to
        one-tenth of the ASQA context, while answer quality declines. For the same
        RECOMP setting, claim verification after source recovery yields an unsupported
        rate of 0.88 versus 0.17 when checking summaries. This gap persists beyond
        structural rejection of missing provenance, but remains evaluator-dependent.
        A 200-question TRUE T5-XXL audit also finds emitted-grounded gaps under both
        fixed and recomputed source mappings, without establishing human-calibrated
        support rates.\",\"metadata\":{\"ingestion_version\":\"01a0fc54ff9a70d3af0e9b49e864b8b9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde-text-0001\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde\",\"chunk_type\":\"text\",\"section_path\":\"Abstract\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":4,\"page_no\":1,\"filename\":\"2609.14245v1.pdf\"}}},{\"id\":\"1df13bef-a99e-5d3a-830d-9ec4a48104ba\",\"version\":15,\"score\":0.52113646,\"payload\":{\"page_content\":\"Table
