      prompting (Gao et al., 2023). Primary entailment judgments use the development-grade
      DeBERTa NLI evaluator of \xA73.1 at \u03C4 = 0 . 5 . We compare six compressors:
      identity (no compression; documentlevel on ASQA, paragraph-level on QASPER),
