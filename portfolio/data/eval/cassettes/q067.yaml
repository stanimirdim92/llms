      Xu, Daren Zha, and Limin Liu. 2025. R-Search: Empowering LLM reasoning with
      search via multi-reward reinforcement learning. Preprint , arXiv:2506.04185.",
      "3.2 Emitted vs. Grounded Citations\nWescore every run under two views. We write
      precision as P and recall as R , with subscripts e for emitted and g for grounded.
      Emitted scores citations against the unit texts the generator actually saw;
      it measures consistency with the compressed context, and is what one implicitly
      measures when compressed units are treated as citable documents. Grounded fi
      rst resolves each citation to retrieved source spans and scores against those.
      Units with declared provenance resolve to their declared sids. Units without
      declared provenance pass through our re-attributability protocol: rank source
      snippets by lexical similarity to the unit, run NLI on the top 10 candidates,
      and keep those judged to individually entail the unit at \u03c4 . A citation
      with no recovered span receives no precision credit and cannot support recall
      under this protocol. The reattribution rate is the fraction of units without
      declared provenance with at least one recovered span, averaged across examples.\nEvaluator
      dependence. The same NLI model filters recovered spans and scores citation support,
      creating a circularity risk: selection and evaluation errors can be correlated.
      Lexical retrieval can miss paraphrases, and the single-snippet test can reject
      units supported only by combined evidence. Thus failed recovery does not establish
      that support is absent from the source, and the direction of overall scoring
      bias is unknown. Appendix C reports a second-evaluator sensitivity check; human
      calibration remains absent.\nThe emitted -grounded gap is an operational diagnostic
      of attribution laundering : claims receive credit against compressed text that
      is not supported through the source mappings accepted by our protocol. It does
      not by itself distinguish missing evidence from recovery or NLI errors.\nNominal
      vs. achieved compression. Budgets are nominal fractions { 0 . 5 , 0 . 25 , 0
      . 1 , 0 . 05 } of each example''s retrieved context, enforced in generator-tokenizer
      tokens. Extractive families track their budgets closely, but abstractive compressors
      emit what their decoder emits: RECOMP realizes achieved ratios of 0 . 05 -0
      . 08 on ASQA and \u2248 0 . 015 on QASPER across all four nominal budgets-distinct
      nominal operating points collapse together. All curves therefore use the achieved
      ratio on the compression axis; plotting against nominal budgets would misplace
      abstractive systems by more than an order of magnitude in the worst case.",
      "4.1 Experimental Setup\nWe evaluate on two attribution benchmarks with different
      retrieval granularities. ASQA comprises 948 ambiguous factoid questions from
      the ALCE release (Gao et al., 2023), each paired with the top-5 GTR-retrieved
      passages, sentencesegmented into citable snippets; answer quality is string
      exact match (str-EM). QASPER (Dasigi et al., 2021) is the 1,005-question dev
      split over 281 NLP papers, using each supplied paper''s abstract and full text.
      Gold evidence is paragraphlevel, so identity presents paragraphs as citable
      units while compressors operate on sentence snippets; declared sids map to paragraphs
      for setF1 against gold evidence, max over annotators. The generator is Qwen2.5-7B-Instruct
      served via vLLM with greedy decoding and ALCE-style numbered-context citation
      prompting (Gao et al., 2023). Primary entailment judgments use the development-grade
      DeBERTa NLI evaluator of \u00a73.1 at \u03c4 = 0 . 5 . We compare six compressors:
      identity (no compression; documentlevel on ASQA, paragraph-level on QASPER),
      cross-encoder rerank topk (ms-marco-MiniLML-6-v2), embedding-based extractive
      sentence selection (all-MiniLM-L6-v2), the RECOMP abstractive summarizer (NQ
      checkpoint) (Xu et al., 2024), LLMLingua-2 token pruning (Pan et al., 2024),
      and our extract-cluster-rewrite (ECR) variant, which ranks sentences, greedily
      clusters nearduplicates by Jaccard word overlap (threshold 0.5, with a negation
      guard), and emits one unit per cluster-the highest-relevance member sentence
      verbatim-citing all member sentence ids. Although LLMLingua-2 prunes tokens
      verbatim, its output is a token stream with no unit-level sid mapping in our
      pipeline, so it declares no provenance and is scored with the no-provenance
      family alongside RECOMP. Each compressor runs at nominal budgets { 0 . 5 , 0
      . 25 , 0 . 1 , 0 . 05 } of the retrieved context, enforced in generator-tokenizer
      tokens. Because compressors do not reliably hit their nominal budgets, the frontier
      figures and primary summary tables report the achieved ratio: RECOMP''s summary
      length is nearly budget-independent, saturating at achieved ratios of 0.05-0.08
      on ASQA and \u2248 0.015 on QASPER across all four nominal budgets. All primary
      comparisons use the same successful questions across all 21 settings: 944 on
      ASQA and 976 from 271 papers on QASPER. Only identity has failures: 4 budget-check
      failures on ASQA, and 15 budget-check plus 14 promptoverflow failures on QASPER;
      their question IDs are excluded from every primary setting. Fullcohort descriptive
      aggregates remain available in the evaluation artifacts.", "5.3 RLVR does not
      make citations more faithful\nIt does not. Search-R1 moves by -1.2, +4.3, -0.9,
      and +1.3pp across the four datasets; ReSearch by +0.1, -1.6, -1.2, and +0.8pp.
      Both wander around zero with no pattern, every interval covers zero, and the
      smallest Holm-adjusted p -value in either row is 0.267, nowhere near signif-
      icance. Set that against our detection bound: with 80% power at about 7pp, an
      improvement of that size would have been hard to miss, and nothing close to
      it appears. Training these agents to produce verifiably correct answers moved
      their citation faithfulness by an amount we cannot distinguish from nothing.\nThat
      result is less surprising once you look at what the reward measures. RLVR compares
      the final answer with a reference and pays out accordingly; R-Search also rewards
      steps along its search trajectory. No term anywhere in these objectives asks
      whether the citation attached to a sentence is the passage that produced it.
      Citing the wrong passage is free, so the behavior the agents inherit from Qwen2.5-7B-Instruct
      rides through training untouched.", "Table 11: Precision on the same sampled
      saved answers: 100 ASQA (A) and 100 QASPER (Q) questions (84 QASPER papers).
      P e /P g : emitted/grounded precision. Mappings and evaluation details follow
