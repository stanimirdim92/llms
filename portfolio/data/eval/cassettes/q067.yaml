        Post-rationalization is common\\nTable 4 gives the attributable rate on REL-UNCITED
        for every model and dataset. Start with the baseline column: 14.0% on NQ,
        9.1% on QAMPARI, 14.8% on HAGRID, 2.9% on RAGTruth, with confidence intervals
        of [10.4, 17.8], [6.2, 12.0], [11.8, 18.2] and [1.8, 3.9] that all sit clear
        of zero. This clears the bar we set in advance, at least 8pp with an interval
        excluding zero on three of four datasets. On the Wikipedia-based datasets
        that rate means roughly one cited sentence in seven points at a passage whose
        only tie to the claim is four words we pasted in. Pooling across datasets
        gives 10.7%. 1\\nTable 4: How often each model follows the planted span: attributable
        rate on REL-UNCITED in %, with cited records over all records below. The control
        is 0 in every cell, so these equal the raw rates. Baseline 95% CIs: NQ [10.4,
        17.8], QAMPARI [6.2, 12.0], HAGRID [11.8, 18.2], RAGTruth [1.8, 3.9].\\n\\nNQ,
        Baseline = 14.0 52/371. NQ, Search-R1 = 12.8 36/281. NQ, ReSearch = 14.1 50/355.
        NQ, R-Search = 14.7 57/387. QAMPARI, Baseline = 9.1 29/319. QAMPARI, Search-R1
        = 13.4 38/283. QAMPARI, ReSearch = 7.5 25/332. QAMPARI, R-Search = 12.2 43/352.
        HAGRID, Baseline = 14.8 64/433. HAGRID, Search-R1 = 13.8 53/383. HAGRID, ReSearch
        = 13.6 59/434. HAGRID, R-Search = 18.6 80/430. RAGTruth, Baseline = 2.9 25/864.
        RAGTruth, Search-R1 = 4.1 29/699. RAGTruth, ReSearch = 3.6 30/823. RAGTruth,
        R-Search = 5.9 52/879\\nNow read across the rows. On NQ the four models land
        at 14.0, 12.8, 14.1, and 14.7%. On HAGRID, 14.8, 13.8, 13.6, and 18.6%. On
        RAGTruth, 2.9, 4.1, 3.6, and 5.9%. The agents track their base model, not
        each other's training recipes, and all sixteen cells sit far above zero. Post-rationalization
        is not something RL introduced; it is already there in the instruction-tuned
        model and it survives everything done on top.\\n1 Pooling was not part of
        our pre-registered plan, so treat this number as exploratory.\",\"metadata\":{\"ingestion_version\":\"01a0fc55257f7276be70b7b3d1501b36\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6-text-0016\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6\",\"chunk_type\":\"text\",\"section_path\":\"5.2
