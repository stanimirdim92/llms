        Results\\n0.42 across achieved ratios 0.51, 0.26, 0.11, and 0.06. Relative
        to identity, precision is lower at nominal 0.50 and 0.05 ( p H = 0 . 0148
        ); the intermediate differences are unresolved ( p H = 1 ), not evidence of
        preservation. Its str-EM decreases from identity's 0.34 through 0.32, 0.26,
        and 0.19 to 0.15, with every adjacent decrease supported ( p H = 0 . 0148
        ). ASQA reranking at nominal 0.25 increases precision from 0.51 to 0.69 (
        \u2206 = 0 . 184 , CI [0.149, 0.219], p H = 0 . 0148 ), while recall rises
        from 0.56 to 0.63 and str-EM falls from 0.34 to 0.25 (both p H = 0 . 0148
        ). The corresponding QASPER precision difference is negative ( \u2206 = -0
        . 089 , CI [ -0 . 124 , -0 . 052 ], p H = 0 . 0148 ). These dataset-specific
        results do not isolate a causal effect of citation granularity.\\nDeclared
        provenance determines verification coverage (H4). Table 1 contrasts declared-span
        and summary checking. For RECOMP on ASQA the unsupported rates are 1.00 and
        0.17, respectively; the corresponding QASPER values are 1.00 and 0.50. LLMLingua-2
        has rates of 1.00 vs. 0.51 on ASQA and 1.00 vs. 0.65 on QASPER. Every 1 .
        00 here is structural: no declared source evidence reaches the span verifier,
        so claims fail without an entailment judgment. These values do not establish
        that all claims lack recoverable source support. Recovered-source verification
        now supplies a direct claim-level comparison: for RECOMP, unsupported rates
        are 0.88 on ASQA and 0.95 on QASPER. Their paired differences from summary
        checking are 0.712 (CI [0.683, 0.739]) and 0.450 [0.417, 0.483], both p H
        = 0 . 0148 . LLMLingua-2's recovered-source rates are 0.90 and 0.91, with
        differences 0.394 [0.362, 0.426] and 0.253 [0.225, 0.282] (both p H = 0 .
        0148 ). These gaps persist when recovery is attempted, but remain conditional
        on the bounded search and shared NLI evaluator. For provenance-declaring methods,
        displayed rate differences are below 0.01 in magnitude; no mode comparison
        survives Holm correction, which does not establish equivalence.\",\"metadata\":{\"ingestion_version\":\"01a0fc54ff9a70d3af0e9b49e864b8b9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde-text-0012\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde\",\"chunk_type\":\"text\",\"section_path\":\"5
        Results\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":56,\"page_no\":6,\"filename\":\"2609.14245v1.pdf\"}}},{\"id\":\"7ebff8fe-a43d-53fc-90cb-fdffb5a86519\",\"version\":15,\"score\":0.5597505,\"payload\":{\"page_content\":\"5.4
        One agent drifts the wrong way\\nR-Search is the exception, and it leans worse
        rather than better. Its DiD is positive on all four datasets (+0.7, +3.1,
        +3.8, +3.0pp) and significant on RAGTruth, our largest cell, at +3.0pp with
        a 95% CI of [1.2, 4.8] and a Holm-adjusted p of 0.002. That was the pre-registered
        condition for claiming a model-specific effect, and it is met.\\nWe report
        it with the caveats it deserves. On the RANDOM variant R-Search is again higher
        on three of four datasets but significant on none, the closest p being 0.063.
        Under the looser cited-anywhere outcome it dips slightly below the baseline
        on NQ ( -0.5pp) and reaches significance nowhere (Appendix D). The direction
        is consistent; the evidence for its size is not. What we can say is that no
        agent improved, and the one that moved measurably moved the wrong way.\",\"metadata\":{\"ingestion_version\":\"01a0fc55257f7276be70b7b3d1501b36\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6-text-0021\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6\",\"chunk_type\":\"text\",\"section_path\":\"5.4
