        to the re-attribution threshold.\\nSecond-evaluator sensitivity. We rescore
        100 questions per dataset with TRUE T5-XXL (Honovich et al., 2022), covering
        full-context identity plus extraction, RECOMP, and LLMLingua-2 at nominal
        0.25. With source mappings fixed, RECOMP's emitted/grounded precision is 0.78/0.13
        on ASQA and 0.44/0.01 on QASPER. The paired gaps are 0.65 [0.55, 0.75] and
        0.43 [0.33, 0.53], respectively. When TRUE also selects recovered spans, grounded
        precision is 0.14 and 0.03. All 16 planned emitted-minus-grounded precision
        and recall gaps across both methods, datasets, and recovery modes are positive
        ( p H = 0 . 0024 in a separate 24-test family). None of the eight cross-evaluator
        grounded-precision differences passes Holm adjustment; this does not establish
        equivalence or validate the primary numbers. Appendix C reports all comparisons,
        the 4,096-token input configuration, decoder anomalies, and documented restarts.
        The pattern persists under a second scoring family, with recovery and calibration
        limitations retained.\",\"metadata\":{\"ingestion_version\":\"01a0fc54ff9a70d3af0e9b49e864b8b9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde-text-0017\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde\",\"chunk_type\":\"text\",\"section_path\":\"Sensitivity
        to the re-attribution threshold.\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":69,\"page_no\":8,\"filename\":\"2609.14245v1.pdf\"}}},{\"id\":\"3da0d4cd-6031-5c9d-923d-1d547b600ae9\",\"version\":13,\"score\":0.6064546,\"payload\":{\"page_content\":\"This
        is a set of three line/scatter plots comparing context compression methods
        for retrieval-augmented generation, evaluated across three metrics: Grounded
        citation precision, Grounded citation recall, and Answer correctness (str-EM),
        each plotted against \\\"Achieved context fraction\\\" (x-axis, reversed scale
        from 1.0 to 0.0) on the y-axis from 0.0 to 1.0 (or 0.35 for the third plot).\\n\\nThe
        methods compared include Identity (full context, green dot baseline), Rerank
        top-k (brown), Extractive (orange), ECR (blue), RECOMP (purple diamond), and
        LLMLingua-2 (red). Across all three metrics, Rerank top-k and ECR tend to
        achieve the best performance at moderate context fractions (0.4-0.7), while
        LLMLingua-2 consistently underperforms with the lowest precision and recall
        scores, and RECOMP achieves relatively higher answer correctness at very low
        context fractions.\",\"metadata\":{\"ingestion_version\":\"01a0fc54ff9a70d3af0e9b49e864b8b9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde-fig-006-00\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde\",\"chunk_type\":\"figure\",\"section_path\":\"\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":47,\"page_no\":6,\"filename\":\"2609.14245v1.pdf\",\"image_path\":\"/var/www/html/personal/llms/portfolio/data/processed/01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde/figures/fig-006-00-6cc5769b7bfc598b.png\"}}},{\"id\":\"8f73e85e-aa02-52f3-88da-9a0df08011e0\",\"version\":15,\"score\":0.6049488,\"payload\":{\"page_content\":\"5.3
