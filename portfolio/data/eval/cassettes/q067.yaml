        Evaluation Metrics\\nFor every run the model retrieves once, then answers
        twice: once from the clean passages and once from a poisoned copy of that
        same list. Passage identity and order are therefore shared across the pair;
        what is not locked is decoding (temperature 0.1, two independent generate
        calls). Four quantities are recorded.\\nAccuracy checks whether the reference
        keyword for a question appears in the answer, case-insensitively. Keyword
        presence is a coarse label: a negated or qualified answer can still contain
        the keyword, and an otherwise correct paraphrase can miss it. We keep it because
        it is reproducible and applied uniformly, not because it is a gold standard.
        Fooled rate is the fraction of runs where the clean answer was correct but
        the poisoned answer was not; it isolates correct-to-incorrect flips from questions
        the model could not answer anyway. It is not a direct measure of poison adoption,
        because an incorrect poisoned answer may abstain, contradict the poison, or
        state a third wrong fact. Abstention rate counts answers that decline to commit,
        detected through a small set of phrases such as 'not enough information' and
        'cannot determine.' Unsupported generation (reported in earlier drafts as
        a hallucination proxy) is approximated by lexical overlap: an answer is flagged
        when fewer than 30% of its content words appear in any retrieved passage,\\n<!--
        formula-not-decoded -->\\nwith W a the content words of the answer and W d
        those of the retrieved passages. Lexical overlap confuses faithful paraphrase
        with unsupported invention, and it can miss answers that copy poisoned text.
        We treat the proxy as a trend indicator only.\",\"metadata\":{\"ingestion_version\":\"01a0fc53392f724b972307d03a9f94d9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead-text-0005\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead\",\"chunk_type\":\"text\",\"section_path\":\"D.
        Evaluation Metrics\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":25,\"page_no\":2,\"filename\":\"2609.09243v1.pdf\"}}},{\"id\":\"639092db-6051-5321-b9f0-5cb9d12a74da\",\"version\":15,\"score\":0.52973545,\"payload\":{\"page_content\":\"|
