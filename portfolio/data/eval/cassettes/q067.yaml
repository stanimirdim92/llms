      so the gap belongs to the data. Its passages are web text rather than Wikipedia
      and its answers run longer, and we cannot say from four datasets which of those
      matters. The practical reading is that postrationalization rates are domain-dependent,
      so a single-corpus number should not be quoted as a property of a model.", "Table
