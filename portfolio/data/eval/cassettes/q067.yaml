      6)\",\"citations\":{\"enabled\":true}},{\"type\":\"document\",\"source\":{\"type\":\"text\",\"media_type\":\"text/plain\",\"data\":\"Experiments
      and Results\\nKILT-SCR. Weconstruct KILT-SCR as a large-candidatepool resource
      with training and evaluation splits. Its training split is derived from the
      training sets of Natural Questions (Kwiatkowski et al. 2019), HotpotQA (Yang
      et al. 2018), and TriviaQA (Joshi et al. 2017). The evaluation split contains
      examples from the evaluation sets of these three datasets, together with PopQA
      (Mallen et al. 2023), ASQA (Stelmakh et al. 2022), and BioASQ (Krithara et al.
      2023; Tsatsaronis et al. 2015). For every query, we retrieve a fixed pool of
      25 passages from KILT-100w (Petroni et al. 2021) using BAAI/bge-large-en-v1.5
      (Xiao et al. 2024).\\nFor each training query, we score candidates with cross-encoder/ms-marco-MiniLM-L6-v2
      (Bajaj et al. 2018) and provide the ten highest-scoring passages to Mistral-7B-Instruct-v0.2
      (Jiang et al. 2023a) to generate answer targets. We retain only instances for
      which a goldanswer alias occurs both in at least one retrieved passage and in
      the generated target, yielding 196,916 examples; teacher scores are globally
      standardized over this split. In contrast, we apply no answer-support or teacher-target
      filtering to KILTSCR evaluation split, which contains 2,000 examples each from
      Natural Questions, HotpotQA, TriviaQA, and PopQA, 948 from ASQA, and 1,609 from
      BioASQ. At evaluation time, the learned reranker scores the fixed candidate
      pool before answer generation.\\nExperimental Setup. AdaMem uses a Llama-3.2-1BInstruct
      (Grattafiori et al. 2024) compressor and a Mistral-7B-Instruct-v0.2 decoder
      adapted with LoRA (Hu et al. 2022). We first pretrain the compressor and AdaMem
      projection module on two million examples sampled from EleutherAI/SmolLM2-135M-10B
      (Allal et al. 2025), using autoencoding and language-modeling objectives. We
      then perform query-dependent fine-tuning on maxoul/pisco_finetuning_data (Louis,
      D\xE9jean, and Clinchant 2025), following the OSCAR training setup. Finally,
      we train on KILT-SCR with the joint answergeneration and reranker-distillation
      objectives. For all experiments, we report Substring Match as the primary evaluation
      metric. We provide additional LLM-as-a-judge metrics in the Supplementary Material.\\nFigure
      3: Match (%) versus retrieval depth. AdaMem benefits from deeper retrieval more
      consistently than OSCAR, particularly under stronger compression.\"},\"title\":\"2609.22100v1.pdf
      [01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d] (text, page
      4)\",\"citations\":{\"enabled\":true}},{\"type\":\"document\",\"source\":{\"type\":\"text\",\"media_type\":\"text/plain\",\"data\":\"D
      Judge Metrics\\nWe use Substring Match as the primary metric because it is deterministic
      and consistent with standard open-domain QA evaluation. However, it can overestimate
      answer quality when a model lists multiple candidate answers: the prediction
      receives full credit whenever it contains a gold-answer alias as a substring,
      even if the response is ambiguous, unsupported, or includes incorrect alternatives.
      We therefore additionally report LLM-as-a-judge scores, which evaluate the correctness
      of the generated answer in the context of the question and reference answer.
      The judge assigns a score of 1 for a correct answer, 0.5 for a partially correct
      answer, and 0 for a wrong answer; we report the mean score as a percentage.
      This complementary evaluation penalizes answer enumeration and verifies that
      improvements in Match correspond to genuinely correct answers rather than increased
      lexical overlap with the reference.\\nTable 5: Training schedule for the three-stage
      procedure.\\n\\nStage 1, Examples = 2,000,000. Stage 1, Epochs = 1. Stage 2,
      Examples = 500,000. Stage 2, Epochs = 1. Stage 3 (KILT-SCR), Examples = 196,916.
      Stage 3 (KILT-SCR), Epochs = 3\\nFor each example, we provide the judge with
      the question, the reference answer, and the model prediction. We use the following
      prompt:\\nSystem prompt: You are an evaluation tool. Answer with one of: 1:
      Correct, 0.5: Partially correct, 0: Wrong.\\nUser prompt: Here is a question,
      a golden answer, and an AI-generated answer. Can you judge whether the AIgenerated
      answer is correct according to the question and golden answer? Simply answer
      with one of: 1: Correct, 0.5: Partially correct, 0: Wrong.\\nQuestion:\\n{question}\\nGolden
      answer:\\n{answer}\\nGenerated answer: {prediction}\\nFigure 7 corroborates
      the Match-based robustness trends. At the training-time compression rate of
      16 \xD7 , AdaMem matches or exceeds OSCAR across all three benchmarks, improving
      by 1.8 points on TriviaQA and 2.4 points on NQ, while the methods are effectively
      tied on HotpotQA. The advantage grows under stronger inference-time compression.
      At 64 \xD7 , AdaMem exceeds OSCAR by 6.1 points on TriviaQA and NQ, and by 7.1
      points on HotpotQA. In contrast to OSCAR, AdaMem remains stable as the memory
      budget shrinks: its judge score decreases by only 0.9, 3.3, and 1.4 points from
      16 \xD7 to 64 \xD7 on TriviaQA, NQ, and HotpotQA, respectively, compared with
      drops of 5.2, 7.0, and 8.7 points for OSCAR. These results show that relevance-aware
      allocation preserves answer-critical information under severe compression, rather
      than merely improving lexical overlap with reference answers.\"},\"title\":\"2609.22100v1.pdf
      [01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d] (text, page
      11)\",\"citations\":{\"enabled\":true}},{\"type\":\"document\",\"source\":{\"type\":\"text\",\"media_type\":\"text/plain\",\"data\":\"D.
      Evaluation Metrics\\nFor every run the model retrieves once, then answers twice:
      once from the clean passages and once from a poisoned copy of that same list.
      Passage identity and order are therefore shared across the pair; what is not
      locked is decoding (temperature 0.1, two independent generate calls). Four quantities
      are recorded.\\nAccuracy checks whether the reference keyword for a question
      appears in the answer, case-insensitively. Keyword presence is a coarse label:
      a negated or qualified answer can still contain the keyword, and an otherwise
      correct paraphrase can miss it. We keep it because it is reproducible and applied
      uniformly, not because it is a gold standard. Fooled rate is the fraction of
      runs where the clean answer was correct but the poisoned answer was not; it
      isolates correct-to-incorrect flips from questions the model could not answer
      anyway. It is not a direct measure of poison adoption, because an incorrect
      poisoned answer may abstain, contradict the poison, or state a third wrong fact.
      Abstention rate counts answers that decline to commit, detected through a small
      set of phrases such as 'not enough information' and 'cannot determine.' Unsupported
      generation (reported in earlier drafts as a hallucination proxy) is approximated
      by lexical overlap: an answer is flagged when fewer than 30% of its content
      words appear in any retrieved passage,\\n<!-- formula-not-decoded -->\\nwith
      W a the content words of the answer and W d those of the retrieved passages.
      Lexical overlap confuses faithful paraphrase with unsupported invention, and
      it can miss answers that copy poisoned text. We treat the proxy as a trend indicator
      only.\"},\"title\":\"2609.09243v1.pdf [01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead]
      (text, page 2)\",\"citations\":{\"enabled\":true}},{\"type\":\"document\",\"source\":{\"type\":\"text\",\"media_type\":\"text/plain\",\"data\":\"H.
      Relation to Prior Work\\nOur findings extend the RAG picture drawn by Lewis
      et al. [1] from the cooperative case to an adversarial one: retrieval that lifts
      accuracy on clean corpora becomes a liability on corrupted ones. Where Shi et
      al. [3] showed that off-topic context distracts a model, we show that on-topic
      but false context does more, because it wears the appearance of the evidence
      the model was told to trust. The abstention-overfabrication pattern we measure
      is an empirical answer, for a small quantized model, to how such a system fails
      when the context is corrupted rather than merely irrelevant. The retrieval-integrated
      pre-training of Guu et al. [5] shares the grounding assumption our attack targets.
      Zhou et al. [4] warn that evaluation can leak into training and inflate scores;
      we keep the FEVER-derived query set fixed and report every cell from the same
      588-run table so strategy comparisons are not an artifact of shifting test items.\\nFig.
      4. Failure behaviour across poisoning levels. Panel (a): abstention rises with
      poisoning for every strategy, most steeply for entity swap. Panel (b): the lexical-overlap
      proxy of unsupported generation is higher on the clean arm than the poisoned
      arm for all three strategies.\\nFig. 5. Outcome of queries that were correct
      on clean context, split by strategy and poisoning level. Green is still correct,
      blue is abstained, red is fooled. The lost green area is absorbed mainly by
      abstention, and negation retains the most correct answers.\"},\"title\":\"2609.09243v1.pdf
      [01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead] (text, page
      4)\",\"citations\":{\"enabled\":true}},{\"type\":\"document\",\"source\":{\"type\":\"text\",\"media_type\":\"text/plain\",\"data\":\"2
      Related Work\\nCitations in RAG. RAG conditions generation on retrieved passages
      (Lewis et al., 2020), and benchmarks such as ALCE ask models to cite those passages
      sentence by sentence (Gao et al., 2023). Most evaluations score whether a citation
      is correct : does the cited passage support the sentence? Wallat et al. (2025)
      pushed on a harder question: did the model actually use it? Those two can come
      apart. A model that already knows the answer can write it down, scan the passages,
      and attach the one that fits, producing a citation that is correct and unfaithful
      at the same time. Their planting probe exposes the gap, and we reproduce it,
      then add the control it was missing (Section 3).\\nRLVR search agents. Search-R1
      (Jin et al., 2025), ReSearch (Chen et al., 2025), and R-Search (Zhao et al.,
      2025) teach a language model to interleave search calls with reasoning, rewarding
      it when the final answer checks out against a reference. All three release open
      weights trained from Qwen2.5-7B-Instruct, which lets us line each agent up against
      the exact model it grew from. Their papers report answer quality. None of them
      reports how many citations are faithful, which is the gap we fill.\\nFaithful
      reasoning is a different question. VERITAS (Xu et al., 2025) showed that the
      reasoning traces of Search-R1 and ReSearch do not always line up with the searches
      they issue, the information they retrieve, or the answers they produce. That
      is faithfulness within the reasoning chain. We ask about faithfulness to the
      evidence : is the cited passage the one the answer leaned on? An agent can narrate
      its search honestly and still misattribute the result, or reason sloppily and
      cite correctly. The two findings sit side by side rather than in conflict.\"},\"title\":\"2609.23053v1.pdf
      [01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6] (text, page
      2)\",\"citations\":{\"enabled\":true}},{\"type\":\"document\",\"source\":{\"type\":\"text\",\"media_type\":\"text/plain\",\"data\":\"4
      Experimental Setup\\nTable 2: Models (top) and datasets (bottom). All four models
      share the Qwen2.5-7B-Instruct base. Passages is the number of roughly 100-token
      chunks in each retrieval index.\\n\\nBaseline, Training on top of the base =
      none (Qwen2.5-7B-Instruct). Search-R1, Training on top of the base = RLVR with
      PPO. ReSearch, Training on top of the base = RLVR with GRPO. R-Search, Training
      on top of the base = RLVR with GRPO\\nNQ, Questions = 499. NQ, Passages = 40,791.
      NQ, Source = Wikipedia. QAMPARI, Questions = 500. QAMPARI, Passages = 44,879.
      QAMPARI, Source = Wikipedia. HAGRID, Questions = 500. HAGRID, Passages = 8,986.
      HAGRID, Source = Wikipedia. RAGTruth, Questions = 500. RAGTruth, Passages =
      6,981. RAGTruth, Source = Web\\nModels. Our comparison rests on a single design
      choice: every model in Table 2 starts from the same weights. The baseline is
      Qwen2.5-7BInstruct (Qwen Team, 2024); Search-R1 (Jin et al., 2025), ReSearch
      (Chen et al., 2025), and R-Search (Zhao et al., 2025) are open-weight agents
      trained from that exact checkpoint with RLVR. Whatever separates an agent from
      the baseline is therefore training, not architecture, tokenizer, or pretraining
      data.\\nFixed-context evaluation. We disable agentinitiated retrieval and give
      every model the same five passages retrieved externally with BM25. This is an
      intentional control: our question is whether RLVR-trained agents differ in citation
      attribution when the available evidence is held constant. Allowing agents to
      retrieve would introduce differences in search policy and evidence selection,
      making those effects inseparable from citation behavior.\\nDatasets. We use
      four question-answering datasets: NQ from KILT (Petroni et al., 2021; Kwiatkowski
      et al., 2019), QAMPARI from ALCE (Gao et al., 2023; Amouyal et al., 2023), HA-
      GRID (Kamalloo et al., 2023), and the questionanswering portion of RAGTruth
      (Niu et al., 2024), sampling 500 questions from each (499 for NQ). For each
      dataset we chunk the corpus into roughly 100-token passages and retrieve the
      top five per question with BM25 (Robertson and Zaragoza, 2009).\"},\"title\":\"2609.23053v1.pdf
      [01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6] (text, page
      4)\",\"citations\":{\"enabled\":true}},{\"type\":\"document\",\"source\":{\"type\":\"text\",\"media_type\":\"text/plain\",\"data\":\"Table
      7: Per question: replied 'I don't know' (IDK), answered (Ans.), and answered
      in the required format (Fmt.). Claims is the number of cited sentences that
