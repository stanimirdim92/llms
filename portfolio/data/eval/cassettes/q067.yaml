- request:
    body: "{\"max_tokens\":16000,\"messages\":[{\"role\":\"user\",\"content\":\"You
      check whether an answer is supported by its sources.\\n\\nQuestion: Compare
      how these papers evaluate retrieval quality.\\n\\nSources the answer was written
      from:\\n[1] 4.1 Experimental Setup\\nWe evaluate on two attribution benchmarks
      with different retrieval granularities. ASQA comprises 948 ambiguous factoid
      questions from the ALCE release (Gao et al., 2023), each paired with the top-5
      GTR-retrieved passages, sentencesegmented into citable snippets; answer quality
      is string exact match (str-EM). QASPER (Dasigi et al., 2021) is the 1,005-question
      dev split over 281 NLP papers, using each supplied paper's abstract and full
      text. Gold evidence is paragraphlevel, so identity presents paragraphs as citable
      units while compressors operate on sentence snippets; declared sids map to paragraphs
      for setF1 against gold evidence, max over annotators. The generator is Qwen2.5-7B-Instruct
      served via vLLM with greedy decoding and ALCE-style numbered-context citation
      prompting (Gao et al., 2023). Primary entailment judgments use the development-grade
      DeBERTa NLI evaluator of \xA73.1 at \u03C4 = 0 . 5 . We compare six compressors:
      identity (no compression; documentlevel on ASQA, paragraph-level on QASPER),
      cross-encoder rerank topk (ms-marco-MiniLML-6-v2), embedding-based extractive
      sentence selection (all-MiniLM-L6-v2), the RECOMP abstractive summarizer (NQ
      checkpoint) (Xu et al., 2024), LLMLingua-2 token pruning (Pan et al., 2024),
      and our extract-cluster-rewrite (ECR) variant, which ranks sentences, greedily
      clusters nearduplicates by Jaccard word overlap (threshold 0.5, with a negation
      guard), and emits one unit per cluster-the highest-relevance member sentence
      verbatim-citing all member sentence ids. Although LLMLingua-2 prunes tokens
      verbatim, its output is a token stream with no unit-level sid mapping in our
      pipeline, so it declares no provenance and is scored with the no-provenance
      family alongside RECOMP. Each compressor runs at nominal budgets { 0 . 5 , 0
      . 25 , 0 . 1 , 0 . 05 } of the retrieved context, enforced in generator-tokenizer
      tokens. Because compressors do not reliably hit their nominal budgets, the frontier
      figures and primary summary tables report the achieved ratio: RECOMP's summary
      length is nearly budget-independent, saturating at achieved ratios of 0.05-0.08
      on ASQA and \u2248 0.015 on QASPER across all four nominal budgets. All primary
      comparisons use the same successful questions across all 21 settings: 944 on
      ASQA and 976 from 271 papers on QASPER. Only identity has failures: 4 budget-check
      failures on ASQA, and 15 budget-check plus 14 promptoverflow failures on QASPER;
      their question IDs are excluded from every primary setting. Fullcohort descriptive
      aggregates remain available in the evaluation artifacts.\\n\\n[2] This is a
      set of three line/scatter plots comparing context compression methods for retrieval-augmented
      generation, evaluated across three metrics: Grounded citation precision, Grounded
      citation recall, and Answer correctness (str-EM), each plotted against \\\"Achieved
      context fraction\\\" (x-axis, reversed scale from 1.0 to 0.0) on the y-axis
      from 0.0 to 1.0 (or 0.35 for the third plot).\\n\\nThe methods compared include
      Identity (full context, green dot baseline), Rerank top-k (brown), Extractive
      (orange), ECR (blue), RECOMP (purple diamond), and LLMLingua-2 (red). Across
      all three metrics, Rerank top-k and ECR tend to achieve the best performance
      at moderate context fractions (0.4-0.7), while LLMLingua-2 consistently underperforms
      with the lowest precision and recall scores, and RECOMP achieves relatively
      higher answer correctness at very low context fractions.\\n\\n[3] This is a
      set of three line/scatter plots comparing context compression methods for retrieval-augmented
      generation, plotting \\\"Achieved context fraction\\\" (x-axis, reversed from
      1.0 to 0.0) against three metrics: Grounded citation precision, Grounded citation
      recall, and Declared-evidence F1 (y-axes, 0.0 to 1.0 or 0.0 to 0.20 scales).
      Six methods are compared: Identity (full context, green dot at x=1.0), Extractive
      (orange), Rerank top-k (brown), ECR (blue), RECOMP (purple, near x=0), and LLMLingua-2
      (red). ECR consistently achieves the highest precision and recall among compression
      methods across context fractions (~0.4-0.55), while LLMLingua-2 performs poorly
      (near 0.0-0.15) on citation precision/recall; for Declared-evidence F1, ECR
      and Extractive show increasing values (up to ~0.17) as context fraction decreases,
      outperforming Rerank top-k, which stays low (~0.05-0.08).\\n\\n[4] Experiments
      and Results\\nFinally, at 16 \xD7 , AdaMem closely approaches Full Context performance
      despite replacing the retrieved text with a substantially shorter continuous
      representation. On TriviaQA, it is within 0.4 points of Full Context, while
      on PopQA it exceeds Full Context by 1.4 points. Hence, selective memory allocation
      can both reduce computational cost and mitigate interference from irrelevant
      retrieved passages.\\nFigure 4: Memory-token allocation by document relevance
      rank at 64 \xD7 compression. The dashed line denotes OSCAR's fixed 16 \xD7 allocation.\\nMemory
      Allocation Behavior. Figure 4 illustrates the allocation mechanism under this
      highly constrained 64 \xD7 setting. For the most relevant documents, AdaMem
      allocates a median of roughly 10 memory tokens, already exceeding OSCAR's fixed
      budget of 9 tokens per document at 16 \xD7 . The 90th percentile is substantially
      higher, indicating that for some queries, AdaMem assigns considerably more capacity
      to the most relevant document. In contrast, the allocation decreases sharply
      with relevance rank and approaches zero for lower-ranked documents. Thus, AdaMem
      concentrates capacity on query-relevant evidence while assigning minimal capacity
      to noisy passages, reducing their potential interference in the compressed context.\\nRobustness
      to Retrieval Depth and Compression. Figure 3 compares AdaMem and OSCAR across
      retrieval depths k \u2208 { 5 , 10 , 15 , 20 , 25 } and compression ratios of
      16 \xD7 , 32 \xD7 , and 64 \xD7 at \u03C4 =1. AdaMem benefits more consistently
      from deeper retrieval, whereas OSCAR remains nearly constant as additional lower-ranked
      documents are introduced.\\nThis difference is most pronounced under aggressive
      compression. At 64 \xD7 , increasing k from 5 to 25 improves AdaMem by 3.5 points
      on TriviaQA, 5.4 on Natural Questions, and 4.2 on HotpotQA, while OSCAR changes
      only marginally over the same range. A similar pattern holds at 32 \xD7 , particularly
      on Natural Questions and HotpotQA.\\nThese results suggest that AdaMem can extract
      useful evidence from less-relevant documents without allocating them the same
      budget as highly relevant ones. In contrast, OSCAR's fixed per-document allocation
      provides limited benefit from deeper retrieval, as its representation capacity
      is uniformly spread over an increasingly noisy document set. The effect is weaker
      at 16 \xD7 , where both methods have sufficient capacity for shallow retrieval
      pools, but becomes increasingly clear as the memory budget is reduced.\\nFigure
      5: Quality-latency tradeoff on TriviaQA. AdaMem shows similar latency as OSCAR
      and matches Full Context quality at 4 . 0 \xD7 lower latency.\\n\\n[5] Experiments
      and Results\\nKILT-SCR. Weconstruct KILT-SCR as a large-candidatepool resource
      with training and evaluation splits. Its training split is derived from the
      training sets of Natural Questions (Kwiatkowski et al. 2019), HotpotQA (Yang
      et al. 2018), and TriviaQA (Joshi et al. 2017). The evaluation split contains
      examples from the evaluation sets of these three datasets, together with PopQA
      (Mallen et al. 2023), ASQA (Stelmakh et al. 2022), and BioASQ (Krithara et al.
      2023; Tsatsaronis et al. 2015). For every query, we retrieve a fixed pool of
      25 passages from KILT-100w (Petroni et al. 2021) using BAAI/bge-large-en-v1.5
      (Xiao et al. 2024).\\nFor each training query, we score candidates with cross-encoder/ms-marco-MiniLM-L6-v2
      (Bajaj et al. 2018) and provide the ten highest-scoring passages to Mistral-7B-Instruct-v0.2
      (Jiang et al. 2023a) to generate answer targets. We retain only instances for
      which a goldanswer alias occurs both in at least one retrieved passage and in
      the generated target, yielding 196,916 examples; teacher scores are globally
      standardized over this split. In contrast, we apply no answer-support or teacher-target
      filtering to KILTSCR evaluation split, which contains 2,000 examples each from
      Natural Questions, HotpotQA, TriviaQA, and PopQA, 948 from ASQA, and 1,609 from
      BioASQ. At evaluation time, the learned reranker scores the fixed candidate
      pool before answer generation.\\nExperimental Setup. AdaMem uses a Llama-3.2-1BInstruct
      (Grattafiori et al. 2024) compressor and a Mistral-7B-Instruct-v0.2 decoder
      adapted with LoRA (Hu et al. 2022). We first pretrain the compressor and AdaMem
      projection module on two million examples sampled from EleutherAI/SmolLM2-135M-10B
      (Allal et al. 2025), using autoencoding and language-modeling objectives. We
      then perform query-dependent fine-tuning on maxoul/pisco_finetuning_data (Louis,
      D\xE9jean, and Clinchant 2025), following the OSCAR training setup. Finally,
      we train on KILT-SCR with the joint answergeneration and reranker-distillation
      objectives. For all experiments, we report Substring Match as the primary evaluation
      metric. We provide additional LLM-as-a-judge metrics in the Supplementary Material.\\nFigure
      3: Match (%) versus retrieval depth. AdaMem benefits from deeper retrieval more
      consistently than OSCAR, particularly under stronger compression.\\n\\n[6] D
      Judge Metrics\\nWe use Substring Match as the primary metric because it is deterministic
      and consistent with standard open-domain QA evaluation. However, it can overestimate
      answer quality when a model lists multiple candidate answers: the prediction
      receives full credit whenever it contains a gold-answer alias as a substring,
      even if the response is ambiguous, unsupported, or includes incorrect alternatives.
      We therefore additionally report LLM-as-a-judge scores, which evaluate the correctness
      of the generated answer in the context of the question and reference answer.
      The judge assigns a score of 1 for a correct answer, 0.5 for a partially correct
      answer, and 0 for a wrong answer; we report the mean score as a percentage.
      This complementary evaluation penalizes answer enumeration and verifies that
      improvements in Match correspond to genuinely correct answers rather than increased
      lexical overlap with the reference.\\nTable 5: Training schedule for the three-stage
      procedure.\\n\\nStage 1, Examples = 2,000,000. Stage 1, Epochs = 1. Stage 2,
      Examples = 500,000. Stage 2, Epochs = 1. Stage 3 (KILT-SCR), Examples = 196,916.
      Stage 3 (KILT-SCR), Epochs = 3\\nFor each example, we provide the judge with
      the question, the reference answer, and the model prediction. We use the following
      prompt:\\nSystem prompt: You are an evaluation tool. Answer with one of: 1:
      Correct, 0.5: Partially correct, 0: Wrong.\\nUser prompt: Here is a question,
      a golden answer, and an AI-generated answer. Can you judge whether the AIgenerated
      answer is correct according to the question and golden answer? Simply answer
      with one of: 1: Correct, 0.5: Partially correct, 0: Wrong.\\nQuestion:\\n{question}\\nGolden
      answer:\\n{answer}\\nGenerated answer: {prediction}\\nFigure 7 corroborates
      the Match-based robustness trends. At the training-time compression rate of
      16 \xD7 , AdaMem matches or exceeds OSCAR across all three benchmarks, improving
      by 1.8 points on TriviaQA and 2.4 points on NQ, while the methods are effectively
      tied on HotpotQA. The advantage grows under stronger inference-time compression.
      At 64 \xD7 , AdaMem exceeds OSCAR by 6.1 points on TriviaQA and NQ, and by 7.1
      points on HotpotQA. In contrast to OSCAR, AdaMem remains stable as the memory
      budget shrinks: its judge score decreases by only 0.9, 3.3, and 1.4 points from
      16 \xD7 to 64 \xD7 on TriviaQA, NQ, and HotpotQA, respectively, compared with
      drops of 5.2, 7.0, and 8.7 points for OSCAR. These results show that relevance-aware
      allocation preserves answer-critical information under severe compression, rather
      than merely improving lexical overlap with reference answers.\\n\\n[7] D. Evaluation
      Metrics\\nFor every run the model retrieves once, then answers twice: once from
      the clean passages and once from a poisoned copy of that same list. Passage
      identity and order are therefore shared across the pair; what is not locked
      is decoding (temperature 0.1, two independent generate calls). Four quantities
      are recorded.\\nAccuracy checks whether the reference keyword for a question
      appears in the answer, case-insensitively. Keyword presence is a coarse label:
      a negated or qualified answer can still contain the keyword, and an otherwise
      correct paraphrase can miss it. We keep it because it is reproducible and applied
      uniformly, not because it is a gold standard. Fooled rate is the fraction of
      runs where the clean answer was correct but the poisoned answer was not; it
      isolates correct-to-incorrect flips from questions the model could not answer
      anyway. It is not a direct measure of poison adoption, because an incorrect
      poisoned answer may abstain, contradict the poison, or state a third wrong fact.
      Abstention rate counts answers that decline to commit, detected through a small
      set of phrases such as 'not enough information' and 'cannot determine.' Unsupported
      generation (reported in earlier drafts as a hallucination proxy) is approximated
      by lexical overlap: an answer is flagged when fewer than 30% of its content
      words appear in any retrieved passage,\\n<!-- formula-not-decoded -->\\nwith
      W a the content words of the answer and W d those of the retrieved passages.
      Lexical overlap confuses faithful paraphrase with unsupported invention, and
      it can miss answers that copy poisoned text. We treat the proxy as a trend indicator
      only.\\n\\n[8] H. Relation to Prior Work\\nOur findings extend the RAG picture
      drawn by Lewis et al. [1] from the cooperative case to an adversarial one: retrieval
      that lifts accuracy on clean corpora becomes a liability on corrupted ones.
      Where Shi et al. [3] showed that off-topic context distracts a model, we show
      that on-topic but false context does more, because it wears the appearance of
      the evidence the model was told to trust. The abstention-overfabrication pattern
      we measure is an empirical answer, for a small quantized model, to how such
      a system fails when the context is corrupted rather than merely irrelevant.
      The retrieval-integrated pre-training of Guu et al. [5] shares the grounding
      assumption our attack targets. Zhou et al. [4] warn that evaluation can leak
      into training and inflate scores; we keep the FEVER-derived query set fixed
      and report every cell from the same 588-run table so strategy comparisons are
      not an artifact of shifting test items.\\nFig. 4. Failure behaviour across poisoning
      levels. Panel (a): abstention rises with poisoning for every strategy, most
      steeply for entity swap. Panel (b): the lexical-overlap proxy of unsupported
      generation is higher on the clean arm than the poisoned arm for all three strategies.\\nFig.
      5. Outcome of queries that were correct on clean context, split by strategy
      and poisoning level. Green is still correct, blue is abstained, red is fooled.
      The lost green area is absorbed mainly by abstention, and negation retains the
      most correct answers.\\n\\n[9] 2 Related Work\\nCitations in RAG. RAG conditions
      generation on retrieved passages (Lewis et al., 2020), and benchmarks such as
      ALCE ask models to cite those passages sentence by sentence (Gao et al., 2023).
      Most evaluations score whether a citation is correct : does the cited passage
      support the sentence? Wallat et al. (2025) pushed on a harder question: did
      the model actually use it? Those two can come apart. A model that already knows
      the answer can write it down, scan the passages, and attach the one that fits,
      producing a citation that is correct and unfaithful at the same time. Their
      planting probe exposes the gap, and we reproduce it, then add the control it
      was missing (Section 3).\\nRLVR search agents. Search-R1 (Jin et al., 2025),
      ReSearch (Chen et al., 2025), and R-Search (Zhao et al., 2025) teach a language
      model to interleave search calls with reasoning, rewarding it when the final
      answer checks out against a reference. All three release open weights trained
      from Qwen2.5-7B-Instruct, which lets us line each agent up against the exact
      model it grew from. Their papers report answer quality. None of them reports
      how many citations are faithful, which is the gap we fill.\\nFaithful reasoning
      is a different question. VERITAS (Xu et al., 2025) showed that the reasoning
      traces of Search-R1 and ReSearch do not always line up with the searches they
      issue, the information they retrieve, or the answers they produce. That is faithfulness
      within the reasoning chain. We ask about faithfulness to the evidence : is the
      cited passage the one the answer leaned on? An agent can narrate its search
      honestly and still misattribute the result, or reason sloppily and cite correctly.
      The two findings sit side by side rather than in conflict.\\n\\n[10] 4 Experimental
      Setup\\nTable 2: Models (top) and datasets (bottom). All four models share the
      Qwen2.5-7B-Instruct base. Passages is the number of roughly 100-token chunks
      in each retrieval index.\\n\\nBaseline, Training on top of the base = none (Qwen2.5-7B-Instruct).
      Search-R1, Training on top of the base = RLVR with PPO. ReSearch, Training on
      top of the base = RLVR with GRPO. R-Search, Training on top of the base = RLVR
      with GRPO\\nNQ, Questions = 499. NQ, Passages = 40,791. NQ, Source = Wikipedia.
      QAMPARI, Questions = 500. QAMPARI, Passages = 44,879. QAMPARI, Source = Wikipedia.
      HAGRID, Questions = 500. HAGRID, Passages = 8,986. HAGRID, Source = Wikipedia.
      RAGTruth, Questions = 500. RAGTruth, Passages = 6,981. RAGTruth, Source = Web\\nModels.
      Our comparison rests on a single design choice: every model in Table 2 starts
      from the same weights. The baseline is Qwen2.5-7BInstruct (Qwen Team, 2024);
      Search-R1 (Jin et al., 2025), ReSearch (Chen et al., 2025), and R-Search (Zhao
      et al., 2025) are open-weight agents trained from that exact checkpoint with
      RLVR. Whatever separates an agent from the baseline is therefore training, not
      architecture, tokenizer, or pretraining data.\\nFixed-context evaluation. We
      disable agentinitiated retrieval and give every model the same five passages
      retrieved externally with BM25. This is an intentional control: our question
      is whether RLVR-trained agents differ in citation attribution when the available
      evidence is held constant. Allowing agents to retrieve would introduce differences
      in search policy and evidence selection, making those effects inseparable from
      citation behavior.\\nDatasets. We use four question-answering datasets: NQ from
      KILT (Petroni et al., 2021; Kwiatkowski et al., 2019), QAMPARI from ALCE (Gao
      et al., 2023; Amouyal et al., 2023), HA- GRID (Kamalloo et al., 2023), and the
      questionanswering portion of RAGTruth (Niu et al., 2024), sampling 500 questions
      from each (499 for NQ). For each dataset we chunk the corpus into roughly 100-token
      passages and retrieve the top five per question with BM25 (Robertson and Zaragoza,
      2009).\\n\\n[11] Table 7: Per question: replied 'I don't know' (IDK), answered
      (Ans.), and answered in the required format (Fmt.). Claims is the number of
      cited sentences that enter the probe; the n in the result tables is slightly
      smaller because a variant can only be built when a suitable passage exists.
      RAGTruth answers are longer, so they yield more claims per question. Search-R1
      abstains most and R-Search least on every dataset.\\n\\n| Data     | Model     |
      IDK       |   Ans. |   Fmt. |   Claims |\\n|----------|-----------|-----------|--------|--------|----------|\\n|
      NQ       | Baseline  | 149 (30%) |    350 |    315 |      371 |\\n|          |
      Search-R1 | 208 (42%) |    291 |    238 |      281 |\\n|          | ReSearch
      \ | 158 (32%) |    341 |    310 |      355 |\\n|          | R-Search  | 129
      (26%) |    370 |    341 |      387 |\\n| QAMPARI  | Baseline  | 186 (37%) |
      \   314 |    241 |      329 |\\n|          | Search-R1 | 259 (52%) |    241
      |    186 |      283 |\\n|          | ReSearch  | 191 (38%) |    309 |    258
      |      352 |\\n|          | R-Search  | 167 (33%) |    333 |    285 |      362
      |\\n| HAGRID   | Baseline  | 85 (17%)  |    415 |    378 |      438 |\\n|          |
      Search-R1 | 121 (24%) |    379 |    327 |      389 |\\n|          | ReSearch
      \ | 90 (18%)  |    410 |    383 |      439 |\\n|          | R-Search  | 75 (15%)
      \ |    425 |    396 |      435 |\\n| RAGTruth | Baseline  | 86 (17%)  |    414
      |    291 |      874 |\\n|          | Search-R1 | 127 (25%) |    373 |    234
      |      705 |\\n|          | ReSearch  | 85 (17%)  |    415 |    296 |      828
      |\\n|          | R-Search  | 75 (15%)  |    425 |    346 |      886 |\\n\\nAnswer:
      These papers take quite different approaches to evaluating retrieval-related
      quality in RAG systems, reflecting their different concerns (context compression,
      memory allocation, adversarial robustness, and citation faithfulness).\\n\\n##
      Context compression benchmarks (2609.14245v1)\\n\\nThis paper evaluates compressors
      using **attribution benchmarks with different retrieval granularities**. It
      uses ASQA comprises 948 ambiguous factoid questions from the ALCE release, each
      paired with the top-5 GTR-retrieved passages, sentence-segmented into citable
      snippets; answer quality is string exact match (str-EM), and QASPER, the 1,005-question
      dev split over 281 NLP papers, using each supplied paper's abstract and full
      text, where gold evidence is paragraph-level, so identity presents paragraphs
      as citable units while compressors operate on sentence snippets. Retrieval quality
      itself is not directly scored; instead, the paper measures how well compressed
      contexts preserve **grounded citation precision/recall** and **answer correctness**
      as a function of achieved compression ratio, compared across six compressors
      (identity, rerank top-k, extractive, RECOMP, LLMLingua-2, and their own ECR
      method) which ranks sentences, greedily clusters near-duplicates by Jaccard
      word overlap, and emits one unit per cluster\u2014the highest-relevance member
      sentence verbatim\u2014citing all member sentence ids. The figures show that
      ECR consistently achieves the highest precision and recall among compression
      methods across context fractions (~0.4-0.55), while LLMLingua-2 performs poorly
      (near 0.0-0.15) on citation precision/recall.\\n\\n## Memory-compression and
      retrieval depth (2609.22100v1)\\n\\nThis paper evaluates retrieval quality indirectly
      through **robustness to retrieval depth and compression ratio**. It compares
      AdaMem and OSCAR across retrieval depths k \u2208 {5, 10, 15, 20, 25} and compression
      ratios of 16\xD7, 32\xD7, and 64\xD7, finding that at 64\xD7, increasing k from
      5 to 25 improves AdaMem by 3.5 points on TriviaQA, 5.4 on Natural Questions,
      and 4.2 on HotpotQA, while OSCAR changes only marginally over the same range.
      It also constructs a dedicated large-pool evaluation resource, KILT-SCR: for
      every query, they retrieve a fixed pool of 25 passages from KILT-100w using
      BAAI/bge-large-en-v1.5, and reports Substring Match as the primary evaluation
      metric, supplemented by \\n\\nPass only if every factual claim in the answer
      is stated in, or directly follows from, the\\nsources. A claim that is plausible
      but absent from the sources fails. An answer that correctly\\nsays the sources
      don't contain the answer passes.\"}],\"model\":\"claude-opus-5\",\"output_config\":{\"format\":{\"type\":\"json_schema\",\"schema\":{\"type\":\"object\",\"title\":\"Verdict\",\"properties\":{\"reasoning\":{\"type\":\"string\",\"description\":\"One
