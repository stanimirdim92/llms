      contradicting the accepted answer fails.\"}],\"model\":\"claude-opus-5\",\"output_config\":{\"format\":{\"type\":\"json_schema\",\"schema\":{\"type\":\"object\",\"title\":\"Verdict\",\"properties\":{\"reasoning\":{\"type\":\"string\",\"description\":\"One
