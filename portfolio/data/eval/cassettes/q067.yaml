      and Jimmy Lin. 2023. HAGRID: A human-LLM collaborative dataset for generative
      information-seeking with attribution. Preprint , arXiv:2307.16883.\n- Tom Kwiatkowski,
      Jennimaria Palomaki, Olivia Redfield, Michael Collins, Ankur Parikh, Chris Alberti,
      Danielle Epstein, Illia Polosukhin, Jacob Devlin, Kenton Lee, Kristina Toutanova,
      Llion Jones, Matthew Kelcey, Ming-Wei Chang, Andrew M. Dai, Jakob Uszkoreit,
      Quoc Le, and Slav Petrov. 2019. Natural questions: A benchmark for question
      answering research. Transactions of the Association for Computational Linguistics
      , 7:452-466.\n- Patrick Lewis, Ethan Perez, Aleksandra Piktus, Fabio Petroni,
      Vladimir Karpukhin, Naman Goyal, Heinrich K\u00fcttler, Mike Lewis, Wen-tau
      Yih, Tim Rockt\u00e4schel, Sebastian Riedel, and Douwe Kiela. 2020. Retrieval-augmented
      generation for knowledgeintensive NLP tasks. In Advances in Neural Information
      Processing Systems , volume 33, pages 94599474.\n- Cheng Niu, Yuanhao Wu, Juno
      Zhu, Siliang Xu, KaShun Shum, Randy Zhong, Juntong Song, and Tong Zhang. 2024.
      RAGTruth: A hallucination corpus for developing trustworthy retrieval-augmented
      language models. In Proceedings of the 62nd Annual Meeting of the Association
      for Computational Linguistics (Volume 1: Long Papers) , pages 1086210878, Bangkok,
      Thailand. Association for Computational Linguistics.", "D. Evaluation Metrics\nFor
      every run the model retrieves once, then answers twice: once from the clean
      passages and once from a poisoned copy of that same list. Passage identity and
      order are therefore shared across the pair; what is not locked is decoding (temperature
      0.1, two independent generate calls). Four quantities are recorded.\nAccuracy
      checks whether the reference keyword for a question appears in the answer, case-insensitively.
      Keyword presence is a coarse label: a negated or qualified answer can still
      contain the keyword, and an otherwise correct paraphrase can miss it. We keep
      it because it is reproducible and applied uniformly, not because it is a gold
      standard. Fooled rate is the fraction of runs where the clean answer was correct
      but the poisoned answer was not; it isolates correct-to-incorrect flips from
      questions the model could not answer anyway. It is not a direct measure of poison
      adoption, because an incorrect poisoned answer may abstain, contradict the poison,
      or state a third wrong fact. Abstention rate counts answers that decline to
      commit, detected through a small set of phrases such as ''not enough information''
      and ''cannot determine.'' Unsupported generation (reported in earlier drafts
      as a hallucination proxy) is approximated by lexical overlap: an answer is flagged
      when fewer than 30% of its content words appear in any retrieved passage,\n<!--
      formula-not-decoded -->\nwith W a the content words of the answer and W d those
      of the retrieved passages. Lexical overlap confuses faithful paraphrase with
      unsupported invention, and it can miss answers that copy poisoned text. We treat
      the proxy as a trend indicator only.", "| Dataset   | Planted   | Control   |   Attr.
