      [01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6] (table,
      page 10)\",\"citations\":{\"enabled\":true}},{\"type\":\"text\",\"text\":\"Compare
      how these papers evaluate retrieval quality.\"}]}],\"model\":\"claude-sonnet-5\",\"system\":\"You
