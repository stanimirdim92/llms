        Analysis\\nEvidence selection under pressure. The declared-evidence panel
        of Figure 2 shows increasing F1 for extraction and ECR as budgets tighten,
        from about 0.09 to 0.18 and 0.17, respectively. Each adjacent increase is
        supported ( p H = 0 . 0148 ). Reranking's F1 means decrease from 0.07 to 0.06,
        0.04, and 0.03; the first two decreases have p H = 0 . 0148 , but the final
        difference is unresolved ( p H = 1 ). These are evidence-F1 results, not evidence-precision
        estimates or a controlled test of selection granularity.\",\"metadata\":{\"ingestion_version\":\"01a0fc54ff9a70d3af0e9b49e864b8b9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde-text-0015\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde\",\"chunk_type\":\"text\",\"section_path\":\"6
        Analysis\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":64,\"page_no\":7,\"filename\":\"2609.14245v1.pdf\"}}},{\"id\":\"dbf223b7-edf9-5b4e-bd22-6a7d85e09e50\",\"version\":9,\"score\":0.5469837,\"payload\":{\"page_content\":\"3.1
        Benign capability\\nTo test the general capability of each of the models in
        our study we use the MIRAGE benchmark (Park et al., 2025). This benchmark
        was designed to test RAG model capabilities under different settings: Oracle
        contexts provide a best-case setting in which the answer-bearing evidence
        is available, while mixed contexts introduce distractors while retaining a
        capped amount of answer-bearing evidence. In the current study, we use a subset
        of 1000 queries from MIRAGE, under the two settings, to evaluate general RAG
        capability.\",\"metadata\":{\"ingestion_version\":\"01a0fc5427ea71babb96a22c2c5762f3\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a-text-0007\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a\",\"chunk_type\":\"text\",\"section_path\":\"3.1
        Benign capability\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":30,\"page_no\":3,\"filename\":\"2609.11758v1.pdf\"}}},{\"id\":\"1ea894f7-bdd5-5452-86f3-aae2ce06fb6c\",\"version\":13,\"score\":0.54685587,\"payload\":{\"page_content\":\"Sensitivity
