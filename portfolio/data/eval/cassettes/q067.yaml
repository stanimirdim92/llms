        is a line/scatter plot comparing retrieval or memory methods on a latency-accuracy
        tradeoff. The x-axis shows \\\"Latency per query (ms, log scale)\\\" ranging
        from about 140 to 670+, and the y-axis shows \\\"Match (%)\\\" ranging from
        roughly 76 to 84. Three methods are plotted: AdaMem (green circles) and OSCAR
        (orange squares), each annotated with compression/sampling factors (128\xD7,
        64\xD7, 32\xD7, 16\xD7), showing that AdaMem achieves higher match scores
        at lower latencies than OSCAR; a \\\"Full Context\\\" baseline (purple star)
        achieves the highest match (~84%) but at much greater latency (~670 ms), labeled
        as \\\"4\xD7 lower latency\\\" compared to the other methods, indicating AdaMem
        approaches Full Context accuracy while being significantly faster.\",\"metadata\":{\"ingestion_version\":\"01a0fc53885372038a1c6d0df171e569\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d-fig-006-04\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d\",\"chunk_type\":\"figure\",\"section_path\":\"\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":65,\"page_no\":6,\"filename\":\"2609.22100v1.pdf\",\"image_path\":\"/var/www/html/personal/llms/portfolio/data/processed/01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d/figures/fig-006-04-c6ef734f27591521.png\"}}},{\"id\":\"48f13ee2-cca1-5a90-8a2c-c4e37fc6acd7\",\"version\":13,\"score\":0.544754,\"payload\":{\"page_content\":\"8
        Conclusion\\nWe measured citation attribution across contextcompression methods
        and budgets under a fixed generator and primary NLI evaluator. Emitted and
        grounded scores diverge, but their magnitudes depend on recovery and evaluation
        choices that have not been independently calibrated. Declaredspan verification
        rejects claims lacking declared evidence by policy; it does not determine
        whether support could be recovered. Paired comparisons quantify sampling uncertainty
        conditional on the fixed outputs and evaluator, with only limited evidence
        for ECR's advantage. We recommend reporting grounded alongside emitted citation
        scores and achieved alongside nominal compression. The TRUE subsample retains
        the emitted-grounded gaps; human calibration and broader replication remain
        necessary.\",\"metadata\":{\"ingestion_version\":\"01a0fc54ff9a70d3af0e9b49e864b8b9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde-text-0019\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde\",\"chunk_type\":\"text\",\"section_path\":\"8
        Conclusion\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":76,\"page_no\":8,\"filename\":\"2609.14245v1.pdf\"}}},{\"id\":\"fab5fc9c-48c2-5309-be84-9c8b53e8d8df\",\"version\":13,\"score\":0.5429181,\"payload\":{\"page_content\":\"9
        Limitations\\nEvaluator dependence. Primary scores use DeBERTa-v3-base, trained
        on MNLI, FEVER, and ANLI, at \u03C4 = 0 . 5 , without human calibration. Using
        the same model to select recovered spans and score support can reinforce systematic
        errors; the resulting scores are evaluator-dependent estimates, not validated
        rates of source support or factual correctness. This dependence also limits
        conclusions about method rankings and the size of emitted-grounded gaps. The
        200-question TRUE audit checks a second scoring family, but fixed recovery
        retains DeBERTa selection and TRUE recovery reuses one judge. Different input
        windows and nonbinary decoder outputs further limit numerical comparison.
        Human source-level calibration remains necessary (Rashkin et al., 2023).\\nSingle
        generator. All results use Qwen2.5-7BInstruct with greedy decoding. Frontier
        shapes may differ across model families and scales; a second-family replication
        is planned.\\nDataset coverage. We evaluate two English datasets (ASQA and
        QASPER) with distinct retrieval granularities, but this does not cover multilingual
        settings, open-web retrieval, or longercontext regimes.\\nRe-attribution hyperparameters.
        The top-10 lexical candidate pool can miss semantically matching snippets,
        and requiring one snippet to entail a unit can miss support distributed across
        snippets. Consequently, a failed recovery does not establish that the source
        contains no support. Table 3 varies the recovery threshold while holding the
        scoring threshold fixed; it does not validate the evaluator or test candidate-pool
        size, retrieval strategy, or multi-snippet recovery.\\nVerification scope.
        Declared-span verification rejects claims lacking declared evidence by construction,
        even if support could be recovered. Its 1 . 00 unsupported rate for no-provenance
        runs is a provenance-availability diagnostic, not a calibrated hallucination
        rate. Recovered-source verification is reported at nominal 0.25 for the two
        no-provenance methods and remains dependent on the same bounded recovery procedure
        and evaluator.\\nResidual error rows. Only identity fails on 4 ASQA and 29
        QASPER questions; every primary setting is evaluated on the resulting common
        successful subset. This pairing prevents comparisons from using different
        questions, but conditions results on identity success and omits those difficult
        cases. Sampling intervals condition on the fixed generated outputs and evaluator;
        they do not include systematic NLI error or variation across generation runs.\\nNominal
        versus achieved budgets. Abstractive compressors do not reliably hit nominal
        token budgets; RECOMP often produces much less context than requested. We
        report achieved compression ratios, but comparisons at a shared nominal budget
        do not establish performance at matched achieved context sizes.\",\"metadata\":{\"ingestion_version\":\"01a0fc54ff9a70d3af0e9b49e864b8b9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde-text-0020\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde\",\"chunk_type\":\"text\",\"section_path\":\"9
        Limitations\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":78,\"page_no\":9,\"filename\":\"2609.14245v1.pdf\"}}},{\"id\":\"328797f4-1778-57fe-bd4a-a334aaaa1cbb\",\"version\":5,\"score\":0.53690374,\"payload\":{\"page_content\":\"H.
        Relation to Prior Work\\nOur findings extend the RAG picture drawn by Lewis
        et al. [1] from the cooperative case to an adversarial one: retrieval that
        lifts accuracy on clean corpora becomes a liability on corrupted ones. Where
        Shi et al. [3] showed that off-topic context distracts a model, we show that
        on-topic but false context does more, because it wears the appearance of the
        evidence the model was told to trust. The abstention-overfabrication pattern
        we measure is an empirical answer, for a small quantized model, to how such
        a system fails when the context is corrupted rather than merely irrelevant.
        The retrieval-integrated pre-training of Guu et al. [5] shares the grounding
        assumption our attack targets. Zhou et al. [4] warn that evaluation can leak
        into training and inflate scores; we keep the FEVER-derived query set fixed
        and report every cell from the same 588-run table so strategy comparisons
        are not an artifact of shifting test items.\\nFig. 4. Failure behaviour across
        poisoning levels. Panel (a): abstention rises with poisoning for every strategy,
        most steeply for entity swap. Panel (b): the lexical-overlap proxy of unsupported
        generation is higher on the clean arm than the poisoned arm for all three
        strategies.\\nFig. 5. Outcome of queries that were correct on clean context,
        split by strategy and poisoning level. Green is still correct, blue is abstained,
        red is fooled. The lost green area is absorbed mainly by abstention, and negation
        retains the most correct answers.\",\"metadata\":{\"ingestion_version\":\"01a0fc53392f724b972307d03a9f94d9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead-text-0015\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead\",\"chunk_type\":\"text\",\"section_path\":\"H.
        Relation to Prior Work\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":65,\"page_no\":4,\"filename\":\"2609.09243v1.pdf\"}}},{\"id\":\"21d6e85f-96a3-5bc7-9f3f-0f7d3137d50c\",\"version\":13,\"score\":0.53660977,\"payload\":{\"page_content\":\"5
        Results\\nECR's advantage is limited to one tested setting. On QASPER, ECR
        improves grounded precision over extraction at nominal 0.50 ( \u2206 = 0 .
        063 , CI [0.033, 0.092], p H = 0 . 0148 ). Its other QASPER precision differences
        and all four ASQA differences lack adjusted statistical support. The tightest
        QASPER ECR setting also does not establish an advantage over identity ( \u2206
        = 0 . 028 , CI [ -0 . 010 , 0.064], p H = 1 ). ECR's QASPER declared-evidence
        F1 is slightly lower than extraction at every budget, by 0.00065-0.00295 (all
        p H < 0 . 05 ). Thus the results support a settingspecific precision gain,
        not general superiority or lossless redundancy removal.\",\"metadata\":{\"ingestion_version\":\"01a0fc54ff9a70d3af0e9b49e864b8b9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde-text-0013\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde\",\"chunk_type\":\"text\",\"section_path\":\"5
        Results\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":58,\"page_no\":7,\"filename\":\"2609.14245v1.pdf\"}}},{\"id\":\"dd596239-1b1b-5cb1-8b0f-c3331e5e2b62\",\"version\":7,\"score\":0.53623295,\"payload\":{\"page_content\":\"Introduction\\nRetrieval-augmented
        generation (RAG) augments language models with external knowledge retrieved
        from large document collections, improving performance on knowledgeintensive
        tasks and grounding generation in retrieved evidence (Lewis et al. 2020).
        However, processing many retrieved documents is computationally expensive
        (Xu, Shi, and Choi 2024; Louis et al. 2026). Moreover, irrelevant passages
        can distract the generator and degrade answer quality (Amiraz et al. 2025).
        Increasing the context window does not fully resolve this issue, as language
        models may use information in long multi-document inputs unevenly (Liu et
        al. 2024). Even when total context length is fixed, increasing the number
        of retrieved documents can reduce QA performance, suggesting that multi-document
        processing is a distinct challenge from long-context handling (Levy et al.
        2025). Efficiently selecting and representing useful retrieved evidence is
        therefore central to scalable and reliable RAG.\\n\u2217 Correspondence to:
        sakno.ad18@physics.msu.ru, maksim.makarenko.research@gmail.com\\nFigure 1:
        TriviaQA match as a function of the compression rate on 25 retrieved documents.\\nA
        natural solution is to compress retrieved evidence before generation. Hard
        compression shortens the text via sentence selection or token removal (Jiang
        et al. 2023b; Xu, Shi, and Choi 2024; Pan et al. 2024), preserving interpretability
        but discarding information that may be collectively useful. Soft compression
        maps each passage to a short sequence of continuous memory embeddings consumed
        directly by the decoder (Cheng et al. 2024; Chevalier et al. 2023; Ge et al.
        2024), achieving much higher compression rates. Recent methods such as OSCAR
        (Louis et al. 2026) jointly produce passage representations and relevance
        scores in one pass, using scores only to order or discard passages, after
        which every retained document receives the same number of memory tokens. This
        binary allocation is suboptimal when passage utility is graded. Thus, the
        key question is not only whichdocumentstoretain, but how to distribute a fixed
        memory budget among documents with heterogeneous utility.\\nThis setting also
        exposes an important limitation of prevailing evaluation protocols for soft-compressed
        RAG. Open-domain QA benchmarks typically provide questionanswer supervision
        rather than exhaustive utility annotations for every document in a retrieved
        candidate pool (Kwiatkowski et al. 2019; Joshi et al. 2017; Mallen et al.
        2023), while soft-compression models are commonly trained and evaluated on
        relatively small retrieved sets (Cheng et al. 2024; Louis, D\xE9jean, and
        Clinchant 2025; Louis et al. 2026). Because small topk pools contain few candidates
        and exclude most lower-ranked retrievals, they expose models to fewer marginal
        and irrelevant passages and a narrower range of passage utility, making the
        benefits of reranking difficult to measure. In larger candidate pools, reranking
        must distinguish answer-bearing evidence from numerous marginal documents
        (Nogueira and Cho 2019; Li and Ouyang 2025), while the total representation
        budget cannot grow proportionally with the number of candidates. Evaluating
        under these conditions is therefore necessary to assess not only which documents
        should reach the generator, but also how the finite memory budget should be
        distributed among them.\",\"metadata\":{\"ingestion_version\":\"01a0fc53885372038a1c6d0df171e569\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d-text-0002\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d\",\"chunk_type\":\"text\",\"section_path\":\"Introduction\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":5,\"page_no\":1,\"filename\":\"2609.22100v1.pdf\"}}},{\"id\":\"a3d2f6a7-82ce-5245-a8ed-2520c9e5da50\",\"version\":13,\"score\":0.5318774,\"payload\":{\"page_content\":\"C
        Second-Evaluator Sensitivity Audit\\nInference and diagnostics. The separate
        24-test family uses pointwise 95% bootstrap intervals and two-sided randomization
        tests, each with 10,000 replicates and seed 13, question resampling on ASQA
        and paper clustering on QASPER, with question-weighted means and Holm adjustment.
        The original 148-test analysis is unchanged. Tables 11-12 report precision
        means and all planned contrasts. All 16 emitted-grounded gaps remain positive
        after adjustment; the eight cross-evaluator precision differences remain unresolved,
        which does not establish equivalence. ECR and other budgets are outside this
        audit.\\nThe run scored 6,015 unique pairs in 419 seconds of model inference
        (430 seconds including bookkeeping; setup and excluded attempts are additional).
        Four inputs required truncation, with maximum pre-truncation length 47,440
        tokens. After normalization, 122 pairs (2.03%) produced nonbinary strings,
        including 103 empty strings; assigning zero does not establish reliable nonentailment.
        These are pair counts, not fractions of questions affected; the full histogram
        accompanies the cache. Recovery can disagree substantially: QASPER LLMLingua-2
        has 50.3% agreement over 1,000 candidate decisions and mean recovery rates
        of 0.84 for DeBERTa versus 0.38 for TRUE. These descriptive results support
        sensitivity analysis, not accuracy against human judgments.\\n\",\"metadata\":{\"ingestion_version\":\"01a0fc54ff9a70d3af0e9b49e864b8b9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde-text-0030\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde\",\"chunk_type\":\"text\",\"section_path\":\"C
        Second-Evaluator Sensitivity Audit\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":156,\"page_no\":19,\"filename\":\"2609.14245v1.pdf\"}}},{\"id\":\"a0ce46ce-16e2-53f9-b82c-0a975e84f980\",\"version\":7,\"score\":0.53180754,\"payload\":{\"page_content\":\"Experiments
        and Results\\nKILT-SCR. Weconstruct KILT-SCR as a large-candidatepool resource
        with training and evaluation splits. Its training split is derived from the
        training sets of Natural Questions (Kwiatkowski et al. 2019), HotpotQA (Yang
        et al. 2018), and TriviaQA (Joshi et al. 2017). The evaluation split contains
        examples from the evaluation sets of these three datasets, together with PopQA
        (Mallen et al. 2023), ASQA (Stelmakh et al. 2022), and BioASQ (Krithara et
        al. 2023; Tsatsaronis et al. 2015). For every query, we retrieve a fixed pool
        of 25 passages from KILT-100w (Petroni et al. 2021) using BAAI/bge-large-en-v1.5
        (Xiao et al. 2024).\\nFor each training query, we score candidates with cross-encoder/ms-marco-MiniLM-L6-v2
        (Bajaj et al. 2018) and provide the ten highest-scoring passages to Mistral-7B-Instruct-v0.2
        (Jiang et al. 2023a) to generate answer targets. We retain only instances
        for which a goldanswer alias occurs both in at least one retrieved passage
        and in the generated target, yielding 196,916 examples; teacher scores are
        globally standardized over this split. In contrast, we apply no answer-support
        or teacher-target filtering to KILTSCR evaluation split, which contains 2,000
        examples each from Natural Questions, HotpotQA, TriviaQA, and PopQA, 948 from
        ASQA, and 1,609 from BioASQ. At evaluation time, the learned reranker scores
        the fixed candidate pool before answer generation.\\nExperimental Setup. AdaMem
        uses a Llama-3.2-1BInstruct (Grattafiori et al. 2024) compressor and a Mistral-7B-Instruct-v0.2
        decoder adapted with LoRA (Hu et al. 2022). We first pretrain the compressor
        and AdaMem projection module on two million examples sampled from EleutherAI/SmolLM2-135M-10B
        (Allal et al. 2025), using autoencoding and language-modeling objectives.
        We then perform query-dependent fine-tuning on maxoul/pisco_finetuning_data
        (Louis, D\xE9jean, and Clinchant 2025), following the OSCAR training setup.
        Finally, we train on KILT-SCR with the joint answergeneration and reranker-distillation
        objectives. For all experiments, we report Substring Match as the primary
        evaluation metric. We provide additional LLM-as-a-judge metrics in the Supplementary
        Material.\\nFigure 3: Match (%) versus retrieval depth. AdaMem benefits from
        deeper retrieval more consistently than OSCAR, particularly under stronger
        compression.\",\"metadata\":{\"ingestion_version\":\"01a0fc53885372038a1c6d0df171e569\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d-text-0009\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d\",\"chunk_type\":\"text\",\"section_path\":\"Experiments
        and Results\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":47,\"page_no\":4,\"filename\":\"2609.22100v1.pdf\"}}},{\"id\":\"edb6739a-df0e-5d2e-a2f6-e824ee95e2f5\",\"version\":13,\"score\":0.5314038,\"payload\":{\"page_content\":\"Attributed
        generation and citation evaluation.\\nThe AIS framework evaluates whether
        statements are supported by identified sources (Rashkin et al., 2023). Automatic
        attribution and entailment evaluation (Bohnet et al., 2022; Honovich et al.,
        2022) inform the citation precision and recall metrics of ALCE (Gao et al.,
        2023), which we adapt. QASPER provides questions over research papers with
        annotator-marked evidence (Dasigi et al., 2021). LongCite studies fine-grained
        citation generation with long contexts (Zhang et al., 2025), a complementary
        direction to evaluating compression under a fixed generator.\\nCompression
        and citation reliability. Li et al. (2026a) study Self-RAG on ASQA with LLMLingua-2
        and prefix truncation, finding sharper degradation in citation grounding than
        answer quality, and investigate hierarchical evidence retention. Our study
        adds crossfamily comparisons on ASQA and QASPER, distinguishes declared and
        recovered source mappings, and reports emitted and grounded scores against
        achieved context fractions. The conceptual finding overlaps; our contribution
        is experimental coverage and explicit evaluation and reporting procedures,
        rather than priority for the divergence. Wallat et al. (2025) distinguish
        citation correctness from causal faithfulness and investigate post-rationalization.
        Our NLI-based support scores do not establish whether the generator causally
        relied on the cited evidence. ALCE's summary-context ablation also illustrates
        a correctness-citation trade-off (Gao et al., 2023); information-preservation
        studies examine grounding under compression (\u0141ajewska et al., 2025),
        and human evaluations examine verifiability as output abstractiveness changes
        (Worledge et al., 2024).\\nProvenance and structured representations. Related
        provenance-oriented designs include claim-anchored multi-document summarization
        in CAMS (Guan, 2026), budgeted evidence retention in agent memory (Li et al.,
        2026b), and provenance-aware tiered memory (Zhu et al., 2026). Structured
        retrieval indexes use atomic propositions (Chen et al., 2024), recursive summary
        trees (Sarthi et al., 2024), or graph community summaries (Edge et al., 2024).
        These designs motivate explicit links between condensed representations and
        source evidence, but are not evaluated as compressors here. Attention-based
        explanations remain contested (Jain and Wallace, 2019; Wiegreffe and Pinter,
        2019). Slot-based representations (Locatello et al., 2020; Tan and Kok, 2025;
        Ibtehaz and Kihara, 2026) suggest another possible compression mechanism;
        whether their internal structure can provide validated source attribution
        is an untested future direction.\",\"metadata\":{\"ingestion_version\":\"01a0fc54ff9a70d3af0e9b49e864b8b9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde-text-0004\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde\",\"chunk_type\":\"text\",\"section_path\":\"Attributed
        generation and citation evaluation.\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":17,\"page_no\":2,\"filename\":\"2609.14245v1.pdf\"}}},{\"id\":\"1a2e8a35-8a1f-56b6-8b90-46f4355a654e\",\"version\":15,\"score\":0.531149,\"payload\":{\"page_content\":\"5.1
