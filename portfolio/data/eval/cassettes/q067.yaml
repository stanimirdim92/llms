      Compare how these papers evaluate retrieval quality.\\n\\nAccepted answer: An
      aggregate question: it spans documents and cannot be answered from a top-k of
      chunks.\\n\\nSystem answer: These papers take quite different approaches to
      evaluating retrieval-related quality in RAG systems, reflecting their different
      concerns (context compression, memory allocation, adversarial robustness, and
      citation faithfulness).\\n\\n## Context compression benchmarks (2609.14245v1)\\n\\nThis
      paper evaluates compressors using **attribution benchmarks with different retrieval
      granularities**. It uses ASQA comprises 948 ambiguous factoid questions from
      the ALCE release, each paired with the top-5 GTR-retrieved passages, sentence-segmented
      into citable snippets; answer quality is string exact match (str-EM), and QASPER,
      the 1,005-question dev split over 281 NLP papers, using each supplied paper's
      abstract and full text, where gold evidence is paragraph-level, so identity
      presents paragraphs as citable units while compressors operate on sentence snippets.
      Retrieval quality itself is not directly scored; instead, the paper measures
      how well compressed contexts preserve **grounded citation precision/recall**
      and **answer correctness** as a function of achieved compression ratio, compared
      across six compressors (identity, rerank top-k, extractive, RECOMP, LLMLingua-2,
      and their own ECR method) which ranks sentences, greedily clusters near-duplicates
      by Jaccard word overlap, and emits one unit per cluster\u2014the highest-relevance
      member sentence verbatim\u2014citing all member sentence ids. The figures show
      that ECR consistently achieves the highest precision and recall among compression
      methods across context fractions (~0.4-0.55), while LLMLingua-2 performs poorly
      (near 0.0-0.15) on citation precision/recall.\\n\\n## Memory-compression and
      retrieval depth (2609.22100v1)\\n\\nThis paper evaluates retrieval quality indirectly
      through **robustness to retrieval depth and compression ratio**. It compares
      AdaMem and OSCAR across retrieval depths k \u2208 {5, 10, 15, 20, 25} and compression
      ratios of 16\xD7, 32\xD7, and 64\xD7, finding that at 64\xD7, increasing k from
      5 to 25 improves AdaMem by 3.5 points on TriviaQA, 5.4 on Natural Questions,
      and 4.2 on HotpotQA, while OSCAR changes only marginally over the same range.
      It also constructs a dedicated large-pool evaluation resource, KILT-SCR: for
      every query, they retrieve a fixed pool of 25 passages from KILT-100w using
      BAAI/bge-large-en-v1.5, and reports Substring Match as the primary evaluation
      metric, supplemented by \\n\\nPass only if the system answer states the same
