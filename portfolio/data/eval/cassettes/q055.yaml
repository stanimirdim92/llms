      . 0148 ), while recall rises from 0.56 to 0.63 and str-EM falls from 0.34 to
      0.25 (both p H = 0 . 0148 ). The corresponding QASPER precision difference is
      negative ( \u2206 = -0 . 089 , CI [ -0 . 124 , -0 . 052 ], p H = 0 . 0148 ).
      These dataset-specific results do not isolate a causal effect of citation granularity.\nDeclared
      provenance determines verification coverage (H4). Table 1 contrasts declared-span
      and summary checking. For RECOMP on ASQA the unsupported rates are 1.00 and
      0.17, respectively; the corresponding QASPER values are 1.00 and 0.50. LLMLingua-2
      has rates of 1.00 vs. 0.51 on ASQA and 1.00 vs. 0.65 on QASPER. Every 1 . 00
      here is structural: no declared source evidence reaches the span verifier, so
      claims fail without an entailment judgment. These values do not establish that
      all claims lack recoverable source support. Recovered-source verification now
      supplies a direct claim-level comparison: for RECOMP, unsupported rates are
      0.88 on ASQA and 0.95 on QASPER. Their paired differences from summary checking
      are 0.712 (CI [0.683, 0.739]) and 0.450 [0.417, 0.483], both p H = 0 . 0148
      . LLMLingua-2''s recovered-source rates are 0.90 and 0.91, with differences
      0.394 [0.362, 0.426] and 0.253 [0.225, 0.282] (both p H = 0 . 0148 ). These
      gaps persist when recovery is attempted, but remain conditional on the bounded
      search and shared NLI evaluator. For provenance-declaring methods, displayed
      rate differences are below 0.01 in magnitude; no mode comparison survives Holm
      correction, which does not establish equivalence.", "3.2 What counts as citing
      the planted passage\nThe re-run answer may be worded differently, so we first
      locate the sentence that best matches the original claim by word overlap (Jaccard
      similarity of at least 0.3), then ask whether that sentence cites the doctored
      passage. This is our claim-aligned outcome, and the pairing carries the weight:
      it asks whether the model cited the planted passage for the claim we planted
      into , not whether the marker turns up loose somewhere in the answer. We keep
      the looser cited-anywhere outcome as a sensitivity check, and Section 5.1 shows
      how much slack it introduces.\nWe score every record, with no filtering on whether
      the planted span reappears in the new answer. The original probe conditions
      on exactly that, and our control shows why it should not: with nothing planted
      at all, those four words come back in 60-74% of answers, simply because the
      model wrote them in the first place. Span recovery tells us the model repeated
      itself, not that our plant did anything.", "5 Results\nEmitted and grounded
