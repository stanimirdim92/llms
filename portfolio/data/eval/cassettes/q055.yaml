      Which of my papers measure whether a RAG answer's citations are faithful to
      the evidence, not just present?\\n\\nAccepted answer: The attribution-compression
      study, which separates emitted from grounded citation scores by resolving each
      citation to retrieved source spans, and the RLVR citation-faithfulness study,
      which measures post-rationalization, where a model writes the answer first and
      attaches a citation to whatever passage looks close enough.\\n\\nSystem answer:
      Two papers in your collection directly address citation faithfulness (as opposed
      to mere citation presence/correctness), and a third is related but focused on
      a different robustness problem.\\n\\n## 2609.23053v1.pdf \u2014 the most directly
      relevant paper\\n\\nThis paper is explicitly built around the faithfulness-vs-correctness
      distinction. A RAG system can hand you the right answer and cite a source it
      did not actually use\u2014models output these unfaithful citations via postrationalization,
      writing the answer first and then attaching a citation to whatever passage looks
      close enough. It distinguishes this from standard citation evaluation: most
      evaluations score whether a citation is correct: does the cited passage support
      the sentence? Wallat et al. pushed on a harder question: did the model actually
      use it? Those two can come apart\u2014a model that already knows the answer
      can write it down, scan the passages, and attach the one that fits, producing
      a citation that is correct and unfaithful at the same time.\\n\\nThe paper uses
      a \\\"planting\\\" probe to test this causally. In one illustrated case, the
      baseline model correctly names Heath Ledger as the Joker and cites the Heath
      Ledger article; the researchers then copied four words of the model's own sentence
      into a plot summary of a Batman cartoon and asked again\u2014the answer did
      not change, but the citation moved to the cartoon passage, which never answers
      the original question, while the Ledger article stayed right there in the context.
      Four words were enough to make the model cite a source it did not use during
      inference.\\n\\nThe main empirical finding: post-rationalization is common and
      it is not an artifact of RL\u2014the untrained baseline cites unfaithfully for
      roughly one out of seven questions on Wikipedia-based datasets, and under fixed-context
      inference, RLVR leaves it untouched, with Search-R1 and ReSearch tracking their
      base model within a couple of points and R-Search landing slightly worse. The
      conclusion is that training a model to answer correctly teaches it nothing about
      citing honestly, which means citation faithfulness has to be rewarded and measured
      directly.\\n\\n## 2609.14245v1.pdf \u2014 related, focused on compression's
      effect on attribution\\n\\nThis paper studies a related but distinct problem:
      whether compressor-based RAG citations point to genuine source evidence or just
      to compressor-generated summaries. It introduces the concept of \\\"attribution
      laundering\\\": abstractive compression can interrupt this link when citations
      identify compressor-generated text without its supporting source spans\u2014we
      call it attribution laundering when consistency with compressor-generated text
      is treated as evidence of support from original sources. Notably, this paper
      is explicit that it does **not** test causal faithfulness the way the first
      paper does: citation support does not establish\\n\\nPass only if the system
      answer states the same facts as the accepted answer. Wording may\\ndiffer; numbers,
      names and conclusions may not. If the accepted answer is a refusal, pass only\\nif
      the system also declines to answer rather than guessing. Extra correct detail
      is fine;\\nanything contradicting the accepted answer fails.\"}],\"model\":\"claude-opus-5\",\"output_config\":{\"format\":{\"type\":\"json_schema\",\"schema\":{\"type\":\"object\",\"title\":\"Verdict\",\"properties\":{\"reasoning\":{\"type\":\"string\",\"description\":\"One
