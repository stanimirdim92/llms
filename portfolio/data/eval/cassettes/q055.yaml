      0.8, RECOMP.P g = 0.08. 0.8, RECOMP.reattr. = 0 . 31 n =929. 0.8, LLMLingua-2.P
      g = 0.04. 0.8, LLMLingua-2.reattr. = 0.20", "4.2 Statistical Analysis and Metric
      Audit\nCommon cohorts and estimands. Primary summaries and comparisons use the
