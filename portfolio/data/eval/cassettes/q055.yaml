        What counts as citing the planted passage\\nThe re-run answer may be worded
        differently, so we first locate the sentence that best matches the original
        claim by word overlap (Jaccard similarity of at least 0.3), then ask whether
        that sentence cites the doctored passage. This is our claim-aligned outcome,
        and the pairing carries the weight: it asks whether the model cited the planted
        passage for the claim we planted into , not whether the marker turns up loose
        somewhere in the answer. We keep the looser cited-anywhere outcome as a sensitivity
        check, and Section 5.1 shows how much slack it introduces.\\nWe score every
        record, with no filtering on whether the planted span reappears in the new
        answer. The original probe conditions on exactly that, and our control shows
        why it should not: with nothing planted at all, those four words come back
        in 60-74% of answers, simply because the model wrote them in the first place.
        Span recovery tells us the model repeated itself, not that our plant did anything.\",\"metadata\":{\"ingestion_version\":\"01a0fc55257f7276be70b7b3d1501b36\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6-text-0008\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6\",\"chunk_type\":\"text\",\"section_path\":\"3.2
