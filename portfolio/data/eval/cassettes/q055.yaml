    body: "{\"max_tokens\":16000,\"messages\":[{\"role\":\"user\",\"content\":\"You
      check whether an answer is supported by its sources.\\n\\nQuestion: Which of
      my papers measure whether a RAG answer's citations are faithful to the evidence,
      not just present?\\n\\nSources the answer was written from:\\n[1] 2 Related
      Work\\nCitations in RAG. RAG conditions generation on retrieved passages (Lewis
      et al., 2020), and benchmarks such as ALCE ask models to cite those passages
      sentence by sentence (Gao et al., 2023). Most evaluations score whether a citation
      is correct : does the cited passage support the sentence? Wallat et al. (2025)
      pushed on a harder question: did the model actually use it? Those two can come
      apart. A model that already knows the answer can write it down, scan the passages,
      and attach the one that fits, producing a citation that is correct and unfaithful
      at the same time. Their planting probe exposes the gap, and we reproduce it,
      then add the control it was missing (Section 3).\\nRLVR search agents. Search-R1
      (Jin et al., 2025), ReSearch (Chen et al., 2025), and R-Search (Zhao et al.,
      2025) teach a language model to interleave search calls with reasoning, rewarding
      it when the final answer checks out against a reference. All three release open
      weights trained from Qwen2.5-7B-Instruct, which lets us line each agent up against
      the exact model it grew from. Their papers report answer quality. None of them
      reports how many citations are faithful, which is the gap we fill.\\nFaithful
      reasoning is a different question. VERITAS (Xu et al., 2025) showed that the
      reasoning traces of Search-R1 and ReSearch do not always line up with the searches
      they issue, the information they retrieve, or the answers they produce. That
      is faithfulness within the reasoning chain. We ask about faithfulness to the
      evidence : is the cited passage the one the answer leaned on? An agent can narrate
      its search honestly and still misattribute the result, or reason sloppily and
      cite correctly. The two findings sit side by side rather than in conflict.\\n\\n[2]
      Abstract\\nA RAG system can hand you the right answer and cite a source it did
      not actually use. Models output these unfaithful citations via postrationalization
      : they write the answer first and then attach a citation to whatever passage
      looks close enough. Search agents are now trained with reinforcement learning
      from verifiable rewards (RLVR), which pays them for getting the answer right.
      We asked whether that training also teaches them to cite honestly.\\nImproving
      an existing methodology with a required control, we compared an instructiontuned
      model against three RLVR agents trained from it, on four question-answering
      datasets, using only free-tier Kaggle GPUs. Postrationalization is everywhere:
      on Wikipediabased questions roughly one citation in seven is unfaithful. RLVR
      does not fix it. The agents post-rationalize at their base model's rate, and
      one lands slightly worse. Rewarding correct answers buys nothing in citation
      faithfulness, so faithfulness has to be trained and measured on its own terms.\\n\\n[3]
      Answer (after planting):\\nHeath Ledger plays the Joker in Batman The Dark Knight
      [4].\\nFigure 1: A real case from our baseline model on NQ. Passage [4] is a
      plot summary of a Batman TV episode; it never mentions Heath Ledger or the film.
      We appended four words from the model's own answer to it (shaded). The model
      then cites [4] instead of [1], although [1] is still in the context and supports
      the claim. Passages are abridged, and the other three retrieved passages are
      not shown.\\npassage. Only someone who reads that passage closely notices that
      it never supported the claim.\\nFigure 1 shows how thin the connection can get.
      Our baseline model correctly names Heath Ledger as the Joker and cites the Heath
      Ledger article. We then copied four words of the model's own sentence into a
      plot summary of a Batman cartoon and asked again. The answer did not change.
      The citation moved to the cartoon passage, which never answers the original
      question, while the Ledger article stayed right there in the context. Four words
      were enough to make the model cite a source it did not use during inference.\\nThis
      gets more pressing as RAG systems move from prompting to training. Search agents
      such as Search-R1 (Jin et al., 2025), ReSearch (Chen et al., 2025), and R-Search
      (Zhao et al., 2025) learn to search, read, and answer through reinforcement
      learning from verifiable rewards (RLVR), where the reward comes from checking
      the final answer. These agents get better at finding answers. Whether they also
      get better at pointing to the passage they used is a separate question, and
      their reward never asks it. That is the question we set out to answer.\\nWith
      a measurement we trust, we compared four models that share one base, Qwen2.5-7B-Instruct
      (Qwen Team, 2024): the instruction-tuned model itself and three open-weight
      RLVR agents trained from it. One shared base is what makes the comparison clean,
      since any gap between an agent and the baseline comes from training rather than
      from a different model family. We ran all four across four question-answering
      datasets on Kaggle's T4 GPUs.\\nTwo findings stand out. Post-rationalization
      is common and it is not an artifact of RL: our untrained baseline cites unfaithfully
      for roughly one out of seven questions on the Wikipedia-based datasets. Under
      fixed-context inference, RLVR leaves it untouched. Search-R1 and ReSearch track
      their base model within a couple of points in either direction, and R-Search
      lands slightly worse rather than better. Our sample sizes would have caught
      any shift of about seven percentage points, so a large improvement is ruled
      out. Training a model to answer correctly, it turns out, teaches it nothing
      about citing honestly, which means citation faithfulness has to be rewarded
      and measured directly.\\nWe contribute:\\n\\n[4] 1 Introduction\\nContext compression
      reduces generator input in retrieval-augmented generation (RAG) (Xu et al.,
      2024; Jiang et al., 2024; Pan et al., 2024; Chirkova et al., 2025). Citation-grade
      attribution requires locatable evidence: a reader must be able to retrieve and
      check the cited source (Rashkin et al., 2023; Bohnet et al., 2022). Abstractive
      compression can interrupt this link when citations identify compressor-generated
      text without its supporting source spans. We call it attribution launder- ing
      when consistency with compressor-generated text is treated as evidence of support
      from original sources. On ASQA at nominal budget 0 . 25 (achieved ratio 0 .
      08 ), a RECOMP-style compressor's citations score 0.86 precision against its
      summaries and 0.12 against source spans under our recovery protocol. These automatic
      scores depend on a shared NLI evaluator and bounded candidate search; they have
      not been independently calibrated.\\nRelated work already identifies a divergence
      between answer quality and citation grounding under compression (Li et al.,
      2026a), while citation support does not establish causal reliance on evidence
      (Wallat et al., 2025). We examine this problem across compressor families and
      two datasets, reporting achieved context fractions, explicit sourcerecovery
      rules, and paired comparisons on shared questions. Our measurements concern
      source support under an automatic evaluation protocol; they do not test causal
      citation faithfulness.\\nWe conduct a controlled measurement study with a fixed
      generator (Qwen2.5-7B-Instruct with ALCE-style numbered-context citation prompting),
      a fixed primary NLI evaluator, and nominal budgets of { 0 . 5 , 0 . 25 , 0 .
      1 , 0 . 05 } in generatortokenizer tokens. Our contributions are:\\n- The attribution-compression
      frontier. A comparison across reranking, extractive selection, abstraction,
      token pruning, ECR, and an identity reference against achieved context fractions.
      All settings share 944 successful ASQAquestions and 976 QASPER questions from
      271 papers; paired tests quantify their differences.\\n- A re-attributability
      protocol. A unit without declared provenance is counted as reattributable when
      NLI predicts entailment from a candidate source snippet; recovered sources support
      grounded citation scores\\n- alongside emitted scores against compressed text.\\n-
      Three verification modes. We separate consistency with summaries, availability
      of declared provenance, and claim support after source recovery. Structural
      rejection under declared-only checking is distinguished from measured rejection
      after recovery.\\n- An extract-cluster-rewrite (ECR) observation. A simple construction
      greedily merges near-duplicate sentences and cites all members of each cluster;
      paired comparisons quantify its measured differences from extraction across
      budgets.\\n\\n[5] 3.1 Setup\\nOur pipeline is retrieve \u2192 compress \u2192
