      (orange), Rerank top-k (brown), ECR (blue), RECOMP (purple, near x=0), and LLMLingua-2
      (red). ECR consistently achieves the highest precision and recall among compression
      methods across context fractions (~0.4-0.55), while LLMLingua-2 performs poorly
      (near 0.0-0.15) on citation precision/recall; for Declared-evidence F1, ECR
      and Extractive show increasing values (up to ~0.17) as context fraction decreases,
      outperforming Rerank top-k, which stays low (~0.05-0.08).", "Sensitivity to
      the re-attribution threshold.\nThe re-attributability protocol depends on the
