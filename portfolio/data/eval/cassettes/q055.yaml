        The planting probe\\nWe follow the probe of Wallat et al. (2025), which runs
        in three steps.\\n1. Answer. The model answers a question from five retrieved
        passages. Every sentence ends with exactly one citation, so each sentence
        and its marker form one claim .\\n2. Plant. We lift a short span out of the
        claim and append it to a passage the model did not cite for that claim, then
        re-run the same model on the doctored context with the same prompt.\\n3. Check.
        We ask whether the model now cites the doctored passage for that claim.\\nThe
        logic is a swap test. The doctored passage shares nothing with the claim except
        the words we pasted into it, and the passage the model originally cited never
        leaves the context. A model that reads for meaning has no reason to move.
        A model that matches surface strings has every reason to, and when it moves,
        its citation was never evidence of where the answer came from.\\nTable 1 lists
        the three variants, which differ only in which passage receives the span.
        REL-UNCITED plants in a passage the retriever returned and the model ignored,
        the situation a deployed system meets constantly, and it is our main measure.\\nREL-UNCITED,
        Where the span is planted = A retrieved passage that the answer did not cite..
        CITED-OTHER, Where the span is planted = Apassage the answer already cites,
        but for a different sentence.. RANDOM, Where the span is planted = An uncited
        slot, after replacing its passage with one from a different question.\\nTable
        1: The three probe variants. Each changes exactly one of the five retrieved
        passages, and the passage that genuinely supports the claim stays in the context.
        RELUNCITED is our main measure.\\nChoosing the span. The original probe leaned
        on Command R+, which marks the exact words it grounds on. Qwen2.5 offers no
        such markup, so we need a rule, and we keep it blunt and deterministic: the
        four consecutive words of the claim with the most characters. This decision
        was influenced by Wallat et al. (2025). We played around with 2-4 words for
        the span and choosing four words minimized bias.\",\"metadata\":{\"ingestion_version\":\"01a0fc55257f7276be70b7b3d1501b36\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6-text-0007\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6\",\"chunk_type\":\"text\",\"section_path\":\"3.1
        The planting probe\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":36,\"page_no\":2,\"filename\":\"2609.23053v1.pdf\"}}},{\"id\":\"782c601e-59f2-57aa-8028-dd975b9eb179\",\"version\":15,\"score\":0.6300163,\"payload\":{\"page_content\":\"5.2
        Post-rationalization is common\\nRAGTruth stands apart, two to five times
        lower than the rest for every model. Prompt, scorer, and citation format are
        identical across datasets, so the gap belongs to the data. Its passages are
        web text rather than Wikipedia and its answers run longer, and we cannot say
        from four datasets which of those matters. The practical reading is that postrationalization
        rates are domain-dependent, so a single-corpus number should not be quoted
        as a property of a model.\",\"metadata\":{\"ingestion_version\":\"01a0fc55257f7276be70b7b3d1501b36\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6-text-0017\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6\",\"chunk_type\":\"text\",\"section_path\":\"5.2
        Post-rationalization is common\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":88,\"page_no\":6,\"filename\":\"2609.23053v1.pdf\"}}},{\"id\":\"97a0f9ed-f288-55cb-a02c-c382f6a92bc0\",\"version\":13,\"score\":0.62905204,\"payload\":{\"page_content\":\"3.3
        Three Verification Modes\\nWe decompose each answer into claims (its statements
        with citation markers stripped; cf. atomicfact decomposition, Min et al.,
        2023) and check each claim against evidence pooled from its cited units. Summary-checked
        ( U m ) pools the cited units' own texts. Span-checked ( U s ) pools only
        the declared source spans of the cited units; claims without such evidence
        count as unsupported without an NLI call. We retain the label 'spanchecked'
        for this declared-only mode, which differs from grounded citation scoring:
        it does not recover missing spans. Its unsupported rate of 1 . 00 for methods
        without declared provenance is a consequence of this policy, not an empirical
        estimate that every claim lacks source support. Recoveredsource checking (
        U r ) first resolves units to declared spans or, when absent, spans recovered
        by the same protocol used for grounded citation scoring. It deduplicates the
        pooled source IDs before verifying each claim; absent evidence still counts
        as unsupported. We evaluate this third mode for RECOMP and LLMLingua-2 at
        nominal 0.25 on both datasets. For methods whose units all declare provenance,
        recovered-source and declared-span checking coincide. We report generator
        input, logical verifier input (premise plus hypothesis), and their sum under
        declared-span checking as a partial token-cost proxy (Table 2).\\nEvidence
        selection on QASPER. On QASPER (Dasigi et al., 2021) we additionally evaluate
        the compressor's own attribution: declared cited sids are mapped to their
        (whitespace-normalized) full paragraph texts and scored by set-F1 against
        the gold evidence paragraphs, taking the maximum over annotators per the official
        protocol. Runs without declared provenance have no declaredevidence F1; recovered-span
        scores would measure a different attribution pathway.\",\"metadata\":{\"ingestion_version\":\"01a0fc54ff9a70d3af0e9b49e864b8b9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde-text-0007\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde\",\"chunk_type\":\"text\",\"section_path\":\"3.3
        Three Verification Modes\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":29,\"page_no\":3,\"filename\":\"2609.14245v1.pdf\"}}},{\"id\":\"77f26e0a-bd5e-5a63-a1d7-18e0907f7612\",\"version\":13,\"score\":0.62551105,\"payload\":{\"page_content\":\"Abstract\\nContext
        compression reduces generator input in retrieval-augmented generation, but
        answer quality alone does not characterize citation attribution. We measure
        citation attribution across compression methods and budgets, comparing reranking,
        extractive selection, abstractive summarization, token pruning, and an extract-cluster-rewrite
        construction on ASQA and QASPER under a fixed generator and primary entailment
        evaluator. On ASQA at a nominal 0.25 budget (achieved compression 0.08), a
        RECOMP-style compressor's citations score 0.86 precision against its summaries
        but 0.12 against source spans under our re-attributability protocol. These
        estimates depend on a shared NLI model for span recovery and citation scoring
        and lack independent human calibration. Extractive selection's observed grounded
        precision ranges from 0.43 to 0.49 across nominal budgets from one-half to
        one-tenth of the ASQA context, while answer quality declines. For the same
        RECOMP setting, claim verification after source recovery yields an unsupported
        rate of 0.88 versus 0.17 when checking summaries. This gap persists beyond
        structural rejection of missing provenance, but remains evaluator-dependent.
        A 200-question TRUE T5-XXL audit also finds emitted-grounded gaps under both
        fixed and recomputed source mappings, without establishing human-calibrated
        support rates.\",\"metadata\":{\"ingestion_version\":\"01a0fc54ff9a70d3af0e9b49e864b8b9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde-text-0001\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde\",\"chunk_type\":\"text\",\"section_path\":\"Abstract\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":4,\"page_no\":1,\"filename\":\"2609.14245v1.pdf\"}}},{\"id\":\"c5b0c05c-2e66-5f5c-a0f2-124748f30408\",\"version\":15,\"score\":0.6220385,\"payload\":{\"page_content\":\"Answer
        (after planting):\\n- A no-planting control as an improvement to the existing
        methodology , to get a more accurate idea about post-rationalization.\\n-
        The first controlled measurement of postrationalization in RLVR search agents
        , holding the base model, retrieval corpus, prompt, and scorer fixed across
        four datasets.\\n- Evidence that answer-only rewards leave citation faithfulness
