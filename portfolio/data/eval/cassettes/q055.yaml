      and reranking trade off citation scores and answer quality. ASQA extraction
      yields grounded precision 0.43, 0.49, 0.49, and", "3.1 Setup\nOur pipeline is
      retrieve \u2192 compress \u2192 generate \u2192 evaluate. A compressor maps
      the retrieved snippets (sentence-segmented, each with a stable source id, sid
      ) to a sequence of units , and every unit either declares provenance-the set
      of sids it was selected from, as in extractive familiesor declares none, as
      in abstractive families. The generator sees the units as a numbered context
      and is prompted, ALCE-style, to attach bracketed unit citations to each answer
      sentence (Gao et al., 2023). Citation quality is scored per answer statement
      with an NLI evaluator in the attributableto-identified-sources sense (Rashkin
      et al., 2023; Bohnet et al., 2022): a statement is recalled iff the concatenation
      of its resolvable cited sources entails it, and a citation is precise iff that
      concatenation entails the statement and, in addition, the cited source alone
      entails it or removing that source breaks the concatenation''s entailment (Gao
      et al., 2023). We use DeBERTa-v3-base (MNLI+FEVER+ANLI) at threshold \u03c4
      =0 . 5 , truncating each NLI input to 512 model tokens. Entailment decisions
      below are this model''s predictions, not independently validated judgments of
      source support. Per-example harness failures occur only in identity (4 of 948
      on ASQA, 29 of 1,005 on QASPER); every primary setting excludes those same question
      IDs, with failure counts retained.", "D Robustness Checks\nThese tables support
      Section 5. Table 8 covers the RANDOM control for all models, Table 9 shows CITED-OTHER
      under the claim-aligned outcome, and Tables 10 and 11 repeat the agent comparison
      under the two checks discussed in Section 5.4.\nNQ, Baseline = +10.8. NQ, Search-R1
      = +8.9. NQ, ReSearch = +9.0. NQ, R-Search = +10.3. QAMPARI, Baseline = +4.4.
      QAMPARI, Search-R1 = +5.7. QAMPARI, ReSearch = +7.8. QAMPARI, R-Search = +8.2.
