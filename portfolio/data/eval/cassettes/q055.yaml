      Yih, Tim Rockt\u00e4schel, Sebastian Riedel, and Douwe Kiela. 2020. Retrieval-augmented
      generation for knowledgeintensive NLP tasks. In Advances in Neural Information
      Processing Systems , volume 33, pages 94599474.\n- Cheng Niu, Yuanhao Wu, Juno
      Zhu, Siliang Xu, KaShun Shum, Randy Zhong, Juntong Song, and Tong Zhang. 2024.
      RAGTruth: A hallucination corpus for developing trustworthy retrieval-augmented
      language models. In Proceedings of the 62nd Annual Meeting of the Association
      for Computational Linguistics (Volume 1: Long Papers) , pages 1086210878, Bangkok,
      Thailand. Association for Computational Linguistics.", "4 Experimental Setup\nLeakage
      drove the dataset choice. NQ is where the original probe ran, so we keep it
      for comparability, but Search-R1 trained on NQ''s training split and we say
      so plainly. QAMPARI, HAGRID, and RAGTruth were not used to train any of the
      three agents, so on those datasets no gap can be waved away as familiarity with
      the data. They also sidestep a retrieval quirk in NQ: for 186 of 499 NQquestions
      (37.3%), all five passages come from one document, which leaves the model almost
      no choice about what to cite. The other three datasets have no such questions.\nPrompt
      and generation. One prompt does all the work, byte-identical across models and
      across the clean and doctored runs. It tells the model to answer using only
      the numbered passages, to close every sentence with exactly one citation such
      as [2], and to reply ''I don''t know'' when the passages fall short. Decoding
      is greedy, capped at 300 new tokens. When any sentence of an answer breaks the
      one-citation rule we drop the whole answer rather than salvage the compliant
      half, because a partly rescued answer reintroduces the claim-to-citation ambiguity
      the format exists to prevent. Models differ sharply in how often they abstain,
      from 15% to 52% of questions; Appendix C takes that apart. The full prompt is
      in Appendix A.\nReading our numbers. Three statistical choices shape every result,
      and each has a plain reason behind it.\nWe resample questions, not claims. A
      single question yields up to seven claims that share one context and one generated
      answer, so treating claims as independent would make our intervals look tighter
      than they are. We use a cluster bootstrap instead: draw whole questions with
      replacement 2,000 times, recompute the planted and control conditions on the
      same draw so the pairing survives, and read off the 2.5th and 97.5th percentiles.
      Every 95% confidence interval in this paper is that band, the range of effects
      our data are consistent with.\nWe compare each agent against its own base. Post-rationalization
      is common in the baseline, so reporting that an agent post-rationalizes tells
      us nothing about RL. The question is whether an agent diverges from the model
      it was trained from. That calls for a difference-in-differences: take the plantversus-control
      difference within a model (Equation 1), then difference those differences across
      models,\n<!-- formula-not-decoded -->\nNegative says RLVR made citations more
      faithful, positive says it made them worse, and zero says training left this
      behavior alone. Within each dataset we test all three agents against the baseline
      and correct the three comparisons with the Holm method, so that running three
      tests does not manufacture a significant one.", "Ethics Statement\nThis work
      uses only publicly released models and datasets. It involves no human subjects
      and no personal data. The planted spans are taken from the models'' own answers
      and are used only in offline evaluation. The work describes a way that citations
      in RAG systems can mislead readers, with the aim of making that failure measurable;
      it does not provide a method for attacking deployed systems. Because RLVR training
      is in wide use, we have tried to state the limits of our null result clearly
      so that it is not read as a stronger claim than the data support.", "5.3 RLVR
      does not make citations more faithful\nRaw rates alone cannot answer the RL
      question, since a model could post-rationalize heavily and still be no worse
      than the model it came from. Table 5 therefore reports the difference-indifferences:
      each agent''s attributable rate minus its base model''s, on the same dataset.
      If RLVR taught these agents anything about grounding, this column would run
      negative.", "3.3 The no-planting control\nWallat et al. (2025) report raw planted
      rates. A raw rate answers ''how often does the model cite the doctored passage?''
      What we need is ''how much of that did the plant cause?'' The two come apart
      whenever editing the context does anything on its own, and a raw rate quietly
      credits the plant with all of it.\nThe fix is to run the same context with the
      span removed and subtract:\n<!-- formula-not-decoded -->\nRead Equation 1 as
      a before-and-after over the same records. The first term counts how often the
      model takes the bait; the second counts how often it would have cited that passage
      anyway; the difference is what the plant actually bought.\nWhat makes this control
      unusual is that we could derive two of its three values before spending a single
      GPU-hour, just by reading how each variant is built.\nREL-UNCITED: the control
      is 0 by construction. Planting here only appends words to a passage already
      sitting in the context. Delete them and the context is byte-for-byte the clean
      one; with an identical prompt and greedy decoding, the control run reproduces
      the clean answer exactly. That clean answer, by the very rule that selected
      this passage, did not cite it for this claim. The control rate is therefore
      0 as a matter of definition rather than measurement, and the raw rate already
      is the attributable rate. We verified the byte-for-byte claim on all 10,720
      records of the two appending variants; 6 score above zero, all from RAGTruth
      answers that repeat an identical sentence.\nCITED-OTHER: the control is 100%,
      so a raw rate is an illusion. This variant plants in a passage the clean answer
      already cites for some other sentence. Under the cited-anywhere outcome we are
      then asking whether a passage that was cited stays cited, and it does, by selection.
      A raw rate here describes our sampling rule, not the model''s behavior, which
      is exactly why the attributable rate turns negative in Section 5.1.\nRANDOM:
      the control has to be measured. Here we swap an uncited slot for a passage drawn
      from a different question, then plant in it. Two things change at once, the
      passage and the span, and no amount of reasoning tells us how often a model
      cites an out-of-place passage on its own. This is the one variant that needed
      fresh runs: 16 GPU jobs, roughly 10 GPU-hours, and 7,625 control records, each
      paired with its planted twin. The answer came back small. With no plant, models
      cite the foreign passage in 17 of 7,625 records, or 0.2%.", "5 Results\n0.42
      across achieved ratios 0.51, 0.26, 0.11, and 0.06. Relative to identity, precision
      is lower at nominal 0.50 and 0.05 ( p H = 0 . 0148 ); the intermediate differences
      are unresolved ( p H = 1 ), not evidence of preservation. Its str-EM decreases
