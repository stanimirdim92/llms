      distinction. A RAG system can hand you the right answer and cite a source it
      did not actually use\u2014models output these unfaithful citations via postrationalization,
      writing the answer first and then attaching a citation to whatever passage looks
      close enough. It distinguishes this from standard citation evaluation: most
      evaluations score whether a citation is correct: does the cited passage support
      the sentence? Wallat et al. pushed on a harder question: did the model actually
      use it? Those two can come apart\u2014a model that already knows the answer
      can write it down, scan the passages, and attach the one that fits, producing
      a citation that is correct and unfaithful at the same time.\\n\\nThe paper uses
      a \\\"planting\\\" probe to test this causally. In one illustrated case, the
      baseline model correctly names Heath Ledger as the Joker and cites the Heath
      Ledger article; the researchers then copied four words of the model's own sentence
