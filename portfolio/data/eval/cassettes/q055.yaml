      adversaries from word scrambling. In Proceedings of the 2019 Conference of the
      North American Chapter of the Association for Computational Linguistics: Human
      Language Technologies, Volume 1 (Long and Short Papers) , pages 1298-1308, Minneapolis,
      Minnesota. Association for Computational Linguistics.\n- Qiming Zhu, Shunian
      Chen, Rui Yu, Zhehao Wu, and Benyou Wang. 2026. From lossy to verified: A provenance-aware
      tiered memory for agents. Preprint , arXiv:2602.17913.", "Limitations\nEvaluation
      format differs from training. The RLVR agents were trained to search, read,
      and answer across multiple turns in their own tagged format, whereas our evaluation
      supplies five fixed passages and requests a single citation-bearing response.
      This was necessary for the controlled attribution comparison, but it may affect
      how the agents behave: for example, an agent that would normally issue another
      query may instead abstain. The large differences in abstention and format compliance
      are consistent with this possibility, although our data cannot establish the
      mechanism. An interactive evaluation would be needed to determine whether the
      attribution effect differs in the agents'' native search setting.\nWe cannot
      isolate RL itself. Each agent differs from the baseline in three ways at once:
      it was fine-tuned at all, fine-tuned on retrieval data, and fine-tuned with
      reinforcement learning. Without an arm fine-tuned on the same data without RL,
      our comparison is associational. This is the single most valuable addition a
      follow-up could make.\nSearch-R1 saw NQ in training. It was trained on NQ''s
      training split and we evaluate it on KILTNQ. QAMPARI, HAGRID, and RAGTruth are
      clean for all three agents, and R-Search''s pattern is in fact strongest away
      from NQ, but we have not quantified the overlap.\nThe span always lands at the
      end of the passage. Any positional bias in how models pick citations is therefore
      mixed in with the effect of the plant. Randomizing the injection point is the
      obvious next experiment.\nCITED-OTHER is underpowered outside RAGTruth. NQ,
      QAMPARI, and HAGRID yield only 13-43 question clusters for this variant, too
      few for intervals we would defend. RAGTruth alone is large enough.\nWhat a flag
      means. Our scorer is deterministic string matching, so each flag is exactly
      reproducible: the model cited the doctored passage for the aligned claim. Reading
      that as postrationalization is an interpretation we inherit from Wallat et al.
      (2025), and a competing reading exists. After planting, the claim''s words genuinely
      sit in the doctored passage, so citing it could be scored as obedience to ''answer
      from the passages'' rather than as unfaithfulness. Hand-checking a sample of
      flagged cases would settle how often each reading applies, and we have not done
      it.\nScope. Three RLVR agents from one line of work, one base model, English
      only, one prompt, one decoding setting. Citation behavior may well shift with
      the prompt, so our numbers describe this setup until someone varies it.", "3.2
      Emitted vs. Grounded Citations\nWescore every run under two views. We write
      precision as P and recall as R , with subscripts e for emitted and g for grounded.
      Emitted scores citations against the unit texts the generator actually saw;
      it measures consistency with the compressed context, and is what one implicitly
      measures when compressed units are treated as citable documents. Grounded fi
      rst resolves each citation to retrieved source spans and scores against those.
      Units with declared provenance resolve to their declared sids. Units without
      declared provenance pass through our re-attributability protocol: rank source
      snippets by lexical similarity to the unit, run NLI on the top 10 candidates,
      and keep those judged to individually entail the unit at \u03c4 . A citation
      with no recovered span receives no precision credit and cannot support recall
      under this protocol. The reattribution rate is the fraction of units without
      declared provenance with at least one recovered span, averaged across examples.\nEvaluator
      dependence. The same NLI model filters recovered spans and scores citation support,
      creating a circularity risk: selection and evaluation errors can be correlated.
      Lexical retrieval can miss paraphrases, and the single-snippet test can reject
      units supported only by combined evidence. Thus failed recovery does not establish
      that support is absent from the source, and the direction of overall scoring
      bias is unknown. Appendix C reports a second-evaluator sensitivity check; human
      calibration remains absent.\nThe emitted -grounded gap is an operational diagnostic
      of attribution laundering : claims receive credit against compressed text that
      is not supported through the source mappings accepted by our protocol. It does
      not by itself distinguish missing evidence from recovery or NLI errors.\nNominal
      vs. achieved compression. Budgets are nominal fractions { 0 . 5 , 0 . 25 , 0
      . 1 , 0 . 05 } of each example''s retrieved context, enforced in generator-tokenizer
      tokens. Extractive families track their budgets closely, but abstractive compressors
      emit what their decoder emits: RECOMP realizes achieved ratios of 0 . 05 -0
      . 08 on ASQA and \u2248 0 . 015 on QASPER across all four nominal budgets-distinct
      nominal operating points collapse together. All curves therefore use the achieved
      ratio on the compression axis; plotting against nominal budgets would misplace
      abstractive systems by more than an order of magnitude in the worst case.",
      "Table 4: How often each model follows the planted span: attributable rate on
      REL-UNCITED in %, with cited records over all records below. The control is
      0 in every cell, so these equal the raw rates. Baseline 95% CIs: NQ [10.4, 17.8],
      QAMPARI [6.2, 12.0], HAGRID [11.8, 18.2], RAGTruth [1.8, 3.9].\n\n| Dataset   |
      Baseline    | Search-R1   | ReSearch    | R-Search    |\n|-----------|-------------|-------------|-------------|-------------|\n|
      NQ        | 14.0 52/371 | 12.8 36/281 | 14.1 50/355 | 14.7 57/387 |\n| QAMPARI   |
      9.1 29/319  | 13.4 38/283 | 7.5 25/332  | 12.2 43/352 |\n| HAGRID    | 14.8
      64/433 | 13.8 53/383 | 13.6 59/434 | 18.6 80/430 |\n| RAGTruth  | 2.9 25/864  |
      4.1 29/699  | 3.6 30/823  | 5.9 52/879  |", "5.1 What the control changes\nREL-UNCITED:
      the raw rate survives untouched. Read the top block: 52 of 371 NQ claims follow
      the plant, and 0 of those same 371 records cite the doctored passage when we
      take the span away. The control column is 0/ n on all four datasets, which is
      what Section 3.3 predicted, because removing four appended words restores the
      clean context exactly and the clean answer never cited that passage for that
      claim. Prediction and measurement agree, so +14.0pp on NQ is not a raw rate
      that needs an asterisk; it is the attributable effect.\nRANDOM: the control
      is real but tiny. Swapping in a passage from an unrelated question does occasionally
      earn a citation on its own, as the 4/433 on HAGRID and 1/864 on RAGTruth show,
      but the effect is small: 0.2% pooled across the 7,625 control records, with
      7 of 16 model-dataset cells at exactly zero and the rest between 0.1% and 0.9%
      (Appendix D). Between 83% and 100% of each raw rate survives as attributable,
      97% on average. The confound we built this control to catch turned out to be
      genuine and negligible, which is worth knowing precisely because we could not
      have assumed it.\nCITED-OTHER: the raw rate lies, and the control catches it.
      The bottom block is the reason we care about all this. Planted rates run from
      78.9% to 89.6%, many times the REL-UNCITED rates, and any paper could report
      them as evidence of rampant post-rationalization. The control column explains
      them away: 69/69, 123/123, 61/61, 623/623. Every single control record cites
      the doctored passage, because this variant selects a passage the clean answer
      already cited elsewhere. Subtract, and the attributable effect is negative on
      all four datasets, from -10.4pp to -21.1pp, with intervals that exclude zero.
      A raw rate of 79-90% here measures our sampling rule and nothing else. Under
      the stricter claim-aligned outcome the same records do show genuine post-rationalization,
      +10.6 to +19.7pp (Appendix D), though only RAGTruth has enough questions to
      pin it down.\nThe moral generalizes past this probe: whenever a measurement
      edits an input and counts how often the output changes, report the unedited
      baseline, and demonstrate rather than assume that it is zero.", "8 Conclusion\nWe
      measured citation attribution across contextcompression methods and budgets
      under a fixed generator and primary NLI evaluator. Emitted and grounded scores
      diverge, but their magnitudes depend on recovery and evaluation choices that
      have not been independently calibrated. Declaredspan verification rejects claims
      lacking declared evidence by policy; it does not determine whether support could
      be recovered. Paired comparisons quantify sampling uncertainty conditional on
      the fixed outputs and evaluator, with only limited evidence for ECR''s advantage.
      We recommend reporting grounded alongside emitted citation scores and achieved
      alongside nominal compression. The TRUE subsample retains the emitted-grounded
      gaps; human calibration and broader replication remain necessary.", "References\n-
