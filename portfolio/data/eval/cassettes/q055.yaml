      HAGRID, R-Search = +11.9. RAGTruth, Baseline = +2.1. RAGTruth, Search-R1 = +2.9.
      RAGTruth, ReSearch = +2.3. RAGTruth, R-Search = +3.9\nTable 8: Attributable
      rate on RANDOM (pp, claimaligned) for all models. n is the same as in Table
      4. The control rate is 0 in 7 of the 16 cells and 0.1-0.9% in the rest.\nNQ,
      Planted = 9/69. NQ, Control = 0/69. NQ, Attr. = +13.0. NQ, 95% CI = [5.5, 22.5].
      QAMPARI, Planted = 16/123. QAMPARI, Control = 0/123. QAMPARI, Attr. = +13.0.
