      inference, RLVR leaves it untouched, with Search-R1 and ReSearch tracking their
      base model within a couple of points and R-Search landing slightly worse. The
      conclusion is that training a model to answer correctly teaches it nothing about
      citing honestly, which means citation faithfulness has to be rewarded and measured
