- request:
    body: '{"query": "Which of my papers measure whether a RAG answer''s citations
      are faithful to the evidence, not just present?", "documents": ["2 Related Work\nCitations
      in RAG. RAG conditions generation on retrieved passages (Lewis et al., 2020),
      and benchmarks such as ALCE ask models to cite those passages sentence by sentence
      (Gao et al., 2023). Most evaluations score whether a citation is correct : does
      the cited passage support the sentence? Wallat et al. (2025) pushed on a harder
      question: did the model actually use it? Those two can come apart. A model that
      already knows the answer can write it down, scan the passages, and attach the
      one that fits, producing a citation that is correct and unfaithful at the same
      time. Their planting probe exposes the gap, and we reproduce it, then add the
      control it was missing (Section 3).\nRLVR search agents. Search-R1 (Jin et al.,
      2025), ReSearch (Chen et al., 2025), and R-Search (Zhao et al., 2025) teach
      a language model to interleave search calls with reasoning, rewarding it when
      the final answer checks out against a reference. All three release open weights
      trained from Qwen2.5-7B-Instruct, which lets us line each agent up against the
      exact model it grew from. Their papers report answer quality. None of them reports
      how many citations are faithful, which is the gap we fill.\nFaithful reasoning
      is a different question. VERITAS (Xu et al., 2025) showed that the reasoning
      traces of Search-R1 and ReSearch do not always line up with the searches they
      issue, the information they retrieve, or the answers they produce. That is faithfulness
      within the reasoning chain. We ask about faithfulness to the evidence : is the
      cited passage the one the answer leaned on? An agent can narrate its search
      honestly and still misattribute the result, or reason sloppily and cite correctly.
      The two findings sit side by side rather than in conflict.", "Abstract\nA RAG
      system can hand you the right answer and cite a source it did not actually use.
      Models output these unfaithful citations via postrationalization : they write
      the answer first and then attach a citation to whatever passage looks close
      enough. Search agents are now trained with reinforcement learning from verifiable
      rewards (RLVR), which pays them for getting the answer right. We asked whether
      that training also teaches them to cite honestly.\nImproving an existing methodology
      with a required control, we compared an instructiontuned model against three
      RLVR agents trained from it, on four question-answering datasets, using only
      free-tier Kaggle GPUs. Postrationalization is everywhere: on Wikipediabased
      questions roughly one citation in seven is unfaithful. RLVR does not fix it.
      The agents post-rationalize at their base model''s rate, and one lands slightly
      worse. Rewarding correct answers buys nothing in citation faithfulness, so faithfulness
      has to be trained and measured on its own terms.", "7 Conclusion\nWe asked whether
      training RAG search agents for correct answers also teaches them to cite honestly
      under fixed-context inference. We find no detectable improvement. Getting to
      that answer meant repairing the measurement first: we reproduced the planting
      probe of Wallat et al. (2025) on an open 7B model, added the no-planting control
      it lacked, and showed that the control is 0 by construction for the main variant,
      100% for another, and a small measured quantity for the third. With that in
      hand, post-rationalization turns out to be common in an instruction-tuned model,
      roughly one cited sentence in seven on Wikipedia-based questions, and three
      RLVR agents trained from that model reproduce its rate, with one landing slightly
      worse. Faithful citation is not a side effect of answer accuracy. It has to
      be rewarded, measured, and reported on its own, and the probe we describe here
      is cheap enough to do all three inside an existing training loop.", "6 Discussion\nWhat
      a citation is worth to a reader. Our results say that in this setting a citation
      marks where the words of an answer can be found, not where the answer came from.
      Figure 1 is the honest version of the problem: the model knew the answer, had
      the supporting passage in front of it, cited it, and then handed the citation
      to a cartoon plot summary after we moved four words. A reader auditing that
      citation opens the passage, finds the claim''s wording sitting there, and walks
      away reassured. The audit passes and the provenance is still wrong. That is
      what makes post-rationalization worse than an ordinary error: it defeats exactly
      the check a careful reader would run, at a rate of roughly one cited sentence
      in seven on Wikipedia-style questions, in an openly available 7B model, using
      a plant so crude that we picked it with a character count.\nWhy RLVR leaves
      this untouched. The reward is the whole story. These agents earn credit when
      an automatic checker matches their final answer against a reference, and R-Search
      adds credit for steps along its search trajectory. Not one term in those objectives
      inspects the link between a sentence and the passage cited beside it. An agent
      that retrieves well, reasons well, and then attaches the wrong marker collects
      full reward. Optimization delivers what you pay for, so citation behavior stays
      wherever the base model left it, which is exactly the pattern in Table 5: two
      agents indistinguishable from their base, one slightly worse, none better.\nInterpreting
      the fixed-context result. The agents were trained for multi-step search, but
      our evaluation intentionally removes that component to hold evidence constant.
      Thus, the null result shows that RLVR did not produce a detectable attribution
      effect in this fixed-context setting. It does not rule out an effect that emerges
      through interactive search, where retrieval decisions and citation behavior
      can interact. An allow-retrieval evaluation would be needed to test that broader
      question.\nFixing it means paying for it. If answer-only rewards leave attribution
      where they found it, attribution has to enter the objective. The probe in this
      paper is a ready-made term for that. It is deterministic, needs no judge model,
      and with the control in place it isolates the effect of the plant rather than
      the noise of editing a context, so it can run inside a training loop. Concretely,
      a PPO or GRPO pipeline of the kind Search-R1 and ReSearch already use could
      add an attribution-consistency penalty: sample a rollout, plant a span from
      the model''s own answer into an uncited passage, re-score, and penalize the
      policy when the citation follows the plant. The signal is cheap, it is grounded
      in behavior rather than in a learned preference model, and it targets the failure
      directly instead of hoping that better answers drag better citations along behind
      them. On the evaluation side, the same probe yields a number that is comparable
      across models, which is what the field currently lacks for citation faithfulness.",
      "Answer (after planting):\nHeath Ledger plays the Joker in Batman The Dark Knight
      [4].\nFigure 1: A real case from our baseline model on NQ. Passage [4] is a
      plot summary of a Batman TV episode; it never mentions Heath Ledger or the film.
      We appended four words from the model''s own answer to it (shaded). The model
      then cites [4] instead of [1], although [1] is still in the context and supports
      the claim. Passages are abridged, and the other three retrieved passages are
      not shown.\npassage. Only someone who reads that passage closely notices that
      it never supported the claim.\nFigure 1 shows how thin the connection can get.
      Our baseline model correctly names Heath Ledger as the Joker and cites the Heath
      Ledger article. We then copied four words of the model''s own sentence into
      a plot summary of a Batman cartoon and asked again. The answer did not change.
      The citation moved to the cartoon passage, which never answers the original
      question, while the Ledger article stayed right there in the context. Four words
      were enough to make the model cite a source it did not use during inference.\nThis
      gets more pressing as RAG systems move from prompting to training. Search agents
      such as Search-R1 (Jin et al., 2025), ReSearch (Chen et al., 2025), and R-Search
      (Zhao et al., 2025) learn to search, read, and answer through reinforcement
      learning from verifiable rewards (RLVR), where the reward comes from checking
      the final answer. These agents get better at finding answers. Whether they also
      get better at pointing to the passage they used is a separate question, and
      their reward never asks it. That is the question we set out to answer.\nWith
      a measurement we trust, we compared four models that share one base, Qwen2.5-7B-Instruct
      (Qwen Team, 2024): the instruction-tuned model itself and three open-weight
      RLVR agents trained from it. One shared base is what makes the comparison clean,
      since any gap between an agent and the baseline comes from training rather than
      from a different model family. We ran all four across four question-answering
      datasets on Kaggle''s T4 GPUs.\nTwo findings stand out. Post-rationalization
      is common and it is not an artifact of RL: our untrained baseline cites unfaithfully
      for roughly one out of seven questions on the Wikipedia-based datasets. Under
      fixed-context inference, RLVR leaves it untouched. Search-R1 and ReSearch track
      their base model within a couple of points in either direction, and R-Search
      lands slightly worse rather than better. Our sample sizes would have caught
      any shift of about seven percentage points, so a large improvement is ruled
      out. Training a model to answer correctly, it turns out, teaches it nothing
      about citing honestly, which means citation faithfulness has to be rewarded
      and measured directly.\nWe contribute:", "Attributed generation and citation
      evaluation.\nThe AIS framework evaluates whether statements are supported by
      identified sources (Rashkin et al., 2023). Automatic attribution and entailment
      evaluation (Bohnet et al., 2022; Honovich et al., 2022) inform the citation
      precision and recall metrics of ALCE (Gao et al., 2023), which we adapt. QASPER
      provides questions over research papers with annotator-marked evidence (Dasigi
      et al., 2021). LongCite studies fine-grained citation generation with long contexts
      (Zhang et al., 2025), a complementary direction to evaluating compression under
      a fixed generator.\nCompression and citation reliability. Li et al. (2026a)
      study Self-RAG on ASQA with LLMLingua-2 and prefix truncation, finding sharper
      degradation in citation grounding than answer quality, and investigate hierarchical
      evidence retention. Our study adds crossfamily comparisons on ASQA and QASPER,
      distinguishes declared and recovered source mappings, and reports emitted and
      grounded scores against achieved context fractions. The conceptual finding overlaps;
      our contribution is experimental coverage and explicit evaluation and reporting
      procedures, rather than priority for the divergence. Wallat et al. (2025) distinguish
      citation correctness from causal faithfulness and investigate post-rationalization.
      Our NLI-based support scores do not establish whether the generator causally
      relied on the cited evidence. ALCE''s summary-context ablation also illustrates
      a correctness-citation trade-off (Gao et al., 2023); information-preservation
      studies examine grounding under compression (\u0141ajewska et al., 2025), and
      human evaluations examine verifiability as output abstractiveness changes (Worledge
      et al., 2024).\nProvenance and structured representations. Related provenance-oriented
      designs include claim-anchored multi-document summarization in CAMS (Guan, 2026),
      budgeted evidence retention in agent memory (Li et al., 2026b), and provenance-aware
      tiered memory (Zhu et al., 2026). Structured retrieval indexes use atomic propositions
      (Chen et al., 2024), recursive summary trees (Sarthi et al., 2024), or graph
      community summaries (Edge et al., 2024). These designs motivate explicit links
      between condensed representations and source evidence, but are not evaluated
      as compressors here. Attention-based explanations remain contested (Jain and
      Wallace, 2019; Wiegreffe and Pinter, 2019). Slot-based representations (Locatello
      et al., 2020; Tan and Kok, 2025; Ibtehaz and Kihara, 2026) suggest another possible
      compression mechanism; whether their internal structure can provide validated
      source attribution is an untested future direction.", "5.3 RLVR does not make
      citations more faithful\nIt does not. Search-R1 moves by -1.2, +4.3, -0.9, and
      +1.3pp across the four datasets; ReSearch by +0.1, -1.6, -1.2, and +0.8pp. Both
      wander around zero with no pattern, every interval covers zero, and the smallest
      Holm-adjusted p -value in either row is 0.267, nowhere near signif- icance.
      Set that against our detection bound: with 80% power at about 7pp, an improvement
      of that size would have been hard to miss, and nothing close to it appears.
      Training these agents to produce verifiably correct answers moved their citation
      faithfulness by an amount we cannot distinguish from nothing.\nThat result is
      less surprising once you look at what the reward measures. RLVR compares the
      final answer with a reference and pays out accordingly; R-Search also rewards
      steps along its search trajectory. No term anywhere in these objectives asks
      whether the citation attached to a sentence is the passage that produced it.
      Citing the wrong passage is free, so the behavior the agents inherit from Qwen2.5-7B-Instruct
      rides through training untouched.", "1 Introduction\nCitations are the part
      of a RAG answer that a careful reader actually checks. The system retrieves
      passages, writes an answer, and marks each sentence with the passage it came
      from (Lewis et al., 2020; Gao et al., 2023); the marker is a promise about provenance.
      Follow [1], the promise says, and you will find where this sentence came from.\nModels
      break that promise more often than they look like they do. Wallat et al. (2025)
      showed that a model will cite a passage it never used, a behavior they call
      post-rationalization : the answer comes first, and the citation gets attached
      afterward to whatever passage looks like a plausible source. What makes this
      failure slippery is that nothing on the surface goes wrong. The answer is right.
      The citation is present, well formed, and points at a real Question:\nWho plays
      Joker in Batman: The Dark Knight?", "5.2 Post-rationalization is common\nTable
      4 gives the attributable rate on REL-UNCITED for every model and dataset. Start
      with the baseline column: 14.0% on NQ, 9.1% on QAMPARI, 14.8% on HAGRID, 2.9%
      on RAGTruth, with confidence intervals of [10.4, 17.8], [6.2, 12.0], [11.8,
      18.2] and [1.8, 3.9] that all sit clear of zero. This clears the bar we set
      in advance, at least 8pp with an interval excluding zero on three of four datasets.
      On the Wikipedia-based datasets that rate means roughly one cited sentence in
      seven points at a passage whose only tie to the claim is four words we pasted
      in. Pooling across datasets gives 10.7%. 1\nTable 4: How often each model follows
      the planted span: attributable rate on REL-UNCITED in %, with cited records
      over all records below. The control is 0 in every cell, so these equal the raw
      rates. Baseline 95% CIs: NQ [10.4, 17.8], QAMPARI [6.2, 12.0], HAGRID [11.8,
      18.2], RAGTruth [1.8, 3.9].\n\nNQ, Baseline = 14.0 52/371. NQ, Search-R1 = 12.8
      36/281. NQ, ReSearch = 14.1 50/355. NQ, R-Search = 14.7 57/387. QAMPARI, Baseline
      = 9.1 29/319. QAMPARI, Search-R1 = 13.4 38/283. QAMPARI, ReSearch = 7.5 25/332.
      QAMPARI, R-Search = 12.2 43/352. HAGRID, Baseline = 14.8 64/433. HAGRID, Search-R1
      = 13.8 53/383. HAGRID, ReSearch = 13.6 59/434. HAGRID, R-Search = 18.6 80/430.
      RAGTruth, Baseline = 2.9 25/864. RAGTruth, Search-R1 = 4.1 29/699. RAGTruth,
      ReSearch = 3.6 30/823. RAGTruth, R-Search = 5.9 52/879\nNow read across the
      rows. On NQ the four models land at 14.0, 12.8, 14.1, and 14.7%. On HAGRID,
      14.8, 13.8, 13.6, and 18.6%. On RAGTruth, 2.9, 4.1, 3.6, and 5.9%. The agents
      track their base model, not each other''s training recipes, and all sixteen
      cells sit far above zero. Post-rationalization is not something RL introduced;
      it is already there in the instruction-tuned model and it survives everything
      done on top.\n1 Pooling was not part of our pre-registered plan, so treat this
      number as exploratory.", "1 Introduction\nContext compression reduces generator
      input in retrieval-augmented generation (RAG) (Xu et al., 2024; Jiang et al.,
      2024; Pan et al., 2024; Chirkova et al., 2025). Citation-grade attribution requires
      locatable evidence: a reader must be able to retrieve and check the cited source
      (Rashkin et al., 2023; Bohnet et al., 2022). Abstractive compression can interrupt
      this link when citations identify compressor-generated text without its supporting
      source spans. We call it attribution launder- ing when consistency with compressor-generated
      text is treated as evidence of support from original sources. On ASQA at nominal
      budget 0 . 25 (achieved ratio 0 . 08 ), a RECOMP-style compressor''s citations
      score 0.86 precision against its summaries and 0.12 against source spans under
      our recovery protocol. These automatic scores depend on a shared NLI evaluator
      and bounded candidate search; they have not been independently calibrated.\nRelated
      work already identifies a divergence between answer quality and citation grounding
      under compression (Li et al., 2026a), while citation support does not establish
      causal reliance on evidence (Wallat et al., 2025). We examine this problem across
      compressor families and two datasets, reporting achieved context fractions,
      explicit sourcerecovery rules, and paired comparisons on shared questions. Our
      measurements concern source support under an automatic evaluation protocol;
      they do not test causal citation faithfulness.\nWe conduct a controlled measurement
      study with a fixed generator (Qwen2.5-7B-Instruct with ALCE-style numbered-context
      citation prompting), a fixed primary NLI evaluator, and nominal budgets of {
      0 . 5 , 0 . 25 , 0 . 1 , 0 . 05 } in generatortokenizer tokens. Our contributions
      are:\n- The attribution-compression frontier. A comparison across reranking,
      extractive selection, abstraction, token pruning, ECR, and an identity reference
      against achieved context fractions. All settings share 944 successful ASQAquestions
      and 976 QASPER questions from 271 papers; paired tests quantify their differences.\n-
      A re-attributability protocol. A unit without declared provenance is counted
      as reattributable when NLI predicts entailment from a candidate source snippet;
      recovered sources support grounded citation scores\n- alongside emitted scores
      against compressed text.\n- Three verification modes. We separate consistency
      with summaries, availability of declared provenance, and claim support after
      source recovery. Structural rejection under declared-only checking is distinguished
      from measured rejection after recovery.\n- An extract-cluster-rewrite (ECR)
      observation. A simple construction greedily merges near-duplicate sentences
      and cites all members of each cluster; paired comparisons quantify its measured
      differences from extraction across budgets.", "References\n- Jonas Wallat, Maria
      Heuss, Maarten de Rijke, and Avishek Anand. 2025. Correctness is not faithfulness
      in retrieval augmented generation attributions. In Proceedings of the 2025 International
      ACM SIGIR Conference on Innovative Concepts and Theories in Information Retrieval
      , ICTIR ''25, pages 2232. Association for Computing Machinery.\n- Sarah Wiegreffe
      and Yuval Pinter. 2019. Attention is not not explanation. In Proceedings of
      the 2019 Conference on Empirical Methods in Natural Language Processing and
      the 9th International Joint Conference on Natural Language Processing (EMNLPIJCNLP)
