      HAGRID, Attr. = +19.7. HAGRID, 95% CI = [10.8, 31.3]. RAGTruth, Planted = 67/623.
      RAGTruth, Control = 1/623. RAGTruth, Attr. = +10.6. RAGTruth, 95% CI = [7.9,
      13.5]\nTable 9: CITED-OTHER for the baseline under the claimaligned outcome
      (pp). Unlike the cited-anywhere outcome in Table 3, this one shows post-rationalization.
      Only RAGTruth has enough question clusters for a reliable interval.", "H. Relation
      to Prior Work\nOur findings extend the RAG picture drawn by Lewis et al. [1]
      from the cooperative case to an adversarial one: retrieval that lifts accuracy
      on clean corpora becomes a liability on corrupted ones. Where Shi et al. [3]
      showed that off-topic context distracts a model, we show that on-topic but false
      context does more, because it wears the appearance of the evidence the model
      was told to trust. The abstention-overfabrication pattern we measure is an empirical
      answer, for a small quantized model, to how such a system fails when the context
      is corrupted rather than merely irrelevant. The retrieval-integrated pre-training
      of Guu et al. [5] shares the grounding assumption our attack targets. Zhou et
      al. [4] warn that evaluation can leak into training and inflate scores; we keep
      the FEVER-derived query set fixed and report every cell from the same 588-run
      table so strategy comparisons are not an artifact of shifting test items.\nFig.
      4. Failure behaviour across poisoning levels. Panel (a): abstention rises with
      poisoning for every strategy, most steeply for entity swap. Panel (b): the lexical-overlap
      proxy of unsupported generation is higher on the clean arm than the poisoned
      arm for all three strategies.\nFig. 5. Outcome of queries that were correct
      on clean context, split by strategy and poisoning level. Green is still correct,
      blue is abstained, red is fooled. The lost green area is absorbed mainly by
      abstention, and negation retains the most correct answers.", "D Robustness Checks\nTable
      10: Robustness check 1: agent minus baseline on the RANDOM variant (DiD, pp,
      claim-aligned), Holmadjusted p in parentheses. No comparison reaches p < 0 .
