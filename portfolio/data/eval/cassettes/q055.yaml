      75 (15%)  |    425 |    346 |      886 |", "7 Discussion\nWhat laundering looks
      like. Consider an ASQA example under RECOMP at nominal budget 0.25. Asked ''How
      many state parks are there in Virginia?'' , the generator answers ''There are
      34 state parks in Virginia [1]'' , while Document [1] states ''Virginia has
      34 state parks and 17 state forests . . . '' . The citation receives full emitted
      precision, but Document [1] is the compressor''s summary with no declared source
      link. In another example, the answer ''The man who killed [them] is not mentioned
      in the retrieved documents [1]'' cites a summary containing that same assertion
      of absence. Both illustrate consistency with intermediate text without a declared
      path to source evidence; neither example alone establishes an independently
      verified hallucination.\nImplications for practice. Five operational recommendations
      follow from this evaluation setup. (1) Verify against source spans: consistency
      with compressor output does not establish support from locatable evidence. Report
      whether spans are declared or recovered and how support is judged. (2) Report
      achieved compression: nominal fractions overstate achieved context size by up
      to 32.8fold here (Section 4.1). (3) Include verification in cost reporting:
      report generator and verifier input lengths together, while identifying which
      other costs remain unmeasured (Table 2). Zero declaredspan cost can mean that
      no evidence reached the verifier. (4) Evaluate post-hoc recovery explicitly:
      missed recovery can reflect search errors or missing support (Section 6). (5)
      Document citable-unit granularity: comparisons differ in their source units
      as well as their datasets. Controlled ablations are needed to isolate the effect
      of unit size.\nWhat dominating the frontier would require. Future compressors
      should merge redundant evidence while retaining validated source links and accounting
      for verification cost. ECR''s limited measured gains motivate independent calibration
      and replication before claiming general improvements.\nFailure modes and excluded
      examples. All 33 failures occur in identity runs: 4 budget-check failures on
      ASQA, and 15 budget-check plus 14 prompt-overflow failures on QASPER. No compressed
      run fails on these examples. Primary comparisons exclude the same failed question
      IDs from every setting, so their estimand is performance conditional on identity
      success.", "In RAG We Trust? Measuring Robustness of Retrieval-Augmented Generation
      Under Document Poisoning\nIliano Fasolino Department of Computer Science University
      of Milan Milan, Italy\nAbstract -Retrieval-augmented generation (RAG) grounds
      a language model in retrieved documents, which reduces hallucination but creates
      a new attack surface: if retrieved text is tampered with, the model may repeat
      the falsehood. We study how much a small quantized model, Llama 3.1 8B, degrades
      when a fraction of its retrieved context is poisoned. Three corruption strategies
      are tested, entity swap, number swap, and negation, each applied to zero, one,
      two, or three of the three retrieved passages, over a factorial sweep of 588
      runs on a fact-checking task built from FEVER. Accuracy falls from 77.9% on
      clean context to 43.5% when all three passages are corrupted. Entity swap flips
      the largest share of answers that were correct on clean context. Number-based
      corruption stays flat while poisoned passages are a minority and jumps once
      they form a majority, a pattern we re-check with query-level bootstrap intervals.
      The model rarely invents new falsehoods; its dominant reaction is to abstain,
      and a lexical overlap proxy of unsupported generation falls under attack rather
      than rising. The study is a small-scale measurement with coarse automated labels;
      we treat the strategy contrasts as suggestive until decoding is controlled and
      stronger adjudication is in place.\na practitioner running a small model on
      modest hardware is a concrete measurement: how far does accuracy fall, which
      kind of corruption bites hardest, and does the model fail loudly by fabricating
      or quietly by refusing.\nIndex Terms -retrieval-augmented generation, large
      language models, adversarial robustness, document poisoning, fact verification",
      "REFERENCES\n- [1] P. Lewis et al. , ''Retrieval-augmented generation for knowledge-intensive
      NLP tasks,'' in Advances in Neural Information Processing Systems , vol. 33,
      2020, pp. 9459-9474.\n- [2] J. Thorne, A. Vlachos, C. Christodoulopoulos, and
      A. Mittal, ''FEVER: a large-scale dataset for fact extraction and verification,''
      in Proc. Conf. North American Chapter of the Association for Computational Linguistics
      (NAACL-HLT) , 2018, pp. 809-819.\n- [3] F. Shi et al. , ''Large language models
      can be easily distracted by irrelevant context,'' in Proc. Int. Conf. Machine
      Learning (ICML) , 2023, pp. 31210-31227.\n- [4] K. Zhou et al. , ''Don''t make
      your LLM an evaluation benchmark cheater,'' arXiv preprint arXiv:2311.01964,
      2023.\nFooled rate across all conditions (%)\nFig. 6. The ten queries with the
      highest fooled rate across all conditions. Biographical and landmark questions
      dominate because the passages that answer them carry many swappable entities.\nserve
      as a cheap early warning of a poisoned store.", "I. INTRODUCTION\nLarge language
      models answer questions fluently but carry two well-known liabilities: their
      knowledge is frozen at training time, and they sometimes state false facts with
      full confidence. Retrieval-augmented generation, proposed by Lewis et al. [1],
      addresses both by fetching relevant documents at query time and placing them
      in the prompt as evidence. The model is then asked to answer from that evidence
      rather than from memory alone. This design has become the default recipe for
      question answering over private or fast-moving knowledge bases.\nThe same design
      introduces a dependency that is easy to overlook. A RAG answer is only as trustworthy
      as the documents it retrieves. If an attacker can edit, inject, or otherwise
      corrupt even part of the retrieved set, the grounding step that was meant to
      improve reliability becomes a channel for misinformation. Shi et al. [3] showed
      that irrelevant context alone can pull a model off track; corrupted but on-topic
      context is a stronger lever, because it looks exactly like the evidence the
      model was told to trust. What is still missing for We answer those three questions
      empirically. Our contribution is threefold. First, we build a reproducible poisoning
      testbed around a 4-bit Llama 3.1 8B model, a MiniLM retriever, and a FAISS index
      of nearly twenty thousand FEVER evidence sentences. Second, we run a full factorial
      experiment, three corruption strategies crossed with four poisoning levels over
      a fixed query set, and report accuracy, a fooled rate, abstention, and a lexical-overlap
      proxy of unsupported generation for every cell. Third, we characterise the failure
      surface: entity corruption flips the most answers, numeric corruption jumps
      once it reaches a majority of the context, and the model''s default response
      to contradiction is to abstain rather than to invent. Every point estimate reported
      here comes from the same 588-run table. Where we interpret a jump or a strategy
      ranking, we also report query-level bootstrap intervals and paired tests recomputed
      from that table.", "5.1 What the control changes\nTable 3: What the no-planting
