      = +2.1. CITED-OTHER (cited-anywhere), Planted = CITED-OTHER (cited-anywhere).
      CITED-OTHER (cited-anywhere), Control = CITED-OTHER (cited-anywhere). CITED-OTHER
      (cited-anywhere), Attr. = CITED-OTHER (cited-anywhere). NQ, Planted = 58/69.
      NQ, Control = 69/69. NQ, Attr. = - 15.9. QAMPARI, Planted = 97/123. QAMPARI,
      Control = 123/123. QAMPARI, Attr. = - 21.1. HAGRID, Planted = 50/61. HAGRID,
      Control = 61/61. HAGRID, Attr. = - 18.0. RAGTruth, Planted = 558/623. RAGTruth,
      Control = 623/623. RAGTruth, Attr. = - 10.4", "4.1 Experimental Setup\nWe evaluate
      on two attribution benchmarks with different retrieval granularities. ASQA comprises
      948 ambiguous factoid questions from the ALCE release (Gao et al., 2023), each
      paired with the top-5 GTR-retrieved passages, sentencesegmented into citable
      snippets; answer quality is string exact match (str-EM). QASPER (Dasigi et al.,
      2021) is the 1,005-question dev split over 281 NLP papers, using each supplied
      paper''s abstract and full text. Gold evidence is paragraphlevel, so identity
      presents paragraphs as citable units while compressors operate on sentence snippets;
      declared sids map to paragraphs for setF1 against gold evidence, max over annotators.
      The generator is Qwen2.5-7B-Instruct served via vLLM with greedy decoding and
      ALCE-style numbered-context citation prompting (Gao et al., 2023). Primary entailment
      judgments use the development-grade DeBERTa NLI evaluator of \u00a73.1 at \u03c4
      = 0 . 5 . We compare six compressors: identity (no compression; documentlevel
      on ASQA, paragraph-level on QASPER), cross-encoder rerank topk (ms-marco-MiniLML-6-v2),
      embedding-based extractive sentence selection (all-MiniLM-L6-v2), the RECOMP
      abstractive summarizer (NQ checkpoint) (Xu et al., 2024), LLMLingua-2 token
      pruning (Pan et al., 2024), and our extract-cluster-rewrite (ECR) variant, which
      ranks sentences, greedily clusters nearduplicates by Jaccard word overlap (threshold
      0.5, with a negation guard), and emits one unit per cluster-the highest-relevance
      member sentence verbatim-citing all member sentence ids. Although LLMLingua-2
      prunes tokens verbatim, its output is a token stream with no unit-level sid
      mapping in our pipeline, so it declares no provenance and is scored with the
      no-provenance family alongside RECOMP. Each compressor runs at nominal budgets
      { 0 . 5 , 0 . 25 , 0 . 1 , 0 . 05 } of the retrieved context, enforced in generator-tokenizer
      tokens. Because compressors do not reliably hit their nominal budgets, the frontier
      figures and primary summary tables report the achieved ratio: RECOMP''s summary
      length is nearly budget-independent, saturating at achieved ratios of 0.05-0.08
      on ASQA and \u2248 0.015 on QASPER across all four nominal budgets. All primary
      comparisons use the same successful questions across all 21 settings: 944 on
      ASQA and 976 from 271 papers on QASPER. Only identity has failures: 4 budget-check
      failures on ASQA, and 15 budget-check plus 14 promptoverflow failures on QASPER;
      their question IDs are excluded from every primary setting. Fullcohort descriptive
      aggregates remain available in the evaluation artifacts.", "This is a set of
      three line/scatter plots comparing context compression methods for retrieval-augmented
      generation, plotting \"Achieved context fraction\" (x-axis, reversed from 1.0
      to 0.0) against three metrics: Grounded citation precision, Grounded citation
      recall, and Declared-evidence F1 (y-axes, 0.0 to 1.0 or 0.0 to 0.20 scales).
      Six methods are compared: Identity (full context, green dot at x=1.0), Extractive
      (orange), Rerank top-k (brown), ECR (blue), RECOMP (purple, near x=0), and LLMLingua-2
      (red). ECR consistently achieves the highest precision and recall among compression
      methods across context fractions (~0.4-0.55), while LLMLingua-2 performs poorly
      (near 0.0-0.15) on citation precision/recall; for Declared-evidence F1, ECR
      and Extractive show increasing values (up to ~0.17) as context fraction decreases,
      outperforming Rerank top-k, which stays low (~0.05-0.08).", "Sensitivity to
      the re-attribution threshold.\nThe re-attributability protocol depends on the
      entailment threshold \u03c4 . Table 3 sweeps \u03c4 from 0.3 to 0.8 for both
      no-provenance methods on ASQA (citation scoring fixed at the production threshold
      of 0.5). Grounded precision ranges from 0.15 to 0.08 for RECOMP and from 0.16
      to 0.04 for LLMLingua-2, while recovery rates fall from 0.48 to 0.31 and from
      0.54 to 0.20, respectively. Emitted precision exceeds grounded precision at
      every tested recovery threshold for both methods ( p H = 0 . 0148 throughout).
      This is sensitivity analysis of one operating choice, not independent validation:
      the evaluator, top-10 lexical search, and singlesnippet support requirement
      remain fixed.\nTable 3: Recovery-threshold sensitivity on 944 ASQA questions
      at nominal budget 0.25; citation scoring stays at \u03c4 = 0 . 5 . P g : grounded
      precision; reattr.: reattribution rate. Superscripts count defined values; dashes
      mark undefined metrics.\n\n0.3, RECOMP.P g = 0.15. 0.3, RECOMP.reattr. = 0 .
      48 n =929. 0.3, LLMLingua-2.P g = 0.16. 0.3, LLMLingua-2.reattr. = 0.54. 0.4,
      RECOMP.P g = 0.13. 0.4, RECOMP.reattr. = 0 . 44 n =929. 0.4, LLMLingua-2.P g
      = 0.13. 0.4, LLMLingua-2.reattr. = 0.47. 0.5, RECOMP.P g = 0.12. 0.5, RECOMP.reattr.
      = 0 . 41 n =929. 0.5, LLMLingua-2.P g = 0.10. 0.5, LLMLingua-2.reattr. = 0.40.
      0.6, RECOMP.P g = 0.11. 0.6, RECOMP.reattr. = 0 . 38 n =929. 0.6, LLMLingua-2.P
      g = 0.08. 0.6, LLMLingua-2.reattr. = 0.34. 0.7, RECOMP.P g = 0.09. 0.7, RECOMP.reattr.
      = 0 . 34 n =929. 0.7, LLMLingua-2.P g = 0.05. 0.7, LLMLingua-2.reattr. = 0.27.
      0.8, RECOMP.P g = 0.08. 0.8, RECOMP.reattr. = 0 . 31 n =929. 0.8, LLMLingua-2.P
      g = 0.04. 0.8, LLMLingua-2.reattr. = 0.20", "4.2 Statistical Analysis and Metric
      Audit\nCommon cohorts and estimands. Primary summaries and comparisons use the
      intersection of successful question IDs across identity and all twenty compressed
      settings. Each question has equal weight in citation precision, citation recall,
      answer quality, and evidence F1; claims and citations are not pooled across
      questions. Undefined evidence or recovery metrics remain undefined rather than
      becoming zeros. Verification-rate means exclude answers with zero claims; paired
      verification comparisons exclude a question if ei- ther member has zero claims.
      The analysis artifacts report those exclusions and retain full-cohort descriptive
      means separately.\nInference. We use pointwise 95% percentile bootstrap intervals
      for each paired mean difference (Dror et al., 2018), resampling 944 questions
      on ASQA and 271 papers on QASPER with replacement. All retained questions from
      a sampled QASPER paper travel together, and each replicate divides its total
      difference by the number of sampled questions, preserving the questionweighted
      estimand. Every QASPER contrast retains all 271 papers after metric-specific
      exclusions. Two-sided randomization tests swap paired labels within questions
      on ASQA and jointly within papers on QASPER. These tests assume label exchangeability
      within a resampling unit under the null. Both procedures use 10,000 replicates
      and seed 13, with independent random-number streams for bootstrap sampling and
      randomization. Monte Carlo p -values use ( b + 1) / (10 , 000 + 1) , where b
      counts randomizations at least as extreme as the observed absolute difference.
      The initial plan specified 134 core contrasts and 10 recoverythreshold contrasts
      before inspecting the revised inferential results. After that analysis and a
      cachecoverage audit, we added four recovered-source versus summary-verification
      contrasts at nominal 0.25 for RECOMP and LLMLingua-2 on both datasets. The extension
      plan was recorded before running these four tests, and Holm adjustment was recomputed
      over all 148 raw p -values. We denote Holm-adjusted values by p H . All reported
      adjusted values use this expanded family; original effects, intervals, and raw
      p -values are unchanged. This is a post hoc camera-ready analysis, not a preregistration.
      Intervals are pointwise, not simultaneous; statistical-support statements use
      p H < 0 . 05 . Failure to reject a difference does not establish equivalence
      or preservation. All inference is conditional on the fixed generator outputs,
      recovery procedure, and evaluator.\nPrecision-code audit. The manuscript''s
      precision definition requires the concatenated cited evidence to entail a claim
      before any individual citation receives credit. A code audit found that the
      previous implementation could credit an individually supporting citation even
      when joint entailment failed. A saved ASQA answer reproduced this discrepancy,
      and a regression test now checks the required gate through the evaluation pipeline.\n",
      "3.1 Benign capability\nTo test the general capability of each of the models
      in our study we use the MIRAGE benchmark (Park et al., 2025). This benchmark
      was designed to test RAG model capabilities under different settings: Oracle
      contexts provide a best-case setting in which the answer-bearing evidence is
      available, while mixed contexts introduce distractors while retaining a capped
      amount of answer-bearing evidence. In the current study, we use a subset of
      1000 queries from MIRAGE, under the two settings, to evaluate general RAG capability.",
      "5.4 One agent drifts the wrong way\nR-Search is the exception, and it leans
      worse rather than better. Its DiD is positive on all four datasets (+0.7, +3.1,
      +3.8, +3.0pp) and significant on RAGTruth, our largest cell, at +3.0pp with
      a 95% CI of [1.2, 4.8] and a Holm-adjusted p of 0.002. That was the pre-registered
      condition for claiming a model-specific effect, and it is met.\nWe report it
      with the caveats it deserves. On the RANDOM variant R-Search is again higher
      on three of four datasets but significant on none, the closest p being 0.063.
      Under the looser cited-anywhere outcome it dips slightly below the baseline
      on NQ ( -0.5pp) and reaches significance nowhere (Appendix D). The direction
      is consistent; the evidence for its size is not. What we can say is that no
      agent improved, and the one that moved measurably moved the wrong way.", "This
      is a set of three line/scatter plots comparing context compression methods for
      retrieval-augmented generation, evaluated across three metrics: Grounded citation
      precision, Grounded citation recall, and Answer correctness (str-EM), each plotted
      against \"Achieved context fraction\" (x-axis, reversed scale from 1.0 to 0.0)
      on the y-axis from 0.0 to 1.0 (or 0.35 for the third plot).\n\nThe methods compared
      include Identity (full context, green dot baseline), Rerank top-k (brown), Extractive
      (orange), ECR (blue), RECOMP (purple diamond), and LLMLingua-2 (red). Across
      all three metrics, Rerank top-k and ECR tend to achieve the best performance
      at moderate context fractions (0.4-0.7), while LLMLingua-2 consistently underperforms
      with the lowest precision and recall scores, and RECOMP achieves relatively
      higher answer correctness at very low context fractions.", "Sensitivity to the
      re-attribution threshold.\nSecond-evaluator sensitivity. We rescore 100 questions
      per dataset with TRUE T5-XXL (Honovich et al., 2022), covering full-context
      identity plus extraction, RECOMP, and LLMLingua-2 at nominal 0.25. With source
