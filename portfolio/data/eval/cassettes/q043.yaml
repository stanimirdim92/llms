      |\n| T24  | Q      | LL       | F - D  | P g        | - 0 . 042 | [ - 0 . 095
      , +0 . 011]  | 0.6299 | 100 |  84 |", "4 Experimental Setup\nWe know what size
      of effect we could have caught. Our sample sizes give 80% power to detect a
      difference of roughly 7 percentage points (pp). Plainly: had RLVR moved post-rationalization
      by 7pp or more in either direction, this design would almost certainly have
      caught it. Shifts of a couple of points stay inside our blind spot, which is
      why we report a bounded null rather than a flat absence of effect. We fixed
      the primary outcome and the family of corrected comparisons in writing before
      the scorer ran.\nCompute. Everything ran on Kaggle''s free tier, two T4s or
      a single P100 per session: 48 GPU jobs yielding 36,690 scored records across
      four models, four datasets, three variants, and both conditions. The original
      study used a 104B model; the controlled version of the same measurement fits
      on hardware anyone can get for free, and that is the part we would most like
      other groups to borrow.", "4.2 Statistical Analysis and Metric Audit\nCommon
      cohorts and estimands. Primary summaries and comparisons use the intersection
      of successful question IDs across identity and all twenty compressed settings.
      Each question has equal weight in citation precision, citation recall, answer
      quality, and evidence F1; claims and citations are not pooled across questions.
      Undefined evidence or recovery metrics remain undefined rather than becoming
      zeros. Verification-rate means exclude answers with zero claims; paired verification
      comparisons exclude a question if ei- ther member has zero claims. The analysis
      artifacts report those exclusions and retain full-cohort descriptive means separately.\nInference.
      We use pointwise 95% percentile bootstrap intervals for each paired mean difference
      (Dror et al., 2018), resampling 944 questions on ASQA and 271 papers on QASPER
      with replacement. All retained questions from a sampled QASPER paper travel
      together, and each replicate divides its total difference by the number of sampled
      questions, preserving the questionweighted estimand. Every QASPER contrast retains
      all 271 papers after metric-specific exclusions. Two-sided randomization tests
      swap paired labels within questions on ASQA and jointly within papers on QASPER.
      These tests assume label exchangeability within a resampling unit under the
      null. Both procedures use 10,000 replicates and seed 13, with independent random-number
      streams for bootstrap sampling and randomization. Monte Carlo p -values use
      ( b + 1) / (10 , 000 + 1) , where b counts randomizations at least as extreme
      as the observed absolute difference. The initial plan specified 134 core contrasts
      and 10 recoverythreshold contrasts before inspecting the revised inferential
      results. After that analysis and a cachecoverage audit, we added four recovered-source
      versus summary-verification contrasts at nominal 0.25 for RECOMP and LLMLingua-2
      on both datasets. The extension plan was recorded before running these four
      tests, and Holm adjustment was recomputed over all 148 raw p -values. We denote
      Holm-adjusted values by p H . All reported adjusted values use this expanded
      family; original effects, intervals, and raw p -values are unchanged. This is
      a post hoc camera-ready analysis, not a preregistration. Intervals are pointwise,
      not simultaneous; statistical-support statements use p H < 0 . 05 . Failure
      to reject a difference does not establish equivalence or preservation. All inference
      is conditional on the fixed generator outputs, recovery procedure, and evaluator.\nPrecision-code
      audit. The manuscript''s precision definition requires the concatenated cited
      evidence to entail a claim before any individual citation receives credit. A
      code audit found that the previous implementation could credit an individually
      supporting citation even when joint entailment failed. A saved ASQA answer reproduced
      this discrepancy, and a regression test now checks the required gate through
      the evaluation pipeline.\n", "E. A Majority Pattern in Numeric Corruption\nFigure
      3 isolates that pattern. For entity swap and negation the fooled rate grows
      in roughly even steps as poisoning increases. Number swap behaves differently.
      It stays at 10.2% for both zero and one corrupted passage (bootstrap 95% CI
      [2 . 0 , 18 . 4] in both cells), then rises to 26.5% at two ( [14 . 3 , 38 .
      8] ) and 34.7% at three ( [22 . 5 , 49 . 0] ). The jump from one to two poisoned
      passages is 16.3 points with CI [2 . 0 , 30 . 6] , which excludes zero but is
      wide. Exact McNemar tests on clean-versus-poisoned correctness are significant
      at two and three poisoned passages ( p < 10 -3 ) and not at one ( p = 0 . 22
      ). We read this as a majority-leaning pattern consistent with outvoting a single
      wrong figure, not as a sharp phase transition proven under locked pairs. Because
      a model cannot sanity-check a bare number the way it can catch ''Madrid, Spain,''
      numeric corruption remains a quiet risk once it reaches critical mass.", "5.2
      Post-rationalization is common\nTable 4 gives the attributable rate on REL-UNCITED
      for every model and dataset. Start with the baseline column: 14.0% on NQ, 9.1%
      on QAMPARI, 14.8% on HAGRID, 2.9% on RAGTruth, with confidence intervals of
      [10.4, 17.8], [6.2, 12.0], [11.8, 18.2] and [1.8, 3.9] that all sit clear of
      zero. This clears the bar we set in advance, at least 8pp with an interval excluding
      zero on three of four datasets. On the Wikipedia-based datasets that rate means
      roughly one cited sentence in seven points at a passage whose only tie to the
      claim is four words we pasted in. Pooling across datasets gives 10.7%. 1\nTable
      4: How often each model follows the planted span: attributable rate on REL-UNCITED
      in %, with cited records over all records below. The control is 0 in every cell,
      so these equal the raw rates. Baseline 95% CIs: NQ [10.4, 17.8], QAMPARI [6.2,
      12.0], HAGRID [11.8, 18.2], RAGTruth [1.8, 3.9].\n\nNQ, Baseline = 14.0 52/371.
