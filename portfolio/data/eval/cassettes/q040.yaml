        Analysis\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":60,\"page_no\":7,\"filename\":\"2609.14245v1.pdf\"}}},{\"id\":\"77f26e0a-bd5e-5a63-a1d7-18e0907f7612\",\"version\":13,\"score\":0.48018646,\"payload\":{\"page_content\":\"Abstract\\nContext
        compression reduces generator input in retrieval-augmented generation, but
        answer quality alone does not characterize citation attribution. We measure
        citation attribution across compression methods and budgets, comparing reranking,
        extractive selection, abstractive summarization, token pruning, and an extract-cluster-rewrite
        construction on ASQA and QASPER under a fixed generator and primary entailment
        evaluator. On ASQA at a nominal 0.25 budget (achieved compression 0.08), a
        RECOMP-style compressor's citations score 0.86 precision against its summaries
        but 0.12 against source spans under our re-attributability protocol. These
        estimates depend on a shared NLI model for span recovery and citation scoring
        and lack independent human calibration. Extractive selection's observed grounded
        precision ranges from 0.43 to 0.49 across nominal budgets from one-half to
        one-tenth of the ASQA context, while answer quality declines. For the same
        RECOMP setting, claim verification after source recovery yields an unsupported
        rate of 0.88 versus 0.17 when checking summaries. This gap persists beyond
        structural rejection of missing provenance, but remains evaluator-dependent.
        A 200-question TRUE T5-XXL audit also finds emitted-grounded gaps under both
        fixed and recomputed source mappings, without establishing human-calibrated
        support rates.\",\"metadata\":{\"ingestion_version\":\"01a0fc54ff9a70d3af0e9b49e864b8b9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde-text-0001\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde\",\"chunk_type\":\"text\",\"section_path\":\"Abstract\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":4,\"page_no\":1,\"filename\":\"2609.14245v1.pdf\"}}},{\"id\":\"21d6e85f-96a3-5bc7-9f3f-0f7d3137d50c\",\"version\":13,\"score\":0.4713671,\"payload\":{\"page_content\":\"5
        Results\\nECR's advantage is limited to one tested setting. On QASPER, ECR
        improves grounded precision over extraction at nominal 0.50 ( \u2206 = 0 .
        063 , CI [0.033, 0.092], p H = 0 . 0148 ). Its other QASPER precision differences
        and all four ASQA differences lack adjusted statistical support. The tightest
        QASPER ECR setting also does not establish an advantage over identity ( \u2206
        = 0 . 028 , CI [ -0 . 010 , 0.064], p H = 1 ). ECR's QASPER declared-evidence
        F1 is slightly lower than extraction at every budget, by 0.00065-0.00295 (all
        p H < 0 . 05 ). Thus the results support a settingspecific precision gain,
        not general superiority or lossless redundancy removal.\",\"metadata\":{\"ingestion_version\":\"01a0fc54ff9a70d3af0e9b49e864b8b9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde-text-0013\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde\",\"chunk_type\":\"text\",\"section_path\":\"5
        Results\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":58,\"page_no\":7,\"filename\":\"2609.14245v1.pdf\"}}},{\"id\":\"4dcbbe24-cdd2-5b3f-b8f6-a9f0f4d50acc\",\"version\":13,\"score\":0.47004813,\"payload\":{\"page_content\":\"4.1
        Experimental Setup\\nWe evaluate on two attribution benchmarks with different
        retrieval granularities. ASQA comprises 948 ambiguous factoid questions from
        the ALCE release (Gao et al., 2023), each paired with the top-5 GTR-retrieved
        passages, sentencesegmented into citable snippets; answer quality is string
        exact match (str-EM). QASPER (Dasigi et al., 2021) is the 1,005-question dev
        split over 281 NLP papers, using each supplied paper's abstract and full text.
        Gold evidence is paragraphlevel, so identity presents paragraphs as citable
        units while compressors operate on sentence snippets; declared sids map to
        paragraphs for setF1 against gold evidence, max over annotators. The generator
        is Qwen2.5-7B-Instruct served via vLLM with greedy decoding and ALCE-style
        numbered-context citation prompting (Gao et al., 2023). Primary entailment
        judgments use the development-grade DeBERTa NLI evaluator of \xA73.1 at \u03C4
        = 0 . 5 . We compare six compressors: identity (no compression; documentlevel
        on ASQA, paragraph-level on QASPER), cross-encoder rerank topk (ms-marco-MiniLML-6-v2),
        embedding-based extractive sentence selection (all-MiniLM-L6-v2), the RECOMP
        abstractive summarizer (NQ checkpoint) (Xu et al., 2024), LLMLingua-2 token
        pruning (Pan et al., 2024), and our extract-cluster-rewrite (ECR) variant,
        which ranks sentences, greedily clusters nearduplicates by Jaccard word overlap
        (threshold 0.5, with a negation guard), and emits one unit per cluster-the
        highest-relevance member sentence verbatim-citing all member sentence ids.
        Although LLMLingua-2 prunes tokens verbatim, its output is a token stream
        with no unit-level sid mapping in our pipeline, so it declares no provenance
        and is scored with the no-provenance family alongside RECOMP. Each compressor
        runs at nominal budgets { 0 . 5 , 0 . 25 , 0 . 1 , 0 . 05 } of the retrieved
        context, enforced in generator-tokenizer tokens. Because compressors do not
        reliably hit their nominal budgets, the frontier figures and primary summary
        tables report the achieved ratio: RECOMP's summary length is nearly budget-independent,
        saturating at achieved ratios of 0.05-0.08 on ASQA and \u2248 0.015 on QASPER
        across all four nominal budgets. All primary comparisons use the same successful
        questions across all 21 settings: 944 on ASQA and 976 from 271 papers on QASPER.
        Only identity has failures: 4 budget-check failures on ASQA, and 15 budget-check
        plus 14 promptoverflow failures on QASPER; their question IDs are excluded
        from every primary setting. Fullcohort descriptive aggregates remain available
        in the evaluation artifacts.\",\"metadata\":{\"ingestion_version\":\"01a0fc54ff9a70d3af0e9b49e864b8b9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde-text-0008\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde\",\"chunk_type\":\"text\",\"section_path\":\"4.1
        Experimental Setup\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":33,\"page_no\":4,\"filename\":\"2609.14245v1.pdf\"}}},{\"id\":\"48f13ee2-cca1-5a90-8a2c-c4e37fc6acd7\",\"version\":13,\"score\":0.4636618,\"payload\":{\"page_content\":\"8
        Conclusion\\nWe measured citation attribution across contextcompression methods
        and budgets under a fixed generator and primary NLI evaluator. Emitted and
        grounded scores diverge, but their magnitudes depend on recovery and evaluation
        choices that have not been independently calibrated. Declaredspan verification
        rejects claims lacking declared evidence by policy; it does not determine
        whether support could be recovered. Paired comparisons quantify sampling uncertainty
        conditional on the fixed outputs and evaluator, with only limited evidence
        for ECR's advantage. We recommend reporting grounded alongside emitted citation
        scores and achieved alongside nominal compression. The TRUE subsample retains
        the emitted-grounded gaps; human calibration and broader replication remain
        necessary.\",\"metadata\":{\"ingestion_version\":\"01a0fc54ff9a70d3af0e9b49e864b8b9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde-text-0019\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde\",\"chunk_type\":\"text\",\"section_path\":\"8
        Conclusion\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":76,\"page_no\":8,\"filename\":\"2609.14245v1.pdf\"}}},{\"id\":\"878a74c1-67eb-59c3-a48e-9f65fa4e61bd\",\"version\":13,\"score\":0.46349204,\"payload\":{\"page_content\":\"1
        Introduction\\nContext compression reduces generator input in retrieval-augmented
        generation (RAG) (Xu et al., 2024; Jiang et al., 2024; Pan et al., 2024; Chirkova
        et al., 2025). Citation-grade attribution requires locatable evidence: a reader
        must be able to retrieve and check the cited source (Rashkin et al., 2023;
        Bohnet et al., 2022). Abstractive compression can interrupt this link when
        citations identify compressor-generated text without its supporting source
        spans. We call it attribution launder- ing when consistency with compressor-generated
        text is treated as evidence of support from original sources. On ASQA at nominal
        budget 0 . 25 (achieved ratio 0 . 08 ), a RECOMP-style compressor's citations
        score 0.86 precision against its summaries and 0.12 against source spans under
        our recovery protocol. These automatic scores depend on a shared NLI evaluator
        and bounded candidate search; they have not been independently calibrated.\\nRelated
        work already identifies a divergence between answer quality and citation grounding
        under compression (Li et al., 2026a), while citation support does not establish
        causal reliance on evidence (Wallat et al., 2025). We examine this problem
        across compressor families and two datasets, reporting achieved context fractions,
        explicit sourcerecovery rules, and paired comparisons on shared questions.
        Our measurements concern source support under an automatic evaluation protocol;
        they do not test causal citation faithfulness.\\nWe conduct a controlled measurement
        study with a fixed generator (Qwen2.5-7B-Instruct with ALCE-style numbered-context
        citation prompting), a fixed primary NLI evaluator, and nominal budgets of
        { 0 . 5 , 0 . 25 , 0 . 1 , 0 . 05 } in generatortokenizer tokens. Our contributions
        are:\\n- The attribution-compression frontier. A comparison across reranking,
        extractive selection, abstraction, token pruning, ECR, and an identity reference
        against achieved context fractions. All settings share 944 successful ASQAquestions
        and 976 QASPER questions from 271 papers; paired tests quantify their differences.\\n-
        A re-attributability protocol. A unit without declared provenance is counted
        as reattributable when NLI predicts entailment from a candidate source snippet;
        recovered sources support grounded citation scores\\n- alongside emitted scores
        against compressed text.\\n- Three verification modes. We separate consistency
        with summaries, availability of declared provenance, and claim support after
        source recovery. Structural rejection under declared-only checking is distinguished
        from measured rejection after recovery.\\n- An extract-cluster-rewrite (ECR)
        observation. A simple construction greedily merges near-duplicate sentences
        and cites all members of each cluster; paired comparisons quantify its measured
        differences from extraction across budgets.\",\"metadata\":{\"ingestion_version\":\"01a0fc54ff9a70d3af0e9b49e864b8b9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde-text-0002\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde\",\"chunk_type\":\"text\",\"section_path\":\"1
        Introduction\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":6,\"page_no\":1,\"filename\":\"2609.14245v1.pdf\"}}},{\"id\":\"0bd42ba8-593c-5377-8a5c-0d377970ec6e\",\"version\":13,\"score\":0.46031797,\"payload\":{\"page_content\":\"This
        is a set of three line/scatter plots comparing context compression methods
        for retrieval-augmented generation, plotting \\\"Achieved context fraction\\\"
        (x-axis, reversed from 1.0 to 0.0) against three metrics: Grounded citation
        precision, Grounded citation recall, and Declared-evidence F1 (y-axes, 0.0
        to 1.0 or 0.0 to 0.20 scales). Six methods are compared: Identity (full context,
        green dot at x=1.0), Extractive (orange), Rerank top-k (brown), ECR (blue),
        RECOMP (purple, near x=0), and LLMLingua-2 (red). ECR consistently achieves
        the highest precision and recall among compression methods across context
        fractions (~0.4-0.55), while LLMLingua-2 performs poorly (near 0.0-0.15) on
        citation precision/recall; for Declared-evidence F1, ECR and Extractive show
        increasing values (up to ~0.17) as context fraction decreases, outperforming
        Rerank top-k, which stays low (~0.05-0.08).\",\"metadata\":{\"ingestion_version\":\"01a0fc54ff9a70d3af0e9b49e864b8b9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde-fig-006-01\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde\",\"chunk_type\":\"figure\",\"section_path\":\"\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":52,\"page_no\":6,\"filename\":\"2609.14245v1.pdf\",\"image_path\":\"/var/www/html/personal/llms/portfolio/data/processed/01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde/figures/fig-006-01-a0e259bb5c9608cc.png\"}}},{\"id\":\"701c0db8-c478-5e86-ab74-c5c16767a234\",\"version\":13,\"score\":0.4586185,\"payload\":{\"page_content\":\"Table
