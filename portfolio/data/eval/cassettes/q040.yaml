      0.391           | 0.391           |\n| Q    | RECOMP      | 0.550           |
      0.020           | 0.440        | 0.010        | 0.440           | 0.030           |\n|
      Q    | LLMLingua-2 | 0.490           | 0.118           | 0.387        | 0.076        |
      0.387           | 0.019           |", "B Complete Paired Comparisons\nSection
      4.2 describes the common cohorts, estimands, inference, and precision-code correction.
      Tables 6-10 report all 148 planned contrasts, including those not retained as
      claims; EF1 effects and intervals use four decimal places, and other effects
      and intervals use three.\nTable notation. A/Q denote ASQA/QASPER; Id, RR, X,
      RC, and LL denote identity, reranking, extraction, RECOMP, and LLMLingua-2.
      Setting labels give compressor/nominal budget, optionally followed by the recovery
      threshold. P/R denote precision/recall, with e/g for emitted/grounded; EM is
      str-EM, EF1 is evidence F1, and Rec is reattribution rate. U s /U m /U r denote
      declared-span, summary, and recovered-source unsupported rates. \u2206 is the
      paired left-minus-right mean difference; a single endpoint applies to both settings,
      and a pair lists left-minus-right metrics. CI is a pointwise 95% bootstrap interval;
      p H is the two-sided randomization p -value after Holm adjustment across all
      148 comparisons; n counts included questions.\nRecovered-source verification.
      This extension reads existing NLI scores from the sealed cache and makes no
      new model calls. It uses the same recovered source IDs as citation scoring,
      but the claim verifier removes repeated source IDs before pooling evidence.
      Consequently, its unsupported rate need not equal one minus grounded citation
      recall, which retains repeated cited evidence. Both summary and recovered-source
