      respectively. When TRUE also selects recovered spans, grounded precision is
      0.14 and 0.03. All 16 planned emitted-minus-grounded precision and recall gaps
      across both methods, datasets, and recovery modes are positive ( p H = 0 . 0024
      in a separate 24-test family). None of the eight cross-evaluator grounded-precision
      differences passes Holm adjustment; this does not establish equivalence or validate
      the primary numbers. Appendix C reports all comparisons, the 4,096-token input
      configuration, decoder anomalies, and documented restarts. The pattern persists
      under a second scoring family, with recovery and calibration limitations retained.",
      "Table 11: Precision on the same sampled saved answers: 100 ASQA (A) and 100
