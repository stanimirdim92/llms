        Complete Paired Comparisons\\nSection 4.2 describes the common cohorts, estimands,
        inference, and precision-code correction. Tables 6-10 report all 148 planned
        contrasts, including those not retained as claims; EF1 effects and intervals
        use four decimal places, and other effects and intervals use three.\\nTable
        notation. A/Q denote ASQA/QASPER; Id, RR, X, RC, and LL denote identity, reranking,
        extraction, RECOMP, and LLMLingua-2. Setting labels give compressor/nominal
        budget, optionally followed by the recovery threshold. P/R denote precision/recall,
        with e/g for emitted/grounded; EM is str-EM, EF1 is evidence F1, and Rec is
        reattribution rate. U s /U m /U r denote declared-span, summary, and recovered-source
        unsupported rates. \u2206 is the paired left-minus-right mean difference;
        a single endpoint applies to both settings, and a pair lists left-minus-right
        metrics. CI is a pointwise 95% bootstrap interval; p H is the two-sided randomization
        p -value after Holm adjustment across all 148 comparisons; n counts included
        questions.\\nRecovered-source verification. This extension reads existing
        NLI scores from the sealed cache and makes no new model calls. It uses the
        same recovered source IDs as citation scoring, but the claim verifier removes
        repeated source IDs before pooling evidence. Consequently, its unsupported
        rate need not equal one minus grounded citation recall, which retains repeated
        cited evidence. Both summary and recovered-source rates exclude the same zero-claim
        answers: two QASPER RECOMP answers at nominal 0.25; the other three comparisons
        use their full common cohorts. Input hashes, the extension plan, cache lookups,
        perquestion records, and all four comparisons are retained separately from
        the original analysis.\\n\",\"metadata\":{\"ingestion_version\":\"01a0fc54ff9a70d3af0e9b49e864b8b9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde-text-0028\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde\",\"chunk_type\":\"text\",\"section_path\":\"B
        Complete Paired Comparisons\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":133,\"page_no\":13,\"filename\":\"2609.14245v1.pdf\"}}},{\"id\":\"9a45527a-69f1-5359-860f-9612cf9636fd\",\"version\":13,\"score\":0.48190755,\"payload\":{\"page_content\":\"6
        Analysis\\nRe-attribution varies across no-provenance methods. The re-attribution
        rate measures whether at least one candidate source snippet passes the NLI
        entailment threshold for a unit without declared provenance. On ASQA, RECOMP's
        rates are 0.41, 0.41, 0.42, and 0.39 across nominal budgets 0.5 through 0.05,
        excluding examples without summary units. Averaged over these examples, roughly
        three-fifths of its units have no passing candidate; this does not establish
        that the source contains no supporting evidence. LLMLingua-2's ASQA rate means
        decrease from 0.56 to 0.40, 0.25, and 0.20 as budgets tighten; the first two
        adjacent decreases have p H = 0 . 0148 , while the final decrease is unresolved
        ( p H = 0 . 242 ). Recovery coverage depends on method, budget, and dataset
        as well as the search and evaluator; these observations provide no universal
        ceiling on recoverable support.\\nTable 2: Mean input tokens on 944 ASQA questions
        at nominal budget 0.25 (identity: full context). Total includes generator
        and declared-span verification input; compression, output, and recovery are
        excluded.\\n\\nIdentity, Gen. in = 798. Identity, Ver. span = 371. Identity,
