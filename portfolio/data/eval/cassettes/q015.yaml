        and Results\\nEfficiency-Performance Tradeoff. Figure 5 relates TriviaQA Match
        to per-query inference latency across compression rates (theoretical optimal
        \u03C4 is used) . AdaMem operates at the same low latency as prior soft compression
        while delivering uncompressed-quality answers roughly 4 \xD7 more efficiently
        than Full Context: at 32 \xD7 compression it matches Full Context quality
        (84.4 Match) at 4 . 0 \xD7 lower latency and 3 . 6 \xD7 less compute. The
        two methods also trade quality for speed in sharply different ways. Lowering
        the budget moves OSCAR down a steep curve, losing 5.3 Match points between
        16 \xD7 and 64 \xD7 compression, whereas AdaMem stays within 0.5 points over
        the same range: relevance-aware allocation converts compression into latency
        savings almost without quality cost. As a result, AdaMem at 64 \xD7 is both
        faster and more accurate than uniform compression at 16 \xD7 . Appendix B
        provides additional efficiency discussion with detailed measurements, including
        throughput, compute, and memory information.\\nEffect of Training-Data Filtering.
        We evaluate the impact of filtered fine-tuning data. KILT-SCR retains instances
        where the retrieved pool contains a gold-answer alias and the teacher target
        is answer-consistent, reducing noise in both retrieval supervision and generation
        targets.\\nFor a controlled comparison, we train the same AdaMem model for
        one epoch on either filtered or unfiltered data under identical settings.
        Using 25 passages and a compression rate of 16, Table 2 shows that KILT-SCR
        improves performance by 1.7 points on average, indicating better alignment
        between relevance estimation and answer generation.\\nAblation of Training
        Stages. Table 3 ablates the contribution of the three training stages. Removing
        Stage 1 causes the largest performance drop across all datasets, particularly
        on NQandHotpotQA.Thisresultshowsthatdirectly optimizing query-dependent generation
        and relevance-supervision objectives is insufficient to learn effective continuous
        passage representations from scratch. Removing either Stage 2 or Stage 3 produces
        smaller but consistent degradations. Without Stage 2, the model loses the
        intermediate adaptation from generic soft compression to query-conditioned
        evidence representation. Without Stage 3, it is not optimized for relevance
        estimation and memory allocation over the full retrieved candidate pools used
        at inference time.\\nTable 2: Effect of filtered fine-tuning data on Match
        (%) at compression rate 16. Both models are trained for one epoch.\\n\\nUnfiltered,
        TriviaQA = 80.3. Unfiltered, NQ = 62.8. Unfiltered, HotpotQA = 42.6. Filtered,
        TriviaQA = 82.8. Filtered, NQ = 63.3. Filtered, HotpotQA = 44.5. Difference,
        TriviaQA = +2.5. Difference, NQ = +0.6. Difference, HotpotQA = +2.0\",\"metadata\":{\"ingestion_version\":\"01a0fc53885372038a1c6d0df171e569\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d-text-0012\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d\",\"chunk_type\":\"text\",\"section_path\":\"Experiments
        and Results\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":67,\"page_no\":6,\"filename\":\"2609.22100v1.pdf\"}}},{\"id\":\"e77c451b-d619-5407-9742-cabb1f3d0ec6\",\"version\":7,\"score\":0.583195,\"payload\":{\"page_content\":\"Experiments
        and Results\\nBaselines. We compare AdaMem against hardcompression methods
        (RECOMP, LLMLingua, and LLMLingua-2), and soft-compression methods (xRAG,
        PISCO, and OSCAR). No Context answers without retrieved evidence, while Full
        Context provides all retrieved passages without compression. PISCO and OSCAR
        are the closest soft-compression baselines because they support large retrieved
        candidate pools and integrate compression with the retrieval pipeline. PISCO
        uses query-independent passage compression, whereas OSCAR, like AdaMem, performs
        query-conditioned compression and relevance scoring. Both assign memory uniformly
        across retained passages, while AdaMem allocates a fixed global budget according
        to passage relevance. To isolate this difference, we train PISCO, OSCAR, and
        AdaMem using identical data splits, hyperparameters, and training stages.
        Consequently, the comparison with OSCAR directly measures the effect of relevance-aware
        memory allocation under a matched setup.\\nMain Results. Table 1 reports results
        with 25 retrieved documents. At the reference compression rate of 16 \xD7
        , AdaMem achieves the best performance among compressed methods on five of
        six benchmarks. The only exception is BioASQ, where LLMLingua-2 achieves the
        strongest compressed result. Nevertheless, AdaMem outperforms all evaluated
        soft-compression baselines.\\nHard-compression methods exhibit a clear trade-off
        between compression and answer quality. RECOMP achieves the highest compression
        rate (200 \xD7 ), but its performance remains only moderately above the No
        Context baseline; for example, it improves HotpotQA from 32.3 to 37.0. Conversely,
        LLMLingua and LLMLingua-2 operate at only 2 \xD7 compression, retaining a
        substantially larger text budget, yet generally remain below AdaMem. For instance,
        at 16 \xD7 , AdaMem improves over LLMLingua-2 by 3.3 points on TriviaQA, 3.0
        points on HotpotQA, and 17.3 points on PopQA. Thus, hard compression either
        requires aggressive token removal, which leaves limited useful evidence, or
        preserves much larger context without reaching the effectiveness of soft compression.\\nAmong
        soft-compression methods, AdaMem consistently outperforms OSCAR under the
        same 16 \xD7 memory budget and yields substantial gains over PISCO. xRAG performs
        poorly in this setting because it is designed to compress a single document.
        When applied to long multi-document contexts, its compressed tokens become
        less informative and fail to preserve passage-specific, query-relevant evidence.\\nBoth
        AdaMem and OSCAR are trained at 16 \xD7 compression. We evaluate higher compression
        ratios exclusively at inference time, without additional training or fine-tuning.
        At 32 \xD7 , AdaMem outperforms OSCAR at its training-time compression ratio
        of 16 \xD7 across all benchmarks, indicating that it can use approximately
        half as many memory embeddings while maintaining answer quality. Even at 64
        \xD7 , AdaMemsurpasses OSCAR at 16 \xD7 on five of six benchmarks. Moreover,
        AdaMem retains a clear advantage over OSCAR at the same\\n64 \xD7 compression
        rate. For example, on TriviaQA, increasing compression from 16 \xD7 to 64
        \xD7 reduces performance by only 0.7 points for AdaMem, compared with 5.3
        points for OSCAR. This robustness suggests that relevance-aware allocation
        preserves salient evidence when the memory budget is severely constrained.\",\"metadata\":{\"ingestion_version\":\"01a0fc53885372038a1c6d0df171e569\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d-text-0010\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d\",\"chunk_type\":\"text\",\"section_path\":\"Experiments
