        total compute, and peak GPU memory across inference-time compression rates.\\n\\n|
        Method       | Rate   |   Lat. (ms) |   Thr. (q/s) |   TFLOPs |   Mem. (GB)
        |\\n|--------------|--------|-------------|--------------|----------|-------------|\\n|
        Full Context | 1 \xD7    |       667.4 |         1.50 |     59.9 |        53.5
        |\\n| OSCAR        | 16 \xD7   |       156.1 |         6.41 |     15.0 |        39.6
        |\\n| OSCAR        | 32 \xD7   |       149.3 |         6.70 |     13.4 |        39.0
        |\\n| OSCAR        | 64 \xD7   |       142.9 |         7.00 |     12.5 |        38.7
        |\\n| OSCAR        | 128 \xD7  |       136.4 |         7.33 |     12.1 |        38.5
