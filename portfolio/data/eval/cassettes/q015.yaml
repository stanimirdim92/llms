      (text, page 11)\",\"citations\":{\"enabled\":true}},{\"type\":\"document\",\"source\":{\"type\":\"text\",\"media_type\":\"text/plain\",\"data\":\"B
      Inference Efficiency\\nTable 4 reports per-query latency, throughput, total
      compute, and peak GPU memory on TriviaQA with k = 25 retrieved passages, for
      all inference-time compression rates used in the main text.\\nAll compressed
      configurations are substantially cheaper than Full Context: latency drops by
      3 . 5 \xD7 to 4 . 9 \xD7 and compute by 2 . 9 \xD7 to 5 . 0 \xD7 , confirming
      that soft compression removes the dominant cost of processing large retrieval
      pools. Relative to OSCAR at the same compression rate, AdaMem adds the cost
      of relevance scoring and of encoding the fixed candidate memory bank before
      selection. This overhead is confined to the compressor and does not grow with
      the decoder context, so its share shrinks as compression increases: from 36.3
      ms (23%) at 16 \xD7 to 10.0 ms (7%) at 64 \xD7 and 7.6 ms (6%) at 128 \xD7 .
      Because the quality of AdaMem is nearly flat in the compression rate, it can
      be operated at aggressive compression where this overhead is smallest: at 64
      \xD7 and 128 \xD7 , AdaMem matches or improves on OSCAR at 16 \xD7 in latency,
      throughput, and compute while providing higher answer quality. Peak memory remains
      moderately higher than OSCAR because the candidate bank for the full pool is
      encoded before allocation, yet at 64 \xD7 it is already below the Full Context
      footprint (44.4 versus 53.5 GB), and the gap narrows further with compression.\"},\"title\":\"2609.22100v1.pdf
      [01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d] (text, page
      10)\",\"citations\":{\"enabled\":true}},{\"type\":\"document\",\"source\":{\"type\":\"text\",\"media_type\":\"text/plain\",\"data\":\"Experiments
      and Results\\nEfficiency-Performance Tradeoff. Figure 5 relates TriviaQA Match
      to per-query inference latency across compression rates (theoretical optimal
      \u03C4 is used) . AdaMem operates at the same low latency as prior soft compression
      while delivering uncompressed-quality answers roughly 4 \xD7 more efficiently
      than Full Context: at 32 \xD7 compression it matches Full Context quality (84.4
      Match) at 4 . 0 \xD7 lower latency and 3 . 6 \xD7 less compute. The two methods
      also trade quality for speed in sharply different ways. Lowering the budget
      moves OSCAR down a steep curve, losing 5.3 Match points between 16 \xD7 and
      64 \xD7 compression, whereas AdaMem stays within 0.5 points over the same range:
      relevance-aware allocation converts compression into latency savings almost
      without quality cost. As a result, AdaMem at 64 \xD7 is both faster and more
      accurate than uniform compression at 16 \xD7 . Appendix B provides additional
      efficiency discussion with detailed measurements, including throughput, compute,
      and memory information.\\nEffect of Training-Data Filtering. We evaluate the
      impact of filtered fine-tuning data. KILT-SCR retains instances where the retrieved
      pool contains a gold-answer alias and the teacher target is answer-consistent,
      reducing noise in both retrieval supervision and generation targets.\\nFor a
      controlled comparison, we train the same AdaMem model for one epoch on either
      filtered or unfiltered data under identical settings. Using 25 passages and
      a compression rate of 16, Table 2 shows that KILT-SCR improves performance by
      1.7 points on average, indicating better alignment between relevance estimation
      and answer generation.\\nAblation of Training Stages. Table 3 ablates the contribution
      of the three training stages. Removing Stage 1 causes the largest performance
      drop across all datasets, particularly on NQandHotpotQA.Thisresultshowsthatdirectly
      optimizing query-dependent generation and relevance-supervision objectives is
      insufficient to learn effective continuous passage representations from scratch.
      Removing either Stage 2 or Stage 3 produces smaller but consistent degradations.
      Without Stage 2, the model loses the intermediate adaptation from generic soft
      compression to query-conditioned evidence representation. Without Stage 3, it
      is not optimized for relevance estimation and memory allocation over the full
      retrieved candidate pools used at inference time.\\nTable 2: Effect of filtered
      fine-tuning data on Match (%) at compression rate 16. Both models are trained
      for one epoch.\\n\\nUnfiltered, TriviaQA = 80.3. Unfiltered, NQ = 62.8. Unfiltered,
      HotpotQA = 42.6. Filtered, TriviaQA = 82.8. Filtered, NQ = 63.3. Filtered, HotpotQA
      = 44.5. Difference, TriviaQA = +2.5. Difference, NQ = +0.6. Difference, HotpotQA
      = +2.0\"},\"title\":\"2609.22100v1.pdf [01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d]
      (text, page 6)\",\"citations\":{\"enabled\":true}},{\"type\":\"document\",\"source\":{\"type\":\"text\",\"media_type\":\"text/plain\",\"data\":\"Abstract\\nRetrieval-augmented
      generation (RAG) improves language modelswithretrieved evidence, but processing
      many long passages is costly and can introduce distracting information. Soft
      compression addresses this challenge by encoding passages as compact sequences
      of continuous memory embeddings before generation. However, existing methods
      typically assign each retained passage an identical number of memory embeddings,
      irrespective of its query-specific relevance. To address this, we propose AdaMem,
      a relevance-guided soft-compression framework that maps learned passage-relevance
      estimates to a query-dependent allocation of a fixed memory-token budget. A
      shared query-conditioned compressor produces both continuous passage memories
      and relevance scores in a single pass; a deterministic allocation rule assigns
      more memory tokens to higher-scoring passages and can omit low-scoring ones.
      Across six open-domain QA benchmarks, AdaMem consistently outperforms OSCAR
      (the closely matched softcompression baseline that uses uniform allocation)
      as well as other soft-compression methods at matched memory budgets. Under standard
      16 \xD7 compression, AdaMem improves sub-string match by up to 3.2 points (5.5%)
      over uniform allocation baseline, with an average relative gain of 3.4%; under
      aggressive 64 \xD7 compression the average relative gain grows to 14.6%, with
      a maximum of 9.8 points (19.7%) on PopQA. AdaMem matches the answer quality
      of the uncompressed at up to 4 \xD7 lower inference latency than full context
      baseline. AdaMem retains an efficiency profile comparable to the uniform-compression
      baseline, while achieving up to 4 \xD7 lower inference latency than full-context
      inference. Thus, relevance-guided memory allocation is particularly effective
      when retrieval pools are large and the available memory budget is tight.\"},\"title\":\"2609.22100v1.pdf
