      | 50.0 |    34.8 |   55.9 |     29.0 | 200           |\n| LLMLingua-2       |       80.7
      |       43.3 | 60.9 |    44.3 |   63.0 |     31.2 | 2             |\n| LLMLingua         |       76.2
      |       37.2 | 55.0 |    39.0 |   58.4 |     27.2 | 2             |\n| xRAG              |       26.9
      |       13.9 |  9.3 |    11.2 |   11.9 |      8.8 | 147           |\n| PISCO             |       79.8
      |       38.4 | 58.9 |    53.6 |   61.0 |     27.7 | 16            |\n| OSCAR             |       82.4
      |       44.1 | 62.8 |    58.4 |   66.5 |     28.6 | 16            |\n|                   |       80.4
      |       40.0 | 60.0 |    56.9 |   66.8 |     28.4 | 32            |\n|                   |       77.1
      |       36.3 | 54.2 |    49.8 |   58.8 |     26.0 | 64            |\n|                   |       84.0
      |       46.3 | 64.0 |    61.6 |   69.1 |     29.2 | 16            |\n| AdaMem
      (proposed) |       83.9 |       45.4 | 63.9 |    61.7 |   68.5 |     29.3 |
      32            |\n| AdaMem (proposed) |       83.3 |       44.2 | 61.4 |    59.6
      |   67.1 |     28.8 | 64            |", "This is a line chart grid comparing
      two retrieval-augmented QA methods, OSCAR (red) and AdaMem (green), across three
      datasets (TriviaQA, NQ, HotpotQA) and three compression ratios (16x, 32x, 64x),
      forming a 3x3 panel layout. The x-axis in each subplot represents the number
      of retrieved documents (k = 5, 10, 15, 20, 25), while the y-axis shows task
      performance scores (ranging roughly from 36 to 84 depending on the dataset/compression
      level). Across nearly all panels, AdaMem consistently outperforms OSCAR, with
      the performance gap generally widening as compression increases (64x) and as
      more documents are retrieved, demonstrating AdaMem''s superior robustness under
      higher compression and larger retrieval sets.", "D Judge Metrics\nWe use Substring
      Match as the primary metric because it is deterministic and consistent with
      standard open-domain QA evaluation. However, it can overestimate answer quality
      when a model lists multiple candidate answers: the prediction receives full
      credit whenever it contains a gold-answer alias as a substring, even if the
      response is ambiguous, unsupported, or includes incorrect alternatives. We therefore
      additionally report LLM-as-a-judge scores, which evaluate the correctness of
      the generated answer in the context of the question and reference answer. The
      judge assigns a score of 1 for a correct answer, 0.5 for a partially correct
      answer, and 0 for a wrong answer; we report the mean score as a percentage.
      This complementary evaluation penalizes answer enumeration and verifies that
      improvements in Match correspond to genuinely correct answers rather than increased
      lexical overlap with the reference.\nTable 5: Training schedule for the three-stage
      procedure.\n\nStage 1, Examples = 2,000,000. Stage 1, Epochs = 1. Stage 2, Examples
      = 500,000. Stage 2, Epochs = 1. Stage 3 (KILT-SCR), Examples = 196,916. Stage
      3 (KILT-SCR), Epochs = 3\nFor each example, we provide the judge with the question,
      the reference answer, and the model prediction. We use the following prompt:\nSystem
      prompt: You are an evaluation tool. Answer with one of: 1: Correct, 0.5: Partially
      correct, 0: Wrong.\nUser prompt: Here is a question, a golden answer, and an
      AI-generated answer. Can you judge whether the AIgenerated answer is correct
      according to the question and golden answer? Simply answer with one of: 1: Correct,
      0.5: Partially correct, 0: Wrong.\nQuestion:\n{question}\nGolden answer:\n{answer}\nGenerated
      answer: {prediction}\nFigure 7 corroborates the Match-based robustness trends.
      At the training-time compression rate of 16 \u00d7 , AdaMem matches or exceeds
      OSCAR across all three benchmarks, improving by 1.8 points on TriviaQA and 2.4
      points on NQ, while the methods are effectively tied on HotpotQA. The advantage
      grows under stronger inference-time compression. At 64 \u00d7 , AdaMem exceeds
      OSCAR by 6.1 points on TriviaQA and NQ, and by 7.1 points on HotpotQA. In contrast
      to OSCAR, AdaMem remains stable as the memory budget shrinks: its judge score
      decreases by only 0.9, 3.3, and 1.4 points from 16 \u00d7 to 64 \u00d7 on TriviaQA,
      NQ, and HotpotQA, respectively, compared with drops of 5.2, 7.0, and 8.7 points
      for OSCAR. These results show that relevance-aware allocation preserves answer-critical
      information under severe compression, rather than merely improving lexical overlap
      with reference answers.", "Introduction\nMotivated by these limitations, we
      propose AdaMem , a framework that transforms reranking from binary selection
      into relevance-aware memory allocation. A shared compressor produces query-conditioned
      memories and scores; a principled softmax allocation, grounded in logarithmic
      utility theory, distributes a fixed total memory budget across passages according
      to their estimated utility. The temperature interpolates between uniform allocation
      and hard topk selection. Here are our main contributions:\n- We introduce relevance-aware
      memory allocation for soft-compressed RAG: each document receives an adaptive
      memory budget determined by its estimated relevance (Figure 1), concentrating
      capacity on answer-bearing evidence while preserving compact representations
      for complementary context. This adaptivity makes AdaMem substantially more robust
      to extreme compression: between 16 \u00d7 and 128 \u00d7 its quality degrades
      by only about 2%, compared with over 7% for uniform-allocation baselines such
      as OSCAR.\n- Across six open-domain QA benchmarks, AdaMem outperforms every
      evaluated compression baseline at matched budgets: at 16 \u00d7 it improves
      over uniform allocation by 3 . 4% on average (up to 5 . 5% ) and over the strongest
      hard-compression baseline by 9 . 7% despite an 8 \u00d7 smaller context. Quality
      is also more stable under inference-time compression: moving from 16 \u00d7
      to 64 \u00d7 costs AdaMem 2 . 8% on average, against 12 . 2% for uniform allocation.
      At different compression rates, AdaMem retains up to 99% of full-context quality
      at 4 \u00d7 lower latency.\n- We release KILT-SCR (Soft Compression and Reranking),
      a large-candidate-pool resource for reranking and context compression, with
      25 passages per query, 196,916\ntraining instances, and evaluation data from
      six QA benchmarks. The training split use answer-grounded filtration to ensure
      supporting retrieved evidence and goldconsistent generated targets.", "Abstract\nRetrieval-augmented
      generation (RAG) improves language modelswithretrieved evidence, but processing
      many long passages is costly and can introduce distracting information. Soft
      compression addresses this challenge by encoding passages as compact sequences
      of continuous memory embeddings before generation. However, existing methods
      typically assign each retained passage an identical number of memory embeddings,
      irrespective of its query-specific relevance. To address this, we propose AdaMem,
      a relevance-guided soft-compression framework that maps learned passage-relevance
      estimates to a query-dependent allocation of a fixed memory-token budget. A
      shared query-conditioned compressor produces both continuous passage memories
      and relevance scores in a single pass; a deterministic allocation rule assigns
      more memory tokens to higher-scoring passages and can omit low-scoring ones.
      Across six open-domain QA benchmarks, AdaMem consistently outperforms OSCAR
      (the closely matched softcompression baseline that uses uniform allocation)
      as well as other soft-compression methods at matched memory budgets. Under standard
      16 \u00d7 compression, AdaMem improves sub-string match by up to 3.2 points
      (5.5%) over uniform allocation baseline, with an average relative gain of 3.4%;
      under aggressive 64 \u00d7 compression the average relative gain grows to 14.6%,
      with a maximum of 9.8 points (19.7%) on PopQA. AdaMem matches the answer quality
      of the uncompressed at up to 4 \u00d7 lower inference latency than full context
      baseline. AdaMem retains an efficiency profile comparable to the uniform-compression
      baseline, while achieving up to 4 \u00d7 lower inference latency than full-context
      inference. Thus, relevance-guided memory allocation is particularly effective
      when retrieval pools are large and the available memory budget is tight.", "Conclusion\nWe
      introduced AdaMem, a relevance-aware allocation framework for soft-compressed
      RAG. Instead of uniformly representing retained passages, AdaMem converts querydependent
      relevance scores into a non-uniform allocation of a fixed global memory budget,
      concentrating capacity on answer-bearing evidence while retaining limited capacity
      for complementary passages. The resulting allocation is the exact optimum of
      a proportional-fair objective under an assumed logarithmic utility model, and
      is a first-order approximation to the reverse-water-filling optimum of classical
      exponential-distortion bit allocation.\nFigure 6: Optimal allocation temperature
      on TriviaQA across compression rates. The analytically predicted schedule (
      \u03c4 \u221d B ( \u03c1 ) , anchored at 16 \u00d7 ) follows the empirical optimum
      and consistently outperforms a fixed \u03c4 = 1 .\nAdaMem establishes a new
      state of the art among softcompression methods across six evaluated QA benchmarks.
      At 16 \u00d7 compression, it improves over baselines, the strongest prior soft-compression
      method, by an average of 3 . 4% in relative terms. The advantage becomes substantially
      larger as the memory budget decreases. At 64 \u00d7 compression, the average
      relative improvement reaches 14 . 6% , with gains of up to 21 . 8% on HotpotQA.
      At 32 \u00d7 , AdaMem exceeds OSCAR at 16 \u00d7 on every benchmark, achieving
      an average relative improvement of 2 . 9% . These results show that adaptive
      allocation is particularly effective under aggressive compression, where large
      retrieval pools must be represented within strict memory constraints.\nFinally,
      we introduce KILT-SCR, a training and evaluation resource for the joint study
      of reranking and compression. Constructed to retain answer-bearing retrieved
      evidence and answer-consistent teacher targets, it enables controlled comparison
      of reranking and memory-allocation strategies over large candidate pools with
      heterogeneous passage utility.\nSeveral future research directions remain open.
      The temperature could be learned or predicted per query rather than set per
      compression rate, allowing allocation sharpness to adapt to the confidence of
      the relevance estimates. The budget-allocation view itself is not specific to
      QA or memory embeddings and extends naturally to other bounded representations,
      such as KV-cache compression and long-context summarization.\nAllal, L. B.;
      Lozhkov, A.; Bakouch, E.; Bl\u00e1zquez, G. M.; Penedo, G.; Tunstall, L.; Marafioti,
      A.; Kydl\u00ed\u010dek, H.; Lajar\u00edn, A. P.; Srivastav, V.; Lochner, J.;
      Fahlgren, C.; Nguyen, X.-S.; Fourrier, C.; Burtenshaw, B.; Larcher, H.; Zhao,
      H.; Zakka, C.; Morlon, M.; Raffel, C.; von Werra, L.; and Wolf, T. 2025. SmolLM2:
      When Smol Goes Big - Data-Centric Training of a Small Language Model. arXiv:2502.02737.",
      "Related Work\nPrior work on context compression follows two main paradigms:
      hard compression , which shortens retrieved text, and soft compression , which
      replaces it with continuous representations.\nHard Compression. These methods
      retain the generator''s textual interface by selecting or rewriting useful context.
      LLMLingua (Jiang et al. 2023b) uses perplexity-based token removal; LongLLMLingua
      (Jiang et al. 2024) adds query awareness; LLMLingua-2 (Pan et al. 2024) formulates
      compression as token classification. RECOMP (Xu, Shi, and Choi 2024) learns
      extractive and abstractive compressors optimized for downstream performance.
      Such methods are interpretable and model-agnostic, but their discrete outputs
      must be re-encoded per query, limiting compression rates.\nSoft Compression.
      Soft compression maps text to continuous memory embeddings consumed directly
      by the generator. Gist tokens (Mu, Li, and Goodman 2023), AutoCompressors (Chevalier
      et al. 2023), and In-Context Autoencoders (Ge et al. 2024) establish that LLMs
      can condition on latent representations. For RAG, xRAG (Cheng et al. 2024) projects
      a pre-computed embedding into generator space; 500xCompressor (Li, Su, and Collier
      2025) demonstrates extreme compression; PISCO (Louis, D\u00e9jean, and Clinchant
      2025) trains a compressor via distillation. OSCAR (Louis et al. 2026) is most
      closely related: it performs online query-conditioned compression and jointly
      produces representations and relevance scores. However, as in most prior pipelines,
      relevance determines ordering or selection, while each retained passage receives
      the same fixed number of memory tokens. AdaMem instead distributes a fixed global
      budget non-uniformly according to estimated utility.\nCapacity of Soft Memories.
      Kuratov et al. (2025) show a single vector can encode sequences at compression
      ratios approaching 1500 \u00d7 , and that compressibility depends more on resolvable
      uncertainty than raw length; we build on this observation but study how a fi
      xed capacity should be distributed across multiple passages rather than the
      ceiling of a single memory.", "This is a schematic diagram illustrating the
      \"AdaMem\" adaptive memory compression method for retrieval-augmented language
      models, shown in three panels. Panel (a) depicts a shared compressor network
      that takes query-document pairs (d1\u2013d4) and outputs relevance scores (ranging
      from 2.1 to -1.9). Panel (b) shows the adaptive budget allocation formula (using
      softmax over relevance scores divided by temperature \u03c4) that distributes
      a fixed total memory budget (B=32 tokens) unevenly across documents based on
      relevance (m1=17, m2=9, m3=6, m4=0), contrasted with a uniform allocation baseline
      (8 tokens each). Panel (c) illustrates the decoder stage, where allocated memory
      tokens are fed into a LoRA-adapted Mistral-7B model to generate an answer, demonstrating
      that AdaMem''s adaptive allocation produces the correct answer (\"Kazuo Ishiguro\")
      while uniform budget allocation yields an incorrect answer (\"Frederick Forsyth\").",
      "Query-Conditioned Compression and Adaptive Allocation. For each query-passage
      pair, we form\nwhere \u03b3 is the distortion decay rate and \u03c3 the spread
      of the log-utilities (Appendix A).The optimal temperature should therefore decrease
      as the per-passage budget B/K becomes smaller. This trend is reflected in the
      experiments, where the best \u03c4 decreases from 1 . 0 at 16 \u00d7 to 0 .
      5 at 64 \u00d7 compression (Figure 6).\n", "This is a line plot with shaded
      confidence bands showing memorization (MEM tokens per document) as a function
      of document relevance rank for a 64x configuration. The y-axis shows MEM tokens
      per document (0-20+) and the x-axis shows document relevance rank from 1 (most
      relevant) to 25. The median line drops sharply from about 9-10 tokens at rank
      1 to near 0 by rank 5, with shaded regions indicating the 10th-90th and 25th-75th
      percentiles; a red dashed horizontal line marks the OSCAR 16x baseline at 9
      MEM/document for comparison, showing that the most relevant document (rank 1)
      has memorization comparable to this baseline while lower-ranked documents show
      substantially less."], "model": "rerank-2.5", "top_k": 5, "truncation": true}'
