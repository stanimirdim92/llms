      = 5.20. AdaMem, TFLOPs = 21.0. AdaMem, Mem. (GB) = 56.4. AdaMem, Rate = 32 \u00d7.
      AdaMem, Lat. (ms) = 167.5. AdaMem, Thr. (q/s) = 5.97. AdaMem, TFLOPs = 16.6.
      AdaMem, Mem. (GB) = 48.4. AdaMem, Rate = 64 \u00d7. AdaMem, Lat. (ms) = 152.9.
      AdaMem, Thr. (q/s) = 6.54. AdaMem, TFLOPs = 14.3. AdaMem, Mem. (GB) = 44.4.
      AdaMem, Rate = 128 \u00d7. AdaMem, Lat. (ms) = 144.0. AdaMem, Thr. (q/s) = 6.95.
      AdaMem, TFLOPs = 13.0. AdaMem, Mem. (GB) = 42.3", "This is a line chart comparing
      TriviaQA match performance against compression rate (16x, 32x, 64x, 128x on
      x-axis) for three memory allocation methods. The \"AdaMem (ours)\" method (blue
      line) maintains the highest accuracy across all compression rates, starting
      near 84 and ending around 82 (only -2.08% drop from full context), outperforming
      \"Uniform(Oscar)\" (orange line, dropping to -7.34%) and \"Uniform(Pisco)\"
      (purple line, dropping to -7.52%). A dashed green line at the top indicates
      \"Full Context\" performance (~84.5) as the reference baseline, and a schematic
      above the chart illustrates how AdaMem allocates variable-length document representations
      (d1-d4) compared to Uniform''s equal-length allocation.", "This is a line/scatter
      plot comparing retrieval or memory methods on a latency-accuracy tradeoff. The
      x-axis shows \"Latency per query (ms, log scale)\" ranging from about 140 to
      670+, and the y-axis shows \"Match (%)\" ranging from roughly 76 to 84. Three
      methods are plotted: AdaMem (green circles) and OSCAR (orange squares), each
      annotated with compression/sampling factors (128\u00d7, 64\u00d7, 32\u00d7,
      16\u00d7), showing that AdaMem achieves higher match scores at lower latencies
      than OSCAR; a \"Full Context\" baseline (purple star) achieves the highest match
      (~84%) but at much greater latency (~670 ms), labeled as \"4\u00d7 lower latency\"
      compared to the other methods, indicating AdaMem approaches Full Context accuracy
      while being significantly faster.", "Experiments and Results\nFinally, at 16
      \u00d7 , AdaMem closely approaches Full Context performance despite replacing
      the retrieved text with a substantially shorter continuous representation. On
      TriviaQA, it is within 0.4 points of Full Context, while on PopQA it exceeds
      Full Context by 1.4 points. Hence, selective memory allocation can both reduce
      computational cost and mitigate interference from irrelevant retrieved passages.\nFigure
      4: Memory-token allocation by document relevance rank at 64 \u00d7 compression.
      The dashed line denotes OSCAR''s fixed 16 \u00d7 allocation.\nMemory Allocation
      Behavior. Figure 4 illustrates the allocation mechanism under this highly constrained
      64 \u00d7 setting. For the most relevant documents, AdaMem allocates a median
      of roughly 10 memory tokens, already exceeding OSCAR''s fixed budget of 9 tokens
      per document at 16 \u00d7 . The 90th percentile is substantially higher, indicating
      that for some queries, AdaMem assigns considerably more capacity to the most
      relevant document. In contrast, the allocation decreases sharply with relevance
      rank and approaches zero for lower-ranked documents. Thus, AdaMem concentrates
      capacity on query-relevant evidence while assigning minimal capacity to noisy
      passages, reducing their potential interference in the compressed context.\nRobustness
      to Retrieval Depth and Compression. Figure 3 compares AdaMem and OSCAR across
      retrieval depths k \u2208 { 5 , 10 , 15 , 20 , 25 } and compression ratios of
      16 \u00d7 , 32 \u00d7 , and 64 \u00d7 at \u03c4 =1. AdaMem benefits more consistently
      from deeper retrieval, whereas OSCAR remains nearly constant as additional lower-ranked
      documents are introduced.\nThis difference is most pronounced under aggressive
      compression. At 64 \u00d7 , increasing k from 5 to 25 improves AdaMem by 3.5
      points on TriviaQA, 5.4 on Natural Questions, and 4.2 on HotpotQA, while OSCAR
      changes only marginally over the same range. A similar pattern holds at 32 \u00d7
      , particularly on Natural Questions and HotpotQA.\nThese results suggest that
      AdaMem can extract useful evidence from less-relevant documents without allocating
      them the same budget as highly relevant ones. In contrast, OSCAR''s fixed per-document
      allocation provides limited benefit from deeper retrieval, as its representation
      capacity is uniformly spread over an increasingly noisy document set. The effect
      is weaker at 16 \u00d7 , where both methods have sufficient capacity for shallow
      retrieval pools, but becomes increasingly clear as the memory budget is reduced.\nFigure
      5: Quality-latency tradeoff on TriviaQA. AdaMem shows similar latency as OSCAR
      and matches Full Context quality at 4 . 0 \u00d7 lower latency.", "This is a
      grouped bar chart comparing the performance of two methods, AdaMem (blue) and
      OSCAR (yellow hatched), across three question-answering datasets: TriviaQA,
      NQ, and HotpotQA. The y-axis shows \"Llama-3 judge (%)\" scores ranging from
      0 to about 90, while the x-axis shows compression rates of 16\u00d7, 32\u00d7,
      and 64\u00d7 for each dataset. Across all datasets and compression rates, AdaMem
      consistently outperforms OSCAR, with the performance gap widening as compression
      rate increases (e.g., in HotpotQA, AdaMem scores 62.4% vs OSCAR''s 55.3% at
      64\u00d7 compression), indicating AdaMem maintains accuracy better under higher
      compression.", "Top-25 QA robustness under stronger compression\nFigure 7: LLM-as-a-judge
      accuracy under increasingly strong inference-time compression. AdaMem consistently
      retains higher answer quality than OSCAR as the memory budget decreases.", "Experiments
      and Results\nEfficiency-Performance Tradeoff. Figure 5 relates TriviaQA Match
      to per-query inference latency across compression rates (theoretical optimal
      \u03c4 is used) . AdaMem operates at the same low latency as prior soft compression
      while delivering uncompressed-quality answers roughly 4 \u00d7 more efficiently
      than Full Context: at 32 \u00d7 compression it matches Full Context quality
      (84.4 Match) at 4 . 0 \u00d7 lower latency and 3 . 6 \u00d7 less compute. The
      two methods also trade quality for speed in sharply different ways. Lowering
      the budget moves OSCAR down a steep curve, losing 5.3 Match points between 16
      \u00d7 and 64 \u00d7 compression, whereas AdaMem stays within 0.5 points over
      the same range: relevance-aware allocation converts compression into latency
      savings almost without quality cost. As a result, AdaMem at 64 \u00d7 is both
      faster and more accurate than uniform compression at 16 \u00d7 . Appendix B
      provides additional efficiency discussion with detailed measurements, including
      throughput, compute, and memory information.\nEffect of Training-Data Filtering.
      We evaluate the impact of filtered fine-tuning data. KILT-SCR retains instances
      where the retrieved pool contains a gold-answer alias and the teacher target
      is answer-consistent, reducing noise in both retrieval supervision and generation
      targets.\nFor a controlled comparison, we train the same AdaMem model for one
      epoch on either filtered or unfiltered data under identical settings. Using
      25 passages and a compression rate of 16, Table 2 shows that KILT-SCR improves
      performance by 1.7 points on average, indicating better alignment between relevance
      estimation and answer generation.\nAblation of Training Stages. Table 3 ablates
      the contribution of the three training stages. Removing Stage 1 causes the largest
      performance drop across all datasets, particularly on NQandHotpotQA.Thisresultshowsthatdirectly
      optimizing query-dependent generation and relevance-supervision objectives is
      insufficient to learn effective continuous passage representations from scratch.
      Removing either Stage 2 or Stage 3 produces smaller but consistent degradations.
      Without Stage 2, the model loses the intermediate adaptation from generic soft
      compression to query-conditioned evidence representation. Without Stage 3, it
      is not optimized for relevance estimation and memory allocation over the full
      retrieved candidate pools used at inference time.\nTable 2: Effect of filtered
      fine-tuning data on Match (%) at compression rate 16. Both models are trained
      for one epoch.\n\nUnfiltered, TriviaQA = 80.3. Unfiltered, NQ = 62.8. Unfiltered,
      HotpotQA = 42.6. Filtered, TriviaQA = 82.8. Filtered, NQ = 63.3. Filtered, HotpotQA
      = 44.5. Difference, TriviaQA = +2.5. Difference, NQ = +0.6. Difference, HotpotQA
      = +2.0", "Experiments and Results\nBaselines. We compare AdaMem against hardcompression
      methods (RECOMP, LLMLingua, and LLMLingua-2), and soft-compression methods (xRAG,
      PISCO, and OSCAR). No Context answers without retrieved evidence, while Full
      Context provides all retrieved passages without compression. PISCO and OSCAR
      are the closest soft-compression baselines because they support large retrieved
      candidate pools and integrate compression with the retrieval pipeline. PISCO
      uses query-independent passage compression, whereas OSCAR, like AdaMem, performs
      query-conditioned compression and relevance scoring. Both assign memory uniformly
      across retained passages, while AdaMem allocates a fixed global budget according
      to passage relevance. To isolate this difference, we train PISCO, OSCAR, and
      AdaMem using identical data splits, hyperparameters, and training stages. Consequently,
      the comparison with OSCAR directly measures the effect of relevance-aware memory
      allocation under a matched setup.\nMain Results. Table 1 reports results with
      25 retrieved documents. At the reference compression rate of 16 \u00d7 , AdaMem
      achieves the best performance among compressed methods on five of six benchmarks.
      The only exception is BioASQ, where LLMLingua-2 achieves the strongest compressed
      result. Nevertheless, AdaMem outperforms all evaluated soft-compression baselines.\nHard-compression
      methods exhibit a clear trade-off between compression and answer quality. RECOMP
      achieves the highest compression rate (200 \u00d7 ), but its performance remains
      only moderately above the No Context baseline; for example, it improves HotpotQA
      from 32.3 to 37.0. Conversely, LLMLingua and LLMLingua-2 operate at only 2 \u00d7
      compression, retaining a substantially larger text budget, yet generally remain
      below AdaMem. For instance, at 16 \u00d7 , AdaMem improves over LLMLingua-2
      by 3.3 points on TriviaQA, 3.0 points on HotpotQA, and 17.3 points on PopQA.
      Thus, hard compression either requires aggressive token removal, which leaves
      limited useful evidence, or preserves much larger context without reaching the
      effectiveness of soft compression.\nAmong soft-compression methods, AdaMem consistently
      outperforms OSCAR under the same 16 \u00d7 memory budget and yields substantial
      gains over PISCO. xRAG performs poorly in this setting because it is designed
      to compress a single document. When applied to long multi-document contexts,
      its compressed tokens become less informative and fail to preserve passage-specific,
      query-relevant evidence.\nBoth AdaMem and OSCAR are trained at 16 \u00d7 compression.
      We evaluate higher compression ratios exclusively at inference time, without
      additional training or fine-tuning. At 32 \u00d7 , AdaMem outperforms OSCAR
      at its training-time compression ratio of 16 \u00d7 across all benchmarks, indicating
      that it can use approximately half as many memory embeddings while maintaining
      answer quality. Even at 64 \u00d7 , AdaMemsurpasses OSCAR at 16 \u00d7 on five
      of six benchmarks. Moreover, AdaMem retains a clear advantage over OSCAR at
      the same\n64 \u00d7 compression rate. For example, on TriviaQA, increasing compression
      from 16 \u00d7 to 64 \u00d7 reduces performance by only 0.7 points for AdaMem,
      compared with 5.3 points for OSCAR. This robustness suggests that relevance-aware
      allocation preserves salient evidence when the memory budget is severely constrained.",
      "Table 1: Match (%) performance on six QA benchmarks with 25 retrieved documents.
      Hard- (RECOMP, LLMLingua, LLMLingua-2) and soft-compression (xRAG, PISCO) baselines
      are shown at their respective rates; OSCAR (uniform) and AdaMem (relevance-aware)
      share one compressor and are reported at 16 / 32 / 64 \u00d7 , with 32 / 64
      \u00d7 at inference only. Per column, the top-3 compression methods are shaded
      green (darkest = best). The bootstrap-estimated standard deviations for TriviaQA,
      HotpotQA, NQ, PopQA, ASQA, and BioASQ are 1.0, 1.1, 1.1, 1.1, 1.5, and 1.2,
      respectively. Generation temperature: \u03c4 = 1 .\n\n| Method            |   TriviaQA
      |   HotpotQA |   NQ |   PopQA |   ASQA |   BioASQ | Compr. rate   |\n|-------------------|------------|------------|------|---------|--------|----------|---------------|\n|
      No Context        |       71.9 |       32.3 | 41.7 |    26.5 |   48.4 |     29.4
