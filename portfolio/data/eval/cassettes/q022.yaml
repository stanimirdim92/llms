      R4: Subjectivity of harm\\nFigure 4 presents the Cohen's Kappa scores for inter-annotator
      agreement. LlamaGuard and WildGuard have an agreement of 0.66, indicating substantial
      agreement. The other pairwise comparisons between the LLM safety judges are
      0.47 and 0.48, indicating only moderate agreement. In general, our hypothesis
      H4 that the automated safety evaluators will disagree on many cases is supported.
      We additionally include the evaluation of whether the answer was judged to be
      accurate, compared to the reference answer. The accuracy measure agrees most
      with the safety ratings of WildGuard with \u03BA = 0 . 67 . These results highlight
