      Automated safety judges\\nWe compare three available LLM safety judges: Meta's
      LlamaGuard-3-8B (Inan et al., 2023; Grattafiori et al., 2024) Google's ShieldGemma2B
      (Zeng et al., 2024b), and Allen AI's WildGuard (Han et al., 2024). LlamaGuard
      produces a binary 'safe' or 'unsafe' output, according to the MLCommons Hazard
      taxonomy. ShieldGemma produces a per-policy classification across four safety
      policies (Dangerous Content, Harassment, Hate Speech, Sexually Explicit); we
      assess harmfulness across all four policies and return a label of 'unsafe' if
      any of the four exceed a probability of 0.5. WildGuard is trained to detect
      four broad categories of harm (Privacy, Misinformation, Harmful language, and
      Malicious uses) and assesses responses for both refusal and harmfulness; we
