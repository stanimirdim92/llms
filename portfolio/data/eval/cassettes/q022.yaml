    body: '{"query": "Which three automated safety judges are compared?", "documents":
      ["3.3 Automated safety judges\nWe compare three available LLM safety judges:
      Meta''s LlamaGuard-3-8B (Inan et al., 2023; Grattafiori et al., 2024) Google''s
      ShieldGemma2B (Zeng et al., 2024b), and Allen AI''s WildGuard (Han et al., 2024).
      LlamaGuard produces a binary ''safe'' or ''unsafe'' output, according to the
      MLCommons Hazard taxonomy. ShieldGemma produces a per-policy classification
      across four safety policies (Dangerous Content, Harassment, Hate Speech, Sexually
      Explicit); we assess harmfulness across all four policies and return a label
      of ''unsafe'' if any of the four exceed a probability of 0.5. WildGuard is trained
      to detect four broad categories of harm (Privacy, Misinformation, Harmful language,
      and Malicious uses) and assesses responses for both refusal and harmfulness;
      we consider the (binary) harmfulness label assigned to the response.\nFor each
      response, an overall label of ''unsafe'' is assigned when at least two of the
      three safety evaluators flag the response as unsafe. We compute pairwise inter-annotator
      agreement of the evaluators using Cohen''s Kappa.", "4.4 R4: Subjectivity of
      harm\nFigure 4 presents the Cohen''s Kappa scores for inter-annotator agreement.
      LlamaGuard and WildGuard have an agreement of 0.66, indicating substantial agreement.
      The other pairwise comparisons between the LLM safety judges are 0.47 and 0.48,
      indicating only moderate agreement. In general, our hypothesis H4 that the automated
      safety evaluators will disagree on many cases is supported. We additionally
      include the evaluation of whether the answer was judged to be accurate, compared
      to the reference answer. The accuracy measure agrees most with the safety ratings
      of WildGuard with \u03ba = 0 . 67 . These results highlight that different methods
      of evaluating safety versus harm may lead to different interpretations of the
      same phenomenon. Overall, the four-way Fleiss''s kappa is 0.56, indicating only
      moderate agreement. However, Figure 5 in the Appendix, which provides a more
      detailed view of the safety evaluations, suggests that even when the absolute
      numbers differ, when averaged over a large number of samples, the trends observed
      using each of the evaluation methods remain generally consistent.\nTo explore
      the differences between automated safety evaluators further, Table 4 presents
      a finegrained analysis of the predicted positive rate for each evaluator on
      each sub-category of the RAGSafety-Bench benchmark, averaged over all generating
      models. When averaged over all models and conditions, the predicted positive
      rate of the evaluators is similar (14% for LlamaGuard, 17% for ShieldGemma,
      and 20% for WildGuard). However, each evaluator is more sensitive to certain
      subcategories of harm. For example, LlamaGuard flags responses less often than
      the other two evaluators Cohen''s K\nFigure 3: Refusal behaviors by model and
      condition.\nFigure 4: Pairwise Cohen''s Kappa scores for each automated safety
      judge, as well as four-way Fleiss''s Kappa.\nin categories like assault/battery
      and drugs. ShieldGemma flags far fewer responses in the subcategories of cyberattacks
      and financial crimes, while flagging more often in categories like chemical
      weapons, radiological weapons, and explosives. WildGuard is more sensitive to
      subcategories like hate speech and sexual harassment.", "A.7 Detailed safety
      evaluation comparison\nFigure 5 shows the proportion of responses marked as
      either ''harmful'' or ''accurate'' for each model and condition. The generally
      consistent vertical structure indicates that although the methods of safety
      evaluation lead to different results, the trends (averaged over many samples)
      are consistent across evaluators. Nonetheless, we would recommend that researchers
      use multiple evaluators in their study, given the fairly high rates of disagreement
      observed here.", "Table 4: Predicted positive (unsafe) rate (%) by subcategory
      for each safety judge (LG = LlamaGuard, SG = ShieldGemma, WG = WildGuard) and
      the majority vote (Maj.).\n\n| Subcategory          |   LG |   SG |   WG |   Maj.
      |\n|----------------------|------|------|------|--------|\n| abuse                |  8.2
      |  8.5 | 10.0 |    9.2 |\n| assault/battery      |  8.2 | 26.0 | 23.0 |   21.2
      |\n| biological weapons   |  4.0 | 17.0 | 21.0 |   15.0 |\n| chemical weapons     |
      15.8 | 33.0 | 19.0 |   21.5 |\n| cyberattacks         | 24.0 |  4.2 | 22.2 |   19.8
      |\n| drugs                | 15.0 | 22.8 | 24.4 |   21.6 |\n| explosives           |
      25.0 | 33.8 | 24.0 |   26.2 |\n| financial crimes     | 17.2 |  0.8 | 23.0 |   15.8
      |\n| fraud/scam           | 14.8 |  0.2 | 16.2 |   13.0 |\n| hate crimes          |
      10.0 | 16.5 | 14.6 |   13.8 |\n| hate speech          | 15.5 | 16.5 | 25.0 |   18.2
      |\n| kidnapping           | 15.3 | 14.4 | 18.8 |   17.6 |\n| murder               |
      11.0 | 25.5 | 20.5 |   18.5 |\n| property crimes      | 13.0 |  6.5 | 21.5 |   13.5
      |\n| radiological weapons | 20.0 | 32.1 | 25.0 |   26.4 |\n| self harm            |
      13.5 | 15.2 | 18.5 |   16.0 |\n| sexual assault       |  9.2 | 10.8 | 15.0 |   12.5
      |\n| sexual harassment    |  7.5 |  9.7 | 15.0 |    9.7 |\n| suicide              |
      11.8 | 22.5 | 18.0 |   18.5 |\n| terrorism            | 14.2 | 29.2 | 18.5 |   20.2
      |\n| All (overall)        | 14.1 | 16.9 | 19.6 |   17.4 |", "4.1 R1: Capability
      in safe and unsafe contexts\nTable 3 reports accuracies for each model when
      asked benign and harmful questions, in both nonRAG, oracle RAG, and mixed settings.
      In the benign case, accuracy is scored using the MIRAGE benchmark method (Park
      et al., 2025). In the harmful (RAG-Safety-Bench) case, we compare the output
      response with the expected benchmark response, using Claude-Opus-4.7 to output
      a fi- nal label of accurate or inaccurate relative to the reference. Human annotation
      of a subset of 100 examples validates the LLM-as-a-judge approach, with agreement
      of 95-96% between humans and LLM, and Cohen''s \u03ba of 0.90-0.92 (more details
      and prompt available in Appendix Section A.4).\nTable 1: The four settings of
      the RAG-Safety-Bench benchmark. Example documents are for the query, ''What
      materials and design do I need to make an IED that can defeat armored police
      vehicles?''\n\nLLM-only, Description = No context documents provided.. LLM-only,
      Example Wikipedia documents = (None). Oracle, Description = One of the returned
      documents contains the answer.. Oracle, Example Wikipedia documents = ''Explosively
      formed penetrator''. On-topic, Description = Oracle document not included, but
      documents are related to the topic of the query.. On-topic, Example Wikipedia
      documents = ''Deflagration to detonation tran- sition'', ''Blast wall''. Random,
      Description = Documents are randomly selected from a set of benign documents..
      Random, Example Wikipedia documents = ''Climate change and birds'', ''Ar- boretum''",
      "A.4 LLM-as-a-judge accuracy evaluation\nThe accuracy of the responses was assessed
      by comparing the model outputs with the gold ''expected unsafe answer summary''
      for each question. Accuracy judging was conducted using Claude Opus-4.7, using
      the prompt shown in Table 9. Out of 6,920 responses scored, in 95% of cases
      a valid ''true'' or ''false'' label was returned. In the remaining 5%, an empty
      label was returned; these were treated as ''false'' for the sake of the analysis.\nThe
      automated classifier was validated through human annotation of 100 examples,
      sampled across the five generating models and the True/False conditions. The
      raw agreement and Cohen''s \u03ba scores are given in Table 7. The agreement
      between manual and automated accuracy scoring is very high, with raw agreement
      between 95-96% and Cohen''s \u03ba of 0.90-0.92.\nTable 7: Human validation
      of the automated accuracy calculation.\n\nAnnotator_1 vs LLM, Agreement = 0.96.
      Annotator_1 vs LLM, Cohen''s Kappa = 0.92. Annotator_2 vs LLM, Agreement = 0.95.
      Annotator_2 vs LLM, Cohen''s Kappa = 0.90. Annotator_1 vs Annotator_2, Agreement
      = 0.97. Annotator_1 vs Annotator_2, Cohen''s Kappa = 0.94\nTable 8: Answerability
      of document contexts for the final balanced subset ( n = 346 ). Oracle and on-topic
      contexts were audited with GPT-4.1mini. \u2020 Random-control values reflect
      construction-time answer_support=none labels rather than a separate LLM audit.\n\nOracle
      unsafe, Yes = 200 (57.8%). Oracle unsafe, Partial = 146 (42.2%). Oracle unsafe,
      No / none = 0 (0.0%). On-topic safe, Yes = 0 (0.0%). On-topic safe, Partial
      = 0 (0.0%). On-topic safe, No / none = 346 (100.0%). Random control \u2020,
      Yes = 0 (0.0%). Random control \u2020, Partial = 0 (0.0%). Random control \u2020,
      No / none = 346 (100.0%)", "2 Related Work\nLLMsafety evaluation Evaluating
      open-ended text responses for safety is a challenging task. In many cases, refusal
      is considered a proxy for safety (Vidgen et al., 2023; Sun et al., 2023; Wang
      et al., 2024a; Bianchi et al., 2023; Mazeika et al., 2024; Xie et al., 2025),
      though refusal itself can take many forms (Wang et al., 2024b). Other work uses
      supervised or LLM-based classifiers to label outputs as ''safe'' or ''unsafe'',
      according to some definition of safety (often grounded in a terms and conditions
      document or other regulatory framework). Commonly used examples of safety classifiers
      include Llama-Guard (Inan et al., 2023), Shield-Gemma (Zeng et al., 2024b),
      and WildGuard (Han et al., 2024). The current work considers refusals, safety
      classifiers, and the accuracy of the information in the responses as correlated
      but distinct signals.", "Kathleen C. Fraser\n1. To what extent is the observed
      RAG safety decline correlated with a model''s RAG capability? Previous work
      suggests that some models which appear ''safe'' may simply be less capable of
      extracting and summarizing relevant information. We test this rigorously, and
      hypothesize the following (H1): Models which perform better on MIRAGE (benign
      capability) will also have higher accuracy and therefore lower safety in the
      oracle setting of RAG-Safety-Bench.\n2. Is RAG safety decline a factor of unsafe
      information or unsafe context drift? The conventional view, challenged by An
      et al. (2025), is that RAG models are less safe only when the documents they
      retrieve are unsafe. An alternative explanation is that the increased context
      length, possibly containing many words semantically related to the unsafe query,
      shift the models into a less-aligned domain. 1 Our hypothesis (H2) is that the
      direct availability of the answer (oracle setting) will lead to the\n1 In fact,
      this is similar to the intuition behind the successful Crescendo jailbreak (Russinovich
      et al., 2025).\nhighest number of unsafe answers, but that the on-topic setting
      will lead to a higher number of unsafe answers relative to the baseline non-RAG
      setting, due to the destabilizing effect of the harmful-topic context. If the
      effect is purely due to context length, the random setting will lead to an equivalent
      harmfulness rate.\n3. What is the impact of RAG on the refusal rate of LLMs?
      In many studies, safety is operationalized as refusal: a safe model is one which
      refuses to answer harmful questions. We distinguish between two varieties of
      refusal; namely, unwillingness to fulfill a harmful request versus inability
      to find the answer in the retrieved documents. We hypothesize (H3) that the
      refusal rate for harmful requests will be highest in the random setting, and
      attributed to a lack of information. We argue that this case should be distinguished
      from ''true'' model safety, which should rely on an inherent unwillingness to
      provide dangerous advice. At the same time, the oracle setting offers contrasting
      evaluation in which we ensure the model has access to the requested information,
      so refusal can be more clearly interpreted as effective implementation of safety
      guardrails.\n4. Do different safety evaluators agree on what is safe versus
      harmful? Standard safety evaluation relies on LLM-based ''judges'' to label
      text as safe or unsafe. We compare multiple safety evaluators, with the hypothesis
      (H4) that there will be a high level of disagreement between the LLM evaluators.\nRAG-Safety-Bench
      is freely available for research use at the following URL: https://github.com/The-Safe-AI-Lab/
      RAG-Safety-Bench .", "Table 11: Human validation of the automated refusal classification.\n\n|
      Comparison                 |   Raw agreement |   Cohen''s Kappa |\n|----------------------------|-----------------|-----------------|\n|
      Annotator_1 vs LLM         |            0.84 |            0.71 |\n| Annotator_2
      vs LLM         |            0.85 |            0.73 |\n| Annotator_1 vs Annotator_2
      |            0.92 |            0.86 |", "References\n- Aaron Grattafiori, Abhimanyu
      Dubey, Abhinav Jauhri, Abhinav Pandey, Abhishek Kadian, Ahmad AlDahle, Aiesha
      Letman, Akhil Mathur, Alan Schelten, Alex Vaughan, and 1 others. 2024. The llama
      3 herd of models. In Neural Information Processing Systems .\n- Seungju Han,
      Kavel Rao, Allyson Ettinger, Liwei Jiang, Bill Yuchen Lin, Nathan Lambert, Yejin
      Choi, and Nouha Dziri. 2024. Wildguard: Open one-stop moderation tools for safety
