        Detailed safety evaluation comparison\\nFigure 5 shows the proportion of responses
        marked as either 'harmful' or 'accurate' for each model and condition. The
        generally consistent vertical structure indicates that although the methods
        of safety evaluation lead to different results, the trends (averaged over
        many samples) are consistent across evaluators. Nonetheless, we would recommend
        that researchers use multiple evaluators in their study, given the fairly
        high rates of disagreement observed here.\",\"metadata\":{\"ingestion_version\":\"01a0fc5427ea71babb96a22c2c5762f3\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a-text-0035\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a\",\"chunk_type\":\"text\",\"section_path\":\"A.7
        Detailed safety evaluation comparison\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":201,\"page_no\":17,\"filename\":\"2609.11758v1.pdf\"}}},{\"id\":\"9f91e3cc-eb63-5067-9e2b-f325f5af07fc\",\"version\":5,\"score\":0.30808112,\"payload\":{\"page_content\":\"E.
        Experimental Design\\nThe evaluation set contains 49 fact-checking queries,
        of which 37 are distinct, spanning locations, dates and counts, yes/no claims,
        and people. Ten information-rich passages covering the queried facts were
        added to the index because raw FEVER evidence sentences are often too terse
        to support a full answer. Crossing the query set with three strategies and
        four poisoning levels yields 49 \xD7 3 \xD7 4 = 588 runs, each producing a
        clean and a poisoned answer for 1 , 176 generations in total. Because a full
        sweep takes roughly a day on CPU, results are written to disk after every
        run and a checkpoint records completed cells, so an interrupted sweep resumes
        without repeating work.\",\"metadata\":{\"ingestion_version\":\"01a0fc53392f724b972307d03a9f94d9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead-text-0006\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead\",\"chunk_type\":\"text\",\"section_path\":\"E.
        Experimental Design\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":30,\"page_no\":2,\"filename\":\"2609.09243v1.pdf\"}}},{\"id\":\"fab5fc9c-48c2-5309-be84-9c8b53e8d8df\",\"version\":13,\"score\":0.2993911,\"payload\":{\"page_content\":\"9
        Limitations\\nEvaluator dependence. Primary scores use DeBERTa-v3-base, trained
        on MNLI, FEVER, and ANLI, at \u03C4 = 0 . 5 , without human calibration. Using
        the same model to select recovered spans and score support can reinforce systematic
        errors; the resulting scores are evaluator-dependent estimates, not validated
        rates of source support or factual correctness. This dependence also limits
        conclusions about method rankings and the size of emitted-grounded gaps. The
        200-question TRUE audit checks a second scoring family, but fixed recovery
        retains DeBERTa selection and TRUE recovery reuses one judge. Different input
        windows and nonbinary decoder outputs further limit numerical comparison.
        Human source-level calibration remains necessary (Rashkin et al., 2023).\\nSingle
        generator. All results use Qwen2.5-7BInstruct with greedy decoding. Frontier
        shapes may differ across model families and scales; a second-family replication
        is planned.\\nDataset coverage. We evaluate two English datasets (ASQA and
        QASPER) with distinct retrieval granularities, but this does not cover multilingual
        settings, open-web retrieval, or longercontext regimes.\\nRe-attribution hyperparameters.
        The top-10 lexical candidate pool can miss semantically matching snippets,
        and requiring one snippet to entail a unit can miss support distributed across
        snippets. Consequently, a failed recovery does not establish that the source
        contains no support. Table 3 varies the recovery threshold while holding the
        scoring threshold fixed; it does not validate the evaluator or test candidate-pool
        size, retrieval strategy, or multi-snippet recovery.\\nVerification scope.
        Declared-span verification rejects claims lacking declared evidence by construction,
        even if support could be recovered. Its 1 . 00 unsupported rate for no-provenance
        runs is a provenance-availability diagnostic, not a calibrated hallucination
        rate. Recovered-source verification is reported at nominal 0.25 for the two
        no-provenance methods and remains dependent on the same bounded recovery procedure
        and evaluator.\\nResidual error rows. Only identity fails on 4 ASQA and 29
        QASPER questions; every primary setting is evaluated on the resulting common
        successful subset. This pairing prevents comparisons from using different
        questions, but conditions results on identity success and omits those difficult
        cases. Sampling intervals condition on the fixed generated outputs and evaluator;
        they do not include systematic NLI error or variation across generation runs.\\nNominal
        versus achieved budgets. Abstractive compressors do not reliably hit nominal
        token budgets; RECOMP often produces much less context than requested. We
        report achieved compression ratios, but comparisons at a shared nominal budget
        do not establish performance at matched achieved context sizes.\",\"metadata\":{\"ingestion_version\":\"01a0fc54ff9a70d3af0e9b49e864b8b9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde-text-0020\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde\",\"chunk_type\":\"text\",\"section_path\":\"9
        Limitations\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":78,\"page_no\":9,\"filename\":\"2609.14245v1.pdf\"}}},{\"id\":\"d8117747-1c74-59a9-92ec-afe458058070\",\"version\":9,\"score\":0.29040205,\"payload\":{\"page_content\":\"4.4
        R4: Subjectivity of harm\\nFigure 4 presents the Cohen's Kappa scores for
        inter-annotator agreement. LlamaGuard and WildGuard have an agreement of 0.66,
        indicating substantial agreement. The other pairwise comparisons between the
        LLM safety judges are 0.47 and 0.48, indicating only moderate agreement. In
        general, our hypothesis H4 that the automated safety evaluators will disagree
        on many cases is supported. We additionally include the evaluation of whether
        the answer was judged to be accurate, compared to the reference answer. The
        accuracy measure agrees most with the safety ratings of WildGuard with \u03BA
        = 0 . 67 . These results highlight that different methods of evaluating safety
        versus harm may lead to different interpretations of the same phenomenon.
        Overall, the four-way Fleiss's kappa is 0.56, indicating only moderate agreement.
        However, Figure 5 in the Appendix, which provides a more detailed view of
        the safety evaluations, suggests that even when the absolute numbers differ,
        when averaged over a large number of samples, the trends observed using each
        of the evaluation methods remain generally consistent.\\nTo explore the differences
        between automated safety evaluators further, Table 4 presents a finegrained
        analysis of the predicted positive rate for each evaluator on each sub-category
        of the RAGSafety-Bench benchmark, averaged over all generating models. When
        averaged over all models and conditions, the predicted positive rate of the
        evaluators is similar (14% for LlamaGuard, 17% for ShieldGemma, and 20% for
        WildGuard). However, each evaluator is more sensitive to certain subcategories
        of harm. For example, LlamaGuard flags responses less often than the other
        two evaluators Cohen's K\\nFigure 3: Refusal behaviors by model and condition.\\nFigure
        4: Pairwise Cohen's Kappa scores for each automated safety judge, as well
        as four-way Fleiss's Kappa.\\nin categories like assault/battery and drugs.
        ShieldGemma flags far fewer responses in the subcategories of cyberattacks
        and financial crimes, while flagging more often in categories like chemical
        weapons, radiological weapons, and explosives. WildGuard is more sensitive
        to subcategories like hate speech and sexual harassment.\",\"metadata\":{\"ingestion_version\":\"01a0fc5427ea71babb96a22c2c5762f3\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a-text-0016\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a\",\"chunk_type\":\"text\",\"section_path\":\"4.4
        R4: Subjectivity of harm\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":69,\"page_no\":7,\"filename\":\"2609.11758v1.pdf\"}}},{\"id\":\"b9471911-87e0-56f1-b903-ce99862282fc\",\"version\":13,\"score\":0.27463266,\"payload\":{\"page_content\":\"4.2
        Statistical Analysis and Metric Audit\\nCommon cohorts and estimands. Primary
        summaries and comparisons use the intersection of successful question IDs
        across identity and all twenty compressed settings. Each question has equal
        weight in citation precision, citation recall, answer quality, and evidence
        F1; claims and citations are not pooled across questions. Undefined evidence
        or recovery metrics remain undefined rather than becoming zeros. Verification-rate
        means exclude answers with zero claims; paired verification comparisons exclude
        a question if ei- ther member has zero claims. The analysis artifacts report
        those exclusions and retain full-cohort descriptive means separately.\\nInference.
        We use pointwise 95% percentile bootstrap intervals for each paired mean difference
        (Dror et al., 2018), resampling 944 questions on ASQA and 271 papers on QASPER
        with replacement. All retained questions from a sampled QASPER paper travel
        together, and each replicate divides its total difference by the number of
        sampled questions, preserving the questionweighted estimand. Every QASPER
        contrast retains all 271 papers after metric-specific exclusions. Two-sided
        randomization tests swap paired labels within questions on ASQA and jointly
        within papers on QASPER. These tests assume label exchangeability within a
        resampling unit under the null. Both procedures use 10,000 replicates and
        seed 13, with independent random-number streams for bootstrap sampling and
        randomization. Monte Carlo p -values use ( b + 1) / (10 , 000 + 1) , where
        b counts randomizations at least as extreme as the observed absolute difference.
        The initial plan specified 134 core contrasts and 10 recoverythreshold contrasts
        before inspecting the revised inferential results. After that analysis and
        a cachecoverage audit, we added four recovered-source versus summary-verification
        contrasts at nominal 0.25 for RECOMP and LLMLingua-2 on both datasets. The
        extension plan was recorded before running these four tests, and Holm adjustment
        was recomputed over all 148 raw p -values. We denote Holm-adjusted values
        by p H . All reported adjusted values use this expanded family; original effects,
        intervals, and raw p -values are unchanged. This is a post hoc camera-ready
        analysis, not a preregistration. Intervals are pointwise, not simultaneous;
        statistical-support statements use p H < 0 . 05 . Failure to reject a difference
        does not establish equivalence or preservation. All inference is conditional
        on the fixed generator outputs, recovery procedure, and evaluator.\\nPrecision-code
        audit. The manuscript's precision definition requires the concatenated cited
        evidence to entail a claim before any individual citation receives credit.
        A code audit found that the previous implementation could credit an individually
        supporting citation even when joint entailment failed. A saved ASQA answer
        reproduced this discrepancy, and a regression test now checks the required
        gate through the evaluation pipeline.\\n\",\"metadata\":{\"ingestion_version\":\"01a0fc54ff9a70d3af0e9b49e864b8b9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde-text-0010\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde\",\"chunk_type\":\"text\",\"section_path\":\"4.2
        Statistical Analysis and Metric Audit\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":36,\"page_no\":4,\"filename\":\"2609.14245v1.pdf\"}}},{\"id\":\"01fc0118-5f0a-5a7b-a17c-915836e6620f\",\"version\":9,\"score\":0.27257428,\"payload\":{\"page_content\":\"A.3
