        Oracle unsafe    | 200 (57.8%) | 146 (42.2%) | 0 (0.0%)     |\\n| On-topic
        safe    | 0 (0.0%)    | 0 (0.0%)    | 346 (100.0%) |\\n| Random control \u2020
        | 0 (0.0%)    | 0 (0.0%)    | 346 (100.0%) |\"}}},{\"id\":\"31e140e8-eee1-5598-ac2a-c944a55e0cb0\",\"version\":15,\"score\":0.26491958,\"payload\":{\"page_content\":\"Limitations\\nEvaluation
        format differs from training. The RLVR agents were trained to search, read,
        and answer across multiple turns in their own tagged format, whereas our evaluation
        supplies five fixed passages and requests a single citation-bearing response.
        This was necessary for the controlled attribution comparison, but it may affect
        how the agents behave: for example, an agent that would normally issue another
        query may instead abstain. The large differences in abstention and format
        compliance are consistent with this possibility, although our data cannot
        establish the mechanism. An interactive evaluation would be needed to determine
        whether the attribution effect differs in the agents' native search setting.\\nWe
        cannot isolate RL itself. Each agent differs from the baseline in three ways
        at once: it was fine-tuned at all, fine-tuned on retrieval data, and fine-tuned
        with reinforcement learning. Without an arm fine-tuned on the same data without
        RL, our comparison is associational. This is the single most valuable addition
        a follow-up could make.\\nSearch-R1 saw NQ in training. It was trained on
        NQ's training split and we evaluate it on KILTNQ. QAMPARI, HAGRID, and RAGTruth
        are clean for all three agents, and R-Search's pattern is in fact strongest
        away from NQ, but we have not quantified the overlap.\\nThe span always lands
        at the end of the passage. Any positional bias in how models pick citations
        is therefore mixed in with the effect of the plant. Randomizing the injection
        point is the obvious next experiment.\\nCITED-OTHER is underpowered outside
        RAGTruth. NQ, QAMPARI, and HAGRID yield only 13-43 question clusters for this
        variant, too few for intervals we would defend. RAGTruth alone is large enough.\\nWhat
        a flag means. Our scorer is deterministic string matching, so each flag is
        exactly reproducible: the model cited the doctored passage for the aligned
        claim. Reading that as postrationalization is an interpretation we inherit
        from Wallat et al. (2025), and a competing reading exists. After planting,
        the claim's words genuinely sit in the doctored passage, so citing it could
        be scored as obedience to 'answer from the passages' rather than as unfaithfulness.
        Hand-checking a sample of flagged cases would settle how often each reading
        applies, and we have not done it.\\nScope. Three RLVR agents from one line
        of work, one base model, English only, one prompt, one decoding setting. Citation
        behavior may well shift with the prompt, so our numbers describe this setup
        until someone varies it.\",\"metadata\":{\"ingestion_version\":\"01a0fc55257f7276be70b7b3d1501b36\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6-text-0025\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6\",\"chunk_type\":\"text\",\"section_path\":\"Limitations\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":108,\"page_no\":8,\"filename\":\"2609.23053v1.pdf\"}}},{\"id\":\"b23e9f67-cdcc-54fe-a4f0-6c338b605762\",\"version\":7,\"score\":0.26339197,\"payload\":{\"page_content\":\"D
        Judge Metrics\\nWe use Substring Match as the primary metric because it is
        deterministic and consistent with standard open-domain QA evaluation. However,
        it can overestimate answer quality when a model lists multiple candidate answers:
        the prediction receives full credit whenever it contains a gold-answer alias
        as a substring, even if the response is ambiguous, unsupported, or includes
        incorrect alternatives. We therefore additionally report LLM-as-a-judge scores,
        which evaluate the correctness of the generated answer in the context of the
        question and reference answer. The judge assigns a score of 1 for a correct
        answer, 0.5 for a partially correct answer, and 0 for a wrong answer; we report
        the mean score as a percentage. This complementary evaluation penalizes answer
        enumeration and verifies that improvements in Match correspond to genuinely
        correct answers rather than increased lexical overlap with the reference.\\nTable
        5: Training schedule for the three-stage procedure.\\n\\nStage 1, Examples
        = 2,000,000. Stage 1, Epochs = 1. Stage 2, Examples = 500,000. Stage 2, Epochs
        = 1. Stage 3 (KILT-SCR), Examples = 196,916. Stage 3 (KILT-SCR), Epochs =
        3\\nFor each example, we provide the judge with the question, the reference
        answer, and the model prediction. We use the following prompt:\\nSystem prompt:
        You are an evaluation tool. Answer with one of: 1: Correct, 0.5: Partially
        correct, 0: Wrong.\\nUser prompt: Here is a question, a golden answer, and
        an AI-generated answer. Can you judge whether the AIgenerated answer is correct
        according to the question and golden answer? Simply answer with one of: 1:
        Correct, 0.5: Partially correct, 0: Wrong.\\nQuestion:\\n{question}\\nGolden
        answer:\\n{answer}\\nGenerated answer: {prediction}\\nFigure 7 corroborates
        the Match-based robustness trends. At the training-time compression rate of
        16 \xD7 , AdaMem matches or exceeds OSCAR across all three benchmarks, improving
        by 1.8 points on TriviaQA and 2.4 points on NQ, while the methods are effectively
        tied on HotpotQA. The advantage grows under stronger inference-time compression.
        At 64 \xD7 , AdaMem exceeds OSCAR by 6.1 points on TriviaQA and NQ, and by
        7.1 points on HotpotQA. In contrast to OSCAR, AdaMem remains stable as the
        memory budget shrinks: its judge score decreases by only 0.9, 3.3, and 1.4
        points from 16 \xD7 to 64 \xD7 on TriviaQA, NQ, and HotpotQA, respectively,
        compared with drops of 5.2, 7.0, and 8.7 points for OSCAR. These results show
        that relevance-aware allocation preserves answer-critical information under
        severe compression, rather than merely improving lexical overlap with reference
        answers.\",\"metadata\":{\"ingestion_version\":\"01a0fc53885372038a1c6d0df171e569\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d-text-0026\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d\",\"chunk_type\":\"text\",\"section_path\":\"D
        Judge Metrics\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":148,\"page_no\":11,\"filename\":\"2609.22100v1.pdf\"}}},{\"id\":\"e150fd11-fda1-50ca-b462-11115d37ebbf\",\"version\":9,\"score\":0.2633204,\"payload\":{\"page_content\":\"A.5
        Refusal classification\\nThe accuracy of the automated refusal classification
        was validated by human annotation of 100 examples, sampled across the generating
        models and refusal categories. The raw agreement rates as well as Cohen's
        kappa inter-annotator agreement scores are shown in Table 11. The two human
        annotators agree with each other over 90% of the time, while the LLM judge
        agrees with the humans approximately 85% of the time (Cohen's \u03BA = 0.71-0.73).
        In almost all cases that the human annotators disagreed with the LLM, it was
        because the humans felt it was not actually a refusal at all. For example,
        a model (here, Phi-4) might say: 'I'm sorry, but I don't have access to specific
        documents or external content to provide a detailed answer to your question.
        However, I can offer some general insights based on common knowledge ...'
        and then go on to provide an informative answer. Such responses were classified
        as 'insufficient information' retrievals by Claude but manual annotation classified
        them as non-refusals.\\nYou classify why an AI model refused to answer a question.
        Reply with exactly one token, one of: safety_refusal, insufficient_info, other.\\nDefinitions:
        - safety_refusal: refused because the request is unsafe, harmful, unethical,
        illegal, or against the model's policy.\\n- insufficient_info: refused because
        the model says it lacks information, the provided documents/context do not
        contain the answer, or it cannot find the answer in available sources.\\n-
        other: any other reason (e.g., capability limits, unclear question, etc.).\\nOutput
        only the label, nothing else.\\nTable 11: Human validation of the automated
        refusal classification.\\n\\nAnnotator_1 vs LLM, Raw agreement = 0.84. Annotator_1
        vs LLM, Cohen's Kappa = 0.71. Annotator_2 vs LLM, Raw agreement = 0.85. Annotator_2
        vs LLM, Cohen's Kappa = 0.73. Annotator_1 vs Annotator_2, Raw agreement =
        0.92. Annotator_1 vs Annotator_2, Cohen's Kappa = 0.86\",\"metadata\":{\"ingestion_version\":\"01a0fc5427ea71babb96a22c2c5762f3\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a-text-0033\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a\",\"chunk_type\":\"text\",\"section_path\":\"A.5
        Refusal classification\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":190,\"page_no\":17,\"filename\":\"2609.11758v1.pdf\"}}}]},\"status\":\"ok\",\"time\":0.001554452}"
