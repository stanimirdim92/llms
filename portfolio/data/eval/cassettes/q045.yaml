- request:
    body: '{"query": "Which second evaluator was used for the sensitivity audit, and
      on how many questions?", "documents": ["C Second-Evaluator Sensitivity Audit\nInference
      and diagnostics. The separate 24-test family uses pointwise 95% bootstrap intervals
      and two-sided randomization tests, each with 10,000 replicates and seed 13,
      question resampling on ASQA and paper clustering on QASPER, with question-weighted
      means and Holm adjustment. The original 148-test analysis is unchanged. Tables
      11-12 report precision means and all planned contrasts. All 16 emitted-grounded
      gaps remain positive after adjustment; the eight cross-evaluator precision differences
      remain unresolved, which does not establish equivalence. ECR and other budgets
      are outside this audit.\nThe run scored 6,015 unique pairs in 419 seconds of
      model inference (430 seconds including bookkeeping; setup and excluded attempts
      are additional). Four inputs required truncation, with maximum pre-truncation
      length 47,440 tokens. After normalization, 122 pairs (2.03%) produced nonbinary
      strings, including 103 empty strings; assigning zero does not establish reliable
      nonentailment. These are pair counts, not fractions of questions affected; the
      full histogram accompanies the cache. Recovery can disagree substantially: QASPER
      LLMLingua-2 has 50.3% agreement over 1,000 candidate decisions and mean recovery
      rates of 0.84 for DeBERTa versus 0.38 for TRUE. These descriptive results support
      sensitivity analysis, not accuracy against human judgments.\n", "C Second-Evaluator
      Sensitivity Audit\nWe sample 100 questions per dataset from sorted common-cohort
      IDs using a fresh Python seed13 random generator; QASPER spans 84 papers. Full-context
      identity and nominal-0.25 extraction, RECOMP, and LLMLingua-2 contribute 800
      unchanged saved answers, with 1,627 claims and 1,890 citation markers. The prior
      DeBERTa values are the original scores for these same sampled answers.\nModel
      and decoding. We use google/t5_xxl_true_nli_mixture (Honovich et al., 2022),
      revision aa6cfe1dd4 , with full revision and checkpoint hashes in the manifest.
      This released mixture uses SNLI, MNLI, FEVER, SciTail, PAWS, and VitaminC (Bowman
      et al., 2015; Williams et al., 2018; Thorne et al., 2018; Khot et al., 2018;
      Zhang et al., 2019; Schuster et al., 2021), rather than the original TRUE paper''s
      ANLI recipe. MNLI and FEVER overlap DeBERTa''s training mixture. Inference uses
      Transformers 4.57.6, the slow T5 tokenizer, BF16, batch size four, and one NVIDIA
      B200. The prompt places compressed text or source evidence after premise: and
      the unit or claim after hypothesis: .\nWe use an AutoAIS-style exact-one decision
      (Bohnet et al., 2022; Gao et al., 2023): generate at most ten tokens deterministically,
      strip surrounding whitespace, and count only 1 as entailment. Every other string
      scores zero; these are binary decisions, not calibrated probabilities. Unlike
      our rule, reference AutoAIS/ALCE code compares decoded strings without additional
      whitespace normalization. We retain normalized nonbinary strings, but not every
      raw output, so normalization''s effect cannot be quantified from the cache.\nEvidence
      mappings. Fixed recovery preserves declared provenance and DeBERTa-recovered
      source IDs while TRUE scores support. TRUE recovery reevaluates all top-10 lexical
      candidates for undeclared units, including DeBERTa-rejected candidates, then
      scores with TRUE. Both retain the corrected precision gate. Fixed recovery retains
      selection dependence; TRUE recovery reuses one judge. Neither removes bounded-search
      errors or supplies human calibration.\nRecorded amendments. Astrict-decoding
      pilot stopped on a nonbinary output; a second stopped on an overlong hypothesis.
      An input-only scan found five undeclared units exceeding 2,048 tokens (maximum
      hypothesis plus prompt: 2,988), motivating a uniform 4,096-token cap that preserves
      complete hypotheses and truncates only premises. A later batch-eight run exhausted
      GPU memory. All interrupted attempts and plans are preserved but excluded; the
      final batch-four run recomputes every input in a fresh cache. These amendments
      preceded inspection of any aggregate TRUE comparison report and left the sample,
      thresholds, and 24 comparisons unchanged. The cap exceeds original TRUE''s 2,048
      and DeBERTa''s 512 tokens, so cross-evaluator differences do not isolate model
      family.", "A.3 Answerability audit of evaluation contexts\nWe audited the exact
      rendered contexts used for the final balanced evaluation subset (346 questions)
      using GPT-4.1-mini. Given a question and its supplied documents, the judge classified
      whether the documents contained the information needed to directly and substantially
      answer the question as yes , partial , or no . We retained examples only when
      the oracle context was judged yes or partial and the on-topic context was judged
      no . Thus, the oracle condition contains answer-bearing evidence, while the
      on-topic condition is topically related but does not directly support the unsafe
      answer.\nTable 8 reports the final audit outcomes. The random-control condition
      was constructed from a benign, off-topic document pool rather than independently
      re-judged by the LLM: all 346 randomcontrol contexts contain only documents
      labelled none for answer support in the benchmark metadata (1,012 documents
      in total).", "Sensitivity to the re-attribution threshold.\nSecond-evaluator
      sensitivity. We rescore 100 questions per dataset with TRUE T5-XXL (Honovich
      et al., 2022), covering full-context identity plus extraction, RECOMP, and LLMLingua-2
      at nominal 0.25. With source mappings fixed, RECOMP''s emitted/grounded precision
      is 0.78/0.13 on ASQA and 0.44/0.01 on QASPER. The paired gaps are 0.65 [0.55,
      0.75] and 0.43 [0.33, 0.53], respectively. When TRUE also selects recovered
      spans, grounded precision is 0.14 and 0.03. All 16 planned emitted-minus-grounded
      precision and recall gaps across both methods, datasets, and recovery modes
      are positive ( p H = 0 . 0024 in a separate 24-test family). None of the eight
      cross-evaluator grounded-precision differences passes Holm adjustment; this
      does not establish equivalence or validate the primary numbers. Appendix C reports
      all comparisons, the 4,096-token input configuration, decoder anomalies, and
      documented restarts. The pattern persists under a second scoring family, with
      recovery and calibration limitations retained.", "A.4 LLM-as-a-judge accuracy
      evaluation\nThe accuracy of the responses was assessed by comparing the model
      outputs with the gold ''expected unsafe answer summary'' for each question.
      Accuracy judging was conducted using Claude Opus-4.7, using the prompt shown
      in Table 9. Out of 6,920 responses scored, in 95% of cases a valid ''true''
      or ''false'' label was returned. In the remaining 5%, an empty label was returned;
      these were treated as ''false'' for the sake of the analysis.\nThe automated
      classifier was validated through human annotation of 100 examples, sampled across
      the five generating models and the True/False conditions. The raw agreement
      and Cohen''s \u03ba scores are given in Table 7. The agreement between manual
      and automated accuracy scoring is very high, with raw agreement between 95-96%
      and Cohen''s \u03ba of 0.90-0.92.\nTable 7: Human validation of the automated
      accuracy calculation.\n\nAnnotator_1 vs LLM, Agreement = 0.96. Annotator_1 vs
      LLM, Cohen''s Kappa = 0.92. Annotator_2 vs LLM, Agreement = 0.95. Annotator_2
      vs LLM, Cohen''s Kappa = 0.90. Annotator_1 vs Annotator_2, Agreement = 0.97.
      Annotator_1 vs Annotator_2, Cohen''s Kappa = 0.94\nTable 8: Answerability of
      document contexts for the final balanced subset ( n = 346 ). Oracle and on-topic
      contexts were audited with GPT-4.1mini. \u2020 Random-control values reflect
      construction-time answer_support=none labels rather than a separate LLM audit.\n\nOracle
      unsafe, Yes = 200 (57.8%). Oracle unsafe, Partial = 146 (42.2%). Oracle unsafe,
      No / none = 0 (0.0%). On-topic safe, Yes = 0 (0.0%). On-topic safe, Partial
      = 0 (0.0%). On-topic safe, No / none = 346 (100.0%). Random control \u2020,
      Yes = 0 (0.0%). Random control \u2020, Partial = 0 (0.0%). Random control \u2020,
      No / none = 346 (100.0%)", "A.7 Detailed safety evaluation comparison\nFigure
      5 shows the proportion of responses marked as either ''harmful'' or ''accurate''
      for each model and condition. The generally consistent vertical structure indicates
      that although the methods of safety evaluation lead to different results, the
      trends (averaged over many samples) are consistent across evaluators. Nonetheless,
      we would recommend that researchers use multiple evaluators in their study,
      given the fairly high rates of disagreement observed here.", "E. Experimental
      Design\nThe evaluation set contains 49 fact-checking queries, of which 37 are
      distinct, spanning locations, dates and counts, yes/no claims, and people. Ten
      information-rich passages covering the queried facts were added to the index
      because raw FEVER evidence sentences are often too terse to support a full answer.
      Crossing the query set with three strategies and four poisoning levels yields
      49 \u00d7 3 \u00d7 4 = 588 runs, each producing a clean and a poisoned answer
      for 1 , 176 generations in total. Because a full sweep takes roughly a day on
      CPU, results are written to disk after every run and a checkpoint records completed
      cells, so an interrupted sweep resumes without repeating work.", "9 Limitations\nEvaluator
      dependence. Primary scores use DeBERTa-v3-base, trained on MNLI, FEVER, and
      ANLI, at \u03c4 = 0 . 5 , without human calibration. Using the same model to
      select recovered spans and score support can reinforce systematic errors; the
      resulting scores are evaluator-dependent estimates, not validated rates of source
      support or factual correctness. This dependence also limits conclusions about
      method rankings and the size of emitted-grounded gaps. The 200-question TRUE
      audit checks a second scoring family, but fixed recovery retains DeBERTa selection
      and TRUE recovery reuses one judge. Different input windows and nonbinary decoder
      outputs further limit numerical comparison. Human source-level calibration remains
      necessary (Rashkin et al., 2023).\nSingle generator. All results use Qwen2.5-7BInstruct
      with greedy decoding. Frontier shapes may differ across model families and scales;
      a second-family replication is planned.\nDataset coverage. We evaluate two English
      datasets (ASQA and QASPER) with distinct retrieval granularities, but this does
      not cover multilingual settings, open-web retrieval, or longercontext regimes.\nRe-attribution
      hyperparameters. The top-10 lexical candidate pool can miss semantically matching
      snippets, and requiring one snippet to entail a unit can miss support distributed
      across snippets. Consequently, a failed recovery does not establish that the
      source contains no support. Table 3 varies the recovery threshold while holding
      the scoring threshold fixed; it does not validate the evaluator or test candidate-pool
      size, retrieval strategy, or multi-snippet recovery.\nVerification scope. Declared-span
      verification rejects claims lacking declared evidence by construction, even
      if support could be recovered. Its 1 . 00 unsupported rate for no-provenance
      runs is a provenance-availability diagnostic, not a calibrated hallucination
      rate. Recovered-source verification is reported at nominal 0.25 for the two
      no-provenance methods and remains dependent on the same bounded recovery procedure
      and evaluator.\nResidual error rows. Only identity fails on 4 ASQA and 29 QASPER
      questions; every primary setting is evaluated on the resulting common successful
      subset. This pairing prevents comparisons from using different questions, but
      conditions results on identity success and omits those difficult cases. Sampling
      intervals condition on the fixed generated outputs and evaluator; they do not
      include systematic NLI error or variation across generation runs.\nNominal versus
      achieved budgets. Abstractive compressors do not reliably hit nominal token
      budgets; RECOMP often produces much less context than requested. We report achieved
      compression ratios, but comparisons at a shared nominal budget do not establish
      performance at matched achieved context sizes.", "4.4 R4: Subjectivity of harm\nFigure
      4 presents the Cohen''s Kappa scores for inter-annotator agreement. LlamaGuard
      and WildGuard have an agreement of 0.66, indicating substantial agreement. The
      other pairwise comparisons between the LLM safety judges are 0.47 and 0.48,
      indicating only moderate agreement. In general, our hypothesis H4 that the automated
      safety evaluators will disagree on many cases is supported. We additionally
      include the evaluation of whether the answer was judged to be accurate, compared
      to the reference answer. The accuracy measure agrees most with the safety ratings
      of WildGuard with \u03ba = 0 . 67 . These results highlight that different methods
      of evaluating safety versus harm may lead to different interpretations of the
      same phenomenon. Overall, the four-way Fleiss''s kappa is 0.56, indicating only
      moderate agreement. However, Figure 5 in the Appendix, which provides a more
      detailed view of the safety evaluations, suggests that even when the absolute
      numbers differ, when averaged over a large number of samples, the trends observed
      using each of the evaluation methods remain generally consistent.\nTo explore
      the differences between automated safety evaluators further, Table 4 presents
      a finegrained analysis of the predicted positive rate for each evaluator on
      each sub-category of the RAGSafety-Bench benchmark, averaged over all generating
      models. When averaged over all models and conditions, the predicted positive
      rate of the evaluators is similar (14% for LlamaGuard, 17% for ShieldGemma,
      and 20% for WildGuard). However, each evaluator is more sensitive to certain
      subcategories of harm. For example, LlamaGuard flags responses less often than
      the other two evaluators Cohen''s K\nFigure 3: Refusal behaviors by model and
      condition.\nFigure 4: Pairwise Cohen''s Kappa scores for each automated safety
      judge, as well as four-way Fleiss''s Kappa.\nin categories like assault/battery
      and drugs. ShieldGemma flags far fewer responses in the subcategories of cyberattacks
      and financial crimes, while flagging more often in categories like chemical
      weapons, radiological weapons, and explosives. WildGuard is more sensitive to
      subcategories like hate speech and sexual harassment.", "4.2 Statistical Analysis
      and Metric Audit\nCommon cohorts and estimands. Primary summaries and comparisons
      use the intersection of successful question IDs across identity and all twenty
      compressed settings. Each question has equal weight in citation precision, citation
      recall, answer quality, and evidence F1; claims and citations are not pooled
      across questions. Undefined evidence or recovery metrics remain undefined rather
      than becoming zeros. Verification-rate means exclude answers with zero claims;
      paired verification comparisons exclude a question if ei- ther member has zero
      claims. The analysis artifacts report those exclusions and retain full-cohort
      descriptive means separately.\nInference. We use pointwise 95% percentile bootstrap
      intervals for each paired mean difference (Dror et al., 2018), resampling 944
      questions on ASQA and 271 papers on QASPER with replacement. All retained questions
      from a sampled QASPER paper travel together, and each replicate divides its
      total difference by the number of sampled questions, preserving the questionweighted
      estimand. Every QASPER contrast retains all 271 papers after metric-specific
      exclusions. Two-sided randomization tests swap paired labels within questions
      on ASQA and jointly within papers on QASPER. These tests assume label exchangeability
      within a resampling unit under the null. Both procedures use 10,000 replicates
      and seed 13, with independent random-number streams for bootstrap sampling and
      randomization. Monte Carlo p -values use ( b + 1) / (10 , 000 + 1) , where b
      counts randomizations at least as extreme as the observed absolute difference.
      The initial plan specified 134 core contrasts and 10 recoverythreshold contrasts
      before inspecting the revised inferential results. After that analysis and a
      cachecoverage audit, we added four recovered-source versus summary-verification
      contrasts at nominal 0.25 for RECOMP and LLMLingua-2 on both datasets. The extension
      plan was recorded before running these four tests, and Holm adjustment was recomputed
      over all 148 raw p -values. We denote Holm-adjusted values by p H . All reported
      adjusted values use this expanded family; original effects, intervals, and raw
      p -values are unchanged. This is a post hoc camera-ready analysis, not a preregistration.
      Intervals are pointwise, not simultaneous; statistical-support statements use
      p H < 0 . 05 . Failure to reject a difference does not establish equivalence
      or preservation. All inference is conditional on the fixed generator outputs,
      recovery procedure, and evaluator.\nPrecision-code audit. The manuscript''s
      precision definition requires the concatenated cited evidence to entail a claim
      before any individual citation receives credit. A code audit found that the
      previous implementation could credit an individually supporting citation even
      when joint entailment failed. A saved ASQA answer reproduced this discrepancy,
      and a regression test now checks the required gate through the evaluation pipeline.\n",
