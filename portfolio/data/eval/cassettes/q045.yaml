        to the re-attribution threshold.\\nSecond-evaluator sensitivity. We rescore
        100 questions per dataset with TRUE T5-XXL (Honovich et al., 2022), covering
        full-context identity plus extraction, RECOMP, and LLMLingua-2 at nominal
        0.25. With source mappings fixed, RECOMP's emitted/grounded precision is 0.78/0.13
        on ASQA and 0.44/0.01 on QASPER. The paired gaps are 0.65 [0.55, 0.75] and
        0.43 [0.33, 0.53], respectively. When TRUE also selects recovered spans, grounded
        precision is 0.14 and 0.03. All 16 planned emitted-minus-grounded precision
        and recall gaps across both methods, datasets, and recovery modes are positive
        ( p H = 0 . 0024 in a separate 24-test family). None of the eight cross-evaluator
        grounded-precision differences passes Holm adjustment; this does not establish
        equivalence or validate the primary numbers. Appendix C reports all comparisons,
