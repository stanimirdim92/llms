      by VimRAG. ReAct performs notably well on Image & Visual Document (around 65%)
      but has the lowest hit rate for Videos (roughly 22%), while Mem1 generally trails
      behind the top two methods across all categories.", "3.1 Vision-Text Bridged
      Reasoning Paradigm\nMulti-Scale Visual Entity Grounding. Given an input image
      I , a user query q , and a visual induction prompt p v , the Visual Explorer
      performs hierarchical region proposal generation at each reasoning step t .
      Rather than submitting the full image as a single retrieval unit, which is prone
