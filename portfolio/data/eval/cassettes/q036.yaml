      the negative policy gradient update prevents the model from being penalized
      from performing demonstrably productive retrievals on trajectories that ultimately
      fail due to shortcomings in other reasoning steps.\nFigure 4: Overview of Topology-Aware
      Policy Optimization.\nIntegrating both scenarios, we define the gradient mask
      \u03c8 t \u2208 { 0 , 1 } for segment s t as:\n<!-- formula-not-decoded -->\nwhere
      I ( \u00b7 ) is the indicator function; \u03c8 t = 1 suppresses the gradient
      contribution of segment s t during the policy update, while \u03c8 t = 0 permits
      normal gradient update. The TAPO objective is defined as:\n<!-- formula-not-decoded
      -->", "This is a bar chart comparing the \"Hit Rate (%)\" performance of four
      methods\u2014GraMRAG, VimRAG, Mem1, and ReAct\u2014across three data categories:
      General Text, Image & Visual Document, and Videos. The y-axis represents Hit
      Rate percentage, ranging from 0 to 100.\n\nGraMRAG consistently achieves the
      highest hit rate across all three categories (approximately 92% for General
