- request:
    body: '{"query": "What structure does GraMRAG''s multimodal memory graph take?",
      "documents": ["3.2 Multimodal Memory Graph\nWe construct a multimodal memory
      graph G t = ( V t , E t ) that formalizes the multi-agent reasoning process
      as a dynamic DAG. This graph explicitly encodes action-observation dependencies
      across both the visual retrieval and textual research phases via a topological
      structure, fundamentally mitigating the state blindness inherent in linear memory
      paradigms and providing the structured foundation required by the TAPO algorithm.
      As illustrated in Figure 2(b), the memory graph evolves incrementally throughout
      reasoning, faithfully recording the exploration trajectory of each agent through
      node insertions and edge connections at each step.\nNode Schema and Modality
      Classification. Each node n i \u2208 V t encodes a discrete reasoning unit as
      a typed quadruple:\n<!-- formula-not-decoded -->\nwhere \u00b5 i \u2208 { n
      root , n vis , n brd , n txt , n ans } is the modality type tag; \u03ba i is
      the search query or action descriptor driving the creation of this node; \u03c3
      i is a concise textual summary of retrieved or generated content; and \u03bd
      i is the visual feature bank, populated only for n vis-type nodes and set to
      empty for all other types. Five node types constitute the full reasoning pipeline.
      The root node ( n root ) is initialized with user query q and input image I
      , serving as the global anchor of the reasoning graph and permanently residing
      in V t . Visual nodes ( n vis) are spawned by the Visual Explorer at each retrieval
      step t \u2208 [1 , T v ] , storing the Hit/No Hit judgment and the corresponding
      evidence summary, with \u03bd i preserving multimodal content from matched web
      pages. The bridge node ( n brd) is a singleton node representing the modality
      bridging step, storing image description D as the semantic interface between
      the two reasoning phases. Text nodes ( n txt) are spawned by the Text Researcher
      at each retrieval step t \u2208 [ T v + 1 , T v + T t ] , storing webretrieved
      textual evidence summaries. The answer node ( n ans) is spawned by the Evidence
      Validator, storing the final generated answer a out , whose insertion marks
      the termination of the reasoning process. The edge set E t connects temporally
      adjacent nodes , encoding the sequential dependency of the reasoning flow.\nFigure
      3: Inference pipeline of the GraMRAG framework.", "3.2 Multimodal Memory Graph\nIterative
      Graph Expansion Protocol. The memory graph G t evolves through sequential node
      insertions jointly driven by the three main agents and the Hit/No Hit Judge.
      The expansion protocol consists of four phases as follows. During visual expansion
      ( t \u2208 [1 , T v ] ), the Visual Explorer executes retrieval action A v t
      = VSearch( B t ) and the Hit/No Hit Judge outputs binary signal s t ; a visual
      node n t = ( n vis , \u03ba t , \u03c3 t , \u03bd t ) is then inserted, where
      \u03c3 t encodes the evidence summary alongside the s t judgment, \u03bd t preserves
      visual content from matched web pages, and a sequential edge ( n t -1 , n t
      ) connects it to its predecessor. During modality bridging, upon termination
      of the visual phase, the bridge node n brd = ( n brd , \u2205 , D, \u2205 )
      is inserted and connected to the final visual node via the cross-modal bridge
      edge ( n T v , n brd ) , completing the semantic context transition from the
      visual to the textual domain. During textual expansion ( t \u2208 [ T v + 1
      , T v + T t ] ), the Text Researcher executes web retrieval actions; text nodes
      n t = ( n txt , \u03ba t , \u03c3 t , \u2205 ) are inserted with sequential
      edges, and the bridge node is connected to the first text node via edge ( n
      brd , n T v +1 ) , fully closing the cross-modal transition path. During answer
      generation, once the Evidence Validator determines that the accumulated evidence
      is sufficient, it inserts the answer node n ans = ( n ans , \u2205 , a out ,
      \u2205 ) and the reasoning process terminates. Upon completion of all four phases,
      the memory graph captures the complete multimodal reasoning trajectory as a
      structured DAG rather than compressing it into a one-dimensional sequence, thereby
      enabling each agent to efficiently query the full historical reasoning state
      and simultaneously providing the topological backbone required for fine-grained
      credit assignment in the reinforcement learning phase.", "This is a schematic
      diagram comparing two multi-agent Retrieval-Augmented Generation (RAG) architectures.
      The left panel, labeled \"Traditional Multi-Agent RAG,\" shows multiple agent
      icons connected in a circular workflow around a linear memory structure (depicted
      as stacked horizontal bars). The right panel, labeled \"Our GraMRAG,\" shows
      agents arranged around a graph-based memory structure (depicted as interconnected
      nodes in a network) rather than linear memory. The diagram conveys that the
      proposed GraMRAG method replaces traditional linear/sequential memory storage
      with a graph-structured memory to better organize and retrieve information among
      collaborating agents.", "2.2 Memory Structures of Agent Systems\nThe memory
      architectures of existing agent systems can broadly be categorized into two
      paradigms (Zhang et al., 2025b; Ye et al., 2025): the history accumulation paradigm,
      exemplified by ReAct (Yao et al., 2022), which linearly concatenates all interaction
      records, and the iterative summarization paradigm, exemplified by Mem1 (Zhou
      et al., 2025), which controls context length by compressing observations. However,
      as the number of interaction rounds grows, both paradigms cause agents to progressively
      lose track of historical retrieval paths, a phenomenon we term state blindness,
      which in turn induces redundant queries and repetitive retrieval in multi-hop
      tasks. To address this issue, we construct a multimodal memory graph that formalizes
      the reasoning process as a dynamic DAG, explicitly encoding the temporal and
      logical dependencies between actions and observations, thereby effectively mitigating
      state blindness and redundant retrieval.\nFigure 2: Overview of the GraMRAG
      framework.\ngenerate the next search context, producing the visual reasoning
      trajectory:\n<!-- formula-not-decoded -->\nwhere R t denotes the chain-of-thought
      reasoning generated prior to action A v t , and T v is the total number of visual
      retrieval steps.\nFollowing each visual retrieval action, an independent Hit/No
      Hit Judge evaluates the observation O v t obtained at the current step, conditioned
      on the original image I and query q , outputs a binary acceptance signal:\n<!--
      formula-not-decoded -->\nWhen s t = 1 (Hit), the retrieval is considered successful,
      meaning the retrieved content is semantically consistent with the query entity,
      and O v t is added into the accumulated valid evidence pool:\n<!-- formula-not-decoded
      -->\nWhen s t = 0 (No Hit), the retrieval is considered unsuccessful, triggering
      the Visual Explorer to recrop at a finer spatial granularity or to reformulate
      the search query before initiating a new retrieval attempt. The visual exploration
      phase terminates", "This is a schematic diagram illustrating an AI system architecture
      for multimodal question answering. It shows a workflow starting from \"User''s
      Question & Image\" input, which feeds into an \"Iterative Updated Memory Graph\"
      section displaying a node-based memory graph that undergoes node mapping with
      multimodal observations (example nodes include \"Lionel Messi,\" \"FC Barcelona,\"
      \"Tom Cruise,\" \"La Liga,\" \"Spanish El Cl\u00e1sico,\" and \"Santiago Bernab\u00e9u
      Stadium\" with associated images). This connects to an \"Interaction with External
      Environment\" section featuring a Policy Model (MLLM) that interfaces with external
      tools including Image Search, Web Search, and a Graph Memory Manage Function
      (depicted as a node network diagram). The diagram conveys how the system iteratively
      builds and updates a memory graph by incorporating multimodal data while interacting
      with external search resources to answer user queries.", "Abstract\nAlthough
      existing multi-agent RetrievalAugmented Generation (RAG) systems have demonstrated
      promise on complex multimodal reasoning tasks, they remain fundamentally limited
      in reasoning depth and memory structure, suffering from inadequate retrieval
      and state blindness when answering knowledge-intensive questions. To address
      these limitations, we propose GraMRAG, a graph memory-guided multi-agent RAG
      framework that integrates a dynamic multimodal memory graph to enable stable,
      multi-step multimodal reasoning. We introduce a visiontext bridged reasoning
      paradigm that unifies multi-scale entity cropping with a ReAct-style visual
      toolchain, enhancing the long-horizon cross-modal reasoning capability. We further
      construct a multimodal memory graph that formalizes agent reasoning as a dynamic
      directed acyclic graph (DAG), explicitly modeling action-observation dependencies
      to mitigate state blindness and suppress redundant retrieval. Moreover, we propose
      Topology-Aware Policy Optimization (TAPO) that leverages graph topology for
      critical path identification and targeted node pruning, enabling fine-grained
      credit assignment across multi-step reasoning trajectories. Extensive experiments
      on challenging multimodal benchmarks demonstrate that our approach consistently
      outperforms existing baselines and achieves state-of-the-art performance on
      complex long-horizon reasoning tasks.", "6 Conclusion\nIn this paper, we introduce
      GraMRAG, a novel graph memory-guided multi-agent RAG framework for complex multimodal
      long-horizon reasoning tasks. Our approach integrates three key innovations:
      a vision-text bridged reasoning paradigm that unifies multi-scale entity cropping
      with a ReActstyle visual toolchain for long-horizon cross-modal reasoning; multimodal
      memory graph construction that formalizes agent reasoning as a dynamic directed
      acyclic graph (DAG) to fundamentally mit- igate state blindness and suppress
      redundant retrieval; and Topology-Aware Policy Optimization (TAPO) algorithm
      that leverages graph topology for fine-grained credit assignment across multi-step
      reasoning trajectories. Extensive experiments on diverse multimodal benchmarks
      demonstrate that our method consistently outperforms existing baselines and
      achieves state-of-the-art performance. Future work will investigate the scalability
      of the proposed framework to larger architectures and broader multimodal scenarios.",
      "Retrieval quality depends on reasoning depth.\nHigh-quality answer generation
      in complex multimodal tasks depends on sustaining precise multiround retrieval
      across a long reasoning horizon. Traditional memory paradigms cause agents to
      progressively lose track of historical retrieval paths and accumulate redundant
      searches that severely constrain effective reasoning depth. GraMRAG addresses
      this by transferring the iterative planning capability into the multimodal domain
      via the vision-text bridged reasoning paradigm, supporting trajectories spanning
      tens of steps; the multimodal memory graph further encodes action-observation
      dependencies explicitly, directing each retrieval attempt precisely toward unexplored
      evidence space. As shown in Figure 5, this design yields substantially higher
      hit rate across all three task categories, directly validating the decisive
      role of long-horizon reasoning depth in determining retrieval quality.\nGraph
      memory mitigates state blindness. The dynamic DAG representation of the multimodal
      memory graph explicitly encodes actionobservation dependencies as directed edges,
      enabling each agent to efficiently access the complete historical reasoning
      trajectory and effectively mitigating state blindness. As shown in Table 2,
      replacing iterative summarization-based memory with the multimodal memory graph
      yields a 3.3point performance improvement, validating that the multimodal memory
      graph effectively mitigates state blindness and suppresses redundant retrieval,
      confirming the necessity of structured memory in long-horizon multimodal reasoning.\nFigure
      6: Analysis of training efficiency.\nGraph pruning accelerates training convergence.
      As demonstrated in Figure 6, TAPO achieves faster convergence throughout training
      compared to the baseline Group Sequence Policy Optimization (GSPO) (Zheng et
      al., 2025), indicating that topology-guided graph pruning drives the model toward
      faster convergence by supplying cleaner credit assignment signals. This yields
      two critical insights into agentic reinforcement learning: first, optimization
      stability fundamentally depends on ensuring correct positive gradient signals
      while eliminating ambiguous updates from negative trajectories; second, the
      quality of rollout samples, specifically their preference alignment, is more
      decisive for performance than simply scaling up the training set. By simultaneously
      masking dead-end nodes in positive trajectories and preserving valuable nodes
      in negative ones, TAPO achieves finegrained step-level credit assignment rather
      than coarse terminal-reward-level optimization.", "1 Introduction\nTo address
      the mentioned limitations, we propose GraMRAG, a novel graph memory-guided multi-agent
      RAG framework. First, to bridge the long-horizon reasoning gap, we introduce
      a visiontext bridged reasoning paradigm that orchestrates multi-scale entity
      cropping with a ReAct-style visual toolchain, seamlessly transferring the iterative
      planning capability of text-only deep research models into the multimodal domain
      to enable longhorizon cross-modal reasoning trajectories. Second, to overcome
      state blindness and context expansion in linear memory paradigms, we construct
      a multimodal memory graph that formalizes the reasoning process as a dynamic
      directed acyclic graph (DAG), explicitly encoding agent actions and multimodal
      observations with their temporal and logical dependencies to mitigate redundant
      retrieval and state blindness. Third, to tackle the credit assignment problem
      from coarse terminal rewards, we introduce a Topology-Aware Policy Optimization
      (TAPO) algorithm that leverages the graph topology to identify critical reasoning
      paths and perform targeted node pruning, precisely masking false positive and
      false negative nodes during policy updates to enable fine-grained credit assignment
      across multi-step reasoning.\nOur contributions are summarized as follows:\n-
      We introduce a vision-text bridged reasoning paradigm that unifies multi-scale
      entity cropping with a ReAct-style visual toolchain, enabling long-horizon cross-modal
      reasoning.\n- Weconstruct a multimodal memory graph that formalizes agent reasoning
      as a dynamic DAG to systematically mitigate state blindness and redundant retrieval.\n-
      We develop a TAPO algorithm leveraging graph topology for critical path identification
      and node pruning, enabling fine-grained credit assignment across multi-step
      reasoning.\n- We conduct extensive experiments on challenging multimodal benchmarks
      to evaluate our approach, demonstrating state-of-the-art performance over existing
      baselines.", "This is a schematic diagram illustrating a reinforcement learning
      framework for training multimodal/retrieval-based models, divided into two panels.
      Panel (a) shows the overall \"Reinforcement Learning Framework with Topology-Aware
      Policy Optimization,\" depicting a pipeline where user queries and images flow
      through a Rollout Module (Policy Model generating trajectories H1-H6 via interaction
      with an External Environment), then through Reference and Reward Models to compute
      rewards (r1-r6) and group-computed advantages (A1-A6), with a Graph Pruning
      module using a Memory Graph and KL divergence to produce gradient masks (m1-m6)
      that modulate the final gradient. Panel (b) illustrates \"Credit Assignment
      via Graph Pruning\" using two tree-structured graphs (Positive Sample and Negative
      Sample) rooted at a query node Q leading to an answer node A, showing how dead-end
      nodes (orange, meaningless for optimization) are pruned as false positives/negatives
      while valuable retrieval nodes (green) are preserved to avoid penalizing useful
      paths, with masked gradients indicated at specific steps.", "4.4 Ablation Study\nTo
      validate the contribution of each component in GraMRAG, we conduct ablation
      studies across all benchmarks. As shown in Table 2, the three components exhibit
      clear progressive complementarity: long-horizon reasoning enables sustained
      multiround retrieval across extended cross-modal rea- soning trajectories; the
      multimodal memory graph demonstrates that formalizing reasoning as a dynamic
      DAG effectively mitigates state blindness and suppresses redundant retrieval;
      and replacing the standard sparse-reward method Group Relative Policy Optimization
      (GRPO) (Shao et al., 2024) with TAPO delivers a further improvement, directly
      confirming the critical role of topology-guided credit assignment in fine-grained
      policy optimization. The complete model achieves an average score of 53.5%,
      an improvement of over 9 points above the baseline, comprehensively validating
      the necessity and complementarity of each component.\nFigure 5: Analysis of
      retrieval performance.", "4.3 Comparison with State-of-the-Art Methods\nWe compare
      GraMRAG against representative baselines: ReAct (Yao et al., 2022) iteratively
      invokes external retrieval tools in a think-then-act paradigm; Vanilla RAG uses
      the original question as a query and performs direct MLLM inference over retrieved
      results; UniversalRAG (Yeo et al., 2025) formulates cross-modal retrieval as
      a unified routing problem; VideoRAG (Jeong et al., 2025) extracts significant
      visual information via key-frame selection; MemAgent (Yu et al., 2025) manages
      context by sequentially feeding search results to the model; Mem1 (Zhou et al.,
      2025) dynamically compresses agent memory through a cyclical retrievalthen-memorization
      process; and VimRAG (Wang et al., 2026) models reasoning process to manage large-scale
      multimodal contexts.\nAs presented in Table 1, linear history accumula- tion
      paradigms such as ReAct rapidly exhaust the context window under the heavy token
      overhead of visual data; task-specific methods including VideoRAG and UniversalRAG
      exhibit limited generalizability due to fixed inference pipelines; and summarization-based
      memory paradigms such as MemAgent and Mem1, lacking explicit modeling of agent
      reasoning states, progressively lose track of historical retrieval paths as
      interaction rounds accumulate; and VimRAG models the reasoning process but lacks
      long-horizon reasoning capability. Our GraMRAG achieves consistently state-of-theart
      performance across all benchmarks, achieving overall average scores of 48.5%
      and 53.5% under the Qwen3-VL-4B-Instruct and Qwen3-VL8B-Instruct settings respectively,
      validating the effectiveness of formalizing the multi-step reasoning process
      as a dynamic DAG with topologydriven fine-grained credit assignment for multimodal
      knowledge-intensive reasoning tasks.\nTable 2: Ablation study across all benchmarks.\n\n\u2713
      \u2713 \u2713 \u2713 \u2713, Memory Iterative = \u2713 \u2713. \u2713 \u2713
      \u2713 \u2713 \u2713, Paradigm Graph = \u2713 \u2713 \u2713. \u2713 \u2713 \u2713
      \u2713 \u2713, Policy GRPO = \u2713. \u2713 \u2713 \u2713 \u2713 \u2713, Optimization
      TAPO = \u2713. \u2713 \u2713 \u2713 \u2713 \u2713, Acc = 43.8 44.2 47.5 49.3
      53.5", "1 Introduction\n''Never memorize something that you can look up.''\n-Albert
      Einstein\nRetrieval-Augmented Generation (RAG) extends the knowledge boundaries
      of Multimodal Large Language Models (MLLMs) by retrieving relevant information
      from external knowledge bases (Wang, 2026; Fan et al., 2026; Hu et al., 2026).
      Recent advances in MLLMs have convincingly demonstrated that multimodal agentic
      RAG systems are capable of efficient retrieval and reasoning over large-scale
      corpora comprising interleaved textual and visual content (Zhang et al., 2026;
      Guan et al., 2025). MLLM-based multi-agent architectures, leveraging specialized
      collaboration among components, exhibit superior performance over single-agent
      frameworks on complex multimodal RAG tasks (Zhou et al., 2026; Chang et al.,
      2025; Xu et al., 2025b).\n\u2020 Corresponding author.\nFigure 1: Comparison
      between our GraMRAG and existing multi-agent RAG systems.\nHowever, existing
      multi-agent RAG systems face three key limitations. First, the average number
      of retrieval rounds in current systems remains limited, predisposing agents
      to prematurely terminate exploration and settle for partially available evidence
      on complex tasks (Jiang et al., 2025; Wu et al., 2025a; Team et al., 2025).
      This fundamentally impedes the transfer of the long-horizon planning capability
      from text-based deep research to multimodal scenarios, rendering these systems
      inadequate for tens of iterative reasoning steps demanded by real-world deep
      research. Second, prevailing linear or iterative summarization-based memory
      structures (Yao et al., 2022; Zhou et al., 2025; Xu et al., 2025a; Wu et al.,
      2025b), lacking explicit modeling of agent reasoning states, are prone to context
      expands and state blindness as interaction rounds accumulate, resulting in repetitive
      queries and redundant retrieval in multi-hop tasks. Third, conventional outcome-based
      sparse rewards coarsely propagate terminal-state signals across entire trajectories
      (Huang et al., 2026; Zhou et al., 2025), causing effective retrieval steps to
      be erroneously penalized in negative samples while redundant operations are
      undeservedly rewarded in positive ones, preventing fine-grained credit assignment
      across multi-step reasoning.", "7 Limitations\nAlthough GraMRAG achieves significant
      performance improvements on complex multimodal multi-step reasoning tasks, the
      multi-agent collaboration framework introduces some inference overhead compared
      to traditional RAG approaches. Notably, such a trade-off is generally acceptable
      in deep research scenarios where users prioritize reasoning accuracy over response
      speed. Nevertheless, it may hinder direct deployment in resourceconstrained
      environments. Therefore, optimizing the interaction strategy among agents and
      designing more efficient lightweight graph memory mechanisms constitute key
      directions for future work.", "Graph-Structured Trajectory Decomposition.\nWe
      ground the reinforcement learning framework in the memory graph structure defined
      in Section 3.2. At each reasoning step t , the policy model \u03c0 \u03b8 receives
      the graph-serialized context:\n<!-- formula-not-decoded -->\nwhere s sys is
      the system instruction and H t = Serialize( G t -1 ) is the graph-linearized
      memory context. The policy model produces an reasoning segment that corresponds
      precisely to the construction of a single memory graph node n t :\n<!-- formula-not-decoded
      -->\nwhere \u03b6 t denotes the chain-of-thought reasoning preceding action
