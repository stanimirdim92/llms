      that matches each cropped region against a web-scale index and returns candidate
      URLs and a webpage retrieval module that fetches page content in structured
      markdown format. The observation obtained at step t is denoted:\n<!-- formula-not-decoded
      -->\nUpon completing the current step, the Visual Explorer applies the induction
      prompt p v again to when |E v | reaches a predefined sufficiency threshold or
      when the total step count reaches T v . Decoupling the Hit/No Hit judgment from
      the main agents and assigning it to an independent judge achieves a clean separation
      between exploration strategy and evidence evaluation, enhancing the robustness
      of the multi-scale iterative retrieval process.\nModality Bridging and Textual
      Reasoning. To transfer the evidence accumulated during the visual exploration
      phase into the textual reasoning domain, we introduce a modality bridging step.
      A captioning module first generates a comprehensive textual description D of
      the input image I , covering key entities, spatial relationships, and scene-level
      semantics. The visual trajectory \u03c4 vis is then transformed into a bridged
      context: I is replaced by D , all visual induction prompts p v are removed,
      while all chain-of-thought reasoning R t , actions A v t , and judge-verified
      observations (i.e., entries in E v ) are preserved. The bridged context is forwarded
      to the Text Researcher, a deep research LLM equipped with web search tools,
      which generates the subsequent textual reasoning trajectory:\n<!-- formula-not-decoded
      -->\nwhere T t denotes the number of textual reasoning steps executed by the
      Text Researcher.\nEvidence Aggregation and Complete Trajectory Construction.
      The Evidence Validator aggregates and verifies the complete collection of evidence
      produced across both reasoning phases. Taking as input all judge-verified visual
      observations in E v and the textual reasoning trajectory \u03c4 text produced
      by the Text Researcher, the Evidence Validator performs a cross-modal reasoning
      pass to resolve evidence conflicts, filter hallucinated content, and generate
      the final answer a out . By grounding its reasoning in the graph-structured
      memory rather than a flattened context window, the Evidence Validator avoids
      the state-blindness inherent in linear memory paradigms, ensuring that the complete
      body of evidence across both modalities is faithfully incorporated into the
      final answer. The complete multimodal deep research trajectory is obtained by
      merging \u03c4 vis and \u03c4 text :", "This is a schematic diagram illustrating
      the \"AdaMem\" adaptive memory compression method for retrieval-augmented language
      models, shown in three panels. Panel (a) depicts a shared compressor network
