    body: "{\"max_tokens\":16000,\"messages\":[{\"role\":\"user\",\"content\":\"You
      grade a question-answering system against an accepted answer.\\n\\nQuestion:
      What structure does GraMRAG's multimodal memory graph take?\\n\\nAccepted answer:
      A dynamic directed acyclic graph that encodes action-observation dependencies,
      expanded by sequential node insertions driven by the three main agents and the
      Hit/No Hit Judge.\\n\\nSystem answer: GraMRAG's multimodal memory graph takes
      the form of a **dynamic directed acyclic graph (DAG)**. Specifically, GraMRAG
      constructs a multimodal memory graph G_t = (V_t, E_t) that formalizes the multi-agent
      reasoning process as a dynamic DAG. This structure explicitly encodes action-observation
      dependencies across both the visual retrieval and textual research phases via
      a topological structure, fundamentally mitigating the state blindness inherent
      in linear memory paradigms and providing the structured foundation required
      by the TAPO algorithm.\\n\\n**Nodes:** Each node encodes a discrete reasoning
      unit as a typed quadruple, where the modality type tag is one of n_root, n_vis,
      n_brd, n_txt, n_ans; a search query or action descriptor driving the creation
      of this node; a concise textual summary of retrieved or generated content; and
      a visual feature bank, populated only for n_vis-type nodes and set to empty
      for all other types. There are five node types:\\n\\n- **Root node (n_root):**
      initialized with user query q and input image I, serving as the global anchor
      of the reasoning graph and permanently residing in V_t.\\n- **Visual nodes (n_vis):**
      spawned by the Visual Explorer at each retrieval step, storing the Hit/No Hit
      judgment and the corresponding evidence summary, with the visual feature bank
      preserving multimodal content from matched web pages.\\n- **Bridge node (n_brd):**
      a singleton node representing the modality bridging step, storing image description
      D as the semantic interface between the two reasoning phases.\\n- **Text nodes
      (n_txt):** spawned by the Text Researcher at each retrieval step, storing web-retrieved
      textual evidence summaries.\\n- **Answer node (n_ans):** spawned by the Evidence
      Validator, storing the final generated answer, whose insertion marks the termination
      of the reasoning process.\\n\\n**Edges:** The edge set connects temporally adjacent
      nodes, encoding the sequential dependency of the reasoning flow.\\n\\n**Graph
      construction protocol:** The graph expands through four sequential phases \u2014
      visual expansion, during which the Visual Explorer executes retrieval actions
      and a visual node is inserted with a sequential edge connecting it to its predecessor;
      modality bridging, where the bridge node is inserted and connected to the final
      visual node via the cross-modal bridge edge, completing the semantic context
      transition from the visual to the textual domain; \\n\\nPass only if the system
      answer states the same facts as the accepted answer. Wording may\\ndiffer; numbers,
      names and conclusions may not. If the accepted answer is a refusal, pass only\\nif
      the system also declines to answer rather than guessing. Extra correct detail
      is fine;\\nanything contradicting the accepted answer fails.\"}],\"model\":\"claude-opus-5\",\"output_config\":{\"format\":{\"type\":\"json_schema\",\"schema\":{\"type\":\"object\",\"title\":\"Verdict\",\"properties\":{\"reasoning\":{\"type\":\"string\",\"description\":\"One
      or two sentences: what matched or what was wrong.\",\"title\":\"Reasoning\"},\"passed\":{\"type\":\"boolean\",\"description\":\"True
      only if the answer meets the criterion in full.\",\"title\":\"Passed\"}},\"additionalProperties\":false,\"required\":[\"reasoning\",\"passed\"]}}}}"
