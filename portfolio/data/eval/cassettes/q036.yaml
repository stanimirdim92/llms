    body: "{\"max_tokens\":1024,\"messages\":[{\"role\":\"user\",\"content\":[{\"type\":\"document\",\"source\":{\"type\":\"text\",\"media_type\":\"text/plain\",\"data\":\"3.2
      Multimodal Memory Graph\\nWe construct a multimodal memory graph G t = ( V t
      , E t ) that formalizes the multi-agent reasoning process as a dynamic DAG.
      This graph explicitly encodes action-observation dependencies across both the
      visual retrieval and textual research phases via a topological structure, fundamentally
      mitigating the state blindness inherent in linear memory paradigms and providing
      the structured foundation required by the TAPO algorithm. As illustrated in
      Figure 2(b), the memory graph evolves incrementally throughout reasoning, faithfully
      recording the exploration trajectory of each agent through node insertions and
      edge connections at each step.\\nNode Schema and Modality Classification. Each
      node n i \u2208 V t encodes a discrete reasoning unit as a typed quadruple:\\n<!--
      formula-not-decoded -->\\nwhere \xB5 i \u2208 { n root , n vis , n brd , n txt
      , n ans } is the modality type tag; \u03BA i is the search query or action descriptor
      driving the creation of this node; \u03C3 i is a concise textual summary of
      retrieved or generated content; and \u03BD i is the visual feature bank, populated
      only for n vis-type nodes and set to empty for all other types. Five node types
      constitute the full reasoning pipeline. The root node ( n root ) is initialized
      with user query q and input image I , serving as the global anchor of the reasoning
      graph and permanently residing in V t . Visual nodes ( n vis) are spawned by
      the Visual Explorer at each retrieval step t \u2208 [1 , T v ] , storing the
      Hit/No Hit judgment and the corresponding evidence summary, with \u03BD i preserving
      multimodal content from matched web pages. The bridge node ( n brd) is a singleton
      node representing the modality bridging step, storing image description D as
      the semantic interface between the two reasoning phases. Text nodes ( n txt)
      are spawned by the Text Researcher at each retrieval step t \u2208 [ T v + 1
      , T v + T t ] , storing webretrieved textual evidence summaries. The answer
      node ( n ans) is spawned by the Evidence Validator, storing the final generated
      answer a out , whose insertion marks the termination of the reasoning process.
      The edge set E t connects temporally adjacent nodes , encoding the sequential
      dependency of the reasoning flow.\\nFigure 3: Inference pipeline of the GraMRAG
      framework.\"},\"title\":\"2609.14066v1.pdf [01a0aa96b5ef7053a767b8ddabb5a961-afd90130549e21e7d5d373e21bd00946]
      (text, page 4)\",\"citations\":{\"enabled\":true}},{\"type\":\"document\",\"source\":{\"type\":\"text\",\"media_type\":\"text/plain\",\"data\":\"3.2
      Multimodal Memory Graph\\nIterative Graph Expansion Protocol. The memory graph
      G t evolves through sequential node insertions jointly driven by the three main
      agents and the Hit/No Hit Judge. The expansion protocol consists of four phases
      as follows. During visual expansion ( t \u2208 [1 , T v ] ), the Visual Explorer
      executes retrieval action A v t = VSearch( B t ) and the Hit/No Hit Judge outputs
      binary signal s t ; a visual node n t = ( n vis , \u03BA t , \u03C3 t , \u03BD
      t ) is then inserted, where \u03C3 t encodes the evidence summary alongside
      the s t judgment, \u03BD t preserves visual content from matched web pages,
      and a sequential edge ( n t -1 , n t ) connects it to its predecessor. During
      modality bridging, upon termination of the visual phase, the bridge node n brd
      = ( n brd , \u2205 , D, \u2205 ) is inserted and connected to the final visual
      node via the cross-modal bridge edge ( n T v , n brd ) , completing the semantic
      context transition from the visual to the textual domain. During textual expansion
      ( t \u2208 [ T v + 1 , T v + T t ] ), the Text Researcher executes web retrieval
      actions; text nodes n t = ( n txt , \u03BA t , \u03C3 t , \u2205 ) are inserted
      with sequential edges, and the bridge node is connected to the first text node
      via edge ( n brd , n T v +1 ) , fully closing the cross-modal transition path.
      During answer generation, once the Evidence Validator determines that the accumulated
      evidence is sufficient, it inserts the answer node n ans = ( n ans , \u2205
      , a out , \u2205 ) and the reasoning process terminates. Upon completion of
      all four phases, the memory graph captures the complete multimodal reasoning
      trajectory as a structured DAG rather than compressing it into a one-dimensional
      sequence, thereby enabling each agent to efficiently query the full historical
      reasoning state and simultaneously providing the topological backbone required
      for fine-grained credit assignment in the reinforcement learning phase.\"},\"title\":\"2609.14066v1.pdf
      [01a0aa96b5ef7053a767b8ddabb5a961-afd90130549e21e7d5d373e21bd00946] (text, page
      5)\",\"citations\":{\"enabled\":true}},{\"type\":\"document\",\"source\":{\"type\":\"text\",\"media_type\":\"text/plain\",\"data\":\"Abstract\\nAlthough
      existing multi-agent RetrievalAugmented Generation (RAG) systems have demonstrated
      promise on complex multimodal reasoning tasks, they remain fundamentally limited
      in reasoning depth and memory structure, suffering from inadequate retrieval
      and state blindness when answering knowledge-intensive questions. To address
      these limitations, we propose GraMRAG, a graph memory-guided multi-agent RAG
      framework that integrates a dynamic multimodal memory graph to enable stable,
      multi-step multimodal reasoning. We introduce a visiontext bridged reasoning
      paradigm that unifies multi-scale entity cropping with a ReAct-style visual
      toolchain, enhancing the long-horizon cross-modal reasoning capability. We further
      construct a multimodal memory graph that formalizes agent reasoning as a dynamic
      directed acyclic graph (DAG), explicitly modeling action-observation dependencies
      to mitigate state blindness and suppress redundant retrieval. Moreover, we propose
      Topology-Aware Policy Optimization (TAPO) that leverages graph topology for
      critical path identification and targeted node pruning, enabling fine-grained
      credit assignment across multi-step reasoning trajectories. Extensive experiments
      on challenging multimodal benchmarks demonstrate that our approach consistently
      outperforms existing baselines and achieves state-of-the-art performance on
      complex long-horizon reasoning tasks.\"},\"title\":\"2609.14066v1.pdf [01a0aa96b5ef7053a767b8ddabb5a961-afd90130549e21e7d5d373e21bd00946]
      (text, page 1)\",\"citations\":{\"enabled\":true}},{\"type\":\"document\",\"source\":{\"type\":\"text\",\"media_type\":\"text/plain\",\"data\":\"1
      Introduction\\nTo address the mentioned limitations, we propose GraMRAG, a novel
      graph memory-guided multi-agent RAG framework. First, to bridge the long-horizon
      reasoning gap, we introduce a visiontext bridged reasoning paradigm that orchestrates
      multi-scale entity cropping with a ReAct-style visual toolchain, seamlessly
      transferring the iterative planning capability of text-only deep research models
      into the multimodal domain to enable longhorizon cross-modal reasoning trajectories.
      Second, to overcome state blindness and context expansion in linear memory paradigms,
      we construct a multimodal memory graph that formalizes the reasoning process
      as a dynamic directed acyclic graph (DAG), explicitly encoding agent actions
      and multimodal observations with their temporal and logical dependencies to
      mitigate redundant retrieval and state blindness. Third, to tackle the credit
      assignment problem from coarse terminal rewards, we introduce a Topology-Aware
      Policy Optimization (TAPO) algorithm that leverages the graph topology to identify
      critical reasoning paths and perform targeted node pruning, precisely masking
      false positive and false negative nodes during policy updates to enable fine-grained
      credit assignment across multi-step reasoning.\\nOur contributions are summarized
      as follows:\\n- We introduce a vision-text bridged reasoning paradigm that unifies
      multi-scale entity cropping with a ReAct-style visual toolchain, enabling long-horizon
      cross-modal reasoning.\\n- Weconstruct a multimodal memory graph that formalizes
      agent reasoning as a dynamic DAG to systematically mitigate state blindness
      and redundant retrieval.\\n- We develop a TAPO algorithm leveraging graph topology
      for critical path identification and node pruning, enabling fine-grained credit
      assignment across multi-step reasoning.\\n- We conduct extensive experiments
      on challenging multimodal benchmarks to evaluate our approach, demonstrating
      state-of-the-art performance over existing baselines.\"},\"title\":\"2609.14066v1.pdf
      [01a0aa96b5ef7053a767b8ddabb5a961-afd90130549e21e7d5d373e21bd00946] (text, page
      2)\",\"citations\":{\"enabled\":true}},{\"type\":\"document\",\"source\":{\"type\":\"text\",\"media_type\":\"text/plain\",\"data\":\"Retrieval
      quality depends on reasoning depth.\\nHigh-quality answer generation in complex
      multimodal tasks depends on sustaining precise multiround retrieval across a
      long reasoning horizon. Traditional memory paradigms cause agents to progressively
      lose track of historical retrieval paths and accumulate redundant searches that
      severely constrain effective reasoning depth. GraMRAG addresses this by transferring
      the iterative planning capability into the multimodal domain via the vision-text
      bridged reasoning paradigm, supporting trajectories spanning tens of steps;
      the multimodal memory graph further encodes action-observation dependencies
      explicitly, directing each retrieval attempt precisely toward unexplored evidence
      space. As shown in Figure 5, this design yields substantially higher hit rate
      across all three task categories, directly validating the decisive role of long-horizon
      reasoning depth in determining retrieval quality.\\nGraph memory mitigates state
      blindness. The dynamic DAG representation of the multimodal memory graph explicitly
      encodes actionobservation dependencies as directed edges, enabling each agent
      to efficiently access the complete historical reasoning trajectory and effectively
      mitigating state blindness. As shown in Table 2, replacing iterative summarization-based
      memory with the multimodal memory graph yields a 3.3point performance improvement,
      validating that the multimodal memory graph effectively mitigates state blindness
      and suppresses redundant retrieval, confirming the necessity of structured memory
      in long-horizon multimodal reasoning.\\nFigure 6: Analysis of training efficiency.\\nGraph
      pruning accelerates training convergence. As demonstrated in Figure 6, TAPO
      achieves faster convergence throughout training compared to the baseline Group
      Sequence Policy Optimization (GSPO) (Zheng et al., 2025), indicating that topology-guided
      graph pruning drives the model toward faster convergence by supplying cleaner
      credit assignment signals. This yields two critical insights into agentic reinforcement
      learning: first, optimization stability fundamentally depends on ensuring correct
      positive gradient signals while eliminating ambiguous updates from negative
      trajectories; second, the quality of rollout samples, specifically their preference
      alignment, is more decisive for performance than simply scaling up the training
      set. By simultaneously masking dead-end nodes in positive trajectories and preserving
      valuable nodes in negative ones, TAPO achieves finegrained step-level credit
      assignment rather than coarse terminal-reward-level optimization.\"},\"title\":\"2609.14066v1.pdf
      [01a0aa96b5ef7053a767b8ddabb5a961-afd90130549e21e7d5d373e21bd00946] (text, page
      8)\",\"citations\":{\"enabled\":true}},{\"type\":\"text\",\"text\":\"What structure
      does GraMRAG's multimodal memory graph take?\"}]}],\"model\":\"claude-sonnet-5\",\"system\":\"You
