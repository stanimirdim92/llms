        under poisoning,\\\" plotting Accuracy (%) against the number of poisoned
        documents out of 3 retrieved (0/3, 1/3, 2/3, 3/3). A dashed green \\\"Clean
        arm\\\" baseline stays flat around 78%, while all three perturbation conditions
        decline from roughly 65-72% at 0/3 poisoned documents down to about 41-48%
        at 3/3 poisoned documents.\\n\\nPanel (b) shows \\\"Drop vs. clean arm,\\\"
        plotting the accuracy drop in percentage points against the same poisoned
        document ratios, with all three lines starting near 0-10 pp at 0/3 and rising
        to approximately 31-37 pp drop at 3/3 poisoned documents, with Entity swap
        showing the steepest degradation.\",\"metadata\":{\"ingestion_version\":\"01a0fc53392f724b972307d03a9f94d9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead-fig-004-00\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead\",\"chunk_type\":\"figure\",\"section_path\":\"\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":55,\"page_no\":4,\"filename\":\"2609.09243v1.pdf\",\"image_path\":\"/var/www/html/personal/llms/portfolio/data/processed/01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead/figures/fig-004-00-f42f83d4b19d14d8.png\"}}},{\"id\":\"a716a2fa-3025-5ba0-944d-aa1ad9714cc9\",\"version\":5,\"score\":0.4922478,\"payload\":{\"page_content\":\"REFERENCES\\n-
        [1] P. Lewis et al. , 'Retrieval-augmented generation for knowledge-intensive
        NLP tasks,' in Advances in Neural Information Processing Systems , vol. 33,
        2020, pp. 9459-9474.\\n- [2] J. Thorne, A. Vlachos, C. Christodoulopoulos,
        and A. Mittal, 'FEVER: a large-scale dataset for fact extraction and verification,'
        in Proc. Conf. North American Chapter of the Association for Computational
        Linguistics (NAACL-HLT) , 2018, pp. 809-819.\\n- [3] F. Shi et al. , 'Large
        language models can be easily distracted by irrelevant context,' in Proc.
        Int. Conf. Machine Learning (ICML) , 2023, pp. 31210-31227.\\n- [4] K. Zhou
        et al. , 'Don't make your LLM an evaluation benchmark cheater,' arXiv preprint
        arXiv:2311.01964, 2023.\\nFooled rate across all conditions (%)\\nFig. 6.
        The ten queries with the highest fooled rate across all conditions. Biographical
        and landmark questions dominate because the passages that answer them carry
        many swappable entities.\\nserve as a cheap early warning of a poisoned store.\",\"metadata\":{\"ingestion_version\":\"01a0fc53392f724b972307d03a9f94d9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead-text-0017\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead\",\"chunk_type\":\"text\",\"section_path\":\"REFERENCES\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":75,\"page_no\":6,\"filename\":\"2609.09243v1.pdf\"}}},{\"id\":\"5e78e312-eed9-5668-836e-0f69b54f3b37\",\"version\":5,\"score\":0.4837631,\"payload\":{\"page_content\":\"I.
        INTRODUCTION\\nLarge language models answer questions fluently but carry two
        well-known liabilities: their knowledge is frozen at training time, and they
        sometimes state false facts with full confidence. Retrieval-augmented generation,
        proposed by Lewis et al. [1], addresses both by fetching relevant documents
        at query time and placing them in the prompt as evidence. The model is then
        asked to answer from that evidence rather than from memory alone. This design
        has become the default recipe for question answering over private or fast-moving
        knowledge bases.\\nThe same design introduces a dependency that is easy to
        overlook. A RAG answer is only as trustworthy as the documents it retrieves.
        If an attacker can edit, inject, or otherwise corrupt even part of the retrieved
        set, the grounding step that was meant to improve reliability becomes a channel
        for misinformation. Shi et al. [3] showed that irrelevant context alone can
        pull a model off track; corrupted but on-topic context is a stronger lever,
        because it looks exactly like the evidence the model was told to trust. What
        is still missing for We answer those three questions empirically. Our contribution
        is threefold. First, we build a reproducible poisoning testbed around a 4-bit
        Llama 3.1 8B model, a MiniLM retriever, and a FAISS index of nearly twenty
        thousand FEVER evidence sentences. Second, we run a full factorial experiment,
        three corruption strategies crossed with four poisoning levels over a fixed
        query set, and report accuracy, a fooled rate, abstention, and a lexical-overlap
        proxy of unsupported generation for every cell. Third, we characterise the
        failure surface: entity corruption flips the most answers, numeric corruption
        jumps once it reaches a majority of the context, and the model's default response
        to contradiction is to abstain rather than to invent. Every point estimate
        reported here comes from the same 588-run table. Where we interpret a jump
        or a strategy ranking, we also report query-level bootstrap intervals and
        paired tests recomputed from that table.\",\"metadata\":{\"ingestion_version\":\"01a0fc53392f724b972307d03a9f94d9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead-text-0001\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead\",\"chunk_type\":\"text\",\"section_path\":\"I.
        INTRODUCTION\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":6,\"page_no\":1,\"filename\":\"2609.09243v1.pdf\"}}}]},\"status\":\"ok\",\"time\":0.001369804}"
