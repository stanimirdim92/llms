    body: '{"query": "Which poisoning strategy flips the most answers, and what is
      its fooled rate?", "documents": ["D. Which Strategy Hurts Most\nTable III ranks
      the strategies. Entity swap has the highest fooled rate at 23.5% and the lowest
      poisoned accuracy, so it flips the largest share of answers that the model would
      otherwise get right. It also provokes the most abstention, 43.4%, which fits
      its mechanism: swapping ''Paris, France'' for ''Madrid, Spain'' can leave the
      passage internally inconsistent, and the model often reacts to that inconsistency
      by refusing to answer. Number swap and negation are close behind on fooled rate
      but keep higher poisoned accuracy.\nThe heatmap in Figure 2 gives the full strategy-by-level
      grid. Two patterns stand out. Fooled rates rise from left to right in every
      row, and the number-swap row is nearly flat across the first two columns before
      it jumps.", "C. Uncertainty on the Existing Runs\nWe do not invent new generations
      for this revision. We reanalyse the same table with a query-level bootstrap:
      resample the 49 indexed query slots with replacement (37 distinct texts), keep
      every run tied to a drawn slot, recompute the fooled rate, and repeat 10 , 000
      times with a fixed seed to obtain percentile 95% intervals. Exact McNemar tests
      on discordant clean/poisoned correctness pairs are reported as a secondary check;
      effect sizes and intervals remain primary.\nTable II shows that the climb with
      poisoning level remains after accounting for query resampling, while neighbouring
      levels overlap. The comparison that matters for the numeric pattern is isolated
      next.\nTABLE III BEHAVIOUR BY STRATEGY, AVERAGED OVER ALL FOUR POISONING LEVELS.
      EACH STRATEGY AGGREGATES 196 RUNS.\n\nEntity swap, Clean acc. (%) = 78.1. Entity
      swap, Poisoned acc. (%) = 54.6. Entity swap, Fooled rate (%) = 23.5. Entity
      swap, Abstain rate (%) = 43.4. Number swap, Clean acc. (%) = 77.6. Number swap,
      Poisoned acc. (%) = 57.7. Number swap, Fooled rate (%) = 20.4. Number swap,
