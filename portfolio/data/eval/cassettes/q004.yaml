        (10.2% to 36.7%), while Negation shows comparatively lower rates (8.2% to
        30.6%), with Number swap falling in between (10.2% to 34.7%).\",\"metadata\":{\"ingestion_version\":\"01a0fc53392f724b972307d03a9f94d9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead-fig-004-01\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead\",\"chunk_type\":\"figure\",\"section_path\":\"\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":57,\"page_no\":4,\"filename\":\"2609.09243v1.pdf\",\"image_path\":\"/var/www/html/personal/llms/portfolio/data/processed/01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead/figures/fig-004-01-cce9404722564ef5.png\"}}},{\"id\":\"82bd2225-a596-5765-ae46-e533ca23520c\",\"version\":5,\"score\":0.57427824,\"payload\":{\"page_content\":\"F.
        How the Model Fails\\nThe most useful result for a system designer is not
        how often the model is wrong but how it is wrong. Two failures are possible
        under attack. The model can accept the falsehood and state it, or it can notice
        the conflict and decline. It could also invent a third answer grounded in
        neither, which the hallucination proxy is meant to catch.\\nThe evidence points
        to abstention as the dominant recorded failure mode. Averaged over all runs
        the model abstains on 35.2% of poisoned queries, well above the 21.1% fooled
        rate. Figure 4(a) shows abstention climbing with poisoning for every strategy
        and reaching 69% for entity swap at full corruption. The lexical-overlap proxy
        moves the other way. Figure 4(b) shows that low-overlap answers are more common
        on the clean arm, near 29%, than on the poisoned arm, near 20%. Under this
        proxy, corrupted context does not look like a surge of unsupported invention;
        it looks like a surge of refusal. A fuller faithfulness taxonomy (entailment,
        contradiction, poison adoption, unsupported generation) would be needed before
        claiming that hallucination itself falls.\\nFig. 1. Accuracy as a function
        of how many of the three retrieved passages are poisoned. Panel (a) shows
        poisoned accuracy per strategy against the shared clean baseline; the clean
        arm stays near 78% while every poisoned curve declines. Panel (b) shows the
        drop relative to the clean arm, where entity swap opens the widest gap at
        high poisoning.\\nFig. 2. Fooled rate for every strategy and poisoning level.
        Colour runs from green (safe) to red (many answers flipped). The number-swap
        row barely changes between zero and one poisoned passage, then rises steeply.\\nFigure
        5 decomposes only those queries the model answered correctly on clean context,
        so every bar starts from a fact the model knew. As poisoning grows, the green
        'still correct' band shrinks and is replaced mostly by blue abstention, with
        the red 'fooled' band growing more slowly. Negation is the most resilient:
        even at full corruption a large share of originally correct answers survives,
        which matches our expectation that an explicit 'never' is easier to distrust
        than a silent swap.\\nFig. 3. Fooled rate by poisoning level. Entity swap
        and negation grow steadily, whereas number swap (bold) stays flat through
        one poisoned passage and then rises once poisoned passages become the majority.
        Intervals for the numberswap jump are reported in the text.\",\"metadata\":{\"ingestion_version\":\"01a0fc53392f724b972307d03a9f94d9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead-text-0013\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead\",\"chunk_type\":\"text\",\"section_path\":\"F.
        How the Model Fails\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":53,\"page_no\":3,\"filename\":\"2609.09243v1.pdf\"}}},{\"id\":\"376db314-03f8-550f-b3ca-a6811171d657\",\"version\":5,\"score\":0.56403387,\"payload\":{\"page_content\":\"B.
        Accuracy Degradation\\nOne detail in Table I needs to be read carefully. The
        0 / 3 row still shows a fooled rate near 10% and an accuracy about 9 points
        below the clean arm, even though no passage is rewritten and both answers
        see the same retrieved list. That residual is therefore not a retrieval mismatch.
        It comes from decoding noise under temperature 0.1 across two independent
        generations, plus a strict keyword matcher that can disagree on near-paraphrases.
        Recomputing from the 588-run table, clean and poisoned answers are identical
        in only 76.9% of the 0 / 3 runs. The residual is large relative to some attack
        increments (the rise from 9.5% to 15.0% fooled between 0 / 3 and 1 / 3 is
        5.5 points), so strategy contrasts at light poisoning should be read as suggestive
        until decoding is controlled (fixed seeds, repeated draws) and labels are
        less brittle. We therefore read the clean-arm column, not the 0 / 3 poisoned
        cell, as the true no-attack baseline.\",\"metadata\":{\"ingestion_version\":\"01a0fc53392f724b972307d03a9f94d9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead-text-0009\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead\",\"chunk_type\":\"text\",\"section_path\":\"B.
        Accuracy Degradation\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":41,\"page_no\":3,\"filename\":\"2609.09243v1.pdf\"}}},{\"id\":\"b281715f-6ff8-59d3-b753-488bf429f709\",\"version\":5,\"score\":0.54164934,\"payload\":{\"page_content\":\"This
        is a set of three stacked bar charts comparing model robustness under three
        perturbation types: Entity swap, Number swap, and Negation. Each chart's x-axis
        shows the number of poisoned documents (0/3, 1/3, 2/3, 3/3) out of retrieved
        documents, while the y-axis shows the percentage of clean-correct cases, broken
        into three categories: \\\"Still correct\\\" (green), \\\"Abstained\\\" (blue),
        and \\\"Fooled\\\" (red). The data indicates that as poisoned documents increase,
        the proportion of \\\"Still correct\\\" responses generally declines while
        \\\"Abstained\\\" and/or \\\"Fooled\\\" responses increase, with Number swap
        showing the most pronounced increase in \\\"Fooled\\\" cases (reaching ~15-20%
        at 2/3 and 3/3 poisoned documents) compared to Entity swap and Negation, which
        show minimal fooling but more abstention.\",\"metadata\":{\"ingestion_version\":\"01a0fc53392f724b972307d03a9f94d9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead-fig-005-04\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead\",\"chunk_type\":\"figure\",\"section_path\":\"\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":68,\"page_no\":5,\"filename\":\"2609.09243v1.pdf\",\"image_path\":\"/var/www/html/personal/llms/portfolio/data/processed/01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead/figures/fig-005-04-04d372ba3b61fee1.png\"}}},{\"id\":\"a18e8f71-14a2-5568-a215-b9c94feddb47\",\"version\":5,\"score\":0.52425086,\"payload\":{\"page_content\":\"E.
        A Majority Pattern in Numeric Corruption\\nFigure 3 isolates that pattern.
        For entity swap and negation the fooled rate grows in roughly even steps as
        poisoning increases. Number swap behaves differently. It stays at 10.2% for
        both zero and one corrupted passage (bootstrap 95% CI [2 . 0 , 18 . 4] in
        both cells), then rises to 26.5% at two ( [14 . 3 , 38 . 8] ) and 34.7% at
        three ( [22 . 5 , 49 . 0] ). The jump from one to two poisoned passages is
        16.3 points with CI [2 . 0 , 30 . 6] , which excludes zero but is wide. Exact
        McNemar tests on clean-versus-poisoned correctness are significant at two
        and three poisoned passages ( p < 10 -3 ) and not at one ( p = 0 . 22 ). We
        read this as a majority-leaning pattern consistent with outvoting a single
        wrong figure, not as a sharp phase transition proven under locked pairs. Because
        a model cannot sanity-check a bare number the way it can catch 'Madrid, Spain,'
        numeric corruption remains a quiet risk once it reaches critical mass.\",\"metadata\":{\"ingestion_version\":\"01a0fc53392f724b972307d03a9f94d9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead-text-0012\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead\",\"chunk_type\":\"text\",\"section_path\":\"E.
        A Majority Pattern in Numeric Corruption\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":51,\"page_no\":3,\"filename\":\"2609.09243v1.pdf\"}}},{\"id\":\"328797f4-1778-57fe-bd4a-a334aaaa1cbb\",\"version\":5,\"score\":0.5238974,\"payload\":{\"page_content\":\"H.
        Relation to Prior Work\\nOur findings extend the RAG picture drawn by Lewis
        et al. [1] from the cooperative case to an adversarial one: retrieval that
        lifts accuracy on clean corpora becomes a liability on corrupted ones. Where
        Shi et al. [3] showed that off-topic context distracts a model, we show that
        on-topic but false context does more, because it wears the appearance of the
        evidence the model was told to trust. The abstention-overfabrication pattern
        we measure is an empirical answer, for a small quantized model, to how such
        a system fails when the context is corrupted rather than merely irrelevant.
        The retrieval-integrated pre-training of Guu et al. [5] shares the grounding
        assumption our attack targets. Zhou et al. [4] warn that evaluation can leak
        into training and inflate scores; we keep the FEVER-derived query set fixed
        and report every cell from the same 588-run table so strategy comparisons
        are not an artifact of shifting test items.\\nFig. 4. Failure behaviour across
        poisoning levels. Panel (a): abstention rises with poisoning for every strategy,
        most steeply for entity swap. Panel (b): the lexical-overlap proxy of unsupported
        generation is higher on the clean arm than the poisoned arm for all three
        strategies.\\nFig. 5. Outcome of queries that were correct on clean context,
        split by strategy and poisoning level. Green is still correct, blue is abstained,
        red is fooled. The lost green area is absorbed mainly by abstention, and negation
        retains the most correct answers.\",\"metadata\":{\"ingestion_version\":\"01a0fc53392f724b972307d03a9f94d9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead-text-0015\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead\",\"chunk_type\":\"text\",\"section_path\":\"H.
        Relation to Prior Work\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":65,\"page_no\":4,\"filename\":\"2609.09243v1.pdf\"}}},{\"id\":\"85179e08-8e6f-59a9-ae44-68205f2042e1\",\"version\":5,\"score\":0.5105894,\"payload\":{\"page_content\":\"V.
        CONCLUSION\\nWe measured how a 4-bit Llama 3.1 8B model behaves when its retrieved
        context is poisoned, across three corruption strategies and four poisoning
        levels in a 588-run sweep. Accuracy falls from 77.9% to 43.5% as corruption
        goes from none to total. Entity swap flips the most answers. Numeric corruption
        shows a majority-leaning jump once two of three passages are poisoned, with
        a bootstrap interval on that jump that excludes zero but remains wide. The
        model's main recorded response to attack is to abstain rather than to state
        a wrong answer, and the lexical-overlap proxy of unsupported generation falls
        under poisoning rather than rising.\\nThe study has clear limits. It covers
        one small quantized model on a compact query set with rule-based corruption,
        so the absolute numbers should not be read as universal. Retrieval is shared
        across the pair, but decoding is not locked (temperature 0.1, two independent
        generations), and the 0 / 3 residual shows that background pair noise is non-trivial.
        Keyword matching is a weak correctness criterion, and the overlap proxy is
        not a semantic faithfulness judge. The added passages make retrieval easier
        than raw FEVER evidence would. Each limit points to a concrete next step:
        lock decoding seeds across the pair and add multi-seed and multi-corruption
        repeats with hierarchical resampling, replace keyword checks with structured
        FEVER-style labels and normalized entity or quantity scoring, adjudicate a
        stratified sample with blinded humans or a validated entailment model, and
        decompose answers into atomic claims so poison adoption can be separated from
        unsupported generation. We also plan to repeat the sweep on a larger instruction-tuned
        model and on a second corpus, to replace rule-based edits with model-generated
        adversarial\\n- [5] K. Guu, K. Lee, Z. Tung, P. Pasupat, and M. Chang, 'REALM:
        retrievalaugmented language model pre-training,' in Proc. Int. Conf. Machine
        Learning (ICML) , 2020, pp. 3929-3938.\\n- [6] N. Reimers and I. Gurevych,
        'Sentence-BERT: sentence embeddings using Siamese BERT-networks,' in Proc.
        Conf. Empirical Methods in Natural Language Processing (EMNLP) , 2019, pp.
        3982-3992.\\n- [7] J. Johnson, M. Douze, and H. J\xB4 egou, 'Billion-scale
        similarity search with GPUs,' IEEE Trans. Big Data , vol. 7, no. 3, pp. 535-547,
        2019.\",\"metadata\":{\"ingestion_version\":\"01a0fc53392f724b972307d03a9f94d9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead-text-0018\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead\",\"chunk_type\":\"text\",\"section_path\":\"V.
        CONCLUSION\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":83,\"page_no\":6,\"filename\":\"2609.09243v1.pdf\"}}},{\"id\":\"745af299-c95e-5500-8366-5362d8e17e13\",\"version\":5,\"score\":0.50690746,\"payload\":{\"page_content\":\"This
        image consists of two line/bar charts comparing the effects of poisoned documents
        on model behavior, plotted against \\\"Poisoned documents (out of 3 retrieved)\\\"
        (0/3, 1/3, 2/3, 3/3) on the x-axis.\\n\\nPanel (a) is a line chart showing
        \\\"Abstention rate (%)\\\" for four conditions: Entity swap (red), Number
        swap (orange), Negation (purple), and Clean arm (green dashed baseline ~13%).
        As poisoned documents increase, abstention rises sharply for Entity swap (up
        to ~70%), while Number swap and Negation show moderate increases (up to ~42%),
        and the Clean arm remains flat.\\n\\nPanel (b) is a grouped bar chart showing
        \\\"Hallucination rate (%)\\\" for Clean arm (blue) versus Poisoned arm (red)
        across the same x-axis categories, revealing that hallucination rates decrease
        as poisoned documents increase for both arms, with the Poisoned arm dropping
        from 26.5% to 12.2% and the Clean arm from 31.3% to 29.9%.\",\"metadata\":{\"ingestion_version\":\"01a0fc53392f724b972307d03a9f94d9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead-fig-005-03\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead\",\"chunk_type\":\"figure\",\"section_path\":\"\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":66,\"page_no\":5,\"filename\":\"2609.09243v1.pdf\",\"image_path\":\"/var/www/html/personal/llms/portfolio/data/processed/01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead/figures/fig-005-03-f1d4adf3f7b93682.png\"}}},{\"id\":\"a44c45f3-30fe-539c-8e4c-b53e70d91aee\",\"version\":5,\"score\":0.5005965,\"payload\":{\"page_content\":\"D.
        Evaluation Metrics\\nFor every run the model retrieves once, then answers
        twice: once from the clean passages and once from a poisoned copy of that
        same list. Passage identity and order are therefore shared across the pair;
        what is not locked is decoding (temperature 0.1, two independent generate
        calls). Four quantities are recorded.\\nAccuracy checks whether the reference
        keyword for a question appears in the answer, case-insensitively. Keyword
        presence is a coarse label: a negated or qualified answer can still contain
        the keyword, and an otherwise correct paraphrase can miss it. We keep it because
        it is reproducible and applied uniformly, not because it is a gold standard.
        Fooled rate is the fraction of runs where the clean answer was correct but
        the poisoned answer was not; it isolates correct-to-incorrect flips from questions
        the model could not answer anyway. It is not a direct measure of poison adoption,
        because an incorrect poisoned answer may abstain, contradict the poison, or
        state a third wrong fact. Abstention rate counts answers that decline to commit,
        detected through a small set of phrases such as 'not enough information' and
        'cannot determine.' Unsupported generation (reported in earlier drafts as
        a hallucination proxy) is approximated by lexical overlap: an answer is flagged
        when fewer than 30% of its content words appear in any retrieved passage,\\n<!--
        formula-not-decoded -->\\nwith W a the content words of the answer and W d
        those of the retrieved passages. Lexical overlap confuses faithful paraphrase
        with unsupported invention, and it can miss answers that copy poisoned text.
        We treat the proxy as a trend indicator only.\",\"metadata\":{\"ingestion_version\":\"01a0fc53392f724b972307d03a9f94d9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead-text-0005\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead\",\"chunk_type\":\"text\",\"section_path\":\"D.
        Evaluation Metrics\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":25,\"page_no\":2,\"filename\":\"2609.09243v1.pdf\"}}},{\"id\":\"3bd19445-3295-5129-bcfc-4a1b72982267\",\"version\":5,\"score\":0.49915373,\"payload\":{\"page_content\":\"G.
        Which Queries Break\\nFooled rates are uneven across questions. Figure 6 lists
        the ten most fragile ones. Questions about a well-known person's biography
        and about the landmark facts in our added passages top the list, because those
        passages contain the richest set of swappable entities. Yes/no and location
        questions are more exposed than open numeric ones, whose lower clean accuracy
        leaves less room for a correct-to-wrong flip. The pattern is a reminder that
        vulnerability depends on the fact being asked about, not only on the attack.\",\"metadata\":{\"ingestion_version\":\"01a0fc53392f724b972307d03a9f94d9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead-text-0014\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead\",\"chunk_type\":\"text\",\"section_path\":\"G.
        Which Queries Break\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":63,\"page_no\":4,\"filename\":\"2609.09243v1.pdf\"}}},{\"id\":\"88c1d775-10f5-5d8f-a4f1-648fafc67511\",\"version\":5,\"score\":0.49715817,\"payload\":{\"page_content\":\"This
        is a pair of line charts (two-panel plot) illustrating the effect of poisoned
