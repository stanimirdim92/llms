      |   Poisoned acc. (%) |   Fooled rate (%) |   Abstain rate (%) |\n|-------------|------------------|---------------------|-------------------|--------------------|\n|
      Entity swap |             78.1 |                54.6 |              23.5 |               43.4
      |\n| Number swap |             77.6 |                57.7 |              20.4
      |               30.1 |\n| Negation    |             78.1 |                60.2
      |              19.4 |               32.1 |", "TABLE II FOOLED RATE WITH QUERY-LEVEL
