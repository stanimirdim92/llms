      string: "{\"result\":{\"points\":[{\"id\":\"ec7e2699-ce7f-544b-bc9e-20c141e2ce4f\",\"version\":11,\"score\":0.61849976,\"payload\":{\"page_content\":\"This
        is a bar chart comparing the \\\"Hit Rate (%)\\\" performance of four methods\u2014GraMRAG,
        VimRAG, Mem1, and ReAct\u2014across three data categories: General Text, Image
        & Visual Document, and Videos. The y-axis represents Hit Rate percentage,
        ranging from 0 to 100.\\n\\nGraMRAG consistently achieves the highest hit
        rate across all three categories (approximately 92% for General Text, 75%
        for Image & Visual Document, and 53% for Videos), followed closely by VimRAG.
        ReAct performs notably well on Image & Visual Document (around 65%) but has
        the lowest hit rate for Videos (roughly 22%), while Mem1 generally trails
        behind the top two methods across all categories.\",\"metadata\":{\"ingestion_version\":\"01a0fc547d2f738da4fc73667c19a759\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-afd90130549e21e7d5d373e21bd00946-fig-008-04\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-afd90130549e21e7d5d373e21bd00946\",\"chunk_type\":\"figure\",\"section_path\":\"\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":83,\"page_no\":8,\"filename\":\"2609.14066v1.pdf\",\"image_path\":\"/var/www/html/personal/llms/portfolio/data/processed/01a0aa96b5ef7053a767b8ddabb5a961-afd90130549e21e7d5d373e21bd00946/figures/fig-008-04-aa21d4f9072b0a9e.png\"}}},{\"id\":\"ef4dc573-029f-5a59-8750-0caf19fad5df\",\"version\":7,\"score\":0.52543294,\"payload\":{\"page_content\":\"This
        is a line/scatter plot comparing retrieval or memory methods on a latency-accuracy
        tradeoff. The x-axis shows \\\"Latency per query (ms, log scale)\\\" ranging
        from about 140 to 670+, and the y-axis shows \\\"Match (%)\\\" ranging from
        roughly 76 to 84. Three methods are plotted: AdaMem (green circles) and OSCAR
        (orange squares), each annotated with compression/sampling factors (128\xD7,
        64\xD7, 32\xD7, 16\xD7), showing that AdaMem achieves higher match scores
        at lower latencies than OSCAR; a \\\"Full Context\\\" baseline (purple star)
        achieves the highest match (~84%) but at much greater latency (~670 ms), labeled
        as \\\"4\xD7 lower latency\\\" compared to the other methods, indicating AdaMem
        approaches Full Context accuracy while being significantly faster.\",\"metadata\":{\"ingestion_version\":\"01a0fc53885372038a1c6d0df171e569\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d-fig-006-04\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d\",\"chunk_type\":\"figure\",\"section_path\":\"\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":65,\"page_no\":6,\"filename\":\"2609.22100v1.pdf\",\"image_path\":\"/var/www/html/personal/llms/portfolio/data/processed/01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d/figures/fig-006-04-c6ef734f27591521.png\"}}},{\"id\":\"ecf27233-1b52-5184-aded-186ac4f2f41c\",\"version\":7,\"score\":0.4874058,\"payload\":{\"page_content\":\"This
        is a grouped bar chart comparing the performance of two methods, AdaMem (blue)
        and OSCAR (yellow hatched), across three question-answering datasets: TriviaQA,
        NQ, and HotpotQA. The y-axis shows \\\"Llama-3 judge (%)\\\" scores ranging
        from 0 to about 90, while the x-axis shows compression rates of 16\xD7, 32\xD7,
        and 64\xD7 for each dataset. Across all datasets and compression rates, AdaMem
        consistently outperforms OSCAR, with the performance gap widening as compression
        rate increases (e.g., in HotpotQA, AdaMem scores 62.4% vs OSCAR's 55.3% at
        64\xD7 compression), indicating AdaMem maintains accuracy better under higher
        compression.\",\"metadata\":{\"ingestion_version\":\"01a0fc53885372038a1c6d0df171e569\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d-fig-012-06\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d\",\"chunk_type\":\"figure\",\"section_path\":\"\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":163,\"page_no\":12,\"filename\":\"2609.22100v1.pdf\",\"image_path\":\"/var/www/html/personal/llms/portfolio/data/processed/01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d/figures/fig-012-06-64c9a5fdc088a6b8.png\"}}},{\"id\":\"8a7bd97f-f051-5248-898b-faa5033a40d7\",\"version\":15,\"score\":0.48279113,\"payload\":{\"page_content\":\"D
