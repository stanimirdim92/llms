      05 .\n\nNQ, Search-R1 = - 1.9 (0.984). NQ, ReSearch = - 1.8 (0.984). NQ, R-Search
      = - 0.4 (0.984). QAMPARI, Search-R1 = +1.3 (0.379). QAMPARI, ReSearch = +3.4
      (0.114). QAMPARI, R-Search = +3.8 (0.114). HAGRID, Search-R1 = +1.0 (0.561).
