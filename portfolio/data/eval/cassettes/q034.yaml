    body: '{"query": "Which methods does the hit-rate chart compare, and across which
      categories?", "documents": ["This is a bar chart comparing the \"Hit Rate (%)\"
      performance of four methods\u2014GraMRAG, VimRAG, Mem1, and ReAct\u2014across
      three data categories: General Text, Image & Visual Document, and Videos. The
      y-axis represents Hit Rate percentage, ranging from 0 to 100.\n\nGraMRAG consistently
      achieves the highest hit rate across all three categories (approximately 92%
      for General Text, 75% for Image & Visual Document, and 53% for Videos), followed
      closely by VimRAG. ReAct performs notably well on Image & Visual Document (around
      65%) but has the lowest hit rate for Videos (roughly 22%), while Mem1 generally
      trails behind the top two methods across all categories.", "This is a line/scatter
      plot comparing retrieval or memory methods on a latency-accuracy tradeoff. The
      x-axis shows \"Latency per query (ms, log scale)\" ranging from about 140 to
      670+, and the y-axis shows \"Match (%)\" ranging from roughly 76 to 84. Three
      methods are plotted: AdaMem (green circles) and OSCAR (orange squares), each
      annotated with compression/sampling factors (128\u00d7, 64\u00d7, 32\u00d7,
      16\u00d7), showing that AdaMem achieves higher match scores at lower latencies
      than OSCAR; a \"Full Context\" baseline (purple star) achieves the highest match
      (~84%) but at much greater latency (~670 ms), labeled as \"4\u00d7 lower latency\"
      compared to the other methods, indicating AdaMem approaches Full Context accuracy
      while being significantly faster.", "This is a grouped bar chart comparing the
      performance of two methods, AdaMem (blue) and OSCAR (yellow hatched), across
      three question-answering datasets: TriviaQA, NQ, and HotpotQA. The y-axis shows
      \"Llama-3 judge (%)\" scores ranging from 0 to about 90, while the x-axis shows
      compression rates of 16\u00d7, 32\u00d7, and 64\u00d7 for each dataset. Across
      all datasets and compression rates, AdaMem consistently outperforms OSCAR, with
      the performance gap widening as compression rate increases (e.g., in HotpotQA,
      AdaMem scores 62.4% vs OSCAR''s 55.3% at 64\u00d7 compression), indicating AdaMem
      maintains accuracy better under higher compression.", "D Robustness Checks\nTable
