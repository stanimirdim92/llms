        is a line chart grid comparing two retrieval-augmented QA methods, OSCAR (red)
        and AdaMem (green), across three datasets (TriviaQA, NQ, HotpotQA) and three
        compression ratios (16x, 32x, 64x), forming a 3x3 panel layout. The x-axis
        in each subplot represents the number of retrieved documents (k = 5, 10, 15,
        20, 25), while the y-axis shows task performance scores (ranging roughly from
        36 to 84 depending on the dataset/compression level). Across nearly all panels,
        AdaMem consistently outperforms OSCAR, with the performance gap generally
        widening as compression increases (64x) and as more documents are retrieved,
        demonstrating AdaMem's superior robustness under higher compression and larger
        retrieval sets.\",\"metadata\":{\"ingestion_version\":\"01a0fc53885372038a1c6d0df171e569\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d-fig-005-02\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d\",\"chunk_type\":\"figure\",\"section_path\":\"\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":50,\"page_no\":5,\"filename\":\"2609.22100v1.pdf\",\"image_path\":\"/var/www/html/personal/llms/portfolio/data/processed/01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d/figures/fig-005-02-a8d9c5fa3b5abf00.png\"}}},{\"id\":\"3da0d4cd-6031-5c9d-923d-1d547b600ae9\",\"version\":13,\"score\":0.45805484,\"payload\":{\"page_content\":\"This
        is a set of three line/scatter plots comparing context compression methods
        for retrieval-augmented generation, evaluated across three metrics: Grounded
        citation precision, Grounded citation recall, and Answer correctness (str-EM),
        each plotted against \\\"Achieved context fraction\\\" (x-axis, reversed scale
        from 1.0 to 0.0) on the y-axis from 0.0 to 1.0 (or 0.35 for the third plot).\\n\\nThe
        methods compared include Identity (full context, green dot baseline), Rerank
        top-k (brown), Extractive (orange), ECR (blue), RECOMP (purple diamond), and
        LLMLingua-2 (red). Across all three metrics, Rerank top-k and ECR tend to
        achieve the best performance at moderate context fractions (0.4-0.7), while
        LLMLingua-2 consistently underperforms with the lowest precision and recall
        scores, and RECOMP achieves relatively higher answer correctness at very low
        context fractions.\",\"metadata\":{\"ingestion_version\":\"01a0fc54ff9a70d3af0e9b49e864b8b9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde-fig-006-00\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde\",\"chunk_type\":\"figure\",\"section_path\":\"\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":47,\"page_no\":6,\"filename\":\"2609.14245v1.pdf\",\"image_path\":\"/var/www/html/personal/llms/portfolio/data/processed/01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde/figures/fig-006-00-6cc5769b7bfc598b.png\"}}},{\"id\":\"88b6c469-ceb4-5829-8847-b818918c18b3\",\"version\":15,\"score\":0.45476764,\"payload\":{\"page_content\":\"Table
