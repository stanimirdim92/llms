        is a line chart comparing TriviaQA match performance against compression rate
        (16x, 32x, 64x, 128x on x-axis) for three memory allocation methods. The \\\"AdaMem
        (ours)\\\" method (blue line) maintains the highest accuracy across all compression
        rates, starting near 84 and ending around 82 (only -2.08% drop from full context),
        outperforming \\\"Uniform(Oscar)\\\" (orange line, dropping to -7.34%) and
        \\\"Uniform(Pisco)\\\" (purple line, dropping to -7.52%). A dashed green line
        at the top indicates \\\"Full Context\\\" performance (~84.5) as the reference
        baseline, and a schematic above the chart illustrates how AdaMem allocates
        variable-length document representations (d1-d4) compared to Uniform's equal-length
        allocation.\",\"metadata\":{\"ingestion_version\":\"01a0fc53885372038a1c6d0df171e569\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d-fig-001-00\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d\",\"chunk_type\":\"figure\",\"section_path\":\"\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":7,\"page_no\":1,\"filename\":\"2609.22100v1.pdf\",\"image_path\":\"/var/www/html/personal/llms/portfolio/data/processed/01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d/figures/fig-001-00-695c084d532812de.png\"}}},{\"id\":\"9e0c006f-57cc-5504-a551-4841921ff611\",\"version\":15,\"score\":0.45880485,\"payload\":{\"page_content\":\"Table
