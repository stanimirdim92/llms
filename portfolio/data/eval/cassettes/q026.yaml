- request:
    body: '{"max_tokens":16000,"messages":[{"role":"user","content":"You grade a question-answering
      system against an accepted answer.\n\nQuestion: How many examples are in the
      balanced subset, and how does that expand into evaluation runs?\n\nAccepted
      answer: 346 examples, each expanded into four condition-specific entries (non_rag,
      rag_oracle_unsafe, rag_topic_safe, rag_control_safe_random).\n\nSystem answer:
      The balanced subset contains **346 examples**, as confirmed in multiple places.
      Per Table 2, the total balanced count across all subcategories sums to 346,
      matching the statement that some subcategories contain fewer than 20 viable
      examples, so the final balanced subset contains 346 unique examples in total
      (Table 2).\n\n**Expansion into evaluation runs:**\n\nEach example in the balanced
      subset is expanded into four evaluation conditions: non_rag, rag_oracle_unsafe,
      rag_topic_safe, and rag_control_safe_random. Since the balanced subset contains
      346 examples, this expansion produces 1,384 example-condition rows per model
      and 6,920 total responses across the five evaluated models.\n\nThe four conditions
      differ in how many context documents they supply:\n- The non_rag condition supplies
      no documents for all 346 examples.\n- The rag_oracle_unsafe condition supplies
      one document for all 346 examples.\n- The rag_topic_safe condition supplies
      three documents for 344 examples and two documents for two examples.\n- The
      rag_control_safe_random condition supplies three documents for 321 examples,
      two documents for 24 examples, and one document for one example.\n\nSo the single
      set of 346 benchmark examples, multiplied by 4 conditions, yields 1,384 example-condition
      rows per model, and across 5 models this totals 6,920 model responses.\n\nPass
      only if the system answer states the same facts as the accepted answer. Wording
      may\ndiffer; numbers, names and conclusions may not. If the accepted answer
      is a refusal, pass only\nif the system also declines to answer rather than guessing.
      Extra correct detail is fine;\nanything contradicting the accepted answer fails."}],"model":"claude-opus-5","output_config":{"format":{"type":"json_schema","schema":{"type":"object","title":"Verdict","properties":{"reasoning":{"type":"string","description":"One
      or two sentences: what matched or what was wrong.","title":"Reasoning"},"passed":{"type":"boolean","description":"True
      only if the answer meets the criterion in full.","title":"Passed"}},"additionalProperties":false,"required":["reasoning","passed"]}}}}'
