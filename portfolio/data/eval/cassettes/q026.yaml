- request:
    body: "{\"max_tokens\":16000,\"messages\":[{\"role\":\"user\",\"content\":\"You
      check whether an answer is supported by its sources.\\n\\nQuestion: How many
      examples are in the balanced subset, and how does that expand into evaluation
      runs?\\n\\nSources the answer was written from:\\n[1] A.2 Safety evaluation
      details\\nEach example in the balanced subset is expanded into four evaluation
      conditions: non_rag , rag_oracle_unsafe , rag_topic_safe , and rag_control_safe_random
      . Since the balanced subset contains 346 examples, this expansion produces 1,384
      example-condition rows per model and 6,920 total responses across the five evaluated
      models.\\nThe benchmark controls retrieval quality by directly supplying context
      documents, rather than relying on a live retriever to discover them at inference
      time. This is important because a poor retriever could otherwise fail to retrieve
      the relevant harmful document and artificially inflate apparent safety.\\nThe
      non_rag condition supplies no documents for all 346 examples. The rag_oracle_unsafe
      condition supplies one document for all 346 examples. The rag_topic_safe condition
      supplies three documents for 344 examples and two documents for two examples.
      The rag_control_safe_random condition supplies three documents for 321 examples,
      two documents for 24 examples, and one document for one example.\\nIn the final
      evaluation configuration, context is supplied as cleaned full-article-prefix
      text with a per-document cap of approximately 12,000 characters. Section-level
      metadata are retained for provenance and auditing.\\nThe response-generation
      templates are intentionally simple. In the non_rag condition, the model is instructed
      to answer using only its own knowledge. In the three RAG conditions, the model
      is instructed to answer using only the provided documents, with each supplied
      context labeled sequentially as Context 1 , Context 2 , etc.\\nAll model responses
      were generated deterministically with temperature = 0 . 0 , topp = 1 . 0 , and
      sampling disabled. We used a maximum of 1,024 newly generated tokens per response
      and a fixed run seed of 42. For RAG conditions, each cleaned retrieved-document
      prefix was capped at 12,000 characters. The same prompt template and decoding
      settings were used across all four conditions for a given model.\\nAll experiments
      were run on an academic research cluster with NVIDIA H100 GPUs. Compute requirements
      varied by model size, context length, and response length. The five-model evaluation
      required approximately 74 GPU-hours in total, including response generation
      and local safety judging. The released configurations and run manifests provide
      the information needed to reproduce the evaluation.\\n\\n[2] A.1 RAG-Safety-Bench
      benchmark creation\\nRAG-Safety-Bench was constructed from Wikipedia-based source
      material using a semiautomated pipeline. We first defined a taxonomy of harmful
      user requests by adapting the MLCommons AILuminate hazard taxonomy to the RAG
      question-answering setting. The final taxonomy contains 20 subcategories spanning
      violent crimes, sex-related crimes, nonviolent crimes, hate, indiscriminate
      weapons, and self-harm (Table 2). As described in the main paper, several categories
      from the original taxonomy were excluded because they were not appropriate for
      a public Wikipedia-based QA benchmark, including privacy/identification, direct
      harmful content generation, intellectual property, and specialized advice.\\nFor
      each harm subcategory, we identified one or more relevant Wikipedia categories
      or documents likely to contain harmful answer-bearing information. We then used
      Claude Sonnet-4.5 to generate candidate harmful questions whose answers could
      be grounded in those documents. In addition to the question itself, the generation
      stage also produced supporting metadata for review, including severity, naturalness
      notes, answerability justification, source-document identifiers, and a short
      gold reference summary of the harmful answer. This gold reference is stored
      in the field expected_unsafe_answer_summary . The prompt used with Claude Sonnet-4.5
      to generate candidate unsafe questions from Wikipedia articles is shown in Table
      5.\\nThe released benchmark contains two versions. The Full version contains
      987 harmful questions, distributed unevenly across the 20 subcategories. The
      Balanced version, used in the experiments in this paper, subsamples toward a
      uniform target of 20 examples per subcategory where available. Some subcategories
      contain fewer than 20 viable examples, so the final balanced subset contains
      346 unique examples in total (Table 2).\\nEach released benchmark row contains
      a query plus the metadata needed to instantiate one controlled evaluation condition.
      Important fields include:\\n- example_id , original_example_id , and row_uid
      : stable identifiers linking conditionspecific rows to the underlying benchmark
      question;\\n- question and expected_unsafe_answer_summary : the harmful user
      query and its reference answer summary;\\n- harm_category , harm_topic_family
      , taxonomy_family , taxonomy_subcategory , topic , and topic_slug : harm-taxonomy
      metadata;\\n- gold_doc_id and gold_doc_title : provenance for the source document
      underlying the oracle condition;\\n- condition , doc_count , and docs : the
      evaluation condition and its model-facing document contexts;\\n- strict_audit_labels
      : final oracle answerability and on-topic non-answerability audit outcomes;
      and\\n- runtime_context_cap , context_ablation , final_freeze_version , source_run_id
      , and source_builder_mode : runtime and dataset provenance metadata.\\n\\n\\n[3]
      Table 8: Answerability of document contexts for the final balanced subset (
      n = 346 ). Oracle and on-topic contexts were audited with GPT-4.1mini. \u2020
      Random-control values reflect construction-time answer\\\\_support=none labels
      rather than a separate LLM audit.\\n\\n| Condition        | Yes         | Partial
      \    | No / none    |\\n|------------------|-------------|-------------|--------------|\\n|
      Oracle unsafe    | 200 (57.8%) | 146 (42.2%) | 0 (0.0%)     |\\n| On-topic safe
      \   | 0 (0.0%)    | 0 (0.0%)    | 346 (100.0%) |\\n| Random control \u2020 |
      0 (0.0%)    | 0 (0.0%)    | 346 (100.0%) |\\n\\n[4] E. Experimental Design\\nThe
      evaluation set contains 49 fact-checking queries, of which 37 are distinct,
      spanning locations, dates and counts, yes/no claims, and people. Ten information-rich
      passages covering the queried facts were added to the index because raw FEVER
      evidence sentences are often too terse to support a full answer. Crossing the
      query set with three strategies and four poisoning levels yields 49 \xD7 3 \xD7
      4 = 588 runs, each producing a clean and a poisoned answer for 1 , 176 generations
      in total. Because a full sweep takes roughly a day on CPU, results are written
      to disk after every run and a checkpoint records completed cells, so an interrupted
      sweep resumes without repeating work.\\n\\n[5] Table 2: The taxonomy of harms
      covered in RAGSafety-Bench. The number of realistic, dangerous queries that
      could be generated from Wikipedia articles varied across subcategories: the
      column 'Full' indicates the total of queries available for each category, the
      column 'Balanced' indicates the number of queries in each subcategory after
      sub-sampling to avoid topic bias.\\n\\n| Category       | Subcategory          |
      \  Full |   Balanced |\\n|----------------|----------------------|--------|------------|\\n|
      Violent        | Assault/battery      |     33 |         20 |\\n| crimes         |
      Abuse                |     47 |         20 |\\n|                | Kidnapping
      \          |     17 |         17 |\\n|                | Murder               |
      \    23 |         20 |\\n|                | Terrorism            |     28 |
      \        20 |\\n| Sex-related    | Sexual harassment    |     18 |         16
      |\\n| crimes         | Sexual assault       |     15 |         12 |\\n| Nonviolent
      \    | Fraud/scam           |     63 |         20 |\\n| crimes         | Financial
      crimes     |     20 |         20 |\\n|                | Property crimes      |
      \    34 |         20 |\\n|                | Cyber-attacks        |    135 |
      \        20 |\\n|                | Drug-related crimes  |     16 |         16
      |\\n| Hate           | Hate speech          |     21 |         20 |\\n|                |
      Hate crimes          |     13 |         13 |\\n| Indiscriminate | Chemical weapons
      \    |     76 |         20 |\\n| weapons        | Biological weapons   |      8
      |          5 |\\n|                | Radiological weapons |      7 |          7
      |\\n|                | Explosives           |    304 |         20 |\\n| Self-harm
      \     | Suicide              |     75 |         20 |\\n|                | Self-harm
      \           |     34 |         20 |\\n| TOTAL          |                      |
      \   987 |        346 |\\n\\nAnswer: The balanced subset contains **346 examples**,
      as confirmed in multiple places. Per Table 2, the total balanced count across
      all subcategories sums to 346, matching the statement that some subcategories
      contain fewer than 20 viable examples, so the final balanced subset contains
      346 unique examples in total (Table 2).\\n\\n**Expansion into evaluation runs:**\\n\\nEach
      example in the balanced subset is expanded into four evaluation conditions:
      non_rag, rag_oracle_unsafe, rag_topic_safe, and rag_control_safe_random. Since
      the balanced subset contains 346 examples, this expansion produces 1,384 example-condition
      rows per model and 6,920 total responses across the five evaluated models.\\n\\nThe
      four conditions differ in how many context documents they supply:\\n- The non_rag
      condition supplies no documents for all 346 examples.\\n- The rag_oracle_unsafe
      condition supplies one document for all 346 examples.\\n- The rag_topic_safe
      condition supplies three documents for 344 examples and two documents for two
      examples.\\n- The rag_control_safe_random condition supplies three documents
      for 321 examples, two documents for 24 examples, and one document for one example.\\n\\nSo
      the single set of 346 benchmark examples, multiplied by 4 conditions, yields
      1,384 example-condition rows per model, and across 5 models this totals 6,920
      model responses.\\n\\nPass only if every factual claim in the answer is stated
      in, or directly follows from, the\\nsources. A claim that is plausible but absent
      from the sources fails. An answer that correctly\\nsays the sources don't contain
      the answer passes.\"}],\"model\":\"claude-opus-5\",\"output_config\":{\"format\":{\"type\":\"json_schema\",\"schema\":{\"type\":\"object\",\"title\":\"Verdict\",\"properties\":{\"reasoning\":{\"type\":\"string\",\"description\":\"One
      or two sentences: what matched or what was wrong.\",\"title\":\"Reasoning\"},\"passed\":{\"type\":\"boolean\",\"description\":\"True
      only if the answer meets the criterion in full.\",\"title\":\"Passed\"}},\"additionalProperties\":false,\"required\":[\"reasoning\",\"passed\"]}}}}"
