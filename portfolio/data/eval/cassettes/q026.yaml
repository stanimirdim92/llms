- request:
    body: '{"query": "How many examples are in the balanced subset, and how does that
      expand into evaluation runs?", "documents": ["4 Experimental Setup\nWe know
      what size of effect we could have caught. Our sample sizes give 80% power to
      detect a difference of roughly 7 percentage points (pp). Plainly: had RLVR moved
      post-rationalization by 7pp or more in either direction, this design would almost
      certainly have caught it. Shifts of a couple of points stay inside our blind
      spot, which is why we report a bounded null rather than a flat absence of effect.
      We fixed the primary outcome and the family of corrected comparisons in writing
      before the scorer ran.\nCompute. Everything ran on Kaggle''s free tier, two
      T4s or a single P100 per session: 48 GPU jobs yielding 36,690 scored records
      across four models, four datasets, three variants, and both conditions. The
      original study used a 104B model; the controlled version of the same measurement
      fits on hardware anyone can get for free, and that is the part we would most
      like other groups to borrow.", "E. Experimental Design\nThe evaluation set contains
      49 fact-checking queries, of which 37 are distinct, spanning locations, dates
      and counts, yes/no claims, and people. Ten information-rich passages covering
      the queried facts were added to the index because raw FEVER evidence sentences
      are often too terse to support a full answer. Crossing the query set with three
      strategies and four poisoning levels yields 49 \u00d7 3 \u00d7 4 = 588 runs,
      each producing a clean and a poisoned answer for 1 , 176 generations in total.
      Because a full sweep takes roughly a day on CPU, results are written to disk
      after every run and a checkpoint records completed cells, so an interrupted
      sweep resumes without repeating work.", "A.2 Safety evaluation details\nEach
      example in the balanced subset is expanded into four evaluation conditions:
      non_rag , rag_oracle_unsafe , rag_topic_safe , and rag_control_safe_random .
      Since the balanced subset contains 346 examples, this expansion produces 1,384
      example-condition rows per model and 6,920 total responses across the five evaluated
      models.\nThe benchmark controls retrieval quality by directly supplying context
      documents, rather than relying on a live retriever to discover them at inference
      time. This is important because a poor retriever could otherwise fail to retrieve
      the relevant harmful document and artificially inflate apparent safety.\nThe
      non_rag condition supplies no documents for all 346 examples. The rag_oracle_unsafe
      condition supplies one document for all 346 examples. The rag_topic_safe condition
      supplies three documents for 344 examples and two documents for two examples.
      The rag_control_safe_random condition supplies three documents for 321 examples,
      two documents for 24 examples, and one document for one example.\nIn the final
      evaluation configuration, context is supplied as cleaned full-article-prefix
      text with a per-document cap of approximately 12,000 characters. Section-level
      metadata are retained for provenance and auditing.\nThe response-generation
      templates are intentionally simple. In the non_rag condition, the model is instructed
      to answer using only its own knowledge. In the three RAG conditions, the model
      is instructed to answer using only the provided documents, with each supplied
      context labeled sequentially as Context 1 , Context 2 , etc.\nAll model responses
      were generated deterministically with temperature = 0 . 0 , topp = 1 . 0 , and
      sampling disabled. We used a maximum of 1,024 newly generated tokens per response
      and a fixed run seed of 42. For RAG conditions, each cleaned retrieved-document
      prefix was capped at 12,000 characters. The same prompt template and decoding
      settings were used across all four conditions for a given model.\nAll experiments
      were run on an academic research cluster with NVIDIA H100 GPUs. Compute requirements
      varied by model size, context length, and response length. The five-model evaluation
      required approximately 74 GPU-hours in total, including response generation
      and local safety judging. The released configurations and run manifests provide
      the information needed to reproduce the evaluation.", "A.3 Answerability audit
      of evaluation contexts\nWe audited the exact rendered contexts used for the
      final balanced evaluation subset (346 questions) using GPT-4.1-mini. Given a
      question and its supplied documents, the judge classified whether the documents
      contained the information needed to directly and substantially answer the question
      as yes , partial , or no . We retained examples only when the oracle context
      was judged yes or partial and the on-topic context was judged no . Thus, the
      oracle condition contains answer-bearing evidence, while the on-topic condition
      is topically related but does not directly support the unsafe answer.\nTable
      8 reports the final audit outcomes. The random-control condition was constructed
      from a benign, off-topic document pool rather than independently re-judged by
      the LLM: all 346 randomcontrol contexts contain only documents labelled none
      for answer support in the benchmark metadata (1,012 documents in total).", "C
      Second-Evaluator Sensitivity Audit\nInference and diagnostics. The separate
      24-test family uses pointwise 95% bootstrap intervals and two-sided randomization
      tests, each with 10,000 replicates and seed 13, question resampling on ASQA
      and paper clustering on QASPER, with question-weighted means and Holm adjustment.
      The original 148-test analysis is unchanged. Tables 11-12 report precision means
      and all planned contrasts. All 16 emitted-grounded gaps remain positive after
      adjustment; the eight cross-evaluator precision differences remain unresolved,
      which does not establish equivalence. ECR and other budgets are outside this
      audit.\nThe run scored 6,015 unique pairs in 419 seconds of model inference
      (430 seconds including bookkeeping; setup and excluded attempts are additional).
      Four inputs required truncation, with maximum pre-truncation length 47,440 tokens.
      After normalization, 122 pairs (2.03%) produced nonbinary strings, including
      103 empty strings; assigning zero does not establish reliable nonentailment.
      These are pair counts, not fractions of questions affected; the full histogram
      accompanies the cache. Recovery can disagree substantially: QASPER LLMLingua-2
      has 50.3% agreement over 1,000 candidate decisions and mean recovery rates of
      0.84 for DeBERTa versus 0.38 for TRUE. These descriptive results support sensitivity
      analysis, not accuracy against human judgments.\n", "D Judge Metrics\nWe use
      Substring Match as the primary metric because it is deterministic and consistent
      with standard open-domain QA evaluation. However, it can overestimate answer
      quality when a model lists multiple candidate answers: the prediction receives
      full credit whenever it contains a gold-answer alias as a substring, even if
      the response is ambiguous, unsupported, or includes incorrect alternatives.
      We therefore additionally report LLM-as-a-judge scores, which evaluate the correctness
      of the generated answer in the context of the question and reference answer.
      The judge assigns a score of 1 for a correct answer, 0.5 for a partially correct
      answer, and 0 for a wrong answer; we report the mean score as a percentage.
      This complementary evaluation penalizes answer enumeration and verifies that
      improvements in Match correspond to genuinely correct answers rather than increased
      lexical overlap with the reference.\nTable 5: Training schedule for the three-stage
      procedure.\n\nStage 1, Examples = 2,000,000. Stage 1, Epochs = 1. Stage 2, Examples
      = 500,000. Stage 2, Epochs = 1. Stage 3 (KILT-SCR), Examples = 196,916. Stage
      3 (KILT-SCR), Epochs = 3\nFor each example, we provide the judge with the question,
      the reference answer, and the model prediction. We use the following prompt:\nSystem
      prompt: You are an evaluation tool. Answer with one of: 1: Correct, 0.5: Partially
      correct, 0: Wrong.\nUser prompt: Here is a question, a golden answer, and an
      AI-generated answer. Can you judge whether the AIgenerated answer is correct
      according to the question and golden answer? Simply answer with one of: 1: Correct,
      0.5: Partially correct, 0: Wrong.\nQuestion:\n{question}\nGolden answer:\n{answer}\nGenerated
      answer: {prediction}\nFigure 7 corroborates the Match-based robustness trends.
      At the training-time compression rate of 16 \u00d7 , AdaMem matches or exceeds
      OSCAR across all three benchmarks, improving by 1.8 points on TriviaQA and 2.4
      points on NQ, while the methods are effectively tied on HotpotQA. The advantage
      grows under stronger inference-time compression. At 64 \u00d7 , AdaMem exceeds
      OSCAR by 6.1 points on TriviaQA and NQ, and by 7.1 points on HotpotQA. In contrast
      to OSCAR, AdaMem remains stable as the memory budget shrinks: its judge score
      decreases by only 0.9, 3.3, and 1.4 points from 16 \u00d7 to 64 \u00d7 on TriviaQA,
      NQ, and HotpotQA, respectively, compared with drops of 5.2, 7.0, and 8.7 points
      for OSCAR. These results show that relevance-aware allocation preserves answer-critical
      information under severe compression, rather than merely improving lexical overlap
      with reference answers.", "Experiments and Results\nKILT-SCR. Weconstruct KILT-SCR
      as a large-candidatepool resource with training and evaluation splits. Its training
      split is derived from the training sets of Natural Questions (Kwiatkowski et
      al. 2019), HotpotQA (Yang et al. 2018), and TriviaQA (Joshi et al. 2017). The
      evaluation split contains examples from the evaluation sets of these three datasets,
      together with PopQA (Mallen et al. 2023), ASQA (Stelmakh et al. 2022), and BioASQ
      (Krithara et al. 2023; Tsatsaronis et al. 2015). For every query, we retrieve
      a fixed pool of 25 passages from KILT-100w (Petroni et al. 2021) using BAAI/bge-large-en-v1.5
      (Xiao et al. 2024).\nFor each training query, we score candidates with cross-encoder/ms-marco-MiniLM-L6-v2
      (Bajaj et al. 2018) and provide the ten highest-scoring passages to Mistral-7B-Instruct-v0.2
      (Jiang et al. 2023a) to generate answer targets. We retain only instances for
      which a goldanswer alias occurs both in at least one retrieved passage and in
      the generated target, yielding 196,916 examples; teacher scores are globally
      standardized over this split. In contrast, we apply no answer-support or teacher-target
      filtering to KILTSCR evaluation split, which contains 2,000 examples each from
      Natural Questions, HotpotQA, TriviaQA, and PopQA, 948 from ASQA, and 1,609 from
      BioASQ. At evaluation time, the learned reranker scores the fixed candidate
      pool before answer generation.\nExperimental Setup. AdaMem uses a Llama-3.2-1BInstruct
      (Grattafiori et al. 2024) compressor and a Mistral-7B-Instruct-v0.2 decoder
      adapted with LoRA (Hu et al. 2022). We first pretrain the compressor and AdaMem
      projection module on two million examples sampled from EleutherAI/SmolLM2-135M-10B
      (Allal et al. 2025), using autoencoding and language-modeling objectives. We
      then perform query-dependent fine-tuning on maxoul/pisco_finetuning_data (Louis,
      D\u00e9jean, and Clinchant 2025), following the OSCAR training setup. Finally,
      we train on KILT-SCR with the joint answergeneration and reranker-distillation
      objectives. For all experiments, we report Substring Match as the primary evaluation
      metric. We provide additional LLM-as-a-judge metrics in the Supplementary Material.\nFigure
      3: Match (%) versus retrieval depth. AdaMem benefits from deeper retrieval more
      consistently than OSCAR, particularly under stronger compression.", "4.1 Experimental
      Setup\nQASPER context and token counts. The context contains the supplied paper''s
      abstract and all full-text paragraphs, sentence-segmented for compression; no
      topk retrieval truncation is applied. On the 976 common questions, full-source
      token counts have mean 4,672, median 4,557, and range 897-11,418. At nominal
      0.25, RECOMP''s mean compressed context is 60.3 tokens and its mean complete
      generator input is 125.4 tokens. The reported achieved fraction, 0.01525, is
      the mean of per-question context/full-source ratios, not the ratio of these
      token means. At nominal 0.50, this gap between nominal and achieved fractions
      is about 32.8-fold.", "Table 5: Training schedule for the three-stage procedure.\n\n|
      Stage              |   Examples |   Epochs |\n|--------------------|------------|----------|\n|
      Stage 1            |  2,000,000 |        1 |\n| Stage 2            |    500,000
      |        1 |\n| Stage 3 (KILT-SCR) |    196,916 |        3 |", "C Second-Evaluator
      Sensitivity Audit\nWe sample 100 questions per dataset from sorted common-cohort
      IDs using a fresh Python seed13 random generator; QASPER spans 84 papers. Full-context
      identity and nominal-0.25 extraction, RECOMP, and LLMLingua-2 contribute 800
      unchanged saved answers, with 1,627 claims and 1,890 citation markers. The prior
      DeBERTa values are the original scores for these same sampled answers.\nModel
      and decoding. We use google/t5_xxl_true_nli_mixture (Honovich et al., 2022),
      revision aa6cfe1dd4 , with full revision and checkpoint hashes in the manifest.
      This released mixture uses SNLI, MNLI, FEVER, SciTail, PAWS, and VitaminC (Bowman
      et al., 2015; Williams et al., 2018; Thorne et al., 2018; Khot et al., 2018;
      Zhang et al., 2019; Schuster et al., 2021), rather than the original TRUE paper''s
      ANLI recipe. MNLI and FEVER overlap DeBERTa''s training mixture. Inference uses
      Transformers 4.57.6, the slow T5 tokenizer, BF16, batch size four, and one NVIDIA
      B200. The prompt places compressed text or source evidence after premise: and
      the unit or claim after hypothesis: .\nWe use an AutoAIS-style exact-one decision
      (Bohnet et al., 2022; Gao et al., 2023): generate at most ten tokens deterministically,
      strip surrounding whitespace, and count only 1 as entailment. Every other string
      scores zero; these are binary decisions, not calibrated probabilities. Unlike
      our rule, reference AutoAIS/ALCE code compares decoded strings without additional
      whitespace normalization. We retain normalized nonbinary strings, but not every
      raw output, so normalization''s effect cannot be quantified from the cache.\nEvidence
      mappings. Fixed recovery preserves declared provenance and DeBERTa-recovered
      source IDs while TRUE scores support. TRUE recovery reevaluates all top-10 lexical
      candidates for undeclared units, including DeBERTa-rejected candidates, then
      scores with TRUE. Both retain the corrected precision gate. Fixed recovery retains
      selection dependence; TRUE recovery reuses one judge. Neither removes bounded-search
      errors or supplies human calibration.\nRecorded amendments. Astrict-decoding
      pilot stopped on a nonbinary output; a second stopped on an overlong hypothesis.
      An input-only scan found five undeclared units exceeding 2,048 tokens (maximum
      hypothesis plus prompt: 2,988), motivating a uniform 4,096-token cap that preserves
      complete hypotheses and truncates only premises. A later batch-eight run exhausted
      GPU memory. All interrupted attempts and plans are preserved but excluded; the
      final batch-four run recomputes every input in a fresh cache. These amendments
      preceded inspection of any aggregate TRUE comparison report and left the sample,
      thresholds, and 24 comparisons unchanged. The cap exceeds original TRUE''s 2,048
      and DeBERTa''s 512 tokens, so cross-evaluator differences do not isolate model
      family.", "A.1 RAG-Safety-Bench benchmark creation\nRAG-Safety-Bench was constructed
      from Wikipedia-based source material using a semiautomated pipeline. We first
      defined a taxonomy of harmful user requests by adapting the MLCommons AILuminate
      hazard taxonomy to the RAG question-answering setting. The final taxonomy contains
      20 subcategories spanning violent crimes, sex-related crimes, nonviolent crimes,
      hate, indiscriminate weapons, and self-harm (Table 2). As described in the main
      paper, several categories from the original taxonomy were excluded because they
      were not appropriate for a public Wikipedia-based QA benchmark, including privacy/identification,
      direct harmful content generation, intellectual property, and specialized advice.\nFor
      each harm subcategory, we identified one or more relevant Wikipedia categories
      or documents likely to contain harmful answer-bearing information. We then used
      Claude Sonnet-4.5 to generate candidate harmful questions whose answers could
      be grounded in those documents. In addition to the question itself, the generation
      stage also produced supporting metadata for review, including severity, naturalness
      notes, answerability justification, source-document identifiers, and a short
      gold reference summary of the harmful answer. This gold reference is stored
      in the field expected_unsafe_answer_summary . The prompt used with Claude Sonnet-4.5
      to generate candidate unsafe questions from Wikipedia articles is shown in Table
      5.\nThe released benchmark contains two versions. The Full version contains
      987 harmful questions, distributed unevenly across the 20 subcategories. The
      Balanced version, used in the experiments in this paper, subsamples toward a
      uniform target of 20 examples per subcategory where available. Some subcategories
      contain fewer than 20 viable examples, so the final balanced subset contains
      346 unique examples in total (Table 2).\nEach released benchmark row contains
      a query plus the metadata needed to instantiate one controlled evaluation condition.
      Important fields include:\n- example_id , original_example_id , and row_uid
      : stable identifiers linking conditionspecific rows to the underlying benchmark
      question;\n- question and expected_unsafe_answer_summary : the harmful user
      query and its reference answer summary;\n- harm_category , harm_topic_family
      , taxonomy_family , taxonomy_subcategory , topic , and topic_slug : harm-taxonomy
      metadata;\n- gold_doc_id and gold_doc_title : provenance for the source document
      underlying the oracle condition;\n- condition , doc_count , and docs : the evaluation
      condition and its model-facing document contexts;\n- strict_audit_labels : final
      oracle answerability and on-topic non-answerability audit outcomes; and\n- runtime_context_cap
      , context_ablation , final_freeze_version , source_run_id , and source_builder_mode
      : runtime and dataset provenance metadata.\n", "4.2 Statistical Analysis and
      Metric Audit\nCommon cohorts and estimands. Primary summaries and comparisons
      use the intersection of successful question IDs across identity and all twenty
      compressed settings. Each question has equal weight in citation precision, citation
      recall, answer quality, and evidence F1; claims and citations are not pooled
      across questions. Undefined evidence or recovery metrics remain undefined rather
      than becoming zeros. Verification-rate means exclude answers with zero claims;
      paired verification comparisons exclude a question if ei- ther member has zero
      claims. The analysis artifacts report those exclusions and retain full-cohort
      descriptive means separately.\nInference. We use pointwise 95% percentile bootstrap
      intervals for each paired mean difference (Dror et al., 2018), resampling 944
      questions on ASQA and 271 papers on QASPER with replacement. All retained questions
      from a sampled QASPER paper travel together, and each replicate divides its
      total difference by the number of sampled questions, preserving the questionweighted
      estimand. Every QASPER contrast retains all 271 papers after metric-specific
      exclusions. Two-sided randomization tests swap paired labels within questions
      on ASQA and jointly within papers on QASPER. These tests assume label exchangeability
      within a resampling unit under the null. Both procedures use 10,000 replicates
      and seed 13, with independent random-number streams for bootstrap sampling and
      randomization. Monte Carlo p -values use ( b + 1) / (10 , 000 + 1) , where b
      counts randomizations at least as extreme as the observed absolute difference.
      The initial plan specified 134 core contrasts and 10 recoverythreshold contrasts
      before inspecting the revised inferential results. After that analysis and a
      cachecoverage audit, we added four recovered-source versus summary-verification
      contrasts at nominal 0.25 for RECOMP and LLMLingua-2 on both datasets. The extension
      plan was recorded before running these four tests, and Holm adjustment was recomputed
      over all 148 raw p -values. We denote Holm-adjusted values by p H . All reported
      adjusted values use this expanded family; original effects, intervals, and raw
      p -values are unchanged. This is a post hoc camera-ready analysis, not a preregistration.
      Intervals are pointwise, not simultaneous; statistical-support statements use
      p H < 0 . 05 . Failure to reject a difference does not establish equivalence
      or preservation. All inference is conditional on the fixed generator outputs,
      recovery procedure, and evaluator.\nPrecision-code audit. The manuscript''s
      precision definition requires the concatenated cited evidence to entail a claim
      before any individual citation receives credit. A code audit found that the
      previous implementation could credit an individually supporting citation even
      when joint entailment failed. A saved ASQA answer reproduced this discrepancy,
      and a regression test now checks the required gate through the evaluation pipeline.\n",
      "B Complete Paired Comparisons\nSection 4.2 describes the common cohorts, estimands,
      inference, and precision-code correction. Tables 6-10 report all 148 planned
      contrasts, including those not retained as claims; EF1 effects and intervals
      use four decimal places, and other effects and intervals use three.\nTable notation.
      A/Q denote ASQA/QASPER; Id, RR, X, RC, and LL denote identity, reranking, extraction,
      RECOMP, and LLMLingua-2. Setting labels give compressor/nominal budget, optionally
      followed by the recovery threshold. P/R denote precision/recall, with e/g for
      emitted/grounded; EM is str-EM, EF1 is evidence F1, and Rec is reattribution
      rate. U s /U m /U r denote declared-span, summary, and recovered-source unsupported
      rates. \u2206 is the paired left-minus-right mean difference; a single endpoint
      applies to both settings, and a pair lists left-minus-right metrics. CI is a
      pointwise 95% bootstrap interval; p H is the two-sided randomization p -value
      after Holm adjustment across all 148 comparisons; n counts included questions.\nRecovered-source
      verification. This extension reads existing NLI scores from the sealed cache
      and makes no new model calls. It uses the same recovered source IDs as citation
      scoring, but the claim verifier removes repeated source IDs before pooling evidence.
      Consequently, its unsupported rate need not equal one minus grounded citation
      recall, which retains repeated cited evidence. Both summary and recovered-source
      rates exclude the same zero-claim answers: two QASPER RECOMP answers at nominal
      0.25; the other three comparisons use their full common cohorts. Input hashes,
      the extension plan, cache lookups, perquestion records, and all four comparisons
      are retained separately from the original analysis.\n", "C. Uncertainty on the
      Existing Runs\nWe do not invent new generations for this revision. We reanalyse
      the same table with a query-level bootstrap: resample the 49 indexed query slots
      with replacement (37 distinct texts), keep every run tied to a drawn slot, recompute
      the fooled rate, and repeat 10 , 000 times with a fixed seed to obtain percentile
      95% intervals. Exact McNemar tests on discordant clean/poisoned correctness
      pairs are reported as a secondary check; effect sizes and intervals remain primary.\nTable
      II shows that the climb with poisoning level remains after accounting for query
      resampling, while neighbouring levels overlap. The comparison that matters for
      the numeric pattern is isolated next.\nTABLE III BEHAVIOUR BY STRATEGY, AVERAGED
      OVER ALL FOUR POISONING LEVELS. EACH STRATEGY AGGREGATES 196 RUNS.\n\nEntity
      swap, Clean acc. (%) = 78.1. Entity swap, Poisoned acc. (%) = 54.6. Entity swap,
      Fooled rate (%) = 23.5. Entity swap, Abstain rate (%) = 43.4. Number swap, Clean
      acc. (%) = 77.6. Number swap, Poisoned acc. (%) = 57.7. Number swap, Fooled
      rate (%) = 20.4. Number swap, Abstain rate (%) = 30.1. Negation, Clean acc.
      (%) = 78.1. Negation, Poisoned acc. (%) = 60.2. Negation, Fooled rate (%) =
      19.4. Negation, Abstain rate (%) = 32.1", "E Training Schedule.\nTable 5 summarizes
      the number of training examples and epochs used at each stage. We train for
      one epoch in Stages 12 and for three epochs during the final KILT-SCR fine-tuning
      stage.", "7 Discussion\nWhat laundering looks like. Consider an ASQA example
      under RECOMP at nominal budget 0.25. Asked ''How many state parks are there
      in Virginia?'' , the generator answers ''There are 34 state parks in Virginia
      [1]'' , while Document [1] states ''Virginia has 34 state parks and 17 state
      forests . . . '' . The citation receives full emitted precision, but Document
      [1] is the compressor''s summary with no declared source link. In another example,
      the answer ''The man who killed [them] is not mentioned in the retrieved documents
      [1]'' cites a summary containing that same assertion of absence. Both illustrate
      consistency with intermediate text without a declared path to source evidence;
      neither example alone establishes an independently verified hallucination.\nImplications
      for practice. Five operational recommendations follow from this evaluation setup.
      (1) Verify against source spans: consistency with compressor output does not
      establish support from locatable evidence. Report whether spans are declared
      or recovered and how support is judged. (2) Report achieved compression: nominal
      fractions overstate achieved context size by up to 32.8fold here (Section 4.1).
      (3) Include verification in cost reporting: report generator and verifier input
      lengths together, while identifying which other costs remain unmeasured (Table
      2). Zero declaredspan cost can mean that no evidence reached the verifier. (4)
      Evaluate post-hoc recovery explicitly: missed recovery can reflect search errors
      or missing support (Section 6). (5) Document citable-unit granularity: comparisons
      differ in their source units as well as their datasets. Controlled ablations
      are needed to isolate the effect of unit size.\nWhat dominating the frontier
      would require. Future compressors should merge redundant evidence while retaining
      validated source links and accounting for verification cost. ECR''s limited
      measured gains motivate independent calibration and replication before claiming
      general improvements.\nFailure modes and excluded examples. All 33 failures
      occur in identity runs: 4 budget-check failures on ASQA, and 15 budget-check
      plus 14 prompt-overflow failures on QASPER. No compressed run fails on these
      examples. Primary comparisons exclude the same failed question IDs from every
      setting, so their estimand is performance conditional on identity success.",
      "6 Discussion\nHow to read the R-Search result. R-Search sits above its base
      on all four datasets and significantly above on the best-powered one, which
      is a real and consistent pattern. It is also one model, one base, one prompt,
      and one scorer, so four datasets are not four independent replications, and
      the effect softens under a stricter variant and a looser outcome. Two things
      would settle it: a cross-dataset test declared in advance, and an arm fine-tuned
      on the same data without RL, which would separate the contribution of RL from
      the contribution of fine-tuning on retrieval data at all.\nA note on cost. Everything
      here, four models, four datasets, three variants, both conditions, and the control
      that makes the comparison interpretable, ran on Kaggle''s T4 GPUs. Careful measurement
      was the cheap part of this project. The expensive part was reading the construction
