    body: "{\"max_tokens\":16000,\"messages\":[{\"role\":\"user\",\"content\":\"You
      check whether an answer is supported by its sources.\\n\\nQuestion: Which five
      open-source models does RAG-Safety-Bench evaluate?\\n\\nSources the answer was
      written from:\\n[1] 3.4 Models\\nWe consider five open-source LLMs in the current
      study: Gemma-3-12B-It, Llama-3.1-8BInstruct, Ministral-3-8B-Instruct, Qwen-2.5-7BInstruct,
      and Phi-4-14B. Each model was prompted with the unsafe query and allowed to
      generate a maximum of 1024 new tokens. All experiments were run on an academic
      research cluster with H100 GPUs. We did not test any commercial models because
      the questions in our benchmark would violate the terms of service of the APIs.\\n\\n[2]
      Abstract\\nAllowing large language models (LLMs) to retrieve information from
      a set of trusted documents can increase reliability and reduce hallucination.
      However, recent work has demonstrated that retrieval-augmented generation (RAG)
      can have unintended side effects on the overall safety of the generated responses,
      when prompted for harmful or dangerous content. A clearer understanding of the
      mechanisms leading to this result is needed, as increasing numbers of end users
      turn to RAG to incorporate corporate documents and knowledge bases into LLM-based
      systems. We introduce RAG-Safety-Bench, a benchmark to measure the safety impact
      of RAG on LLM models. By removing the confounding effect of retriever quality,
      and cleanly separating the problem into four conditions - non-RAG, RAG with
      an oracle document containing the answer to the harmful request, RAG with documents
      related to the harmful request but without the specific answer, and RAG with
      random, safe documents - the benchmark isolates the impacts of different factors
      in the observed safety degradation. We report results across five opensource
      LLMs, showing an inverse relationship between benign and unsafe capability,
      strong evidence that baseline safety guardrails do not lead to downstream safety
      guarantees in the RAG case, and model-specific support for previous findings
      that even benign documents can lead to unsafe generation in retrieval-enabled
      systems.\\n\\n[3] This is a heatmap chart displaying harmfulness evaluation
      results across five language models (Gemma-3-12B, Llama-3.1-8B, Ministral-3-8B,
      Phi-4-14B, and Qwen2.5-7B) under four retrieval-augmented generation (RAG) conditions
      each (Non-RAG, Oracle unsafe, On-topic, Random). The columns represent four
      evaluation metrics/classifiers (Llama-Guard, WildGuard, ShieldGemma, and Accuracy),
      with cell values showing the proportion of outputs flagged as unsafe, color-coded
      from dark blue (low, ~0.0) to red (high, ~1.0). The data reveals that the \\\"Oracle
      unsafe\\\" condition consistently produces the highest harmfulness rates across
      all models and metrics (e.g., Ministral-3-8B reaches 0.91 on Accuracy and Qwen2.5-7B
      reaches 0.83), while \\\"Random\\\" and \\\"On-topic\\\" RAG conditions yield
      much lower harmfulness scores (mostly below 0.25), indicating that injecting
      deliberately unsafe retrieved context substantially increases harmful outputs
      compared to non-adversarial retrieval conditions.\\n\\n[4] 6 Conclusion\\nWe
      introduce RAG-Safety-Bench with the goal of disentangling the effects of RAG
      on LLM safety by cleanly separating four retrieval conditions. Across five open-source
      models, our results show that the most interesting failure mode is model-specific:
      for Qwen-2.5-7B, on-topic but answer-free documents elicited more harmful responses
      than the non-RAG baseline, consistent with the hypothesis that topicrelevant
      context can surface harmful information from parametric memory.\\nMore generally,
      our findings confirm that nonRAG safety evaluations do not transfer to RAG deployments.
      Our initial results from the benchmark only evaluate the baked-in safety guardrails
      of the base model. However, in a production system, responsible AI practitioners
      should provide end-toend safety measures including (when warranted): corpus
      curation, input prompt filtering, retrievalside filtering, output filtering,
      and system prompt safety instructions, among other possible mitigations. Thus
      an important use case for our benchmark is also to evaluate the impact of safety
      interventions at different points in the multi-component RAG pipeline. Our results
      also indicate the need to choose an automated safety evaluator which is closely
      aligned with the safety concerns relevant to the particular application, and
      where possible to deploy multiple safety judges, as well as appropriate human
      oversight.\\n\\n[5] This is a bar chart comparing the harmfulness rate (majority
      vote) across five language models\u2014Gemma-3-12B, Llama-3.1-8B, Ministral-3-8B,
      Phi-4-14B, and Qwen2.5-7B\u2014under four retrieval-augmented generation (RAG)
