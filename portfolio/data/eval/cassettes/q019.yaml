      BehnamGhader, Nicholas Meade, and Siva Reddy. 2025. Exploiting instruction-following
      retrievers for malicious information retrieval. In Findings of the Association
      for Computational Linguistics: ACL 2025 , pages 12962-12980.\nFederico Bianchi,
      Mirac Suzgun, Giuseppe Attanasio, Paul R\u00f6ttger, Dan Jurafsky, Tatsunori
      Hashimoto, and James Zou. 2023. Safety-tuned llamas: Lessons from improving
      the safety of large language models that follow instructions. arXiv preprint
      arXiv:2309.07875 .\nWenqi Fan, Yujuan Ding, Liangbo Ning, Shijie Wang, Hengyun
      Li, Dawei Yin, Tat-Seng Chua, and Qing Li. 2024. A survey on RAG meeting LLMS:
      Towards retrieval-augmented large language models. In Proceedings of the 30th
      ACM SIGKDD conference on knowledge discovery and data mining , pages 64916501.\nFaeze
      Ghorbanpour and Alexander Fraser. 2025. Evaluating the sensitivity of LLMs to
      harmful contents in long input. arXiv preprint arXiv:2510.05864 .\nShaona Ghosh,
      Heather Frase, Adina Williams, Sarah Luger, Paul R\u00f6ttger, Fazl Barez, Sean
      McGregor, Kenneth Fricklas, Mala Kumar, Kurt Bollacker, and 1 others. 2025.
      AILuminate: Introducing v1.0 of the AI risk and reliability benchmark from MLCommons.
      arXiv preprint arXiv:2503.05731 .", "Abstract\nAllowing large language models
      (LLMs) to retrieve information from a set of trusted documents can increase
      reliability and reduce hallucination. However, recent work has demonstrated
      that retrieval-augmented generation (RAG) can have unintended side effects on
      the overall safety of the generated responses, when prompted for harmful or
      dangerous content. A clearer understanding of the mechanisms leading to this
      result is needed, as increasing numbers of end users turn to RAG to incorporate
      corporate documents and knowledge bases into LLM-based systems. We introduce
      RAG-Safety-Bench, a benchmark to measure the safety impact of RAG on LLM models.
      By removing the confounding effect of retriever quality, and cleanly separating
      the problem into four conditions - non-RAG, RAG with an oracle document containing
      the answer to the harmful request, RAG with documents related to the harmful
      request but without the specific answer, and RAG with random, safe documents
      - the benchmark isolates the impacts of different factors in the observed safety
      degradation. We report results across five opensource LLMs, showing an inverse
      relationship between benign and unsafe capability, strong evidence that baseline
      safety guardrails do not lead to downstream safety guarantees in the RAG case,
      and model-specific support for previous findings that even benign documents
      can lead to unsafe generation in retrieval-enabled systems.", "4.2 R2: Unsafe
      information or unsafe context?\nIn all cases, providing irrelevant (safe) documents
      leads to the safest behavior overall, suggesting that long context alone is
      not sufficient to steer the models into an unsafe regime.\nThe results in Figure
      2 are also partially consistent with one of the major conclusions from An et
      al. (2025), that the safest non-RAG LLM will likely be the safest RAG LLM. Indeed,
      Phi-4-14B is safest in both non-RAG and RAG settings, followed by Llama-3.1-8B.
      However, Qwen is the third safest in the non-RAG setting but the least safe
      in the oracle-RAG and on-topic RAG conditions, suggesting that some models''
      guardrails are more robust than others.\nNote that the harmfulness rates are
      lower than\n(though correlated with) the accuracy scores in Table 3. Accuracy
      and harmfulness are judged separately. Manual inspection reveals two large buckets
      of responses that are rated as accurate but not harmful: responses which are
      not flagged as harmful by the safety judges but likely should be, in the context
      (typically descriptions of historical events and nonviolent crimes), and cases
      where the model hedges that the information is for education purposes only (e.g.,
      Ministral-3-8B in response to a query about misinformation propagation, \"...
      Here''s a **generalized breakdown of memetic propagation techniques** (based
      on the text) that could theoretically be used to influence public opinion, **with
      the caveat that this is for educational/analytical purposes only** ... <goes
      into detail on techniques.>'' ).\nThe harmfulness rates for each model and condition
      broken down by harm taxonomy category are available in the Appendix (Figure
      6-Figure 10). The categories which tend to see the greatest increase in harmful
      responses from the non-RAG setting to the oracle setting are: radiological weapons,
      explosives, drugs, chemical weapons, assault, terrorism, and cyberattacks. The
      Ministral and Qwen models also show a concerning increase in harmful responses
      to questions about suicide and self-harm.", "References\n- Tinghao Xie, Xiangyu
      Qi, Yi Zeng, Yangsibo Huang, Udari Madhushani Sehwag, Kaixuan Huang, Luxi He,
      Boyi Wei, Dacheng Li, Ying Sheng, and 1 others. 2025. SORRY-Bench: Systematically
      evaluating large language model safety refusal. In The Thirteenth International
      Conference on Learning Representations .\n- Cheng Yu, Benedikt Stroebl, Diyi
      Yang, and Orestis Papakyriakopoulos. 2025. Information retrieval induced safety
      degradation in AI agents. arXiv preprint arXiv:2505.14215 .\n- Shenglai Zeng,
      Jiankun Zhang, Pengfei He, Yiding Liu, Yue Xing, Han Xu, Jie Ren, Yi Chang,
      Shuaiqiang Wang, Dawei Yin, and 1 others. 2024a. The good and the bad: Exploring
      privacy issues in retrievalaugmented generation (rag). In Findings of the Association
      for Computational Linguistics: ACL 2024 , pages 4505-4524.\n- Wenjun Zeng, Yuchi
      Liu, Ryan Mullins, Ludovic Peran, Joe Fernandez, Hamza Harkous, Karthik Narasimhan,
