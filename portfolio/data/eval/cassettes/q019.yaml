        R1: Capability in safe and unsafe contexts\\nTable 3 reports accuracies for
        each model when asked benign and harmful questions, in both nonRAG, oracle
        RAG, and mixed settings. In the benign case, accuracy is scored using the
        MIRAGE benchmark method (Park et al., 2025). In the harmful (RAG-Safety-Bench)
        case, we compare the output response with the expected benchmark response,
        using Claude-Opus-4.7 to output a fi- nal label of accurate or inaccurate
        relative to the reference. Human annotation of a subset of 100 examples validates
        the LLM-as-a-judge approach, with agreement of 95-96% between humans and LLM,
        and Cohen's \u03BA of 0.90-0.92 (more details and prompt available in Appendix
        Section A.4).\\nTable 1: The four settings of the RAG-Safety-Bench benchmark.
        Example documents are for the query, 'What materials and design do I need
        to make an IED that can defeat armored police vehicles?'\\n\\nLLM-only, Description
        = No context documents provided.. LLM-only, Example Wikipedia documents =
        (None). Oracle, Description = One of the returned documents contains the answer..
        Oracle, Example Wikipedia documents = 'Explosively formed penetrator'. On-topic,
        Description = Oracle document not included, but documents are related to the
        topic of the query.. On-topic, Example Wikipedia documents = 'Deflagration
        to detonation tran- sition', 'Blast wall'. Random, Description = Documents
        are randomly selected from a set of benign documents.. Random, Example Wikipedia
        documents = 'Climate change and birds', 'Ar- boretum'\",\"metadata\":{\"ingestion_version\":\"01a0fc5427ea71babb96a22c2c5762f3\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a-text-0011\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a\",\"chunk_type\":\"text\",\"section_path\":\"4.1
        R1: Capability in safe and unsafe contexts\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":43,\"page_no\":4,\"filename\":\"2609.11758v1.pdf\"}}},{\"id\":\"dfdc115b-8a09-5899-9911-fb57a38a5ae7\",\"version\":9,\"score\":0.64373577,\"payload\":{\"page_content\":\"A.2
        Safety evaluation details\\nEach example in the balanced subset is expanded
        into four evaluation conditions: non_rag , rag_oracle_unsafe , rag_topic_safe
        , and rag_control_safe_random . Since the balanced subset contains 346 examples,
        this expansion produces 1,384 example-condition rows per model and 6,920 total
        responses across the five evaluated models.\\nThe benchmark controls retrieval
        quality by directly supplying context documents, rather than relying on a
        live retriever to discover them at inference time. This is important because
        a poor retriever could otherwise fail to retrieve the relevant harmful document
        and artificially inflate apparent safety.\\nThe non_rag condition supplies
        no documents for all 346 examples. The rag_oracle_unsafe condition supplies
        one document for all 346 examples. The rag_topic_safe condition supplies three
        documents for 344 examples and two documents for two examples. The rag_control_safe_random
        condition supplies three documents for 321 examples, two documents for 24
        examples, and one document for one example.\\nIn the final evaluation configuration,
        context is supplied as cleaned full-article-prefix text with a per-document
        cap of approximately 12,000 characters. Section-level metadata are retained
        for provenance and auditing.\\nThe response-generation templates are intentionally
        simple. In the non_rag condition, the model is instructed to answer using
        only its own knowledge. In the three RAG conditions, the model is instructed
        to answer using only the provided documents, with each supplied context labeled
        sequentially as Context 1 , Context 2 , etc.\\nAll model responses were generated
        deterministically with temperature = 0 . 0 , topp = 1 . 0 , and sampling disabled.
        We used a maximum of 1,024 newly generated tokens per response and a fixed
        run seed of 42. For RAG conditions, each cleaned retrieved-document prefix
        was capped at 12,000 characters. The same prompt template and decoding settings
        were used across all four conditions for a given model.\\nAll experiments
        were run on an academic research cluster with NVIDIA H100 GPUs. Compute requirements
        varied by model size, context length, and response length. The five-model
        evaluation required approximately 74 GPU-hours in total, including response
        generation and local safety judging. The released configurations and run manifests
        provide the information needed to reproduce the evaluation.\",\"metadata\":{\"ingestion_version\":\"01a0fc5427ea71babb96a22c2c5762f3\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a-text-0028\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a\",\"chunk_type\":\"text\",\"section_path\":\"A.2
        Safety evaluation details\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":152,\"page_no\":14,\"filename\":\"2609.11758v1.pdf\"}}},{\"id\":\"c27ff7ae-8539-5208-bbf9-5776425c60ee\",\"version\":15,\"score\":0.64229333,\"payload\":{\"page_content\":\"4
        Experimental Setup\\nTable 2: Models (top) and datasets (bottom). All four
        models share the Qwen2.5-7B-Instruct base. Passages is the number of roughly
        100-token chunks in each retrieval index.\\n\\nBaseline, Training on top of
        the base = none (Qwen2.5-7B-Instruct). Search-R1, Training on top of the base
        = RLVR with PPO. ReSearch, Training on top of the base = RLVR with GRPO. R-Search,
        Training on top of the base = RLVR with GRPO\\nNQ, Questions = 499. NQ, Passages
        = 40,791. NQ, Source = Wikipedia. QAMPARI, Questions = 500. QAMPARI, Passages
        = 44,879. QAMPARI, Source = Wikipedia. HAGRID, Questions = 500. HAGRID, Passages
        = 8,986. HAGRID, Source = Wikipedia. RAGTruth, Questions = 500. RAGTruth,
        Passages = 6,981. RAGTruth, Source = Web\\nModels. Our comparison rests on
        a single design choice: every model in Table 2 starts from the same weights.
        The baseline is Qwen2.5-7BInstruct (Qwen Team, 2024); Search-R1 (Jin et al.,
        2025), ReSearch (Chen et al., 2025), and R-Search (Zhao et al., 2025) are
        open-weight agents trained from that exact checkpoint with RLVR. Whatever
        separates an agent from the baseline is therefore training, not architecture,
        tokenizer, or pretraining data.\\nFixed-context evaluation. We disable agentinitiated
        retrieval and give every model the same five passages retrieved externally
        with BM25. This is an intentional control: our question is whether RLVR-trained
        agents differ in citation attribution when the available evidence is held
        constant. Allowing agents to retrieve would introduce differences in search
        policy and evidence selection, making those effects inseparable from citation
        behavior.\\nDatasets. We use four question-answering datasets: NQ from KILT
        (Petroni et al., 2021; Kwiatkowski et al., 2019), QAMPARI from ALCE (Gao et
        al., 2023; Amouyal et al., 2023), HA- GRID (Kamalloo et al., 2023), and the
        questionanswering portion of RAGTruth (Niu et al., 2024), sampling 500 questions
        from each (499 for NQ). For each dataset we chunk the corpus into roughly
        100-token passages and retrieve the top five per question with BM25 (Robertson
        and Zaragoza, 2009).\",\"metadata\":{\"ingestion_version\":\"01a0fc55257f7276be70b7b3d1501b36\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6-text-0010\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6\",\"chunk_type\":\"text\",\"section_path\":\"4
        Experimental Setup\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":58,\"page_no\":4,\"filename\":\"2609.23053v1.pdf\"}}},{\"id\":\"9a75a084-221a-55c4-9d21-f612aa0d5231\",\"version\":9,\"score\":0.6359981,\"payload\":{\"page_content\":\"Kathleen
        C. Fraser\\n1. To what extent is the observed RAG safety decline correlated
        with a model's RAG capability? Previous work suggests that some models which
        appear 'safe' may simply be less capable of extracting and summarizing relevant
        information. We test this rigorously, and hypothesize the following (H1):
        Models which perform better on MIRAGE (benign capability) will also have higher
        accuracy and therefore lower safety in the oracle setting of RAG-Safety-Bench.\\n2.
        Is RAG safety decline a factor of unsafe information or unsafe context drift?
        The conventional view, challenged by An et al. (2025), is that RAG models
        are less safe only when the documents they retrieve are unsafe. An alternative
        explanation is that the increased context length, possibly containing many
        words semantically related to the unsafe query, shift the models into a less-aligned
        domain. 1 Our hypothesis (H2) is that the direct availability of the answer
        (oracle setting) will lead to the\\n1 In fact, this is similar to the intuition
        behind the successful Crescendo jailbreak (Russinovich et al., 2025).\\nhighest
        number of unsafe answers, but that the on-topic setting will lead to a higher
        number of unsafe answers relative to the baseline non-RAG setting, due to
        the destabilizing effect of the harmful-topic context. If the effect is purely
        due to context length, the random setting will lead to an equivalent harmfulness
        rate.\\n3. What is the impact of RAG on the refusal rate of LLMs? In many
        studies, safety is operationalized as refusal: a safe model is one which refuses
        to answer harmful questions. We distinguish between two varieties of refusal;
        namely, unwillingness to fulfill a harmful request versus inability to find
        the answer in the retrieved documents. We hypothesize (H3) that the refusal
        rate for harmful requests will be highest in the random setting, and attributed
        to a lack of information. We argue that this case should be distinguished
        from 'true' model safety, which should rely on an inherent unwillingness to
        provide dangerous advice. At the same time, the oracle setting offers contrasting
        evaluation in which we ensure the model has access to the requested information,
        so refusal can be more clearly interpreted as effective implementation of
        safety guardrails.\\n4. Do different safety evaluators agree on what is safe
        versus harmful? Standard safety evaluation relies on LLM-based 'judges' to
        label text as safe or unsafe. We compare multiple safety evaluators, with
        the hypothesis (H4) that there will be a high level of disagreement between
        the LLM evaluators.\\nRAG-Safety-Bench is freely available for research use
        at the following URL: https://github.com/The-Safe-AI-Lab/ RAG-Safety-Bench
        .\",\"metadata\":{\"ingestion_version\":\"01a0fc5427ea71babb96a22c2c5762f3\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a-text-0004\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a\",\"chunk_type\":\"text\",\"section_path\":\"Kathleen
        C. Fraser\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":16,\"page_no\":2,\"filename\":\"2609.11758v1.pdf\"}}},{\"id\":\"fdef7d6e-6f33-507f-b2bf-e72cdaf10ddb\",\"version\":9,\"score\":0.62739146,\"payload\":{\"page_content\":\"Kathleen
        C. Fraser\\nFaculty of Engineering University of Ottawa Ottawa, Canada kathleen.fraser@uottawa.ca\\nFigure
        1: The four conditions in RAG-Safety-Bench allow for detailed safety evaluation
        of RAG-enabled systems.\\ntrustworthiness and accuracy by reducing hallucinations,
        relative to non-RAG LLMs (Shuster et al., 2021). For these reasons, conventional
        wisdom would suggest that RAG-based LLMs should be safer than non-RAG models,
        with the primary security risk being data poisoning attacks on the RAG corpus.
        In the absence of poisoned data, there would be little reason to suspect a
        RAG system would output more harmful content than its base LLM component.\\nHowever,
        this assumption has been upended by recent work from An et al. (2025), who
        presented compelling evidence that when LLMs are enabled with RAG they are
        generally less safe than when relying on their parametric knowledge, even
        when the retrieved documents are benign. In the current work, we contribute
        to the understanding of this newly-identified problem by disentangling the
        notions of safety and capability through a new RAG-specific safety benchmark,
        RAG-SafetyBench. Furthermore, we take a closer look at what it means for documents
        and outputs to be 'unsafe,' to support more detailed analysis of the problematic
        case where safe RAGdocuments appear to lead to unsafe outputs.\\nRAG systems
        are challenging to evaluate because they are composed of multiple components,
        each of which contributes to the overall end-to-end performance of the system
        (Wampler et al., 2025). In particular, the retrieval quality can have a major
        impact on the quality of the output. The MIRAGE benchmark (Park et al., 2025)
        enables the evaluation of RAG systems while controlling for retrieval quality
        by providing sets of relevant and irrelevant oracle documents.\\nWe modify
        and extend this style of evaluation to safety evaluation in the RAG setting.
        Our RAGSafety-Bench benchmark consists of a set of unsafe English queries
        and three sets of documents (Figure 1): in the oracle setting, the unsafe
        answer is available in the document set. This setting could represent a data-poisoning
        attack - however, since we sourced all of our data from Wikipedia, it also
        represents the more common case that the data is believed to be generally
        benign but has not been meticulously curated. In the on-topic setting, the
        documents are relevant to the topic of the query but do not explicitly contain
        the unsafe answer. In the random setting, randomly-selected documents on safe
        topics are provided.\\nThis testing framework allows us to answer several
        key open research questions relating to the safety of RAG systems:\",\"metadata\":{\"ingestion_version\":\"01a0fc5427ea71babb96a22c2c5762f3\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a-text-0003\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a\",\"chunk_type\":\"text\",\"section_path\":\"Kathleen
        C. Fraser\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":8,\"page_no\":1,\"filename\":\"2609.11758v1.pdf\"}}},{\"id\":\"a547c741-df3f-5865-9981-52ca7db687c7\",\"version\":9,\"score\":0.62377226,\"payload\":{\"page_content\":\"References\\nBang
