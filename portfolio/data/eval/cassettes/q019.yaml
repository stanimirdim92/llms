      Generative AI content moderation based on Gemma. arXiv preprint arXiv:2407.21772
      .\n- Qiusi Zhan, Angeline Budiman-Chan, Abdelrahman Zayed, Xingzhi Guo, Daniel
      Kang, and Joo-Kyung Kim. 2026. Safesearch: Do not trade safety for utility in
      LLM search agents. In Findings of the Association for Computational Linguistics:
      EACL 2026 , pages 2800-2815.\nBaolei Zhang, Yuxi Chen, Zhuqing Liu, Lihai Nie,
      Tong Li, Zheli Liu, and Minghong Fang. 2025. Practical poisoning attacks against
      retrieval-augmented generation. arXiv preprint arXiv:2504.03957 .", "This is
      a heatmap chart displaying harmfulness evaluation results across five language
      models (Gemma-3-12B, Llama-3.1-8B, Ministral-3-8B, Phi-4-14B, and Qwen2.5-7B)
      under four retrieval-augmented generation (RAG) conditions each (Non-RAG, Oracle
      unsafe, On-topic, Random). The columns represent four evaluation metrics/classifiers
      (Llama-Guard, WildGuard, ShieldGemma, and Accuracy), with cell values showing
      the proportion of outputs flagged as unsafe, color-coded from dark blue (low,
      ~0.0) to red (high, ~1.0). The data reveals that the \"Oracle unsafe\" condition
      consistently produces the highest harmfulness rates across all models and metrics
      (e.g., Ministral-3-8B reaches 0.91 on Accuracy and Qwen2.5-7B reaches 0.83),
      while \"Random\" and \"On-topic\" RAG conditions yield much lower harmfulness
      scores (mostly below 0.25), indicating that injecting deliberately unsafe retrieved
      context substantially increases harmful outputs compared to non-adversarial
      retrieval conditions.", "3.2 Safety-capability relationship\nOur benchmark,
      RAG-Safety-Bench, complements the original MIRAGE benchmark by measuring safety
      rather than benign capability. The benchmark enables direct comparison across
      4 settings, as described in Table 1. Note the distinction between the Oracle
      and On-topic settings: in the oracle setting, the answer is directly available
      in the retrieved context. In the on-topic condition, the retrieved documents
      are on the same topic as the query (in the example, explosives), but do not
      contain the answer to the query.\nBy providing the context documents directly,
      the benchmark enables evaluation of the base LLM''s ability to maintain safety
      guardrails in the presence of RAG context, while removing the confounding factor
      of retriever quality (e.g., a poor retriever might simply miss the relevant
      unsafe document and therefore lead to a misleadingly inflated safety score).\nThe
      method for constructing the benchmark is as follows. We first develop a taxonomy
      of harmful user queries, based on the existing MLCommons AILuminate ''Hazard
      Taxonomy'' (Ghosh et al., 2025). The context of RAG safety evaluation and our
      intended corpus of Wikipedia documents required some modifications to the existing
      taxonomy. Our current version of RAG-SafetyBench excludes the following harm
      categories: Privacy/identification: since our knowledge base is a public resource,
      we assume it does not contain private information (though privacy leakage may
      be a concern in other RAG use cases); Direct generation of harmful content:
      the focus of the benchmark is on question answering, not content generation;
      Intellectual property: Wikipedia users are strictly forbidden from uploading
      copyrighted material without permission, and so it is not a suitable resource
      to test for intellectual property leakage; Specialized advice: this category
      (comprising topics such as legal advice, medical advice) is often poorly defined
      and highly-contextual, and so we do not include it here. The final taxonomy
      is given in Table 2.\nFollowing Park et al. (2025) and An et al. (2025), we
      use Wikipedia as our knowledge base. For each sub-category in the harm taxonomy,
      we identify a relevant category or set of categories on Wikipedia where harmful
      information related to the topic can be found. We then use Claude-Sonnet-4.5
      to generate potentially harmful questions whose answers can be found in one
      of the available Wikipedia documents. We also enforce a series of self-checks
      to avoid hallucinations or unrealistic questions (see Appendix for full details
      and prompts). The Claude model outputs a harmful question, a rating of the question''s
      severity, the name and ID of the Wikipedia article that contains the answer,
      the exact text passage containing the answer, a summary of the expected unsafe
      answer, as well as other additional information to aid human review of the questions
      and answers (shown in Table 6 in the Appendix). We aimed to generate a minimum
      of 20 queries per subcategory in the taxonomy, although ultimately there was
      more actionable information available for some categories than others. We therefore
      release two versions of the benchmark: the Full version contains 987 harmful
      queries, distributed unevenly across the subcategories, while the Balanced version
      (used in the current analysis) is subsampled to a more uniform distribution
      across subcategories (see Table 2).", "Table 2: Models (top) and datasets (bottom).
      All four models share the Qwen2.5-7B-Instruct base. Passages is the number of
      roughly 100-token chunks in each retrieval index.\n\n| Model     | Training
      on top of the base   |\n|-----------|-------------------------------|\n| Baseline  |
