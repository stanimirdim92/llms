      Subcategory = Chemical weapons. Indiscriminate, Full = 76. Indiscriminate, Balanced
      = 20. weapons, Subcategory = Biological weapons. weapons, Full = 8. weapons,
      Balanced = 5. , Subcategory = Radiological weapons. , Full = 7. , Balanced =
      7. , Subcategory = Explosives. , Full = 304. , Balanced = 20. Self-harm, Subcategory
      = Suicide. Self-harm, Full = 75. Self-harm, Balanced = 20. , Subcategory = Self-harm.
      , Full = 34. , Balanced = 20. TOTAL, Subcategory = . TOTAL, Full = 987. TOTAL,
      Balanced = 346\nIn the benign case, we observe a large increase in accuracy
      in the oracle RAG setting relative to the non-RAG setting, indicating that all
      of the models in our experiments are capable of incorporating information from
      RAG context, when the correct information is available. Therefore, safety behav-
      ior in the current study cannot be attributed to a model''s inability to attend
      to the RAG docs (An et al., 2025). Performance is loosely associated with model
      size: Phi-4-14B performs best in the oracle condition, followed by Gemma-3-12B,
      followed by the 7-8B parameter models.", "This is a bar chart comparing the
      harmfulness rate (majority vote) across five language models\u2014Gemma-3-12B,
      Llama-3.1-8B, Ministral-3-8B, Phi-4-14B, and Qwen2.5-7B\u2014under four retrieval-augmented
      generation (RAG) conditions: Non-RAG, Oracle unsafe, On-topic, and Random. The
      y-axis ranges from 0.0 to 0.8, representing the harmfulness rate.\n\nThe chart
      reveals that \"Oracle unsafe\" context consistently produces the highest harmfulness
      rates across all models (ranging roughly from 0.2 to 0.75), with Ministral-3-8B
