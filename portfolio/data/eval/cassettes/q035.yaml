      (text, page 1)\",\"citations\":{\"enabled\":true}},{\"type\":\"document\",\"source\":{\"type\":\"text\",\"media_type\":\"text/plain\",\"data\":\"1
      Introduction\\n'Never memorize something that you can look up.'\\n-Albert Einstein\\nRetrieval-Augmented
      Generation (RAG) extends the knowledge boundaries of Multimodal Large Language
      Models (MLLMs) by retrieving relevant information from external knowledge bases
      (Wang, 2026; Fan et al., 2026; Hu et al., 2026). Recent advances in MLLMs have
      convincingly demonstrated that multimodal agentic RAG systems are capable of
      efficient retrieval and reasoning over large-scale corpora comprising interleaved
      textual and visual content (Zhang et al., 2026; Guan et al., 2025). MLLM-based
      multi-agent architectures, leveraging specialized collaboration among components,
      exhibit superior performance over single-agent frameworks on complex multimodal
      RAG tasks (Zhou et al., 2026; Chang et al., 2025; Xu et al., 2025b).\\n\u2020
      Corresponding author.\\nFigure 1: Comparison between our GraMRAG and existing
      multi-agent RAG systems.\\nHowever, existing multi-agent RAG systems face three
      key limitations. First, the average number of retrieval rounds in current systems
      remains limited, predisposing agents to prematurely terminate exploration and
      settle for partially available evidence on complex tasks (Jiang et al., 2025;
      Wu et al., 2025a; Team et al., 2025). This fundamentally impedes the transfer
      of the long-horizon planning capability from text-based deep research to multimodal
      scenarios, rendering these systems inadequate for tens of iterative reasoning
      steps demanded by real-world deep research. Second, prevailing linear or iterative
      summarization-based memory structures (Yao et al., 2022; Zhou et al., 2025;
      Xu et al., 2025a; Wu et al., 2025b), lacking explicit modeling of agent reasoning
      states, are prone to context expands and state blindness as interaction rounds
      accumulate, resulting in repetitive queries and redundant retrieval in multi-hop
      tasks. Third, conventional outcome-based sparse rewards coarsely propagate terminal-state
      signals across entire trajectories (Huang et al., 2026; Zhou et al., 2025),
      causing effective retrieval steps to be erroneously penalized in negative samples
      while redundant operations are undeservedly rewarded in positive ones, preventing
      fine-grained credit assignment across multi-step reasoning.\"},\"title\":\"2609.14066v1.pdf
      [01a0aa96b5ef7053a767b8ddabb5a961-afd90130549e21e7d5d373e21bd00946] (text, page
      1)\",\"citations\":{\"enabled\":true}},{\"type\":\"document\",\"source\":{\"type\":\"text\",\"media_type\":\"text/plain\",\"data\":\"1
      Introduction\\nTo address the mentioned limitations, we propose GraMRAG, a novel
      graph memory-guided multi-agent RAG framework. First, to bridge the long-horizon
      reasoning gap, we introduce a visiontext bridged reasoning paradigm that orchestrates
      multi-scale entity cropping with a ReAct-style visual toolchain, seamlessly
      transferring the iterative planning capability of text-only deep research models
      into the multimodal domain to enable longhorizon cross-modal reasoning trajectories.
      Second, to overcome state blindness and context expansion in linear memory paradigms,
      we construct a multimodal memory graph that formalizes the reasoning process
      as a dynamic directed acyclic graph (DAG), explicitly encoding agent actions
      and multimodal observations with their temporal and logical dependencies to
      mitigate redundant retrieval and state blindness. Third, to tackle the credit
      assignment problem from coarse terminal rewards, we introduce a Topology-Aware
      Policy Optimization (TAPO) algorithm that leverages the graph topology to identify
      critical reasoning paths and perform targeted node pruning, precisely masking
      false positive and false negative nodes during policy updates to enable fine-grained
      credit assignment across multi-step reasoning.\\nOur contributions are summarized
      as follows:\\n- We introduce a vision-text bridged reasoning paradigm that unifies
      multi-scale entity cropping with a ReAct-style visual toolchain, enabling long-horizon
      cross-modal reasoning.\\n- Weconstruct a multimodal memory graph that formalizes
      agent reasoning as a dynamic DAG to systematically mitigate state blindness
      and redundant retrieval.\\n- We develop a TAPO algorithm leveraging graph topology
      for critical path identification and node pruning, enabling fine-grained credit
      assignment across multi-step reasoning.\\n- We conduct extensive experiments
      on challenging multimodal benchmarks to evaluate our approach, demonstrating
      state-of-the-art performance over existing baselines.\"},\"title\":\"2609.14066v1.pdf
      [01a0aa96b5ef7053a767b8ddabb5a961-afd90130549e21e7d5d373e21bd00946] (text, page
      2)\",\"citations\":{\"enabled\":true}},{\"type\":\"document\",\"source\":{\"type\":\"text\",\"media_type\":\"text/plain\",\"data\":\"Retrieval
      quality depends on reasoning depth.\\nHigh-quality answer generation in complex
      multimodal tasks depends on sustaining precise multiround retrieval across a
      long reasoning horizon. Traditional memory paradigms cause agents to progressively
      lose track of historical retrieval paths and accumulate redundant searches that
      severely constrain effective reasoning depth. GraMRAG addresses this by transferring
      the iterative planning capability into the multimodal domain via the vision-text
      bridged reasoning paradigm, supporting trajectories spanning tens of steps;
      the multimodal memory graph further encodes action-observation dependencies
      explicitly, directing each retrieval attempt precisely toward unexplored evidence
      space. As shown in Figure 5, this design yields substantially higher hit rate
      across all three task categories, directly validating the decisive role of long-horizon
      reasoning depth in determining retrieval quality.\\nGraph memory mitigates state
      blindness. The dynamic DAG representation of the multimodal memory graph explicitly
      encodes actionobservation dependencies as directed edges, enabling each agent
      to efficiently access the complete historical reasoning trajectory and effectively
      mitigating state blindness. As shown in Table 2, replacing iterative summarization-based
      memory with the multimodal memory graph yields a 3.3point performance improvement,
      validating that the multimodal memory graph effectively mitigates state blindness
      and suppresses redundant retrieval, confirming the necessity of structured memory
      in long-horizon multimodal reasoning.\\nFigure 6: Analysis of training efficiency.\\nGraph
      pruning accelerates training convergence. As demonstrated in Figure 6, TAPO
      achieves faster convergence throughout training compared to the baseline Group
      Sequence Policy Optimization (GSPO) (Zheng et al., 2025), indicating that topology-guided
      graph pruning drives the model toward faster convergence by supplying cleaner
      credit assignment signals. This yields two critical insights into agentic reinforcement
      learning: first, optimization stability fundamentally depends on ensuring correct
      positive gradient signals while eliminating ambiguous updates from negative
      trajectories; second, the quality of rollout samples, specifically their preference
      alignment, is more decisive for performance than simply scaling up the training
      set. By simultaneously masking dead-end nodes in positive trajectories and preserving
      valuable nodes in negative ones, TAPO achieves finegrained step-level credit
      assignment rather than coarse terminal-reward-level optimization.\"},\"title\":\"2609.14066v1.pdf
      [01a0aa96b5ef7053a767b8ddabb5a961-afd90130549e21e7d5d373e21bd00946] (text, page
      8)\",\"citations\":{\"enabled\":true}},{\"type\":\"text\",\"text\":\"What limitation
      does GraMRAG acknowledge?\"}]}],\"model\":\"claude-sonnet-5\",\"system\":\"You
