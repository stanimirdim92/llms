- request:
    body: '{"query": "What limitation does GraMRAG acknowledge?", "documents": ["7
      Limitations\nAlthough GraMRAG achieves significant performance improvements
      on complex multimodal multi-step reasoning tasks, the multi-agent collaboration
      framework introduces some inference overhead compared to traditional RAG approaches.
      Notably, such a trade-off is generally acceptable in deep research scenarios
      where users prioritize reasoning accuracy over response speed. Nevertheless,
      it may hinder direct deployment in resourceconstrained environments. Therefore,
      optimizing the interaction strategy among agents and designing more efficient
      lightweight graph memory mechanisms constitute key directions for future work.",
      "Limitations\nThe current findings must be interpreted with the following limitations
      in mind. RAG-Safety-Bench is English-only, considers only one document source
      (Wikipedia), and covers a non-exhaustive set of possible harm categories. Further
      work is required to understand how retrieval-enabled LLMs behave in languages
      other than English and in multiple use contexts. The current study highlighted
      how assessments of safety can be subjective; clearly, the type of potentially
      dangerous information that can be returned to a trained intelligence officer
      versus a layperson versus a schoolchild are very different and such use cases
      must be assessed separately.\nBy design, our benchmark does not evaluate the
      impact of the retriever in the RAG system. However, and end-to-end evaluation
      would also need to assess interactions between retriever ranking, query reformulation,
      and generator safety. Our benchmark also represents a simplified view of RAG
      methodology, while production RAG systems would likely include additional safety
      components, such as system-level safety instructions and input/output filters.\nOur
      testing suite of models included only opensource models, and relatively small
      models due to computing resource constraints. Again, real-world RAG deployments
      will likely use much larger commercial models. We note that our RAG-SafetyBench
      benchmark can be used to evaluate such models, and that our reason for not doing
      so was to avoid being banned for Terms-of-Service violations. We encourage researchers
      with internal access to such models to use our benchmark and publish the results.\nOur
      methodology for benchmark generation and automated assessment relies heavily
      on the Claude family of models from Anthropic. While we did conduct human evaluations
      to validate Claude''s performance, a more robust (though expensive) methodology
      could combine multiple strong LLM judges in an ensemble. Furthermore, we evaluate
      on a single run of the benchmark, but due to the stochastic nature of LLM generation,
      the results might differ across multiple runs.", "1 Introduction\n''Never memorize
      something that you can look up.''\n-Albert Einstein\nRetrieval-Augmented Generation
      (RAG) extends the knowledge boundaries of Multimodal Large Language Models (MLLMs)
      by retrieving relevant information from external knowledge bases (Wang, 2026;
      Fan et al., 2026; Hu et al., 2026). Recent advances in MLLMs have convincingly
      demonstrated that multimodal agentic RAG systems are capable of efficient retrieval
      and reasoning over large-scale corpora comprising interleaved textual and visual
      content (Zhang et al., 2026; Guan et al., 2025). MLLM-based multi-agent architectures,
      leveraging specialized collaboration among components, exhibit superior performance
      over single-agent frameworks on complex multimodal RAG tasks (Zhou et al., 2026;
      Chang et al., 2025; Xu et al., 2025b).\n\u2020 Corresponding author.\nFigure
      1: Comparison between our GraMRAG and existing multi-agent RAG systems.\nHowever,
      existing multi-agent RAG systems face three key limitations. First, the average
      number of retrieval rounds in current systems remains limited, predisposing
      agents to prematurely terminate exploration and settle for partially available
      evidence on complex tasks (Jiang et al., 2025; Wu et al., 2025a; Team et al.,
      2025). This fundamentally impedes the transfer of the long-horizon planning
      capability from text-based deep research to multimodal scenarios, rendering
      these systems inadequate for tens of iterative reasoning steps demanded by real-world
      deep research. Second, prevailing linear or iterative summarization-based memory
      structures (Yao et al., 2022; Zhou et al., 2025; Xu et al., 2025a; Wu et al.,
      2025b), lacking explicit modeling of agent reasoning states, are prone to context
      expands and state blindness as interaction rounds accumulate, resulting in repetitive
      queries and redundant retrieval in multi-hop tasks. Third, conventional outcome-based
      sparse rewards coarsely propagate terminal-state signals across entire trajectories
      (Huang et al., 2026; Zhou et al., 2025), causing effective retrieval steps to
      be erroneously penalized in negative samples while redundant operations are
      undeservedly rewarded in positive ones, preventing fine-grained credit assignment
      across multi-step reasoning.", "9 Limitations\nEvaluator dependence. Primary
      scores use DeBERTa-v3-base, trained on MNLI, FEVER, and ANLI, at \u03c4 = 0
      . 5 , without human calibration. Using the same model to select recovered spans
      and score support can reinforce systematic errors; the resulting scores are
      evaluator-dependent estimates, not validated rates of source support or factual
      correctness. This dependence also limits conclusions about method rankings and
      the size of emitted-grounded gaps. The 200-question TRUE audit checks a second
      scoring family, but fixed recovery retains DeBERTa selection and TRUE recovery
      reuses one judge. Different input windows and nonbinary decoder outputs further
      limit numerical comparison. Human source-level calibration remains necessary
      (Rashkin et al., 2023).\nSingle generator. All results use Qwen2.5-7BInstruct
      with greedy decoding. Frontier shapes may differ across model families and scales;
      a second-family replication is planned.\nDataset coverage. We evaluate two English
      datasets (ASQA and QASPER) with distinct retrieval granularities, but this does
      not cover multilingual settings, open-web retrieval, or longercontext regimes.\nRe-attribution
      hyperparameters. The top-10 lexical candidate pool can miss semantically matching
      snippets, and requiring one snippet to entail a unit can miss support distributed
      across snippets. Consequently, a failed recovery does not establish that the
      source contains no support. Table 3 varies the recovery threshold while holding
      the scoring threshold fixed; it does not validate the evaluator or test candidate-pool
      size, retrieval strategy, or multi-snippet recovery.\nVerification scope. Declared-span
      verification rejects claims lacking declared evidence by construction, even
      if support could be recovered. Its 1 . 00 unsupported rate for no-provenance
      runs is a provenance-availability diagnostic, not a calibrated hallucination
      rate. Recovered-source verification is reported at nominal 0.25 for the two
      no-provenance methods and remains dependent on the same bounded recovery procedure
      and evaluator.\nResidual error rows. Only identity fails on 4 ASQA and 29 QASPER
      questions; every primary setting is evaluated on the resulting common successful
      subset. This pairing prevents comparisons from using different questions, but
      conditions results on identity success and omits those difficult cases. Sampling
      intervals condition on the fixed generated outputs and evaluator; they do not
      include systematic NLI error or variation across generation runs.\nNominal versus
      achieved budgets. Abstractive compressors do not reliably hit nominal token
      budgets; RECOMP often produces much less context than requested. We report achieved
      compression ratios, but comparisons at a shared nominal budget do not establish
      performance at matched achieved context sizes.", "Limitations\nEvaluation format
      differs from training. The RLVR agents were trained to search, read, and answer
      across multiple turns in their own tagged format, whereas our evaluation supplies
      five fixed passages and requests a single citation-bearing response. This was
      necessary for the controlled attribution comparison, but it may affect how the
      agents behave: for example, an agent that would normally issue another query
      may instead abstain. The large differences in abstention and format compliance
      are consistent with this possibility, although our data cannot establish the
      mechanism. An interactive evaluation would be needed to determine whether the
      attribution effect differs in the agents'' native search setting.\nWe cannot
      isolate RL itself. Each agent differs from the baseline in three ways at once:
      it was fine-tuned at all, fine-tuned on retrieval data, and fine-tuned with
      reinforcement learning. Without an arm fine-tuned on the same data without RL,
      our comparison is associational. This is the single most valuable addition a
      follow-up could make.\nSearch-R1 saw NQ in training. It was trained on NQ''s
      training split and we evaluate it on KILTNQ. QAMPARI, HAGRID, and RAGTruth are
      clean for all three agents, and R-Search''s pattern is in fact strongest away
      from NQ, but we have not quantified the overlap.\nThe span always lands at the
      end of the passage. Any positional bias in how models pick citations is therefore
      mixed in with the effect of the plant. Randomizing the injection point is the
      obvious next experiment.\nCITED-OTHER is underpowered outside RAGTruth. NQ,
      QAMPARI, and HAGRID yield only 13-43 question clusters for this variant, too
      few for intervals we would defend. RAGTruth alone is large enough.\nWhat a flag
      means. Our scorer is deterministic string matching, so each flag is exactly
      reproducible: the model cited the doctored passage for the aligned claim. Reading
      that as postrationalization is an interpretation we inherit from Wallat et al.
      (2025), and a competing reading exists. After planting, the claim''s words genuinely
      sit in the doctored passage, so citing it could be scored as obedience to ''answer
      from the passages'' rather than as unfaithfulness. Hand-checking a sample of
      flagged cases would settle how often each reading applies, and we have not done
      it.\nScope. Three RLVR agents from one line of work, one base model, English
      only, one prompt, one decoding setting. Citation behavior may well shift with
      the prompt, so our numbers describe this setup until someone varies it.", "Ethics
      Statement\nThis work uses only publicly released models and datasets. It involves
      no human subjects and no personal data. The planted spans are taken from the
      models'' own answers and are used only in offline evaluation. The work describes
      a way that citations in RAG systems can mislead readers, with the aim of making
      that failure measurable; it does not provide a method for attacking deployed
      systems. Because RLVR training is in wide use, we have tried to state the limits
      of our null result clearly so that it is not read as a stronger claim than the
      data support.", "5.2 Post-rationalization is common\nRAGTruth stands apart,
      two to five times lower than the rest for every model. Prompt, scorer, and citation
      format are identical across datasets, so the gap belongs to the data. Its passages
      are web text rather than Wikipedia and its answers run longer, and we cannot
      say from four datasets which of those matters. The practical reading is that
      postrationalization rates are domain-dependent, so a single-corpus number should
      not be quoted as a property of a model.", "1 Introduction\nTo address the mentioned
      limitations, we propose GraMRAG, a novel graph memory-guided multi-agent RAG
      framework. First, to bridge the long-horizon reasoning gap, we introduce a visiontext
      bridged reasoning paradigm that orchestrates multi-scale entity cropping with
      a ReAct-style visual toolchain, seamlessly transferring the iterative planning
      capability of text-only deep research models into the multimodal domain to enable
      longhorizon cross-modal reasoning trajectories. Second, to overcome state blindness
      and context expansion in linear memory paradigms, we construct a multimodal
      memory graph that formalizes the reasoning process as a dynamic directed acyclic
      graph (DAG), explicitly encoding agent actions and multimodal observations with
      their temporal and logical dependencies to mitigate redundant retrieval and
      state blindness. Third, to tackle the credit assignment problem from coarse
      terminal rewards, we introduce a Topology-Aware Policy Optimization (TAPO) algorithm
      that leverages the graph topology to identify critical reasoning paths and perform
      targeted node pruning, precisely masking false positive and false negative nodes
      during policy updates to enable fine-grained credit assignment across multi-step
      reasoning.\nOur contributions are summarized as follows:\n- We introduce a vision-text
      bridged reasoning paradigm that unifies multi-scale entity cropping with a ReAct-style
      visual toolchain, enabling long-horizon cross-modal reasoning.\n- Weconstruct
      a multimodal memory graph that formalizes agent reasoning as a dynamic DAG to
      systematically mitigate state blindness and redundant retrieval.\n- We develop
      a TAPO algorithm leveraging graph topology for critical path identification
      and node pruning, enabling fine-grained credit assignment across multi-step
      reasoning.\n- We conduct extensive experiments on challenging multimodal benchmarks
      to evaluate our approach, demonstrating state-of-the-art performance over existing
      baselines.", "4.3 Comparison with State-of-the-Art Methods\nWe compare GraMRAG
      against representative baselines: ReAct (Yao et al., 2022) iteratively invokes
      external retrieval tools in a think-then-act paradigm; Vanilla RAG uses the
      original question as a query and performs direct MLLM inference over retrieved
      results; UniversalRAG (Yeo et al., 2025) formulates cross-modal retrieval as
      a unified routing problem; VideoRAG (Jeong et al., 2025) extracts significant
      visual information via key-frame selection; MemAgent (Yu et al., 2025) manages
      context by sequentially feeding search results to the model; Mem1 (Zhou et al.,
      2025) dynamically compresses agent memory through a cyclical retrievalthen-memorization
      process; and VimRAG (Wang et al., 2026) models reasoning process to manage large-scale
      multimodal contexts.\nAs presented in Table 1, linear history accumula- tion
      paradigms such as ReAct rapidly exhaust the context window under the heavy token
      overhead of visual data; task-specific methods including VideoRAG and UniversalRAG
      exhibit limited generalizability due to fixed inference pipelines; and summarization-based
      memory paradigms such as MemAgent and Mem1, lacking explicit modeling of agent
      reasoning states, progressively lose track of historical retrieval paths as
      interaction rounds accumulate; and VimRAG models the reasoning process but lacks
      long-horizon reasoning capability. Our GraMRAG achieves consistently state-of-theart
      performance across all benchmarks, achieving overall average scores of 48.5%
      and 53.5% under the Qwen3-VL-4B-Instruct and Qwen3-VL8B-Instruct settings respectively,
      validating the effectiveness of formalizing the multi-step reasoning process
      as a dynamic DAG with topologydriven fine-grained credit assignment for multimodal
      knowledge-intensive reasoning tasks.\nTable 2: Ablation study across all benchmarks.\n\n\u2713
      \u2713 \u2713 \u2713 \u2713, Memory Iterative = \u2713 \u2713. \u2713 \u2713
      \u2713 \u2713 \u2713, Paradigm Graph = \u2713 \u2713 \u2713. \u2713 \u2713 \u2713
      \u2713 \u2713, Policy GRPO = \u2713. \u2713 \u2713 \u2713 \u2713 \u2713, Optimization
      TAPO = \u2713. \u2713 \u2713 \u2713 \u2713 \u2713, Acc = 43.8 44.2 47.5 49.3
      53.5", "4.4 Ablation Study\nTo validate the contribution of each component in
      GraMRAG, we conduct ablation studies across all benchmarks. As shown in Table
      2, the three components exhibit clear progressive complementarity: long-horizon
      reasoning enables sustained multiround retrieval across extended cross-modal
      rea- soning trajectories; the multimodal memory graph demonstrates that formalizing
      reasoning as a dynamic DAG effectively mitigates state blindness and suppresses
      redundant retrieval; and replacing the standard sparse-reward method Group Relative
      Policy Optimization (GRPO) (Shao et al., 2024) with TAPO delivers a further
      improvement, directly confirming the critical role of topology-guided credit
      assignment in fine-grained policy optimization. The complete model achieves
      an average score of 53.5%, an improvement of over 9 points above the baseline,
      comprehensively validating the necessity and complementarity of each component.\nFigure
      5: Analysis of retrieval performance.", "Retrieval quality depends on reasoning
      depth.\nHigh-quality answer generation in complex multimodal tasks depends on
      sustaining precise multiround retrieval across a long reasoning horizon. Traditional
      memory paradigms cause agents to progressively lose track of historical retrieval
      paths and accumulate redundant searches that severely constrain effective reasoning
      depth. GraMRAG addresses this by transferring the iterative planning capability
      into the multimodal domain via the vision-text bridged reasoning paradigm, supporting
      trajectories spanning tens of steps; the multimodal memory graph further encodes
      action-observation dependencies explicitly, directing each retrieval attempt
      precisely toward unexplored evidence space. As shown in Figure 5, this design
      yields substantially higher hit rate across all three task categories, directly
      validating the decisive role of long-horizon reasoning depth in determining
      retrieval quality.\nGraph memory mitigates state blindness. The dynamic DAG
      representation of the multimodal memory graph explicitly encodes actionobservation
      dependencies as directed edges, enabling each agent to efficiently access the
      complete historical reasoning trajectory and effectively mitigating state blindness.
      As shown in Table 2, replacing iterative summarization-based memory with the
      multimodal memory graph yields a 3.3point performance improvement, validating
      that the multimodal memory graph effectively mitigates state blindness and suppresses
      redundant retrieval, confirming the necessity of structured memory in long-horizon
      multimodal reasoning.\nFigure 6: Analysis of training efficiency.\nGraph pruning
      accelerates training convergence. As demonstrated in Figure 6, TAPO achieves
      faster convergence throughout training compared to the baseline Group Sequence
      Policy Optimization (GSPO) (Zheng et al., 2025), indicating that topology-guided
      graph pruning drives the model toward faster convergence by supplying cleaner
      credit assignment signals. This yields two critical insights into agentic reinforcement
      learning: first, optimization stability fundamentally depends on ensuring correct
      positive gradient signals while eliminating ambiguous updates from negative
      trajectories; second, the quality of rollout samples, specifically their preference
      alignment, is more decisive for performance than simply scaling up the training
      set. By simultaneously masking dead-end nodes in positive trajectories and preserving
      valuable nodes in negative ones, TAPO achieves finegrained step-level credit
      assignment rather than coarse terminal-reward-level optimization.", "2.2 Memory
      Structures of Agent Systems\nThe memory architectures of existing agent systems
      can broadly be categorized into two paradigms (Zhang et al., 2025b; Ye et al.,
      2025): the history accumulation paradigm, exemplified by ReAct (Yao et al.,
      2022), which linearly concatenates all interaction records, and the iterative
      summarization paradigm, exemplified by Mem1 (Zhou et al., 2025), which controls
      context length by compressing observations. However, as the number of interaction
      rounds grows, both paradigms cause agents to progressively lose track of historical
      retrieval paths, a phenomenon we term state blindness, which in turn induces
      redundant queries and repetitive retrieval in multi-hop tasks. To address this
      issue, we construct a multimodal memory graph that formalizes the reasoning
      process as a dynamic DAG, explicitly encoding the temporal and logical dependencies
      between actions and observations, thereby effectively mitigating state blindness
      and redundant retrieval.\nFigure 2: Overview of the GraMRAG framework.\ngenerate
      the next search context, producing the visual reasoning trajectory:\n<!-- formula-not-decoded
      -->\nwhere R t denotes the chain-of-thought reasoning generated prior to action
      A v t , and T v is the total number of visual retrieval steps.\nFollowing each
      visual retrieval action, an independent Hit/No Hit Judge evaluates the observation
      O v t obtained at the current step, conditioned on the original image I and
      query q , outputs a binary acceptance signal:\n<!-- formula-not-decoded -->\nWhen
      s t = 1 (Hit), the retrieval is considered successful, meaning the retrieved
      content is semantically consistent with the query entity, and O v t is added
      into the accumulated valid evidence pool:\n<!-- formula-not-decoded -->\nWhen
      s t = 0 (No Hit), the retrieval is considered unsuccessful, triggering the Visual
      Explorer to recrop at a finer spatial granularity or to reformulate the search
      query before initiating a new retrieval attempt. The visual exploration phase
      terminates", "Abstract\nAlthough existing multi-agent RetrievalAugmented Generation
      (RAG) systems have demonstrated promise on complex multimodal reasoning tasks,
      they remain fundamentally limited in reasoning depth and memory structure, suffering
      from inadequate retrieval and state blindness when answering knowledge-intensive
      questions. To address these limitations, we propose GraMRAG, a graph memory-guided
      multi-agent RAG framework that integrates a dynamic multimodal memory graph
      to enable stable, multi-step multimodal reasoning. We introduce a visiontext
      bridged reasoning paradigm that unifies multi-scale entity cropping with a ReAct-style
      visual toolchain, enhancing the long-horizon cross-modal reasoning capability.
      We further construct a multimodal memory graph that formalizes agent reasoning
      as a dynamic directed acyclic graph (DAG), explicitly modeling action-observation
      dependencies to mitigate state blindness and suppress redundant retrieval. Moreover,
      we propose Topology-Aware Policy Optimization (TAPO) that leverages graph topology
      for critical path identification and targeted node pruning, enabling fine-grained
      credit assignment across multi-step reasoning trajectories. Extensive experiments
      on challenging multimodal benchmarks demonstrate that our approach consistently
      outperforms existing baselines and achieves state-of-the-art performance on
      complex long-horizon reasoning tasks.", "6 Conclusion\nIn this paper, we introduce
      GraMRAG, a novel graph memory-guided multi-agent RAG framework for complex multimodal
      long-horizon reasoning tasks. Our approach integrates three key innovations:
      a vision-text bridged reasoning paradigm that unifies multi-scale entity cropping
      with a ReActstyle visual toolchain for long-horizon cross-modal reasoning; multimodal
      memory graph construction that formalizes agent reasoning as a dynamic directed
      acyclic graph (DAG) to fundamentally mit- igate state blindness and suppress
      redundant retrieval; and Topology-Aware Policy Optimization (TAPO) algorithm
      that leverages graph topology for fine-grained credit assignment across multi-step
      reasoning trajectories. Extensive experiments on diverse multimodal benchmarks
      demonstrate that our method consistently outperforms existing baselines and
      achieves state-of-the-art performance. Future work will investigate the scalability
      of the proposed framework to larger architectures and broader multimodal scenarios.",
      "6 Conclusion\nWe introduce RAG-Safety-Bench with the goal of disentangling
      the effects of RAG on LLM safety by cleanly separating four retrieval conditions.
      Across five open-source models, our results show that the most interesting failure
      mode is model-specific: for Qwen-2.5-7B, on-topic but answer-free documents
      elicited more harmful responses than the non-RAG baseline, consistent with the
      hypothesis that topicrelevant context can surface harmful information from parametric
      memory.\nMore generally, our findings confirm that nonRAG safety evaluations
      do not transfer to RAG deployments. Our initial results from the benchmark only
      evaluate the baked-in safety guardrails of the base model. However, in a production
      system, responsible AI practitioners should provide end-toend safety measures
      including (when warranted): corpus curation, input prompt filtering, retrievalside
      filtering, output filtering, and system prompt safety instructions, among other
      possible mitigations. Thus an important use case for our benchmark is also to
      evaluate the impact of safety interventions at different points in the multi-component
      RAG pipeline. Our results also indicate the need to choose an automated safety
      evaluator which is closely aligned with the safety concerns relevant to the
      particular application, and where possible to deploy multiple safety judges,
      as well as appropriate human oversight.", "4.1 R1: Capability in safe and unsafe
      contexts\nWehypothesized (H1) that models which demonstrated higher benign RAG
      capability would also demonstrate higher unsafe RAG capability; however, this
      is not supported by the ''Unsafe capability'' data. In fact, the accuracies
      under the BenignOracle and Unsafe-Oracle conditions are negatively correlated
      (Pearson r = -0 . 70 ). This may indicate that the larger and more capable models
      also have better safety guardrails when they are presented with unsafe queries.
      However, all models are, in general, more likely to provide a correct response
      to the harmful question when the response is available in the documents, suggesting
      that guardrails still need to be improved to specifically handle the RAG setting.",
      "5 Discussion\nThe core question which motivates this work is whether safe documents
      lead to unsafe RAG generations. One possible explanation for the prior observations
      of unsafe responses in RAG systems is that the incorporation of any long context
      into an LLM can have the effect of shifting its behavior away from the basic,
      short-context regime where most of its safety training took place. However,
      our experiments do not support the conclusion that long context alone is a driver
      of unsafe behavior in RAG systems, with the ''random'' condition leading to
      the safest responses, partially through an increase in refusals due to lack
      of information.\n", "5.3 RLVR does not make citations more faithful\nRaw rates
      alone cannot answer the RL question, since a model could post-rationalize heavily
      and still be no worse than the model it came from. Table 5 therefore reports
      the difference-indifferences: each agent''s attributable rate minus its base
      model''s, on the same dataset. If RLVR taught these agents anything about grounding,
      this column would run negative.", "Conclusion\nKuratov, Y.; Arkhipov, M.; Bulatov,
      A.; and Burtsev, M. 2025. Cramming 1568 tokens into a single vector and back
      again: Exploring the limits of embedding space capacity. In Proceedings of the
      63rd Annual Meeting of the Association for Computational Linguistics (Volume
      1: Long Papers) , 19323-19339.\nKwiatkowski, T.; Palomaki, J.; Redfield, O.;
      Collins, M.; Parikh, A.; Alberti, C.; Epstein, D.; Polosukhin, I.; Devlin, J.;
      Lee, K.; Toutanova, K.; Jones, L.; Kelcey, M.; Chang, M.-W.; Dai, A. M.; Uszkoreit,
      J.; Le, Q.; and Petrov, S. 2019. Natural Questions: A Benchmark for Question
      Answering Research. Transactions of the Association for Computational Linguistics
      , 7: 452-466.\nLevy, S.; Mazor, N.; Shalmon, L.; Hassid, M.; and Stanovsky,
      G. 2025. More Documents, Same Length: Isolating the Challenge of Multiple Documents
      in RAG. In Christodoulopoulos, C.; Chakraborty, T.; Rose, C.; and Peng, V.,
      eds., Findings of the Association for Computational Linguistics: EMNLP 2025
      , 19539-19547. Suzhou, China: Association for Computational Linguistics. ISBN
      979-8-89176-335-7.\nLewis, P.; Perez, E.; Piktus, A.; Petroni, F.; Karpukhin,
