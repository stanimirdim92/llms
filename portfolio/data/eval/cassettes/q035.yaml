      undeservedly rewarded in positive ones, preventing fine-grained credit assignment
      across multi-step reasoning.\\n\\n[4] 1 Introduction\\nTo address the mentioned
      limitations, we propose GraMRAG, a novel graph memory-guided multi-agent RAG
      framework. First, to bridge the long-horizon reasoning gap, we introduce a visiontext
      bridged reasoning paradigm that orchestrates multi-scale entity cropping with
