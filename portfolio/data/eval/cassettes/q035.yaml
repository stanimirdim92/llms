      9)\",\"citations\":{\"enabled\":true}},{\"type\":\"document\",\"source\":{\"type\":\"text\",\"media_type\":\"text/plain\",\"data\":\"Abstract\\nAlthough
      existing multi-agent RetrievalAugmented Generation (RAG) systems have demonstrated
      promise on complex multimodal reasoning tasks, they remain fundamentally limited
      in reasoning depth and memory structure, suffering from inadequate retrieval
      and state blindness when answering knowledge-intensive questions. To address
      these limitations, we propose GraMRAG, a graph memory-guided multi-agent RAG
