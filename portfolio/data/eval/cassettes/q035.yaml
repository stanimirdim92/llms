      Riedel, S.; and Kiela, D. 2020. Retrieval-Augmented Generation for Knowledge-Intensive
      NLP Tasks. In Larochelle, H.; Ranzato, M.; Hadsell, R.; Balcan, M. F.; and Lin,
      H., eds., Advances in Neural Information Processing Systems , volume 33, 9459-9474.
      Curran Associates, Inc.\nLi, X.; and Ouyang, J. 2025. How Does Knowledge Selection
      Help Retrieval Augmented Generation? In Christodoulopoulos, C.; Chakraborty,
