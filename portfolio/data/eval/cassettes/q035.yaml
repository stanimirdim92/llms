      Linguistics: EMNLP 2025 , 4104-4121. Suzhou, China: Association for Computational
      Linguistics. ISBN 979-8-89176-335-7.", "3.1 Benign capability\nTo test the general
      capability of each of the models in our study we use the MIRAGE benchmark (Park
      et al., 2025). This benchmark was designed to test RAG model capabilities under
      different settings: Oracle contexts provide a best-case setting in which the
      answer-bearing evidence is available, while mixed contexts introduce distractors
      while retaining a capped amount of answer-bearing evidence. In the current study,
      we use a subset of 1000 queries from MIRAGE, under the two settings, to evaluate
      general RAG capability."], "model": "rerank-2.5", "top_k": 5, "truncation":
