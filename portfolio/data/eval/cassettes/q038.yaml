      |  0.95 |\n| LLMLingua-2   |  0.25 |  0.11 |  0.42 |  1.00 |  0.65 |  0.91 |",
      "4.2 Statistical Analysis and Metric Audit\nCommon cohorts and estimands. Primary
      summaries and comparisons use the intersection of successful question IDs across
      identity and all twenty compressed settings. Each question has equal weight
      in citation precision, citation recall, answer quality, and evidence F1; claims
      and citations are not pooled across questions. Undefined evidence or recovery
      metrics remain undefined rather than becoming zeros. Verification-rate means
      exclude answers with zero claims; paired verification comparisons exclude a
      question if ei- ther member has zero claims. The analysis artifacts report those
      exclusions and retain full-cohort descriptive means separately.\nInference.
      We use pointwise 95% percentile bootstrap intervals for each paired mean difference
      (Dror et al., 2018), resampling 944 questions on ASQA and 271 papers on QASPER
      with replacement. All retained questions from a sampled QASPER paper travel
      together, and each replicate divides its total difference by the number of sampled
      questions, preserving the questionweighted estimand. Every QASPER contrast retains
      all 271 papers after metric-specific exclusions. Two-sided randomization tests
      swap paired labels within questions on ASQA and jointly within papers on QASPER.
      These tests assume label exchangeability within a resampling unit under the
      null. Both procedures use 10,000 replicates and seed 13, with independent random-number
      streams for bootstrap sampling and randomization. Monte Carlo p -values use
      ( b + 1) / (10 , 000 + 1) , where b counts randomizations at least as extreme
      as the observed absolute difference. The initial plan specified 134 core contrasts
      and 10 recoverythreshold contrasts before inspecting the revised inferential
      results. After that analysis and a cachecoverage audit, we added four recovered-source
      versus summary-verification contrasts at nominal 0.25 for RECOMP and LLMLingua-2
      on both datasets. The extension plan was recorded before running these four
      tests, and Holm adjustment was recomputed over all 148 raw p -values. We denote
      Holm-adjusted values by p H . All reported adjusted values use this expanded
      family; original effects, intervals, and raw p -values are unchanged. This is
      a post hoc camera-ready analysis, not a preregistration. Intervals are pointwise,
      not simultaneous; statistical-support statements use p H < 0 . 05 . Failure
      to reject a difference does not establish equivalence or preservation. All inference
      is conditional on the fixed generator outputs, recovery procedure, and evaluator.\nPrecision-code
      audit. The manuscript''s precision definition requires the concatenated cited
      evidence to entail a claim before any individual citation receives credit. A
      code audit found that the previous implementation could credit an individually
      supporting citation even when joint entailment failed. A saved ASQA answer reproduced
      this discrepancy, and a regression test now checks the required gate through
      the evaluation pipeline.\n", "7 Discussion\nWhat laundering looks like. Consider
      an ASQA example under RECOMP at nominal budget 0.25. Asked ''How many state
      parks are there in Virginia?'' , the generator answers ''There are 34 state
      parks in Virginia [1]'' , while Document [1] states ''Virginia has 34 state
      parks and 17 state forests . . . '' . The citation receives full emitted precision,
      but Document [1] is the compressor''s summary with no declared source link.
      In another example, the answer ''The man who killed [them] is not mentioned
      in the retrieved documents [1]'' cites a summary containing that same assertion
      of absence. Both illustrate consistency with intermediate text without a declared
      path to source evidence; neither example alone establishes an independently
      verified hallucination.\nImplications for practice. Five operational recommendations
      follow from this evaluation setup. (1) Verify against source spans: consistency
      with compressor output does not establish support from locatable evidence. Report
      whether spans are declared or recovered and how support is judged. (2) Report
      achieved compression: nominal fractions overstate achieved context size by up
      to 32.8fold here (Section 4.1). (3) Include verification in cost reporting:
      report generator and verifier input lengths together, while identifying which
      other costs remain unmeasured (Table 2). Zero declaredspan cost can mean that
      no evidence reached the verifier. (4) Evaluate post-hoc recovery explicitly:
      missed recovery can reflect search errors or missing support (Section 6). (5)
      Document citable-unit granularity: comparisons differ in their source units
      as well as their datasets. Controlled ablations are needed to isolate the effect
      of unit size.\nWhat dominating the frontier would require. Future compressors
      should merge redundant evidence while retaining validated source links and accounting
      for verification cost. ECR''s limited measured gains motivate independent calibration
      and replication before claiming general improvements.\nFailure modes and excluded
      examples. All 33 failures occur in identity runs: 4 budget-check failures on
      ASQA, and 15 budget-check plus 14 prompt-overflow failures on QASPER. No compressed
      run fails on these examples. Primary comparisons exclude the same failed question
      IDs from every setting, so their estimand is performance conditional on identity
      success.", "Abstract\nContext compression reduces generator input in retrieval-augmented
      generation, but answer quality alone does not characterize citation attribution.
      We measure citation attribution across compression methods and budgets, comparing
      reranking, extractive selection, abstractive summarization, token pruning, and
      an extract-cluster-rewrite construction on ASQA and QASPER under a fixed generator
      and primary entailment evaluator. On ASQA at a nominal 0.25 budget (achieved
      compression 0.08), a RECOMP-style compressor''s citations score 0.86 precision
      against its summaries but 0.12 against source spans under our re-attributability
      protocol. These estimates depend on a shared NLI model for span recovery and
      citation scoring and lack independent human calibration. Extractive selection''s
      observed grounded precision ranges from 0.43 to 0.49 across nominal budgets
      from one-half to one-tenth of the ASQA context, while answer quality declines.
      For the same RECOMP setting, claim verification after source recovery yields
      an unsupported rate of 0.88 versus 0.17 when checking summaries. This gap persists
      beyond structural rejection of missing provenance, but remains evaluator-dependent.
      A 200-question TRUE T5-XXL audit also finds emitted-grounded gaps under both
      fixed and recomputed source mappings, without establishing human-calibrated
      support rates.", "Table 3: Effect of the three-stage training procedure at 16
      \u00d7 compression with k = 25 .\n\n| Training configuration    |   TriviaQA
      |    NQ |   HotpotQA |\n|---------------------------|------------|-------|------------|\n|
      w/o Stage 1               |      71.30 | 44.45 |      29.35 |\n| w/o Stage 2               |      81.35
      | 61.65 |      43.10 |\n| w/o Stage 3               |      81.05 | 59.30 |      42.70
      |\n| Full three-stage training |      82.80 | 63.30 |      44.50 |"], "model":
      "rerank-2.5", "top_k": 5, "truncation": true}'
