    body: '{"max_tokens":128,"messages":[{"role":"user","content":"What are the QASPER
      full-source token counts?"}],"model":"claude-haiku-4-5-20251001","system":"Classify
      a question about a user''s uploaded documents into exactly one intent:\n\n-
      metadata: about the document collection itself, not what any document says --
      \"list my documents\", \"how many did I upload?\", \"what''s the status of report.pdf?\".
      Answerable from a document registry (filenames, status, chunk counts), never
      from document content.\n- factual: a specific question whose answer sits in
      a handful of passages -- \"what electrolyte did they use?\", \"summarise report.pdf\".
      The default for an ordinary question about content.\n- aggregate: asks about
      themes, patterns, or a comparison spanning many or all of the user''s documents
      -- \"what themes run through my uploads?\", \"compare every paper''s methodology\".\n-
      out_of_scope: not about documents at all -- small talk, a coding request, the
      weather, or world knowledge with no document referent.\n\nYou cannot see the
      user''s documents, and you must not guess at their contents. An unfamiliar name,
      benchmark, method or term in the question is evidence FOR factual, not against
      it: a person naming something specific is naming something they uploaded. Only
      choose out_of_scope when the question would be off-topic whatever the user had
      uploaded.\n\nRespond with exactly one label.","thinking":{"type":"disabled"},"tool_choice":{"type":"tool","name":"_IntentLabel"},"tools":[{"name":"_IntentLabel","input_schema":{"properties":{"intent":{"description":"Exactly
      one of metadata, factual, aggregate, out_of_scope.","enum":["metadata","factual","aggregate","out_of_scope"],"type":"string"}},"required":["intent"],"type":"object"},"description":""}]}'
