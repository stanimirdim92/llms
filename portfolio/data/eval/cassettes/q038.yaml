      Identity      |  1.00 |  0.48 |  0.48 |  0.53 |  0.53 |  0.53 |\n| Rerank top-
      k |  0.25 |  0.39 |  0.39 |  0.59 |  0.60 |  0.59 |\n| Extractive    |  0.25
