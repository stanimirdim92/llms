    body: '{"query": "What are the QASPER full-source token counts?", "documents":
      ["4.1 Experimental Setup\nQASPER context and token counts. The context contains
      the supplied paper''s abstract and all full-text paragraphs, sentence-segmented
      for compression; no topk retrieval truncation is applied. On the 976 common
      questions, full-source token counts have mean 4,672, median 4,557, and range
      897-11,418. At nominal 0.25, RECOMP''s mean compressed context is 60.3 tokens
      and its mean complete generator input is 125.4 tokens. The reported achieved
      fraction, 0.01525, is the mean of per-question context/full-source ratios, not
      the ratio of these token means. At nominal 0.50, this gap between nominal and
      achieved fractions is about 32.8-fold.", "Table 2: Mean input tokens on 944
      ASQA questions at nominal budget 0.25 (identity: full context). Total includes
      generator and declared-span verification input; compression, output, and recovery
      are excluded.\n\n| Compressor    |   Gen. in |   Ver. span |   Ver. sum. |   Total
      |\n|---------------|-----------|-------------|-------------|---------|\n| Identity      |       798
      |         371 |         382 |    1169 |\n| Rerank top- k |       210 |         171
      |         174 |     381 |\n| Extractive    |       277 |         112 |         114
      |     389 |\n| ECR           |       277 |         118 |         107 |     395
      |\n| RECOMP        |       127 |           0 |          84 |     127 |\n| LLMLingua-2   |       253
      |           0 |         240 |     253 |", "A Results on Common Questions\nTables
      4 and 5 report all primary settings. \u03c1 : nominal budget; \u02c6 \u03c1
      : achieved ratio; P g /R g : grounded citation precision/recall; P e : emitted
      citation precision; reattr.: re-attribution rate (units without declared provenance
      recovering at least one source span under the NLI protocol); U s /U m : unsupported-claim
      rate under declared-span-only and summary-checked verification; str-EM: answer
      string exact match (ASQA); EF1: declaredevidence F1 (QASPER only). Every setting
      uses the same 944 ASQA or 976 QASPER successful questions; n denotes that common
      cohort, with metric-specific omissions identified in the tables. Scores are
      question-weighted means over defined values; superscript n = \u00b7 \u00b7 \u00b7
      gives the nonmissing count when smaller than the cohort, and dashes mark undefined
      metrics. QASPER verification rates exclude 1, 2, 3, and 2 zero-claim RECOMP
      answers at nominal budgets 0.50, 0.25, 0.10, and 0.05, respectively; other settings
      use the full cohort. The 1 . 00 declared-span rates for noprovenance methods
      are structural; this verification mode does not attempt recovery. Exploratory
      slot-compressor runs are excluded. RECOMP emits identical per-question contexts
      at nominal budgets 0.50 and 0.25 on ASQA, and at 0.50, 0.25, and 0.10 on QASPER.
      Separate generation passes are retained as distinct operating points.", "C Second-Evaluator
      Sensitivity Audit\nWe sample 100 questions per dataset from sorted common-cohort
      IDs using a fresh Python seed13 random generator; QASPER spans 84 papers. Full-context
      identity and nominal-0.25 extraction, RECOMP, and LLMLingua-2 contribute 800
      unchanged saved answers, with 1,627 claims and 1,890 citation markers. The prior
      DeBERTa values are the original scores for these same sampled answers.\nModel
      and decoding. We use google/t5_xxl_true_nli_mixture (Honovich et al., 2022),
      revision aa6cfe1dd4 , with full revision and checkpoint hashes in the manifest.
      This released mixture uses SNLI, MNLI, FEVER, SciTail, PAWS, and VitaminC (Bowman
      et al., 2015; Williams et al., 2018; Thorne et al., 2018; Khot et al., 2018;
      Zhang et al., 2019; Schuster et al., 2021), rather than the original TRUE paper''s
      ANLI recipe. MNLI and FEVER overlap DeBERTa''s training mixture. Inference uses
      Transformers 4.57.6, the slow T5 tokenizer, BF16, batch size four, and one NVIDIA
      B200. The prompt places compressed text or source evidence after premise: and
      the unit or claim after hypothesis: .\nWe use an AutoAIS-style exact-one decision
      (Bohnet et al., 2022; Gao et al., 2023): generate at most ten tokens deterministically,
      strip surrounding whitespace, and count only 1 as entailment. Every other string
      scores zero; these are binary decisions, not calibrated probabilities. Unlike
      our rule, reference AutoAIS/ALCE code compares decoded strings without additional
      whitespace normalization. We retain normalized nonbinary strings, but not every
      raw output, so normalization''s effect cannot be quantified from the cache.\nEvidence
      mappings. Fixed recovery preserves declared provenance and DeBERTa-recovered
      source IDs while TRUE scores support. TRUE recovery reevaluates all top-10 lexical
      candidates for undeclared units, including DeBERTa-rejected candidates, then
      scores with TRUE. Both retain the corrected precision gate. Fixed recovery retains
      selection dependence; TRUE recovery reuses one judge. Neither removes bounded-search
      errors or supplies human calibration.\nRecorded amendments. Astrict-decoding
      pilot stopped on a nonbinary output; a second stopped on an overlong hypothesis.
      An input-only scan found five undeclared units exceeding 2,048 tokens (maximum
      hypothesis plus prompt: 2,988), motivating a uniform 4,096-token cap that preserves
      complete hypotheses and truncates only premises. A later batch-eight run exhausted
      GPU memory. All interrupted attempts and plans are preserved but excluded; the
      final batch-four run recomputes every input in a fresh cache. These amendments
      preceded inspection of any aggregate TRUE comparison report and left the sample,
      thresholds, and 24 comparisons unchanged. The cap exceeds original TRUE''s 2,048
      and DeBERTa''s 512 tokens, so cross-evaluator differences do not isolate model
      family.", "| Dataset   |   Questions |   Passages | Source    |\n|-----------|-------------|------------|-----------|\n|
      NQ        |         499 |     40,791 | Wikipedia |\n| QAMPARI   |         500
      |     44,879 | Wikipedia |\n| HAGRID    |         500 |      8,986 | Wikipedia
      |\n| RAGTruth  |         500 |      6,981 | Web       |", "4.1 Experimental
      Setup\nWe evaluate on two attribution benchmarks with different retrieval granularities.
      ASQA comprises 948 ambiguous factoid questions from the ALCE release (Gao et
      al., 2023), each paired with the top-5 GTR-retrieved passages, sentencesegmented
      into citable snippets; answer quality is string exact match (str-EM). QASPER
      (Dasigi et al., 2021) is the 1,005-question dev split over 281 NLP papers, using
      each supplied paper''s abstract and full text. Gold evidence is paragraphlevel,
      so identity presents paragraphs as citable units while compressors operate on
      sentence snippets; declared sids map to paragraphs for setF1 against gold evidence,
      max over annotators. The generator is Qwen2.5-7B-Instruct served via vLLM with
      greedy decoding and ALCE-style numbered-context citation prompting (Gao et al.,
      2023). Primary entailment judgments use the development-grade DeBERTa NLI evaluator
      of \u00a73.1 at \u03c4 = 0 . 5 . We compare six compressors: identity (no compression;
      documentlevel on ASQA, paragraph-level on QASPER), cross-encoder rerank topk
      (ms-marco-MiniLML-6-v2), embedding-based extractive sentence selection (all-MiniLM-L6-v2),
      the RECOMP abstractive summarizer (NQ checkpoint) (Xu et al., 2024), LLMLingua-2
      token pruning (Pan et al., 2024), and our extract-cluster-rewrite (ECR) variant,
      which ranks sentences, greedily clusters nearduplicates by Jaccard word overlap
      (threshold 0.5, with a negation guard), and emits one unit per cluster-the highest-relevance
      member sentence verbatim-citing all member sentence ids. Although LLMLingua-2
      prunes tokens verbatim, its output is a token stream with no unit-level sid
      mapping in our pipeline, so it declares no provenance and is scored with the
      no-provenance family alongside RECOMP. Each compressor runs at nominal budgets
      { 0 . 5 , 0 . 25 , 0 . 1 , 0 . 05 } of the retrieved context, enforced in generator-tokenizer
      tokens. Because compressors do not reliably hit their nominal budgets, the frontier
      figures and primary summary tables report the achieved ratio: RECOMP''s summary
      length is nearly budget-independent, saturating at achieved ratios of 0.05-0.08
      on ASQA and \u2248 0.015 on QASPER across all four nominal budgets. All primary
      comparisons use the same successful questions across all 21 settings: 944 on
      ASQA and 976 from 271 papers on QASPER. Only identity has failures: 4 budget-check
      failures on ASQA, and 15 budget-check plus 14 promptoverflow failures on QASPER;
      their question IDs are excluded from every primary setting. Fullcohort descriptive
      aggregates remain available in the evaluation artifacts.", "6 Analysis\nRe-attribution
      varies across no-provenance methods. The re-attribution rate measures whether
      at least one candidate source snippet passes the NLI entailment threshold for
      a unit without declared provenance. On ASQA, RECOMP''s rates are 0.41, 0.41,
      0.42, and 0.39 across nominal budgets 0.5 through 0.05, excluding examples without
      summary units. Averaged over these examples, roughly three-fifths of its units
      have no passing candidate; this does not establish that the source contains
      no supporting evidence. LLMLingua-2''s ASQA rate means decrease from 0.56 to
      0.40, 0.25, and 0.20 as budgets tighten; the first two adjacent decreases have
      p H = 0 . 0148 , while the final decrease is unresolved ( p H = 0 . 242 ). Recovery
      coverage depends on method, budget, and dataset as well as the search and evaluator;
      these observations provide no universal ceiling on recoverable support.\nTable
      2: Mean input tokens on 944 ASQA questions at nominal budget 0.25 (identity:
      full context). Total includes generator and declared-span verification input;
      compression, output, and recovery are excluded.\n\nIdentity, Gen. in = 798.
      Identity, Ver. span = 371. Identity, Ver. sum. = 382. Identity, Total = 1169.
      Rerank top- k, Gen. in = 210. Rerank top- k, Ver. span = 171. Rerank top- k,
      Ver. sum. = 174. Rerank top- k, Total = 381. Extractive, Gen. in = 277. Extractive,
      Ver. span = 112. Extractive, Ver. sum. = 114. Extractive, Total = 389. ECR,
      Gen. in = 277. ECR, Ver. span = 118. ECR, Ver. sum. = 107. ECR, Total = 395.
      RECOMP, Gen. in = 127. RECOMP, Ver. span = 0. RECOMP, Ver. sum. = 84. RECOMP,
      Total = 127. LLMLingua-2, Gen. in = 253. LLMLingua-2, Ver. span = 0. LLMLingua-2,
      Ver. sum. = 240. LLMLingua-2, Total = 253\nVerification adds input tokens. Table
      2 reports a generator-input-plus-verifier-input proxy, measured in generator-tokenizer
      tokens before NLI truncation. It excludes compressor inference, generated output,
      recovery, and differences in model-specific tokenization or per-token cost.
      The declared-span column is zero for no-provenance compressors because this
      policy rejects their claims without an NLI call. That zero does not describe
      the cost of recovering and checking source evidence.", "B Complete Paired Comparisons\nSection
      4.2 describes the common cohorts, estimands, inference, and precision-code correction.
      Tables 6-10 report all 148 planned contrasts, including those not retained as
      claims; EF1 effects and intervals use four decimal places, and other effects
      and intervals use three.\nTable notation. A/Q denote ASQA/QASPER; Id, RR, X,
      RC, and LL denote identity, reranking, extraction, RECOMP, and LLMLingua-2.
      Setting labels give compressor/nominal budget, optionally followed by the recovery
      threshold. P/R denote precision/recall, with e/g for emitted/grounded; EM is
      str-EM, EF1 is evidence F1, and Rec is reattribution rate. U s /U m /U r denote
      declared-span, summary, and recovered-source unsupported rates. \u2206 is the
      paired left-minus-right mean difference; a single endpoint applies to both settings,
      and a pair lists left-minus-right metrics. CI is a pointwise 95% bootstrap interval;
      p H is the two-sided randomization p -value after Holm adjustment across all
      148 comparisons; n counts included questions.\nRecovered-source verification.
      This extension reads existing NLI scores from the sealed cache and makes no
      new model calls. It uses the same recovered source IDs as citation scoring,
      but the claim verifier removes repeated source IDs before pooling evidence.
      Consequently, its unsupported rate need not equal one minus grounded citation
      recall, which retains repeated cited evidence. Both summary and recovered-source
      rates exclude the same zero-claim answers: two QASPER RECOMP answers at nominal
      0.25; the other three comparisons use their full common cohorts. Input hashes,
      the extension plan, cache lookups, perquestion records, and all four comparisons
      are retained separately from the original analysis.\n", "C Second-Evaluator
      Sensitivity Audit\nInference and diagnostics. The separate 24-test family uses
      pointwise 95% bootstrap intervals and two-sided randomization tests, each with
      10,000 replicates and seed 13, question resampling on ASQA and paper clustering
      on QASPER, with question-weighted means and Holm adjustment. The original 148-test
      analysis is unchanged. Tables 11-12 report precision means and all planned contrasts.
      All 16 emitted-grounded gaps remain positive after adjustment; the eight cross-evaluator
      precision differences remain unresolved, which does not establish equivalence.
      ECR and other budgets are outside this audit.\nThe run scored 6,015 unique pairs
      in 419 seconds of model inference (430 seconds including bookkeeping; setup
      and excluded attempts are additional). Four inputs required truncation, with
      maximum pre-truncation length 47,440 tokens. After normalization, 122 pairs
      (2.03%) produced nonbinary strings, including 103 empty strings; assigning zero
      does not establish reliable nonentailment. These are pair counts, not fractions
      of questions affected; the full histogram accompanies the cache. Recovery can
      disagree substantially: QASPER LLMLingua-2 has 50.3% agreement over 1,000 candidate
      decisions and mean recovery rates of 0.84 for DeBERTa versus 0.38 for TRUE.
      These descriptive results support sensitivity analysis, not accuracy against
      human judgments.\n", "Conclusion\nKuratov, Y.; Arkhipov, M.; Bulatov, A.; and
      Burtsev, M. 2025. Cramming 1568 tokens into a single vector and back again:
      Exploring the limits of embedding space capacity. In Proceedings of the 63rd
      Annual Meeting of the Association for Computational Linguistics (Volume 1: Long
      Papers) , 19323-19339.\nKwiatkowski, T.; Palomaki, J.; Redfield, O.; Collins,
      M.; Parikh, A.; Alberti, C.; Epstein, D.; Polosukhin, I.; Devlin, J.; Lee, K.;
      Toutanova, K.; Jones, L.; Kelcey, M.; Chang, M.-W.; Dai, A. M.; Uszkoreit, J.;
      Le, Q.; and Petrov, S. 2019. Natural Questions: A Benchmark for Question Answering
      Research. Transactions of the Association for Computational Linguistics , 7:
      452-466.\nLevy, S.; Mazor, N.; Shalmon, L.; Hassid, M.; and Stanovsky, G. 2025.
      More Documents, Same Length: Isolating the Challenge of Multiple Documents in
      RAG. In Christodoulopoulos, C.; Chakraborty, T.; Rose, C.; and Peng, V., eds.,
      Findings of the Association for Computational Linguistics: EMNLP 2025 , 19539-19547.
      Suzhou, China: Association for Computational Linguistics. ISBN 979-8-89176-335-7.\nLewis,
      P.; Perez, E.; Piktus, A.; Petroni, F.; Karpukhin, V.; Goyal, N.; K\u00fcttler,
      H.; Lewis, M.; Yih, W.-t.; Rockt\u00e4schel, T.; Riedel, S.; and Kiela, D. 2020.
      Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks. In Larochelle,
      H.; Ranzato, M.; Hadsell, R.; Balcan, M. F.; and Lin, H., eds., Advances in
      Neural Information Processing Systems , volume 33, 9459-9474. Curran Associates,
      Inc.\nLi, X.; and Ouyang, J. 2025. How Does Knowledge Selection Help Retrieval
      Augmented Generation? In Christodoulopoulos, C.; Chakraborty, T.; Rose, C.;
      and Peng, V., eds., Findings of the Association for Computational Linguistics:
      EMNLP 2025 , 4104-4121. Suzhou, China: Association for Computational Linguistics.
      ISBN 979-8-89176-335-7.", "9 Limitations\nEvaluator dependence. Primary scores
      use DeBERTa-v3-base, trained on MNLI, FEVER, and ANLI, at \u03c4 = 0 . 5 , without
      human calibration. Using the same model to select recovered spans and score
      support can reinforce systematic errors; the resulting scores are evaluator-dependent
      estimates, not validated rates of source support or factual correctness. This
      dependence also limits conclusions about method rankings and the size of emitted-grounded
      gaps. The 200-question TRUE audit checks a second scoring family, but fixed
      recovery retains DeBERTa selection and TRUE recovery reuses one judge. Different
      input windows and nonbinary decoder outputs further limit numerical comparison.
      Human source-level calibration remains necessary (Rashkin et al., 2023).\nSingle
      generator. All results use Qwen2.5-7BInstruct with greedy decoding. Frontier
      shapes may differ across model families and scales; a second-family replication
      is planned.\nDataset coverage. We evaluate two English datasets (ASQA and QASPER)
      with distinct retrieval granularities, but this does not cover multilingual
      settings, open-web retrieval, or longercontext regimes.\nRe-attribution hyperparameters.
      The top-10 lexical candidate pool can miss semantically matching snippets, and
      requiring one snippet to entail a unit can miss support distributed across snippets.
      Consequently, a failed recovery does not establish that the source contains
      no support. Table 3 varies the recovery threshold while holding the scoring
      threshold fixed; it does not validate the evaluator or test candidate-pool size,
      retrieval strategy, or multi-snippet recovery.\nVerification scope. Declared-span
      verification rejects claims lacking declared evidence by construction, even
      if support could be recovered. Its 1 . 00 unsupported rate for no-provenance
      runs is a provenance-availability diagnostic, not a calibrated hallucination
      rate. Recovered-source verification is reported at nominal 0.25 for the two
      no-provenance methods and remains dependent on the same bounded recovery procedure
      and evaluator.\nResidual error rows. Only identity fails on 4 ASQA and 29 QASPER
      questions; every primary setting is evaluated on the resulting common successful
      subset. This pairing prevents comparisons from using different questions, but
      conditions results on identity success and omits those difficult cases. Sampling
      intervals condition on the fixed generated outputs and evaluator; they do not
      include systematic NLI error or variation across generation runs.\nNominal versus
      achieved budgets. Abstractive compressors do not reliably hit nominal token
      budgets; RECOMP often produces much less context than requested. We report achieved
      compression ratios, but comparisons at a shared nominal budget do not establish
      performance at matched achieved context sizes.", "3.3 Three Verification Modes\nWe
      decompose each answer into claims (its statements with citation markers stripped;
      cf. atomicfact decomposition, Min et al., 2023) and check each claim against
      evidence pooled from its cited units. Summary-checked ( U m ) pools the cited
      units'' own texts. Span-checked ( U s ) pools only the declared source spans
      of the cited units; claims without such evidence count as unsupported without
      an NLI call. We retain the label ''spanchecked'' for this declared-only mode,
      which differs from grounded citation scoring: it does not recover missing spans.
      Its unsupported rate of 1 . 00 for methods without declared provenance is a
      consequence of this policy, not an empirical estimate that every claim lacks
      source support. Recoveredsource checking ( U r ) first resolves units to declared
      spans or, when absent, spans recovered by the same protocol used for grounded
      citation scoring. It deduplicates the pooled source IDs before verifying each
      claim; absent evidence still counts as unsupported. We evaluate this third mode
      for RECOMP and LLMLingua-2 at nominal 0.25 on both datasets. For methods whose
      units all declare provenance, recovered-source and declared-span checking coincide.
      We report generator input, logical verifier input (premise plus hypothesis),
      and their sum under declared-span checking as a partial token-cost proxy (Table
      2).\nEvidence selection on QASPER. On QASPER (Dasigi et al., 2021) we additionally
      evaluate the compressor''s own attribution: declared cited sids are mapped to
      their (whitespace-normalized) full paragraph texts and scored by set-F1 against
      the gold evidence paragraphs, taking the maximum over annotators per the official
      protocol. Runs without declared provenance have no declaredevidence F1; recovered-span
