      976 |\n| LLMLingua-2   | 0.05 |  0.05 |  0.02 |  0.01 |  0.38 | 0.18          |
      -     | 1.00          | 0.67          | 976 |", "E. Experimental Design\nThe
      evaluation set contains 49 fact-checking queries, of which 37 are distinct,
      spanning locations, dates and counts, yes/no claims, and people. Ten information-rich
      passages covering the queried facts were added to the index because raw FEVER
      evidence sentences are often too terse to support a full answer. Crossing the
      query set with three strategies and four poisoning levels yields 49 \u00d7 3
      \u00d7 4 = 588 runs, each producing a clean and a poisoned answer for 1 , 176
      generations in total. Because a full sweep takes roughly a day on CPU, results
      are written to disk after every run and a checkpoint records completed cells,
      so an interrupted sweep resumes without repeating work.", "Conclusion\nPetroni,
      F.; Piktus, A.; Fan, A.; Lewis, P.; Yazdani, M.; De Cao, N.; Thorne, J.; Jernite,
      Y.; Karpukhin, V.; Maillard, J.; Plachouras, V.; Rockt\u00e4schel, T.; and Riedel,
      S. 2021. KILT: a Benchmark for Knowledge Intensive Language Tasks. In Proceedings
      of the 2021 Conference of the North American Chapter of the Association for
      Computational Linguistics: Human Language Technologies , 25232544. Online: Association
      for Computational Linguistics.\nShoham, Y.; and Gersho, A. 1988. Efficient bit
      allocation for an arbitrary set of quantizers (speech coding). IEEE Transactions
      on Acoustics, Speech, and Signal Processing , 36(9): 1445-1453.\nStelmakh, I.;
      Luan, Y.; Dhingra, B.; and Chang, M.-W. 2022. ASQA: Factoid Questions Meet Long-Form
      Answers. In Proceedings of the 2022 Conference on Empirical Methods in Natural
      Language Processing , 8273-8288. Abu Dhabi, United Arab Emirates: Association
      for Computational Linguistics.\nTsatsaronis, G.; Balikas, G.; Malakasiotis,
      P.; Partalas, I.; Zschunke, M.; Alvers, M. R.; Weissenborn, D.; Krithara, A.;
      Petridis, S.; Polychronopoulos, D.; et al. 2015. An overview of the BIOASQ large-scale
      biomedical semantic indexing and question answering competition. BMC bioinformatics
      , 16(1): 138.\nXiao, S.; Liu, Z.; Zhang, P.; Muennighoff, N.; Lian, D.; and
      Nie, J.-Y. 2024. C-Pack: Packed Resources For General Chinese Embeddings. arXiv:2309.07597.\nXu,
      F.; Shi, W.; and Choi, E. 2024. RECOMP: Improving Retrieval-Augmented LMs with
      Compression and Selective Augmentation. In The Twelfth International Conference
