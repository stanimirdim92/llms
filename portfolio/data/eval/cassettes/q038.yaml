      Explainable Multi-hop Question Answering. In Proceedings of the 2018 Conference
      on Empirical Methods in Natural Language Processing , 2369-2380. Brussels, Belgium:
      Association for Computational Linguistics.", "Table 1: Citation precision and
      unsupported rates at nominal budget 0.25 (identity: full context), on 944 ASQA
      and 976 QASPER questions. Notation follows Section 3; no-provenance declared-span
      rates are structural. Two zero-claim RECOMP answers are excluded from QASPER
