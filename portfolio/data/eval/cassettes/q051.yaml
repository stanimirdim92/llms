        One agent drifts the wrong way\\nR-Search is the exception, and it leans worse
        rather than better. Its DiD is positive on all four datasets (+0.7, +3.1,
        +3.8, +3.0pp) and significant on RAGTruth, our largest cell, at +3.0pp with
        a 95% CI of [1.2, 4.8] and a Holm-adjusted p of 0.002. That was the pre-registered
        condition for claiming a model-specific effect, and it is met.\\nWe report
        it with the caveats it deserves. On the RANDOM variant R-Search is again higher
        on three of four datasets but significant on none, the closest p being 0.063.
        Under the looser cited-anywhere outcome it dips slightly below the baseline
        on NQ ( -0.5pp) and reaches significance nowhere (Appendix D). The direction
        is consistent; the evidence for its size is not. What we can say is that no
        agent improved, and the one that moved measurably moved the wrong way.\",\"metadata\":{\"ingestion_version\":\"01a0fc55257f7276be70b7b3d1501b36\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6-text-0021\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6\",\"chunk_type\":\"text\",\"section_path\":\"5.4
