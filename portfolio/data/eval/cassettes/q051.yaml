      sit clear of zero. This clears the bar we set in advance, at least 8pp with
      an interval excluding zero on three of four datasets. On the Wikipedia-based
      datasets that rate means roughly one cited sentence in seven points at a passage
      whose only tie to the claim is four words we pasted in. Pooling across datasets
