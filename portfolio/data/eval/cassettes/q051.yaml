      | [7.9, 13.5]  |", "5.2 Post-rationalization is common\nTable 4 gives the attributable
      rate on REL-UNCITED for every model and dataset. Start with the baseline column:
      14.0% on NQ, 9.1% on QAMPARI, 14.8% on HAGRID, 2.9% on RAGTruth, with confidence
