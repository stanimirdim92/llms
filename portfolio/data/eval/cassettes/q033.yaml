      string: "{\"result\":{\"points\":[{\"id\":\"1c4922c9-244c-571e-a4e3-a1fc06f628f9\",\"version\":11,\"score\":0.5664766,\"payload\":{\"page_content\":\"This
        is a line chart comparing training entropy curves for two methods, TAPO (with
        graph pruning, orange line) and GSPO (without graph pruning, gray line), over
        Training Steps (x-axis, 0\u201360) versus Entropy (y-axis, ranging from about
        0.20 to 0.40). Both curves show a general upward trend with fluctuations,
        rising from roughly 0.25 at step 0 to a peak near 0.35\u20130.40 around steps
        30\u201345, with GSPO reaching a higher peak (~0.41) than TAPO before both
        decline toward the end of training. The chart illustrates that graph pruning
        (TAPO) tends to produce comparable but somewhat lower and more stable entropy
        values than the non-pruned GSPO method, particularly in the later training
        steps.\",\"metadata\":{\"ingestion_version\":\"01a0fc547d2f738da4fc73667c19a759\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-afd90130549e21e7d5d373e21bd00946-fig-008-05\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-afd90130549e21e7d5d373e21bd00946\",\"chunk_type\":\"figure\",\"section_path\":\"\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":89,\"page_no\":8,\"filename\":\"2609.14066v1.pdf\",\"image_path\":\"/var/www/html/personal/llms/portfolio/data/processed/01a0aa96b5ef7053a767b8ddabb5a961-afd90130549e21e7d5d373e21bd00946/figures/fig-008-05-36db8734faa635c3.png\"}}},{\"id\":\"a0c166f0-1173-5173-9ab5-499d03def381\",\"version\":7,\"score\":0.4378829,\"payload\":{\"page_content\":\"This
        is a line chart comparing two methods for setting \\\"allocation temperature\\\"
        (\u03C4) against compression rate (x-axis, log scale: 16, 32, 64, 128). The
        blue solid line labeled \\\"Empirical optimum\\\" shows \u03C4 decreasing
        gradually from 1.0 at compression rate 16 to about 0.5 at rate 128, with match
        accuracy scores annotated at each point (84.00, 84.45, 83.90, 83.15). The
        orange dashed line labeled \\\"Theory: \u03C4 \u221D B(\u03C1) (anchored at
        16x)\\\" declines more steeply, from 1.0 at rate 16 to about 0.22 at rate
        128, with corresponding match scores (84.35, 83.35, 82.25). A gray dotted
        horizontal reference line marks \\\"Fixed \u03C4 = 1\\\" with a match score
        of 81.30 at compression rate 128, illustrating that both adaptive temperature
        approaches outperform a fixed temperature baseline at high compression rates.\",\"metadata\":{\"ingestion_version\":\"01a0fc53885372038a1c6d0df171e569\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d-fig-007-05\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d\",\"chunk_type\":\"figure\",\"section_path\":\"\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":81,\"page_no\":7,\"filename\":\"2609.22100v1.pdf\",\"image_path\":\"/var/www/html/personal/llms/portfolio/data/processed/01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d/figures/fig-007-05-af44834945b0ff05.png\"}}},{\"id\":\"ef4dc573-029f-5a59-8750-0caf19fad5df\",\"version\":7,\"score\":0.4219331,\"payload\":{\"page_content\":\"This
        is a line/scatter plot comparing retrieval or memory methods on a latency-accuracy
        tradeoff. The x-axis shows \\\"Latency per query (ms, log scale)\\\" ranging
        from about 140 to 670+, and the y-axis shows \\\"Match (%)\\\" ranging from
        roughly 76 to 84. Three methods are plotted: AdaMem (green circles) and OSCAR
        (orange squares), each annotated with compression/sampling factors (128\xD7,
        64\xD7, 32\xD7, 16\xD7), showing that AdaMem achieves higher match scores
        at lower latencies than OSCAR; a \\\"Full Context\\\" baseline (purple star)
        achieves the highest match (~84%) but at much greater latency (~670 ms), labeled
        as \\\"4\xD7 lower latency\\\" compared to the other methods, indicating AdaMem
        approaches Full Context accuracy while being significantly faster.\",\"metadata\":{\"ingestion_version\":\"01a0fc53885372038a1c6d0df171e569\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d-fig-006-04\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d\",\"chunk_type\":\"figure\",\"section_path\":\"\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":65,\"page_no\":6,\"filename\":\"2609.22100v1.pdf\",\"image_path\":\"/var/www/html/personal/llms/portfolio/data/processed/01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d/figures/fig-006-04-c6ef734f27591521.png\"}}},{\"id\":\"3da0d4cd-6031-5c9d-923d-1d547b600ae9\",\"version\":13,\"score\":0.39746478,\"payload\":{\"page_content\":\"This
        is a set of three line/scatter plots comparing context compression methods
        for retrieval-augmented generation, evaluated across three metrics: Grounded
