        revision. We reanalyse the same table with a query-level bootstrap: resample
        the 49 indexed query slots with replacement (37 distinct texts), keep every
        run tied to a drawn slot, recompute the fooled rate, and repeat 10 , 000 times
        with a fixed seed to obtain percentile 95% intervals. Exact McNemar tests
        on discordant clean/poisoned correctness pairs are reported as a secondary
        check; effect sizes and intervals remain primary.\\nTable II shows that the
        climb with poisoning level remains after accounting for query resampling,
        while neighbouring levels overlap. The comparison that matters for the numeric
        pattern is isolated next.\\nTABLE III BEHAVIOUR BY STRATEGY, AVERAGED OVER
