- request:
    body: '{"query": "What does the entropy plot compare, and what are the two methods?",
      "documents": ["This is a line chart comparing training entropy curves for two
      methods, TAPO (with graph pruning, orange line) and GSPO (without graph pruning,
      gray line), over Training Steps (x-axis, 0\u201360) versus Entropy (y-axis,
      ranging from about 0.20 to 0.40). Both curves show a general upward trend with
      fluctuations, rising from roughly 0.25 at step 0 to a peak near 0.35\u20130.40
      around steps 30\u201345, with GSPO reaching a higher peak (~0.41) than TAPO
      before both decline toward the end of training. The chart illustrates that graph
      pruning (TAPO) tends to produce comparable but somewhat lower and more stable
      entropy values than the non-pruned GSPO method, particularly in the later training
      steps.", "This is a line chart comparing two methods for setting \"allocation
      temperature\" (\u03c4) against compression rate (x-axis, log scale: 16, 32,
      64, 128). The blue solid line labeled \"Empirical optimum\" shows \u03c4 decreasing
      gradually from 1.0 at compression rate 16 to about 0.5 at rate 128, with match
      accuracy scores annotated at each point (84.00, 84.45, 83.90, 83.15). The orange
      dashed line labeled \"Theory: \u03c4 \u221d B(\u03c1) (anchored at 16x)\" declines
      more steeply, from 1.0 at rate 16 to about 0.22 at rate 128, with corresponding
      match scores (84.35, 83.35, 82.25). A gray dotted horizontal reference line
      marks \"Fixed \u03c4 = 1\" with a match score of 81.30 at compression rate 128,
      illustrating that both adaptive temperature approaches outperform a fixed temperature
      baseline at high compression rates.", "This is a line/scatter plot comparing
      retrieval or memory methods on a latency-accuracy tradeoff. The x-axis shows
      \"Latency per query (ms, log scale)\" ranging from about 140 to 670+, and the
      y-axis shows \"Match (%)\" ranging from roughly 76 to 84. Three methods are
      plotted: AdaMem (green circles) and OSCAR (orange squares), each annotated with
      compression/sampling factors (128\u00d7, 64\u00d7, 32\u00d7, 16\u00d7), showing
      that AdaMem achieves higher match scores at lower latencies than OSCAR; a \"Full
      Context\" baseline (purple star) achieves the highest match (~84%) but at much
      greater latency (~670 ms), labeled as \"4\u00d7 lower latency\" compared to
      the other methods, indicating AdaMem approaches Full Context accuracy while
      being significantly faster.", "This is a set of three line/scatter plots comparing
      context compression methods for retrieval-augmented generation, evaluated across
      three metrics: Grounded citation precision, Grounded citation recall, and Answer
      correctness (str-EM), each plotted against \"Achieved context fraction\" (x-axis,
      reversed scale from 1.0 to 0.0) on the y-axis from 0.0 to 1.0 (or 0.35 for the
      third plot).\n\nThe methods compared include Identity (full context, green dot
      baseline), Rerank top-k (brown), Extractive (orange), ECR (blue), RECOMP (purple
      diamond), and LLMLingua-2 (red). Across all three metrics, Rerank top-k and
      ECR tend to achieve the best performance at moderate context fractions (0.4-0.7),
      while LLMLingua-2 consistently underperforms with the lowest precision and recall
      scores, and RECOMP achieves relatively higher answer correctness at very low
      context fractions.", "This is a set of three line/scatter plots comparing context
      compression methods for retrieval-augmented generation, plotting \"Achieved
      context fraction\" (x-axis, reversed from 1.0 to 0.0) against three metrics:
      Grounded citation precision, Grounded citation recall, and Declared-evidence
      F1 (y-axes, 0.0 to 1.0 or 0.0 to 0.20 scales). Six methods are compared: Identity
      (full context, green dot at x=1.0), Extractive (orange), Rerank top-k (brown),
      ECR (blue), RECOMP (purple, near x=0), and LLMLingua-2 (red). ECR consistently
      achieves the highest precision and recall among compression methods across context
      fractions (~0.4-0.55), while LLMLingua-2 performs poorly (near 0.0-0.15) on
      citation precision/recall; for Declared-evidence F1, ECR and Extractive show
      increasing values (up to ~0.17) as context fraction decreases, outperforming
      Rerank top-k, which stays low (~0.05-0.08).", "This is a grouped bar chart comparing
      the performance of two methods, AdaMem (blue) and OSCAR (yellow hatched), across
      three question-answering datasets: TriviaQA, NQ, and HotpotQA. The y-axis shows
      \"Llama-3 judge (%)\" scores ranging from 0 to about 90, while the x-axis shows
      compression rates of 16\u00d7, 32\u00d7, and 64\u00d7 for each dataset. Across
      all datasets and compression rates, AdaMem consistently outperforms OSCAR, with
      the performance gap widening as compression rate increases (e.g., in HotpotQA,
      AdaMem scores 62.4% vs OSCAR''s 55.3% at 64\u00d7 compression), indicating AdaMem
      maintains accuracy better under higher compression.", "This is a line chart
      grid comparing two retrieval-augmented QA methods, OSCAR (red) and AdaMem (green),
      across three datasets (TriviaQA, NQ, HotpotQA) and three compression ratios
      (16x, 32x, 64x), forming a 3x3 panel layout. The x-axis in each subplot represents
      the number of retrieved documents (k = 5, 10, 15, 20, 25), while the y-axis
      shows task performance scores (ranging roughly from 36 to 84 depending on the
      dataset/compression level). Across nearly all panels, AdaMem consistently outperforms
      OSCAR, with the performance gap generally widening as compression increases
      (64x) and as more documents are retrieved, demonstrating AdaMem''s superior
      robustness under higher compression and larger retrieval sets.", "This is a
      line chart comparing TriviaQA match performance against compression rate (16x,
      32x, 64x, 128x on x-axis) for three memory allocation methods. The \"AdaMem
      (ours)\" method (blue line) maintains the highest accuracy across all compression
      rates, starting near 84 and ending around 82 (only -2.08% drop from full context),
      outperforming \"Uniform(Oscar)\" (orange line, dropping to -7.34%) and \"Uniform(Pisco)\"
      (purple line, dropping to -7.52%). A dashed green line at the top indicates
      \"Full Context\" performance (~84.5) as the reference baseline, and a schematic
      above the chart illustrates how AdaMem allocates variable-length document representations
      (d1-d4) compared to Uniform''s equal-length allocation.", "This is a line plot
      with shaded confidence bands showing memorization (MEM tokens per document)
      as a function of document relevance rank for a 64x configuration. The y-axis
      shows MEM tokens per document (0-20+) and the x-axis shows document relevance
      rank from 1 (most relevant) to 25. The median line drops sharply from about
      9-10 tokens at rank 1 to near 0 by rank 5, with shaded regions indicating the
      10th-90th and 25th-75th percentiles; a red dashed horizontal line marks the
      OSCAR 16x baseline at 9 MEM/document for comparison, showing that the most relevant
      document (rank 1) has memorization comparable to this baseline while lower-ranked
      documents show substantially less.", "This is a line chart depicting the \"Fooled
      Rate (%)\" on the y-axis (ranging from 0 to 40%) versus \"Poisoned documents
      (out of 3 retrieved)\" on the x-axis (categories: 0/3, 1/3, 2/3, 3/3). Three
      attack types are plotted: Entity swap (pink dashed line), Number swap (orange
      solid line with circular markers), and Negation (purple dashed line), all showing
      an increasing trend in fooled rate as the number of poisoned documents increases.
      A notable annotation highlights a \"+16.3 pp\" jump in the Number swap line
      between the 1/3 and 2/3 data points, where the rate rises sharply from about
      10% to roughly 27%, with all three lines converging near 30-37% at 3/3 poisoned
      documents.", "This is a heatmap chart displaying \"Fooled rate (%)\" data across
      three manipulation types (Entity swap, Number swap, Negation) as rows and four
