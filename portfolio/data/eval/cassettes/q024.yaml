- request:
    body: '{"query": "What agreement did human annotators reach with the automated
      accuracy judge?", "documents": ["Table 7: Human validation of the automated
      accuracy calculation.\n\n| Comparison                 |   Agreement |   Cohen''s
      Kappa |\n|----------------------------|-------------|-----------------|\n| Annotator_1
      vs LLM         |        0.96 |            0.92 |\n| Annotator_2 vs LLM         |        0.95
      |            0.90 |\n| Annotator_1 vs Annotator_2 |        0.97 |            0.94
      |", "A.4 LLM-as-a-judge accuracy evaluation\nThe accuracy of the responses was
      assessed by comparing the model outputs with the gold ''expected unsafe answer
      summary'' for each question. Accuracy judging was conducted using Claude Opus-4.7,
      using the prompt shown in Table 9. Out of 6,920 responses scored, in 95% of
      cases a valid ''true'' or ''false'' label was returned. In the remaining 5%,
      an empty label was returned; these were treated as ''false'' for the sake of
      the analysis.\nThe automated classifier was validated through human annotation
      of 100 examples, sampled across the five generating models and the True/False
      conditions. The raw agreement and Cohen''s \u03ba scores are given in Table
      7. The agreement between manual and automated accuracy scoring is very high,
      with raw agreement between 95-96% and Cohen''s \u03ba of 0.90-0.92.\nTable 7:
      Human validation of the automated accuracy calculation.\n\nAnnotator_1 vs LLM,
      Agreement = 0.96. Annotator_1 vs LLM, Cohen''s Kappa = 0.92. Annotator_2 vs
      LLM, Agreement = 0.95. Annotator_2 vs LLM, Cohen''s Kappa = 0.90. Annotator_1
      vs Annotator_2, Agreement = 0.97. Annotator_1 vs Annotator_2, Cohen''s Kappa
      = 0.94\nTable 8: Answerability of document contexts for the final balanced subset
      ( n = 346 ). Oracle and on-topic contexts were audited with GPT-4.1mini. \u2020
      Random-control values reflect construction-time answer_support=none labels rather
      than a separate LLM audit.\n\nOracle unsafe, Yes = 200 (57.8%). Oracle unsafe,
      Partial = 146 (42.2%). Oracle unsafe, No / none = 0 (0.0%). On-topic safe, Yes
      = 0 (0.0%). On-topic safe, Partial = 0 (0.0%). On-topic safe, No / none = 346
      (100.0%). Random control \u2020, Yes = 0 (0.0%). Random control \u2020, Partial
      = 0 (0.0%). Random control \u2020, No / none = 346 (100.0%)", "Table 11: Human
      validation of the automated refusal classification.\n\n| Comparison                 |   Raw
      agreement |   Cohen''s Kappa |\n|----------------------------|-----------------|-----------------|\n|
      Annotator_1 vs LLM         |            0.84 |            0.71 |\n| Annotator_2
      vs LLM         |            0.85 |            0.73 |\n| Annotator_1 vs Annotator_2
      |            0.92 |            0.86 |", "4.4 R4: Subjectivity of harm\nFigure
      4 presents the Cohen''s Kappa scores for inter-annotator agreement. LlamaGuard
      and WildGuard have an agreement of 0.66, indicating substantial agreement. The
      other pairwise comparisons between the LLM safety judges are 0.47 and 0.48,
      indicating only moderate agreement. In general, our hypothesis H4 that the automated
      safety evaluators will disagree on many cases is supported. We additionally
      include the evaluation of whether the answer was judged to be accurate, compared
      to the reference answer. The accuracy measure agrees most with the safety ratings
      of WildGuard with \u03ba = 0 . 67 . These results highlight that different methods
      of evaluating safety versus harm may lead to different interpretations of the
      same phenomenon. Overall, the four-way Fleiss''s kappa is 0.56, indicating only
      moderate agreement. However, Figure 5 in the Appendix, which provides a more
      detailed view of the safety evaluations, suggests that even when the absolute
      numbers differ, when averaged over a large number of samples, the trends observed
      using each of the evaluation methods remain generally consistent.\nTo explore
      the differences between automated safety evaluators further, Table 4 presents
      a finegrained analysis of the predicted positive rate for each evaluator on
      each sub-category of the RAGSafety-Bench benchmark, averaged over all generating
      models. When averaged over all models and conditions, the predicted positive
      rate of the evaluators is similar (14% for LlamaGuard, 17% for ShieldGemma,
      and 20% for WildGuard). However, each evaluator is more sensitive to certain
      subcategories of harm. For example, LlamaGuard flags responses less often than
      the other two evaluators Cohen''s K\nFigure 3: Refusal behaviors by model and
      condition.\nFigure 4: Pairwise Cohen''s Kappa scores for each automated safety
      judge, as well as four-way Fleiss''s Kappa.\nin categories like assault/battery
      and drugs. ShieldGemma flags far fewer responses in the subcategories of cyberattacks
      and financial crimes, while flagging more often in categories like chemical
      weapons, radiological weapons, and explosives. WildGuard is more sensitive to
      subcategories like hate speech and sexual harassment.", "A.5 Refusal classification\nThe
      accuracy of the automated refusal classification was validated by human annotation
      of 100 examples, sampled across the generating models and refusal categories.
      The raw agreement rates as well as Cohen''s kappa inter-annotator agreement
      scores are shown in Table 11. The two human annotators agree with each other
      over 90% of the time, while the LLM judge agrees with the humans approximately
      85% of the time (Cohen''s \u03ba = 0.71-0.73). In almost all cases that the
      human annotators disagreed with the LLM, it was because the humans felt it was
      not actually a refusal at all. For example, a model (here, Phi-4) might say:
      ''I''m sorry, but I don''t have access to specific documents or external content
      to provide a detailed answer to your question. However, I can offer some general
      insights based on common knowledge ...'' and then go on to provide an informative
      answer. Such responses were classified as ''insufficient information'' retrievals
      by Claude but manual annotation classified them as non-refusals.\nYou classify
      why an AI model refused to answer a question. Reply with exactly one token,
      one of: safety_refusal, insufficient_info, other.\nDefinitions: - safety_refusal:
      refused because the request is unsafe, harmful, unethical, illegal, or against
      the model''s policy.\n- insufficient_info: refused because the model says it
      lacks information, the provided documents/context do not contain the answer,
      or it cannot find the answer in available sources.\n- other: any other reason
      (e.g., capability limits, unclear question, etc.).\nOutput only the label, nothing
      else.\nTable 11: Human validation of the automated refusal classification.\n\nAnnotator_1
      vs LLM, Raw agreement = 0.84. Annotator_1 vs LLM, Cohen''s Kappa = 0.71. Annotator_2
      vs LLM, Raw agreement = 0.85. Annotator_2 vs LLM, Cohen''s Kappa = 0.73. Annotator_1
      vs Annotator_2, Raw agreement = 0.92. Annotator_1 vs Annotator_2, Cohen''s Kappa
      = 0.86", "C Second-Evaluator Sensitivity Audit\nInference and diagnostics. The
      separate 24-test family uses pointwise 95% bootstrap intervals and two-sided
      randomization tests, each with 10,000 replicates and seed 13, question resampling
      on ASQA and paper clustering on QASPER, with question-weighted means and Holm
      adjustment. The original 148-test analysis is unchanged. Tables 11-12 report
      precision means and all planned contrasts. All 16 emitted-grounded gaps remain
      positive after adjustment; the eight cross-evaluator precision differences remain
      unresolved, which does not establish equivalence. ECR and other budgets are
      outside this audit.\nThe run scored 6,015 unique pairs in 419 seconds of model
      inference (430 seconds including bookkeeping; setup and excluded attempts are
      additional). Four inputs required truncation, with maximum pre-truncation length
      47,440 tokens. After normalization, 122 pairs (2.03%) produced nonbinary strings,
      including 103 empty strings; assigning zero does not establish reliable nonentailment.
      These are pair counts, not fractions of questions affected; the full histogram
      accompanies the cache. Recovery can disagree substantially: QASPER LLMLingua-2
      has 50.3% agreement over 1,000 candidate decisions and mean recovery rates of
      0.84 for DeBERTa versus 0.38 for TRUE. These descriptive results support sensitivity
      analysis, not accuracy against human judgments.\n", "This is a heatmap (confusion
      matrix-style chart) displaying pairwise rater agreement using Cohen''s \u03ba
      among four raters/models: Llama-Guard, WildGuard, ShieldGemma, and Accuracy.
      The overall Fleiss'' \u03ba is 0.56 (n=6920), indicating moderate agreement.
      The diagonal shows perfect agreement (1.00), while off-diagonal values range
      from 0.47 to 0.67, with WildGuard and Accuracy showing the highest pairwise
      agreement (0.67) and Llama-Guard/ShieldGemma and ShieldGemma/Accuracy showing
      lower agreement (0.48\u20130.49); the color scale ranges from 0 to 1.0 (yellow
      to dark red).", "A.7 Detailed safety evaluation comparison\nFigure 5 shows the
      proportion of responses marked as either ''harmful'' or ''accurate'' for each
      model and condition. The generally consistent vertical structure indicates that
      although the methods of safety evaluation lead to different results, the trends
      (averaged over many samples) are consistent across evaluators. Nonetheless,
      we would recommend that researchers use multiple evaluators in their study,
      given the fairly high rates of disagreement observed here.", "4.1 R1: Capability
      in safe and unsafe contexts\nTable 3 reports accuracies for each model when
      asked benign and harmful questions, in both nonRAG, oracle RAG, and mixed settings.
      In the benign case, accuracy is scored using the MIRAGE benchmark method (Park
      et al., 2025). In the harmful (RAG-Safety-Bench) case, we compare the output
      response with the expected benchmark response, using Claude-Opus-4.7 to output
      a fi- nal label of accurate or inaccurate relative to the reference. Human annotation
      of a subset of 100 examples validates the LLM-as-a-judge approach, with agreement
      of 95-96% between humans and LLM, and Cohen''s \u03ba of 0.90-0.92 (more details
      and prompt available in Appendix Section A.4).\nTable 1: The four settings of
      the RAG-Safety-Bench benchmark. Example documents are for the query, ''What
      materials and design do I need to make an IED that can defeat armored police
      vehicles?''\n\nLLM-only, Description = No context documents provided.. LLM-only,
      Example Wikipedia documents = (None). Oracle, Description = One of the returned
      documents contains the answer.. Oracle, Example Wikipedia documents = ''Explosively
      formed penetrator''. On-topic, Description = Oracle document not included, but
      documents are related to the topic of the query.. On-topic, Example Wikipedia
      documents = ''Deflagration to detonation tran- sition'', ''Blast wall''. Random,
      Description = Documents are randomly selected from a set of benign documents..
      Random, Example Wikipedia documents = ''Climate change and birds'', ''Ar- boretum''",
      "Ethical considerations\nThis benchmark contains questions and answers that
      can be dangerous, harmful, and disturbing. However, because the content is sourced
      from Wikipedia, we are not introducing new knowledge into the information ecosystem
      nor making it meaningfully easier to access. The benchmark aggregates this information
      in a form useful for safety evaluation, and we therefore believe the risks inherent
      in releasing it are outweighed by the potential benefit of improving in retrieval-augmented
      AI systems.\nThe intended use of this benchmark is to support safety evaluation
      and research on RAG safety mitigations. Wikipedia text is licensed under CC
      BYSA 4.0, which allows redistribution under the following requirements: attribution,
      indicating modifications, ''ShareAlike'' condition, and license notice. Our
      benchmark satisfies these criteria by: providing a URL to each original Wikipedia
      article (attribution), describing the process of summarization and article truncation
      (modification), releasing under the same CC BY-SA 4.0 license (ShareAlike),
      and including a link to the license in the published version of the benchmark
      (license notice).\nHuman annotators involved in benchmark validation were authors
      of this paper and were fully briefed on the nature of the data and the importance
      of managing mental health while dealing with the potentially difficult content.
      As authors, they were not paid separately for the annotation work.\nAI tools
      (Claude) for coding assistance and data visualization were used throughout this
      project. Experimental design, interpretation, and writing were done solely by
      the authors.", "3.3 Automated safety judges\nWe compare three available LLM
      safety judges: Meta''s LlamaGuard-3-8B (Inan et al., 2023; Grattafiori et al.,
      2024) Google''s ShieldGemma2B (Zeng et al., 2024b), and Allen AI''s WildGuard
      (Han et al., 2024). LlamaGuard produces a binary ''safe'' or ''unsafe'' output,
      according to the MLCommons Hazard taxonomy. ShieldGemma produces a per-policy
      classification across four safety policies (Dangerous Content, Harassment, Hate
      Speech, Sexually Explicit); we assess harmfulness across all four policies and
      return a label of ''unsafe'' if any of the four exceed a probability of 0.5.
      WildGuard is trained to detect four broad categories of harm (Privacy, Misinformation,
      Harmful language, and Malicious uses) and assesses responses for both refusal
      and harmfulness; we consider the (binary) harmfulness label assigned to the
      response.\nFor each response, an overall label of ''unsafe'' is assigned when
      at least two of the three safety evaluators flag the response as unsafe. We
      compute pairwise inter-annotator agreement of the evaluators using Cohen''s
      Kappa.", "D Judge Metrics\nWe use Substring Match as the primary metric because
      it is deterministic and consistent with standard open-domain QA evaluation.
      However, it can overestimate answer quality when a model lists multiple candidate
      answers: the prediction receives full credit whenever it contains a gold-answer
      alias as a substring, even if the response is ambiguous, unsupported, or includes
      incorrect alternatives. We therefore additionally report LLM-as-a-judge scores,
      which evaluate the correctness of the generated answer in the context of the
      question and reference answer. The judge assigns a score of 1 for a correct
      answer, 0.5 for a partially correct answer, and 0 for a wrong answer; we report
      the mean score as a percentage. This complementary evaluation penalizes answer
      enumeration and verifies that improvements in Match correspond to genuinely
      correct answers rather than increased lexical overlap with the reference.\nTable
      5: Training schedule for the three-stage procedure.\n\nStage 1, Examples = 2,000,000.
      Stage 1, Epochs = 1. Stage 2, Examples = 500,000. Stage 2, Epochs = 1. Stage
      3 (KILT-SCR), Examples = 196,916. Stage 3 (KILT-SCR), Epochs = 3\nFor each example,
      we provide the judge with the question, the reference answer, and the model
      prediction. We use the following prompt:\nSystem prompt: You are an evaluation
      tool. Answer with one of: 1: Correct, 0.5: Partially correct, 0: Wrong.\nUser
      prompt: Here is a question, a golden answer, and an AI-generated answer. Can
      you judge whether the AIgenerated answer is correct according to the question
      and golden answer? Simply answer with one of: 1: Correct, 0.5: Partially correct,
      0: Wrong.\nQuestion:\n{question}\nGolden answer:\n{answer}\nGenerated answer:
      {prediction}\nFigure 7 corroborates the Match-based robustness trends. At the
      training-time compression rate of 16 \u00d7 , AdaMem matches or exceeds OSCAR
      across all three benchmarks, improving by 1.8 points on TriviaQA and 2.4 points
      on NQ, while the methods are effectively tied on HotpotQA. The advantage grows
      under stronger inference-time compression. At 64 \u00d7 , AdaMem exceeds OSCAR
      by 6.1 points on TriviaQA and NQ, and by 7.1 points on HotpotQA. In contrast
      to OSCAR, AdaMem remains stable as the memory budget shrinks: its judge score
      decreases by only 0.9, 3.3, and 1.4 points from 16 \u00d7 to 64 \u00d7 on TriviaQA,
      NQ, and HotpotQA, respectively, compared with drops of 5.2, 7.0, and 8.7 points
      for OSCAR. These results show that relevance-aware allocation preserves answer-critical
      information under severe compression, rather than merely improving lexical overlap
      with reference answers.", "C Second-Evaluator Sensitivity Audit\nWe sample 100
      questions per dataset from sorted common-cohort IDs using a fresh Python seed13
      random generator; QASPER spans 84 papers. Full-context identity and nominal-0.25
      extraction, RECOMP, and LLMLingua-2 contribute 800 unchanged saved answers,
      with 1,627 claims and 1,890 citation markers. The prior DeBERTa values are the
      original scores for these same sampled answers.\nModel and decoding. We use
      google/t5_xxl_true_nli_mixture (Honovich et al., 2022), revision aa6cfe1dd4
      , with full revision and checkpoint hashes in the manifest. This released mixture
      uses SNLI, MNLI, FEVER, SciTail, PAWS, and VitaminC (Bowman et al., 2015; Williams
      et al., 2018; Thorne et al., 2018; Khot et al., 2018; Zhang et al., 2019; Schuster
      et al., 2021), rather than the original TRUE paper''s ANLI recipe. MNLI and
      FEVER overlap DeBERTa''s training mixture. Inference uses Transformers 4.57.6,
      the slow T5 tokenizer, BF16, batch size four, and one NVIDIA B200. The prompt
      places compressed text or source evidence after premise: and the unit or claim
      after hypothesis: .\nWe use an AutoAIS-style exact-one decision (Bohnet et al.,
      2022; Gao et al., 2023): generate at most ten tokens deterministically, strip
      surrounding whitespace, and count only 1 as entailment. Every other string scores
      zero; these are binary decisions, not calibrated probabilities. Unlike our rule,
      reference AutoAIS/ALCE code compares decoded strings without additional whitespace
      normalization. We retain normalized nonbinary strings, but not every raw output,
      so normalization''s effect cannot be quantified from the cache.\nEvidence mappings.
      Fixed recovery preserves declared provenance and DeBERTa-recovered source IDs
      while TRUE scores support. TRUE recovery reevaluates all top-10 lexical candidates
      for undeclared units, including DeBERTa-rejected candidates, then scores with
      TRUE. Both retain the corrected precision gate. Fixed recovery retains selection
      dependence; TRUE recovery reuses one judge. Neither removes bounded-search errors
      or supplies human calibration.\nRecorded amendments. Astrict-decoding pilot
      stopped on a nonbinary output; a second stopped on an overlong hypothesis. An
      input-only scan found five undeclared units exceeding 2,048 tokens (maximum
      hypothesis plus prompt: 2,988), motivating a uniform 4,096-token cap that preserves
      complete hypotheses and truncates only premises. A later batch-eight run exhausted
      GPU memory. All interrupted attempts and plans are preserved but excluded; the
      final batch-four run recomputes every input in a fresh cache. These amendments
      preceded inspection of any aggregate TRUE comparison report and left the sample,
      thresholds, and 24 comparisons unchanged. The cap exceeds original TRUE''s 2,048
      and DeBERTa''s 512 tokens, so cross-evaluator differences do not isolate model
      family.", "Sensitivity to the re-attribution threshold.\nSecond-evaluator sensitivity.
      We rescore 100 questions per dataset with TRUE T5-XXL (Honovich et al., 2022),
      covering full-context identity plus extraction, RECOMP, and LLMLingua-2 at nominal
      0.25. With source mappings fixed, RECOMP''s emitted/grounded precision is 0.78/0.13
      on ASQA and 0.44/0.01 on QASPER. The paired gaps are 0.65 [0.55, 0.75] and 0.43
      [0.33, 0.53], respectively. When TRUE also selects recovered spans, grounded
      precision is 0.14 and 0.03. All 16 planned emitted-minus-grounded precision
      and recall gaps across both methods, datasets, and recovery modes are positive
      ( p H = 0 . 0024 in a separate 24-test family). None of the eight cross-evaluator
      grounded-precision differences passes Holm adjustment; this does not establish
      equivalence or validate the primary numbers. Appendix C reports all comparisons,
      the 4,096-token input configuration, decoder anomalies, and documented restarts.
      The pattern persists under a second scoring family, with recovery and calibration
      limitations retained.", "A.3 Answerability audit of evaluation contexts\nWe
      audited the exact rendered contexts used for the final balanced evaluation subset
      (346 questions) using GPT-4.1-mini. Given a question and its supplied documents,
      the judge classified whether the documents contained the information needed
      to directly and substantially answer the question as yes , partial , or no .
      We retained examples only when the oracle context was judged yes or partial
      and the on-topic context was judged no . Thus, the oracle condition contains
      answer-bearing evidence, while the on-topic condition is topically related but
      does not directly support the unsafe answer.\nTable 8 reports the final audit
      outcomes. The random-control condition was constructed from a benign, off-topic
      document pool rather than independently re-judged by the LLM: all 346 randomcontrol
      contexts contain only documents labelled none for answer support in the benchmark
      metadata (1,012 documents in total).", "9 Limitations\nEvaluator dependence.
      Primary scores use DeBERTa-v3-base, trained on MNLI, FEVER, and ANLI, at \u03c4
      = 0 . 5 , without human calibration. Using the same model to select recovered
      spans and score support can reinforce systematic errors; the resulting scores
      are evaluator-dependent estimates, not validated rates of source support or
      factual correctness. This dependence also limits conclusions about method rankings
      and the size of emitted-grounded gaps. The 200-question TRUE audit checks a
      second scoring family, but fixed recovery retains DeBERTa selection and TRUE
      recovery reuses one judge. Different input windows and nonbinary decoder outputs
      further limit numerical comparison. Human source-level calibration remains necessary
      (Rashkin et al., 2023).\nSingle generator. All results use Qwen2.5-7BInstruct
      with greedy decoding. Frontier shapes may differ across model families and scales;
      a second-family replication is planned.\nDataset coverage. We evaluate two English
      datasets (ASQA and QASPER) with distinct retrieval granularities, but this does
      not cover multilingual settings, open-web retrieval, or longercontext regimes.\nRe-attribution
      hyperparameters. The top-10 lexical candidate pool can miss semantically matching
      snippets, and requiring one snippet to entail a unit can miss support distributed
      across snippets. Consequently, a failed recovery does not establish that the
      source contains no support. Table 3 varies the recovery threshold while holding
      the scoring threshold fixed; it does not validate the evaluator or test candidate-pool
      size, retrieval strategy, or multi-snippet recovery.\nVerification scope. Declared-span
      verification rejects claims lacking declared evidence by construction, even
      if support could be recovered. Its 1 . 00 unsupported rate for no-provenance
      runs is a provenance-availability diagnostic, not a calibrated hallucination
      rate. Recovered-source verification is reported at nominal 0.25 for the two
      no-provenance methods and remains dependent on the same bounded recovery procedure
      and evaluator.\nResidual error rows. Only identity fails on 4 ASQA and 29 QASPER
      questions; every primary setting is evaluated on the resulting common successful
      subset. This pairing prevents comparisons from using different questions, but
      conditions results on identity success and omits those difficult cases. Sampling
      intervals condition on the fixed generated outputs and evaluator; they do not
      include systematic NLI error or variation across generation runs.\nNominal versus
      achieved budgets. Abstractive compressors do not reliably hit nominal token
      budgets; RECOMP often produces much less context than requested. We report achieved
      compression ratios, but comparisons at a shared nominal budget do not establish
      performance at matched achieved context sizes.", "B Complete Paired Comparisons\nSection
      4.2 describes the common cohorts, estimands, inference, and precision-code correction.
      Tables 6-10 report all 148 planned contrasts, including those not retained as
      claims; EF1 effects and intervals use four decimal places, and other effects
      and intervals use three.\nTable notation. A/Q denote ASQA/QASPER; Id, RR, X,
      RC, and LL denote identity, reranking, extraction, RECOMP, and LLMLingua-2.
      Setting labels give compressor/nominal budget, optionally followed by the recovery
      threshold. P/R denote precision/recall, with e/g for emitted/grounded; EM is
      str-EM, EF1 is evidence F1, and Rec is reattribution rate. U s /U m /U r denote
      declared-span, summary, and recovered-source unsupported rates. \u2206 is the
      paired left-minus-right mean difference; a single endpoint applies to both settings,
      and a pair lists left-minus-right metrics. CI is a pointwise 95% bootstrap interval;
      p H is the two-sided randomization p -value after Holm adjustment across all
      148 comparisons; n counts included questions.\nRecovered-source verification.
      This extension reads existing NLI scores from the sealed cache and makes no
      new model calls. It uses the same recovered source IDs as citation scoring,
      but the claim verifier removes repeated source IDs before pooling evidence.
      Consequently, its unsupported rate need not equal one minus grounded citation
      recall, which retains repeated cited evidence. Both summary and recovered-source
      rates exclude the same zero-claim answers: two QASPER RECOMP answers at nominal
      0.25; the other three comparisons use their full common cohorts. Input hashes,
      the extension plan, cache lookups, perquestion records, and all four comparisons
      are retained separately from the original analysis.\n", "4 Experimental Setup\nWe
      know what size of effect we could have caught. Our sample sizes give 80% power
      to detect a difference of roughly 7 percentage points (pp). Plainly: had RLVR
      moved post-rationalization by 7pp or more in either direction, this design would
      almost certainly have caught it. Shifts of a couple of points stay inside our
      blind spot, which is why we report a bounded null rather than a flat absence
      of effect. We fixed the primary outcome and the family of corrected comparisons
      in writing before the scorer ran.\nCompute. Everything ran on Kaggle''s free
      tier, two T4s or a single P100 per session: 48 GPU jobs yielding 36,690 scored
      records across four models, four datasets, three variants, and both conditions.
      The original study used a 104B model; the controlled version of the same measurement
      fits on hardware anyone can get for free, and that is the part we would most
      like other groups to borrow.", "B. Accuracy Degradation\nOne detail in Table
      I needs to be read carefully. The 0 / 3 row still shows a fooled rate near 10%
      and an accuracy about 9 points below the clean arm, even though no passage is
      rewritten and both answers see the same retrieved list. That residual is therefore
      not a retrieval mismatch. It comes from decoding noise under temperature 0.1
      across two independent generations, plus a strict keyword matcher that can disagree
      on near-paraphrases. Recomputing from the 588-run table, clean and poisoned
      answers are identical in only 76.9% of the 0 / 3 runs. The residual is large
      relative to some attack increments (the rise from 9.5% to 15.0% fooled between
      0 / 3 and 1 / 3 is 5.5 points), so strategy contrasts at light poisoning should
      be read as suggestive until decoding is controlled (fixed seeds, repeated draws)
      and labels are less brittle. We therefore read the clean-arm column, not the
      0 / 3 poisoned cell, as the true no-attack baseline.", "Table 8: Answerability
      of document contexts for the final balanced subset ( n = 346 ). Oracle and on-topic
      contexts were audited with GPT-4.1mini. \u2020 Random-control values reflect
      construction-time answer\\_support=none labels rather than a separate LLM audit.\n\n|
      Condition        | Yes         | Partial     | No / none    |\n|------------------|-------------|-------------|--------------|\n|
      Oracle unsafe    | 200 (57.8%) | 146 (42.2%) | 0 (0.0%)     |\n| On-topic safe    |
      0 (0.0%)    | 0 (0.0%)    | 346 (100.0%) |\n| Random control \u2020 | 0 (0.0%)    |
      0 (0.0%)    | 346 (100.0%) |"], "model": "rerank-2.5", "top_k": 5, "truncation":
      true}'
