      (table, page 15)\",\"citations\":{\"enabled\":true}},{\"type\":\"document\",\"source\":{\"type\":\"text\",\"media_type\":\"text/plain\",\"data\":\"A.4
      LLM-as-a-judge accuracy evaluation\\nThe accuracy of the responses was assessed
