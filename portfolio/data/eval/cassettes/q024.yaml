      (text, page 17)\",\"citations\":{\"enabled\":true}},{\"type\":\"document\",\"source\":{\"type\":\"text\",\"media_type\":\"text/plain\",\"data\":\"This
      is a heatmap (confusion matrix-style chart) displaying pairwise rater agreement
      using Cohen's \u03BA among four raters/models: Llama-Guard, WildGuard, ShieldGemma,
      and Accuracy. The overall Fleiss' \u03BA is 0.56 (n=6920), indicating moderate
      agreement. The diagonal shows perfect agreement (1.00), while off-diagonal values
      range from 0.47 to 0.67, with WildGuard and Accuracy showing the highest pairwise
