      Kappa of 0.92, while Annotator_2 vs LLM agreement was 0.95 with a Cohen's Kappa
      of 0.90.\\n\\nFor comparison, inter-annotator agreement between the two human
      annotators themselves was 0.97 agreement with a Cohen's Kappa of 0.94.\\n\\nThe
      text summarizes this as: The agreement between manual and automated accuracy
      scoring is very high, with raw agreement between 95-96% and Cohen's \u03BA of
