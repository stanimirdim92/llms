      (figure, page 8)\",\"citations\":{\"enabled\":true}},{\"type\":\"document\",\"source\":{\"type\":\"text\",\"media_type\":\"text/plain\",\"data\":\"4.1
      R1: Capability in safe and unsafe contexts\\nTable 3 reports accuracies for
      each model when asked benign and harmful questions, in both nonRAG, oracle RAG,
