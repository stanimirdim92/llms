      U m  | +0 . 253     | [+0 . 225 , +0 . 282]      | 0.0148 | 976 |", "4 Experimental
      Setup\nWe know what size of effect we could have caught. Our sample sizes give
      80% power to detect a difference of roughly 7 percentage points (pp). Plainly:
      had RLVR moved post-rationalization by 7pp or more in either direction, this
      design would almost certainly have caught it. Shifts of a couple of points stay
      inside our blind spot, which is why we report a bounded null rather than a flat
      absence of effect. We fixed the primary outcome and the family of corrected
      comparisons in writing before the scorer ran.\nCompute. Everything ran on Kaggle''s
      free tier, two T4s or a single P100 per session: 48 GPU jobs yielding 36,690
      scored records across four models, four datasets, three variants, and both conditions.
      The original study used a 104B model; the controlled version of the same measurement
      fits on hardware anyone can get for free, and that is the part we would most
      like other groups to borrow.", "5.1 What the control changes\nTable 3 sets the
      planted and control rates side by side for the baseline model, and the three
      variants could hardly behave more differently.", "B Complete Paired Comparisons\nSection
      4.2 describes the common cohorts, estimands, inference, and precision-code correction.
      Tables 6-10 report all 148 planned contrasts, including those not retained as
      claims; EF1 effects and intervals use four decimal places, and other effects
      and intervals use three.\nTable notation. A/Q denote ASQA/QASPER; Id, RR, X,
      RC, and LL denote identity, reranking, extraction, RECOMP, and LLMLingua-2.
      Setting labels give compressor/nominal budget, optionally followed by the recovery
      threshold. P/R denote precision/recall, with e/g for emitted/grounded; EM is
      str-EM, EF1 is evidence F1, and Rec is reattribution rate. U s /U m /U r denote
      declared-span, summary, and recovered-source unsupported rates. \u2206 is the
      paired left-minus-right mean difference; a single endpoint applies to both settings,
      and a pair lists left-minus-right metrics. CI is a pointwise 95% bootstrap interval;
      p H is the two-sided randomization p -value after Holm adjustment across all
      148 comparisons; n counts included questions.\nRecovered-source verification.
      This extension reads existing NLI scores from the sealed cache and makes no
      new model calls. It uses the same recovered source IDs as citation scoring,
      but the claim verifier removes repeated source IDs before pooling evidence.
      Consequently, its unsupported rate need not equal one minus grounded citation
      recall, which retains repeated cited evidence. Both summary and recovered-source
      rates exclude the same zero-claim answers: two QASPER RECOMP answers at nominal
      0.25; the other three comparisons use their full common cohorts. Input hashes,
      the extension plan, cache lookups, perquestion records, and all four comparisons
      are retained separately from the original analysis.\n", "4.2 Statistical Analysis
      and Metric Audit\nCommon cohorts and estimands. Primary summaries and comparisons
      use the intersection of successful question IDs across identity and all twenty
      compressed settings. Each question has equal weight in citation precision, citation
      recall, answer quality, and evidence F1; claims and citations are not pooled
      across questions. Undefined evidence or recovery metrics remain undefined rather
      than becoming zeros. Verification-rate means exclude answers with zero claims;
      paired verification comparisons exclude a question if ei- ther member has zero
      claims. The analysis artifacts report those exclusions and retain full-cohort
      descriptive means separately.\nInference. We use pointwise 95% percentile bootstrap
      intervals for each paired mean difference (Dror et al., 2018), resampling 944
      questions on ASQA and 271 papers on QASPER with replacement. All retained questions
      from a sampled QASPER paper travel together, and each replicate divides its
      total difference by the number of sampled questions, preserving the questionweighted
      estimand. Every QASPER contrast retains all 271 papers after metric-specific
      exclusions. Two-sided randomization tests swap paired labels within questions
      on ASQA and jointly within papers on QASPER. These tests assume label exchangeability
      within a resampling unit under the null. Both procedures use 10,000 replicates
      and seed 13, with independent random-number streams for bootstrap sampling and
      randomization. Monte Carlo p -values use ( b + 1) / (10 , 000 + 1) , where b
      counts randomizations at least as extreme as the observed absolute difference.
      The initial plan specified 134 core contrasts and 10 recoverythreshold contrasts
      before inspecting the revised inferential results. After that analysis and a
      cachecoverage audit, we added four recovered-source versus summary-verification
      contrasts at nominal 0.25 for RECOMP and LLMLingua-2 on both datasets. The extension
      plan was recorded before running these four tests, and Holm adjustment was recomputed
      over all 148 raw p -values. We denote Holm-adjusted values by p H . All reported
      adjusted values use this expanded family; original effects, intervals, and raw
      p -values are unchanged. This is a post hoc camera-ready analysis, not a preregistration.
      Intervals are pointwise, not simultaneous; statistical-support statements use
      p H < 0 . 05 . Failure to reject a difference does not establish equivalence
      or preservation. All inference is conditional on the fixed generator outputs,
      recovery procedure, and evaluator.\nPrecision-code audit. The manuscript''s
      precision definition requires the concatenated cited evidence to entail a claim
      before any individual citation receives credit. A code audit found that the
      previous implementation could credit an individually supporting citation even
      when joint entailment failed. A saved ASQA answer reproduced this discrepancy,
      and a regression test now checks the required gate through the evaluation pipeline.\n",
      "Reproducibility Statement\nSaved generation outputs, input hashes, and pinned
      evaluator revisions accompany perquestion rescoring records. The fixed contrast
      plans and paired-analysis reports regenerate the numerical tables and frontier
      figures without further model calls. The harness, configurations, protocol,
      and per-question records will be publicly released upon publication.", "C Second-Evaluator
      Sensitivity Audit\nInference and diagnostics. The separate 24-test family uses
      pointwise 95% bootstrap intervals and two-sided randomization tests, each with
      10,000 replicates and seed 13, question resampling on ASQA and paper clustering
      on QASPER, with question-weighted means and Holm adjustment. The original 148-test
      analysis is unchanged. Tables 11-12 report precision means and all planned contrasts.
      All 16 emitted-grounded gaps remain positive after adjustment; the eight cross-evaluator
      precision differences remain unresolved, which does not establish equivalence.
      ECR and other budgets are outside this audit.\nThe run scored 6,015 unique pairs
      in 419 seconds of model inference (430 seconds including bookkeeping; setup
      and excluded attempts are additional). Four inputs required truncation, with
      maximum pre-truncation length 47,440 tokens. After normalization, 122 pairs
      (2.03%) produced nonbinary strings, including 103 empty strings; assigning zero
      does not establish reliable nonentailment. These are pair counts, not fractions
      of questions affected; the full histogram accompanies the cache. Recovery can
      disagree substantially: QASPER LLMLingua-2 has 50.3% agreement over 1,000 candidate
      decisions and mean recovery rates of 0.84 for DeBERTa versus 0.38 for TRUE.
      These descriptive results support sensitivity analysis, not accuracy against
      human judgments.\n", "6 Discussion\nHow to read the R-Search result. R-Search
      sits above its base on all four datasets and significantly above on the best-powered
      one, which is a real and consistent pattern. It is also one model, one base,
      one prompt, and one scorer, so four datasets are not four independent replications,
      and the effect softens under a stricter variant and a looser outcome. Two things
      would settle it: a cross-dataset test declared in advance, and an arm fine-tuned
      on the same data without RL, which would separate the contribution of RL from
      the contribution of fine-tuning on retrieval data at all.\nA note on cost. Everything
      here, four models, four datasets, three variants, both conditions, and the control
      that makes the comparison interpretable, ran on Kaggle''s T4 GPUs. Careful measurement
      was the cheap part of this project. The expensive part was reading the construction
      code closely enough to know which controls we did not have to run.", "| Dataset   |
      Planted   | Control   |   Attr. | 95% CI       |\n|-----------|-----------|-----------|---------|--------------|\n|
      NQ        | 9/69      | 0/69      |   +13.0 | [5.5, 22.5]  |\n| QAMPARI   |
      16/123    | 0/123     |   +13.0 | [7.3, 19.7]  |\n| HAGRID    | 12/61     |
      0/61      |   +19.7 | [10.8, 31.3] |\n| RAGTruth  | 67/623    | 1/623     |   +10.6
      | [7.9, 13.5]  |", "E Training Schedule.\nTable 5 summarizes the number of training
      examples and epochs used at each stage. We train for one epoch in Stages 12
      and for three epochs during the final KILT-SCR fine-tuning stage.", "Table 5:
      Training schedule for the three-stage procedure.\n\n| Stage              |   Examples
      |   Epochs |\n|--------------------|------------|----------|\n| Stage 1            |  2,000,000
      |        1 |\n| Stage 2            |    500,000 |        1 |\n| Stage 3 (KILT-SCR)
      |    196,916 |        3 |", "E. Experimental Design\nThe evaluation set contains
      49 fact-checking queries, of which 37 are distinct, spanning locations, dates
      and counts, yes/no claims, and people. Ten information-rich passages covering
      the queried facts were added to the index because raw FEVER evidence sentences
      are often too terse to support a full answer. Crossing the query set with three
      strategies and four poisoning levels yields 49 \u00d7 3 \u00d7 4 = 588 runs,
      each producing a clean and a poisoned answer for 1 , 176 generations in total.
      Because a full sweep takes roughly a day on CPU, results are written to disk
      after every run and a checkpoint records completed cells, so an interrupted
      sweep resumes without repeating work.", "4 Experimental Setup\nLeakage drove
      the dataset choice. NQ is where the original probe ran, so we keep it for comparability,
      but Search-R1 trained on NQ''s training split and we say so plainly. QAMPARI,
      HAGRID, and RAGTruth were not used to train any of the three agents, so on those
      datasets no gap can be waved away as familiarity with the data. They also sidestep
      a retrieval quirk in NQ: for 186 of 499 NQquestions (37.3%), all five passages
      come from one document, which leaves the model almost no choice about what to
      cite. The other three datasets have no such questions.\nPrompt and generation.
      One prompt does all the work, byte-identical across models and across the clean
      and doctored runs. It tells the model to answer using only the numbered passages,
      to close every sentence with exactly one citation such as [2], and to reply
      ''I don''t know'' when the passages fall short. Decoding is greedy, capped at
      300 new tokens. When any sentence of an answer breaks the one-citation rule
      we drop the whole answer rather than salvage the compliant half, because a partly
      rescued answer reintroduces the claim-to-citation ambiguity the format exists
      to prevent. Models differ sharply in how often they abstain, from 15% to 52%
      of questions; Appendix C takes that apart. The full prompt is in Appendix A.\nReading
      our numbers. Three statistical choices shape every result, and each has a plain
      reason behind it.\nWe resample questions, not claims. A single question yields
      up to seven claims that share one context and one generated answer, so treating
      claims as independent would make our intervals look tighter than they are. We
      use a cluster bootstrap instead: draw whole questions with replacement 2,000
      times, recompute the planted and control conditions on the same draw so the
      pairing survives, and read off the 2.5th and 97.5th percentiles. Every 95% confidence
      interval in this paper is that band, the range of effects our data are consistent
      with.\nWe compare each agent against its own base. Post-rationalization is common
      in the baseline, so reporting that an agent post-rationalizes tells us nothing
      about RL. The question is whether an agent diverges from the model it was trained
      from. That calls for a difference-in-differences: take the plantversus-control
      difference within a model (Equation 1), then difference those differences across
      models,\n<!-- formula-not-decoded -->\nNegative says RLVR made citations more
      faithful, positive says it made them worse, and zero says training left this
      behavior alone. Within each dataset we test all three agents against the baseline
      and correct the three comparisons with the Holm method, so that running three
      tests does not manufacture a significant one.", "5.1 What the control changes\nTable
