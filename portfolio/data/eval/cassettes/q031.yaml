      string: "{\"result\":{\"points\":[{\"id\":\"c85f63c4-62ea-58c1-848a-69de7fecc12c\",\"version\":11,\"score\":0.36278272,\"payload\":{\"page_content\":\"3.3
        Topology-Aware Policy Optimization\\nAs illustrated in Figure 4, we propose
        TopologyAware Policy Optimization (TAPO) to address the systematic credit
        assignment problem in sparse reward reinforcement learning training, leveraging
        the topological structure of the memory graph to perform selective gradient
        masking that simultaneously rectifies both forms of bias across positive and
        negative trajectories with step-level precision.\",\"metadata\":{\"ingestion_version\":\"01a0fc547d2f738da4fc73667c19a759\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-afd90130549e21e7d5d373e21bd00946-text-0010\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-afd90130549e21e7d5d373e21bd00946\",\"chunk_type\":\"text\",\"section_path\":\"3.3
        Topology-Aware Policy Optimization\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":53,\"page_no\":5,\"filename\":\"2609.14066v1.pdf\"}}},{\"id\":\"44adc6eb-b72d-5aed-987b-f34107b3a12b\",\"version\":11,\"score\":0.32130796,\"payload\":{\"page_content\":\"Graph-Structured
        Trajectory Decomposition.\\nwhere \u03C9 g,i ( \u03B8 ) is the probability
        ratio of segment s ( i ) g under the current and old policies; n g denotes
        the number of segments in the g -th rollout. The (1 -\u03C8 g,i ) factor selectively
        gates gradient contributions based on the topological analysis of the memory
        graph: in positive trajectories, topological dead-end steps are masked to
        prevent their gradients from reinforcing redundant exploration; in negative
        trajectories, valuable retrieval steps are masked to prevent their gradients
        from penalizing effective retrieval behavior. Through this design, TAPO achieves
        precise step-level credit assignment across the entire multi-step reasoning
        trajectory, significantly outperforming conventional sparsereward methods
        that rely solely on terminal outcome signals.\",\"metadata\":{\"ingestion_version\":\"01a0fc547d2f738da4fc73667c19a759\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-afd90130549e21e7d5d373e21bd00946-text-0012\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-afd90130549e21e7d5d373e21bd00946\",\"chunk_type\":\"text\",\"section_path\":\"Graph-Structured
        Trajectory Decomposition.\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":67,\"page_no\":6,\"filename\":\"2609.14066v1.pdf\"}}},{\"id\":\"59092d56-3cbb-5656-86ca-e3d7ae515254\",\"version\":11,\"score\":0.321128,\"payload\":{\"page_content\":\"1
        Introduction\\nTo address the mentioned limitations, we propose GraMRAG, a
        novel graph memory-guided multi-agent RAG framework. First, to bridge the
        long-horizon reasoning gap, we introduce a visiontext bridged reasoning paradigm
        that orchestrates multi-scale entity cropping with a ReAct-style visual toolchain,
        seamlessly transferring the iterative planning capability of text-only deep
        research models into the multimodal domain to enable longhorizon cross-modal
        reasoning trajectories. Second, to overcome state blindness and context expansion
        in linear memory paradigms, we construct a multimodal memory graph that formalizes
        the reasoning process as a dynamic directed acyclic graph (DAG), explicitly
        encoding agent actions and multimodal observations with their temporal and
        logical dependencies to mitigate redundant retrieval and state blindness.
        Third, to tackle the credit assignment problem from coarse terminal rewards,
        we introduce a Topology-Aware Policy Optimization (TAPO) algorithm that leverages
        the graph topology to identify critical reasoning paths and perform targeted
        node pruning, precisely masking false positive and false negative nodes during
        policy updates to enable fine-grained credit assignment across multi-step
        reasoning.\\nOur contributions are summarized as follows:\\n- We introduce
        a vision-text bridged reasoning paradigm that unifies multi-scale entity cropping
        with a ReAct-style visual toolchain, enabling long-horizon cross-modal reasoning.\\n-
        Weconstruct a multimodal memory graph that formalizes agent reasoning as a
        dynamic DAG to systematically mitigate state blindness and redundant retrieval.\\n-
        We develop a TAPO algorithm leveraging graph topology for critical path identification
        and node pruning, enabling fine-grained credit assignment across multi-step
        reasoning.\\n- We conduct extensive experiments on challenging multimodal
        benchmarks to evaluate our approach, demonstrating state-of-the-art performance
        over existing baselines.\",\"metadata\":{\"ingestion_version\":\"01a0fc547d2f738da4fc73667c19a759\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-afd90130549e21e7d5d373e21bd00946-text-0003\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-afd90130549e21e7d5d373e21bd00946\",\"chunk_type\":\"text\",\"section_path\":\"1
        Introduction\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":13,\"page_no\":2,\"filename\":\"2609.14066v1.pdf\"}}},{\"id\":\"fe156681-1b2b-5d34-8147-50db5e25bc7a\",\"version\":11,\"score\":0.31736827,\"payload\":{\"page_content\":\"Retrieval
        quality depends on reasoning depth.\\nHigh-quality answer generation in complex
        multimodal tasks depends on sustaining precise multiround retrieval across
        a long reasoning horizon. Traditional memory paradigms cause agents to progressively
        lose track of historical retrieval paths and accumulate redundant searches
        that severely constrain effective reasoning depth. GraMRAG addresses this
        by transferring the iterative planning capability into the multimodal domain
        via the vision-text bridged reasoning paradigm, supporting trajectories spanning
        tens of steps; the multimodal memory graph further encodes action-observation
        dependencies explicitly, directing each retrieval attempt precisely toward
        unexplored evidence space. As shown in Figure 5, this design yields substantially
        higher hit rate across all three task categories, directly validating the
        decisive role of long-horizon reasoning depth in determining retrieval quality.\\nGraph
        memory mitigates state blindness. The dynamic DAG representation of the multimodal
        memory graph explicitly encodes actionobservation dependencies as directed
        edges, enabling each agent to efficiently access the complete historical reasoning
        trajectory and effectively mitigating state blindness. As shown in Table 2,
        replacing iterative summarization-based memory with the multimodal memory
        graph yields a 3.3point performance improvement, validating that the multimodal
        memory graph effectively mitigates state blindness and suppresses redundant
        retrieval, confirming the necessity of structured memory in long-horizon multimodal
        reasoning.\\nFigure 6: Analysis of training efficiency.\\nGraph pruning accelerates
        training convergence. As demonstrated in Figure 6, TAPO achieves faster convergence
        throughout training compared to the baseline Group Sequence Policy Optimization
        (GSPO) (Zheng et al., 2025), indicating that topology-guided graph pruning
        drives the model toward faster convergence by supplying cleaner credit assignment
        signals. This yields two critical insights into agentic reinforcement learning:
        first, optimization stability fundamentally depends on ensuring correct positive
        gradient signals while eliminating ambiguous updates from negative trajectories;
        second, the quality of rollout samples, specifically their preference alignment,
        is more decisive for performance than simply scaling up the training set.
        By simultaneously masking dead-end nodes in positive trajectories and preserving
        valuable nodes in negative ones, TAPO achieves finegrained step-level credit
        assignment rather than coarse terminal-reward-level optimization.\",\"metadata\":{\"ingestion_version\":\"01a0fc547d2f738da4fc73667c19a759\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-afd90130549e21e7d5d373e21bd00946-text-0018\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-afd90130549e21e7d5d373e21bd00946\",\"chunk_type\":\"text\",\"section_path\":\"Retrieval
        quality depends on reasoning depth.\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":87,\"page_no\":8,\"filename\":\"2609.14066v1.pdf\"}}},{\"id\":\"3b2d300c-347f-5d60-a199-038a9f89c567\",\"version\":11,\"score\":0.29411402,\"payload\":{\"page_content\":\"6
        Conclusion\\nIn this paper, we introduce GraMRAG, a novel graph memory-guided
        multi-agent RAG framework for complex multimodal long-horizon reasoning tasks.
        Our approach integrates three key innovations: a vision-text bridged reasoning
        paradigm that unifies multi-scale entity cropping with a ReActstyle visual
        toolchain for long-horizon cross-modal reasoning; multimodal memory graph
        construction that formalizes agent reasoning as a dynamic directed acyclic
        graph (DAG) to fundamentally mit- igate state blindness and suppress redundant
        retrieval; and Topology-Aware Policy Optimization (TAPO) algorithm that leverages
        graph topology for fine-grained credit assignment across multi-step reasoning
        trajectories. Extensive experiments on diverse multimodal benchmarks demonstrate
        that our method consistently outperforms existing baselines and achieves state-of-the-art
        performance. Future work will investigate the scalability of the proposed
        framework to larger architectures and broader multimodal scenarios.\",\"metadata\":{\"ingestion_version\":\"01a0fc547d2f738da4fc73667c19a759\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-afd90130549e21e7d5d373e21bd00946-text-0019\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-afd90130549e21e7d5d373e21bd00946\",\"chunk_type\":\"text\",\"section_path\":\"6
        Conclusion\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":93,\"page_no\":8,\"filename\":\"2609.14066v1.pdf\"}}},{\"id\":\"4cdda0fd-2332-5c20-991e-bb1d16fdd99e\",\"version\":11,\"score\":0.28184205,\"payload\":{\"page_content\":\"Abstract\\nAlthough
        existing multi-agent RetrievalAugmented Generation (RAG) systems have demonstrated
        promise on complex multimodal reasoning tasks, they remain fundamentally limited
        in reasoning depth and memory structure, suffering from inadequate retrieval
        and state blindness when answering knowledge-intensive questions. To address
        these limitations, we propose GraMRAG, a graph memory-guided multi-agent RAG
        framework that integrates a dynamic multimodal memory graph to enable stable,
        multi-step multimodal reasoning. We introduce a visiontext bridged reasoning
        paradigm that unifies multi-scale entity cropping with a ReAct-style visual
        toolchain, enhancing the long-horizon cross-modal reasoning capability. We
        further construct a multimodal memory graph that formalizes agent reasoning
        as a dynamic directed acyclic graph (DAG), explicitly modeling action-observation
        dependencies to mitigate state blindness and suppress redundant retrieval.
        Moreover, we propose Topology-Aware Policy Optimization (TAPO) that leverages
        graph topology for critical path identification and targeted node pruning,
        enabling fine-grained credit assignment across multi-step reasoning trajectories.
        Extensive experiments on challenging multimodal benchmarks demonstrate that
        our approach consistently outperforms existing baselines and achieves state-of-the-art
        performance on complex long-horizon reasoning tasks.\",\"metadata\":{\"ingestion_version\":\"01a0fc547d2f738da4fc73667c19a759\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-afd90130549e21e7d5d373e21bd00946-text-0001\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-afd90130549e21e7d5d373e21bd00946\",\"chunk_type\":\"text\",\"section_path\":\"Abstract\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":4,\"page_no\":1,\"filename\":\"2609.14066v1.pdf\"}}},{\"id\":\"f7e097ce-31b5-540f-bd72-895b8c4cc461\",\"version\":11,\"score\":0.27620023,\"payload\":{\"page_content\":\"3.2
        Multimodal Memory Graph\\nWe construct a multimodal memory graph G t = ( V
        t , E t ) that formalizes the multi-agent reasoning process as a dynamic DAG.
        This graph explicitly encodes action-observation dependencies across both
        the visual retrieval and textual research phases via a topological structure,
        fundamentally mitigating the state blindness inherent in linear memory paradigms
        and providing the structured foundation required by the TAPO algorithm. As
        illustrated in Figure 2(b), the memory graph evolves incrementally throughout
        reasoning, faithfully recording the exploration trajectory of each agent through
        node insertions and edge connections at each step.\\nNode Schema and Modality
        Classification. Each node n i \u2208 V t encodes a discrete reasoning unit
        as a typed quadruple:\\n<!-- formula-not-decoded -->\\nwhere \xB5 i \u2208
        { n root , n vis , n brd , n txt , n ans } is the modality type tag; \u03BA
        i is the search query or action descriptor driving the creation of this node;
        \u03C3 i is a concise textual summary of retrieved or generated content; and
        \u03BD i is the visual feature bank, populated only for n vis-type nodes and
        set to empty for all other types. Five node types constitute the full reasoning
        pipeline. The root node ( n root ) is initialized with user query q and input
        image I , serving as the global anchor of the reasoning graph and permanently
        residing in V t . Visual nodes ( n vis) are spawned by the Visual Explorer
        at each retrieval step t \u2208 [1 , T v ] , storing the Hit/No Hit judgment
        and the corresponding evidence summary, with \u03BD i preserving multimodal
        content from matched web pages. The bridge node ( n brd) is a singleton node
        representing the modality bridging step, storing image description D as the
        semantic interface between the two reasoning phases. Text nodes ( n txt) are
        spawned by the Text Researcher at each retrieval step t \u2208 [ T v + 1 ,
        T v + T t ] , storing webretrieved textual evidence summaries. The answer
        node ( n ans) is spawned by the Evidence Validator, storing the final generated
        answer a out , whose insertion marks the termination of the reasoning process.
        The edge set E t connects temporally adjacent nodes , encoding the sequential
        dependency of the reasoning flow.\\nFigure 3: Inference pipeline of the GraMRAG
        framework.\",\"metadata\":{\"ingestion_version\":\"01a0fc547d2f738da4fc73667c19a759\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-afd90130549e21e7d5d373e21bd00946-text-0008\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-afd90130549e21e7d5d373e21bd00946\",\"chunk_type\":\"text\",\"section_path\":\"3.2
        Multimodal Memory Graph\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":45,\"page_no\":4,\"filename\":\"2609.14066v1.pdf\"}}},{\"id\":\"99611404-0473-5fdf-85ca-fe9e952d6372\",\"version\":11,\"score\":0.27243087,\"payload\":{\"page_content\":\"Graph-Structured
        Trajectory Decomposition.\\nWe ground the reinforcement learning framework
        in the memory graph structure defined in Section 3.2. At each reasoning step
