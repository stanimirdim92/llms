      problem in sparse-reward reinforcement learning by leveraging the memory graph's
      structure.\\n\\nSystem answer: TAPO (Topology-Aware Policy Optimization) is
      a reinforcement learning algorithm introduced as part of the GraMRAG framework.
      It is proposed to address the systematic credit assignment problem in sparse
      reward reinforcement learning training, leveraging the topological structure
      of the memory graph to perform selective gradient masking that simultaneously
      rectifies both forms of bias across positive and negative trajectories with
      step-level precision.\\n\\n**The problem it addresses:**\\n\\nThe underlying
      issue is the credit assignment problem caused by coarse, sparse terminal rewards
      in multi-step reasoning. As stated in the paper's contributions, to tackle the
      credit assignment problem from coarse terminal rewards, the authors introduce
      a Topology-Aware Policy Optimization (TAPO) algorithm that leverages the graph
      topology to identify critical reasoning paths and perform targeted node pruning,
      precisely masking false positive and false negative nodes during policy updates
      to enable fine-grained credit assignment across multi-step reasoning.\\n\\n**How
      TAPO works mechanically:**\\n\\nTAPO operates through graph-structured trajectory
      decomposition, where gradient contributions from different reasoning steps are
      selectively gated based on their role in the memory graph. Specifically, the
      (1-\u03C8_g,i) factor selectively gates gradient contributions based on the
      topological analysis of the memory graph: in positive trajectories, topological
      dead-end steps are masked to prevent their gradients from reinforcing redundant
      exploration; in negative trajectories, valuable retrieval steps are masked to
      prevent their gradients from penalizing effective retrieval behavior.\\n\\nThis
      design allows TAPO to overcome the limitations of standard outcome-based reward
      methods: through this design, TAPO achieves precise step-level credit assignment
      across the entire multi-step reasoning trajectory, significantly outperforming
      conventional sparse-reward methods that rely solely on terminal outcome signals.\\n\\nIn
      short, TAPO solves the problem where a single terminal reward (success/failure)
      cannot properly attribute credit or blame to individual intermediate steps\u2014some
      of which may be \\\"dead ends\\\" even in a successful trajectory, or valuable
      retrieval actions even within an ultimately unsuccessful one. By using the memory
