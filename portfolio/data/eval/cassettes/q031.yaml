        Ablation Study\\nTo validate the contribution of each component in GraMRAG,
        we conduct ablation studies across all benchmarks. As shown in Table 2, the
        three components exhibit clear progressive complementarity: long-horizon reasoning
        enables sustained multiround retrieval across extended cross-modal rea- soning
        trajectories; the multimodal memory graph demonstrates that formalizing reasoning
        as a dynamic DAG effectively mitigates state blindness and suppresses redundant
        retrieval; and replacing the standard sparse-reward method Group Relative
        Policy Optimization (GRPO) (Shao et al., 2024) with TAPO delivers a further
        improvement, directly confirming the critical role of topology-guided credit
        assignment in fine-grained policy optimization. The complete model achieves
        an average score of 53.5%, an improvement of over 9 points above the baseline,
        comprehensively validating the necessity and complementarity of each component.\\nFigure
        5: Analysis of retrieval performance.\",\"metadata\":{\"ingestion_version\":\"01a0fc547d2f738da4fc73667c19a759\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-afd90130549e21e7d5d373e21bd00946-text-0017\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-afd90130549e21e7d5d373e21bd00946\",\"chunk_type\":\"text\",\"section_path\":\"4.4
