        formula-not-decoded -->\\nwhere s sys is the system instruction and H t =
        Serialize( G t -1 ) is the graph-linearized memory context. The policy model
        produces an reasoning segment that corresponds precisely to the construction
        of a single memory graph node n t :\\n<!-- formula-not-decoded -->\\nwhere
        \u03B6 t denotes the chain-of-thought reasoning preceding action A t , and
        O t is the environmental observation returned by the external tools. The terminal
        segment takes the form s ans = ( C ans , \u03B6 ans , a out ) . A complete
        rollout trajectory decomposes into an ordered sequence of segments \u03A8
        = { s 1 , s 2 , . . . , s T v + T t , s ans } . This nodebased decomposition
        establishes a direct structural correspondence between policy gradient signals
        and graph topology: each gradient signal maps precisely to a specific graph
        node, providing the basis for the topology-driven credit assignment.\\nTopology-Driven
        Credit Assignment. For each rollout, we assign a binary outcome reward r \u2208
        { 0 , 1 } based on whether a out matches the groundtruth answer a true . We
        then exploit the DAG topology of G T to perform targeted gradient masking
        under two distinct scenarios as illustrated in Figure 4(b). Given a correct
        rollout ( r = 1 ), we identify the critical reasoning path \u03C1 \u2217 by
        traversing G T backwards from n ans to n root along the directed edges. Nodes
        absent from \u03C1 \u2217 constitute topological dead ends, namely exploratory
        steps that contribute no causal evidence to the correct answer. Propagating
        positive reward signals to these nodes would erroneously reinforce aimless
        exploration, so we suppress their gradient contributions. Given an incorrect
        rollout ( r = 0 ), we identify the set of epistemically valuable nodes N val
        \u2286 V T . For n vis-type nodes, a node n t is designated as valuable when
        the Hit judgment s t stored within \u03C3 t records s t = 1 , confirming that
        the visual retrieval successfully located semantically relevant content. For
        n txt-type nodes, a dedicated relevance evaluator further determines whether
        the textual evidence retrieved at step t is directly relevant to the query.
        Excluding N val from the negative policy gradient update prevents the model
        from being penalized from performing demonstrably productive retrievals on
        trajectories that ultimately fail due to shortcomings in other reasoning steps.\\nFigure
        4: Overview of Topology-Aware Policy Optimization.\\nIntegrating both scenarios,
        we define the gradient mask \u03C8 t \u2208 { 0 , 1 } for segment s t as:\\n<!--
        formula-not-decoded -->\\nwhere I ( \xB7 ) is the indicator function; \u03C8
        t = 1 suppresses the gradient contribution of segment s t during the policy
        update, while \u03C8 t = 0 permits normal gradient update. The TAPO objective
        is defined as:\\n<!-- formula-not-decoded -->\",\"metadata\":{\"ingestion_version\":\"01a0fc547d2f738da4fc73667c19a759\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-afd90130549e21e7d5d373e21bd00946-text-0011\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-afd90130549e21e7d5d373e21bd00946\",\"chunk_type\":\"text\",\"section_path\":\"Graph-Structured
