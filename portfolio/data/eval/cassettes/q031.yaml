        Multi-Agent Systems in Multimodal RAG\\nMulti-agent systems have demonstrated
        promise on complex multimodal reasoning tasks (Wang and Liu, 2026; Dong et
        al., 2026; Li et al., 2026; Xinjie et al., 2025; Zhang et al., 2025a). By
        deploying multiple specialized agents that each focus on distinct facets of
        a problem, these architectures enable collaborative problem-solving that surpasses
        the capabilities of single-agent frameworks (Ni and Ye, 2026; Sinha et al.,
        2026; Siingh et al., 2025). However, existing multi-agent RAG systems conduct
        insufficient retrieval rounds, causing agents to prematurely terminate exploration
        on complex tasks (Geng et al., 2025; Narayan et al., 2025). Such shallow reasoning
        trajectories are fundamentally insufficient for demanding deep research scenarios
        that require tens of iterative reasoning steps. To address this challenge,
        we introduce a visiontext bridged reasoning paradigm integrating multiscale
        entity cropping with a visual toolchain, using image descriptions as a cross-modal
        bridge to enable long-horizon planning in the multimodal domain.\",\"metadata\":{\"ingestion_version\":\"01a0fc547d2f738da4fc73667c19a759\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-afd90130549e21e7d5d373e21bd00946-text-0004\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-afd90130549e21e7d5d373e21bd00946\",\"chunk_type\":\"text\",\"section_path\":\"2.1
        Multi-Agent Systems in Multimodal RAG\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":21,\"page_no\":2,\"filename\":\"2609.14066v1.pdf\"}}},{\"id\":\"64973db2-0bb2-5864-92a6-eeb8550fe9c8\",\"version\":11,\"score\":0.19864345,\"payload\":{\"page_content\":\"This
        is a schematic diagram comparing two multi-agent Retrieval-Augmented Generation
        (RAG) architectures. The left panel, labeled \\\"Traditional Multi-Agent RAG,\\\"
        shows multiple agent icons connected in a circular workflow around a linear
        memory structure (depicted as stacked horizontal bars). The right panel, labeled
        \\\"Our GraMRAG,\\\" shows agents arranged around a graph-based memory structure
        (depicted as interconnected nodes in a network) rather than linear memory.
        The diagram conveys that the proposed GraMRAG method replaces traditional
        linear/sequential memory storage with a graph-structured memory to better
        organize and retrieve information among collaborating agents.\",\"metadata\":{\"ingestion_version\":\"01a0fc547d2f738da4fc73667c19a759\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-afd90130549e21e7d5d373e21bd00946-fig-001-00\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-afd90130549e21e7d5d373e21bd00946\",\"chunk_type\":\"figure\",\"section_path\":\"\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":10,\"page_no\":1,\"filename\":\"2609.14066v1.pdf\",\"image_path\":\"/var/www/html/personal/llms/portfolio/data/processed/01a0aa96b5ef7053a767b8ddabb5a961-afd90130549e21e7d5d373e21bd00946/figures/fig-001-00-c21043f6116d1568.png\"}}},{\"id\":\"742b541b-4522-504f-94e1-f5b91676f2be\",\"version\":11,\"score\":0.18612784,\"payload\":{\"page_content\":\"This
        is a schematic diagram illustrating a reinforcement learning framework for
        training multimodal/retrieval-based models, divided into two panels. Panel
        (a) shows the overall \\\"Reinforcement Learning Framework with Topology-Aware
        Policy Optimization,\\\" depicting a pipeline where user queries and images
        flow through a Rollout Module (Policy Model generating trajectories H1-H6
        via interaction with an External Environment), then through Reference and
        Reward Models to compute rewards (r1-r6) and group-computed advantages (A1-A6),
        with a Graph Pruning module using a Memory Graph and KL divergence to produce
        gradient masks (m1-m6) that modulate the final gradient. Panel (b) illustrates
        \\\"Credit Assignment via Graph Pruning\\\" using two tree-structured graphs
        (Positive Sample and Negative Sample) rooted at a query node Q leading to
        an answer node A, showing how dead-end nodes (orange, meaningless for optimization)
        are pruned as false positives/negatives while valuable retrieval nodes (green)
        are preserved to avoid penalizing useful paths, with masked gradients indicated
        at specific steps.\",\"metadata\":{\"ingestion_version\":\"01a0fc547d2f738da4fc73667c19a759\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-afd90130549e21e7d5d373e21bd00946-fig-006-03\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-afd90130549e21e7d5d373e21bd00946\",\"chunk_type\":\"figure\",\"section_path\":\"\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":61,\"page_no\":6,\"filename\":\"2609.14066v1.pdf\",\"image_path\":\"/var/www/html/personal/llms/portfolio/data/processed/01a0aa96b5ef7053a767b8ddabb5a961-afd90130549e21e7d5d373e21bd00946/figures/fig-006-03-ccd597b84dbeb0e8.png\"}}},{\"id\":\"57f05910-479e-5c11-98c0-1c708dbcae78\",\"version\":7,\"score\":0.18414347,\"payload\":{\"page_content\":\"Method\\nProblem
        Setup. We consider RAG in which a query q is answered from a pool of K retrieved
        passages D = { d i } K i =1 (Figure 2a). Soft compression represents each
        passage d i by a short sequence of continuous memory embeddings that condition
        the decoder in its place. Writing m i for the number of memory embeddings
        assigned to passage i , the total B = \u2211 K i =1 m i is the memory budget
        that governs the decoder's context length, and hence the cost of generation.
        Existing soft-compression methods assign every retained passage the same m
        i , or set it by a length-based rule, spreading the budget without regard
        to how useful each passage is for the query. We instead aim to distribute
        a fixed budget B according to query-specific utility, giving more memory embeddings
        to answer-bearing passages, fewer to marginal ones, and none to irrelevant
        ones, while keeping the total \u2211 i m i = B unchanged. This poses two coupled
        subproblems: estimating passage relevance, and turning those estimates into
        an integer per-passage allocation of the budget. We next describe the shared
        compressor that produces passage memories and relevance scores in a single
        pass, the rule that converts these scores into a per-passage allocation, and
        the sense in which that rule is optimal (Figure 2).\\nFigure 2: Overview of
        AdaMem. (a) A shared compressor jointly produces passage memory representations
        and relevance scores. (b) The scores determine a query-dependent allocation
        of the fixed budget B via softmax and largest-remainder rounding. (c) The
        allocated memories are projected, ordered by relevance, and passed to a LoRA-adapted
        decoder for answer generation.\",\"metadata\":{\"ingestion_version\":\"01a0fc53885372038a1c6d0df171e569\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d-text-0005\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d\",\"chunk_type\":\"text\",\"section_path\":\"Method\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":22,\"page_no\":2,\"filename\":\"2609.22100v1.pdf\"}}},{\"id\":\"b721da9d-4090-5044-8ad5-d25e6abcffa4\",\"version\":9,\"score\":0.17981672,\"payload\":{\"page_content\":\"1
        Introduction\\nRetrieval-augmented generation, or RAG, is a widely adopted
        approach for grounding large language models in external information (Lewis
        et al., 2020). Retrieved documents can provide up-to-date facts, reduce reliance
        on stale parametric memory, and improve answer quality without retraining
        the generator. Furthermore, RAG can improve\",\"metadata\":{\"ingestion_version\":\"01a0fc5427ea71babb96a22c2c5762f3\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a-text-0002\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a\",\"chunk_type\":\"text\",\"section_path\":\"1
        Introduction\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":6,\"page_no\":1,\"filename\":\"2609.11758v1.pdf\"}}},{\"id\":\"bf47f12f-a99d-51f3-a4b7-0239164f75cc\",\"version\":11,\"score\":0.17696977,\"payload\":{\"page_content\":\"1
        Introduction\\n'Never memorize something that you can look up.'\\n-Albert
        Einstein\\nRetrieval-Augmented Generation (RAG) extends the knowledge boundaries
        of Multimodal Large Language Models (MLLMs) by retrieving relevant information
        from external knowledge bases (Wang, 2026; Fan et al., 2026; Hu et al., 2026).
        Recent advances in MLLMs have convincingly demonstrated that multimodal agentic
        RAG systems are capable of efficient retrieval and reasoning over large-scale
        corpora comprising interleaved textual and visual content (Zhang et al., 2026;
        Guan et al., 2025). MLLM-based multi-agent architectures, leveraging specialized
        collaboration among components, exhibit superior performance over single-agent
        frameworks on complex multimodal RAG tasks (Zhou et al., 2026; Chang et al.,
        2025; Xu et al., 2025b).\\n\u2020 Corresponding author.\\nFigure 1: Comparison
        between our GraMRAG and existing multi-agent RAG systems.\\nHowever, existing
        multi-agent RAG systems face three key limitations. First, the average number
        of retrieval rounds in current systems remains limited, predisposing agents
        to prematurely terminate exploration and settle for partially available evidence
        on complex tasks (Jiang et al., 2025; Wu et al., 2025a; Team et al., 2025).
        This fundamentally impedes the transfer of the long-horizon planning capability
        from text-based deep research to multimodal scenarios, rendering these systems
        inadequate for tens of iterative reasoning steps demanded by real-world deep
        research. Second, prevailing linear or iterative summarization-based memory
        structures (Yao et al., 2022; Zhou et al., 2025; Xu et al., 2025a; Wu et al.,
        2025b), lacking explicit modeling of agent reasoning states, are prone to
        context expands and state blindness as interaction rounds accumulate, resulting
        in repetitive queries and redundant retrieval in multi-hop tasks. Third, conventional
        outcome-based sparse rewards coarsely propagate terminal-state signals across
        entire trajectories (Huang et al., 2026; Zhou et al., 2025), causing effective
        retrieval steps to be erroneously penalized in negative samples while redundant
        operations are undeservedly rewarded in positive ones, preventing fine-grained
        credit assignment across multi-step reasoning.\",\"metadata\":{\"ingestion_version\":\"01a0fc547d2f738da4fc73667c19a759\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-afd90130549e21e7d5d373e21bd00946-text-0002\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-afd90130549e21e7d5d373e21bd00946\",\"chunk_type\":\"text\",\"section_path\":\"1
        Introduction\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":6,\"page_no\":1,\"filename\":\"2609.14066v1.pdf\"}}},{\"id\":\"59a855a5-5d91-566d-af5b-7c35dc4e52a2\",\"version\":7,\"score\":0.17648292,\"payload\":{\"page_content\":\"Abstract\\nRetrieval-augmented
        generation (RAG) improves language modelswithretrieved evidence, but processing
        many long passages is costly and can introduce distracting information. Soft
        compression addresses this challenge by encoding passages as compact sequences
        of continuous memory embeddings before generation. However, existing methods
        typically assign each retained passage an identical number of memory embeddings,
        irrespective of its query-specific relevance. To address this, we propose
        AdaMem, a relevance-guided soft-compression framework that maps learned passage-relevance
        estimates to a query-dependent allocation of a fixed memory-token budget.
        A shared query-conditioned compressor produces both continuous passage memories
        and relevance scores in a single pass; a deterministic allocation rule assigns
        more memory tokens to higher-scoring passages and can omit low-scoring ones.
        Across six open-domain QA benchmarks, AdaMem consistently outperforms OSCAR
        (the closely matched softcompression baseline that uses uniform allocation)
        as well as other soft-compression methods at matched memory budgets. Under
        standard 16 \xD7 compression, AdaMem improves sub-string match by up to 3.2
        points (5.5%) over uniform allocation baseline, with an average relative gain
        of 3.4%; under aggressive 64 \xD7 compression the average relative gain grows
        to 14.6%, with a maximum of 9.8 points (19.7%) on PopQA. AdaMem matches the
        answer quality of the uncompressed at up to 4 \xD7 lower inference latency
        than full context baseline. AdaMem retains an efficiency profile comparable
        to the uniform-compression baseline, while achieving up to 4 \xD7 lower inference
        latency than full-context inference. Thus, relevance-guided memory allocation
        is particularly effective when retrieval pools are large and the available
        memory budget is tight.\",\"metadata\":{\"ingestion_version\":\"01a0fc53885372038a1c6d0df171e569\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d-text-0001\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d\",\"chunk_type\":\"text\",\"section_path\":\"Abstract\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":3,\"page_no\":1,\"filename\":\"2609.22100v1.pdf\"}}},{\"id\":\"3f258ab2-78e2-5e34-909f-e9c9f7f11e60\",\"version\":7,\"score\":0.1745344,\"payload\":{\"page_content\":\"Introduction\\nMotivated
        by these limitations, we propose AdaMem , a framework that transforms reranking
        from binary selection into relevance-aware memory allocation. A shared compressor
        produces query-conditioned memories and scores; a principled softmax allocation,
        grounded in logarithmic utility theory, distributes a fixed total memory budget
        across passages according to their estimated utility. The temperature interpolates
        between uniform allocation and hard topk selection. Here are our main contributions:\\n-
        We introduce relevance-aware memory allocation for soft-compressed RAG: each
        document receives an adaptive memory budget determined by its estimated relevance
        (Figure 1), concentrating capacity on answer-bearing evidence while preserving
        compact representations for complementary context. This adaptivity makes AdaMem
        substantially more robust to extreme compression: between 16 \xD7 and 128
        \xD7 its quality degrades by only about 2%, compared with over 7% for uniform-allocation
        baselines such as OSCAR.\\n- Across six open-domain QA benchmarks, AdaMem
        outperforms every evaluated compression baseline at matched budgets: at 16
        \xD7 it improves over uniform allocation by 3 . 4% on average (up to 5 . 5%
        ) and over the strongest hard-compression baseline by 9 . 7% despite an 8
        \xD7 smaller context. Quality is also more stable under inference-time compression:
        moving from 16 \xD7 to 64 \xD7 costs AdaMem 2 . 8% on average, against 12
        . 2% for uniform allocation. At different compression rates, AdaMem retains
        up to 99% of full-context quality at 4 \xD7 lower latency.\\n- We release
        KILT-SCR (Soft Compression and Reranking), a large-candidate-pool resource
        for reranking and context compression, with 25 passages per query, 196,916\\ntraining
        instances, and evaluation data from six QA benchmarks. The training split
        use answer-grounded filtration to ensure supporting retrieved evidence and
        goldconsistent generated targets.\",\"metadata\":{\"ingestion_version\":\"01a0fc53885372038a1c6d0df171e569\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d-text-0003\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d\",\"chunk_type\":\"text\",\"section_path\":\"Introduction\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":11,\"page_no\":2,\"filename\":\"2609.22100v1.pdf\"}}},{\"id\":\"c6bdb44b-e7a8-522a-bd16-3817a31ebc87\",\"version\":11,\"score\":0.1744723,\"payload\":{\"page_content\":\"2.2
        Memory Structures of Agent Systems\\nThe memory architectures of existing
        agent systems can broadly be categorized into two paradigms (Zhang et al.,
        2025b; Ye et al., 2025): the history accumulation paradigm, exemplified by
        ReAct (Yao et al., 2022), which linearly concatenates all interaction records,
        and the iterative summarization paradigm, exemplified by Mem1 (Zhou et al.,
        2025), which controls context length by compressing observations. However,
        as the number of interaction rounds grows, both paradigms cause agents to
        progressively lose track of historical retrieval paths, a phenomenon we term
        state blindness, which in turn induces redundant queries and repetitive retrieval
        in multi-hop tasks. To address this issue, we construct a multimodal memory
        graph that formalizes the reasoning process as a dynamic DAG, explicitly encoding
        the temporal and logical dependencies between actions and observations, thereby
        effectively mitigating state blindness and redundant retrieval.\\nFigure 2:
        Overview of the GraMRAG framework.\\ngenerate the next search context, producing
        the visual reasoning trajectory:\\n<!-- formula-not-decoded -->\\nwhere R
        t denotes the chain-of-thought reasoning generated prior to action A v t ,
        and T v is the total number of visual retrieval steps.\\nFollowing each visual
        retrieval action, an independent Hit/No Hit Judge evaluates the observation
        O v t obtained at the current step, conditioned on the original image I and
        query q , outputs a binary acceptance signal:\\n<!-- formula-not-decoded -->\\nWhen
        s t = 1 (Hit), the retrieval is considered successful, meaning the retrieved
        content is semantically consistent with the query entity, and O v t is added
        into the accumulated valid evidence pool:\\n<!-- formula-not-decoded -->\\nWhen
        s t = 0 (No Hit), the retrieval is considered unsuccessful, triggering the
        Visual Explorer to recrop at a finer spatial granularity or to reformulate
        the search query before initiating a new retrieval attempt. The visual exploration
        phase terminates\",\"metadata\":{\"ingestion_version\":\"01a0fc547d2f738da4fc73667c19a759\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-afd90130549e21e7d5d373e21bd00946-text-0005\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-afd90130549e21e7d5d373e21bd00946\",\"chunk_type\":\"text\",\"section_path\":\"2.2
        Memory Structures of Agent Systems\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":23,\"page_no\":2,\"filename\":\"2609.14066v1.pdf\"}}}]},\"status\":\"ok\",\"time\":0.001392838}"
