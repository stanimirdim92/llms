- request:
    body: '{"query": "What is TAPO, and what problem does it address?", "documents":
      ["3.3 Topology-Aware Policy Optimization\nAs illustrated in Figure 4, we propose
      TopologyAware Policy Optimization (TAPO) to address the systematic credit assignment
      problem in sparse reward reinforcement learning training, leveraging the topological
      structure of the memory graph to perform selective gradient masking that simultaneously
      rectifies both forms of bias across positive and negative trajectories with
      step-level precision.", "Graph-Structured Trajectory Decomposition.\nwhere \u03c9
      g,i ( \u03b8 ) is the probability ratio of segment s ( i ) g under the current
      and old policies; n g denotes the number of segments in the g -th rollout. The
      (1 -\u03c8 g,i ) factor selectively gates gradient contributions based on the
      topological analysis of the memory graph: in positive trajectories, topological
      dead-end steps are masked to prevent their gradients from reinforcing redundant
      exploration; in negative trajectories, valuable retrieval steps are masked to
      prevent their gradients from penalizing effective retrieval behavior. Through
      this design, TAPO achieves precise step-level credit assignment across the entire
      multi-step reasoning trajectory, significantly outperforming conventional sparsereward
      methods that rely solely on terminal outcome signals.", "1 Introduction\nTo
      address the mentioned limitations, we propose GraMRAG, a novel graph memory-guided
      multi-agent RAG framework. First, to bridge the long-horizon reasoning gap,
      we introduce a visiontext bridged reasoning paradigm that orchestrates multi-scale
      entity cropping with a ReAct-style visual toolchain, seamlessly transferring
      the iterative planning capability of text-only deep research models into the
      multimodal domain to enable longhorizon cross-modal reasoning trajectories.
      Second, to overcome state blindness and context expansion in linear memory paradigms,
      we construct a multimodal memory graph that formalizes the reasoning process
      as a dynamic directed acyclic graph (DAG), explicitly encoding agent actions
      and multimodal observations with their temporal and logical dependencies to
      mitigate redundant retrieval and state blindness. Third, to tackle the credit
      assignment problem from coarse terminal rewards, we introduce a Topology-Aware
      Policy Optimization (TAPO) algorithm that leverages the graph topology to identify
      critical reasoning paths and perform targeted node pruning, precisely masking
      false positive and false negative nodes during policy updates to enable fine-grained
      credit assignment across multi-step reasoning.\nOur contributions are summarized
      as follows:\n- We introduce a vision-text bridged reasoning paradigm that unifies
      multi-scale entity cropping with a ReAct-style visual toolchain, enabling long-horizon
      cross-modal reasoning.\n- Weconstruct a multimodal memory graph that formalizes
      agent reasoning as a dynamic DAG to systematically mitigate state blindness
      and redundant retrieval.\n- We develop a TAPO algorithm leveraging graph topology
      for critical path identification and node pruning, enabling fine-grained credit
      assignment across multi-step reasoning.\n- We conduct extensive experiments
      on challenging multimodal benchmarks to evaluate our approach, demonstrating
      state-of-the-art performance over existing baselines.", "Retrieval quality depends
      on reasoning depth.\nHigh-quality answer generation in complex multimodal tasks
      depends on sustaining precise multiround retrieval across a long reasoning horizon.
      Traditional memory paradigms cause agents to progressively lose track of historical
      retrieval paths and accumulate redundant searches that severely constrain effective
      reasoning depth. GraMRAG addresses this by transferring the iterative planning
      capability into the multimodal domain via the vision-text bridged reasoning
      paradigm, supporting trajectories spanning tens of steps; the multimodal memory
      graph further encodes action-observation dependencies explicitly, directing
      each retrieval attempt precisely toward unexplored evidence space. As shown
      in Figure 5, this design yields substantially higher hit rate across all three
      task categories, directly validating the decisive role of long-horizon reasoning
      depth in determining retrieval quality.\nGraph memory mitigates state blindness.
      The dynamic DAG representation of the multimodal memory graph explicitly encodes
      actionobservation dependencies as directed edges, enabling each agent to efficiently
      access the complete historical reasoning trajectory and effectively mitigating
      state blindness. As shown in Table 2, replacing iterative summarization-based
      memory with the multimodal memory graph yields a 3.3point performance improvement,
      validating that the multimodal memory graph effectively mitigates state blindness
      and suppresses redundant retrieval, confirming the necessity of structured memory
      in long-horizon multimodal reasoning.\nFigure 6: Analysis of training efficiency.\nGraph
      pruning accelerates training convergence. As demonstrated in Figure 6, TAPO
      achieves faster convergence throughout training compared to the baseline Group
      Sequence Policy Optimization (GSPO) (Zheng et al., 2025), indicating that topology-guided
      graph pruning drives the model toward faster convergence by supplying cleaner
      credit assignment signals. This yields two critical insights into agentic reinforcement
      learning: first, optimization stability fundamentally depends on ensuring correct
      positive gradient signals while eliminating ambiguous updates from negative
      trajectories; second, the quality of rollout samples, specifically their preference
      alignment, is more decisive for performance than simply scaling up the training
      set. By simultaneously masking dead-end nodes in positive trajectories and preserving
      valuable nodes in negative ones, TAPO achieves finegrained step-level credit
      assignment rather than coarse terminal-reward-level optimization.", "6 Conclusion\nIn
      this paper, we introduce GraMRAG, a novel graph memory-guided multi-agent RAG
      framework for complex multimodal long-horizon reasoning tasks. Our approach
      integrates three key innovations: a vision-text bridged reasoning paradigm that
      unifies multi-scale entity cropping with a ReActstyle visual toolchain for long-horizon
      cross-modal reasoning; multimodal memory graph construction that formalizes
      agent reasoning as a dynamic directed acyclic graph (DAG) to fundamentally mit-
      igate state blindness and suppress redundant retrieval; and Topology-Aware Policy
      Optimization (TAPO) algorithm that leverages graph topology for fine-grained
      credit assignment across multi-step reasoning trajectories. Extensive experiments
      on diverse multimodal benchmarks demonstrate that our method consistently outperforms
      existing baselines and achieves state-of-the-art performance. Future work will
      investigate the scalability of the proposed framework to larger architectures
      and broader multimodal scenarios.", "Abstract\nAlthough existing multi-agent
      RetrievalAugmented Generation (RAG) systems have demonstrated promise on complex
      multimodal reasoning tasks, they remain fundamentally limited in reasoning depth
      and memory structure, suffering from inadequate retrieval and state blindness
      when answering knowledge-intensive questions. To address these limitations,
      we propose GraMRAG, a graph memory-guided multi-agent RAG framework that integrates
      a dynamic multimodal memory graph to enable stable, multi-step multimodal reasoning.
      We introduce a visiontext bridged reasoning paradigm that unifies multi-scale
      entity cropping with a ReAct-style visual toolchain, enhancing the long-horizon
      cross-modal reasoning capability. We further construct a multimodal memory graph
      that formalizes agent reasoning as a dynamic directed acyclic graph (DAG), explicitly
      modeling action-observation dependencies to mitigate state blindness and suppress
      redundant retrieval. Moreover, we propose Topology-Aware Policy Optimization
      (TAPO) that leverages graph topology for critical path identification and targeted
      node pruning, enabling fine-grained credit assignment across multi-step reasoning
      trajectories. Extensive experiments on challenging multimodal benchmarks demonstrate
      that our approach consistently outperforms existing baselines and achieves state-of-the-art
      performance on complex long-horizon reasoning tasks.", "3.2 Multimodal Memory
      Graph\nWe construct a multimodal memory graph G t = ( V t , E t ) that formalizes
      the multi-agent reasoning process as a dynamic DAG. This graph explicitly encodes
      action-observation dependencies across both the visual retrieval and textual
      research phases via a topological structure, fundamentally mitigating the state
      blindness inherent in linear memory paradigms and providing the structured foundation
      required by the TAPO algorithm. As illustrated in Figure 2(b), the memory graph
      evolves incrementally throughout reasoning, faithfully recording the exploration
      trajectory of each agent through node insertions and edge connections at each
      step.\nNode Schema and Modality Classification. Each node n i \u2208 V t encodes
      a discrete reasoning unit as a typed quadruple:\n<!-- formula-not-decoded -->\nwhere
      \u00b5 i \u2208 { n root , n vis , n brd , n txt , n ans } is the modality type
      tag; \u03ba i is the search query or action descriptor driving the creation
      of this node; \u03c3 i is a concise textual summary of retrieved or generated
      content; and \u03bd i is the visual feature bank, populated only for n vis-type
      nodes and set to empty for all other types. Five node types constitute the full
      reasoning pipeline. The root node ( n root ) is initialized with user query
      q and input image I , serving as the global anchor of the reasoning graph and
      permanently residing in V t . Visual nodes ( n vis) are spawned by the Visual
      Explorer at each retrieval step t \u2208 [1 , T v ] , storing the Hit/No Hit
      judgment and the corresponding evidence summary, with \u03bd i preserving multimodal
      content from matched web pages. The bridge node ( n brd) is a singleton node
      representing the modality bridging step, storing image description D as the
      semantic interface between the two reasoning phases. Text nodes ( n txt) are
      spawned by the Text Researcher at each retrieval step t \u2208 [ T v + 1 , T
      v + T t ] , storing webretrieved textual evidence summaries. The answer node
      ( n ans) is spawned by the Evidence Validator, storing the final generated answer
      a out , whose insertion marks the termination of the reasoning process. The
      edge set E t connects temporally adjacent nodes , encoding the sequential dependency
      of the reasoning flow.\nFigure 3: Inference pipeline of the GraMRAG framework.",
      "Graph-Structured Trajectory Decomposition.\nWe ground the reinforcement learning
      framework in the memory graph structure defined in Section 3.2. At each reasoning
      step t , the policy model \u03c0 \u03b8 receives the graph-serialized context:\n<!--
      formula-not-decoded -->\nwhere s sys is the system instruction and H t = Serialize(
      G t -1 ) is the graph-linearized memory context. The policy model produces an
      reasoning segment that corresponds precisely to the construction of a single
      memory graph node n t :\n<!-- formula-not-decoded -->\nwhere \u03b6 t denotes
      the chain-of-thought reasoning preceding action A t , and O t is the environmental
      observation returned by the external tools. The terminal segment takes the form
      s ans = ( C ans , \u03b6 ans , a out ) . A complete rollout trajectory decomposes
      into an ordered sequence of segments \u03a8 = { s 1 , s 2 , . . . , s T v +
      T t , s ans } . This nodebased decomposition establishes a direct structural
      correspondence between policy gradient signals and graph topology: each gradient
      signal maps precisely to a specific graph node, providing the basis for the
      topology-driven credit assignment.\nTopology-Driven Credit Assignment. For each
      rollout, we assign a binary outcome reward r \u2208 { 0 , 1 } based on whether
      a out matches the groundtruth answer a true . We then exploit the DAG topology
      of G T to perform targeted gradient masking under two distinct scenarios as
      illustrated in Figure 4(b). Given a correct rollout ( r = 1 ), we identify the
      critical reasoning path \u03c1 \u2217 by traversing G T backwards from n ans
      to n root along the directed edges. Nodes absent from \u03c1 \u2217 constitute
      topological dead ends, namely exploratory steps that contribute no causal evidence
      to the correct answer. Propagating positive reward signals to these nodes would
      erroneously reinforce aimless exploration, so we suppress their gradient contributions.
      Given an incorrect rollout ( r = 0 ), we identify the set of epistemically valuable
      nodes N val \u2286 V T . For n vis-type nodes, a node n t is designated as valuable
      when the Hit judgment s t stored within \u03c3 t records s t = 1 , confirming
      that the visual retrieval successfully located semantically relevant content.
      For n txt-type nodes, a dedicated relevance evaluator further determines whether
      the textual evidence retrieved at step t is directly relevant to the query.
      Excluding N val from the negative policy gradient update prevents the model
      from being penalized from performing demonstrably productive retrievals on trajectories
      that ultimately fail due to shortcomings in other reasoning steps.\nFigure 4:
      Overview of Topology-Aware Policy Optimization.\nIntegrating both scenarios,
      we define the gradient mask \u03c8 t \u2208 { 0 , 1 } for segment s t as:\n<!--
      formula-not-decoded -->\nwhere I ( \u00b7 ) is the indicator function; \u03c8
      t = 1 suppresses the gradient contribution of segment s t during the policy
      update, while \u03c8 t = 0 permits normal gradient update. The TAPO objective
      is defined as:\n<!-- formula-not-decoded -->", "4.4 Ablation Study\nTo validate
      the contribution of each component in GraMRAG, we conduct ablation studies across
      all benchmarks. As shown in Table 2, the three components exhibit clear progressive
      complementarity: long-horizon reasoning enables sustained multiround retrieval
      across extended cross-modal rea- soning trajectories; the multimodal memory
      graph demonstrates that formalizing reasoning as a dynamic DAG effectively mitigates
      state blindness and suppresses redundant retrieval; and replacing the standard
      sparse-reward method Group Relative Policy Optimization (GRPO) (Shao et al.,
      2024) with TAPO delivers a further improvement, directly confirming the critical
      role of topology-guided credit assignment in fine-grained policy optimization.
      The complete model achieves an average score of 53.5%, an improvement of over
      9 points above the baseline, comprehensively validating the necessity and complementarity
      of each component.\nFigure 5: Analysis of retrieval performance.", "This is
      a line chart comparing training entropy curves for two methods, TAPO (with graph
      pruning, orange line) and GSPO (without graph pruning, gray line), over Training
      Steps (x-axis, 0\u201360) versus Entropy (y-axis, ranging from about 0.20 to
      0.40). Both curves show a general upward trend with fluctuations, rising from
      roughly 0.25 at step 0 to a peak near 0.35\u20130.40 around steps 30\u201345,
      with GSPO reaching a higher peak (~0.41) than TAPO before both decline toward
      the end of training. The chart illustrates that graph pruning (TAPO) tends to
      produce comparable but somewhat lower and more stable entropy values than the
      non-pruned GSPO method, particularly in the later training steps.", "Table 2:
      Ablation study across all benchmarks.\n\n| Reasoning Horizon Standard Long   |
      Memory Iterative   | Paradigm Graph   | Policy GRPO   | Optimization TAPO   |
      Acc                      |\n|-----------------------------------|--------------------|------------------|---------------|---------------------|--------------------------|\n|
      \u2713 \u2713 \u2713 \u2713 \u2713                         | \u2713 \u2713                |
      \u2713 \u2713 \u2713            | \u2713             | \u2713                   |
      43.8 44.2 47.5 49.3 53.5 |", "2.1 Multi-Agent Systems in Multimodal RAG\nMulti-agent
      systems have demonstrated promise on complex multimodal reasoning tasks (Wang
      and Liu, 2026; Dong et al., 2026; Li et al., 2026; Xinjie et al., 2025; Zhang
      et al., 2025a). By deploying multiple specialized agents that each focus on
      distinct facets of a problem, these architectures enable collaborative problem-solving
      that surpasses the capabilities of single-agent frameworks (Ni and Ye, 2026;
      Sinha et al., 2026; Siingh et al., 2025). However, existing multi-agent RAG
      systems conduct insufficient retrieval rounds, causing agents to prematurely
      terminate exploration on complex tasks (Geng et al., 2025; Narayan et al., 2025).
      Such shallow reasoning trajectories are fundamentally insufficient for demanding
      deep research scenarios that require tens of iterative reasoning steps. To address
      this challenge, we introduce a visiontext bridged reasoning paradigm integrating
      multiscale entity cropping with a visual toolchain, using image descriptions
      as a cross-modal bridge to enable long-horizon planning in the multimodal domain.",
      "This is a schematic diagram comparing two multi-agent Retrieval-Augmented Generation
      (RAG) architectures. The left panel, labeled \"Traditional Multi-Agent RAG,\"
      shows multiple agent icons connected in a circular workflow around a linear
      memory structure (depicted as stacked horizontal bars). The right panel, labeled
      \"Our GraMRAG,\" shows agents arranged around a graph-based memory structure
      (depicted as interconnected nodes in a network) rather than linear memory. The
      diagram conveys that the proposed GraMRAG method replaces traditional linear/sequential
      memory storage with a graph-structured memory to better organize and retrieve
      information among collaborating agents.", "This is a schematic diagram illustrating
      a reinforcement learning framework for training multimodal/retrieval-based models,
      divided into two panels. Panel (a) shows the overall \"Reinforcement Learning
      Framework with Topology-Aware Policy Optimization,\" depicting a pipeline where
      user queries and images flow through a Rollout Module (Policy Model generating
      trajectories H1-H6 via interaction with an External Environment), then through
      Reference and Reward Models to compute rewards (r1-r6) and group-computed advantages
      (A1-A6), with a Graph Pruning module using a Memory Graph and KL divergence
      to produce gradient masks (m1-m6) that modulate the final gradient. Panel (b)
      illustrates \"Credit Assignment via Graph Pruning\" using two tree-structured
      graphs (Positive Sample and Negative Sample) rooted at a query node Q leading
      to an answer node A, showing how dead-end nodes (orange, meaningless for optimization)
      are pruned as false positives/negatives while valuable retrieval nodes (green)
      are preserved to avoid penalizing useful paths, with masked gradients indicated
      at specific steps.", "Method\nProblem Setup. We consider RAG in which a query
      q is answered from a pool of K retrieved passages D = { d i } K i =1 (Figure
      2a). Soft compression represents each passage d i by a short sequence of continuous
      memory embeddings that condition the decoder in its place. Writing m i for the
      number of memory embeddings assigned to passage i , the total B = \u2211 K i
      =1 m i is the memory budget that governs the decoder''s context length, and
      hence the cost of generation. Existing soft-compression methods assign every
      retained passage the same m i , or set it by a length-based rule, spreading
      the budget without regard to how useful each passage is for the query. We instead
      aim to distribute a fixed budget B according to query-specific utility, giving
      more memory embeddings to answer-bearing passages, fewer to marginal ones, and
      none to irrelevant ones, while keeping the total \u2211 i m i = B unchanged.
      This poses two coupled subproblems: estimating passage relevance, and turning
      those estimates into an integer per-passage allocation of the budget. We next
      describe the shared compressor that produces passage memories and relevance
      scores in a single pass, the rule that converts these scores into a per-passage
      allocation, and the sense in which that rule is optimal (Figure 2).\nFigure
      2: Overview of AdaMem. (a) A shared compressor jointly produces passage memory
      representations and relevance scores. (b) The scores determine a query-dependent
      allocation of the fixed budget B via softmax and largest-remainder rounding.
      (c) The allocated memories are projected, ordered by relevance, and passed to
      a LoRA-adapted decoder for answer generation.", "1 Introduction\nRetrieval-augmented
      generation, or RAG, is a widely adopted approach for grounding large language
      models in external information (Lewis et al., 2020). Retrieved documents can
      provide up-to-date facts, reduce reliance on stale parametric memory, and improve
      answer quality without retraining the generator. Furthermore, RAG can improve",
      "1 Introduction\n''Never memorize something that you can look up.''\n-Albert
      Einstein\nRetrieval-Augmented Generation (RAG) extends the knowledge boundaries
      of Multimodal Large Language Models (MLLMs) by retrieving relevant information
      from external knowledge bases (Wang, 2026; Fan et al., 2026; Hu et al., 2026).
      Recent advances in MLLMs have convincingly demonstrated that multimodal agentic
      RAG systems are capable of efficient retrieval and reasoning over large-scale
      corpora comprising interleaved textual and visual content (Zhang et al., 2026;
      Guan et al., 2025). MLLM-based multi-agent architectures, leveraging specialized
      collaboration among components, exhibit superior performance over single-agent
      frameworks on complex multimodal RAG tasks (Zhou et al., 2026; Chang et al.,
      2025; Xu et al., 2025b).\n\u2020 Corresponding author.\nFigure 1: Comparison
      between our GraMRAG and existing multi-agent RAG systems.\nHowever, existing
      multi-agent RAG systems face three key limitations. First, the average number
      of retrieval rounds in current systems remains limited, predisposing agents
      to prematurely terminate exploration and settle for partially available evidence
      on complex tasks (Jiang et al., 2025; Wu et al., 2025a; Team et al., 2025).
      This fundamentally impedes the transfer of the long-horizon planning capability
      from text-based deep research to multimodal scenarios, rendering these systems
      inadequate for tens of iterative reasoning steps demanded by real-world deep
      research. Second, prevailing linear or iterative summarization-based memory
      structures (Yao et al., 2022; Zhou et al., 2025; Xu et al., 2025a; Wu et al.,
      2025b), lacking explicit modeling of agent reasoning states, are prone to context
      expands and state blindness as interaction rounds accumulate, resulting in repetitive
      queries and redundant retrieval in multi-hop tasks. Third, conventional outcome-based
      sparse rewards coarsely propagate terminal-state signals across entire trajectories
      (Huang et al., 2026; Zhou et al., 2025), causing effective retrieval steps to
      be erroneously penalized in negative samples while redundant operations are
      undeservedly rewarded in positive ones, preventing fine-grained credit assignment
      across multi-step reasoning.", "Abstract\nRetrieval-augmented generation (RAG)
      improves language modelswithretrieved evidence, but processing many long passages
      is costly and can introduce distracting information. Soft compression addresses
      this challenge by encoding passages as compact sequences of continuous memory
      embeddings before generation. However, existing methods typically assign each
      retained passage an identical number of memory embeddings, irrespective of its
      query-specific relevance. To address this, we propose AdaMem, a relevance-guided
      soft-compression framework that maps learned passage-relevance estimates to
      a query-dependent allocation of a fixed memory-token budget. A shared query-conditioned
      compressor produces both continuous passage memories and relevance scores in
      a single pass; a deterministic allocation rule assigns more memory tokens to
      higher-scoring passages and can omit low-scoring ones. Across six open-domain
      QA benchmarks, AdaMem consistently outperforms OSCAR (the closely matched softcompression
      baseline that uses uniform allocation) as well as other soft-compression methods
      at matched memory budgets. Under standard 16 \u00d7 compression, AdaMem improves
      sub-string match by up to 3.2 points (5.5%) over uniform allocation baseline,
      with an average relative gain of 3.4%; under aggressive 64 \u00d7 compression
      the average relative gain grows to 14.6%, with a maximum of 9.8 points (19.7%)
      on PopQA. AdaMem matches the answer quality of the uncompressed at up to 4 \u00d7
      lower inference latency than full context baseline. AdaMem retains an efficiency
      profile comparable to the uniform-compression baseline, while achieving up to
      4 \u00d7 lower inference latency than full-context inference. Thus, relevance-guided
      memory allocation is particularly effective when retrieval pools are large and
      the available memory budget is tight.", "Introduction\nMotivated by these limitations,
      we propose AdaMem , a framework that transforms reranking from binary selection
      into relevance-aware memory allocation. A shared compressor produces query-conditioned
      memories and scores; a principled softmax allocation, grounded in logarithmic
      utility theory, distributes a fixed total memory budget across passages according
      to their estimated utility. The temperature interpolates between uniform allocation
      and hard topk selection. Here are our main contributions:\n- We introduce relevance-aware
      memory allocation for soft-compressed RAG: each document receives an adaptive
      memory budget determined by its estimated relevance (Figure 1), concentrating
      capacity on answer-bearing evidence while preserving compact representations
      for complementary context. This adaptivity makes AdaMem substantially more robust
      to extreme compression: between 16 \u00d7 and 128 \u00d7 its quality degrades
      by only about 2%, compared with over 7% for uniform-allocation baselines such
      as OSCAR.\n- Across six open-domain QA benchmarks, AdaMem outperforms every
      evaluated compression baseline at matched budgets: at 16 \u00d7 it improves
      over uniform allocation by 3 . 4% on average (up to 5 . 5% ) and over the strongest
      hard-compression baseline by 9 . 7% despite an 8 \u00d7 smaller context. Quality
      is also more stable under inference-time compression: moving from 16 \u00d7
