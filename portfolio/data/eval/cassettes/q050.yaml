- request:
    body: '{"max_tokens":16000,"messages":[{"role":"user","content":"You grade a question-answering
      system against an accepted answer.\n\nQuestion: How does the citation-faithfulness
      study choose which span to plant into a passage?\n\nAccepted answer: It takes
      the four consecutive words of the claim with the most characters, a blunt deterministic
      rule, because Qwen2.5 offers no markup for the words it grounds on.\n\nSystem
      answer: The study uses a deliberately simple, deterministic rule for selecting
      the span to plant.\n\nOriginally, the probe this work follows (Wallat et al.,
      2025) relied on a model-specific feature: \"The original probe leaned on Command
      R+, which marks the exact words it grounds on.\" However, the model used in
      this study doesn''t support that kind of markup, so the authors needed an alternative
      approach: \"Qwen2.5 offers no such markup, so we need a rule, and we keep it
      blunt and deterministic: the four consecutive words of the claim with the most
      characters.\"\n\nThis choice of span length was informed by prior work and some
      experimentation: this decision was influenced by Wallat et al. (2025), and the
      authors \"played around with 2-4 words for the span and choosing four words
      minimized bias.\"\n\nAs for *where* that span gets planted, the study defines
      three variants (per Table 1):\n\n- **REL-UNCITED**: \"A retrieved passage that
      the answer did not cite.\" This is described as the main measure, representing
      \"the situation a deployed system meets constantly.\"\n- **CITED-OTHER**: \"A
      passage the answer already cites, but for a different sentence.\"\n- **RANDOM**:
      \"An uncited slot, after replacing its passage with one from a different question.\"\n\nAcross
      all variants, \"Each changes exactly one of the five retrieved passages, and
      the passage that genuinely supports the claim stays in the context.\"\n\nOne
      limitation the authors note is that the planting location within the passage
      is fixed rather than varied: the span always lands at the end of the passage,
      so any positional bias in how models pick citations is mixed in with the effect
      of the plant, and randomizing the injection point is noted as the obvious next
      experiment.\n\nPass only if the system answer states the same facts as the accepted
      answer. Wording may\ndiffer; numbers, names and conclusions may not. If the
      accepted answer is a refusal, pass only\nif the system also declines to answer
      rather than guessing. Extra correct detail is fine;\nanything contradicting
      the accepted answer fails."}],"model":"claude-opus-5","output_config":{"format":{"type":"json_schema","schema":{"type":"object","title":"Verdict","properties":{"reasoning":{"type":"string","description":"One
      or two sentences: what matched or what was wrong.","title":"Reasoning"},"passed":{"type":"boolean","description":"True
      only if the answer meets the criterion in full.","title":"Passed"}},"additionalProperties":false,"required":["reasoning","passed"]}}}}'
