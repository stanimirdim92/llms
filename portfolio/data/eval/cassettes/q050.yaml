- request:
    body: '{"max_tokens":16000,"messages":[{"role":"user","content":"You check whether
      an answer is supported by its sources.\n\nQuestion: How does the citation-faithfulness
      study choose which span to plant into a passage?\n\nSources the answer was written
      from:\n[1] 3.1 The planting probe\nWe follow the probe of Wallat et al. (2025),
      which runs in three steps.\n1. Answer. The model answers a question from five
      retrieved passages. Every sentence ends with exactly one citation, so each sentence
      and its marker form one claim .\n2. Plant. We lift a short span out of the claim
      and append it to a passage the model did not cite for that claim, then re-run
      the same model on the doctored context with the same prompt.\n3. Check. We ask
      whether the model now cites the doctored passage for that claim.\nThe logic
      is a swap test. The doctored passage shares nothing with the claim except the
      words we pasted into it, and the passage the model originally cited never leaves
      the context. A model that reads for meaning has no reason to move. A model that
      matches surface strings has every reason to, and when it moves, its citation
      was never evidence of where the answer came from.\nTable 1 lists the three variants,
      which differ only in which passage receives the span. REL-UNCITED plants in
      a passage the retriever returned and the model ignored, the situation a deployed
      system meets constantly, and it is our main measure.\nREL-UNCITED, Where the
      span is planted = A retrieved passage that the answer did not cite.. CITED-OTHER,
      Where the span is planted = Apassage the answer already cites, but for a different
      sentence.. RANDOM, Where the span is planted = An uncited slot, after replacing
      its passage with one from a different question.\nTable 1: The three probe variants.
      Each changes exactly one of the five retrieved passages, and the passage that
      genuinely supports the claim stays in the context. RELUNCITED is our main measure.\nChoosing
      the span. The original probe leaned on Command R+, which marks the exact words
      it grounds on. Qwen2.5 offers no such markup, so we need a rule, and we keep
      it blunt and deterministic: the four consecutive words of the claim with the
      most characters. This decision was influenced by Wallat et al. (2025). We played
      around with 2-4 words for the span and choosing four words minimized bias.\n\n[2]
      | Variant     | Where the span is planted                                                        |\n|-------------|----------------------------------------------------------------------------------|\n|
      REL-UNCITED | A retrieved passage that the answer did not cite.                                |\n|
      CITED-OTHER | Apassage the answer already cites, but for a different sentence.                 |\n|
      RANDOM      | An uncited slot, after replacing its passage with one from a different
      question. |\n\n[3] Limitations\nEvaluation format differs from training. The
      RLVR agents were trained to search, read, and answer across multiple turns in
      their own tagged format, whereas our evaluation supplies five fixed passages
      and requests a single citation-bearing response. This was necessary for the
      controlled attribution comparison, but it may affect how the agents behave:
      for example, an agent that would normally issue another query may instead abstain.
      The large differences in abstention and format compliance are consistent with
      this possibility, although our data cannot establish the mechanism. An interactive
      evaluation would be needed to determine whether the attribution effect differs
      in the agents'' native search setting.\nWe cannot isolate RL itself. Each agent
      differs from the baseline in three ways at once: it was fine-tuned at all, fine-tuned
      on retrieval data, and fine-tuned with reinforcement learning. Without an arm
      fine-tuned on the same data without RL, our comparison is associational. This
      is the single most valuable addition a follow-up could make.\nSearch-R1 saw
      NQ in training. It was trained on NQ''s training split and we evaluate it on
      KILTNQ. QAMPARI, HAGRID, and RAGTruth are clean for all three agents, and R-Search''s
      pattern is in fact strongest away from NQ, but we have not quantified the overlap.\nThe
      span always lands at the end of the passage. Any positional bias in how models
      pick citations is therefore mixed in with the effect of the plant. Randomizing
      the injection point is the obvious next experiment.\nCITED-OTHER is underpowered
      outside RAGTruth. NQ, QAMPARI, and HAGRID yield only 13-43 question clusters
      for this variant, too few for intervals we would defend. RAGTruth alone is large
      enough.\nWhat a flag means. Our scorer is deterministic string matching, so
      each flag is exactly reproducible: the model cited the doctored passage for
      the aligned claim. Reading that as postrationalization is an interpretation
      we inherit from Wallat et al. (2025), and a competing reading exists. After
      planting, the claim''s words genuinely sit in the doctored passage, so citing
      it could be scored as obedience to ''answer from the passages'' rather than
      as unfaithfulness. Hand-checking a sample of flagged cases would settle how
      often each reading applies, and we have not done it.\nScope. Three RLVR agents
      from one line of work, one base model, English only, one prompt, one decoding
      setting. Citation behavior may well shift with the prompt, so our numbers describe
      this setup until someone varies it.\n\n[4] 3.2 What counts as citing the planted
      passage\nThe re-run answer may be worded differently, so we first locate the
      sentence that best matches the original claim by word overlap (Jaccard similarity
      of at least 0.3), then ask whether that sentence cites the doctored passage.
      This is our claim-aligned outcome, and the pairing carries the weight: it asks
      whether the model cited the planted passage for the claim we planted into ,
      not whether the marker turns up loose somewhere in the answer. We keep the looser
      cited-anywhere outcome as a sensitivity check, and Section 5.1 shows how much
      slack it introduces.\nWe score every record, with no filtering on whether the
      planted span reappears in the new answer. The original probe conditions on exactly
      that, and our control shows why it should not: with nothing planted at all,
      those four words come back in 60-74% of answers, simply because the model wrote
      them in the first place. Span recovery tells us the model repeated itself, not
      that our plant did anything.\n\n[5] 6 Discussion\nWhat a citation is worth to
      a reader. Our results say that in this setting a citation marks where the words
      of an answer can be found, not where the answer came from. Figure 1 is the honest
      version of the problem: the model knew the answer, had the supporting passage
      in front of it, cited it, and then handed the citation to a cartoon plot summary
      after we moved four words. A reader auditing that citation opens the passage,
      finds the claim''s wording sitting there, and walks away reassured. The audit
      passes and the provenance is still wrong. That is what makes post-rationalization
      worse than an ordinary error: it defeats exactly the check a careful reader
      would run, at a rate of roughly one cited sentence in seven on Wikipedia-style
      questions, in an openly available 7B model, using a plant so crude that we picked
      it with a character count.\nWhy RLVR leaves this untouched. The reward is the
      whole story. These agents earn credit when an automatic checker matches their
      final answer against a reference, and R-Search adds credit for steps along its
      search trajectory. Not one term in those objectives inspects the link between
      a sentence and the passage cited beside it. An agent that retrieves well, reasons
      well, and then attaches the wrong marker collects full reward. Optimization
      delivers what you pay for, so citation behavior stays wherever the base model
      left it, which is exactly the pattern in Table 5: two agents indistinguishable
      from their base, one slightly worse, none better.\nInterpreting the fixed-context
      result. The agents were trained for multi-step search, but our evaluation intentionally
      removes that component to hold evidence constant. Thus, the null result shows
      that RLVR did not produce a detectable attribution effect in this fixed-context
      setting. It does not rule out an effect that emerges through interactive search,
      where retrieval decisions and citation behavior can interact. An allow-retrieval
      evaluation would be needed to test that broader question.\nFixing it means paying
      for it. If answer-only rewards leave attribution where they found it, attribution
      has to enter the objective. The probe in this paper is a ready-made term for
      that. It is deterministic, needs no judge model, and with the control in place
      it isolates the effect of the plant rather than the noise of editing a context,
      so it can run inside a training loop. Concretely, a PPO or GRPO pipeline of
      the kind Search-R1 and ReSearch already use could add an attribution-consistency
      penalty: sample a rollout, plant a span from the model''s own answer into an
      uncited passage, re-score, and penalize the policy when the citation follows
      the plant. The signal is cheap, it is grounded in behavior rather than in a
      learned preference model, and it targets the failure directly instead of hoping
      that better answers drag better citations along behind them. On the evaluation
      side, the same probe yields a number that is comparable across models, which
      is what the field currently lacks for citation faithfulness.\n\nAnswer: The
      study uses a deliberately simple, deterministic rule for selecting the span
      to plant.\n\nOriginally, the probe this work follows (Wallat et al., 2025) relied
      on a model-specific feature: \"The original probe leaned on Command R+, which
      marks the exact words it grounds on.\" However, the model used in this study
      doesn''t support that kind of markup, so the authors needed an alternative approach:
      \"Qwen2.5 offers no such markup, so we need a rule, and we keep it blunt and
      deterministic: the four consecutive words of the claim with the most characters.\"\n\nThis
      choice of span length was informed by prior work and some experimentation: this
      decision was influenced by Wallat et al. (2025), and the authors \"played around
      with 2-4 words for the span and choosing four words minimized bias.\"\n\nAs
      for *where* that span gets planted, the study defines three variants (per Table
      1):\n\n- **REL-UNCITED**: \"A retrieved passage that the answer did not cite.\"
      This is described as the main measure, representing \"the situation a deployed
      system meets constantly.\"\n- **CITED-OTHER**: \"A passage the answer already
      cites, but for a different sentence.\"\n- **RANDOM**: \"An uncited slot, after
      replacing its passage with one from a different question.\"\n\nAcross all variants,
      \"Each changes exactly one of the five retrieved passages, and the passage that
      genuinely supports the claim stays in the context.\"\n\nOne limitation the authors
      note is that the planting location within the passage is fixed rather than varied:
      the span always lands at the end of the passage, so any positional bias in how
      models pick citations is mixed in with the effect of the plant, and randomizing
      the injection point is noted as the obvious next experiment.\n\nPass only if
      every factual claim in the answer is stated in, or directly follows from, the\nsources.
      A claim that is plausible but absent from the sources fails. An answer that
      correctly\nsays the sources don''t contain the answer passes."}],"model":"claude-opus-5","output_config":{"format":{"type":"json_schema","schema":{"type":"object","title":"Verdict","properties":{"reasoning":{"type":"string","description":"One
      or two sentences: what matched or what was wrong.","title":"Reasoning"},"passed":{"type":"boolean","description":"True
