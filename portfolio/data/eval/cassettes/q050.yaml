    body: "{\"max_tokens\":1024,\"messages\":[{\"role\":\"user\",\"content\":[{\"type\":\"document\",\"source\":{\"type\":\"text\",\"media_type\":\"text/plain\",\"data\":\"3.1
      The planting probe\\nWe follow the probe of Wallat et al. (2025), which runs
      in three steps.\\n1. Answer. The model answers a question from five retrieved
      passages. Every sentence ends with exactly one citation, so each sentence and
      its marker form one claim .\\n2. Plant. We lift a short span out of the claim
      and append it to a passage the model did not cite for that claim, then re-run
      the same model on the doctored context with the same prompt.\\n3. Check. We
      ask whether the model now cites the doctored passage for that claim.\\nThe logic
      is a swap test. The doctored passage shares nothing with the claim except the
      words we pasted into it, and the passage the model originally cited never leaves
      the context. A model that reads for meaning has no reason to move. A model that
      matches surface strings has every reason to, and when it moves, its citation
      was never evidence of where the answer came from.\\nTable 1 lists the three
      variants, which differ only in which passage receives the span. REL-UNCITED
      plants in a passage the retriever returned and the model ignored, the situation
      a deployed system meets constantly, and it is our main measure.\\nREL-UNCITED,
      Where the span is planted = A retrieved passage that the answer did not cite..
      CITED-OTHER, Where the span is planted = Apassage the answer already cites,
      but for a different sentence.. RANDOM, Where the span is planted = An uncited
      slot, after replacing its passage with one from a different question.\\nTable
      1: The three probe variants. Each changes exactly one of the five retrieved
      passages, and the passage that genuinely supports the claim stays in the context.
      RELUNCITED is our main measure.\\nChoosing the span. The original probe leaned
      on Command R+, which marks the exact words it grounds on. Qwen2.5 offers no
      such markup, so we need a rule, and we keep it blunt and deterministic: the
      four consecutive words of the claim with the most characters. This decision
      was influenced by Wallat et al. (2025). We played around with 2-4 words for
      the span and choosing four words minimized bias.\"},\"title\":\"2609.23053v1.pdf
      [01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6] (text, page
      2)\",\"citations\":{\"enabled\":true}},{\"type\":\"document\",\"source\":{\"type\":\"text\",\"media_type\":\"text/plain\",\"data\":\"|
      Variant     | Where the span is planted                                                        |\\n|-------------|----------------------------------------------------------------------------------|\\n|
      REL-UNCITED | A retrieved passage that the answer did not cite.                                |\\n|
      CITED-OTHER | Apassage the answer already cites, but for a different sentence.
      \                |\\n| RANDOM      | An uncited slot, after replacing its passage
      with one from a different question. |\"},\"title\":\"2609.23053v1.pdf [01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6]
      (table, page 3)\",\"citations\":{\"enabled\":true}},{\"type\":\"document\",\"source\":{\"type\":\"text\",\"media_type\":\"text/plain\",\"data\":\"Limitations\\nEvaluation
      format differs from training. The RLVR agents were trained to search, read,
      and answer across multiple turns in their own tagged format, whereas our evaluation
      supplies five fixed passages and requests a single citation-bearing response.
      This was necessary for the controlled attribution comparison, but it may affect
      how the agents behave: for example, an agent that would normally issue another
      query may instead abstain. The large differences in abstention and format compliance
      are consistent with this possibility, although our data cannot establish the
      mechanism. An interactive evaluation would be needed to determine whether the
      attribution effect differs in the agents' native search setting.\\nWe cannot
      isolate RL itself. Each agent differs from the baseline in three ways at once:
      it was fine-tuned at all, fine-tuned on retrieval data, and fine-tuned with
      reinforcement learning. Without an arm fine-tuned on the same data without RL,
      our comparison is associational. This is the single most valuable addition a
      follow-up could make.\\nSearch-R1 saw NQ in training. It was trained on NQ's
      training split and we evaluate it on KILTNQ. QAMPARI, HAGRID, and RAGTruth are
      clean for all three agents, and R-Search's pattern is in fact strongest away
      from NQ, but we have not quantified the overlap.\\nThe span always lands at
      the end of the passage. Any positional bias in how models pick citations is
      therefore mixed in with the effect of the plant. Randomizing the injection point
      is the obvious next experiment.\\nCITED-OTHER is underpowered outside RAGTruth.
      NQ, QAMPARI, and HAGRID yield only 13-43 question clusters for this variant,
      too few for intervals we would defend. RAGTruth alone is large enough.\\nWhat
      a flag means. Our scorer is deterministic string matching, so each flag is exactly
      reproducible: the model cited the doctored passage for the aligned claim. Reading
      that as postrationalization is an interpretation we inherit from Wallat et al.
      (2025), and a competing reading exists. After planting, the claim's words genuinely
      sit in the doctored passage, so citing it could be scored as obedience to 'answer
      from the passages' rather than as unfaithfulness. Hand-checking a sample of
      flagged cases would settle how often each reading applies, and we have not done
      it.\\nScope. Three RLVR agents from one line of work, one base model, English
      only, one prompt, one decoding setting. Citation behavior may well shift with
      the prompt, so our numbers describe this setup until someone varies it.\"},\"title\":\"2609.23053v1.pdf
      [01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6] (text, page
      8)\",\"citations\":{\"enabled\":true}},{\"type\":\"document\",\"source\":{\"type\":\"text\",\"media_type\":\"text/plain\",\"data\":\"3.2
      What counts as citing the planted passage\\nThe re-run answer may be worded
      differently, so we first locate the sentence that best matches the original
      claim by word overlap (Jaccard similarity of at least 0.3), then ask whether
      that sentence cites the doctored passage. This is our claim-aligned outcome,
      and the pairing carries the weight: it asks whether the model cited the planted
      passage for the claim we planted into , not whether the marker turns up loose
      somewhere in the answer. We keep the looser cited-anywhere outcome as a sensitivity
      check, and Section 5.1 shows how much slack it introduces.\\nWe score every
      record, with no filtering on whether the planted span reappears in the new answer.
      The original probe conditions on exactly that, and our control shows why it
      should not: with nothing planted at all, those four words come back in 60-74%
      of answers, simply because the model wrote them in the first place. Span recovery
      tells us the model repeated itself, not that our plant did anything.\"},\"title\":\"2609.23053v1.pdf
      [01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6] (text, page
      3)\",\"citations\":{\"enabled\":true}},{\"type\":\"document\",\"source\":{\"type\":\"text\",\"media_type\":\"text/plain\",\"data\":\"6
      Discussion\\nWhat a citation is worth to a reader. Our results say that in this
      setting a citation marks where the words of an answer can be found, not where
      the answer came from. Figure 1 is the honest version of the problem: the model
      knew the answer, had the supporting passage in front of it, cited it, and then
      handed the citation to a cartoon plot summary after we moved four words. A reader
      auditing that citation opens the passage, finds the claim's wording sitting
