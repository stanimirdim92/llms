        is a set of three stacked bar charts comparing model robustness under three
        perturbation types: Entity swap, Number swap, and Negation. Each chart's x-axis
        shows the number of poisoned documents (0/3, 1/3, 2/3, 3/3) out of retrieved
        documents, while the y-axis shows the percentage of clean-correct cases, broken
        into three categories: \\\"Still correct\\\" (green), \\\"Abstained\\\" (blue),
        and \\\"Fooled\\\" (red). The data indicates that as poisoned documents increase,
        the proportion of \\\"Still correct\\\" responses generally declines while
        \\\"Abstained\\\" and/or \\\"Fooled\\\" responses increase, with Number swap
        showing the most pronounced increase in \\\"Fooled\\\" cases (reaching ~15-20%
        at 2/3 and 3/3 poisoned documents) compared to Entity swap and Negation, which
        show minimal fooling but more abstention.\",\"metadata\":{\"ingestion_version\":\"01a0fc53392f724b972307d03a9f94d9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead-fig-005-04\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead\",\"chunk_type\":\"figure\",\"section_path\":\"\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":68,\"page_no\":5,\"filename\":\"2609.09243v1.pdf\",\"image_path\":\"/var/www/html/personal/llms/portfolio/data/processed/01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead/figures/fig-005-04-04d372ba3b61fee1.png\"}}},{\"id\":\"7cc06dc1-4df9-5a4c-aa92-828d2e5bc15a\",\"version\":5,\"score\":0.4100223,\"payload\":{\"page_content\":\"D.
        Which Strategy Hurts Most\\nTable III ranks the strategies. Entity swap has
        the highest fooled rate at 23.5% and the lowest poisoned accuracy, so it flips
        the largest share of answers that the model would otherwise get right. It
        also provokes the most abstention, 43.4%, which fits its mechanism: swapping
        'Paris, France' for 'Madrid, Spain' can leave the passage internally inconsistent,
        and the model often reacts to that inconsistency by refusing to answer. Number
        swap and negation are close behind on fooled rate but keep higher poisoned
        accuracy.\\nThe heatmap in Figure 2 gives the full strategy-by-level grid.
        Two patterns stand out. Fooled rates rise from left to right in every row,
        and the number-swap row is nearly flat across the first two columns before
        it jumps.\",\"metadata\":{\"ingestion_version\":\"01a0fc53392f724b972307d03a9f94d9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead-text-0011\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead\",\"chunk_type\":\"text\",\"section_path\":\"D.
        Which Strategy Hurts Most\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":48,\"page_no\":3,\"filename\":\"2609.09243v1.pdf\"}}},{\"id\":\"294903eb-d309-510e-883a-119bc8b01a08\",\"version\":5,\"score\":0.4022407,\"payload\":{\"page_content\":\"TABLE
