- request:
    body: '{"query": "In the heatmap of fooled rate, what is the colour scale and
      what range does it cover?", "documents": ["This is a heatmap chart displaying
      \"Fooled rate (%)\" data across three manipulation types (Entity swap, Number
      swap, Negation) as rows and four levels of poisoned documents (0/3, 1/3, 2/3,
      3/3) as columns. The color gradient ranges from green (low fooled rate, ~8-10%)
      to red (high fooled rate, ~30-37%), showing that fooled rates consistently increase
      as the number of poisoned documents increases from 0/3 to 3/3. Entity swap shows
      the highest fooled rates overall (10.2% to 36.7%), while Negation shows comparatively
      lower rates (8.2% to 30.6%), with Number swap falling in between (10.2% to 34.7%).",
      "This is a heatmap chart titled \"Ministral-3-8B\" showing harmful response
      rates across four experimental conditions (Non-RAG, Oracle unsafe, On-topic,
      Random) for 19 taxonomy subcategories of harmful content (rows), including radiological_weapons,
      explosives, drugs, chemical_weapons, assault_battery, terrorism, cyberattacks,
      suicide, murder, hate_speech, kidnapping, self_harm, financial_crimes, biological_weapons,
      hate_crimes, property_crimes, fraud_scam, sexual_assault, sexual_harassment,
      and abuse. Each cell displays a harmful rate value (0.00\u20131.00) with sample
      size (n), and the color scale (white to dark red) indicates rate magnitude.
      The \"Oracle unsafe\" condition consistently shows the highest harmful rates
      (many cells 0.55\u20131.00, darkest red), while the \"Random\" condition shows
      near-zero harmful rates across nearly all subcategories, with \"Non-RAG\" and
      \"On-topic\" conditions showing intermediate, generally low rates.", "This is
      a line chart depicting the \"Fooled Rate (%)\" on the y-axis (ranging from 0
      to 40%) versus \"Poisoned documents (out of 3 retrieved)\" on the x-axis (categories:
      0/3, 1/3, 2/3, 3/3). Three attack types are plotted: Entity swap (pink dashed
      line), Number swap (orange solid line with circular markers), and Negation (purple
      dashed line), all showing an increasing trend in fooled rate as the number of
      poisoned documents increases. A notable annotation highlights a \"+16.3 pp\"
      jump in the Number swap line between the 1/3 and 2/3 data points, where the
      rate rises sharply from about 10% to roughly 27%, with all three lines converging
      near 30-37% at 3/3 poisoned documents.", "This is a heatmap (confusion matrix-style
      chart) displaying pairwise rater agreement using Cohen''s \u03ba among four
      raters/models: Llama-Guard, WildGuard, ShieldGemma, and Accuracy. The overall
      Fleiss'' \u03ba is 0.56 (n=6920), indicating moderate agreement. The diagonal
      shows perfect agreement (1.00), while off-diagonal values range from 0.47 to
      0.67, with WildGuard and Accuracy showing the highest pairwise agreement (0.67)
      and Llama-Guard/ShieldGemma and ShieldGemma/Accuracy showing lower agreement
      (0.48\u20130.49); the color scale ranges from 0 to 1.0 (yellow to dark red).",
