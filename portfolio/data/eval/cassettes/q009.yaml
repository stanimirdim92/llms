      string: "{\"result\":{\"points\":[{\"id\":\"3112d294-65f2-5abe-a8cd-9278a0b94785\",\"version\":5,\"score\":0.5873685,\"payload\":{\"page_content\":\"This
        is a heatmap chart displaying \\\"Fooled rate (%)\\\" data across three manipulation
        types (Entity swap, Number swap, Negation) as rows and four levels of poisoned
        documents (0/3, 1/3, 2/3, 3/3) as columns. The color gradient ranges from
        green (low fooled rate, ~8-10%) to red (high fooled rate, ~30-37%), showing
        that fooled rates consistently increase as the number of poisoned documents
        increases from 0/3 to 3/3. Entity swap shows the highest fooled rates overall
        (10.2% to 36.7%), while Negation shows comparatively lower rates (8.2% to
        30.6%), with Number swap falling in between (10.2% to 34.7%).\",\"metadata\":{\"ingestion_version\":\"01a0fc53392f724b972307d03a9f94d9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead-fig-004-01\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead\",\"chunk_type\":\"figure\",\"section_path\":\"\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":57,\"page_no\":4,\"filename\":\"2609.09243v1.pdf\",\"image_path\":\"/var/www/html/personal/llms/portfolio/data/processed/01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead/figures/fig-004-01-cce9404722564ef5.png\"}}},{\"id\":\"2cfa7902-fcf7-5554-a596-30c3467e0b20\",\"version\":9,\"score\":0.48938662,\"payload\":{\"page_content\":\"This
        is a heatmap chart titled \\\"Ministral-3-8B\\\" showing harmful response
        rates across four experimental conditions (Non-RAG, Oracle unsafe, On-topic,
        Random) for 19 taxonomy subcategories of harmful content (rows), including
        radiological_weapons, explosives, drugs, chemical_weapons, assault_battery,
        terrorism, cyberattacks, suicide, murder, hate_speech, kidnapping, self_harm,
        financial_crimes, biological_weapons, hate_crimes, property_crimes, fraud_scam,
        sexual_assault, sexual_harassment, and abuse. Each cell displays a harmful
        rate value (0.00\u20131.00) with sample size (n), and the color scale (white
        to dark red) indicates rate magnitude. The \\\"Oracle unsafe\\\" condition
        consistently shows the highest harmful rates (many cells 0.55\u20131.00, darkest
        red), while the \\\"Random\\\" condition shows near-zero harmful rates across
        nearly all subcategories, with \\\"Non-RAG\\\" and \\\"On-topic\\\" conditions
        showing intermediate, generally low rates.\",\"metadata\":{\"ingestion_version\":\"01a0fc5427ea71babb96a22c2c5762f3\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a-fig-022-07\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a\",\"chunk_type\":\"figure\",\"section_path\":\"\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":213,\"page_no\":22,\"filename\":\"2609.11758v1.pdf\",\"image_path\":\"/var/www/html/personal/llms/portfolio/data/processed/01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a/figures/fig-022-07-6f72ea9f7e1bbab0.png\"}}},{\"id\":\"7c329777-6c76-54b3-a177-62c2bbb303d4\",\"version\":5,\"score\":0.48072192,\"payload\":{\"page_content\":\"This
        is a line chart depicting the \\\"Fooled Rate (%)\\\" on the y-axis (ranging
        from 0 to 40%) versus \\\"Poisoned documents (out of 3 retrieved)\\\" on the
        x-axis (categories: 0/3, 1/3, 2/3, 3/3). Three attack types are plotted: Entity
        swap (pink dashed line), Number swap (orange solid line with circular markers),
        and Negation (purple dashed line), all showing an increasing trend in fooled
        rate as the number of poisoned documents increases. A notable annotation highlights
        a \\\"+16.3 pp\\\" jump in the Number swap line between the 1/3 and 2/3 data
        points, where the rate rises sharply from about 10% to roughly 27%, with all
        three lines converging near 30-37% at 3/3 poisoned documents.\",\"metadata\":{\"ingestion_version\":\"01a0fc53392f724b972307d03a9f94d9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead-fig-004-02\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead\",\"chunk_type\":\"figure\",\"section_path\":\"\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":60,\"page_no\":4,\"filename\":\"2609.09243v1.pdf\",\"image_path\":\"/var/www/html/personal/llms/portfolio/data/processed/01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead/figures/fig-004-02-1987cd10b5ee32d8.png\"}}},{\"id\":\"c5ad079d-2174-562b-a2c7-cfb5337eb098\",\"version\":9,\"score\":0.46609947,\"payload\":{\"page_content\":\"This
        is a heatmap (confusion matrix-style chart) displaying pairwise rater agreement
        using Cohen's \u03BA among four raters/models: Llama-Guard, WildGuard, ShieldGemma,
        and Accuracy. The overall Fleiss' \u03BA is 0.56 (n=6920), indicating moderate
