        image consists of two line/bar charts comparing the effects of poisoned documents
        on model behavior, plotted against \\\"Poisoned documents (out of 3 retrieved)\\\"
        (0/3, 1/3, 2/3, 3/3) on the x-axis.\\n\\nPanel (a) is a line chart showing
        \\\"Abstention rate (%)\\\" for four conditions: Entity swap (red), Number
        swap (orange), Negation (purple), and Clean arm (green dashed baseline ~13%).
        As poisoned documents increase, abstention rises sharply for Entity swap (up
        to ~70%), while Number swap and Negation show moderate increases (up to ~42%),
        and the Clean arm remains flat.\\n\\nPanel (b) is a grouped bar chart showing
        \\\"Hallucination rate (%)\\\" for Clean arm (blue) versus Poisoned arm (red)
        across the same x-axis categories, revealing that hallucination rates decrease
        as poisoned documents increase for both arms, with the Poisoned arm dropping
        from 26.5% to 12.2% and the Clean arm from 31.3% to 29.9%.\",\"metadata\":{\"ingestion_version\":\"01a0fc53392f724b972307d03a9f94d9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead-fig-005-03\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead\",\"chunk_type\":\"figure\",\"section_path\":\"\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":66,\"page_no\":5,\"filename\":\"2609.09243v1.pdf\",\"image_path\":\"/var/www/html/personal/llms/portfolio/data/processed/01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead/figures/fig-005-03-f1d4adf3f7b93682.png\"}}},{\"id\":\"5f57e222-1f44-533f-a979-c69c93bf11c2\",\"version\":9,\"score\":0.39280307,\"payload\":{\"page_content\":\"This
        is a heatmap chart displaying harmfulness evaluation results across five language
        models (Gemma-3-12B, Llama-3.1-8B, Ministral-3-8B, Phi-4-14B, and Qwen2.5-7B)
        under four retrieval-augmented generation (RAG) conditions each (Non-RAG,
        Oracle unsafe, On-topic, Random). The columns represent four evaluation metrics/classifiers
        (Llama-Guard, WildGuard, ShieldGemma, and Accuracy), with cell values showing
        the proportion of outputs flagged as unsafe, color-coded from dark blue (low,
        ~0.0) to red (high, ~1.0). The data reveals that the \\\"Oracle unsafe\\\"
        condition consistently produces the highest harmfulness rates across all models
        and metrics (e.g., Ministral-3-8B reaches 0.91 on Accuracy and Qwen2.5-7B
        reaches 0.83), while \\\"Random\\\" and \\\"On-topic\\\" RAG conditions yield
        much lower harmfulness scores (mostly below 0.25), indicating that injecting
        deliberately unsafe retrieved context substantially increases harmful outputs
        compared to non-adversarial retrieval conditions.\",\"metadata\":{\"ingestion_version\":\"01a0fc5427ea71babb96a22c2c5762f3\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a-fig-018-04\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a\",\"chunk_type\":\"figure\",\"section_path\":\"\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":204,\"page_no\":18,\"filename\":\"2609.11758v1.pdf\",\"image_path\":\"/var/www/html/personal/llms/portfolio/data/processed/01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a/figures/fig-018-04-0e31d4617873b336.png\"}}},{\"id\":\"1a47c984-4df1-592f-8378-066f0c299d47\",\"version\":5,\"score\":0.39111656,\"payload\":{\"page_content\":\"C.
        Uncertainty on the Existing Runs\\nWe do not invent new generations for this
        revision. We reanalyse the same table with a query-level bootstrap: resample
        the 49 indexed query slots with replacement (37 distinct texts), keep every
        run tied to a drawn slot, recompute the fooled rate, and repeat 10 , 000 times
        with a fixed seed to obtain percentile 95% intervals. Exact McNemar tests
        on discordant clean/poisoned correctness pairs are reported as a secondary
        check; effect sizes and intervals remain primary.\\nTable II shows that the
        climb with poisoning level remains after accounting for query resampling,
        while neighbouring levels overlap. The comparison that matters for the numeric
        pattern is isolated next.\\nTABLE III BEHAVIOUR BY STRATEGY, AVERAGED OVER
        ALL FOUR POISONING LEVELS. EACH STRATEGY AGGREGATES 196 RUNS.\\n\\nEntity
        swap, Clean acc. (%) = 78.1. Entity swap, Poisoned acc. (%) = 54.6. Entity
        swap, Fooled rate (%) = 23.5. Entity swap, Abstain rate (%) = 43.4. Number
        swap, Clean acc. (%) = 77.6. Number swap, Poisoned acc. (%) = 57.7. Number
        swap, Fooled rate (%) = 20.4. Number swap, Abstain rate (%) = 30.1. Negation,
        Clean acc. (%) = 78.1. Negation, Poisoned acc. (%) = 60.2. Negation, Fooled
        rate (%) = 19.4. Negation, Abstain rate (%) = 32.1\",\"metadata\":{\"ingestion_version\":\"01a0fc53392f724b972307d03a9f94d9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead-text-0010\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead\",\"chunk_type\":\"text\",\"section_path\":\"C.
        Uncertainty on the Existing Runs\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":43,\"page_no\":3,\"filename\":\"2609.09243v1.pdf\"}}},{\"id\":\"a0c166f0-1173-5173-9ab5-499d03def381\",\"version\":7,\"score\":0.37120432,\"payload\":{\"page_content\":\"This
        is a line chart comparing two methods for setting \\\"allocation temperature\\\"
        (\u03C4) against compression rate (x-axis, log scale: 16, 32, 64, 128). The
        blue solid line labeled \\\"Empirical optimum\\\" shows \u03C4 decreasing
        gradually from 1.0 at compression rate 16 to about 0.5 at rate 128, with match
        accuracy scores annotated at each point (84.00, 84.45, 83.90, 83.15). The
        orange dashed line labeled \\\"Theory: \u03C4 \u221D B(\u03C1) (anchored at
