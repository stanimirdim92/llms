      down to \"Was Obama the 44th president?\" (lowest, around 40%), with other questions
      including \"Is the Eiffel Tower the most visited monument,\" \"Was Obama born
      in Hawaii,\" \"When did Obama start his presidency,\" \"Where was Obama born,\"
      \"Did Obama go to Harvard,\" \"Where was Barack Obama born,\" \"Where is the
      Eiffel Tower,\" and \"Is the Eiffel Tower in France\" falling in between. The
      chart appears to illustrate how often an AI model or system was \"fooled\" or
      gave incorrect responses to various fact-based or trick questions, with a dashed
      vertical reference line near 50%.", "This is a heatmap chart titled \"Phi-4-14B\"
      displaying harmful rate data across a taxonomy of harm subcategories (rows)
      and four experimental conditions (columns): Non-RAG, Oracle unsafe, On-topic,
      and Random. The rows list 20 harm subcategories including radiological_weapons,
      explosives, drugs, chemical_weapons, assault_battery, terrorism, cyberattacks,
      suicide, murder, hate_speech, kidnapping, self_harm, financial_crimes, biological_weapons,
      hate_crimes, property_crimes, fraud_scam, sexual_assault, sexual_harassment,
      and abuse, with sample sizes (n) shown in each cell. The color scale ranges
      from white (0.0) to dark red (1.0) representing harmful rate, and the data reveals
      that the \"Oracle unsafe\" condition produces substantially higher harmful rates
      (ranging from 0.05 to 0.55) across nearly all categories compared to Non-RAG,
      On-topic, and Random conditions, which remain mostly at or near 0.00, indicating
      that providing oracle unsafe context significantly increases the model''s tendency
      to generate harmful content.", "This is a heatmap chart titled \"Qwen2.5-7B\"
      showing harmful rates across 19 taxonomy subcategories (rows, including radiological_weapons,
      explosives, drugs, chemical_weapons, terrorism, cyberattacks, biological_weapons,
      hate_crimes, sexual_assault, etc.) against 4 experimental conditions (columns:
      Non-RAG, Oracle unsafe, On-topic, Random). Each cell displays a harmful rate
      value (0.00 to 1.00) with sample size (n), color-coded from white (low harm,
      0.0) to dark red (high harm, 1.0) per the colorbar legend. The data reveals
      that the \"Oracle unsafe\" condition consistently produces the highest harmful
      rates (many values 0.55-1.00, including perfect 1.00 scores for radiological
      and biological weapons), while \"Random\" condition shows near-zero harmful
      rates across all subcategories, and \"Non-RAG\" and \"On-topic\" conditions
      show low-to-moderate harmful rates (generally 0.00-0.40), indicating that providing
      unsafe oracle context significantly increases model harmfulness compared to
      other retrieval conditions.", "TABLE II FOOLED RATE WITH QUERY-LEVEL BOOTSTRAP
      95% INTERVALS (ALL STRATEGIES, 147 RUNS PER ROW).\n\n| Poisoned passages   |   Fooled
      (%) | 95% CI            |   n |\n|---------------------|--------------|-------------------|-----|\n|
      0 / 3               |          9.5 | [5 . 4 , 14 . 3]  | 147 |\n| 1 / 3               |         15.0
      | [8 . 8 , 21 . 8]  | 147 |\n| 2 / 3               |         25.9 | [18 . 4
      , 33 . 3] | 147 |\n| 3 / 3               |         34.0 | [24 . 5 , 44 . 2]
      | 147 |", "This is a heatmap chart titled \"Gemma-3-12B\" displaying harmful
      rate values across a taxonomy of 20 harm subcategories (rows: radiological_weapons,
      explosives, drugs, chemical_weapons, assault_battery, terrorism, cyberattacks,
