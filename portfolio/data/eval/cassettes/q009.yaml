      with Number swap showing the most pronounced increase in \"Fooled\" cases (reaching
      ~15-20% at 2/3 and 3/3 poisoned documents) compared to Entity swap and Negation,
      which show minimal fooling but more abstention.", "D. Which Strategy Hurts Most\nTable
      III ranks the strategies. Entity swap has the highest fooled rate at 23.5% and
      the lowest poisoned accuracy, so it flips the largest share of answers that
      the model would otherwise get right. It also provokes the most abstention, 43.4%,
      which fits its mechanism: swapping ''Paris, France'' for ''Madrid, Spain'' can
      leave the passage internally inconsistent, and the model often reacts to that
      inconsistency by refusing to answer. Number swap and negation are close behind
      on fooled rate but keep higher poisoned accuracy.\nThe heatmap in Figure 2 gives
      the full strategy-by-level grid. Two patterns stand out. Fooled rates rise from
      left to right in every row, and the number-swap row is nearly flat across the
      first two columns before it jumps.", "TABLE I ACCURACY AND FAILURE BEHAVIOUR
      BY POISONING LEVEL, AVERAGED OVER ALL THREE STRATEGIES. EACH LEVEL AGGREGATES
      147 RUNS.\n\n| Poisoned passages   |   Clean acc. (%) |   Poisoned acc. (%)
      |   Fooled rate (%) |   Abstain rate (%) |\n|---------------------|------------------|---------------------|-------------------|--------------------|\n|
      0 / 3               |             78.2 |                69.4 |               9.5
      |               21.1 |\n| 1 / 3               |             77.6 |                63.9
      |              15.0 |               29.3 |\n| 2 / 3               |             78.2
      |                53.1 |              25.9 |               38.8 |\n| 3 / 3               |             77.6
      |                43.5 |              34.0 |               51.7 |", "This image
      consists of two line/bar charts comparing the effects of poisoned documents
      on model behavior, plotted against \"Poisoned documents (out of 3 retrieved)\"
      (0/3, 1/3, 2/3, 3/3) on the x-axis.\n\nPanel (a) is a line chart showing \"Abstention
      rate (%)\" for four conditions: Entity swap (red), Number swap (orange), Negation
      (purple), and Clean arm (green dashed baseline ~13%). As poisoned documents
      increase, abstention rises sharply for Entity swap (up to ~70%), while Number
      swap and Negation show moderate increases (up to ~42%), and the Clean arm remains
      flat.\n\nPanel (b) is a grouped bar chart showing \"Hallucination rate (%)\"
      for Clean arm (blue) versus Poisoned arm (red) across the same x-axis categories,
      revealing that hallucination rates decrease as poisoned documents increase for
      both arms, with the Poisoned arm dropping from 26.5% to 12.2% and the Clean
      arm from 31.3% to 29.9%.", "This is a heatmap chart displaying harmfulness evaluation
      results across five language models (Gemma-3-12B, Llama-3.1-8B, Ministral-3-8B,
      Phi-4-14B, and Qwen2.5-7B) under four retrieval-augmented generation (RAG) conditions
      each (Non-RAG, Oracle unsafe, On-topic, Random). The columns represent four
      evaluation metrics/classifiers (Llama-Guard, WildGuard, ShieldGemma, and Accuracy),
      with cell values showing the proportion of outputs flagged as unsafe, color-coded
      from dark blue (low, ~0.0) to red (high, ~1.0). The data reveals that the \"Oracle
      unsafe\" condition consistently produces the highest harmfulness rates across
      all models and metrics (e.g., Ministral-3-8B reaches 0.91 on Accuracy and Qwen2.5-7B
      reaches 0.83), while \"Random\" and \"On-topic\" RAG conditions yield much lower
      harmfulness scores (mostly below 0.25), indicating that injecting deliberately
      unsafe retrieved context substantially increases harmful outputs compared to
      non-adversarial retrieval conditions.", "C. Uncertainty on the Existing Runs\nWe
      do not invent new generations for this revision. We reanalyse the same table
      with a query-level bootstrap: resample the 49 indexed query slots with replacement
      (37 distinct texts), keep every run tied to a drawn slot, recompute the fooled
      rate, and repeat 10 , 000 times with a fixed seed to obtain percentile 95% intervals.
      Exact McNemar tests on discordant clean/poisoned correctness pairs are reported
      as a secondary check; effect sizes and intervals remain primary.\nTable II shows
      that the climb with poisoning level remains after accounting for query resampling,
      while neighbouring levels overlap. The comparison that matters for the numeric
      pattern is isolated next.\nTABLE III BEHAVIOUR BY STRATEGY, AVERAGED OVER ALL
      FOUR POISONING LEVELS. EACH STRATEGY AGGREGATES 196 RUNS.\n\nEntity swap, Clean
      acc. (%) = 78.1. Entity swap, Poisoned acc. (%) = 54.6. Entity swap, Fooled
      rate (%) = 23.5. Entity swap, Abstain rate (%) = 43.4. Number swap, Clean acc.
      (%) = 77.6. Number swap, Poisoned acc. (%) = 57.7. Number swap, Fooled rate
      (%) = 20.4. Number swap, Abstain rate (%) = 30.1. Negation, Clean acc. (%) =
      78.1. Negation, Poisoned acc. (%) = 60.2. Negation, Fooled rate (%) = 19.4.
      Negation, Abstain rate (%) = 32.1", "This is a line chart comparing two methods
      for setting \"allocation temperature\" (\u03c4) against compression rate (x-axis,
      log scale: 16, 32, 64, 128). The blue solid line labeled \"Empirical optimum\"
      shows \u03c4 decreasing gradually from 1.0 at compression rate 16 to about 0.5
      at rate 128, with match accuracy scores annotated at each point (84.00, 84.45,
      83.90, 83.15). The orange dashed line labeled \"Theory: \u03c4 \u221d B(\u03c1)
      (anchored at 16x)\" declines more steeply, from 1.0 at rate 16 to about 0.22
      at rate 128, with corresponding match scores (84.35, 83.35, 82.25). A gray dotted
      horizontal reference line marks \"Fixed \u03c4 = 1\" with a match score of 81.30
      at compression rate 128, illustrating that both adaptive temperature approaches
      outperform a fixed temperature baseline at high compression rates.", "E. A Majority
      Pattern in Numeric Corruption\nFigure 3 isolates that pattern. For entity swap
      and negation the fooled rate grows in roughly even steps as poisoning increases.
      Number swap behaves differently. It stays at 10.2% for both zero and one corrupted
      passage (bootstrap 95% CI [2 . 0 , 18 . 4] in both cells), then rises to 26.5%
      at two ( [14 . 3 , 38 . 8] ) and 34.7% at three ( [22 . 5 , 49 . 0] ). The jump
      from one to two poisoned passages is 16.3 points with CI [2 . 0 , 30 . 6] ,
      which excludes zero but is wide. Exact McNemar tests on clean-versus-poisoned
      correctness are significant at two and three poisoned passages ( p < 10 -3 )
      and not at one ( p = 0 . 22 ). We read this as a majority-leaning pattern consistent
      with outvoting a single wrong figure, not as a sharp phase transition proven
      under locked pairs. Because a model cannot sanity-check a bare number the way
      it can catch ''Madrid, Spain,'' numeric corruption remains a quiet risk once
      it reaches critical mass.", "TABLE III BEHAVIOUR BY STRATEGY, AVERAGED OVER
      ALL FOUR POISONING LEVELS. EACH STRATEGY AGGREGATES 196 RUNS.\n\n| Strategy    |   Clean
      acc. (%) |   Poisoned acc. (%) |   Fooled rate (%) |   Abstain rate (%) |\n|-------------|------------------|---------------------|-------------------|--------------------|\n|
      Entity swap |             78.1 |                54.6 |              23.5 |               43.4
      |\n| Number swap |             77.6 |                57.7 |              20.4
      |               30.1 |\n| Negation    |             78.1 |                60.2
      |              19.4 |               32.1 |", "B. Accuracy Degradation\nOne detail
      in Table I needs to be read carefully. The 0 / 3 row still shows a fooled rate
      near 10% and an accuracy about 9 points below the clean arm, even though no
      passage is rewritten and both answers see the same retrieved list. That residual
      is therefore not a retrieval mismatch. It comes from decoding noise under temperature
      0.1 across two independent generations, plus a strict keyword matcher that can
      disagree on near-paraphrases. Recomputing from the 588-run table, clean and
      poisoned answers are identical in only 76.9% of the 0 / 3 runs. The residual
      is large relative to some attack increments (the rise from 9.5% to 15.0% fooled
