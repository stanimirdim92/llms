      legend. The data reveals that the \"Oracle unsafe\" condition consistently produces
      the highest harmful rates (e.g., 1.00 for radiological_weapons, 0.80 for explosives,
      0.75 for drugs), while \"On-topic\" and \"Random\" conditions yield much lower
      harmful rates (mostly 0.00\u20130.15), indicating the model is most susceptible
      to generating harmful content when given oracle-unsafe prompts.", "This is a
      heatmap chart titled \"Llama-3.1-8B\" showing harmful response rates across
      19 taxonomy subcategories (rows, including radiological_weapons, explosives,
      drugs, chemical_weapons, terrorism, biological_weapons, etc.) under four experimental
      conditions (columns: Non-RAG, Oracle unsafe, On-topic, Random). Each cell displays
      a harmful rate value (0.00\u20131.00, color-coded from white to dark red) along
