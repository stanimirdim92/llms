      highest harmful rates across most categories (e.g., 0.55 for explosives, 0.50
      for chemical_weapons, 0.45 for murder), while Non-RAG, On-topic, and Random
      conditions generally show much lower rates near 0.00, indicating that exposing
      the model to unsafe \"oracle\" context substantially increases harmful outputs
      compared to other retrieval conditions.", "This is a set of three stacked bar
      charts comparing model robustness under three perturbation types: Entity swap,
