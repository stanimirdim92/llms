    body: '{"query": "Which general text benchmarks does GraMRAG evaluate on?", "documents":
      ["4.1 Datasets and Evaluation Metrics\nWe evaluate GraMRAG on a comprehensive
      set of benchmarks covering diverse task categories: general text benchmarks
      including HotpotQA (Yang et al., 2018) and SQuAD (Rajpurkar et al., 2016); image
      and visual document benchmarks including ViDoSeek (Wang et al., 2025a), SlideVQA
      (Tanaka et al., 2023) and MMLongBench (Ma et al., 2024); large-scale long-context
      video corpus benchmarks including LVBench (Wang et al., 2025b), WikiHowQA and
      SyntheticQA (Jeong et al., 2025), and XVBench (Wang et al., 2026). We employ
      a unified binary model-based metric (0 or 1) across all tasks, where a reward
      model performs semantic matching between the generated and reference answers
      to ensure consistent and fair evaluation.", "3.1 Benign capability\nTo test
      the general capability of each of the models in our study we use the MIRAGE
      benchmark (Park et al., 2025). This benchmark was designed to test RAG model
      capabilities under different settings: Oracle contexts provide a best-case setting
      in which the answer-bearing evidence is available, while mixed contexts introduce
      distractors while retaining a capped amount of answer-bearing evidence. In the
      current study, we use a subset of 1000 queries from MIRAGE, under the two settings,
      to evaluate general RAG capability.", "Table 1: Performance comparison across
      different benchmarks.\n\n| Method               | General Text         | General
      Text         | Image &Visual Document   | Image &Visual Document   | Image &Visual
