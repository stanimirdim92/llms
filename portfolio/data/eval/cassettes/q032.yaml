      RAGTruth (Niu et al., 2024), sampling 500 questions from each (499 for NQ).
      For each dataset we chunk the corpus into roughly 100-token passages and retrieve
      the top five per question with BM25 (Robertson and Zaragoza, 2009).", "References\nBernd
