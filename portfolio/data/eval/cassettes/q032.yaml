      Ohad Rubin, Ori Yoran, Jonathan Herzig, and Jonathan Berant. 2023. QAMPARI:
      An open-domain question answering benchmark for questions with many answers
      from multiple paragraphs. Preprint , arXiv:2205.12665.\n- Mingyang Chen, Linzhuang
      Sun, Tianpeng Li, Haoze Sun, Yijie Zhou, Chenzheng Zhu, Haofen Wang, Jeff Z.
      Pan, Wen Zhang, Huajun Chen, Fan Yang, Zenan Zhou, and Weipeng Chen. 2025. ReSearch:
      Learning to reason with search for LLMs via reinforcement learning. Preprint
      , arXiv:2503.19470.\n- Tianyu Gao, Howard Yen, Jiatong Yu, and Danqi Chen. 2023.
      Enabling large language models to generate text with citations. In Proceedings
      of the 2023 Conference on Empirical Methods in Natural Language Processing ,
      pages 6465-6488, Singapore. Association for Computational Linguistics.\n- Bowen
      Jin, Hansi Zeng, Zhenrui Yue, Jinsung Yoon, Sercan Arik, Dong Wang, Hamed Zamani,
      and Jiawei Han. 2025. Search-R1: Training LLMs to reason and leverage search
      engines with reinforcement learning. Preprint , arXiv:2503.09516.\n- Ehsan Kamalloo,
      Aref Jafari, Xinyu Zhang, Nandan Thakur, and Jimmy Lin. 2023. HAGRID: A human-LLM
      collaborative dataset for generative information-seeking with attribution. Preprint
      , arXiv:2307.16883.\n- Tom Kwiatkowski, Jennimaria Palomaki, Olivia Redfield,
      Michael Collins, Ankur Parikh, Chris Alberti, Danielle Epstein, Illia Polosukhin,
      Jacob Devlin, Kenton Lee, Kristina Toutanova, Llion Jones, Matthew Kelcey, Ming-Wei
      Chang, Andrew M. Dai, Jakob Uszkoreit, Quoc Le, and Slav Petrov. 2019. Natural
      questions: A benchmark for question answering research. Transactions of the
      Association for Computational Linguistics , 7:452-466.\n- Patrick Lewis, Ethan
      Perez, Aleksandra Piktus, Fabio Petroni, Vladimir Karpukhin, Naman Goyal, Heinrich
      K\u00fcttler, Mike Lewis, Wen-tau Yih, Tim Rockt\u00e4schel, Sebastian Riedel,
      and Douwe Kiela. 2020. Retrieval-augmented generation for knowledgeintensive
      NLP tasks. In Advances in Neural Information Processing Systems , volume 33,
      pages 94599474.\n- Cheng Niu, Yuanhao Wu, Juno Zhu, Siliang Xu, KaShun Shum,
      Randy Zhong, Juntong Song, and Tong Zhang. 2024. RAGTruth: A hallucination corpus
      for developing trustworthy retrieval-augmented language models. In Proceedings
      of the 62nd Annual Meeting of the Association for Computational Linguistics
      (Volume 1: Long Papers) , pages 1086210878, Bangkok, Thailand. Association for
      Computational Linguistics.", "4.1 Experimental Setup\nWe evaluate on two attribution
      benchmarks with different retrieval granularities. ASQA comprises 948 ambiguous
      factoid questions from the ALCE release (Gao et al., 2023), each paired with
      the top-5 GTR-retrieved passages, sentencesegmented into citable snippets; answer
      quality is string exact match (str-EM). QASPER (Dasigi et al., 2021) is the
      1,005-question dev split over 281 NLP papers, using each supplied paper''s abstract
      and full text. Gold evidence is paragraphlevel, so identity presents paragraphs
      as citable units while compressors operate on sentence snippets; declared sids
      map to paragraphs for setF1 against gold evidence, max over annotators. The
      generator is Qwen2.5-7B-Instruct served via vLLM with greedy decoding and ALCE-style
      numbered-context citation prompting (Gao et al., 2023). Primary entailment judgments
      use the development-grade DeBERTa NLI evaluator of \u00a73.1 at \u03c4 = 0 .
      5 . We compare six compressors: identity (no compression; documentlevel on ASQA,
      paragraph-level on QASPER), cross-encoder rerank topk (ms-marco-MiniLML-6-v2),
      embedding-based extractive sentence selection (all-MiniLM-L6-v2), the RECOMP
      abstractive summarizer (NQ checkpoint) (Xu et al., 2024), LLMLingua-2 token
      pruning (Pan et al., 2024), and our extract-cluster-rewrite (ECR) variant, which
      ranks sentences, greedily clusters nearduplicates by Jaccard word overlap (threshold
      0.5, with a negation guard), and emits one unit per cluster-the highest-relevance
      member sentence verbatim-citing all member sentence ids. Although LLMLingua-2
      prunes tokens verbatim, its output is a token stream with no unit-level sid
      mapping in our pipeline, so it declares no provenance and is scored with the
      no-provenance family alongside RECOMP. Each compressor runs at nominal budgets
      { 0 . 5 , 0 . 25 , 0 . 1 , 0 . 05 } of the retrieved context, enforced in generator-tokenizer
      tokens. Because compressors do not reliably hit their nominal budgets, the frontier
      figures and primary summary tables report the achieved ratio: RECOMP''s summary
      length is nearly budget-independent, saturating at achieved ratios of 0.05-0.08
      on ASQA and \u2248 0.015 on QASPER across all four nominal budgets. All primary
      comparisons use the same successful questions across all 21 settings: 944 on
      ASQA and 976 from 271 papers on QASPER. Only identity has failures: 4 budget-check
      failures on ASQA, and 15 budget-check plus 14 promptoverflow failures on QASPER;
      their question IDs are excluded from every primary setting. Fullcohort descriptive
      aggregates remain available in the evaluation artifacts.", "References\n- Rotem
      Dror, Gili Baumer, Segev Shlomov, and Roi Reichart. 2018. The hitchhiker''s
      guide to testing statistical significance in natural language processing. In
      Proceedings of the 56th Annual Meeting of the Association for Computational
      Linguistics (Volume 1: Long Papers) , pages 1383-1392, Melbourne, Australia.
      Association for Computational Linguistics.\n- Darren Edge, Ha Trinh, Newman
