      string: "{\"result\":{\"points\":[{\"id\":\"34398301-0f24-57b5-94e6-3333ef2e3881\",\"version\":11,\"score\":0.61892784,\"payload\":{\"page_content\":\"4.1
        Datasets and Evaluation Metrics\\nWe evaluate GraMRAG on a comprehensive set
        of benchmarks covering diverse task categories: general text benchmarks including
        HotpotQA (Yang et al., 2018) and SQuAD (Rajpurkar et al., 2016); image and
        visual document benchmarks including ViDoSeek (Wang et al., 2025a), SlideVQA
        (Tanaka et al., 2023) and MMLongBench (Ma et al., 2024); large-scale long-context
        video corpus benchmarks including LVBench (Wang et al., 2025b), WikiHowQA
        and SyntheticQA (Jeong et al., 2025), and XVBench (Wang et al., 2026). We
        employ a unified binary model-based metric (0 or 1) across all tasks, where
        a reward model performs semantic matching between the generated and reference
        answers to ensure consistent and fair evaluation.\",\"metadata\":{\"ingestion_version\":\"01a0fc547d2f738da4fc73667c19a759\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-afd90130549e21e7d5d373e21bd00946-text-0013\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-afd90130549e21e7d5d373e21bd00946\",\"chunk_type\":\"text\",\"section_path\":\"4.1
        Datasets and Evaluation Metrics\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":70,\"page_no\":6,\"filename\":\"2609.14066v1.pdf\"}}},{\"id\":\"dbf223b7-edf9-5b4e-bd22-6a7d85e09e50\",\"version\":9,\"score\":0.58556527,\"payload\":{\"page_content\":\"3.1
        Benign capability\\nTo test the general capability of each of the models in
        our study we use the MIRAGE benchmark (Park et al., 2025). This benchmark
        was designed to test RAG model capabilities under different settings: Oracle
        contexts provide a best-case setting in which the answer-bearing evidence
        is available, while mixed contexts introduce distractors while retaining a
        capped amount of answer-bearing evidence. In the current study, we use a subset
        of 1000 queries from MIRAGE, under the two settings, to evaluate general RAG
        capability.\",\"metadata\":{\"ingestion_version\":\"01a0fc5427ea71babb96a22c2c5762f3\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a-text-0007\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a\",\"chunk_type\":\"text\",\"section_path\":\"3.1
