- request:
    body: '{"query": "What retrieval pool does AdaMem''s evaluation retrieve for each
      query, and with which retriever?", "documents": ["Experiments and Results\nKILT-SCR.
      Weconstruct KILT-SCR as a large-candidatepool resource with training and evaluation
      splits. Its training split is derived from the training sets of Natural Questions
      (Kwiatkowski et al. 2019), HotpotQA (Yang et al. 2018), and TriviaQA (Joshi
      et al. 2017). The evaluation split contains examples from the evaluation sets
      of these three datasets, together with PopQA (Mallen et al. 2023), ASQA (Stelmakh
      et al. 2022), and BioASQ (Krithara et al. 2023; Tsatsaronis et al. 2015). For
      every query, we retrieve a fixed pool of 25 passages from KILT-100w (Petroni
      et al. 2021) using BAAI/bge-large-en-v1.5 (Xiao et al. 2024).\nFor each training
      query, we score candidates with cross-encoder/ms-marco-MiniLM-L6-v2 (Bajaj et
      al. 2018) and provide the ten highest-scoring passages to Mistral-7B-Instruct-v0.2
      (Jiang et al. 2023a) to generate answer targets. We retain only instances for
      which a goldanswer alias occurs both in at least one retrieved passage and in
      the generated target, yielding 196,916 examples; teacher scores are globally
      standardized over this split. In contrast, we apply no answer-support or teacher-target
      filtering to KILTSCR evaluation split, which contains 2,000 examples each from
      Natural Questions, HotpotQA, TriviaQA, and PopQA, 948 from ASQA, and 1,609 from
      BioASQ. At evaluation time, the learned reranker scores the fixed candidate
      pool before answer generation.\nExperimental Setup. AdaMem uses a Llama-3.2-1BInstruct
      (Grattafiori et al. 2024) compressor and a Mistral-7B-Instruct-v0.2 decoder
      adapted with LoRA (Hu et al. 2022). We first pretrain the compressor and AdaMem
      projection module on two million examples sampled from EleutherAI/SmolLM2-135M-10B
      (Allal et al. 2025), using autoencoding and language-modeling objectives. We
      then perform query-dependent fine-tuning on maxoul/pisco_finetuning_data (Louis,
      D\u00e9jean, and Clinchant 2025), following the OSCAR training setup. Finally,
      we train on KILT-SCR with the joint answergeneration and reranker-distillation
      objectives. For all experiments, we report Substring Match as the primary evaluation
      metric. We provide additional LLM-as-a-judge metrics in the Supplementary Material.\nFigure
      3: Match (%) versus retrieval depth. AdaMem benefits from deeper retrieval more
      consistently than OSCAR, particularly under stronger compression.", "This is
      a line chart grid comparing two retrieval-augmented QA methods, OSCAR (red)
      and AdaMem (green), across three datasets (TriviaQA, NQ, HotpotQA) and three
      compression ratios (16x, 32x, 64x), forming a 3x3 panel layout. The x-axis in
      each subplot represents the number of retrieved documents (k = 5, 10, 15, 20,
      25), while the y-axis shows task performance scores (ranging roughly from 36
      to 84 depending on the dataset/compression level). Across nearly all panels,
      AdaMem consistently outperforms OSCAR, with the performance gap generally widening
      as compression increases (64x) and as more documents are retrieved, demonstrating
      AdaMem''s superior robustness under higher compression and larger retrieval
      sets.", "4 Experimental Setup\nTable 2: Models (top) and datasets (bottom).
      All four models share the Qwen2.5-7B-Instruct base. Passages is the number of
      roughly 100-token chunks in each retrieval index.\n\nBaseline, Training on top
      of the base = none (Qwen2.5-7B-Instruct). Search-R1, Training on top of the
      base = RLVR with PPO. ReSearch, Training on top of the base = RLVR with GRPO.
      R-Search, Training on top of the base = RLVR with GRPO\nNQ, Questions = 499.
      NQ, Passages = 40,791. NQ, Source = Wikipedia. QAMPARI, Questions = 500. QAMPARI,
      Passages = 44,879. QAMPARI, Source = Wikipedia. HAGRID, Questions = 500. HAGRID,
      Passages = 8,986. HAGRID, Source = Wikipedia. RAGTruth, Questions = 500. RAGTruth,
      Passages = 6,981. RAGTruth, Source = Web\nModels. Our comparison rests on a
      single design choice: every model in Table 2 starts from the same weights. The
      baseline is Qwen2.5-7BInstruct (Qwen Team, 2024); Search-R1 (Jin et al., 2025),
      ReSearch (Chen et al., 2025), and R-Search (Zhao et al., 2025) are open-weight
      agents trained from that exact checkpoint with RLVR. Whatever separates an agent
      from the baseline is therefore training, not architecture, tokenizer, or pretraining
      data.\nFixed-context evaluation. We disable agentinitiated retrieval and give
      every model the same five passages retrieved externally with BM25. This is an
      intentional control: our question is whether RLVR-trained agents differ in citation
      attribution when the available evidence is held constant. Allowing agents to
      retrieve would introduce differences in search policy and evidence selection,
      making those effects inseparable from citation behavior.\nDatasets. We use four
      question-answering datasets: NQ from KILT (Petroni et al., 2021; Kwiatkowski
      et al., 2019), QAMPARI from ALCE (Gao et al., 2023; Amouyal et al., 2023), HA-
      GRID (Kamalloo et al., 2023), and the questionanswering portion of RAGTruth
      (Niu et al., 2024), sampling 500 questions from each (499 for NQ). For each
      dataset we chunk the corpus into roughly 100-token passages and retrieve the
      top five per question with BM25 (Robertson and Zaragoza, 2009).", "Method\nProblem
      Setup. We consider RAG in which a query q is answered from a pool of K retrieved
      passages D = { d i } K i =1 (Figure 2a). Soft compression represents each passage
      d i by a short sequence of continuous memory embeddings that condition the decoder
      in its place. Writing m i for the number of memory embeddings assigned to passage
      i , the total B = \u2211 K i =1 m i is the memory budget that governs the decoder''s
      context length, and hence the cost of generation. Existing soft-compression
      methods assign every retained passage the same m i , or set it by a length-based
      rule, spreading the budget without regard to how useful each passage is for
      the query. We instead aim to distribute a fixed budget B according to query-specific
      utility, giving more memory embeddings to answer-bearing passages, fewer to
      marginal ones, and none to irrelevant ones, while keeping the total \u2211 i
      m i = B unchanged. This poses two coupled subproblems: estimating passage relevance,
      and turning those estimates into an integer per-passage allocation of the budget.
      We next describe the shared compressor that produces passage memories and relevance
      scores in a single pass, the rule that converts these scores into a per-passage
      allocation, and the sense in which that rule is optimal (Figure 2).\nFigure
      2: Overview of AdaMem. (a) A shared compressor jointly produces passage memory
      representations and relevance scores. (b) The scores determine a query-dependent
      allocation of the fixed budget B via softmax and largest-remainder rounding.
      (c) The allocated memories are projected, ordered by relevance, and passed to
      a LoRA-adapted decoder for answer generation.", "Query-Conditioned Compression
      and Adaptive Allocation. For each query-passage pair, we form\nThree-Stage Training.
      We train AdaMem in three stages. Stage 1 pretrains the compressor and projection
      module with query-independent autoencoding and text-continuation objectives,
      teaching it to encode text into decoder-consumable representations. Stage 2
      performs joint query-dependent training on an intermediate retrieval-augmented
      corpus, generating teacher answers from query-conditioned passage memories while
      initializing the reranker head via teacherscore distillation, adapting the compressor
      from generic to query-aware evidence representation. Stage 3 fi ne-tunes the
      full model on the filtered KILT-SCR corpus with full retrieved candidate pools,
      jointly optimizing generation and reranker distillation so that relevance scores
      directly determinepassageordering and memory allocation under the fixed budget
      at the target retrieval scale.", "This is a schematic diagram illustrating the
      \"AdaMem\" adaptive memory compression method for retrieval-augmented language
      models, shown in three panels. Panel (a) depicts a shared compressor network
      that takes query-document pairs (d1\u2013d4) and outputs relevance scores (ranging
      from 2.1 to -1.9). Panel (b) shows the adaptive budget allocation formula (using
      softmax over relevance scores divided by temperature \u03c4) that distributes
      a fixed total memory budget (B=32 tokens) unevenly across documents based on
      relevance (m1=17, m2=9, m3=6, m4=0), contrasted with a uniform allocation baseline
      (8 tokens each). Panel (c) illustrates the decoder stage, where allocated memory
      tokens are fed into a LoRA-adapted Mistral-7B model to generate an answer, demonstrating
      that AdaMem''s adaptive allocation produces the correct answer (\"Kazuo Ishiguro\")
      while uniform budget allocation yields an incorrect answer (\"Frederick Forsyth\").",
      "Introduction\nMotivated by these limitations, we propose AdaMem , a framework
      that transforms reranking from binary selection into relevance-aware memory
      allocation. A shared compressor produces query-conditioned memories and scores;
      a principled softmax allocation, grounded in logarithmic utility theory, distributes
      a fixed total memory budget across passages according to their estimated utility.
      The temperature interpolates between uniform allocation and hard topk selection.
      Here are our main contributions:\n- We introduce relevance-aware memory allocation
      for soft-compressed RAG: each document receives an adaptive memory budget determined
      by its estimated relevance (Figure 1), concentrating capacity on answer-bearing
      evidence while preserving compact representations for complementary context.
      This adaptivity makes AdaMem substantially more robust to extreme compression:
      between 16 \u00d7 and 128 \u00d7 its quality degrades by only about 2%, compared
      with over 7% for uniform-allocation baselines such as OSCAR.\n- Across six open-domain
      QA benchmarks, AdaMem outperforms every evaluated compression baseline at matched
      budgets: at 16 \u00d7 it improves over uniform allocation by 3 . 4% on average
      (up to 5 . 5% ) and over the strongest hard-compression baseline by 9 . 7% despite
      an 8 \u00d7 smaller context. Quality is also more stable under inference-time
      compression: moving from 16 \u00d7 to 64 \u00d7 costs AdaMem 2 . 8% on average,
      against 12 . 2% for uniform allocation. At different compression rates, AdaMem
      retains up to 99% of full-context quality at 4 \u00d7 lower latency.\n- We release
      KILT-SCR (Soft Compression and Reranking), a large-candidate-pool resource for
      reranking and context compression, with 25 passages per query, 196,916\ntraining
      instances, and evaluation data from six QA benchmarks. The training split use
      answer-grounded filtration to ensure supporting retrieved evidence and goldconsistent
      generated targets.", "Table 2: Models (top) and datasets (bottom). All four
      models share the Qwen2.5-7B-Instruct base. Passages is the number of roughly
      100-token chunks in each retrieval index.\n\n| Model     | Training on top of
      the base   |\n|-----------|-------------------------------|\n| Baseline  | none
      (Qwen2.5-7B-Instruct)    |\n| Search-R1 | RLVR with PPO                 |\n|
      ReSearch  | RLVR with GRPO                |\n| R-Search  | RLVR with GRPO                |",
      "Abstract\nRetrieval-augmented generation (RAG) improves language modelswithretrieved
      evidence, but processing many long passages is costly and can introduce distracting
      information. Soft compression addresses this challenge by encoding passages
      as compact sequences of continuous memory embeddings before generation. However,
      existing methods typically assign each retained passage an identical number
      of memory embeddings, irrespective of its query-specific relevance. To address
      this, we propose AdaMem, a relevance-guided soft-compression framework that
      maps learned passage-relevance estimates to a query-dependent allocation of
      a fixed memory-token budget. A shared query-conditioned compressor produces
      both continuous passage memories and relevance scores in a single pass; a deterministic
      allocation rule assigns more memory tokens to higher-scoring passages and can
      omit low-scoring ones. Across six open-domain QA benchmarks, AdaMem consistently
      outperforms OSCAR (the closely matched softcompression baseline that uses uniform
      allocation) as well as other soft-compression methods at matched memory budgets.
      Under standard 16 \u00d7 compression, AdaMem improves sub-string match by up
      to 3.2 points (5.5%) over uniform allocation baseline, with an average relative
      gain of 3.4%; under aggressive 64 \u00d7 compression the average relative gain
      grows to 14.6%, with a maximum of 9.8 points (19.7%) on PopQA. AdaMem matches
      the answer quality of the uncompressed at up to 4 \u00d7 lower inference latency
      than full context baseline. AdaMem retains an efficiency profile comparable
      to the uniform-compression baseline, while achieving up to 4 \u00d7 lower inference
      latency than full-context inference. Thus, relevance-guided memory allocation
      is particularly effective when retrieval pools are large and the available memory
      budget is tight.", "Conclusion\nWe introduced AdaMem, a relevance-aware allocation
      framework for soft-compressed RAG. Instead of uniformly representing retained
      passages, AdaMem converts querydependent relevance scores into a non-uniform
      allocation of a fixed global memory budget, concentrating capacity on answer-bearing
      evidence while retaining limited capacity for complementary passages. The resulting
      allocation is the exact optimum of a proportional-fair objective under an assumed
      logarithmic utility model, and is a first-order approximation to the reverse-water-filling
      optimum of classical exponential-distortion bit allocation.\nFigure 6: Optimal
      allocation temperature on TriviaQA across compression rates. The analytically
      predicted schedule ( \u03c4 \u221d B ( \u03c1 ) , anchored at 16 \u00d7 ) follows
      the empirical optimum and consistently outperforms a fixed \u03c4 = 1 .\nAdaMem
      establishes a new state of the art among softcompression methods across six
      evaluated QA benchmarks. At 16 \u00d7 compression, it improves over baselines,
      the strongest prior soft-compression method, by an average of 3 . 4% in relative
      terms. The advantage becomes substantially larger as the memory budget decreases.
      At 64 \u00d7 compression, the average relative improvement reaches 14 . 6% ,
      with gains of up to 21 . 8% on HotpotQA. At 32 \u00d7 , AdaMem exceeds OSCAR
      at 16 \u00d7 on every benchmark, achieving an average relative improvement of
      2 . 9% . These results show that adaptive allocation is particularly effective
      under aggressive compression, where large retrieval pools must be represented
      within strict memory constraints.\nFinally, we introduce KILT-SCR, a training
      and evaluation resource for the joint study of reranking and compression. Constructed
      to retain answer-bearing retrieved evidence and answer-consistent teacher targets,
      it enables controlled comparison of reranking and memory-allocation strategies
      over large candidate pools with heterogeneous passage utility.\nSeveral future
      research directions remain open. The temperature could be learned or predicted
      per query rather than set per compression rate, allowing allocation sharpness
      to adapt to the confidence of the relevance estimates. The budget-allocation
      view itself is not specific to QA or memory embeddings and extends naturally
      to other bounded representations, such as KV-cache compression and long-context
      summarization.\nAllal, L. B.; Lozhkov, A.; Bakouch, E.; Bl\u00e1zquez, G. M.;
      Penedo, G.; Tunstall, L.; Marafioti, A.; Kydl\u00ed\u010dek, H.; Lajar\u00edn,
      A. P.; Srivastav, V.; Lochner, J.; Fahlgren, C.; Nguyen, X.-S.; Fourrier, C.;
      Burtenshaw, B.; Larcher, H.; Zhao, H.; Zakka, C.; Morlon, M.; Raffel, C.; von
      Werra, L.; and Wolf, T. 2025. SmolLM2: When Smol Goes Big - Data-Centric Training
      of a Small Language Model. arXiv:2502.02737.", "Experiments and Results\nBaselines.
      We compare AdaMem against hardcompression methods (RECOMP, LLMLingua, and LLMLingua-2),
      and soft-compression methods (xRAG, PISCO, and OSCAR). No Context answers without
      retrieved evidence, while Full Context provides all retrieved passages without
      compression. PISCO and OSCAR are the closest soft-compression baselines because
      they support large retrieved candidate pools and integrate compression with
      the retrieval pipeline. PISCO uses query-independent passage compression, whereas
      OSCAR, like AdaMem, performs query-conditioned compression and relevance scoring.
      Both assign memory uniformly across retained passages, while AdaMem allocates
      a fixed global budget according to passage relevance. To isolate this difference,
      we train PISCO, OSCAR, and AdaMem using identical data splits, hyperparameters,
      and training stages. Consequently, the comparison with OSCAR directly measures
      the effect of relevance-aware memory allocation under a matched setup.\nMain
      Results. Table 1 reports results with 25 retrieved documents. At the reference
      compression rate of 16 \u00d7 , AdaMem achieves the best performance among compressed
      methods on five of six benchmarks. The only exception is BioASQ, where LLMLingua-2
      achieves the strongest compressed result. Nevertheless, AdaMem outperforms all
      evaluated soft-compression baselines.\nHard-compression methods exhibit a clear
      trade-off between compression and answer quality. RECOMP achieves the highest
      compression rate (200 \u00d7 ), but its performance remains only moderately
      above the No Context baseline; for example, it improves HotpotQA from 32.3 to
      37.0. Conversely, LLMLingua and LLMLingua-2 operate at only 2 \u00d7 compression,
      retaining a substantially larger text budget, yet generally remain below AdaMem.
      For instance, at 16 \u00d7 , AdaMem improves over LLMLingua-2 by 3.3 points
      on TriviaQA, 3.0 points on HotpotQA, and 17.3 points on PopQA. Thus, hard compression
      either requires aggressive token removal, which leaves limited useful evidence,
      or preserves much larger context without reaching the effectiveness of soft
      compression.\nAmong soft-compression methods, AdaMem consistently outperforms
      OSCAR under the same 16 \u00d7 memory budget and yields substantial gains over
      PISCO. xRAG performs poorly in this setting because it is designed to compress
      a single document. When applied to long multi-document contexts, its compressed
      tokens become less informative and fail to preserve passage-specific, query-relevant
      evidence.\nBoth AdaMem and OSCAR are trained at 16 \u00d7 compression. We evaluate
      higher compression ratios exclusively at inference time, without additional
      training or fine-tuning. At 32 \u00d7 , AdaMem outperforms OSCAR at its training-time
      compression ratio of 16 \u00d7 across all benchmarks, indicating that it can
      use approximately half as many memory embeddings while maintaining answer quality.
      Even at 64 \u00d7 , AdaMemsurpasses OSCAR at 16 \u00d7 on five of six benchmarks.
      Moreover, AdaMem retains a clear advantage over OSCAR at the same\n64 \u00d7
      compression rate. For example, on TriviaQA, increasing compression from 16 \u00d7
      to 64 \u00d7 reduces performance by only 0.7 points for AdaMem, compared with
      5.3 points for OSCAR. This robustness suggests that relevance-aware allocation
      preserves salient evidence when the memory budget is severely constrained.",
      "Experiments and Results\nFinally, at 16 \u00d7 , AdaMem closely approaches
      Full Context performance despite replacing the retrieved text with a substantially
      shorter continuous representation. On TriviaQA, it is within 0.4 points of Full
      Context, while on PopQA it exceeds Full Context by 1.4 points. Hence, selective
      memory allocation can both reduce computational cost and mitigate interference
      from irrelevant retrieved passages.\nFigure 4: Memory-token allocation by document
      relevance rank at 64 \u00d7 compression. The dashed line denotes OSCAR''s fixed
      16 \u00d7 allocation.\nMemory Allocation Behavior. Figure 4 illustrates the
      allocation mechanism under this highly constrained 64 \u00d7 setting. For the
      most relevant documents, AdaMem allocates a median of roughly 10 memory tokens,
      already exceeding OSCAR''s fixed budget of 9 tokens per document at 16 \u00d7
      . The 90th percentile is substantially higher, indicating that for some queries,
      AdaMem assigns considerably more capacity to the most relevant document. In
      contrast, the allocation decreases sharply with relevance rank and approaches
      zero for lower-ranked documents. Thus, AdaMem concentrates capacity on query-relevant
      evidence while assigning minimal capacity to noisy passages, reducing their
      potential interference in the compressed context.\nRobustness to Retrieval Depth
      and Compression. Figure 3 compares AdaMem and OSCAR across retrieval depths
      k \u2208 { 5 , 10 , 15 , 20 , 25 } and compression ratios of 16 \u00d7 , 32
      \u00d7 , and 64 \u00d7 at \u03c4 =1. AdaMem benefits more consistently from
      deeper retrieval, whereas OSCAR remains nearly constant as additional lower-ranked
      documents are introduced.\nThis difference is most pronounced under aggressive
      compression. At 64 \u00d7 , increasing k from 5 to 25 improves AdaMem by 3.5
      points on TriviaQA, 5.4 on Natural Questions, and 4.2 on HotpotQA, while OSCAR
      changes only marginally over the same range. A similar pattern holds at 32 \u00d7
      , particularly on Natural Questions and HotpotQA.\nThese results suggest that
      AdaMem can extract useful evidence from less-relevant documents without allocating
      them the same budget as highly relevant ones. In contrast, OSCAR''s fixed per-document
      allocation provides limited benefit from deeper retrieval, as its representation
      capacity is uniformly spread over an increasingly noisy document set. The effect
      is weaker at 16 \u00d7 , where both methods have sufficient capacity for shallow
      retrieval pools, but becomes increasingly clear as the memory budget is reduced.\nFigure
      5: Quality-latency tradeoff on TriviaQA. AdaMem shows similar latency as OSCAR
      and matches Full Context quality at 4 . 0 \u00d7 lower latency.", "B Inference
      Efficiency\nTable 4 reports per-query latency, throughput, total compute, and
      peak GPU memory on TriviaQA with k = 25 retrieved passages, for all inference-time
      compression rates used in the main text.\nAll compressed configurations are
      substantially cheaper than Full Context: latency drops by 3 . 5 \u00d7 to 4
      . 9 \u00d7 and compute by 2 . 9 \u00d7 to 5 . 0 \u00d7 , confirming that soft
      compression removes the dominant cost of processing large retrieval pools. Relative
      to OSCAR at the same compression rate, AdaMem adds the cost of relevance scoring
      and of encoding the fixed candidate memory bank before selection. This overhead
      is confined to the compressor and does not grow with the decoder context, so
      its share shrinks as compression increases: from 36.3 ms (23%) at 16 \u00d7
      to 10.0 ms (7%) at 64 \u00d7 and 7.6 ms (6%) at 128 \u00d7 . Because the quality
      of AdaMem is nearly flat in the compression rate, it can be operated at aggressive
      compression where this overhead is smallest: at 64 \u00d7 and 128 \u00d7 , AdaMem
      matches or improves on OSCAR at 16 \u00d7 in latency, throughput, and compute
      while providing higher answer quality. Peak memory remains moderately higher
      than OSCAR because the candidate bank for the full pool is encoded before allocation,
      yet at 64 \u00d7 it is already below the Full Context footprint (44.4 versus
      53.5 GB), and the gap narrows further with compression.", "3.1 Benign capability\nTo
      test the general capability of each of the models in our study we use the MIRAGE
      benchmark (Park et al., 2025). This benchmark was designed to test RAG model
      capabilities under different settings: Oracle contexts provide a best-case setting
      in which the answer-bearing evidence is available, while mixed contexts introduce
      distractors while retaining a capped amount of answer-bearing evidence. In the
      current study, we use a subset of 1000 queries from MIRAGE, under the two settings,
      to evaluate general RAG capability.", "Table 1: Match (%) performance on six
      QA benchmarks with 25 retrieved documents. Hard- (RECOMP, LLMLingua, LLMLingua-2)
      and soft-compression (xRAG, PISCO) baselines are shown at their respective rates;
      OSCAR (uniform) and AdaMem (relevance-aware) share one compressor and are reported
      at 16 / 32 / 64 \u00d7 , with 32 / 64 \u00d7 at inference only. Per column,
      the top-3 compression methods are shaded green (darkest = best). The bootstrap-estimated
      standard deviations for TriviaQA, HotpotQA, NQ, PopQA, ASQA, and BioASQ are
      1.0, 1.1, 1.1, 1.1, 1.5, and 1.2, respectively. Generation temperature: \u03c4
      = 1 .\n\n| Method            |   TriviaQA |   HotpotQA |   NQ |   PopQA |   ASQA
      |   BioASQ | Compr. rate   |\n|-------------------|------------|------------|------|---------|--------|----------|---------------|\n|
      No Context        |       71.9 |       32.3 | 41.7 |    26.5 |   48.4 |     29.4
      | -             |\n| Full Context      |       84.4 |       51.5 | 66.3 |    60.2
      |   70.9 |     33.1 | -             |\n| RECOMP            |       76.0 |       37.0
      | 50.0 |    34.8 |   55.9 |     29.0 | 200           |\n| LLMLingua-2       |       80.7
      |       43.3 | 60.9 |    44.3 |   63.0 |     31.2 | 2             |\n| LLMLingua         |       76.2
      |       37.2 | 55.0 |    39.0 |   58.4 |     27.2 | 2             |\n| xRAG              |       26.9
      |       13.9 |  9.3 |    11.2 |   11.9 |      8.8 | 147           |\n| PISCO             |       79.8
      |       38.4 | 58.9 |    53.6 |   61.0 |     27.7 | 16            |\n| OSCAR             |       82.4
      |       44.1 | 62.8 |    58.4 |   66.5 |     28.6 | 16            |\n|                   |       80.4
      |       40.0 | 60.0 |    56.9 |   66.8 |     28.4 | 32            |\n|                   |       77.1
      |       36.3 | 54.2 |    49.8 |   58.8 |     26.0 | 64            |\n|                   |       84.0
      |       46.3 | 64.0 |    61.6 |   69.1 |     29.2 | 16            |\n| AdaMem
      (proposed) |       83.9 |       45.4 | 63.9 |    61.7 |   68.5 |     29.3 |
      32            |\n| AdaMem (proposed) |       83.3 |       44.2 | 61.4 |    59.6
      |   67.1 |     28.8 | 64            |", "AdaMem: Adaptive Memory Token Allocation
      for Soft Compression in Retrieval-Augmented Generation\nArtem Sakhno, Grigorii
      Davydenko, Omar Zoloev, Julia Belikova, Andrey Savchenko, Maksim Makarenko \u2217",
      "A. Retrieval and Generation Pipeline\nThe pipeline follows the standard three
      stages of RAG. A user question is embedded, the nearest passages are retrieved
      from a vector index, and those passages are concatenated into a prompt that
      the language model answers.\nPassages and questions are embedded with the all-MiniLML6-v2
      sentence transformer [6], which maps text to 384dimensional vectors and is small
      enough to run comfortably on a CPU. Vectors are normalised to unit length and
      stored in a FAISS flat inner-product index [7], so that the inner product between
      a query and a passage equals their cosine similarity. For a query q and passage
      d the retrieval score is\n<!-- formula-not-decoded -->\nwhere e q and e d are
      the embeddings. The index holds an exact copy of every vector and is scanned
      in full at query time, which is appropriate at this corpus size. The top three
      passages, k = 3 , are passed to the generator.\nThe generator is Llama 3.1 8B
      Instruct, quantized to 4 bits in the GGUF Q4 K M format and run through llama.cpp
      on CPU. Full-precision weights would need about 16 GB of memory; 4-bit quantization
      brings the footprint near 5 GB, which fits the 8 GB machine used for all runs.
      Decoding uses temperature 0.1 so that answers are close to deterministic, which
      matters when the same query is evaluated many times. The prompt instructs the
      model to answer only from the supplied context and to reply ''Not enough information''
      when the context does not settle the question.", "D Judge Metrics\nWe use Substring
      Match as the primary metric because it is deterministic and consistent with
      standard open-domain QA evaluation. However, it can overestimate answer quality
      when a model lists multiple candidate answers: the prediction receives full
      credit whenever it contains a gold-answer alias as a substring, even if the
      response is ambiguous, unsupported, or includes incorrect alternatives. We therefore
      additionally report LLM-as-a-judge scores, which evaluate the correctness of
      the generated answer in the context of the question and reference answer. The
      judge assigns a score of 1 for a correct answer, 0.5 for a partially correct
      answer, and 0 for a wrong answer; we report the mean score as a percentage.
      This complementary evaluation penalizes answer enumeration and verifies that
      improvements in Match correspond to genuinely correct answers rather than increased
      lexical overlap with the reference.\nTable 5: Training schedule for the three-stage
      procedure.\n\nStage 1, Examples = 2,000,000. Stage 1, Epochs = 1. Stage 2, Examples
      = 500,000. Stage 2, Epochs = 1. Stage 3 (KILT-SCR), Examples = 196,916. Stage
      3 (KILT-SCR), Epochs = 3\nFor each example, we provide the judge with the question,
      the reference answer, and the model prediction. We use the following prompt:\nSystem
      prompt: You are an evaluation tool. Answer with one of: 1: Correct, 0.5: Partially
      correct, 0: Wrong.\nUser prompt: Here is a question, a golden answer, and an
      AI-generated answer. Can you judge whether the AIgenerated answer is correct
      according to the question and golden answer? Simply answer with one of: 1: Correct,
      0.5: Partially correct, 0: Wrong.\nQuestion:\n{question}\nGolden answer:\n{answer}\nGenerated
      answer: {prediction}\nFigure 7 corroborates the Match-based robustness trends.
      At the training-time compression rate of 16 \u00d7 , AdaMem matches or exceeds
      OSCAR across all three benchmarks, improving by 1.8 points on TriviaQA and 2.4
      points on NQ, while the methods are effectively tied on HotpotQA. The advantage
      grows under stronger inference-time compression. At 64 \u00d7 , AdaMem exceeds
      OSCAR by 6.1 points on TriviaQA and NQ, and by 7.1 points on HotpotQA. In contrast
      to OSCAR, AdaMem remains stable as the memory budget shrinks: its judge score
      decreases by only 0.9, 3.3, and 1.4 points from 16 \u00d7 to 64 \u00d7 on TriviaQA,
      NQ, and HotpotQA, respectively, compared with drops of 5.2, 7.0, and 8.7 points
      for OSCAR. These results show that relevance-aware allocation preserves answer-critical
      information under severe compression, rather than merely improving lexical overlap
      with reference answers.", "References\nBernd Bohnet, Vinh Q. Tran, Pat Verga,
      Roee Aharoni, Daniel Andor, Livio Baldini Soares, Massimiliano Ciaramita, Jacob
      Eisenstein, Kuzman Ganchev, Jonathan Herzig, Kai Hui, Tom Kwiatkowski, Ji Ma,
      Jianmo Ni, Lierni Sestorain Saralegui, Tal Schuster, William W. Cohen, Michael
      Collins, Dipanjan Das, and 3 others. 2022. Attributed question answering: Evaluation
      and modeling for attributed large language models. Preprint , arXiv:2212.08037.\nSamuel
      R. Bowman, Gabor Angeli, Christopher Potts, and Christopher D. Manning. 2015.
      A large annotated corpus for learning natural language inference. In Proceedings
      of the 2015 Conference on Empirical Methods in Natural Language Processing ,
      pages 632-642, Lisbon, Portugal. Association for Computational Linguistics.\nTong
      Chen, Hongwei Wang, Sihao Chen, Wenhao Yu, Kaixin Ma, Xinran Zhao, Hongming
      Zhang, and Dong Yu. 2024. Dense X retrieval: What retrieval granularity should
      we use? In Proceedings of the 2024 Conference on Empirical Methods in Natural
      Language Processing , pages 15159-15177, Miami, Florida, USA. Association for
      Computational Linguistics.\nXin Cheng, Xun Wang, Xingxing Zhang, Tao Ge, Si-Qing
      Chen, Furu Wei, Huishuai Zhang, and Dongyan Zhao. 2024. xRAG: Extreme context
      compression for retrieval-augmented generation with one token. In Advances in
      Neural Information Processing Systems , volume 37, pages 109487-109516.\nNadezhda
      Chirkova, Thibault Formal, Vassilina Nikoulina, and St\u00e9phane Clinchant.
      2025. Provence: Efficient and robust context pruning for retrievalaugmented
      generation. In International Conference on Learning Representations .\nPradeep
      Dasigi, Kyle Lo, Iz Beltagy, Arman Cohan, Noah A. Smith, and Matt Gardner. 2021.
      A dataset of information-seeking questions and answers anchored in research
      papers. In Proceedings of the 2021 Conference of the North American Chapter
      of the Association for Computational Linguistics: Human Language Technologies
      , pages 4599-4610, Online. Association for Computational Linguistics.", "4.1
      Experimental Setup\nWe evaluate on two attribution benchmarks with different
      retrieval granularities. ASQA comprises 948 ambiguous factoid questions from
      the ALCE release (Gao et al., 2023), each paired with the top-5 GTR-retrieved
      passages, sentencesegmented into citable snippets; answer quality is string
      exact match (str-EM). QASPER (Dasigi et al., 2021) is the 1,005-question dev
      split over 281 NLP papers, using each supplied paper''s abstract and full text.
      Gold evidence is paragraphlevel, so identity presents paragraphs as citable
      units while compressors operate on sentence snippets; declared sids map to paragraphs
      for setF1 against gold evidence, max over annotators. The generator is Qwen2.5-7B-Instruct
      served via vLLM with greedy decoding and ALCE-style numbered-context citation
      prompting (Gao et al., 2023). Primary entailment judgments use the development-grade
      DeBERTa NLI evaluator of \u00a73.1 at \u03c4 = 0 . 5 . We compare six compressors:
      identity (no compression; documentlevel on ASQA, paragraph-level on QASPER),
      cross-encoder rerank topk (ms-marco-MiniLML-6-v2), embedding-based extractive
      sentence selection (all-MiniLM-L6-v2), the RECOMP abstractive summarizer (NQ
      checkpoint) (Xu et al., 2024), LLMLingua-2 token pruning (Pan et al., 2024),
      and our extract-cluster-rewrite (ECR) variant, which ranks sentences, greedily
      clusters nearduplicates by Jaccard word overlap (threshold 0.5, with a negation
      guard), and emits one unit per cluster-the highest-relevance member sentence
      verbatim-citing all member sentence ids. Although LLMLingua-2 prunes tokens
      verbatim, its output is a token stream with no unit-level sid mapping in our
      pipeline, so it declares no provenance and is scored with the no-provenance
      family alongside RECOMP. Each compressor runs at nominal budgets { 0 . 5 , 0
      . 25 , 0 . 1 , 0 . 05 } of the retrieved context, enforced in generator-tokenizer
      tokens. Because compressors do not reliably hit their nominal budgets, the frontier
      figures and primary summary tables report the achieved ratio: RECOMP''s summary
      length is nearly budget-independent, saturating at achieved ratios of 0.05-0.08
      on ASQA and \u2248 0.015 on QASPER across all four nominal budgets. All primary
      comparisons use the same successful questions across all 21 settings: 944 on
      ASQA and 976 from 271 papers on QASPER. Only identity has failures: 4 budget-check
      failures on ASQA, and 15 budget-check plus 14 promptoverflow failures on QASPER;
      their question IDs are excluded from every primary setting. Fullcohort descriptive
      aggregates remain available in the evaluation artifacts."], "model": "rerank-2.5",
