      with relevance rank and approaches zero for lower-ranked documents. Thus, AdaMem
      concentrates capacity on query-relevant evidence while assigning minimal capacity
      to noisy passages, reducing their potential interference in the compressed context.\\nRobustness
      to Retrieval Depth and Compression. Figure 3 compares AdaMem and OSCAR across
      retrieval depths k \u2208 { 5 , 10 , 15 , 20 , 25 } and compression ratios of
      16 \xD7 , 32 \xD7 , and 64 \xD7 at \u03C4 =1. AdaMem benefits more consistently
      from deeper retrieval, whereas OSCAR remains nearly constant as additional lower-ranked
      documents are introduced.\\nThis difference is most pronounced under aggressive
      compression. At 64 \xD7 , increasing k from 5 to 25 improves AdaMem by 3.5 points
      on TriviaQA, 5.4 on Natural Questions, and 4.2 on HotpotQA, while OSCAR changes
      only marginally over the same range. A similar pattern holds at 32 \xD7 , particularly
      on Natural Questions and HotpotQA.\\nThese results suggest that AdaMem can extract
      useful evidence from less-relevant documents without allocating them the same
      budget as highly relevant ones. In contrast, OSCAR's fixed per-document allocation
      provides limited benefit from deeper retrieval, as its representation capacity
