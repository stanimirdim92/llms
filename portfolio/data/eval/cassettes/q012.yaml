    body: "{\"max_tokens\":16000,\"messages\":[{\"role\":\"user\",\"content\":\"You
      check whether an answer is supported by its sources.\\n\\nQuestion: At what
      compression rate does AdaMem match full-context quality on TriviaQA, and how
      much lower is its latency?\\n\\nSources the answer was written from:\\n[1] Experiments
      and Results\\nEfficiency-Performance Tradeoff. Figure 5 relates TriviaQA Match
      to per-query inference latency across compression rates (theoretical optimal
      \u03C4 is used) . AdaMem operates at the same low latency as prior soft compression
      while delivering uncompressed-quality answers roughly 4 \xD7 more efficiently
      than Full Context: at 32 \xD7 compression it matches Full Context quality (84.4
      Match) at 4 . 0 \xD7 lower latency and 3 . 6 \xD7 less compute. The two methods
      also trade quality for speed in sharply different ways. Lowering the budget
      moves OSCAR down a steep curve, losing 5.3 Match points between 16 \xD7 and
      64 \xD7 compression, whereas AdaMem stays within 0.5 points over the same range:
      relevance-aware allocation converts compression into latency savings almost
      without quality cost. As a result, AdaMem at 64 \xD7 is both faster and more
      accurate than uniform compression at 16 \xD7 . Appendix B provides additional
      efficiency discussion with detailed measurements, including throughput, compute,
      and memory information.\\nEffect of Training-Data Filtering. We evaluate the
      impact of filtered fine-tuning data. KILT-SCR retains instances where the retrieved
      pool contains a gold-answer alias and the teacher target is answer-consistent,
      reducing noise in both retrieval supervision and generation targets.\\nFor a
      controlled comparison, we train the same AdaMem model for one epoch on either
      filtered or unfiltered data under identical settings. Using 25 passages and
      a compression rate of 16, Table 2 shows that KILT-SCR improves performance by
      1.7 points on average, indicating better alignment between relevance estimation
      and answer generation.\\nAblation of Training Stages. Table 3 ablates the contribution
      of the three training stages. Removing Stage 1 causes the largest performance
      drop across all datasets, particularly on NQandHotpotQA.Thisresultshowsthatdirectly
      optimizing query-dependent generation and relevance-supervision objectives is
      insufficient to learn effective continuous passage representations from scratch.
      Removing either Stage 2 or Stage 3 produces smaller but consistent degradations.
      Without Stage 2, the model loses the intermediate adaptation from generic soft
      compression to query-conditioned evidence representation. Without Stage 3, it
      is not optimized for relevance estimation and memory allocation over the full
      retrieved candidate pools used at inference time.\\nTable 2: Effect of filtered
      fine-tuning data on Match (%) at compression rate 16. Both models are trained
      for one epoch.\\n\\nUnfiltered, TriviaQA = 80.3. Unfiltered, NQ = 62.8. Unfiltered,
      HotpotQA = 42.6. Filtered, TriviaQA = 82.8. Filtered, NQ = 63.3. Filtered, HotpotQA
      = 44.5. Difference, TriviaQA = +2.5. Difference, NQ = +0.6. Difference, HotpotQA
      = +2.0\\n\\n[2] Experiments and Results\\nFinally, at 16 \xD7 , AdaMem closely
      approaches Full Context performance despite replacing the retrieved text with
      a substantially shorter continuous representation. On TriviaQA, it is within
      0.4 points of Full Context, while on PopQA it exceeds Full Context by 1.4 points.
      Hence, selective memory allocation can both reduce computational cost and mitigate
      interference from irrelevant retrieved passages.\\nFigure 4: Memory-token allocation
      by document relevance rank at 64 \xD7 compression. The dashed line denotes OSCAR's
      fixed 16 \xD7 allocation.\\nMemory Allocation Behavior. Figure 4 illustrates
      the allocation mechanism under this highly constrained 64 \xD7 setting. For
      the most relevant documents, AdaMem allocates a median of roughly 10 memory
      tokens, already exceeding OSCAR's fixed budget of 9 tokens per document at 16
      \xD7 . The 90th percentile is substantially higher, indicating that for some
      queries, AdaMem assigns considerably more capacity to the most relevant document.
      In contrast, the allocation decreases sharply with relevance rank and approaches
      zero for lower-ranked documents. Thus, AdaMem concentrates capacity on query-relevant
      evidence while assigning minimal capacity to noisy passages, reducing their
      potential interference in the compressed context.\\nRobustness to Retrieval
      Depth and Compression. Figure 3 compares AdaMem and OSCAR across retrieval depths
      k \u2208 { 5 , 10 , 15 , 20 , 25 } and compression ratios of 16 \xD7 , 32 \xD7
      , and 64 \xD7 at \u03C4 =1. AdaMem benefits more consistently from deeper retrieval,
      whereas OSCAR remains nearly constant as additional lower-ranked documents are
      introduced.\\nThis difference is most pronounced under aggressive compression.
      At 64 \xD7 , increasing k from 5 to 25 improves AdaMem by 3.5 points on TriviaQA,
      5.4 on Natural Questions, and 4.2 on HotpotQA, while OSCAR changes only marginally
      over the same range. A similar pattern holds at 32 \xD7 , particularly on Natural
      Questions and HotpotQA.\\nThese results suggest that AdaMem can extract useful
      evidence from less-relevant documents without allocating them the same budget
      as highly relevant ones. In contrast, OSCAR's fixed per-document allocation
      provides limited benefit from deeper retrieval, as its representation capacity
      is uniformly spread over an increasingly noisy document set. The effect is weaker
      at 16 \xD7 , where both methods have sufficient capacity for shallow retrieval
      pools, but becomes increasingly clear as the memory budget is reduced.\\nFigure
      5: Quality-latency tradeoff on TriviaQA. AdaMem shows similar latency as OSCAR
      and matches Full Context quality at 4 . 0 \xD7 lower latency.\\n\\n[3] Table
      4: Inference efficiency on TriviaQA with k = 25 : per-query latency, throughput,
      total compute, and peak GPU memory across inference-time compression rates.\\n\\n|
      Method       | Rate   |   Lat. (ms) |   Thr. (q/s) |   TFLOPs |   Mem. (GB)
      |\\n|--------------|--------|-------------|--------------|----------|-------------|\\n|
      Full Context | 1 \xD7    |       667.4 |         1.50 |     59.9 |        53.5
      |\\n| OSCAR        | 16 \xD7   |       156.1 |         6.41 |     15.0 |        39.6
      |\\n| OSCAR        | 32 \xD7   |       149.3 |         6.70 |     13.4 |        39.0
      |\\n| OSCAR        | 64 \xD7   |       142.9 |         7.00 |     12.5 |        38.7
      |\\n| OSCAR        | 128 \xD7  |       136.4 |         7.33 |     12.1 |        38.5
      |\\n| AdaMem       | 16 \xD7   |       192.4 |         5.20 |     21.0 |        56.4
      |\\n| AdaMem       | 32 \xD7   |       167.5 |         5.97 |     16.6 |        48.4
      |\\n| AdaMem       | 64 \xD7   |       152.9 |         6.54 |     14.3 |        44.4
      |\\n| AdaMem       | 128 \xD7  |       144.0 |         6.95 |     13.0 |        42.3
      |\\n\\n[4] B Inference Efficiency\\nTable 4 reports per-query latency, throughput,
      total compute, and peak GPU memory on TriviaQA with k = 25 retrieved passages,
      for all inference-time compression rates used in the main text.\\nAll compressed
      configurations are substantially cheaper than Full Context: latency drops by
      3 . 5 \xD7 to 4 . 9 \xD7 and compute by 2 . 9 \xD7 to 5 . 0 \xD7 , confirming
      that soft compression removes the dominant cost of processing large retrieval
      pools. Relative to OSCAR at the same compression rate, AdaMem adds the cost
      of relevance scoring and of encoding the fixed candidate memory bank before
      selection. This overhead is confined to the compressor and does not grow with
      the decoder context, so its share shrinks as compression increases: from 36.3
      ms (23%) at 16 \xD7 to 10.0 ms (7%) at 64 \xD7 and 7.6 ms (6%) at 128 \xD7 .
      Because the quality of AdaMem is nearly flat in the compression rate, it can
      be operated at aggressive compression where this overhead is smallest: at 64
      \xD7 and 128 \xD7 , AdaMem matches or improves on OSCAR at 16 \xD7 in latency,
      throughput, and compute while providing higher answer quality. Peak memory remains
      moderately higher than OSCAR because the candidate bank for the full pool is
      encoded before allocation, yet at 64 \xD7 it is already below the Full Context
      footprint (44.4 versus 53.5 GB), and the gap narrows further with compression.\\n\\n[5]
      B Inference Efficiency\\nTable 4: Inference efficiency on TriviaQA with k =
      25 : per-query latency, throughput, total compute, and peak GPU memory across
      inference-time compression rates.\\n\\nFull Context, Rate = 1 \xD7. Full Context,
      Lat. (ms) = 667.4. Full Context, Thr. (q/s) = 1.50. Full Context, TFLOPs = 59.9.
      Full Context, Mem. (GB) = 53.5. OSCAR, Rate = 16 \xD7. OSCAR, Lat. (ms) = 156.1.
      OSCAR, Thr. (q/s) = 6.41. OSCAR, TFLOPs = 15.0. OSCAR, Mem. (GB) = 39.6. OSCAR,
      Rate = 32 \xD7. OSCAR, Lat. (ms) = 149.3. OSCAR, Thr. (q/s) = 6.70. OSCAR, TFLOPs
      = 13.4. OSCAR, Mem. (GB) = 39.0. OSCAR, Rate = 64 \xD7. OSCAR, Lat. (ms) = 142.9.
      OSCAR, Thr. (q/s) = 7.00. OSCAR, TFLOPs = 12.5. OSCAR, Mem. (GB) = 38.7. OSCAR,
      Rate = 128 \xD7. OSCAR, Lat. (ms) = 136.4. OSCAR, Thr. (q/s) = 7.33. OSCAR,
      TFLOPs = 12.1. OSCAR, Mem. (GB) = 38.5. AdaMem, Rate = 16 \xD7. AdaMem, Lat.
      (ms) = 192.4. AdaMem, Thr. (q/s) = 5.20. AdaMem, TFLOPs = 21.0. AdaMem, Mem.
      (GB) = 56.4. AdaMem, Rate = 32 \xD7. AdaMem, Lat. (ms) = 167.5. AdaMem, Thr.
      (q/s) = 5.97. AdaMem, TFLOPs = 16.6. AdaMem, Mem. (GB) = 48.4. AdaMem, Rate
      = 64 \xD7. AdaMem, Lat. (ms) = 152.9. AdaMem, Thr. (q/s) = 6.54. AdaMem, TFLOPs
      = 14.3. AdaMem, Mem. (GB) = 44.4. AdaMem, Rate = 128 \xD7. AdaMem, Lat. (ms)
      = 144.0. AdaMem, Thr. (q/s) = 6.95. AdaMem, TFLOPs = 13.0. AdaMem, Mem. (GB)
      = 42.3\\n\\nAnswer: AdaMem matches Full Context quality on TriviaQA at **32\xD7
      compression**. Specifically, at 32 \xD7 compression it matches Full Context
      quality (84.4 Match) at 4.0 \xD7 lower latency and 3.6 \xD7 less compute.\\n\\nThis
      is corroborated by the efficiency data in Table 4, which shows that at 32\xD7
      compression, AdaMem's per-query latency is **167.5 ms**, compared to **667.4
      ms** for Full Context (1\xD7) \u2014 consistent with the roughly 4\xD7 latency
      reduction reported.\\n\\nPass only if every factual claim in the answer is stated
      in, or directly follows from, the\\nsources. A claim that is plausible but absent
      from the sources fails. An answer that correctly\\nsays the sources don't contain
      the answer passes.\"}],\"model\":\"claude-opus-5\",\"output_config\":{\"format\":{\"type\":\"json_schema\",\"schema\":{\"type\":\"object\",\"title\":\"Verdict\",\"properties\":{\"reasoning\":{\"type\":\"string\",\"description\":\"One
