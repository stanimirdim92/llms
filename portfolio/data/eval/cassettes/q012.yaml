- request:
    body: '{"query": "At what compression rate does AdaMem match full-context quality
      on TriviaQA, and how much lower is its latency?", "documents": ["B Inference
      Efficiency\nTable 4 reports per-query latency, throughput, total compute, and
      peak GPU memory on TriviaQA with k = 25 retrieved passages, for all inference-time
      compression rates used in the main text.\nAll compressed configurations are
      substantially cheaper than Full Context: latency drops by 3 . 5 \u00d7 to 4
      . 9 \u00d7 and compute by 2 . 9 \u00d7 to 5 . 0 \u00d7 , confirming that soft
      compression removes the dominant cost of processing large retrieval pools. Relative
      to OSCAR at the same compression rate, AdaMem adds the cost of relevance scoring
      and of encoding the fixed candidate memory bank before selection. This overhead
      is confined to the compressor and does not grow with the decoder context, so
      its share shrinks as compression increases: from 36.3 ms (23%) at 16 \u00d7
      to 10.0 ms (7%) at 64 \u00d7 and 7.6 ms (6%) at 128 \u00d7 . Because the quality
      of AdaMem is nearly flat in the compression rate, it can be operated at aggressive
      compression where this overhead is smallest: at 64 \u00d7 and 128 \u00d7 , AdaMem
      matches or improves on OSCAR at 16 \u00d7 in latency, throughput, and compute
      while providing higher answer quality. Peak memory remains moderately higher
      than OSCAR because the candidate bank for the full pool is encoded before allocation,
      yet at 64 \u00d7 it is already below the Full Context footprint (44.4 versus
      53.5 GB), and the gap narrows further with compression.", "This is a line chart
      comparing TriviaQA match performance against compression rate (16x, 32x, 64x,
      128x on x-axis) for three memory allocation methods. The \"AdaMem (ours)\" method
      (blue line) maintains the highest accuracy across all compression rates, starting
      near 84 and ending around 82 (only -2.08% drop from full context), outperforming
      \"Uniform(Oscar)\" (orange line, dropping to -7.34%) and \"Uniform(Pisco)\"
      (purple line, dropping to -7.52%). A dashed green line at the top indicates
      \"Full Context\" performance (~84.5) as the reference baseline, and a schematic
      above the chart illustrates how AdaMem allocates variable-length document representations
      (d1-d4) compared to Uniform''s equal-length allocation.", "B Inference Efficiency\nTable
      4: Inference efficiency on TriviaQA with k = 25 : per-query latency, throughput,
      total compute, and peak GPU memory across inference-time compression rates.\n\nFull
      Context, Rate = 1 \u00d7. Full Context, Lat. (ms) = 667.4. Full Context, Thr.
      (q/s) = 1.50. Full Context, TFLOPs = 59.9. Full Context, Mem. (GB) = 53.5. OSCAR,
      Rate = 16 \u00d7. OSCAR, Lat. (ms) = 156.1. OSCAR, Thr. (q/s) = 6.41. OSCAR,
      TFLOPs = 15.0. OSCAR, Mem. (GB) = 39.6. OSCAR, Rate = 32 \u00d7. OSCAR, Lat.
      (ms) = 149.3. OSCAR, Thr. (q/s) = 6.70. OSCAR, TFLOPs = 13.4. OSCAR, Mem. (GB)
      = 39.0. OSCAR, Rate = 64 \u00d7. OSCAR, Lat. (ms) = 142.9. OSCAR, Thr. (q/s)
      = 7.00. OSCAR, TFLOPs = 12.5. OSCAR, Mem. (GB) = 38.7. OSCAR, Rate = 128 \u00d7.
      OSCAR, Lat. (ms) = 136.4. OSCAR, Thr. (q/s) = 7.33. OSCAR, TFLOPs = 12.1. OSCAR,
      Mem. (GB) = 38.5. AdaMem, Rate = 16 \u00d7. AdaMem, Lat. (ms) = 192.4. AdaMem,
      Thr. (q/s) = 5.20. AdaMem, TFLOPs = 21.0. AdaMem, Mem. (GB) = 56.4. AdaMem,
      Rate = 32 \u00d7. AdaMem, Lat. (ms) = 167.5. AdaMem, Thr. (q/s) = 5.97. AdaMem,
      TFLOPs = 16.6. AdaMem, Mem. (GB) = 48.4. AdaMem, Rate = 64 \u00d7. AdaMem, Lat.
      (ms) = 152.9. AdaMem, Thr. (q/s) = 6.54. AdaMem, TFLOPs = 14.3. AdaMem, Mem.
      (GB) = 44.4. AdaMem, Rate = 128 \u00d7. AdaMem, Lat. (ms) = 144.0. AdaMem, Thr.
      (q/s) = 6.95. AdaMem, TFLOPs = 13.0. AdaMem, Mem. (GB) = 42.3", "Table 4: Inference
      efficiency on TriviaQA with k = 25 : per-query latency, throughput, total compute,
      and peak GPU memory across inference-time compression rates.\n\n| Method       |
      Rate   |   Lat. (ms) |   Thr. (q/s) |   TFLOPs |   Mem. (GB) |\n|--------------|--------|-------------|--------------|----------|-------------|\n|
      Full Context | 1 \u00d7    |       667.4 |         1.50 |     59.9 |        53.5
      |\n| OSCAR        | 16 \u00d7   |       156.1 |         6.41 |     15.0 |        39.6
      |\n| OSCAR        | 32 \u00d7   |       149.3 |         6.70 |     13.4 |        39.0
      |\n| OSCAR        | 64 \u00d7   |       142.9 |         7.00 |     12.5 |        38.7
      |\n| OSCAR        | 128 \u00d7  |       136.4 |         7.33 |     12.1 |        38.5
      |\n| AdaMem       | 16 \u00d7   |       192.4 |         5.20 |     21.0 |        56.4
      |\n| AdaMem       | 32 \u00d7   |       167.5 |         5.97 |     16.6 |        48.4
      |\n| AdaMem       | 64 \u00d7   |       152.9 |         6.54 |     14.3 |        44.4
      |\n| AdaMem       | 128 \u00d7  |       144.0 |         6.95 |     13.0 |        42.3
      |", "Experiments and Results\nFinally, at 16 \u00d7 , AdaMem closely approaches
      Full Context performance despite replacing the retrieved text with a substantially
      shorter continuous representation. On TriviaQA, it is within 0.4 points of Full
      Context, while on PopQA it exceeds Full Context by 1.4 points. Hence, selective
      memory allocation can both reduce computational cost and mitigate interference
      from irrelevant retrieved passages.\nFigure 4: Memory-token allocation by document
      relevance rank at 64 \u00d7 compression. The dashed line denotes OSCAR''s fixed
      16 \u00d7 allocation.\nMemory Allocation Behavior. Figure 4 illustrates the
      allocation mechanism under this highly constrained 64 \u00d7 setting. For the
      most relevant documents, AdaMem allocates a median of roughly 10 memory tokens,
      already exceeding OSCAR''s fixed budget of 9 tokens per document at 16 \u00d7
      . The 90th percentile is substantially higher, indicating that for some queries,
      AdaMem assigns considerably more capacity to the most relevant document. In
      contrast, the allocation decreases sharply with relevance rank and approaches
      zero for lower-ranked documents. Thus, AdaMem concentrates capacity on query-relevant
      evidence while assigning minimal capacity to noisy passages, reducing their
      potential interference in the compressed context.\nRobustness to Retrieval Depth
      and Compression. Figure 3 compares AdaMem and OSCAR across retrieval depths
      k \u2208 { 5 , 10 , 15 , 20 , 25 } and compression ratios of 16 \u00d7 , 32
      \u00d7 , and 64 \u00d7 at \u03c4 =1. AdaMem benefits more consistently from
      deeper retrieval, whereas OSCAR remains nearly constant as additional lower-ranked
      documents are introduced.\nThis difference is most pronounced under aggressive
      compression. At 64 \u00d7 , increasing k from 5 to 25 improves AdaMem by 3.5
      points on TriviaQA, 5.4 on Natural Questions, and 4.2 on HotpotQA, while OSCAR
      changes only marginally over the same range. A similar pattern holds at 32 \u00d7
      , particularly on Natural Questions and HotpotQA.\nThese results suggest that
      AdaMem can extract useful evidence from less-relevant documents without allocating
      them the same budget as highly relevant ones. In contrast, OSCAR''s fixed per-document
      allocation provides limited benefit from deeper retrieval, as its representation
      capacity is uniformly spread over an increasingly noisy document set. The effect
      is weaker at 16 \u00d7 , where both methods have sufficient capacity for shallow
      retrieval pools, but becomes increasingly clear as the memory budget is reduced.\nFigure
      5: Quality-latency tradeoff on TriviaQA. AdaMem shows similar latency as OSCAR
      and matches Full Context quality at 4 . 0 \u00d7 lower latency.", "Experiments
      and Results\nEfficiency-Performance Tradeoff. Figure 5 relates TriviaQA Match
      to per-query inference latency across compression rates (theoretical optimal
      \u03c4 is used) . AdaMem operates at the same low latency as prior soft compression
      while delivering uncompressed-quality answers roughly 4 \u00d7 more efficiently
      than Full Context: at 32 \u00d7 compression it matches Full Context quality
      (84.4 Match) at 4 . 0 \u00d7 lower latency and 3 . 6 \u00d7 less compute. The
      two methods also trade quality for speed in sharply different ways. Lowering
      the budget moves OSCAR down a steep curve, losing 5.3 Match points between 16
      \u00d7 and 64 \u00d7 compression, whereas AdaMem stays within 0.5 points over
      the same range: relevance-aware allocation converts compression into latency
      savings almost without quality cost. As a result, AdaMem at 64 \u00d7 is both
      faster and more accurate than uniform compression at 16 \u00d7 . Appendix B
      provides additional efficiency discussion with detailed measurements, including
      throughput, compute, and memory information.\nEffect of Training-Data Filtering.
      We evaluate the impact of filtered fine-tuning data. KILT-SCR retains instances
      where the retrieved pool contains a gold-answer alias and the teacher target
      is answer-consistent, reducing noise in both retrieval supervision and generation
      targets.\nFor a controlled comparison, we train the same AdaMem model for one
      epoch on either filtered or unfiltered data under identical settings. Using
      25 passages and a compression rate of 16, Table 2 shows that KILT-SCR improves
      performance by 1.7 points on average, indicating better alignment between relevance
      estimation and answer generation.\nAblation of Training Stages. Table 3 ablates
      the contribution of the three training stages. Removing Stage 1 causes the largest
      performance drop across all datasets, particularly on NQandHotpotQA.Thisresultshowsthatdirectly
      optimizing query-dependent generation and relevance-supervision objectives is
      insufficient to learn effective continuous passage representations from scratch.
      Removing either Stage 2 or Stage 3 produces smaller but consistent degradations.
      Without Stage 2, the model loses the intermediate adaptation from generic soft
      compression to query-conditioned evidence representation. Without Stage 3, it
      is not optimized for relevance estimation and memory allocation over the full
      retrieved candidate pools used at inference time.\nTable 2: Effect of filtered
      fine-tuning data on Match (%) at compression rate 16. Both models are trained
      for one epoch.\n\nUnfiltered, TriviaQA = 80.3. Unfiltered, NQ = 62.8. Unfiltered,
      HotpotQA = 42.6. Filtered, TriviaQA = 82.8. Filtered, NQ = 63.3. Filtered, HotpotQA
      = 44.5. Difference, TriviaQA = +2.5. Difference, NQ = +0.6. Difference, HotpotQA
      = +2.0", "Table 1: Match (%) performance on six QA benchmarks with 25 retrieved
      documents. Hard- (RECOMP, LLMLingua, LLMLingua-2) and soft-compression (xRAG,
      PISCO) baselines are shown at their respective rates; OSCAR (uniform) and AdaMem
      (relevance-aware) share one compressor and are reported at 16 / 32 / 64 \u00d7
      , with 32 / 64 \u00d7 at inference only. Per column, the top-3 compression methods
      are shaded green (darkest = best). The bootstrap-estimated standard deviations
      for TriviaQA, HotpotQA, NQ, PopQA, ASQA, and BioASQ are 1.0, 1.1, 1.1, 1.1,
      1.5, and 1.2, respectively. Generation temperature: \u03c4 = 1 .\n\n| Method            |   TriviaQA
      |   HotpotQA |   NQ |   PopQA |   ASQA |   BioASQ | Compr. rate   |\n|-------------------|------------|------------|------|---------|--------|----------|---------------|\n|
      No Context        |       71.9 |       32.3 | 41.7 |    26.5 |   48.4 |     29.4
      | -             |\n| Full Context      |       84.4 |       51.5 | 66.3 |    60.2
      |   70.9 |     33.1 | -             |\n| RECOMP            |       76.0 |       37.0
      | 50.0 |    34.8 |   55.9 |     29.0 | 200           |\n| LLMLingua-2       |       80.7
      |       43.3 | 60.9 |    44.3 |   63.0 |     31.2 | 2             |\n| LLMLingua         |       76.2
      |       37.2 | 55.0 |    39.0 |   58.4 |     27.2 | 2             |\n| xRAG              |       26.9
      |       13.9 |  9.3 |    11.2 |   11.9 |      8.8 | 147           |\n| PISCO             |       79.8
      |       38.4 | 58.9 |    53.6 |   61.0 |     27.7 | 16            |\n| OSCAR             |       82.4
      |       44.1 | 62.8 |    58.4 |   66.5 |     28.6 | 16            |\n|                   |       80.4
      |       40.0 | 60.0 |    56.9 |   66.8 |     28.4 | 32            |\n|                   |       77.1
      |       36.3 | 54.2 |    49.8 |   58.8 |     26.0 | 64            |\n|                   |       84.0
      |       46.3 | 64.0 |    61.6 |   69.1 |     29.2 | 16            |\n| AdaMem
      (proposed) |       83.9 |       45.4 | 63.9 |    61.7 |   68.5 |     29.3 |
      32            |\n| AdaMem (proposed) |       83.3 |       44.2 | 61.4 |    59.6
      |   67.1 |     28.8 | 64            |", "Experiments and Results\nBaselines.
      We compare AdaMem against hardcompression methods (RECOMP, LLMLingua, and LLMLingua-2),
      and soft-compression methods (xRAG, PISCO, and OSCAR). No Context answers without
      retrieved evidence, while Full Context provides all retrieved passages without
      compression. PISCO and OSCAR are the closest soft-compression baselines because
      they support large retrieved candidate pools and integrate compression with
      the retrieval pipeline. PISCO uses query-independent passage compression, whereas
      OSCAR, like AdaMem, performs query-conditioned compression and relevance scoring.
      Both assign memory uniformly across retained passages, while AdaMem allocates
      a fixed global budget according to passage relevance. To isolate this difference,
      we train PISCO, OSCAR, and AdaMem using identical data splits, hyperparameters,
      and training stages. Consequently, the comparison with OSCAR directly measures
      the effect of relevance-aware memory allocation under a matched setup.\nMain
      Results. Table 1 reports results with 25 retrieved documents. At the reference
      compression rate of 16 \u00d7 , AdaMem achieves the best performance among compressed
      methods on five of six benchmarks. The only exception is BioASQ, where LLMLingua-2
      achieves the strongest compressed result. Nevertheless, AdaMem outperforms all
      evaluated soft-compression baselines.\nHard-compression methods exhibit a clear
      trade-off between compression and answer quality. RECOMP achieves the highest
      compression rate (200 \u00d7 ), but its performance remains only moderately
      above the No Context baseline; for example, it improves HotpotQA from 32.3 to
      37.0. Conversely, LLMLingua and LLMLingua-2 operate at only 2 \u00d7 compression,
      retaining a substantially larger text budget, yet generally remain below AdaMem.
      For instance, at 16 \u00d7 , AdaMem improves over LLMLingua-2 by 3.3 points
      on TriviaQA, 3.0 points on HotpotQA, and 17.3 points on PopQA. Thus, hard compression
      either requires aggressive token removal, which leaves limited useful evidence,
      or preserves much larger context without reaching the effectiveness of soft
      compression.\nAmong soft-compression methods, AdaMem consistently outperforms
      OSCAR under the same 16 \u00d7 memory budget and yields substantial gains over
      PISCO. xRAG performs poorly in this setting because it is designed to compress
      a single document. When applied to long multi-document contexts, its compressed
      tokens become less informative and fail to preserve passage-specific, query-relevant
      evidence.\nBoth AdaMem and OSCAR are trained at 16 \u00d7 compression. We evaluate
      higher compression ratios exclusively at inference time, without additional
      training or fine-tuning. At 32 \u00d7 , AdaMem outperforms OSCAR at its training-time
      compression ratio of 16 \u00d7 across all benchmarks, indicating that it can
      use approximately half as many memory embeddings while maintaining answer quality.
      Even at 64 \u00d7 , AdaMemsurpasses OSCAR at 16 \u00d7 on five of six benchmarks.
      Moreover, AdaMem retains a clear advantage over OSCAR at the same\n64 \u00d7
      compression rate. For example, on TriviaQA, increasing compression from 16 \u00d7
      to 64 \u00d7 reduces performance by only 0.7 points for AdaMem, compared with
      5.3 points for OSCAR. This robustness suggests that relevance-aware allocation
      preserves salient evidence when the memory budget is severely constrained.",
      "This is a grouped bar chart comparing the performance of two methods, AdaMem
      (blue) and OSCAR (yellow hatched), across three question-answering datasets:
      TriviaQA, NQ, and HotpotQA. The y-axis shows \"Llama-3 judge (%)\" scores ranging
      from 0 to about 90, while the x-axis shows compression rates of 16\u00d7, 32\u00d7,
      and 64\u00d7 for each dataset. Across all datasets and compression rates, AdaMem
      consistently outperforms OSCAR, with the performance gap widening as compression
      rate increases (e.g., in HotpotQA, AdaMem scores 62.4% vs OSCAR''s 55.3% at
      64\u00d7 compression), indicating AdaMem maintains accuracy better under higher
      compression.", "Top-25 QA robustness under stronger compression\nFigure 7: LLM-as-a-judge
      accuracy under increasingly strong inference-time compression. AdaMem consistently
      retains higher answer quality than OSCAR as the memory budget decreases.", "This
      is a line/scatter plot comparing retrieval or memory methods on a latency-accuracy
      tradeoff. The x-axis shows \"Latency per query (ms, log scale)\" ranging from
      about 140 to 670+, and the y-axis shows \"Match (%)\" ranging from roughly 76
      to 84. Three methods are plotted: AdaMem (green circles) and OSCAR (orange squares),
      each annotated with compression/sampling factors (128\u00d7, 64\u00d7, 32\u00d7,
      16\u00d7), showing that AdaMem achieves higher match scores at lower latencies
      than OSCAR; a \"Full Context\" baseline (purple star) achieves the highest match
      (~84%) but at much greater latency (~670 ms), labeled as \"4\u00d7 lower latency\"
      compared to the other methods, indicating AdaMem approaches Full Context accuracy
      while being significantly faster.", "D Judge Metrics\nWe use Substring Match
      as the primary metric because it is deterministic and consistent with standard
      open-domain QA evaluation. However, it can overestimate answer quality when
      a model lists multiple candidate answers: the prediction receives full credit
      whenever it contains a gold-answer alias as a substring, even if the response
      is ambiguous, unsupported, or includes incorrect alternatives. We therefore
      additionally report LLM-as-a-judge scores, which evaluate the correctness of
      the generated answer in the context of the question and reference answer. The
      judge assigns a score of 1 for a correct answer, 0.5 for a partially correct
      answer, and 0 for a wrong answer; we report the mean score as a percentage.
      This complementary evaluation penalizes answer enumeration and verifies that
      improvements in Match correspond to genuinely correct answers rather than increased
      lexical overlap with the reference.\nTable 5: Training schedule for the three-stage
      procedure.\n\nStage 1, Examples = 2,000,000. Stage 1, Epochs = 1. Stage 2, Examples
      = 500,000. Stage 2, Epochs = 1. Stage 3 (KILT-SCR), Examples = 196,916. Stage
      3 (KILT-SCR), Epochs = 3\nFor each example, we provide the judge with the question,
      the reference answer, and the model prediction. We use the following prompt:\nSystem
      prompt: You are an evaluation tool. Answer with one of: 1: Correct, 0.5: Partially
      correct, 0: Wrong.\nUser prompt: Here is a question, a golden answer, and an
      AI-generated answer. Can you judge whether the AIgenerated answer is correct
      according to the question and golden answer? Simply answer with one of: 1: Correct,
      0.5: Partially correct, 0: Wrong.\nQuestion:\n{question}\nGolden answer:\n{answer}\nGenerated
      answer: {prediction}\nFigure 7 corroborates the Match-based robustness trends.
      At the training-time compression rate of 16 \u00d7 , AdaMem matches or exceeds
      OSCAR across all three benchmarks, improving by 1.8 points on TriviaQA and 2.4
      points on NQ, while the methods are effectively tied on HotpotQA. The advantage
      grows under stronger inference-time compression. At 64 \u00d7 , AdaMem exceeds
      OSCAR by 6.1 points on TriviaQA and NQ, and by 7.1 points on HotpotQA. In contrast
      to OSCAR, AdaMem remains stable as the memory budget shrinks: its judge score
      decreases by only 0.9, 3.3, and 1.4 points from 16 \u00d7 to 64 \u00d7 on TriviaQA,
      NQ, and HotpotQA, respectively, compared with drops of 5.2, 7.0, and 8.7 points
      for OSCAR. These results show that relevance-aware allocation preserves answer-critical
      information under severe compression, rather than merely improving lexical overlap
      with reference answers.", "This is a line chart grid comparing two retrieval-augmented
      QA methods, OSCAR (red) and AdaMem (green), across three datasets (TriviaQA,
      NQ, HotpotQA) and three compression ratios (16x, 32x, 64x), forming a 3x3 panel
      layout. The x-axis in each subplot represents the number of retrieved documents
      (k = 5, 10, 15, 20, 25), while the y-axis shows task performance scores (ranging
      roughly from 36 to 84 depending on the dataset/compression level). Across nearly
      all panels, AdaMem consistently outperforms OSCAR, with the performance gap
      generally widening as compression increases (64x) and as more documents are
      retrieved, demonstrating AdaMem''s superior robustness under higher compression
      and larger retrieval sets.", "Introduction\nMotivated by these limitations,
      we propose AdaMem , a framework that transforms reranking from binary selection
      into relevance-aware memory allocation. A shared compressor produces query-conditioned
      memories and scores; a principled softmax allocation, grounded in logarithmic
      utility theory, distributes a fixed total memory budget across passages according
      to their estimated utility. The temperature interpolates between uniform allocation
      and hard topk selection. Here are our main contributions:\n- We introduce relevance-aware
      memory allocation for soft-compressed RAG: each document receives an adaptive
      memory budget determined by its estimated relevance (Figure 1), concentrating
      capacity on answer-bearing evidence while preserving compact representations
      for complementary context. This adaptivity makes AdaMem substantially more robust
      to extreme compression: between 16 \u00d7 and 128 \u00d7 its quality degrades
      by only about 2%, compared with over 7% for uniform-allocation baselines such
      as OSCAR.\n- Across six open-domain QA benchmarks, AdaMem outperforms every
      evaluated compression baseline at matched budgets: at 16 \u00d7 it improves
      over uniform allocation by 3 . 4% on average (up to 5 . 5% ) and over the strongest
      hard-compression baseline by 9 . 7% despite an 8 \u00d7 smaller context. Quality
      is also more stable under inference-time compression: moving from 16 \u00d7
      to 64 \u00d7 costs AdaMem 2 . 8% on average, against 12 . 2% for uniform allocation.
      At different compression rates, AdaMem retains up to 99% of full-context quality
      at 4 \u00d7 lower latency.\n- We release KILT-SCR (Soft Compression and Reranking),
      a large-candidate-pool resource for reranking and context compression, with
      25 passages per query, 196,916\ntraining instances, and evaluation data from
      six QA benchmarks. The training split use answer-grounded filtration to ensure
      supporting retrieved evidence and goldconsistent generated targets.", "Conclusion\nWe
      introduced AdaMem, a relevance-aware allocation framework for soft-compressed
      RAG. Instead of uniformly representing retained passages, AdaMem converts querydependent
      relevance scores into a non-uniform allocation of a fixed global memory budget,
      concentrating capacity on answer-bearing evidence while retaining limited capacity
      for complementary passages. The resulting allocation is the exact optimum of
      a proportional-fair objective under an assumed logarithmic utility model, and
      is a first-order approximation to the reverse-water-filling optimum of classical
      exponential-distortion bit allocation.\nFigure 6: Optimal allocation temperature
      on TriviaQA across compression rates. The analytically predicted schedule (
      \u03c4 \u221d B ( \u03c1 ) , anchored at 16 \u00d7 ) follows the empirical optimum
      and consistently outperforms a fixed \u03c4 = 1 .\nAdaMem establishes a new
      state of the art among softcompression methods across six evaluated QA benchmarks.
      At 16 \u00d7 compression, it improves over baselines, the strongest prior soft-compression
      method, by an average of 3 . 4% in relative terms. The advantage becomes substantially
      larger as the memory budget decreases. At 64 \u00d7 compression, the average
      relative improvement reaches 14 . 6% , with gains of up to 21 . 8% on HotpotQA.
      At 32 \u00d7 , AdaMem exceeds OSCAR at 16 \u00d7 on every benchmark, achieving
      an average relative improvement of 2 . 9% . These results show that adaptive
      allocation is particularly effective under aggressive compression, where large
      retrieval pools must be represented within strict memory constraints.\nFinally,
      we introduce KILT-SCR, a training and evaluation resource for the joint study
      of reranking and compression. Constructed to retain answer-bearing retrieved
      evidence and answer-consistent teacher targets, it enables controlled comparison
      of reranking and memory-allocation strategies over large candidate pools with
      heterogeneous passage utility.\nSeveral future research directions remain open.
      The temperature could be learned or predicted per query rather than set per
      compression rate, allowing allocation sharpness to adapt to the confidence of
      the relevance estimates. The budget-allocation view itself is not specific to
      QA or memory embeddings and extends naturally to other bounded representations,
      such as KV-cache compression and long-context summarization.\nAllal, L. B.;
      Lozhkov, A.; Bakouch, E.; Bl\u00e1zquez, G. M.; Penedo, G.; Tunstall, L.; Marafioti,
      A.; Kydl\u00ed\u010dek, H.; Lajar\u00edn, A. P.; Srivastav, V.; Lochner, J.;
      Fahlgren, C.; Nguyen, X.-S.; Fourrier, C.; Burtenshaw, B.; Larcher, H.; Zhao,
      H.; Zakka, C.; Morlon, M.; Raffel, C.; von Werra, L.; and Wolf, T. 2025. SmolLM2:
      When Smol Goes Big - Data-Centric Training of a Small Language Model. arXiv:2502.02737.",
      "Abstract\nRetrieval-augmented generation (RAG) improves language modelswithretrieved
      evidence, but processing many long passages is costly and can introduce distracting
      information. Soft compression addresses this challenge by encoding passages
      as compact sequences of continuous memory embeddings before generation. However,
      existing methods typically assign each retained passage an identical number
      of memory embeddings, irrespective of its query-specific relevance. To address
      this, we propose AdaMem, a relevance-guided soft-compression framework that
      maps learned passage-relevance estimates to a query-dependent allocation of
      a fixed memory-token budget. A shared query-conditioned compressor produces
      both continuous passage memories and relevance scores in a single pass; a deterministic
      allocation rule assigns more memory tokens to higher-scoring passages and can
      omit low-scoring ones. Across six open-domain QA benchmarks, AdaMem consistently
      outperforms OSCAR (the closely matched softcompression baseline that uses uniform
      allocation) as well as other soft-compression methods at matched memory budgets.
      Under standard 16 \u00d7 compression, AdaMem improves sub-string match by up
      to 3.2 points (5.5%) over uniform allocation baseline, with an average relative
      gain of 3.4%; under aggressive 64 \u00d7 compression the average relative gain
      grows to 14.6%, with a maximum of 9.8 points (19.7%) on PopQA. AdaMem matches
      the answer quality of the uncompressed at up to 4 \u00d7 lower inference latency
      than full context baseline. AdaMem retains an efficiency profile comparable
      to the uniform-compression baseline, while achieving up to 4 \u00d7 lower inference
      latency than full-context inference. Thus, relevance-guided memory allocation
      is particularly effective when retrieval pools are large and the available memory
      budget is tight.", "Experiments and Results\nTable 3: Effect of the three-stage
      training procedure at 16 \u00d7 compression with k = 25 .\n\nw/o Stage 1, TriviaQA
      = 71.30. w/o Stage 1, NQ = 44.45. w/o Stage 1, HotpotQA = 29.35. w/o Stage 2,
      TriviaQA = 81.35. w/o Stage 2, NQ = 61.65. w/o Stage 2, HotpotQA = 43.10. w/o
      Stage 3, TriviaQA = 81.05. w/o Stage 3, NQ = 59.30. w/o Stage 3, HotpotQA =
      42.70. Full three-stage training, TriviaQA = 82.80. Full three-stage training,
      NQ = 63.30. Full three-stage training, HotpotQA = 44.50\nOverall, the results
      show that each stage addresses a distinct requirement: learning general-purpose
      soft memories, adapting them to query-dependent evidence, and aligning relevance-aware
      allocation with the target retrieval setting.\nEffect of Allocation Temperature.
      The temperature \u03c4 controls allocation sharpness: larger values approach
      uniform allocation, while smaller values concentrate memory on the most relevant
      passages. Our allocation view predicts that \u03c4 should decrease as compression
      becomes stronger, since a smaller memory budget must be focused on fewer high-utility
      passages.\nFigure 6 confirms this prediction on TriviaQA. The optimal temperature
      decreases from \u03c4 \u2217 = 1 . 0 at 16 \u00d7 compression to 0 . 7 at 32
      \u00d7 and 0 . 5 at 64 \u00d7 and 128 \u00d7 . Moreover, a theoretically predicted
      schedule, \u03c4 \u221d B ( \u03c1 ) anchored at 16 \u00d7 , consistently outperforms
      a fixed \u03c4 = 1 and closely tracks the empirical optimum, despite a small
      gap at higher compression.\nThis effect contributes to the robustness in Figure
      1, which uses the theoretical temperature schedule without any empirical tuning.",
      "Related Work\nPrior work on context compression follows two main paradigms:
      hard compression , which shortens retrieved text, and soft compression , which
      replaces it with continuous representations.\nHard Compression. These methods
      retain the generator''s textual interface by selecting or rewriting useful context.
      LLMLingua (Jiang et al. 2023b) uses perplexity-based token removal; LongLLMLingua
      (Jiang et al. 2024) adds query awareness; LLMLingua-2 (Pan et al. 2024) formulates
      compression as token classification. RECOMP (Xu, Shi, and Choi 2024) learns
      extractive and abstractive compressors optimized for downstream performance.
      Such methods are interpretable and model-agnostic, but their discrete outputs
      must be re-encoded per query, limiting compression rates.\nSoft Compression.
      Soft compression maps text to continuous memory embeddings consumed directly
      by the generator. Gist tokens (Mu, Li, and Goodman 2023), AutoCompressors (Chevalier
      et al. 2023), and In-Context Autoencoders (Ge et al. 2024) establish that LLMs
      can condition on latent representations. For RAG, xRAG (Cheng et al. 2024) projects
      a pre-computed embedding into generator space; 500xCompressor (Li, Su, and Collier
      2025) demonstrates extreme compression; PISCO (Louis, D\u00e9jean, and Clinchant
      2025) trains a compressor via distillation. OSCAR (Louis et al. 2026) is most
      closely related: it performs online query-conditioned compression and jointly
      produces representations and relevance scores. However, as in most prior pipelines,
      relevance determines ordering or selection, while each retained passage receives
      the same fixed number of memory tokens. AdaMem instead distributes a fixed global
      budget non-uniformly according to estimated utility.\nCapacity of Soft Memories.
      Kuratov et al. (2025) show a single vector can encode sequences at compression
      ratios approaching 1500 \u00d7 , and that compressibility depends more on resolvable
      uncertainty than raw length; we build on this observation but study how a fi
      xed capacity should be distributed across multiple passages rather than the
      ceiling of a single memory.", "Table 2: Effect of filtered fine-tuning data
      on Match (%) at compression rate 16. Both models are trained for one epoch.\n\n|
      Training data   |   TriviaQA |   NQ |   HotpotQA |\n|-----------------|------------|------|------------|\n|
      Unfiltered      |       80.3 | 62.8 |       42.6 |\n| Filtered        |       82.8
      | 63.3 |       44.5 |\n| Difference      |       +2.5 | +0.6 |       +2.0 |",
      "This is a schematic diagram illustrating the \"AdaMem\" adaptive memory compression
      method for retrieval-augmented language models, shown in three panels. Panel
      (a) depicts a shared compressor network that takes query-document pairs (d1\u2013d4)
      and outputs relevance scores (ranging from 2.1 to -1.9). Panel (b) shows the
      adaptive budget allocation formula (using softmax over relevance scores divided
      by temperature \u03c4) that distributes a fixed total memory budget (B=32 tokens)
      unevenly across documents based on relevance (m1=17, m2=9, m3=6, m4=0), contrasted
      with a uniform allocation baseline (8 tokens each). Panel (c) illustrates the
      decoder stage, where allocated memory tokens are fed into a LoRA-adapted Mistral-7B
      model to generate an answer, demonstrating that AdaMem''s adaptive allocation
      produces the correct answer (\"Kazuo Ishiguro\") while uniform budget allocation
      yields an incorrect answer (\"Frederick Forsyth\")."], "model": "rerank-2.5",
      "top_k": 5, "truncation": true}'
