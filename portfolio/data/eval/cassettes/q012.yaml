      despite replacing the retrieved text with a substantially shorter continuous
      representation. On TriviaQA, it is within 0.4 points of Full Context, while
      on PopQA it exceeds Full Context by 1.4 points. Hence, selective memory allocation
      can both reduce computational cost and mitigate interference from irrelevant
      retrieved passages.\\nFigure 4: Memory-token allocation by document relevance
      rank at 64 \xD7 compression. The dashed line denotes OSCAR's fixed 16 \xD7 allocation.\\nMemory
      Allocation Behavior. Figure 4 illustrates the allocation mechanism under this
      highly constrained 64 \xD7 setting. For the most relevant documents, AdaMem
      allocates a median of roughly 10 memory tokens, already exceeding OSCAR's fixed
      budget of 9 tokens per document at 16 \xD7 . The 90th percentile is substantially
      higher, indicating that for some queries, AdaMem assigns considerably more capacity
