        allocation.\",\"metadata\":{\"ingestion_version\":\"01a0fc53885372038a1c6d0df171e569\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d-fig-001-00\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d\",\"chunk_type\":\"figure\",\"section_path\":\"\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":7,\"page_no\":1,\"filename\":\"2609.22100v1.pdf\",\"image_path\":\"/var/www/html/personal/llms/portfolio/data/processed/01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d/figures/fig-001-00-695c084d532812de.png\"}}},{\"id\":\"59a855a5-5d91-566d-af5b-7c35dc4e52a2\",\"version\":7,\"score\":0.4740969,\"payload\":{\"page_content\":\"Abstract\\nRetrieval-augmented
        generation (RAG) improves language modelswithretrieved evidence, but processing
        many long passages is costly and can introduce distracting information. Soft
        compression addresses this challenge by encoding passages as compact sequences
        of continuous memory embeddings before generation. However, existing methods
        typically assign each retained passage an identical number of memory embeddings,
        irrespective of its query-specific relevance. To address this, we propose
        AdaMem, a relevance-guided soft-compression framework that maps learned passage-relevance
        estimates to a query-dependent allocation of a fixed memory-token budget.
        A shared query-conditioned compressor produces both continuous passage memories
        and relevance scores in a single pass; a deterministic allocation rule assigns
        more memory tokens to higher-scoring passages and can omit low-scoring ones.
        Across six open-domain QA benchmarks, AdaMem consistently outperforms OSCAR
        (the closely matched softcompression baseline that uses uniform allocation)
        as well as other soft-compression methods at matched memory budgets. Under
        standard 16 \xD7 compression, AdaMem improves sub-string match by up to 3.2
        points (5.5%) over uniform allocation baseline, with an average relative gain
        of 3.4%; under aggressive 64 \xD7 compression the average relative gain grows
        to 14.6%, with a maximum of 9.8 points (19.7%) on PopQA. AdaMem matches the
        answer quality of the uncompressed at up to 4 \xD7 lower inference latency
        than full context baseline. AdaMem retains an efficiency profile comparable
        to the uniform-compression baseline, while achieving up to 4 \xD7 lower inference
        latency than full-context inference. Thus, relevance-guided memory allocation
        is particularly effective when retrieval pools are large and the available
        memory budget is tight.\",\"metadata\":{\"ingestion_version\":\"01a0fc53885372038a1c6d0df171e569\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d-text-0001\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d\",\"chunk_type\":\"text\",\"section_path\":\"Abstract\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":3,\"page_no\":1,\"filename\":\"2609.22100v1.pdf\"}}},{\"id\":\"db1ed309-fabe-5b95-bf4b-ccbf6c4871cc\",\"version\":7,\"score\":0.46913218,\"payload\":{\"page_content\":\"AdaMem:
