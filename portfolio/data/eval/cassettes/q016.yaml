      Burtenshaw, B.; Larcher, H.; Zhao, H.; Zakka, C.; Morlon, M.; Raffel, C.; von
      Werra, L.; and Wolf, T. 2025. SmolLM2: When Smol Goes Big - Data-Centric Training
      of a Small Language Model. arXiv:2502.02737.\"},\"title\":\"2609.22100v1.pdf
      [01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d] (text, page
      7)\",\"citations\":{\"enabled\":true}},{\"type\":\"document\",\"source\":{\"type\":\"text\",\"media_type\":\"text/plain\",\"data\":\"Method\\nProblem
      Setup. We consider RAG in which a query q is answered from a pool of K retrieved
      passages D = { d i } K i =1 (Figure 2a). Soft compression represents each passage
      d i by a short sequence of continuous memory embeddings that condition the decoder
      in its place. Writing m i for the number of memory embeddings assigned to passage
      i , the total B = \u2211 K i =1 m i is the memory budget that governs the decoder's
      context length, and hence the cost of generation. Existing soft-compression
      methods assign every retained passage the same m i , or set it by a length-based
      rule, spreading the budget without regard to how useful each passage is for
      the query. We instead aim to distribute a fixed budget B according to query-specific
      utility, giving more memory embeddings to answer-bearing passages, fewer to
      marginal ones, and none to irrelevant ones, while keeping the total \u2211 i
      m i = B unchanged. This poses two coupled subproblems: estimating passage relevance,
      and turning those estimates into an integer per-passage allocation of the budget.
      We next describe the shared compressor that produces passage memories and relevance
