      changes only marginally over the same range. A similar pattern holds at 32 \u00d7
      , particularly on Natural Questions and HotpotQA.\nThese results suggest that
      AdaMem can extract useful evidence from less-relevant documents without allocating
      them the same budget as highly relevant ones. In contrast, OSCAR''s fixed per-document
      allocation provides limited benefit from deeper retrieval, as its representation
      capacity is uniformly spread over an increasingly noisy document set. The effect
      is weaker at 16 \u00d7 , where both methods have sufficient capacity for shallow
      retrieval pools, but becomes increasingly clear as the memory budget is reduced.\nFigure
      5: Quality-latency tradeoff on TriviaQA. AdaMem shows similar latency as OSCAR
      and matches Full Context quality at 4 . 0 \u00d7 lower latency.", "This is a
      line chart comparing TriviaQA match performance against compression rate (16x,
      32x, 64x, 128x on x-axis) for three memory allocation methods. The \"AdaMem
      (ours)\" method (blue line) maintains the highest accuracy across all compression
      rates, starting near 84 and ending around 82 (only -2.08% drop from full context),
      outperforming \"Uniform(Oscar)\" (orange line, dropping to -7.34%) and \"Uniform(Pisco)\"
      (purple line, dropping to -7.52%). A dashed green line at the top indicates
      \"Full Context\" performance (~84.5) as the reference baseline, and a schematic
      above the chart illustrates how AdaMem allocates variable-length document representations
      (d1-d4) compared to Uniform''s equal-length allocation.", "Abstract\nRetrieval-augmented
      generation (RAG) improves language modelswithretrieved evidence, but processing
      many long passages is costly and can introduce distracting information. Soft
      compression addresses this challenge by encoding passages as compact sequences
      of continuous memory embeddings before generation. However, existing methods
      typically assign each retained passage an identical number of memory embeddings,
      irrespective of its query-specific relevance. To address this, we propose AdaMem,
      a relevance-guided soft-compression framework that maps learned passage-relevance
      estimates to a query-dependent allocation of a fixed memory-token budget. A
      shared query-conditioned compressor produces both continuous passage memories
      and relevance scores in a single pass; a deterministic allocation rule assigns
      more memory tokens to higher-scoring passages and can omit low-scoring ones.
      Across six open-domain QA benchmarks, AdaMem consistently outperforms OSCAR
      (the closely matched softcompression baseline that uses uniform allocation)
      as well as other soft-compression methods at matched memory budgets. Under standard
      16 \u00d7 compression, AdaMem improves sub-string match by up to 3.2 points
      (5.5%) over uniform allocation baseline, with an average relative gain of 3.4%;
      under aggressive 64 \u00d7 compression the average relative gain grows to 14.6%,
      with a maximum of 9.8 points (19.7%) on PopQA. AdaMem matches the answer quality
      of the uncompressed at up to 4 \u00d7 lower inference latency than full context
      baseline. AdaMem retains an efficiency profile comparable to the uniform-compression
      baseline, while achieving up to 4 \u00d7 lower inference latency than full-context
      inference. Thus, relevance-guided memory allocation is particularly effective
      when retrieval pools are large and the available memory budget is tight.", "AdaMem:
      Adaptive Memory Token Allocation for Soft Compression in Retrieval-Augmented
      Generation\nArtem Sakhno, Grigorii Davydenko, Omar Zoloev, Julia Belikova, Andrey
      Savchenko, Maksim Makarenko \u2217", "Experiments and Results\nBaselines. We
      compare AdaMem against hardcompression methods (RECOMP, LLMLingua, and LLMLingua-2),
      and soft-compression methods (xRAG, PISCO, and OSCAR). No Context answers without
      retrieved evidence, while Full Context provides all retrieved passages without
      compression. PISCO and OSCAR are the closest soft-compression baselines because
      they support large retrieved candidate pools and integrate compression with
      the retrieval pipeline. PISCO uses query-independent passage compression, whereas
      OSCAR, like AdaMem, performs query-conditioned compression and relevance scoring.
      Both assign memory uniformly across retained passages, while AdaMem allocates
      a fixed global budget according to passage relevance. To isolate this difference,
      we train PISCO, OSCAR, and AdaMem using identical data splits, hyperparameters,
      and training stages. Consequently, the comparison with OSCAR directly measures
      the effect of relevance-aware memory allocation under a matched setup.\nMain
      Results. Table 1 reports results with 25 retrieved documents. At the reference
      compression rate of 16 \u00d7 , AdaMem achieves the best performance among compressed
      methods on five of six benchmarks. The only exception is BioASQ, where LLMLingua-2
      achieves the strongest compressed result. Nevertheless, AdaMem outperforms all
      evaluated soft-compression baselines.\nHard-compression methods exhibit a clear
      trade-off between compression and answer quality. RECOMP achieves the highest
      compression rate (200 \u00d7 ), but its performance remains only moderately
      above the No Context baseline; for example, it improves HotpotQA from 32.3 to
      37.0. Conversely, LLMLingua and LLMLingua-2 operate at only 2 \u00d7 compression,
      retaining a substantially larger text budget, yet generally remain below AdaMem.
      For instance, at 16 \u00d7 , AdaMem improves over LLMLingua-2 by 3.3 points
      on TriviaQA, 3.0 points on HotpotQA, and 17.3 points on PopQA. Thus, hard compression
      either requires aggressive token removal, which leaves limited useful evidence,
      or preserves much larger context without reaching the effectiveness of soft
      compression.\nAmong soft-compression methods, AdaMem consistently outperforms
      OSCAR under the same 16 \u00d7 memory budget and yields substantial gains over
      PISCO. xRAG performs poorly in this setting because it is designed to compress
      a single document. When applied to long multi-document contexts, its compressed
      tokens become less informative and fail to preserve passage-specific, query-relevant
      evidence.\nBoth AdaMem and OSCAR are trained at 16 \u00d7 compression. We evaluate
      higher compression ratios exclusively at inference time, without additional
      training or fine-tuning. At 32 \u00d7 , AdaMem outperforms OSCAR at its training-time
      compression ratio of 16 \u00d7 across all benchmarks, indicating that it can
      use approximately half as many memory embeddings while maintaining answer quality.
      Even at 64 \u00d7 , AdaMemsurpasses OSCAR at 16 \u00d7 on five of six benchmarks.
      Moreover, AdaMem retains a clear advantage over OSCAR at the same\n64 \u00d7
      compression rate. For example, on TriviaQA, increasing compression from 16 \u00d7
      to 64 \u00d7 reduces performance by only 0.7 points for AdaMem, compared with
      5.3 points for OSCAR. This robustness suggests that relevance-aware allocation
      preserves salient evidence when the memory budget is severely constrained.",
      "Experiments and Results\nTable 3: Effect of the three-stage training procedure
      at 16 \u00d7 compression with k = 25 .\n\nw/o Stage 1, TriviaQA = 71.30. w/o
      Stage 1, NQ = 44.45. w/o Stage 1, HotpotQA = 29.35. w/o Stage 2, TriviaQA =
      81.35. w/o Stage 2, NQ = 61.65. w/o Stage 2, HotpotQA = 43.10. w/o Stage 3,
      TriviaQA = 81.05. w/o Stage 3, NQ = 59.30. w/o Stage 3, HotpotQA = 42.70. Full
      three-stage training, TriviaQA = 82.80. Full three-stage training, NQ = 63.30.
      Full three-stage training, HotpotQA = 44.50\nOverall, the results show that
      each stage addresses a distinct requirement: learning general-purpose soft memories,
      adapting them to query-dependent evidence, and aligning relevance-aware allocation
      with the target retrieval setting.\nEffect of Allocation Temperature. The temperature
      \u03c4 controls allocation sharpness: larger values approach uniform allocation,
      while smaller values concentrate memory on the most relevant passages. Our allocation
      view predicts that \u03c4 should decrease as compression becomes stronger, since
      a smaller memory budget must be focused on fewer high-utility passages.\nFigure
      6 confirms this prediction on TriviaQA. The optimal temperature decreases from
      \u03c4 \u2217 = 1 . 0 at 16 \u00d7 compression to 0 . 7 at 32 \u00d7 and 0 .
      5 at 64 \u00d7 and 128 \u00d7 . Moreover, a theoretically predicted schedule,
      \u03c4 \u221d B ( \u03c1 ) anchored at 16 \u00d7 , consistently outperforms
      a fixed \u03c4 = 1 and closely tracks the empirical optimum, despite a small
      gap at higher compression.\nThis effect contributes to the robustness in Figure
      1, which uses the theoretical temperature schedule without any empirical tuning.",
      "Top-25 QA robustness under stronger compression\nFigure 7: LLM-as-a-judge accuracy
      under increasingly strong inference-time compression. AdaMem consistently retains
      higher answer quality than OSCAR as the memory budget decreases.", "B Inference
      Efficiency\nTable 4 reports per-query latency, throughput, total compute, and
      peak GPU memory on TriviaQA with k = 25 retrieved passages, for all inference-time
      compression rates used in the main text.\nAll compressed configurations are
      substantially cheaper than Full Context: latency drops by 3 . 5 \u00d7 to 4
      . 9 \u00d7 and compute by 2 . 9 \u00d7 to 5 . 0 \u00d7 , confirming that soft
      compression removes the dominant cost of processing large retrieval pools. Relative
