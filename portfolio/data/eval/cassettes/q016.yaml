    body: '{"query": "In what sense is AdaMem''s softmax memory-allocation rule optimal?",
      "documents": ["A Optimality of the Memory Allocation Rule\nThis appendix states
      in what sense the allocation rule is optimal. The softmax allocation is the
      exact optimizer of a logarithmic-utility budget-allocation problem (Proposition
      1); a remark relates it to classical bit allocation under exponential distortion,
      where it is instead a first-order approximation; and the rounding step is the
      nearest budgetpreserving discretization (Proposition 2).\nSetup. Let K passages
      share a fixed budget of B memory tokens, passage i receiving m i tokens with
      \u2211 i m i = B , and let w i > 0 measure the utility of passage i for the
      query. An allocation model specifies how the value of a passage depends on its
      token count; two standard choices are analyzed below.\nExact optimality under
      logarithmic utility. Suppose the value of a passage grows logarithmically with
      its token count, so that the budget-optimal allocation solves\n<!-- formula-not-decoded
      -->\nLogarithmic utility is the standard model of diminishing returns in resource
      allocation; it defines the proportionally fair operating point of Kelly, Maulloo,
      and Tan (1998) and coincides with the weighted Nash bargaining objective. Soft
      memory tokens plausibly exhibit such diminishing returns: a single token can
      already absorb a large but bounded amount of information (Kuratov et al. 2025),
      so early tokens capture the most and later tokens refine.\nProposition 1 (Exact
      optimality of the softmax allocation) . For any scores \u0302 s \u2208 R K and
      temperature \u03c4 > 0 , the allocation a i = B softmax( \u0302 s i /\u03c4
      ) is the unique solution of (7) with utilities w i = e \u0302 s i /\u03c4 .\nProof.
      The objective is strictly concave and tends to -\u221e as any m i \u2192 0 ,
      so the optimum is unique and interior and the nonnegativity constraints are
      inactive. Stationarity of the Lagrangian gives w i /m i = \u03bb for every i
      , hence m i = w i /\u03bb ; the budget constraint yields \u03bb = \u2211 j w
      j /B , so m i = Bw i / \u2211 j w j . Substituting w i = e \u0302 s i /\u03c4
      gives m i = B softmax( \u0302 s i /\u03c4 ) .", "A Optimality of the Memory
      Allocation Rule\nThree remarks follow. First, by the Gibbs variational principle,
      p = softmax( \u0302 s/\u03c4 ) is also the unique maximizer of \u2211 i p i
      \u0302 s i + \u03c4H ( p ) over the probability simplex, where H denotes the
      Shannon entropy: the allocation maximizes the total relevance of the allocated
      tokens under an entropy penalty on over-concentration, and \u03c4 prices that
      penalty. Second, the temperature limits recover the two prevailing strategies,
      uniform soft compression as \u03c4 \u2192\u221e and hard selection of the top-scoring
      passages as \u03c4 \u2192 0 , so both sit at the degenerate ends of the same
      family. Third, the exact optimum of (7) assigns every passage a strictly positive
      share, matching the full support of the softmax; exact zeros arise only from
      the integer constraint treated below. Within-pool standardization together with
      \u03c4 fi xes the utility parametrization w i = e \u0302 s i /\u03c4 ; since
      the relevance head is distilled to standardized cross-encoder scores, the temperature
      selects how sharply the teacher''s relevance scale is converted into an allocation.\nExponential-distortion
      bit allocation. Classical bit allocation instead minimizes a weighted distortion
      \u2211 i w i D ( m i ) under the same budget, with the high-resolution exponential
      model D ( m ) = c e -\u03b3m , \u03b3 > 0 (Huang and Schultheiss 1963; Shoham
      and Gersho 1988). Ignoring nonnegativity, the equal marginal return condition
      \u03b3w i c e -\u03b3m i = \u03bb gives\n<!-- formula-not-decoded -->\nwhich
      becomes a clipped affine function of centered logutility once m i \u2265 0 is
      restored: shares that would be negative are set to zero and the released budget
      is redistributed among the rest ( reverse water-filling ). Under this model
      the softmax rule is exact only to first order: expanding e \u0302 s i /\u03c4
      = 1 + \u0302 s i /\u03c4 + O ( \u03c4 -2 ) and using \u2211 j \u0302 s j = 0
      gives B softmax( \u0302 s i /\u03c4 ) = B/K + ( B/K\u03c4 ) \u0302 s i + O (
      \u03c4 -2 ) , which agrees with m \u22c6 i when \u0302 s i = (ln w i -ln w )
      /\u03c3 and \u03c4 = \u03b3B/ ( K\u03c3 ) , with \u03c3 the spread of the log-utilities.
      The two models thus assign the softmax rule different statuses: exact optimizer
      under logarithmic utility, first-order approximation of reverse water-filling
      under exponential distortion.\nInteger rounding. The softmax yields fractional
      a i summing to B , whereas tokens are integers. The natural discretization is
      the nearest budget-preserving integer vector,\n<!-- formula-not-decoded -->\nProposition
      2 (Largest-remainder is nearest rounding) . Largest-remainder rounding (floor
      every a i , then hand the R = B -\u2211 i \u230a a i \u230b leftover tokens
      to the passages with the largest fractional parts r i = a i - \u230a a i \u230b
      ) returns an exact minimizer of (8) .", "A Optimality of the Memory Allocation
      Rule\nProof. If some minimizer had m i -a i \u2265 1 , then, since the deviations
      sum to zero, some j has m j -a j < 0 ; moving one token from i to j changes
      the squared error by 2[( m j -a j ) -( m i -a i )] + 2 < 0 , a contradiction.
      Hence every optimal m i is \u230a a i \u230b or \u2308 a i \u2309 (which also
      gives nonnegativity). Writing m i = \u230a a i \u230b + \u03b4 i with \u03b4
      i \u2208 { 0 , 1 } and \u2211 i \u03b4 i = R , the objective becomes \u2211
      i r 2 i + \u2211 i \u03b4 i (1 -2 r i ) , minimized by placing the R ones on
      the largest remainders.", "Conclusion\nWe introduced AdaMem, a relevance-aware
      allocation framework for soft-compressed RAG. Instead of uniformly representing
      retained passages, AdaMem converts querydependent relevance scores into a non-uniform
      allocation of a fixed global memory budget, concentrating capacity on answer-bearing
      evidence while retaining limited capacity for complementary passages. The resulting
      allocation is the exact optimum of a proportional-fair objective under an assumed
      logarithmic utility model, and is a first-order approximation to the reverse-water-filling
      optimum of classical exponential-distortion bit allocation.\nFigure 6: Optimal
      allocation temperature on TriviaQA across compression rates. The analytically
      predicted schedule ( \u03c4 \u221d B ( \u03c1 ) , anchored at 16 \u00d7 ) follows
      the empirical optimum and consistently outperforms a fixed \u03c4 = 1 .\nAdaMem
      establishes a new state of the art among softcompression methods across six
      evaluated QA benchmarks. At 16 \u00d7 compression, it improves over baselines,
      the strongest prior soft-compression method, by an average of 3 . 4% in relative
      terms. The advantage becomes substantially larger as the memory budget decreases.
      At 64 \u00d7 compression, the average relative improvement reaches 14 . 6% ,
      with gains of up to 21 . 8% on HotpotQA. At 32 \u00d7 , AdaMem exceeds OSCAR
      at 16 \u00d7 on every benchmark, achieving an average relative improvement of
      2 . 9% . These results show that adaptive allocation is particularly effective
      under aggressive compression, where large retrieval pools must be represented
      within strict memory constraints.\nFinally, we introduce KILT-SCR, a training
      and evaluation resource for the joint study of reranking and compression. Constructed
      to retain answer-bearing retrieved evidence and answer-consistent teacher targets,
      it enables controlled comparison of reranking and memory-allocation strategies
      over large candidate pools with heterogeneous passage utility.\nSeveral future
      research directions remain open. The temperature could be learned or predicted
      per query rather than set per compression rate, allowing allocation sharpness
      to adapt to the confidence of the relevance estimates. The budget-allocation
      view itself is not specific to QA or memory embeddings and extends naturally
      to other bounded representations, such as KV-cache compression and long-context
      summarization.\nAllal, L. B.; Lozhkov, A.; Bakouch, E.; Bl\u00e1zquez, G. M.;
      Penedo, G.; Tunstall, L.; Marafioti, A.; Kydl\u00ed\u010dek, H.; Lajar\u00edn,
      A. P.; Srivastav, V.; Lochner, J.; Fahlgren, C.; Nguyen, X.-S.; Fourrier, C.;
      Burtenshaw, B.; Larcher, H.; Zhao, H.; Zakka, C.; Morlon, M.; Raffel, C.; von
      Werra, L.; and Wolf, T. 2025. SmolLM2: When Smol Goes Big - Data-Centric Training
      of a Small Language Model. arXiv:2502.02737.", "Query-Conditioned Compression
      and Adaptive Allocation. For each query-passage pair, we form\n<!-- formula-not-decoded
      -->\ntruncate it to 128 tokens, and append a fixed maximum number of <MEM> tokens
      and one <RERANK> token. A shared compressor C \u03d5 encodes x i once: the final-layer
      state of <RERANK> yields a relevance score,\n<!-- formula-not-decoded -->\nwhereas
      the states at the <MEM> positions form an ordered bank of candidate memory embeddings
      for passage d i (Figure 2a).\nGiven the scores of the K retrieved passages,
      we standardize them within the pool as \u0302 s i = ( s i -\u00af s ) / ( \u03c3
      s + \u03f5 ) and allocate a fixed global memory budget B according to\n<!--
      formula-not-decoded -->\nwhere \u03c4 > 0 controls allocation sharpness. We
      convert the fractional shares { a i } K i =1 into integer counts { m i } K i
      =1 using largest-remainder rounding, preserving \u2211 i m i = B ; passages
      with m i = 0 are omitted (Farber and Zeger 2006)\n(Figure 2b). We set B to the
      total number of embeddings assigned by a uniform length-based reference, where
      passage i would receive m (0) i = \u230a \u2113 i /\u03c1 \u230b +1 embeddings
      for truncated length \u2113 i and compression factor \u03c1 = 16 .\nFor each
      passage, we retain its first m i <MEM> states, project them into the decoder
      embedding space with a twolayer MLP, and concatenate the resulting variable-length
      sequences in decreasing relevance order. The decoder conditions on the query
      and these allocated memories to generate the answer (Figure 2c). We optimize
      the compressor and projection module in full, and adapt the decoder using rank-64
      LoRA modules in all linear layers ( \u03b1 = 128 , dropout 0 . 1 ); its token
      embeddings and language-modeling head are also updated.\nBudget-Allocation View.
      The allocation rule is not a heuristic. If the value of a passage grows logarithmically
      with its token count, the standard diminishing-returns model of resource allocation
      (Kelly, Maulloo, and Tan 1998), then B softmax( \u0302 s i /\u03c4 ) is the
