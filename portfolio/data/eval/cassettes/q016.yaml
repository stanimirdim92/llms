        Optimality of the Memory Allocation Rule\\nProof. If some minimizer had m
        i -a i \u2265 1 , then, since the deviations sum to zero, some j has m j -a
        j < 0 ; moving one token from i to j changes the squared error by 2[( m j
        -a j ) -( m i -a i )] + 2 < 0 , a contradiction. Hence every optimal m i is
        \u230A a i \u230B or \u2308 a i \u2309 (which also gives nonnegativity). Writing
        m i = \u230A a i \u230B + \u03B4 i with \u03B4 i \u2208 { 0 , 1 } and \u2211
        i \u03B4 i = R , the objective becomes \u2211 i r 2 i + \u2211 i \u03B4 i
        (1 -2 r i ) , minimized by placing the R ones on the largest remainders.\",\"metadata\":{\"ingestion_version\":\"01a0fc53885372038a1c6d0df171e569\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d-text-0022\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d\",\"chunk_type\":\"text\",\"section_path\":\"A
        Optimality of the Memory Allocation Rule\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":139,\"page_no\":10,\"filename\":\"2609.22100v1.pdf\"}}},{\"id\":\"45380e96-4930-5f31-a95b-90cdf950ed6c\",\"version\":7,\"score\":0.54893833,\"payload\":{\"page_content\":\"Conclusion\\nWe
        introduced AdaMem, a relevance-aware allocation framework for soft-compressed
        RAG. Instead of uniformly representing retained passages, AdaMem converts
        querydependent relevance scores into a non-uniform allocation of a fixed global
        memory budget, concentrating capacity on answer-bearing evidence while retaining
        limited capacity for complementary passages. The resulting allocation is the
        exact optimum of a proportional-fair objective under an assumed logarithmic
        utility model, and is a first-order approximation to the reverse-water-filling
        optimum of classical exponential-distortion bit allocation.\\nFigure 6: Optimal
        allocation temperature on TriviaQA across compression rates. The analytically
        predicted schedule ( \u03C4 \u221D B ( \u03C1 ) , anchored at 16 \xD7 ) follows
        the empirical optimum and consistently outperforms a fixed \u03C4 = 1 .\\nAdaMem
        establishes a new state of the art among softcompression methods across six
        evaluated QA benchmarks. At 16 \xD7 compression, it improves over baselines,
        the strongest prior soft-compression method, by an average of 3 . 4% in relative
        terms. The advantage becomes substantially larger as the memory budget decreases.
        At 64 \xD7 compression, the average relative improvement reaches 14 . 6% ,
        with gains of up to 21 . 8% on HotpotQA. At 32 \xD7 , AdaMem exceeds OSCAR
        at 16 \xD7 on every benchmark, achieving an average relative improvement of
        2 . 9% . These results show that adaptive allocation is particularly effective
        under aggressive compression, where large retrieval pools must be represented
        within strict memory constraints.\\nFinally, we introduce KILT-SCR, a training
        and evaluation resource for the joint study of reranking and compression.
        Constructed to retain answer-bearing retrieved evidence and answer-consistent
        teacher targets, it enables controlled comparison of reranking and memory-allocation
        strategies over large candidate pools with heterogeneous passage utility.\\nSeveral
        future research directions remain open. The temperature could be learned or
        predicted per query rather than set per compression rate, allowing allocation
        sharpness to adapt to the confidence of the relevance estimates. The budget-allocation
        view itself is not specific to QA or memory embeddings and extends naturally
        to other bounded representations, such as KV-cache compression and long-context
        summarization.\\nAllal, L. B.; Lozhkov, A.; Bakouch, E.; Bl\xE1zquez, G. M.;
        Penedo, G.; Tunstall, L.; Marafioti, A.; Kydl\xED\u010Dek, H.; Lajar\xEDn,
        A. P.; Srivastav, V.; Lochner, J.; Fahlgren, C.; Nguyen, X.-S.; Fourrier,
        C.; Burtenshaw, B.; Larcher, H.; Zhao, H.; Zakka, C.; Morlon, M.; Raffel,
        C.; von Werra, L.; and Wolf, T. 2025. SmolLM2: When Smol Goes Big - Data-Centric
        Training of a Small Language Model. arXiv:2502.02737.\",\"metadata\":{\"ingestion_version\":\"01a0fc53885372038a1c6d0df171e569\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d-text-0014\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d\",\"chunk_type\":\"text\",\"section_path\":\"Conclusion\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":80,\"page_no\":7,\"filename\":\"2609.22100v1.pdf\"}}},{\"id\":\"02d617fd-b0e2-52b2-a55e-f690c8b8df39\",\"version\":7,\"score\":0.5252092,\"payload\":{\"page_content\":\"Query-Conditioned
        Compression and Adaptive Allocation. For each query-passage pair, we form\\n<!--
        formula-not-decoded -->\\ntruncate it to 128 tokens, and append a fixed maximum
        number of <MEM> tokens and one <RERANK> token. A shared compressor C \u03D5
        encodes x i once: the final-layer state of <RERANK> yields a relevance score,\\n<!--
        formula-not-decoded -->\\nwhereas the states at the <MEM> positions form an
        ordered bank of candidate memory embeddings for passage d i (Figure 2a).\\nGiven
        the scores of the K retrieved passages, we standardize them within the pool
        as \u0302 s i = ( s i -\xAF s ) / ( \u03C3 s + \u03F5 ) and allocate a fixed
        global memory budget B according to\\n<!-- formula-not-decoded -->\\nwhere
        \u03C4 > 0 controls allocation sharpness. We convert the fractional shares
        { a i } K i =1 into integer counts { m i } K i =1 using largest-remainder
        rounding, preserving \u2211 i m i = B ; passages with m i = 0 are omitted
        (Farber and Zeger 2006)\\n(Figure 2b). We set B to the total number of embeddings
        assigned by a uniform length-based reference, where passage i would receive
        m (0) i = \u230A \u2113 i /\u03C1 \u230B +1 embeddings for truncated length
        \u2113 i and compression factor \u03C1 = 16 .\\nFor each passage, we retain
        its first m i <MEM> states, project them into the decoder embedding space
        with a twolayer MLP, and concatenate the resulting variable-length sequences
        in decreasing relevance order. The decoder conditions on the query and these
        allocated memories to generate the answer (Figure 2c). We optimize the compressor
        and projection module in full, and adapt the decoder using rank-64 LoRA modules
        in all linear layers ( \u03B1 = 128 , dropout 0 . 1 ); its token embeddings
        and language-modeling head are also updated.\\nBudget-Allocation View. The
        allocation rule is not a heuristic. If the value of a passage grows logarithmically
        with its token count, the standard diminishing-returns model of resource allocation
        (Kelly, Maulloo, and Tan 1998), then B softmax( \u0302 s i /\u03C4 ) is the
        exact optimal split of the budget for utilities w i = e \u0302 s i /\u03C4
        (Proposition 1, Appendix A). The temperature interpolates between the two
        strategies of prior work: \u03C4 \u2192 \u221E recovers the uniform split,
        \u03C4 \u2192 0 recovers rerank-and-truncate, and the integer rounding step
        supplies passage dropping. The classical exponentialdistortion model of bit
        allocation (Huang and Schultheiss 1963; Shoham and Gersho 1988) refines this
        picture with a quantitative prediction: the softmax rule matches its reverse
        water-filling optimum to first order precisely when\\n<!-- formula-not-decoded
        -->\",\"metadata\":{\"ingestion_version\":\"01a0fc53885372038a1c6d0df171e569\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d-text-0006\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d\",\"chunk_type\":\"text\",\"section_path\":\"Query-Conditioned
