        Inference Efficiency\\nTable 4 reports per-query latency, throughput, total
        compute, and peak GPU memory on TriviaQA with k = 25 retrieved passages, for
        all inference-time compression rates used in the main text.\\nAll compressed
        configurations are substantially cheaper than Full Context: latency drops
        by 3 . 5 \xD7 to 4 . 9 \xD7 and compute by 2 . 9 \xD7 to 5 . 0 \xD7 , confirming
        that soft compression removes the dominant cost of processing large retrieval
        pools. Relative to OSCAR at the same compression rate, AdaMem adds the cost
        of relevance scoring and of encoding the fixed candidate memory bank before
        selection. This overhead is confined to the compressor and does not grow with
        the decoder context, so its share shrinks as compression increases: from 36.3
        ms (23%) at 16 \xD7 to 10.0 ms (7%) at 64 \xD7 and 7.6 ms (6%) at 128 \xD7
        . Because the quality of AdaMem is nearly flat in the compression rate, it
        can be operated at aggressive compression where this overhead is smallest:
        at 64 \xD7 and 128 \xD7 , AdaMem matches or improves on OSCAR at 16 \xD7 in
        latency, throughput, and compute while providing higher answer quality. Peak
        memory remains moderately higher than OSCAR because the candidate bank for
        the full pool is encoded before allocation, yet at 64 \xD7 it is already below
        the Full Context footprint (44.4 versus 53.5 GB), and the gap narrows further
        with compression.\",\"metadata\":{\"ingestion_version\":\"01a0fc53885372038a1c6d0df171e569\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d-text-0023\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d\",\"chunk_type\":\"text\",\"section_path\":\"B
        Inference Efficiency\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":141,\"page_no\":10,\"filename\":\"2609.22100v1.pdf\"}}},{\"id\":\"935cda58-c1e2-5fda-8602-111b6ffb5827\",\"version\":7,\"score\":0.43152374,\"payload\":{\"page_content\":\"Related
        Work\\nPrior work on context compression follows two main paradigms: hard
        compression , which shortens retrieved text, and soft compression , which
        replaces it with continuous representations.\\nHard Compression. These methods
        retain the generator's textual interface by selecting or rewriting useful
        context. LLMLingua (Jiang et al. 2023b) uses perplexity-based token removal;
        LongLLMLingua (Jiang et al. 2024) adds query awareness; LLMLingua-2 (Pan et
        al. 2024) formulates compression as token classification. RECOMP (Xu, Shi,
        and Choi 2024) learns extractive and abstractive compressors optimized for
        downstream performance. Such methods are interpretable and model-agnostic,
        but their discrete outputs must be re-encoded per query, limiting compression
        rates.\\nSoft Compression. Soft compression maps text to continuous memory
        embeddings consumed directly by the generator. Gist tokens (Mu, Li, and Goodman
        2023), AutoCompressors (Chevalier et al. 2023), and In-Context Autoencoders
        (Ge et al. 2024) establish that LLMs can condition on latent representations.
        For RAG, xRAG (Cheng et al. 2024) projects a pre-computed embedding into generator
        space; 500xCompressor (Li, Su, and Collier 2025) demonstrates extreme compression;
        PISCO (Louis, D\xE9jean, and Clinchant 2025) trains a compressor via distillation.
        OSCAR (Louis et al. 2026) is most closely related: it performs online query-conditioned
        compression and jointly produces representations and relevance scores. However,
        as in most prior pipelines, relevance determines ordering or selection, while
        each retained passage receives the same fixed number of memory tokens. AdaMem
        instead distributes a fixed global budget non-uniformly according to estimated
        utility.\\nCapacity of Soft Memories. Kuratov et al. (2025) show a single
        vector can encode sequences at compression ratios approaching 1500 \xD7 ,
        and that compressibility depends more on resolvable uncertainty than raw length;
        we build on this observation but study how a fi xed capacity should be distributed
        across multiple passages rather than the ceiling of a single memory.\",\"metadata\":{\"ingestion_version\":\"01a0fc53885372038a1c6d0df171e569\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d-text-0004\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d\",\"chunk_type\":\"text\",\"section_path\":\"Related
        Work\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":17,\"page_no\":2,\"filename\":\"2609.22100v1.pdf\"}}},{\"id\":\"a0c166f0-1173-5173-9ab5-499d03def381\",\"version\":7,\"score\":0.42816073,\"payload\":{\"page_content\":\"This
        is a line chart comparing two methods for setting \\\"allocation temperature\\\"
        (\u03C4) against compression rate (x-axis, log scale: 16, 32, 64, 128). The
        blue solid line labeled \\\"Empirical optimum\\\" shows \u03C4 decreasing
        gradually from 1.0 at compression rate 16 to about 0.5 at rate 128, with match
        accuracy scores annotated at each point (84.00, 84.45, 83.90, 83.15). The
        orange dashed line labeled \\\"Theory: \u03C4 \u221D B(\u03C1) (anchored at
        16x)\\\" declines more steeply, from 1.0 at rate 16 to about 0.22 at rate
        128, with corresponding match scores (84.35, 83.35, 82.25). A gray dotted
        horizontal reference line marks \\\"Fixed \u03C4 = 1\\\" with a match score
        of 81.30 at compression rate 128, illustrating that both adaptive temperature
        approaches outperform a fixed temperature baseline at high compression rates.\",\"metadata\":{\"ingestion_version\":\"01a0fc53885372038a1c6d0df171e569\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d-fig-007-05\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d\",\"chunk_type\":\"figure\",\"section_path\":\"\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":81,\"page_no\":7,\"filename\":\"2609.22100v1.pdf\",\"image_path\":\"/var/www/html/personal/llms/portfolio/data/processed/01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d/figures/fig-007-05-af44834945b0ff05.png\"}}},{\"id\":\"b23e9f67-cdcc-54fe-a4f0-6c338b605762\",\"version\":7,\"score\":0.42342123,\"payload\":{\"page_content\":\"D
        Judge Metrics\\nWe use Substring Match as the primary metric because it is
        deterministic and consistent with standard open-domain QA evaluation. However,
        it can overestimate answer quality when a model lists multiple candidate answers:
        the prediction receives full credit whenever it contains a gold-answer alias
        as a substring, even if the response is ambiguous, unsupported, or includes
        incorrect alternatives. We therefore additionally report LLM-as-a-judge scores,
        which evaluate the correctness of the generated answer in the context of the
        question and reference answer. The judge assigns a score of 1 for a correct
        answer, 0.5 for a partially correct answer, and 0 for a wrong answer; we report
        the mean score as a percentage. This complementary evaluation penalizes answer
        enumeration and verifies that improvements in Match correspond to genuinely
        correct answers rather than increased lexical overlap with the reference.\\nTable
        5: Training schedule for the three-stage procedure.\\n\\nStage 1, Examples
        = 2,000,000. Stage 1, Epochs = 1. Stage 2, Examples = 500,000. Stage 2, Epochs
        = 1. Stage 3 (KILT-SCR), Examples = 196,916. Stage 3 (KILT-SCR), Epochs =
        3\\nFor each example, we provide the judge with the question, the reference
        answer, and the model prediction. We use the following prompt:\\nSystem prompt:
        You are an evaluation tool. Answer with one of: 1: Correct, 0.5: Partially
        correct, 0: Wrong.\\nUser prompt: Here is a question, a golden answer, and
        an AI-generated answer. Can you judge whether the AIgenerated answer is correct
        according to the question and golden answer? Simply answer with one of: 1:
        Correct, 0.5: Partially correct, 0: Wrong.\\nQuestion:\\n{question}\\nGolden
        answer:\\n{answer}\\nGenerated answer: {prediction}\\nFigure 7 corroborates
        the Match-based robustness trends. At the training-time compression rate of
        16 \xD7 , AdaMem matches or exceeds OSCAR across all three benchmarks, improving
        by 1.8 points on TriviaQA and 2.4 points on NQ, while the methods are effectively
        tied on HotpotQA. The advantage grows under stronger inference-time compression.
        At 64 \xD7 , AdaMem exceeds OSCAR by 6.1 points on TriviaQA and NQ, and by
        7.1 points on HotpotQA. In contrast to OSCAR, AdaMem remains stable as the
        memory budget shrinks: its judge score decreases by only 0.9, 3.3, and 1.4
        points from 16 \xD7 to 64 \xD7 on TriviaQA, NQ, and HotpotQA, respectively,
        compared with drops of 5.2, 7.0, and 8.7 points for OSCAR. These results show
        that relevance-aware allocation preserves answer-critical information under
        severe compression, rather than merely improving lexical overlap with reference
        answers.\",\"metadata\":{\"ingestion_version\":\"01a0fc53885372038a1c6d0df171e569\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d-text-0026\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d\",\"chunk_type\":\"text\",\"section_path\":\"D
        Judge Metrics\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":148,\"page_no\":11,\"filename\":\"2609.22100v1.pdf\"}}}]},\"status\":\"ok\",\"time\":0.001618823}"
