      rule, spreading the budget without regard to how useful each passage is for
      the query. We instead aim to distribute a fixed budget B according to query-specific
      utility, giving more memory embeddings to answer-bearing passages, fewer to
      marginal ones, and none to irrelevant ones, while keeping the total \u2211 i
      m i = B unchanged. This poses two coupled subproblems: estimating passage relevance,
