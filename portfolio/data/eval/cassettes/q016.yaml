      together with \u03C4 fi xes the utility parametrization w i = e \u0302 s i /\u03C4
      ; since the relevance head is distilled to standardized cross-encoder scores,
      the temperature selects how sharply the teacher's relevance scale is converted
      into an allocation.\\nExponential-distortion bit allocation. Classical bit allocation
