        Compression and Adaptive Allocation. For each query-passage pair, we form\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":37,\"page_no\":3,\"filename\":\"2609.22100v1.pdf\"}}},{\"id\":\"57f05910-479e-5c11-98c0-1c708dbcae78\",\"version\":7,\"score\":0.50198185,\"payload\":{\"page_content\":\"Method\\nProblem
        Setup. We consider RAG in which a query q is answered from a pool of K retrieved
        passages D = { d i } K i =1 (Figure 2a). Soft compression represents each
        passage d i by a short sequence of continuous memory embeddings that condition
        the decoder in its place. Writing m i for the number of memory embeddings
        assigned to passage i , the total B = \u2211 K i =1 m i is the memory budget
        that governs the decoder's context length, and hence the cost of generation.
        Existing soft-compression methods assign every retained passage the same m
        i , or set it by a length-based rule, spreading the budget without regard
        to how useful each passage is for the query. We instead aim to distribute
        a fixed budget B according to query-specific utility, giving more memory embeddings
        to answer-bearing passages, fewer to marginal ones, and none to irrelevant
        ones, while keeping the total \u2211 i m i = B unchanged. This poses two coupled
        subproblems: estimating passage relevance, and turning those estimates into
        an integer per-passage allocation of the budget. We next describe the shared
        compressor that produces passage memories and relevance scores in a single
        pass, the rule that converts these scores into a per-passage allocation, and
        the sense in which that rule is optimal (Figure 2).\\nFigure 2: Overview of
        AdaMem. (a) A shared compressor jointly produces passage memory representations
        and relevance scores. (b) The scores determine a query-dependent allocation
        of the fixed budget B via softmax and largest-remainder rounding. (c) The
        allocated memories are projected, ordered by relevance, and passed to a LoRA-adapted
        decoder for answer generation.\",\"metadata\":{\"ingestion_version\":\"01a0fc53885372038a1c6d0df171e569\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d-text-0005\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d\",\"chunk_type\":\"text\",\"section_path\":\"Method\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":22,\"page_no\":2,\"filename\":\"2609.22100v1.pdf\"}}},{\"id\":\"3f258ab2-78e2-5e34-909f-e9c9f7f11e60\",\"version\":7,\"score\":0.4928859,\"payload\":{\"page_content\":\"Introduction\\nMotivated
        by these limitations, we propose AdaMem , a framework that transforms reranking
        from binary selection into relevance-aware memory allocation. A shared compressor
        produces query-conditioned memories and scores; a principled softmax allocation,
        grounded in logarithmic utility theory, distributes a fixed total memory budget
        across passages according to their estimated utility. The temperature interpolates
        between uniform allocation and hard topk selection. Here are our main contributions:\\n-
        We introduce relevance-aware memory allocation for soft-compressed RAG: each
        document receives an adaptive memory budget determined by its estimated relevance
        (Figure 1), concentrating capacity on answer-bearing evidence while preserving
        compact representations for complementary context. This adaptivity makes AdaMem
        substantially more robust to extreme compression: between 16 \xD7 and 128
        \xD7 its quality degrades by only about 2%, compared with over 7% for uniform-allocation
        baselines such as OSCAR.\\n- Across six open-domain QA benchmarks, AdaMem
        outperforms every evaluated compression baseline at matched budgets: at 16
        \xD7 it improves over uniform allocation by 3 . 4% on average (up to 5 . 5%
        ) and over the strongest hard-compression baseline by 9 . 7% despite an 8
        \xD7 smaller context. Quality is also more stable under inference-time compression:
        moving from 16 \xD7 to 64 \xD7 costs AdaMem 2 . 8% on average, against 12
        . 2% for uniform allocation. At different compression rates, AdaMem retains
        up to 99% of full-context quality at 4 \xD7 lower latency.\\n- We release
        KILT-SCR (Soft Compression and Reranking), a large-candidate-pool resource
        for reranking and context compression, with 25 passages per query, 196,916\\ntraining
        instances, and evaluation data from six QA benchmarks. The training split
        use answer-grounded filtration to ensure supporting retrieved evidence and
        goldconsistent generated targets.\",\"metadata\":{\"ingestion_version\":\"01a0fc53885372038a1c6d0df171e569\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d-text-0003\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d\",\"chunk_type\":\"text\",\"section_path\":\"Introduction\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":11,\"page_no\":2,\"filename\":\"2609.22100v1.pdf\"}}},{\"id\":\"77674a6f-06f1-5b06-94ec-150e08ac9b37\",\"version\":7,\"score\":0.49212182,\"payload\":{\"page_content\":\"This
        is a schematic diagram illustrating the \\\"AdaMem\\\" adaptive memory compression
        method for retrieval-augmented language models, shown in three panels. Panel
        (a) depicts a shared compressor network that takes query-document pairs (d1\u2013d4)
        and outputs relevance scores (ranging from 2.1 to -1.9). Panel (b) shows the
        adaptive budget allocation formula (using softmax over relevance scores divided
        by temperature \u03C4) that distributes a fixed total memory budget (B=32
        tokens) unevenly across documents based on relevance (m1=17, m2=9, m3=6, m4=0),
        contrasted with a uniform allocation baseline (8 tokens each). Panel (c) illustrates
        the decoder stage, where allocated memory tokens are fed into a LoRA-adapted
        Mistral-7B model to generate an answer, demonstrating that AdaMem's adaptive
        allocation produces the correct answer (\\\"Kazuo Ishiguro\\\") while uniform
        budget allocation yields an incorrect answer (\\\"Frederick Forsyth\\\").\",\"metadata\":{\"ingestion_version\":\"01a0fc53885372038a1c6d0df171e569\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d-fig-003-01\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d\",\"chunk_type\":\"figure\",\"section_path\":\"\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":23,\"page_no\":3,\"filename\":\"2609.22100v1.pdf\",\"image_path\":\"/var/www/html/personal/llms/portfolio/data/processed/01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d/figures/fig-003-01-1653e717a9d6e576.png\"}}},{\"id\":\"09d71dcc-3870-588d-8449-c5583e657121\",\"version\":7,\"score\":0.490916,\"payload\":{\"page_content\":\"Experiments
        and Results\\nFinally, at 16 \xD7 , AdaMem closely approaches Full Context
        performance despite replacing the retrieved text with a substantially shorter
        continuous representation. On TriviaQA, it is within 0.4 points of Full Context,
        while on PopQA it exceeds Full Context by 1.4 points. Hence, selective memory
        allocation can both reduce computational cost and mitigate interference from
        irrelevant retrieved passages.\\nFigure 4: Memory-token allocation by document
        relevance rank at 64 \xD7 compression. The dashed line denotes OSCAR's fixed
        16 \xD7 allocation.\\nMemory Allocation Behavior. Figure 4 illustrates the
        allocation mechanism under this highly constrained 64 \xD7 setting. For the
        most relevant documents, AdaMem allocates a median of roughly 10 memory tokens,
        already exceeding OSCAR's fixed budget of 9 tokens per document at 16 \xD7
        . The 90th percentile is substantially higher, indicating that for some queries,
        AdaMem assigns considerably more capacity to the most relevant document. In
        contrast, the allocation decreases sharply with relevance rank and approaches
        zero for lower-ranked documents. Thus, AdaMem concentrates capacity on query-relevant
        evidence while assigning minimal capacity to noisy passages, reducing their
        potential interference in the compressed context.\\nRobustness to Retrieval
        Depth and Compression. Figure 3 compares AdaMem and OSCAR across retrieval
        depths k \u2208 { 5 , 10 , 15 , 20 , 25 } and compression ratios of 16 \xD7
        , 32 \xD7 , and 64 \xD7 at \u03C4 =1. AdaMem benefits more consistently from
        deeper retrieval, whereas OSCAR remains nearly constant as additional lower-ranked
        documents are introduced.\\nThis difference is most pronounced under aggressive
        compression. At 64 \xD7 , increasing k from 5 to 25 improves AdaMem by 3.5
        points on TriviaQA, 5.4 on Natural Questions, and 4.2 on HotpotQA, while OSCAR
        changes only marginally over the same range. A similar pattern holds at 32
        \xD7 , particularly on Natural Questions and HotpotQA.\\nThese results suggest
        that AdaMem can extract useful evidence from less-relevant documents without
        allocating them the same budget as highly relevant ones. In contrast, OSCAR's
        fixed per-document allocation provides limited benefit from deeper retrieval,
        as its representation capacity is uniformly spread over an increasingly noisy
        document set. The effect is weaker at 16 \xD7 , where both methods have sufficient
        capacity for shallow retrieval pools, but becomes increasingly clear as the
        memory budget is reduced.\\nFigure 5: Quality-latency tradeoff on TriviaQA.
        AdaMem shows similar latency as OSCAR and matches Full Context quality at
        4 . 0 \xD7 lower latency.\",\"metadata\":{\"ingestion_version\":\"01a0fc53885372038a1c6d0df171e569\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d-text-0011\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d\",\"chunk_type\":\"text\",\"section_path\":\"Experiments
