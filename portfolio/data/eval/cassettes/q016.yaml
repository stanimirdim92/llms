      (text, page 3)\",\"citations\":{\"enabled\":true}},{\"type\":\"document\",\"source\":{\"type\":\"text\",\"media_type\":\"text/plain\",\"data\":\"Conclusion\\nWe
      introduced AdaMem, a relevance-aware allocation framework for soft-compressed
      RAG. Instead of uniformly representing retained passages, AdaMem converts querydependent
      relevance scores into a non-uniform allocation of a fixed global memory budget,
      concentrating capacity on answer-bearing evidence while retaining limited capacity
      for complementary passages. The resulting allocation is the exact optimum of
      a proportional-fair objective under an assumed logarithmic utility model, and
      is a first-order approximation to the reverse-water-filling optimum of classical
      exponential-distortion bit allocation.\\nFigure 6: Optimal allocation temperature
      on TriviaQA across compression rates. The analytically predicted schedule (
      \u03C4 \u221D B ( \u03C1 ) , anchored at 16 \xD7 ) follows the empirical optimum
      and consistently outperforms a fixed \u03C4 = 1 .\\nAdaMem establishes a new
      state of the art among softcompression methods across six evaluated QA benchmarks.
      At 16 \xD7 compression, it improves over baselines, the strongest prior soft-compression
      method, by an average of 3 . 4% in relative terms. The advantage becomes substantially
