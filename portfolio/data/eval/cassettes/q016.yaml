      the softmax rule matches its reverse water-filling optimum to first order precisely
      when\n<!-- formula-not-decoded -->", "Query-Conditioned Compression and Adaptive
      Allocation. For each query-passage pair, we form\nwhere \u03b3 is the distortion
      decay rate and \u03c3 the spread of the log-utilities (Appendix A).The optimal
