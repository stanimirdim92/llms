      a large-candidate-pool resource for reranking and context compression, with
      25 passages per query, 196,916\ntraining instances, and evaluation data from
      six QA benchmarks. The training split use answer-grounded filtration to ensure
      supporting retrieved evidence and goldconsistent generated targets.", "This
      is a schematic diagram illustrating the \"AdaMem\" adaptive memory compression
      method for retrieval-augmented language models, shown in three panels. Panel
      (a) depicts a shared compressor network that takes query-document pairs (d1\u2013d4)
      and outputs relevance scores (ranging from 2.1 to -1.9). Panel (b) shows the
