      10)\",\"citations\":{\"enabled\":true}},{\"type\":\"document\",\"source\":{\"type\":\"text\",\"media_type\":\"text/plain\",\"data\":\"A
      Optimality of the Memory Allocation Rule\\nThree remarks follow. First, by the
      Gibbs variational principle, p = softmax( \u0302 s/\u03C4 ) is also the unique
      maximizer of \u2211 i p i \u0302 s i + \u03C4H ( p ) over the probability simplex,
      where H denotes the Shannon entropy: the allocation maximizes the total relevance
      of the allocated tokens under an entropy penalty on over-concentration, and
