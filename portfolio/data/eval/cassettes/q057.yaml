      |\n| T24  | Q      | LL       | F - D  | P g        | - 0 . 042 | [ - 0 . 095
      , +0 . 011]  | 0.6299 | 100 |  84 |", "4.2 Implementation Details\nWe conduct
      experiments using Qwen3-VL-4BInstruct and Qwen3-VL-8B-Instruct (Bai et al.,\n",
      "4 Experimental Setup\nLeakage drove the dataset choice. NQ is where the original
      probe ran, so we keep it for comparability, but Search-R1 trained on NQ''s training
      split and we say so plainly. QAMPARI, HAGRID, and RAGTruth were not used to
      train any of the three agents, so on those datasets no gap can be waved away
      as familiarity with the data. They also sidestep a retrieval quirk in NQ: for
      186 of 499 NQquestions (37.3%), all five passages come from one document, which
      leaves the model almost no choice about what to cite. The other three datasets
      have no such questions.\nPrompt and generation. One prompt does all the work,
      byte-identical across models and across the clean and doctored runs. It tells
      the model to answer using only the numbered passages, to close every sentence
      with exactly one citation such as [2], and to reply ''I don''t know'' when the
      passages fall short. Decoding is greedy, capped at 300 new tokens. When any
      sentence of an answer breaks the one-citation rule we drop the whole answer
      rather than salvage the compliant half, because a partly rescued answer reintroduces
      the claim-to-citation ambiguity the format exists to prevent. Models differ
      sharply in how often they abstain, from 15% to 52% of questions; Appendix C
      takes that apart. The full prompt is in Appendix A.\nReading our numbers. Three
      statistical choices shape every result, and each has a plain reason behind it.\nWe
      resample questions, not claims. A single question yields up to seven claims
      that share one context and one generated answer, so treating claims as independent
      would make our intervals look tighter than they are. We use a cluster bootstrap
      instead: draw whole questions with replacement 2,000 times, recompute the planted
      and control conditions on the same draw so the pairing survives, and read off
      the 2.5th and 97.5th percentiles. Every 95% confidence interval in this paper
      is that band, the range of effects our data are consistent with.\nWe compare
      each agent against its own base. Post-rationalization is common in the baseline,
      so reporting that an agent post-rationalizes tells us nothing about RL. The
      question is whether an agent diverges from the model it was trained from. That
      calls for a difference-in-differences: take the plantversus-control difference
      within a model (Equation 1), then difference those differences across models,\n<!--
      formula-not-decoded -->\nNegative says RLVR made citations more faithful, positive
      says it made them worse, and zero says training left this behavior alone. Within
      each dataset we test all three agents against the baseline and correct the three
      comparisons with the Holm method, so that running three tests does not manufacture
      a significant one.", "C Second-Evaluator Sensitivity Audit\nInference and diagnostics.
      The separate 24-test family uses pointwise 95% bootstrap intervals and two-sided
      randomization tests, each with 10,000 replicates and seed 13, question resampling
      on ASQA and paper clustering on QASPER, with question-weighted means and Holm
      adjustment. The original 148-test analysis is unchanged. Tables 11-12 report
      precision means and all planned contrasts. All 16 emitted-grounded gaps remain
      positive after adjustment; the eight cross-evaluator precision differences remain
      unresolved, which does not establish equivalence. ECR and other budgets are
      outside this audit.\nThe run scored 6,015 unique pairs in 419 seconds of model
      inference (430 seconds including bookkeeping; setup and excluded attempts are
      additional). Four inputs required truncation, with maximum pre-truncation length
      47,440 tokens. After normalization, 122 pairs (2.03%) produced nonbinary strings,
      including 103 empty strings; assigning zero does not establish reliable nonentailment.
      These are pair counts, not fractions of questions affected; the full histogram
      accompanies the cache. Recovery can disagree substantially: QASPER LLMLingua-2
      has 50.3% agreement over 1,000 candidate decisions and mean recovery rates of
      0.84 for DeBERTa versus 0.38 for TRUE. These descriptive results support sensitivity
      analysis, not accuracy against human judgments.\n", "4 Experimental Setup\nTable
      2: Models (top) and datasets (bottom). All four models share the Qwen2.5-7B-Instruct
      base. Passages is the number of roughly 100-token chunks in each retrieval index.\n\nBaseline,
      Training on top of the base = none (Qwen2.5-7B-Instruct). Search-R1, Training
      on top of the base = RLVR with PPO. ReSearch, Training on top of the base =
      RLVR with GRPO. R-Search, Training on top of the base = RLVR with GRPO\nNQ,
      Questions = 499. NQ, Passages = 40,791. NQ, Source = Wikipedia. QAMPARI, Questions
      = 500. QAMPARI, Passages = 44,879. QAMPARI, Source = Wikipedia. HAGRID, Questions
      = 500. HAGRID, Passages = 8,986. HAGRID, Source = Wikipedia. RAGTruth, Questions
      = 500. RAGTruth, Passages = 6,981. RAGTruth, Source = Web\nModels. Our comparison
      rests on a single design choice: every model in Table 2 starts from the same
      weights. The baseline is Qwen2.5-7BInstruct (Qwen Team, 2024); Search-R1 (Jin
      et al., 2025), ReSearch (Chen et al., 2025), and R-Search (Zhao et al., 2025)
      are open-weight agents trained from that exact checkpoint with RLVR. Whatever
      separates an agent from the baseline is therefore training, not architecture,
      tokenizer, or pretraining data.\nFixed-context evaluation. We disable agentinitiated
      retrieval and give every model the same five passages retrieved externally with
      BM25. This is an intentional control: our question is whether RLVR-trained agents
      differ in citation attribution when the available evidence is held constant.
      Allowing agents to retrieve would introduce differences in search policy and
      evidence selection, making those effects inseparable from citation behavior.\nDatasets.
      We use four question-answering datasets: NQ from KILT (Petroni et al., 2021;
      Kwiatkowski et al., 2019), QAMPARI from ALCE (Gao et al., 2023; Amouyal et al.,
      2023), HA- GRID (Kamalloo et al., 2023), and the questionanswering portion of
