    body: '{"query": "What did it cost in dollars to run these experiments?", "documents":
      ["4 Experimental Setup\nWe know what size of effect we could have caught. Our
      sample sizes give 80% power to detect a difference of roughly 7 percentage points
      (pp). Plainly: had RLVR moved post-rationalization by 7pp or more in either
      direction, this design would almost certainly have caught it. Shifts of a couple
      of points stay inside our blind spot, which is why we report a bounded null
      rather than a flat absence of effect. We fixed the primary outcome and the family
      of corrected comparisons in writing before the scorer ran.\nCompute. Everything
      ran on Kaggle''s free tier, two T4s or a single P100 per session: 48 GPU jobs
      yielding 36,690 scored records across four models, four datasets, three variants,
      and both conditions. The original study used a 104B model; the controlled version
      of the same measurement fits on hardware anyone can get for free, and that is
      the part we would most like other groups to borrow.", "6 Discussion\nHow to
      read the R-Search result. R-Search sits above its base on all four datasets
      and significantly above on the best-powered one, which is a real and consistent
      pattern. It is also one model, one base, one prompt, and one scorer, so four
      datasets are not four independent replications, and the effect softens under
      a stricter variant and a looser outcome. Two things would settle it: a cross-dataset
      test declared in advance, and an arm fine-tuned on the same data without RL,
      which would separate the contribution of RL from the contribution of fine-tuning
      on retrieval data at all.\nA note on cost. Everything here, four models, four
      datasets, three variants, both conditions, and the control that makes the comparison
      interpretable, ran on Kaggle''s T4 GPUs. Careful measurement was the cheap part
      of this project. The expensive part was reading the construction code closely
      enough to know which controls we did not have to run.", "E. Experimental Design\nThe
      evaluation set contains 49 fact-checking queries, of which 37 are distinct,
      spanning locations, dates and counts, yes/no claims, and people. Ten information-rich
      passages covering the queried facts were added to the index because raw FEVER
      evidence sentences are often too terse to support a full answer. Crossing the
      query set with three strategies and four poisoning levels yields 49 \u00d7 3
      \u00d7 4 = 588 runs, each producing a clean and a poisoned answer for 1 , 176
      generations in total. Because a full sweep takes roughly a day on CPU, results
      are written to disk after every run and a checkpoint records completed cells,
      so an interrupted sweep resumes without repeating work.", "| Dataset   | Planted   |
      Control   |   Attr. | 95% CI       |\n|-----------|-----------|-----------|---------|--------------|\n|
      NQ        | 9/69      | 0/69      |   +13.0 | [5.5, 22.5]  |\n| QAMPARI   |
      16/123    | 0/123     |   +13.0 | [7.3, 19.7]  |\n| HAGRID    | 12/61     |
      0/61      |   +19.7 | [10.8, 31.3] |\n| RAGTruth  | 67/623    | 1/623     |   +10.6
      | [7.9, 13.5]  |", "3.4 Models\nWe consider five open-source LLMs in the current
      study: Gemma-3-12B-It, Llama-3.1-8BInstruct, Ministral-3-8B-Instruct, Qwen-2.5-7BInstruct,
      and Phi-4-14B. Each model was prompted with the unsafe query and allowed to
      generate a maximum of 1024 new tokens. All experiments were run on an academic
      research cluster with H100 GPUs. We did not test any commercial models because
      the questions in our benchmark would violate the terms of service of the APIs.",
      "A.2 Safety evaluation details\nEach example in the balanced subset is expanded
      into four evaluation conditions: non_rag , rag_oracle_unsafe , rag_topic_safe
      , and rag_control_safe_random . Since the balanced subset contains 346 examples,
      this expansion produces 1,384 example-condition rows per model and 6,920 total
      responses across the five evaluated models.\nThe benchmark controls retrieval
      quality by directly supplying context documents, rather than relying on a live
      retriever to discover them at inference time. This is important because a poor
      retriever could otherwise fail to retrieve the relevant harmful document and
      artificially inflate apparent safety.\nThe non_rag condition supplies no documents
      for all 346 examples. The rag_oracle_unsafe condition supplies one document
      for all 346 examples. The rag_topic_safe condition supplies three documents
      for 344 examples and two documents for two examples. The rag_control_safe_random
      condition supplies three documents for 321 examples, two documents for 24 examples,
      and one document for one example.\nIn the final evaluation configuration, context
      is supplied as cleaned full-article-prefix text with a per-document cap of approximately
      12,000 characters. Section-level metadata are retained for provenance and auditing.\nThe
      response-generation templates are intentionally simple. In the non_rag condition,
      the model is instructed to answer using only its own knowledge. In the three
      RAG conditions, the model is instructed to answer using only the provided documents,
      with each supplied context labeled sequentially as Context 1 , Context 2 , etc.\nAll
      model responses were generated deterministically with temperature = 0 . 0 ,
      topp = 1 . 0 , and sampling disabled. We used a maximum of 1,024 newly generated
      tokens per response and a fixed run seed of 42. For RAG conditions, each cleaned
      retrieved-document prefix was capped at 12,000 characters. The same prompt template
      and decoding settings were used across all four conditions for a given model.\nAll
      experiments were run on an academic research cluster with NVIDIA H100 GPUs.
      Compute requirements varied by model size, context length, and response length.
      The five-model evaluation required approximately 74 GPU-hours in total, including
      response generation and local safety judging. The released configurations and
      run manifests provide the information needed to reproduce the evaluation.",
