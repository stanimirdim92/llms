      "C Hardware Settings\nAll experiments were conducted on a single node with eight
      NVIDIA A100-SXM4 GPUs (80GB each). We used bfloat16 , FlashAttention-2, and
      PyTorch distributed training via Accelerate and DeepSpeed with data parallelism.
      Pre-training used four GPUs with an effective batch size of 1,024, while both
      fine-tuning stages used eight GPUs with effective batch sizes of 512. Evaluation
      was distributed across eight GPUs, whereas latency and throughput were measured
      on a single A100 GPU.", "6 Analysis\nEvidence selection under pressure. The
      declared-evidence panel of Figure 2 shows increasing F1 for extraction and ECR
      as budgets tighten, from about 0.09 to 0.18 and 0.17, respectively. Each adjacent
      increase is supported ( p H = 0 . 0148 ). Reranking''s F1 means decrease from
      0.07 to 0.06, 0.04, and 0.03; the first two decreases have p H = 0 . 0148 ,
      but the final difference is unresolved ( p H = 1 ). These are evidence-F1 results,
      not evidence-precision estimates or a controlled test of selection granularity.",
      "6 Analysis\nRe-attribution varies across no-provenance methods. The re-attribution
      rate measures whether at least one candidate source snippet passes the NLI entailment
      threshold for a unit without declared provenance. On ASQA, RECOMP''s rates are
      0.41, 0.41, 0.42, and 0.39 across nominal budgets 0.5 through 0.05, excluding
      examples without summary units. Averaged over these examples, roughly three-fifths
      of its units have no passing candidate; this does not establish that the source
      contains no supporting evidence. LLMLingua-2''s ASQA rate means decrease from
      0.56 to 0.40, 0.25, and 0.20 as budgets tighten; the first two adjacent decreases
      have p H = 0 . 0148 , while the final decrease is unresolved ( p H = 0 . 242
      ). Recovery coverage depends on method, budget, and dataset as well as the search
      and evaluator; these observations provide no universal ceiling on recoverable
      support.\nTable 2: Mean input tokens on 944 ASQA questions at nominal budget
      0.25 (identity: full context). Total includes generator and declared-span verification
      input; compression, output, and recovery are excluded.\n\nIdentity, Gen. in
