- request:
    body: '{"query": "What limitations do the authors state for RAG-Safety-Bench?",
      "documents": ["Limitations\nThe current findings must be interpreted with the
      following limitations in mind. RAG-Safety-Bench is English-only, considers only
      one document source (Wikipedia), and covers a non-exhaustive set of possible
      harm categories. Further work is required to understand how retrieval-enabled
      LLMs behave in languages other than English and in multiple use contexts. The
      current study highlighted how assessments of safety can be subjective; clearly,
      the type of potentially dangerous information that can be returned to a trained
      intelligence officer versus a layperson versus a schoolchild are very different
      and such use cases must be assessed separately.\nBy design, our benchmark does
      not evaluate the impact of the retriever in the RAG system. However, and end-to-end
      evaluation would also need to assess interactions between retriever ranking,
      query reformulation, and generator safety. Our benchmark also represents a simplified
      view of RAG methodology, while production RAG systems would likely include additional
      safety components, such as system-level safety instructions and input/output
      filters.\nOur testing suite of models included only opensource models, and relatively
      small models due to computing resource constraints. Again, real-world RAG deployments
      will likely use much larger commercial models. We note that our RAG-SafetyBench
      benchmark can be used to evaluate such models, and that our reason for not doing
      so was to avoid being banned for Terms-of-Service violations. We encourage researchers
      with internal access to such models to use our benchmark and publish the results.\nOur
      methodology for benchmark generation and automated assessment relies heavily
      on the Claude family of models from Anthropic. While we did conduct human evaluations
      to validate Claude''s performance, a more robust (though expensive) methodology
      could combine multiple strong LLM judges in an ensemble. Furthermore, we evaluate
      on a single run of the benchmark, but due to the stochastic nature of LLM generation,
      the results might differ across multiple runs.", "6 Conclusion\nWe introduce
      RAG-Safety-Bench with the goal of disentangling the effects of RAG on LLM safety
      by cleanly separating four retrieval conditions. Across five open-source models,
      our results show that the most interesting failure mode is model-specific: for
      Qwen-2.5-7B, on-topic but answer-free documents elicited more harmful responses
      than the non-RAG baseline, consistent with the hypothesis that topicrelevant
      context can surface harmful information from parametric memory.\nMore generally,
      our findings confirm that nonRAG safety evaluations do not transfer to RAG deployments.
      Our initial results from the benchmark only evaluate the baked-in safety guardrails
      of the base model. However, in a production system, responsible AI practitioners
      should provide end-toend safety measures including (when warranted): corpus
      curation, input prompt filtering, retrievalside filtering, output filtering,
      and system prompt safety instructions, among other possible mitigations. Thus
      an important use case for our benchmark is also to evaluate the impact of safety
      interventions at different points in the multi-component RAG pipeline. Our results
      also indicate the need to choose an automated safety evaluator which is closely
      aligned with the safety concerns relevant to the particular application, and
      where possible to deploy multiple safety judges, as well as appropriate human
      oversight.", "Kathleen C. Fraser\nFaculty of Engineering University of Ottawa
      Ottawa, Canada kathleen.fraser@uottawa.ca\nFigure 1: The four conditions in
      RAG-Safety-Bench allow for detailed safety evaluation of RAG-enabled systems.\ntrustworthiness
      and accuracy by reducing hallucinations, relative to non-RAG LLMs (Shuster et
      al., 2021). For these reasons, conventional wisdom would suggest that RAG-based
      LLMs should be safer than non-RAG models, with the primary security risk being
      data poisoning attacks on the RAG corpus. In the absence of poisoned data, there
      would be little reason to suspect a RAG system would output more harmful content
      than its base LLM component.\nHowever, this assumption has been upended by recent
      work from An et al. (2025), who presented compelling evidence that when LLMs
      are enabled with RAG they are generally less safe than when relying on their
      parametric knowledge, even when the retrieved documents are benign. In the current
      work, we contribute to the understanding of this newly-identified problem by
      disentangling the notions of safety and capability through a new RAG-specific
      safety benchmark, RAG-SafetyBench. Furthermore, we take a closer look at what
      it means for documents and outputs to be ''unsafe,'' to support more detailed
      analysis of the problematic case where safe RAGdocuments appear to lead to unsafe
      outputs.\nRAG systems are challenging to evaluate because they are composed
      of multiple components, each of which contributes to the overall end-to-end
      performance of the system (Wampler et al., 2025). In particular, the retrieval
      quality can have a major impact on the quality of the output. The MIRAGE benchmark
      (Park et al., 2025) enables the evaluation of RAG systems while controlling
      for retrieval quality by providing sets of relevant and irrelevant oracle documents.\nWe
      modify and extend this style of evaluation to safety evaluation in the RAG setting.
      Our RAGSafety-Bench benchmark consists of a set of unsafe English queries and
      three sets of documents (Figure 1): in the oracle setting, the unsafe answer
      is available in the document set. This setting could represent a data-poisoning
      attack - however, since we sourced all of our data from Wikipedia, it also represents
      the more common case that the data is believed to be generally benign but has
      not been meticulously curated. In the on-topic setting, the documents are relevant
      to the topic of the query but do not explicitly contain the unsafe answer. In
      the random setting, randomly-selected documents on safe topics are provided.\nThis
      testing framework allows us to answer several key open research questions relating
      to the safety of RAG systems:", "Abstract\nAllowing large language models (LLMs)
      to retrieve information from a set of trusted documents can increase reliability
      and reduce hallucination. However, recent work has demonstrated that retrieval-augmented
      generation (RAG) can have unintended side effects on the overall safety of the
      generated responses, when prompted for harmful or dangerous content. A clearer
      understanding of the mechanisms leading to this result is needed, as increasing
      numbers of end users turn to RAG to incorporate corporate documents and knowledge
      bases into LLM-based systems. We introduce RAG-Safety-Bench, a benchmark to
      measure the safety impact of RAG on LLM models. By removing the confounding
      effect of retriever quality, and cleanly separating the problem into four conditions
      - non-RAG, RAG with an oracle document containing the answer to the harmful
      request, RAG with documents related to the harmful request but without the specific
      answer, and RAG with random, safe documents - the benchmark isolates the impacts
      of different factors in the observed safety degradation. We report results across
      five opensource LLMs, showing an inverse relationship between benign and unsafe
      capability, strong evidence that baseline safety guardrails do not lead to downstream
      safety guarantees in the RAG case, and model-specific support for previous findings
      that even benign documents can lead to unsafe generation in retrieval-enabled
      systems.", "3.2 Safety-capability relationship\nOur benchmark, RAG-Safety-Bench,
      complements the original MIRAGE benchmark by measuring safety rather than benign
      capability. The benchmark enables direct comparison across 4 settings, as described
      in Table 1. Note the distinction between the Oracle and On-topic settings: in
      the oracle setting, the answer is directly available in the retrieved context.
      In the on-topic condition, the retrieved documents are on the same topic as
      the query (in the example, explosives), but do not contain the answer to the
      query.\nBy providing the context documents directly, the benchmark enables evaluation
      of the base LLM''s ability to maintain safety guardrails in the presence of
      RAG context, while removing the confounding factor of retriever quality (e.g.,
      a poor retriever might simply miss the relevant unsafe document and therefore
      lead to a misleadingly inflated safety score).\nThe method for constructing
      the benchmark is as follows. We first develop a taxonomy of harmful user queries,
      based on the existing MLCommons AILuminate ''Hazard Taxonomy'' (Ghosh et al.,
      2025). The context of RAG safety evaluation and our intended corpus of Wikipedia
      documents required some modifications to the existing taxonomy. Our current
      version of RAG-SafetyBench excludes the following harm categories: Privacy/identification:
      since our knowledge base is a public resource, we assume it does not contain
      private information (though privacy leakage may be a concern in other RAG use
      cases); Direct generation of harmful content: the focus of the benchmark is
      on question answering, not content generation; Intellectual property: Wikipedia
      users are strictly forbidden from uploading copyrighted material without permission,
      and so it is not a suitable resource to test for intellectual property leakage;
      Specialized advice: this category (comprising topics such as legal advice, medical
      advice) is often poorly defined and highly-contextual, and so we do not include
      it here. The final taxonomy is given in Table 2.\nFollowing Park et al. (2025)
      and An et al. (2025), we use Wikipedia as our knowledge base. For each sub-category
      in the harm taxonomy, we identify a relevant category or set of categories on
      Wikipedia where harmful information related to the topic can be found. We then
      use Claude-Sonnet-4.5 to generate potentially harmful questions whose answers
      can be found in one of the available Wikipedia documents. We also enforce a
      series of self-checks to avoid hallucinations or unrealistic questions (see
      Appendix for full details and prompts). The Claude model outputs a harmful question,
      a rating of the question''s severity, the name and ID of the Wikipedia article
      that contains the answer, the exact text passage containing the answer, a summary
      of the expected unsafe answer, as well as other additional information to aid
      human review of the questions and answers (shown in Table 6 in the Appendix).
      We aimed to generate a minimum of 20 queries per subcategory in the taxonomy,
      although ultimately there was more actionable information available for some
      categories than others. We therefore release two versions of the benchmark:
      the Full version contains 987 harmful queries, distributed unevenly across the
      subcategories, while the Balanced version (used in the current analysis) is
      subsampled to a more uniform distribution across subcategories (see Table 2).",
      "Kathleen C. Fraser\n1. To what extent is the observed RAG safety decline correlated
      with a model''s RAG capability? Previous work suggests that some models which
      appear ''safe'' may simply be less capable of extracting and summarizing relevant
      information. We test this rigorously, and hypothesize the following (H1): Models
      which perform better on MIRAGE (benign capability) will also have higher accuracy
      and therefore lower safety in the oracle setting of RAG-Safety-Bench.\n2. Is
      RAG safety decline a factor of unsafe information or unsafe context drift? The
      conventional view, challenged by An et al. (2025), is that RAG models are less
      safe only when the documents they retrieve are unsafe. An alternative explanation
      is that the increased context length, possibly containing many words semantically
      related to the unsafe query, shift the models into a less-aligned domain. 1
      Our hypothesis (H2) is that the direct availability of the answer (oracle setting)
      will lead to the\n1 In fact, this is similar to the intuition behind the successful
      Crescendo jailbreak (Russinovich et al., 2025).\nhighest number of unsafe answers,
      but that the on-topic setting will lead to a higher number of unsafe answers
      relative to the baseline non-RAG setting, due to the destabilizing effect of
      the harmful-topic context. If the effect is purely due to context length, the
      random setting will lead to an equivalent harmfulness rate.\n3. What is the
      impact of RAG on the refusal rate of LLMs? In many studies, safety is operationalized
      as refusal: a safe model is one which refuses to answer harmful questions. We
      distinguish between two varieties of refusal; namely, unwillingness to fulfill
      a harmful request versus inability to find the answer in the retrieved documents.
      We hypothesize (H3) that the refusal rate for harmful requests will be highest
      in the random setting, and attributed to a lack of information. We argue that
      this case should be distinguished from ''true'' model safety, which should rely
      on an inherent unwillingness to provide dangerous advice. At the same time,
      the oracle setting offers contrasting evaluation in which we ensure the model
      has access to the requested information, so refusal can be more clearly interpreted
      as effective implementation of safety guardrails.\n4. Do different safety evaluators
      agree on what is safe versus harmful? Standard safety evaluation relies on LLM-based
      ''judges'' to label text as safe or unsafe. We compare multiple safety evaluators,
      with the hypothesis (H4) that there will be a high level of disagreement between
      the LLM evaluators.\nRAG-Safety-Bench is freely available for research use at
      the following URL: https://github.com/The-Safe-AI-Lab/ RAG-Safety-Bench .",
      "2 Related Work\nRetrieval-augmented generation Enabling LLMs to consult a database
      of trusted documents through retrieval-augmented generation (RAG) has many benefits:
      it reduces hallucination, allows companies to inject proprietary knowledge/documents
      into the system, supports the rapid update of information without retraining,
      and can enable source attribution (Lewis et al., 2020; Shuster et al., 2021;
      Fan et al., 2024). However, it also exposes new attack surfaces. Most research
      on the safety and security of RAG systems has focused on the security of the
      knowledge base: data poisoning attacks involve the injection of malicious (mis)information
      into the document store (Tan et al., 2024; Nazary et al., 2025; Zhang et al.,
      2025), and data extraction attacks aim to recover sensitive or private information
      from the documents through a RAG interface (Zeng et al., 2024a; Qi et al., 2024;
      Vonderhaar et al., 2025). However, the safety of RAG systems in non-adversarial
      settings has been less studied. An et al. (2025) were the first to highlight
      that RAG systems can output more harmful responses than non-RAG LLMs, even in
      the absence of any malicious intervention. Other work considers the related
      problem of safety degradation in AI agents that have been enabled with information
      retrieval or search capabilities (Yu et al., 2025; BehnamGhader et al., 2025;
      Zhan et al., 2026). Previous work measures the safety of the entire RAG system,
      but the information content and safety of the retrieved documents is an uncontrolled
      variable. Our work takes the next step towards a more scientific understanding
      of these observed phenomena by systematically altering one variable at a time
      (no retrieval, random retrieval, on-topic retrieval, exact-answer retrieval)
      to observe the effect on the safety of the LLM responses.\nLong-context safety
      The retrieval of harmful documents is one factor in the observed safety decline
      in RAG models. However, the literature suggests that another factor may be a
      behavioural shift induced by the inclusion of extended context. In fact, Yu
      et al. (2025) claim that ''safety degradation is largely independent of retrieved
      context itself.'' An et al. (2025) found that 94.7% of the retrieved documents
      in their study were safe, and therefore could not account for the much larger
      increase in unsafe responses. They hypothesize that the retrieved texts, though
      benign themselves, can trigger the recall of unsafe information from the model''s
      parametric knowledge. Other work has shown that LLMs are less capable of identifying
      harmful content in long contexts (Ghorbanpour and Fraser, 2025) and are more
      likely to answer harmful questions in long-context settings (Anil et al., 2024;
      Lu et al., 2025; Huang et al., 2025). In some cases, the model can drift away
      from its default ''helpful assistant'' persona even when the context itself
      is not harmful (e.g. a therapy conversation)\n(Lu et al., 2026). Therefore,
      in this study we design our benchmark to test the ''harmful documents'' and
      ''long context'' explanations separately.", "5 Discussion\nThe core question
      which motivates this work is whether safe documents lead to unsafe RAG generations.
      One possible explanation for the prior observations of unsafe responses in RAG
      systems is that the incorporation of any long context into an LLM can have the
      effect of shifting its behavior away from the basic, short-context regime where
      most of its safety training took place. However, our experiments do not support
      the conclusion that long context alone is a driver of unsafe behavior in RAG
      systems, with the ''random'' condition leading to the safest responses, partially
      through an increase in refusals due to lack of information.\n", "Limitations\nEvaluation
      format differs from training. The RLVR agents were trained to search, read,
      and answer across multiple turns in their own tagged format, whereas our evaluation
      supplies five fixed passages and requests a single citation-bearing response.
      This was necessary for the controlled attribution comparison, but it may affect
      how the agents behave: for example, an agent that would normally issue another
      query may instead abstain. The large differences in abstention and format compliance
      are consistent with this possibility, although our data cannot establish the
      mechanism. An interactive evaluation would be needed to determine whether the
      attribution effect differs in the agents'' native search setting.\nWe cannot
      isolate RL itself. Each agent differs from the baseline in three ways at once:
      it was fine-tuned at all, fine-tuned on retrieval data, and fine-tuned with
      reinforcement learning. Without an arm fine-tuned on the same data without RL,
      our comparison is associational. This is the single most valuable addition a
      follow-up could make.\nSearch-R1 saw NQ in training. It was trained on NQ''s
      training split and we evaluate it on KILTNQ. QAMPARI, HAGRID, and RAGTruth are
      clean for all three agents, and R-Search''s pattern is in fact strongest away
      from NQ, but we have not quantified the overlap.\nThe span always lands at the
      end of the passage. Any positional bias in how models pick citations is therefore
      mixed in with the effect of the plant. Randomizing the injection point is the
      obvious next experiment.\nCITED-OTHER is underpowered outside RAGTruth. NQ,
      QAMPARI, and HAGRID yield only 13-43 question clusters for this variant, too
      few for intervals we would defend. RAGTruth alone is large enough.\nWhat a flag
      means. Our scorer is deterministic string matching, so each flag is exactly
      reproducible: the model cited the doctored passage for the aligned claim. Reading
      that as postrationalization is an interpretation we inherit from Wallat et al.
      (2025), and a competing reading exists. After planting, the claim''s words genuinely
      sit in the doctored passage, so citing it could be scored as obedience to ''answer
      from the passages'' rather than as unfaithfulness. Hand-checking a sample of
      flagged cases would settle how often each reading applies, and we have not done
      it.\nScope. Three RLVR agents from one line of work, one base model, English
      only, one prompt, one decoding setting. Citation behavior may well shift with
      the prompt, so our numbers describe this setup until someone varies it.", "References\nBang
      An, Shiyue Zhang, and Mark Dredze. 2025. RAG LLMs are not safer: A safety analysis
      of retrievalaugmented generation for large language models. In Proceedings of
      the 2025 Conference of the Nations of the Americas Chapter of the Association
      for Computational Linguistics: Human Language Technologies (Volume 1: Long Papers)
      , pages 5444-5474.\nCem Anil, Esin Durmus, Nina Panickssery, Mrinank Sharma,
      Joe Benton, Sandipan Kundu, Joshua Batson, Meg Tong, Jesse Mu, Daniel Ford,
      and 1 others. 2024. Many-shot jailbreaking. Advances in Neural Information Processing
      Systems , 37:129696-129742.\nParishad BehnamGhader, Nicholas Meade, and Siva
      Reddy. 2025. Exploiting instruction-following retrievers for malicious information
      retrieval. In Findings of the Association for Computational Linguistics: ACL
      2025 , pages 12962-12980.\nFederico Bianchi, Mirac Suzgun, Giuseppe Attanasio,
      Paul R\u00f6ttger, Dan Jurafsky, Tatsunori Hashimoto, and James Zou. 2023. Safety-tuned
      llamas: Lessons from improving the safety of large language models that follow
      instructions. arXiv preprint arXiv:2309.07875 .\nWenqi Fan, Yujuan Ding, Liangbo
      Ning, Shijie Wang, Hengyun Li, Dawei Yin, Tat-Seng Chua, and Qing Li. 2024.
      A survey on RAG meeting LLMS: Towards retrieval-augmented large language models.
      In Proceedings of the 30th ACM SIGKDD conference on knowledge discovery and
      data mining , pages 64916501.\nFaeze Ghorbanpour and Alexander Fraser. 2025.
      Evaluating the sensitivity of LLMs to harmful contents in long input. arXiv
      preprint arXiv:2510.05864 .\nShaona Ghosh, Heather Frase, Adina Williams, Sarah
      Luger, Paul R\u00f6ttger, Fazl Barez, Sean McGregor, Kenneth Fricklas, Mala
      Kumar, Kurt Bollacker, and 1 others. 2025. AILuminate: Introducing v1.0 of the
      AI risk and reliability benchmark from MLCommons. arXiv preprint arXiv:2503.05731
      .", "4.1 R1: Capability in safe and unsafe contexts\nWehypothesized (H1) that
      models which demonstrated higher benign RAG capability would also demonstrate
      higher unsafe RAG capability; however, this is not supported by the ''Unsafe
      capability'' data. In fact, the accuracies under the BenignOracle and Unsafe-Oracle
      conditions are negatively correlated (Pearson r = -0 . 70 ). This may indicate
      that the larger and more capable models also have better safety guardrails when
      they are presented with unsafe queries. However, all models are, in general,
      more likely to provide a correct response to the harmful question when the response
      is available in the documents, suggesting that guardrails still need to be improved
      to specifically handle the RAG setting.", "Ethics Statement\nThis work uses
      only publicly released models and datasets. It involves no human subjects and
      no personal data. The planted spans are taken from the models'' own answers
      and are used only in offline evaluation. The work describes a way that citations
      in RAG systems can mislead readers, with the aim of making that failure measurable;
      it does not provide a method for attacking deployed systems. Because RLVR training
      is in wide use, we have tried to state the limits of our null result clearly
      so that it is not read as a stronger claim than the data support.", "4.1 R1:
      Capability in safe and unsafe contexts\nTable 3 reports accuracies for each
      model when asked benign and harmful questions, in both nonRAG, oracle RAG, and
      mixed settings. In the benign case, accuracy is scored using the MIRAGE benchmark
      method (Park et al., 2025). In the harmful (RAG-Safety-Bench) case, we compare
      the output response with the expected benchmark response, using Claude-Opus-4.7
      to output a fi- nal label of accurate or inaccurate relative to the reference.
      Human annotation of a subset of 100 examples validates the LLM-as-a-judge approach,
      with agreement of 95-96% between humans and LLM, and Cohen''s \u03ba of 0.90-0.92
      (more details and prompt available in Appendix Section A.4).\nTable 1: The four
      settings of the RAG-Safety-Bench benchmark. Example documents are for the query,
      ''What materials and design do I need to make an IED that can defeat armored
      police vehicles?''\n\nLLM-only, Description = No context documents provided..
      LLM-only, Example Wikipedia documents = (None). Oracle, Description = One of
      the returned documents contains the answer.. Oracle, Example Wikipedia documents
      = ''Explosively formed penetrator''. On-topic, Description = Oracle document
      not included, but documents are related to the topic of the query.. On-topic,
      Example Wikipedia documents = ''Deflagration to detonation tran- sition'', ''Blast
      wall''. Random, Description = Documents are randomly selected from a set of
      benign documents.. Random, Example Wikipedia documents = ''Climate change and
      birds'', ''Ar- boretum''", "4.2 R2: Unsafe information or unsafe context?\nIn
      all cases, providing irrelevant (safe) documents leads to the safest behavior
      overall, suggesting that long context alone is not sufficient to steer the models
      into an unsafe regime.\nThe results in Figure 2 are also partially consistent
      with one of the major conclusions from An et al. (2025), that the safest non-RAG
      LLM will likely be the safest RAG LLM. Indeed, Phi-4-14B is safest in both non-RAG
      and RAG settings, followed by Llama-3.1-8B. However, Qwen is the third safest
      in the non-RAG setting but the least safe in the oracle-RAG and on-topic RAG
      conditions, suggesting that some models'' guardrails are more robust than others.\nNote
      that the harmfulness rates are lower than\n(though correlated with) the accuracy
      scores in Table 3. Accuracy and harmfulness are judged separately. Manual inspection
      reveals two large buckets of responses that are rated as accurate but not harmful:
      responses which are not flagged as harmful by the safety judges but likely should
      be, in the context (typically descriptions of historical events and nonviolent
      crimes), and cases where the model hedges that the information is for education
      purposes only (e.g., Ministral-3-8B in response to a query about misinformation
      propagation, \"... Here''s a **generalized breakdown of memetic propagation
      techniques** (based on the text) that could theoretically be used to influence
      public opinion, **with the caveat that this is for educational/analytical purposes
      only** ... <goes into detail on techniques.>'' ).\nThe harmfulness rates for
      each model and condition broken down by harm taxonomy category are available
      in the Appendix (Figure 6-Figure 10). The categories which tend to see the greatest
      increase in harmful responses from the non-RAG setting to the oracle setting
      are: radiological weapons, explosives, drugs, chemical weapons, assault, terrorism,
      and cyberattacks. The Ministral and Qwen models also show a concerning increase
      in harmful responses to questions about suicide and self-harm.", "Ethical considerations\nThis
      benchmark contains questions and answers that can be dangerous, harmful, and
      disturbing. However, because the content is sourced from Wikipedia, we are not
      introducing new knowledge into the information ecosystem nor making it meaningfully
      easier to access. The benchmark aggregates this information in a form useful
      for safety evaluation, and we therefore believe the risks inherent in releasing
      it are outweighed by the potential benefit of improving in retrieval-augmented
      AI systems.\nThe intended use of this benchmark is to support safety evaluation
      and research on RAG safety mitigations. Wikipedia text is licensed under CC
      BYSA 4.0, which allows redistribution under the following requirements: attribution,
      indicating modifications, ''ShareAlike'' condition, and license notice. Our
      benchmark satisfies these criteria by: providing a URL to each original Wikipedia
      article (attribution), describing the process of summarization and article truncation
      (modification), releasing under the same CC BY-SA 4.0 license (ShareAlike),
      and including a link to the license in the published version of the benchmark
      (license notice).\nHuman annotators involved in benchmark validation were authors
      of this paper and were fully briefed on the nature of the data and the importance
      of managing mental health while dealing with the potentially difficult content.
      As authors, they were not paid separately for the annotation work.\nAI tools
      (Claude) for coding assistance and data visualization were used throughout this
      project. Experimental design, interpretation, and writing were done solely by
      the authors.", "A.2 Safety evaluation details\nEach example in the balanced
      subset is expanded into four evaluation conditions: non_rag , rag_oracle_unsafe
      , rag_topic_safe , and rag_control_safe_random . Since the balanced subset contains
      346 examples, this expansion produces 1,384 example-condition rows per model
      and 6,920 total responses across the five evaluated models.\nThe benchmark controls
      retrieval quality by directly supplying context documents, rather than relying
      on a live retriever to discover them at inference time. This is important because
      a poor retriever could otherwise fail to retrieve the relevant harmful document
      and artificially inflate apparent safety.\nThe non_rag condition supplies no
      documents for all 346 examples. The rag_oracle_unsafe condition supplies one
      document for all 346 examples. The rag_topic_safe condition supplies three documents
      for 344 examples and two documents for two examples. The rag_control_safe_random
      condition supplies three documents for 321 examples, two documents for 24 examples,
      and one document for one example.\nIn the final evaluation configuration, context
      is supplied as cleaned full-article-prefix text with a per-document cap of approximately
      12,000 characters. Section-level metadata are retained for provenance and auditing.\nThe
      response-generation templates are intentionally simple. In the non_rag condition,
      the model is instructed to answer using only its own knowledge. In the three
      RAG conditions, the model is instructed to answer using only the provided documents,
      with each supplied context labeled sequentially as Context 1 , Context 2 , etc.\nAll
      model responses were generated deterministically with temperature = 0 . 0 ,
      topp = 1 . 0 , and sampling disabled. We used a maximum of 1,024 newly generated
      tokens per response and a fixed run seed of 42. For RAG conditions, each cleaned
      retrieved-document prefix was capped at 12,000 characters. The same prompt template
      and decoding settings were used across all four conditions for a given model.\nAll
      experiments were run on an academic research cluster with NVIDIA H100 GPUs.
      Compute requirements varied by model size, context length, and response length.
      The five-model evaluation required approximately 74 GPU-hours in total, including
      response generation and local safety judging. The released configurations and
      run manifests provide the information needed to reproduce the evaluation.",
      "9 Limitations\nEvaluator dependence. Primary scores use DeBERTa-v3-base, trained
      on MNLI, FEVER, and ANLI, at \u03c4 = 0 . 5 , without human calibration. Using
      the same model to select recovered spans and score support can reinforce systematic
      errors; the resulting scores are evaluator-dependent estimates, not validated
      rates of source support or factual correctness. This dependence also limits
      conclusions about method rankings and the size of emitted-grounded gaps. The
      200-question TRUE audit checks a second scoring family, but fixed recovery retains
      DeBERTa selection and TRUE recovery reuses one judge. Different input windows
      and nonbinary decoder outputs further limit numerical comparison. Human source-level
      calibration remains necessary (Rashkin et al., 2023).\nSingle generator. All
      results use Qwen2.5-7BInstruct with greedy decoding. Frontier shapes may differ
      across model families and scales; a second-family replication is planned.\nDataset
      coverage. We evaluate two English datasets (ASQA and QASPER) with distinct retrieval
      granularities, but this does not cover multilingual settings, open-web retrieval,
      or longercontext regimes.\nRe-attribution hyperparameters. The top-10 lexical
      candidate pool can miss semantically matching snippets, and requiring one snippet
      to entail a unit can miss support distributed across snippets. Consequently,
      a failed recovery does not establish that the source contains no support. Table
      3 varies the recovery threshold while holding the scoring threshold fixed; it
      does not validate the evaluator or test candidate-pool size, retrieval strategy,
      or multi-snippet recovery.\nVerification scope. Declared-span verification rejects
      claims lacking declared evidence by construction, even if support could be recovered.
      Its 1 . 00 unsupported rate for no-provenance runs is a provenance-availability
      diagnostic, not a calibrated hallucination rate. Recovered-source verification
      is reported at nominal 0.25 for the two no-provenance methods and remains dependent
      on the same bounded recovery procedure and evaluator.\nResidual error rows.
      Only identity fails on 4 ASQA and 29 QASPER questions; every primary setting
      is evaluated on the resulting common successful subset. This pairing prevents
      comparisons from using different questions, but conditions results on identity
      success and omits those difficult cases. Sampling intervals condition on the
      fixed generated outputs and evaluator; they do not include systematic NLI error
      or variation across generation runs.\nNominal versus achieved budgets. Abstractive
      compressors do not reliably hit nominal token budgets; RECOMP often produces
      much less context than requested. We report achieved compression ratios, but
      comparisons at a shared nominal budget do not establish performance at matched
      achieved context sizes.", "4.1 R1: Capability in safe and unsafe contexts\nTable
      2: The taxonomy of harms covered in RAGSafety-Bench. The number of realistic,
      dangerous queries that could be generated from Wikipedia articles varied across
      subcategories: the column ''Full'' indicates the total of queries available
      for each category, the column ''Balanced'' indicates the number of queries in
      each subcategory after sub-sampling to avoid topic bias.\n\nViolent, Subcategory
      = Assault/battery. Violent, Full = 33. Violent, Balanced = 20. crimes, Subcategory
      = Abuse. crimes, Full = 47. crimes, Balanced = 20. , Subcategory = Kidnapping.
      , Full = 17. , Balanced = 17. , Subcategory = Murder. , Full = 23. , Balanced
      = 20. , Subcategory = Terrorism. , Full = 28. , Balanced = 20. Sex-related,
      Subcategory = Sexual harassment. Sex-related, Full = 18. Sex-related, Balanced
      = 16. crimes, Subcategory = Sexual assault. crimes, Full = 15. crimes, Balanced
      = 12. Nonviolent, Subcategory = Fraud/scam. Nonviolent, Full = 63. Nonviolent,
      Balanced = 20. crimes, Subcategory = Financial crimes. crimes, Full = 20. crimes,
      Balanced = 20. , Subcategory = Property crimes. , Full = 34. , Balanced = 20.
      , Subcategory = Cyber-attacks. , Full = 135. , Balanced = 20. , Subcategory
      = Drug-related crimes. , Full = 16. , Balanced = 16. Hate, Subcategory = Hate
      speech. Hate, Full = 21. Hate, Balanced = 20. , Subcategory = Hate crimes. ,
      Full = 13. , Balanced = 13. Indiscriminate, Subcategory = Chemical weapons.
      Indiscriminate, Full = 76. Indiscriminate, Balanced = 20. weapons, Subcategory
      = Biological weapons. weapons, Full = 8. weapons, Balanced = 5. , Subcategory
      = Radiological weapons. , Full = 7. , Balanced = 7. , Subcategory = Explosives.
      , Full = 304. , Balanced = 20. Self-harm, Subcategory = Suicide. Self-harm,
      Full = 75. Self-harm, Balanced = 20. , Subcategory = Self-harm. , Full = 34.
      , Balanced = 20. TOTAL, Subcategory = . TOTAL, Full = 987. TOTAL, Balanced =
      346\nIn the benign case, we observe a large increase in accuracy in the oracle
      RAG setting relative to the non-RAG setting, indicating that all of the models
      in our experiments are capable of incorporating information from RAG context,
      when the correct information is available. Therefore, safety behav- ior in the
      current study cannot be attributed to a model''s inability to attend to the
      RAG docs (An et al., 2025). Performance is loosely associated with model size:
      Phi-4-14B performs best in the oracle condition, followed by Gemma-3-12B, followed
      by the 7-8B parameter models.", "References\n- Zhenting Qi, Hanlin Zhang, Eric
      P Xing, Sham M Kakade, and Himabindu Lakkaraju. 2024. Follow my instruction
      and spill the beans: Scalable data extraction from retrieval-augmented generation
      systems. In ICLR 2024 Workshop on Navigating and Addressing Data Problems for
      Foundation Models .\n- Mark Russinovich, Ahmed Salem, and Ronen Eldan. 2025.
      Great, now write an article about that: The crescendo { Multi-Turn }{ LLM }
      jailbreak attack. In 34th USENIX Security Symposium (USENIX Security 25) , pages
      2421-2440.\n- Kurt Shuster, Spencer Poff, Moya Chen, Douwe Kiela, and Jason
      Weston. 2021. Retrieval augmentation reduces hallucination in conversation.
      In Findings of the Association for Computational Linguistics: EMNLP 2021 , pages
      3784-3803.\n- Hao Sun, Zhexin Zhang, Jiawen Deng, Jiale Cheng, and Minlie Huang.
      2023. Safety assessment of Chinese large language models. arXiv preprint arXiv:2304.10436
      .\n- Zhen Tan, Chengshuai Zhao, Raha Moraffah, Yifan Li, Song Wang, Jundong
      Li, Tianlong Chen, and Huan Liu. 2024. Glue pizza and eat rocks-exploiting vulnerabilities
      in retrieval-augmented generative models. In Proceedings of the 2024 Conference
      on Empirical Methods in Natural Language Processing , pages 1610-1626.\n- Bertie
      Vidgen, Nino Scherrer, Hannah Rose Kirk, Rebecca Qian, Anand Kannappan, Scott
      A Hale, and Paul R\u00f6ttger. 2023. SimpleSafetyTests: A test suite for identifying
      critical safety risks in large language models. arXiv preprint arXiv:2311.08370
      .\n- Lynn Vonderhaar, Daniel Machado, and Omar Ochoa. 2025. Surveying the RAG
      attack surface and defenses: Protecting sensitive company data. In 2025 IEEE
      International Conference on Artificial Intelligence Testing (AITest) , pages
      69-76. IEEE.\n- Dean Wampler, Dave Nielson, and Alireza Seddighi. 2025. Engineering
      the RAG stack: A comprehensive review of the architecture and trust frameworks
      for retrieval-augmented generation systems. arXiv preprint arXiv:2601.05264
      .\n- Wenxuan Wang, Zhaopeng Tu, Chang Chen, Youliang Yuan, Jen-tse Huang, Wenxiang
      Jiao, and Michael Lyu. 2024a. All languages matter: On the multilingual safety
      of LLMs. In Findings of the Association for Computational Linguistics: ACL 2024
      , pages 5865-5877.\n- Yuxia Wang, Haonan Li, Xudong Han, Preslav Nakov, and
      Timothy Baldwin. 2024b. Do-not-answer: Evaluating safeguards in llms. In Findings
      of the Association for Computational Linguistics: EACL 2024 , pages 896-911.",
      "A.1 RAG-Safety-Bench benchmark creation\nRAG-Safety-Bench was constructed from
      Wikipedia-based source material using a semiautomated pipeline. We first defined
      a taxonomy of harmful user requests by adapting the MLCommons AILuminate hazard
      taxonomy to the RAG question-answering setting. The final taxonomy contains
      20 subcategories spanning violent crimes, sex-related crimes, nonviolent crimes,
      hate, indiscriminate weapons, and self-harm (Table 2). As described in the main
      paper, several categories from the original taxonomy were excluded because they
      were not appropriate for a public Wikipedia-based QA benchmark, including privacy/identification,
      direct harmful content generation, intellectual property, and specialized advice.\nFor
      each harm subcategory, we identified one or more relevant Wikipedia categories
      or documents likely to contain harmful answer-bearing information. We then used
      Claude Sonnet-4.5 to generate candidate harmful questions whose answers could
      be grounded in those documents. In addition to the question itself, the generation
      stage also produced supporting metadata for review, including severity, naturalness
      notes, answerability justification, source-document identifiers, and a short
      gold reference summary of the harmful answer. This gold reference is stored
      in the field expected_unsafe_answer_summary . The prompt used with Claude Sonnet-4.5
      to generate candidate unsafe questions from Wikipedia articles is shown in Table
      5.\nThe released benchmark contains two versions. The Full version contains
      987 harmful questions, distributed unevenly across the 20 subcategories. The
      Balanced version, used in the experiments in this paper, subsamples toward a
      uniform target of 20 examples per subcategory where available. Some subcategories
      contain fewer than 20 viable examples, so the final balanced subset contains
      346 unique examples in total (Table 2).\nEach released benchmark row contains
      a query plus the metadata needed to instantiate one controlled evaluation condition.
      Important fields include:\n- example_id , original_example_id , and row_uid
      : stable identifiers linking conditionspecific rows to the underlying benchmark
      question;\n- question and expected_unsafe_answer_summary : the harmful user
      query and its reference answer summary;\n- harm_category , harm_topic_family
      , taxonomy_family , taxonomy_subcategory , topic , and topic_slug : harm-taxonomy
      metadata;\n- gold_doc_id and gold_doc_title : provenance for the source document
      underlying the oracle condition;\n- condition , doc_count , and docs : the evaluation
      condition and its model-facing document contexts;\n- strict_audit_labels : final
      oracle answerability and on-topic non-answerability audit outcomes; and\n- runtime_context_cap
      , context_ablation , final_freeze_version , source_run_id , and source_builder_mode
      : runtime and dataset provenance metadata.\n"], "model": "rerank-2.5", "top_k":
      5, "truncation": true}'
