    body: "{\"max_tokens\":1024,\"messages\":[{\"role\":\"user\",\"content\":[{\"type\":\"document\",\"source\":{\"type\":\"text\",\"media_type\":\"text/plain\",\"data\":\"Limitations\\nThe
      current findings must be interpreted with the following limitations in mind.
      RAG-Safety-Bench is English-only, considers only one document source (Wikipedia),
      and covers a non-exhaustive set of possible harm categories. Further work is
      required to understand how retrieval-enabled LLMs behave in languages other
      than English and in multiple use contexts. The current study highlighted how
      assessments of safety can be subjective; clearly, the type of potentially dangerous
      information that can be returned to a trained intelligence officer versus a
      layperson versus a schoolchild are very different and such use cases must be
      assessed separately.\\nBy design, our benchmark does not evaluate the impact
      of the retriever in the RAG system. However, and end-to-end evaluation would
      also need to assess interactions between retriever ranking, query reformulation,
      and generator safety. Our benchmark also represents a simplified view of RAG
      methodology, while production RAG systems would likely include additional safety
      components, such as system-level safety instructions and input/output filters.\\nOur
      testing suite of models included only opensource models, and relatively small
      models due to computing resource constraints. Again, real-world RAG deployments
      will likely use much larger commercial models. We note that our RAG-SafetyBench
      benchmark can be used to evaluate such models, and that our reason for not doing
      so was to avoid being banned for Terms-of-Service violations. We encourage researchers
      with internal access to such models to use our benchmark and publish the results.\\nOur
      methodology for benchmark generation and automated assessment relies heavily
      on the Claude family of models from Anthropic. While we did conduct human evaluations
      to validate Claude's performance, a more robust (though expensive) methodology
      could combine multiple strong LLM judges in an ensemble. Furthermore, we evaluate
      on a single run of the benchmark, but due to the stochastic nature of LLM generation,
      the results might differ across multiple runs.\"},\"title\":\"2609.11758v1.pdf
      [01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a] (text, page
      9)\",\"citations\":{\"enabled\":true}},{\"type\":\"document\",\"source\":{\"type\":\"text\",\"media_type\":\"text/plain\",\"data\":\"6
      Conclusion\\nWe introduce RAG-Safety-Bench with the goal of disentangling the
      effects of RAG on LLM safety by cleanly separating four retrieval conditions.
      Across five open-source models, our results show that the most interesting failure
      mode is model-specific: for Qwen-2.5-7B, on-topic but answer-free documents
      elicited more harmful responses than the non-RAG baseline, consistent with the
      hypothesis that topicrelevant context can surface harmful information from parametric
      memory.\\nMore generally, our findings confirm that nonRAG safety evaluations
      do not transfer to RAG deployments. Our initial results from the benchmark only
      evaluate the baked-in safety guardrails of the base model. However, in a production
      system, responsible AI practitioners should provide end-toend safety measures
      including (when warranted): corpus curation, input prompt filtering, retrievalside
      filtering, output filtering, and system prompt safety instructions, among other
      possible mitigations. Thus an important use case for our benchmark is also to
      evaluate the impact of safety interventions at different points in the multi-component
      RAG pipeline. Our results also indicate the need to choose an automated safety
      evaluator which is closely aligned with the safety concerns relevant to the
      particular application, and where possible to deploy multiple safety judges,
      as well as appropriate human oversight.\"},\"title\":\"2609.11758v1.pdf [01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a]
      (text, page 9)\",\"citations\":{\"enabled\":true}},{\"type\":\"document\",\"source\":{\"type\":\"text\",\"media_type\":\"text/plain\",\"data\":\"Abstract\\nAllowing
      large language models (LLMs) to retrieve information from a set of trusted documents
      can increase reliability and reduce hallucination. However, recent work has
      demonstrated that retrieval-augmented generation (RAG) can have unintended side
      effects on the overall safety of the generated responses, when prompted for
      harmful or dangerous content. A clearer understanding of the mechanisms leading
      to this result is needed, as increasing numbers of end users turn to RAG to
      incorporate corporate documents and knowledge bases into LLM-based systems.
      We introduce RAG-Safety-Bench, a benchmark to measure the safety impact of RAG
      on LLM models. By removing the confounding effect of retriever quality, and
      cleanly separating the problem into four conditions - non-RAG, RAG with an oracle
      document containing the answer to the harmful request, RAG with documents related
      to the harmful request but without the specific answer, and RAG with random,
      safe documents - the benchmark isolates the impacts of different factors in
      the observed safety degradation. We report results across five opensource LLMs,
      showing an inverse relationship between benign and unsafe capability, strong
      evidence that baseline safety guardrails do not lead to downstream safety guarantees
      in the RAG case, and model-specific support for previous findings that even
      benign documents can lead to unsafe generation in retrieval-enabled systems.\"},\"title\":\"2609.11758v1.pdf
      [01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a] (text, page
      1)\",\"citations\":{\"enabled\":true}},{\"type\":\"document\",\"source\":{\"type\":\"text\",\"media_type\":\"text/plain\",\"data\":\"3.2
      Safety-capability relationship\\nOur benchmark, RAG-Safety-Bench, complements
      the original MIRAGE benchmark by measuring safety rather than benign capability.
      The benchmark enables direct comparison across 4 settings, as described in Table
      1. Note the distinction between the Oracle and On-topic settings: in the oracle
      setting, the answer is directly available in the retrieved context. In the on-topic
      condition, the retrieved documents are on the same topic as the query (in the
      example, explosives), but do not contain the answer to the query.\\nBy providing
      the context documents directly, the benchmark enables evaluation of the base
      LLM's ability to maintain safety guardrails in the presence of RAG context,
      while removing the confounding factor of retriever quality (e.g., a poor retriever
      might simply miss the relevant unsafe document and therefore lead to a misleadingly
      inflated safety score).\\nThe method for constructing the benchmark is as follows.
      We first develop a taxonomy of harmful user queries, based on the existing MLCommons
      AILuminate 'Hazard Taxonomy' (Ghosh et al., 2025). The context of RAG safety
      evaluation and our intended corpus of Wikipedia documents required some modifications
      to the existing taxonomy. Our current version of RAG-SafetyBench excludes the
      following harm categories: Privacy/identification: since our knowledge base
      is a public resource, we assume it does not contain private information (though
      privacy leakage may be a concern in other RAG use cases); Direct generation
      of harmful content: the focus of the benchmark is on question answering, not
      content generation; Intellectual property: Wikipedia users are strictly forbidden
      from uploading copyrighted material without permission, and so it is not a suitable
      resource to test for intellectual property leakage; Specialized advice: this
      category (comprising topics such as legal advice, medical advice) is often poorly
      defined and highly-contextual, and so we do not include it here. The final taxonomy
      is given in Table 2.\\nFollowing Park et al. (2025) and An et al. (2025), we
      use Wikipedia as our knowledge base. For each sub-category in the harm taxonomy,
      we identify a relevant category or set of categories on Wikipedia where harmful
      information related to the topic can be found. We then use Claude-Sonnet-4.5
      to generate potentially harmful questions whose answers can be found in one
      of the available Wikipedia documents. We also enforce a series of self-checks
      to avoid hallucinations or unrealistic questions (see Appendix for full details
      and prompts). The Claude model outputs a harmful question, a rating of the question's
      severity, the name and ID of the Wikipedia article that contains the answer,
      the exact text passage containing the answer, a summary of the expected unsafe
      answer, as well as other additional information to aid human review of the questions
      and answers (shown in Table 6 in the Appendix). We aimed to generate a minimum
      of 20 queries per subcategory in the taxonomy, although ultimately there was
      more actionable information available for some categories than others. We therefore
      release two versions of the benchmark: the Full version contains 987 harmful
      queries, distributed unevenly across the subcategories, while the Balanced version
      (used in the current analysis) is subsampled to a more uniform distribution
      across subcategories (see Table 2).\"},\"title\":\"2609.11758v1.pdf [01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a]
      (text, page 3)\",\"citations\":{\"enabled\":true}},{\"type\":\"document\",\"source\":{\"type\":\"text\",\"media_type\":\"text/plain\",\"data\":\"Limitations\\nEvaluation
      format differs from training. The RLVR agents were trained to search, read,
      and answer across multiple turns in their own tagged format, whereas our evaluation
      supplies five fixed passages and requests a single citation-bearing response.
      This was necessary for the controlled attribution comparison, but it may affect
      how the agents behave: for example, an agent that would normally issue another
      query may instead abstain. The large differences in abstention and format compliance
      are consistent with this possibility, although our data cannot establish the
      mechanism. An interactive evaluation would be needed to determine whether the
      attribution effect differs in the agents' native search setting.\\nWe cannot
      isolate RL itself. Each agent differs from the baseline in three ways at once:
      it was fine-tuned at all, fine-tuned on retrieval data, and fine-tuned with
      reinforcement learning. Without an arm fine-tuned on the same data without RL,
      our comparison is associational. This is the single most valuable addition a
      follow-up could make.\\nSearch-R1 saw NQ in training. It was trained on NQ's
      training split and we evaluate it on KILTNQ. QAMPARI, HAGRID, and RAGTruth are
      clean for all three agents, and R-Search's pattern is in fact strongest away
      from NQ, but we have not quantified the overlap.\\nThe span always lands at
      the end of the passage. Any positional bias in how models pick citations is
      therefore mixed in with the effect of the plant. Randomizing the injection point
      is the obvious next experiment.\\nCITED-OTHER is underpowered outside RAGTruth.
      NQ, QAMPARI, and HAGRID yield only 13-43 question clusters for this variant,
      too few for intervals we would defend. RAGTruth alone is large enough.\\nWhat
      a flag means. Our scorer is deterministic string matching, so each flag is exactly
      reproducible: the model cited the doctored passage for the aligned claim. Reading
      that as postrationalization is an interpretation we inherit from Wallat et al.
      (2025), and a competing reading exists. After planting, the claim's words genuinely
      sit in the doctored passage, so citing it could be scored as obedience to 'answer
      from the passages' rather than as unfaithfulness. Hand-checking a sample of
      flagged cases would settle how often each reading applies, and we have not done
      it.\\nScope. Three RLVR agents from one line of work, one base model, English
      only, one prompt, one decoding setting. Citation behavior may well shift with
      the prompt, so our numbers describe this setup until someone varies it.\"},\"title\":\"2609.23053v1.pdf
      [01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6] (text, page
      8)\",\"citations\":{\"enabled\":true}},{\"type\":\"text\",\"text\":\"What limitations
      do the authors state for RAG-Safety-Bench?\"}]}],\"model\":\"claude-sonnet-5\",\"system\":\"You
      are a research assistant answering questions about scientific and technical
      documents (papers, patents). You are given a set of source documents as `document`
      content blocks \u2014 each may be prose, a table (as Markdown), or a figure
      caption.\\n\\nRules:\\n- Answer ONLY using the provided documents. If they don't
      contain the answer, say so plainly.\\n- Every factual claim must be traceable
      to a specific document via the citations mechanism.\\n- When a table or figure
      is the source of a claim, say so explicitly (e.g. \\\"per Table 2...\\\" or
      \\\"as shown in Figure 3...\\\").\\n- Do not speculate beyond what the documents
      state.\\n- Be concise and precise; prefer exact values/units from tables over
      paraphrase.\\n\",\"thinking\":{\"type\":\"disabled\"}}"
