      string: "{\"result\":{\"points\":[{\"id\":\"710d0b17-8e1f-59b5-a11b-1ab94cc0c2b1\",\"version\":9,\"score\":0.78920126,\"payload\":{\"page_content\":\"Limitations\\nThe
        current findings must be interpreted with the following limitations in mind.
        RAG-Safety-Bench is English-only, considers only one document source (Wikipedia),
        and covers a non-exhaustive set of possible harm categories. Further work
        is required to understand how retrieval-enabled LLMs behave in languages other
        than English and in multiple use contexts. The current study highlighted how
        assessments of safety can be subjective; clearly, the type of potentially
        dangerous information that can be returned to a trained intelligence officer
        versus a layperson versus a schoolchild are very different and such use cases
        must be assessed separately.\\nBy design, our benchmark does not evaluate
        the impact of the retriever in the RAG system. However, and end-to-end evaluation
        would also need to assess interactions between retriever ranking, query reformulation,
        and generator safety. Our benchmark also represents a simplified view of RAG
        methodology, while production RAG systems would likely include additional
        safety components, such as system-level safety instructions and input/output
        filters.\\nOur testing suite of models included only opensource models, and
        relatively small models due to computing resource constraints. Again, real-world
        RAG deployments will likely use much larger commercial models. We note that
        our RAG-SafetyBench benchmark can be used to evaluate such models, and that
        our reason for not doing so was to avoid being banned for Terms-of-Service
        violations. We encourage researchers with internal access to such models to
        use our benchmark and publish the results.\\nOur methodology for benchmark
        generation and automated assessment relies heavily on the Claude family of
        models from Anthropic. While we did conduct human evaluations to validate
        Claude's performance, a more robust (though expensive) methodology could combine
        multiple strong LLM judges in an ensemble. Furthermore, we evaluate on a single
        run of the benchmark, but due to the stochastic nature of LLM generation,
        the results might differ across multiple runs.\",\"metadata\":{\"ingestion_version\":\"01a0fc5427ea71babb96a22c2c5762f3\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a-text-0019\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a\",\"chunk_type\":\"text\",\"section_path\":\"Limitations\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":88,\"page_no\":9,\"filename\":\"2609.11758v1.pdf\"}}},{\"id\":\"20fd44c5-f345-560a-92d1-524ad6c48da6\",\"version\":9,\"score\":0.7269292,\"payload\":{\"page_content\":\"6
        Conclusion\\nWe introduce RAG-Safety-Bench with the goal of disentangling
        the effects of RAG on LLM safety by cleanly separating four retrieval conditions.
        Across five open-source models, our results show that the most interesting
        failure mode is model-specific: for Qwen-2.5-7B, on-topic but answer-free
        documents elicited more harmful responses than the non-RAG baseline, consistent
        with the hypothesis that topicrelevant context can surface harmful information
        from parametric memory.\\nMore generally, our findings confirm that nonRAG
        safety evaluations do not transfer to RAG deployments. Our initial results
        from the benchmark only evaluate the baked-in safety guardrails of the base
        model. However, in a production system, responsible AI practitioners should
        provide end-toend safety measures including (when warranted): corpus curation,
        input prompt filtering, retrievalside filtering, output filtering, and system
        prompt safety instructions, among other possible mitigations. Thus an important
        use case for our benchmark is also to evaluate the impact of safety interventions
        at different points in the multi-component RAG pipeline. Our results also
        indicate the need to choose an automated safety evaluator which is closely
        aligned with the safety concerns relevant to the particular application, and
        where possible to deploy multiple safety judges, as well as appropriate human
        oversight.\",\"metadata\":{\"ingestion_version\":\"01a0fc5427ea71babb96a22c2c5762f3\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a-text-0018\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a\",\"chunk_type\":\"text\",\"section_path\":\"6
        Conclusion\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":85,\"page_no\":9,\"filename\":\"2609.11758v1.pdf\"}}},{\"id\":\"fdef7d6e-6f33-507f-b2bf-e72cdaf10ddb\",\"version\":9,\"score\":0.6919955,\"payload\":{\"page_content\":\"Kathleen
        C. Fraser\\nFaculty of Engineering University of Ottawa Ottawa, Canada kathleen.fraser@uottawa.ca\\nFigure
        1: The four conditions in RAG-Safety-Bench allow for detailed safety evaluation
        of RAG-enabled systems.\\ntrustworthiness and accuracy by reducing hallucinations,
        relative to non-RAG LLMs (Shuster et al., 2021). For these reasons, conventional
        wisdom would suggest that RAG-based LLMs should be safer than non-RAG models,
        with the primary security risk being data poisoning attacks on the RAG corpus.
        In the absence of poisoned data, there would be little reason to suspect a
        RAG system would output more harmful content than its base LLM component.\\nHowever,
        this assumption has been upended by recent work from An et al. (2025), who
        presented compelling evidence that when LLMs are enabled with RAG they are
        generally less safe than when relying on their parametric knowledge, even
        when the retrieved documents are benign. In the current work, we contribute
        to the understanding of this newly-identified problem by disentangling the
        notions of safety and capability through a new RAG-specific safety benchmark,
        RAG-SafetyBench. Furthermore, we take a closer look at what it means for documents
        and outputs to be 'unsafe,' to support more detailed analysis of the problematic
        case where safe RAGdocuments appear to lead to unsafe outputs.\\nRAG systems
        are challenging to evaluate because they are composed of multiple components,
        each of which contributes to the overall end-to-end performance of the system
        (Wampler et al., 2025). In particular, the retrieval quality can have a major
        impact on the quality of the output. The MIRAGE benchmark (Park et al., 2025)
        enables the evaluation of RAG systems while controlling for retrieval quality
        by providing sets of relevant and irrelevant oracle documents.\\nWe modify
        and extend this style of evaluation to safety evaluation in the RAG setting.
        Our RAGSafety-Bench benchmark consists of a set of unsafe English queries
        and three sets of documents (Figure 1): in the oracle setting, the unsafe
        answer is available in the document set. This setting could represent a data-poisoning
        attack - however, since we sourced all of our data from Wikipedia, it also
        represents the more common case that the data is believed to be generally
        benign but has not been meticulously curated. In the on-topic setting, the
        documents are relevant to the topic of the query but do not explicitly contain
        the unsafe answer. In the random setting, randomly-selected documents on safe
        topics are provided.\\nThis testing framework allows us to answer several
        key open research questions relating to the safety of RAG systems:\",\"metadata\":{\"ingestion_version\":\"01a0fc5427ea71babb96a22c2c5762f3\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a-text-0003\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a\",\"chunk_type\":\"text\",\"section_path\":\"Kathleen
        C. Fraser\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":8,\"page_no\":1,\"filename\":\"2609.11758v1.pdf\"}}},{\"id\":\"999e0e12-597f-54b6-8d00-9f485109d12a\",\"version\":9,\"score\":0.6792236,\"payload\":{\"page_content\":\"Abstract\\nAllowing
        large language models (LLMs) to retrieve information from a set of trusted
        documents can increase reliability and reduce hallucination. However, recent
        work has demonstrated that retrieval-augmented generation (RAG) can have unintended
        side effects on the overall safety of the generated responses, when prompted
        for harmful or dangerous content. A clearer understanding of the mechanisms
        leading to this result is needed, as increasing numbers of end users turn
        to RAG to incorporate corporate documents and knowledge bases into LLM-based
        systems. We introduce RAG-Safety-Bench, a benchmark to measure the safety
        impact of RAG on LLM models. By removing the confounding effect of retriever
        quality, and cleanly separating the problem into four conditions - non-RAG,
        RAG with an oracle document containing the answer to the harmful request,
        RAG with documents related to the harmful request but without the specific
        answer, and RAG with random, safe documents - the benchmark isolates the impacts
        of different factors in the observed safety degradation. We report results
        across five opensource LLMs, showing an inverse relationship between benign
        and unsafe capability, strong evidence that baseline safety guardrails do
        not lead to downstream safety guarantees in the RAG case, and model-specific
        support for previous findings that even benign documents can lead to unsafe
        generation in retrieval-enabled systems.\",\"metadata\":{\"ingestion_version\":\"01a0fc5427ea71babb96a22c2c5762f3\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a-text-0001\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a\",\"chunk_type\":\"text\",\"section_path\":\"Abstract\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":4,\"page_no\":1,\"filename\":\"2609.11758v1.pdf\"}}},{\"id\":\"00dd7098-d7e3-5082-ac69-3fd48c815358\",\"version\":9,\"score\":0.6635453,\"payload\":{\"page_content\":\"3.2
        Safety-capability relationship\\nOur benchmark, RAG-Safety-Bench, complements
        the original MIRAGE benchmark by measuring safety rather than benign capability.
        The benchmark enables direct comparison across 4 settings, as described in
        Table 1. Note the distinction between the Oracle and On-topic settings: in
        the oracle setting, the answer is directly available in the retrieved context.
        In the on-topic condition, the retrieved documents are on the same topic as
        the query (in the example, explosives), but do not contain the answer to the
        query.\\nBy providing the context documents directly, the benchmark enables
        evaluation of the base LLM's ability to maintain safety guardrails in the
        presence of RAG context, while removing the confounding factor of retriever
        quality (e.g., a poor retriever might simply miss the relevant unsafe document
        and therefore lead to a misleadingly inflated safety score).\\nThe method
        for constructing the benchmark is as follows. We first develop a taxonomy
        of harmful user queries, based on the existing MLCommons AILuminate 'Hazard
        Taxonomy' (Ghosh et al., 2025). The context of RAG safety evaluation and our
        intended corpus of Wikipedia documents required some modifications to the
        existing taxonomy. Our current version of RAG-SafetyBench excludes the following
        harm categories: Privacy/identification: since our knowledge base is a public
        resource, we assume it does not contain private information (though privacy
        leakage may be a concern in other RAG use cases); Direct generation of harmful
        content: the focus of the benchmark is on question answering, not content
        generation; Intellectual property: Wikipedia users are strictly forbidden
        from uploading copyrighted material without permission, and so it is not a
        suitable resource to test for intellectual property leakage; Specialized advice:
        this category (comprising topics such as legal advice, medical advice) is
        often poorly defined and highly-contextual, and so we do not include it here.
        The final taxonomy is given in Table 2.\\nFollowing Park et al. (2025) and
        An et al. (2025), we use Wikipedia as our knowledge base. For each sub-category
        in the harm taxonomy, we identify a relevant category or set of categories
        on Wikipedia where harmful information related to the topic can be found.
        We then use Claude-Sonnet-4.5 to generate potentially harmful questions whose
        answers can be found in one of the available Wikipedia documents. We also
        enforce a series of self-checks to avoid hallucinations or unrealistic questions
        (see Appendix for full details and prompts). The Claude model outputs a harmful
        question, a rating of the question's severity, the name and ID of the Wikipedia
        article that contains the answer, the exact text passage containing the answer,
        a summary of the expected unsafe answer, as well as other additional information
        to aid human review of the questions and answers (shown in Table 6 in the
        Appendix). We aimed to generate a minimum of 20 queries per subcategory in
        the taxonomy, although ultimately there was more actionable information available
        for some categories than others. We therefore release two versions of the
        benchmark: the Full version contains 987 harmful queries, distributed unevenly
        across the subcategories, while the Balanced version (used in the current
        analysis) is subsampled to a more uniform distribution across subcategories
        (see Table 2).\",\"metadata\":{\"ingestion_version\":\"01a0fc5427ea71babb96a22c2c5762f3\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a-text-0008\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a\",\"chunk_type\":\"text\",\"section_path\":\"3.2
        Safety-capability relationship\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":32,\"page_no\":3,\"filename\":\"2609.11758v1.pdf\"}}},{\"id\":\"9a75a084-221a-55c4-9d21-f612aa0d5231\",\"version\":9,\"score\":0.65898824,\"payload\":{\"page_content\":\"Kathleen
        C. Fraser\\n1. To what extent is the observed RAG safety decline correlated
        with a model's RAG capability? Previous work suggests that some models which
        appear 'safe' may simply be less capable of extracting and summarizing relevant
        information. We test this rigorously, and hypothesize the following (H1):
        Models which perform better on MIRAGE (benign capability) will also have higher
        accuracy and therefore lower safety in the oracle setting of RAG-Safety-Bench.\\n2.
        Is RAG safety decline a factor of unsafe information or unsafe context drift?
        The conventional view, challenged by An et al. (2025), is that RAG models
        are less safe only when the documents they retrieve are unsafe. An alternative
        explanation is that the increased context length, possibly containing many
        words semantically related to the unsafe query, shift the models into a less-aligned
        domain. 1 Our hypothesis (H2) is that the direct availability of the answer
        (oracle setting) will lead to the\\n1 In fact, this is similar to the intuition
        behind the successful Crescendo jailbreak (Russinovich et al., 2025).\\nhighest
        number of unsafe answers, but that the on-topic setting will lead to a higher
        number of unsafe answers relative to the baseline non-RAG setting, due to
        the destabilizing effect of the harmful-topic context. If the effect is purely
        due to context length, the random setting will lead to an equivalent harmfulness
        rate.\\n3. What is the impact of RAG on the refusal rate of LLMs? In many
        studies, safety is operationalized as refusal: a safe model is one which refuses
        to answer harmful questions. We distinguish between two varieties of refusal;
        namely, unwillingness to fulfill a harmful request versus inability to find
        the answer in the retrieved documents. We hypothesize (H3) that the refusal
        rate for harmful requests will be highest in the random setting, and attributed
        to a lack of information. We argue that this case should be distinguished
        from 'true' model safety, which should rely on an inherent unwillingness to
        provide dangerous advice. At the same time, the oracle setting offers contrasting
        evaluation in which we ensure the model has access to the requested information,
        so refusal can be more clearly interpreted as effective implementation of
        safety guardrails.\\n4. Do different safety evaluators agree on what is safe
        versus harmful? Standard safety evaluation relies on LLM-based 'judges' to
        label text as safe or unsafe. We compare multiple safety evaluators, with
        the hypothesis (H4) that there will be a high level of disagreement between
        the LLM evaluators.\\nRAG-Safety-Bench is freely available for research use
        at the following URL: https://github.com/The-Safe-AI-Lab/ RAG-Safety-Bench
        .\",\"metadata\":{\"ingestion_version\":\"01a0fc5427ea71babb96a22c2c5762f3\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a-text-0004\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a\",\"chunk_type\":\"text\",\"section_path\":\"Kathleen
        C. Fraser\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":16,\"page_no\":2,\"filename\":\"2609.11758v1.pdf\"}}},{\"id\":\"cafdccb5-b9ec-5415-b61c-83903fbcbcf6\",\"version\":9,\"score\":0.6586636,\"payload\":{\"page_content\":\"2
        Related Work\\nRetrieval-augmented generation Enabling LLMs to consult a database
        of trusted documents through retrieval-augmented generation (RAG) has many
        benefits: it reduces hallucination, allows companies to inject proprietary
        knowledge/documents into the system, supports the rapid update of information
        without retraining, and can enable source attribution (Lewis et al., 2020;
        Shuster et al., 2021; Fan et al., 2024). However, it also exposes new attack
        surfaces. Most research on the safety and security of RAG systems has focused
        on the security of the knowledge base: data poisoning attacks involve the
        injection of malicious (mis)information into the document store (Tan et al.,
        2024; Nazary et al., 2025; Zhang et al., 2025), and data extraction attacks
        aim to recover sensitive or private information from the documents through
        a RAG interface (Zeng et al., 2024a; Qi et al., 2024; Vonderhaar et al., 2025).
        However, the safety of RAG systems in non-adversarial settings has been less
        studied. An et al. (2025) were the first to highlight that RAG systems can
        output more harmful responses than non-RAG LLMs, even in the absence of any
        malicious intervention. Other work considers the related problem of safety
        degradation in AI agents that have been enabled with information retrieval
        or search capabilities (Yu et al., 2025; BehnamGhader et al., 2025; Zhan et
        al., 2026). Previous work measures the safety of the entire RAG system, but
        the information content and safety of the retrieved documents is an uncontrolled
        variable. Our work takes the next step towards a more scientific understanding
        of these observed phenomena by systematically altering one variable at a time
        (no retrieval, random retrieval, on-topic retrieval, exact-answer retrieval)
        to observe the effect on the safety of the LLM responses.\\nLong-context safety
        The retrieval of harmful documents is one factor in the observed safety decline
        in RAG models. However, the literature suggests that another factor may be
        a behavioural shift induced by the inclusion of extended context. In fact,
        Yu et al. (2025) claim that 'safety degradation is largely independent of
        retrieved context itself.' An et al. (2025) found that 94.7% of the retrieved
        documents in their study were safe, and therefore could not account for the
        much larger increase in unsafe responses. They hypothesize that the retrieved
        texts, though benign themselves, can trigger the recall of unsafe information
        from the model's parametric knowledge. Other work has shown that LLMs are
        less capable of identifying harmful content in long contexts (Ghorbanpour
        and Fraser, 2025) and are more likely to answer harmful questions in long-context
        settings (Anil et al., 2024; Lu et al., 2025; Huang et al., 2025). In some
        cases, the model can drift away from its default 'helpful assistant' persona
        even when the context itself is not harmful (e.g. a therapy conversation)\\n(Lu
        et al., 2026). Therefore, in this study we design our benchmark to test the
        'harmful documents' and 'long context' explanations separately.\",\"metadata\":{\"ingestion_version\":\"01a0fc5427ea71babb96a22c2c5762f3\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a-text-0005\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a\",\"chunk_type\":\"text\",\"section_path\":\"2
        Related Work\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":24,\"page_no\":2,\"filename\":\"2609.11758v1.pdf\"}}},{\"id\":\"adcb4b3d-d208-561d-857a-7faede832e07\",\"version\":9,\"score\":0.6428615,\"payload\":{\"page_content\":\"5
        Discussion\\nThe core question which motivates this work is whether safe documents
        lead to unsafe RAG generations. One possible explanation for the prior observations
        of unsafe responses in RAG systems is that the incorporation of any long context
        into an LLM can have the effect of shifting its behavior away from the basic,
        short-context regime where most of its safety training took place. However,
        our experiments do not support the conclusion that long context alone is a
        driver of unsafe behavior in RAG systems, with the 'random' condition leading
        to the safest responses, partially through an increase in refusals due to
        lack of information.\\n\",\"metadata\":{\"ingestion_version\":\"01a0fc5427ea71babb96a22c2c5762f3\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a-text-0017\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a\",\"chunk_type\":\"text\",\"section_path\":\"5
        Discussion\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":77,\"page_no\":8,\"filename\":\"2609.11758v1.pdf\"}}},{\"id\":\"31e140e8-eee1-5598-ac2a-c944a55e0cb0\",\"version\":15,\"score\":0.6321409,\"payload\":{\"page_content\":\"Limitations\\nEvaluation
        format differs from training. The RLVR agents were trained to search, read,
        and answer across multiple turns in their own tagged format, whereas our evaluation
        supplies five fixed passages and requests a single citation-bearing response.
        This was necessary for the controlled attribution comparison, but it may affect
        how the agents behave: for example, an agent that would normally issue another
        query may instead abstain. The large differences in abstention and format
        compliance are consistent with this possibility, although our data cannot
        establish the mechanism. An interactive evaluation would be needed to determine
        whether the attribution effect differs in the agents' native search setting.\\nWe
        cannot isolate RL itself. Each agent differs from the baseline in three ways
        at once: it was fine-tuned at all, fine-tuned on retrieval data, and fine-tuned
        with reinforcement learning. Without an arm fine-tuned on the same data without
        RL, our comparison is associational. This is the single most valuable addition
        a follow-up could make.\\nSearch-R1 saw NQ in training. It was trained on
        NQ's training split and we evaluate it on KILTNQ. QAMPARI, HAGRID, and RAGTruth
        are clean for all three agents, and R-Search's pattern is in fact strongest
        away from NQ, but we have not quantified the overlap.\\nThe span always lands
        at the end of the passage. Any positional bias in how models pick citations
        is therefore mixed in with the effect of the plant. Randomizing the injection
        point is the obvious next experiment.\\nCITED-OTHER is underpowered outside
        RAGTruth. NQ, QAMPARI, and HAGRID yield only 13-43 question clusters for this
        variant, too few for intervals we would defend. RAGTruth alone is large enough.\\nWhat
        a flag means. Our scorer is deterministic string matching, so each flag is
        exactly reproducible: the model cited the doctored passage for the aligned
        claim. Reading that as postrationalization is an interpretation we inherit
        from Wallat et al. (2025), and a competing reading exists. After planting,
        the claim's words genuinely sit in the doctored passage, so citing it could
        be scored as obedience to 'answer from the passages' rather than as unfaithfulness.
        Hand-checking a sample of flagged cases would settle how often each reading
        applies, and we have not done it.\\nScope. Three RLVR agents from one line
        of work, one base model, English only, one prompt, one decoding setting. Citation
        behavior may well shift with the prompt, so our numbers describe this setup
        until someone varies it.\",\"metadata\":{\"ingestion_version\":\"01a0fc55257f7276be70b7b3d1501b36\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6-text-0025\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6\",\"chunk_type\":\"text\",\"section_path\":\"Limitations\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":108,\"page_no\":8,\"filename\":\"2609.23053v1.pdf\"}}},{\"id\":\"a547c741-df3f-5865-9981-52ca7db687c7\",\"version\":9,\"score\":0.6320957,\"payload\":{\"page_content\":\"References\\nBang
