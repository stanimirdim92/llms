      a poor retriever might simply miss the relevant unsafe document and therefore
      lead to a misleadingly inflated safety score).\nThe method for constructing
      the benchmark is as follows. We first develop a taxonomy of harmful user queries,
      based on the existing MLCommons AILuminate ''Hazard Taxonomy'' (Ghosh et al.,
      2025). The context of RAG safety evaluation and our intended corpus of Wikipedia
      documents required some modifications to the existing taxonomy. Our current
      version of RAG-SafetyBench excludes the following harm categories: Privacy/identification:
      since our knowledge base is a public resource, we assume it does not contain
      private information (though privacy leakage may be a concern in other RAG use
      cases); Direct generation of harmful content: the focus of the benchmark is
      on question answering, not content generation; Intellectual property: Wikipedia
      users are strictly forbidden from uploading copyrighted material without permission,
      and so it is not a suitable resource to test for intellectual property leakage;
