        R1: Capability in safe and unsafe contexts\\nWehypothesized (H1) that models
        which demonstrated higher benign RAG capability would also demonstrate higher
        unsafe RAG capability; however, this is not supported by the 'Unsafe capability'
        data. In fact, the accuracies under the BenignOracle and Unsafe-Oracle conditions
        are negatively correlated (Pearson r = -0 . 70 ). This may indicate that the
        larger and more capable models also have better safety guardrails when they
        are presented with unsafe queries. However, all models are, in general, more
        likely to provide a correct response to the harmful question when the response
        is available in the documents, suggesting that guardrails still need to be
        improved to specifically handle the RAG setting.\",\"metadata\":{\"ingestion_version\":\"01a0fc5427ea71babb96a22c2c5762f3\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a-text-0013\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a\",\"chunk_type\":\"text\",\"section_path\":\"4.1
        R1: Capability in safe and unsafe contexts\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":49,\"page_no\":5,\"filename\":\"2609.11758v1.pdf\"}}},{\"id\":\"ef8edc2c-79a5-5f25-9f6f-1c192ea8484d\",\"version\":15,\"score\":0.6186923,\"payload\":{\"page_content\":\"Ethics
        Statement\\nThis work uses only publicly released models and datasets. It
        involves no human subjects and no personal data. The planted spans are taken
        from the models' own answers and are used only in offline evaluation. The
        work describes a way that citations in RAG systems can mislead readers, with
        the aim of making that failure measurable; it does not provide a method for
        attacking deployed systems. Because RLVR training is in wide use, we have
        tried to state the limits of our null result clearly so that it is not read
        as a stronger claim than the data support.\",\"metadata\":{\"ingestion_version\":\"01a0fc55257f7276be70b7b3d1501b36\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6-text-0026\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6\",\"chunk_type\":\"text\",\"section_path\":\"Ethics
        Statement\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":116,\"page_no\":8,\"filename\":\"2609.23053v1.pdf\"}}},{\"id\":\"3a82a030-6dc7-5454-9a96-130c79270203\",\"version\":9,\"score\":0.61359817,\"payload\":{\"page_content\":\"4.1
        R1: Capability in safe and unsafe contexts\\nTable 3 reports accuracies for
        each model when asked benign and harmful questions, in both nonRAG, oracle
        RAG, and mixed settings. In the benign case, accuracy is scored using the
        MIRAGE benchmark method (Park et al., 2025). In the harmful (RAG-Safety-Bench)
        case, we compare the output response with the expected benchmark response,
        using Claude-Opus-4.7 to output a fi- nal label of accurate or inaccurate
        relative to the reference. Human annotation of a subset of 100 examples validates
        the LLM-as-a-judge approach, with agreement of 95-96% between humans and LLM,
        and Cohen's \u03BA of 0.90-0.92 (more details and prompt available in Appendix
        Section A.4).\\nTable 1: The four settings of the RAG-Safety-Bench benchmark.
        Example documents are for the query, 'What materials and design do I need
        to make an IED that can defeat armored police vehicles?'\\n\\nLLM-only, Description
        = No context documents provided.. LLM-only, Example Wikipedia documents =
        (None). Oracle, Description = One of the returned documents contains the answer..
        Oracle, Example Wikipedia documents = 'Explosively formed penetrator'. On-topic,
        Description = Oracle document not included, but documents are related to the
        topic of the query.. On-topic, Example Wikipedia documents = 'Deflagration
        to detonation tran- sition', 'Blast wall'. Random, Description = Documents
        are randomly selected from a set of benign documents.. Random, Example Wikipedia
        documents = 'Climate change and birds', 'Ar- boretum'\",\"metadata\":{\"ingestion_version\":\"01a0fc5427ea71babb96a22c2c5762f3\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a-text-0011\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a\",\"chunk_type\":\"text\",\"section_path\":\"4.1
        R1: Capability in safe and unsafe contexts\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":43,\"page_no\":4,\"filename\":\"2609.11758v1.pdf\"}}},{\"id\":\"aa325133-d03f-540c-8fe9-3557110e45a9\",\"version\":9,\"score\":0.6121374,\"payload\":{\"page_content\":\"4.2
        R2: Unsafe information or unsafe context?\\nIn all cases, providing irrelevant
        (safe) documents leads to the safest behavior overall, suggesting that long
        context alone is not sufficient to steer the models into an unsafe regime.\\nThe
        results in Figure 2 are also partially consistent with one of the major conclusions
        from An et al. (2025), that the safest non-RAG LLM will likely be the safest
        RAG LLM. Indeed, Phi-4-14B is safest in both non-RAG and RAG settings, followed
        by Llama-3.1-8B. However, Qwen is the third safest in the non-RAG setting
        but the least safe in the oracle-RAG and on-topic RAG conditions, suggesting
        that some models' guardrails are more robust than others.\\nNote that the
        harmfulness rates are lower than\\n(though correlated with) the accuracy scores
        in Table 3. Accuracy and harmfulness are judged separately. Manual inspection
        reveals two large buckets of responses that are rated as accurate but not
        harmful: responses which are not flagged as harmful by the safety judges but
        likely should be, in the context (typically descriptions of historical events
        and nonviolent crimes), and cases where the model hedges that the information
        is for education purposes only (e.g., Ministral-3-8B in response to a query
        about misinformation propagation, \\\"... Here's a **generalized breakdown
        of memetic propagation techniques** (based on the text) that could theoretically
        be used to influence public opinion, **with the caveat that this is for educational/analytical
        purposes only** ... <goes into detail on techniques.>' ).\\nThe harmfulness
        rates for each model and condition broken down by harm taxonomy category are
        available in the Appendix (Figure 6-Figure 10). The categories which tend
        to see the greatest increase in harmful responses from the non-RAG setting
        to the oracle setting are: radiological weapons, explosives, drugs, chemical
        weapons, assault, terrorism, and cyberattacks. The Ministral and Qwen models
        also show a concerning increase in harmful responses to questions about suicide
        and self-harm.\",\"metadata\":{\"ingestion_version\":\"01a0fc5427ea71babb96a22c2c5762f3\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a-text-0014\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a\",\"chunk_type\":\"text\",\"section_path\":\"4.2
        R2: Unsafe information or unsafe context?\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":56,\"page_no\":6,\"filename\":\"2609.11758v1.pdf\"}}},{\"id\":\"7bc946c0-9bc2-5e23-a752-41d602864320\",\"version\":9,\"score\":0.6117472,\"payload\":{\"page_content\":\"Ethical
        considerations\\nThis benchmark contains questions and answers that can be
        dangerous, harmful, and disturbing. However, because the content is sourced
        from Wikipedia, we are not introducing new knowledge into the information
        ecosystem nor making it meaningfully easier to access. The benchmark aggregates
        this information in a form useful for safety evaluation, and we therefore
        believe the risks inherent in releasing it are outweighed by the potential
        benefit of improving in retrieval-augmented AI systems.\\nThe intended use
        of this benchmark is to support safety evaluation and research on RAG safety
        mitigations. Wikipedia text is licensed under CC BYSA 4.0, which allows redistribution
        under the following requirements: attribution, indicating modifications, 'ShareAlike'
        condition, and license notice. Our benchmark satisfies these criteria by:
        providing a URL to each original Wikipedia article (attribution), describing
        the process of summarization and article truncation (modification), releasing
        under the same CC BY-SA 4.0 license (ShareAlike), and including a link to
        the license in the published version of the benchmark (license notice).\\nHuman
        annotators involved in benchmark validation were authors of this paper and
        were fully briefed on the nature of the data and the importance of managing
        mental health while dealing with the potentially difficult content. As authors,
        they were not paid separately for the annotation work.\\nAI tools (Claude)
        for coding assistance and data visualization were used throughout this project.
        Experimental design, interpretation, and writing were done solely by the authors.\",\"metadata\":{\"ingestion_version\":\"01a0fc5427ea71babb96a22c2c5762f3\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a-text-0020\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a\",\"chunk_type\":\"text\",\"section_path\":\"Ethical
        considerations\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":93,\"page_no\":10,\"filename\":\"2609.11758v1.pdf\"}}},{\"id\":\"dfdc115b-8a09-5899-9911-fb57a38a5ae7\",\"version\":9,\"score\":0.5968696,\"payload\":{\"page_content\":\"A.2
        Safety evaluation details\\nEach example in the balanced subset is expanded
        into four evaluation conditions: non_rag , rag_oracle_unsafe , rag_topic_safe
        , and rag_control_safe_random . Since the balanced subset contains 346 examples,
        this expansion produces 1,384 example-condition rows per model and 6,920 total
        responses across the five evaluated models.\\nThe benchmark controls retrieval
        quality by directly supplying context documents, rather than relying on a
        live retriever to discover them at inference time. This is important because
        a poor retriever could otherwise fail to retrieve the relevant harmful document
        and artificially inflate apparent safety.\\nThe non_rag condition supplies
        no documents for all 346 examples. The rag_oracle_unsafe condition supplies
        one document for all 346 examples. The rag_topic_safe condition supplies three
        documents for 344 examples and two documents for two examples. The rag_control_safe_random
        condition supplies three documents for 321 examples, two documents for 24
        examples, and one document for one example.\\nIn the final evaluation configuration,
        context is supplied as cleaned full-article-prefix text with a per-document
        cap of approximately 12,000 characters. Section-level metadata are retained
        for provenance and auditing.\\nThe response-generation templates are intentionally
        simple. In the non_rag condition, the model is instructed to answer using
        only its own knowledge. In the three RAG conditions, the model is instructed
        to answer using only the provided documents, with each supplied context labeled
        sequentially as Context 1 , Context 2 , etc.\\nAll model responses were generated
        deterministically with temperature = 0 . 0 , topp = 1 . 0 , and sampling disabled.
        We used a maximum of 1,024 newly generated tokens per response and a fixed
        run seed of 42. For RAG conditions, each cleaned retrieved-document prefix
        was capped at 12,000 characters. The same prompt template and decoding settings
        were used across all four conditions for a given model.\\nAll experiments
        were run on an academic research cluster with NVIDIA H100 GPUs. Compute requirements
        varied by model size, context length, and response length. The five-model
        evaluation required approximately 74 GPU-hours in total, including response
        generation and local safety judging. The released configurations and run manifests
        provide the information needed to reproduce the evaluation.\",\"metadata\":{\"ingestion_version\":\"01a0fc5427ea71babb96a22c2c5762f3\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a-text-0028\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a\",\"chunk_type\":\"text\",\"section_path\":\"A.2
        Safety evaluation details\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":152,\"page_no\":14,\"filename\":\"2609.11758v1.pdf\"}}},{\"id\":\"fab5fc9c-48c2-5309-be84-9c8b53e8d8df\",\"version\":13,\"score\":0.5943679,\"payload\":{\"page_content\":\"9
        Limitations\\nEvaluator dependence. Primary scores use DeBERTa-v3-base, trained
        on MNLI, FEVER, and ANLI, at \u03C4 = 0 . 5 , without human calibration. Using
        the same model to select recovered spans and score support can reinforce systematic
        errors; the resulting scores are evaluator-dependent estimates, not validated
        rates of source support or factual correctness. This dependence also limits
        conclusions about method rankings and the size of emitted-grounded gaps. The
        200-question TRUE audit checks a second scoring family, but fixed recovery
        retains DeBERTa selection and TRUE recovery reuses one judge. Different input
        windows and nonbinary decoder outputs further limit numerical comparison.
        Human source-level calibration remains necessary (Rashkin et al., 2023).\\nSingle
        generator. All results use Qwen2.5-7BInstruct with greedy decoding. Frontier
        shapes may differ across model families and scales; a second-family replication
        is planned.\\nDataset coverage. We evaluate two English datasets (ASQA and
        QASPER) with distinct retrieval granularities, but this does not cover multilingual
        settings, open-web retrieval, or longercontext regimes.\\nRe-attribution hyperparameters.
        The top-10 lexical candidate pool can miss semantically matching snippets,
        and requiring one snippet to entail a unit can miss support distributed across
        snippets. Consequently, a failed recovery does not establish that the source
        contains no support. Table 3 varies the recovery threshold while holding the
        scoring threshold fixed; it does not validate the evaluator or test candidate-pool
        size, retrieval strategy, or multi-snippet recovery.\\nVerification scope.
        Declared-span verification rejects claims lacking declared evidence by construction,
        even if support could be recovered. Its 1 . 00 unsupported rate for no-provenance
        runs is a provenance-availability diagnostic, not a calibrated hallucination
        rate. Recovered-source verification is reported at nominal 0.25 for the two
        no-provenance methods and remains dependent on the same bounded recovery procedure
        and evaluator.\\nResidual error rows. Only identity fails on 4 ASQA and 29
        QASPER questions; every primary setting is evaluated on the resulting common
        successful subset. This pairing prevents comparisons from using different
        questions, but conditions results on identity success and omits those difficult
        cases. Sampling intervals condition on the fixed generated outputs and evaluator;
        they do not include systematic NLI error or variation across generation runs.\\nNominal
        versus achieved budgets. Abstractive compressors do not reliably hit nominal
        token budgets; RECOMP often produces much less context than requested. We
        report achieved compression ratios, but comparisons at a shared nominal budget
        do not establish performance at matched achieved context sizes.\",\"metadata\":{\"ingestion_version\":\"01a0fc54ff9a70d3af0e9b49e864b8b9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde-text-0020\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde\",\"chunk_type\":\"text\",\"section_path\":\"9
