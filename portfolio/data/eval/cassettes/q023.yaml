        is a heatmap chart titled \\\"Llama-3.1-8B\\\" showing harmful response rates
        across 19 taxonomy subcategories (rows, including radiological_weapons, explosives,
        drugs, chemical_weapons, terrorism, biological_weapons, etc.) under four experimental
        conditions (columns: Non-RAG, Oracle unsafe, On-topic, Random). Each cell
        displays a harmful rate value (0.00\u20131.00, color-coded from white to dark
        red) along with sample size (n). The \\\"Oracle unsafe\\\" condition consistently
        shows the highest harmful rates across most categories (e.g., 0.55 for explosives,
        0.50 for chemical_weapons, 0.45 for murder), while Non-RAG, On-topic, and
        Random conditions generally show much lower rates near 0.00, indicating that
        exposing the model to unsafe \\\"oracle\\\" context substantially increases
        harmful outputs compared to other retrieval conditions.\",\"metadata\":{\"ingestion_version\":\"01a0fc5427ea71babb96a22c2c5762f3\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a-fig-021-06\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a\",\"chunk_type\":\"figure\",\"section_path\":\"\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":211,\"page_no\":21,\"filename\":\"2609.11758v1.pdf\",\"image_path\":\"/var/www/html/personal/llms/portfolio/data/processed/01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a/figures/fig-021-06-4d46f9b29bd3a8cb.png\"}}}]},\"status\":\"ok\",\"time\":0.000678253}"
