        8: Harmfulness rate (majority vote) per harm category for Ministral-3-8B.\\nOn-topic\\nCondition
        Condition\\nFigure 9: Harmfulness rate (majority vote) per harm category for
        Phi-4-14B.\\nFigure 10: Harmfulness rate (majority vote) per harm category
