      string: "{\"result\":{\"points\":[{\"id\":\"d8117747-1c74-59a9-92ec-afe458058070\",\"version\":9,\"score\":0.38181022,\"payload\":{\"page_content\":\"4.4
        R4: Subjectivity of harm\\nFigure 4 presents the Cohen's Kappa scores for
        inter-annotator agreement. LlamaGuard and WildGuard have an agreement of 0.66,
        indicating substantial agreement. The other pairwise comparisons between the
        LLM safety judges are 0.47 and 0.48, indicating only moderate agreement. In
        general, our hypothesis H4 that the automated safety evaluators will disagree
        on many cases is supported. We additionally include the evaluation of whether
        the answer was judged to be accurate, compared to the reference answer. The
        accuracy measure agrees most with the safety ratings of WildGuard with \u03BA
        = 0 . 67 . These results highlight that different methods of evaluating safety
        versus harm may lead to different interpretations of the same phenomenon.
        Overall, the four-way Fleiss's kappa is 0.56, indicating only moderate agreement.
        However, Figure 5 in the Appendix, which provides a more detailed view of
        the safety evaluations, suggests that even when the absolute numbers differ,
        when averaged over a large number of samples, the trends observed using each
        of the evaluation methods remain generally consistent.\\nTo explore the differences
        between automated safety evaluators further, Table 4 presents a finegrained
        analysis of the predicted positive rate for each evaluator on each sub-category
        of the RAGSafety-Bench benchmark, averaged over all generating models. When
        averaged over all models and conditions, the predicted positive rate of the
        evaluators is similar (14% for LlamaGuard, 17% for ShieldGemma, and 20% for
        WildGuard). However, each evaluator is more sensitive to certain subcategories
        of harm. For example, LlamaGuard flags responses less often than the other
        two evaluators Cohen's K\\nFigure 3: Refusal behaviors by model and condition.\\nFigure
        4: Pairwise Cohen's Kappa scores for each automated safety judge, as well
        as four-way Fleiss's Kappa.\\nin categories like assault/battery and drugs.
        ShieldGemma flags far fewer responses in the subcategories of cyberattacks
        and financial crimes, while flagging more often in categories like chemical
        weapons, radiological weapons, and explosives. WildGuard is more sensitive
        to subcategories like hate speech and sexual harassment.\",\"metadata\":{\"ingestion_version\":\"01a0fc5427ea71babb96a22c2c5762f3\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a-text-0016\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a\",\"chunk_type\":\"text\",\"section_path\":\"4.4
        R4: Subjectivity of harm\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":69,\"page_no\":7,\"filename\":\"2609.11758v1.pdf\"}}},{\"id\":\"c5ad079d-2174-562b-a2c7-cfb5337eb098\",\"version\":9,\"score\":0.37731314,\"payload\":{\"page_content\":\"This
        is a heatmap (confusion matrix-style chart) displaying pairwise rater agreement
        using Cohen's \u03BA among four raters/models: Llama-Guard, WildGuard, ShieldGemma,
        and Accuracy. The overall Fleiss' \u03BA is 0.56 (n=6920), indicating moderate
        agreement. The diagonal shows perfect agreement (1.00), while off-diagonal
        values range from 0.47 to 0.67, with WildGuard and Accuracy showing the highest
        pairwise agreement (0.67) and Llama-Guard/ShieldGemma and ShieldGemma/Accuracy
        showing lower agreement (0.48\u20130.49); the color scale ranges from 0 to
        1.0 (yellow to dark red).\",\"metadata\":{\"ingestion_version\":\"01a0fc5427ea71babb96a22c2c5762f3\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a-fig-008-03\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a\",\"chunk_type\":\"figure\",\"section_path\":\"\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":73,\"page_no\":8,\"filename\":\"2609.11758v1.pdf\",\"image_path\":\"/var/www/html/personal/llms/portfolio/data/processed/01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a/figures/fig-008-03-209562886654c9ad.png\"}}},{\"id\":\"f4cff338-5407-561d-818f-d98dcc9d9e51\",\"version\":9,\"score\":0.37192795,\"payload\":{\"page_content\":\"References\\n-
        Aaron Grattafiori, Abhimanyu Dubey, Abhinav Jauhri, Abhinav Pandey, Abhishek
        Kadian, Ahmad AlDahle, Aiesha Letman, Akhil Mathur, Alan Schelten, Alex Vaughan,
        and 1 others. 2024. The llama 3 herd of models. In Neural Information Processing
        Systems .\\n- Seungju Han, Kavel Rao, Allyson Ettinger, Liwei Jiang, Bill
        Yuchen Lin, Nathan Lambert, Yejin Choi, and Nouha Dziri. 2024. Wildguard:
        Open one-stop moderation tools for safety risks, jailbreaks, and refusals
        of LLMs. Advances in neural information processing systems , 37:8093-8131.\\n-
        Mianqiu Huang, Xiaoran Liu, Shaojun Zhou, Mozhi Zhang, Qipeng Guo, Linyang
        Li, Pengyu Wang, Yang Gao, Chenkun Tan, Linlin Li, and 1 others. 2025. LongSafety:
        Enhance safety for long-context LLMs. In Proceedings of the The First Workshop
        on LLM Security (LLMSEC) , pages 26-47.\\n- Hakan Inan, Kartikeya Upasani,
        Jianfeng Chi, Rashi Rungta, Krithika Iyer, Yuning Mao, Michael Tontchev, Qing
        Hu, Brian Fuller, Davide Testuggine, and 1 others. 2023. Llama guard: LLM-based
        inputoutput safeguard for human-AI conversations. arXiv preprint arXiv:2312.06674
