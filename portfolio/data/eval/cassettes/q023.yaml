      Zeyuan Allen-Zhu, Yuanzhi Li, Shean Wang, Liang Wang, Weizhu Chen, and 1 others.
      2022. Lora: Low-rank adaptation of large language models. Iclr , 1(2):3.\nHao
      Hu, Yifan Feng, Ruoxue Li, Rundong Xue, Xingliang Hou, Zhiqiang Tian, Yue Gao,
      and Shaoyi Du. 2026. Cog-rag: Cognitive-inspired dual-hypergraph with theme
      alignment retrievalaugmented generation. In Proceedings of the AAAI Conference
      on Artificial Intelligence , volume 40, pages 31032-31040.", "V. CONCLUSION\nWe
      measured how a 4-bit Llama 3.1 8B model behaves when its retrieved context is
      poisoned, across three corruption strategies and four poisoning levels in a
      588-run sweep. Accuracy falls from 77.9% to 43.5% as corruption goes from none
      to total. Entity swap flips the most answers. Numeric corruption shows a majority-leaning
      jump once two of three passages are poisoned, with a bootstrap interval on that
      jump that excludes zero but remains wide. The model''s main recorded response
      to attack is to abstain rather than to state a wrong answer, and the lexical-overlap
      proxy of unsupported generation falls under poisoning rather than rising.\nThe
      study has clear limits. It covers one small quantized model on a compact query
      set with rule-based corruption, so the absolute numbers should not be read as
      universal. Retrieval is shared across the pair, but decoding is not locked (temperature
      0.1, two independent generations), and the 0 / 3 residual shows that background
      pair noise is non-trivial. Keyword matching is a weak correctness criterion,
      and the overlap proxy is not a semantic faithfulness judge. The added passages
      make retrieval easier than raw FEVER evidence would. Each limit points to a
      concrete next step: lock decoding seeds across the pair and add multi-seed and
      multi-corruption repeats with hierarchical resampling, replace keyword checks
      with structured FEVER-style labels and normalized entity or quantity scoring,
      adjudicate a stratified sample with blinded humans or a validated entailment
      model, and decompose answers into atomic claims so poison adoption can be separated
      from unsupported generation. We also plan to repeat the sweep on a larger instruction-tuned
      model and on a second corpus, to replace rule-based edits with model-generated
