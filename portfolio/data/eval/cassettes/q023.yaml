    body: '{"query": "What agreement is reported between LlamaGuard and WildGuard?",
      "documents": ["4.4 R4: Subjectivity of harm\nFigure 4 presents the Cohen''s
      Kappa scores for inter-annotator agreement. LlamaGuard and WildGuard have an
      agreement of 0.66, indicating substantial agreement. The other pairwise comparisons
      between the LLM safety judges are 0.47 and 0.48, indicating only moderate agreement.
      In general, our hypothesis H4 that the automated safety evaluators will disagree
      on many cases is supported. We additionally include the evaluation of whether
      the answer was judged to be accurate, compared to the reference answer. The
      accuracy measure agrees most with the safety ratings of WildGuard with \u03ba
      = 0 . 67 . These results highlight that different methods of evaluating safety
      versus harm may lead to different interpretations of the same phenomenon. Overall,
      the four-way Fleiss''s kappa is 0.56, indicating only moderate agreement. However,
      Figure 5 in the Appendix, which provides a more detailed view of the safety
      evaluations, suggests that even when the absolute numbers differ, when averaged
      over a large number of samples, the trends observed using each of the evaluation
      methods remain generally consistent.\nTo explore the differences between automated
      safety evaluators further, Table 4 presents a finegrained analysis of the predicted
      positive rate for each evaluator on each sub-category of the RAGSafety-Bench
      benchmark, averaged over all generating models. When averaged over all models
      and conditions, the predicted positive rate of the evaluators is similar (14%
      for LlamaGuard, 17% for ShieldGemma, and 20% for WildGuard). However, each evaluator
      is more sensitive to certain subcategories of harm. For example, LlamaGuard
      flags responses less often than the other two evaluators Cohen''s K\nFigure
      3: Refusal behaviors by model and condition.\nFigure 4: Pairwise Cohen''s Kappa
      scores for each automated safety judge, as well as four-way Fleiss''s Kappa.\nin
      categories like assault/battery and drugs. ShieldGemma flags far fewer responses
      in the subcategories of cyberattacks and financial crimes, while flagging more
      often in categories like chemical weapons, radiological weapons, and explosives.
      WildGuard is more sensitive to subcategories like hate speech and sexual harassment.",
      "This is a heatmap (confusion matrix-style chart) displaying pairwise rater
      agreement using Cohen''s \u03ba among four raters/models: Llama-Guard, WildGuard,
      ShieldGemma, and Accuracy. The overall Fleiss'' \u03ba is 0.56 (n=6920), indicating
      moderate agreement. The diagonal shows perfect agreement (1.00), while off-diagonal
      values range from 0.47 to 0.67, with WildGuard and Accuracy showing the highest
      pairwise agreement (0.67) and Llama-Guard/ShieldGemma and ShieldGemma/Accuracy
      showing lower agreement (0.48\u20130.49); the color scale ranges from 0 to 1.0
      (yellow to dark red).", "References\n- Aaron Grattafiori, Abhimanyu Dubey, Abhinav
      Jauhri, Abhinav Pandey, Abhishek Kadian, Ahmad AlDahle, Aiesha Letman, Akhil
      Mathur, Alan Schelten, Alex Vaughan, and 1 others. 2024. The llama 3 herd of
      models. In Neural Information Processing Systems .\n- Seungju Han, Kavel Rao,
      Allyson Ettinger, Liwei Jiang, Bill Yuchen Lin, Nathan Lambert, Yejin Choi,
      and Nouha Dziri. 2024. Wildguard: Open one-stop moderation tools for safety
      risks, jailbreaks, and refusals of LLMs. Advances in neural information processing
      systems , 37:8093-8131.\n- Mianqiu Huang, Xiaoran Liu, Shaojun Zhou, Mozhi Zhang,
      Qipeng Guo, Linyang Li, Pengyu Wang, Yang Gao, Chenkun Tan, Linlin Li, and 1
      others. 2025. LongSafety: Enhance safety for long-context LLMs. In Proceedings
      of the The First Workshop on LLM Security (LLMSEC) , pages 26-47.\n- Hakan Inan,
      Kartikeya Upasani, Jianfeng Chi, Rashi Rungta, Krithika Iyer, Yuning Mao, Michael
      Tontchev, Qing Hu, Brian Fuller, Davide Testuggine, and 1 others. 2023. Llama
      guard: LLM-based inputoutput safeguard for human-AI conversations. arXiv preprint
      arXiv:2312.06674 .\n- Patrick Lewis, Ethan Perez, Aleksandra Piktus, Fabio Petroni,
      Vladimir Karpukhin, Naman Goyal, Heinrich K\u00fcttler, Mike Lewis, Wen-tau
      Yih, Tim Rockt\u00e4schel, and 1 others. 2020. Retrieval-augmented generation
      for knowledge-intensive NLP tasks. Advances in neural information processing
      systems , 33:9459-9474.\n- Christina Lu, Jack Gallagher, Jonathan Michala, Kyle
      Fish, and Jack Lindsey. 2026. The assistant axis: Situating and stabilizing
      the default persona of language models. arXiv preprint arXiv:2601.10387 .\n-
      Yida Lu, Jiale Cheng, Zhexin Zhang, Shiyao Cui, Cunxiang Wang, Xiaotao Gu, Yuxiao
      Dong, Jie Tang, Hongning Wang, and Minlie Huang. 2025. LongSafety: Evaluating
      long-context safety of large language models. In Proceedings of the 63rd Annual
      Meeting of the Association for Computational Linguistics (Volume 1: Long Papers)
      , pages 3170531725.\n- Mantas Mazeika, Long Phan, Xuwang Yin, Andy Zou, Zifan
      Wang, Norman Mu, Elham Sakhaee, Nathaniel Li, Steven Basart, Bo Li, and 1 others.
      2024. HarmBench: a standardized evaluation framework for automated red teaming
      and robust refusal. In Proceedings of the 41st International Conference on Machine
      Learning , pages 35181-35224.", "3.3 Automated safety judges\nWe compare three
      available LLM safety judges: Meta''s LlamaGuard-3-8B (Inan et al., 2023; Grattafiori
      et al., 2024) Google''s ShieldGemma2B (Zeng et al., 2024b), and Allen AI''s
      WildGuard (Han et al., 2024). LlamaGuard produces a binary ''safe'' or ''unsafe''
      output, according to the MLCommons Hazard taxonomy. ShieldGemma produces a per-policy
      classification across four safety policies (Dangerous Content, Harassment, Hate
      Speech, Sexually Explicit); we assess harmfulness across all four policies and
      return a label of ''unsafe'' if any of the four exceed a probability of 0.5.
      WildGuard is trained to detect four broad categories of harm (Privacy, Misinformation,
      Harmful language, and Malicious uses) and assesses responses for both refusal
      and harmfulness; we consider the (binary) harmfulness label assigned to the
      response.\nFor each response, an overall label of ''unsafe'' is assigned when
      at least two of the three safety evaluators flag the response as unsafe. We
      compute pairwise inter-annotator agreement of the evaluators using Cohen''s
      Kappa.", "2 Related Work\nLLMsafety evaluation Evaluating open-ended text responses
      for safety is a challenging task. In many cases, refusal is considered a proxy
      for safety (Vidgen et al., 2023; Sun et al., 2023; Wang et al., 2024a; Bianchi
      et al., 2023; Mazeika et al., 2024; Xie et al., 2025), though refusal itself
      can take many forms (Wang et al., 2024b). Other work uses supervised or LLM-based
      classifiers to label outputs as ''safe'' or ''unsafe'', according to some definition
      of safety (often grounded in a terms and conditions document or other regulatory
      framework). Commonly used examples of safety classifiers include Llama-Guard
      (Inan et al., 2023), Shield-Gemma (Zeng et al., 2024b), and WildGuard (Han et
      al., 2024). The current work considers refusals, safety classifiers, and the
      accuracy of the information in the responses as correlated but distinct signals.",
