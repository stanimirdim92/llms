      Hsiang Low, and Paul Pu Liang. 2025. Mem1: Learning to synergize memory and
      reasoning for efficient long-horizon agents. arXiv preprint arXiv:2506.15841
      .", "In RAG We Trust? Measuring Robustness of Retrieval-Augmented Generation
      Under Document Poisoning\nIliano Fasolino Department of Computer Science University
      of Milan Milan, Italy\nAbstract -Retrieval-augmented generation (RAG) grounds
      a language model in retrieved documents, which reduces hallucination but creates
      a new attack surface: if retrieved text is tampered with, the model may repeat
      the falsehood. We study how much a small quantized model, Llama 3.1 8B, degrades
      when a fraction of its retrieved context is poisoned. Three corruption strategies
      are tested, entity swap, number swap, and negation, each applied to zero, one,
      two, or three of the three retrieved passages, over a factorial sweep of 588
      runs on a fact-checking task built from FEVER. Accuracy falls from 77.9% on
      clean context to 43.5% when all three passages are corrupted. Entity swap flips
      the largest share of answers that were correct on clean context. Number-based
      corruption stays flat while poisoned passages are a minority and jumps once
      they form a majority, a pattern we re-check with query-level bootstrap intervals.
      The model rarely invents new falsehoods; its dominant reaction is to abstain,
      and a lexical overlap proxy of unsupported generation falls under attack rather
      than rising. The study is a small-scale measurement with coarse automated labels;
      we treat the strategy contrasts as suggestive until decoding is controlled and
      stronger adjudication is in place.\na practitioner running a small model on
      modest hardware is a concrete measurement: how far does accuracy fall, which
      kind of corruption bites hardest, and does the model fail loudly by fabricating
      or quietly by refusing.\nIndex Terms -retrieval-augmented generation, large
      language models, adversarial robustness, document poisoning, fact verification",
      "References\nShuai Bai, Yuxuan Cai, Ruizhe Chen, Keqin Chen, Xionghui Chen,
