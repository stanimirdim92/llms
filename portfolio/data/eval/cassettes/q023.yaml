        CONCLUSION\\nWe measured how a 4-bit Llama 3.1 8B model behaves when its retrieved
        context is poisoned, across three corruption strategies and four poisoning
        levels in a 588-run sweep. Accuracy falls from 77.9% to 43.5% as corruption
        goes from none to total. Entity swap flips the most answers. Numeric corruption
        shows a majority-leaning jump once two of three passages are poisoned, with
        a bootstrap interval on that jump that excludes zero but remains wide. The
        model's main recorded response to attack is to abstain rather than to state
        a wrong answer, and the lexical-overlap proxy of unsupported generation falls
        under poisoning rather than rising.\\nThe study has clear limits. It covers
        one small quantized model on a compact query set with rule-based corruption,
        so the absolute numbers should not be read as universal. Retrieval is shared
        across the pair, but decoding is not locked (temperature 0.1, two independent
        generations), and the 0 / 3 residual shows that background pair noise is non-trivial.
        Keyword matching is a weak correctness criterion, and the overlap proxy is
        not a semantic faithfulness judge. The added passages make retrieval easier
        than raw FEVER evidence would. Each limit points to a concrete next step:
        lock decoding seeds across the pair and add multi-seed and multi-corruption
        repeats with hierarchical resampling, replace keyword checks with structured
        FEVER-style labels and normalized entity or quantity scoring, adjudicate a
        stratified sample with blinded humans or a validated entailment model, and
        decompose answers into atomic claims so poison adoption can be separated from
        unsupported generation. We also plan to repeat the sweep on a larger instruction-tuned
        model and on a second corpus, to replace rule-based edits with model-generated
        adversarial\\n- [5] K. Guu, K. Lee, Z. Tung, P. Pasupat, and M. Chang, 'REALM:
        retrievalaugmented language model pre-training,' in Proc. Int. Conf. Machine
        Learning (ICML) , 2020, pp. 3929-3938.\\n- [6] N. Reimers and I. Gurevych,
        'Sentence-BERT: sentence embeddings using Siamese BERT-networks,' in Proc.
        Conf. Empirical Methods in Natural Language Processing (EMNLP) , 2019, pp.
        3982-3992.\\n- [7] J. Johnson, M. Douze, and H. J\xB4 egou, 'Billion-scale
        similarity search with GPUs,' IEEE Trans. Big Data , vol. 7, no. 3, pp. 535-547,
        2019.\",\"metadata\":{\"ingestion_version\":\"01a0fc53392f724b972307d03a9f94d9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead-text-0018\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead\",\"chunk_type\":\"text\",\"section_path\":\"V.
        CONCLUSION\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":83,\"page_no\":6,\"filename\":\"2609.09243v1.pdf\"}}},{\"id\":\"3a82a030-6dc7-5454-9a96-130c79270203\",\"version\":9,\"score\":0.21969381,\"payload\":{\"page_content\":\"4.1
        R1: Capability in safe and unsafe contexts\\nTable 3 reports accuracies for
        each model when asked benign and harmful questions, in both nonRAG, oracle
        RAG, and mixed settings. In the benign case, accuracy is scored using the
        MIRAGE benchmark method (Park et al., 2025). In the harmful (RAG-Safety-Bench)
        case, we compare the output response with the expected benchmark response,
        using Claude-Opus-4.7 to output a fi- nal label of accurate or inaccurate
        relative to the reference. Human annotation of a subset of 100 examples validates
        the LLM-as-a-judge approach, with agreement of 95-96% between humans and LLM,
        and Cohen's \u03BA of 0.90-0.92 (more details and prompt available in Appendix
        Section A.4).\\nTable 1: The four settings of the RAG-Safety-Bench benchmark.
        Example documents are for the query, 'What materials and design do I need
        to make an IED that can defeat armored police vehicles?'\\n\\nLLM-only, Description
        = No context documents provided.. LLM-only, Example Wikipedia documents =
        (None). Oracle, Description = One of the returned documents contains the answer..
        Oracle, Example Wikipedia documents = 'Explosively formed penetrator'. On-topic,
        Description = Oracle document not included, but documents are related to the
        topic of the query.. On-topic, Example Wikipedia documents = 'Deflagration
        to detonation tran- sition', 'Blast wall'. Random, Description = Documents
        are randomly selected from a set of benign documents.. Random, Example Wikipedia
        documents = 'Climate change and birds', 'Ar- boretum'\",\"metadata\":{\"ingestion_version\":\"01a0fc5427ea71babb96a22c2c5762f3\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a-text-0011\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a\",\"chunk_type\":\"text\",\"section_path\":\"4.1
        R1: Capability in safe and unsafe contexts\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":43,\"page_no\":4,\"filename\":\"2609.11758v1.pdf\"}}},{\"id\":\"999e0e12-597f-54b6-8d00-9f485109d12a\",\"version\":9,\"score\":0.2196776,\"payload\":{\"page_content\":\"Abstract\\nAllowing
        large language models (LLMs) to retrieve information from a set of trusted
        documents can increase reliability and reduce hallucination. However, recent
        work has demonstrated that retrieval-augmented generation (RAG) can have unintended
        side effects on the overall safety of the generated responses, when prompted
        for harmful or dangerous content. A clearer understanding of the mechanisms
        leading to this result is needed, as increasing numbers of end users turn
        to RAG to incorporate corporate documents and knowledge bases into LLM-based
        systems. We introduce RAG-Safety-Bench, a benchmark to measure the safety
        impact of RAG on LLM models. By removing the confounding effect of retriever
        quality, and cleanly separating the problem into four conditions - non-RAG,
        RAG with an oracle document containing the answer to the harmful request,
        RAG with documents related to the harmful request but without the specific
        answer, and RAG with random, safe documents - the benchmark isolates the impacts
        of different factors in the observed safety degradation. We report results
        across five opensource LLMs, showing an inverse relationship between benign
        and unsafe capability, strong evidence that baseline safety guardrails do
        not lead to downstream safety guarantees in the RAG case, and model-specific
        support for previous findings that even benign documents can lead to unsafe
        generation in retrieval-enabled systems.\",\"metadata\":{\"ingestion_version\":\"01a0fc5427ea71babb96a22c2c5762f3\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a-text-0001\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a\",\"chunk_type\":\"text\",\"section_path\":\"Abstract\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":4,\"page_no\":1,\"filename\":\"2609.11758v1.pdf\"}}},{\"id\":\"7c27fef0-e971-51e9-8ae7-2b5df6d7d484\",\"version\":9,\"score\":0.2165546,\"payload\":{\"page_content\":\"A.8
