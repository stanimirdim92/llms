      (majority vote) per harm category for Phi-4-14B.\nFigure 10: Harmfulness rate
      (majority vote) per harm category for Qwen-2.5-7B.", "This is a heatmap chart
      titled \"Llama-3.1-8B\" showing harmful response rates across 19 taxonomy subcategories
      (rows, including radiological_weapons, explosives, drugs, chemical_weapons,
      terrorism, biological_weapons, etc.) under four experimental conditions (columns:
