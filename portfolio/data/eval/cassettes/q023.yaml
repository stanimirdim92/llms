      Related Work\\nLLMsafety evaluation Evaluating open-ended text responses for
      safety is a challenging task. In many cases, refusal is considered a proxy for
      safety (Vidgen et al., 2023; Sun et al., 2023; Wang et al., 2024a; Bianchi et
      al., 2023; Mazeika et al., 2024; Xie et al., 2025), though refusal itself can
      take many forms (Wang et al., 2024b). Other work uses supervised or LLM-based
      classifiers to label outputs as 'safe' or 'unsafe', according to some definition
      of safety (often grounded in a terms and conditions document or other regulatory
      framework). Commonly used examples of safety classifiers include Llama-Guard
      (Inan et al., 2023), Shield-Gemma (Zeng et al., 2024b), and WildGuard (Han et
      al., 2024). The current work considers refusals, safety classifiers, and the
      accuracy of the information in the responses as correlated but distinct signals.\"},\"title\":\"2609.11758v1.pdf
