        Automated safety judges\\nWe compare three available LLM safety judges: Meta's
        LlamaGuard-3-8B (Inan et al., 2023; Grattafiori et al., 2024) Google's ShieldGemma2B
        (Zeng et al., 2024b), and Allen AI's WildGuard (Han et al., 2024). LlamaGuard
        produces a binary 'safe' or 'unsafe' output, according to the MLCommons Hazard
        taxonomy. ShieldGemma produces a per-policy classification across four safety
        policies (Dangerous Content, Harassment, Hate Speech, Sexually Explicit);
        we assess harmfulness across all four policies and return a label of 'unsafe'
        if any of the four exceed a probability of 0.5. WildGuard is trained to detect
        four broad categories of harm (Privacy, Misinformation, Harmful language,
        and Malicious uses) and assesses responses for both refusal and harmfulness;
        we consider the (binary) harmfulness label assigned to the response.\\nFor
        each response, an overall label of 'unsafe' is assigned when at least two
        of the three safety evaluators flag the response as unsafe. We compute pairwise
        inter-annotator agreement of the evaluators using Cohen's Kappa.\",\"metadata\":{\"ingestion_version\":\"01a0fc5427ea71babb96a22c2c5762f3\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a-text-0009\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a\",\"chunk_type\":\"text\",\"section_path\":\"3.3
        Automated safety judges\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":37,\"page_no\":4,\"filename\":\"2609.11758v1.pdf\"}}},{\"id\":\"18c0ceab-ec22-5e58-9a0b-ff68e62991e2\",\"version\":9,\"score\":0.31793287,\"payload\":{\"page_content\":\"2
        Related Work\\nLLMsafety evaluation Evaluating open-ended text responses for
        safety is a challenging task. In many cases, refusal is considered a proxy
        for safety (Vidgen et al., 2023; Sun et al., 2023; Wang et al., 2024a; Bianchi
        et al., 2023; Mazeika et al., 2024; Xie et al., 2025), though refusal itself
        can take many forms (Wang et al., 2024b). Other work uses supervised or LLM-based
        classifiers to label outputs as 'safe' or 'unsafe', according to some definition
        of safety (often grounded in a terms and conditions document or other regulatory
        framework). Commonly used examples of safety classifiers include Llama-Guard
        (Inan et al., 2023), Shield-Gemma (Zeng et al., 2024b), and WildGuard (Han
        et al., 2024). The current work considers refusals, safety classifiers, and
        the accuracy of the information in the responses as correlated but distinct
        signals.\",\"metadata\":{\"ingestion_version\":\"01a0fc5427ea71babb96a22c2c5762f3\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a-text-0006\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a\",\"chunk_type\":\"text\",\"section_path\":\"2
