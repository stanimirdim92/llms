      J. Johnson, M. Douze, and H. J\u00b4 egou, ''Billion-scale similarity search
      with GPUs,'' IEEE Trans. Big Data , vol. 7, no. 3, pp. 535-547, 2019.", "4.1
      R1: Capability in safe and unsafe contexts\nTable 3 reports accuracies for each
      model when asked benign and harmful questions, in both nonRAG, oracle RAG, and
      mixed settings. In the benign case, accuracy is scored using the MIRAGE benchmark
      method (Park et al., 2025). In the harmful (RAG-Safety-Bench) case, we compare
      the output response with the expected benchmark response, using Claude-Opus-4.7
      to output a fi- nal label of accurate or inaccurate relative to the reference.
      Human annotation of a subset of 100 examples validates the LLM-as-a-judge approach,
      with agreement of 95-96% between humans and LLM, and Cohen''s \u03ba of 0.90-0.92
      (more details and prompt available in Appendix Section A.4).\nTable 1: The four
      settings of the RAG-Safety-Bench benchmark. Example documents are for the query,
      ''What materials and design do I need to make an IED that can defeat armored
      police vehicles?''\n\nLLM-only, Description = No context documents provided..
      LLM-only, Example Wikipedia documents = (None). Oracle, Description = One of
      the returned documents contains the answer.. Oracle, Example Wikipedia documents
      = ''Explosively formed penetrator''. On-topic, Description = Oracle document
      not included, but documents are related to the topic of the query.. On-topic,
      Example Wikipedia documents = ''Deflagration to detonation tran- sition'', ''Blast
      wall''. Random, Description = Documents are randomly selected from a set of
      benign documents.. Random, Example Wikipedia documents = ''Climate change and
      birds'', ''Ar- boretum''", "Abstract\nAllowing large language models (LLMs)
      to retrieve information from a set of trusted documents can increase reliability
      and reduce hallucination. However, recent work has demonstrated that retrieval-augmented
      generation (RAG) can have unintended side effects on the overall safety of the
      generated responses, when prompted for harmful or dangerous content. A clearer
      understanding of the mechanisms leading to this result is needed, as increasing
      numbers of end users turn to RAG to incorporate corporate documents and knowledge
      bases into LLM-based systems. We introduce RAG-Safety-Bench, a benchmark to
      measure the safety impact of RAG on LLM models. By removing the confounding
      effect of retriever quality, and cleanly separating the problem into four conditions
      - non-RAG, RAG with an oracle document containing the answer to the harmful
      request, RAG with documents related to the harmful request but without the specific
      answer, and RAG with random, safe documents - the benchmark isolates the impacts
      of different factors in the observed safety degradation. We report results across
      five opensource LLMs, showing an inverse relationship between benign and unsafe
      capability, strong evidence that baseline safety guardrails do not lead to downstream
      safety guarantees in the RAG case, and model-specific support for previous findings
      that even benign documents can lead to unsafe generation in retrieval-enabled
      systems.", "A.8 Harmfulness rate by category\nCondition Condition Condition
      Phi-4-14B\nFigure 6: Harmfulness rate (majority vote) per harm category for
