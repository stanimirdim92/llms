      R4: Subjectivity of harm\\nFigure 4 presents the Cohen's Kappa scores for inter-annotator
      agreement. LlamaGuard and WildGuard have an agreement of 0.66, indicating substantial
      agreement. The other pairwise comparisons between the LLM safety judges are
      0.47 and 0.48, indicating only moderate agreement. In general, our hypothesis
      H4 that the automated safety evaluators will disagree on many cases is supported.
      We additionally include the evaluation of whether the answer was judged to be
      accurate, compared to the reference answer. The accuracy measure agrees most
      with the safety ratings of WildGuard with \u03BA = 0 . 67 . These results highlight
      that different methods of evaluating safety versus harm may lead to different
      interpretations of the same phenomenon. Overall, the four-way Fleiss's kappa
      is 0.56, indicating only moderate agreement. However, Figure 5 in the Appendix,
      which provides a more detailed view of the safety evaluations, suggests that
      even when the absolute numbers differ, when averaged over a large number of
      samples, the trends observed using each of the evaluation methods remain generally
      consistent.\\nTo explore the differences between automated safety evaluators
      further, Table 4 presents a finegrained analysis of the predicted positive rate
      for each evaluator on each sub-category of the RAGSafety-Bench benchmark, averaged
      over all generating models. When averaged over all models and conditions, the
      predicted positive rate of the evaluators is similar (14% for LlamaGuard, 17%
      for ShieldGemma, and 20% for WildGuard). However, each evaluator is more sensitive
      to certain subcategories of harm. For example, LlamaGuard flags responses less
      often than the other two evaluators Cohen's K\\nFigure 3: Refusal behaviors
