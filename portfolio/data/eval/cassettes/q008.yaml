      Full = 75. Self-harm, Balanced = 20. , Subcategory = Self-harm. , Full = 34.
      , Balanced = 20. TOTAL, Subcategory = . TOTAL, Full = 987. TOTAL, Balanced =
      346\nIn the benign case, we observe a large increase in accuracy in the oracle
      RAG setting relative to the non-RAG setting, indicating that all of the models
      in our experiments are capable of incorporating information from RAG context,
      when the correct information is available. Therefore, safety behav- ior in the
      current study cannot be attributed to a model''s inability to attend to the
      RAG docs (An et al., 2025). Performance is loosely associated with model size:
      Phi-4-14B performs best in the oracle condition, followed by Gemma-3-12B, followed
      by the 7-8B parameter models.", "4.1 R1: Capability in safe and unsafe contexts\nWehypothesized
      (H1) that models which demonstrated higher benign RAG capability would also
      demonstrate higher unsafe RAG capability; however, this is not supported by
      the ''Unsafe capability'' data. In fact, the accuracies under the BenignOracle
      and Unsafe-Oracle conditions are negatively correlated (Pearson r = -0 . 70
      ). This may indicate that the larger and more capable models also have better
      safety guardrails when they are presented with unsafe queries. However, all
      models are, in general, more likely to provide a correct response to the harmful
      question when the response is available in the documents, suggesting that guardrails
      still need to be improved to specifically handle the RAG setting.", "This is
      a heatmap chart titled \"Qwen2.5-7B\" showing harmful rates across 19 taxonomy
      subcategories (rows, including radiological_weapons, explosives, drugs, chemical_weapons,
      terrorism, cyberattacks, biological_weapons, hate_crimes, sexual_assault, etc.)
      against 4 experimental conditions (columns: Non-RAG, Oracle unsafe, On-topic,
      Random). Each cell displays a harmful rate value (0.00 to 1.00) with sample
      size (n), color-coded from white (low harm, 0.0) to dark red (high harm, 1.0)
      per the colorbar legend. The data reveals that the \"Oracle unsafe\" condition
      consistently produces the highest harmful rates (many values 0.55-1.00, including
      perfect 1.00 scores for radiological and biological weapons), while \"Random\"
      condition shows near-zero harmful rates across all subcategories, and \"Non-RAG\"
      and \"On-topic\" conditions show low-to-moderate harmful rates (generally 0.00-0.40),
      indicating that providing unsafe oracle context significantly increases model
      harmfulness compared to other retrieval conditions.", "D. Which Strategy Hurts
      Most\nTable III ranks the strategies. Entity swap has the highest fooled rate
      at 23.5% and the lowest poisoned accuracy, so it flips the largest share of
      answers that the model would otherwise get right. It also provokes the most
      abstention, 43.4%, which fits its mechanism: swapping ''Paris, France'' for
      ''Madrid, Spain'' can leave the passage internally inconsistent, and the model
      often reacts to that inconsistency by refusing to answer. Number swap and negation
      are close behind on fooled rate but keep higher poisoned accuracy.\nThe heatmap
      in Figure 2 gives the full strategy-by-level grid. Two patterns stand out. Fooled
      rates rise from left to right in every row, and the number-swap row is nearly
      flat across the first two columns before it jumps.", "B. Accuracy Degradation\nOne
      detail in Table I needs to be read carefully. The 0 / 3 row still shows a fooled
      rate near 10% and an accuracy about 9 points below the clean arm, even though
      no passage is rewritten and both answers see the same retrieved list. That residual
      is therefore not a retrieval mismatch. It comes from decoding noise under temperature
      0.1 across two independent generations, plus a strict keyword matcher that can
      disagree on near-paraphrases. Recomputing from the 588-run table, clean and
      poisoned answers are identical in only 76.9% of the 0 / 3 runs. The residual
      is large relative to some attack increments (the rise from 9.5% to 15.0% fooled
      between 0 / 3 and 1 / 3 is 5.5 points), so strategy contrasts at light poisoning
      should be read as suggestive until decoding is controlled (fixed seeds, repeated
      draws) and labels are less brittle. We therefore read the clean-arm column,
      not the 0 / 3 poisoned cell, as the true no-attack baseline.", "This is a heatmap
      chart titled \"Ministral-3-8B\" showing harmful response rates across four experimental
      conditions (Non-RAG, Oracle unsafe, On-topic, Random) for 19 taxonomy subcategories
      of harmful content (rows), including radiological_weapons, explosives, drugs,
      chemical_weapons, assault_battery, terrorism, cyberattacks, suicide, murder,
      hate_speech, kidnapping, self_harm, financial_crimes, biological_weapons, hate_crimes,
      property_crimes, fraud_scam, sexual_assault, sexual_harassment, and abuse. Each
      cell displays a harmful rate value (0.00\u20131.00) with sample size (n), and
      the color scale (white to dark red) indicates rate magnitude. The \"Oracle unsafe\"
      condition consistently shows the highest harmful rates (many cells 0.55\u20131.00,
      darkest red), while the \"Random\" condition shows near-zero harmful rates across
      nearly all subcategories, with \"Non-RAG\" and \"On-topic\" conditions showing
      intermediate, generally low rates.", "I. INTRODUCTION\nLarge language models
      answer questions fluently but carry two well-known liabilities: their knowledge
      is frozen at training time, and they sometimes state false facts with full confidence.
      Retrieval-augmented generation, proposed by Lewis et al. [1], addresses both
      by fetching relevant documents at query time and placing them in the prompt
      as evidence. The model is then asked to answer from that evidence rather than
      from memory alone. This design has become the default recipe for question answering
      over private or fast-moving knowledge bases.\nThe same design introduces a dependency
      that is easy to overlook. A RAG answer is only as trustworthy as the documents
      it retrieves. If an attacker can edit, inject, or otherwise corrupt even part
      of the retrieved set, the grounding step that was meant to improve reliability
      becomes a channel for misinformation. Shi et al. [3] showed that irrelevant
      context alone can pull a model off track; corrupted but on-topic context is
      a stronger lever, because it looks exactly like the evidence the model was told
      to trust. What is still missing for We answer those three questions empirically.
      Our contribution is threefold. First, we build a reproducible poisoning testbed
      around a 4-bit Llama 3.1 8B model, a MiniLM retriever, and a FAISS index of
      nearly twenty thousand FEVER evidence sentences. Second, we run a full factorial
      experiment, three corruption strategies crossed with four poisoning levels over
      a fixed query set, and report accuracy, a fooled rate, abstention, and a lexical-overlap
      proxy of unsupported generation for every cell. Third, we characterise the failure
      surface: entity corruption flips the most answers, numeric corruption jumps
      once it reaches a majority of the context, and the model''s default response
      to contradiction is to abstain rather than to invent. Every point estimate reported
      here comes from the same 588-run table. Where we interpret a jump or a strategy
      ranking, we also report query-level bootstrap intervals and paired tests recomputed
      from that table.", "V. CONCLUSION\nWe measured how a 4-bit Llama 3.1 8B model
      behaves when its retrieved context is poisoned, across three corruption strategies
      and four poisoning levels in a 588-run sweep. Accuracy falls from 77.9% to 43.5%
      as corruption goes from none to total. Entity swap flips the most answers. Numeric
      corruption shows a majority-leaning jump once two of three passages are poisoned,
      with a bootstrap interval on that jump that excludes zero but remains wide.
      The model''s main recorded response to attack is to abstain rather than to state
      a wrong answer, and the lexical-overlap proxy of unsupported generation falls
      under poisoning rather than rising.\nThe study has clear limits. It covers one
      small quantized model on a compact query set with rule-based corruption, so
      the absolute numbers should not be read as universal. Retrieval is shared across
      the pair, but decoding is not locked (temperature 0.1, two independent generations),
      and the 0 / 3 residual shows that background pair noise is non-trivial. Keyword
      matching is a weak correctness criterion, and the overlap proxy is not a semantic
      faithfulness judge. The added passages make retrieval easier than raw FEVER
      evidence would. Each limit points to a concrete next step: lock decoding seeds
      across the pair and add multi-seed and multi-corruption repeats with hierarchical
      resampling, replace keyword checks with structured FEVER-style labels and normalized
      entity or quantity scoring, adjudicate a stratified sample with blinded humans
      or a validated entailment model, and decompose answers into atomic claims so
      poison adoption can be separated from unsupported generation. We also plan to
      repeat the sweep on a larger instruction-tuned model and on a second corpus,
      to replace rule-based edits with model-generated adversarial\n- [5] K. Guu,
      K. Lee, Z. Tung, P. Pasupat, and M. Chang, ''REALM: retrievalaugmented language
      model pre-training,'' in Proc. Int. Conf. Machine Learning (ICML) , 2020, pp.
      3929-3938.\n- [6] N. Reimers and I. Gurevych, ''Sentence-BERT: sentence embeddings
      using Siamese BERT-networks,'' in Proc. Conf. Empirical Methods in Natural Language
      Processing (EMNLP) , 2019, pp. 3982-3992.\n- [7] J. Johnson, M. Douze, and H.
      J\u00b4 egou, ''Billion-scale similarity search with GPUs,'' IEEE Trans. Big
      Data , vol. 7, no. 3, pp. 535-547, 2019."], "model": "rerank-2.5", "top_k":
