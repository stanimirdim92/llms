        red), while the \\\"Random\\\" condition shows near-zero harmful rates across
        nearly all subcategories, with \\\"Non-RAG\\\" and \\\"On-topic\\\" conditions
        showing intermediate, generally low rates.\",\"metadata\":{\"ingestion_version\":\"01a0fc5427ea71babb96a22c2c5762f3\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a-fig-022-07\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a\",\"chunk_type\":\"figure\",\"section_path\":\"\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":213,\"page_no\":22,\"filename\":\"2609.11758v1.pdf\",\"image_path\":\"/var/www/html/personal/llms/portfolio/data/processed/01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a/figures/fig-022-07-6f72ea9f7e1bbab0.png\"}}},{\"id\":\"5e78e312-eed9-5668-836e-0f69b54f3b37\",\"version\":5,\"score\":0.27694947,\"payload\":{\"page_content\":\"I.
        INTRODUCTION\\nLarge language models answer questions fluently but carry two
        well-known liabilities: their knowledge is frozen at training time, and they
        sometimes state false facts with full confidence. Retrieval-augmented generation,
        proposed by Lewis et al. [1], addresses both by fetching relevant documents
        at query time and placing them in the prompt as evidence. The model is then
        asked to answer from that evidence rather than from memory alone. This design
        has become the default recipe for question answering over private or fast-moving
        knowledge bases.\\nThe same design introduces a dependency that is easy to
        overlook. A RAG answer is only as trustworthy as the documents it retrieves.
        If an attacker can edit, inject, or otherwise corrupt even part of the retrieved
        set, the grounding step that was meant to improve reliability becomes a channel
        for misinformation. Shi et al. [3] showed that irrelevant context alone can
        pull a model off track; corrupted but on-topic context is a stronger lever,
        because it looks exactly like the evidence the model was told to trust. What
        is still missing for We answer those three questions empirically. Our contribution
        is threefold. First, we build a reproducible poisoning testbed around a 4-bit
        Llama 3.1 8B model, a MiniLM retriever, and a FAISS index of nearly twenty
        thousand FEVER evidence sentences. Second, we run a full factorial experiment,
        three corruption strategies crossed with four poisoning levels over a fixed
        query set, and report accuracy, a fooled rate, abstention, and a lexical-overlap
        proxy of unsupported generation for every cell. Third, we characterise the
        failure surface: entity corruption flips the most answers, numeric corruption
        jumps once it reaches a majority of the context, and the model's default response
        to contradiction is to abstain rather than to invent. Every point estimate
        reported here comes from the same 588-run table. Where we interpret a jump
        or a strategy ranking, we also report query-level bootstrap intervals and
        paired tests recomputed from that table.\",\"metadata\":{\"ingestion_version\":\"01a0fc53392f724b972307d03a9f94d9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead-text-0001\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead\",\"chunk_type\":\"text\",\"section_path\":\"I.
        INTRODUCTION\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":6,\"page_no\":1,\"filename\":\"2609.09243v1.pdf\"}}},{\"id\":\"85179e08-8e6f-59a9-ae44-68205f2042e1\",\"version\":5,\"score\":0.2745756,\"payload\":{\"page_content\":\"V.
        CONCLUSION\\nWe measured how a 4-bit Llama 3.1 8B model behaves when its retrieved
        context is poisoned, across three corruption strategies and four poisoning
        levels in a 588-run sweep. Accuracy falls from 77.9% to 43.5% as corruption
        goes from none to total. Entity swap flips the most answers. Numeric corruption
        shows a majority-leaning jump once two of three passages are poisoned, with
        a bootstrap interval on that jump that excludes zero but remains wide. The
        model's main recorded response to attack is to abstain rather than to state
        a wrong answer, and the lexical-overlap proxy of unsupported generation falls
        under poisoning rather than rising.\\nThe study has clear limits. It covers
        one small quantized model on a compact query set with rule-based corruption,
        so the absolute numbers should not be read as universal. Retrieval is shared
        across the pair, but decoding is not locked (temperature 0.1, two independent
        generations), and the 0 / 3 residual shows that background pair noise is non-trivial.
        Keyword matching is a weak correctness criterion, and the overlap proxy is
        not a semantic faithfulness judge. The added passages make retrieval easier
        than raw FEVER evidence would. Each limit points to a concrete next step:
        lock decoding seeds across the pair and add multi-seed and multi-corruption
        repeats with hierarchical resampling, replace keyword checks with structured
        FEVER-style labels and normalized entity or quantity scoring, adjudicate a
        stratified sample with blinded humans or a validated entailment model, and
        decompose answers into atomic claims so poison adoption can be separated from
        unsupported generation. We also plan to repeat the sweep on a larger instruction-tuned
        model and on a second corpus, to replace rule-based edits with model-generated
        adversarial\\n- [5] K. Guu, K. Lee, Z. Tung, P. Pasupat, and M. Chang, 'REALM:
        retrievalaugmented language model pre-training,' in Proc. Int. Conf. Machine
        Learning (ICML) , 2020, pp. 3929-3938.\\n- [6] N. Reimers and I. Gurevych,
        'Sentence-BERT: sentence embeddings using Siamese BERT-networks,' in Proc.
        Conf. Empirical Methods in Natural Language Processing (EMNLP) , 2019, pp.
        3982-3992.\\n- [7] J. Johnson, M. Douze, and H. J\xB4 egou, 'Billion-scale
        similarity search with GPUs,' IEEE Trans. Big Data , vol. 7, no. 3, pp. 535-547,
        2019.\",\"metadata\":{\"ingestion_version\":\"01a0fc53392f724b972307d03a9f94d9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead-text-0018\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead\",\"chunk_type\":\"text\",\"section_path\":\"V.
        CONCLUSION\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":83,\"page_no\":6,\"filename\":\"2609.09243v1.pdf\"}}}]},\"status\":\"ok\",\"time\":0.001150779}"
