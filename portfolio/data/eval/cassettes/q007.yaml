        show minimal fooling but more abstention.\",\"metadata\":{\"ingestion_version\":\"01a0fc53392f724b972307d03a9f94d9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead-fig-005-04\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead\",\"chunk_type\":\"figure\",\"section_path\":\"\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":68,\"page_no\":5,\"filename\":\"2609.09243v1.pdf\",\"image_path\":\"/var/www/html/personal/llms/portfolio/data/processed/01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead/figures/fig-005-04-04d372ba3b61fee1.png\"}}},{\"id\":\"7027e267-6a58-5909-aa35-88bb46b10e9d\",\"version\":15,\"score\":0.45837015,\"payload\":{\"page_content\":\"5.3
        RLVR does not make citations more faithful\\nRaw rates alone cannot answer
        the RL question, since a model could post-rationalize heavily and still be
        no worse than the model it came from. Table 5 therefore reports the difference-indifferences:
        each agent's attributable rate minus its base model's, on the same dataset.
        If RLVR taught these agents anything about grounding, this column would run
        negative.\",\"metadata\":{\"ingestion_version\":\"01a0fc55257f7276be70b7b3d1501b36\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6-text-0018\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6\",\"chunk_type\":\"text\",\"section_path\":\"5.3
        RLVR does not make citations more faithful\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":90,\"page_no\":6,\"filename\":\"2609.23053v1.pdf\"}}},{\"id\":\"7cc06dc1-4df9-5a4c-aa92-828d2e5bc15a\",\"version\":5,\"score\":0.45545143,\"payload\":{\"page_content\":\"D.
        Which Strategy Hurts Most\\nTable III ranks the strategies. Entity swap has
        the highest fooled rate at 23.5% and the lowest poisoned accuracy, so it flips
        the largest share of answers that the model would otherwise get right. It
        also provokes the most abstention, 43.4%, which fits its mechanism: swapping
        'Paris, France' for 'Madrid, Spain' can leave the passage internally inconsistent,
        and the model often reacts to that inconsistency by refusing to answer. Number
        swap and negation are close behind on fooled rate but keep higher poisoned
        accuracy.\\nThe heatmap in Figure 2 gives the full strategy-by-level grid.
        Two patterns stand out. Fooled rates rise from left to right in every row,
        and the number-swap row is nearly flat across the first two columns before
        it jumps.\",\"metadata\":{\"ingestion_version\":\"01a0fc53392f724b972307d03a9f94d9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead-text-0011\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead\",\"chunk_type\":\"text\",\"section_path\":\"D.
        Which Strategy Hurts Most\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":48,\"page_no\":3,\"filename\":\"2609.09243v1.pdf\"}}},{\"id\":\"7c329777-6c76-54b3-a177-62c2bbb303d4\",\"version\":5,\"score\":0.45373917,\"payload\":{\"page_content\":\"This
        is a line chart depicting the \\\"Fooled Rate (%)\\\" on the y-axis (ranging
        from 0 to 40%) versus \\\"Poisoned documents (out of 3 retrieved)\\\" on the
        x-axis (categories: 0/3, 1/3, 2/3, 3/3). Three attack types are plotted: Entity
        swap (pink dashed line), Number swap (orange solid line with circular markers),
        and Negation (purple dashed line), all showing an increasing trend in fooled
        rate as the number of poisoned documents increases. A notable annotation highlights
        a \\\"+16.3 pp\\\" jump in the Number swap line between the 1/3 and 2/3 data
        points, where the rate rises sharply from about 10% to roughly 27%, with all
        three lines converging near 30-37% at 3/3 poisoned documents.\",\"metadata\":{\"ingestion_version\":\"01a0fc53392f724b972307d03a9f94d9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead-fig-004-02\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead\",\"chunk_type\":\"figure\",\"section_path\":\"\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":60,\"page_no\":4,\"filename\":\"2609.09243v1.pdf\",\"image_path\":\"/var/www/html/personal/llms/portfolio/data/processed/01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead/figures/fig-004-02-1987cd10b5ee32d8.png\"}}},{\"id\":\"82bd2225-a596-5765-ae46-e533ca23520c\",\"version\":5,\"score\":0.44717693,\"payload\":{\"page_content\":\"F.
        How the Model Fails\\nThe most useful result for a system designer is not
        how often the model is wrong but how it is wrong. Two failures are possible
        under attack. The model can accept the falsehood and state it, or it can notice
        the conflict and decline. It could also invent a third answer grounded in
        neither, which the hallucination proxy is meant to catch.\\nThe evidence points
        to abstention as the dominant recorded failure mode. Averaged over all runs
        the model abstains on 35.2% of poisoned queries, well above the 21.1% fooled
        rate. Figure 4(a) shows abstention climbing with poisoning for every strategy
        and reaching 69% for entity swap at full corruption. The lexical-overlap proxy
        moves the other way. Figure 4(b) shows that low-overlap answers are more common
        on the clean arm, near 29%, than on the poisoned arm, near 20%. Under this
        proxy, corrupted context does not look like a surge of unsupported invention;
        it looks like a surge of refusal. A fuller faithfulness taxonomy (entailment,
        contradiction, poison adoption, unsupported generation) would be needed before
        claiming that hallucination itself falls.\\nFig. 1. Accuracy as a function
        of how many of the three retrieved passages are poisoned. Panel (a) shows
        poisoned accuracy per strategy against the shared clean baseline; the clean
        arm stays near 78% while every poisoned curve declines. Panel (b) shows the
        drop relative to the clean arm, where entity swap opens the widest gap at
        high poisoning.\\nFig. 2. Fooled rate for every strategy and poisoning level.
        Colour runs from green (safe) to red (many answers flipped). The number-swap
        row barely changes between zero and one poisoned passage, then rises steeply.\\nFigure
        5 decomposes only those queries the model answered correctly on clean context,
        so every bar starts from a fact the model knew. As poisoning grows, the green
        'still correct' band shrinks and is replaced mostly by blue abstention, with
        the red 'fooled' band growing more slowly. Negation is the most resilient:
        even at full corruption a large share of originally correct answers survives,
        which matches our expectation that an explicit 'never' is easier to distrust
        than a silent swap.\\nFig. 3. Fooled rate by poisoning level. Entity swap
        and negation grow steadily, whereas number swap (bold) stays flat through
        one poisoned passage and then rises once poisoned passages become the majority.
        Intervals for the numberswap jump are reported in the text.\",\"metadata\":{\"ingestion_version\":\"01a0fc53392f724b972307d03a9f94d9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead-text-0013\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead\",\"chunk_type\":\"text\",\"section_path\":\"F.
        How the Model Fails\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":53,\"page_no\":3,\"filename\":\"2609.09243v1.pdf\"}}},{\"id\":\"328797f4-1778-57fe-bd4a-a334aaaa1cbb\",\"version\":5,\"score\":0.44377255,\"payload\":{\"page_content\":\"H.
        Relation to Prior Work\\nOur findings extend the RAG picture drawn by Lewis
        et al. [1] from the cooperative case to an adversarial one: retrieval that
        lifts accuracy on clean corpora becomes a liability on corrupted ones. Where
        Shi et al. [3] showed that off-topic context distracts a model, we show that
        on-topic but false context does more, because it wears the appearance of the
        evidence the model was told to trust. The abstention-overfabrication pattern
        we measure is an empirical answer, for a small quantized model, to how such
        a system fails when the context is corrupted rather than merely irrelevant.
        The retrieval-integrated pre-training of Guu et al. [5] shares the grounding
        assumption our attack targets. Zhou et al. [4] warn that evaluation can leak
        into training and inflate scores; we keep the FEVER-derived query set fixed
        and report every cell from the same 588-run table so strategy comparisons
        are not an artifact of shifting test items.\\nFig. 4. Failure behaviour across
        poisoning levels. Panel (a): abstention rises with poisoning for every strategy,
        most steeply for entity swap. Panel (b): the lexical-overlap proxy of unsupported
        generation is higher on the clean arm than the poisoned arm for all three
        strategies.\\nFig. 5. Outcome of queries that were correct on clean context,
        split by strategy and poisoning level. Green is still correct, blue is abstained,
        red is fooled. The lost green area is absorbed mainly by abstention, and negation
        retains the most correct answers.\",\"metadata\":{\"ingestion_version\":\"01a0fc53392f724b972307d03a9f94d9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead-text-0015\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead\",\"chunk_type\":\"text\",\"section_path\":\"H.
        Relation to Prior Work\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":65,\"page_no\":4,\"filename\":\"2609.09243v1.pdf\"}}},{\"id\":\"a18e8f71-14a2-5568-a215-b9c94feddb47\",\"version\":5,\"score\":0.4426834,\"payload\":{\"page_content\":\"E.
        A Majority Pattern in Numeric Corruption\\nFigure 3 isolates that pattern.
        For entity swap and negation the fooled rate grows in roughly even steps as
        poisoning increases. Number swap behaves differently. It stays at 10.2% for
        both zero and one corrupted passage (bootstrap 95% CI [2 . 0 , 18 . 4] in
        both cells), then rises to 26.5% at two ( [14 . 3 , 38 . 8] ) and 34.7% at
        three ( [22 . 5 , 49 . 0] ). The jump from one to two poisoned passages is
        16.3 points with CI [2 . 0 , 30 . 6] , which excludes zero but is wide. Exact
        McNemar tests on clean-versus-poisoned correctness are significant at two
        and three poisoned passages ( p < 10 -3 ) and not at one ( p = 0 . 22 ). We
        read this as a majority-leaning pattern consistent with outvoting a single
        wrong figure, not as a sharp phase transition proven under locked pairs. Because
        a model cannot sanity-check a bare number the way it can catch 'Madrid, Spain,'
        numeric corruption remains a quiet risk once it reaches critical mass.\",\"metadata\":{\"ingestion_version\":\"01a0fc53392f724b972307d03a9f94d9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead-text-0012\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead\",\"chunk_type\":\"text\",\"section_path\":\"E.
        A Majority Pattern in Numeric Corruption\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":51,\"page_no\":3,\"filename\":\"2609.09243v1.pdf\"}}},{\"id\":\"3112d294-65f2-5abe-a8cd-9278a0b94785\",\"version\":5,\"score\":0.4368588,\"payload\":{\"page_content\":\"This
        is a heatmap chart displaying \\\"Fooled rate (%)\\\" data across three manipulation
