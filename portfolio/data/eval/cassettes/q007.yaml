        |                60.2 |              19.4 |               32.1 |\"}}},{\"id\":\"a44c45f3-30fe-539c-8e4c-b53e70d91aee\",\"version\":5,\"score\":0.43415368,\"payload\":{\"page_content\":\"D.
        Evaluation Metrics\\nFor every run the model retrieves once, then answers
        twice: once from the clean passages and once from a poisoned copy of that
        same list. Passage identity and order are therefore shared across the pair;
        what is not locked is decoding (temperature 0.1, two independent generate
        calls). Four quantities are recorded.\\nAccuracy checks whether the reference
        keyword for a question appears in the answer, case-insensitively. Keyword
        presence is a coarse label: a negated or qualified answer can still contain
        the keyword, and an otherwise correct paraphrase can miss it. We keep it because
        it is reproducible and applied uniformly, not because it is a gold standard.
        Fooled rate is the fraction of runs where the clean answer was correct but
        the poisoned answer was not; it isolates correct-to-incorrect flips from questions
        the model could not answer anyway. It is not a direct measure of poison adoption,
        because an incorrect poisoned answer may abstain, contradict the poison, or
        state a third wrong fact. Abstention rate counts answers that decline to commit,
        detected through a small set of phrases such as 'not enough information' and
        'cannot determine.' Unsupported generation (reported in earlier drafts as
        a hallucination proxy) is approximated by lexical overlap: an answer is flagged
        when fewer than 30% of its content words appear in any retrieved passage,\\n<!--
        formula-not-decoded -->\\nwith W a the content words of the answer and W d
        those of the retrieved passages. Lexical overlap confuses faithful paraphrase
        with unsupported invention, and it can miss answers that copy poisoned text.
        We treat the proxy as a trend indicator only.\",\"metadata\":{\"ingestion_version\":\"01a0fc53392f724b972307d03a9f94d9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead-text-0005\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead\",\"chunk_type\":\"text\",\"section_path\":\"D.
        Evaluation Metrics\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":25,\"page_no\":2,\"filename\":\"2609.09243v1.pdf\"}}},{\"id\":\"23e17e81-fbad-51dc-a1c1-07373bb5e64e\",\"version\":5,\"score\":0.43133748,\"payload\":{\"page_content\":\"C.
        Poisoning Level\\nThe poisoning level is the number of the three retrieved
        passages that are corrupted before generation. We sweep all four values, from
        none to all three:\\n<!-- formula-not-decoded -->\\nAt 0 / 3 the passages
        are left untouched, giving a withincondition baseline. At 3 / 3 every passage
        the model sees has been rewritten. The passages to corrupt are chosen at random
        among the three, which lets a single clean passage sit anywhere in the ordering.\",\"metadata\":{\"ingestion_version\":\"01a0fc53392f724b972307d03a9f94d9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead-text-0004\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead\",\"chunk_type\":\"text\",\"section_path\":\"C.
        Poisoning Level\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":21,\"page_no\":2,\"filename\":\"2609.09243v1.pdf\"}}},{\"id\":\"dddac35f-5d4b-5ded-8013-36c20a4708fe\",\"version\":15,\"score\":0.42372954,\"payload\":{\"page_content\":\"5.3
        RLVR does not make citations more faithful\\nIt does not. Search-R1 moves
        by -1.2, +4.3, -0.9, and +1.3pp across the four datasets; ReSearch by +0.1,
        -1.6, -1.2, and +0.8pp. Both wander around zero with no pattern, every interval
        covers zero, and the smallest Holm-adjusted p -value in either row is 0.267,
        nowhere near signif- icance. Set that against our detection bound: with 80%
        power at about 7pp, an improvement of that size would have been hard to miss,
        and nothing close to it appears. Training these agents to produce verifiably
        correct answers moved their citation faithfulness by an amount we cannot distinguish
        from nothing.\\nThat result is less surprising once you look at what the reward
        measures. RLVR compares the final answer with a reference and pays out accordingly;
        R-Search also rewards steps along its search trajectory. No term anywhere
        in these objectives asks whether the citation attached to a sentence is the
        passage that produced it. Citing the wrong passage is free, so the behavior
        the agents inherit from Qwen2.5-7B-Instruct rides through training untouched.\",\"metadata\":{\"ingestion_version\":\"01a0fc55257f7276be70b7b3d1501b36\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6-text-0020\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6\",\"chunk_type\":\"text\",\"section_path\":\"5.3
        RLVR does not make citations more faithful\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":93,\"page_no\":6,\"filename\":\"2609.23053v1.pdf\"}}},{\"id\":\"d6bfc4cc-f7d3-52b0-bda9-ff9f46064420\",\"version\":15,\"score\":0.4224143,\"payload\":{\"page_content\":\"5.1
        What the control changes\\nREL-UNCITED: the raw rate survives untouched. Read
        the top block: 52 of 371 NQ claims follow the plant, and 0 of those same 371
        records cite the doctored passage when we take the span away. The control
        column is 0/ n on all four datasets, which is what Section 3.3 predicted,
        because removing four appended words restores the clean context exactly and
        the clean answer never cited that passage for that claim. Prediction and measurement
        agree, so +14.0pp on NQ is not a raw rate that needs an asterisk; it is the
        attributable effect.\\nRANDOM: the control is real but tiny. Swapping in a
        passage from an unrelated question does occasionally earn a citation on its
        own, as the 4/433 on HAGRID and 1/864 on RAGTruth show, but the effect is
        small: 0.2% pooled across the 7,625 control records, with 7 of 16 model-dataset
        cells at exactly zero and the rest between 0.1% and 0.9% (Appendix D). Between
        83% and 100% of each raw rate survives as attributable, 97% on average. The
        confound we built this control to catch turned out to be genuine and negligible,
        which is worth knowing precisely because we could not have assumed it.\\nCITED-OTHER:
        the raw rate lies, and the control catches it. The bottom block is the reason
        we care about all this. Planted rates run from 78.9% to 89.6%, many times
        the REL-UNCITED rates, and any paper could report them as evidence of rampant
        post-rationalization. The control column explains them away: 69/69, 123/123,
        61/61, 623/623. Every single control record cites the doctored passage, because
        this variant selects a passage the clean answer already cited elsewhere. Subtract,
        and the attributable effect is negative on all four datasets, from -10.4pp
        to -21.1pp, with intervals that exclude zero. A raw rate of 79-90% here measures
        our sampling rule and nothing else. Under the stricter claim-aligned outcome
        the same records do show genuine post-rationalization, +10.6 to +19.7pp (Appendix
        D), though only RAGTruth has enough questions to pin it down.\\nThe moral
        generalizes past this probe: whenever a measurement edits an input and counts
        how often the output changes, report the unedited baseline, and demonstrate
        rather than assume that it is zero.\",\"metadata\":{\"ingestion_version\":\"01a0fc55257f7276be70b7b3d1501b36\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6-text-0015\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6\",\"chunk_type\":\"text\",\"section_path\":\"5.1
        What the control changes\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":78,\"page_no\":5,\"filename\":\"2609.23053v1.pdf\"}}},{\"id\":\"8c166fb5-399b-59e9-a610-789ac782c808\",\"version\":15,\"score\":0.4185621,\"payload\":{\"page_content\":\"3.2
        What counts as citing the planted passage\\nThe re-run answer may be worded
        differently, so we first locate the sentence that best matches the original
        claim by word overlap (Jaccard similarity of at least 0.3), then ask whether
        that sentence cites the doctored passage. This is our claim-aligned outcome,
        and the pairing carries the weight: it asks whether the model cited the planted
        passage for the claim we planted into , not whether the marker turns up loose
        somewhere in the answer. We keep the looser cited-anywhere outcome as a sensitivity
        check, and Section 5.1 shows how much slack it introduces.\\nWe score every
        record, with no filtering on whether the planted span reappears in the new
        answer. The original probe conditions on exactly that, and our control shows
        why it should not: with nothing planted at all, those four words come back
        in 60-74% of answers, simply because the model wrote them in the first place.
        Span recovery tells us the model repeated itself, not that our plant did anything.\",\"metadata\":{\"ingestion_version\":\"01a0fc55257f7276be70b7b3d1501b36\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6-text-0008\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6\",\"chunk_type\":\"text\",\"section_path\":\"3.2
        What counts as citing the planted passage\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":46,\"page_no\":3,\"filename\":\"2609.23053v1.pdf\"}}},{\"id\":\"5465c457-ca4b-5d77-839d-d3ad8983ca17\",\"version\":13,\"score\":0.41741347,\"payload\":{\"page_content\":\"B
        Complete Paired Comparisons\\nSection 4.2 describes the common cohorts, estimands,
        inference, and precision-code correction. Tables 6-10 report all 148 planned
        contrasts, including those not retained as claims; EF1 effects and intervals
        use four decimal places, and other effects and intervals use three.\\nTable
        notation. A/Q denote ASQA/QASPER; Id, RR, X, RC, and LL denote identity, reranking,
        extraction, RECOMP, and LLMLingua-2. Setting labels give compressor/nominal
        budget, optionally followed by the recovery threshold. P/R denote precision/recall,
        with e/g for emitted/grounded; EM is str-EM, EF1 is evidence F1, and Rec is
        reattribution rate. U s /U m /U r denote declared-span, summary, and recovered-source
        unsupported rates. \u2206 is the paired left-minus-right mean difference;
        a single endpoint applies to both settings, and a pair lists left-minus-right
        metrics. CI is a pointwise 95% bootstrap interval; p H is the two-sided randomization
        p -value after Holm adjustment across all 148 comparisons; n counts included
        questions.\\nRecovered-source verification. This extension reads existing
        NLI scores from the sealed cache and makes no new model calls. It uses the
        same recovered source IDs as citation scoring, but the claim verifier removes
        repeated source IDs before pooling evidence. Consequently, its unsupported
        rate need not equal one minus grounded citation recall, which retains repeated
        cited evidence. Both summary and recovered-source rates exclude the same zero-claim
        answers: two QASPER RECOMP answers at nominal 0.25; the other three comparisons
        use their full common cohorts. Input hashes, the extension plan, cache lookups,
        perquestion records, and all four comparisons are retained separately from
        the original analysis.\\n\",\"metadata\":{\"ingestion_version\":\"01a0fc54ff9a70d3af0e9b49e864b8b9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde-text-0028\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde\",\"chunk_type\":\"text\",\"section_path\":\"B
