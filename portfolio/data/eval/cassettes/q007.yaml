        Accuracy Degradation\\nTable I tracks the model as more of its context is
        corrupted. The clean arm stays near 78% throughout, which confirms that the
        query set itself is not drifting across rows. Poisoned accuracy still moves
        for reasons other than poisoning alone: the 0 / 3 cell is already 69.4%, nine
        points below the clean arm, before any passage is rewritten. From that residual
        baseline the poisoned arm falls further to 63.9% at one corrupted passage
        and to 43.5% when all three are corrupted. The fooled rate rises from 9.5%
        at 0 / 3 to 34.0% at 3 / 3 , and abstention climbs from 21% to 52%. Attack
        effects should be read against the 0 / 3 residual, not against a silent zero.\\nTABLE
        I ACCURACY AND FAILURE BEHAVIOUR BY POISONING LEVEL, AVERAGED OVER ALL THREE
        STRATEGIES. EACH LEVEL AGGREGATES 147 RUNS.\\n\\n0 / 3, Clean acc. (%) = 78.2.
