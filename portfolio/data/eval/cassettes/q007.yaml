        documents (0/3, 1/3, 2/3, 3/3) as columns. The color gradient ranges from
        green (low fooled rate, ~8-10%) to red (high fooled rate, ~30-37%), showing
        that fooled rates consistently increase as the number of poisoned documents
        increases from 0/3 to 3/3. Entity swap shows the highest fooled rates overall
