- request:
    body: '{"query": "What fooled rate and confidence interval does the 0/3 condition
      report?", "documents": ["TABLE II FOOLED RATE WITH QUERY-LEVEL BOOTSTRAP 95%
      INTERVALS (ALL STRATEGIES, 147 RUNS PER ROW).\n\n| Poisoned passages   |   Fooled
      (%) | 95% CI            |   n |\n|---------------------|--------------|-------------------|-----|\n|
      0 / 3               |          9.5 | [5 . 4 , 14 . 3]  | 147 |\n| 1 / 3               |         15.0
      | [8 . 8 , 21 . 8]  | 147 |\n| 2 / 3               |         25.9 | [18 . 4
      , 33 . 3] | 147 |\n| 3 / 3               |         34.0 | [24 . 5 , 44 . 2]
      | 147 |", "TABLE I ACCURACY AND FAILURE BEHAVIOUR BY POISONING LEVEL, AVERAGED
      OVER ALL THREE STRATEGIES. EACH LEVEL AGGREGATES 147 RUNS.\n\n| Poisoned passages   |   Clean
      acc. (%) |   Poisoned acc. (%) |   Fooled rate (%) |   Abstain rate (%) |\n|---------------------|------------------|---------------------|-------------------|--------------------|\n|
      0 / 3               |             78.2 |                69.4 |               9.5
      |               21.1 |\n| 1 / 3               |             77.6 |                63.9
      |              15.0 |               29.3 |\n| 2 / 3               |             78.2
      |                53.1 |              25.9 |               38.8 |\n| 3 / 3               |             77.6
      |                43.5 |              34.0 |               51.7 |", "B. Accuracy
      Degradation\nTable I tracks the model as more of its context is corrupted. The
      clean arm stays near 78% throughout, which confirms that the query set itself
      is not drifting across rows. Poisoned accuracy still moves for reasons other
      than poisoning alone: the 0 / 3 cell is already 69.4%, nine points below the
      clean arm, before any passage is rewritten. From that residual baseline the
      poisoned arm falls further to 63.9% at one corrupted passage and to 43.5% when
      all three are corrupted. The fooled rate rises from 9.5% at 0 / 3 to 34.0% at
      3 / 3 , and abstention climbs from 21% to 52%. Attack effects should be read
      against the 0 / 3 residual, not against a silent zero.\nTABLE I ACCURACY AND
      FAILURE BEHAVIOUR BY POISONING LEVEL, AVERAGED OVER ALL THREE STRATEGIES. EACH
      LEVEL AGGREGATES 147 RUNS.\n\n0 / 3, Clean acc. (%) = 78.2. 0 / 3, Poisoned
      acc. (%) = 69.4. 0 / 3, Fooled rate (%) = 9.5. 0 / 3, Abstain rate (%) = 21.1.
      1 / 3, Clean acc. (%) = 77.6. 1 / 3, Poisoned acc. (%) = 63.9. 1 / 3, Fooled
      rate (%) = 15.0. 1 / 3, Abstain rate (%) = 29.3. 2 / 3, Clean acc. (%) = 78.2.
      2 / 3, Poisoned acc. (%) = 53.1. 2 / 3, Fooled rate (%) = 25.9. 2 / 3, Abstain
      rate (%) = 38.8. 3 / 3, Clean acc. (%) = 77.6. 3 / 3, Poisoned acc. (%) = 43.5.
      3 / 3, Fooled rate (%) = 34.0. 3 / 3, Abstain rate (%) = 51.7\nTABLE II FOOLED
      RATE WITH QUERY-LEVEL BOOTSTRAP 95% INTERVALS (ALL STRATEGIES, 147 RUNS PER
      ROW).\n\n0 / 3, Fooled (%) = 9.5. 0 / 3, 95% CI = [5 . 4 , 14 . 3]. 0 / 3, n
      = 147. 1 / 3, Fooled (%) = 15.0. 1 / 3, 95% CI = [8 . 8 , 21 . 8]. 1 / 3, n
      = 147. 2 / 3, Fooled (%) = 25.9. 2 / 3, 95% CI = [18 . 4 , 33 . 3]. 2 / 3, n
      = 147. 3 / 3, Fooled (%) = 34.0. 3 / 3, 95% CI = [24 . 5 , 44 . 2]. 3 / 3, n
      = 147\nFigure 1 plots the same trend per strategy. The three curves separate
      clearly. Entity swap drives the steepest fall, and by the full-poisoning level
      it sits below the other two. The right panel, which shows the gap against the
      clean arm, makes the ordering explicit and shows that no strategy is harmless
      once two of the three passages are corrupted.", "This is a line chart depicting
      the \"Fooled Rate (%)\" on the y-axis (ranging from 0 to 40%) versus \"Poisoned
      documents (out of 3 retrieved)\" on the x-axis (categories: 0/3, 1/3, 2/3, 3/3).
      Three attack types are plotted: Entity swap (pink dashed line), Number swap
      (orange solid line with circular markers), and Negation (purple dashed line),
      all showing an increasing trend in fooled rate as the number of poisoned documents
      increases. A notable annotation highlights a \"+16.3 pp\" jump in the Number
      swap line between the 1/3 and 2/3 data points, where the rate rises sharply
      from about 10% to roughly 27%, with all three lines converging near 30-37% at
      3/3 poisoned documents.", "C. Uncertainty on the Existing Runs\nWe do not invent
      new generations for this revision. We reanalyse the same table with a query-level
      bootstrap: resample the 49 indexed query slots with replacement (37 distinct
      texts), keep every run tied to a drawn slot, recompute the fooled rate, and
      repeat 10 , 000 times with a fixed seed to obtain percentile 95% intervals.
      Exact McNemar tests on discordant clean/poisoned correctness pairs are reported
      as a secondary check; effect sizes and intervals remain primary.\nTable II shows
      that the climb with poisoning level remains after accounting for query resampling,
      while neighbouring levels overlap. The comparison that matters for the numeric
      pattern is isolated next.\nTABLE III BEHAVIOUR BY STRATEGY, AVERAGED OVER ALL
      FOUR POISONING LEVELS. EACH STRATEGY AGGREGATES 196 RUNS.\n\nEntity swap, Clean
      acc. (%) = 78.1. Entity swap, Poisoned acc. (%) = 54.6. Entity swap, Fooled
      rate (%) = 23.5. Entity swap, Abstain rate (%) = 43.4. Number swap, Clean acc.
      (%) = 77.6. Number swap, Poisoned acc. (%) = 57.7. Number swap, Fooled rate
      (%) = 20.4. Number swap, Abstain rate (%) = 30.1. Negation, Clean acc. (%) =
      78.1. Negation, Poisoned acc. (%) = 60.2. Negation, Fooled rate (%) = 19.4.
      Negation, Abstain rate (%) = 32.1", "E. A Majority Pattern in Numeric Corruption\nFigure
      3 isolates that pattern. For entity swap and negation the fooled rate grows
      in roughly even steps as poisoning increases. Number swap behaves differently.
      It stays at 10.2% for both zero and one corrupted passage (bootstrap 95% CI
      [2 . 0 , 18 . 4] in both cells), then rises to 26.5% at two ( [14 . 3 , 38 .
      8] ) and 34.7% at three ( [22 . 5 , 49 . 0] ). The jump from one to two poisoned
      passages is 16.3 points with CI [2 . 0 , 30 . 6] , which excludes zero but is
      wide. Exact McNemar tests on clean-versus-poisoned correctness are significant
      at two and three poisoned passages ( p < 10 -3 ) and not at one ( p = 0 . 22
      ). We read this as a majority-leaning pattern consistent with outvoting a single
      wrong figure, not as a sharp phase transition proven under locked pairs. Because
      a model cannot sanity-check a bare number the way it can catch ''Madrid, Spain,''
      numeric corruption remains a quiet risk once it reaches critical mass.", "This
      is a heatmap chart displaying \"Fooled rate (%)\" data across three manipulation
      types (Entity swap, Number swap, Negation) as rows and four levels of poisoned
      documents (0/3, 1/3, 2/3, 3/3) as columns. The color gradient ranges from green
      (low fooled rate, ~8-10%) to red (high fooled rate, ~30-37%), showing that fooled
      rates consistently increase as the number of poisoned documents increases from
      0/3 to 3/3. Entity swap shows the highest fooled rates overall (10.2% to 36.7%),
      while Negation shows comparatively lower rates (8.2% to 30.6%), with Number
      swap falling in between (10.2% to 34.7%).", "TABLE III BEHAVIOUR BY STRATEGY,
      AVERAGED OVER ALL FOUR POISONING LEVELS. EACH STRATEGY AGGREGATES 196 RUNS.\n\n|
      Strategy    |   Clean acc. (%) |   Poisoned acc. (%) |   Fooled rate (%) |   Abstain
      rate (%) |\n|-------------|------------------|---------------------|-------------------|--------------------|\n|
      Entity swap |             78.1 |                54.6 |              23.5 |               43.4
      |\n| Number swap |             77.6 |                57.7 |              20.4
      |               30.1 |\n| Negation    |             78.1 |                60.2
      |              19.4 |               32.1 |", "This is a set of three stacked
      bar charts comparing model robustness under three perturbation types: Entity
      swap, Number swap, and Negation. Each chart''s x-axis shows the number of poisoned
      documents (0/3, 1/3, 2/3, 3/3) out of retrieved documents, while the y-axis
      shows the percentage of clean-correct cases, broken into three categories: \"Still
      correct\" (green), \"Abstained\" (blue), and \"Fooled\" (red). The data indicates
      that as poisoned documents increase, the proportion of \"Still correct\" responses
      generally declines while \"Abstained\" and/or \"Fooled\" responses increase,
      with Number swap showing the most pronounced increase in \"Fooled\" cases (reaching
      ~15-20% at 2/3 and 3/3 poisoned documents) compared to Entity swap and Negation,
      which show minimal fooling but more abstention.", "B. Accuracy Degradation\nOne
      detail in Table I needs to be read carefully. The 0 / 3 row still shows a fooled
      rate near 10% and an accuracy about 9 points below the clean arm, even though
      no passage is rewritten and both answers see the same retrieved list. That residual
      is therefore not a retrieval mismatch. It comes from decoding noise under temperature
      0.1 across two independent generations, plus a strict keyword matcher that can
      disagree on near-paraphrases. Recomputing from the 588-run table, clean and
      poisoned answers are identical in only 76.9% of the 0 / 3 runs. The residual
      is large relative to some attack increments (the rise from 9.5% to 15.0% fooled
      between 0 / 3 and 1 / 3 is 5.5 points), so strategy contrasts at light poisoning
      should be read as suggestive until decoding is controlled (fixed seeds, repeated
      draws) and labels are less brittle. We therefore read the clean-arm column,
      not the 0 / 3 poisoned cell, as the true no-attack baseline.", "This image consists
      of two line/bar charts comparing the effects of poisoned documents on model
      behavior, plotted against \"Poisoned documents (out of 3 retrieved)\" (0/3,
      1/3, 2/3, 3/3) on the x-axis.\n\nPanel (a) is a line chart showing \"Abstention
      rate (%)\" for four conditions: Entity swap (red), Number swap (orange), Negation
      (purple), and Clean arm (green dashed baseline ~13%). As poisoned documents
      increase, abstention rises sharply for Entity swap (up to ~70%), while Number
      swap and Negation show moderate increases (up to ~42%), and the Clean arm remains
      flat.\n\nPanel (b) is a grouped bar chart showing \"Hallucination rate (%)\"
      for Clean arm (blue) versus Poisoned arm (red) across the same x-axis categories,
      revealing that hallucination rates decrease as poisoned documents increase for
      both arms, with the Poisoned arm dropping from 26.5% to 12.2% and the Clean
      arm from 31.3% to 29.9%.", "F. How the Model Fails\nThe most useful result for
      a system designer is not how often the model is wrong but how it is wrong. Two
      failures are possible under attack. The model can accept the falsehood and state
      it, or it can notice the conflict and decline. It could also invent a third
      answer grounded in neither, which the hallucination proxy is meant to catch.\nThe
      evidence points to abstention as the dominant recorded failure mode. Averaged
      over all runs the model abstains on 35.2% of poisoned queries, well above the
      21.1% fooled rate. Figure 4(a) shows abstention climbing with poisoning for
      every strategy and reaching 69% for entity swap at full corruption. The lexical-overlap
      proxy moves the other way. Figure 4(b) shows that low-overlap answers are more
      common on the clean arm, near 29%, than on the poisoned arm, near 20%. Under
      this proxy, corrupted context does not look like a surge of unsupported invention;
      it looks like a surge of refusal. A fuller faithfulness taxonomy (entailment,
      contradiction, poison adoption, unsupported generation) would be needed before
      claiming that hallucination itself falls.\nFig. 1. Accuracy as a function of
      how many of the three retrieved passages are poisoned. Panel (a) shows poisoned
      accuracy per strategy against the shared clean baseline; the clean arm stays
      near 78% while every poisoned curve declines. Panel (b) shows the drop relative
      to the clean arm, where entity swap opens the widest gap at high poisoning.\nFig.
      2. Fooled rate for every strategy and poisoning level. Colour runs from green
      (safe) to red (many answers flipped). The number-swap row barely changes between
      zero and one poisoned passage, then rises steeply.\nFigure 5 decomposes only
      those queries the model answered correctly on clean context, so every bar starts
      from a fact the model knew. As poisoning grows, the green ''still correct''
      band shrinks and is replaced mostly by blue abstention, with the red ''fooled''
      band growing more slowly. Negation is the most resilient: even at full corruption
      a large share of originally correct answers survives, which matches our expectation
      that an explicit ''never'' is easier to distrust than a silent swap.\nFig. 3.
      Fooled rate by poisoning level. Entity swap and negation grow steadily, whereas
      number swap (bold) stays flat through one poisoned passage and then rises once
      poisoned passages become the majority. Intervals for the numberswap jump are
      reported in the text.", "D. Which Strategy Hurts Most\nTable III ranks the strategies.
      Entity swap has the highest fooled rate at 23.5% and the lowest poisoned accuracy,
      so it flips the largest share of answers that the model would otherwise get
      right. It also provokes the most abstention, 43.4%, which fits its mechanism:
      swapping ''Paris, France'' for ''Madrid, Spain'' can leave the passage internally
      inconsistent, and the model often reacts to that inconsistency by refusing to
      answer. Number swap and negation are close behind on fooled rate but keep higher
      poisoned accuracy.\nThe heatmap in Figure 2 gives the full strategy-by-level
      grid. Two patterns stand out. Fooled rates rise from left to right in every
      row, and the number-swap row is nearly flat across the first two columns before
      it jumps.", "| Dataset   | Planted   | Control   |   Attr. | 95% CI       |\n|-----------|-----------|-----------|---------|--------------|\n|
