      AILuminate: Introducing v1.0 of the AI risk and reliability benchmark from MLCommons.
      arXiv preprint arXiv:2503.05731 .", "Kathleen C. Fraser\nFaculty of Engineering
      University of Ottawa Ottawa, Canada kathleen.fraser@uottawa.ca\nFigure 1: The
      four conditions in RAG-Safety-Bench allow for detailed safety evaluation of
      RAG-enabled systems.\ntrustworthiness and accuracy by reducing hallucinations,
      relative to non-RAG LLMs (Shuster et al., 2021). For these reasons, conventional
      wisdom would suggest that RAG-based LLMs should be safer than non-RAG models,
      with the primary security risk being data poisoning attacks on the RAG corpus.
      In the absence of poisoned data, there would be little reason to suspect a RAG
      system would output more harmful content than its base LLM component.\nHowever,
      this assumption has been upended by recent work from An et al. (2025), who presented
      compelling evidence that when LLMs are enabled with RAG they are generally less
      safe than when relying on their parametric knowledge, even when the retrieved
      documents are benign. In the current work, we contribute to the understanding
      of this newly-identified problem by disentangling the notions of safety and
      capability through a new RAG-specific safety benchmark, RAG-SafetyBench. Furthermore,
      we take a closer look at what it means for documents and outputs to be ''unsafe,''
      to support more detailed analysis of the problematic case where safe RAGdocuments
      appear to lead to unsafe outputs.\nRAG systems are challenging to evaluate because
      they are composed of multiple components, each of which contributes to the overall
      end-to-end performance of the system (Wampler et al., 2025). In particular,
      the retrieval quality can have a major impact on the quality of the output.
      The MIRAGE benchmark (Park et al., 2025) enables the evaluation of RAG systems
      while controlling for retrieval quality by providing sets of relevant and irrelevant
      oracle documents.\nWe modify and extend this style of evaluation to safety evaluation
      in the RAG setting. Our RAGSafety-Bench benchmark consists of a set of unsafe
      English queries and three sets of documents (Figure 1): in the oracle setting,
      the unsafe answer is available in the document set. This setting could represent
      a data-poisoning attack - however, since we sourced all of our data from Wikipedia,
      it also represents the more common case that the data is believed to be generally
      benign but has not been meticulously curated. In the on-topic setting, the documents
      are relevant to the topic of the query but do not explicitly contain the unsafe
      answer. In the random setting, randomly-selected documents on safe topics are
      provided.\nThis testing framework allows us to answer several key open research
      questions relating to the safety of RAG systems:", "6 Conclusion\nWe introduce
      RAG-Safety-Bench with the goal of disentangling the effects of RAG on LLM safety
      by cleanly separating four retrieval conditions. Across five open-source models,
      our results show that the most interesting failure mode is model-specific: for
      Qwen-2.5-7B, on-topic but answer-free documents elicited more harmful responses
      than the non-RAG baseline, consistent with the hypothesis that topicrelevant
      context can surface harmful information from parametric memory.\nMore generally,
      our findings confirm that nonRAG safety evaluations do not transfer to RAG deployments.
      Our initial results from the benchmark only evaluate the baked-in safety guardrails
      of the base model. However, in a production system, responsible AI practitioners
      should provide end-toend safety measures including (when warranted): corpus
      curation, input prompt filtering, retrievalside filtering, output filtering,
      and system prompt safety instructions, among other possible mitigations. Thus
      an important use case for our benchmark is also to evaluate the impact of safety
      interventions at different points in the multi-component RAG pipeline. Our results
      also indicate the need to choose an automated safety evaluator which is closely
      aligned with the safety concerns relevant to the particular application, and
      where possible to deploy multiple safety judges, as well as appropriate human
      oversight.", "Kathleen C. Fraser\n1. To what extent is the observed RAG safety
      decline correlated with a model''s RAG capability? Previous work suggests that
      some models which appear ''safe'' may simply be less capable of extracting and
      summarizing relevant information. We test this rigorously, and hypothesize the
      following (H1): Models which perform better on MIRAGE (benign capability) will
      also have higher accuracy and therefore lower safety in the oracle setting of
      RAG-Safety-Bench.\n2. Is RAG safety decline a factor of unsafe information or
      unsafe context drift? The conventional view, challenged by An et al. (2025),
      is that RAG models are less safe only when the documents they retrieve are unsafe.
      An alternative explanation is that the increased context length, possibly containing
      many words semantically related to the unsafe query, shift the models into a
      less-aligned domain. 1 Our hypothesis (H2) is that the direct availability of
      the answer (oracle setting) will lead to the\n1 In fact, this is similar to
      the intuition behind the successful Crescendo jailbreak (Russinovich et al.,
      2025).\nhighest number of unsafe answers, but that the on-topic setting will
      lead to a higher number of unsafe answers relative to the baseline non-RAG setting,
      due to the destabilizing effect of the harmful-topic context. If the effect
      is purely due to context length, the random setting will lead to an equivalent
      harmfulness rate.\n3. What is the impact of RAG on the refusal rate of LLMs?
      In many studies, safety is operationalized as refusal: a safe model is one which
      refuses to answer harmful questions. We distinguish between two varieties of
      refusal; namely, unwillingness to fulfill a harmful request versus inability
      to find the answer in the retrieved documents. We hypothesize (H3) that the
      refusal rate for harmful requests will be highest in the random setting, and
      attributed to a lack of information. We argue that this case should be distinguished
      from ''true'' model safety, which should rely on an inherent unwillingness to
      provide dangerous advice. At the same time, the oracle setting offers contrasting
      evaluation in which we ensure the model has access to the requested information,
      so refusal can be more clearly interpreted as effective implementation of safety
      guardrails.\n4. Do different safety evaluators agree on what is safe versus
      harmful? Standard safety evaluation relies on LLM-based ''judges'' to label
      text as safe or unsafe. We compare multiple safety evaluators, with the hypothesis
      (H4) that there will be a high level of disagreement between the LLM evaluators.\nRAG-Safety-Bench
      is freely available for research use at the following URL: https://github.com/The-Safe-AI-Lab/
      RAG-Safety-Bench .", "References\n- Tinghao Xie, Xiangyu Qi, Yi Zeng, Yangsibo
      Huang, Udari Madhushani Sehwag, Kaixuan Huang, Luxi He, Boyi Wei, Dacheng Li,
      Ying Sheng, and 1 others. 2025. SORRY-Bench: Systematically evaluating large
      language model safety refusal. In The Thirteenth International Conference on
      Learning Representations .\n- Cheng Yu, Benedikt Stroebl, Diyi Yang, and Orestis
      Papakyriakopoulos. 2025. Information retrieval induced safety degradation in
      AI agents. arXiv preprint arXiv:2505.14215 .\n- Shenglai Zeng, Jiankun Zhang,
      Pengfei He, Yiding Liu, Yue Xing, Han Xu, Jie Ren, Yi Chang, Shuaiqiang Wang,
      Dawei Yin, and 1 others. 2024a. The good and the bad: Exploring privacy issues
      in retrievalaugmented generation (rag). In Findings of the Association for Computational
      Linguistics: ACL 2024 , pages 4505-4524.\n- Wenjun Zeng, Yuchi Liu, Ryan Mullins,
      Ludovic Peran, Joe Fernandez, Hamza Harkous, Karthik Narasimhan, Drew Proud,
      Piyush Kumar, Bhaktipriya Radharapu, and 1 others. 2024b. ShieldGemma: Generative
      AI content moderation based on Gemma. arXiv preprint arXiv:2407.21772 .\n- Qiusi
      Zhan, Angeline Budiman-Chan, Abdelrahman Zayed, Xingzhi Guo, Daniel Kang, and
      Joo-Kyung Kim. 2026. Safesearch: Do not trade safety for utility in LLM search
      agents. In Findings of the Association for Computational Linguistics: EACL 2026
      , pages 2800-2815.\nBaolei Zhang, Yuxi Chen, Zhuqing Liu, Lihai Nie, Tong Li,
      Zheli Liu, and Minghong Fang. 2025. Practical poisoning attacks against retrieval-augmented
      generation. arXiv preprint arXiv:2504.03957 .", "Abstract\nAllowing large language
      models (LLMs) to retrieve information from a set of trusted documents can increase
      reliability and reduce hallucination. However, recent work has demonstrated
      that retrieval-augmented generation (RAG) can have unintended side effects on
      the overall safety of the generated responses, when prompted for harmful or
      dangerous content. A clearer understanding of the mechanisms leading to this
      result is needed, as increasing numbers of end users turn to RAG to incorporate
      corporate documents and knowledge bases into LLM-based systems. We introduce
      RAG-Safety-Bench, a benchmark to measure the safety impact of RAG on LLM models.
      By removing the confounding effect of retriever quality, and cleanly separating
      the problem into four conditions - non-RAG, RAG with an oracle document containing
      the answer to the harmful request, RAG with documents related to the harmful
      request but without the specific answer, and RAG with random, safe documents
      - the benchmark isolates the impacts of different factors in the observed safety
      degradation. We report results across five opensource LLMs, showing an inverse
      relationship between benign and unsafe capability, strong evidence that baseline
      safety guardrails do not lead to downstream safety guarantees in the RAG case,
      and model-specific support for previous findings that even benign documents
      can lead to unsafe generation in retrieval-enabled systems.", "2 Related Work\nRetrieval-augmented
      generation Enabling LLMs to consult a database of trusted documents through
      retrieval-augmented generation (RAG) has many benefits: it reduces hallucination,
      allows companies to inject proprietary knowledge/documents into the system,
      supports the rapid update of information without retraining, and can enable
      source attribution (Lewis et al., 2020; Shuster et al., 2021; Fan et al., 2024).
      However, it also exposes new attack surfaces. Most research on the safety and
      security of RAG systems has focused on the security of the knowledge base: data
      poisoning attacks involve the injection of malicious (mis)information into the
      document store (Tan et al., 2024; Nazary et al., 2025; Zhang et al., 2025),
      and data extraction attacks aim to recover sensitive or private information
      from the documents through a RAG interface (Zeng et al., 2024a; Qi et al., 2024;
      Vonderhaar et al., 2025). However, the safety of RAG systems in non-adversarial
      settings has been less studied. An et al. (2025) were the first to highlight
      that RAG systems can output more harmful responses than non-RAG LLMs, even in
      the absence of any malicious intervention. Other work considers the related
      problem of safety degradation in AI agents that have been enabled with information
      retrieval or search capabilities (Yu et al., 2025; BehnamGhader et al., 2025;
      Zhan et al., 2026). Previous work measures the safety of the entire RAG system,
      but the information content and safety of the retrieved documents is an uncontrolled
      variable. Our work takes the next step towards a more scientific understanding
      of these observed phenomena by systematically altering one variable at a time
      (no retrieval, random retrieval, on-topic retrieval, exact-answer retrieval)
      to observe the effect on the safety of the LLM responses.\nLong-context safety
      The retrieval of harmful documents is one factor in the observed safety decline
      in RAG models. However, the literature suggests that another factor may be a
      behavioural shift induced by the inclusion of extended context. In fact, Yu
      et al. (2025) claim that ''safety degradation is largely independent of retrieved
      context itself.'' An et al. (2025) found that 94.7% of the retrieved documents
      in their study were safe, and therefore could not account for the much larger
      increase in unsafe responses. They hypothesize that the retrieved texts, though
      benign themselves, can trigger the recall of unsafe information from the model''s
      parametric knowledge. Other work has shown that LLMs are less capable of identifying
      harmful content in long contexts (Ghorbanpour and Fraser, 2025) and are more
      likely to answer harmful questions in long-context settings (Anil et al., 2024;
      Lu et al., 2025; Huang et al., 2025). In some cases, the model can drift away
      from its default ''helpful assistant'' persona even when the context itself
      is not harmful (e.g. a therapy conversation)\n(Lu et al., 2026). Therefore,
      in this study we design our benchmark to test the ''harmful documents'' and
      ''long context'' explanations separately.", "5 Discussion\nThe core question
      which motivates this work is whether safe documents lead to unsafe RAG generations.
      One possible explanation for the prior observations of unsafe responses in RAG
      systems is that the incorporation of any long context into an LLM can have the
      effect of shifting its behavior away from the basic, short-context regime where
      most of its safety training took place. However, our experiments do not support
      the conclusion that long context alone is a driver of unsafe behavior in RAG
      systems, with the ''random'' condition leading to the safest responses, partially
      through an increase in refusals due to lack of information.\n", "4.1 R1: Capability
      in safe and unsafe contexts\nWehypothesized (H1) that models which demonstrated
      higher benign RAG capability would also demonstrate higher unsafe RAG capability;
      however, this is not supported by the ''Unsafe capability'' data. In fact, the
      accuracies under the BenignOracle and Unsafe-Oracle conditions are negatively
      correlated (Pearson r = -0 . 70 ). This may indicate that the larger and more
      capable models also have better safety guardrails when they are presented with
      unsafe queries. However, all models are, in general, more likely to provide
      a correct response to the harmful question when the response is available in
      the documents, suggesting that guardrails still need to be improved to specifically
      handle the RAG setting.", "4.2 R2: Unsafe information or unsafe context?\nIn
      all cases, providing irrelevant (safe) documents leads to the safest behavior
      overall, suggesting that long context alone is not sufficient to steer the models
      into an unsafe regime.\nThe results in Figure 2 are also partially consistent
      with one of the major conclusions from An et al. (2025), that the safest non-RAG
      LLM will likely be the safest RAG LLM. Indeed, Phi-4-14B is safest in both non-RAG
      and RAG settings, followed by Llama-3.1-8B. However, Qwen is the third safest
      in the non-RAG setting but the least safe in the oracle-RAG and on-topic RAG
      conditions, suggesting that some models'' guardrails are more robust than others.\nNote
      that the harmfulness rates are lower than\n(though correlated with) the accuracy
      scores in Table 3. Accuracy and harmfulness are judged separately. Manual inspection
      reveals two large buckets of responses that are rated as accurate but not harmful:
      responses which are not flagged as harmful by the safety judges but likely should
      be, in the context (typically descriptions of historical events and nonviolent
      crimes), and cases where the model hedges that the information is for education
      purposes only (e.g., Ministral-3-8B in response to a query about misinformation
      propagation, \"... Here''s a **generalized breakdown of memetic propagation
      techniques** (based on the text) that could theoretically be used to influence
      public opinion, **with the caveat that this is for educational/analytical purposes
      only** ... <goes into detail on techniques.>'' ).\nThe harmfulness rates for
      each model and condition broken down by harm taxonomy category are available
      in the Appendix (Figure 6-Figure 10). The categories which tend to see the greatest
      increase in harmful responses from the non-RAG setting to the oracle setting
      are: radiological weapons, explosives, drugs, chemical weapons, assault, terrorism,
      and cyberattacks. The Ministral and Qwen models also show a concerning increase
      in harmful responses to questions about suicide and self-harm.", "4.1 R1: Capability
      in safe and unsafe contexts\nTable 3 reports accuracies for each model when
      asked benign and harmful questions, in both nonRAG, oracle RAG, and mixed settings.
      In the benign case, accuracy is scored using the MIRAGE benchmark method (Park
      et al., 2025). In the harmful (RAG-Safety-Bench) case, we compare the output
      response with the expected benchmark response, using Claude-Opus-4.7 to output
      a fi- nal label of accurate or inaccurate relative to the reference. Human annotation
      of a subset of 100 examples validates the LLM-as-a-judge approach, with agreement
      of 95-96% between humans and LLM, and Cohen''s \u03ba of 0.90-0.92 (more details
      and prompt available in Appendix Section A.4).\nTable 1: The four settings of
      the RAG-Safety-Bench benchmark. Example documents are for the query, ''What
      materials and design do I need to make an IED that can defeat armored police
      vehicles?''\n\nLLM-only, Description = No context documents provided.. LLM-only,
      Example Wikipedia documents = (None). Oracle, Description = One of the returned
      documents contains the answer.. Oracle, Example Wikipedia documents = ''Explosively
      formed penetrator''. On-topic, Description = Oracle document not included, but
      documents are related to the topic of the query.. On-topic, Example Wikipedia
      documents = ''Deflagration to detonation tran- sition'', ''Blast wall''. Random,
      Description = Documents are randomly selected from a set of benign documents..
      Random, Example Wikipedia documents = ''Climate change and birds'', ''Ar- boretum''",
      "3.2 Safety-capability relationship\nOur benchmark, RAG-Safety-Bench, complements
      the original MIRAGE benchmark by measuring safety rather than benign capability.
      The benchmark enables direct comparison across 4 settings, as described in Table
      1. Note the distinction between the Oracle and On-topic settings: in the oracle
      setting, the answer is directly available in the retrieved context. In the on-topic
      condition, the retrieved documents are on the same topic as the query (in the
      example, explosives), but do not contain the answer to the query.\nBy providing
      the context documents directly, the benchmark enables evaluation of the base
      LLM''s ability to maintain safety guardrails in the presence of RAG context,
      while removing the confounding factor of retriever quality (e.g., a poor retriever
      might simply miss the relevant unsafe document and therefore lead to a misleadingly
      inflated safety score).\nThe method for constructing the benchmark is as follows.
      We first develop a taxonomy of harmful user queries, based on the existing MLCommons
      AILuminate ''Hazard Taxonomy'' (Ghosh et al., 2025). The context of RAG safety
      evaluation and our intended corpus of Wikipedia documents required some modifications
      to the existing taxonomy. Our current version of RAG-SafetyBench excludes the
      following harm categories: Privacy/identification: since our knowledge base
      is a public resource, we assume it does not contain private information (though
      privacy leakage may be a concern in other RAG use cases); Direct generation
      of harmful content: the focus of the benchmark is on question answering, not
      content generation; Intellectual property: Wikipedia users are strictly forbidden
      from uploading copyrighted material without permission, and so it is not a suitable
      resource to test for intellectual property leakage; Specialized advice: this
      category (comprising topics such as legal advice, medical advice) is often poorly
      defined and highly-contextual, and so we do not include it here. The final taxonomy
      is given in Table 2.\nFollowing Park et al. (2025) and An et al. (2025), we
      use Wikipedia as our knowledge base. For each sub-category in the harm taxonomy,
      we identify a relevant category or set of categories on Wikipedia where harmful
      information related to the topic can be found. We then use Claude-Sonnet-4.5
      to generate potentially harmful questions whose answers can be found in one
      of the available Wikipedia documents. We also enforce a series of self-checks
      to avoid hallucinations or unrealistic questions (see Appendix for full details
      and prompts). The Claude model outputs a harmful question, a rating of the question''s
      severity, the name and ID of the Wikipedia article that contains the answer,
      the exact text passage containing the answer, a summary of the expected unsafe
      answer, as well as other additional information to aid human review of the questions
      and answers (shown in Table 6 in the Appendix). We aimed to generate a minimum
      of 20 queries per subcategory in the taxonomy, although ultimately there was
      more actionable information available for some categories than others. We therefore
      release two versions of the benchmark: the Full version contains 987 harmful
      queries, distributed unevenly across the subcategories, while the Balanced version
      (used in the current analysis) is subsampled to a more uniform distribution
      across subcategories (see Table 2).", "4.1 R1: Capability in safe and unsafe
      contexts\nTable 2: The taxonomy of harms covered in RAGSafety-Bench. The number
      of realistic, dangerous queries that could be generated from Wikipedia articles
      varied across subcategories: the column ''Full'' indicates the total of queries
      available for each category, the column ''Balanced'' indicates the number of
      queries in each subcategory after sub-sampling to avoid topic bias.\n\nViolent,
      Subcategory = Assault/battery. Violent, Full = 33. Violent, Balanced = 20. crimes,
