      and Peng, V., eds., Findings of the Association for Computational Linguistics:
      EMNLP 2025 , 4104-4121. Suzhou, China: Association for Computational Linguistics.
      ISBN 979-8-89176-335-7.", "Limitations\nEvaluation format differs from training.
      The RLVR agents were trained to search, read, and answer across multiple turns
      in their own tagged format, whereas our evaluation supplies five fixed passages
      and requests a single citation-bearing response. This was necessary for the
