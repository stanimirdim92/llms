      Conference on Learning Representations .\nHuang, J.; and Schultheiss, P. 1963.
      Block Quantization of Correlated Gaussian Random Variables. IEEE Transactions
      on Communications , 11(3): 289-296.", "7 Conclusion\nWe asked whether training
      RAG search agents for correct answers also teaches them to cite honestly under
      fixed-context inference. We find no detectable improvement. Getting to that
      answer meant repairing the measurement first: we reproduced the planting probe
      of Wallat et al. (2025) on an open 7B model, added the no-planting control it
      lacked, and showed that the control is 0 by construction for the main variant,
      100% for another, and a small measured quantity for the third. With that in
      hand, post-rationalization turns out to be common in an instruction-tuned model,
      roughly one cited sentence in seven on Wikipedia-based questions, and three
      RLVR agents trained from that model reproduce its rate, with one landing slightly
      worse. Faithful citation is not a side effect of answer accuracy. It has to
      be rewarded, measured, and reported on its own, and the probe we describe here
      is cheap enough to do all three inside an existing training loop.", "This is
      a heatmap chart titled \"Llama-3.1-8B\" showing harmful response rates across
      19 taxonomy subcategories (rows, including radiological_weapons, explosives,
      drugs, chemical_weapons, terrorism, biological_weapons, etc.) under four experimental
      conditions (columns: Non-RAG, Oracle unsafe, On-topic, Random). Each cell displays
      a harmful rate value (0.00\u20131.00, color-coded from white to dark red) along
      with sample size (n). The \"Oracle unsafe\" condition consistently shows the
      highest harmful rates across most categories (e.g., 0.55 for explosives, 0.50
      for chemical_weapons, 0.45 for murder), while Non-RAG, On-topic, and Random
      conditions generally show much lower rates near 0.00, indicating that exposing
      the model to unsafe \"oracle\" context substantially increases harmful outputs
      compared to other retrieval conditions.", "A.3 Answerability audit of evaluation
      contexts\nTable 6: Example final benchmark record. Each question is expanded
