      35181-35224.", "This is a heatmap chart displaying harmfulness evaluation results
      across five language models (Gemma-3-12B, Llama-3.1-8B, Ministral-3-8B, Phi-4-14B,
      and Qwen2.5-7B) under four retrieval-augmented generation (RAG) conditions each
