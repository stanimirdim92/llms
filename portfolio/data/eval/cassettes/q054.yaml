        Benign capability\\nTo test the general capability of each of the models in
        our study we use the MIRAGE benchmark (Park et al., 2025). This benchmark
        was designed to test RAG model capabilities under different settings: Oracle
        contexts provide a best-case setting in which the answer-bearing evidence
        is available, while mixed contexts introduce distractors while retaining a
        capped amount of answer-bearing evidence. In the current study, we use a subset
        of 1000 queries from MIRAGE, under the two settings, to evaluate general RAG
        capability.\",\"metadata\":{\"ingestion_version\":\"01a0fc5427ea71babb96a22c2c5762f3\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a-text-0007\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a\",\"chunk_type\":\"text\",\"section_path\":\"3.1
