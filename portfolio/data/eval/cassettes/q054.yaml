    body: '{"query": "Which of my papers study the safety of RAG systems?", "documents":
      ["References\n- Zhenting Qi, Hanlin Zhang, Eric P Xing, Sham M Kakade, and Himabindu
      Lakkaraju. 2024. Follow my instruction and spill the beans: Scalable data extraction
      from retrieval-augmented generation systems. In ICLR 2024 Workshop on Navigating
      and Addressing Data Problems for Foundation Models .\n- Mark Russinovich, Ahmed
      Salem, and Ronen Eldan. 2025. Great, now write an article about that: The crescendo
      { Multi-Turn }{ LLM } jailbreak attack. In 34th USENIX Security Symposium (USENIX
      Security 25) , pages 2421-2440.\n- Kurt Shuster, Spencer Poff, Moya Chen, Douwe
      Kiela, and Jason Weston. 2021. Retrieval augmentation reduces hallucination
      in conversation. In Findings of the Association for Computational Linguistics:
      EMNLP 2021 , pages 3784-3803.\n- Hao Sun, Zhexin Zhang, Jiawen Deng, Jiale Cheng,
      and Minlie Huang. 2023. Safety assessment of Chinese large language models.
      arXiv preprint arXiv:2304.10436 .\n- Zhen Tan, Chengshuai Zhao, Raha Moraffah,
      Yifan Li, Song Wang, Jundong Li, Tianlong Chen, and Huan Liu. 2024. Glue pizza
      and eat rocks-exploiting vulnerabilities in retrieval-augmented generative models.
      In Proceedings of the 2024 Conference on Empirical Methods in Natural Language
      Processing , pages 1610-1626.\n- Bertie Vidgen, Nino Scherrer, Hannah Rose Kirk,
      Rebecca Qian, Anand Kannappan, Scott A Hale, and Paul R\u00f6ttger. 2023. SimpleSafetyTests:
      A test suite for identifying critical safety risks in large language models.
      arXiv preprint arXiv:2311.08370 .\n- Lynn Vonderhaar, Daniel Machado, and Omar
      Ochoa. 2025. Surveying the RAG attack surface and defenses: Protecting sensitive
      company data. In 2025 IEEE International Conference on Artificial Intelligence
      Testing (AITest) , pages 69-76. IEEE.\n- Dean Wampler, Dave Nielson, and Alireza
      Seddighi. 2025. Engineering the RAG stack: A comprehensive review of the architecture
