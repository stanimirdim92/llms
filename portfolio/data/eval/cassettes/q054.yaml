    body: '{"max_tokens":1024,"messages":[{"role":"user","content":[{"type":"document","source":{"type":"text","media_type":"text/plain","data":"Kathleen
      C. Fraser\nFaculty of Engineering University of Ottawa Ottawa, Canada kathleen.fraser@uottawa.ca\nFigure
      1: The four conditions in RAG-Safety-Bench allow for detailed safety evaluation
      of RAG-enabled systems.\ntrustworthiness and accuracy by reducing hallucinations,
      relative to non-RAG LLMs (Shuster et al., 2021). For these reasons, conventional
      wisdom would suggest that RAG-based LLMs should be safer than non-RAG models,
      with the primary security risk being data poisoning attacks on the RAG corpus.
      In the absence of poisoned data, there would be little reason to suspect a RAG
      system would output more harmful content than its base LLM component.\nHowever,
      this assumption has been upended by recent work from An et al. (2025), who presented
      compelling evidence that when LLMs are enabled with RAG they are generally less
      safe than when relying on their parametric knowledge, even when the retrieved
      documents are benign. In the current work, we contribute to the understanding
      of this newly-identified problem by disentangling the notions of safety and
      capability through a new RAG-specific safety benchmark, RAG-SafetyBench. Furthermore,
      we take a closer look at what it means for documents and outputs to be ''unsafe,''
      to support more detailed analysis of the problematic case where safe RAGdocuments
      appear to lead to unsafe outputs.\nRAG systems are challenging to evaluate because
      they are composed of multiple components, each of which contributes to the overall
      end-to-end performance of the system (Wampler et al., 2025). In particular,
      the retrieval quality can have a major impact on the quality of the output.
      The MIRAGE benchmark (Park et al., 2025) enables the evaluation of RAG systems
      while controlling for retrieval quality by providing sets of relevant and irrelevant
      oracle documents.\nWe modify and extend this style of evaluation to safety evaluation
      in the RAG setting. Our RAGSafety-Bench benchmark consists of a set of unsafe
      English queries and three sets of documents (Figure 1): in the oracle setting,
      the unsafe answer is available in the document set. This setting could represent
      a data-poisoning attack - however, since we sourced all of our data from Wikipedia,
      it also represents the more common case that the data is believed to be generally
      benign but has not been meticulously curated. In the on-topic setting, the documents
      are relevant to the topic of the query but do not explicitly contain the unsafe
      answer. In the random setting, randomly-selected documents on safe topics are
      provided.\nThis testing framework allows us to answer several key open research
      questions relating to the safety of RAG systems:"},"title":"2609.11758v1.pdf
      [01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a] (text, page
      1)","citations":{"enabled":true}},{"type":"document","source":{"type":"text","media_type":"text/plain","data":"2
      Related Work\nRetrieval-augmented generation Enabling LLMs to consult a database
      of trusted documents through retrieval-augmented generation (RAG) has many benefits:
      it reduces hallucination, allows companies to inject proprietary knowledge/documents
      into the system, supports the rapid update of information without retraining,
      and can enable source attribution (Lewis et al., 2020; Shuster et al., 2021;
      Fan et al., 2024). However, it also exposes new attack surfaces. Most research
      on the safety and security of RAG systems has focused on the security of the
      knowledge base: data poisoning attacks involve the injection of malicious (mis)information
      into the document store (Tan et al., 2024; Nazary et al., 2025; Zhang et al.,
      2025), and data extraction attacks aim to recover sensitive or private information
      from the documents through a RAG interface (Zeng et al., 2024a; Qi et al., 2024;
      Vonderhaar et al., 2025). However, the safety of RAG systems in non-adversarial
      settings has been less studied. An et al. (2025) were the first to highlight
      that RAG systems can output more harmful responses than non-RAG LLMs, even in
      the absence of any malicious intervention. Other work considers the related
      problem of safety degradation in AI agents that have been enabled with information
      retrieval or search capabilities (Yu et al., 2025; BehnamGhader et al., 2025;
      Zhan et al., 2026). Previous work measures the safety of the entire RAG system,
      but the information content and safety of the retrieved documents is an uncontrolled
      variable. Our work takes the next step towards a more scientific understanding
      of these observed phenomena by systematically altering one variable at a time
      (no retrieval, random retrieval, on-topic retrieval, exact-answer retrieval)
      to observe the effect on the safety of the LLM responses.\nLong-context safety
      The retrieval of harmful documents is one factor in the observed safety decline
      in RAG models. However, the literature suggests that another factor may be a
      behavioural shift induced by the inclusion of extended context. In fact, Yu
      et al. (2025) claim that ''safety degradation is largely independent of retrieved
      context itself.'' An et al. (2025) found that 94.7% of the retrieved documents
      in their study were safe, and therefore could not account for the much larger
      increase in unsafe responses. They hypothesize that the retrieved texts, though
      benign themselves, can trigger the recall of unsafe information from the model''s
      parametric knowledge. Other work has shown that LLMs are less capable of identifying
      harmful content in long contexts (Ghorbanpour and Fraser, 2025) and are more
      likely to answer harmful questions in long-context settings (Anil et al., 2024;
      Lu et al., 2025; Huang et al., 2025). In some cases, the model can drift away
      from its default ''helpful assistant'' persona even when the context itself
      is not harmful (e.g. a therapy conversation)\n(Lu et al., 2026). Therefore,
      in this study we design our benchmark to test the ''harmful documents'' and
      ''long context'' explanations separately."},"title":"2609.11758v1.pdf [01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a]
      (text, page 2)","citations":{"enabled":true}},{"type":"document","source":{"type":"text","media_type":"text/plain","data":"Abstract\nAllowing
      large language models (LLMs) to retrieve information from a set of trusted documents
      can increase reliability and reduce hallucination. However, recent work has
      demonstrated that retrieval-augmented generation (RAG) can have unintended side
      effects on the overall safety of the generated responses, when prompted for
      harmful or dangerous content. A clearer understanding of the mechanisms leading
      to this result is needed, as increasing numbers of end users turn to RAG to
      incorporate corporate documents and knowledge bases into LLM-based systems.
      We introduce RAG-Safety-Bench, a benchmark to measure the safety impact of RAG
      on LLM models. By removing the confounding effect of retriever quality, and
      cleanly separating the problem into four conditions - non-RAG, RAG with an oracle
      document containing the answer to the harmful request, RAG with documents related
      to the harmful request but without the specific answer, and RAG with random,
      safe documents - the benchmark isolates the impacts of different factors in
      the observed safety degradation. We report results across five opensource LLMs,
      showing an inverse relationship between benign and unsafe capability, strong
      evidence that baseline safety guardrails do not lead to downstream safety guarantees
      in the RAG case, and model-specific support for previous findings that even
      benign documents can lead to unsafe generation in retrieval-enabled systems."},"title":"2609.11758v1.pdf
      [01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a] (text, page
      1)","citations":{"enabled":true}},{"type":"document","source":{"type":"text","media_type":"text/plain","data":"In
      RAG We Trust? Measuring Robustness of Retrieval-Augmented Generation Under Document
      Poisoning\nIliano Fasolino Department of Computer Science University of Milan
      Milan, Italy\nAbstract -Retrieval-augmented generation (RAG) grounds a language
      model in retrieved documents, which reduces hallucination but creates a new
      attack surface: if retrieved text is tampered with, the model may repeat the
      falsehood. We study how much a small quantized model, Llama 3.1 8B, degrades
      when a fraction of its retrieved context is poisoned. Three corruption strategies
      are tested, entity swap, number swap, and negation, each applied to zero, one,
      two, or three of the three retrieved passages, over a factorial sweep of 588
      runs on a fact-checking task built from FEVER. Accuracy falls from 77.9% on
      clean context to 43.5% when all three passages are corrupted. Entity swap flips
      the largest share of answers that were correct on clean context. Number-based
      corruption stays flat while poisoned passages are a minority and jumps once
      they form a majority, a pattern we re-check with query-level bootstrap intervals.
      The model rarely invents new falsehoods; its dominant reaction is to abstain,
      and a lexical overlap proxy of unsupported generation falls under attack rather
      than rising. The study is a small-scale measurement with coarse automated labels;
      we treat the strategy contrasts as suggestive until decoding is controlled and
      stronger adjudication is in place.\na practitioner running a small model on
      modest hardware is a concrete measurement: how far does accuracy fall, which
      kind of corruption bites hardest, and does the model fail loudly by fabricating
      or quietly by refusing.\nIndex Terms -retrieval-augmented generation, large
      language models, adversarial robustness, document poisoning, fact verification"},"title":"2609.09243v1.pdf
      [01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead] (text, page
      1)","citations":{"enabled":true}},{"type":"document","source":{"type":"text","media_type":"text/plain","data":"I.
      INTRODUCTION\nLarge language models answer questions fluently but carry two
      well-known liabilities: their knowledge is frozen at training time, and they
      sometimes state false facts with full confidence. Retrieval-augmented generation,
      proposed by Lewis et al. [1], addresses both by fetching relevant documents
      at query time and placing them in the prompt as evidence. The model is then
      asked to answer from that evidence rather than from memory alone. This design
      has become the default recipe for question answering over private or fast-moving
      knowledge bases.\nThe same design introduces a dependency that is easy to overlook.
      A RAG answer is only as trustworthy as the documents it retrieves. If an attacker
      can edit, inject, or otherwise corrupt even part of the retrieved set, the grounding
      step that was meant to improve reliability becomes a channel for misinformation.
      Shi et al. [3] showed that irrelevant context alone can pull a model off track;
      corrupted but on-topic context is a stronger lever, because it looks exactly
      like the evidence the model was told to trust. What is still missing for We
      answer those three questions empirically. Our contribution is threefold. First,
      we build a reproducible poisoning testbed around a 4-bit Llama 3.1 8B model,
      a MiniLM retriever, and a FAISS index of nearly twenty thousand FEVER evidence
      sentences. Second, we run a full factorial experiment, three corruption strategies
      crossed with four poisoning levels over a fixed query set, and report accuracy,
      a fooled rate, abstention, and a lexical-overlap proxy of unsupported generation
      for every cell. Third, we characterise the failure surface: entity corruption
      flips the most answers, numeric corruption jumps once it reaches a majority
      of the context, and the model''s default response to contradiction is to abstain
      rather than to invent. Every point estimate reported here comes from the same
      588-run table. Where we interpret a jump or a strategy ranking, we also report
      query-level bootstrap intervals and paired tests recomputed from that table."},"title":"2609.09243v1.pdf
      [01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead] (text, page
      1)","citations":{"enabled":true}},{"type":"document","source":{"type":"text","media_type":"text/plain","data":"H.
      Relation to Prior Work\nOur findings extend the RAG picture drawn by Lewis et
      al. [1] from the cooperative case to an adversarial one: retrieval that lifts
      accuracy on clean corpora becomes a liability on corrupted ones. Where Shi et
      al. [3] showed that off-topic context distracts a model, we show that on-topic
      but false context does more, because it wears the appearance of the evidence
      the model was told to trust. The abstention-overfabrication pattern we measure
      is an empirical answer, for a small quantized model, to how such a system fails
      when the context is corrupted rather than merely irrelevant. The retrieval-integrated
      pre-training of Guu et al. [5] shares the grounding assumption our attack targets.
      Zhou et al. [4] warn that evaluation can leak into training and inflate scores;
      we keep the FEVER-derived query set fixed and report every cell from the same
      588-run table so strategy comparisons are not an artifact of shifting test items.\nFig.
      4. Failure behaviour across poisoning levels. Panel (a): abstention rises with
      poisoning for every strategy, most steeply for entity swap. Panel (b): the lexical-overlap
      proxy of unsupported generation is higher on the clean arm than the poisoned
      arm for all three strategies.\nFig. 5. Outcome of queries that were correct
      on clean context, split by strategy and poisoning level. Green is still correct,
      blue is abstained, red is fooled. The lost green area is absorbed mainly by
      abstention, and negation retains the most correct answers."},"title":"2609.09243v1.pdf
