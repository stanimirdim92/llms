        arXiv:2503.05731 .\",\"metadata\":{\"ingestion_version\":\"01a0fc5427ea71babb96a22c2c5762f3\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a-text-0022\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a\",\"chunk_type\":\"text\",\"section_path\":\"References\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":100,\"page_no\":10,\"filename\":\"2609.11758v1.pdf\"}}},{\"id\":\"fdef7d6e-6f33-507f-b2bf-e72cdaf10ddb\",\"version\":9,\"score\":0.71385735,\"payload\":{\"page_content\":\"Kathleen
        C. Fraser\\nFaculty of Engineering University of Ottawa Ottawa, Canada kathleen.fraser@uottawa.ca\\nFigure
        1: The four conditions in RAG-Safety-Bench allow for detailed safety evaluation
        of RAG-enabled systems.\\ntrustworthiness and accuracy by reducing hallucinations,
        relative to non-RAG LLMs (Shuster et al., 2021). For these reasons, conventional
        wisdom would suggest that RAG-based LLMs should be safer than non-RAG models,
        with the primary security risk being data poisoning attacks on the RAG corpus.
        In the absence of poisoned data, there would be little reason to suspect a
        RAG system would output more harmful content than its base LLM component.\\nHowever,
        this assumption has been upended by recent work from An et al. (2025), who
        presented compelling evidence that when LLMs are enabled with RAG they are
        generally less safe than when relying on their parametric knowledge, even
        when the retrieved documents are benign. In the current work, we contribute
        to the understanding of this newly-identified problem by disentangling the
        notions of safety and capability through a new RAG-specific safety benchmark,
        RAG-SafetyBench. Furthermore, we take a closer look at what it means for documents
        and outputs to be 'unsafe,' to support more detailed analysis of the problematic
        case where safe RAGdocuments appear to lead to unsafe outputs.\\nRAG systems
        are challenging to evaluate because they are composed of multiple components,
        each of which contributes to the overall end-to-end performance of the system
        (Wampler et al., 2025). In particular, the retrieval quality can have a major
        impact on the quality of the output. The MIRAGE benchmark (Park et al., 2025)
        enables the evaluation of RAG systems while controlling for retrieval quality
        by providing sets of relevant and irrelevant oracle documents.\\nWe modify
        and extend this style of evaluation to safety evaluation in the RAG setting.
        Our RAGSafety-Bench benchmark consists of a set of unsafe English queries
        and three sets of documents (Figure 1): in the oracle setting, the unsafe
        answer is available in the document set. This setting could represent a data-poisoning
        attack - however, since we sourced all of our data from Wikipedia, it also
        represents the more common case that the data is believed to be generally
        benign but has not been meticulously curated. In the on-topic setting, the
        documents are relevant to the topic of the query but do not explicitly contain
        the unsafe answer. In the random setting, randomly-selected documents on safe
        topics are provided.\\nThis testing framework allows us to answer several
        key open research questions relating to the safety of RAG systems:\",\"metadata\":{\"ingestion_version\":\"01a0fc5427ea71babb96a22c2c5762f3\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a-text-0003\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a\",\"chunk_type\":\"text\",\"section_path\":\"Kathleen
        C. Fraser\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":8,\"page_no\":1,\"filename\":\"2609.11758v1.pdf\"}}},{\"id\":\"20fd44c5-f345-560a-92d1-524ad6c48da6\",\"version\":9,\"score\":0.70193326,\"payload\":{\"page_content\":\"6
        Conclusion\\nWe introduce RAG-Safety-Bench with the goal of disentangling
        the effects of RAG on LLM safety by cleanly separating four retrieval conditions.
        Across five open-source models, our results show that the most interesting
        failure mode is model-specific: for Qwen-2.5-7B, on-topic but answer-free
        documents elicited more harmful responses than the non-RAG baseline, consistent
        with the hypothesis that topicrelevant context can surface harmful information
        from parametric memory.\\nMore generally, our findings confirm that nonRAG
        safety evaluations do not transfer to RAG deployments. Our initial results
        from the benchmark only evaluate the baked-in safety guardrails of the base
        model. However, in a production system, responsible AI practitioners should
        provide end-toend safety measures including (when warranted): corpus curation,
        input prompt filtering, retrievalside filtering, output filtering, and system
        prompt safety instructions, among other possible mitigations. Thus an important
        use case for our benchmark is also to evaluate the impact of safety interventions
        at different points in the multi-component RAG pipeline. Our results also
        indicate the need to choose an automated safety evaluator which is closely
        aligned with the safety concerns relevant to the particular application, and
        where possible to deploy multiple safety judges, as well as appropriate human
        oversight.\",\"metadata\":{\"ingestion_version\":\"01a0fc5427ea71babb96a22c2c5762f3\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a-text-0018\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a\",\"chunk_type\":\"text\",\"section_path\":\"6
        Conclusion\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":85,\"page_no\":9,\"filename\":\"2609.11758v1.pdf\"}}},{\"id\":\"9a75a084-221a-55c4-9d21-f612aa0d5231\",\"version\":9,\"score\":0.6974358,\"payload\":{\"page_content\":\"Kathleen
        C. Fraser\\n1. To what extent is the observed RAG safety decline correlated
        with a model's RAG capability? Previous work suggests that some models which
        appear 'safe' may simply be less capable of extracting and summarizing relevant
        information. We test this rigorously, and hypothesize the following (H1):
        Models which perform better on MIRAGE (benign capability) will also have higher
        accuracy and therefore lower safety in the oracle setting of RAG-Safety-Bench.\\n2.
        Is RAG safety decline a factor of unsafe information or unsafe context drift?
        The conventional view, challenged by An et al. (2025), is that RAG models
        are less safe only when the documents they retrieve are unsafe. An alternative
        explanation is that the increased context length, possibly containing many
        words semantically related to the unsafe query, shift the models into a less-aligned
        domain. 1 Our hypothesis (H2) is that the direct availability of the answer
        (oracle setting) will lead to the\\n1 In fact, this is similar to the intuition
        behind the successful Crescendo jailbreak (Russinovich et al., 2025).\\nhighest
        number of unsafe answers, but that the on-topic setting will lead to a higher
        number of unsafe answers relative to the baseline non-RAG setting, due to
        the destabilizing effect of the harmful-topic context. If the effect is purely
        due to context length, the random setting will lead to an equivalent harmfulness
        rate.\\n3. What is the impact of RAG on the refusal rate of LLMs? In many
        studies, safety is operationalized as refusal: a safe model is one which refuses
        to answer harmful questions. We distinguish between two varieties of refusal;
        namely, unwillingness to fulfill a harmful request versus inability to find
        the answer in the retrieved documents. We hypothesize (H3) that the refusal
        rate for harmful requests will be highest in the random setting, and attributed
        to a lack of information. We argue that this case should be distinguished
        from 'true' model safety, which should rely on an inherent unwillingness to
        provide dangerous advice. At the same time, the oracle setting offers contrasting
        evaluation in which we ensure the model has access to the requested information,
        so refusal can be more clearly interpreted as effective implementation of
        safety guardrails.\\n4. Do different safety evaluators agree on what is safe
        versus harmful? Standard safety evaluation relies on LLM-based 'judges' to
        label text as safe or unsafe. We compare multiple safety evaluators, with
        the hypothesis (H4) that there will be a high level of disagreement between
        the LLM evaluators.\\nRAG-Safety-Bench is freely available for research use
        at the following URL: https://github.com/The-Safe-AI-Lab/ RAG-Safety-Bench
        .\",\"metadata\":{\"ingestion_version\":\"01a0fc5427ea71babb96a22c2c5762f3\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a-text-0004\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a\",\"chunk_type\":\"text\",\"section_path\":\"Kathleen
        C. Fraser\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":16,\"page_no\":2,\"filename\":\"2609.11758v1.pdf\"}}},{\"id\":\"13523f7b-4211-57d9-9d42-8d571a5e5b4a\",\"version\":9,\"score\":0.69536066,\"payload\":{\"page_content\":\"References\\n-
        Tinghao Xie, Xiangyu Qi, Yi Zeng, Yangsibo Huang, Udari Madhushani Sehwag,
        Kaixuan Huang, Luxi He, Boyi Wei, Dacheng Li, Ying Sheng, and 1 others. 2025.
        SORRY-Bench: Systematically evaluating large language model safety refusal.
        In The Thirteenth International Conference on Learning Representations .\\n-
        Cheng Yu, Benedikt Stroebl, Diyi Yang, and Orestis Papakyriakopoulos. 2025.
        Information retrieval induced safety degradation in AI agents. arXiv preprint
        arXiv:2505.14215 .\\n- Shenglai Zeng, Jiankun Zhang, Pengfei He, Yiding Liu,
