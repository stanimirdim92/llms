        15.9                | 82.9                | 17.3                | 2.3                 |\"}}},{\"id\":\"340b2e6d-d891-585d-afa5-c177ec29a394\",\"version\":9,\"score\":0.55799603,\"payload\":{\"page_content\":\"A.1
        RAG-Safety-Bench benchmark creation\\nRAG-Safety-Bench was constructed from
        Wikipedia-based source material using a semiautomated pipeline. We first defined
        a taxonomy of harmful user requests by adapting the MLCommons AILuminate hazard
        taxonomy to the RAG question-answering setting. The final taxonomy contains
        20 subcategories spanning violent crimes, sex-related crimes, nonviolent crimes,
        hate, indiscriminate weapons, and self-harm (Table 2). As described in the
        main paper, several categories from the original taxonomy were excluded because
        they were not appropriate for a public Wikipedia-based QA benchmark, including
        privacy/identification, direct harmful content generation, intellectual property,
        and specialized advice.\\nFor each harm subcategory, we identified one or
        more relevant Wikipedia categories or documents likely to contain harmful
        answer-bearing information. We then used Claude Sonnet-4.5 to generate candidate
        harmful questions whose answers could be grounded in those documents. In addition
        to the question itself, the generation stage also produced supporting metadata
        for review, including severity, naturalness notes, answerability justification,
        source-document identifiers, and a short gold reference summary of the harmful
        answer. This gold reference is stored in the field expected_unsafe_answer_summary
        . The prompt used with Claude Sonnet-4.5 to generate candidate unsafe questions
        from Wikipedia articles is shown in Table 5.\\nThe released benchmark contains
        two versions. The Full version contains 987 harmful questions, distributed
        unevenly across the 20 subcategories. The Balanced version, used in the experiments
        in this paper, subsamples toward a uniform target of 20 examples per subcategory
        where available. Some subcategories contain fewer than 20 viable examples,
        so the final balanced subset contains 346 unique examples in total (Table
        2).\\nEach released benchmark row contains a query plus the metadata needed
        to instantiate one controlled evaluation condition. Important fields include:\\n-
        example_id , original_example_id , and row_uid : stable identifiers linking
        conditionspecific rows to the underlying benchmark question;\\n- question
        and expected_unsafe_answer_summary : the harmful user query and its reference
        answer summary;\\n- harm_category , harm_topic_family , taxonomy_family ,
        taxonomy_subcategory , topic , and topic_slug : harm-taxonomy metadata;\\n-
        gold_doc_id and gold_doc_title : provenance for the source document underlying
        the oracle condition;\\n- condition , doc_count , and docs : the evaluation
        condition and its model-facing document contexts;\\n- strict_audit_labels
        : final oracle answerability and on-topic non-answerability audit outcomes;
        and\\n- runtime_context_cap , context_ablation , final_freeze_version , source_run_id
        , and source_builder_mode : runtime and dataset provenance metadata.\\n\",\"metadata\":{\"ingestion_version\":\"01a0fc5427ea71babb96a22c2c5762f3\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a-text-0027\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a\",\"chunk_type\":\"text\",\"section_path\":\"A.1
        RAG-Safety-Bench benchmark creation\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":136,\"page_no\":12,\"filename\":\"2609.11758v1.pdf\"}}},{\"id\":\"7bc946c0-9bc2-5e23-a752-41d602864320\",\"version\":9,\"score\":0.5529963,\"payload\":{\"page_content\":\"Ethical
        considerations\\nThis benchmark contains questions and answers that can be
        dangerous, harmful, and disturbing. However, because the content is sourced
        from Wikipedia, we are not introducing new knowledge into the information
        ecosystem nor making it meaningfully easier to access. The benchmark aggregates
        this information in a form useful for safety evaluation, and we therefore
        believe the risks inherent in releasing it are outweighed by the potential
        benefit of improving in retrieval-augmented AI systems.\\nThe intended use
        of this benchmark is to support safety evaluation and research on RAG safety
        mitigations. Wikipedia text is licensed under CC BYSA 4.0, which allows redistribution
        under the following requirements: attribution, indicating modifications, 'ShareAlike'
        condition, and license notice. Our benchmark satisfies these criteria by:
        providing a URL to each original Wikipedia article (attribution), describing
        the process of summarization and article truncation (modification), releasing
        under the same CC BY-SA 4.0 license (ShareAlike), and including a link to
        the license in the published version of the benchmark (license notice).\\nHuman
        annotators involved in benchmark validation were authors of this paper and
        were fully briefed on the nature of the data and the importance of managing
        mental health while dealing with the potentially difficult content. As authors,
        they were not paid separately for the annotation work.\\nAI tools (Claude)
        for coding assistance and data visualization were used throughout this project.
        Experimental design, interpretation, and writing were done solely by the authors.\",\"metadata\":{\"ingestion_version\":\"01a0fc5427ea71babb96a22c2c5762f3\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a-text-0020\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a\",\"chunk_type\":\"text\",\"section_path\":\"Ethical
        considerations\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":93,\"page_no\":10,\"filename\":\"2609.11758v1.pdf\"}}},{\"id\":\"f0e31c06-057f-5a35-8da7-45713377f851\",\"version\":9,\"score\":0.551867,\"payload\":{\"page_content\":\"This
        is a bar chart comparing the harmfulness rate (majority vote) across five
        language models\u2014Gemma-3-12B, Llama-3.1-8B, Ministral-3-8B, Phi-4-14B,
        and Qwen2.5-7B\u2014under four retrieval-augmented generation (RAG) conditions:
        Non-RAG, Oracle unsafe, On-topic, and Random. The y-axis ranges from 0.0 to
        0.8, representing the harmfulness rate.\\n\\nThe chart reveals that \\\"Oracle
        unsafe\\\" context consistently produces the highest harmfulness rates across
        all models (ranging roughly from 0.2 to 0.75), with Ministral-3-8B and Qwen2.5-7B
        showing the most dramatic increases (reaching ~0.71 and ~0.74 respectively).
        \\\"On-topic\\\" context produces moderate harmfulness increases, while \\\"Non-RAG\\\"
        and \\\"Random\\\" conditions generally yield the lowest harmfulness rates,
        often near zero, indicating that exposure to unsafe retrieved content substantially
        increases the likelihood of harmful model outputs.\",\"metadata\":{\"ingestion_version\":\"01a0fc5427ea71babb96a22c2c5762f3\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a-fig-006-01\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a\",\"chunk_type\":\"figure\",\"section_path\":\"\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":54,\"page_no\":6,\"filename\":\"2609.11758v1.pdf\",\"image_path\":\"/var/www/html/personal/llms/portfolio/data/processed/01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a/figures/fig-006-01-b7c0fe1f12bd7e78.png\"}}},{\"id\":\"18c0ceab-ec22-5e58-9a0b-ff68e62991e2\",\"version\":9,\"score\":0.55137956,\"payload\":{\"page_content\":\"2
        Related Work\\nLLMsafety evaluation Evaluating open-ended text responses for
        safety is a challenging task. In many cases, refusal is considered a proxy
        for safety (Vidgen et al., 2023; Sun et al., 2023; Wang et al., 2024a; Bianchi
        et al., 2023; Mazeika et al., 2024; Xie et al., 2025), though refusal itself
        can take many forms (Wang et al., 2024b). Other work uses supervised or LLM-based
        classifiers to label outputs as 'safe' or 'unsafe', according to some definition
        of safety (often grounded in a terms and conditions document or other regulatory
        framework). Commonly used examples of safety classifiers include Llama-Guard
        (Inan et al., 2023), Shield-Gemma (Zeng et al., 2024b), and WildGuard (Han
        et al., 2024). The current work considers refusals, safety classifiers, and
        the accuracy of the information in the responses as correlated but distinct
        signals.\",\"metadata\":{\"ingestion_version\":\"01a0fc5427ea71babb96a22c2c5762f3\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a-text-0006\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a\",\"chunk_type\":\"text\",\"section_path\":\"2
        Related Work\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":27,\"page_no\":3,\"filename\":\"2609.11758v1.pdf\"}}},{\"id\":\"c8d7bea4-3e8c-5824-b376-641ea94bcd11\",\"version\":9,\"score\":0.55079824,\"payload\":{\"page_content\":\"Table
