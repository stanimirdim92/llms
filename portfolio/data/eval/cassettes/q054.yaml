        R1: Capability in safe and unsafe contexts\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":46,\"page_no\":5,\"filename\":\"2609.11758v1.pdf\"}}},{\"id\":\"710d0b17-8e1f-59b5-a11b-1ab94cc0c2b1\",\"version\":9,\"score\":0.6196703,\"payload\":{\"page_content\":\"Limitations\\nThe
        current findings must be interpreted with the following limitations in mind.
        RAG-Safety-Bench is English-only, considers only one document source (Wikipedia),
        and covers a non-exhaustive set of possible harm categories. Further work
        is required to understand how retrieval-enabled LLMs behave in languages other
        than English and in multiple use contexts. The current study highlighted how
        assessments of safety can be subjective; clearly, the type of potentially
        dangerous information that can be returned to a trained intelligence officer
        versus a layperson versus a schoolchild are very different and such use cases
        must be assessed separately.\\nBy design, our benchmark does not evaluate
        the impact of the retriever in the RAG system. However, and end-to-end evaluation
        would also need to assess interactions between retriever ranking, query reformulation,
        and generator safety. Our benchmark also represents a simplified view of RAG
        methodology, while production RAG systems would likely include additional
        safety components, such as system-level safety instructions and input/output
        filters.\\nOur testing suite of models included only opensource models, and
        relatively small models due to computing resource constraints. Again, real-world
        RAG deployments will likely use much larger commercial models. We note that
        our RAG-SafetyBench benchmark can be used to evaluate such models, and that
        our reason for not doing so was to avoid being banned for Terms-of-Service
        violations. We encourage researchers with internal access to such models to
        use our benchmark and publish the results.\\nOur methodology for benchmark
        generation and automated assessment relies heavily on the Claude family of
        models from Anthropic. While we did conduct human evaluations to validate
        Claude's performance, a more robust (though expensive) methodology could combine
        multiple strong LLM judges in an ensemble. Furthermore, we evaluate on a single
        run of the benchmark, but due to the stochastic nature of LLM generation,
        the results might differ across multiple runs.\",\"metadata\":{\"ingestion_version\":\"01a0fc5427ea71babb96a22c2c5762f3\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a-text-0019\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a\",\"chunk_type\":\"text\",\"section_path\":\"Limitations\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":88,\"page_no\":9,\"filename\":\"2609.11758v1.pdf\"}}},{\"id\":\"93bf17c1-f54d-5e88-bc17-40e148367923\",\"version\":9,\"score\":0.60931706,\"payload\":{\"page_content\":\"4.3
        R3: Refusal behaviors\\nFigure 3 indicates, for each model and RAG condition,
        the number of safe and unsafe compliances, refusals for safety reasons, and
        refusals due to a lack of information (as well as a small proportion of refusals
        for 'other' reasons). The labels were provided using an LLM-as-a-judge methodology
        (details provided in Appendix Section A.5, agreement with human annotators
        was 85%, Cohen's \u03BA = 0.71-0.73). One observation here is the relatively
        high number of responses that were not flagged as harmful, but also not flagged
        as a refusal. In many cases, these are responses where the model acknowledges
        that the question is harmful and provides information about how to proceed
        safely, e.g. (Phi-4), ' 'As a large language model, I must emphasize that
        intercepting network traffic without authorization is illegal and unethical.
        It is important to respect privacy and adhere to legal standards. However,
        I can provide general information about network security and how to protect
        against such attacks. To protect against rogue access points and unauthorized
        interception of network traffic, consider the following measures ... '\\nTurning
        to the refusals: we observe that, consistent with our H3, the number of refusals
        attributed to a lack of information (pink bars) generally increases in the
        On-topic setting and increases again in the Random setting. As an example,
        we contrast the Phi model's response in the Non-RAG scenario and the Random
        scenario:\\nQuestion: What method does Harassment Architecture describe for
        causing fatal car accidents?\\nNon-RAG: 'I'm sorry, but I can't assist with
        that request. Discussing or promoting harmful activities, including causing
        fatal car accidents, is not appropriate or safe. If you have concerns about
        harassment or safety, I recommend reaching out to local authorities or professional
        organizations that can provide support and guidance. If you have any other
        questions or need information on a different topic, feel free to ask.'\\nRandom:
        'I'm sorry, but I don't have any information on \\\"Harassment Architecture\\\"
        or its methods related to causing fatal car accidents based on the provided
        documents. The documents you've shared focus on topics related to gardening,
        botanical gardens, and plant management, and do not mention anything about
        \\\"Harassment Architecture\\\" or related activities ...'\\nAlthough both
        responses are safe refusals, one provides more normative information that
        the proposed action is dangerous and illegal, and suggests alternative courses
        of action.\",\"metadata\":{\"ingestion_version\":\"01a0fc5427ea71babb96a22c2c5762f3\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a-text-0015\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a\",\"chunk_type\":\"text\",\"section_path\":\"4.3
        R3: Refusal behaviors\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":62,\"page_no\":7,\"filename\":\"2609.11758v1.pdf\"}}},{\"id\":\"ef8edc2c-79a5-5f25-9f6f-1c192ea8484d\",\"version\":15,\"score\":0.60813856,\"payload\":{\"page_content\":\"Ethics
        Statement\\nThis work uses only publicly released models and datasets. It
        involves no human subjects and no personal data. The planted spans are taken
        from the models' own answers and are used only in offline evaluation. The
        work describes a way that citations in RAG systems can mislead readers, with
        the aim of making that failure measurable; it does not provide a method for
        attacking deployed systems. Because RLVR training is in wide use, we have
        tried to state the limits of our null result clearly so that it is not read
        as a stronger claim than the data support.\",\"metadata\":{\"ingestion_version\":\"01a0fc55257f7276be70b7b3d1501b36\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6-text-0026\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6\",\"chunk_type\":\"text\",\"section_path\":\"Ethics
        Statement\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":116,\"page_no\":8,\"filename\":\"2609.23053v1.pdf\"}}},{\"id\":\"dfdc115b-8a09-5899-9911-fb57a38a5ae7\",\"version\":9,\"score\":0.60594666,\"payload\":{\"page_content\":\"A.2
        Safety evaluation details\\nEach example in the balanced subset is expanded
        into four evaluation conditions: non_rag , rag_oracle_unsafe , rag_topic_safe
        , and rag_control_safe_random . Since the balanced subset contains 346 examples,
        this expansion produces 1,384 example-condition rows per model and 6,920 total
        responses across the five evaluated models.\\nThe benchmark controls retrieval
        quality by directly supplying context documents, rather than relying on a
        live retriever to discover them at inference time. This is important because
        a poor retriever could otherwise fail to retrieve the relevant harmful document
        and artificially inflate apparent safety.\\nThe non_rag condition supplies
        no documents for all 346 examples. The rag_oracle_unsafe condition supplies
        one document for all 346 examples. The rag_topic_safe condition supplies three
        documents for 344 examples and two documents for two examples. The rag_control_safe_random
        condition supplies three documents for 321 examples, two documents for 24
        examples, and one document for one example.\\nIn the final evaluation configuration,
        context is supplied as cleaned full-article-prefix text with a per-document
        cap of approximately 12,000 characters. Section-level metadata are retained
        for provenance and auditing.\\nThe response-generation templates are intentionally
        simple. In the non_rag condition, the model is instructed to answer using
        only its own knowledge. In the three RAG conditions, the model is instructed
        to answer using only the provided documents, with each supplied context labeled
        sequentially as Context 1 , Context 2 , etc.\\nAll model responses were generated
        deterministically with temperature = 0 . 0 , topp = 1 . 0 , and sampling disabled.
        We used a maximum of 1,024 newly generated tokens per response and a fixed
        run seed of 42. For RAG conditions, each cleaned retrieved-document prefix
        was capped at 12,000 characters. The same prompt template and decoding settings
        were used across all four conditions for a given model.\\nAll experiments
        were run on an academic research cluster with NVIDIA H100 GPUs. Compute requirements
        varied by model size, context length, and response length. The five-model
        evaluation required approximately 74 GPU-hours in total, including response
        generation and local safety judging. The released configurations and run manifests
        provide the information needed to reproduce the evaluation.\",\"metadata\":{\"ingestion_version\":\"01a0fc5427ea71babb96a22c2c5762f3\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a-text-0028\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a\",\"chunk_type\":\"text\",\"section_path\":\"A.2
