    body: '{"query": "Which backbones and reward model does GraMRAG use?", "documents":
      ["4.4 Ablation Study\nTo validate the contribution of each component in GraMRAG,
      we conduct ablation studies across all benchmarks. As shown in Table 2, the
      three components exhibit clear progressive complementarity: long-horizon reasoning
      enables sustained multiround retrieval across extended cross-modal rea- soning
      trajectories; the multimodal memory graph demonstrates that formalizing reasoning
      as a dynamic DAG effectively mitigates state blindness and suppresses redundant
      retrieval; and replacing the standard sparse-reward method Group Relative Policy
      Optimization (GRPO) (Shao et al., 2024) with TAPO delivers a further improvement,
      directly confirming the critical role of topology-guided credit assignment in
      fine-grained policy optimization. The complete model achieves an average score
      of 53.5%, an improvement of over 9 points above the baseline, comprehensively
      validating the necessity and complementarity of each component.\nFigure 5: Analysis
      of retrieval performance.", "4.2 Implementation Details\n2025) as the agent
      backbones. We use Qwen3Max (Yang et al., 2025) as the reward model to evaluate
      the quality and relevance of generated responses. Training is divided into two
      stages. In the SFT stage, we employ LlamaFactory (Zheng et al., 2024) with LoRA
      (Hu et al., 2022) of rank 32 to fine-tune the language model while keeping the
      vision tower and multimodal projector frozen. Training spans 3 epochs with a
      batch size of 8 and gradient accumulation steps of 8, a learning rate of 1.0e-4,
      and a cosine learning rate scheduler. In the RL stage, we use rLLM (Tan et al.,
      2025) with the TAPO objective, an actor learning rate of 1.0e-6, a total of
      2 training epochs, 8 agent groups, and a batch size of 32. All experiments are
      conducted on 8 NVIDIA H100 GPUs.", "Graph-Structured Trajectory Decomposition.\nwhere
      \u03c9 g,i ( \u03b8 ) is the probability ratio of segment s ( i ) g under the
      current and old policies; n g denotes the number of segments in the g -th rollout.
      The (1 -\u03c8 g,i ) factor selectively gates gradient contributions based on
      the topological analysis of the memory graph: in positive trajectories, topological
      dead-end steps are masked to prevent their gradients from reinforcing redundant
      exploration; in negative trajectories, valuable retrieval steps are masked to
      prevent their gradients from penalizing effective retrieval behavior. Through
      this design, TAPO achieves precise step-level credit assignment across the entire
      multi-step reasoning trajectory, significantly outperforming conventional sparsereward
      methods that rely solely on terminal outcome signals.", "Graph-Structured Trajectory
      Decomposition.\nWe ground the reinforcement learning framework in the memory
      graph structure defined in Section 3.2. At each reasoning step t , the policy
      model \u03c0 \u03b8 receives the graph-serialized context:\n<!-- formula-not-decoded
      -->\nwhere s sys is the system instruction and H t = Serialize( G t -1 ) is
      the graph-linearized memory context. The policy model produces an reasoning
      segment that corresponds precisely to the construction of a single memory graph
      node n t :\n<!-- formula-not-decoded -->\nwhere \u03b6 t denotes the chain-of-thought
      reasoning preceding action A t , and O t is the environmental observation returned
      by the external tools. The terminal segment takes the form s ans = ( C ans ,
      \u03b6 ans , a out ) . A complete rollout trajectory decomposes into an ordered
      sequence of segments \u03a8 = { s 1 , s 2 , . . . , s T v + T t , s ans } .
      This nodebased decomposition establishes a direct structural correspondence
      between policy gradient signals and graph topology: each gradient signal maps
      precisely to a specific graph node, providing the basis for the topology-driven
      credit assignment.\nTopology-Driven Credit Assignment. For each rollout, we
      assign a binary outcome reward r \u2208 { 0 , 1 } based on whether a out matches
      the groundtruth answer a true . We then exploit the DAG topology of G T to perform
      targeted gradient masking under two distinct scenarios as illustrated in Figure
      4(b). Given a correct rollout ( r = 1 ), we identify the critical reasoning
      path \u03c1 \u2217 by traversing G T backwards from n ans to n root along the
      directed edges. Nodes absent from \u03c1 \u2217 constitute topological dead
      ends, namely exploratory steps that contribute no causal evidence to the correct
      answer. Propagating positive reward signals to these nodes would erroneously
      reinforce aimless exploration, so we suppress their gradient contributions.
      Given an incorrect rollout ( r = 0 ), we identify the set of epistemically valuable
      nodes N val \u2286 V T . For n vis-type nodes, a node n t is designated as valuable
      when the Hit judgment s t stored within \u03c3 t records s t = 1 , confirming
      that the visual retrieval successfully located semantically relevant content.
      For n txt-type nodes, a dedicated relevance evaluator further determines whether
      the textual evidence retrieved at step t is directly relevant to the query.
      Excluding N val from the negative policy gradient update prevents the model
      from being penalized from performing demonstrably productive retrievals on trajectories
      that ultimately fail due to shortcomings in other reasoning steps.\nFigure 4:
      Overview of Topology-Aware Policy Optimization.\nIntegrating both scenarios,
      we define the gradient mask \u03c8 t \u2208 { 0 , 1 } for segment s t as:\n<!--
      formula-not-decoded -->\nwhere I ( \u00b7 ) is the indicator function; \u03c8
      t = 1 suppresses the gradient contribution of segment s t during the policy
      update, while \u03c8 t = 0 permits normal gradient update. The TAPO objective
      is defined as:\n<!-- formula-not-decoded -->", "Table 2: Models (top) and datasets
      (bottom). All four models share the Qwen2.5-7B-Instruct base. Passages is the
      number of roughly 100-token chunks in each retrieval index.\n\n| Model     |
      Training on top of the base   |\n|-----------|-------------------------------|\n|
      Baseline  | none (Qwen2.5-7B-Instruct)    |\n| Search-R1 | RLVR with PPO                 |\n|
      ReSearch  | RLVR with GRPO                |\n| R-Search  | RLVR with GRPO                |",
      "This is a schematic diagram illustrating a reinforcement learning framework
      for training multimodal/retrieval-based models, divided into two panels. Panel
      (a) shows the overall \"Reinforcement Learning Framework with Topology-Aware
      Policy Optimization,\" depicting a pipeline where user queries and images flow
      through a Rollout Module (Policy Model generating trajectories H1-H6 via interaction
      with an External Environment), then through Reference and Reward Models to compute
      rewards (r1-r6) and group-computed advantages (A1-A6), with a Graph Pruning
      module using a Memory Graph and KL divergence to produce gradient masks (m1-m6)
      that modulate the final gradient. Panel (b) illustrates \"Credit Assignment
      via Graph Pruning\" using two tree-structured graphs (Positive Sample and Negative
      Sample) rooted at a query node Q leading to an answer node A, showing how dead-end
      nodes (orange, meaningless for optimization) are pruned as false positives/negatives
      while valuable retrieval nodes (green) are preserved to avoid penalizing useful
      paths, with masked gradients indicated at specific steps.", "Retrieval quality
      depends on reasoning depth.\nHigh-quality answer generation in complex multimodal
      tasks depends on sustaining precise multiround retrieval across a long reasoning
      horizon. Traditional memory paradigms cause agents to progressively lose track
      of historical retrieval paths and accumulate redundant searches that severely
      constrain effective reasoning depth. GraMRAG addresses this by transferring
      the iterative planning capability into the multimodal domain via the vision-text
      bridged reasoning paradigm, supporting trajectories spanning tens of steps;
      the multimodal memory graph further encodes action-observation dependencies
      explicitly, directing each retrieval attempt precisely toward unexplored evidence
      space. As shown in Figure 5, this design yields substantially higher hit rate
      across all three task categories, directly validating the decisive role of long-horizon
      reasoning depth in determining retrieval quality.\nGraph memory mitigates state
      blindness. The dynamic DAG representation of the multimodal memory graph explicitly
      encodes actionobservation dependencies as directed edges, enabling each agent
      to efficiently access the complete historical reasoning trajectory and effectively
      mitigating state blindness. As shown in Table 2, replacing iterative summarization-based
      memory with the multimodal memory graph yields a 3.3point performance improvement,
      validating that the multimodal memory graph effectively mitigates state blindness
      and suppresses redundant retrieval, confirming the necessity of structured memory
      in long-horizon multimodal reasoning.\nFigure 6: Analysis of training efficiency.\nGraph
      pruning accelerates training convergence. As demonstrated in Figure 6, TAPO
      achieves faster convergence throughout training compared to the baseline Group
      Sequence Policy Optimization (GSPO) (Zheng et al., 2025), indicating that topology-guided
      graph pruning drives the model toward faster convergence by supplying cleaner
      credit assignment signals. This yields two critical insights into agentic reinforcement
      learning: first, optimization stability fundamentally depends on ensuring correct
      positive gradient signals while eliminating ambiguous updates from negative
      trajectories; second, the quality of rollout samples, specifically their preference
      alignment, is more decisive for performance than simply scaling up the training
      set. By simultaneously masking dead-end nodes in positive trajectories and preserving
      valuable nodes in negative ones, TAPO achieves finegrained step-level credit
      assignment rather than coarse terminal-reward-level optimization.", "3.3 Topology-Aware
      Policy Optimization\nAs illustrated in Figure 4, we propose TopologyAware Policy
      Optimization (TAPO) to address the systematic credit assignment problem in sparse
      reward reinforcement learning training, leveraging the topological structure
      of the memory graph to perform selective gradient masking that simultaneously
      rectifies both forms of bias across positive and negative trajectories with
      step-level precision.", "1 Introduction\nTo address the mentioned limitations,
      we propose GraMRAG, a novel graph memory-guided multi-agent RAG framework. First,
      to bridge the long-horizon reasoning gap, we introduce a visiontext bridged
      reasoning paradigm that orchestrates multi-scale entity cropping with a ReAct-style
      visual toolchain, seamlessly transferring the iterative planning capability
      of text-only deep research models into the multimodal domain to enable longhorizon
      cross-modal reasoning trajectories. Second, to overcome state blindness and
      context expansion in linear memory paradigms, we construct a multimodal memory
      graph that formalizes the reasoning process as a dynamic directed acyclic graph
      (DAG), explicitly encoding agent actions and multimodal observations with their
      temporal and logical dependencies to mitigate redundant retrieval and state
      blindness. Third, to tackle the credit assignment problem from coarse terminal
      rewards, we introduce a Topology-Aware Policy Optimization (TAPO) algorithm
      that leverages the graph topology to identify critical reasoning paths and perform
      targeted node pruning, precisely masking false positive and false negative nodes
      during policy updates to enable fine-grained credit assignment across multi-step
      reasoning.\nOur contributions are summarized as follows:\n- We introduce a vision-text
      bridged reasoning paradigm that unifies multi-scale entity cropping with a ReAct-style
      visual toolchain, enabling long-horizon cross-modal reasoning.\n- Weconstruct
      a multimodal memory graph that formalizes agent reasoning as a dynamic DAG to
      systematically mitigate state blindness and redundant retrieval.\n- We develop
      a TAPO algorithm leveraging graph topology for critical path identification
      and node pruning, enabling fine-grained credit assignment across multi-step
      reasoning.\n- We conduct extensive experiments on challenging multimodal benchmarks
      to evaluate our approach, demonstrating state-of-the-art performance over existing
      baselines.", "4 Experimental Setup\nTable 2: Models (top) and datasets (bottom).
      All four models share the Qwen2.5-7B-Instruct base. Passages is the number of
      roughly 100-token chunks in each retrieval index.\n\nBaseline, Training on top
      of the base = none (Qwen2.5-7B-Instruct). Search-R1, Training on top of the
      base = RLVR with PPO. ReSearch, Training on top of the base = RLVR with GRPO.
      R-Search, Training on top of the base = RLVR with GRPO\nNQ, Questions = 499.
      NQ, Passages = 40,791. NQ, Source = Wikipedia. QAMPARI, Questions = 500. QAMPARI,
      Passages = 44,879. QAMPARI, Source = Wikipedia. HAGRID, Questions = 500. HAGRID,
      Passages = 8,986. HAGRID, Source = Wikipedia. RAGTruth, Questions = 500. RAGTruth,
      Passages = 6,981. RAGTruth, Source = Web\nModels. Our comparison rests on a
      single design choice: every model in Table 2 starts from the same weights. The
      baseline is Qwen2.5-7BInstruct (Qwen Team, 2024); Search-R1 (Jin et al., 2025),
      ReSearch (Chen et al., 2025), and R-Search (Zhao et al., 2025) are open-weight
      agents trained from that exact checkpoint with RLVR. Whatever separates an agent
      from the baseline is therefore training, not architecture, tokenizer, or pretraining
      data.\nFixed-context evaluation. We disable agentinitiated retrieval and give
      every model the same five passages retrieved externally with BM25. This is an
      intentional control: our question is whether RLVR-trained agents differ in citation
      attribution when the available evidence is held constant. Allowing agents to
      retrieve would introduce differences in search policy and evidence selection,
      making those effects inseparable from citation behavior.\nDatasets. We use four
      question-answering datasets: NQ from KILT (Petroni et al., 2021; Kwiatkowski
      et al., 2019), QAMPARI from ALCE (Gao et al., 2023; Amouyal et al., 2023), HA-
      GRID (Kamalloo et al., 2023), and the questionanswering portion of RAGTruth
      (Niu et al., 2024), sampling 500 questions from each (499 for NQ). For each
      dataset we chunk the corpus into roughly 100-token passages and retrieve the
      top five per question with BM25 (Robertson and Zaragoza, 2009).", "1 Introduction\n''Never
      memorize something that you can look up.''\n-Albert Einstein\nRetrieval-Augmented
      Generation (RAG) extends the knowledge boundaries of Multimodal Large Language
      Models (MLLMs) by retrieving relevant information from external knowledge bases
      (Wang, 2026; Fan et al., 2026; Hu et al., 2026). Recent advances in MLLMs have
      convincingly demonstrated that multimodal agentic RAG systems are capable of
      efficient retrieval and reasoning over large-scale corpora comprising interleaved
      textual and visual content (Zhang et al., 2026; Guan et al., 2025). MLLM-based
      multi-agent architectures, leveraging specialized collaboration among components,
      exhibit superior performance over single-agent frameworks on complex multimodal
      RAG tasks (Zhou et al., 2026; Chang et al., 2025; Xu et al., 2025b).\n\u2020
      Corresponding author.\nFigure 1: Comparison between our GraMRAG and existing
      multi-agent RAG systems.\nHowever, existing multi-agent RAG systems face three
      key limitations. First, the average number of retrieval rounds in current systems
      remains limited, predisposing agents to prematurely terminate exploration and
      settle for partially available evidence on complex tasks (Jiang et al., 2025;
      Wu et al., 2025a; Team et al., 2025). This fundamentally impedes the transfer
      of the long-horizon planning capability from text-based deep research to multimodal
      scenarios, rendering these systems inadequate for tens of iterative reasoning
      steps demanded by real-world deep research. Second, prevailing linear or iterative
      summarization-based memory structures (Yao et al., 2022; Zhou et al., 2025;
      Xu et al., 2025a; Wu et al., 2025b), lacking explicit modeling of agent reasoning
      states, are prone to context expands and state blindness as interaction rounds
      accumulate, resulting in repetitive queries and redundant retrieval in multi-hop
      tasks. Third, conventional outcome-based sparse rewards coarsely propagate terminal-state
      signals across entire trajectories (Huang et al., 2026; Zhou et al., 2025),
      causing effective retrieval steps to be erroneously penalized in negative samples
      while redundant operations are undeservedly rewarded in positive ones, preventing
      fine-grained credit assignment across multi-step reasoning.", "4.3 Comparison
      with State-of-the-Art Methods\nWe compare GraMRAG against representative baselines:
      ReAct (Yao et al., 2022) iteratively invokes external retrieval tools in a think-then-act
      paradigm; Vanilla RAG uses the original question as a query and performs direct
      MLLM inference over retrieved results; UniversalRAG (Yeo et al., 2025) formulates
      cross-modal retrieval as a unified routing problem; VideoRAG (Jeong et al.,
      2025) extracts significant visual information via key-frame selection; MemAgent
      (Yu et al., 2025) manages context by sequentially feeding search results to
      the model; Mem1 (Zhou et al., 2025) dynamically compresses agent memory through
      a cyclical retrievalthen-memorization process; and VimRAG (Wang et al., 2026)
      models reasoning process to manage large-scale multimodal contexts.\nAs presented
      in Table 1, linear history accumula- tion paradigms such as ReAct rapidly exhaust
      the context window under the heavy token overhead of visual data; task-specific
      methods including VideoRAG and UniversalRAG exhibit limited generalizability
      due to fixed inference pipelines; and summarization-based memory paradigms such
      as MemAgent and Mem1, lacking explicit modeling of agent reasoning states, progressively
      lose track of historical retrieval paths as interaction rounds accumulate; and
      VimRAG models the reasoning process but lacks long-horizon reasoning capability.
      Our GraMRAG achieves consistently state-of-theart performance across all benchmarks,
      achieving overall average scores of 48.5% and 53.5% under the Qwen3-VL-4B-Instruct
      and Qwen3-VL8B-Instruct settings respectively, validating the effectiveness
      of formalizing the multi-step reasoning process as a dynamic DAG with topologydriven
      fine-grained credit assignment for multimodal knowledge-intensive reasoning
      tasks.\nTable 2: Ablation study across all benchmarks.\n\n\u2713 \u2713 \u2713
      \u2713 \u2713, Memory Iterative = \u2713 \u2713. \u2713 \u2713 \u2713 \u2713
      \u2713, Paradigm Graph = \u2713 \u2713 \u2713. \u2713 \u2713 \u2713 \u2713 \u2713,
      Policy GRPO = \u2713. \u2713 \u2713 \u2713 \u2713 \u2713, Optimization TAPO
      = \u2713. \u2713 \u2713 \u2713 \u2713 \u2713, Acc = 43.8 44.2 47.5 49.3 53.5",
      "4.1 Datasets and Evaluation Metrics\nWe evaluate GraMRAG on a comprehensive
      set of benchmarks covering diverse task categories: general text benchmarks
      including HotpotQA (Yang et al., 2018) and SQuAD (Rajpurkar et al., 2016); image
      and visual document benchmarks including ViDoSeek (Wang et al., 2025a), SlideVQA
      (Tanaka et al., 2023) and MMLongBench (Ma et al., 2024); large-scale long-context
      video corpus benchmarks including LVBench (Wang et al., 2025b), WikiHowQA and
      SyntheticQA (Jeong et al., 2025), and XVBench (Wang et al., 2026). We employ
      a unified binary model-based metric (0 or 1) across all tasks, where a reward
      model performs semantic matching between the generated and reference answers
      to ensure consistent and fair evaluation.", "6 Conclusion\nIn this paper, we
      introduce GraMRAG, a novel graph memory-guided multi-agent RAG framework for
      complex multimodal long-horizon reasoning tasks. Our approach integrates three
      key innovations: a vision-text bridged reasoning paradigm that unifies multi-scale
      entity cropping with a ReActstyle visual toolchain for long-horizon cross-modal
      reasoning; multimodal memory graph construction that formalizes agent reasoning
      as a dynamic directed acyclic graph (DAG) to fundamentally mit- igate state
      blindness and suppress redundant retrieval; and Topology-Aware Policy Optimization
      (TAPO) algorithm that leverages graph topology for fine-grained credit assignment
      across multi-step reasoning trajectories. Extensive experiments on diverse multimodal
      benchmarks demonstrate that our method consistently outperforms existing baselines
      and achieves state-of-the-art performance. Future work will investigate the
      scalability of the proposed framework to larger architectures and broader multimodal
      scenarios.", "References\n- Woongyeong Yeo, Kangsan Kim, Soyeong Jeong, Jinheon
      Baek, and Sung Ju Hwang. 2025. Universalrag: Retrieval-augmented generation
      over corpora of diverse modalities and granularities. arXiv preprint arXiv:2504.20734
      .\n- Hongli Yu, Tinghong Chen, Jiangtao Feng, Jiangjie Chen, Weinan Dai, Qiying
      Yu, Ya-Qin Zhang, WeiYing Ma, Jingjing Liu, Mingxuan Wang, and 1 others. 2025.
      Memagent: Reshaping long-context llm with multi-conv rl-based memory agent.
      arXiv preprint arXiv:2507.02259 .\n- Taolin Zhang, Dongyang Li, Qizhou Chen,
      Chengyu Wang, and Xiaofeng He. 2025a. Belle: A bi-level multi-agent reasoning
      framework for multi-hop question answering. In Proceedings of the 63rd Annual
      Meeting of the Association for Computational Linguistics (Volume 1: Long Papers)
      , pages 4184-4202.\n- Wenchuan Zhang, Jingru Guo, Hengzhe Zhang, Penghao Zhang,
      Jie Chen, Shuwan Zhang, Zhang Zhang, Yuhao Yi, and Hong Bu. 2026. Patho-agenticrag:
