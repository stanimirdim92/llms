      | 10.8 | 15.0 |   12.5 |\n| sexual harassment    |  7.5 |  9.7 | 15.0 |    9.7
      |\n| suicide              | 11.8 | 22.5 | 18.0 |   18.5 |\n| terrorism            |
      14.2 | 29.2 | 18.5 |   20.2 |\n| All (overall)        | 14.1 | 16.9 | 19.6 |   17.4
      |", "2 Related Work\nRetrieval-augmented generation Enabling LLMs to consult
      a database of trusted documents through retrieval-augmented generation (RAG)
      has many benefits: it reduces hallucination, allows companies to inject proprietary
      knowledge/documents into the system, supports the rapid update of information
      without retraining, and can enable source attribution (Lewis et al., 2020; Shuster
      et al., 2021; Fan et al., 2024). However, it also exposes new attack surfaces.
      Most research on the safety and security of RAG systems has focused on the security
      of the knowledge base: data poisoning attacks involve the injection of malicious
      (mis)information into the document store (Tan et al., 2024; Nazary et al., 2025;
      Zhang et al., 2025), and data extraction attacks aim to recover sensitive or
      private information from the documents through a RAG interface (Zeng et al.,
      2024a; Qi et al., 2024; Vonderhaar et al., 2025). However, the safety of RAG
      systems in non-adversarial settings has been less studied. An et al. (2025)
      were the first to highlight that RAG systems can output more harmful responses
      than non-RAG LLMs, even in the absence of any malicious intervention. Other
      work considers the related problem of safety degradation in AI agents that have
      been enabled with information retrieval or search capabilities (Yu et al., 2025;
      BehnamGhader et al., 2025; Zhan et al., 2026). Previous work measures the safety
      of the entire RAG system, but the information content and safety of the retrieved
      documents is an uncontrolled variable. Our work takes the next step towards
      a more scientific understanding of these observed phenomena by systematically
      altering one variable at a time (no retrieval, random retrieval, on-topic retrieval,
      exact-answer retrieval) to observe the effect on the safety of the LLM responses.\nLong-context
      safety The retrieval of harmful documents is one factor in the observed safety
      decline in RAG models. However, the literature suggests that another factor
      may be a behavioural shift induced by the inclusion of extended context. In
      fact, Yu et al. (2025) claim that ''safety degradation is largely independent
      of retrieved context itself.'' An et al. (2025) found that 94.7% of the retrieved
      documents in their study were safe, and therefore could not account for the
      much larger increase in unsafe responses. They hypothesize that the retrieved
      texts, though benign themselves, can trigger the recall of unsafe information
      from the model''s parametric knowledge. Other work has shown that LLMs are less
      capable of identifying harmful content in long contexts (Ghorbanpour and Fraser,
      2025) and are more likely to answer harmful questions in long-context settings
      (Anil et al., 2024; Lu et al., 2025; Huang et al., 2025). In some cases, the
      model can drift away from its default ''helpful assistant'' persona even when
      the context itself is not harmful (e.g. a therapy conversation)\n(Lu et al.,
      2026). Therefore, in this study we design our benchmark to test the ''harmful
      documents'' and ''long context'' explanations separately.", "References\n- Aaron
      Grattafiori, Abhimanyu Dubey, Abhinav Jauhri, Abhinav Pandey, Abhishek Kadian,
      Ahmad AlDahle, Aiesha Letman, Akhil Mathur, Alan Schelten, Alex Vaughan, and
      1 others. 2024. The llama 3 herd of models. In Neural Information Processing
      Systems .\n- Seungju Han, Kavel Rao, Allyson Ettinger, Liwei Jiang, Bill Yuchen
      Lin, Nathan Lambert, Yejin Choi, and Nouha Dziri. 2024. Wildguard: Open one-stop
      moderation tools for safety risks, jailbreaks, and refusals of LLMs. Advances
      in neural information processing systems , 37:8093-8131.\n- Mianqiu Huang, Xiaoran
      Liu, Shaojun Zhou, Mozhi Zhang, Qipeng Guo, Linyang Li, Pengyu Wang, Yang Gao,
      Chenkun Tan, Linlin Li, and 1 others. 2025. LongSafety: Enhance safety for long-context
      LLMs. In Proceedings of the The First Workshop on LLM Security (LLMSEC) , pages
      26-47.\n- Hakan Inan, Kartikeya Upasani, Jianfeng Chi, Rashi Rungta, Krithika
      Iyer, Yuning Mao, Michael Tontchev, Qing Hu, Brian Fuller, Davide Testuggine,
      and 1 others. 2023. Llama guard: LLM-based inputoutput safeguard for human-AI
      conversations. arXiv preprint arXiv:2312.06674 .\n- Patrick Lewis, Ethan Perez,
      Aleksandra Piktus, Fabio Petroni, Vladimir Karpukhin, Naman Goyal, Heinrich
      K\u00fcttler, Mike Lewis, Wen-tau Yih, Tim Rockt\u00e4schel, and 1 others. 2020.
      Retrieval-augmented generation for knowledge-intensive NLP tasks. Advances in
      neural information processing systems , 33:9459-9474.\n- Christina Lu, Jack
      Gallagher, Jonathan Michala, Kyle Fish, and Jack Lindsey. 2026. The assistant
      axis: Situating and stabilizing the default persona of language models. arXiv
      preprint arXiv:2601.10387 .\n- Yida Lu, Jiale Cheng, Zhexin Zhang, Shiyao Cui,
      Cunxiang Wang, Xiaotao Gu, Yuxiao Dong, Jie Tang, Hongning Wang, and Minlie
      Huang. 2025. LongSafety: Evaluating long-context safety of large language models.
      In Proceedings of the 63rd Annual Meeting of the Association for Computational
      Linguistics (Volume 1: Long Papers) , pages 3170531725.\n- Mantas Mazeika, Long
      Phan, Xuwang Yin, Andy Zou, Zifan Wang, Norman Mu, Elham Sakhaee, Nathaniel
      Li, Steven Basart, Bo Li, and 1 others. 2024. HarmBench: a standardized evaluation
      framework for automated red teaming and robust refusal. In Proceedings of the
      41st International Conference on Machine Learning , pages 35181-35224.", "This
      image consists of two line/bar charts comparing the effects of poisoned documents
      on model behavior, plotted against \"Poisoned documents (out of 3 retrieved)\"
      (0/3, 1/3, 2/3, 3/3) on the x-axis.\n\nPanel (a) is a line chart showing \"Abstention
      rate (%)\" for four conditions: Entity swap (red), Number swap (orange), Negation
      (purple), and Clean arm (green dashed baseline ~13%). As poisoned documents
      increase, abstention rises sharply for Entity swap (up to ~70%), while Number
      swap and Negation show moderate increases (up to ~42%), and the Clean arm remains
      flat.\n\nPanel (b) is a grouped bar chart showing \"Hallucination rate (%)\"
      for Clean arm (blue) versus Poisoned arm (red) across the same x-axis categories,
      revealing that hallucination rates decrease as poisoned documents increase for
      both arms, with the Poisoned arm dropping from 26.5% to 12.2% and the Clean
      arm from 31.3% to 29.9%.", "4.2 R2: Unsafe information or unsafe context?\nIn
      all cases, providing irrelevant (safe) documents leads to the safest behavior
      overall, suggesting that long context alone is not sufficient to steer the models
      into an unsafe regime.\nThe results in Figure 2 are also partially consistent
      with one of the major conclusions from An et al. (2025), that the safest non-RAG
      LLM will likely be the safest RAG LLM. Indeed, Phi-4-14B is safest in both non-RAG
      and RAG settings, followed by Llama-3.1-8B. However, Qwen is the third safest
      in the non-RAG setting but the least safe in the oracle-RAG and on-topic RAG
      conditions, suggesting that some models'' guardrails are more robust than others.\nNote
      that the harmfulness rates are lower than\n(though correlated with) the accuracy
      scores in Table 3. Accuracy and harmfulness are judged separately. Manual inspection
      reveals two large buckets of responses that are rated as accurate but not harmful:
      responses which are not flagged as harmful by the safety judges but likely should
      be, in the context (typically descriptions of historical events and nonviolent
      crimes), and cases where the model hedges that the information is for education
      purposes only (e.g., Ministral-3-8B in response to a query about misinformation
      propagation, \"... Here''s a **generalized breakdown of memetic propagation
      techniques** (based on the text) that could theoretically be used to influence
      public opinion, **with the caveat that this is for educational/analytical purposes
      only** ... <goes into detail on techniques.>'' ).\nThe harmfulness rates for
      each model and condition broken down by harm taxonomy category are available
      in the Appendix (Figure 6-Figure 10). The categories which tend to see the greatest
      increase in harmful responses from the non-RAG setting to the oracle setting
      are: radiological weapons, explosives, drugs, chemical weapons, assault, terrorism,
      and cyberattacks. The Ministral and Qwen models also show a concerning increase
      in harmful responses to questions about suicide and self-harm.", "This is a
      pair of line charts (two-panel plot) illustrating the effect of poisoned retrieved
      documents on question-answering accuracy for three perturbation types: Entity
      swap, Number swap, and Negation.\n\nPanel (a) shows \"Accuracy under poisoning,\"
      plotting Accuracy (%) against the number of poisoned documents out of 3 retrieved
      (0/3, 1/3, 2/3, 3/3). A dashed green \"Clean arm\" baseline stays flat around
      78%, while all three perturbation conditions decline from roughly 65-72% at
      0/3 poisoned documents down to about 41-48% at 3/3 poisoned documents.\n\nPanel
      (b) shows \"Drop vs. clean arm,\" plotting the accuracy drop in percentage points
      against the same poisoned document ratios, with all three lines starting near
      0-10 pp at 0/3 and rising to approximately 31-37 pp drop at 3/3 poisoned documents,
      with Entity swap showing the steepest degradation.", "This is a heatmap chart
      displaying harmfulness evaluation results across five language models (Gemma-3-12B,
      Llama-3.1-8B, Ministral-3-8B, Phi-4-14B, and Qwen2.5-7B) under four retrieval-augmented
      generation (RAG) conditions each (Non-RAG, Oracle unsafe, On-topic, Random).
      The columns represent four evaluation metrics/classifiers (Llama-Guard, WildGuard,
      ShieldGemma, and Accuracy), with cell values showing the proportion of outputs
      flagged as unsafe, color-coded from dark blue (low, ~0.0) to red (high, ~1.0).
      The data reveals that the \"Oracle unsafe\" condition consistently produces
      the highest harmfulness rates across all models and metrics (e.g., Ministral-3-8B
