        is a set of three stacked bar charts comparing model robustness under three
        perturbation types: Entity swap, Number swap, and Negation. Each chart's x-axis
        shows the number of poisoned documents (0/3, 1/3, 2/3, 3/3) out of retrieved
        documents, while the y-axis shows the percentage of clean-correct cases, broken
        into three categories: \\\"Still correct\\\" (green), \\\"Abstained\\\" (blue),
