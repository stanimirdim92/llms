      arXiv preprint arXiv:2509.13313 .\n- Zhao Xinjie, Fan Gao, Xingyu Song, Yingjian
      Chen, Rui Yang, Yanran Fu, Yuyang Wang, Yusuke Iwasawa, Yutaka Matsuo, and Irene
      Li. 2025. Reagent: Reversible multi-agent reasoning for knowledgeenhanced multi-hop
      qa. In Proceedings of the 2025 Conference on Empirical Methods in Natural Language
      Processing , pages 4067-4089.\n- Wujiang Xu, Zujie Liang, Kai Mei, Hang Gao,
      Juntao Tan, and Yongfeng Zhang. 2025a. A-mem: Agentic memory for llm agents.
