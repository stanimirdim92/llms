        Post-rationalization is common\\nRAGTruth stands apart, two to five times
        lower than the rest for every model. Prompt, scorer, and citation format are
        identical across datasets, so the gap belongs to the data. Its passages are
        web text rather than Wikipedia and its answers run longer, and we cannot say
        from four datasets which of those matters. The practical reading is that postrationalization
        rates are domain-dependent, so a single-corpus number should not be quoted
        as a property of a model.\",\"metadata\":{\"ingestion_version\":\"01a0fc55257f7276be70b7b3d1501b36\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6-text-0017\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6\",\"chunk_type\":\"text\",\"section_path\":\"5.2
        Post-rationalization is common\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":88,\"page_no\":6,\"filename\":\"2609.23053v1.pdf\"}}},{\"id\":\"c5b0c05c-2e66-5f5c-a0f2-124748f30408\",\"version\":15,\"score\":0.2741134,\"payload\":{\"page_content\":\"Answer
        (after planting):\\n- A no-planting control as an improvement to the existing
        methodology , to get a more accurate idea about post-rationalization.\\n-
        The first controlled measurement of postrationalization in RLVR search agents
        , holding the base model, retrieval corpus, prompt, and scorer fixed across
        four datasets.\\n- Evidence that answer-only rewards leave citation faithfulness
        exactly where they found it , with a stated detection bound, plus a concrete
        proposal for folding attribution into the reward.\\n- A full reproduction
        on free-tier hardware , replacing the 104B Command R+ model of the original
        study with an open 7B model on two T4s.\",\"metadata\":{\"ingestion_version\":\"01a0fc55257f7276be70b7b3d1501b36\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6-text-0005\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6\",\"chunk_type\":\"text\",\"section_path\":\"Answer
        (after planting):\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":26,\"page_no\":2,\"filename\":\"2609.23053v1.pdf\"}}},{\"id\":\"3bd19445-3295-5129-bcfc-4a1b72982267\",\"version\":5,\"score\":0.27394408,\"payload\":{\"page_content\":\"G.
        Which Queries Break\\nFooled rates are uneven across questions. Figure 6 lists
        the ten most fragile ones. Questions about a well-known person's biography
        and about the landmark facts in our added passages top the list, because those
        passages contain the richest set of swappable entities. Yes/no and location
        questions are more exposed than open numeric ones, whose lower clean accuracy
        leaves less room for a correct-to-wrong flip. The pattern is a reminder that
        vulnerability depends on the fact being asked about, not only on the attack.\",\"metadata\":{\"ingestion_version\":\"01a0fc53392f724b972307d03a9f94d9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead-text-0014\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead\",\"chunk_type\":\"text\",\"section_path\":\"G.
