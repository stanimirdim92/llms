      , Balanced = 20. TOTAL, Subcategory = . TOTAL, Full = 987. TOTAL, Balanced =
      346\nIn the benign case, we observe a large increase in accuracy in the oracle
      RAG setting relative to the non-RAG setting, indicating that all of the models
      in our experiments are capable of incorporating information from RAG context,
      when the correct information is available. Therefore, safety behav- ior in the
      current study cannot be attributed to a model''s inability to attend to the
      RAG docs (An et al., 2025). Performance is loosely associated with model size:
      Phi-4-14B performs best in the oracle condition, followed by Gemma-3-12B, followed
      by the 7-8B parameter models.", "5 Discussion\nThe core question which motivates
      this work is whether safe documents lead to unsafe RAG generations. One possible
      explanation for the prior observations of unsafe responses in RAG systems is
      that the incorporation of any long context into an LLM can have the effect of
      shifting its behavior away from the basic, short-context regime where most of
      its safety training took place. However, our experiments do not support the
      conclusion that long context alone is a driver of unsafe behavior in RAG systems,
      with the ''random'' condition leading to the safest responses, partially through
      an increase in refusals due to lack of information.\n", "Table 3: What the no-planting
      control changes, for the baseline model. Planted and Control are cited records
      over all records ( k/n ); Attr. is the attributable rate in pp (Eq. 1). For
      CITED-OTHER the control is 100%, and the attributable rate is negative (all
      95% CIs exclude 0).\n\n| Dataset                      | Planted                      |
      Control                      | Attr.                        |\n|------------------------------|------------------------------|------------------------------|------------------------------|\n|
      REL-UNCITED (claim-aligned)  | REL-UNCITED (claim-aligned)  | REL-UNCITED (claim-aligned)  |
