      (after planting):\\n- A no-planting control as an improvement to the existing
      methodology , to get a more accurate idea about post-rationalization.\\n- The
      first controlled measurement of postrationalization in RLVR search agents ,
      holding the base model, retrieval corpus, prompt, and scorer fixed across four
      datasets.\\n- Evidence that answer-only rewards leave citation faithfulness
      exactly where they found it , with a stated detection bound, plus a concrete
      proposal for folding attribution into the reward.\\n- A full reproduction on
      free-tier hardware , replacing the 104B Command R+ model of the original study
      with an open 7B model on two T4s.\"},\"title\":\"2609.23053v1.pdf [01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6]
