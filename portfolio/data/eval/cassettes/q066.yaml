      Question Answering. In Proceedings of the 2018 Conference on Empirical Methods
      in Natural Language Processing , 2369-2380. Brussels, Belgium: Association for
      Computational Linguistics.", "5.2 Post-rationalization is common\nRAGTruth stands
      apart, two to five times lower than the rest for every model. Prompt, scorer,
      and citation format are identical across datasets, so the gap belongs to the
      data. Its passages are web text rather than Wikipedia and its answers run longer,
      and we cannot say from four datasets which of those matters. The practical reading
      is that postrationalization rates are domain-dependent, so a single-corpus number
      should not be quoted as a property of a model.", "Answer (after planting):\n-
      A no-planting control as an improvement to the existing methodology , to get
      a more accurate idea about post-rationalization.\n- The first controlled measurement
      of postrationalization in RLVR search agents , holding the base model, retrieval
      corpus, prompt, and scorer fixed across four datasets.\n- Evidence that answer-only
      rewards leave citation faithfulness exactly where they found it , with a stated
      detection bound, plus a concrete proposal for folding attribution into the reward.\n-
      A full reproduction on free-tier hardware , replacing the 104B Command R+ model
      of the original study with an open 7B model on two T4s.", "G. Which Queries
      Break\nFooled rates are uneven across questions. Figure 6 lists the ten most
      fragile ones. Questions about a well-known person''s biography and about the
      landmark facts in our added passages top the list, because those passages contain
      the richest set of swappable entities. Yes/no and location questions are more
      exposed than open numeric ones, whose lower clean accuracy leaves less room
      for a correct-to-wrong flip. The pattern is a reminder that vulnerability depends
      on the fact being asked about, not only on the attack.", "References\nBang An,
