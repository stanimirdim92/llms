      (majority vote) per harm category for Qwen-2.5-7B.", "References\n- Tinghao
      Xie, Xiangyu Qi, Yi Zeng, Yangsibo Huang, Udari Madhushani Sehwag, Kaixuan Huang,
      Luxi He, Boyi Wei, Dacheng Li, Ying Sheng, and 1 others. 2025. SORRY-Bench:
