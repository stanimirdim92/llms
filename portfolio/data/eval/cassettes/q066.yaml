      (Volume 1: Long Papers) , pages 1086210878, Bangkok, Thailand. Association for
      Computational Linguistics.", "A.8 Harmfulness rate by category\nCondition Condition
      Condition Phi-4-14B\nFigure 6: Harmfulness rate (majority vote) per harm category
      for Gemma-3-12B.\nFigure 7: Harmfulness rate (majority vote) per harm category
      for Llama-3.1-8B.\nFigure 8: Harmfulness rate (majority vote) per harm category
      for Ministral-3-8B.\nOn-topic\nCondition Condition\nFigure 9: Harmfulness rate
