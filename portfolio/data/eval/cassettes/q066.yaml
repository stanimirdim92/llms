        is a heatmap chart titled \\\"Qwen2.5-7B\\\" showing harmful rates across
        19 taxonomy subcategories (rows, including radiological_weapons, explosives,
        drugs, chemical_weapons, terrorism, cyberattacks, biological_weapons, hate_crimes,
        sexual_assault, etc.) against 4 experimental conditions (columns: Non-RAG,
        Oracle unsafe, On-topic, Random). Each cell displays a harmful rate value
        (0.00 to 1.00) with sample size (n), color-coded from white (low harm, 0.0)
        to dark red (high harm, 1.0) per the colorbar legend. The data reveals that
        the \\\"Oracle unsafe\\\" condition consistently produces the highest harmful
        rates (many values 0.55-1.00, including perfect 1.00 scores for radiological
        and biological weapons), while \\\"Random\\\" condition shows near-zero harmful
        rates across all subcategories, and \\\"Non-RAG\\\" and \\\"On-topic\\\" conditions
        show low-to-moderate harmful rates (generally 0.00-0.40), indicating that
        providing unsafe oracle context significantly increases model harmfulness
        compared to other retrieval conditions.\",\"metadata\":{\"ingestion_version\":\"01a0fc5427ea71babb96a22c2c5762f3\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a-fig-024-09\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a\",\"chunk_type\":\"figure\",\"section_path\":\"\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":219,\"page_no\":24,\"filename\":\"2609.11758v1.pdf\",\"image_path\":\"/var/www/html/personal/llms/portfolio/data/processed/01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a/figures/fig-024-09-0407ce4fe0fd0389.png\"}}},{\"id\":\"3112d294-65f2-5abe-a8cd-9278a0b94785\",\"version\":5,\"score\":0.25863045,\"payload\":{\"page_content\":\"This
        is a heatmap chart displaying \\\"Fooled rate (%)\\\" data across three manipulation
