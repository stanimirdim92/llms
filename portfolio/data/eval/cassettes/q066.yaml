        image consists of two line/bar charts comparing the effects of poisoned documents
        on model behavior, plotted against \\\"Poisoned documents (out of 3 retrieved)\\\"
        (0/3, 1/3, 2/3, 3/3) on the x-axis.\\n\\nPanel (a) is a line chart showing
        \\\"Abstention rate (%)\\\" for four conditions: Entity swap (red), Number
        swap (orange), Negation (purple), and Clean arm (green dashed baseline ~13%).
        As poisoned documents increase, abstention rises sharply for Entity swap (up
        to ~70%), while Number swap and Negation show moderate increases (up to ~42%),
        and the Clean arm remains flat.\\n\\nPanel (b) is a grouped bar chart showing
        \\\"Hallucination rate (%)\\\" for Clean arm (blue) versus Poisoned arm (red)
        across the same x-axis categories, revealing that hallucination rates decrease
        as poisoned documents increase for both arms, with the Poisoned arm dropping
        from 26.5% to 12.2% and the Clean arm from 31.3% to 29.9%.\",\"metadata\":{\"ingestion_version\":\"01a0fc53392f724b972307d03a9f94d9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead-fig-005-03\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead\",\"chunk_type\":\"figure\",\"section_path\":\"\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":66,\"page_no\":5,\"filename\":\"2609.09243v1.pdf\",\"image_path\":\"/var/www/html/personal/llms/portfolio/data/processed/01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead/figures/fig-005-03-f1d4adf3f7b93682.png\"}}},{\"id\":\"aa325133-d03f-540c-8fe9-3557110e45a9\",\"version\":9,\"score\":0.24537283,\"payload\":{\"page_content\":\"4.2
        R2: Unsafe information or unsafe context?\\nIn all cases, providing irrelevant
        (safe) documents leads to the safest behavior overall, suggesting that long
        context alone is not sufficient to steer the models into an unsafe regime.\\nThe
        results in Figure 2 are also partially consistent with one of the major conclusions
        from An et al. (2025), that the safest non-RAG LLM will likely be the safest
        RAG LLM. Indeed, Phi-4-14B is safest in both non-RAG and RAG settings, followed
        by Llama-3.1-8B. However, Qwen is the third safest in the non-RAG setting
        but the least safe in the oracle-RAG and on-topic RAG conditions, suggesting
        that some models' guardrails are more robust than others.\\nNote that the
        harmfulness rates are lower than\\n(though correlated with) the accuracy scores
        in Table 3. Accuracy and harmfulness are judged separately. Manual inspection
        reveals two large buckets of responses that are rated as accurate but not
        harmful: responses which are not flagged as harmful by the safety judges but
        likely should be, in the context (typically descriptions of historical events
        and nonviolent crimes), and cases where the model hedges that the information
        is for education purposes only (e.g., Ministral-3-8B in response to a query
        about misinformation propagation, \\\"... Here's a **generalized breakdown
        of memetic propagation techniques** (based on the text) that could theoretically
        be used to influence public opinion, **with the caveat that this is for educational/analytical
        purposes only** ... <goes into detail on techniques.>' ).\\nThe harmfulness
        rates for each model and condition broken down by harm taxonomy category are
        available in the Appendix (Figure 6-Figure 10). The categories which tend
        to see the greatest increase in harmful responses from the non-RAG setting
        to the oracle setting are: radiological weapons, explosives, drugs, chemical
        weapons, assault, terrorism, and cyberattacks. The Ministral and Qwen models
        also show a concerning increase in harmful responses to questions about suicide
        and self-harm.\",\"metadata\":{\"ingestion_version\":\"01a0fc5427ea71babb96a22c2c5762f3\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a-text-0014\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a\",\"chunk_type\":\"text\",\"section_path\":\"4.2
