      37/433                       | 4/433                        | +7.6                         |\n|
      RAGTruth                     | 19/864                       | 1/864                        |
      +2.1                         |\n| CITED-OTHER (cited-anywhere) | CITED-OTHER
      (cited-anywhere) | CITED-OTHER (cited-anywhere) | CITED-OTHER (cited-anywhere)
      |\n| NQ                           | 58/69                        | 69/69                        |
      - 15.9                       |\n| QAMPARI                      | 97/123                       |
      123/123                      | - 21.1                       |\n| HAGRID                       |
      50/61                        | 61/61                        | - 18.0                       |\n|
      RAGTruth                     | 558/623                      | 623/623                      |
      - 10.4                       |", "H. Relation to Prior Work\nOur findings extend
      the RAG picture drawn by Lewis et al. [1] from the cooperative case to an adversarial
      one: retrieval that lifts accuracy on clean corpora becomes a liability on corrupted
      ones. Where Shi et al. [3] showed that off-topic context distracts a model,
      we show that on-topic but false context does more, because it wears the appearance
      of the evidence the model was told to trust. The abstention-overfabrication
      pattern we measure is an empirical answer, for a small quantized model, to how
      such a system fails when the context is corrupted rather than merely irrelevant.
      The retrieval-integrated pre-training of Guu et al. [5] shares the grounding
      assumption our attack targets. Zhou et al. [4] warn that evaluation can leak
      into training and inflate scores; we keep the FEVER-derived query set fixed
      and report every cell from the same 588-run table so strategy comparisons are
      not an artifact of shifting test items.\nFig. 4. Failure behaviour across poisoning
      levels. Panel (a): abstention rises with poisoning for every strategy, most
      steeply for entity swap. Panel (b): the lexical-overlap proxy of unsupported
      generation is higher on the clean arm than the poisoned arm for all three strategies.\nFig.
      5. Outcome of queries that were correct on clean context, split by strategy
      and poisoning level. Green is still correct, blue is abstained, red is fooled.
      The lost green area is absorbed mainly by abstention, and negation retains the
      most correct answers.", "This is a heatmap chart titled \"Phi-4-14B\" displaying
      harmful rate data across a taxonomy of harm subcategories (rows) and four experimental
      conditions (columns): Non-RAG, Oracle unsafe, On-topic, and Random. The rows
      list 20 harm subcategories including radiological_weapons, explosives, drugs,
      chemical_weapons, assault_battery, terrorism, cyberattacks, suicide, murder,
      hate_speech, kidnapping, self_harm, financial_crimes, biological_weapons, hate_crimes,
      property_crimes, fraud_scam, sexual_assault, sexual_harassment, and abuse, with
      sample sizes (n) shown in each cell. The color scale ranges from white (0.0)
      to dark red (1.0) representing harmful rate, and the data reveals that the \"Oracle
      unsafe\" condition produces substantially higher harmful rates (ranging from
      0.05 to 0.55) across nearly all categories compared to Non-RAG, On-topic, and
      Random conditions, which remain mostly at or near 0.00, indicating that providing
      oracle unsafe context significantly increases the model''s tendency to generate
      harmful content.", "Attributed generation and citation evaluation.\nThe AIS
      framework evaluates whether statements are supported by identified sources (Rashkin
      et al., 2023). Automatic attribution and entailment evaluation (Bohnet et al.,
      2022; Honovich et al., 2022) inform the citation precision and recall metrics
      of ALCE (Gao et al., 2023), which we adapt. QASPER provides questions over research
      papers with annotator-marked evidence (Dasigi et al., 2021). LongCite studies
      fine-grained citation generation with long contexts (Zhang et al., 2025), a
      complementary direction to evaluating compression under a fixed generator.\nCompression
      and citation reliability. Li et al. (2026a) study Self-RAG on ASQA with LLMLingua-2
      and prefix truncation, finding sharper degradation in citation grounding than
      answer quality, and investigate hierarchical evidence retention. Our study adds
      crossfamily comparisons on ASQA and QASPER, distinguishes declared and recovered
      source mappings, and reports emitted and grounded scores against achieved context
      fractions. The conceptual finding overlaps; our contribution is experimental
      coverage and explicit evaluation and reporting procedures, rather than priority
      for the divergence. Wallat et al. (2025) distinguish citation correctness from
      causal faithfulness and investigate post-rationalization. Our NLI-based support
      scores do not establish whether the generator causally relied on the cited evidence.
      ALCE''s summary-context ablation also illustrates a correctness-citation trade-off
      (Gao et al., 2023); information-preservation studies examine grounding under
      compression (\u0141ajewska et al., 2025), and human evaluations examine verifiability
      as output abstractiveness changes (Worledge et al., 2024).\nProvenance and structured
      representations. Related provenance-oriented designs include claim-anchored
      multi-document summarization in CAMS (Guan, 2026), budgeted evidence retention
      in agent memory (Li et al., 2026b), and provenance-aware tiered memory (Zhu
      et al., 2026). Structured retrieval indexes use atomic propositions (Chen et
      al., 2024), recursive summary trees (Sarthi et al., 2024), or graph community
      summaries (Edge et al., 2024). These designs motivate explicit links between
      condensed representations and source evidence, but are not evaluated as compressors
      here. Attention-based explanations remain contested (Jain and Wallace, 2019;
      Wiegreffe and Pinter, 2019). Slot-based representations (Locatello et al., 2020;
      Tan and Kok, 2025; Ibtehaz and Kihara, 2026) suggest another possible compression
      mechanism; whether their internal structure can provide validated source attribution
      is an untested future direction.", "| Variant     | Where the span is planted                                                        |\n|-------------|----------------------------------------------------------------------------------|\n|
      REL-UNCITED | A retrieved passage that the answer did not cite.                                |\n|
      CITED-OTHER | Apassage the answer already cites, but for a different sentence.                 |\n|
      RANDOM      | An uncited slot, after replacing its passage with one from a different
      question. |", "6 Discussion\nHow to read the R-Search result. R-Search sits
      above its base on all four datasets and significantly above on the best-powered
      one, which is a real and consistent pattern. It is also one model, one base,
      one prompt, and one scorer, so four datasets are not four independent replications,
      and the effect softens under a stricter variant and a looser outcome. Two things
      would settle it: a cross-dataset test declared in advance, and an arm fine-tuned
      on the same data without RL, which would separate the contribution of RL from
      the contribution of fine-tuning on retrieval data at all.\nA note on cost. Everything
      here, four models, four datasets, three variants, both conditions, and the control
      that makes the comparison interpretable, ran on Kaggle''s T4 GPUs. Careful measurement
      was the cheap part of this project. The expensive part was reading the construction
      code closely enough to know which controls we did not have to run.", "Table
