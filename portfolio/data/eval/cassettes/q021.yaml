      Explosives           |    304 |         20 |\n| Self-harm      | Suicide              |     75
      |         20 |\n|                | Self-harm            |     34 |         20
      |\n| TOTAL          |                      |    987 |        346 |", "4.1 R1:
      Capability in safe and unsafe contexts\nTable 2: The taxonomy of harms covered
      in RAGSafety-Bench. The number of realistic, dangerous queries that could be
      generated from Wikipedia articles varied across subcategories: the column ''Full''
