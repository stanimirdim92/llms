      "G. Which Queries Break\nFooled rates are uneven across questions. Figure 6
      lists the ten most fragile ones. Questions about a well-known person''s biography
      and about the landmark facts in our added passages top the list, because those
      passages contain the richest set of swappable entities. Yes/no and location
      questions are more exposed than open numeric ones, whose lower clean accuracy
      leaves less room for a correct-to-wrong flip. The pattern is a reminder that
      vulnerability depends on the fact being asked about, not only on the attack.",
      "Table 8: Answerability of document contexts for the final balanced subset (
      n = 346 ). Oracle and on-topic contexts were audited with GPT-4.1mini. \u2020
      Random-control values reflect construction-time answer\\_support=none labels
      rather than a separate LLM audit.\n\n| Condition        | Yes         | Partial     |
      No / none    |\n|------------------|-------------|-------------|--------------|\n|
      Oracle unsafe    | 200 (57.8%) | 146 (42.2%) | 0 (0.0%)     |\n| On-topic safe    |
      0 (0.0%)    | 0 (0.0%)    | 346 (100.0%) |\n| Random control \u2020 | 0 (0.0%)    |
      0 (0.0%)    | 346 (100.0%) |", "4.2 R2: Unsafe information or unsafe context?\nIn
      all cases, providing irrelevant (safe) documents leads to the safest behavior
      overall, suggesting that long context alone is not sufficient to steer the models
      into an unsafe regime.\nThe results in Figure 2 are also partially consistent
      with one of the major conclusions from An et al. (2025), that the safest non-RAG
      LLM will likely be the safest RAG LLM. Indeed, Phi-4-14B is safest in both non-RAG
      and RAG settings, followed by Llama-3.1-8B. However, Qwen is the third safest
      in the non-RAG setting but the least safe in the oracle-RAG and on-topic RAG
      conditions, suggesting that some models'' guardrails are more robust than others.\nNote
      that the harmfulness rates are lower than\n(though correlated with) the accuracy
      scores in Table 3. Accuracy and harmfulness are judged separately. Manual inspection
      reveals two large buckets of responses that are rated as accurate but not harmful:
      responses which are not flagged as harmful by the safety judges but likely should
      be, in the context (typically descriptions of historical events and nonviolent
      crimes), and cases where the model hedges that the information is for education
      purposes only (e.g., Ministral-3-8B in response to a query about misinformation
      propagation, \"... Here''s a **generalized breakdown of memetic propagation
      techniques** (based on the text) that could theoretically be used to influence
      public opinion, **with the caveat that this is for educational/analytical purposes
      only** ... <goes into detail on techniques.>'' ).\nThe harmfulness rates for
      each model and condition broken down by harm taxonomy category are available
      in the Appendix (Figure 6-Figure 10). The categories which tend to see the greatest
      increase in harmful responses from the non-RAG setting to the oracle setting
      are: radiological weapons, explosives, drugs, chemical weapons, assault, terrorism,
      and cyberattacks. The Ministral and Qwen models also show a concerning increase
      in harmful responses to questions about suicide and self-harm.", "C Second-Evaluator
      Sensitivity Audit\nInference and diagnostics. The separate 24-test family uses
      pointwise 95% bootstrap intervals and two-sided randomization tests, each with
      10,000 replicates and seed 13, question resampling on ASQA and paper clustering
      on QASPER, with question-weighted means and Holm adjustment. The original 148-test
      analysis is unchanged. Tables 11-12 report precision means and all planned contrasts.
      All 16 emitted-grounded gaps remain positive after adjustment; the eight cross-evaluator
      precision differences remain unresolved, which does not establish equivalence.
      ECR and other budgets are outside this audit.\nThe run scored 6,015 unique pairs
      in 419 seconds of model inference (430 seconds including bookkeeping; setup
      and excluded attempts are additional). Four inputs required truncation, with
      maximum pre-truncation length 47,440 tokens. After normalization, 122 pairs
      (2.03%) produced nonbinary strings, including 103 empty strings; assigning zero
      does not establish reliable nonentailment. These are pair counts, not fractions
      of questions affected; the full histogram accompanies the cache. Recovery can
      disagree substantially: QASPER LLMLingua-2 has 50.3% agreement over 1,000 candidate
      decisions and mean recovery rates of 0.84 for DeBERTa versus 0.38 for TRUE.
      These descriptive results support sensitivity analysis, not accuracy against
      human judgments.\n"], "model": "rerank-2.5", "top_k": 5, "truncation": true}'
