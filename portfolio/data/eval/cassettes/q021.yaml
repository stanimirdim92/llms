      [01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a] (text, page
      12)\",\"citations\":{\"enabled\":true}},{\"type\":\"document\",\"source\":{\"type\":\"text\",\"media_type\":\"text/plain\",\"data\":\"3.2
