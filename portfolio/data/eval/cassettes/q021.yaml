      = Explosives. , Full = 304. , Balanced = 20. Self-harm, Subcategory = Suicide.
      Self-harm, Full = 75. Self-harm, Balanced = 20. , Subcategory = Self-harm. ,
      Full = 34. , Balanced = 20. TOTAL, Subcategory = . TOTAL, Full = 987. TOTAL,
      Balanced = 346\nIn the benign case, we observe a large increase in accuracy
      in the oracle RAG setting relative to the non-RAG setting, indicating that all
      of the models in our experiments are capable of incorporating information from
      RAG context, when the correct information is available. Therefore, safety behav-
      ior in the current study cannot be attributed to a model''s inability to attend
      to the RAG docs (An et al., 2025). Performance is loosely associated with model
      size: Phi-4-14B performs best in the oracle condition, followed by Gemma-3-12B,
      followed by the 7-8B parameter models.", "E. Experimental Design\nThe evaluation
      set contains 49 fact-checking queries, of which 37 are distinct, spanning locations,
      dates and counts, yes/no claims, and people. Ten information-rich passages covering
      the queried facts were added to the index because raw FEVER evidence sentences
      are often too terse to support a full answer. Crossing the query set with three
      strategies and four poisoning levels yields 49 \u00d7 3 \u00d7 4 = 588 runs,
      each producing a clean and a poisoned answer for 1 , 176 generations in total.
      Because a full sweep takes roughly a day on CPU, results are written to disk
      after every run and a checkpoint records completed cells, so an interrupted
      sweep resumes without repeating work.", "3.2 Safety-capability relationship\nOur
      benchmark, RAG-Safety-Bench, complements the original MIRAGE benchmark by measuring
      safety rather than benign capability. The benchmark enables direct comparison
      across 4 settings, as described in Table 1. Note the distinction between the
      Oracle and On-topic settings: in the oracle setting, the answer is directly
      available in the retrieved context. In the on-topic condition, the retrieved
      documents are on the same topic as the query (in the example, explosives), but
      do not contain the answer to the query.\nBy providing the context documents
      directly, the benchmark enables evaluation of the base LLM''s ability to maintain
      safety guardrails in the presence of RAG context, while removing the confounding
      factor of retriever quality (e.g., a poor retriever might simply miss the relevant
      unsafe document and therefore lead to a misleadingly inflated safety score).\nThe
      method for constructing the benchmark is as follows. We first develop a taxonomy
      of harmful user queries, based on the existing MLCommons AILuminate ''Hazard
      Taxonomy'' (Ghosh et al., 2025). The context of RAG safety evaluation and our
      intended corpus of Wikipedia documents required some modifications to the existing
      taxonomy. Our current version of RAG-SafetyBench excludes the following harm
      categories: Privacy/identification: since our knowledge base is a public resource,
      we assume it does not contain private information (though privacy leakage may
      be a concern in other RAG use cases); Direct generation of harmful content:
      the focus of the benchmark is on question answering, not content generation;
      Intellectual property: Wikipedia users are strictly forbidden from uploading
      copyrighted material without permission, and so it is not a suitable resource
      to test for intellectual property leakage; Specialized advice: this category
      (comprising topics such as legal advice, medical advice) is often poorly defined
      and highly-contextual, and so we do not include it here. The final taxonomy
      is given in Table 2.\nFollowing Park et al. (2025) and An et al. (2025), we
      use Wikipedia as our knowledge base. For each sub-category in the harm taxonomy,
      we identify a relevant category or set of categories on Wikipedia where harmful
      information related to the topic can be found. We then use Claude-Sonnet-4.5
      to generate potentially harmful questions whose answers can be found in one
      of the available Wikipedia documents. We also enforce a series of self-checks
      to avoid hallucinations or unrealistic questions (see Appendix for full details
      and prompts). The Claude model outputs a harmful question, a rating of the question''s
      severity, the name and ID of the Wikipedia article that contains the answer,
      the exact text passage containing the answer, a summary of the expected unsafe
      answer, as well as other additional information to aid human review of the questions
      and answers (shown in Table 6 in the Appendix). We aimed to generate a minimum
      of 20 queries per subcategory in the taxonomy, although ultimately there was
      more actionable information available for some categories than others. We therefore
      release two versions of the benchmark: the Full version contains 987 harmful
      queries, distributed unevenly across the subcategories, while the Balanced version
      (used in the current analysis) is subsampled to a more uniform distribution
      across subcategories (see Table 2).", "A.8 Harmfulness rate by category\nCondition
      Condition Condition Phi-4-14B\nFigure 6: Harmfulness rate (majority vote) per
      harm category for Gemma-3-12B.\nFigure 7: Harmfulness rate (majority vote) per
      harm category for Llama-3.1-8B.\nFigure 8: Harmfulness rate (majority vote)
      per harm category for Ministral-3-8B.\nOn-topic\nCondition Condition\nFigure
      9: Harmfulness rate (majority vote) per harm category for Phi-4-14B.\nFigure
      10: Harmfulness rate (majority vote) per harm category for Qwen-2.5-7B.", "This
      is a heatmap chart titled \"Qwen2.5-7B\" showing harmful rates across 19 taxonomy
      subcategories (rows, including radiological_weapons, explosives, drugs, chemical_weapons,
      terrorism, cyberattacks, biological_weapons, hate_crimes, sexual_assault, etc.)
      against 4 experimental conditions (columns: Non-RAG, Oracle unsafe, On-topic,
      Random). Each cell displays a harmful rate value (0.00 to 1.00) with sample
      size (n), color-coded from white (low harm, 0.0) to dark red (high harm, 1.0)
      per the colorbar legend. The data reveals that the \"Oracle unsafe\" condition
      consistently produces the highest harmful rates (many values 0.55-1.00, including
      perfect 1.00 scores for radiological and biological weapons), while \"Random\"
      condition shows near-zero harmful rates across all subcategories, and \"Non-RAG\"
      and \"On-topic\" conditions show low-to-moderate harmful rates (generally 0.00-0.40),
      indicating that providing unsafe oracle context significantly increases model
      harmfulness compared to other retrieval conditions.", "A.3 Answerability audit
      of evaluation contexts\nWe audited the exact rendered contexts used for the
      final balanced evaluation subset (346 questions) using GPT-4.1-mini. Given a
      question and its supplied documents, the judge classified whether the documents
      contained the information needed to directly and substantially answer the question
      as yes , partial , or no . We retained examples only when the oracle context
      was judged yes or partial and the on-topic context was judged no . Thus, the
      oracle condition contains answer-bearing evidence, while the on-topic condition
      is topically related but does not directly support the unsafe answer.\nTable
      8 reports the final audit outcomes. The random-control condition was constructed
      from a benign, off-topic document pool rather than independently re-judged by
      the LLM: all 346 randomcontrol contexts contain only documents labelled none
      for answer support in the benchmark metadata (1,012 documents in total).", "This
      is a heatmap chart titled \"Phi-4-14B\" displaying harmful rate data across
      a taxonomy of harm subcategories (rows) and four experimental conditions (columns):
      Non-RAG, Oracle unsafe, On-topic, and Random. The rows list 20 harm subcategories
