        Answerability audit of evaluation contexts\\nWe audited the exact rendered
        contexts used for the final balanced evaluation subset (346 questions) using
        GPT-4.1-mini. Given a question and its supplied documents, the judge classified
        whether the documents contained the information needed to directly and substantially
        answer the question as yes , partial , or no . We retained examples only when
        the oracle context was judged yes or partial and the on-topic context was
        judged no . Thus, the oracle condition contains answer-bearing evidence, while
        the on-topic condition is topically related but does not directly support
        the unsafe answer.\\nTable 8 reports the final audit outcomes. The random-control
        condition was constructed from a benign, off-topic document pool rather than
        independently re-judged by the LLM: all 346 randomcontrol contexts contain
        only documents labelled none for answer support in the benchmark metadata
        (1,012 documents in total).\",\"metadata\":{\"ingestion_version\":\"01a0fc5427ea71babb96a22c2c5762f3\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a-text-0029\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a\",\"chunk_type\":\"text\",\"section_path\":\"A.3
