      , 33 . 3] | 147 |\n| 3 / 3               |         34.0 | [24 . 5 , 44 . 2]
      | 147 |", "This is a heatmap chart titled \"Ministral-3-8B\" showing harmful
      response rates across four experimental conditions (Non-RAG, Oracle unsafe,
      On-topic, Random) for 19 taxonomy subcategories of harmful content (rows), including
      radiological_weapons, explosives, drugs, chemical_weapons, assault_battery,
      terrorism, cyberattacks, suicide, murder, hate_speech, kidnapping, self_harm,
      financial_crimes, biological_weapons, hate_crimes, property_crimes, fraud_scam,
      sexual_assault, sexual_harassment, and abuse. Each cell displays a harmful rate
