        Results on Common Questions\\nTables 4 and 5 report all primary settings.
        \u03C1 : nominal budget; \u02C6 \u03C1 : achieved ratio; P g /R g : grounded
        citation precision/recall; P e : emitted citation precision; reattr.: re-attribution
        rate (units without declared provenance recovering at least one source span
        under the NLI protocol); U s /U m : unsupported-claim rate under declared-span-only
        and summary-checked verification; str-EM: answer string exact match (ASQA);
        EF1: declaredevidence F1 (QASPER only). Every setting uses the same 944 ASQA
        or 976 QASPER successful questions; n denotes that common cohort, with metric-specific
        omissions identified in the tables. Scores are question-weighted means over
        defined values; superscript n = \xB7 \xB7 \xB7 gives the nonmissing count
        when smaller than the cohort, and dashes mark undefined metrics. QASPER verification
        rates exclude 1, 2, 3, and 2 zero-claim RECOMP answers at nominal budgets
        0.50, 0.25, 0.10, and 0.05, respectively; other settings use the full cohort.
        The 1 . 00 declared-span rates for noprovenance methods are structural; this
        verification mode does not attempt recovery. Exploratory slot-compressor runs
        are excluded. RECOMP emits identical per-question contexts at nominal budgets
        0.50 and 0.25 on ASQA, and at 0.50, 0.25, and 0.10 on QASPER. Separate generation
        passes are retained as distinct operating points.\",\"metadata\":{\"ingestion_version\":\"01a0fc54ff9a70d3af0e9b49e864b8b9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde-text-0027\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde\",\"chunk_type\":\"text\",\"section_path\":\"A
