- request:
    body: '{"query": "What example does the paper use to illustrate citation laundering?",
      "documents": ["1 Introduction\nCitations are the part of a RAG answer that a
      careful reader actually checks. The system retrieves passages, writes an answer,
      and marks each sentence with the passage it came from (Lewis et al., 2020; Gao
      et al., 2023); the marker is a promise about provenance. Follow [1], the promise
      says, and you will find where this sentence came from.\nModels break that promise
      more often than they look like they do. Wallat et al. (2025) showed that a model
      will cite a passage it never used, a behavior they call post-rationalization
      : the answer comes first, and the citation gets attached afterward to whatever
      passage looks like a plausible source. What makes this failure slippery is that
      nothing on the surface goes wrong. The answer is right. The citation is present,
      well formed, and points at a real Question:\nWho plays Joker in Batman: The
      Dark Knight?", "Answer (after planting):\nHeath Ledger plays the Joker in Batman
      The Dark Knight [4].\nFigure 1: A real case from our baseline model on NQ. Passage
      [4] is a plot summary of a Batman TV episode; it never mentions Heath Ledger
      or the film. We appended four words from the model''s own answer to it (shaded).
      The model then cites [4] instead of [1], although [1] is still in the context
      and supports the claim. Passages are abridged, and the other three retrieved
      passages are not shown.\npassage. Only someone who reads that passage closely
      notices that it never supported the claim.\nFigure 1 shows how thin the connection
      can get. Our baseline model correctly names Heath Ledger as the Joker and cites
      the Heath Ledger article. We then copied four words of the model''s own sentence
      into a plot summary of a Batman cartoon and asked again. The answer did not
      change. The citation moved to the cartoon passage, which never answers the original
      question, while the Ledger article stayed right there in the context. Four words
      were enough to make the model cite a source it did not use during inference.\nThis
      gets more pressing as RAG systems move from prompting to training. Search agents
      such as Search-R1 (Jin et al., 2025), ReSearch (Chen et al., 2025), and R-Search
      (Zhao et al., 2025) learn to search, read, and answer through reinforcement
      learning from verifiable rewards (RLVR), where the reward comes from checking
      the final answer. These agents get better at finding answers. Whether they also
      get better at pointing to the passage they used is a separate question, and
      their reward never asks it. That is the question we set out to answer.\nWith
      a measurement we trust, we compared four models that share one base, Qwen2.5-7B-Instruct
      (Qwen Team, 2024): the instruction-tuned model itself and three open-weight
      RLVR agents trained from it. One shared base is what makes the comparison clean,
      since any gap between an agent and the baseline comes from training rather than
      from a different model family. We ran all four across four question-answering
      datasets on Kaggle''s T4 GPUs.\nTwo findings stand out. Post-rationalization
      is common and it is not an artifact of RL: our untrained baseline cites unfaithfully
      for roughly one out of seven questions on the Wikipedia-based datasets. Under
      fixed-context inference, RLVR leaves it untouched. Search-R1 and ReSearch track
      their base model within a couple of points in either direction, and R-Search
      lands slightly worse rather than better. Our sample sizes would have caught
      any shift of about seven percentage points, so a large improvement is ruled
      out. Training a model to answer correctly, it turns out, teaches it nothing
      about citing honestly, which means citation faithfulness has to be rewarded
      and measured directly.\nWe contribute:", "5.1 What the control changes\nREL-UNCITED:
      the raw rate survives untouched. Read the top block: 52 of 371 NQ claims follow
      the plant, and 0 of those same 371 records cite the doctored passage when we
      take the span away. The control column is 0/ n on all four datasets, which is
      what Section 3.3 predicted, because removing four appended words restores the
      clean context exactly and the clean answer never cited that passage for that
      claim. Prediction and measurement agree, so +14.0pp on NQ is not a raw rate
      that needs an asterisk; it is the attributable effect.\nRANDOM: the control
      is real but tiny. Swapping in a passage from an unrelated question does occasionally
      earn a citation on its own, as the 4/433 on HAGRID and 1/864 on RAGTruth show,
      but the effect is small: 0.2% pooled across the 7,625 control records, with
      7 of 16 model-dataset cells at exactly zero and the rest between 0.1% and 0.9%
      (Appendix D). Between 83% and 100% of each raw rate survives as attributable,
      97% on average. The confound we built this control to catch turned out to be
      genuine and negligible, which is worth knowing precisely because we could not
      have assumed it.\nCITED-OTHER: the raw rate lies, and the control catches it.
      The bottom block is the reason we care about all this. Planted rates run from
      78.9% to 89.6%, many times the REL-UNCITED rates, and any paper could report
      them as evidence of rampant post-rationalization. The control column explains
      them away: 69/69, 123/123, 61/61, 623/623. Every single control record cites
      the doctored passage, because this variant selects a passage the clean answer
      already cited elsewhere. Subtract, and the attributable effect is negative on
      all four datasets, from -10.4pp to -21.1pp, with intervals that exclude zero.
      A raw rate of 79-90% here measures our sampling rule and nothing else. Under
      the stricter claim-aligned outcome the same records do show genuine post-rationalization,
      +10.6 to +19.7pp (Appendix D), though only RAGTruth has enough questions to
      pin it down.\nThe moral generalizes past this probe: whenever a measurement
      edits an input and counts how often the output changes, report the unedited
      baseline, and demonstrate rather than assume that it is zero.", "3.3 The no-planting
      control\nWallat et al. (2025) report raw planted rates. A raw rate answers ''how
      often does the model cite the doctored passage?'' What we need is ''how much
      of that did the plant cause?'' The two come apart whenever editing the context
      does anything on its own, and a raw rate quietly credits the plant with all
      of it.\nThe fix is to run the same context with the span removed and subtract:\n<!--
      formula-not-decoded -->\nRead Equation 1 as a before-and-after over the same
      records. The first term counts how often the model takes the bait; the second
      counts how often it would have cited that passage anyway; the difference is
      what the plant actually bought.\nWhat makes this control unusual is that we
      could derive two of its three values before spending a single GPU-hour, just
      by reading how each variant is built.\nREL-UNCITED: the control is 0 by construction.
      Planting here only appends words to a passage already sitting in the context.
      Delete them and the context is byte-for-byte the clean one; with an identical
      prompt and greedy decoding, the control run reproduces the clean answer exactly.
      That clean answer, by the very rule that selected this passage, did not cite
      it for this claim. The control rate is therefore 0 as a matter of definition
      rather than measurement, and the raw rate already is the attributable rate.
      We verified the byte-for-byte claim on all 10,720 records of the two appending
      variants; 6 score above zero, all from RAGTruth answers that repeat an identical
      sentence.\nCITED-OTHER: the control is 100%, so a raw rate is an illusion. This
      variant plants in a passage the clean answer already cites for some other sentence.
      Under the cited-anywhere outcome we are then asking whether a passage that was
      cited stays cited, and it does, by selection. A raw rate here describes our
      sampling rule, not the model''s behavior, which is exactly why the attributable
      rate turns negative in Section 5.1.\nRANDOM: the control has to be measured.
      Here we swap an uncited slot for a passage drawn from a different question,
      then plant in it. Two things change at once, the passage and the span, and no
      amount of reasoning tells us how often a model cites an out-of-place passage
      on its own. This is the one variant that needed fresh runs: 16 GPU jobs, roughly
      10 GPU-hours, and 7,625 control records, each paired with its planted twin.
      The answer came back small. With no plant, models cite the foreign passage in
      17 of 7,625 records, or 0.2%.", "Ethics Statement\nThis work uses only publicly
      released models and datasets. It involves no human subjects and no personal
      data. The planted spans are taken from the models'' own answers and are used
      only in offline evaluation. The work describes a way that citations in RAG systems
      can mislead readers, with the aim of making that failure measurable; it does
      not provide a method for attacking deployed systems. Because RLVR training is
      in wide use, we have tried to state the limits of our null result clearly so
      that it is not read as a stronger claim than the data support.", "6 Discussion\nWhat
      a citation is worth to a reader. Our results say that in this setting a citation
      marks where the words of an answer can be found, not where the answer came from.
      Figure 1 is the honest version of the problem: the model knew the answer, had
      the supporting passage in front of it, cited it, and then handed the citation
      to a cartoon plot summary after we moved four words. A reader auditing that
      citation opens the passage, finds the claim''s wording sitting there, and walks
      away reassured. The audit passes and the provenance is still wrong. That is
      what makes post-rationalization worse than an ordinary error: it defeats exactly
      the check a careful reader would run, at a rate of roughly one cited sentence
      in seven on Wikipedia-style questions, in an openly available 7B model, using
      a plant so crude that we picked it with a character count.\nWhy RLVR leaves
      this untouched. The reward is the whole story. These agents earn credit when
      an automatic checker matches their final answer against a reference, and R-Search
      adds credit for steps along its search trajectory. Not one term in those objectives
      inspects the link between a sentence and the passage cited beside it. An agent
      that retrieves well, reasons well, and then attaches the wrong marker collects
      full reward. Optimization delivers what you pay for, so citation behavior stays
      wherever the base model left it, which is exactly the pattern in Table 5: two
      agents indistinguishable from their base, one slightly worse, none better.\nInterpreting
      the fixed-context result. The agents were trained for multi-step search, but
      our evaluation intentionally removes that component to hold evidence constant.
      Thus, the null result shows that RLVR did not produce a detectable attribution
      effect in this fixed-context setting. It does not rule out an effect that emerges
      through interactive search, where retrieval decisions and citation behavior
      can interact. An allow-retrieval evaluation would be needed to test that broader
      question.\nFixing it means paying for it. If answer-only rewards leave attribution
      where they found it, attribution has to enter the objective. The probe in this
      paper is a ready-made term for that. It is deterministic, needs no judge model,
      and with the control in place it isolates the effect of the plant rather than
      the noise of editing a context, so it can run inside a training loop. Concretely,
      a PPO or GRPO pipeline of the kind Search-R1 and ReSearch already use could
      add an attribution-consistency penalty: sample a rollout, plant a span from
      the model''s own answer into an uncited passage, re-score, and penalize the
      policy when the citation follows the plant. The signal is cheap, it is grounded
      in behavior rather than in a learned preference model, and it targets the failure
      directly instead of hoping that better answers drag better citations along behind
      them. On the evaluation side, the same probe yields a number that is comparable
      across models, which is what the field currently lacks for citation faithfulness.",
      "1 Introduction\nContext compression reduces generator input in retrieval-augmented
      generation (RAG) (Xu et al., 2024; Jiang et al., 2024; Pan et al., 2024; Chirkova
      et al., 2025). Citation-grade attribution requires locatable evidence: a reader
      must be able to retrieve and check the cited source (Rashkin et al., 2023; Bohnet
      et al., 2022). Abstractive compression can interrupt this link when citations
      identify compressor-generated text without its supporting source spans. We call
      it attribution launder- ing when consistency with compressor-generated text
      is treated as evidence of support from original sources. On ASQA at nominal
      budget 0 . 25 (achieved ratio 0 . 08 ), a RECOMP-style compressor''s citations
      score 0.86 precision against its summaries and 0.12 against source spans under
      our recovery protocol. These automatic scores depend on a shared NLI evaluator
      and bounded candidate search; they have not been independently calibrated.\nRelated
      work already identifies a divergence between answer quality and citation grounding
      under compression (Li et al., 2026a), while citation support does not establish
      causal reliance on evidence (Wallat et al., 2025). We examine this problem across
      compressor families and two datasets, reporting achieved context fractions,
      explicit sourcerecovery rules, and paired comparisons on shared questions. Our
      measurements concern source support under an automatic evaluation protocol;
      they do not test causal citation faithfulness.\nWe conduct a controlled measurement
      study with a fixed generator (Qwen2.5-7B-Instruct with ALCE-style numbered-context
      citation prompting), a fixed primary NLI evaluator, and nominal budgets of {
      0 . 5 , 0 . 25 , 0 . 1 , 0 . 05 } in generatortokenizer tokens. Our contributions
      are:\n- The attribution-compression frontier. A comparison across reranking,
      extractive selection, abstraction, token pruning, ECR, and an identity reference
      against achieved context fractions. All settings share 944 successful ASQAquestions
      and 976 QASPER questions from 271 papers; paired tests quantify their differences.\n-
      A re-attributability protocol. A unit without declared provenance is counted
      as reattributable when NLI predicts entailment from a candidate source snippet;
      recovered sources support grounded citation scores\n- alongside emitted scores
      against compressed text.\n- Three verification modes. We separate consistency
      with summaries, availability of declared provenance, and claim support after
      source recovery. Structural rejection under declared-only checking is distinguished
      from measured rejection after recovery.\n- An extract-cluster-rewrite (ECR)
      observation. A simple construction greedily merges near-duplicate sentences
      and cites all members of each cluster; paired comparisons quantify its measured
      differences from extraction across budgets.", "B. Poisoning Strategies\nDocument
      poisoning here means rewriting a retrieved passage so that it states something
      false while remaining fluent and on-topic. The rewrite happens after retrieval
      and before the prompt is built, so the retriever itself is never attacked; only
      the evidence handed to the model is altered. Three strategies are implemented,
      each targeting a different class of fact.\nEntity swap replaces named entities
      with plausible alternatives of the same type. ''The Eiffel Tower is located
      in Paris, France'' becomes ''The Eiffel Tower is located in Madrid, Spain.''
      Grammar and register are untouched, so nothing flags the sentence as suspicious
      except the fact itself.\nNumber swap perturbs a numeric value to a nearby wrong
      one, for example turning ''over 13,000 miles'' into ''over 3,000 miles.'' A
      language model has no internal arithmetic check for such a claim and tends to
      echo whatever figure the context provides.\nNegation inserts a negation that
      flips the truth value of a statement, so ''Barack Obama was the 44th President''
      becomes ''Barack Obama was never the 44th President.'' The word ''never'' is
      a strong lexical signal, and we expected the model to treat it with more suspicion
      than a silent entity substitution.", "Abstract\nA RAG system can hand you the
      right answer and cite a source it did not actually use. Models output these
      unfaithful citations via postrationalization : they write the answer first and
      then attach a citation to whatever passage looks close enough. Search agents
      are now trained with reinforcement learning from verifiable rewards (RLVR),
      which pays them for getting the answer right. We asked whether that training
      also teaches them to cite honestly.\nImproving an existing methodology with
      a required control, we compared an instructiontuned model against three RLVR
      agents trained from it, on four question-answering datasets, using only free-tier
      Kaggle GPUs. Postrationalization is everywhere: on Wikipediabased questions
      roughly one citation in seven is unfaithful. RLVR does not fix it. The agents
      post-rationalize at their base model''s rate, and one lands slightly worse.
      Rewarding correct answers buys nothing in citation faithfulness, so faithfulness
      has to be trained and measured on its own terms.", "7 Conclusion\nWe asked whether
      training RAG search agents for correct answers also teaches them to cite honestly
      under fixed-context inference. We find no detectable improvement. Getting to
      that answer meant repairing the measurement first: we reproduced the planting
      probe of Wallat et al. (2025) on an open 7B model, added the no-planting control
      it lacked, and showed that the control is 0 by construction for the main variant,
      100% for another, and a small measured quantity for the third. With that in
      hand, post-rationalization turns out to be common in an instruction-tuned model,
      roughly one cited sentence in seven on Wikipedia-based questions, and three
      RLVR agents trained from that model reproduce its rate, with one landing slightly
      worse. Faithful citation is not a side effect of answer accuracy. It has to
      be rewarded, measured, and reported on its own, and the probe we describe here
      is cheap enough to do all three inside an existing training loop.", "3.1 The
      planting probe\nWe follow the probe of Wallat et al. (2025), which runs in three
      steps.\n1. Answer. The model answers a question from five retrieved passages.
      Every sentence ends with exactly one citation, so each sentence and its marker
      form one claim .\n2. Plant. We lift a short span out of the claim and append
      it to a passage the model did not cite for that claim, then re-run the same
      model on the doctored context with the same prompt.\n3. Check. We ask whether
      the model now cites the doctored passage for that claim.\nThe logic is a swap
      test. The doctored passage shares nothing with the claim except the words we
      pasted into it, and the passage the model originally cited never leaves the
      context. A model that reads for meaning has no reason to move. A model that
      matches surface strings has every reason to, and when it moves, its citation
      was never evidence of where the answer came from.\nTable 1 lists the three variants,
      which differ only in which passage receives the span. REL-UNCITED plants in
      a passage the retriever returned and the model ignored, the situation a deployed
      system meets constantly, and it is our main measure.\nREL-UNCITED, Where the
      span is planted = A retrieved passage that the answer did not cite.. CITED-OTHER,
      Where the span is planted = Apassage the answer already cites, but for a different
      sentence.. RANDOM, Where the span is planted = An uncited slot, after replacing
      its passage with one from a different question.\nTable 1: The three probe variants.
      Each changes exactly one of the five retrieved passages, and the passage that
      genuinely supports the claim stays in the context. RELUNCITED is our main measure.\nChoosing
      the span. The original probe leaned on Command R+, which marks the exact words
      it grounds on. Qwen2.5 offers no such markup, so we need a rule, and we keep
      it blunt and deterministic: the four consecutive words of the claim with the
      most characters. This decision was influenced by Wallat et al. (2025). We played
      around with 2-4 words for the span and choosing four words minimized bias.",
      "3.2 What counts as citing the planted passage\nThe re-run answer may be worded
      differently, so we first locate the sentence that best matches the original
      claim by word overlap (Jaccard similarity of at least 0.3), then ask whether
      that sentence cites the doctored passage. This is our claim-aligned outcome,
      and the pairing carries the weight: it asks whether the model cited the planted
      passage for the claim we planted into , not whether the marker turns up loose
      somewhere in the answer. We keep the looser cited-anywhere outcome as a sensitivity
      check, and Section 5.1 shows how much slack it introduces.\nWe score every record,
      with no filtering on whether the planted span reappears in the new answer. The
      original probe conditions on exactly that, and our control shows why it should
      not: with nothing planted at all, those four words come back in 60-74% of answers,
      simply because the model wrote them in the first place. Span recovery tells
      us the model repeated itself, not that our plant did anything.", "REFERENCES\n-
      [1] P. Lewis et al. , ''Retrieval-augmented generation for knowledge-intensive
      NLP tasks,'' in Advances in Neural Information Processing Systems , vol. 33,
      2020, pp. 9459-9474.\n- [2] J. Thorne, A. Vlachos, C. Christodoulopoulos, and
      A. Mittal, ''FEVER: a large-scale dataset for fact extraction and verification,''
      in Proc. Conf. North American Chapter of the Association for Computational Linguistics
      (NAACL-HLT) , 2018, pp. 809-819.\n- [3] F. Shi et al. , ''Large language models
      can be easily distracted by irrelevant context,'' in Proc. Int. Conf. Machine
      Learning (ICML) , 2023, pp. 31210-31227.\n- [4] K. Zhou et al. , ''Don''t make
      your LLM an evaluation benchmark cheater,'' arXiv preprint arXiv:2311.01964,
      2023.\nFooled rate across all conditions (%)\nFig. 6. The ten queries with the
      highest fooled rate across all conditions. Biographical and landmark questions
      dominate because the passages that answer them carry many swappable entities.\nserve
      as a cheap early warning of a poisoned store.", "7 Discussion\nWhat laundering
      looks like. Consider an ASQA example under RECOMP at nominal budget 0.25. Asked
      ''How many state parks are there in Virginia?'' , the generator answers ''There
      are 34 state parks in Virginia [1]'' , while Document [1] states ''Virginia
      has 34 state parks and 17 state forests . . . '' . The citation receives full
      emitted precision, but Document [1] is the compressor''s summary with no declared
      source link. In another example, the answer ''The man who killed [them] is not
      mentioned in the retrieved documents [1]'' cites a summary containing that same
      assertion of absence. Both illustrate consistency with intermediate text without
      a declared path to source evidence; neither example alone establishes an independently
      verified hallucination.\nImplications for practice. Five operational recommendations
      follow from this evaluation setup. (1) Verify against source spans: consistency
      with compressor output does not establish support from locatable evidence. Report
      whether spans are declared or recovered and how support is judged. (2) Report
      achieved compression: nominal fractions overstate achieved context size by up
      to 32.8fold here (Section 4.1). (3) Include verification in cost reporting:
      report generator and verifier input lengths together, while identifying which
      other costs remain unmeasured (Table 2). Zero declaredspan cost can mean that
      no evidence reached the verifier. (4) Evaluate post-hoc recovery explicitly:
      missed recovery can reflect search errors or missing support (Section 6). (5)
      Document citable-unit granularity: comparisons differ in their source units
      as well as their datasets. Controlled ablations are needed to isolate the effect
      of unit size.\nWhat dominating the frontier would require. Future compressors
      should merge redundant evidence while retaining validated source links and accounting
      for verification cost. ECR''s limited measured gains motivate independent calibration
      and replication before claiming general improvements.\nFailure modes and excluded
      examples. All 33 failures occur in identity runs: 4 budget-check failures on
      ASQA, and 15 budget-check plus 14 prompt-overflow failures on QASPER. No compressed
      run fails on these examples. Primary comparisons exclude the same failed question
      IDs from every setting, so their estimand is performance conditional on identity
      success.", "2 Related Work\nCitations in RAG. RAG conditions generation on retrieved
      passages (Lewis et al., 2020), and benchmarks such as ALCE ask models to cite
      those passages sentence by sentence (Gao et al., 2023). Most evaluations score
      whether a citation is correct : does the cited passage support the sentence?
      Wallat et al. (2025) pushed on a harder question: did the model actually use
      it? Those two can come apart. A model that already knows the answer can write
      it down, scan the passages, and attach the one that fits, producing a citation
      that is correct and unfaithful at the same time. Their planting probe exposes
      the gap, and we reproduce it, then add the control it was missing (Section 3).\nRLVR
      search agents. Search-R1 (Jin et al., 2025), ReSearch (Chen et al., 2025), and
      R-Search (Zhao et al., 2025) teach a language model to interleave search calls
      with reasoning, rewarding it when the final answer checks out against a reference.
      All three release open weights trained from Qwen2.5-7B-Instruct, which lets
      us line each agent up against the exact model it grew from. Their papers report
      answer quality. None of them reports how many citations are faithful, which
      is the gap we fill.\nFaithful reasoning is a different question. VERITAS (Xu
      et al., 2025) showed that the reasoning traces of Search-R1 and ReSearch do
      not always line up with the searches they issue, the information they retrieve,
      or the answers they produce. That is faithfulness within the reasoning chain.
      We ask about faithfulness to the evidence : is the cited passage the one the
      answer leaned on? An agent can narrate its search honestly and still misattribute
      the result, or reason sloppily and cite correctly. The two findings sit side
      by side rather than in conflict.", "4 Experimental Setup\nLeakage drove the
      dataset choice. NQ is where the original probe ran, so we keep it for comparability,
      but Search-R1 trained on NQ''s training split and we say so plainly. QAMPARI,
      HAGRID, and RAGTruth were not used to train any of the three agents, so on those
      datasets no gap can be waved away as familiarity with the data. They also sidestep
      a retrieval quirk in NQ: for 186 of 499 NQquestions (37.3%), all five passages
      come from one document, which leaves the model almost no choice about what to
      cite. The other three datasets have no such questions.\nPrompt and generation.
      One prompt does all the work, byte-identical across models and across the clean
      and doctored runs. It tells the model to answer using only the numbered passages,
      to close every sentence with exactly one citation such as [2], and to reply
      ''I don''t know'' when the passages fall short. Decoding is greedy, capped at
      300 new tokens. When any sentence of an answer breaks the one-citation rule
      we drop the whole answer rather than salvage the compliant half, because a partly
      rescued answer reintroduces the claim-to-citation ambiguity the format exists
      to prevent. Models differ sharply in how often they abstain, from 15% to 52%
      of questions; Appendix C takes that apart. The full prompt is in Appendix A.\nReading
      our numbers. Three statistical choices shape every result, and each has a plain
      reason behind it.\nWe resample questions, not claims. A single question yields
      up to seven claims that share one context and one generated answer, so treating
      claims as independent would make our intervals look tighter than they are. We
      use a cluster bootstrap instead: draw whole questions with replacement 2,000
      times, recompute the planted and control conditions on the same draw so the
      pairing survives, and read off the 2.5th and 97.5th percentiles. Every 95% confidence
      interval in this paper is that band, the range of effects our data are consistent
      with.\nWe compare each agent against its own base. Post-rationalization is common
      in the baseline, so reporting that an agent post-rationalizes tells us nothing
      about RL. The question is whether an agent diverges from the model it was trained
      from. That calls for a difference-in-differences: take the plantversus-control
      difference within a model (Equation 1), then difference those differences across
      models,\n<!-- formula-not-decoded -->\nNegative says RLVR made citations more
      faithful, positive says it made them worse, and zero says training left this
      behavior alone. Within each dataset we test all three agents against the baseline
      and correct the three comparisons with the Holm method, so that running three
      tests does not manufacture a significant one.", "| Variant     | Where the span
      is planted                                                        |\n|-------------|----------------------------------------------------------------------------------|\n|
      REL-UNCITED | A retrieved passage that the answer did not cite.                                |\n|
      CITED-OTHER | Apassage the answer already cites, but for a different sentence.                 |\n|
      RANDOM      | An uncited slot, after replacing its passage with one from a different
      question. |", "Table 3: What the no-planting control changes, for the baseline
      model. Planted and Control are cited records over all records ( k/n ); Attr.
      is the attributable rate in pp (Eq. 1). For CITED-OTHER the control is 100%,
      and the attributable rate is negative (all 95% CIs exclude 0).\n\n| Dataset                      |
      Planted                      | Control                      | Attr.                        |\n|------------------------------|------------------------------|------------------------------|------------------------------|\n|
      REL-UNCITED (claim-aligned)  | REL-UNCITED (claim-aligned)  | REL-UNCITED (claim-aligned)  |
      REL-UNCITED (claim-aligned)  |\n| NQ                           | 52/371                       |
      0/371                        | +14.0                        |\n| QAMPARI                      |
      29/319                       | 0/319                        | +9.1                         |\n|
      HAGRID                       | 64/433                       | 0/433                        |
      +14.8                        |\n| RAGTruth                     | 25/864                       |
