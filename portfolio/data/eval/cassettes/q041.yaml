      Only someone who reads that passage closely notices that it never supported
      the claim.\\nFigure 1 shows how thin the connection can get. Our baseline model
      correctly names Heath Ledger as the Joker and cites the Heath Ledger article.
      We then copied four words of the model's own sentence into a plot summary of
      a Batman cartoon and asked again. The answer did not change. The citation moved
      to the cartoon passage, which never answers the original question, while the
      Ledger article stayed right there in the context. Four words were enough to
      make the model cite a source it did not use during inference.\\nThis gets more
      pressing as RAG systems move from prompting to training. Search agents such
