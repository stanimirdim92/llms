        The no-planting control\nWallat et al. (2025) report raw planted rates. A
        raw rate answers ''how often does the model cite the doctored passage?'' What
        we need is ''how much of that did the plant cause?'' The two come apart whenever
        editing the context does anything on its own, and a raw rate quietly credits
        the plant with all of it.\nThe fix is to run the same context with the span
        removed and subtract:\n<!-- formula-not-decoded -->\nRead Equation 1 as a
        before-and-after over the same records. The first term counts how often the
        model takes the bait; the second counts how often it would have cited that
        passage anyway; the difference is what the plant actually bought.\nWhat makes
        this control unusual is that we could derive two of its three values before
        spending a single GPU-hour, just by reading how each variant is built.\nREL-UNCITED:
        the control is 0 by construction. Planting here only appends words to a passage
        already sitting in the context. Delete them and the context is byte-for-byte
        the clean one; with an identical prompt and greedy decoding, the control run
        reproduces the clean answer exactly. That clean answer, by the very rule that
        selected this passage, did not cite it for this claim. The control rate is
        therefore 0 as a matter of definition rather than measurement, and the raw
        rate already is the attributable rate. We verified the byte-for-byte claim
        on all 10,720 records of the two appending variants; 6 score above zero, all
        from RAGTruth answers that repeat an identical sentence.\nCITED-OTHER: the
        control is 100%, so a raw rate is an illusion. This variant plants in a passage
        the clean answer already cites for some other sentence. Under the cited-anywhere
        outcome we are then asking whether a passage that was cited stays cited, and
        it does, by selection. A raw rate here describes our sampling rule, not the
        model''s behavior, which is exactly why the attributable rate turns negative
        in Section 5.1.\nRANDOM: the control has to be measured. Here we swap an uncited
        slot for a passage drawn from a different question, then plant in it. Two
        things change at once, the passage and the span, and no amount of reasoning
        tells us how often a model cites an out-of-place passage on its own. This
        is the one variant that needed fresh runs: 16 GPU jobs, roughly 10 GPU-hours,
        and 7,625 control records, each paired with its planted twin. The answer came
        back small. With no plant, models cite the foreign passage in 17 of 7,625
        records, or 0.2%.","metadata":{"ingestion_version":"01a0fc55257f7276be70b7b3d1501b36","chunk_id":"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6-text-0009","doc_id":"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6","chunk_type":"text","section_path":"3.3
