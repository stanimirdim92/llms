    body: "{\"max_tokens\":16000,\"messages\":[{\"role\":\"user\",\"content\":\"You
      check whether an answer is supported by its sources.\\n\\nQuestion: What example
      does the paper use to illustrate citation laundering?\\n\\nSources the answer
      was written from:\\n[1] Answer (after planting):\\nHeath Ledger plays the Joker
      in Batman The Dark Knight [4].\\nFigure 1: A real case from our baseline model
      on NQ. Passage [4] is a plot summary of a Batman TV episode; it never mentions
      Heath Ledger or the film. We appended four words from the model's own answer
      to it (shaded). The model then cites [4] instead of [1], although [1] is still
      in the context and supports the claim. Passages are abridged, and the other
      three retrieved passages are not shown.\\npassage. Only someone who reads that
      passage closely notices that it never supported the claim.\\nFigure 1 shows
      how thin the connection can get. Our baseline model correctly names Heath Ledger
      as the Joker and cites the Heath Ledger article. We then copied four words of
      the model's own sentence into a plot summary of a Batman cartoon and asked again.
      The answer did not change. The citation moved to the cartoon passage, which
      never answers the original question, while the Ledger article stayed right there
      in the context. Four words were enough to make the model cite a source it did
      not use during inference.\\nThis gets more pressing as RAG systems move from
      prompting to training. Search agents such as Search-R1 (Jin et al., 2025), ReSearch
      (Chen et al., 2025), and R-Search (Zhao et al., 2025) learn to search, read,
      and answer through reinforcement learning from verifiable rewards (RLVR), where
      the reward comes from checking the final answer. These agents get better at
      finding answers. Whether they also get better at pointing to the passage they
      used is a separate question, and their reward never asks it. That is the question
      we set out to answer.\\nWith a measurement we trust, we compared four models
      that share one base, Qwen2.5-7B-Instruct (Qwen Team, 2024): the instruction-tuned
      model itself and three open-weight RLVR agents trained from it. One shared base
      is what makes the comparison clean, since any gap between an agent and the baseline
      comes from training rather than from a different model family. We ran all four
      across four question-answering datasets on Kaggle's T4 GPUs.\\nTwo findings
      stand out. Post-rationalization is common and it is not an artifact of RL: our
      untrained baseline cites unfaithfully for roughly one out of seven questions
      on the Wikipedia-based datasets. Under fixed-context inference, RLVR leaves
      it untouched. Search-R1 and ReSearch track their base model within a couple
      of points in either direction, and R-Search lands slightly worse rather than
      better. Our sample sizes would have caught any shift of about seven percentage
      points, so a large improvement is ruled out. Training a model to answer correctly,
      it turns out, teaches it nothing about citing honestly, which means citation
      faithfulness has to be rewarded and measured directly.\\nWe contribute:\\n\\n[2]
      7 Discussion\\nWhat laundering looks like. Consider an ASQA example under RECOMP
      at nominal budget 0.25. Asked 'How many state parks are there in Virginia?'
      , the generator answers 'There are 34 state parks in Virginia [1]' , while Document
      [1] states 'Virginia has 34 state parks and 17 state forests . . . ' . The citation
      receives full emitted precision, but Document [1] is the compressor's summary
      with no declared source link. In another example, the answer 'The man who killed
      [them] is not mentioned in the retrieved documents [1]' cites a summary containing
      that same assertion of absence. Both illustrate consistency with intermediate
      text without a declared path to source evidence; neither example alone establishes
      an independently verified hallucination.\\nImplications for practice. Five operational
      recommendations follow from this evaluation setup. (1) Verify against source
      spans: consistency with compressor output does not establish support from locatable
      evidence. Report whether spans are declared or recovered and how support is
      judged. (2) Report achieved compression: nominal fractions overstate achieved
      context size by up to 32.8fold here (Section 4.1). (3) Include verification
      in cost reporting: report generator and verifier input lengths together, while
      identifying which other costs remain unmeasured (Table 2). Zero declaredspan
      cost can mean that no evidence reached the verifier. (4) Evaluate post-hoc recovery
      explicitly: missed recovery can reflect search errors or missing support (Section
      6). (5) Document citable-unit granularity: comparisons differ in their source
      units as well as their datasets. Controlled ablations are needed to isolate
      the effect of unit size.\\nWhat dominating the frontier would require. Future
      compressors should merge redundant evidence while retaining validated source
      links and accounting for verification cost. ECR's limited measured gains motivate
      independent calibration and replication before claiming general improvements.\\nFailure
      modes and excluded examples. All 33 failures occur in identity runs: 4 budget-check
      failures on ASQA, and 15 budget-check plus 14 prompt-overflow failures on QASPER.
      No compressed run fails on these examples. Primary comparisons exclude the same
      failed question IDs from every setting, so their estimand is performance conditional
      on identity success.\\n\\n[3] 1 Introduction\\nCitations are the part of a RAG
      answer that a careful reader actually checks. The system retrieves passages,
      writes an answer, and marks each sentence with the passage it came from (Lewis
      et al., 2020; Gao et al., 2023); the marker is a promise about provenance. Follow
      [1], the promise says, and you will find where this sentence came from.\\nModels
      break that promise more often than they look like they do. Wallat et al. (2025)
      showed that a model will cite a passage it never used, a behavior they call
      post-rationalization : the answer comes first, and the citation gets attached
      afterward to whatever passage looks like a plausible source. What makes this
      failure slippery is that nothing on the surface goes wrong. The answer is right.
      The citation is present, well formed, and points at a real Question:\\nWho plays
      Joker in Batman: The Dark Knight?\\n\\n[4] 6 Discussion\\nWhat a citation is
      worth to a reader. Our results say that in this setting a citation marks where
      the words of an answer can be found, not where the answer came from. Figure
      1 is the honest version of the problem: the model knew the answer, had the supporting
      passage in front of it, cited it, and then handed the citation to a cartoon
      plot summary after we moved four words. A reader auditing that citation opens
      the passage, finds the claim's wording sitting there, and walks away reassured.
      The audit passes and the provenance is still wrong. That is what makes post-rationalization
      worse than an ordinary error: it defeats exactly the check a careful reader
      would run, at a rate of roughly one cited sentence in seven on Wikipedia-style
      questions, in an openly available 7B model, using a plant so crude that we picked
      it with a character count.\\nWhy RLVR leaves this untouched. The reward is the
      whole story. These agents earn credit when an automatic checker matches their
      final answer against a reference, and R-Search adds credit for steps along its
      search trajectory. Not one term in those objectives inspects the link between
      a sentence and the passage cited beside it. An agent that retrieves well, reasons
      well, and then attaches the wrong marker collects full reward. Optimization
      delivers what you pay for, so citation behavior stays wherever the base model
      left it, which is exactly the pattern in Table 5: two agents indistinguishable
      from their base, one slightly worse, none better.\\nInterpreting the fixed-context
      result. The agents were trained for multi-step search, but our evaluation intentionally
      removes that component to hold evidence constant. Thus, the null result shows
      that RLVR did not produce a detectable attribution effect in this fixed-context
      setting. It does not rule out an effect that emerges through interactive search,
      where retrieval decisions and citation behavior can interact. An allow-retrieval
      evaluation would be needed to test that broader question.\\nFixing it means
      paying for it. If answer-only rewards leave attribution where they found it,
      attribution has to enter the objective. The probe in this paper is a ready-made
      term for that. It is deterministic, needs no judge model, and with the control
      in place it isolates the effect of the plant rather than the noise of editing
      a context, so it can run inside a training loop. Concretely, a PPO or GRPO pipeline
      of the kind Search-R1 and ReSearch already use could add an attribution-consistency
      penalty: sample a rollout, plant a span from the model's own answer into an
      uncited passage, re-score, and penalize the policy when the citation follows
      the plant. The signal is cheap, it is grounded in behavior rather than in a
      learned preference model, and it targets the failure directly instead of hoping
      that better answers drag better citations along behind them. On the evaluation
      side, the same probe yields a number that is comparable across models, which
      is what the field currently lacks for citation faithfulness.\\n\\n[5] Abstract\\nA
      RAG system can hand you the right answer and cite a source it did not actually
      use. Models output these unfaithful citations via postrationalization : they
      write the answer first and then attach a citation to whatever passage looks
      close enough. Search agents are now trained with reinforcement learning from
      verifiable rewards (RLVR), which pays them for getting the answer right. We
      asked whether that training also teaches them to cite honestly.\\nImproving
      an existing methodology with a required control, we compared an instructiontuned
      model against three RLVR agents trained from it, on four question-answering
      datasets, using only free-tier Kaggle GPUs. Postrationalization is everywhere:
      on Wikipediabased questions roughly one citation in seven is unfaithful. RLVR
      does not fix it. The agents post-rationalize at their base model's rate, and
      one lands slightly worse. Rewarding correct answers buys nothing in citation
      faithfulness, so faithfulness has to be trained and measured on its own terms.\\n\\nAnswer:
      The paper on citation laundering (2609.14245v1) illustrates the concept with
      an ASQA example tested under RECOMP at a nominal budget of 0.25. The scenario
      involves the question \\\"How many state parks are there in Virginia?\\\" Asked
      'How many state parks are there in Virginia?', the generator answers 'There
      are 34 state parks in Virginia [1]', while Document [1] states 'Virginia has
      34 state parks and 17 state forests...'. The citation receives full emitted
      precision, but Document [1] is the compressor's summary with no declared source
      link.\\n\\nThe paper also provides a second example: In another example, the
      answer 'The man who killed [them] is not mentioned in the retrieved documents
      [1]' cites a summary containing that same assertion of absence. Together, these
      examples illustrate consistency with intermediate text without a declared path
      to source evidence; neither example alone establishes an independently verified
      hallucination.\\n\\nIt's worth noting that a different paper in this collection
      (2609.23053v1) discusses a related but distinct phenomenon called \\\"post-rationalization,\\\"
      illustrated by a Batman/Joker example, where the baseline model correctly names
      Heath Ledger as the Joker and cites the Heath Ledger article, but after four
      words of the model's own sentence were copied into a plot summary of a Batman
      cartoon, the citation moved to the cartoon passage, which never answers the
      original question, while the Ledger article stayed right there in the context\u2014four
      words were enough to make the model cite a source it did not use during inference.\\n\\nPass
      only if every factual claim in the answer is stated in, or directly follows
      from, the\\nsources. A claim that is plausible but absent from the sources fails.
      An answer that correctly\\nsays the sources don't contain the answer passes.\"}],\"model\":\"claude-opus-5\",\"output_config\":{\"format\":{\"type\":\"json_schema\",\"schema\":{\"type\":\"object\",\"title\":\"Verdict\",\"properties\":{\"reasoning\":{\"type\":\"string\",\"description\":\"One
      or two sentences: what matched or what was wrong.\",\"title\":\"Reasoning\"},\"passed\":{\"type\":\"boolean\",\"description\":\"True
      only if the answer meets the criterion in full.\",\"title\":\"Passed\"}},\"additionalProperties\":false,\"required\":[\"reasoning\",\"passed\"]}}}}"
