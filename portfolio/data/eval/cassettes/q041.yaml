      (after planting):\\nHeath Ledger plays the Joker in Batman The Dark Knight [4].\\nFigure
      1: A real case from our baseline model on NQ. Passage [4] is a plot summary
      of a Batman TV episode; it never mentions Heath Ledger or the film. We appended
