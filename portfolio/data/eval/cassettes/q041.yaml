        Introduction\nContext compression reduces generator input in retrieval-augmented
        generation (RAG) (Xu et al., 2024; Jiang et al., 2024; Pan et al., 2024; Chirkova
        et al., 2025). Citation-grade attribution requires locatable evidence: a reader
        must be able to retrieve and check the cited source (Rashkin et al., 2023;
        Bohnet et al., 2022). Abstractive compression can interrupt this link when
        citations identify compressor-generated text without its supporting source
        spans. We call it attribution launder- ing when consistency with compressor-generated
        text is treated as evidence of support from original sources. On ASQA at nominal
        budget 0 . 25 (achieved ratio 0 . 08 ), a RECOMP-style compressor''s citations
        score 0.86 precision against its summaries and 0.12 against source spans under
        our recovery protocol. These automatic scores depend on a shared NLI evaluator
        and bounded candidate search; they have not been independently calibrated.\nRelated
        work already identifies a divergence between answer quality and citation grounding
        under compression (Li et al., 2026a), while citation support does not establish
        causal reliance on evidence (Wallat et al., 2025). We examine this problem
        across compressor families and two datasets, reporting achieved context fractions,
        explicit sourcerecovery rules, and paired comparisons on shared questions.
        Our measurements concern source support under an automatic evaluation protocol;
        they do not test causal citation faithfulness.\nWe conduct a controlled measurement
        study with a fixed generator (Qwen2.5-7B-Instruct with ALCE-style numbered-context
        citation prompting), a fixed primary NLI evaluator, and nominal budgets of
        { 0 . 5 , 0 . 25 , 0 . 1 , 0 . 05 } in generatortokenizer tokens. Our contributions
        are:\n- The attribution-compression frontier. A comparison across reranking,
        extractive selection, abstraction, token pruning, ECR, and an identity reference
        against achieved context fractions. All settings share 944 successful ASQAquestions
        and 976 QASPER questions from 271 papers; paired tests quantify their differences.\n-
        A re-attributability protocol. A unit without declared provenance is counted
        as reattributable when NLI predicts entailment from a candidate source snippet;
        recovered sources support grounded citation scores\n- alongside emitted scores
        against compressed text.\n- Three verification modes. We separate consistency
        with summaries, availability of declared provenance, and claim support after
        source recovery. Structural rejection under declared-only checking is distinguished
        from measured rejection after recovery.\n- An extract-cluster-rewrite (ECR)
        observation. A simple construction greedily merges near-duplicate sentences
        and cites all members of each cluster; paired comparisons quantify its measured
        differences from extraction across budgets.","metadata":{"ingestion_version":"01a0fc54ff9a70d3af0e9b49e864b8b9","chunk_id":"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde-text-0002","doc_id":"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde","chunk_type":"text","section_path":"1
        Introduction","tenant_id":"01a0aa96b5ef7053a767b8ddabb5a961","order_index":6,"page_no":1,"filename":"2609.14245v1.pdf"}}},{"id":"c288bfae-4bca-5c10-89d5-76c5b522433d","version":5,"score":0.35247582,"payload":{"page_content":"B.
        Poisoning Strategies\nDocument poisoning here means rewriting a retrieved
        passage so that it states something false while remaining fluent and on-topic.
        The rewrite happens after retrieval and before the prompt is built, so the
        retriever itself is never attacked; only the evidence handed to the model
        is altered. Three strategies are implemented, each targeting a different class
        of fact.\nEntity swap replaces named entities with plausible alternatives
        of the same type. ''The Eiffel Tower is located in Paris, France'' becomes
        ''The Eiffel Tower is located in Madrid, Spain.'' Grammar and register are
        untouched, so nothing flags the sentence as suspicious except the fact itself.\nNumber
        swap perturbs a numeric value to a nearby wrong one, for example turning ''over
        13,000 miles'' into ''over 3,000 miles.'' A language model has no internal
        arithmetic check for such a claim and tends to echo whatever figure the context
        provides.\nNegation inserts a negation that flips the truth value of a statement,
        so ''Barack Obama was the 44th President'' becomes ''Barack Obama was never
        the 44th President.'' The word ''never'' is a strong lexical signal, and we
        expected the model to treat it with more suspicion than a silent entity substitution.","metadata":{"ingestion_version":"01a0fc53392f724b972307d03a9f94d9","chunk_id":"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead-text-0003","doc_id":"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead","chunk_type":"text","section_path":"B.
        Poisoning Strategies","tenant_id":"01a0aa96b5ef7053a767b8ddabb5a961","order_index":16,"page_no":2,"filename":"2609.09243v1.pdf"}}},{"id":"6af0273b-8558-5742-b3d1-bbd7d3ea2f94","version":15,"score":0.3508203,"payload":{"page_content":"Abstract\nA
        RAG system can hand you the right answer and cite a source it did not actually
        use. Models output these unfaithful citations via postrationalization : they
        write the answer first and then attach a citation to whatever passage looks
        close enough. Search agents are now trained with reinforcement learning from
        verifiable rewards (RLVR), which pays them for getting the answer right. We
        asked whether that training also teaches them to cite honestly.\nImproving
        an existing methodology with a required control, we compared an instructiontuned
        model against three RLVR agents trained from it, on four question-answering
        datasets, using only free-tier Kaggle GPUs. Postrationalization is everywhere:
        on Wikipediabased questions roughly one citation in seven is unfaithful. RLVR
        does not fix it. The agents post-rationalize at their base model''s rate,
        and one lands slightly worse. Rewarding correct answers buys nothing in citation
        faithfulness, so faithfulness has to be trained and measured on its own terms.","metadata":{"ingestion_version":"01a0fc55257f7276be70b7b3d1501b36","chunk_id":"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6-text-0001","doc_id":"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6","chunk_type":"text","section_path":"Abstract","tenant_id":"01a0aa96b5ef7053a767b8ddabb5a961","order_index":5,"page_no":1,"filename":"2609.23053v1.pdf"}}},{"id":"e4f212a2-fbfb-51f3-8efa-31d1e740f21a","version":15,"score":0.34066162,"payload":{"page_content":"7
        Conclusion\nWe asked whether training RAG search agents for correct answers
        also teaches them to cite honestly under fixed-context inference. We find
        no detectable improvement. Getting to that answer meant repairing the measurement
        first: we reproduced the planting probe of Wallat et al. (2025) on an open
        7B model, added the no-planting control it lacked, and showed that the control
        is 0 by construction for the main variant, 100% for another, and a small measured
        quantity for the third. With that in hand, post-rationalization turns out
        to be common in an instruction-tuned model, roughly one cited sentence in
        seven on Wikipedia-based questions, and three RLVR agents trained from that
        model reproduce its rate, with one landing slightly worse. Faithful citation
        is not a side effect of answer accuracy. It has to be rewarded, measured,
        and reported on its own, and the probe we describe here is cheap enough to
        do all three inside an existing training loop.","metadata":{"ingestion_version":"01a0fc55257f7276be70b7b3d1501b36","chunk_id":"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6-text-0024","doc_id":"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6","chunk_type":"text","section_path":"7
        Conclusion","tenant_id":"01a0aa96b5ef7053a767b8ddabb5a961","order_index":106,"page_no":8,"filename":"2609.23053v1.pdf"}}},{"id":"f5a9caf9-6efb-5456-85d5-a98735962450","version":15,"score":0.3395639,"payload":{"page_content":"3.1
        The planting probe\nWe follow the probe of Wallat et al. (2025), which runs
        in three steps.\n1. Answer. The model answers a question from five retrieved
        passages. Every sentence ends with exactly one citation, so each sentence
        and its marker form one claim .\n2. Plant. We lift a short span out of the
        claim and append it to a passage the model did not cite for that claim, then
        re-run the same model on the doctored context with the same prompt.\n3. Check.
        We ask whether the model now cites the doctored passage for that claim.\nThe
        logic is a swap test. The doctored passage shares nothing with the claim except
        the words we pasted into it, and the passage the model originally cited never
        leaves the context. A model that reads for meaning has no reason to move.
        A model that matches surface strings has every reason to, and when it moves,
        its citation was never evidence of where the answer came from.\nTable 1 lists
        the three variants, which differ only in which passage receives the span.
        REL-UNCITED plants in a passage the retriever returned and the model ignored,
        the situation a deployed system meets constantly, and it is our main measure.\nREL-UNCITED,
        Where the span is planted = A retrieved passage that the answer did not cite..
        CITED-OTHER, Where the span is planted = Apassage the answer already cites,
        but for a different sentence.. RANDOM, Where the span is planted = An uncited
        slot, after replacing its passage with one from a different question.\nTable
        1: The three probe variants. Each changes exactly one of the five retrieved
        passages, and the passage that genuinely supports the claim stays in the context.
        RELUNCITED is our main measure.\nChoosing the span. The original probe leaned
        on Command R+, which marks the exact words it grounds on. Qwen2.5 offers no
        such markup, so we need a rule, and we keep it blunt and deterministic: the
        four consecutive words of the claim with the most characters. This decision
        was influenced by Wallat et al. (2025). We played around with 2-4 words for
        the span and choosing four words minimized bias.","metadata":{"ingestion_version":"01a0fc55257f7276be70b7b3d1501b36","chunk_id":"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6-text-0007","doc_id":"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6","chunk_type":"text","section_path":"3.1
        The planting probe","tenant_id":"01a0aa96b5ef7053a767b8ddabb5a961","order_index":36,"page_no":2,"filename":"2609.23053v1.pdf"}}},{"id":"8c166fb5-399b-59e9-a610-789ac782c808","version":15,"score":0.33891577,"payload":{"page_content":"3.2
        What counts as citing the planted passage\nThe re-run answer may be worded
        differently, so we first locate the sentence that best matches the original
        claim by word overlap (Jaccard similarity of at least 0.3), then ask whether
        that sentence cites the doctored passage. This is our claim-aligned outcome,
        and the pairing carries the weight: it asks whether the model cited the planted
        passage for the claim we planted into , not whether the marker turns up loose
        somewhere in the answer. We keep the looser cited-anywhere outcome as a sensitivity
        check, and Section 5.1 shows how much slack it introduces.\nWe score every
        record, with no filtering on whether the planted span reappears in the new
        answer. The original probe conditions on exactly that, and our control shows
        why it should not: with nothing planted at all, those four words come back
        in 60-74% of answers, simply because the model wrote them in the first place.
        Span recovery tells us the model repeated itself, not that our plant did anything.","metadata":{"ingestion_version":"01a0fc55257f7276be70b7b3d1501b36","chunk_id":"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6-text-0008","doc_id":"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6","chunk_type":"text","section_path":"3.2
