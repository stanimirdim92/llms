      (text, page 8)\",\"citations\":{\"enabled\":true}},{\"type\":\"document\",\"source\":{\"type\":\"text\",\"media_type\":\"text/plain\",\"data\":\"1
      Introduction\\nCitations are the part of a RAG answer that a careful reader
      actually checks. The system retrieves passages, writes an answer, and marks
      each sentence with the passage it came from (Lewis et al., 2020; Gao et al.,
      2023); the marker is a promise about provenance. Follow [1], the promise says,
      and you will find where this sentence came from.\\nModels break that promise
      more often than they look like they do. Wallat et al. (2025) showed that a model
      will cite a passage it never used, a behavior they call post-rationalization
      : the answer comes first, and the citation gets attached afterward to whatever
      passage looks like a plausible source. What makes this failure slippery is that
      nothing on the surface goes wrong. The answer is right. The citation is present,
      well formed, and points at a real Question:\\nWho plays Joker in Batman: The
      Dark Knight?\"},\"title\":\"2609.23053v1.pdf [01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6]
      (text, page 1)\",\"citations\":{\"enabled\":true}},{\"type\":\"document\",\"source\":{\"type\":\"text\",\"media_type\":\"text/plain\",\"data\":\"6
      Discussion\\nWhat a citation is worth to a reader. Our results say that in this
      setting a citation marks where the words of an answer can be found, not where
      the answer came from. Figure 1 is the honest version of the problem: the model
      knew the answer, had the supporting passage in front of it, cited it, and then
      handed the citation to a cartoon plot summary after we moved four words. A reader
      auditing that citation opens the passage, finds the claim's wording sitting
      there, and walks away reassured. The audit passes and the provenance is still
      wrong. That is what makes post-rationalization worse than an ordinary error:
      it defeats exactly the check a careful reader would run, at a rate of roughly
      one cited sentence in seven on Wikipedia-style questions, in an openly available
      7B model, using a plant so crude that we picked it with a character count.\\nWhy
      RLVR leaves this untouched. The reward is the whole story. These agents earn
      credit when an automatic checker matches their final answer against a reference,
      and R-Search adds credit for steps along its search trajectory. Not one term
      in those objectives inspects the link between a sentence and the passage cited
      beside it. An agent that retrieves well, reasons well, and then attaches the
      wrong marker collects full reward. Optimization delivers what you pay for, so
      citation behavior stays wherever the base model left it, which is exactly the
      pattern in Table 5: two agents indistinguishable from their base, one slightly
      worse, none better.\\nInterpreting the fixed-context result. The agents were
      trained for multi-step search, but our evaluation intentionally removes that
      component to hold evidence constant. Thus, the null result shows that RLVR did
      not produce a detectable attribution effect in this fixed-context setting. It
      does not rule out an effect that emerges through interactive search, where retrieval
      decisions and citation behavior can interact. An allow-retrieval evaluation
      would be needed to test that broader question.\\nFixing it means paying for
      it. If answer-only rewards leave attribution where they found it, attribution
      has to enter the objective. The probe in this paper is a ready-made term for
      that. It is deterministic, needs no judge model, and with the control in place
      it isolates the effect of the plant rather than the noise of editing a context,
      so it can run inside a training loop. Concretely, a PPO or GRPO pipeline of
      the kind Search-R1 and ReSearch already use could add an attribution-consistency
      penalty: sample a rollout, plant a span from the model's own answer into an
      uncited passage, re-score, and penalize the policy when the citation follows
      the plant. The signal is cheap, it is grounded in behavior rather than in a
