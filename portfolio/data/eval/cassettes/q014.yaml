- request:
    body: '{"query": "How does the best allocation temperature in AdaMem change as
      compression gets stronger?", "documents": ["This is a line chart comparing two
      methods for setting \"allocation temperature\" (\u03c4) against compression
      rate (x-axis, log scale: 16, 32, 64, 128). The blue solid line labeled \"Empirical
      optimum\" shows \u03c4 decreasing gradually from 1.0 at compression rate 16
      to about 0.5 at rate 128, with match accuracy scores annotated at each point
      (84.00, 84.45, 83.90, 83.15). The orange dashed line labeled \"Theory: \u03c4
      \u221d B(\u03c1) (anchored at 16x)\" declines more steeply, from 1.0 at rate
      16 to about 0.22 at rate 128, with corresponding match scores (84.35, 83.35,
      82.25). A gray dotted horizontal reference line marks \"Fixed \u03c4 = 1\" with
      a match score of 81.30 at compression rate 128, illustrating that both adaptive
      temperature approaches outperform a fixed temperature baseline at high compression
      rates.", "Query-Conditioned Compression and Adaptive Allocation. For each query-passage
      pair, we form\nwhere \u03b3 is the distortion decay rate and \u03c3 the spread
      of the log-utilities (Appendix A).The optimal temperature should therefore decrease
      as the per-passage budget B/K becomes smaller. This trend is reflected in the
      experiments, where the best \u03c4 decreases from 1 . 0 at 16 \u00d7 to 0 .
      5 at 64 \u00d7 compression (Figure 6).\n", "Experiments and Results\nTable 3:
      Effect of the three-stage training procedure at 16 \u00d7 compression with k
      = 25 .\n\nw/o Stage 1, TriviaQA = 71.30. w/o Stage 1, NQ = 44.45. w/o Stage
      1, HotpotQA = 29.35. w/o Stage 2, TriviaQA = 81.35. w/o Stage 2, NQ = 61.65.
      w/o Stage 2, HotpotQA = 43.10. w/o Stage 3, TriviaQA = 81.05. w/o Stage 3, NQ
      = 59.30. w/o Stage 3, HotpotQA = 42.70. Full three-stage training, TriviaQA
      = 82.80. Full three-stage training, NQ = 63.30. Full three-stage training, HotpotQA
      = 44.50\nOverall, the results show that each stage addresses a distinct requirement:
      learning general-purpose soft memories, adapting them to query-dependent evidence,
      and aligning relevance-aware allocation with the target retrieval setting.\nEffect
      of Allocation Temperature. The temperature \u03c4 controls allocation sharpness:
      larger values approach uniform allocation, while smaller values concentrate
      memory on the most relevant passages. Our allocation view predicts that \u03c4
      should decrease as compression becomes stronger, since a smaller memory budget
      must be focused on fewer high-utility passages.\nFigure 6 confirms this prediction
      on TriviaQA. The optimal temperature decreases from \u03c4 \u2217 = 1 . 0 at
      16 \u00d7 compression to 0 . 7 at 32 \u00d7 and 0 . 5 at 64 \u00d7 and 128 \u00d7
      . Moreover, a theoretically predicted schedule, \u03c4 \u221d B ( \u03c1 ) anchored
      at 16 \u00d7 , consistently outperforms a fixed \u03c4 = 1 and closely tracks
      the empirical optimum, despite a small gap at higher compression.\nThis effect
      contributes to the robustness in Figure 1, which uses the theoretical temperature
      schedule without any empirical tuning.", "Conclusion\nWe introduced AdaMem,
      a relevance-aware allocation framework for soft-compressed RAG. Instead of uniformly
      representing retained passages, AdaMem converts querydependent relevance scores
      into a non-uniform allocation of a fixed global memory budget, concentrating
      capacity on answer-bearing evidence while retaining limited capacity for complementary
      passages. The resulting allocation is the exact optimum of a proportional-fair
      objective under an assumed logarithmic utility model, and is a first-order approximation
      to the reverse-water-filling optimum of classical exponential-distortion bit
      allocation.\nFigure 6: Optimal allocation temperature on TriviaQA across compression
      rates. The analytically predicted schedule ( \u03c4 \u221d B ( \u03c1 ) , anchored
      at 16 \u00d7 ) follows the empirical optimum and consistently outperforms a
      fixed \u03c4 = 1 .\nAdaMem establishes a new state of the art among softcompression
      methods across six evaluated QA benchmarks. At 16 \u00d7 compression, it improves
      over baselines, the strongest prior soft-compression method, by an average of
      3 . 4% in relative terms. The advantage becomes substantially larger as the
      memory budget decreases. At 64 \u00d7 compression, the average relative improvement
      reaches 14 . 6% , with gains of up to 21 . 8% on HotpotQA. At 32 \u00d7 , AdaMem
      exceeds OSCAR at 16 \u00d7 on every benchmark, achieving an average relative
      improvement of 2 . 9% . These results show that adaptive allocation is particularly
      effective under aggressive compression, where large retrieval pools must be
      represented within strict memory constraints.\nFinally, we introduce KILT-SCR,
      a training and evaluation resource for the joint study of reranking and compression.
      Constructed to retain answer-bearing retrieved evidence and answer-consistent
      teacher targets, it enables controlled comparison of reranking and memory-allocation
      strategies over large candidate pools with heterogeneous passage utility.\nSeveral
      future research directions remain open. The temperature could be learned or
      predicted per query rather than set per compression rate, allowing allocation
      sharpness to adapt to the confidence of the relevance estimates. The budget-allocation
      view itself is not specific to QA or memory embeddings and extends naturally
      to other bounded representations, such as KV-cache compression and long-context
      summarization.\nAllal, L. B.; Lozhkov, A.; Bakouch, E.; Bl\u00e1zquez, G. M.;
      Penedo, G.; Tunstall, L.; Marafioti, A.; Kydl\u00ed\u010dek, H.; Lajar\u00edn,
      A. P.; Srivastav, V.; Lochner, J.; Fahlgren, C.; Nguyen, X.-S.; Fourrier, C.;
      Burtenshaw, B.; Larcher, H.; Zhao, H.; Zakka, C.; Morlon, M.; Raffel, C.; von
      Werra, L.; and Wolf, T. 2025. SmolLM2: When Smol Goes Big - Data-Centric Training
      of a Small Language Model. arXiv:2502.02737.", "This is a line chart comparing
      TriviaQA match performance against compression rate (16x, 32x, 64x, 128x on
      x-axis) for three memory allocation methods. The \"AdaMem (ours)\" method (blue
      line) maintains the highest accuracy across all compression rates, starting
      near 84 and ending around 82 (only -2.08% drop from full context), outperforming
      \"Uniform(Oscar)\" (orange line, dropping to -7.34%) and \"Uniform(Pisco)\"
      (purple line, dropping to -7.52%). A dashed green line at the top indicates
      \"Full Context\" performance (~84.5) as the reference baseline, and a schematic
      above the chart illustrates how AdaMem allocates variable-length document representations
      (d1-d4) compared to Uniform''s equal-length allocation.", "Top-25 QA robustness
      under stronger compression\nFigure 7: LLM-as-a-judge accuracy under increasingly
      strong inference-time compression. AdaMem consistently retains higher answer
      quality than OSCAR as the memory budget decreases.", "A Optimality of the Memory
      Allocation Rule\nThree remarks follow. First, by the Gibbs variational principle,
      p = softmax( \u0302 s/\u03c4 ) is also the unique maximizer of \u2211 i p i
      \u0302 s i + \u03c4H ( p ) over the probability simplex, where H denotes the
      Shannon entropy: the allocation maximizes the total relevance of the allocated
      tokens under an entropy penalty on over-concentration, and \u03c4 prices that
      penalty. Second, the temperature limits recover the two prevailing strategies,
      uniform soft compression as \u03c4 \u2192\u221e and hard selection of the top-scoring
      passages as \u03c4 \u2192 0 , so both sit at the degenerate ends of the same
      family. Third, the exact optimum of (7) assigns every passage a strictly positive
      share, matching the full support of the softmax; exact zeros arise only from
      the integer constraint treated below. Within-pool standardization together with
      \u03c4 fi xes the utility parametrization w i = e \u0302 s i /\u03c4 ; since
      the relevance head is distilled to standardized cross-encoder scores, the temperature
      selects how sharply the teacher''s relevance scale is converted into an allocation.\nExponential-distortion
      bit allocation. Classical bit allocation instead minimizes a weighted distortion
      \u2211 i w i D ( m i ) under the same budget, with the high-resolution exponential
      model D ( m ) = c e -\u03b3m , \u03b3 > 0 (Huang and Schultheiss 1963; Shoham
      and Gersho 1988). Ignoring nonnegativity, the equal marginal return condition
      \u03b3w i c e -\u03b3m i = \u03bb gives\n<!-- formula-not-decoded -->\nwhich
      becomes a clipped affine function of centered logutility once m i \u2265 0 is
      restored: shares that would be negative are set to zero and the released budget
      is redistributed among the rest ( reverse water-filling ). Under this model
      the softmax rule is exact only to first order: expanding e \u0302 s i /\u03c4
      = 1 + \u0302 s i /\u03c4 + O ( \u03c4 -2 ) and using \u2211 j \u0302 s j = 0
      gives B softmax( \u0302 s i /\u03c4 ) = B/K + ( B/K\u03c4 ) \u0302 s i + O (
      \u03c4 -2 ) , which agrees with m \u22c6 i when \u0302 s i = (ln w i -ln w )
      /\u03c3 and \u03c4 = \u03b3B/ ( K\u03c3 ) , with \u03c3 the spread of the log-utilities.
      The two models thus assign the softmax rule different statuses: exact optimizer
      under logarithmic utility, first-order approximation of reverse water-filling
      under exponential distortion.\nInteger rounding. The softmax yields fractional
      a i summing to B , whereas tokens are integers. The natural discretization is
      the nearest budget-preserving integer vector,\n<!-- formula-not-decoded -->\nProposition
      2 (Largest-remainder is nearest rounding) . Largest-remainder rounding (floor
      every a i , then hand the R = B -\u2211 i \u230a a i \u230b leftover tokens
      to the passages with the largest fractional parts r i = a i - \u230a a i \u230b
      ) returns an exact minimizer of (8) .", "Experiments and Results\nFinally, at
      16 \u00d7 , AdaMem closely approaches Full Context performance despite replacing
      the retrieved text with a substantially shorter continuous representation. On
      TriviaQA, it is within 0.4 points of Full Context, while on PopQA it exceeds
      Full Context by 1.4 points. Hence, selective memory allocation can both reduce
      computational cost and mitigate interference from irrelevant retrieved passages.\nFigure
      4: Memory-token allocation by document relevance rank at 64 \u00d7 compression.
      The dashed line denotes OSCAR''s fixed 16 \u00d7 allocation.\nMemory Allocation
      Behavior. Figure 4 illustrates the allocation mechanism under this highly constrained
      64 \u00d7 setting. For the most relevant documents, AdaMem allocates a median
      of roughly 10 memory tokens, already exceeding OSCAR''s fixed budget of 9 tokens
      per document at 16 \u00d7 . The 90th percentile is substantially higher, indicating
      that for some queries, AdaMem assigns considerably more capacity to the most
      relevant document. In contrast, the allocation decreases sharply with relevance
      rank and approaches zero for lower-ranked documents. Thus, AdaMem concentrates
      capacity on query-relevant evidence while assigning minimal capacity to noisy
      passages, reducing their potential interference in the compressed context.\nRobustness
      to Retrieval Depth and Compression. Figure 3 compares AdaMem and OSCAR across
      retrieval depths k \u2208 { 5 , 10 , 15 , 20 , 25 } and compression ratios of
      16 \u00d7 , 32 \u00d7 , and 64 \u00d7 at \u03c4 =1. AdaMem benefits more consistently
      from deeper retrieval, whereas OSCAR remains nearly constant as additional lower-ranked
      documents are introduced.\nThis difference is most pronounced under aggressive
      compression. At 64 \u00d7 , increasing k from 5 to 25 improves AdaMem by 3.5
      points on TriviaQA, 5.4 on Natural Questions, and 4.2 on HotpotQA, while OSCAR
      changes only marginally over the same range. A similar pattern holds at 32 \u00d7
      , particularly on Natural Questions and HotpotQA.\nThese results suggest that
      AdaMem can extract useful evidence from less-relevant documents without allocating
      them the same budget as highly relevant ones. In contrast, OSCAR''s fixed per-document
      allocation provides limited benefit from deeper retrieval, as its representation
      capacity is uniformly spread over an increasingly noisy document set. The effect
      is weaker at 16 \u00d7 , where both methods have sufficient capacity for shallow
      retrieval pools, but becomes increasingly clear as the memory budget is reduced.\nFigure
