      rate increases (e.g., in HotpotQA, AdaMem scores 62.4% vs OSCAR''s 55.3% at
      64\u00d7 compression), indicating AdaMem maintains accuracy better under higher
      compression.", "This is a schematic diagram illustrating the \"AdaMem\" adaptive
      memory compression method for retrieval-augmented language models, shown in
      three panels. Panel (a) depicts a shared compressor network that takes query-document
      pairs (d1\u2013d4) and outputs relevance scores (ranging from 2.1 to -1.9).
      Panel (b) shows the adaptive budget allocation formula (using softmax over relevance
