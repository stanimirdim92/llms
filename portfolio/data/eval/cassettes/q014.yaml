      HotpotQA = 42.6. Filtered, TriviaQA = 82.8. Filtered, NQ = 63.3. Filtered, HotpotQA
      = 44.5. Difference, TriviaQA = +2.5. Difference, NQ = +0.6. Difference, HotpotQA
      = +2.0", "AdaMem: Adaptive Memory Token Allocation for Soft Compression in Retrieval-Augmented
      Generation\nArtem Sakhno, Grigorii Davydenko, Omar Zoloev, Julia Belikova, Andrey
      Savchenko, Maksim Makarenko \u2217", "Abstract\nRetrieval-augmented generation
      (RAG) improves language modelswithretrieved evidence, but processing many long
      passages is costly and can introduce distracting information. Soft compression
      addresses this challenge by encoding passages as compact sequences of continuous
      memory embeddings before generation. However, existing methods typically assign
      each retained passage an identical number of memory embeddings, irrespective
      of its query-specific relevance. To address this, we propose AdaMem, a relevance-guided
      soft-compression framework that maps learned passage-relevance estimates to
      a query-dependent allocation of a fixed memory-token budget. A shared query-conditioned
      compressor produces both continuous passage memories and relevance scores in
      a single pass; a deterministic allocation rule assigns more memory tokens to
      higher-scoring passages and can omit low-scoring ones. Across six open-domain
      QA benchmarks, AdaMem consistently outperforms OSCAR (the closely matched softcompression
      baseline that uses uniform allocation) as well as other soft-compression methods
      at matched memory budgets. Under standard 16 \u00d7 compression, AdaMem improves
      sub-string match by up to 3.2 points (5.5%) over uniform allocation baseline,
      with an average relative gain of 3.4%; under aggressive 64 \u00d7 compression
      the average relative gain grows to 14.6%, with a maximum of 9.8 points (19.7%)
      on PopQA. AdaMem matches the answer quality of the uncompressed at up to 4 \u00d7
      lower inference latency than full context baseline. AdaMem retains an efficiency
      profile comparable to the uniform-compression baseline, while achieving up to
      4 \u00d7 lower inference latency than full-context inference. Thus, relevance-guided
      memory allocation is particularly effective when retrieval pools are large and
      the available memory budget is tight.", "D Judge Metrics\nWe use Substring Match
      as the primary metric because it is deterministic and consistent with standard
      open-domain QA evaluation. However, it can overestimate answer quality when
      a model lists multiple candidate answers: the prediction receives full credit
      whenever it contains a gold-answer alias as a substring, even if the response
      is ambiguous, unsupported, or includes incorrect alternatives. We therefore
      additionally report LLM-as-a-judge scores, which evaluate the correctness of
      the generated answer in the context of the question and reference answer. The
      judge assigns a score of 1 for a correct answer, 0.5 for a partially correct
      answer, and 0 for a wrong answer; we report the mean score as a percentage.
      This complementary evaluation penalizes answer enumeration and verifies that
      improvements in Match correspond to genuinely correct answers rather than increased
      lexical overlap with the reference.\nTable 5: Training schedule for the three-stage
      procedure.\n\nStage 1, Examples = 2,000,000. Stage 1, Epochs = 1. Stage 2, Examples
      = 500,000. Stage 2, Epochs = 1. Stage 3 (KILT-SCR), Examples = 196,916. Stage
      3 (KILT-SCR), Epochs = 3\nFor each example, we provide the judge with the question,
      the reference answer, and the model prediction. We use the following prompt:\nSystem
      prompt: You are an evaluation tool. Answer with one of: 1: Correct, 0.5: Partially
      correct, 0: Wrong.\nUser prompt: Here is a question, a golden answer, and an
      AI-generated answer. Can you judge whether the AIgenerated answer is correct
      according to the question and golden answer? Simply answer with one of: 1: Correct,
      0.5: Partially correct, 0: Wrong.\nQuestion:\n{question}\nGolden answer:\n{answer}\nGenerated
      answer: {prediction}\nFigure 7 corroborates the Match-based robustness trends.
      At the training-time compression rate of 16 \u00d7 , AdaMem matches or exceeds
      OSCAR across all three benchmarks, improving by 1.8 points on TriviaQA and 2.4
      points on NQ, while the methods are effectively tied on HotpotQA. The advantage
