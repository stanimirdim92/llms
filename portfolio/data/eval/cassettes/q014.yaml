      retains up to 99% of full-context quality at 4 \u00d7 lower latency.\n- We release
      KILT-SCR (Soft Compression and Reranking), a large-candidate-pool resource for
      reranking and context compression, with 25 passages per query, 196,916\ntraining
      instances, and evaluation data from six QA benchmarks. The training split use
      answer-grounded filtration to ensure supporting retrieved evidence and goldconsistent
      generated targets.", "A Optimality of the Memory Allocation Rule\nThis appendix
      states in what sense the allocation rule is optimal. The softmax allocation
