      becomes smaller.\\n\\nEmpirically, this prediction is confirmed on TriviaQA:
      Figure 6 confirms this prediction on TriviaQA. The optimal temperature decreases
      from \u03C4\u2217 = 1.0 at 16\xD7 compression to 0.7 at 32\xD7 and 0.5 at 64\xD7
      and 128\xD7.\\n\\nPer the figure (Figure 6), this empirical trend is shown explicitly:
