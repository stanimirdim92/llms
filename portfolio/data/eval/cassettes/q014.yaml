      page 7)\",\"citations\":{\"enabled\":true}},{\"type\":\"document\",\"source\":{\"type\":\"text\",\"media_type\":\"text/plain\",\"data\":\"Conclusion\\nWe
      introduced AdaMem, a relevance-aware allocation framework for soft-compressed
