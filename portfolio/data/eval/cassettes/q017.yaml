- request:
    body: '{"query": "What resource do the AdaMem authors release, and what does it
      contain?", "documents": ["AdaMem: Adaptive Memory Token Allocation for Soft
      Compression in Retrieval-Augmented Generation\nArtem Sakhno, Grigorii Davydenko,
      Omar Zoloev, Julia Belikova, Andrey Savchenko, Maksim Makarenko \u2217", "This
      is a schematic diagram illustrating the \"AdaMem\" adaptive memory compression
      method for retrieval-augmented language models, shown in three panels. Panel
      (a) depicts a shared compressor network that takes query-document pairs (d1\u2013d4)
      and outputs relevance scores (ranging from 2.1 to -1.9). Panel (b) shows the
      adaptive budget allocation formula (using softmax over relevance scores divided
      by temperature \u03c4) that distributes a fixed total memory budget (B=32 tokens)
      unevenly across documents based on relevance (m1=17, m2=9, m3=6, m4=0), contrasted
      with a uniform allocation baseline (8 tokens each). Panel (c) illustrates the
      decoder stage, where allocated memory tokens are fed into a LoRA-adapted Mistral-7B
      model to generate an answer, demonstrating that AdaMem''s adaptive allocation
      produces the correct answer (\"Kazuo Ishiguro\") while uniform budget allocation
      yields an incorrect answer (\"Frederick Forsyth\").", "Top-25 QA robustness
      under stronger compression\nFigure 7: LLM-as-a-judge accuracy under increasingly
      strong inference-time compression. AdaMem consistently retains higher answer
      quality than OSCAR as the memory budget decreases.", "This is a line chart comparing
      TriviaQA match performance against compression rate (16x, 32x, 64x, 128x on
      x-axis) for three memory allocation methods. The \"AdaMem (ours)\" method (blue
      line) maintains the highest accuracy across all compression rates, starting
      near 84 and ending around 82 (only -2.08% drop from full context), outperforming
      \"Uniform(Oscar)\" (orange line, dropping to -7.34%) and \"Uniform(Pisco)\"
      (purple line, dropping to -7.52%). A dashed green line at the top indicates
      \"Full Context\" performance (~84.5) as the reference baseline, and a schematic
      above the chart illustrates how AdaMem allocates variable-length document representations
      (d1-d4) compared to Uniform''s equal-length allocation.", "Introduction\nMotivated
      by these limitations, we propose AdaMem , a framework that transforms reranking
      from binary selection into relevance-aware memory allocation. A shared compressor
      produces query-conditioned memories and scores; a principled softmax allocation,
      grounded in logarithmic utility theory, distributes a fixed total memory budget
      across passages according to their estimated utility. The temperature interpolates
      between uniform allocation and hard topk selection. Here are our main contributions:\n-
      We introduce relevance-aware memory allocation for soft-compressed RAG: each
      document receives an adaptive memory budget determined by its estimated relevance
      (Figure 1), concentrating capacity on answer-bearing evidence while preserving
      compact representations for complementary context. This adaptivity makes AdaMem
      substantially more robust to extreme compression: between 16 \u00d7 and 128
      \u00d7 its quality degrades by only about 2%, compared with over 7% for uniform-allocation
      baselines such as OSCAR.\n- Across six open-domain QA benchmarks, AdaMem outperforms
      every evaluated compression baseline at matched budgets: at 16 \u00d7 it improves
      over uniform allocation by 3 . 4% on average (up to 5 . 5% ) and over the strongest
      hard-compression baseline by 9 . 7% despite an 8 \u00d7 smaller context. Quality
      is also more stable under inference-time compression: moving from 16 \u00d7
      to 64 \u00d7 costs AdaMem 2 . 8% on average, against 12 . 2% for uniform allocation.
      At different compression rates, AdaMem retains up to 99% of full-context quality
      at 4 \u00d7 lower latency.\n- We release KILT-SCR (Soft Compression and Reranking),
      a large-candidate-pool resource for reranking and context compression, with
      25 passages per query, 196,916\ntraining instances, and evaluation data from
      six QA benchmarks. The training split use answer-grounded filtration to ensure
      supporting retrieved evidence and goldconsistent generated targets.", "Conclusion\nWe
      introduced AdaMem, a relevance-aware allocation framework for soft-compressed
      RAG. Instead of uniformly representing retained passages, AdaMem converts querydependent
      relevance scores into a non-uniform allocation of a fixed global memory budget,
      concentrating capacity on answer-bearing evidence while retaining limited capacity
      for complementary passages. The resulting allocation is the exact optimum of
      a proportional-fair objective under an assumed logarithmic utility model, and
      is a first-order approximation to the reverse-water-filling optimum of classical
      exponential-distortion bit allocation.\nFigure 6: Optimal allocation temperature
      on TriviaQA across compression rates. The analytically predicted schedule (
      \u03c4 \u221d B ( \u03c1 ) , anchored at 16 \u00d7 ) follows the empirical optimum
      and consistently outperforms a fixed \u03c4 = 1 .\nAdaMem establishes a new
      state of the art among softcompression methods across six evaluated QA benchmarks.
      At 16 \u00d7 compression, it improves over baselines, the strongest prior soft-compression
      method, by an average of 3 . 4% in relative terms. The advantage becomes substantially
      larger as the memory budget decreases. At 64 \u00d7 compression, the average
      relative improvement reaches 14 . 6% , with gains of up to 21 . 8% on HotpotQA.
      At 32 \u00d7 , AdaMem exceeds OSCAR at 16 \u00d7 on every benchmark, achieving
      an average relative improvement of 2 . 9% . These results show that adaptive
      allocation is particularly effective under aggressive compression, where large
      retrieval pools must be represented within strict memory constraints.\nFinally,
      we introduce KILT-SCR, a training and evaluation resource for the joint study
      of reranking and compression. Constructed to retain answer-bearing retrieved
      evidence and answer-consistent teacher targets, it enables controlled comparison
      of reranking and memory-allocation strategies over large candidate pools with
      heterogeneous passage utility.\nSeveral future research directions remain open.
      The temperature could be learned or predicted per query rather than set per
      compression rate, allowing allocation sharpness to adapt to the confidence of
      the relevance estimates. The budget-allocation view itself is not specific to
      QA or memory embeddings and extends naturally to other bounded representations,
      such as KV-cache compression and long-context summarization.\nAllal, L. B.;
      Lozhkov, A.; Bakouch, E.; Bl\u00e1zquez, G. M.; Penedo, G.; Tunstall, L.; Marafioti,
      A.; Kydl\u00ed\u010dek, H.; Lajar\u00edn, A. P.; Srivastav, V.; Lochner, J.;
      Fahlgren, C.; Nguyen, X.-S.; Fourrier, C.; Burtenshaw, B.; Larcher, H.; Zhao,
      H.; Zakka, C.; Morlon, M.; Raffel, C.; von Werra, L.; and Wolf, T. 2025. SmolLM2:
      When Smol Goes Big - Data-Centric Training of a Small Language Model. arXiv:2502.02737.",
      "Experiments and Results\nFinally, at 16 \u00d7 , AdaMem closely approaches
      Full Context performance despite replacing the retrieved text with a substantially
      shorter continuous representation. On TriviaQA, it is within 0.4 points of Full
      Context, while on PopQA it exceeds Full Context by 1.4 points. Hence, selective
      memory allocation can both reduce computational cost and mitigate interference
      from irrelevant retrieved passages.\nFigure 4: Memory-token allocation by document
      relevance rank at 64 \u00d7 compression. The dashed line denotes OSCAR''s fixed
      16 \u00d7 allocation.\nMemory Allocation Behavior. Figure 4 illustrates the
      allocation mechanism under this highly constrained 64 \u00d7 setting. For the
      most relevant documents, AdaMem allocates a median of roughly 10 memory tokens,
      already exceeding OSCAR''s fixed budget of 9 tokens per document at 16 \u00d7
      . The 90th percentile is substantially higher, indicating that for some queries,
      AdaMem assigns considerably more capacity to the most relevant document. In
      contrast, the allocation decreases sharply with relevance rank and approaches
      zero for lower-ranked documents. Thus, AdaMem concentrates capacity on query-relevant
      evidence while assigning minimal capacity to noisy passages, reducing their
      potential interference in the compressed context.\nRobustness to Retrieval Depth
      and Compression. Figure 3 compares AdaMem and OSCAR across retrieval depths
      k \u2208 { 5 , 10 , 15 , 20 , 25 } and compression ratios of 16 \u00d7 , 32
      \u00d7 , and 64 \u00d7 at \u03c4 =1. AdaMem benefits more consistently from
      deeper retrieval, whereas OSCAR remains nearly constant as additional lower-ranked
      documents are introduced.\nThis difference is most pronounced under aggressive
      compression. At 64 \u00d7 , increasing k from 5 to 25 improves AdaMem by 3.5
      points on TriviaQA, 5.4 on Natural Questions, and 4.2 on HotpotQA, while OSCAR
      changes only marginally over the same range. A similar pattern holds at 32 \u00d7
      , particularly on Natural Questions and HotpotQA.\nThese results suggest that
      AdaMem can extract useful evidence from less-relevant documents without allocating
      them the same budget as highly relevant ones. In contrast, OSCAR''s fixed per-document
      allocation provides limited benefit from deeper retrieval, as its representation
      capacity is uniformly spread over an increasingly noisy document set. The effect
      is weaker at 16 \u00d7 , where both methods have sufficient capacity for shallow
      retrieval pools, but becomes increasingly clear as the memory budget is reduced.\nFigure
      5: Quality-latency tradeoff on TriviaQA. AdaMem shows similar latency as OSCAR
      and matches Full Context quality at 4 . 0 \u00d7 lower latency.", "This is a
      grouped bar chart comparing the performance of two methods, AdaMem (blue) and
      OSCAR (yellow hatched), across three question-answering datasets: TriviaQA,
      NQ, and HotpotQA. The y-axis shows \"Llama-3 judge (%)\" scores ranging from
      0 to about 90, while the x-axis shows compression rates of 16\u00d7, 32\u00d7,
      and 64\u00d7 for each dataset. Across all datasets and compression rates, AdaMem
      consistently outperforms OSCAR, with the performance gap widening as compression
      rate increases (e.g., in HotpotQA, AdaMem scores 62.4% vs OSCAR''s 55.3% at
      64\u00d7 compression), indicating AdaMem maintains accuracy better under higher
      compression.", "Experiments and Results\nBaselines. We compare AdaMem against
      hardcompression methods (RECOMP, LLMLingua, and LLMLingua-2), and soft-compression
      methods (xRAG, PISCO, and OSCAR). No Context answers without retrieved evidence,
      while Full Context provides all retrieved passages without compression. PISCO
      and OSCAR are the closest soft-compression baselines because they support large
      retrieved candidate pools and integrate compression with the retrieval pipeline.
      PISCO uses query-independent passage compression, whereas OSCAR, like AdaMem,
      performs query-conditioned compression and relevance scoring. Both assign memory
      uniformly across retained passages, while AdaMem allocates a fixed global budget
      according to passage relevance. To isolate this difference, we train PISCO,
      OSCAR, and AdaMem using identical data splits, hyperparameters, and training
      stages. Consequently, the comparison with OSCAR directly measures the effect
      of relevance-aware memory allocation under a matched setup.\nMain Results. Table
      1 reports results with 25 retrieved documents. At the reference compression
      rate of 16 \u00d7 , AdaMem achieves the best performance among compressed methods
      on five of six benchmarks. The only exception is BioASQ, where LLMLingua-2 achieves
      the strongest compressed result. Nevertheless, AdaMem outperforms all evaluated
      soft-compression baselines.\nHard-compression methods exhibit a clear trade-off
      between compression and answer quality. RECOMP achieves the highest compression
      rate (200 \u00d7 ), but its performance remains only moderately above the No
      Context baseline; for example, it improves HotpotQA from 32.3 to 37.0. Conversely,
      LLMLingua and LLMLingua-2 operate at only 2 \u00d7 compression, retaining a
      substantially larger text budget, yet generally remain below AdaMem. For instance,
      at 16 \u00d7 , AdaMem improves over LLMLingua-2 by 3.3 points on TriviaQA, 3.0
      points on HotpotQA, and 17.3 points on PopQA. Thus, hard compression either
      requires aggressive token removal, which leaves limited useful evidence, or
      preserves much larger context without reaching the effectiveness of soft compression.\nAmong
      soft-compression methods, AdaMem consistently outperforms OSCAR under the same
      16 \u00d7 memory budget and yields substantial gains over PISCO. xRAG performs
      poorly in this setting because it is designed to compress a single document.
      When applied to long multi-document contexts, its compressed tokens become less
      informative and fail to preserve passage-specific, query-relevant evidence.\nBoth
      AdaMem and OSCAR are trained at 16 \u00d7 compression. We evaluate higher compression
      ratios exclusively at inference time, without additional training or fine-tuning.
      At 32 \u00d7 , AdaMem outperforms OSCAR at its training-time compression ratio
      of 16 \u00d7 across all benchmarks, indicating that it can use approximately
      half as many memory embeddings while maintaining answer quality. Even at 64
      \u00d7 , AdaMemsurpasses OSCAR at 16 \u00d7 on five of six benchmarks. Moreover,
      AdaMem retains a clear advantage over OSCAR at the same\n64 \u00d7 compression
      rate. For example, on TriviaQA, increasing compression from 16 \u00d7 to 64
      \u00d7 reduces performance by only 0.7 points for AdaMem, compared with 5.3
      points for OSCAR. This robustness suggests that relevance-aware allocation preserves
      salient evidence when the memory budget is severely constrained.", "B Inference
      Efficiency\nTable 4 reports per-query latency, throughput, total compute, and
      peak GPU memory on TriviaQA with k = 25 retrieved passages, for all inference-time
      compression rates used in the main text.\nAll compressed configurations are
      substantially cheaper than Full Context: latency drops by 3 . 5 \u00d7 to 4
      . 9 \u00d7 and compute by 2 . 9 \u00d7 to 5 . 0 \u00d7 , confirming that soft
      compression removes the dominant cost of processing large retrieval pools. Relative
      to OSCAR at the same compression rate, AdaMem adds the cost of relevance scoring
      and of encoding the fixed candidate memory bank before selection. This overhead
      is confined to the compressor and does not grow with the decoder context, so
      its share shrinks as compression increases: from 36.3 ms (23%) at 16 \u00d7
      to 10.0 ms (7%) at 64 \u00d7 and 7.6 ms (6%) at 128 \u00d7 . Because the quality
      of AdaMem is nearly flat in the compression rate, it can be operated at aggressive
      compression where this overhead is smallest: at 64 \u00d7 and 128 \u00d7 , AdaMem
      matches or improves on OSCAR at 16 \u00d7 in latency, throughput, and compute
      while providing higher answer quality. Peak memory remains moderately higher
      than OSCAR because the candidate bank for the full pool is encoded before allocation,
      yet at 64 \u00d7 it is already below the Full Context footprint (44.4 versus
      53.5 GB), and the gap narrows further with compression.", "This is a line/scatter
      plot comparing retrieval or memory methods on a latency-accuracy tradeoff. The
      x-axis shows \"Latency per query (ms, log scale)\" ranging from about 140 to
      670+, and the y-axis shows \"Match (%)\" ranging from roughly 76 to 84. Three
      methods are plotted: AdaMem (green circles) and OSCAR (orange squares), each
      annotated with compression/sampling factors (128\u00d7, 64\u00d7, 32\u00d7,
      16\u00d7), showing that AdaMem achieves higher match scores at lower latencies
      than OSCAR; a \"Full Context\" baseline (purple star) achieves the highest match
      (~84%) but at much greater latency (~670 ms), labeled as \"4\u00d7 lower latency\"
      compared to the other methods, indicating AdaMem approaches Full Context accuracy
      while being significantly faster.", "This is a line chart grid comparing two
      retrieval-augmented QA methods, OSCAR (red) and AdaMem (green), across three
      datasets (TriviaQA, NQ, HotpotQA) and three compression ratios (16x, 32x, 64x),
      forming a 3x3 panel layout. The x-axis in each subplot represents the number
      of retrieved documents (k = 5, 10, 15, 20, 25), while the y-axis shows task
      performance scores (ranging roughly from 36 to 84 depending on the dataset/compression
      level). Across nearly all panels, AdaMem consistently outperforms OSCAR, with
      the performance gap generally widening as compression increases (64x) and as
      more documents are retrieved, demonstrating AdaMem''s superior robustness under
      higher compression and larger retrieval sets.", "Abstract\nRetrieval-augmented
      generation (RAG) improves language modelswithretrieved evidence, but processing
      many long passages is costly and can introduce distracting information. Soft
      compression addresses this challenge by encoding passages as compact sequences
      of continuous memory embeddings before generation. However, existing methods
      typically assign each retained passage an identical number of memory embeddings,
      irrespective of its query-specific relevance. To address this, we propose AdaMem,
      a relevance-guided soft-compression framework that maps learned passage-relevance
      estimates to a query-dependent allocation of a fixed memory-token budget. A
      shared query-conditioned compressor produces both continuous passage memories
      and relevance scores in a single pass; a deterministic allocation rule assigns
      more memory tokens to higher-scoring passages and can omit low-scoring ones.
      Across six open-domain QA benchmarks, AdaMem consistently outperforms OSCAR
      (the closely matched softcompression baseline that uses uniform allocation)
      as well as other soft-compression methods at matched memory budgets. Under standard
      16 \u00d7 compression, AdaMem improves sub-string match by up to 3.2 points
      (5.5%) over uniform allocation baseline, with an average relative gain of 3.4%;
      under aggressive 64 \u00d7 compression the average relative gain grows to 14.6%,
      with a maximum of 9.8 points (19.7%) on PopQA. AdaMem matches the answer quality
      of the uncompressed at up to 4 \u00d7 lower inference latency than full context
      baseline. AdaMem retains an efficiency profile comparable to the uniform-compression
      baseline, while achieving up to 4 \u00d7 lower inference latency than full-context
      inference. Thus, relevance-guided memory allocation is particularly effective
      when retrieval pools are large and the available memory budget is tight.", "Method\nProblem
      Setup. We consider RAG in which a query q is answered from a pool of K retrieved
      passages D = { d i } K i =1 (Figure 2a). Soft compression represents each passage
      d i by a short sequence of continuous memory embeddings that condition the decoder
      in its place. Writing m i for the number of memory embeddings assigned to passage
      i , the total B = \u2211 K i =1 m i is the memory budget that governs the decoder''s
      context length, and hence the cost of generation. Existing soft-compression
      methods assign every retained passage the same m i , or set it by a length-based
      rule, spreading the budget without regard to how useful each passage is for
      the query. We instead aim to distribute a fixed budget B according to query-specific
      utility, giving more memory embeddings to answer-bearing passages, fewer to
      marginal ones, and none to irrelevant ones, while keeping the total \u2211 i
      m i = B unchanged. This poses two coupled subproblems: estimating passage relevance,
      and turning those estimates into an integer per-passage allocation of the budget.
      We next describe the shared compressor that produces passage memories and relevance
      scores in a single pass, the rule that converts these scores into a per-passage
      allocation, and the sense in which that rule is optimal (Figure 2).\nFigure
      2: Overview of AdaMem. (a) A shared compressor jointly produces passage memory
      representations and relevance scores. (b) The scores determine a query-dependent
      allocation of the fixed budget B via softmax and largest-remainder rounding.
      (c) The allocated memories are projected, ordered by relevance, and passed to
      a LoRA-adapted decoder for answer generation.", "Experiments and Results\nKILT-SCR.
      Weconstruct KILT-SCR as a large-candidatepool resource with training and evaluation
      splits. Its training split is derived from the training sets of Natural Questions
      (Kwiatkowski et al. 2019), HotpotQA (Yang et al. 2018), and TriviaQA (Joshi
      et al. 2017). The evaluation split contains examples from the evaluation sets
      of these three datasets, together with PopQA (Mallen et al. 2023), ASQA (Stelmakh
      et al. 2022), and BioASQ (Krithara et al. 2023; Tsatsaronis et al. 2015). For
      every query, we retrieve a fixed pool of 25 passages from KILT-100w (Petroni
      et al. 2021) using BAAI/bge-large-en-v1.5 (Xiao et al. 2024).\nFor each training
      query, we score candidates with cross-encoder/ms-marco-MiniLM-L6-v2 (Bajaj et
      al. 2018) and provide the ten highest-scoring passages to Mistral-7B-Instruct-v0.2
      (Jiang et al. 2023a) to generate answer targets. We retain only instances for
      which a goldanswer alias occurs both in at least one retrieved passage and in
      the generated target, yielding 196,916 examples; teacher scores are globally
      standardized over this split. In contrast, we apply no answer-support or teacher-target
      filtering to KILTSCR evaluation split, which contains 2,000 examples each from
      Natural Questions, HotpotQA, TriviaQA, and PopQA, 948 from ASQA, and 1,609 from
      BioASQ. At evaluation time, the learned reranker scores the fixed candidate
      pool before answer generation.\nExperimental Setup. AdaMem uses a Llama-3.2-1BInstruct
      (Grattafiori et al. 2024) compressor and a Mistral-7B-Instruct-v0.2 decoder
      adapted with LoRA (Hu et al. 2022). We first pretrain the compressor and AdaMem
      projection module on two million examples sampled from EleutherAI/SmolLM2-135M-10B
      (Allal et al. 2025), using autoencoding and language-modeling objectives. We
      then perform query-dependent fine-tuning on maxoul/pisco_finetuning_data (Louis,
      D\u00e9jean, and Clinchant 2025), following the OSCAR training setup. Finally,
      we train on KILT-SCR with the joint answergeneration and reranker-distillation
      objectives. For all experiments, we report Substring Match as the primary evaluation
      metric. We provide additional LLM-as-a-judge metrics in the Supplementary Material.\nFigure
      3: Match (%) versus retrieval depth. AdaMem benefits from deeper retrieval more
      consistently than OSCAR, particularly under stronger compression.", "Conclusion\nJiang,
      A. Q.; Sablayrolles, A.; Mensch, A.; Bamford, C.; Chaplot, D. S.; de las Casas,
      D.; Bressand, F.; Lengyel, G.; Lample, G.; Saulnier, L.; Lavaud, L. R.; Lachaux,
      M.-A.; Stock, P.; Scao, T. L.; Lavril, T.; Wang, T.; Lacroix, T.; and Sayed,
      W. E. 2023a. Mistral 7B. arXiv:2310.06825.\nJiang, H.; Wu, Q.; Lin, C.-Y.; Yang,
      Y.; and Qiu, L. 2023b. LLMLingua: Compressing Prompts for Accelerated Inference
