      under the following requirements: attribution, indicating modifications, ''ShareAlike''
      condition, and license notice. Our benchmark satisfies these criteria by: providing
      a URL to each original Wikipedia article (attribution), describing the process
      of summarization and article truncation (modification), releasing under the
      same CC BY-SA 4.0 license (ShareAlike), and including a link to the license
