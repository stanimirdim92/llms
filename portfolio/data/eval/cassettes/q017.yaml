      (Volume 1: Long Papers) , 1601-1611. Vancouver, Canada: Association for Computational
      Linguistics.\nKelly, F. P.; Maulloo, A. K.; and Tan, D. K. H. 1998. Rate control
      for communication networks: shadow prices, proportional fairness and stability.
