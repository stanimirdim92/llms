      of the 2023 Conference on Empirical Methods in Natural Language Processing ,
      1335813376. Singapore: Association for Computational Linguistics.\nJiang, H.;
      Wu, Q.; Luo, X.; Li, D.; Lin, C.-Y.; Yang, Y.; and Qiu, L. 2024. LongLLMLingua:
      Accelerating and enhancing llms in long context scenarios via prompt compression.
      In Proceedings of the 62nd Annual Meeting of the Association for Computational
      Linguistics (Volume 1: Long Papers) , 1658-1677.\nJoshi, M.; Choi, E.; Weld,
      D.; and Zettlemoyer, L. 2017. TriviaQA: A Large Scale Distantly Supervised Challenge
      Dataset for Reading Comprehension. In Barzilay, R.; and Kan, M.-Y., eds., Proceedings
      of the 55th Annual Meeting of the Association for Computational Linguistics
      (Volume 1: Long Papers) , 1601-1611. Vancouver, Canada: Association for Computational
      Linguistics.\nKelly, F. P.; Maulloo, A. K.; and Tan, D. K. H. 1998. Rate control
      for communication networks: shadow prices, proportional fairness and stability.
      Journal of the Operational Research Society , 49(3): 237-252.\nKim, Y.; and
      Rush, A. M. 2016. Sequence-Level Knowledge Distillation. In Su, J.; Duh, K.;
      and Carreras, X., eds., Proceedings of the 2016 Conference on Empirical Methods
      in Natural Language Processing , 1317-1327. Austin, Texas: Association for Computational
      Linguistics.\nKrithara, A.; Nentidis, A.; Bougiatiotis, K.; and Paliouras, G.
      2023. BioASQ-QA: A manually curated corpus for Biomedical Question Answering.
      Scientific Data , 10(1): 170.", "Ethical considerations\nThis benchmark contains
      questions and answers that can be dangerous, harmful, and disturbing. However,
      because the content is sourced from Wikipedia, we are not introducing new knowledge
      into the information ecosystem nor making it meaningfully easier to access.
      The benchmark aggregates this information in a form useful for safety evaluation,
      and we therefore believe the risks inherent in releasing it are outweighed by
      the potential benefit of improving in retrieval-augmented AI systems.\nThe intended
      use of this benchmark is to support safety evaluation and research on RAG safety
      mitigations. Wikipedia text is licensed under CC BYSA 4.0, which allows redistribution
      under the following requirements: attribution, indicating modifications, ''ShareAlike''
      condition, and license notice. Our benchmark satisfies these criteria by: providing
      a URL to each original Wikipedia article (attribution), describing the process
      of summarization and article truncation (modification), releasing under the
      same CC BY-SA 4.0 license (ShareAlike), and including a link to the license
      in the published version of the benchmark (license notice).\nHuman annotators
      involved in benchmark validation were authors of this paper and were fully briefed
      on the nature of the data and the importance of managing mental health while
      dealing with the potentially difficult content. As authors, they were not paid
      separately for the annotation work.\nAI tools (Claude) for coding assistance
      and data visualization were used throughout this project. Experimental design,
      interpretation, and writing were done solely by the authors.", "Table 4: Inference
      efficiency on TriviaQA with k = 25 : per-query latency, throughput, total compute,
      and peak GPU memory across inference-time compression rates.\n\n| Method       |
      Rate   |   Lat. (ms) |   Thr. (q/s) |   TFLOPs |   Mem. (GB) |\n|--------------|--------|-------------|--------------|----------|-------------|\n|
      Full Context | 1 \u00d7    |       667.4 |         1.50 |     59.9 |        53.5
      |\n| OSCAR        | 16 \u00d7   |       156.1 |         6.41 |     15.0 |        39.6
      |\n| OSCAR        | 32 \u00d7   |       149.3 |         6.70 |     13.4 |        39.0
      |\n| OSCAR        | 64 \u00d7   |       142.9 |         7.00 |     12.5 |        38.7
      |\n| OSCAR        | 128 \u00d7  |       136.4 |         7.33 |     12.1 |        38.5
      |\n| AdaMem       | 16 \u00d7   |       192.4 |         5.20 |     21.0 |        56.4
      |\n| AdaMem       | 32 \u00d7   |       167.5 |         5.97 |     16.6 |        48.4
      |\n| AdaMem       | 64 \u00d7   |       152.9 |         6.54 |     14.3 |        44.4
      |\n| AdaMem       | 128 \u00d7  |       144.0 |         6.95 |     13.0 |        42.3
      |", "Reproducibility Statement\nSaved generation outputs, input hashes, and
      pinned evaluator revisions accompany perquestion rescoring records. The fixed
      contrast plans and paired-analysis reports regenerate the numerical tables and
      frontier figures without further model calls. The harness, configurations, protocol,
      and per-question records will be publicly released upon publication.", "D Judge
      Metrics\nWe use Substring Match as the primary metric because it is deterministic
      and consistent with standard open-domain QA evaluation. However, it can overestimate
      answer quality when a model lists multiple candidate answers: the prediction
      receives full credit whenever it contains a gold-answer alias as a substring,
      even if the response is ambiguous, unsupported, or includes incorrect alternatives.
      We therefore additionally report LLM-as-a-judge scores, which evaluate the correctness
      of the generated answer in the context of the question and reference answer.
      The judge assigns a score of 1 for a correct answer, 0.5 for a partially correct
      answer, and 0 for a wrong answer; we report the mean score as a percentage.
      This complementary evaluation penalizes answer enumeration and verifies that
      improvements in Match correspond to genuinely correct answers rather than increased
      lexical overlap with the reference.\nTable 5: Training schedule for the three-stage
      procedure.\n\nStage 1, Examples = 2,000,000. Stage 1, Epochs = 1. Stage 2, Examples
      = 500,000. Stage 2, Epochs = 1. Stage 3 (KILT-SCR), Examples = 196,916. Stage
      3 (KILT-SCR), Epochs = 3\nFor each example, we provide the judge with the question,
      the reference answer, and the model prediction. We use the following prompt:\nSystem
      prompt: You are an evaluation tool. Answer with one of: 1: Correct, 0.5: Partially
      correct, 0: Wrong.\nUser prompt: Here is a question, a golden answer, and an
      AI-generated answer. Can you judge whether the AIgenerated answer is correct
      according to the question and golden answer? Simply answer with one of: 1: Correct,
      0.5: Partially correct, 0: Wrong.\nQuestion:\n{question}\nGolden answer:\n{answer}\nGenerated
      answer: {prediction}\nFigure 7 corroborates the Match-based robustness trends.
      At the training-time compression rate of 16 \u00d7 , AdaMem matches or exceeds
      OSCAR across all three benchmarks, improving by 1.8 points on TriviaQA and 2.4
      points on NQ, while the methods are effectively tied on HotpotQA. The advantage
      grows under stronger inference-time compression. At 64 \u00d7 , AdaMem exceeds
      OSCAR by 6.1 points on TriviaQA and NQ, and by 7.1 points on HotpotQA. In contrast
      to OSCAR, AdaMem remains stable as the memory budget shrinks: its judge score
      decreases by only 0.9, 3.3, and 1.4 points from 16 \u00d7 to 64 \u00d7 on TriviaQA,
      NQ, and HotpotQA, respectively, compared with drops of 5.2, 7.0, and 8.7 points
      for OSCAR. These results show that relevance-aware allocation preserves answer-critical
      information under severe compression, rather than merely improving lexical overlap
