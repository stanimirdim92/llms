- request:
    body: "{\"max_tokens\":16000,\"messages\":[{\"role\":\"user\",\"content\":\"You
      check whether an answer is supported by its sources.\\n\\nQuestion: What resource
      do the AdaMem authors release, and what does it contain?\\n\\nSources the answer
      was written from:\\n[1] Introduction\\nMotivated by these limitations, we propose
      AdaMem , a framework that transforms reranking from binary selection into relevance-aware
      memory allocation. A shared compressor produces query-conditioned memories and
      scores; a principled softmax allocation, grounded in logarithmic utility theory,
      distributes a fixed total memory budget across passages according to their estimated
      utility. The temperature interpolates between uniform allocation and hard topk
      selection. Here are our main contributions:\\n- We introduce relevance-aware
      memory allocation for soft-compressed RAG: each document receives an adaptive
      memory budget determined by its estimated relevance (Figure 1), concentrating
      capacity on answer-bearing evidence while preserving compact representations
      for complementary context. This adaptivity makes AdaMem substantially more robust
      to extreme compression: between 16 \xD7 and 128 \xD7 its quality degrades by
      only about 2%, compared with over 7% for uniform-allocation baselines such as
      OSCAR.\\n- Across six open-domain QA benchmarks, AdaMem outperforms every evaluated
      compression baseline at matched budgets: at 16 \xD7 it improves over uniform
      allocation by 3 . 4% on average (up to 5 . 5% ) and over the strongest hard-compression
      baseline by 9 . 7% despite an 8 \xD7 smaller context. Quality is also more stable
      under inference-time compression: moving from 16 \xD7 to 64 \xD7 costs AdaMem
      2 . 8% on average, against 12 . 2% for uniform allocation. At different compression
      rates, AdaMem retains up to 99% of full-context quality at 4 \xD7 lower latency.\\n-
      We release KILT-SCR (Soft Compression and Reranking), a large-candidate-pool
      resource for reranking and context compression, with 25 passages per query,
      196,916\\ntraining instances, and evaluation data from six QA benchmarks. The
      training split use answer-grounded filtration to ensure supporting retrieved
      evidence and goldconsistent generated targets.\\n\\n[2] Conclusion\\nWe introduced
      AdaMem, a relevance-aware allocation framework for soft-compressed RAG. Instead
      of uniformly representing retained passages, AdaMem converts querydependent
      relevance scores into a non-uniform allocation of a fixed global memory budget,
      concentrating capacity on answer-bearing evidence while retaining limited capacity
      for complementary passages. The resulting allocation is the exact optimum of
      a proportional-fair objective under an assumed logarithmic utility model, and
      is a first-order approximation to the reverse-water-filling optimum of classical
      exponential-distortion bit allocation.\\nFigure 6: Optimal allocation temperature
      on TriviaQA across compression rates. The analytically predicted schedule (
      \u03C4 \u221D B ( \u03C1 ) , anchored at 16 \xD7 ) follows the empirical optimum
      and consistently outperforms a fixed \u03C4 = 1 .\\nAdaMem establishes a new
      state of the art among softcompression methods across six evaluated QA benchmarks.
      At 16 \xD7 compression, it improves over baselines, the strongest prior soft-compression
      method, by an average of 3 . 4% in relative terms. The advantage becomes substantially
      larger as the memory budget decreases. At 64 \xD7 compression, the average relative
      improvement reaches 14 . 6% , with gains of up to 21 . 8% on HotpotQA. At 32
      \xD7 , AdaMem exceeds OSCAR at 16 \xD7 on every benchmark, achieving an average
      relative improvement of 2 . 9% . These results show that adaptive allocation
      is particularly effective under aggressive compression, where large retrieval
      pools must be represented within strict memory constraints.\\nFinally, we introduce
      KILT-SCR, a training and evaluation resource for the joint study of reranking
      and compression. Constructed to retain answer-bearing retrieved evidence and
      answer-consistent teacher targets, it enables controlled comparison of reranking
      and memory-allocation strategies over large candidate pools with heterogeneous
      passage utility.\\nSeveral future research directions remain open. The temperature
      could be learned or predicted per query rather than set per compression rate,
      allowing allocation sharpness to adapt to the confidence of the relevance estimates.
      The budget-allocation view itself is not specific to QA or memory embeddings
      and extends naturally to other bounded representations, such as KV-cache compression
      and long-context summarization.\\nAllal, L. B.; Lozhkov, A.; Bakouch, E.; Bl\xE1zquez,
      G. M.; Penedo, G.; Tunstall, L.; Marafioti, A.; Kydl\xED\u010Dek, H.; Lajar\xEDn,
      A. P.; Srivastav, V.; Lochner, J.; Fahlgren, C.; Nguyen, X.-S.; Fourrier, C.;
      Burtenshaw, B.; Larcher, H.; Zhao, H.; Zakka, C.; Morlon, M.; Raffel, C.; von
      Werra, L.; and Wolf, T. 2025. SmolLM2: When Smol Goes Big - Data-Centric Training
      of a Small Language Model. arXiv:2502.02737.\\n\\n[3] Experiments and Results\\nKILT-SCR.
      Weconstruct KILT-SCR as a large-candidatepool resource with training and evaluation
      splits. Its training split is derived from the training sets of Natural Questions
      (Kwiatkowski et al. 2019), HotpotQA (Yang et al. 2018), and TriviaQA (Joshi
      et al. 2017). The evaluation split contains examples from the evaluation sets
      of these three datasets, together with PopQA (Mallen et al. 2023), ASQA (Stelmakh
      et al. 2022), and BioASQ (Krithara et al. 2023; Tsatsaronis et al. 2015). For
      every query, we retrieve a fixed pool of 25 passages from KILT-100w (Petroni
      et al. 2021) using BAAI/bge-large-en-v1.5 (Xiao et al. 2024).\\nFor each training
      query, we score candidates with cross-encoder/ms-marco-MiniLM-L6-v2 (Bajaj et
      al. 2018) and provide the ten highest-scoring passages to Mistral-7B-Instruct-v0.2
      (Jiang et al. 2023a) to generate answer targets. We retain only instances for
      which a goldanswer alias occurs both in at least one retrieved passage and in
      the generated target, yielding 196,916 examples; teacher scores are globally
      standardized over this split. In contrast, we apply no answer-support or teacher-target
      filtering to KILTSCR evaluation split, which contains 2,000 examples each from
      Natural Questions, HotpotQA, TriviaQA, and PopQA, 948 from ASQA, and 1,609 from
      BioASQ. At evaluation time, the learned reranker scores the fixed candidate
      pool before answer generation.\\nExperimental Setup. AdaMem uses a Llama-3.2-1BInstruct
      (Grattafiori et al. 2024) compressor and a Mistral-7B-Instruct-v0.2 decoder
      adapted with LoRA (Hu et al. 2022). We first pretrain the compressor and AdaMem
      projection module on two million examples sampled from EleutherAI/SmolLM2-135M-10B
      (Allal et al. 2025), using autoencoding and language-modeling objectives. We
      then perform query-dependent fine-tuning on maxoul/pisco_finetuning_data (Louis,
      D\xE9jean, and Clinchant 2025), following the OSCAR training setup. Finally,
      we train on KILT-SCR with the joint answergeneration and reranker-distillation
      objectives. For all experiments, we report Substring Match as the primary evaluation
      metric. We provide additional LLM-as-a-judge metrics in the Supplementary Material.\\nFigure
      3: Match (%) versus retrieval depth. AdaMem benefits from deeper retrieval more
      consistently than OSCAR, particularly under stronger compression.\\n\\n[4] AdaMem:
      Adaptive Memory Token Allocation for Soft Compression in Retrieval-Augmented
      Generation\\nArtem Sakhno, Grigorii Davydenko, Omar Zoloev, Julia Belikova,
      Andrey Savchenko, Maksim Makarenko \u2217\\n\\n[5] Abstract\\nRetrieval-augmented
      generation (RAG) improves language modelswithretrieved evidence, but processing
      many long passages is costly and can introduce distracting information. Soft
      compression addresses this challenge by encoding passages as compact sequences
      of continuous memory embeddings before generation. However, existing methods
      typically assign each retained passage an identical number of memory embeddings,
      irrespective of its query-specific relevance. To address this, we propose AdaMem,
      a relevance-guided soft-compression framework that maps learned passage-relevance
      estimates to a query-dependent allocation of a fixed memory-token budget. A
      shared query-conditioned compressor produces both continuous passage memories
      and relevance scores in a single pass; a deterministic allocation rule assigns
      more memory tokens to higher-scoring passages and can omit low-scoring ones.
      Across six open-domain QA benchmarks, AdaMem consistently outperforms OSCAR
      (the closely matched softcompression baseline that uses uniform allocation)
      as well as other soft-compression methods at matched memory budgets. Under standard
      16 \xD7 compression, AdaMem improves sub-string match by up to 3.2 points (5.5%)
      over uniform allocation baseline, with an average relative gain of 3.4%; under
      aggressive 64 \xD7 compression the average relative gain grows to 14.6%, with
      a maximum of 9.8 points (19.7%) on PopQA. AdaMem matches the answer quality
      of the uncompressed at up to 4 \xD7 lower inference latency than full context
      baseline. AdaMem retains an efficiency profile comparable to the uniform-compression
      baseline, while achieving up to 4 \xD7 lower inference latency than full-context
      inference. Thus, relevance-guided memory allocation is particularly effective
      when retrieval pools are large and the available memory budget is tight.\\n\\nAnswer:
      The AdaMem authors release **KILT-SCR** (Soft Compression and Reranking), described
      as \\\"a large-candidate-pool resource for reranking and context compression,
      with 25 passages per query, 196,916 training instances, and evaluation data
      from six QA benchmarks.\\\" The training split uses answer-grounded filtration
      to ensure supporting retrieved evidence and gold-consistent generated targets.\\n\\nMore
      specifically, per the Experiments section:\\n\\n- **Training split**: constructed
      as a large-candidate-pool resource with training and evaluation splits, derived
      from the training sets of Natural Questions, HotpotQA, and TriviaQA. For every
      query, 25 passages are retrieved from KILT-100w using BAAI/bge-large-en-v1.5.
      Candidates are scored with cross-encoder/ms-marco-MiniLM-L6-v2, and the ten
      highest-scoring passages are provided to Mistral-7B-Instruct-v0.2 to generate
      answer targets; only instances where a gold-answer alias occurs both in at least
      one retrieved passage and in the generated target are retained, yielding 196,916
      examples, with teacher scores globally standardized over this split.\\n\\n-
      **Evaluation split**: contains examples from the evaluation sets of Natural
      Questions, HotpotQA, and TriviaQA, together with PopQA, ASQA, and BioASQ. No
      answer-support or teacher-target filtering is applied to this split, which contains
      2,000 examples each from Natural Questions, HotpotQA, TriviaQA, and PopQA, 948
      from ASQA, and 1,609 from BioASQ.\\n\\nThe purpose of this resource, as stated
      in the conclusion, is that it enables controlled comparison of reranking and
      memory-allocation strategies over large candidate pools with heterogeneous passage
      utility, being constructed to retain answer-bearing retrieved evidence and answer-consistent
      teacher targets.\\n\\nPass only if every factual claim in the answer is stated
      in, or directly follows from, the\\nsources. A claim that is plausible but absent
      from the sources fails. An answer that correctly\\nsays the sources don't contain
      the answer passes.\"}],\"model\":\"claude-opus-5\",\"output_config\":{\"format\":{\"type\":\"json_schema\",\"schema\":{\"type\":\"object\",\"title\":\"Verdict\",\"properties\":{\"reasoning\":{\"type\":\"string\",\"description\":\"One
      or two sentences: what matched or what was wrong.\",\"title\":\"Reasoning\"},\"passed\":{\"type\":\"boolean\",\"description\":\"True
      only if the answer meets the criterion in full.\",\"title\":\"Passed\"}},\"additionalProperties\":false,\"required\":[\"reasoning\",\"passed\"]}}}}"
