      M.-A.; Stock, P.; Scao, T. L.; Lavril, T.; Wang, T.; Lacroix, T.; and Sayed,
      W. E. 2023a. Mistral 7B. arXiv:2310.06825.\nJiang, H.; Wu, Q.; Lin, C.-Y.; Yang,
