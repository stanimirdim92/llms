      Full Context | 1 \u00d7    |       667.4 |         1.50 |     59.9 |        53.5
      |\n| OSCAR        | 16 \u00d7   |       156.1 |         6.41 |     15.0 |        39.6
      |\n| OSCAR        | 32 \u00d7   |       149.3 |         6.70 |     13.4 |        39.0
      |\n| OSCAR        | 64 \u00d7   |       142.9 |         7.00 |     12.5 |        38.7
