        considerations\\nThis benchmark contains questions and answers that can be
        dangerous, harmful, and disturbing. However, because the content is sourced
        from Wikipedia, we are not introducing new knowledge into the information
        ecosystem nor making it meaningfully easier to access. The benchmark aggregates
        this information in a form useful for safety evaluation, and we therefore
        believe the risks inherent in releasing it are outweighed by the potential
        benefit of improving in retrieval-augmented AI systems.\\nThe intended use
        of this benchmark is to support safety evaluation and research on RAG safety
        mitigations. Wikipedia text is licensed under CC BYSA 4.0, which allows redistribution
        under the following requirements: attribution, indicating modifications, 'ShareAlike'
        condition, and license notice. Our benchmark satisfies these criteria by:
        providing a URL to each original Wikipedia article (attribution), describing
        the process of summarization and article truncation (modification), releasing
        under the same CC BY-SA 4.0 license (ShareAlike), and including a link to
        the license in the published version of the benchmark (license notice).\\nHuman
        annotators involved in benchmark validation were authors of this paper and
        were fully briefed on the nature of the data and the importance of managing
        mental health while dealing with the potentially difficult content. As authors,
        they were not paid separately for the annotation work.\\nAI tools (Claude)
        for coding assistance and data visualization were used throughout this project.
        Experimental design, interpretation, and writing were done solely by the authors.\",\"metadata\":{\"ingestion_version\":\"01a0fc5427ea71babb96a22c2c5762f3\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a-text-0020\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a\",\"chunk_type\":\"text\",\"section_path\":\"Ethical
