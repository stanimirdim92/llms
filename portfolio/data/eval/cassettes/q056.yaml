      but at much greater latency (~670 ms), labeled as \"4\u00d7 lower latency\"
      compared to the other methods, indicating AdaMem approaches Full Context accuracy
      while being significantly faster.", "Experiments and Results\nKILT-SCR. Weconstruct
      KILT-SCR as a large-candidatepool resource with training and evaluation splits.
      Its training split is derived from the training sets of Natural Questions (Kwiatkowski
      et al. 2019), HotpotQA (Yang et al. 2018), and TriviaQA (Joshi et al. 2017).
      The evaluation split contains examples from the evaluation sets of these three
      datasets, together with PopQA (Mallen et al. 2023), ASQA (Stelmakh et al. 2022),
      and BioASQ (Krithara et al. 2023; Tsatsaronis et al. 2015). For every query,
      we retrieve a fixed pool of 25 passages from KILT-100w (Petroni et al. 2021)
      using BAAI/bge-large-en-v1.5 (Xiao et al. 2024).\nFor each training query, we
      score candidates with cross-encoder/ms-marco-MiniLM-L6-v2 (Bajaj et al. 2018)
      and provide the ten highest-scoring passages to Mistral-7B-Instruct-v0.2 (Jiang
      et al. 2023a) to generate answer targets. We retain only instances for which
      a goldanswer alias occurs both in at least one retrieved passage and in the
      generated target, yielding 196,916 examples; teacher scores are globally standardized
      over this split. In contrast, we apply no answer-support or teacher-target filtering
      to KILTSCR evaluation split, which contains 2,000 examples each from Natural
      Questions, HotpotQA, TriviaQA, and PopQA, 948 from ASQA, and 1,609 from BioASQ.
      At evaluation time, the learned reranker scores the fixed candidate pool before
      answer generation.\nExperimental Setup. AdaMem uses a Llama-3.2-1BInstruct (Grattafiori
      et al. 2024) compressor and a Mistral-7B-Instruct-v0.2 decoder adapted with
      LoRA (Hu et al. 2022). We first pretrain the compressor and AdaMem projection
      module on two million examples sampled from EleutherAI/SmolLM2-135M-10B (Allal
      et al. 2025), using autoencoding and language-modeling objectives. We then perform
      query-dependent fine-tuning on maxoul/pisco_finetuning_data (Louis, D\u00e9jean,
      and Clinchant 2025), following the OSCAR training setup. Finally, we train on
      KILT-SCR with the joint answergeneration and reranker-distillation objectives.
      For all experiments, we report Substring Match as the primary evaluation metric.
      We provide additional LLM-as-a-judge metrics in the Supplementary Material.\nFigure
      3: Match (%) versus retrieval depth. AdaMem benefits from deeper retrieval more
      consistently than OSCAR, particularly under stronger compression.", "D Judge
      Metrics\nWe use Substring Match as the primary metric because it is deterministic
      and consistent with standard open-domain QA evaluation. However, it can overestimate
      answer quality when a model lists multiple candidate answers: the prediction
      receives full credit whenever it contains a gold-answer alias as a substring,
      even if the response is ambiguous, unsupported, or includes incorrect alternatives.
      We therefore additionally report LLM-as-a-judge scores, which evaluate the correctness
      of the generated answer in the context of the question and reference answer.
      The judge assigns a score of 1 for a correct answer, 0.5 for a partially correct
      answer, and 0 for a wrong answer; we report the mean score as a percentage.
      This complementary evaluation penalizes answer enumeration and verifies that
      improvements in Match correspond to genuinely correct answers rather than increased
      lexical overlap with the reference.\nTable 5: Training schedule for the three-stage
      procedure.\n\nStage 1, Examples = 2,000,000. Stage 1, Epochs = 1. Stage 2, Examples
      = 500,000. Stage 2, Epochs = 1. Stage 3 (KILT-SCR), Examples = 196,916. Stage
      3 (KILT-SCR), Epochs = 3\nFor each example, we provide the judge with the question,
