    body: "{\"max_tokens\":16000,\"messages\":[{\"role\":\"user\",\"content\":\"You
      grade a question-answering system against an accepted answer.\\n\\nQuestion:
      Which of my papers compress the retrieved context before generation?\\n\\nAccepted
      answer: AdaMem, which encodes retrieved passages as compact continuous memory
      embeddings (soft compression) and allocates a fixed memory-token budget by relevance,
      and the attribution-compression study, which compares reranking, extractive
      selection, abstractive summarization and token pruning.\\n\\nSystem answer:
      Two of your papers address context compression for retrieval-augmented generation
      (RAG), though with different approaches and focuses:\\n\\n## 2609.22100v1.pdf
      (AdaMem)\\n\\nThis paper directly tackles **soft compression** of retrieved
      passages. Soft compression addresses this challenge by encoding passages as
      compact sequences of continuous memory embeddings before generation. The paper's
      core contribution is a new method called AdaMem: a relevance-guided soft-compression
      framework that maps learned passage-relevance estimates to a query-dependent
      allocation of a fixed memory-token budget. A shared query-conditioned compressor
      produces both continuous passage memories and relevance scores in a single pass;
      a deterministic allocation rule assigns more memory tokens to higher-scoring
      passages and can omit low-scoring ones.\\n\\nIt distinguishes itself from prior
      soft-compression baselines like OSCAR, which jointly produce passage representations
      and relevance scores in one pass, using scores only to order or discard passages,
      after which every retained document receives the same number of memory tokens.
      AdaMem instead varies the allocation based on utility.\\n\\nThe paper also reviews
      the compression landscape broadly, distinguishing:\\n- **Hard compression**:
      shortens the text via sentence selection or token removal, preserving interpretability
      but discarding information that may be collectively useful.\\n- **Soft compression**:
      maps each passage to a short sequence of continuous memory embeddings consumed
      directly by the decoder, achieving much higher compression rates.\\n\\n## 2609.14245v1.pdf\\n\\nThis
      paper also evaluates context compression methods, but with a focus on **citation
      quality** in compressed-context generation rather than proposing a new compression
      technique. Its pipeline is retrieve \u2192 compress \u2192 generate \u2192 evaluate.
      It describes a compressor maps the retrieved snippets (sentence-segmented, each
      with a stable source id, sid) to a sequence of units, and every unit either
      declares provenance-the set of sids it was selected from, as in extractive families-or
      declares none, as in abstractive families.\\n\\nIt benchmarks multiple compression
      methods (Identity/full-context, Extractive, Rerank top-k, ECR, RECOMP, LLMLingua-2)
      on metrics like grounded citation precision/recall and declared-evidence F1,
      finding that ECR consistently achieves the highest precision and recall among
      compression methods across context fractions (~0.4-0.55), while LLMLingua-2
      performs poorly (near 0.0-0.15) on citation precision/recall.\\n\\n**Summary**:
      Both papers are centrally about compressing retrieved context before generation\u20142609.22100v1\\n\\nPass
      only if the system answer states the same facts as the accepted answer. Wording
      may\\ndiffer; numbers, names and conclusions may not. If the accepted answer
      is a refusal, pass only\\nif the system also declines to answer rather than
      guessing. Extra correct detail is fine;\\nanything contradicting the accepted
      answer fails.\"}],\"model\":\"claude-opus-5\",\"output_config\":{\"format\":{\"type\":\"json_schema\",\"schema\":{\"type\":\"object\",\"title\":\"Verdict\",\"properties\":{\"reasoning\":{\"type\":\"string\",\"description\":\"One
