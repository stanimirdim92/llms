      Pu Liang. 2025. Mem1: Learning to synergize memory and reasoning for efficient
      long-horizon agents. arXiv preprint arXiv:2506.15841 .", "A. Retrieval and Generation
      Pipeline\nThe pipeline follows the standard three stages of RAG. A user question
      is embedded, the nearest passages are retrieved from a vector index, and those
      passages are concatenated into a prompt that the language model answers.\nPassages
      and questions are embedded with the all-MiniLML6-v2 sentence transformer [6],
      which maps text to 384dimensional vectors and is small enough to run comfortably
      on a CPU. Vectors are normalised to unit length and stored in a FAISS flat inner-product
      index [7], so that the inner product between a query and a passage equals their
      cosine similarity. For a query q and passage d the retrieval score is\n<!--
      formula-not-decoded -->\nwhere e q and e d are the embeddings. The index holds
      an exact copy of every vector and is scanned in full at query time, which is
      appropriate at this corpus size. The top three passages, k = 3 , are passed
      to the generator.\nThe generator is Llama 3.1 8B Instruct, quantized to 4 bits
      in the GGUF Q4 K M format and run through llama.cpp on CPU. Full-precision weights
      would need about 16 GB of memory; 4-bit quantization brings the footprint near
      5 GB, which fits the 8 GB machine used for all runs. Decoding uses temperature
      0.1 so that answers are close to deterministic, which matters when the same
      query is evaluated many times. The prompt instructs the model to answer only
      from the supplied context and to reply ''Not enough information'' when the context
      does not settle the question.", "Table 2: Effect of filtered fine-tuning data
