      2025. ECoRAG: Evidentiality-guided compression for long context RAG. In Findings
      of the Association for Computational Linguistics: ACL 2025 , pages 26607-26628,
      Vienna, Austria. Association for Computational Linguistics.", "Experiments and
      Results\nBaselines. We compare AdaMem against hardcompression methods (RECOMP,
      LLMLingua, and LLMLingua-2), and soft-compression methods (xRAG, PISCO, and
      OSCAR). No Context answers without retrieved evidence, while Full Context provides
      all retrieved passages without compression. PISCO and OSCAR are the closest
      soft-compression baselines because they support large retrieved candidate pools
      and integrate compression with the retrieval pipeline. PISCO uses query-independent
      passage compression, whereas OSCAR, like AdaMem, performs query-conditioned
      compression and relevance scoring. Both assign memory uniformly across retained
      passages, while AdaMem allocates a fixed global budget according to passage
      relevance. To isolate this difference, we train PISCO, OSCAR, and AdaMem using
      identical data splits, hyperparameters, and training stages. Consequently, the
      comparison with OSCAR directly measures the effect of relevance-aware memory
      allocation under a matched setup.\nMain Results. Table 1 reports results with
      25 retrieved documents. At the reference compression rate of 16 \u00d7 , AdaMem
      achieves the best performance among compressed methods on five of six benchmarks.
      The only exception is BioASQ, where LLMLingua-2 achieves the strongest compressed
      result. Nevertheless, AdaMem outperforms all evaluated soft-compression baselines.\nHard-compression
      methods exhibit a clear trade-off between compression and answer quality. RECOMP
      achieves the highest compression rate (200 \u00d7 ), but its performance remains
      only moderately above the No Context baseline; for example, it improves HotpotQA
      from 32.3 to 37.0. Conversely, LLMLingua and LLMLingua-2 operate at only 2 \u00d7
      compression, retaining a substantially larger text budget, yet generally remain
      below AdaMem. For instance, at 16 \u00d7 , AdaMem improves over LLMLingua-2
      by 3.3 points on TriviaQA, 3.0 points on HotpotQA, and 17.3 points on PopQA.
      Thus, hard compression either requires aggressive token removal, which leaves
      limited useful evidence, or preserves much larger context without reaching the
      effectiveness of soft compression.\nAmong soft-compression methods, AdaMem consistently
      outperforms OSCAR under the same 16 \u00d7 memory budget and yields substantial
      gains over PISCO. xRAG performs poorly in this setting because it is designed
      to compress a single document. When applied to long multi-document contexts,
      its compressed tokens become less informative and fail to preserve passage-specific,
      query-relevant evidence.\nBoth AdaMem and OSCAR are trained at 16 \u00d7 compression.
      We evaluate higher compression ratios exclusively at inference time, without
      additional training or fine-tuning. At 32 \u00d7 , AdaMem outperforms OSCAR
      at its training-time compression ratio of 16 \u00d7 across all benchmarks, indicating
      that it can use approximately half as many memory embeddings while maintaining
      answer quality. Even at 64 \u00d7 , AdaMemsurpasses OSCAR at 16 \u00d7 on five
      of six benchmarks. Moreover, AdaMem retains a clear advantage over OSCAR at
      the same\n64 \u00d7 compression rate. For example, on TriviaQA, increasing compression
      from 16 \u00d7 to 64 \u00d7 reduces performance by only 0.7 points for AdaMem,
      compared with 5.3 points for OSCAR. This robustness suggests that relevance-aware
      allocation preserves salient evidence when the memory budget is severely constrained.",
