        Andrey Savchenko, Maksim Makarenko \u2217\",\"metadata\":{\"ingestion_version\":\"01a0fc53885372038a1c6d0df171e569\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d-text-0000\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d\",\"chunk_type\":\"text\",\"section_path\":\"AdaMem:
        Adaptive Memory Token Allocation for Soft Compression in Retrieval-Augmented
        Generation\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":1,\"page_no\":1,\"filename\":\"2609.22100v1.pdf\"}}},{\"id\":\"878a74c1-67eb-59c3-a48e-9f65fa4e61bd\",\"version\":13,\"score\":0.59402,\"payload\":{\"page_content\":\"1
        Introduction\\nContext compression reduces generator input in retrieval-augmented
        generation (RAG) (Xu et al., 2024; Jiang et al., 2024; Pan et al., 2024; Chirkova
        et al., 2025). Citation-grade attribution requires locatable evidence: a reader
        must be able to retrieve and check the cited source (Rashkin et al., 2023;
        Bohnet et al., 2022). Abstractive compression can interrupt this link when
        citations identify compressor-generated text without its supporting source
        spans. We call it attribution launder- ing when consistency with compressor-generated
        text is treated as evidence of support from original sources. On ASQA at nominal
        budget 0 . 25 (achieved ratio 0 . 08 ), a RECOMP-style compressor's citations
        score 0.86 precision against its summaries and 0.12 against source spans under
        our recovery protocol. These automatic scores depend on a shared NLI evaluator
        and bounded candidate search; they have not been independently calibrated.\\nRelated
        work already identifies a divergence between answer quality and citation grounding
        under compression (Li et al., 2026a), while citation support does not establish
        causal reliance on evidence (Wallat et al., 2025). We examine this problem
        across compressor families and two datasets, reporting achieved context fractions,
        explicit sourcerecovery rules, and paired comparisons on shared questions.
        Our measurements concern source support under an automatic evaluation protocol;
        they do not test causal citation faithfulness.\\nWe conduct a controlled measurement
        study with a fixed generator (Qwen2.5-7B-Instruct with ALCE-style numbered-context
        citation prompting), a fixed primary NLI evaluator, and nominal budgets of
        { 0 . 5 , 0 . 25 , 0 . 1 , 0 . 05 } in generatortokenizer tokens. Our contributions
        are:\\n- The attribution-compression frontier. A comparison across reranking,
        extractive selection, abstraction, token pruning, ECR, and an identity reference
        against achieved context fractions. All settings share 944 successful ASQAquestions
        and 976 QASPER questions from 271 papers; paired tests quantify their differences.\\n-
        A re-attributability protocol. A unit without declared provenance is counted
        as reattributable when NLI predicts entailment from a candidate source snippet;
        recovered sources support grounded citation scores\\n- alongside emitted scores
        against compressed text.\\n- Three verification modes. We separate consistency
        with summaries, availability of declared provenance, and claim support after
        source recovery. Structural rejection under declared-only checking is distinguished
        from measured rejection after recovery.\\n- An extract-cluster-rewrite (ECR)
        observation. A simple construction greedily merges near-duplicate sentences
        and cites all members of each cluster; paired comparisons quantify its measured
        differences from extraction across budgets.\",\"metadata\":{\"ingestion_version\":\"01a0fc54ff9a70d3af0e9b49e864b8b9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde-text-0002\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde\",\"chunk_type\":\"text\",\"section_path\":\"1
        Introduction\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":6,\"page_no\":1,\"filename\":\"2609.14245v1.pdf\"}}},{\"id\":\"1a27aca5-5026-50ef-8f0a-7f55558532e3\",\"version\":13,\"score\":0.58953,\"payload\":{\"page_content\":\"The
        Attribution-Compression Frontier in Retrieval-Augmented Generation\\nDeepanshu
        Mody\\nCenter for Data Science New York University dm6262@nyu.edu\",\"metadata\":{\"ingestion_version\":\"01a0fc54ff9a70d3af0e9b49e864b8b9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde-text-0000\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde\",\"chunk_type\":\"text\",\"section_path\":\"The
        Attribution-Compression Frontier in Retrieval-Augmented Generation\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":1,\"page_no\":1,\"filename\":\"2609.14245v1.pdf\"}}},{\"id\":\"59a855a5-5d91-566d-af5b-7c35dc4e52a2\",\"version\":7,\"score\":0.5854316,\"payload\":{\"page_content\":\"Abstract\\nRetrieval-augmented
        generation (RAG) improves language modelswithretrieved evidence, but processing
        many long passages is costly and can introduce distracting information. Soft
        compression addresses this challenge by encoding passages as compact sequences
        of continuous memory embeddings before generation. However, existing methods
        typically assign each retained passage an identical number of memory embeddings,
        irrespective of its query-specific relevance. To address this, we propose
        AdaMem, a relevance-guided soft-compression framework that maps learned passage-relevance
        estimates to a query-dependent allocation of a fixed memory-token budget.
        A shared query-conditioned compressor produces both continuous passage memories
        and relevance scores in a single pass; a deterministic allocation rule assigns
        more memory tokens to higher-scoring passages and can omit low-scoring ones.
        Across six open-domain QA benchmarks, AdaMem consistently outperforms OSCAR
        (the closely matched softcompression baseline that uses uniform allocation)
        as well as other soft-compression methods at matched memory budgets. Under
        standard 16 \xD7 compression, AdaMem improves sub-string match by up to 3.2
        points (5.5%) over uniform allocation baseline, with an average relative gain
        of 3.4%; under aggressive 64 \xD7 compression the average relative gain grows
        to 14.6%, with a maximum of 9.8 points (19.7%) on PopQA. AdaMem matches the
        answer quality of the uncompressed at up to 4 \xD7 lower inference latency
        than full context baseline. AdaMem retains an efficiency profile comparable
        to the uniform-compression baseline, while achieving up to 4 \xD7 lower inference
        latency than full-context inference. Thus, relevance-guided memory allocation
        is particularly effective when retrieval pools are large and the available
        memory budget is tight.\",\"metadata\":{\"ingestion_version\":\"01a0fc53885372038a1c6d0df171e569\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d-text-0001\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d\",\"chunk_type\":\"text\",\"section_path\":\"Abstract\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":3,\"page_no\":1,\"filename\":\"2609.22100v1.pdf\"}}},{\"id\":\"dd596239-1b1b-5cb1-8b0f-c3331e5e2b62\",\"version\":7,\"score\":0.5782999,\"payload\":{\"page_content\":\"Introduction\\nRetrieval-augmented
        generation (RAG) augments language models with external knowledge retrieved
        from large document collections, improving performance on knowledgeintensive
        tasks and grounding generation in retrieved evidence (Lewis et al. 2020).
        However, processing many retrieved documents is computationally expensive
        (Xu, Shi, and Choi 2024; Louis et al. 2026). Moreover, irrelevant passages
        can distract the generator and degrade answer quality (Amiraz et al. 2025).
        Increasing the context window does not fully resolve this issue, as language
        models may use information in long multi-document inputs unevenly (Liu et
        al. 2024). Even when total context length is fixed, increasing the number
        of retrieved documents can reduce QA performance, suggesting that multi-document
        processing is a distinct challenge from long-context handling (Levy et al.
        2025). Efficiently selecting and representing useful retrieved evidence is
        therefore central to scalable and reliable RAG.\\n\u2217 Correspondence to:
        sakno.ad18@physics.msu.ru, maksim.makarenko.research@gmail.com\\nFigure 1:
        TriviaQA match as a function of the compression rate on 25 retrieved documents.\\nA
        natural solution is to compress retrieved evidence before generation. Hard
        compression shortens the text via sentence selection or token removal (Jiang
        et al. 2023b; Xu, Shi, and Choi 2024; Pan et al. 2024), preserving interpretability
        but discarding information that may be collectively useful. Soft compression
        maps each passage to a short sequence of continuous memory embeddings consumed
        directly by the decoder (Cheng et al. 2024; Chevalier et al. 2023; Ge et al.
        2024), achieving much higher compression rates. Recent methods such as OSCAR
        (Louis et al. 2026) jointly produce passage representations and relevance
        scores in one pass, using scores only to order or discard passages, after
        which every retained document receives the same number of memory tokens. This
        binary allocation is suboptimal when passage utility is graded. Thus, the
        key question is not only whichdocumentstoretain, but how to distribute a fixed
        memory budget among documents with heterogeneous utility.\\nThis setting also
        exposes an important limitation of prevailing evaluation protocols for soft-compressed
        RAG. Open-domain QA benchmarks typically provide questionanswer supervision
        rather than exhaustive utility annotations for every document in a retrieved
        candidate pool (Kwiatkowski et al. 2019; Joshi et al. 2017; Mallen et al.
        2023), while soft-compression models are commonly trained and evaluated on
        relatively small retrieved sets (Cheng et al. 2024; Louis, D\xE9jean, and
        Clinchant 2025; Louis et al. 2026). Because small topk pools contain few candidates
        and exclude most lower-ranked retrievals, they expose models to fewer marginal
        and irrelevant passages and a narrower range of passage utility, making the
        benefits of reranking difficult to measure. In larger candidate pools, reranking
        must distinguish answer-bearing evidence from numerous marginal documents
        (Nogueira and Cho 2019; Li and Ouyang 2025), while the total representation
        budget cannot grow proportionally with the number of candidates. Evaluating
        under these conditions is therefore necessary to assess not only which documents
        should reach the generator, but also how the finite memory budget should be
        distributed among them.\",\"metadata\":{\"ingestion_version\":\"01a0fc53885372038a1c6d0df171e569\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d-text-0002\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d\",\"chunk_type\":\"text\",\"section_path\":\"Introduction\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":5,\"page_no\":1,\"filename\":\"2609.22100v1.pdf\"}}},{\"id\":\"4dcbbe24-cdd2-5b3f-b8f6-a9f0f4d50acc\",\"version\":13,\"score\":0.5750841,\"payload\":{\"page_content\":\"4.1
        Experimental Setup\\nWe evaluate on two attribution benchmarks with different
        retrieval granularities. ASQA comprises 948 ambiguous factoid questions from
        the ALCE release (Gao et al., 2023), each paired with the top-5 GTR-retrieved
        passages, sentencesegmented into citable snippets; answer quality is string
        exact match (str-EM). QASPER (Dasigi et al., 2021) is the 1,005-question dev
        split over 281 NLP papers, using each supplied paper's abstract and full text.
        Gold evidence is paragraphlevel, so identity presents paragraphs as citable
        units while compressors operate on sentence snippets; declared sids map to
        paragraphs for setF1 against gold evidence, max over annotators. The generator
        is Qwen2.5-7B-Instruct served via vLLM with greedy decoding and ALCE-style
        numbered-context citation prompting (Gao et al., 2023). Primary entailment
        judgments use the development-grade DeBERTa NLI evaluator of \xA73.1 at \u03C4
        = 0 . 5 . We compare six compressors: identity (no compression; documentlevel
        on ASQA, paragraph-level on QASPER), cross-encoder rerank topk (ms-marco-MiniLML-6-v2),
        embedding-based extractive sentence selection (all-MiniLM-L6-v2), the RECOMP
        abstractive summarizer (NQ checkpoint) (Xu et al., 2024), LLMLingua-2 token
        pruning (Pan et al., 2024), and our extract-cluster-rewrite (ECR) variant,
        which ranks sentences, greedily clusters nearduplicates by Jaccard word overlap
        (threshold 0.5, with a negation guard), and emits one unit per cluster-the
        highest-relevance member sentence verbatim-citing all member sentence ids.
        Although LLMLingua-2 prunes tokens verbatim, its output is a token stream
        with no unit-level sid mapping in our pipeline, so it declares no provenance
        and is scored with the no-provenance family alongside RECOMP. Each compressor
        runs at nominal budgets { 0 . 5 , 0 . 25 , 0 . 1 , 0 . 05 } of the retrieved
        context, enforced in generator-tokenizer tokens. Because compressors do not
        reliably hit their nominal budgets, the frontier figures and primary summary
        tables report the achieved ratio: RECOMP's summary length is nearly budget-independent,
        saturating at achieved ratios of 0.05-0.08 on ASQA and \u2248 0.015 on QASPER
        across all four nominal budgets. All primary comparisons use the same successful
        questions across all 21 settings: 944 on ASQA and 976 from 271 papers on QASPER.
        Only identity has failures: 4 budget-check failures on ASQA, and 15 budget-check
        plus 14 promptoverflow failures on QASPER; their question IDs are excluded
        from every primary setting. Fullcohort descriptive aggregates remain available
        in the evaluation artifacts.\",\"metadata\":{\"ingestion_version\":\"01a0fc54ff9a70d3af0e9b49e864b8b9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde-text-0008\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde\",\"chunk_type\":\"text\",\"section_path\":\"4.1
        Experimental Setup\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":33,\"page_no\":4,\"filename\":\"2609.14245v1.pdf\"}}},{\"id\":\"3da0d4cd-6031-5c9d-923d-1d547b600ae9\",\"version\":13,\"score\":0.5743182,\"payload\":{\"page_content\":\"This
        is a set of three line/scatter plots comparing context compression methods
        for retrieval-augmented generation, evaluated across three metrics: Grounded
        citation precision, Grounded citation recall, and Answer correctness (str-EM),
        each plotted against \\\"Achieved context fraction\\\" (x-axis, reversed scale
        from 1.0 to 0.0) on the y-axis from 0.0 to 1.0 (or 0.35 for the third plot).\\n\\nThe
        methods compared include Identity (full context, green dot baseline), Rerank
        top-k (brown), Extractive (orange), ECR (blue), RECOMP (purple diamond), and
        LLMLingua-2 (red). Across all three metrics, Rerank top-k and ECR tend to
        achieve the best performance at moderate context fractions (0.4-0.7), while
        LLMLingua-2 consistently underperforms with the lowest precision and recall
        scores, and RECOMP achieves relatively higher answer correctness at very low
        context fractions.\",\"metadata\":{\"ingestion_version\":\"01a0fc54ff9a70d3af0e9b49e864b8b9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde-fig-006-00\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde\",\"chunk_type\":\"figure\",\"section_path\":\"\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":47,\"page_no\":6,\"filename\":\"2609.14245v1.pdf\",\"image_path\":\"/var/www/html/personal/llms/portfolio/data/processed/01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde/figures/fig-006-00-6cc5769b7bfc598b.png\"}}},{\"id\":\"1fc18119-3386-5be4-861e-2427d6edecc0\",\"version\":7,\"score\":0.57162887,\"payload\":{\"page_content\":\"Query-Conditioned
