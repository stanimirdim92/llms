      Technologies , pages 624-643, Online. Association for Computational Linguistics.\n-
      Xue Wen Tan and Stanley Kok. 2025. SMARTe: Slotbased method for accountable
      relational triple extraction. Preprint , arXiv:2504.12816.\nJames Thorne, Andreas
      Vlachos, Christos Christodoulopoulos, and Arpit Mittal. 2018. FEVER: a large-scale
      dataset for fact extraction and VERification. In Proceedings of the 2018 Conference
      of the North American Chapter of the Association for Computational Linguistics:
      Human Language Technologies, Volume 1 (Long Papers) , pages 809-819, New Orleans,
      Louisiana. Association for Computational Linguistics.", "Conclusion\nWe introduced
      AdaMem, a relevance-aware allocation framework for soft-compressed RAG. Instead
      of uniformly representing retained passages, AdaMem converts querydependent
      relevance scores into a non-uniform allocation of a fixed global memory budget,
      concentrating capacity on answer-bearing evidence while retaining limited capacity
      for complementary passages. The resulting allocation is the exact optimum of
      a proportional-fair objective under an assumed logarithmic utility model, and
      is a first-order approximation to the reverse-water-filling optimum of classical
      exponential-distortion bit allocation.\nFigure 6: Optimal allocation temperature
      on TriviaQA across compression rates. The analytically predicted schedule (
      \u03c4 \u221d B ( \u03c1 ) , anchored at 16 \u00d7 ) follows the empirical optimum
      and consistently outperforms a fixed \u03c4 = 1 .\nAdaMem establishes a new
      state of the art among softcompression methods across six evaluated QA benchmarks.
      At 16 \u00d7 compression, it improves over baselines, the strongest prior soft-compression
      method, by an average of 3 . 4% in relative terms. The advantage becomes substantially
      larger as the memory budget decreases. At 64 \u00d7 compression, the average
      relative improvement reaches 14 . 6% , with gains of up to 21 . 8% on HotpotQA.
      At 32 \u00d7 , AdaMem exceeds OSCAR at 16 \u00d7 on every benchmark, achieving
      an average relative improvement of 2 . 9% . These results show that adaptive
      allocation is particularly effective under aggressive compression, where large
      retrieval pools must be represented within strict memory constraints.\nFinally,
      we introduce KILT-SCR, a training and evaluation resource for the joint study
      of reranking and compression. Constructed to retain answer-bearing retrieved
      evidence and answer-consistent teacher targets, it enables controlled comparison
      of reranking and memory-allocation strategies over large candidate pools with
      heterogeneous passage utility.\nSeveral future research directions remain open.
      The temperature could be learned or predicted per query rather than set per
      compression rate, allowing allocation sharpness to adapt to the confidence of
      the relevance estimates. The budget-allocation view itself is not specific to
      QA or memory embeddings and extends naturally to other bounded representations,
      such as KV-cache compression and long-context summarization.\nAllal, L. B.;
      Lozhkov, A.; Bakouch, E.; Bl\u00e1zquez, G. M.; Penedo, G.; Tunstall, L.; Marafioti,
      A.; Kydl\u00ed\u010dek, H.; Lajar\u00edn, A. P.; Srivastav, V.; Lochner, J.;
      Fahlgren, C.; Nguyen, X.-S.; Fourrier, C.; Burtenshaw, B.; Larcher, H.; Zhao,
      H.; Zakka, C.; Morlon, M.; Raffel, C.; von Werra, L.; and Wolf, T. 2025. SmolLM2:
      When Smol Goes Big - Data-Centric Training of a Small Language Model. arXiv:2502.02737.",
      "Query-Conditioned Compression and Adaptive Allocation. For each query-passage
      pair, we form\nThree-Stage Training. We train AdaMem in three stages. Stage
      1 pretrains the compressor and projection module with query-independent autoencoding
      and text-continuation objectives, teaching it to encode text into decoder-consumable
      representations. Stage 2 performs joint query-dependent training on an intermediate
      retrieval-augmented corpus, generating teacher answers from query-conditioned
      passage memories while initializing the reranker head via teacherscore distillation,
      adapting the compressor from generic to query-aware evidence representation.
      Stage 3 fi ne-tunes the full model on the filtered KILT-SCR corpus with full
      retrieved candidate pools, jointly optimizing generation and reranker distillation
      so that relevance scores directly determinepassageordering and memory allocation
      under the fixed budget at the target retrieval scale.", "7 Discussion\nWhat
      laundering looks like. Consider an ASQA example under RECOMP at nominal budget
      0.25. Asked ''How many state parks are there in Virginia?'' , the generator
      answers ''There are 34 state parks in Virginia [1]'' , while Document [1] states
      ''Virginia has 34 state parks and 17 state forests . . . '' . The citation receives
      full emitted precision, but Document [1] is the compressor''s summary with no
      declared source link. In another example, the answer ''The man who killed [them]
      is not mentioned in the retrieved documents [1]'' cites a summary containing
      that same assertion of absence. Both illustrate consistency with intermediate
      text without a declared path to source evidence; neither example alone establishes
      an independently verified hallucination.\nImplications for practice. Five operational
      recommendations follow from this evaluation setup. (1) Verify against source
      spans: consistency with compressor output does not establish support from locatable
      evidence. Report whether spans are declared or recovered and how support is
      judged. (2) Report achieved compression: nominal fractions overstate achieved
      context size by up to 32.8fold here (Section 4.1). (3) Include verification
      in cost reporting: report generator and verifier input lengths together, while
      identifying which other costs remain unmeasured (Table 2). Zero declaredspan
      cost can mean that no evidence reached the verifier. (4) Evaluate post-hoc recovery
      explicitly: missed recovery can reflect search errors or missing support (Section
      6). (5) Document citable-unit granularity: comparisons differ in their source
      units as well as their datasets. Controlled ablations are needed to isolate
      the effect of unit size.\nWhat dominating the frontier would require. Future
      compressors should merge redundant evidence while retaining validated source
      links and accounting for verification cost. ECR''s limited measured gains motivate
      independent calibration and replication before claiming general improvements.\nFailure
      modes and excluded examples. All 33 failures occur in identity runs: 4 budget-check
      failures on ASQA, and 15 budget-check plus 14 prompt-overflow failures on QASPER.
      No compressed run fails on these examples. Primary comparisons exclude the same
      failed question IDs from every setting, so their estimand is performance conditional
      on identity success.", "Attributed generation and citation evaluation.\nThe
      AIS framework evaluates whether statements are supported by identified sources
      (Rashkin et al., 2023). Automatic attribution and entailment evaluation (Bohnet
      et al., 2022; Honovich et al., 2022) inform the citation precision and recall
      metrics of ALCE (Gao et al., 2023), which we adapt. QASPER provides questions
      over research papers with annotator-marked evidence (Dasigi et al., 2021). LongCite
      studies fine-grained citation generation with long contexts (Zhang et al., 2025),
      a complementary direction to evaluating compression under a fixed generator.\nCompression
      and citation reliability. Li et al. (2026a) study Self-RAG on ASQA with LLMLingua-2
      and prefix truncation, finding sharper degradation in citation grounding than
      answer quality, and investigate hierarchical evidence retention. Our study adds
      crossfamily comparisons on ASQA and QASPER, distinguishes declared and recovered
      source mappings, and reports emitted and grounded scores against achieved context
      fractions. The conceptual finding overlaps; our contribution is experimental
      coverage and explicit evaluation and reporting procedures, rather than priority
      for the divergence. Wallat et al. (2025) distinguish citation correctness from
      causal faithfulness and investigate post-rationalization. Our NLI-based support
      scores do not establish whether the generator causally relied on the cited evidence.
      ALCE''s summary-context ablation also illustrates a correctness-citation trade-off
      (Gao et al., 2023); information-preservation studies examine grounding under
      compression (\u0141ajewska et al., 2025), and human evaluations examine verifiability
      as output abstractiveness changes (Worledge et al., 2024).\nProvenance and structured
      representations. Related provenance-oriented designs include claim-anchored
      multi-document summarization in CAMS (Guan, 2026), budgeted evidence retention
      in agent memory (Li et al., 2026b), and provenance-aware tiered memory (Zhu
      et al., 2026). Structured retrieval indexes use atomic propositions (Chen et
      al., 2024), recursive summary trees (Sarthi et al., 2024), or graph community
      summaries (Edge et al., 2024). These designs motivate explicit links between
      condensed representations and source evidence, but are not evaluated as compressors
      here. Attention-based explanations remain contested (Jain and Wallace, 2019;
      Wiegreffe and Pinter, 2019). Slot-based representations (Locatello et al., 2020;
      Tan and Kok, 2025; Ibtehaz and Kihara, 2026) suggest another possible compression
      mechanism; whether their internal structure can provide validated source attribution
      is an untested future direction.", "3.1 Setup\nOur pipeline is retrieve \u2192
      compress \u2192 generate \u2192 evaluate. A compressor maps the retrieved snippets
      (sentence-segmented, each with a stable source id, sid ) to a sequence of units
      , and every unit either declares provenance-the set of sids it was selected
      from, as in extractive familiesor declares none, as in abstractive families.
      The generator sees the units as a numbered context and is prompted, ALCE-style,
      to attach bracketed unit citations to each answer sentence (Gao et al., 2023).
      Citation quality is scored per answer statement with an NLI evaluator in the
      attributableto-identified-sources sense (Rashkin et al., 2023; Bohnet et al.,
      2022): a statement is recalled iff the concatenation of its resolvable cited
      sources entails it, and a citation is precise iff that concatenation entails
      the statement and, in addition, the cited source alone entails it or removing
      that source breaks the concatenation''s entailment (Gao et al., 2023). We use
      DeBERTa-v3-base (MNLI+FEVER+ANLI) at threshold \u03c4 =0 . 5 , truncating each
      NLI input to 512 model tokens. Entailment decisions below are this model''s
      predictions, not independently validated judgments of source support. Per-example
      harness failures occur only in identity (4 of 948 on ASQA, 29 of 1,005 on QASPER);
      every primary setting excludes those same question IDs, with failure counts
      retained.", "8 Conclusion\nWe measured citation attribution across contextcompression
      methods and budgets under a fixed generator and primary NLI evaluator. Emitted
      and grounded scores diverge, but their magnitudes depend on recovery and evaluation
      choices that have not been independently calibrated. Declaredspan verification
      rejects claims lacking declared evidence by policy; it does not determine whether
      support could be recovered. Paired comparisons quantify sampling uncertainty
      conditional on the fixed outputs and evaluator, with only limited evidence for
      ECR''s advantage. We recommend reporting grounded alongside emitted citation
      scores and achieved alongside nominal compression. The TRUE subsample retains
      the emitted-grounded gaps; human calibration and broader replication remain
      necessary.", "This is a line chart grid comparing two retrieval-augmented QA
      methods, OSCAR (red) and AdaMem (green), across three datasets (TriviaQA, NQ,
      HotpotQA) and three compression ratios (16x, 32x, 64x), forming a 3x3 panel
      layout. The x-axis in each subplot represents the number of retrieved documents
      (k = 5, 10, 15, 20, 25), while the y-axis shows task performance scores (ranging
      roughly from 36 to 84 depending on the dataset/compression level). Across nearly
      all panels, AdaMem consistently outperforms OSCAR, with the performance gap
      generally widening as compression increases (64x) and as more documents are
      retrieved, demonstrating AdaMem''s superior robustness under higher compression
      and larger retrieval sets.", "Top-25 QA robustness under stronger compression\nFigure
