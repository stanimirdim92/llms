        Related Work\\nContext compression for RAG. Text compressors select or rewrite
        retrieved material. Selection approaches include query-aware token pruning
        (Jiang et al., 2024), distilled token classification (Pan et al., 2024), sentence
        pruning with reranking (Chirkova et al., 2025), and evidentiality-guided selection
        (Jeong et al., 2025). RECOMP trains extractive and abstractive compressors
        for endtask performance (Xu et al., 2024), while FaviComp combines retrieved
        context with parametric knowledge during rewriting (Jung et al., 2025). Whether
        their outputs retain locatable source links depends on the integration: our
        extractive and ECR implementations declare source IDs, while our LLMLingua-2
        integration omits a token-tosource mapping. Soft compressors use learned representations,
        including gist tokens (Mu et al., 2023), ICAE memory slots (Ge et al., 2024),
        document embeddings (Cheng et al., 2024), and multicontext embeddings (Rau
        et al., 2025); these are outside our experiments.\",\"metadata\":{\"ingestion_version\":\"01a0fc54ff9a70d3af0e9b49e864b8b9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde-text-0003\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde\",\"chunk_type\":\"text\",\"section_path\":\"2
        Related Work\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":15,\"page_no\":2,\"filename\":\"2609.14245v1.pdf\"}}},{\"id\":\"66d80fd0-4e39-5c16-9d1d-c4dc7964f4ed\",\"version\":13,\"score\":0.6386529,\"payload\":{\"page_content\":\"4.1
        Experimental Setup\\nQASPER context and token counts. The context contains
        the supplied paper's abstract and all full-text paragraphs, sentence-segmented
        for compression; no topk retrieval truncation is applied. On the 976 common
        questions, full-source token counts have mean 4,672, median 4,557, and range
        897-11,418. At nominal 0.25, RECOMP's mean compressed context is 60.3 tokens
        and its mean complete generator input is 125.4 tokens. The reported achieved
        fraction, 0.01525, is the mean of per-question context/full-source ratios,
        not the ratio of these token means. At nominal 0.50, this gap between nominal
        and achieved fractions is about 32.8-fold.\",\"metadata\":{\"ingestion_version\":\"01a0fc54ff9a70d3af0e9b49e864b8b9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde-text-0009\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde\",\"chunk_type\":\"text\",\"section_path\":\"4.1
