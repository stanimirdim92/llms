      |", "B Inference Efficiency\nTable 4 reports per-query latency, throughput,
      total compute, and peak GPU memory on TriviaQA with k = 25 retrieved passages,
      for all inference-time compression rates used in the main text.\nAll compressed
      configurations are substantially cheaper than Full Context: latency drops by
      3 . 5 \u00d7 to 4 . 9 \u00d7 and compute by 2 . 9 \u00d7 to 5 . 0 \u00d7 , confirming
      that soft compression removes the dominant cost of processing large retrieval
      pools. Relative to OSCAR at the same compression rate, AdaMem adds the cost
      of relevance scoring and of encoding the fixed candidate memory bank before
      selection. This overhead is confined to the compressor and does not grow with
      the decoder context, so its share shrinks as compression increases: from 36.3
      ms (23%) at 16 \u00d7 to 10.0 ms (7%) at 64 \u00d7 and 7.6 ms (6%) at 128 \u00d7
      . Because the quality of AdaMem is nearly flat in the compression rate, it can
      be operated at aggressive compression where this overhead is smallest: at 64
      \u00d7 and 128 \u00d7 , AdaMem matches or improves on OSCAR at 16 \u00d7 in
      latency, throughput, and compute while providing higher answer quality. Peak
      memory remains moderately higher than OSCAR because the candidate bank for the
      full pool is encoded before allocation, yet at 64 \u00d7 it is already below
      the Full Context footprint (44.4 versus 53.5 GB), and the gap narrows further
      with compression.", "3.2 Emitted vs. Grounded Citations\nWescore every run under
      two views. We write precision as P and recall as R , with subscripts e for emitted
      and g for grounded. Emitted scores citations against the unit texts the generator
      actually saw; it measures consistency with the compressed context, and is what
      one implicitly measures when compressed units are treated as citable documents.
      Grounded fi rst resolves each citation to retrieved source spans and scores
      against those. Units with declared provenance resolve to their declared sids.
      Units without declared provenance pass through our re-attributability protocol:
      rank source snippets by lexical similarity to the unit, run NLI on the top 10
      candidates, and keep those judged to individually entail the unit at \u03c4
      . A citation with no recovered span receives no precision credit and cannot
      support recall under this protocol. The reattribution rate is the fraction of
      units without declared provenance with at least one recovered span, averaged
      across examples.\nEvaluator dependence. The same NLI model filters recovered
      spans and scores citation support, creating a circularity risk: selection and
      evaluation errors can be correlated. Lexical retrieval can miss paraphrases,
      and the single-snippet test can reject units supported only by combined evidence.
      Thus failed recovery does not establish that support is absent from the source,
      and the direction of overall scoring bias is unknown. Appendix C reports a second-evaluator
      sensitivity check; human calibration remains absent.\nThe emitted -grounded
      gap is an operational diagnostic of attribution laundering : claims receive
      credit against compressed text that is not supported through the source mappings
      accepted by our protocol. It does not by itself distinguish missing evidence
      from recovery or NLI errors.\nNominal vs. achieved compression. Budgets are
      nominal fractions { 0 . 5 , 0 . 25 , 0 . 1 , 0 . 05 } of each example''s retrieved
      context, enforced in generator-tokenizer tokens. Extractive families track their
      budgets closely, but abstractive compressors emit what their decoder emits:
      RECOMP realizes achieved ratios of 0 . 05 -0 . 08 on ASQA and \u2248 0 . 015
      on QASPER across all four nominal budgets-distinct nominal operating points
      collapse together. All curves therefore use the achieved ratio on the compression
      axis; plotting against nominal budgets would misplace abstractive systems by
      more than an order of magnitude in the worst case.", "Conclusion\nPetroni, F.;
