      Compression and Selective Augmentation. In The Twelfth International Conference
      on Learning Representations .\nYang, Z.; Qi, P.; Zhang, S.; Bengio, Y.; Cohen,
      W.; Salakhutdinov, R.; and Manning, C. D. 2018. HotpotQA: A Dataset for Diverse,
      Explainable Multi-hop Question Answering. In Proceedings of the 2018 Conference
      on Empirical Methods in Natural Language Processing , 2369-2380. Brussels, Belgium:
      Association for Computational Linguistics.", "Experiments and Results\nFinally,
      at 16 \u00d7 , AdaMem closely approaches Full Context performance despite replacing
      the retrieved text with a substantially shorter continuous representation. On
      TriviaQA, it is within 0.4 points of Full Context, while on PopQA it exceeds
      Full Context by 1.4 points. Hence, selective memory allocation can both reduce
      computational cost and mitigate interference from irrelevant retrieved passages.\nFigure
      4: Memory-token allocation by document relevance rank at 64 \u00d7 compression.
      The dashed line denotes OSCAR''s fixed 16 \u00d7 allocation.\nMemory Allocation
      Behavior. Figure 4 illustrates the allocation mechanism under this highly constrained
      64 \u00d7 setting. For the most relevant documents, AdaMem allocates a median
      of roughly 10 memory tokens, already exceeding OSCAR''s fixed budget of 9 tokens
      per document at 16 \u00d7 . The 90th percentile is substantially higher, indicating
      that for some queries, AdaMem assigns considerably more capacity to the most
      relevant document. In contrast, the allocation decreases sharply with relevance
      rank and approaches zero for lower-ranked documents. Thus, AdaMem concentrates
      capacity on query-relevant evidence while assigning minimal capacity to noisy
      passages, reducing their potential interference in the compressed context.\nRobustness
      to Retrieval Depth and Compression. Figure 3 compares AdaMem and OSCAR across
      retrieval depths k \u2208 { 5 , 10 , 15 , 20 , 25 } and compression ratios of
      16 \u00d7 , 32 \u00d7 , and 64 \u00d7 at \u03c4 =1. AdaMem benefits more consistently
      from deeper retrieval, whereas OSCAR remains nearly constant as additional lower-ranked
      documents are introduced.\nThis difference is most pronounced under aggressive
      compression. At 64 \u00d7 , increasing k from 5 to 25 improves AdaMem by 3.5
      points on TriviaQA, 5.4 on Natural Questions, and 4.2 on HotpotQA, while OSCAR
      changes only marginally over the same range. A similar pattern holds at 32 \u00d7
      , particularly on Natural Questions and HotpotQA.\nThese results suggest that
      AdaMem can extract useful evidence from less-relevant documents without allocating
      them the same budget as highly relevant ones. In contrast, OSCAR''s fixed per-document
      allocation provides limited benefit from deeper retrieval, as its representation
      capacity is uniformly spread over an increasingly noisy document set. The effect
      is weaker at 16 \u00d7 , where both methods have sufficient capacity for shallow
      retrieval pools, but becomes increasingly clear as the memory budget is reduced.\nFigure
      5: Quality-latency tradeoff on TriviaQA. AdaMem shows similar latency as OSCAR
      and matches Full Context quality at 4 . 0 \u00d7 lower latency.", "References\n-
