    body: '{"query": "Which of my papers compress the retrieved context before generation?",
      "documents": ["Conclusion\nAmiraz, C.; Cuconasu, F.; Filice, S.; and Karnin,
      Z. 2025. The Distracting Effect: Understanding Irrelevant Passages in RAG. In
      Che, W.; Nabende, J.; Shutova, E.; and Pilehvar, M. T., eds., Proceedings of
      the 63rd Annual Meeting of the Association for Computational Linguistics (Volume
      1: Long Papers) , 18228-18258. Vienna, Austria: Association for Computational
      Linguistics. ISBN 979-8-89176-251-0.\nBajaj, P.; Campos, D.; Craswell, N.; Deng,
      L.; Gao, J.; Liu, X.; Majumder, R.; McNamara, A.; Mitra, B.; Nguyen, T.; Rosenberg,
      M.; Song, X.; Stoica, A.; Tiwary, S.; and Wang, T. 2018. MS MARCO: A Human Generated
      MAchine Reading COmprehension Dataset. arXiv:1611.09268.\nCheng, X.; Wang, X.;
      Zhang, X.; Ge, T.; Chen, S.-Q.; Wei, F.; Zhang, H.; and Zhao, D. 2024. xRAG:
      Extreme context compression for retrieval-augmented generation with one token.
