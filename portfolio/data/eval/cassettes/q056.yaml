        Analysis\\nRe-attribution varies across no-provenance methods. The re-attribution
        rate measures whether at least one candidate source snippet passes the NLI
        entailment threshold for a unit without declared provenance. On ASQA, RECOMP's
        rates are 0.41, 0.41, 0.42, and 0.39 across nominal budgets 0.5 through 0.05,
        excluding examples without summary units. Averaged over these examples, roughly
        three-fifths of its units have no passing candidate; this does not establish
        that the source contains no supporting evidence. LLMLingua-2's ASQA rate means
        decrease from 0.56 to 0.40, 0.25, and 0.20 as budgets tighten; the first two
        adjacent decreases have p H = 0 . 0148 , while the final decrease is unresolved
        ( p H = 0 . 242 ). Recovery coverage depends on method, budget, and dataset
        as well as the search and evaluator; these observations provide no universal
        ceiling on recoverable support.\\nTable 2: Mean input tokens on 944 ASQA questions
        at nominal budget 0.25 (identity: full context). Total includes generator
        and declared-span verification input; compression, output, and recovery are
        excluded.\\n\\nIdentity, Gen. in = 798. Identity, Ver. span = 371. Identity,
        Ver. sum. = 382. Identity, Total = 1169. Rerank top- k, Gen. in = 210. Rerank
        top- k, Ver. span = 171. Rerank top- k, Ver. sum. = 174. Rerank top- k, Total
        = 381. Extractive, Gen. in = 277. Extractive, Ver. span = 112. Extractive,
        Ver. sum. = 114. Extractive, Total = 389. ECR, Gen. in = 277. ECR, Ver. span
        = 118. ECR, Ver. sum. = 107. ECR, Total = 395. RECOMP, Gen. in = 127. RECOMP,
        Ver. span = 0. RECOMP, Ver. sum. = 84. RECOMP, Total = 127. LLMLingua-2, Gen.
        in = 253. LLMLingua-2, Ver. span = 0. LLMLingua-2, Ver. sum. = 240. LLMLingua-2,
        Total = 253\\nVerification adds input tokens. Table 2 reports a generator-input-plus-verifier-input
        proxy, measured in generator-tokenizer tokens before NLI truncation. It excludes
        compressor inference, generated output, recovery, and differences in model-specific
        tokenization or per-token cost. The declared-span column is zero for no-provenance
        compressors because this policy rejects their claims without an NLI call.
        That zero does not describe the cost of recovering and checking source evidence.\",\"metadata\":{\"ingestion_version\":\"01a0fc54ff9a70d3af0e9b49e864b8b9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde-text-0014\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde\",\"chunk_type\":\"text\",\"section_path\":\"6
