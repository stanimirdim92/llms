        and Results\\nTable 3: Effect of the three-stage training procedure at 16
        \xD7 compression with k = 25 .\\n\\nw/o Stage 1, TriviaQA = 71.30. w/o Stage
        1, NQ = 44.45. w/o Stage 1, HotpotQA = 29.35. w/o Stage 2, TriviaQA = 81.35.
        w/o Stage 2, NQ = 61.65. w/o Stage 2, HotpotQA = 43.10. w/o Stage 3, TriviaQA
        = 81.05. w/o Stage 3, NQ = 59.30. w/o Stage 3, HotpotQA = 42.70. Full three-stage
        training, TriviaQA = 82.80. Full three-stage training, NQ = 63.30. Full three-stage
        training, HotpotQA = 44.50\\nOverall, the results show that each stage addresses
        a distinct requirement: learning general-purpose soft memories, adapting them
        to query-dependent evidence, and aligning relevance-aware allocation with
        the target retrieval setting.\\nEffect of Allocation Temperature. The temperature
        \u03C4 controls allocation sharpness: larger values approach uniform allocation,
        while smaller values concentrate memory on the most relevant passages. Our
        allocation view predicts that \u03C4 should decrease as compression becomes
        stronger, since a smaller memory budget must be focused on fewer high-utility
        passages.\\nFigure 6 confirms this prediction on TriviaQA. The optimal temperature
        decreases from \u03C4 \u2217 = 1 . 0 at 16 \xD7 compression to 0 . 7 at 32
        \xD7 and 0 . 5 at 64 \xD7 and 128 \xD7 . Moreover, a theoretically predicted
        schedule, \u03C4 \u221D B ( \u03C1 ) anchored at 16 \xD7 , consistently outperforms
        a fixed \u03C4 = 1 and closely tracks the empirical optimum, despite a small
        gap at higher compression.\\nThis effect contributes to the robustness in
        Figure 1, which uses the theoretical temperature schedule without any empirical
        tuning.\",\"metadata\":{\"ingestion_version\":\"01a0fc53885372038a1c6d0df171e569\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d-text-0013\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d\",\"chunk_type\":\"text\",\"section_path\":\"Experiments
        and Results\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":73,\"page_no\":7,\"filename\":\"2609.22100v1.pdf\"}}},{\"id\":\"ecf27233-1b52-5184-aded-186ac4f2f41c\",\"version\":7,\"score\":0.47066647,\"payload\":{\"page_content\":\"This
        is a grouped bar chart comparing the performance of two methods, AdaMem (blue)
        and OSCAR (yellow hatched), across three question-answering datasets: TriviaQA,
        NQ, and HotpotQA. The y-axis shows \\\"Llama-3 judge (%)\\\" scores ranging
        from 0 to about 90, while the x-axis shows compression rates of 16\xD7, 32\xD7,
        and 64\xD7 for each dataset. Across all datasets and compression rates, AdaMem
        consistently outperforms OSCAR, with the performance gap widening as compression
        rate increases (e.g., in HotpotQA, AdaMem scores 62.4% vs OSCAR's 55.3% at
        64\xD7 compression), indicating AdaMem maintains accuracy better under higher
        compression.\",\"metadata\":{\"ingestion_version\":\"01a0fc53885372038a1c6d0df171e569\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d-fig-012-06\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d\",\"chunk_type\":\"figure\",\"section_path\":\"\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":163,\"page_no\":12,\"filename\":\"2609.22100v1.pdf\",\"image_path\":\"/var/www/html/personal/llms/portfolio/data/processed/01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d/figures/fig-012-06-64c9a5fdc088a6b8.png\"}}},{\"id\":\"736ab32c-6d0d-5d27-bc3f-f7adc55cc70a\",\"version\":7,\"score\":0.46890038,\"payload\":{\"page_content\":\"A
        Optimality of the Memory Allocation Rule\\nThree remarks follow. First, by
        the Gibbs variational principle, p = softmax( \u0302 s/\u03C4 ) is also the
        unique maximizer of \u2211 i p i \u0302 s i + \u03C4H ( p ) over the probability
        simplex, where H denotes the Shannon entropy: the allocation maximizes the
        total relevance of the allocated tokens under an entropy penalty on over-concentration,
        and \u03C4 prices that penalty. Second, the temperature limits recover the
        two prevailing strategies, uniform soft compression as \u03C4 \u2192\u221E
        and hard selection of the top-scoring passages as \u03C4 \u2192 0 , so both
        sit at the degenerate ends of the same family. Third, the exact optimum of
        (7) assigns every passage a strictly positive share, matching the full support
        of the softmax; exact zeros arise only from the integer constraint treated
        below. Within-pool standardization together with \u03C4 fi xes the utility
        parametrization w i = e \u0302 s i /\u03C4 ; since the relevance head is distilled
        to standardized cross-encoder scores, the temperature selects how sharply
        the teacher's relevance scale is converted into an allocation.\\nExponential-distortion
        bit allocation. Classical bit allocation instead minimizes a weighted distortion
        \u2211 i w i D ( m i ) under the same budget, with the high-resolution exponential
        model D ( m ) = c e -\u03B3m , \u03B3 > 0 (Huang and Schultheiss 1963; Shoham
        and Gersho 1988). Ignoring nonnegativity, the equal marginal return condition
        \u03B3w i c e -\u03B3m i = \u03BB gives\\n<!-- formula-not-decoded -->\\nwhich
        becomes a clipped affine function of centered logutility once m i \u2265 0
        is restored: shares that would be negative are set to zero and the released
        budget is redistributed among the rest ( reverse water-filling ). Under this
        model the softmax rule is exact only to first order: expanding e \u0302 s
        i /\u03C4 = 1 + \u0302 s i /\u03C4 + O ( \u03C4 -2 ) and using \u2211 j \u0302
        s j = 0 gives B softmax( \u0302 s i /\u03C4 ) = B/K + ( B/K\u03C4 ) \u0302
        s i + O ( \u03C4 -2 ) , which agrees with m \u22C6 i when \u0302 s i = (ln
        w i -ln w ) /\u03C3 and \u03C4 = \u03B3B/ ( K\u03C3 ) , with \u03C3 the spread
        of the log-utilities. The two models thus assign the softmax rule different
        statuses: exact optimizer under logarithmic utility, first-order approximation
        of reverse water-filling under exponential distortion.\\nInteger rounding.
        The softmax yields fractional a i summing to B , whereas tokens are integers.
        The natural discretization is the nearest budget-preserving integer vector,\\n<!--
        formula-not-decoded -->\\nProposition 2 (Largest-remainder is nearest rounding)
        . Largest-remainder rounding (floor every a i , then hand the R = B -\u2211
        i \u230A a i \u230B leftover tokens to the passages with the largest fractional
        parts r i = a i - \u230A a i \u230B ) returns an exact minimizer of (8) .\",\"metadata\":{\"ingestion_version\":\"01a0fc53885372038a1c6d0df171e569\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d-text-0021\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d\",\"chunk_type\":\"text\",\"section_path\":\"A
        Optimality of the Memory Allocation Rule\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":132,\"page_no\":10,\"filename\":\"2609.22100v1.pdf\"}}},{\"id\":\"701c0db8-c478-5e86-ab74-c5c16767a234\",\"version\":13,\"score\":0.4685799,\"payload\":{\"page_content\":\"Table
