      string: "{\"result\":{\"points\":[{\"id\":\"ecacb6db-49ce-5b6d-9184-a16102192253\",\"version\":7,\"score\":0.66202,\"payload\":{\"page_content\":\"Conclusion\\nAmiraz,
        C.; Cuconasu, F.; Filice, S.; and Karnin, Z. 2025. The Distracting Effect:
        Understanding Irrelevant Passages in RAG. In Che, W.; Nabende, J.; Shutova,
        E.; and Pilehvar, M. T., eds., Proceedings of the 63rd Annual Meeting of the
        Association for Computational Linguistics (Volume 1: Long Papers) , 18228-18258.
        Vienna, Austria: Association for Computational Linguistics. ISBN 979-8-89176-251-0.\\nBajaj,
        P.; Campos, D.; Craswell, N.; Deng, L.; Gao, J.; Liu, X.; Majumder, R.; McNamara,
        A.; Mitra, B.; Nguyen, T.; Rosenberg, M.; Song, X.; Stoica, A.; Tiwary, S.;
        and Wang, T. 2018. MS MARCO: A Human Generated MAchine Reading COmprehension
        Dataset. arXiv:1611.09268.\\nCheng, X.; Wang, X.; Zhang, X.; Ge, T.; Chen,
        S.-Q.; Wei, F.; Zhang, H.; and Zhao, D. 2024. xRAG: Extreme context compression
        for retrieval-augmented generation with one token. In Globerson, A.; Mackey,
        L.; Belgrave, D.; Fan, A.; Paquet, U.; Tomczak, J.; and Zhang, C., eds., Advances
        in Neural Information Processing Systems , volume 37, 109487-109516. Curran
        Associates, Inc.\\nChevalier, A.; Wettig, A.; Ajith, A.; and Chen, D. 2023.
        Adapting language models to compress contexts. In Proceedings of the 2023
        Conference on Empirical Methods in Natural Language Processing , 3829-3846.\\nFarber,
        B.; and Zeger, K. 2006. Quantization of Multiple Sources Using Nonnegative
        Integer Bit Allocation. IEEE Transactions on Information Theory , 52(11):
        4945-4964.\\nGe, T.; Hu, J.; Wang, L.; Wang, X.; Chen, S.-Q.; and Wei, F.
        2024. In-context autoencoder for context compression in a large language model.
        In The Twelfth International Conference on Learning Representations .\\nGrattafiori,
        A.; Dubey, A.; Jauhri, A.; Pandey, A.; Kadian, A.; Al-Dahle, A.; et al. 2024.
        The Llama 3 Herd of Models. arXiv:2407.21783.\\nHu, E. J.; Shen, Y.; Wallis,
        P.; Allen-Zhu, Z.; Li, Y.; Wang, S.; Wang, L.; and Chen, W. 2022. LoRA: Low-Rank
        Adaptation of Large Language Models. In International Conference on Learning
        Representations .\\nHuang, J.; and Schultheiss, P. 1963. Block Quantization
        of Correlated Gaussian Random Variables. IEEE Transactions on Communications
        , 11(3): 289-296.\",\"metadata\":{\"ingestion_version\":\"01a0fc53885372038a1c6d0df171e569\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d-text-0015\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d\",\"chunk_type\":\"text\",\"section_path\":\"Conclusion\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":87,\"page_no\":8,\"filename\":\"2609.22100v1.pdf\"}}},{\"id\":\"935cda58-c1e2-5fda-8602-111b6ffb5827\",\"version\":7,\"score\":0.66152585,\"payload\":{\"page_content\":\"Related
        Work\\nPrior work on context compression follows two main paradigms: hard
        compression , which shortens retrieved text, and soft compression , which
        replaces it with continuous representations.\\nHard Compression. These methods
        retain the generator's textual interface by selecting or rewriting useful
        context. LLMLingua (Jiang et al. 2023b) uses perplexity-based token removal;
        LongLLMLingua (Jiang et al. 2024) adds query awareness; LLMLingua-2 (Pan et
        al. 2024) formulates compression as token classification. RECOMP (Xu, Shi,
        and Choi 2024) learns extractive and abstractive compressors optimized for
        downstream performance. Such methods are interpretable and model-agnostic,
        but their discrete outputs must be re-encoded per query, limiting compression
        rates.\\nSoft Compression. Soft compression maps text to continuous memory
        embeddings consumed directly by the generator. Gist tokens (Mu, Li, and Goodman
        2023), AutoCompressors (Chevalier et al. 2023), and In-Context Autoencoders
        (Ge et al. 2024) establish that LLMs can condition on latent representations.
        For RAG, xRAG (Cheng et al. 2024) projects a pre-computed embedding into generator
        space; 500xCompressor (Li, Su, and Collier 2025) demonstrates extreme compression;
        PISCO (Louis, D\xE9jean, and Clinchant 2025) trains a compressor via distillation.
        OSCAR (Louis et al. 2026) is most closely related: it performs online query-conditioned
        compression and jointly produces representations and relevance scores. However,
        as in most prior pipelines, relevance determines ordering or selection, while
        each retained passage receives the same fixed number of memory tokens. AdaMem
        instead distributes a fixed global budget non-uniformly according to estimated
        utility.\\nCapacity of Soft Memories. Kuratov et al. (2025) show a single
        vector can encode sequences at compression ratios approaching 1500 \xD7 ,
        and that compressibility depends more on resolvable uncertainty than raw length;
        we build on this observation but study how a fi xed capacity should be distributed
        across multiple passages rather than the ceiling of a single memory.\",\"metadata\":{\"ingestion_version\":\"01a0fc53885372038a1c6d0df171e569\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d-text-0004\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d\",\"chunk_type\":\"text\",\"section_path\":\"Related
