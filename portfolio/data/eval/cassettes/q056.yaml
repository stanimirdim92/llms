      compression rates of 16\u00d7, 32\u00d7, and 64\u00d7 for each dataset. Across
      all datasets and compression rates, AdaMem consistently outperforms OSCAR, with
      the performance gap widening as compression rate increases (e.g., in HotpotQA,
      AdaMem scores 62.4% vs OSCAR''s 55.3% at 64\u00d7 compression), indicating AdaMem
      maintains accuracy better under higher compression.", "A Optimality of the Memory
      Allocation Rule\nThree remarks follow. First, by the Gibbs variational principle,
      p = softmax( \u0302 s/\u03c4 ) is also the unique maximizer of \u2211 i p i
      \u0302 s i + \u03c4H ( p ) over the probability simplex, where H denotes the
      Shannon entropy: the allocation maximizes the total relevance of the allocated
      tokens under an entropy penalty on over-concentration, and \u03c4 prices that
      penalty. Second, the temperature limits recover the two prevailing strategies,
      uniform soft compression as \u03c4 \u2192\u221e and hard selection of the top-scoring
      passages as \u03c4 \u2192 0 , so both sit at the degenerate ends of the same
      family. Third, the exact optimum of (7) assigns every passage a strictly positive
      share, matching the full support of the softmax; exact zeros arise only from
      the integer constraint treated below. Within-pool standardization together with
      \u03c4 fi xes the utility parametrization w i = e \u0302 s i /\u03c4 ; since
      the relevance head is distilled to standardized cross-encoder scores, the temperature
      selects how sharply the teacher''s relevance scale is converted into an allocation.\nExponential-distortion
      bit allocation. Classical bit allocation instead minimizes a weighted distortion
      \u2211 i w i D ( m i ) under the same budget, with the high-resolution exponential
      model D ( m ) = c e -\u03b3m , \u03b3 > 0 (Huang and Schultheiss 1963; Shoham
      and Gersho 1988). Ignoring nonnegativity, the equal marginal return condition
      \u03b3w i c e -\u03b3m i = \u03bb gives\n<!-- formula-not-decoded -->\nwhich
      becomes a clipped affine function of centered logutility once m i \u2265 0 is
      restored: shares that would be negative are set to zero and the released budget
