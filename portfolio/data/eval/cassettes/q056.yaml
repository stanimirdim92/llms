        introduced AdaMem, a relevance-aware allocation framework for soft-compressed
        RAG. Instead of uniformly representing retained passages, AdaMem converts
        querydependent relevance scores into a non-uniform allocation of a fixed global
        memory budget, concentrating capacity on answer-bearing evidence while retaining
        limited capacity for complementary passages. The resulting allocation is the
        exact optimum of a proportional-fair objective under an assumed logarithmic
        utility model, and is a first-order approximation to the reverse-water-filling
        optimum of classical exponential-distortion bit allocation.\\nFigure 6: Optimal
        allocation temperature on TriviaQA across compression rates. The analytically
        predicted schedule ( \u03C4 \u221D B ( \u03C1 ) , anchored at 16 \xD7 ) follows
        the empirical optimum and consistently outperforms a fixed \u03C4 = 1 .\\nAdaMem
        establishes a new state of the art among softcompression methods across six
        evaluated QA benchmarks. At 16 \xD7 compression, it improves over baselines,
        the strongest prior soft-compression method, by an average of 3 . 4% in relative
        terms. The advantage becomes substantially larger as the memory budget decreases.
        At 64 \xD7 compression, the average relative improvement reaches 14 . 6% ,
        with gains of up to 21 . 8% on HotpotQA. At 32 \xD7 , AdaMem exceeds OSCAR
        at 16 \xD7 on every benchmark, achieving an average relative improvement of
        2 . 9% . These results show that adaptive allocation is particularly effective
        under aggressive compression, where large retrieval pools must be represented
        within strict memory constraints.\\nFinally, we introduce KILT-SCR, a training
        and evaluation resource for the joint study of reranking and compression.
        Constructed to retain answer-bearing retrieved evidence and answer-consistent
        teacher targets, it enables controlled comparison of reranking and memory-allocation
        strategies over large candidate pools with heterogeneous passage utility.\\nSeveral
        future research directions remain open. The temperature could be learned or
        predicted per query rather than set per compression rate, allowing allocation
        sharpness to adapt to the confidence of the relevance estimates. The budget-allocation
        view itself is not specific to QA or memory embeddings and extends naturally
        to other bounded representations, such as KV-cache compression and long-context
        summarization.\\nAllal, L. B.; Lozhkov, A.; Bakouch, E.; Bl\xE1zquez, G. M.;
        Penedo, G.; Tunstall, L.; Marafioti, A.; Kydl\xED\u010Dek, H.; Lajar\xEDn,
        A. P.; Srivastav, V.; Lochner, J.; Fahlgren, C.; Nguyen, X.-S.; Fourrier,
        C.; Burtenshaw, B.; Larcher, H.; Zhao, H.; Zakka, C.; Morlon, M.; Raffel,
        C.; von Werra, L.; and Wolf, T. 2025. SmolLM2: When Smol Goes Big - Data-Centric
        Training of a Small Language Model. arXiv:2502.02737.\",\"metadata\":{\"ingestion_version\":\"01a0fc53885372038a1c6d0df171e569\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d-text-0014\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d\",\"chunk_type\":\"text\",\"section_path\":\"Conclusion\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":80,\"page_no\":7,\"filename\":\"2609.22100v1.pdf\"}}},{\"id\":\"315946dc-a850-55d9-97af-3742f684e651\",\"version\":7,\"score\":0.524639,\"payload\":{\"page_content\":\"Query-Conditioned
        Compression and Adaptive Allocation. For each query-passage pair, we form\\nThree-Stage
        Training. We train AdaMem in three stages. Stage 1 pretrains the compressor
        and projection module with query-independent autoencoding and text-continuation
        objectives, teaching it to encode text into decoder-consumable representations.
        Stage 2 performs joint query-dependent training on an intermediate retrieval-augmented
        corpus, generating teacher answers from query-conditioned passage memories
        while initializing the reranker head via teacherscore distillation, adapting
        the compressor from generic to query-aware evidence representation. Stage
        3 fi ne-tunes the full model on the filtered KILT-SCR corpus with full retrieved
        candidate pools, jointly optimizing generation and reranker distillation so
        that relevance scores directly determinepassageordering and memory allocation
        under the fixed budget at the target retrieval scale.\",\"metadata\":{\"ingestion_version\":\"01a0fc53885372038a1c6d0df171e569\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d-text-0008\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d\",\"chunk_type\":\"text\",\"section_path\":\"Query-Conditioned
        Compression and Adaptive Allocation. For each query-passage pair, we form\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":45,\"page_no\":4,\"filename\":\"2609.22100v1.pdf\"}}},{\"id\":\"79722859-0ac6-5155-9a22-c1bba51824ef\",\"version\":13,\"score\":0.5239062,\"payload\":{\"page_content\":\"7
        Discussion\\nWhat laundering looks like. Consider an ASQA example under RECOMP
        at nominal budget 0.25. Asked 'How many state parks are there in Virginia?'
        , the generator answers 'There are 34 state parks in Virginia [1]' , while
        Document [1] states 'Virginia has 34 state parks and 17 state forests . .
        . ' . The citation receives full emitted precision, but Document [1] is the
        compressor's summary with no declared source link. In another example, the
        answer 'The man who killed [them] is not mentioned in the retrieved documents
        [1]' cites a summary containing that same assertion of absence. Both illustrate
        consistency with intermediate text without a declared path to source evidence;
        neither example alone establishes an independently verified hallucination.\\nImplications
        for practice. Five operational recommendations follow from this evaluation
        setup. (1) Verify against source spans: consistency with compressor output
        does not establish support from locatable evidence. Report whether spans are
        declared or recovered and how support is judged. (2) Report achieved compression:
        nominal fractions overstate achieved context size by up to 32.8fold here (Section
        4.1). (3) Include verification in cost reporting: report generator and verifier
        input lengths together, while identifying which other costs remain unmeasured
        (Table 2). Zero declaredspan cost can mean that no evidence reached the verifier.
        (4) Evaluate post-hoc recovery explicitly: missed recovery can reflect search
        errors or missing support (Section 6). (5) Document citable-unit granularity:
        comparisons differ in their source units as well as their datasets. Controlled
        ablations are needed to isolate the effect of unit size.\\nWhat dominating
        the frontier would require. Future compressors should merge redundant evidence
        while retaining validated source links and accounting for verification cost.
        ECR's limited measured gains motivate independent calibration and replication
        before claiming general improvements.\\nFailure modes and excluded examples.
        All 33 failures occur in identity runs: 4 budget-check failures on ASQA, and
        15 budget-check plus 14 prompt-overflow failures on QASPER. No compressed
        run fails on these examples. Primary comparisons exclude the same failed question
        IDs from every setting, so their estimand is performance conditional on identity
        success.\",\"metadata\":{\"ingestion_version\":\"01a0fc54ff9a70d3af0e9b49e864b8b9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde-text-0018\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde\",\"chunk_type\":\"text\",\"section_path\":\"7
        Discussion\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":71,\"page_no\":8,\"filename\":\"2609.14245v1.pdf\"}}},{\"id\":\"edb6739a-df0e-5d2e-a2f6-e824ee95e2f5\",\"version\":13,\"score\":0.5238713,\"payload\":{\"page_content\":\"Attributed
        generation and citation evaluation.\\nThe AIS framework evaluates whether
        statements are supported by identified sources (Rashkin et al., 2023). Automatic
        attribution and entailment evaluation (Bohnet et al., 2022; Honovich et al.,
        2022) inform the citation precision and recall metrics of ALCE (Gao et al.,
        2023), which we adapt. QASPER provides questions over research papers with
        annotator-marked evidence (Dasigi et al., 2021). LongCite studies fine-grained
        citation generation with long contexts (Zhang et al., 2025), a complementary
        direction to evaluating compression under a fixed generator.\\nCompression
        and citation reliability. Li et al. (2026a) study Self-RAG on ASQA with LLMLingua-2
        and prefix truncation, finding sharper degradation in citation grounding than
        answer quality, and investigate hierarchical evidence retention. Our study
        adds crossfamily comparisons on ASQA and QASPER, distinguishes declared and
        recovered source mappings, and reports emitted and grounded scores against
        achieved context fractions. The conceptual finding overlaps; our contribution
        is experimental coverage and explicit evaluation and reporting procedures,
        rather than priority for the divergence. Wallat et al. (2025) distinguish
        citation correctness from causal faithfulness and investigate post-rationalization.
        Our NLI-based support scores do not establish whether the generator causally
        relied on the cited evidence. ALCE's summary-context ablation also illustrates
        a correctness-citation trade-off (Gao et al., 2023); information-preservation
        studies examine grounding under compression (\u0141ajewska et al., 2025),
        and human evaluations examine verifiability as output abstractiveness changes
        (Worledge et al., 2024).\\nProvenance and structured representations. Related
        provenance-oriented designs include claim-anchored multi-document summarization
        in CAMS (Guan, 2026), budgeted evidence retention in agent memory (Li et al.,
        2026b), and provenance-aware tiered memory (Zhu et al., 2026). Structured
        retrieval indexes use atomic propositions (Chen et al., 2024), recursive summary
        trees (Sarthi et al., 2024), or graph community summaries (Edge et al., 2024).
        These designs motivate explicit links between condensed representations and
        source evidence, but are not evaluated as compressors here. Attention-based
        explanations remain contested (Jain and Wallace, 2019; Wiegreffe and Pinter,
        2019). Slot-based representations (Locatello et al., 2020; Tan and Kok, 2025;
        Ibtehaz and Kihara, 2026) suggest another possible compression mechanism;
        whether their internal structure can provide validated source attribution
        is an untested future direction.\",\"metadata\":{\"ingestion_version\":\"01a0fc54ff9a70d3af0e9b49e864b8b9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde-text-0004\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde\",\"chunk_type\":\"text\",\"section_path\":\"Attributed
        generation and citation evaluation.\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":17,\"page_no\":2,\"filename\":\"2609.14245v1.pdf\"}}},{\"id\":\"f45581fc-5f6f-5bbf-b3a8-6caaa982a248\",\"version\":13,\"score\":0.51443875,\"payload\":{\"page_content\":\"3.1
        Setup\\nOur pipeline is retrieve \u2192 compress \u2192 generate \u2192 evaluate.
        A compressor maps the retrieved snippets (sentence-segmented, each with a
        stable source id, sid ) to a sequence of units , and every unit either declares
        provenance-the set of sids it was selected from, as in extractive familiesor
        declares none, as in abstractive families. The generator sees the units as
        a numbered context and is prompted, ALCE-style, to attach bracketed unit citations
        to each answer sentence (Gao et al., 2023). Citation quality is scored per
        answer statement with an NLI evaluator in the attributableto-identified-sources
        sense (Rashkin et al., 2023; Bohnet et al., 2022): a statement is recalled
        iff the concatenation of its resolvable cited sources entails it, and a citation
        is precise iff that concatenation entails the statement and, in addition,
        the cited source alone entails it or removing that source breaks the concatenation's
        entailment (Gao et al., 2023). We use DeBERTa-v3-base (MNLI+FEVER+ANLI) at
        threshold \u03C4 =0 . 5 , truncating each NLI input to 512 model tokens. Entailment
        decisions below are this model's predictions, not independently validated
        judgments of source support. Per-example harness failures occur only in identity
        (4 of 948 on ASQA, 29 of 1,005 on QASPER); every primary setting excludes
        those same question IDs, with failure counts retained.\",\"metadata\":{\"ingestion_version\":\"01a0fc54ff9a70d3af0e9b49e864b8b9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde-text-0005\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde\",\"chunk_type\":\"text\",\"section_path\":\"3.1
