    body: "{\"max_tokens\":1024,\"messages\":[{\"role\":\"user\",\"content\":[{\"type\":\"document\",\"source\":{\"type\":\"text\",\"media_type\":\"text/plain\",\"data\":\"Abstract\\nRetrieval-augmented
      generation (RAG) improves language modelswithretrieved evidence, but processing
      many long passages is costly and can introduce distracting information. Soft
      compression addresses this challenge by encoding passages as compact sequences
      of continuous memory embeddings before generation. However, existing methods
      typically assign each retained passage an identical number of memory embeddings,
      irrespective of its query-specific relevance. To address this, we propose AdaMem,
      a relevance-guided soft-compression framework that maps learned passage-relevance
      estimates to a query-dependent allocation of a fixed memory-token budget. A
      shared query-conditioned compressor produces both continuous passage memories
      and relevance scores in a single pass; a deterministic allocation rule assigns
      more memory tokens to higher-scoring passages and can omit low-scoring ones.
      Across six open-domain QA benchmarks, AdaMem consistently outperforms OSCAR
      (the closely matched softcompression baseline that uses uniform allocation)
      as well as other soft-compression methods at matched memory budgets. Under standard
      16 \xD7 compression, AdaMem improves sub-string match by up to 3.2 points (5.5%)
      over uniform allocation baseline, with an average relative gain of 3.4%; under
      aggressive 64 \xD7 compression the average relative gain grows to 14.6%, with
      a maximum of 9.8 points (19.7%) on PopQA. AdaMem matches the answer quality
      of the uncompressed at up to 4 \xD7 lower inference latency than full context
      baseline. AdaMem retains an efficiency profile comparable to the uniform-compression
      baseline, while achieving up to 4 \xD7 lower inference latency than full-context
      inference. Thus, relevance-guided memory allocation is particularly effective
      when retrieval pools are large and the available memory budget is tight.\"},\"title\":\"2609.22100v1.pdf
      [01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d] (text, page
      1)\",\"citations\":{\"enabled\":true}},{\"type\":\"document\",\"source\":{\"type\":\"text\",\"media_type\":\"text/plain\",\"data\":\"Introduction\\nRetrieval-augmented
      generation (RAG) augments language models with external knowledge retrieved
      from large document collections, improving performance on knowledgeintensive
      tasks and grounding generation in retrieved evidence (Lewis et al. 2020). However,
      processing many retrieved documents is computationally expensive (Xu, Shi, and
      Choi 2024; Louis et al. 2026). Moreover, irrelevant passages can distract the
      generator and degrade answer quality (Amiraz et al. 2025). Increasing the context
      window does not fully resolve this issue, as language models may use information
      in long multi-document inputs unevenly (Liu et al. 2024). Even when total context
      length is fixed, increasing the number of retrieved documents can reduce QA
      performance, suggesting that multi-document processing is a distinct challenge
      from long-context handling (Levy et al. 2025). Efficiently selecting and representing
      useful retrieved evidence is therefore central to scalable and reliable RAG.\\n\u2217
      Correspondence to: sakno.ad18@physics.msu.ru, maksim.makarenko.research@gmail.com\\nFigure
      1: TriviaQA match as a function of the compression rate on 25 retrieved documents.\\nA
      natural solution is to compress retrieved evidence before generation. Hard compression
      shortens the text via sentence selection or token removal (Jiang et al. 2023b;
      Xu, Shi, and Choi 2024; Pan et al. 2024), preserving interpretability but discarding
      information that may be collectively useful. Soft compression maps each passage
      to a short sequence of continuous memory embeddings consumed directly by the
      decoder (Cheng et al. 2024; Chevalier et al. 2023; Ge et al. 2024), achieving
      much higher compression rates. Recent methods such as OSCAR (Louis et al. 2026)
      jointly produce passage representations and relevance scores in one pass, using
      scores only to order or discard passages, after which every retained document
      receives the same number of memory tokens. This binary allocation is suboptimal
      when passage utility is graded. Thus, the key question is not only whichdocumentstoretain,
      but how to distribute a fixed memory budget among documents with heterogeneous
      utility.\\nThis setting also exposes an important limitation of prevailing evaluation
      protocols for soft-compressed RAG. Open-domain QA benchmarks typically provide
      questionanswer supervision rather than exhaustive utility annotations for every
      document in a retrieved candidate pool (Kwiatkowski et al. 2019; Joshi et al.
      2017; Mallen et al. 2023), while soft-compression models are commonly trained
      and evaluated on relatively small retrieved sets (Cheng et al. 2024; Louis,
      D\xE9jean, and Clinchant 2025; Louis et al. 2026). Because small topk pools
      contain few candidates and exclude most lower-ranked retrievals, they expose
      models to fewer marginal and irrelevant passages and a narrower range of passage
      utility, making the benefits of reranking difficult to measure. In larger candidate
      pools, reranking must distinguish answer-bearing evidence from numerous marginal
      documents (Nogueira and Cho 2019; Li and Ouyang 2025), while the total representation
      budget cannot grow proportionally with the number of candidates. Evaluating
      under these conditions is therefore necessary to assess not only which documents
      should reach the generator, but also how the finite memory budget should be
      distributed among them.\"},\"title\":\"2609.22100v1.pdf [01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d]
      (text, page 1)\",\"citations\":{\"enabled\":true}},{\"type\":\"document\",\"source\":{\"type\":\"text\",\"media_type\":\"text/plain\",\"data\":\"Related
      Work\\nPrior work on context compression follows two main paradigms: hard compression
      , which shortens retrieved text, and soft compression , which replaces it with
      continuous representations.\\nHard Compression. These methods retain the generator's
      textual interface by selecting or rewriting useful context. LLMLingua (Jiang
      et al. 2023b) uses perplexity-based token removal; LongLLMLingua (Jiang et al.
      2024) adds query awareness; LLMLingua-2 (Pan et al. 2024) formulates compression
      as token classification. RECOMP (Xu, Shi, and Choi 2024) learns extractive and
      abstractive compressors optimized for downstream performance. Such methods are
      interpretable and model-agnostic, but their discrete outputs must be re-encoded
      per query, limiting compression rates.\\nSoft Compression. Soft compression
      maps text to continuous memory embeddings consumed directly by the generator.
      Gist tokens (Mu, Li, and Goodman 2023), AutoCompressors (Chevalier et al. 2023),
      and In-Context Autoencoders (Ge et al. 2024) establish that LLMs can condition
      on latent representations. For RAG, xRAG (Cheng et al. 2024) projects a pre-computed
      embedding into generator space; 500xCompressor (Li, Su, and Collier 2025) demonstrates
      extreme compression; PISCO (Louis, D\xE9jean, and Clinchant 2025) trains a compressor
      via distillation. OSCAR (Louis et al. 2026) is most closely related: it performs
      online query-conditioned compression and jointly produces representations and
      relevance scores. However, as in most prior pipelines, relevance determines
      ordering or selection, while each retained passage receives the same fixed number
      of memory tokens. AdaMem instead distributes a fixed global budget non-uniformly
      according to estimated utility.\\nCapacity of Soft Memories. Kuratov et al.
      (2025) show a single vector can encode sequences at compression ratios approaching
      1500 \xD7 , and that compressibility depends more on resolvable uncertainty
      than raw length; we build on this observation but study how a fi xed capacity
      should be distributed across multiple passages rather than the ceiling of a
      single memory.\"},\"title\":\"2609.22100v1.pdf [01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d]
      (text, page 2)\",\"citations\":{\"enabled\":true}},{\"type\":\"document\",\"source\":{\"type\":\"text\",\"media_type\":\"text/plain\",\"data\":\"3.1
      Setup\\nOur pipeline is retrieve \u2192 compress \u2192 generate \u2192 evaluate.
      A compressor maps the retrieved snippets (sentence-segmented, each with a stable
      source id, sid ) to a sequence of units , and every unit either declares provenance-the
      set of sids it was selected from, as in extractive familiesor declares none,
      as in abstractive families. The generator sees the units as a numbered context
      and is prompted, ALCE-style, to attach bracketed unit citations to each answer
      sentence (Gao et al., 2023). Citation quality is scored per answer statement
      with an NLI evaluator in the attributableto-identified-sources sense (Rashkin
      et al., 2023; Bohnet et al., 2022): a statement is recalled iff the concatenation
      of its resolvable cited sources entails it, and a citation is precise iff that
      concatenation entails the statement and, in addition, the cited source alone
      entails it or removing that source breaks the concatenation's entailment (Gao
      et al., 2023). We use DeBERTa-v3-base (MNLI+FEVER+ANLI) at threshold \u03C4
      =0 . 5 , truncating each NLI input to 512 model tokens. Entailment decisions
      below are this model's predictions, not independently validated judgments of
      source support. Per-example harness failures occur only in identity (4 of 948
      on ASQA, 29 of 1,005 on QASPER); every primary setting excludes those same question
