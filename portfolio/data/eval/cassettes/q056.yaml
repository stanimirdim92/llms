      (Volume 1: Long Papers) , pages 2607-2622.\nJiangwen Dong, Zehui Lin, Wanyu
      Lin, and Mingjin Zhang. 2026. S-dag: A subject-based directed acyclic graph
      for multi-agent heterogeneous reasoning. In Proceedings of the AAAI Conference
      on Artificial Intelligence , volume 40, pages 29394-29402.\nXuanbo Fan, Tianqi
      Zhao, Yi Cheng, Chi Xiu, Jiaxin Guo, Boci Peng, Bingjing Xu, Jessica Zhang,
      Feng Sun, and Yan Zhang. 2026. Segmem-rag: Adaptive memory for retrieval-augmented
      generation in openended knowledge environments. In Proceedings of the AAAI Conference
      on Artificial Intelligence , volume 40, pages 30647-30655.\nXinyu Geng, Peng
      Xia, Zhen Zhang, Xinyu Wang, Qiuchen Wang, Ruixue Ding, Chenxi Wang, Jialong
      Wu, Yida Zhao, Kuan Li, and 1 others. 2025. Webwatcher: Breaking new frontier
      of vision-language deep research agent. arXiv preprint arXiv:2508.05748 .\nZiyi
      Guan, Jason Chun Lok Li, Zhijian Hou, Pingping Zhang, Donglai Xu, Yuzhi Zhao,
      Mengyang Wu, Jinpeng Chen, Thanh-Toan Nguyen, Pengfei Xian, and 1 others. 2025.
      Kg-rag: Enhancing gui agent decision-making via knowledge graph-driven retrieval-augmented
      generation. In Proceedings of the 2025 Conference on Empirical Methods in Natural
      Language Processing , pages 5396-5405.\nEdward J Hu, Yelong Shen, Phillip Wallis,
      Zeyuan Allen-Zhu, Yuanzhi Li, Shean Wang, Liang Wang, Weizhu Chen, and 1 others.
      2022. Lora: Low-rank adaptation of large language models. Iclr , 1(2):3.\nHao
      Hu, Yifan Feng, Ruoxue Li, Rundong Xue, Xingliang Hou, Zhiqiang Tian, Yue Gao,
      and Shaoyi Du. 2026. Cog-rag: Cognitive-inspired dual-hypergraph with theme
      alignment retrievalaugmented generation. In Proceedings of the AAAI Conference
      on Artificial Intelligence , volume 40, pages 31032-31040.", "9 Limitations\nEvaluator
      dependence. Primary scores use DeBERTa-v3-base, trained on MNLI, FEVER, and
      ANLI, at \u03c4 = 0 . 5 , without human calibration. Using the same model to
      select recovered spans and score support can reinforce systematic errors; the
      resulting scores are evaluator-dependent estimates, not validated rates of source
      support or factual correctness. This dependence also limits conclusions about
      method rankings and the size of emitted-grounded gaps. The 200-question TRUE
      audit checks a second scoring family, but fixed recovery retains DeBERTa selection
      and TRUE recovery reuses one judge. Different input windows and nonbinary decoder
      outputs further limit numerical comparison. Human source-level calibration remains
      necessary (Rashkin et al., 2023).\nSingle generator. All results use Qwen2.5-7BInstruct
      with greedy decoding. Frontier shapes may differ across model families and scales;
      a second-family replication is planned.\nDataset coverage. We evaluate two English
      datasets (ASQA and QASPER) with distinct retrieval granularities, but this does
      not cover multilingual settings, open-web retrieval, or longercontext regimes.\nRe-attribution
      hyperparameters. The top-10 lexical candidate pool can miss semantically matching
      snippets, and requiring one snippet to entail a unit can miss support distributed
      across snippets. Consequently, a failed recovery does not establish that the
      source contains no support. Table 3 varies the recovery threshold while holding
      the scoring threshold fixed; it does not validate the evaluator or test candidate-pool
      size, retrieval strategy, or multi-snippet recovery.\nVerification scope. Declared-span
      verification rejects claims lacking declared evidence by construction, even
      if support could be recovered. Its 1 . 00 unsupported rate for no-provenance
      runs is a provenance-availability diagnostic, not a calibrated hallucination
      rate. Recovered-source verification is reported at nominal 0.25 for the two
      no-provenance methods and remains dependent on the same bounded recovery procedure
      and evaluator.\nResidual error rows. Only identity fails on 4 ASQA and 29 QASPER
      questions; every primary setting is evaluated on the resulting common successful
      subset. This pairing prevents comparisons from using different questions, but
      conditions results on identity success and omits those difficult cases. Sampling
      intervals condition on the fixed generated outputs and evaluator; they do not
      include systematic NLI error or variation across generation runs.\nNominal versus
      achieved budgets. Abstractive compressors do not reliably hit nominal token
      budgets; RECOMP often produces much less context than requested. We report achieved
      compression ratios, but comparisons at a shared nominal budget do not establish
      performance at matched achieved context sizes.", "This is a line/scatter plot
      comparing retrieval or memory methods on a latency-accuracy tradeoff. The x-axis
      shows \"Latency per query (ms, log scale)\" ranging from about 140 to 670+,
      and the y-axis shows \"Match (%)\" ranging from roughly 76 to 84. Three methods
      are plotted: AdaMem (green circles) and OSCAR (orange squares), each annotated
      with compression/sampling factors (128\u00d7, 64\u00d7, 32\u00d7, 16\u00d7),
      showing that AdaMem achieves higher match scores at lower latencies than OSCAR;
      a \"Full Context\" baseline (purple star) achieves the highest match (~84%)
      but at much greater latency (~670 ms), labeled as \"4\u00d7 lower latency\"
      compared to the other methods, indicating AdaMem approaches Full Context accuracy
      while being significantly faster.", "Experiments and Results\nKILT-SCR. Weconstruct
      KILT-SCR as a large-candidatepool resource with training and evaluation splits.
      Its training split is derived from the training sets of Natural Questions (Kwiatkowski
      et al. 2019), HotpotQA (Yang et al. 2018), and TriviaQA (Joshi et al. 2017).
      The evaluation split contains examples from the evaluation sets of these three
      datasets, together with PopQA (Mallen et al. 2023), ASQA (Stelmakh et al. 2022),
      and BioASQ (Krithara et al. 2023; Tsatsaronis et al. 2015). For every query,
      we retrieve a fixed pool of 25 passages from KILT-100w (Petroni et al. 2021)
      using BAAI/bge-large-en-v1.5 (Xiao et al. 2024).\nFor each training query, we
      score candidates with cross-encoder/ms-marco-MiniLM-L6-v2 (Bajaj et al. 2018)
      and provide the ten highest-scoring passages to Mistral-7B-Instruct-v0.2 (Jiang
      et al. 2023a) to generate answer targets. We retain only instances for which
      a goldanswer alias occurs both in at least one retrieved passage and in the
      generated target, yielding 196,916 examples; teacher scores are globally standardized
      over this split. In contrast, we apply no answer-support or teacher-target filtering
      to KILTSCR evaluation split, which contains 2,000 examples each from Natural
      Questions, HotpotQA, TriviaQA, and PopQA, 948 from ASQA, and 1,609 from BioASQ.
      At evaluation time, the learned reranker scores the fixed candidate pool before
      answer generation.\nExperimental Setup. AdaMem uses a Llama-3.2-1BInstruct (Grattafiori
      et al. 2024) compressor and a Mistral-7B-Instruct-v0.2 decoder adapted with
      LoRA (Hu et al. 2022). We first pretrain the compressor and AdaMem projection
      module on two million examples sampled from EleutherAI/SmolLM2-135M-10B (Allal
      et al. 2025), using autoencoding and language-modeling objectives. We then perform
      query-dependent fine-tuning on maxoul/pisco_finetuning_data (Louis, D\u00e9jean,
      and Clinchant 2025), following the OSCAR training setup. Finally, we train on
      KILT-SCR with the joint answergeneration and reranker-distillation objectives.
      For all experiments, we report Substring Match as the primary evaluation metric.
      We provide additional LLM-as-a-judge metrics in the Supplementary Material.\nFigure
      3: Match (%) versus retrieval depth. AdaMem benefits from deeper retrieval more
      consistently than OSCAR, particularly under stronger compression.", "D Judge
      Metrics\nWe use Substring Match as the primary metric because it is deterministic
      and consistent with standard open-domain QA evaluation. However, it can overestimate
      answer quality when a model lists multiple candidate answers: the prediction
      receives full credit whenever it contains a gold-answer alias as a substring,
      even if the response is ambiguous, unsupported, or includes incorrect alternatives.
      We therefore additionally report LLM-as-a-judge scores, which evaluate the correctness
      of the generated answer in the context of the question and reference answer.
      The judge assigns a score of 1 for a correct answer, 0.5 for a partially correct
      answer, and 0 for a wrong answer; we report the mean score as a percentage.
      This complementary evaluation penalizes answer enumeration and verifies that
      improvements in Match correspond to genuinely correct answers rather than increased
      lexical overlap with the reference.\nTable 5: Training schedule for the three-stage
      procedure.\n\nStage 1, Examples = 2,000,000. Stage 1, Epochs = 1. Stage 2, Examples
      = 500,000. Stage 2, Epochs = 1. Stage 3 (KILT-SCR), Examples = 196,916. Stage
      3 (KILT-SCR), Epochs = 3\nFor each example, we provide the judge with the question,
      the reference answer, and the model prediction. We use the following prompt:\nSystem
      prompt: You are an evaluation tool. Answer with one of: 1: Correct, 0.5: Partially
      correct, 0: Wrong.\nUser prompt: Here is a question, a golden answer, and an
      AI-generated answer. Can you judge whether the AIgenerated answer is correct
      according to the question and golden answer? Simply answer with one of: 1: Correct,
      0.5: Partially correct, 0: Wrong.\nQuestion:\n{question}\nGolden answer:\n{answer}\nGenerated
      answer: {prediction}\nFigure 7 corroborates the Match-based robustness trends.
      At the training-time compression rate of 16 \u00d7 , AdaMem matches or exceeds
      OSCAR across all three benchmarks, improving by 1.8 points on TriviaQA and 2.4
      points on NQ, while the methods are effectively tied on HotpotQA. The advantage
      grows under stronger inference-time compression. At 64 \u00d7 , AdaMem exceeds
      OSCAR by 6.1 points on TriviaQA and NQ, and by 7.1 points on HotpotQA. In contrast
      to OSCAR, AdaMem remains stable as the memory budget shrinks: its judge score
      decreases by only 0.9, 3.3, and 1.4 points from 16 \u00d7 to 64 \u00d7 on TriviaQA,
      NQ, and HotpotQA, respectively, compared with drops of 5.2, 7.0, and 8.7 points
      for OSCAR. These results show that relevance-aware allocation preserves answer-critical
      information under severe compression, rather than merely improving lexical overlap
      with reference answers."], "model": "rerank-2.5", "top_k": 30, "truncation":
      true}'
