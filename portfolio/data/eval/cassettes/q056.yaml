      and Zhang, C., eds., Advances in Neural Information Processing Systems , volume
      37, 109487-109516. Curran Associates, Inc.\nChevalier, A.; Wettig, A.; Ajith,
      A.; and Chen, D. 2023. Adapting language models to compress contexts. In Proceedings
      of the 2023 Conference on Empirical Methods in Natural Language Processing ,
      3829-3846.\nFarber, B.; and Zeger, K. 2006. Quantization of Multiple Sources
      Using Nonnegative Integer Bit Allocation. IEEE Transactions on Information Theory
      , 52(11): 4945-4964.\nGe, T.; Hu, J.; Wang, L.; Wang, X.; Chen, S.-Q.; and Wei,
      F. 2024. In-context autoencoder for context compression in a large language
      model. In The Twelfth International Conference on Learning Representations .\nGrattafiori,
      A.; Dubey, A.; Jauhri, A.; Pandey, A.; Kadian, A.; Al-Dahle, A.; et al. 2024.
      The Llama 3 Herd of Models. arXiv:2407.21783.\nHu, E. J.; Shen, Y.; Wallis,
      P.; Allen-Zhu, Z.; Li, Y.; Wang, S.; Wang, L.; and Chen, W. 2022. LoRA: Low-Rank
      Adaptation of Large Language Models. In International Conference on Learning
      Representations .\nHuang, J.; and Schultheiss, P. 1963. Block Quantization of
      Correlated Gaussian Random Variables. IEEE Transactions on Communications ,
      11(3): 289-296.", "Related Work\nPrior work on context compression follows two
      main paradigms: hard compression , which shortens retrieved text, and soft compression
      , which replaces it with continuous representations.\nHard Compression. These
      methods retain the generator''s textual interface by selecting or rewriting
      useful context. LLMLingua (Jiang et al. 2023b) uses perplexity-based token removal;
      LongLLMLingua (Jiang et al. 2024) adds query awareness; LLMLingua-2 (Pan et
      al. 2024) formulates compression as token classification. RECOMP (Xu, Shi, and
      Choi 2024) learns extractive and abstractive compressors optimized for downstream
      performance. Such methods are interpretable and model-agnostic, but their discrete
      outputs must be re-encoded per query, limiting compression rates.\nSoft Compression.
      Soft compression maps text to continuous memory embeddings consumed directly
      by the generator. Gist tokens (Mu, Li, and Goodman 2023), AutoCompressors (Chevalier
      et al. 2023), and In-Context Autoencoders (Ge et al. 2024) establish that LLMs
      can condition on latent representations. For RAG, xRAG (Cheng et al. 2024) projects
      a pre-computed embedding into generator space; 500xCompressor (Li, Su, and Collier
      2025) demonstrates extreme compression; PISCO (Louis, D\u00e9jean, and Clinchant
      2025) trains a compressor via distillation. OSCAR (Louis et al. 2026) is most
      closely related: it performs online query-conditioned compression and jointly
      produces representations and relevance scores. However, as in most prior pipelines,
      relevance determines ordering or selection, while each retained passage receives
      the same fixed number of memory tokens. AdaMem instead distributes a fixed global
      budget non-uniformly according to estimated utility.\nCapacity of Soft Memories.
      Kuratov et al. (2025) show a single vector can encode sequences at compression
      ratios approaching 1500 \u00d7 , and that compressibility depends more on resolvable
      uncertainty than raw length; we build on this observation but study how a fi
      xed capacity should be distributed across multiple passages rather than the
      ceiling of a single memory.", "Conclusion\nLi, Z.; Su, Y.; and Collier, N. 2025.
      500xCompressor: Generalized Prompt Compression for Large Language Models. In
      Che, W.; Nabende, J.; Shutova, E.; and Pilehvar, M. T., eds., Proceedings of
      the 63rd Annual Meeting of the Association for Computational Linguistics (Volume
      1: Long Papers) , 25081-25091. Vienna, Austria: Association for Computational
      Linguistics. ISBN 979-8-89176-251-0.\nLiu, N. F.; Lin, K.; Hewitt, J.; Paranjape,
      A.; Bevilacqua, M.; Petroni, F.; and Liang, P. 2024. Lost in the Middle: How
      Language Models Use Long Contexts. Transactions of the Association for Computational
      Linguistics , 12: 157-173.\nLouis, M.; D\u00e9jean, H.; and Clinchant, S. 2025.
      PISCO: Pretty Simple Compression for Retrieval-Augmented Generation. In Che,
      W.; Nabende, J.; Shutova, E.; and Pilehvar, M. T., eds., Findings of the Association
      for Computational Linguistics: ACL 2025 , 15506-15521. Vienna, Austria: Association
      for Computational Linguistics. ISBN 979-8-89176-256-5.\nLouis, M.; Formal, T.;
      D\u00e9jean, H.; and Clinchant, S. 2026. OSCAR: Online Soft Compression for
      RAG. In The Fourteenth International Conference on Learning Representations
      .\nMallen, A.; Asai, A.; Zhong, V.; Das, R.; Khashabi, D.; and Hajishirzi, H.
      2023. When Not to Trust Language Models: Investigating Effectiveness of Parametric
      and Non-Parametric Memories. In Rogers, A.; Boyd-Graber, J.; and Okazaki, N.,
      eds., Proceedings of the 61st Annual Meeting of the Association for Computational
      Linguistics (Volume 1: Long Papers) , 9802-9822. Toronto, Canada: Association
      for Computational Linguistics.\nMu, J.; Li, X.; and Goodman, N. 2023. Learning
      to compress prompts with gist tokens. Advances in Neural Information Processing
      Systems , 36: 19327-19352.\nNogueira, R.; and Cho, K. 2019. Passage Re-ranking
      with BERT. arXiv:1901.04085.\nPan, Z.; Wu, Q.; Jiang, H.; Xia, M.; Luo, X.;
      Zhang, J.; Lin, Q.; R\u00fchle, V.; Yang, Y.; Lin, C.-Y.; Zhao, H. V.; Qiu,
      L.; and Zhang, D. 2024. LLMLingua-2: Data Distillation for Efficient and Faithful
      Task-Agnostic Prompt Compression. In Ku, L.-W.; Martins, A.; and Srikumar, V.,
      eds., Findings of the Association for Computational Linguistics: ACL 2024 ,
      963-981. Bangkok, Thailand: Association for Computational Linguistics.", "2
      Related Work\nContext compression for RAG. Text compressors select or rewrite
      retrieved material. Selection approaches include query-aware token pruning (Jiang
      et al., 2024), distilled token classification (Pan et al., 2024), sentence pruning
      with reranking (Chirkova et al., 2025), and evidentiality-guided selection (Jeong
      et al., 2025). RECOMP trains extractive and abstractive compressors for endtask
      performance (Xu et al., 2024), while FaviComp combines retrieved context with
      parametric knowledge during rewriting (Jung et al., 2025). Whether their outputs
      retain locatable source links depends on the integration: our extractive and
      ECR implementations declare source IDs, while our LLMLingua-2 integration omits
      a token-tosource mapping. Soft compressors use learned representations, including
      gist tokens (Mu et al., 2023), ICAE memory slots (Ge et al., 2024), document
      embeddings (Cheng et al., 2024), and multicontext embeddings (Rau et al., 2025);
      these are outside our experiments.", "4.1 Experimental Setup\nQASPER context
      and token counts. The context contains the supplied paper''s abstract and all
      full-text paragraphs, sentence-segmented for compression; no topk retrieval
      truncation is applied. On the 976 common questions, full-source token counts
      have mean 4,672, median 4,557, and range 897-11,418. At nominal 0.25, RECOMP''s
      mean compressed context is 60.3 tokens and its mean complete generator input
      is 125.4 tokens. The reported achieved fraction, 0.01525, is the mean of per-question
      context/full-source ratios, not the ratio of these token means. At nominal 0.50,
      this gap between nominal and achieved fractions is about 32.8-fold.", "References\nHuiqiang
      Jiang, Qianhui Wu, Xufang Luo, Dongsheng Li, Chin-Yew Lin, Yuqing Yang, and
      Lili Qiu. 2024. LongLLMLingua: Accelerating and enhancing LLMs in long context
      scenarios via prompt compression. In Proceedings of the 62nd Annual Meeting
      of the Association for Computational Linguistics (Volume 1: Long Papers) , pages
      1658-1677, Bangkok, Thailand. Association for Computational Linguistics.\n-
      Dongwon Jung, Qin Liu, Tenghao Huang, Ben Zhou, and Muhao Chen. 2025. Familiarity-aware
      evidence compression for retrieval-augmented generation. In Findings of the
      Association for Compu-\n- tational Linguistics: EMNLP 2025 , pages 1618116196,
      Suzhou, China. Association for Computational Linguistics.\nTushar Khot, Ashish
      Sabharwal, and Peter Clark. 2018. SciTaiL: A textual entailment dataset from
      science question answering. In Proceedings of the AAAI Conference on Artificial
      Intelligence , volume 32, pages 5189-5197. Association for the Advancement of
      Artificial Intelligence.\nWeronika \u0141ajewska, Momchil Hardalov, Laura Aina,
      Neha Anna John, Hang Su, and Lluis Marquez. 2025. Understanding and improving
      information preservation in prompt compression for LLMs. In Findings of the
      Association for Computational Linguistics: EMNLP 2025 , pages 17520-17541, Suzhou,
      China. Association for Computational Linguistics.\nAiyu Li, Qian Peng, and Bin
      Chen. 2026a. Efficiency vs. verifiability in evidence-aware RAG: Does prompt
      compression preserve citation grounding? In Proceedings of the Second Workshop
      on Customizable NLP: Progress and Challenges in Customizing NLP for a Domain,
      Application, Group, or Individual (CustomNLP4U) , pages 202-215, San Diego,
      California, USA. Association for Computational Linguistics.\nYilong Li, Suman
      Banerjee, and Tong Che. 2026b. EMBER: Efficient memory via budgeted evidence
      retention for long-horizon agents. Preprint , arXiv:2606.05894.\nFrancesco Locatello,
      Dirk Weissenborn, Thomas Unterthiner, Aravindh Mahendran, Georg Heigold, Jakob
      Uszkoreit, Alexey Dosovitskiy, and Thomas Kipf. 2020. Object-centric learning
      with slot attention. In Advances in Neural Information Processing Systems ,
      volume 33, pages 11525-11538.\nSewon Min, Kalpesh Krishna, Xinxi Lyu, Mike Lewis,
      Wen-tau Yih, Pang Wei Koh, Mohit Iyyer, Luke Zettlemoyer, and Hannaneh Hajishirzi.
      2023. FActScore: Fine-grained atomic evaluation of factual precision in long
      form text generation. In Proceedings of the 2023 Conference on Empirical Methods
      in Natural Language Processing , pages 1207612100, Singapore. Association for
      Computational Linguistics.\nJesse Mu, Xiang Lisa Li, and Noah Goodman. 2023.
      Learning to compress prompts with gist tokens. In Advances in Neural Information
      Processing Systems , volume 36, pages 19327-19352.", "Abstract\nContext compression
      reduces generator input in retrieval-augmented generation, but answer quality
      alone does not characterize citation attribution. We measure citation attribution
      across compression methods and budgets, comparing reranking, extractive selection,
      abstractive summarization, token pruning, and an extract-cluster-rewrite construction
      on ASQA and QASPER under a fixed generator and primary entailment evaluator.
      On ASQA at a nominal 0.25 budget (achieved compression 0.08), a RECOMP-style
      compressor''s citations score 0.86 precision against its summaries but 0.12
      against source spans under our re-attributability protocol. These estimates
      depend on a shared NLI model for span recovery and citation scoring and lack
      independent human calibration. Extractive selection''s observed grounded precision
      ranges from 0.43 to 0.49 across nominal budgets from one-half to one-tenth of
      the ASQA context, while answer quality declines. For the same RECOMP setting,
      claim verification after source recovery yields an unsupported rate of 0.88
      versus 0.17 when checking summaries. This gap persists beyond structural rejection
      of missing provenance, but remains evaluator-dependent. A 200-question TRUE
      T5-XXL audit also finds emitted-grounded gaps under both fixed and recomputed
      source mappings, without establishing human-calibrated support rates.", "This
      is a set of three line/scatter plots comparing context compression methods for
      retrieval-augmented generation, plotting \"Achieved context fraction\" (x-axis,
      reversed from 1.0 to 0.0) against three metrics: Grounded citation precision,
      Grounded citation recall, and Declared-evidence F1 (y-axes, 0.0 to 1.0 or 0.0
      to 0.20 scales). Six methods are compared: Identity (full context, green dot
      at x=1.0), Extractive (orange), Rerank top-k (brown), ECR (blue), RECOMP (purple,
      near x=0), and LLMLingua-2 (red). ECR consistently achieves the highest precision
      and recall among compression methods across context fractions (~0.4-0.55), while
      LLMLingua-2 performs poorly (near 0.0-0.15) on citation precision/recall; for
      Declared-evidence F1, ECR and Extractive show increasing values (up to ~0.17)
      as context fraction decreases, outperforming Rerank top-k, which stays low (~0.05-0.08).",
      "AdaMem: Adaptive Memory Token Allocation for Soft Compression in Retrieval-Augmented
      Generation\nArtem Sakhno, Grigorii Davydenko, Omar Zoloev, Julia Belikova, Andrey
      Savchenko, Maksim Makarenko \u2217", "1 Introduction\nContext compression reduces
      generator input in retrieval-augmented generation (RAG) (Xu et al., 2024; Jiang
      et al., 2024; Pan et al., 2024; Chirkova et al., 2025). Citation-grade attribution
      requires locatable evidence: a reader must be able to retrieve and check the
      cited source (Rashkin et al., 2023; Bohnet et al., 2022). Abstractive compression
      can interrupt this link when citations identify compressor-generated text without
      its supporting source spans. We call it attribution launder- ing when consistency
      with compressor-generated text is treated as evidence of support from original
      sources. On ASQA at nominal budget 0 . 25 (achieved ratio 0 . 08 ), a RECOMP-style
      compressor''s citations score 0.86 precision against its summaries and 0.12
      against source spans under our recovery protocol. These automatic scores depend
      on a shared NLI evaluator and bounded candidate search; they have not been independently
      calibrated.\nRelated work already identifies a divergence between answer quality
      and citation grounding under compression (Li et al., 2026a), while citation
      support does not establish causal reliance on evidence (Wallat et al., 2025).
      We examine this problem across compressor families and two datasets, reporting
      achieved context fractions, explicit sourcerecovery rules, and paired comparisons
      on shared questions. Our measurements concern source support under an automatic
      evaluation protocol; they do not test causal citation faithfulness.\nWe conduct
      a controlled measurement study with a fixed generator (Qwen2.5-7B-Instruct with
      ALCE-style numbered-context citation prompting), a fixed primary NLI evaluator,
      and nominal budgets of { 0 . 5 , 0 . 25 , 0 . 1 , 0 . 05 } in generatortokenizer
      tokens. Our contributions are:\n- The attribution-compression frontier. A comparison
      across reranking, extractive selection, abstraction, token pruning, ECR, and
      an identity reference against achieved context fractions. All settings share
      944 successful ASQAquestions and 976 QASPER questions from 271 papers; paired
      tests quantify their differences.\n- A re-attributability protocol. A unit without
      declared provenance is counted as reattributable when NLI predicts entailment
      from a candidate source snippet; recovered sources support grounded citation
      scores\n- alongside emitted scores against compressed text.\n- Three verification
      modes. We separate consistency with summaries, availability of declared provenance,
      and claim support after source recovery. Structural rejection under declared-only
      checking is distinguished from measured rejection after recovery.\n- An extract-cluster-rewrite
      (ECR) observation. A simple construction greedily merges near-duplicate sentences
      and cites all members of each cluster; paired comparisons quantify its measured
      differences from extraction across budgets.", "The Attribution-Compression Frontier
      in Retrieval-Augmented Generation\nDeepanshu Mody\nCenter for Data Science New
      York University dm6262@nyu.edu", "Abstract\nRetrieval-augmented generation (RAG)
      improves language modelswithretrieved evidence, but processing many long passages
      is costly and can introduce distracting information. Soft compression addresses
      this challenge by encoding passages as compact sequences of continuous memory
      embeddings before generation. However, existing methods typically assign each
      retained passage an identical number of memory embeddings, irrespective of its
      query-specific relevance. To address this, we propose AdaMem, a relevance-guided
      soft-compression framework that maps learned passage-relevance estimates to
      a query-dependent allocation of a fixed memory-token budget. A shared query-conditioned
      compressor produces both continuous passage memories and relevance scores in
      a single pass; a deterministic allocation rule assigns more memory tokens to
      higher-scoring passages and can omit low-scoring ones. Across six open-domain
      QA benchmarks, AdaMem consistently outperforms OSCAR (the closely matched softcompression
      baseline that uses uniform allocation) as well as other soft-compression methods
      at matched memory budgets. Under standard 16 \u00d7 compression, AdaMem improves
      sub-string match by up to 3.2 points (5.5%) over uniform allocation baseline,
      with an average relative gain of 3.4%; under aggressive 64 \u00d7 compression
      the average relative gain grows to 14.6%, with a maximum of 9.8 points (19.7%)
      on PopQA. AdaMem matches the answer quality of the uncompressed at up to 4 \u00d7
      lower inference latency than full context baseline. AdaMem retains an efficiency
      profile comparable to the uniform-compression baseline, while achieving up to
      4 \u00d7 lower inference latency than full-context inference. Thus, relevance-guided
      memory allocation is particularly effective when retrieval pools are large and
      the available memory budget is tight.", "Introduction\nRetrieval-augmented generation
      (RAG) augments language models with external knowledge retrieved from large
      document collections, improving performance on knowledgeintensive tasks and
      grounding generation in retrieved evidence (Lewis et al. 2020). However, processing
      many retrieved documents is computationally expensive (Xu, Shi, and Choi 2024;
      Louis et al. 2026). Moreover, irrelevant passages can distract the generator
      and degrade answer quality (Amiraz et al. 2025). Increasing the context window
      does not fully resolve this issue, as language models may use information in
      long multi-document inputs unevenly (Liu et al. 2024). Even when total context
      length is fixed, increasing the number of retrieved documents can reduce QA
      performance, suggesting that multi-document processing is a distinct challenge
      from long-context handling (Levy et al. 2025). Efficiently selecting and representing
      useful retrieved evidence is therefore central to scalable and reliable RAG.\n\u2217
      Correspondence to: sakno.ad18@physics.msu.ru, maksim.makarenko.research@gmail.com\nFigure
      1: TriviaQA match as a function of the compression rate on 25 retrieved documents.\nA
      natural solution is to compress retrieved evidence before generation. Hard compression
      shortens the text via sentence selection or token removal (Jiang et al. 2023b;
      Xu, Shi, and Choi 2024; Pan et al. 2024), preserving interpretability but discarding
      information that may be collectively useful. Soft compression maps each passage
      to a short sequence of continuous memory embeddings consumed directly by the
      decoder (Cheng et al. 2024; Chevalier et al. 2023; Ge et al. 2024), achieving
      much higher compression rates. Recent methods such as OSCAR (Louis et al. 2026)
      jointly produce passage representations and relevance scores in one pass, using
      scores only to order or discard passages, after which every retained document
      receives the same number of memory tokens. This binary allocation is suboptimal
      when passage utility is graded. Thus, the key question is not only whichdocumentstoretain,
      but how to distribute a fixed memory budget among documents with heterogeneous
      utility.\nThis setting also exposes an important limitation of prevailing evaluation
      protocols for soft-compressed RAG. Open-domain QA benchmarks typically provide
      questionanswer supervision rather than exhaustive utility annotations for every
      document in a retrieved candidate pool (Kwiatkowski et al. 2019; Joshi et al.
      2017; Mallen et al. 2023), while soft-compression models are commonly trained
      and evaluated on relatively small retrieved sets (Cheng et al. 2024; Louis,
      D\u00e9jean, and Clinchant 2025; Louis et al. 2026). Because small topk pools
      contain few candidates and exclude most lower-ranked retrievals, they expose
      models to fewer marginal and irrelevant passages and a narrower range of passage
      utility, making the benefits of reranking difficult to measure. In larger candidate
      pools, reranking must distinguish answer-bearing evidence from numerous marginal
      documents (Nogueira and Cho 2019; Li and Ouyang 2025), while the total representation
      budget cannot grow proportionally with the number of candidates. Evaluating
      under these conditions is therefore necessary to assess not only which documents
      should reach the generator, but also how the finite memory budget should be
      distributed among them.", "4.1 Experimental Setup\nWe evaluate on two attribution
      benchmarks with different retrieval granularities. ASQA comprises 948 ambiguous
      factoid questions from the ALCE release (Gao et al., 2023), each paired with
      the top-5 GTR-retrieved passages, sentencesegmented into citable snippets; answer
      quality is string exact match (str-EM). QASPER (Dasigi et al., 2021) is the
      1,005-question dev split over 281 NLP papers, using each supplied paper''s abstract
      and full text. Gold evidence is paragraphlevel, so identity presents paragraphs
      as citable units while compressors operate on sentence snippets; declared sids
      map to paragraphs for setF1 against gold evidence, max over annotators. The
      generator is Qwen2.5-7B-Instruct served via vLLM with greedy decoding and ALCE-style
      numbered-context citation prompting (Gao et al., 2023). Primary entailment judgments
      use the development-grade DeBERTa NLI evaluator of \u00a73.1 at \u03c4 = 0 .
      5 . We compare six compressors: identity (no compression; documentlevel on ASQA,
      paragraph-level on QASPER), cross-encoder rerank topk (ms-marco-MiniLML-6-v2),
      embedding-based extractive sentence selection (all-MiniLM-L6-v2), the RECOMP
      abstractive summarizer (NQ checkpoint) (Xu et al., 2024), LLMLingua-2 token
      pruning (Pan et al., 2024), and our extract-cluster-rewrite (ECR) variant, which
      ranks sentences, greedily clusters nearduplicates by Jaccard word overlap (threshold
      0.5, with a negation guard), and emits one unit per cluster-the highest-relevance
      member sentence verbatim-citing all member sentence ids. Although LLMLingua-2
      prunes tokens verbatim, its output is a token stream with no unit-level sid
      mapping in our pipeline, so it declares no provenance and is scored with the
      no-provenance family alongside RECOMP. Each compressor runs at nominal budgets
      { 0 . 5 , 0 . 25 , 0 . 1 , 0 . 05 } of the retrieved context, enforced in generator-tokenizer
      tokens. Because compressors do not reliably hit their nominal budgets, the frontier
      figures and primary summary tables report the achieved ratio: RECOMP''s summary
      length is nearly budget-independent, saturating at achieved ratios of 0.05-0.08
      on ASQA and \u2248 0.015 on QASPER across all four nominal budgets. All primary
      comparisons use the same successful questions across all 21 settings: 944 on
      ASQA and 976 from 271 papers on QASPER. Only identity has failures: 4 budget-check
      failures on ASQA, and 15 budget-check plus 14 promptoverflow failures on QASPER;
      their question IDs are excluded from every primary setting. Fullcohort descriptive
      aggregates remain available in the evaluation artifacts.", "This is a set of
      three line/scatter plots comparing context compression methods for retrieval-augmented
      generation, evaluated across three metrics: Grounded citation precision, Grounded
      citation recall, and Answer correctness (str-EM), each plotted against \"Achieved
      context fraction\" (x-axis, reversed scale from 1.0 to 0.0) on the y-axis from
      0.0 to 1.0 (or 0.35 for the third plot).\n\nThe methods compared include Identity
      (full context, green dot baseline), Rerank top-k (brown), Extractive (orange),
      ECR (blue), RECOMP (purple diamond), and LLMLingua-2 (red). Across all three
      metrics, Rerank top-k and ECR tend to achieve the best performance at moderate
      context fractions (0.4-0.7), while LLMLingua-2 consistently underperforms with
      the lowest precision and recall scores, and RECOMP achieves relatively higher
      answer correctness at very low context fractions.", "Query-Conditioned Compression
      and Adaptive Allocation. For each query-passage pair, we form\nwhere \u03b3
      is the distortion decay rate and \u03c3 the spread of the log-utilities (Appendix
