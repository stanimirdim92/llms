        What the control changes\\nTable 3: What the no-planting control changes,
        for the baseline model. Planted and Control are cited records over all records
        ( k/n ); Attr. is the attributable rate in pp (Eq. 1). For CITED-OTHER the
        control is 100%, and the attributable rate is negative (all 95% CIs exclude
        0).\\n\\nREL-UNCITED (claim-aligned), Planted = REL-UNCITED (claim-aligned).
        REL-UNCITED (claim-aligned), Control = REL-UNCITED (claim-aligned). REL-UNCITED
        (claim-aligned), Attr. = REL-UNCITED (claim-aligned). NQ, Planted = 52/371.
