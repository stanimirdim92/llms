        RLVR does not make citations more faithful\\nRaw rates alone cannot answer
        the RL question, since a model could post-rationalize heavily and still be
        no worse than the model it came from. Table 5 therefore reports the difference-indifferences:
        each agent's attributable rate minus its base model's, on the same dataset.
        If RLVR taught these agents anything about grounding, this column would run
        negative.\",\"metadata\":{\"ingestion_version\":\"01a0fc55257f7276be70b7b3d1501b36\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6-text-0018\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6\",\"chunk_type\":\"text\",\"section_path\":\"5.3
        RLVR does not make citations more faithful\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":90,\"page_no\":6,\"filename\":\"2609.23053v1.pdf\"}}},{\"id\":\"dec2d78a-c8ba-509b-9409-5f44d1c07f13\",\"version\":15,\"score\":0.27637365,\"payload\":{\"page_content\":\"4
        Experimental Setup\\nLeakage drove the dataset choice. NQ is where the original
        probe ran, so we keep it for comparability, but Search-R1 trained on NQ's
        training split and we say so plainly. QAMPARI, HAGRID, and RAGTruth were not
        used to train any of the three agents, so on those datasets no gap can be
        waved away as familiarity with the data. They also sidestep a retrieval quirk
        in NQ: for 186 of 499 NQquestions (37.3%), all five passages come from one
        document, which leaves the model almost no choice about what to cite. The
        other three datasets have no such questions.\\nPrompt and generation. One
        prompt does all the work, byte-identical across models and across the clean
        and doctored runs. It tells the model to answer using only the numbered passages,
        to close every sentence with exactly one citation such as [2], and to reply
        'I don't know' when the passages fall short. Decoding is greedy, capped at
        300 new tokens. When any sentence of an answer breaks the one-citation rule
        we drop the whole answer rather than salvage the compliant half, because a
        partly rescued answer reintroduces the claim-to-citation ambiguity the format
        exists to prevent. Models differ sharply in how often they abstain, from 15%
        to 52% of questions; Appendix C takes that apart. The full prompt is in Appendix
        A.\\nReading our numbers. Three statistical choices shape every result, and
        each has a plain reason behind it.\\nWe resample questions, not claims. A
        single question yields up to seven claims that share one context and one generated
        answer, so treating claims as independent would make our intervals look tighter
        than they are. We use a cluster bootstrap instead: draw whole questions with
        replacement 2,000 times, recompute the planted and control conditions on the
        same draw so the pairing survives, and read off the 2.5th and 97.5th percentiles.
        Every 95% confidence interval in this paper is that band, the range of effects
        our data are consistent with.\\nWe compare each agent against its own base.
        Post-rationalization is common in the baseline, so reporting that an agent
        post-rationalizes tells us nothing about RL. The question is whether an agent
        diverges from the model it was trained from. That calls for a difference-in-differences:
        take the plantversus-control difference within a model (Equation 1), then
        difference those differences across models,\\n<!-- formula-not-decoded -->\\nNegative
        says RLVR made citations more faithful, positive says it made them worse,
        and zero says training left this behavior alone. Within each dataset we test
        all three agents against the baseline and correct the three comparisons with
        the Holm method, so that running three tests does not manufacture a significant
        one.\",\"metadata\":{\"ingestion_version\":\"01a0fc55257f7276be70b7b3d1501b36\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6-text-0011\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6\",\"chunk_type\":\"text\",\"section_path\":\"4
        Experimental Setup\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":64,\"page_no\":4,\"filename\":\"2609.23053v1.pdf\"}}},{\"id\":\"c5b0c05c-2e66-5f5c-a0f2-124748f30408\",\"version\":15,\"score\":0.2630593,\"payload\":{\"page_content\":\"Answer
        (after planting):\\n- A no-planting control as an improvement to the existing
        methodology , to get a more accurate idea about post-rationalization.\\n-
        The first controlled measurement of postrationalization in RLVR search agents
        , holding the base model, retrieval corpus, prompt, and scorer fixed across
        four datasets.\\n- Evidence that answer-only rewards leave citation faithfulness
        exactly where they found it , with a stated detection bound, plus a concrete
        proposal for folding attribution into the reward.\\n- A full reproduction
        on free-tier hardware , replacing the 104B Command R+ model of the original
        study with an open 7B model on two T4s.\",\"metadata\":{\"ingestion_version\":\"01a0fc55257f7276be70b7b3d1501b36\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6-text-0005\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6\",\"chunk_type\":\"text\",\"section_path\":\"Answer
        (after planting):\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":26,\"page_no\":2,\"filename\":\"2609.23053v1.pdf\"}}},{\"id\":\"1b6efed0-8026-5a1b-897c-993603f6de43\",\"version\":15,\"score\":0.25846726,\"payload\":{\"page_content\":\"5.2
        Post-rationalization is common\\nTable 4 gives the attributable rate on REL-UNCITED
        for every model and dataset. Start with the baseline column: 14.0% on NQ,
        9.1% on QAMPARI, 14.8% on HAGRID, 2.9% on RAGTruth, with confidence intervals
        of [10.4, 17.8], [6.2, 12.0], [11.8, 18.2] and [1.8, 3.9] that all sit clear
        of zero. This clears the bar we set in advance, at least 8pp with an interval
        excluding zero on three of four datasets. On the Wikipedia-based datasets
        that rate means roughly one cited sentence in seven points at a passage whose
        only tie to the claim is four words we pasted in. Pooling across datasets
        gives 10.7%. 1\\nTable 4: How often each model follows the planted span: attributable
        rate on REL-UNCITED in %, with cited records over all records below. The control
        is 0 in every cell, so these equal the raw rates. Baseline 95% CIs: NQ [10.4,
        17.8], QAMPARI [6.2, 12.0], HAGRID [11.8, 18.2], RAGTruth [1.8, 3.9].\\n\\nNQ,
        Baseline = 14.0 52/371. NQ, Search-R1 = 12.8 36/281. NQ, ReSearch = 14.1 50/355.
        NQ, R-Search = 14.7 57/387. QAMPARI, Baseline = 9.1 29/319. QAMPARI, Search-R1
        = 13.4 38/283. QAMPARI, ReSearch = 7.5 25/332. QAMPARI, R-Search = 12.2 43/352.
        HAGRID, Baseline = 14.8 64/433. HAGRID, Search-R1 = 13.8 53/383. HAGRID, ReSearch
        = 13.6 59/434. HAGRID, R-Search = 18.6 80/430. RAGTruth, Baseline = 2.9 25/864.
        RAGTruth, Search-R1 = 4.1 29/699. RAGTruth, ReSearch = 3.6 30/823. RAGTruth,
        R-Search = 5.9 52/879\\nNow read across the rows. On NQ the four models land
        at 14.0, 12.8, 14.1, and 14.7%. On HAGRID, 14.8, 13.8, 13.6, and 18.6%. On
        RAGTruth, 2.9, 4.1, 3.6, and 5.9%. The agents track their base model, not
        each other's training recipes, and all sixteen cells sit far above zero. Post-rationalization
        is not something RL introduced; it is already there in the instruction-tuned
        model and it survives everything done on top.\\n1 Pooling was not part of
        our pre-registered plan, so treat this number as exploratory.\",\"metadata\":{\"ingestion_version\":\"01a0fc55257f7276be70b7b3d1501b36\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6-text-0016\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6\",\"chunk_type\":\"text\",\"section_path\":\"5.2
        Post-rationalization is common\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":83,\"page_no\":6,\"filename\":\"2609.23053v1.pdf\"}}},{\"id\":\"8c166fb5-399b-59e9-a610-789ac782c808\",\"version\":15,\"score\":0.25750443,\"payload\":{\"page_content\":\"3.2
        What counts as citing the planted passage\\nThe re-run answer may be worded
        differently, so we first locate the sentence that best matches the original
        claim by word overlap (Jaccard similarity of at least 0.3), then ask whether
        that sentence cites the doctored passage. This is our claim-aligned outcome,
        and the pairing carries the weight: it asks whether the model cited the planted
        passage for the claim we planted into , not whether the marker turns up loose
        somewhere in the answer. We keep the looser cited-anywhere outcome as a sensitivity
        check, and Section 5.1 shows how much slack it introduces.\\nWe score every
        record, with no filtering on whether the planted span reappears in the new
        answer. The original probe conditions on exactly that, and our control shows
        why it should not: with nothing planted at all, those four words come back
        in 60-74% of answers, simply because the model wrote them in the first place.
        Span recovery tells us the model repeated itself, not that our plant did anything.\",\"metadata\":{\"ingestion_version\":\"01a0fc55257f7276be70b7b3d1501b36\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6-text-0008\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6\",\"chunk_type\":\"text\",\"section_path\":\"3.2
        What counts as citing the planted passage\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":46,\"page_no\":3,\"filename\":\"2609.23053v1.pdf\"}}},{\"id\":\"f5a9caf9-6efb-5456-85d5-a98735962450\",\"version\":15,\"score\":0.25313026,\"payload\":{\"page_content\":\"3.1
        The planting probe\\nWe follow the probe of Wallat et al. (2025), which runs
        in three steps.\\n1. Answer. The model answers a question from five retrieved
        passages. Every sentence ends with exactly one citation, so each sentence
        and its marker form one claim .\\n2. Plant. We lift a short span out of the
        claim and append it to a passage the model did not cite for that claim, then
        re-run the same model on the doctored context with the same prompt.\\n3. Check.
        We ask whether the model now cites the doctored passage for that claim.\\nThe
        logic is a swap test. The doctored passage shares nothing with the claim except
        the words we pasted into it, and the passage the model originally cited never
        leaves the context. A model that reads for meaning has no reason to move.
        A model that matches surface strings has every reason to, and when it moves,
        its citation was never evidence of where the answer came from.\\nTable 1 lists
        the three variants, which differ only in which passage receives the span.
        REL-UNCITED plants in a passage the retriever returned and the model ignored,
        the situation a deployed system meets constantly, and it is our main measure.\\nREL-UNCITED,
        Where the span is planted = A retrieved passage that the answer did not cite..
        CITED-OTHER, Where the span is planted = Apassage the answer already cites,
        but for a different sentence.. RANDOM, Where the span is planted = An uncited
        slot, after replacing its passage with one from a different question.\\nTable
        1: The three probe variants. Each changes exactly one of the five retrieved
        passages, and the passage that genuinely supports the claim stays in the context.
        RELUNCITED is our main measure.\\nChoosing the span. The original probe leaned
        on Command R+, which marks the exact words it grounds on. Qwen2.5 offers no
        such markup, so we need a rule, and we keep it blunt and deterministic: the
        four consecutive words of the claim with the most characters. This decision
        was influenced by Wallat et al. (2025). We played around with 2-4 words for
        the span and choosing four words minimized bias.\",\"metadata\":{\"ingestion_version\":\"01a0fc55257f7276be70b7b3d1501b36\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6-text-0007\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6\",\"chunk_type\":\"text\",\"section_path\":\"3.1
        The planting probe\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":36,\"page_no\":2,\"filename\":\"2609.23053v1.pdf\"}}},{\"id\":\"a9d96eb0-e563-5a4a-be72-fdfa293a765e\",\"version\":15,\"score\":0.24722318,\"payload\":{\"page_content\":\"4
        Experimental Setup\\nWe know what size of effect we could have caught. Our
        sample sizes give 80% power to detect a difference of roughly 7 percentage
        points (pp). Plainly: had RLVR moved post-rationalization by 7pp or more in
        either direction, this design would almost certainly have caught it. Shifts
        of a couple of points stay inside our blind spot, which is why we report a
        bounded null rather than a flat absence of effect. We fixed the primary outcome
        and the family of corrected comparisons in writing before the scorer ran.\\nCompute.
        Everything ran on Kaggle's free tier, two T4s or a single P100 per session:
        48 GPU jobs yielding 36,690 scored records across four models, four datasets,
        three variants, and both conditions. The original study used a 104B model;
        the controlled version of the same measurement fits on hardware anyone can
        get for free, and that is the part we would most like other groups to borrow.\",\"metadata\":{\"ingestion_version\":\"01a0fc55257f7276be70b7b3d1501b36\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6-text-0012\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6\",\"chunk_type\":\"text\",\"section_path\":\"4
        Experimental Setup\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":71,\"page_no\":5,\"filename\":\"2609.23053v1.pdf\"}}},{\"id\":\"e4f212a2-fbfb-51f3-8efa-31d1e740f21a\",\"version\":15,\"score\":0.24352044,\"payload\":{\"page_content\":\"7
        Conclusion\\nWe asked whether training RAG search agents for correct answers
        also teaches them to cite honestly under fixed-context inference. We find
        no detectable improvement. Getting to that answer meant repairing the measurement
        first: we reproduced the planting probe of Wallat et al. (2025) on an open
        7B model, added the no-planting control it lacked, and showed that the control
        is 0 by construction for the main variant, 100% for another, and a small measured
        quantity for the third. With that in hand, post-rationalization turns out
        to be common in an instruction-tuned model, roughly one cited sentence in
        seven on Wikipedia-based questions, and three RLVR agents trained from that
        model reproduce its rate, with one landing slightly worse. Faithful citation
        is not a side effect of answer accuracy. It has to be rewarded, measured,
        and reported on its own, and the probe we describe here is cheap enough to
        do all three inside an existing training loop.\",\"metadata\":{\"ingestion_version\":\"01a0fc55257f7276be70b7b3d1501b36\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6-text-0024\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6\",\"chunk_type\":\"text\",\"section_path\":\"7
