        What the control changes\\nREL-UNCITED: the raw rate survives untouched. Read
        the top block: 52 of 371 NQ claims follow the plant, and 0 of those same 371
        records cite the doctored passage when we take the span away. The control
        column is 0/ n on all four datasets, which is what Section 3.3 predicted,
        because removing four appended words restores the clean context exactly and
        the clean answer never cited that passage for that claim. Prediction and measurement
        agree, so +14.0pp on NQ is not a raw rate that needs an asterisk; it is the
        attributable effect.\\nRANDOM: the control is real but tiny. Swapping in a
        passage from an unrelated question does occasionally earn a citation on its
        own, as the 4/433 on HAGRID and 1/864 on RAGTruth show, but the effect is
        small: 0.2% pooled across the 7,625 control records, with 7 of 16 model-dataset
        cells at exactly zero and the rest between 0.1% and 0.9% (Appendix D). Between
        83% and 100% of each raw rate survives as attributable, 97% on average. The
        confound we built this control to catch turned out to be genuine and negligible,
        which is worth knowing precisely because we could not have assumed it.\\nCITED-OTHER:
        the raw rate lies, and the control catches it. The bottom block is the reason
        we care about all this. Planted rates run from 78.9% to 89.6%, many times
        the REL-UNCITED rates, and any paper could report them as evidence of rampant
        post-rationalization. The control column explains them away: 69/69, 123/123,
        61/61, 623/623. Every single control record cites the doctored passage, because
        this variant selects a passage the clean answer already cited elsewhere. Subtract,
        and the attributable effect is negative on all four datasets, from -10.4pp
        to -21.1pp, with intervals that exclude zero. A raw rate of 79-90% here measures
        our sampling rule and nothing else. Under the stricter claim-aligned outcome
        the same records do show genuine post-rationalization, +10.6 to +19.7pp (Appendix
        D), though only RAGTruth has enough questions to pin it down.\\nThe moral
        generalizes past this probe: whenever a measurement edits an input and counts
        how often the output changes, report the unedited baseline, and demonstrate
        rather than assume that it is zero.\",\"metadata\":{\"ingestion_version\":\"01a0fc55257f7276be70b7b3d1501b36\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6-text-0015\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6\",\"chunk_type\":\"text\",\"section_path\":\"5.1
