    body: '{"query": "Why is the no-planting control zero by construction for the
      REL-UNCITED variant?", "documents": ["3.3 The no-planting control\nWallat et
      al. (2025) report raw planted rates. A raw rate answers ''how often does the
      model cite the doctored passage?'' What we need is ''how much of that did the
      plant cause?'' The two come apart whenever editing the context does anything
      on its own, and a raw rate quietly credits the plant with all of it.\nThe fix
      is to run the same context with the span removed and subtract:\n<!-- formula-not-decoded
      -->\nRead Equation 1 as a before-and-after over the same records. The first
      term counts how often the model takes the bait; the second counts how often
      it would have cited that passage anyway; the difference is what the plant actually
      bought.\nWhat makes this control unusual is that we could derive two of its
      three values before spending a single GPU-hour, just by reading how each variant
      is built.\nREL-UNCITED: the control is 0 by construction. Planting here only
      appends words to a passage already sitting in the context. Delete them and the
      context is byte-for-byte the clean one; with an identical prompt and greedy
      decoding, the control run reproduces the clean answer exactly. That clean answer,
      by the very rule that selected this passage, did not cite it for this claim.
      The control rate is therefore 0 as a matter of definition rather than measurement,
      and the raw rate already is the attributable rate. We verified the byte-for-byte
      claim on all 10,720 records of the two appending variants; 6 score above zero,
      all from RAGTruth answers that repeat an identical sentence.\nCITED-OTHER: the
      control is 100%, so a raw rate is an illusion. This variant plants in a passage
      the clean answer already cites for some other sentence. Under the cited-anywhere
      outcome we are then asking whether a passage that was cited stays cited, and
      it does, by selection. A raw rate here describes our sampling rule, not the
      model''s behavior, which is exactly why the attributable rate turns negative
      in Section 5.1.\nRANDOM: the control has to be measured. Here we swap an uncited
      slot for a passage drawn from a different question, then plant in it. Two things
      change at once, the passage and the span, and no amount of reasoning tells us
      how often a model cites an out-of-place passage on its own. This is the one
      variant that needed fresh runs: 16 GPU jobs, roughly 10 GPU-hours, and 7,625
      control records, each paired with its planted twin. The answer came back small.
      With no plant, models cite the foreign passage in 17 of 7,625 records, or 0.2%.",
      "5.1 What the control changes\nTable 3 sets the planted and control rates side
      by side for the baseline model, and the three variants could hardly behave more
      differently.", "5.1 What the control changes\nTable 3: What the no-planting
      control changes, for the baseline model. Planted and Control are cited records
      over all records ( k/n ); Attr. is the attributable rate in pp (Eq. 1). For
      CITED-OTHER the control is 100%, and the attributable rate is negative (all
      95% CIs exclude 0).\n\nREL-UNCITED (claim-aligned), Planted = REL-UNCITED (claim-aligned).
      REL-UNCITED (claim-aligned), Control = REL-UNCITED (claim-aligned). REL-UNCITED
      (claim-aligned), Attr. = REL-UNCITED (claim-aligned). NQ, Planted = 52/371.
      NQ, Control = 0/371. NQ, Attr. = +14.0. QAMPARI, Planted = 29/319. QAMPARI,
      Control = 0/319. QAMPARI, Attr. = +9.1. HAGRID, Planted = 64/433. HAGRID, Control
      = 0/433. HAGRID, Attr. = +14.8. RAGTruth, Planted = 25/864. RAGTruth, Control
      = 0/864. RAGTruth, Attr. = +2.9. RANDOM (claim-aligned), Planted = RANDOM (claim-aligned).
      RANDOM (claim-aligned), Control = RANDOM (claim-aligned). RANDOM (claim-aligned),
      Attr. = RANDOM (claim-aligned). NQ, Planted = 40/371. NQ, Control = 0/371. NQ,
      Attr. = +10.8. QAMPARI, Planted = 14/319. QAMPARI, Control = 0/319. QAMPARI,
      Attr. = +4.4. HAGRID, Planted = 37/433. HAGRID, Control = 4/433. HAGRID, Attr.
      = +7.6. RAGTruth, Planted = 19/864. RAGTruth, Control = 1/864. RAGTruth, Attr.
      = +2.1. CITED-OTHER (cited-anywhere), Planted = CITED-OTHER (cited-anywhere).
      CITED-OTHER (cited-anywhere), Control = CITED-OTHER (cited-anywhere). CITED-OTHER
      (cited-anywhere), Attr. = CITED-OTHER (cited-anywhere). NQ, Planted = 58/69.
      NQ, Control = 69/69. NQ, Attr. = - 15.9. QAMPARI, Planted = 97/123. QAMPARI,
      Control = 123/123. QAMPARI, Attr. = - 21.1. HAGRID, Planted = 50/61. HAGRID,
      Control = 61/61. HAGRID, Attr. = - 18.0. RAGTruth, Planted = 558/623. RAGTruth,
      Control = 623/623. RAGTruth, Attr. = - 10.4", "Table 3: What the no-planting
      control changes, for the baseline model. Planted and Control are cited records
      over all records ( k/n ); Attr. is the attributable rate in pp (Eq. 1). For
      CITED-OTHER the control is 100%, and the attributable rate is negative (all
      95% CIs exclude 0).\n\n| Dataset                      | Planted                      |
      Control                      | Attr.                        |\n|------------------------------|------------------------------|------------------------------|------------------------------|\n|
      REL-UNCITED (claim-aligned)  | REL-UNCITED (claim-aligned)  | REL-UNCITED (claim-aligned)  |
      REL-UNCITED (claim-aligned)  |\n| NQ                           | 52/371                       |
      0/371                        | +14.0                        |\n| QAMPARI                      |
      29/319                       | 0/319                        | +9.1                         |\n|
      HAGRID                       | 64/433                       | 0/433                        |
      +14.8                        |\n| RAGTruth                     | 25/864                       |
      0/864                        | +2.9                         |\n| RANDOM (claim-aligned)       |
      RANDOM (claim-aligned)       | RANDOM (claim-aligned)       | RANDOM (claim-aligned)       |\n|
      NQ                           | 40/371                       | 0/371                        |
      +10.8                        |\n| QAMPARI                      | 14/319                       |
      0/319                        | +4.4                         |\n| HAGRID                       |
      37/433                       | 4/433                        | +7.6                         |\n|
      RAGTruth                     | 19/864                       | 1/864                        |
      +2.1                         |\n| CITED-OTHER (cited-anywhere) | CITED-OTHER
      (cited-anywhere) | CITED-OTHER (cited-anywhere) | CITED-OTHER (cited-anywhere)
      |\n| NQ                           | 58/69                        | 69/69                        |
      - 15.9                       |\n| QAMPARI                      | 97/123                       |
      123/123                      | - 21.1                       |\n| HAGRID                       |
      50/61                        | 61/61                        | - 18.0                       |\n|
      RAGTruth                     | 558/623                      | 623/623                      |
      - 10.4                       |", "5.1 What the control changes\nREL-UNCITED:
      the raw rate survives untouched. Read the top block: 52 of 371 NQ claims follow
      the plant, and 0 of those same 371 records cite the doctored passage when we
      take the span away. The control column is 0/ n on all four datasets, which is
      what Section 3.3 predicted, because removing four appended words restores the
      clean context exactly and the clean answer never cited that passage for that
      claim. Prediction and measurement agree, so +14.0pp on NQ is not a raw rate
      that needs an asterisk; it is the attributable effect.\nRANDOM: the control
      is real but tiny. Swapping in a passage from an unrelated question does occasionally
      earn a citation on its own, as the 4/433 on HAGRID and 1/864 on RAGTruth show,
      but the effect is small: 0.2% pooled across the 7,625 control records, with
      7 of 16 model-dataset cells at exactly zero and the rest between 0.1% and 0.9%
      (Appendix D). Between 83% and 100% of each raw rate survives as attributable,
      97% on average. The confound we built this control to catch turned out to be
      genuine and negligible, which is worth knowing precisely because we could not
      have assumed it.\nCITED-OTHER: the raw rate lies, and the control catches it.
      The bottom block is the reason we care about all this. Planted rates run from
      78.9% to 89.6%, many times the REL-UNCITED rates, and any paper could report
      them as evidence of rampant post-rationalization. The control column explains
      them away: 69/69, 123/123, 61/61, 623/623. Every single control record cites
      the doctored passage, because this variant selects a passage the clean answer
      already cited elsewhere. Subtract, and the attributable effect is negative on
      all four datasets, from -10.4pp to -21.1pp, with intervals that exclude zero.
      A raw rate of 79-90% here measures our sampling rule and nothing else. Under
      the stricter claim-aligned outcome the same records do show genuine post-rationalization,
      +10.6 to +19.7pp (Appendix D), though only RAGTruth has enough questions to
      pin it down.\nThe moral generalizes past this probe: whenever a measurement
      edits an input and counts how often the output changes, report the unedited
      baseline, and demonstrate rather than assume that it is zero.", "| Dataset   |
      Planted   | Control   |   Attr. | 95% CI       |\n|-----------|-----------|-----------|---------|--------------|\n|
      NQ        | 9/69      | 0/69      |   +13.0 | [5.5, 22.5]  |\n| QAMPARI   |
      16/123    | 0/123     |   +13.0 | [7.3, 19.7]  |\n| HAGRID    | 12/61     |
      0/61      |   +19.7 | [10.8, 31.3] |\n| RAGTruth  | 67/623    | 1/623     |   +10.6
      | [7.9, 13.5]  |", "| Variant     | Where the span is planted                                                        |\n|-------------|----------------------------------------------------------------------------------|\n|
      REL-UNCITED | A retrieved passage that the answer did not cite.                                |\n|
      CITED-OTHER | Apassage the answer already cites, but for a different sentence.                 |\n|
      RANDOM      | An uncited slot, after replacing its passage with one from a different
      question. |", "5.3 RLVR does not make citations more faithful\nRaw rates alone
      cannot answer the RL question, since a model could post-rationalize heavily
      and still be no worse than the model it came from. Table 5 therefore reports
      the difference-indifferences: each agent''s attributable rate minus its base
      model''s, on the same dataset. If RLVR taught these agents anything about grounding,
      this column would run negative.", "4 Experimental Setup\nLeakage drove the dataset
      choice. NQ is where the original probe ran, so we keep it for comparability,
      but Search-R1 trained on NQ''s training split and we say so plainly. QAMPARI,
      HAGRID, and RAGTruth were not used to train any of the three agents, so on those
      datasets no gap can be waved away as familiarity with the data. They also sidestep
      a retrieval quirk in NQ: for 186 of 499 NQquestions (37.3%), all five passages
      come from one document, which leaves the model almost no choice about what to
      cite. The other three datasets have no such questions.\nPrompt and generation.
      One prompt does all the work, byte-identical across models and across the clean
      and doctored runs. It tells the model to answer using only the numbered passages,
      to close every sentence with exactly one citation such as [2], and to reply
      ''I don''t know'' when the passages fall short. Decoding is greedy, capped at
      300 new tokens. When any sentence of an answer breaks the one-citation rule
      we drop the whole answer rather than salvage the compliant half, because a partly
      rescued answer reintroduces the claim-to-citation ambiguity the format exists
      to prevent. Models differ sharply in how often they abstain, from 15% to 52%
      of questions; Appendix C takes that apart. The full prompt is in Appendix A.\nReading
      our numbers. Three statistical choices shape every result, and each has a plain
      reason behind it.\nWe resample questions, not claims. A single question yields
      up to seven claims that share one context and one generated answer, so treating
      claims as independent would make our intervals look tighter than they are. We
      use a cluster bootstrap instead: draw whole questions with replacement 2,000
      times, recompute the planted and control conditions on the same draw so the
      pairing survives, and read off the 2.5th and 97.5th percentiles. Every 95% confidence
      interval in this paper is that band, the range of effects our data are consistent
      with.\nWe compare each agent against its own base. Post-rationalization is common
      in the baseline, so reporting that an agent post-rationalizes tells us nothing
      about RL. The question is whether an agent diverges from the model it was trained
      from. That calls for a difference-in-differences: take the plantversus-control
      difference within a model (Equation 1), then difference those differences across
      models,\n<!-- formula-not-decoded -->\nNegative says RLVR made citations more
      faithful, positive says it made them worse, and zero says training left this
      behavior alone. Within each dataset we test all three agents against the baseline
      and correct the three comparisons with the Holm method, so that running three
      tests does not manufacture a significant one.", "Answer (after planting):\n-
      A no-planting control as an improvement to the existing methodology , to get
      a more accurate idea about post-rationalization.\n- The first controlled measurement
      of postrationalization in RLVR search agents , holding the base model, retrieval
      corpus, prompt, and scorer fixed across four datasets.\n- Evidence that answer-only
      rewards leave citation faithfulness exactly where they found it , with a stated
      detection bound, plus a concrete proposal for folding attribution into the reward.\n-
      A full reproduction on free-tier hardware , replacing the 104B Command R+ model
      of the original study with an open 7B model on two T4s.", "5.2 Post-rationalization
      is common\nTable 4 gives the attributable rate on REL-UNCITED for every model
      and dataset. Start with the baseline column: 14.0% on NQ, 9.1% on QAMPARI, 14.8%
      on HAGRID, 2.9% on RAGTruth, with confidence intervals of [10.4, 17.8], [6.2,
      12.0], [11.8, 18.2] and [1.8, 3.9] that all sit clear of zero. This clears the
      bar we set in advance, at least 8pp with an interval excluding zero on three
      of four datasets. On the Wikipedia-based datasets that rate means roughly one
      cited sentence in seven points at a passage whose only tie to the claim is four
      words we pasted in. Pooling across datasets gives 10.7%. 1\nTable 4: How often
      each model follows the planted span: attributable rate on REL-UNCITED in %,
      with cited records over all records below. The control is 0 in every cell, so
      these equal the raw rates. Baseline 95% CIs: NQ [10.4, 17.8], QAMPARI [6.2,
      12.0], HAGRID [11.8, 18.2], RAGTruth [1.8, 3.9].\n\nNQ, Baseline = 14.0 52/371.
      NQ, Search-R1 = 12.8 36/281. NQ, ReSearch = 14.1 50/355. NQ, R-Search = 14.7
      57/387. QAMPARI, Baseline = 9.1 29/319. QAMPARI, Search-R1 = 13.4 38/283. QAMPARI,
      ReSearch = 7.5 25/332. QAMPARI, R-Search = 12.2 43/352. HAGRID, Baseline = 14.8
      64/433. HAGRID, Search-R1 = 13.8 53/383. HAGRID, ReSearch = 13.6 59/434. HAGRID,
      R-Search = 18.6 80/430. RAGTruth, Baseline = 2.9 25/864. RAGTruth, Search-R1
      = 4.1 29/699. RAGTruth, ReSearch = 3.6 30/823. RAGTruth, R-Search = 5.9 52/879\nNow
      read across the rows. On NQ the four models land at 14.0, 12.8, 14.1, and 14.7%.
      On HAGRID, 14.8, 13.8, 13.6, and 18.6%. On RAGTruth, 2.9, 4.1, 3.6, and 5.9%.
      The agents track their base model, not each other''s training recipes, and all
      sixteen cells sit far above zero. Post-rationalization is not something RL introduced;
      it is already there in the instruction-tuned model and it survives everything
      done on top.\n1 Pooling was not part of our pre-registered plan, so treat this
      number as exploratory.", "3.2 What counts as citing the planted passage\nThe
      re-run answer may be worded differently, so we first locate the sentence that
      best matches the original claim by word overlap (Jaccard similarity of at least
      0.3), then ask whether that sentence cites the doctored passage. This is our
      claim-aligned outcome, and the pairing carries the weight: it asks whether the
      model cited the planted passage for the claim we planted into , not whether
      the marker turns up loose somewhere in the answer. We keep the looser cited-anywhere
      outcome as a sensitivity check, and Section 5.1 shows how much slack it introduces.\nWe
      score every record, with no filtering on whether the planted span reappears
      in the new answer. The original probe conditions on exactly that, and our control
      shows why it should not: with nothing planted at all, those four words come
      back in 60-74% of answers, simply because the model wrote them in the first
      place. Span recovery tells us the model repeated itself, not that our plant
      did anything.", "3.1 The planting probe\nWe follow the probe of Wallat et al.
      (2025), which runs in three steps.\n1. Answer. The model answers a question
      from five retrieved passages. Every sentence ends with exactly one citation,
      so each sentence and its marker form one claim .\n2. Plant. We lift a short
      span out of the claim and append it to a passage the model did not cite for
      that claim, then re-run the same model on the doctored context with the same
      prompt.\n3. Check. We ask whether the model now cites the doctored passage for
      that claim.\nThe logic is a swap test. The doctored passage shares nothing with
      the claim except the words we pasted into it, and the passage the model originally
      cited never leaves the context. A model that reads for meaning has no reason
      to move. A model that matches surface strings has every reason to, and when
      it moves, its citation was never evidence of where the answer came from.\nTable
      1 lists the three variants, which differ only in which passage receives the
      span. REL-UNCITED plants in a passage the retriever returned and the model ignored,
      the situation a deployed system meets constantly, and it is our main measure.\nREL-UNCITED,
      Where the span is planted = A retrieved passage that the answer did not cite..
      CITED-OTHER, Where the span is planted = Apassage the answer already cites,
      but for a different sentence.. RANDOM, Where the span is planted = An uncited
      slot, after replacing its passage with one from a different question.\nTable
      1: The three probe variants. Each changes exactly one of the five retrieved
      passages, and the passage that genuinely supports the claim stays in the context.
      RELUNCITED is our main measure.\nChoosing the span. The original probe leaned
      on Command R+, which marks the exact words it grounds on. Qwen2.5 offers no
      such markup, so we need a rule, and we keep it blunt and deterministic: the
      four consecutive words of the claim with the most characters. This decision
      was influenced by Wallat et al. (2025). We played around with 2-4 words for
      the span and choosing four words minimized bias.", "4 Experimental Setup\nWe
      know what size of effect we could have caught. Our sample sizes give 80% power
      to detect a difference of roughly 7 percentage points (pp). Plainly: had RLVR
      moved post-rationalization by 7pp or more in either direction, this design would
      almost certainly have caught it. Shifts of a couple of points stay inside our
      blind spot, which is why we report a bounded null rather than a flat absence
      of effect. We fixed the primary outcome and the family of corrected comparisons
      in writing before the scorer ran.\nCompute. Everything ran on Kaggle''s free
      tier, two T4s or a single P100 per session: 48 GPU jobs yielding 36,690 scored
      records across four models, four datasets, three variants, and both conditions.
      The original study used a 104B model; the controlled version of the same measurement
      fits on hardware anyone can get for free, and that is the part we would most
      like other groups to borrow.", "7 Conclusion\nWe asked whether training RAG
      search agents for correct answers also teaches them to cite honestly under fixed-context
      inference. We find no detectable improvement. Getting to that answer meant repairing
      the measurement first: we reproduced the planting probe of Wallat et al. (2025)
      on an open 7B model, added the no-planting control it lacked, and showed that
      the control is 0 by construction for the main variant, 100% for another, and
      a small measured quantity for the third. With that in hand, post-rationalization
      turns out to be common in an instruction-tuned model, roughly one cited sentence
      in seven on Wikipedia-based questions, and three RLVR agents trained from that
      model reproduce its rate, with one landing slightly worse. Faithful citation
      is not a side effect of answer accuracy. It has to be rewarded, measured, and
      reported on its own, and the probe we describe here is cheap enough to do all
      three inside an existing training loop.", "Table 4: How often each model follows
      the planted span: attributable rate on REL-UNCITED in %, with cited records
      over all records below. The control is 0 in every cell, so these equal the raw
      rates. Baseline 95% CIs: NQ [10.4, 17.8], QAMPARI [6.2, 12.0], HAGRID [11.8,
      18.2], RAGTruth [1.8, 3.9].\n\n| Dataset   | Baseline    | Search-R1   | ReSearch    |
      R-Search    |\n|-----------|-------------|-------------|-------------|-------------|\n|
      NQ        | 14.0 52/371 | 12.8 36/281 | 14.1 50/355 | 14.7 57/387 |\n| QAMPARI   |
      9.1 29/319  | 13.4 38/283 | 7.5 25/332  | 12.2 43/352 |\n| HAGRID    | 14.8
      64/433 | 13.8 53/383 | 13.6 59/434 | 18.6 80/430 |\n| RAGTruth  | 2.9 25/864  |
      4.1 29/699  | 3.6 30/823  | 5.9 52/879  |", "Limitations\nEvaluation format
      differs from training. The RLVR agents were trained to search, read, and answer
      across multiple turns in their own tagged format, whereas our evaluation supplies
      five fixed passages and requests a single citation-bearing response. This was
      necessary for the controlled attribution comparison, but it may affect how the
      agents behave: for example, an agent that would normally issue another query
      may instead abstain. The large differences in abstention and format compliance
      are consistent with this possibility, although our data cannot establish the
      mechanism. An interactive evaluation would be needed to determine whether the
      attribution effect differs in the agents'' native search setting.\nWe cannot
      isolate RL itself. Each agent differs from the baseline in three ways at once:
      it was fine-tuned at all, fine-tuned on retrieval data, and fine-tuned with
      reinforcement learning. Without an arm fine-tuned on the same data without RL,
      our comparison is associational. This is the single most valuable addition a
      follow-up could make.\nSearch-R1 saw NQ in training. It was trained on NQ''s
      training split and we evaluate it on KILTNQ. QAMPARI, HAGRID, and RAGTruth are
      clean for all three agents, and R-Search''s pattern is in fact strongest away
      from NQ, but we have not quantified the overlap.\nThe span always lands at the
      end of the passage. Any positional bias in how models pick citations is therefore
      mixed in with the effect of the plant. Randomizing the injection point is the
      obvious next experiment.\nCITED-OTHER is underpowered outside RAGTruth. NQ,
      QAMPARI, and HAGRID yield only 13-43 question clusters for this variant, too
      few for intervals we would defend. RAGTruth alone is large enough.\nWhat a flag
      means. Our scorer is deterministic string matching, so each flag is exactly
      reproducible: the model cited the doctored passage for the aligned claim. Reading
      that as postrationalization is an interpretation we inherit from Wallat et al.
      (2025), and a competing reading exists. After planting, the claim''s words genuinely
      sit in the doctored passage, so citing it could be scored as obedience to ''answer
      from the passages'' rather than as unfaithfulness. Hand-checking a sample of
      flagged cases would settle how often each reading applies, and we have not done
      it.\nScope. Three RLVR agents from one line of work, one base model, English
      only, one prompt, one decoding setting. Citation behavior may well shift with
      the prompt, so our numbers describe this setup until someone varies it.", "Ethics
      Statement\nThis work uses only publicly released models and datasets. It involves
      no human subjects and no personal data. The planted spans are taken from the
      models'' own answers and are used only in offline evaluation. The work describes
      a way that citations in RAG systems can mislead readers, with the aim of making
      that failure measurable; it does not provide a method for attacking deployed
      systems. Because RLVR training is in wide use, we have tried to state the limits
      of our null result clearly so that it is not read as a stronger claim than the
      data support.", "Table 6: Planned comparisons 1-30 of 148. \u2206 : left-minus-right
