      The no-planting control\\nWallat et al. (2025) report raw planted rates. A raw
      rate answers 'how often does the model cite the doctored passage?' What we need
      is 'how much of that did the plant cause?' The two come apart whenever editing
      the context does anything on its own, and a raw rate quietly credits the plant
      with all of it.\\nThe fix is to run the same context with the span removed and
      subtract:\\n<!-- formula-not-decoded -->\\nRead Equation 1 as a before-and-after
      over the same records. The first term counts how often the model takes the bait;
      the second counts how often it would have cited that passage anyway; the difference
      is what the plant actually bought.\\nWhat makes this control unusual is that
      we could derive two of its three values before spending a single GPU-hour, just
      by reading how each variant is built.\\nREL-UNCITED: the control is 0 by construction.
      Planting here only appends words to a passage already sitting in the context.
      Delete them and the context is byte-for-byte the clean one; with an identical
      prompt and greedy decoding, the control run reproduces the clean answer exactly.
      That clean answer, by the very rule that selected this passage, did not cite
      it for this claim. The control rate is therefore 0 as a matter of definition
      rather than measurement, and the raw rate already is the attributable rate.
      We verified the byte-for-byte claim on all 10,720 records of the two appending
      variants; 6 score above zero, all from RAGTruth answers that repeat an identical
      sentence.\\nCITED-OTHER: the control is 100%, so a raw rate is an illusion.
      This variant plants in a passage the clean answer already cites for some other
      sentence. Under the cited-anywhere outcome we are then asking whether a passage
      that was cited stays cited, and it does, by selection. A raw rate here describes
      our sampling rule, not the model's behavior, which is exactly why the attributable
      rate turns negative in Section 5.1.\\nRANDOM: the control has to be measured.
      Here we swap an uncited slot for a passage drawn from a different question,
      then plant in it. Two things change at once, the passage and the span, and no
      amount of reasoning tells us how often a model cites an out-of-place passage
      on its own. This is the one variant that needed fresh runs: 16 GPU jobs, roughly
      10 GPU-hours, and 7,625 control records, each paired with its planted twin.
      The answer came back small. With no plant, models cite the foreign passage in
      17 of 7,625 records, or 0.2%.\"},\"title\":\"2609.23053v1.pdf [01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6]
      (text, page 3)\",\"citations\":{\"enabled\":true}},{\"type\":\"document\",\"source\":{\"type\":\"text\",\"media_type\":\"text/plain\",\"data\":\"5.1
      What the control changes\\nREL-UNCITED: the raw rate survives untouched. Read
      the top block: 52 of 371 NQ claims follow the plant, and 0 of those same 371
      records cite the doctored passage when we take the span away. The control column
      is 0/ n on all four datasets, which is what Section 3.3 predicted, because removing
      four appended words restores the clean context exactly and the clean answer
      never cited that passage for that claim. Prediction and measurement agree, so
      +14.0pp on NQ is not a raw rate that needs an asterisk; it is the attributable
      effect.\\nRANDOM: the control is real but tiny. Swapping in a passage from an
      unrelated question does occasionally earn a citation on its own, as the 4/433
      on HAGRID and 1/864 on RAGTruth show, but the effect is small: 0.2% pooled across
      the 7,625 control records, with 7 of 16 model-dataset cells at exactly zero
      and the rest between 0.1% and 0.9% (Appendix D). Between 83% and 100% of each
      raw rate survives as attributable, 97% on average. The confound we built this
      control to catch turned out to be genuine and negligible, which is worth knowing
      precisely because we could not have assumed it.\\nCITED-OTHER: the raw rate
      lies, and the control catches it. The bottom block is the reason we care about
      all this. Planted rates run from 78.9% to 89.6%, many times the REL-UNCITED
      rates, and any paper could report them as evidence of rampant post-rationalization.
      The control column explains them away: 69/69, 123/123, 61/61, 623/623. Every
      single control record cites the doctored passage, because this variant selects
      a passage the clean answer already cited elsewhere. Subtract, and the attributable
      effect is negative on all four datasets, from -10.4pp to -21.1pp, with intervals
      that exclude zero. A raw rate of 79-90% here measures our sampling rule and
      nothing else. Under the stricter claim-aligned outcome the same records do show
      genuine post-rationalization, +10.6 to +19.7pp (Appendix D), though only RAGTruth
      has enough questions to pin it down.\\nThe moral generalizes past this probe:
      whenever a measurement edits an input and counts how often the output changes,
      report the unedited baseline, and demonstrate rather than assume that it is
      zero.\"},\"title\":\"2609.23053v1.pdf [01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6]
