        | 0 (0.0%)    | 0 (0.0%)    | 346 (100.0%) |\"}}},{\"id\":\"fab5fc9c-48c2-5309-be84-9c8b53e8d8df\",\"version\":13,\"score\":0.48760968,\"payload\":{\"page_content\":\"9
        Limitations\\nEvaluator dependence. Primary scores use DeBERTa-v3-base, trained
        on MNLI, FEVER, and ANLI, at \u03C4 = 0 . 5 , without human calibration. Using
        the same model to select recovered spans and score support can reinforce systematic
        errors; the resulting scores are evaluator-dependent estimates, not validated
        rates of source support or factual correctness. This dependence also limits
        conclusions about method rankings and the size of emitted-grounded gaps. The
        200-question TRUE audit checks a second scoring family, but fixed recovery
        retains DeBERTa selection and TRUE recovery reuses one judge. Different input
        windows and nonbinary decoder outputs further limit numerical comparison.
        Human source-level calibration remains necessary (Rashkin et al., 2023).\\nSingle
        generator. All results use Qwen2.5-7BInstruct with greedy decoding. Frontier
        shapes may differ across model families and scales; a second-family replication
        is planned.\\nDataset coverage. We evaluate two English datasets (ASQA and
        QASPER) with distinct retrieval granularities, but this does not cover multilingual
        settings, open-web retrieval, or longercontext regimes.\\nRe-attribution hyperparameters.
        The top-10 lexical candidate pool can miss semantically matching snippets,
        and requiring one snippet to entail a unit can miss support distributed across
        snippets. Consequently, a failed recovery does not establish that the source
        contains no support. Table 3 varies the recovery threshold while holding the
        scoring threshold fixed; it does not validate the evaluator or test candidate-pool
        size, retrieval strategy, or multi-snippet recovery.\\nVerification scope.
        Declared-span verification rejects claims lacking declared evidence by construction,
        even if support could be recovered. Its 1 . 00 unsupported rate for no-provenance
        runs is a provenance-availability diagnostic, not a calibrated hallucination
        rate. Recovered-source verification is reported at nominal 0.25 for the two
        no-provenance methods and remains dependent on the same bounded recovery procedure
        and evaluator.\\nResidual error rows. Only identity fails on 4 ASQA and 29
        QASPER questions; every primary setting is evaluated on the resulting common
        successful subset. This pairing prevents comparisons from using different
        questions, but conditions results on identity success and omits those difficult
        cases. Sampling intervals condition on the fixed generated outputs and evaluator;
        they do not include systematic NLI error or variation across generation runs.\\nNominal
        versus achieved budgets. Abstractive compressors do not reliably hit nominal
        token budgets; RECOMP often produces much less context than requested. We
        report achieved compression ratios, but comparisons at a shared nominal budget
        do not establish performance at matched achieved context sizes.\",\"metadata\":{\"ingestion_version\":\"01a0fc54ff9a70d3af0e9b49e864b8b9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde-text-0020\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde\",\"chunk_type\":\"text\",\"section_path\":\"9
        Limitations\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":78,\"page_no\":9,\"filename\":\"2609.14245v1.pdf\"}}},{\"id\":\"01fc0118-5f0a-5a7b-a17c-915836e6620f\",\"version\":9,\"score\":0.48345974,\"payload\":{\"page_content\":\"A.3
