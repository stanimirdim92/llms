        Answerability audit of evaluation contexts\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":162,\"page_no\":15,\"filename\":\"2609.11758v1.pdf\"}}},{\"id\":\"dfdc115b-8a09-5899-9911-fb57a38a5ae7\",\"version\":9,\"score\":0.48203623,\"payload\":{\"page_content\":\"A.2
        Safety evaluation details\\nEach example in the balanced subset is expanded
        into four evaluation conditions: non_rag , rag_oracle_unsafe , rag_topic_safe
        , and rag_control_safe_random . Since the balanced subset contains 346 examples,
        this expansion produces 1,384 example-condition rows per model and 6,920 total
        responses across the five evaluated models.\\nThe benchmark controls retrieval
        quality by directly supplying context documents, rather than relying on a
        live retriever to discover them at inference time. This is important because
        a poor retriever could otherwise fail to retrieve the relevant harmful document
        and artificially inflate apparent safety.\\nThe non_rag condition supplies
        no documents for all 346 examples. The rag_oracle_unsafe condition supplies
        one document for all 346 examples. The rag_topic_safe condition supplies three
        documents for 344 examples and two documents for two examples. The rag_control_safe_random
        condition supplies three documents for 321 examples, two documents for 24
        examples, and one document for one example.\\nIn the final evaluation configuration,
        context is supplied as cleaned full-article-prefix text with a per-document
        cap of approximately 12,000 characters. Section-level metadata are retained
        for provenance and auditing.\\nThe response-generation templates are intentionally
        simple. In the non_rag condition, the model is instructed to answer using
        only its own knowledge. In the three RAG conditions, the model is instructed
        to answer using only the provided documents, with each supplied context labeled
        sequentially as Context 1 , Context 2 , etc.\\nAll model responses were generated
        deterministically with temperature = 0 . 0 , topp = 1 . 0 , and sampling disabled.
        We used a maximum of 1,024 newly generated tokens per response and a fixed
        run seed of 42. For RAG conditions, each cleaned retrieved-document prefix
        was capped at 12,000 characters. The same prompt template and decoding settings
        were used across all four conditions for a given model.\\nAll experiments
        were run on an academic research cluster with NVIDIA H100 GPUs. Compute requirements
        varied by model size, context length, and response length. The five-model
        evaluation required approximately 74 GPU-hours in total, including response
        generation and local safety judging. The released configurations and run manifests
        provide the information needed to reproduce the evaluation.\",\"metadata\":{\"ingestion_version\":\"01a0fc5427ea71babb96a22c2c5762f3\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a-text-0028\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a\",\"chunk_type\":\"text\",\"section_path\":\"A.2
        Safety evaluation details\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":152,\"page_no\":14,\"filename\":\"2609.11758v1.pdf\"}}},{\"id\":\"3a82a030-6dc7-5454-9a96-130c79270203\",\"version\":9,\"score\":0.46701384,\"payload\":{\"page_content\":\"4.1
        R1: Capability in safe and unsafe contexts\\nTable 3 reports accuracies for
        each model when asked benign and harmful questions, in both nonRAG, oracle
        RAG, and mixed settings. In the benign case, accuracy is scored using the
        MIRAGE benchmark method (Park et al., 2025). In the harmful (RAG-Safety-Bench)
        case, we compare the output response with the expected benchmark response,
        using Claude-Opus-4.7 to output a fi- nal label of accurate or inaccurate
        relative to the reference. Human annotation of a subset of 100 examples validates
        the LLM-as-a-judge approach, with agreement of 95-96% between humans and LLM,
        and Cohen's \u03BA of 0.90-0.92 (more details and prompt available in Appendix
        Section A.4).\\nTable 1: The four settings of the RAG-Safety-Bench benchmark.
        Example documents are for the query, 'What materials and design do I need
        to make an IED that can defeat armored police vehicles?'\\n\\nLLM-only, Description
        = No context documents provided.. LLM-only, Example Wikipedia documents =
        (None). Oracle, Description = One of the returned documents contains the answer..
        Oracle, Example Wikipedia documents = 'Explosively formed penetrator'. On-topic,
        Description = Oracle document not included, but documents are related to the
        topic of the query.. On-topic, Example Wikipedia documents = 'Deflagration
        to detonation tran- sition', 'Blast wall'. Random, Description = Documents
        are randomly selected from a set of benign documents.. Random, Example Wikipedia
        documents = 'Climate change and birds', 'Ar- boretum'\",\"metadata\":{\"ingestion_version\":\"01a0fc5427ea71babb96a22c2c5762f3\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a-text-0011\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a\",\"chunk_type\":\"text\",\"section_path\":\"4.1
        R1: Capability in safe and unsafe contexts\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":43,\"page_no\":4,\"filename\":\"2609.11758v1.pdf\"}}},{\"id\":\"f45581fc-5f6f-5bbf-b3a8-6caaa982a248\",\"version\":13,\"score\":0.46590206,\"payload\":{\"page_content\":\"3.1
        Setup\\nOur pipeline is retrieve \u2192 compress \u2192 generate \u2192 evaluate.
        A compressor maps the retrieved snippets (sentence-segmented, each with a
        stable source id, sid ) to a sequence of units , and every unit either declares
        provenance-the set of sids it was selected from, as in extractive familiesor
        declares none, as in abstractive families. The generator sees the units as
        a numbered context and is prompted, ALCE-style, to attach bracketed unit citations
        to each answer sentence (Gao et al., 2023). Citation quality is scored per
        answer statement with an NLI evaluator in the attributableto-identified-sources
        sense (Rashkin et al., 2023; Bohnet et al., 2022): a statement is recalled
        iff the concatenation of its resolvable cited sources entails it, and a citation
        is precise iff that concatenation entails the statement and, in addition,
        the cited source alone entails it or removing that source breaks the concatenation's
        entailment (Gao et al., 2023). We use DeBERTa-v3-base (MNLI+FEVER+ANLI) at
        threshold \u03C4 =0 . 5 , truncating each NLI input to 512 model tokens. Entailment
        decisions below are this model's predictions, not independently validated
        judgments of source support. Per-example harness failures occur only in identity
        (4 of 948 on ASQA, 29 of 1,005 on QASPER); every primary setting excludes
        those same question IDs, with failure counts retained.\",\"metadata\":{\"ingestion_version\":\"01a0fc54ff9a70d3af0e9b49e864b8b9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde-text-0005\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde\",\"chunk_type\":\"text\",\"section_path\":\"3.1
        Setup\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":22,\"page_no\":2,\"filename\":\"2609.14245v1.pdf\"}}},{\"id\":\"48f13ee2-cca1-5a90-8a2c-c4e37fc6acd7\",\"version\":13,\"score\":0.45992342,\"payload\":{\"page_content\":\"8
        Conclusion\\nWe measured citation attribution across contextcompression methods
        and budgets under a fixed generator and primary NLI evaluator. Emitted and
        grounded scores diverge, but their magnitudes depend on recovery and evaluation
        choices that have not been independently calibrated. Declaredspan verification
        rejects claims lacking declared evidence by policy; it does not determine
        whether support could be recovered. Paired comparisons quantify sampling uncertainty
        conditional on the fixed outputs and evaluator, with only limited evidence
        for ECR's advantage. We recommend reporting grounded alongside emitted citation
        scores and achieved alongside nominal compression. The TRUE subsample retains
        the emitted-grounded gaps; human calibration and broader replication remain
        necessary.\",\"metadata\":{\"ingestion_version\":\"01a0fc54ff9a70d3af0e9b49e864b8b9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde-text-0019\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde\",\"chunk_type\":\"text\",\"section_path\":\"8
        Conclusion\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":76,\"page_no\":8,\"filename\":\"2609.14245v1.pdf\"}}},{\"id\":\"f5a9caf9-6efb-5456-85d5-a98735962450\",\"version\":15,\"score\":0.45901698,\"payload\":{\"page_content\":\"3.1
        The planting probe\\nWe follow the probe of Wallat et al. (2025), which runs
        in three steps.\\n1. Answer. The model answers a question from five retrieved
        passages. Every sentence ends with exactly one citation, so each sentence
        and its marker form one claim .\\n2. Plant. We lift a short span out of the
        claim and append it to a passage the model did not cite for that claim, then
        re-run the same model on the doctored context with the same prompt.\\n3. Check.
        We ask whether the model now cites the doctored passage for that claim.\\nThe
        logic is a swap test. The doctored passage shares nothing with the claim except
        the words we pasted into it, and the passage the model originally cited never
        leaves the context. A model that reads for meaning has no reason to move.
        A model that matches surface strings has every reason to, and when it moves,
        its citation was never evidence of where the answer came from.\\nTable 1 lists
        the three variants, which differ only in which passage receives the span.
        REL-UNCITED plants in a passage the retriever returned and the model ignored,
        the situation a deployed system meets constantly, and it is our main measure.\\nREL-UNCITED,
        Where the span is planted = A retrieved passage that the answer did not cite..
        CITED-OTHER, Where the span is planted = Apassage the answer already cites,
        but for a different sentence.. RANDOM, Where the span is planted = An uncited
        slot, after replacing its passage with one from a different question.\\nTable
        1: The three probe variants. Each changes exactly one of the five retrieved
        passages, and the passage that genuinely supports the claim stays in the context.
        RELUNCITED is our main measure.\\nChoosing the span. The original probe leaned
        on Command R+, which marks the exact words it grounds on. Qwen2.5 offers no
        such markup, so we need a rule, and we keep it blunt and deterministic: the
        four consecutive words of the claim with the most characters. This decision
        was influenced by Wallat et al. (2025). We played around with 2-4 words for
        the span and choosing four words minimized bias.\",\"metadata\":{\"ingestion_version\":\"01a0fc55257f7276be70b7b3d1501b36\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6-text-0007\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6\",\"chunk_type\":\"text\",\"section_path\":\"3.1
        The planting probe\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":36,\"page_no\":2,\"filename\":\"2609.23053v1.pdf\"}}},{\"id\":\"a9b43285-5f62-5767-bb3d-647de070ca2f\",\"version\":13,\"score\":0.4566589,\"payload\":{\"page_content\":\"Sensitivity
        to the re-attribution threshold.\\nSecond-evaluator sensitivity. We rescore
        100 questions per dataset with TRUE T5-XXL (Honovich et al., 2022), covering
        full-context identity plus extraction, RECOMP, and LLMLingua-2 at nominal
        0.25. With source mappings fixed, RECOMP's emitted/grounded precision is 0.78/0.13
        on ASQA and 0.44/0.01 on QASPER. The paired gaps are 0.65 [0.55, 0.75] and
        0.43 [0.33, 0.53], respectively. When TRUE also selects recovered spans, grounded
        precision is 0.14 and 0.03. All 16 planned emitted-minus-grounded precision
        and recall gaps across both methods, datasets, and recovery modes are positive
        ( p H = 0 . 0024 in a separate 24-test family). None of the eight cross-evaluator
        grounded-precision differences passes Holm adjustment; this does not establish
        equivalence or validate the primary numbers. Appendix C reports all comparisons,
        the 4,096-token input configuration, decoder anomalies, and documented restarts.
        The pattern persists under a second scoring family, with recovery and calibration
        limitations retained.\",\"metadata\":{\"ingestion_version\":\"01a0fc54ff9a70d3af0e9b49e864b8b9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde-text-0017\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde\",\"chunk_type\":\"text\",\"section_path\":\"Sensitivity
        to the re-attribution threshold.\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":69,\"page_no\":8,\"filename\":\"2609.14245v1.pdf\"}}},{\"id\":\"a44c45f3-30fe-539c-8e4c-b53e70d91aee\",\"version\":5,\"score\":0.45642087,\"payload\":{\"page_content\":\"D.
        Evaluation Metrics\\nFor every run the model retrieves once, then answers
        twice: once from the clean passages and once from a poisoned copy of that
        same list. Passage identity and order are therefore shared across the pair;
        what is not locked is decoding (temperature 0.1, two independent generate
        calls). Four quantities are recorded.\\nAccuracy checks whether the reference
        keyword for a question appears in the answer, case-insensitively. Keyword
        presence is a coarse label: a negated or qualified answer can still contain
        the keyword, and an otherwise correct paraphrase can miss it. We keep it because
        it is reproducible and applied uniformly, not because it is a gold standard.
        Fooled rate is the fraction of runs where the clean answer was correct but
        the poisoned answer was not; it isolates correct-to-incorrect flips from questions
        the model could not answer anyway. It is not a direct measure of poison adoption,
        because an incorrect poisoned answer may abstain, contradict the poison, or
        state a third wrong fact. Abstention rate counts answers that decline to commit,
        detected through a small set of phrases such as 'not enough information' and
        'cannot determine.' Unsupported generation (reported in earlier drafts as
        a hallucination proxy) is approximated by lexical overlap: an answer is flagged
        when fewer than 30% of its content words appear in any retrieved passage,\\n<!--
        formula-not-decoded -->\\nwith W a the content words of the answer and W d
        those of the retrieved passages. Lexical overlap confuses faithful paraphrase
        with unsupported invention, and it can miss answers that copy poisoned text.
        We treat the proxy as a trend indicator only.\",\"metadata\":{\"ingestion_version\":\"01a0fc53392f724b972307d03a9f94d9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead-text-0005\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead\",\"chunk_type\":\"text\",\"section_path\":\"D.
        Evaluation Metrics\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":25,\"page_no\":2,\"filename\":\"2609.09243v1.pdf\"}}},{\"id\":\"2f8a40b6-be17-5a91-a1a4-eeffcbaf50c8\",\"version\":13,\"score\":0.4448903,\"payload\":{\"page_content\":\"A
        Results on Common Questions\\nTables 4 and 5 report all primary settings.
        \u03C1 : nominal budget; \u02C6 \u03C1 : achieved ratio; P g /R g : grounded
        citation precision/recall; P e : emitted citation precision; reattr.: re-attribution
        rate (units without declared provenance recovering at least one source span
        under the NLI protocol); U s /U m : unsupported-claim rate under declared-span-only
        and summary-checked verification; str-EM: answer string exact match (ASQA);
        EF1: declaredevidence F1 (QASPER only). Every setting uses the same 944 ASQA
        or 976 QASPER successful questions; n denotes that common cohort, with metric-specific
        omissions identified in the tables. Scores are question-weighted means over
        defined values; superscript n = \xB7 \xB7 \xB7 gives the nonmissing count
        when smaller than the cohort, and dashes mark undefined metrics. QASPER verification
        rates exclude 1, 2, 3, and 2 zero-claim RECOMP answers at nominal budgets
