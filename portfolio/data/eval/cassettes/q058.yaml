- request:
    body: '{"query": "How many GPU hours did GraMRAG''s reinforcement learning training
      take?", "documents": ["4.2 Implementation Details\n2025) as the agent backbones.
      We use Qwen3Max (Yang et al., 2025) as the reward model to evaluate the quality
      and relevance of generated responses. Training is divided into two stages. In
      the SFT stage, we employ LlamaFactory (Zheng et al., 2024) with LoRA (Hu et
      al., 2022) of rank 32 to fine-tune the language model while keeping the vision
      tower and multimodal projector frozen. Training spans 3 epochs with a batch
      size of 8 and gradient accumulation steps of 8, a learning rate of 1.0e-4, and
      a cosine learning rate scheduler. In the RL stage, we use rLLM (Tan et al.,
      2025) with the TAPO objective, an actor learning rate of 1.0e-6, a total of
      2 training epochs, 8 agent groups, and a batch size of 32. All experiments are
      conducted on 8 NVIDIA H100 GPUs.", "Retrieval quality depends on reasoning depth.\nHigh-quality
      answer generation in complex multimodal tasks depends on sustaining precise
      multiround retrieval across a long reasoning horizon. Traditional memory paradigms
      cause agents to progressively lose track of historical retrieval paths and accumulate
      redundant searches that severely constrain effective reasoning depth. GraMRAG
      addresses this by transferring the iterative planning capability into the multimodal
      domain via the vision-text bridged reasoning paradigm, supporting trajectories
      spanning tens of steps; the multimodal memory graph further encodes action-observation
      dependencies explicitly, directing each retrieval attempt precisely toward unexplored
      evidence space. As shown in Figure 5, this design yields substantially higher
      hit rate across all three task categories, directly validating the decisive
      role of long-horizon reasoning depth in determining retrieval quality.\nGraph
      memory mitigates state blindness. The dynamic DAG representation of the multimodal
      memory graph explicitly encodes actionobservation dependencies as directed edges,
      enabling each agent to efficiently access the complete historical reasoning
      trajectory and effectively mitigating state blindness. As shown in Table 2,
      replacing iterative summarization-based memory with the multimodal memory graph
      yields a 3.3point performance improvement, validating that the multimodal memory
      graph effectively mitigates state blindness and suppresses redundant retrieval,
      confirming the necessity of structured memory in long-horizon multimodal reasoning.\nFigure
      6: Analysis of training efficiency.\nGraph pruning accelerates training convergence.
      As demonstrated in Figure 6, TAPO achieves faster convergence throughout training
      compared to the baseline Group Sequence Policy Optimization (GSPO) (Zheng et
      al., 2025), indicating that topology-guided graph pruning drives the model toward
      faster convergence by supplying cleaner credit assignment signals. This yields
      two critical insights into agentic reinforcement learning: first, optimization
      stability fundamentally depends on ensuring correct positive gradient signals
      while eliminating ambiguous updates from negative trajectories; second, the
      quality of rollout samples, specifically their preference alignment, is more
      decisive for performance than simply scaling up the training set. By simultaneously
      masking dead-end nodes in positive trajectories and preserving valuable nodes
      in negative ones, TAPO achieves finegrained step-level credit assignment rather
      than coarse terminal-reward-level optimization.", "6 Discussion\nHow to read
      the R-Search result. R-Search sits above its base on all four datasets and significantly
      above on the best-powered one, which is a real and consistent pattern. It is
      also one model, one base, one prompt, and one scorer, so four datasets are not
      four independent replications, and the effect softens under a stricter variant
      and a looser outcome. Two things would settle it: a cross-dataset test declared
      in advance, and an arm fine-tuned on the same data without RL, which would separate
      the contribution of RL from the contribution of fine-tuning on retrieval data
      at all.\nA note on cost. Everything here, four models, four datasets, three
      variants, both conditions, and the control that makes the comparison interpretable,
      ran on Kaggle''s T4 GPUs. Careful measurement was the cheap part of this project.
      The expensive part was reading the construction code closely enough to know
      which controls we did not have to run.", "C Hardware Settings\nAll experiments
      were conducted on a single node with eight NVIDIA A100-SXM4 GPUs (80GB each).
      We used bfloat16 , FlashAttention-2, and PyTorch distributed training via Accelerate
      and DeepSpeed with data parallelism. Pre-training used four GPUs with an effective
      batch size of 1,024, while both fine-tuning stages used eight GPUs with effective
      batch sizes of 512. Evaluation was distributed across eight GPUs, whereas latency
      and throughput were measured on a single A100 GPU.", "4.4 Ablation Study\nTo
      validate the contribution of each component in GraMRAG, we conduct ablation
      studies across all benchmarks. As shown in Table 2, the three components exhibit
      clear progressive complementarity: long-horizon reasoning enables sustained
      multiround retrieval across extended cross-modal rea- soning trajectories; the
      multimodal memory graph demonstrates that formalizing reasoning as a dynamic
      DAG effectively mitigates state blindness and suppresses redundant retrieval;
      and replacing the standard sparse-reward method Group Relative Policy Optimization
      (GRPO) (Shao et al., 2024) with TAPO delivers a further improvement, directly
      confirming the critical role of topology-guided credit assignment in fine-grained
      policy optimization. The complete model achieves an average score of 53.5%,
      an improvement of over 9 points above the baseline, comprehensively validating
      the necessity and complementarity of each component.\nFigure 5: Analysis of
      retrieval performance.", "4 Experimental Setup\nWe know what size of effect
      we could have caught. Our sample sizes give 80% power to detect a difference
      of roughly 7 percentage points (pp). Plainly: had RLVR moved post-rationalization
      by 7pp or more in either direction, this design would almost certainly have
      caught it. Shifts of a couple of points stay inside our blind spot, which is
      why we report a bounded null rather than a flat absence of effect. We fixed
      the primary outcome and the family of corrected comparisons in writing before
      the scorer ran.\nCompute. Everything ran on Kaggle''s free tier, two T4s or
      a single P100 per session: 48 GPU jobs yielding 36,690 scored records across
      four models, four datasets, three variants, and both conditions. The original
      study used a 104B model; the controlled version of the same measurement fits
      on hardware anyone can get for free, and that is the part we would most like
      other groups to borrow.", "E Training Schedule.\nTable 5 summarizes the number
      of training examples and epochs used at each stage. We train for one epoch in
      Stages 12 and for three epochs during the final KILT-SCR fine-tuning stage.",
      "Table 2: Ablation study across all benchmarks.\n\n| Reasoning Horizon Standard
      Long   | Memory Iterative   | Paradigm Graph   | Policy GRPO   | Optimization
      TAPO   | Acc                      |\n|-----------------------------------|--------------------|------------------|---------------|---------------------|--------------------------|\n|
      \u2713 \u2713 \u2713 \u2713 \u2713                         | \u2713 \u2713                |
      \u2713 \u2713 \u2713            | \u2713             | \u2713                   |
      43.8 44.2 47.5 49.3 53.5 |", "A.2 Safety evaluation details\nEach example in
      the balanced subset is expanded into four evaluation conditions: non_rag , rag_oracle_unsafe
      , rag_topic_safe , and rag_control_safe_random . Since the balanced subset contains
      346 examples, this expansion produces 1,384 example-condition rows per model
      and 6,920 total responses across the five evaluated models.\nThe benchmark controls
      retrieval quality by directly supplying context documents, rather than relying
      on a live retriever to discover them at inference time. This is important because
      a poor retriever could otherwise fail to retrieve the relevant harmful document
      and artificially inflate apparent safety.\nThe non_rag condition supplies no
      documents for all 346 examples. The rag_oracle_unsafe condition supplies one
      document for all 346 examples. The rag_topic_safe condition supplies three documents
      for 344 examples and two documents for two examples. The rag_control_safe_random
      condition supplies three documents for 321 examples, two documents for 24 examples,
      and one document for one example.\nIn the final evaluation configuration, context
      is supplied as cleaned full-article-prefix text with a per-document cap of approximately
      12,000 characters. Section-level metadata are retained for provenance and auditing.\nThe
      response-generation templates are intentionally simple. In the non_rag condition,
      the model is instructed to answer using only its own knowledge. In the three
      RAG conditions, the model is instructed to answer using only the provided documents,
      with each supplied context labeled sequentially as Context 1 , Context 2 , etc.\nAll
      model responses were generated deterministically with temperature = 0 . 0 ,
      topp = 1 . 0 , and sampling disabled. We used a maximum of 1,024 newly generated
      tokens per response and a fixed run seed of 42. For RAG conditions, each cleaned
      retrieved-document prefix was capped at 12,000 characters. The same prompt template
      and decoding settings were used across all four conditions for a given model.\nAll
      experiments were run on an academic research cluster with NVIDIA H100 GPUs.
      Compute requirements varied by model size, context length, and response length.
      The five-model evaluation required approximately 74 GPU-hours in total, including
      response generation and local safety judging. The released configurations and
      run manifests provide the information needed to reproduce the evaluation.",
      "This is a schematic diagram illustrating a reinforcement learning framework
      for training multimodal/retrieval-based models, divided into two panels. Panel
      (a) shows the overall \"Reinforcement Learning Framework with Topology-Aware
      Policy Optimization,\" depicting a pipeline where user queries and images flow
      through a Rollout Module (Policy Model generating trajectories H1-H6 via interaction
      with an External Environment), then through Reference and Reward Models to compute
      rewards (r1-r6) and group-computed advantages (A1-A6), with a Graph Pruning
      module using a Memory Graph and KL divergence to produce gradient masks (m1-m6)
      that modulate the final gradient. Panel (b) illustrates \"Credit Assignment
      via Graph Pruning\" using two tree-structured graphs (Positive Sample and Negative
      Sample) rooted at a query node Q leading to an answer node A, showing how dead-end
      nodes (orange, meaningless for optimization) are pruned as false positives/negatives
      while valuable retrieval nodes (green) are preserved to avoid penalizing useful
      paths, with masked gradients indicated at specific steps.", "Graph-Structured
      Trajectory Decomposition.\nwhere \u03c9 g,i ( \u03b8 ) is the probability ratio
      of segment s ( i ) g under the current and old policies; n g denotes the number
      of segments in the g -th rollout. The (1 -\u03c8 g,i ) factor selectively gates
      gradient contributions based on the topological analysis of the memory graph:
      in positive trajectories, topological dead-end steps are masked to prevent their
      gradients from reinforcing redundant exploration; in negative trajectories,
      valuable retrieval steps are masked to prevent their gradients from penalizing
      effective retrieval behavior. Through this design, TAPO achieves precise step-level
      credit assignment across the entire multi-step reasoning trajectory, significantly
      outperforming conventional sparsereward methods that rely solely on terminal
      outcome signals.", "Table 5: Training schedule for the three-stage procedure.\n\n|
      Stage              |   Examples |   Epochs |\n|--------------------|------------|----------|\n|
      Stage 1            |  2,000,000 |        1 |\n| Stage 2            |    500,000
      |        1 |\n| Stage 3 (KILT-SCR) |    196,916 |        3 |", "Table 2: Models
      (top) and datasets (bottom). All four models share the Qwen2.5-7B-Instruct base.
      Passages is the number of roughly 100-token chunks in each retrieval index.\n\n|
      Model     | Training on top of the base   |\n|-----------|-------------------------------|\n|
      Baseline  | none (Qwen2.5-7B-Instruct)    |\n| Search-R1 | RLVR with PPO                 |\n|
      ReSearch  | RLVR with GRPO                |\n| R-Search  | RLVR with GRPO                |",
      "4 Experimental Setup\nTable 2: Models (top) and datasets (bottom). All four
      models share the Qwen2.5-7B-Instruct base. Passages is the number of roughly
      100-token chunks in each retrieval index.\n\nBaseline, Training on top of the
      base = none (Qwen2.5-7B-Instruct). Search-R1, Training on top of the base =
      RLVR with PPO. ReSearch, Training on top of the base = RLVR with GRPO. R-Search,
      Training on top of the base = RLVR with GRPO\nNQ, Questions = 499. NQ, Passages
      = 40,791. NQ, Source = Wikipedia. QAMPARI, Questions = 500. QAMPARI, Passages
      = 44,879. QAMPARI, Source = Wikipedia. HAGRID, Questions = 500. HAGRID, Passages
      = 8,986. HAGRID, Source = Wikipedia. RAGTruth, Questions = 500. RAGTruth, Passages
      = 6,981. RAGTruth, Source = Web\nModels. Our comparison rests on a single design
      choice: every model in Table 2 starts from the same weights. The baseline is
      Qwen2.5-7BInstruct (Qwen Team, 2024); Search-R1 (Jin et al., 2025), ReSearch
      (Chen et al., 2025), and R-Search (Zhao et al., 2025) are open-weight agents
      trained from that exact checkpoint with RLVR. Whatever separates an agent from
      the baseline is therefore training, not architecture, tokenizer, or pretraining
      data.\nFixed-context evaluation. We disable agentinitiated retrieval and give
      every model the same five passages retrieved externally with BM25. This is an
      intentional control: our question is whether RLVR-trained agents differ in citation
      attribution when the available evidence is held constant. Allowing agents to
      retrieve would introduce differences in search policy and evidence selection,
      making those effects inseparable from citation behavior.\nDatasets. We use four
      question-answering datasets: NQ from KILT (Petroni et al., 2021; Kwiatkowski
      et al., 2019), QAMPARI from ALCE (Gao et al., 2023; Amouyal et al., 2023), HA-
      GRID (Kamalloo et al., 2023), and the questionanswering portion of RAGTruth
      (Niu et al., 2024), sampling 500 questions from each (499 for NQ). For each
      dataset we chunk the corpus into roughly 100-token passages and retrieve the
      top five per question with BM25 (Robertson and Zaragoza, 2009).", "B Inference
      Efficiency\nTable 4: Inference efficiency on TriviaQA with k = 25 : per-query
      latency, throughput, total compute, and peak GPU memory across inference-time
      compression rates.\n\nFull Context, Rate = 1 \u00d7. Full Context, Lat. (ms)
      = 667.4. Full Context, Thr. (q/s) = 1.50. Full Context, TFLOPs = 59.9. Full
      Context, Mem. (GB) = 53.5. OSCAR, Rate = 16 \u00d7. OSCAR, Lat. (ms) = 156.1.
      OSCAR, Thr. (q/s) = 6.41. OSCAR, TFLOPs = 15.0. OSCAR, Mem. (GB) = 39.6. OSCAR,
      Rate = 32 \u00d7. OSCAR, Lat. (ms) = 149.3. OSCAR, Thr. (q/s) = 6.70. OSCAR,
      TFLOPs = 13.4. OSCAR, Mem. (GB) = 39.0. OSCAR, Rate = 64 \u00d7. OSCAR, Lat.
      (ms) = 142.9. OSCAR, Thr. (q/s) = 7.00. OSCAR, TFLOPs = 12.5. OSCAR, Mem. (GB)
      = 38.7. OSCAR, Rate = 128 \u00d7. OSCAR, Lat. (ms) = 136.4. OSCAR, Thr. (q/s)
      = 7.33. OSCAR, TFLOPs = 12.1. OSCAR, Mem. (GB) = 38.5. AdaMem, Rate = 16 \u00d7.
      AdaMem, Lat. (ms) = 192.4. AdaMem, Thr. (q/s) = 5.20. AdaMem, TFLOPs = 21.0.
      AdaMem, Mem. (GB) = 56.4. AdaMem, Rate = 32 \u00d7. AdaMem, Lat. (ms) = 167.5.
      AdaMem, Thr. (q/s) = 5.97. AdaMem, TFLOPs = 16.6. AdaMem, Mem. (GB) = 48.4.
      AdaMem, Rate = 64 \u00d7. AdaMem, Lat. (ms) = 152.9. AdaMem, Thr. (q/s) = 6.54.
      AdaMem, TFLOPs = 14.3. AdaMem, Mem. (GB) = 44.4. AdaMem, Rate = 128 \u00d7.
      AdaMem, Lat. (ms) = 144.0. AdaMem, Thr. (q/s) = 6.95. AdaMem, TFLOPs = 13.0.
      AdaMem, Mem. (GB) = 42.3", "Table 4: Inference efficiency on TriviaQA with k
      = 25 : per-query latency, throughput, total compute, and peak GPU memory across
      inference-time compression rates.\n\n| Method       | Rate   |   Lat. (ms) |   Thr.
      (q/s) |   TFLOPs |   Mem. (GB) |\n|--------------|--------|-------------|--------------|----------|-------------|\n|
      Full Context | 1 \u00d7    |       667.4 |         1.50 |     59.9 |        53.5
      |\n| OSCAR        | 16 \u00d7   |       156.1 |         6.41 |     15.0 |        39.6
      |\n| OSCAR        | 32 \u00d7   |       149.3 |         6.70 |     13.4 |        39.0
      |\n| OSCAR        | 64 \u00d7   |       142.9 |         7.00 |     12.5 |        38.7
      |\n| OSCAR        | 128 \u00d7  |       136.4 |         7.33 |     12.1 |        38.5
      |\n| AdaMem       | 16 \u00d7   |       192.4 |         5.20 |     21.0 |        56.4
      |\n| AdaMem       | 32 \u00d7   |       167.5 |         5.97 |     16.6 |        48.4
      |\n| AdaMem       | 64 \u00d7   |       152.9 |         6.54 |     14.3 |        44.4
      |\n| AdaMem       | 128 \u00d7  |       144.0 |         6.95 |     13.0 |        42.3
      |", "Acknowledgments\nThis research was supported by the Natural Sciences and
      Engineering Research Council of Canada (NSERC) RGPIN-2026-05716. GPU computation
      was enabled by support provided by Compute Ontario and the Digital Research
      Alliance of Canada.", "7 Limitations\nAlthough GraMRAG achieves significant
      performance improvements on complex multimodal multi-step reasoning tasks, the
      multi-agent collaboration framework introduces some inference overhead compared
      to traditional RAG approaches. Notably, such a trade-off is generally acceptable
      in deep research scenarios where users prioritize reasoning accuracy over response
      speed. Nevertheless, it may hinder direct deployment in resourceconstrained
      environments. Therefore, optimizing the interaction strategy among agents and
      designing more efficient lightweight graph memory mechanisms constitute key
      directions for future work.", "4.3 Comparison with State-of-the-Art Methods\nWe
      compare GraMRAG against representative baselines: ReAct (Yao et al., 2022) iteratively
      invokes external retrieval tools in a think-then-act paradigm; Vanilla RAG uses
      the original question as a query and performs direct MLLM inference over retrieved
      results; UniversalRAG (Yeo et al., 2025) formulates cross-modal retrieval as
      a unified routing problem; VideoRAG (Jeong et al., 2025) extracts significant
      visual information via key-frame selection; MemAgent (Yu et al., 2025) manages
      context by sequentially feeding search results to the model; Mem1 (Zhou et al.,
      2025) dynamically compresses agent memory through a cyclical retrievalthen-memorization
      process; and VimRAG (Wang et al., 2026) models reasoning process to manage large-scale
      multimodal contexts.\nAs presented in Table 1, linear history accumula- tion
      paradigms such as ReAct rapidly exhaust the context window under the heavy token
      overhead of visual data; task-specific methods including VideoRAG and UniversalRAG
      exhibit limited generalizability due to fixed inference pipelines; and summarization-based
      memory paradigms such as MemAgent and Mem1, lacking explicit modeling of agent
      reasoning states, progressively lose track of historical retrieval paths as
      interaction rounds accumulate; and VimRAG models the reasoning process but lacks
      long-horizon reasoning capability. Our GraMRAG achieves consistently state-of-theart
      performance across all benchmarks, achieving overall average scores of 48.5%
      and 53.5% under the Qwen3-VL-4B-Instruct and Qwen3-VL8B-Instruct settings respectively,
      validating the effectiveness of formalizing the multi-step reasoning process
      as a dynamic DAG with topologydriven fine-grained credit assignment for multimodal
      knowledge-intensive reasoning tasks.\nTable 2: Ablation study across all benchmarks.\n\n\u2713
      \u2713 \u2713 \u2713 \u2713, Memory Iterative = \u2713 \u2713. \u2713 \u2713
      \u2713 \u2713 \u2713, Paradigm Graph = \u2713 \u2713 \u2713. \u2713 \u2713 \u2713
      \u2713 \u2713, Policy GRPO = \u2713. \u2713 \u2713 \u2713 \u2713 \u2713, Optimization
      TAPO = \u2713. \u2713 \u2713 \u2713 \u2713 \u2713, Acc = 43.8 44.2 47.5 49.3
      53.5", "3.3 Topology-Aware Policy Optimization\nAs illustrated in Figure 4,
      we propose TopologyAware Policy Optimization (TAPO) to address the systematic
      credit assignment problem in sparse reward reinforcement learning training,
      leveraging the topological structure of the memory graph to perform selective
      gradient masking that simultaneously rectifies both forms of bias across positive
      and negative trajectories with step-level precision."], "model": "rerank-2.5",
      "top_k": 5, "truncation": true}'
