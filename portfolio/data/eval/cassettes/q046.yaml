      grade a question-answering system against an accepted answer.\\n\\nQuestion:
      In the RLVR citation-faithfulness study, what is post-rationalization?\\n\\nAccepted
      answer: The model writes the answer first and then attaches a citation to whatever
      passage looks close enough, so the citation is present but the source was not
      actually used.\\n\\nSystem answer: Post-rationalization is a citation failure
      mode in which models write the answer before determining what to cite, then
      attach a citation retroactively to whatever source looks plausible rather than
      to the passage they actually used. As the paper explains, models output these
      unfaithful citations via postrationalization: they write the answer first and
      then attach a citation to whatever passage looks close enough.\\n\\nThis concept
      originates from prior work the authors build on: Models break that promise more
      often than they look like they do. Wallat et al. (2025) showed that a model
      will cite a passage it never used, a behavior they call post-rationalization:
      the answer comes first, and the citation gets attached afterward to whatever
      passage looks like a plausible source.\\n\\nWhat makes this especially problematic
      is that it's not detectable through normal review. What makes this failure slippery
      is that nothing on the surface goes wrong. The answer is right. The citation
      is present, well formed, and points at a real passage\u2014yet the citation
      doesn't actually reflect the source the model used to generate the answer.\\n\\nThe
      paper illustrates this with a concrete example (Figure 1): A real case from
      our baseline model on NQ. Passage [4] is a plot summary of a Batman TV episode;
      it never mentions Heath Ledger or the film. We appended four words from the
      model's own answer to it (shaded). The model then cites [4] instead of [1],
      although [1] is still in the context and supports the claim. In other words,
      the baseline model correctly names Heath Ledger as the Joker and cites the Heath
      Ledger article. We then copied four words of the model's own sentence into a
      plot summary of a Batman cartoon and asked again. The answer did not change.
      The citation moved to the cartoon passage, which never answers the original
      question, while the Ledger article stayed right there in the context. Four words
      were enough to make the model cite a source it did not use during inference.\\n\\nThis
      failure is especially insidious for readers trying to verify claims, because
      the model knew the answer, had the supporting passage in front of it, cited
      it, and then handed the citation to a cartoon plot summary after we moved four
      words. A reader auditing that citation opens the passage, finds the claim's
      wording sitting there, and walks away reassured. The audit passes and the provenance
      is still wrong.\\n\\nThe study found this behavior to be widespread: on Wikipedia-based
      questions roughly one citation in seven is unfaithful, and critically, RLVR
      does not fix it. The agents post-rationalize at their base model's rate, and
      one lands slightly worse. Rewarding correct answers buys nothing in citation
      faithfulness, so faithfulness has to be trained and measured on its own terms\\n\\nPass
      only if the system answer states the same facts as the accepted answer. Wording
      may\\ndiffer; numbers, names and conclusions may not. If the accepted answer
      is a refusal, pass only\\nif the system also declines to answer rather than
      guessing. Extra correct detail is fine;\\nanything contradicting the accepted
      answer fails.\"}],\"model\":\"claude-opus-5\",\"output_config\":{\"format\":{\"type\":\"json_schema\",\"schema\":{\"type\":\"object\",\"title\":\"Verdict\",\"properties\":{\"reasoning\":{\"type\":\"string\",\"description\":\"One
