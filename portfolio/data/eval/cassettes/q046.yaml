- request:
    body: '{"query": "In the RLVR citation-faithfulness study, what is post-rationalization?",
      "documents": ["Abstract\nA RAG system can hand you the right answer and cite
      a source it did not actually use. Models output these unfaithful citations via
      postrationalization : they write the answer first and then attach a citation
      to whatever passage looks close enough. Search agents are now trained with reinforcement
      learning from verifiable rewards (RLVR), which pays them for getting the answer
      right. We asked whether that training also teaches them to cite honestly.\nImproving
      an existing methodology with a required control, we compared an instructiontuned
      model against three RLVR agents trained from it, on four question-answering
      datasets, using only free-tier Kaggle GPUs. Postrationalization is everywhere:
      on Wikipediabased questions roughly one citation in seven is unfaithful. RLVR
      does not fix it. The agents post-rationalize at their base model''s rate, and
      one lands slightly worse. Rewarding correct answers buys nothing in citation
      faithfulness, so faithfulness has to be trained and measured on its own terms.",
      "Answer (after planting):\n- A no-planting control as an improvement to the
      existing methodology , to get a more accurate idea about post-rationalization.\n-
      The first controlled measurement of postrationalization in RLVR search agents
      , holding the base model, retrieval corpus, prompt, and scorer fixed across
      four datasets.\n- Evidence that answer-only rewards leave citation faithfulness
      exactly where they found it , with a stated detection bound, plus a concrete
      proposal for folding attribution into the reward.\n- A full reproduction on
      free-tier hardware , replacing the 104B Command R+ model of the original study
      with an open 7B model on two T4s.", "7 Conclusion\nWe asked whether training
      RAG search agents for correct answers also teaches them to cite honestly under
      fixed-context inference. We find no detectable improvement. Getting to that
      answer meant repairing the measurement first: we reproduced the planting probe
      of Wallat et al. (2025) on an open 7B model, added the no-planting control it
      lacked, and showed that the control is 0 by construction for the main variant,
      100% for another, and a small measured quantity for the third. With that in
      hand, post-rationalization turns out to be common in an instruction-tuned model,
      roughly one cited sentence in seven on Wikipedia-based questions, and three
      RLVR agents trained from that model reproduce its rate, with one landing slightly
      worse. Faithful citation is not a side effect of answer accuracy. It has to
      be rewarded, measured, and reported on its own, and the probe we describe here
      is cheap enough to do all three inside an existing training loop.", "5.3 RLVR
      does not make citations more faithful\nRaw rates alone cannot answer the RL
      question, since a model could post-rationalize heavily and still be no worse
      than the model it came from. Table 5 therefore reports the difference-indifferences:
      each agent''s attributable rate minus its base model''s, on the same dataset.
      If RLVR taught these agents anything about grounding, this column would run
      negative.", "6 Discussion\nWhat a citation is worth to a reader. Our results
      say that in this setting a citation marks where the words of an answer can be
      found, not where the answer came from. Figure 1 is the honest version of the
      problem: the model knew the answer, had the supporting passage in front of it,
      cited it, and then handed the citation to a cartoon plot summary after we moved
      four words. A reader auditing that citation opens the passage, finds the claim''s
      wording sitting there, and walks away reassured. The audit passes and the provenance
      is still wrong. That is what makes post-rationalization worse than an ordinary
      error: it defeats exactly the check a careful reader would run, at a rate of
      roughly one cited sentence in seven on Wikipedia-style questions, in an openly
      available 7B model, using a plant so crude that we picked it with a character
      count.\nWhy RLVR leaves this untouched. The reward is the whole story. These
      agents earn credit when an automatic checker matches their final answer against
      a reference, and R-Search adds credit for steps along its search trajectory.
      Not one term in those objectives inspects the link between a sentence and the
      passage cited beside it. An agent that retrieves well, reasons well, and then
      attaches the wrong marker collects full reward. Optimization delivers what you
      pay for, so citation behavior stays wherever the base model left it, which is
      exactly the pattern in Table 5: two agents indistinguishable from their base,
      one slightly worse, none better.\nInterpreting the fixed-context result. The
      agents were trained for multi-step search, but our evaluation intentionally
      removes that component to hold evidence constant. Thus, the null result shows
      that RLVR did not produce a detectable attribution effect in this fixed-context
      setting. It does not rule out an effect that emerges through interactive search,
      where retrieval decisions and citation behavior can interact. An allow-retrieval
      evaluation would be needed to test that broader question.\nFixing it means paying
      for it. If answer-only rewards leave attribution where they found it, attribution
      has to enter the objective. The probe in this paper is a ready-made term for
      that. It is deterministic, needs no judge model, and with the control in place
      it isolates the effect of the plant rather than the noise of editing a context,
      so it can run inside a training loop. Concretely, a PPO or GRPO pipeline of
      the kind Search-R1 and ReSearch already use could add an attribution-consistency
      penalty: sample a rollout, plant a span from the model''s own answer into an
      uncited passage, re-score, and penalize the policy when the citation follows
      the plant. The signal is cheap, it is grounded in behavior rather than in a
      learned preference model, and it targets the failure directly instead of hoping
      that better answers drag better citations along behind them. On the evaluation
      side, the same probe yields a number that is comparable across models, which
      is what the field currently lacks for citation faithfulness.", "5.2 Post-rationalization
      is common\nTable 4 gives the attributable rate on REL-UNCITED for every model
      and dataset. Start with the baseline column: 14.0% on NQ, 9.1% on QAMPARI, 14.8%
      on HAGRID, 2.9% on RAGTruth, with confidence intervals of [10.4, 17.8], [6.2,
      12.0], [11.8, 18.2] and [1.8, 3.9] that all sit clear of zero. This clears the
      bar we set in advance, at least 8pp with an interval excluding zero on three
      of four datasets. On the Wikipedia-based datasets that rate means roughly one
      cited sentence in seven points at a passage whose only tie to the claim is four
      words we pasted in. Pooling across datasets gives 10.7%. 1\nTable 4: How often
      each model follows the planted span: attributable rate on REL-UNCITED in %,
      with cited records over all records below. The control is 0 in every cell, so
      these equal the raw rates. Baseline 95% CIs: NQ [10.4, 17.8], QAMPARI [6.2,
      12.0], HAGRID [11.8, 18.2], RAGTruth [1.8, 3.9].\n\nNQ, Baseline = 14.0 52/371.
      NQ, Search-R1 = 12.8 36/281. NQ, ReSearch = 14.1 50/355. NQ, R-Search = 14.7
      57/387. QAMPARI, Baseline = 9.1 29/319. QAMPARI, Search-R1 = 13.4 38/283. QAMPARI,
      ReSearch = 7.5 25/332. QAMPARI, R-Search = 12.2 43/352. HAGRID, Baseline = 14.8
      64/433. HAGRID, Search-R1 = 13.8 53/383. HAGRID, ReSearch = 13.6 59/434. HAGRID,
      R-Search = 18.6 80/430. RAGTruth, Baseline = 2.9 25/864. RAGTruth, Search-R1
      = 4.1 29/699. RAGTruth, ReSearch = 3.6 30/823. RAGTruth, R-Search = 5.9 52/879\nNow
      read across the rows. On NQ the four models land at 14.0, 12.8, 14.1, and 14.7%.
      On HAGRID, 14.8, 13.8, 13.6, and 18.6%. On RAGTruth, 2.9, 4.1, 3.6, and 5.9%.
      The agents track their base model, not each other''s training recipes, and all
      sixteen cells sit far above zero. Post-rationalization is not something RL introduced;
      it is already there in the instruction-tuned model and it survives everything
      done on top.\n1 Pooling was not part of our pre-registered plan, so treat this
      number as exploratory.", "5.1 What the control changes\nREL-UNCITED: the raw
      rate survives untouched. Read the top block: 52 of 371 NQ claims follow the
      plant, and 0 of those same 371 records cite the doctored passage when we take
      the span away. The control column is 0/ n on all four datasets, which is what
      Section 3.3 predicted, because removing four appended words restores the clean
      context exactly and the clean answer never cited that passage for that claim.
      Prediction and measurement agree, so +14.0pp on NQ is not a raw rate that needs
      an asterisk; it is the attributable effect.\nRANDOM: the control is real but
      tiny. Swapping in a passage from an unrelated question does occasionally earn
      a citation on its own, as the 4/433 on HAGRID and 1/864 on RAGTruth show, but
      the effect is small: 0.2% pooled across the 7,625 control records, with 7 of
      16 model-dataset cells at exactly zero and the rest between 0.1% and 0.9% (Appendix
      D). Between 83% and 100% of each raw rate survives as attributable, 97% on average.
      The confound we built this control to catch turned out to be genuine and negligible,
      which is worth knowing precisely because we could not have assumed it.\nCITED-OTHER:
      the raw rate lies, and the control catches it. The bottom block is the reason
      we care about all this. Planted rates run from 78.9% to 89.6%, many times the
      REL-UNCITED rates, and any paper could report them as evidence of rampant post-rationalization.
      The control column explains them away: 69/69, 123/123, 61/61, 623/623. Every
      single control record cites the doctored passage, because this variant selects
      a passage the clean answer already cited elsewhere. Subtract, and the attributable
      effect is negative on all four datasets, from -10.4pp to -21.1pp, with intervals
      that exclude zero. A raw rate of 79-90% here measures our sampling rule and
      nothing else. Under the stricter claim-aligned outcome the same records do show
      genuine post-rationalization, +10.6 to +19.7pp (Appendix D), though only RAGTruth
      has enough questions to pin it down.\nThe moral generalizes past this probe:
      whenever a measurement edits an input and counts how often the output changes,
      report the unedited baseline, and demonstrate rather than assume that it is
      zero.", "5.2 Post-rationalization is common\nRAGTruth stands apart, two to five
      times lower than the rest for every model. Prompt, scorer, and citation format
      are identical across datasets, so the gap belongs to the data. Its passages
      are web text rather than Wikipedia and its answers run longer, and we cannot
      say from four datasets which of those matters. The practical reading is that
      postrationalization rates are domain-dependent, so a single-corpus number should
      not be quoted as a property of a model.", "2 Related Work\nCitations in RAG.
      RAG conditions generation on retrieved passages (Lewis et al., 2020), and benchmarks
      such as ALCE ask models to cite those passages sentence by sentence (Gao et
      al., 2023). Most evaluations score whether a citation is correct : does the
      cited passage support the sentence? Wallat et al. (2025) pushed on a harder
      question: did the model actually use it? Those two can come apart. A model that
      already knows the answer can write it down, scan the passages, and attach the
      one that fits, producing a citation that is correct and unfaithful at the same
      time. Their planting probe exposes the gap, and we reproduce it, then add the
      control it was missing (Section 3).\nRLVR search agents. Search-R1 (Jin et al.,
      2025), ReSearch (Chen et al., 2025), and R-Search (Zhao et al., 2025) teach
      a language model to interleave search calls with reasoning, rewarding it when
      the final answer checks out against a reference. All three release open weights
      trained from Qwen2.5-7B-Instruct, which lets us line each agent up against the
      exact model it grew from. Their papers report answer quality. None of them reports
      how many citations are faithful, which is the gap we fill.\nFaithful reasoning
      is a different question. VERITAS (Xu et al., 2025) showed that the reasoning
      traces of Search-R1 and ReSearch do not always line up with the searches they
      issue, the information they retrieve, or the answers they produce. That is faithfulness
      within the reasoning chain. We ask about faithfulness to the evidence : is the
      cited passage the one the answer leaned on? An agent can narrate its search
      honestly and still misattribute the result, or reason sloppily and cite correctly.
      The two findings sit side by side rather than in conflict.", "Limitations\nEvaluation
      format differs from training. The RLVR agents were trained to search, read,
      and answer across multiple turns in their own tagged format, whereas our evaluation
      supplies five fixed passages and requests a single citation-bearing response.
      This was necessary for the controlled attribution comparison, but it may affect
      how the agents behave: for example, an agent that would normally issue another
      query may instead abstain. The large differences in abstention and format compliance
      are consistent with this possibility, although our data cannot establish the
      mechanism. An interactive evaluation would be needed to determine whether the
      attribution effect differs in the agents'' native search setting.\nWe cannot
      isolate RL itself. Each agent differs from the baseline in three ways at once:
      it was fine-tuned at all, fine-tuned on retrieval data, and fine-tuned with
      reinforcement learning. Without an arm fine-tuned on the same data without RL,
      our comparison is associational. This is the single most valuable addition a
      follow-up could make.\nSearch-R1 saw NQ in training. It was trained on NQ''s
      training split and we evaluate it on KILTNQ. QAMPARI, HAGRID, and RAGTruth are
      clean for all three agents, and R-Search''s pattern is in fact strongest away
      from NQ, but we have not quantified the overlap.\nThe span always lands at the
      end of the passage. Any positional bias in how models pick citations is therefore
      mixed in with the effect of the plant. Randomizing the injection point is the
      obvious next experiment.\nCITED-OTHER is underpowered outside RAGTruth. NQ,
      QAMPARI, and HAGRID yield only 13-43 question clusters for this variant, too
      few for intervals we would defend. RAGTruth alone is large enough.\nWhat a flag
      means. Our scorer is deterministic string matching, so each flag is exactly
      reproducible: the model cited the doctored passage for the aligned claim. Reading
      that as postrationalization is an interpretation we inherit from Wallat et al.
      (2025), and a competing reading exists. After planting, the claim''s words genuinely
      sit in the doctored passage, so citing it could be scored as obedience to ''answer
      from the passages'' rather than as unfaithfulness. Hand-checking a sample of
      flagged cases would settle how often each reading applies, and we have not done
      it.\nScope. Three RLVR agents from one line of work, one base model, English
      only, one prompt, one decoding setting. Citation behavior may well shift with
      the prompt, so our numbers describe this setup until someone varies it.", "5.3
      RLVR does not make citations more faithful\nIt does not. Search-R1 moves by
      -1.2, +4.3, -0.9, and +1.3pp across the four datasets; ReSearch by +0.1, -1.6,
      -1.2, and +0.8pp. Both wander around zero with no pattern, every interval covers
      zero, and the smallest Holm-adjusted p -value in either row is 0.267, nowhere
      near signif- icance. Set that against our detection bound: with 80% power at
      about 7pp, an improvement of that size would have been hard to miss, and nothing
      close to it appears. Training these agents to produce verifiably correct answers
      moved their citation faithfulness by an amount we cannot distinguish from nothing.\nThat
      result is less surprising once you look at what the reward measures. RLVR compares
      the final answer with a reference and pays out accordingly; R-Search also rewards
      steps along its search trajectory. No term anywhere in these objectives asks
      whether the citation attached to a sentence is the passage that produced it.
      Citing the wrong passage is free, so the behavior the agents inherit from Qwen2.5-7B-Instruct
      rides through training untouched.", "Answer (after planting):\nHeath Ledger
      plays the Joker in Batman The Dark Knight [4].\nFigure 1: A real case from our
      baseline model on NQ. Passage [4] is a plot summary of a Batman TV episode;
      it never mentions Heath Ledger or the film. We appended four words from the
      model''s own answer to it (shaded). The model then cites [4] instead of [1],
      although [1] is still in the context and supports the claim. Passages are abridged,
      and the other three retrieved passages are not shown.\npassage. Only someone
      who reads that passage closely notices that it never supported the claim.\nFigure
      1 shows how thin the connection can get. Our baseline model correctly names
      Heath Ledger as the Joker and cites the Heath Ledger article. We then copied
      four words of the model''s own sentence into a plot summary of a Batman cartoon
      and asked again. The answer did not change. The citation moved to the cartoon
      passage, which never answers the original question, while the Ledger article
      stayed right there in the context. Four words were enough to make the model
      cite a source it did not use during inference.\nThis gets more pressing as RAG
      systems move from prompting to training. Search agents such as Search-R1 (Jin
      et al., 2025), ReSearch (Chen et al., 2025), and R-Search (Zhao et al., 2025)
      learn to search, read, and answer through reinforcement learning from verifiable
      rewards (RLVR), where the reward comes from checking the final answer. These
      agents get better at finding answers. Whether they also get better at pointing
      to the passage they used is a separate question, and their reward never asks
      it. That is the question we set out to answer.\nWith a measurement we trust,
      we compared four models that share one base, Qwen2.5-7B-Instruct (Qwen Team,
      2024): the instruction-tuned model itself and three open-weight RLVR agents
      trained from it. One shared base is what makes the comparison clean, since any
      gap between an agent and the baseline comes from training rather than from a
      different model family. We ran all four across four question-answering datasets
      on Kaggle''s T4 GPUs.\nTwo findings stand out. Post-rationalization is common
      and it is not an artifact of RL: our untrained baseline cites unfaithfully for
      roughly one out of seven questions on the Wikipedia-based datasets. Under fixed-context
      inference, RLVR leaves it untouched. Search-R1 and ReSearch track their base
      model within a couple of points in either direction, and R-Search lands slightly
      worse rather than better. Our sample sizes would have caught any shift of about
      seven percentage points, so a large improvement is ruled out. Training a model
      to answer correctly, it turns out, teaches it nothing about citing honestly,
      which means citation faithfulness has to be rewarded and measured directly.\nWe
      contribute:", "4 Experimental Setup\nLeakage drove the dataset choice. NQ is
      where the original probe ran, so we keep it for comparability, but Search-R1
      trained on NQ''s training split and we say so plainly. QAMPARI, HAGRID, and
      RAGTruth were not used to train any of the three agents, so on those datasets
      no gap can be waved away as familiarity with the data. They also sidestep a
      retrieval quirk in NQ: for 186 of 499 NQquestions (37.3%), all five passages
      come from one document, which leaves the model almost no choice about what to
      cite. The other three datasets have no such questions.\nPrompt and generation.
      One prompt does all the work, byte-identical across models and across the clean
      and doctored runs. It tells the model to answer using only the numbered passages,
      to close every sentence with exactly one citation such as [2], and to reply
      ''I don''t know'' when the passages fall short. Decoding is greedy, capped at
      300 new tokens. When any sentence of an answer breaks the one-citation rule
      we drop the whole answer rather than salvage the compliant half, because a partly
      rescued answer reintroduces the claim-to-citation ambiguity the format exists
      to prevent. Models differ sharply in how often they abstain, from 15% to 52%
      of questions; Appendix C takes that apart. The full prompt is in Appendix A.\nReading
      our numbers. Three statistical choices shape every result, and each has a plain
      reason behind it.\nWe resample questions, not claims. A single question yields
      up to seven claims that share one context and one generated answer, so treating
      claims as independent would make our intervals look tighter than they are. We
      use a cluster bootstrap instead: draw whole questions with replacement 2,000
      times, recompute the planted and control conditions on the same draw so the
      pairing survives, and read off the 2.5th and 97.5th percentiles. Every 95% confidence
      interval in this paper is that band, the range of effects our data are consistent
      with.\nWe compare each agent against its own base. Post-rationalization is common
      in the baseline, so reporting that an agent post-rationalizes tells us nothing
      about RL. The question is whether an agent diverges from the model it was trained
      from. That calls for a difference-in-differences: take the plantversus-control
      difference within a model (Equation 1), then difference those differences across
      models,\n<!-- formula-not-decoded -->\nNegative says RLVR made citations more
      faithful, positive says it made them worse, and zero says training left this
      behavior alone. Within each dataset we test all three agents against the baseline
      and correct the three comparisons with the Holm method, so that running three
      tests does not manufacture a significant one.", "5.3 RLVR does not make citations
      more faithful\nTable 5: Each agent''s attributable rate on REL-UNCITED minus
      the baseline''s (DiD, pp), with a 95% bootstrap CI and a Holm-adjusted p -value
      within each dataset. Negative would mean the agent post-rationalizes less than
      its base. Bold marks the only comparison with p < 0 . 05 .\n\nSearch-R1 vs.,
      DiD = baseline. Search-R1 vs., 95% CI = . Search-R1 vs., Holm p = . NQ, DiD
      = - 1.2. NQ, 95% CI = [ - 6.9, 4.2]. NQ, Holm p = 1.000. QAMPARI, DiD = +4.3.
      QAMPARI, 95% CI = [ - 0.5, 9.7]. QAMPARI, Holm p = 0.267. HAGRID, DiD = - 0.9.
      HAGRID, 95% CI = [ - 4.9, 3.2]. HAGRID, Holm p = 1.000. RAGTruth, DiD = +1.3.
      RAGTruth, 95% CI = [ - 0.5, 3.0]. RAGTruth, Holm p = 0.334. ReSearch vs., DiD
      = baseline. ReSearch vs., 95% CI = . ReSearch vs., Holm p = . NQ, DiD = +0.1.
      NQ, 95% CI = [ - 3.9, 4.2]. NQ, Holm p = 1.000. QAMPARI, DiD = - 1.6. QAMPARI,
      95% CI = [ - 5.1, 2.3]. QAMPARI, Holm p = 0.415. HAGRID, DiD = - 1.2. HAGRID,
      95% CI = [ - 4.9, 2.5]. HAGRID, Holm p = 1.000. RAGTruth, DiD = +0.8. RAGTruth,
      95% CI = [ - 0.7, 2.2]. RAGTruth, Holm p = 0.334. R-Search vs., DiD = baseline.
      R-Search vs., 95% CI = . R-Search vs., Holm p = . NQ, DiD = +0.7. NQ, 95% CI
      = [ - 4.6, 5.0]. NQ, Holm p = 1.000. QAMPARI, DiD = +3.1. QAMPARI, 95% CI =
      [ - 1.4, 7.3]. QAMPARI, Holm p = 0.324. HAGRID, DiD = +3.8. HAGRID, 95% CI =
      [ - 0.3, 8.0]. HAGRID, Holm p = 0.234. RAGTruth, DiD = +3.0. RAGTruth, 95% CI
      = [1.2, 4.8]. RAGTruth, Holm p = 0.002", "1 Introduction\nCitations are the
      part of a RAG answer that a careful reader actually checks. The system retrieves
      passages, writes an answer, and marks each sentence with the passage it came
      from (Lewis et al., 2020; Gao et al., 2023); the marker is a promise about provenance.
      Follow [1], the promise says, and you will find where this sentence came from.\nModels
      break that promise more often than they look like they do. Wallat et al. (2025)
      showed that a model will cite a passage it never used, a behavior they call
      post-rationalization : the answer comes first, and the citation gets attached
      afterward to whatever passage looks like a plausible source. What makes this
      failure slippery is that nothing on the surface goes wrong. The answer is right.
      The citation is present, well formed, and points at a real Question:\nWho plays
      Joker in Batman: The Dark Knight?", "Ethics Statement\nThis work uses only publicly
      released models and datasets. It involves no human subjects and no personal
      data. The planted spans are taken from the models'' own answers and are used
      only in offline evaluation. The work describes a way that citations in RAG systems
      can mislead readers, with the aim of making that failure measurable; it does
      not provide a method for attacking deployed systems. Because RLVR training is
      in wide use, we have tried to state the limits of our null result clearly so
      that it is not read as a stronger claim than the data support.", "5.4 One agent
      drifts the wrong way\nR-Search is the exception, and it leans worse rather than
      better. Its DiD is positive on all four datasets (+0.7, +3.1, +3.8, +3.0pp)
      and significant on RAGTruth, our largest cell, at +3.0pp with a 95% CI of [1.2,
      4.8] and a Holm-adjusted p of 0.002. That was the pre-registered condition for
      claiming a model-specific effect, and it is met.\nWe report it with the caveats
      it deserves. On the RANDOM variant R-Search is again higher on three of four
      datasets but significant on none, the closest p being 0.063. Under the looser
      cited-anywhere outcome it dips slightly below the baseline on NQ ( -0.5pp) and
      reaches significance nowhere (Appendix D). The direction is consistent; the
      evidence for its size is not. What we can say is that no agent improved, and
      the one that moved measurably moved the wrong way.", "4.2 Statistical Analysis
      and Metric Audit\nCommon cohorts and estimands. Primary summaries and comparisons
      use the intersection of successful question IDs across identity and all twenty
      compressed settings. Each question has equal weight in citation precision, citation
      recall, answer quality, and evidence F1; claims and citations are not pooled
      across questions. Undefined evidence or recovery metrics remain undefined rather
      than becoming zeros. Verification-rate means exclude answers with zero claims;
      paired verification comparisons exclude a question if ei- ther member has zero
      claims. The analysis artifacts report those exclusions and retain full-cohort
      descriptive means separately.\nInference. We use pointwise 95% percentile bootstrap
      intervals for each paired mean difference (Dror et al., 2018), resampling 944
      questions on ASQA and 271 papers on QASPER with replacement. All retained questions
      from a sampled QASPER paper travel together, and each replicate divides its
      total difference by the number of sampled questions, preserving the questionweighted
      estimand. Every QASPER contrast retains all 271 papers after metric-specific
      exclusions. Two-sided randomization tests swap paired labels within questions
      on ASQA and jointly within papers on QASPER. These tests assume label exchangeability
      within a resampling unit under the null. Both procedures use 10,000 replicates
      and seed 13, with independent random-number streams for bootstrap sampling and
      randomization. Monte Carlo p -values use ( b + 1) / (10 , 000 + 1) , where b
      counts randomizations at least as extreme as the observed absolute difference.
      The initial plan specified 134 core contrasts and 10 recoverythreshold contrasts
      before inspecting the revised inferential results. After that analysis and a
      cachecoverage audit, we added four recovered-source versus summary-verification
      contrasts at nominal 0.25 for RECOMP and LLMLingua-2 on both datasets. The extension
      plan was recorded before running these four tests, and Holm adjustment was recomputed
      over all 148 raw p -values. We denote Holm-adjusted values by p H . All reported
      adjusted values use this expanded family; original effects, intervals, and raw
      p -values are unchanged. This is a post hoc camera-ready analysis, not a preregistration.
      Intervals are pointwise, not simultaneous; statistical-support statements use
      p H < 0 . 05 . Failure to reject a difference does not establish equivalence
      or preservation. All inference is conditional on the fixed generator outputs,
      recovery procedure, and evaluator.\nPrecision-code audit. The manuscript''s
      precision definition requires the concatenated cited evidence to entail a claim
      before any individual citation receives credit. A code audit found that the
      previous implementation could credit an individually supporting citation even
      when joint entailment failed. A saved ASQA answer reproduced this discrepancy,
      and a regression test now checks the required gate through the evaluation pipeline.\n",
      "3.3 The no-planting control\nWallat et al. (2025) report raw planted rates.
      A raw rate answers ''how often does the model cite the doctored passage?'' What
      we need is ''how much of that did the plant cause?'' The two come apart whenever
      editing the context does anything on its own, and a raw rate quietly credits
      the plant with all of it.\nThe fix is to run the same context with the span
      removed and subtract:\n<!-- formula-not-decoded -->\nRead Equation 1 as a before-and-after
      over the same records. The first term counts how often the model takes the bait;
      the second counts how often it would have cited that passage anyway; the difference
      is what the plant actually bought.\nWhat makes this control unusual is that
      we could derive two of its three values before spending a single GPU-hour, just
      by reading how each variant is built.\nREL-UNCITED: the control is 0 by construction.
      Planting here only appends words to a passage already sitting in the context.
      Delete them and the context is byte-for-byte the clean one; with an identical
      prompt and greedy decoding, the control run reproduces the clean answer exactly.
      That clean answer, by the very rule that selected this passage, did not cite
      it for this claim. The control rate is therefore 0 as a matter of definition
      rather than measurement, and the raw rate already is the attributable rate.
      We verified the byte-for-byte claim on all 10,720 records of the two appending
      variants; 6 score above zero, all from RAGTruth answers that repeat an identical
      sentence.\nCITED-OTHER: the control is 100%, so a raw rate is an illusion. This
      variant plants in a passage the clean answer already cites for some other sentence.
      Under the cited-anywhere outcome we are then asking whether a passage that was
      cited stays cited, and it does, by selection. A raw rate here describes our
      sampling rule, not the model''s behavior, which is exactly why the attributable
      rate turns negative in Section 5.1.\nRANDOM: the control has to be measured.
      Here we swap an uncited slot for a passage drawn from a different question,
      then plant in it. Two things change at once, the passage and the span, and no
      amount of reasoning tells us how often a model cites an out-of-place passage
      on its own. This is the one variant that needed fresh runs: 16 GPU jobs, roughly
      10 GPU-hours, and 7,625 control records, each paired with its planted twin.
      The answer came back small. With no plant, models cite the foreign passage in
      17 of 7,625 records, or 0.2%.", "3.2 Emitted vs. Grounded Citations\nWescore
      every run under two views. We write precision as P and recall as R , with subscripts
      e for emitted and g for grounded. Emitted scores citations against the unit
      texts the generator actually saw; it measures consistency with the compressed
      context, and is what one implicitly measures when compressed units are treated
      as citable documents. Grounded fi rst resolves each citation to retrieved source
      spans and scores against those. Units with declared provenance resolve to their
      declared sids. Units without declared provenance pass through our re-attributability
      protocol: rank source snippets by lexical similarity to the unit, run NLI on
      the top 10 candidates, and keep those judged to individually entail the unit
      at \u03c4 . A citation with no recovered span receives no precision credit and
      cannot support recall under this protocol. The reattribution rate is the fraction
      of units without declared provenance with at least one recovered span, averaged
      across examples.\nEvaluator dependence. The same NLI model filters recovered
      spans and scores citation support, creating a circularity risk: selection and
      evaluation errors can be correlated. Lexical retrieval can miss paraphrases,
      and the single-snippet test can reject units supported only by combined evidence.
      Thus failed recovery does not establish that support is absent from the source,
      and the direction of overall scoring bias is unknown. Appendix C reports a second-evaluator
      sensitivity check; human calibration remains absent.\nThe emitted -grounded
      gap is an operational diagnostic of attribution laundering : claims receive
      credit against compressed text that is not supported through the source mappings
      accepted by our protocol. It does not by itself distinguish missing evidence
      from recovery or NLI errors.\nNominal vs. achieved compression. Budgets are
      nominal fractions { 0 . 5 , 0 . 25 , 0 . 1 , 0 . 05 } of each example''s retrieved
      context, enforced in generator-tokenizer tokens. Extractive families track their
      budgets closely, but abstractive compressors emit what their decoder emits:
      RECOMP realizes achieved ratios of 0 . 05 -0 . 08 on ASQA and \u2248 0 . 015
      on QASPER across all four nominal budgets-distinct nominal operating points
      collapse together. All curves therefore use the achieved ratio on the compression
      axis; plotting against nominal budgets would misplace abstractive systems by
      more than an order of magnitude in the worst case."], "model": "rerank-2.5",
