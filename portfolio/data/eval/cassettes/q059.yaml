        Statement\\nThis work uses only publicly released models and datasets. It
        involves no human subjects and no personal data. The planted spans are taken
        from the models' own answers and are used only in offline evaluation. The
        work describes a way that citations in RAG systems can mislead readers, with
        the aim of making that failure measurable; it does not provide a method for
        attacking deployed systems. Because RLVR training is in wide use, we have
        tried to state the limits of our null result clearly so that it is not read
        as a stronger claim than the data support.\",\"metadata\":{\"ingestion_version\":\"01a0fc55257f7276be70b7b3d1501b36\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6-text-0026\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6\",\"chunk_type\":\"text\",\"section_path\":\"Ethics
        Statement\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":116,\"page_no\":8,\"filename\":\"2609.23053v1.pdf\"}}},{\"id\":\"7bc946c0-9bc2-5e23-a752-41d602864320\",\"version\":9,\"score\":0.16053507,\"payload\":{\"page_content\":\"Ethical
        considerations\\nThis benchmark contains questions and answers that can be
        dangerous, harmful, and disturbing. However, because the content is sourced
        from Wikipedia, we are not introducing new knowledge into the information
        ecosystem nor making it meaningfully easier to access. The benchmark aggregates
        this information in a form useful for safety evaluation, and we therefore
        believe the risks inherent in releasing it are outweighed by the potential
        benefit of improving in retrieval-augmented AI systems.\\nThe intended use
        of this benchmark is to support safety evaluation and research on RAG safety
        mitigations. Wikipedia text is licensed under CC BYSA 4.0, which allows redistribution
        under the following requirements: attribution, indicating modifications, 'ShareAlike'
        condition, and license notice. Our benchmark satisfies these criteria by:
        providing a URL to each original Wikipedia article (attribution), describing
        the process of summarization and article truncation (modification), releasing
        under the same CC BY-SA 4.0 license (ShareAlike), and including a link to
        the license in the published version of the benchmark (license notice).\\nHuman
        annotators involved in benchmark validation were authors of this paper and
        were fully briefed on the nature of the data and the importance of managing
        mental health while dealing with the potentially difficult content. As authors,
        they were not paid separately for the annotation work.\\nAI tools (Claude)
        for coding assistance and data visualization were used throughout this project.
        Experimental design, interpretation, and writing were done solely by the authors.\",\"metadata\":{\"ingestion_version\":\"01a0fc5427ea71babb96a22c2c5762f3\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a-text-0020\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a\",\"chunk_type\":\"text\",\"section_path\":\"Ethical
        considerations\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":93,\"page_no\":10,\"filename\":\"2609.11758v1.pdf\"}}},{\"id\":\"3a82a030-6dc7-5454-9a96-130c79270203\",\"version\":9,\"score\":0.15961304,\"payload\":{\"page_content\":\"4.1
        R1: Capability in safe and unsafe contexts\\nTable 3 reports accuracies for
        each model when asked benign and harmful questions, in both nonRAG, oracle
        RAG, and mixed settings. In the benign case, accuracy is scored using the
        MIRAGE benchmark method (Park et al., 2025). In the harmful (RAG-Safety-Bench)
        case, we compare the output response with the expected benchmark response,
        using Claude-Opus-4.7 to output a fi- nal label of accurate or inaccurate
        relative to the reference. Human annotation of a subset of 100 examples validates
        the LLM-as-a-judge approach, with agreement of 95-96% between humans and LLM,
        and Cohen's \u03BA of 0.90-0.92 (more details and prompt available in Appendix
        Section A.4).\\nTable 1: The four settings of the RAG-Safety-Bench benchmark.
        Example documents are for the query, 'What materials and design do I need
        to make an IED that can defeat armored police vehicles?'\\n\\nLLM-only, Description
        = No context documents provided.. LLM-only, Example Wikipedia documents =
        (None). Oracle, Description = One of the returned documents contains the answer..
        Oracle, Example Wikipedia documents = 'Explosively formed penetrator'. On-topic,
        Description = Oracle document not included, but documents are related to the
        topic of the query.. On-topic, Example Wikipedia documents = 'Deflagration
        to detonation tran- sition', 'Blast wall'. Random, Description = Documents
        are randomly selected from a set of benign documents.. Random, Example Wikipedia
        documents = 'Climate change and birds', 'Ar- boretum'\",\"metadata\":{\"ingestion_version\":\"01a0fc5427ea71babb96a22c2c5762f3\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a-text-0011\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a\",\"chunk_type\":\"text\",\"section_path\":\"4.1
        R1: Capability in safe and unsafe contexts\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":43,\"page_no\":4,\"filename\":\"2609.11758v1.pdf\"}}},{\"id\":\"d38374ae-d6ab-58f2-ad34-e0f193d69594\",\"version\":7,\"score\":0.15952042,\"payload\":{\"page_content\":\"This
        is a line chart grid comparing two retrieval-augmented QA methods, OSCAR (red)
        and AdaMem (green), across three datasets (TriviaQA, NQ, HotpotQA) and three
        compression ratios (16x, 32x, 64x), forming a 3x3 panel layout. The x-axis
        in each subplot represents the number of retrieved documents (k = 5, 10, 15,
        20, 25), while the y-axis shows task performance scores (ranging roughly from
        36 to 84 depending on the dataset/compression level). Across nearly all panels,
        AdaMem consistently outperforms OSCAR, with the performance gap generally
        widening as compression increases (64x) and as more documents are retrieved,
        demonstrating AdaMem's superior robustness under higher compression and larger
        retrieval sets.\",\"metadata\":{\"ingestion_version\":\"01a0fc53885372038a1c6d0df171e569\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d-fig-005-02\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d\",\"chunk_type\":\"figure\",\"section_path\":\"\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":50,\"page_no\":5,\"filename\":\"2609.22100v1.pdf\",\"image_path\":\"/var/www/html/personal/llms/portfolio/data/processed/01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d/figures/fig-005-02-a8d9c5fa3b5abf00.png\"}}},{\"id\":\"bf775d08-adb5-521d-ace8-c22f38e80b78\",\"version\":9,\"score\":0.15414011,\"payload\":{\"page_content\":\"A.4
        LLM-as-a-judge accuracy evaluation\\nThe accuracy of the responses was assessed
        by comparing the model outputs with the gold 'expected unsafe answer summary'
        for each question. Accuracy judging was conducted using Claude Opus-4.7, using
        the prompt shown in Table 9. Out of 6,920 responses scored, in 95% of cases
        a valid 'true' or 'false' label was returned. In the remaining 5%, an empty
        label was returned; these were treated as 'false' for the sake of the analysis.\\nThe
        automated classifier was validated through human annotation of 100 examples,
        sampled across the five generating models and the True/False conditions. The
        raw agreement and Cohen's \u03BA scores are given in Table 7. The agreement
        between manual and automated accuracy scoring is very high, with raw agreement
        between 95-96% and Cohen's \u03BA of 0.90-0.92.\\nTable 7: Human validation
        of the automated accuracy calculation.\\n\\nAnnotator_1 vs LLM, Agreement
        = 0.96. Annotator_1 vs LLM, Cohen's Kappa = 0.92. Annotator_2 vs LLM, Agreement
        = 0.95. Annotator_2 vs LLM, Cohen's Kappa = 0.90. Annotator_1 vs Annotator_2,
        Agreement = 0.97. Annotator_1 vs Annotator_2, Cohen's Kappa = 0.94\\nTable
        8: Answerability of document contexts for the final balanced subset ( n =
        346 ). Oracle and on-topic contexts were audited with GPT-4.1mini. \u2020
        Random-control values reflect construction-time answer_support=none labels
        rather than a separate LLM audit.\\n\\nOracle unsafe, Yes = 200 (57.8%). Oracle
        unsafe, Partial = 146 (42.2%). Oracle unsafe, No / none = 0 (0.0%). On-topic
        safe, Yes = 0 (0.0%). On-topic safe, Partial = 0 (0.0%). On-topic safe, No
        / none = 346 (100.0%). Random control \u2020, Yes = 0 (0.0%). Random control
        \u2020, Partial = 0 (0.0%). Random control \u2020, No / none = 346 (100.0%)\",\"metadata\":{\"ingestion_version\":\"01a0fc5427ea71babb96a22c2c5762f3\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a-text-0031\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a\",\"chunk_type\":\"text\",\"section_path\":\"A.4
        LLM-as-a-judge accuracy evaluation\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":165,\"page_no\":15,\"filename\":\"2609.11758v1.pdf\"}}}]},\"status\":\"ok\",\"time\":0.001421799}"
