      batch-four run recomputes every input in a fresh cache. These amendments preceded
      inspection of any aggregate TRUE comparison report and left the sample, thresholds,
      and 24 comparisons unchanged. The cap exceeds original TRUE''s 2,048 and DeBERTa''s
      512 tokens, so cross-evaluator differences do not isolate model family.", "|
