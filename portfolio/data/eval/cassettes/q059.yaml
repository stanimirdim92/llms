      Question Answering. In Proceedings of the 2018 Conference on Empirical Methods
      in Natural Language Processing , 2369-2380. Brussels, Belgium: Association for
      Computational Linguistics.", "5.4 One agent drifts the wrong way\nR-Search is
      the exception, and it leans worse rather than better. Its DiD is positive on
      all four datasets (+0.7, +3.1, +3.8, +3.0pp) and significant on RAGTruth, our
      largest cell, at +3.0pp with a 95% CI of [1.2, 4.8] and a Holm-adjusted p of
      0.002. That was the pre-registered condition for claiming a model-specific effect,
      and it is met.\nWe report it with the caveats it deserves. On the RANDOM variant
      R-Search is again higher on three of four datasets but significant on none,
      the closest p being 0.063. Under the looser cited-anywhere outcome it dips slightly
      below the baseline on NQ ( -0.5pp) and reaches significance nowhere (Appendix
      D). The direction is consistent; the evidence for its size is not. What we can
      say is that no agent improved, and the one that moved measurably moved the wrong
      way.", "Ethics Statement\nThis work uses only publicly released models and datasets.
      It involves no human subjects and no personal data. The planted spans are taken
      from the models'' own answers and are used only in offline evaluation. The work
      describes a way that citations in RAG systems can mislead readers, with the
      aim of making that failure measurable; it does not provide a method for attacking
      deployed systems. Because RLVR training is in wide use, we have tried to state
      the limits of our null result clearly so that it is not read as a stronger claim
      than the data support.", "Ethical considerations\nThis benchmark contains questions
      and answers that can be dangerous, harmful, and disturbing. However, because
      the content is sourced from Wikipedia, we are not introducing new knowledge
      into the information ecosystem nor making it meaningfully easier to access.
      The benchmark aggregates this information in a form useful for safety evaluation,
      and we therefore believe the risks inherent in releasing it are outweighed by
      the potential benefit of improving in retrieval-augmented AI systems.\nThe intended
      use of this benchmark is to support safety evaluation and research on RAG safety
      mitigations. Wikipedia text is licensed under CC BYSA 4.0, which allows redistribution
      under the following requirements: attribution, indicating modifications, ''ShareAlike''
      condition, and license notice. Our benchmark satisfies these criteria by: providing
      a URL to each original Wikipedia article (attribution), describing the process
      of summarization and article truncation (modification), releasing under the
      same CC BY-SA 4.0 license (ShareAlike), and including a link to the license
      in the published version of the benchmark (license notice).\nHuman annotators
      involved in benchmark validation were authors of this paper and were fully briefed
      on the nature of the data and the importance of managing mental health while
      dealing with the potentially difficult content. As authors, they were not paid
      separately for the annotation work.\nAI tools (Claude) for coding assistance
      and data visualization were used throughout this project. Experimental design,
      interpretation, and writing were done solely by the authors.", "4.1 R1: Capability
      in safe and unsafe contexts\nTable 3 reports accuracies for each model when
      asked benign and harmful questions, in both nonRAG, oracle RAG, and mixed settings.
      In the benign case, accuracy is scored using the MIRAGE benchmark method (Park
      et al., 2025). In the harmful (RAG-Safety-Bench) case, we compare the output
      response with the expected benchmark response, using Claude-Opus-4.7 to output
      a fi- nal label of accurate or inaccurate relative to the reference. Human annotation
      of a subset of 100 examples validates the LLM-as-a-judge approach, with agreement
      of 95-96% between humans and LLM, and Cohen''s \u03ba of 0.90-0.92 (more details
      and prompt available in Appendix Section A.4).\nTable 1: The four settings of
      the RAG-Safety-Bench benchmark. Example documents are for the query, ''What
      materials and design do I need to make an IED that can defeat armored police
      vehicles?''\n\nLLM-only, Description = No context documents provided.. LLM-only,
      Example Wikipedia documents = (None). Oracle, Description = One of the returned
      documents contains the answer.. Oracle, Example Wikipedia documents = ''Explosively
      formed penetrator''. On-topic, Description = Oracle document not included, but
      documents are related to the topic of the query.. On-topic, Example Wikipedia
      documents = ''Deflagration to detonation tran- sition'', ''Blast wall''. Random,
      Description = Documents are randomly selected from a set of benign documents..
      Random, Example Wikipedia documents = ''Climate change and birds'', ''Ar- boretum''",
      "This is a line chart grid comparing two retrieval-augmented QA methods, OSCAR
      (red) and AdaMem (green), across three datasets (TriviaQA, NQ, HotpotQA) and
      three compression ratios (16x, 32x, 64x), forming a 3x3 panel layout. The x-axis
      in each subplot represents the number of retrieved documents (k = 5, 10, 15,
      20, 25), while the y-axis shows task performance scores (ranging roughly from
      36 to 84 depending on the dataset/compression level). Across nearly all panels,
      AdaMem consistently outperforms OSCAR, with the performance gap generally widening
      as compression increases (64x) and as more documents are retrieved, demonstrating
      AdaMem''s superior robustness under higher compression and larger retrieval
      sets.", "A.4 LLM-as-a-judge accuracy evaluation\nThe accuracy of the responses
      was assessed by comparing the model outputs with the gold ''expected unsafe
      answer summary'' for each question. Accuracy judging was conducted using Claude
      Opus-4.7, using the prompt shown in Table 9. Out of 6,920 responses scored,
      in 95% of cases a valid ''true'' or ''false'' label was returned. In the remaining
      5%, an empty label was returned; these were treated as ''false'' for the sake
      of the analysis.\nThe automated classifier was validated through human annotation
      of 100 examples, sampled across the five generating models and the True/False
      conditions. The raw agreement and Cohen''s \u03ba scores are given in Table
      7. The agreement between manual and automated accuracy scoring is very high,
      with raw agreement between 95-96% and Cohen''s \u03ba of 0.90-0.92.\nTable 7:
      Human validation of the automated accuracy calculation.\n\nAnnotator_1 vs LLM,
