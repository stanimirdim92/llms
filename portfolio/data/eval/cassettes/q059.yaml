- request:
    body: '{"query": "Which of these systems has been deployed in production, and
      by whom?", "documents": ["4.2 Implementation Details\nWe conduct experiments
      using Qwen3-VL-4BInstruct and Qwen3-VL-8B-Instruct (Bai et al.,\n", "Mehedi
      Khan and Md. Shariful Islam Bhuyan\nDepartment of Computer Science and Engineering\nBangladesh
      University of Engineering and Technology mehedi.72.khan@gmail.com , sharifulislam@cse.buet.ac.bd",
      "3.4 Models\nWe consider five open-source LLMs in the current study: Gemma-3-12B-It,
      Llama-3.1-8BInstruct, Ministral-3-8B-Instruct, Qwen-2.5-7BInstruct, and Phi-4-14B.
      Each model was prompted with the unsafe query and allowed to generate a maximum
      of 1024 new tokens. All experiments were run on an academic research cluster
      with H100 GPUs. We did not test any commercial models because the questions
      in our benchmark would violate the terms of service of the APIs.", "6 Conclusion\nWe
      introduce RAG-Safety-Bench with the goal of disentangling the effects of RAG
      on LLM safety by cleanly separating four retrieval conditions. Across five open-source
      models, our results show that the most interesting failure mode is model-specific:
      for Qwen-2.5-7B, on-topic but answer-free documents elicited more harmful responses
      than the non-RAG baseline, consistent with the hypothesis that topicrelevant
      context can surface harmful information from parametric memory.\nMore generally,
      our findings confirm that nonRAG safety evaluations do not transfer to RAG deployments.
      Our initial results from the benchmark only evaluate the baked-in safety guardrails
      of the base model. However, in a production system, responsible AI practitioners
      should provide end-toend safety measures including (when warranted): corpus
      curation, input prompt filtering, retrievalside filtering, output filtering,
      and system prompt safety instructions, among other possible mitigations. Thus
      an important use case for our benchmark is also to evaluate the impact of safety
      interventions at different points in the multi-component RAG pipeline. Our results
      also indicate the need to choose an automated safety evaluator which is closely
      aligned with the safety concerns relevant to the particular application, and
      where possible to deploy multiple safety judges, as well as appropriate human
      oversight.", "Limitations\nThe current findings must be interpreted with the
      following limitations in mind. RAG-Safety-Bench is English-only, considers only
      one document source (Wikipedia), and covers a non-exhaustive set of possible
      harm categories. Further work is required to understand how retrieval-enabled
      LLMs behave in languages other than English and in multiple use contexts. The
      current study highlighted how assessments of safety can be subjective; clearly,
      the type of potentially dangerous information that can be returned to a trained
      intelligence officer versus a layperson versus a schoolchild are very different
      and such use cases must be assessed separately.\nBy design, our benchmark does
      not evaluate the impact of the retriever in the RAG system. However, and end-to-end
      evaluation would also need to assess interactions between retriever ranking,
      query reformulation, and generator safety. Our benchmark also represents a simplified
      view of RAG methodology, while production RAG systems would likely include additional
      safety components, such as system-level safety instructions and input/output
      filters.\nOur testing suite of models included only opensource models, and relatively
      small models due to computing resource constraints. Again, real-world RAG deployments
      will likely use much larger commercial models. We note that our RAG-SafetyBench
      benchmark can be used to evaluate such models, and that our reason for not doing
      so was to avoid being banned for Terms-of-Service violations. We encourage researchers
      with internal access to such models to use our benchmark and publish the results.\nOur
      methodology for benchmark generation and automated assessment relies heavily
      on the Claude family of models from Anthropic. While we did conduct human evaluations
      to validate Claude''s performance, a more robust (though expensive) methodology
      could combine multiple strong LLM judges in an ensemble. Furthermore, we evaluate
      on a single run of the benchmark, but due to the stochastic nature of LLM generation,
      the results might differ across multiple runs.", "4 Experimental Setup\nWe know
      what size of effect we could have caught. Our sample sizes give 80% power to
      detect a difference of roughly 7 percentage points (pp). Plainly: had RLVR moved
      post-rationalization by 7pp or more in either direction, this design would almost
      certainly have caught it. Shifts of a couple of points stay inside our blind
      spot, which is why we report a bounded null rather than a flat absence of effect.
      We fixed the primary outcome and the family of corrected comparisons in writing
      before the scorer ran.\nCompute. Everything ran on Kaggle''s free tier, two
      T4s or a single P100 per session: 48 GPU jobs yielding 36,690 scored records
      across four models, four datasets, three variants, and both conditions. The
      original study used a 104B model; the controlled version of the same measurement
      fits on hardware anyone can get for free, and that is the part we would most
      like other groups to borrow.", "Conclusion\nJiang, A. Q.; Sablayrolles, A.;
      Mensch, A.; Bamford, C.; Chaplot, D. S.; de las Casas, D.; Bressand, F.; Lengyel,
      G.; Lample, G.; Saulnier, L.; Lavaud, L. R.; Lachaux, M.-A.; Stock, P.; Scao,
      T. L.; Lavril, T.; Wang, T.; Lacroix, T.; and Sayed, W. E. 2023a. Mistral 7B.
      arXiv:2310.06825.\nJiang, H.; Wu, Q.; Lin, C.-Y.; Yang, Y.; and Qiu, L. 2023b.
      LLMLingua: Compressing Prompts for Accelerated Inference of Large Language Models.
      In Bouamor, H.; Pino, J.;\nand Bali, K., eds., Proceedings of the 2023 Conference
      on Empirical Methods in Natural Language Processing , 1335813376. Singapore:
      Association for Computational Linguistics.\nJiang, H.; Wu, Q.; Luo, X.; Li,
      D.; Lin, C.-Y.; Yang, Y.; and Qiu, L. 2024. LongLLMLingua: Accelerating and
      enhancing llms in long context scenarios via prompt compression. In Proceedings
      of the 62nd Annual Meeting of the Association for Computational Linguistics
      (Volume 1: Long Papers) , 1658-1677.\nJoshi, M.; Choi, E.; Weld, D.; and Zettlemoyer,
      L. 2017. TriviaQA: A Large Scale Distantly Supervised Challenge Dataset for
      Reading Comprehension. In Barzilay, R.; and Kan, M.-Y., eds., Proceedings of
      the 55th Annual Meeting of the Association for Computational Linguistics (Volume
      1: Long Papers) , 1601-1611. Vancouver, Canada: Association for Computational
      Linguistics.\nKelly, F. P.; Maulloo, A. K.; and Tan, D. K. H. 1998. Rate control
      for communication networks: shadow prices, proportional fairness and stability.
      Journal of the Operational Research Society , 49(3): 237-252.\nKim, Y.; and
      Rush, A. M. 2016. Sequence-Level Knowledge Distillation. In Su, J.; Duh, K.;
      and Carreras, X., eds., Proceedings of the 2016 Conference on Empirical Methods
      in Natural Language Processing , 1317-1327. Austin, Texas: Association for Computational
      Linguistics.\nKrithara, A.; Nentidis, A.; Bougiatiotis, K.; and Paliouras, G.
      2023. BioASQ-QA: A manually curated corpus for Biomedical Question Answering.
      Scientific Data , 10(1): 170.", "A. Setting\nAll runs use the corpus of 19,597
      FEVER dev evidence sentences plus the ten added passages, the MiniLM retriever,
      and the quantized Llama 3.1 8B generator described above, with k = 3 and temperature
      0.1 held fixed. The dataset comes from the FEVER benchmark of Thorne et al.
      [2], which pairs claims with Wikipedia evidence and is a standard resource for
      fact verification.", "C Second-Evaluator Sensitivity Audit\nWe sample 100 questions
      per dataset from sorted common-cohort IDs using a fresh Python seed13 random
      generator; QASPER spans 84 papers. Full-context identity and nominal-0.25 extraction,
      RECOMP, and LLMLingua-2 contribute 800 unchanged saved answers, with 1,627 claims
      and 1,890 citation markers. The prior DeBERTa values are the original scores
      for these same sampled answers.\nModel and decoding. We use google/t5_xxl_true_nli_mixture
      (Honovich et al., 2022), revision aa6cfe1dd4 , with full revision and checkpoint
      hashes in the manifest. This released mixture uses SNLI, MNLI, FEVER, SciTail,
      PAWS, and VitaminC (Bowman et al., 2015; Williams et al., 2018; Thorne et al.,
      2018; Khot et al., 2018; Zhang et al., 2019; Schuster et al., 2021), rather
      than the original TRUE paper''s ANLI recipe. MNLI and FEVER overlap DeBERTa''s
      training mixture. Inference uses Transformers 4.57.6, the slow T5 tokenizer,
      BF16, batch size four, and one NVIDIA B200. The prompt places compressed text
      or source evidence after premise: and the unit or claim after hypothesis: .\nWe
      use an AutoAIS-style exact-one decision (Bohnet et al., 2022; Gao et al., 2023):
      generate at most ten tokens deterministically, strip surrounding whitespace,
      and count only 1 as entailment. Every other string scores zero; these are binary
      decisions, not calibrated probabilities. Unlike our rule, reference AutoAIS/ALCE
      code compares decoded strings without additional whitespace normalization. We
      retain normalized nonbinary strings, but not every raw output, so normalization''s
      effect cannot be quantified from the cache.\nEvidence mappings. Fixed recovery
      preserves declared provenance and DeBERTa-recovered source IDs while TRUE scores
      support. TRUE recovery reevaluates all top-10 lexical candidates for undeclared
      units, including DeBERTa-rejected candidates, then scores with TRUE. Both retain
      the corrected precision gate. Fixed recovery retains selection dependence; TRUE
      recovery reuses one judge. Neither removes bounded-search errors or supplies
      human calibration.\nRecorded amendments. Astrict-decoding pilot stopped on a
      nonbinary output; a second stopped on an overlong hypothesis. An input-only
      scan found five undeclared units exceeding 2,048 tokens (maximum hypothesis
      plus prompt: 2,988), motivating a uniform 4,096-token cap that preserves complete
      hypotheses and truncates only premises. A later batch-eight run exhausted GPU
