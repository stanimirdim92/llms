        Implementation Details\\nWe conduct experiments using Qwen3-VL-4BInstruct
        and Qwen3-VL-8B-Instruct (Bai et al.,\\n\",\"metadata\":{\"ingestion_version\":\"01a0fc547d2f738da4fc73667c19a759\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-afd90130549e21e7d5d373e21bd00946-text-0014\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-afd90130549e21e7d5d373e21bd00946\",\"chunk_type\":\"text\",\"section_path\":\"4.2
        Implementation Details\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":72,\"page_no\":6,\"filename\":\"2609.14066v1.pdf\"}}},{\"id\":\"d2776b5d-c4ee-5aab-a594-0442a85fe759\",\"version\":15,\"score\":0.20543906,\"payload\":{\"page_content\":\"Mehedi
        Khan and Md. Shariful Islam Bhuyan\\nDepartment of Computer Science and Engineering\\nBangladesh
        University of Engineering and Technology mehedi.72.khan@gmail.com , sharifulislam@cse.buet.ac.bd\",\"metadata\":{\"ingestion_version\":\"01a0fc55257f7276be70b7b3d1501b36\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6-text-0000\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6\",\"chunk_type\":\"text\",\"section_path\":\"Mehedi
        Khan and Md. Shariful Islam Bhuyan\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":2,\"page_no\":1,\"filename\":\"2609.23053v1.pdf\"}}},{\"id\":\"77946552-442f-5641-8c11-f9568213bdb6\",\"version\":9,\"score\":0.19898784,\"payload\":{\"page_content\":\"3.4
        Models\\nWe consider five open-source LLMs in the current study: Gemma-3-12B-It,
        Llama-3.1-8BInstruct, Ministral-3-8B-Instruct, Qwen-2.5-7BInstruct, and Phi-4-14B.
        Each model was prompted with the unsafe query and allowed to generate a maximum
        of 1024 new tokens. All experiments were run on an academic research cluster
        with H100 GPUs. We did not test any commercial models because the questions
        in our benchmark would violate the terms of service of the APIs.\",\"metadata\":{\"ingestion_version\":\"01a0fc5427ea71babb96a22c2c5762f3\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a-text-0010\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a\",\"chunk_type\":\"text\",\"section_path\":\"3.4
        Models\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":40,\"page_no\":4,\"filename\":\"2609.11758v1.pdf\"}}},{\"id\":\"20fd44c5-f345-560a-92d1-524ad6c48da6\",\"version\":9,\"score\":0.18693857,\"payload\":{\"page_content\":\"6
        Conclusion\\nWe introduce RAG-Safety-Bench with the goal of disentangling
        the effects of RAG on LLM safety by cleanly separating four retrieval conditions.
        Across five open-source models, our results show that the most interesting
        failure mode is model-specific: for Qwen-2.5-7B, on-topic but answer-free
        documents elicited more harmful responses than the non-RAG baseline, consistent
        with the hypothesis that topicrelevant context can surface harmful information
        from parametric memory.\\nMore generally, our findings confirm that nonRAG
        safety evaluations do not transfer to RAG deployments. Our initial results
        from the benchmark only evaluate the baked-in safety guardrails of the base
        model. However, in a production system, responsible AI practitioners should
        provide end-toend safety measures including (when warranted): corpus curation,
        input prompt filtering, retrievalside filtering, output filtering, and system
        prompt safety instructions, among other possible mitigations. Thus an important
        use case for our benchmark is also to evaluate the impact of safety interventions
        at different points in the multi-component RAG pipeline. Our results also
        indicate the need to choose an automated safety evaluator which is closely
        aligned with the safety concerns relevant to the particular application, and
        where possible to deploy multiple safety judges, as well as appropriate human
        oversight.\",\"metadata\":{\"ingestion_version\":\"01a0fc5427ea71babb96a22c2c5762f3\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a-text-0018\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a\",\"chunk_type\":\"text\",\"section_path\":\"6
        Conclusion\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":85,\"page_no\":9,\"filename\":\"2609.11758v1.pdf\"}}},{\"id\":\"710d0b17-8e1f-59b5-a11b-1ab94cc0c2b1\",\"version\":9,\"score\":0.18272112,\"payload\":{\"page_content\":\"Limitations\\nThe
        current findings must be interpreted with the following limitations in mind.
        RAG-Safety-Bench is English-only, considers only one document source (Wikipedia),
        and covers a non-exhaustive set of possible harm categories. Further work
        is required to understand how retrieval-enabled LLMs behave in languages other
        than English and in multiple use contexts. The current study highlighted how
        assessments of safety can be subjective; clearly, the type of potentially
        dangerous information that can be returned to a trained intelligence officer
        versus a layperson versus a schoolchild are very different and such use cases
        must be assessed separately.\\nBy design, our benchmark does not evaluate
        the impact of the retriever in the RAG system. However, and end-to-end evaluation
        would also need to assess interactions between retriever ranking, query reformulation,
        and generator safety. Our benchmark also represents a simplified view of RAG
        methodology, while production RAG systems would likely include additional
        safety components, such as system-level safety instructions and input/output
        filters.\\nOur testing suite of models included only opensource models, and
        relatively small models due to computing resource constraints. Again, real-world
        RAG deployments will likely use much larger commercial models. We note that
        our RAG-SafetyBench benchmark can be used to evaluate such models, and that
        our reason for not doing so was to avoid being banned for Terms-of-Service
        violations. We encourage researchers with internal access to such models to
        use our benchmark and publish the results.\\nOur methodology for benchmark
        generation and automated assessment relies heavily on the Claude family of
        models from Anthropic. While we did conduct human evaluations to validate
        Claude's performance, a more robust (though expensive) methodology could combine
        multiple strong LLM judges in an ensemble. Furthermore, we evaluate on a single
        run of the benchmark, but due to the stochastic nature of LLM generation,
        the results might differ across multiple runs.\",\"metadata\":{\"ingestion_version\":\"01a0fc5427ea71babb96a22c2c5762f3\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a-text-0019\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a\",\"chunk_type\":\"text\",\"section_path\":\"Limitations\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":88,\"page_no\":9,\"filename\":\"2609.11758v1.pdf\"}}},{\"id\":\"a9d96eb0-e563-5a4a-be72-fdfa293a765e\",\"version\":15,\"score\":0.18176621,\"payload\":{\"page_content\":\"4
        Experimental Setup\\nWe know what size of effect we could have caught. Our
        sample sizes give 80% power to detect a difference of roughly 7 percentage
        points (pp). Plainly: had RLVR moved post-rationalization by 7pp or more in
        either direction, this design would almost certainly have caught it. Shifts
        of a couple of points stay inside our blind spot, which is why we report a
        bounded null rather than a flat absence of effect. We fixed the primary outcome
        and the family of corrected comparisons in writing before the scorer ran.\\nCompute.
        Everything ran on Kaggle's free tier, two T4s or a single P100 per session:
        48 GPU jobs yielding 36,690 scored records across four models, four datasets,
        three variants, and both conditions. The original study used a 104B model;
        the controlled version of the same measurement fits on hardware anyone can
        get for free, and that is the part we would most like other groups to borrow.\",\"metadata\":{\"ingestion_version\":\"01a0fc55257f7276be70b7b3d1501b36\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6-text-0012\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6\",\"chunk_type\":\"text\",\"section_path\":\"4
