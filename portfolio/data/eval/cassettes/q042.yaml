        Results on Common Questions\\nTables 4 and 5 report all primary settings.
        \u03C1 : nominal budget; \u02C6 \u03C1 : achieved ratio; P g /R g : grounded
        citation precision/recall; P e : emitted citation precision; reattr.: re-attribution
        rate (units without declared provenance recovering at least one source span
        under the NLI protocol); U s /U m : unsupported-claim rate under declared-span-only
        and summary-checked verification; str-EM: answer string exact match (ASQA);
        EF1: declaredevidence F1 (QASPER only). Every setting uses the same 944 ASQA
        or 976 QASPER successful questions; n denotes that common cohort, with metric-specific
        omissions identified in the tables. Scores are question-weighted means over
        defined values; superscript n = \xB7 \xB7 \xB7 gives the nonmissing count
        when smaller than the cohort, and dashes mark undefined metrics. QASPER verification
        rates exclude 1, 2, 3, and 2 zero-claim RECOMP answers at nominal budgets
        0.50, 0.25, 0.10, and 0.05, respectively; other settings use the full cohort.
        The 1 . 00 declared-span rates for noprovenance methods are structural; this
        verification mode does not attempt recovery. Exploratory slot-compressor runs
        are excluded. RECOMP emits identical per-question contexts at nominal budgets
        0.50 and 0.25 on ASQA, and at 0.50, 0.25, and 0.10 on QASPER. Separate generation
        passes are retained as distinct operating points.\",\"metadata\":{\"ingestion_version\":\"01a0fc54ff9a70d3af0e9b49e864b8b9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde-text-0027\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde\",\"chunk_type\":\"text\",\"section_path\":\"A
        Results on Common Questions\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":131,\"page_no\":13,\"filename\":\"2609.14245v1.pdf\"}}},{\"id\":\"a44c45f3-30fe-539c-8e4c-b53e70d91aee\",\"version\":5,\"score\":0.46347776,\"payload\":{\"page_content\":\"D.
        Evaluation Metrics\\nFor every run the model retrieves once, then answers
        twice: once from the clean passages and once from a poisoned copy of that
        same list. Passage identity and order are therefore shared across the pair;
        what is not locked is decoding (temperature 0.1, two independent generate
        calls). Four quantities are recorded.\\nAccuracy checks whether the reference
        keyword for a question appears in the answer, case-insensitively. Keyword
        presence is a coarse label: a negated or qualified answer can still contain
        the keyword, and an otherwise correct paraphrase can miss it. We keep it because
        it is reproducible and applied uniformly, not because it is a gold standard.
        Fooled rate is the fraction of runs where the clean answer was correct but
        the poisoned answer was not; it isolates correct-to-incorrect flips from questions
        the model could not answer anyway. It is not a direct measure of poison adoption,
        because an incorrect poisoned answer may abstain, contradict the poison, or
        state a third wrong fact. Abstention rate counts answers that decline to commit,
        detected through a small set of phrases such as 'not enough information' and
        'cannot determine.' Unsupported generation (reported in earlier drafts as
        a hallucination proxy) is approximated by lexical overlap: an answer is flagged
        when fewer than 30% of its content words appear in any retrieved passage,\\n<!--
        formula-not-decoded -->\\nwith W a the content words of the answer and W d
        those of the retrieved passages. Lexical overlap confuses faithful paraphrase
        with unsupported invention, and it can miss answers that copy poisoned text.
        We treat the proxy as a trend indicator only.\",\"metadata\":{\"ingestion_version\":\"01a0fc53392f724b972307d03a9f94d9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead-text-0005\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead\",\"chunk_type\":\"text\",\"section_path\":\"D.
        Evaluation Metrics\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":25,\"page_no\":2,\"filename\":\"2609.09243v1.pdf\"}}},{\"id\":\"4dcbbe24-cdd2-5b3f-b8f6-a9f0f4d50acc\",\"version\":13,\"score\":0.4488263,\"payload\":{\"page_content\":\"4.1
        Experimental Setup\\nWe evaluate on two attribution benchmarks with different
        retrieval granularities. ASQA comprises 948 ambiguous factoid questions from
        the ALCE release (Gao et al., 2023), each paired with the top-5 GTR-retrieved
        passages, sentencesegmented into citable snippets; answer quality is string
        exact match (str-EM). QASPER (Dasigi et al., 2021) is the 1,005-question dev
        split over 281 NLP papers, using each supplied paper's abstract and full text.
        Gold evidence is paragraphlevel, so identity presents paragraphs as citable
        units while compressors operate on sentence snippets; declared sids map to
        paragraphs for setF1 against gold evidence, max over annotators. The generator
        is Qwen2.5-7B-Instruct served via vLLM with greedy decoding and ALCE-style
        numbered-context citation prompting (Gao et al., 2023). Primary entailment
        judgments use the development-grade DeBERTa NLI evaluator of \xA73.1 at \u03C4
        = 0 . 5 . We compare six compressors: identity (no compression; documentlevel
        on ASQA, paragraph-level on QASPER), cross-encoder rerank topk (ms-marco-MiniLML-6-v2),
        embedding-based extractive sentence selection (all-MiniLM-L6-v2), the RECOMP
        abstractive summarizer (NQ checkpoint) (Xu et al., 2024), LLMLingua-2 token
        pruning (Pan et al., 2024), and our extract-cluster-rewrite (ECR) variant,
        which ranks sentences, greedily clusters nearduplicates by Jaccard word overlap
        (threshold 0.5, with a negation guard), and emits one unit per cluster-the
        highest-relevance member sentence verbatim-citing all member sentence ids.
        Although LLMLingua-2 prunes tokens verbatim, its output is a token stream
        with no unit-level sid mapping in our pipeline, so it declares no provenance
        and is scored with the no-provenance family alongside RECOMP. Each compressor
        runs at nominal budgets { 0 . 5 , 0 . 25 , 0 . 1 , 0 . 05 } of the retrieved
        context, enforced in generator-tokenizer tokens. Because compressors do not
        reliably hit their nominal budgets, the frontier figures and primary summary
        tables report the achieved ratio: RECOMP's summary length is nearly budget-independent,
        saturating at achieved ratios of 0.05-0.08 on ASQA and \u2248 0.015 on QASPER
        across all four nominal budgets. All primary comparisons use the same successful
        questions across all 21 settings: 944 on ASQA and 976 from 271 papers on QASPER.
        Only identity has failures: 4 budget-check failures on ASQA, and 15 budget-check
        plus 14 promptoverflow failures on QASPER; their question IDs are excluded
        from every primary setting. Fullcohort descriptive aggregates remain available
        in the evaluation artifacts.\",\"metadata\":{\"ingestion_version\":\"01a0fc54ff9a70d3af0e9b49e864b8b9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde-text-0008\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde\",\"chunk_type\":\"text\",\"section_path\":\"4.1
        Experimental Setup\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":33,\"page_no\":4,\"filename\":\"2609.14245v1.pdf\"}}},{\"id\":\"3b9dd4cf-7c9d-5a88-b06f-a100567f4a63\",\"version\":5,\"score\":0.4481552,\"payload\":{\"page_content\":\"A.
        Setting\\nAll runs use the corpus of 19,597 FEVER dev evidence sentences plus
        the ten added passages, the MiniLM retriever, and the quantized Llama 3.1
        8B generator described above, with k = 3 and temperature 0.1 held fixed. The
        dataset comes from the FEVER benchmark of Thorne et al. [2], which pairs claims
        with Wikipedia evidence and is a standard resource for fact verification.\",\"metadata\":{\"ingestion_version\":\"01a0fc53392f724b972307d03a9f94d9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead-text-0007\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead\",\"chunk_type\":\"text\",\"section_path\":\"A.
        Setting\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":33,\"page_no\":2,\"filename\":\"2609.09243v1.pdf\"}}},{\"id\":\"2fae35a8-3987-5d65-8f18-c970ac738605\",\"version\":13,\"score\":0.44644892,\"payload\":{\"page_content\":\"Table
