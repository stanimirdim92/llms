    body: '{"query": "Which NLI evaluator and threshold do the primary scores use?",
      "documents": ["C Second-Evaluator Sensitivity Audit\nWe sample 100 questions
      per dataset from sorted common-cohort IDs using a fresh Python seed13 random
      generator; QASPER spans 84 papers. Full-context identity and nominal-0.25 extraction,
      RECOMP, and LLMLingua-2 contribute 800 unchanged saved answers, with 1,627 claims
      and 1,890 citation markers. The prior DeBERTa values are the original scores
      for these same sampled answers.\nModel and decoding. We use google/t5_xxl_true_nli_mixture
      (Honovich et al., 2022), revision aa6cfe1dd4 , with full revision and checkpoint
      hashes in the manifest. This released mixture uses SNLI, MNLI, FEVER, SciTail,
      PAWS, and VitaminC (Bowman et al., 2015; Williams et al., 2018; Thorne et al.,
      2018; Khot et al., 2018; Zhang et al., 2019; Schuster et al., 2021), rather
      than the original TRUE paper''s ANLI recipe. MNLI and FEVER overlap DeBERTa''s
      training mixture. Inference uses Transformers 4.57.6, the slow T5 tokenizer,
      BF16, batch size four, and one NVIDIA B200. The prompt places compressed text
      or source evidence after premise: and the unit or claim after hypothesis: .\nWe
      use an AutoAIS-style exact-one decision (Bohnet et al., 2022; Gao et al., 2023):
      generate at most ten tokens deterministically, strip surrounding whitespace,
      and count only 1 as entailment. Every other string scores zero; these are binary
      decisions, not calibrated probabilities. Unlike our rule, reference AutoAIS/ALCE
      code compares decoded strings without additional whitespace normalization. We
      retain normalized nonbinary strings, but not every raw output, so normalization''s
      effect cannot be quantified from the cache.\nEvidence mappings. Fixed recovery
      preserves declared provenance and DeBERTa-recovered source IDs while TRUE scores
      support. TRUE recovery reevaluates all top-10 lexical candidates for undeclared
      units, including DeBERTa-rejected candidates, then scores with TRUE. Both retain
      the corrected precision gate. Fixed recovery retains selection dependence; TRUE
      recovery reuses one judge. Neither removes bounded-search errors or supplies
      human calibration.\nRecorded amendments. Astrict-decoding pilot stopped on a
      nonbinary output; a second stopped on an overlong hypothesis. An input-only
      scan found five undeclared units exceeding 2,048 tokens (maximum hypothesis
      plus prompt: 2,988), motivating a uniform 4,096-token cap that preserves complete
      hypotheses and truncates only premises. A later batch-eight run exhausted GPU
      memory. All interrupted attempts and plans are preserved but excluded; the final
      batch-four run recomputes every input in a fresh cache. These amendments preceded
      inspection of any aggregate TRUE comparison report and left the sample, thresholds,
      and 24 comparisons unchanged. The cap exceeds original TRUE''s 2,048 and DeBERTa''s
      512 tokens, so cross-evaluator differences do not isolate model family.", "C
      Second-Evaluator Sensitivity Audit\nInference and diagnostics. The separate
      24-test family uses pointwise 95% bootstrap intervals and two-sided randomization
      tests, each with 10,000 replicates and seed 13, question resampling on ASQA
      and paper clustering on QASPER, with question-weighted means and Holm adjustment.
      The original 148-test analysis is unchanged. Tables 11-12 report precision means
      and all planned contrasts. All 16 emitted-grounded gaps remain positive after
      adjustment; the eight cross-evaluator precision differences remain unresolved,
      which does not establish equivalence. ECR and other budgets are outside this
      audit.\nThe run scored 6,015 unique pairs in 419 seconds of model inference
      (430 seconds including bookkeeping; setup and excluded attempts are additional).
      Four inputs required truncation, with maximum pre-truncation length 47,440 tokens.
      After normalization, 122 pairs (2.03%) produced nonbinary strings, including
      103 empty strings; assigning zero does not establish reliable nonentailment.
      These are pair counts, not fractions of questions affected; the full histogram
      accompanies the cache. Recovery can disagree substantially: QASPER LLMLingua-2
      has 50.3% agreement over 1,000 candidate decisions and mean recovery rates of
      0.84 for DeBERTa versus 0.38 for TRUE. These descriptive results support sensitivity
      analysis, not accuracy against human judgments.\n", "3.1 Setup\nOur pipeline
      is retrieve \u2192 compress \u2192 generate \u2192 evaluate. A compressor maps
      the retrieved snippets (sentence-segmented, each with a stable source id, sid
      ) to a sequence of units , and every unit either declares provenance-the set
      of sids it was selected from, as in extractive familiesor declares none, as
      in abstractive families. The generator sees the units as a numbered context
      and is prompted, ALCE-style, to attach bracketed unit citations to each answer
      sentence (Gao et al., 2023). Citation quality is scored per answer statement
      with an NLI evaluator in the attributableto-identified-sources sense (Rashkin
      et al., 2023; Bohnet et al., 2022): a statement is recalled iff the concatenation
      of its resolvable cited sources entails it, and a citation is precise iff that
      concatenation entails the statement and, in addition, the cited source alone
      entails it or removing that source breaks the concatenation''s entailment (Gao
      et al., 2023). We use DeBERTa-v3-base (MNLI+FEVER+ANLI) at threshold \u03c4
      =0 . 5 , truncating each NLI input to 512 model tokens. Entailment decisions
      below are this model''s predictions, not independently validated judgments of
      source support. Per-example harness failures occur only in identity (4 of 948
      on ASQA, 29 of 1,005 on QASPER); every primary setting excludes those same question
      IDs, with failure counts retained.", "Sensitivity to the re-attribution threshold.\nSecond-evaluator
      sensitivity. We rescore 100 questions per dataset with TRUE T5-XXL (Honovich
      et al., 2022), covering full-context identity plus extraction, RECOMP, and LLMLingua-2
      at nominal 0.25. With source mappings fixed, RECOMP''s emitted/grounded precision
      is 0.78/0.13 on ASQA and 0.44/0.01 on QASPER. The paired gaps are 0.65 [0.55,
      0.75] and 0.43 [0.33, 0.53], respectively. When TRUE also selects recovered
      spans, grounded precision is 0.14 and 0.03. All 16 planned emitted-minus-grounded
      precision and recall gaps across both methods, datasets, and recovery modes
      are positive ( p H = 0 . 0024 in a separate 24-test family). None of the eight
      cross-evaluator grounded-precision differences passes Holm adjustment; this
      does not establish equivalence or validate the primary numbers. Appendix C reports
      all comparisons, the 4,096-token input configuration, decoder anomalies, and
      documented restarts. The pattern persists under a second scoring family, with
      recovery and calibration limitations retained.", "9 Limitations\nEvaluator dependence.
      Primary scores use DeBERTa-v3-base, trained on MNLI, FEVER, and ANLI, at \u03c4
      = 0 . 5 , without human calibration. Using the same model to select recovered
      spans and score support can reinforce systematic errors; the resulting scores
      are evaluator-dependent estimates, not validated rates of source support or
      factual correctness. This dependence also limits conclusions about method rankings
      and the size of emitted-grounded gaps. The 200-question TRUE audit checks a
      second scoring family, but fixed recovery retains DeBERTa selection and TRUE
      recovery reuses one judge. Different input windows and nonbinary decoder outputs
      further limit numerical comparison. Human source-level calibration remains necessary
      (Rashkin et al., 2023).\nSingle generator. All results use Qwen2.5-7BInstruct
      with greedy decoding. Frontier shapes may differ across model families and scales;
      a second-family replication is planned.\nDataset coverage. We evaluate two English
      datasets (ASQA and QASPER) with distinct retrieval granularities, but this does
      not cover multilingual settings, open-web retrieval, or longercontext regimes.\nRe-attribution
      hyperparameters. The top-10 lexical candidate pool can miss semantically matching
      snippets, and requiring one snippet to entail a unit can miss support distributed
      across snippets. Consequently, a failed recovery does not establish that the
      source contains no support. Table 3 varies the recovery threshold while holding
      the scoring threshold fixed; it does not validate the evaluator or test candidate-pool
      size, retrieval strategy, or multi-snippet recovery.\nVerification scope. Declared-span
      verification rejects claims lacking declared evidence by construction, even
      if support could be recovered. Its 1 . 00 unsupported rate for no-provenance
      runs is a provenance-availability diagnostic, not a calibrated hallucination
      rate. Recovered-source verification is reported at nominal 0.25 for the two
      no-provenance methods and remains dependent on the same bounded recovery procedure
      and evaluator.\nResidual error rows. Only identity fails on 4 ASQA and 29 QASPER
      questions; every primary setting is evaluated on the resulting common successful
      subset. This pairing prevents comparisons from using different questions, but
      conditions results on identity success and omits those difficult cases. Sampling
      intervals condition on the fixed generated outputs and evaluator; they do not
      include systematic NLI error or variation across generation runs.\nNominal versus
      achieved budgets. Abstractive compressors do not reliably hit nominal token
      budgets; RECOMP often produces much less context than requested. We report achieved
      compression ratios, but comparisons at a shared nominal budget do not establish
      performance at matched achieved context sizes.", "8 Conclusion\nWe measured
      citation attribution across contextcompression methods and budgets under a fixed
      generator and primary NLI evaluator. Emitted and grounded scores diverge, but
      their magnitudes depend on recovery and evaluation choices that have not been
      independently calibrated. Declaredspan verification rejects claims lacking declared
      evidence by policy; it does not determine whether support could be recovered.
      Paired comparisons quantify sampling uncertainty conditional on the fixed outputs
      and evaluator, with only limited evidence for ECR''s advantage. We recommend
      reporting grounded alongside emitted citation scores and achieved alongside
      nominal compression. The TRUE subsample retains the emitted-grounded gaps; human
      calibration and broader replication remain necessary.", "3.2 Emitted vs. Grounded
      Citations\nWescore every run under two views. We write precision as P and recall
      as R , with subscripts e for emitted and g for grounded. Emitted scores citations
      against the unit texts the generator actually saw; it measures consistency with
      the compressed context, and is what one implicitly measures when compressed
      units are treated as citable documents. Grounded fi rst resolves each citation
      to retrieved source spans and scores against those. Units with declared provenance
      resolve to their declared sids. Units without declared provenance pass through
      our re-attributability protocol: rank source snippets by lexical similarity
      to the unit, run NLI on the top 10 candidates, and keep those judged to individually
      entail the unit at \u03c4 . A citation with no recovered span receives no precision
      credit and cannot support recall under this protocol. The reattribution rate
      is the fraction of units without declared provenance with at least one recovered
      span, averaged across examples.\nEvaluator dependence. The same NLI model filters
      recovered spans and scores citation support, creating a circularity risk: selection
      and evaluation errors can be correlated. Lexical retrieval can miss paraphrases,
      and the single-snippet test can reject units supported only by combined evidence.
      Thus failed recovery does not establish that support is absent from the source,
      and the direction of overall scoring bias is unknown. Appendix C reports a second-evaluator
      sensitivity check; human calibration remains absent.\nThe emitted -grounded
      gap is an operational diagnostic of attribution laundering : claims receive
      credit against compressed text that is not supported through the source mappings
      accepted by our protocol. It does not by itself distinguish missing evidence
      from recovery or NLI errors.\nNominal vs. achieved compression. Budgets are
      nominal fractions { 0 . 5 , 0 . 25 , 0 . 1 , 0 . 05 } of each example''s retrieved
      context, enforced in generator-tokenizer tokens. Extractive families track their
      budgets closely, but abstractive compressors emit what their decoder emits:
      RECOMP realizes achieved ratios of 0 . 05 -0 . 08 on ASQA and \u2248 0 . 015
      on QASPER across all four nominal budgets-distinct nominal operating points
      collapse together. All curves therefore use the achieved ratio on the compression
      axis; plotting against nominal budgets would misplace abstractive systems by
      more than an order of magnitude in the worst case.", "B Complete Paired Comparisons\nSection
      4.2 describes the common cohorts, estimands, inference, and precision-code correction.
      Tables 6-10 report all 148 planned contrasts, including those not retained as
      claims; EF1 effects and intervals use four decimal places, and other effects
      and intervals use three.\nTable notation. A/Q denote ASQA/QASPER; Id, RR, X,
      RC, and LL denote identity, reranking, extraction, RECOMP, and LLMLingua-2.
      Setting labels give compressor/nominal budget, optionally followed by the recovery
      threshold. P/R denote precision/recall, with e/g for emitted/grounded; EM is
      str-EM, EF1 is evidence F1, and Rec is reattribution rate. U s /U m /U r denote
      declared-span, summary, and recovered-source unsupported rates. \u2206 is the
      paired left-minus-right mean difference; a single endpoint applies to both settings,
      and a pair lists left-minus-right metrics. CI is a pointwise 95% bootstrap interval;
      p H is the two-sided randomization p -value after Holm adjustment across all
      148 comparisons; n counts included questions.\nRecovered-source verification.
      This extension reads existing NLI scores from the sealed cache and makes no
      new model calls. It uses the same recovered source IDs as citation scoring,
      but the claim verifier removes repeated source IDs before pooling evidence.
      Consequently, its unsupported rate need not equal one minus grounded citation
      recall, which retains repeated cited evidence. Both summary and recovered-source
      rates exclude the same zero-claim answers: two QASPER RECOMP answers at nominal
      0.25; the other three comparisons use their full common cohorts. Input hashes,
      the extension plan, cache lookups, perquestion records, and all four comparisons
      are retained separately from the original analysis.\n", "D Judge Metrics\nWe
      use Substring Match as the primary metric because it is deterministic and consistent
      with standard open-domain QA evaluation. However, it can overestimate answer
      quality when a model lists multiple candidate answers: the prediction receives
      full credit whenever it contains a gold-answer alias as a substring, even if
      the response is ambiguous, unsupported, or includes incorrect alternatives.
      We therefore additionally report LLM-as-a-judge scores, which evaluate the correctness
      of the generated answer in the context of the question and reference answer.
      The judge assigns a score of 1 for a correct answer, 0.5 for a partially correct
      answer, and 0 for a wrong answer; we report the mean score as a percentage.
      This complementary evaluation penalizes answer enumeration and verifies that
      improvements in Match correspond to genuinely correct answers rather than increased
      lexical overlap with the reference.\nTable 5: Training schedule for the three-stage
      procedure.\n\nStage 1, Examples = 2,000,000. Stage 1, Epochs = 1. Stage 2, Examples
      = 500,000. Stage 2, Epochs = 1. Stage 3 (KILT-SCR), Examples = 196,916. Stage
      3 (KILT-SCR), Epochs = 3\nFor each example, we provide the judge with the question,
      the reference answer, and the model prediction. We use the following prompt:\nSystem
      prompt: You are an evaluation tool. Answer with one of: 1: Correct, 0.5: Partially
      correct, 0: Wrong.\nUser prompt: Here is a question, a golden answer, and an
      AI-generated answer. Can you judge whether the AIgenerated answer is correct
      according to the question and golden answer? Simply answer with one of: 1: Correct,
      0.5: Partially correct, 0: Wrong.\nQuestion:\n{question}\nGolden answer:\n{answer}\nGenerated
      answer: {prediction}\nFigure 7 corroborates the Match-based robustness trends.
      At the training-time compression rate of 16 \u00d7 , AdaMem matches or exceeds
      OSCAR across all three benchmarks, improving by 1.8 points on TriviaQA and 2.4
      points on NQ, while the methods are effectively tied on HotpotQA. The advantage
      grows under stronger inference-time compression. At 64 \u00d7 , AdaMem exceeds
      OSCAR by 6.1 points on TriviaQA and NQ, and by 7.1 points on HotpotQA. In contrast
      to OSCAR, AdaMem remains stable as the memory budget shrinks: its judge score
      decreases by only 0.9, 3.3, and 1.4 points from 16 \u00d7 to 64 \u00d7 on TriviaQA,
      NQ, and HotpotQA, respectively, compared with drops of 5.2, 7.0, and 8.7 points
      for OSCAR. These results show that relevance-aware allocation preserves answer-critical
      information under severe compression, rather than merely improving lexical overlap
      with reference answers.", "Table 3: Recovery-threshold sensitivity on 944 ASQA
      questions at nominal budget 0.25; citation scoring stays at \u03c4 = 0 . 5 .
      P g : grounded precision; reattr.: reattribution rate. Superscripts count defined
      values; dashes mark undefined metrics.\n\n|     | RECOMP   | RECOMP        |
      LLMLingua-2   | LLMLingua-2   |\n|-----|----------|---------------|---------------|---------------|\n|
      \u03c4   | P g      | reattr.       | P g           | reattr.       |\n| 0.3
      | 0.15     | 0 . 48 n =929 | 0.16          | 0.54          |\n| 0.4 | 0.13     |
      0 . 44 n =929 | 0.13          | 0.47          |\n| 0.5 | 0.12     | 0 . 41 n
      =929 | 0.10          | 0.40          |\n| 0.6 | 0.11     | 0 . 38 n =929 | 0.08          |
      0.34          |\n| 0.7 | 0.09     | 0 . 34 n =929 | 0.05          | 0.27          |\n|
      0.8 | 0.08     | 0 . 31 n =929 | 0.04          | 0.20          |", "Sensitivity
      to the re-attribution threshold.\nThe re-attributability protocol depends on
      the entailment threshold \u03c4 . Table 3 sweeps \u03c4 from 0.3 to 0.8 for
      both no-provenance methods on ASQA (citation scoring fixed at the production
      threshold of 0.5). Grounded precision ranges from 0.15 to 0.08 for RECOMP and
      from 0.16 to 0.04 for LLMLingua-2, while recovery rates fall from 0.48 to 0.31
      and from 0.54 to 0.20, respectively. Emitted precision exceeds grounded precision
      at every tested recovery threshold for both methods ( p H = 0 . 0148 throughout).
      This is sensitivity analysis of one operating choice, not independent validation:
      the evaluator, top-10 lexical search, and singlesnippet support requirement
