        to the re-attribution threshold.\\nSecond-evaluator sensitivity. We rescore
        100 questions per dataset with TRUE T5-XXL (Honovich et al., 2022), covering
        full-context identity plus extraction, RECOMP, and LLMLingua-2 at nominal
        0.25. With source mappings fixed, RECOMP's emitted/grounded precision is 0.78/0.13
        on ASQA and 0.44/0.01 on QASPER. The paired gaps are 0.65 [0.55, 0.75] and
        0.43 [0.33, 0.53], respectively. When TRUE also selects recovered spans, grounded
        precision is 0.14 and 0.03. All 16 planned emitted-minus-grounded precision
        and recall gaps across both methods, datasets, and recovery modes are positive
        ( p H = 0 . 0024 in a separate 24-test family). None of the eight cross-evaluator
        grounded-precision differences passes Holm adjustment; this does not establish
        equivalence or validate the primary numbers. Appendix C reports all comparisons,
        the 4,096-token input configuration, decoder anomalies, and documented restarts.
        The pattern persists under a second scoring family, with recovery and calibration
        limitations retained.\",\"metadata\":{\"ingestion_version\":\"01a0fc54ff9a70d3af0e9b49e864b8b9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde-text-0017\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde\",\"chunk_type\":\"text\",\"section_path\":\"Sensitivity
        to the re-attribution threshold.\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":69,\"page_no\":8,\"filename\":\"2609.14245v1.pdf\"}}},{\"id\":\"fab5fc9c-48c2-5309-be84-9c8b53e8d8df\",\"version\":13,\"score\":0.5106078,\"payload\":{\"page_content\":\"9
        Limitations\\nEvaluator dependence. Primary scores use DeBERTa-v3-base, trained
        on MNLI, FEVER, and ANLI, at \u03C4 = 0 . 5 , without human calibration. Using
        the same model to select recovered spans and score support can reinforce systematic
        errors; the resulting scores are evaluator-dependent estimates, not validated
        rates of source support or factual correctness. This dependence also limits
        conclusions about method rankings and the size of emitted-grounded gaps. The
        200-question TRUE audit checks a second scoring family, but fixed recovery
        retains DeBERTa selection and TRUE recovery reuses one judge. Different input
        windows and nonbinary decoder outputs further limit numerical comparison.
        Human source-level calibration remains necessary (Rashkin et al., 2023).\\nSingle
        generator. All results use Qwen2.5-7BInstruct with greedy decoding. Frontier
        shapes may differ across model families and scales; a second-family replication
        is planned.\\nDataset coverage. We evaluate two English datasets (ASQA and
        QASPER) with distinct retrieval granularities, but this does not cover multilingual
        settings, open-web retrieval, or longercontext regimes.\\nRe-attribution hyperparameters.
        The top-10 lexical candidate pool can miss semantically matching snippets,
        and requiring one snippet to entail a unit can miss support distributed across
        snippets. Consequently, a failed recovery does not establish that the source
        contains no support. Table 3 varies the recovery threshold while holding the
        scoring threshold fixed; it does not validate the evaluator or test candidate-pool
        size, retrieval strategy, or multi-snippet recovery.\\nVerification scope.
        Declared-span verification rejects claims lacking declared evidence by construction,
        even if support could be recovered. Its 1 . 00 unsupported rate for no-provenance
        runs is a provenance-availability diagnostic, not a calibrated hallucination
        rate. Recovered-source verification is reported at nominal 0.25 for the two
        no-provenance methods and remains dependent on the same bounded recovery procedure
        and evaluator.\\nResidual error rows. Only identity fails on 4 ASQA and 29
        QASPER questions; every primary setting is evaluated on the resulting common
        successful subset. This pairing prevents comparisons from using different
        questions, but conditions results on identity success and omits those difficult
        cases. Sampling intervals condition on the fixed generated outputs and evaluator;
        they do not include systematic NLI error or variation across generation runs.\\nNominal
        versus achieved budgets. Abstractive compressors do not reliably hit nominal
        token budgets; RECOMP often produces much less context than requested. We
        report achieved compression ratios, but comparisons at a shared nominal budget
        do not establish performance at matched achieved context sizes.\",\"metadata\":{\"ingestion_version\":\"01a0fc54ff9a70d3af0e9b49e864b8b9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde-text-0020\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde\",\"chunk_type\":\"text\",\"section_path\":\"9
        Limitations\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":78,\"page_no\":9,\"filename\":\"2609.14245v1.pdf\"}}},{\"id\":\"48f13ee2-cca1-5a90-8a2c-c4e37fc6acd7\",\"version\":13,\"score\":0.5026255,\"payload\":{\"page_content\":\"8
        Conclusion\\nWe measured citation attribution across contextcompression methods
        and budgets under a fixed generator and primary NLI evaluator. Emitted and
        grounded scores diverge, but their magnitudes depend on recovery and evaluation
        choices that have not been independently calibrated. Declaredspan verification
        rejects claims lacking declared evidence by policy; it does not determine
        whether support could be recovered. Paired comparisons quantify sampling uncertainty
        conditional on the fixed outputs and evaluator, with only limited evidence
        for ECR's advantage. We recommend reporting grounded alongside emitted citation
        scores and achieved alongside nominal compression. The TRUE subsample retains
        the emitted-grounded gaps; human calibration and broader replication remain
        necessary.\",\"metadata\":{\"ingestion_version\":\"01a0fc54ff9a70d3af0e9b49e864b8b9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde-text-0019\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde\",\"chunk_type\":\"text\",\"section_path\":\"8
        Conclusion\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":76,\"page_no\":8,\"filename\":\"2609.14245v1.pdf\"}}},{\"id\":\"b9c26351-e63f-59db-9a93-06768b8d60ef\",\"version\":13,\"score\":0.49970227,\"payload\":{\"page_content\":\"3.2
        Emitted vs. Grounded Citations\\nWescore every run under two views. We write
        precision as P and recall as R , with subscripts e for emitted and g for grounded.
        Emitted scores citations against the unit texts the generator actually saw;
        it measures consistency with the compressed context, and is what one implicitly
        measures when compressed units are treated as citable documents. Grounded
        fi rst resolves each citation to retrieved source spans and scores against
        those. Units with declared provenance resolve to their declared sids. Units
        without declared provenance pass through our re-attributability protocol:
        rank source snippets by lexical similarity to the unit, run NLI on the top
        10 candidates, and keep those judged to individually entail the unit at \u03C4
        . A citation with no recovered span receives no precision credit and cannot
        support recall under this protocol. The reattribution rate is the fraction
        of units without declared provenance with at least one recovered span, averaged
        across examples.\\nEvaluator dependence. The same NLI model filters recovered
        spans and scores citation support, creating a circularity risk: selection
        and evaluation errors can be correlated. Lexical retrieval can miss paraphrases,
        and the single-snippet test can reject units supported only by combined evidence.
        Thus failed recovery does not establish that support is absent from the source,
        and the direction of overall scoring bias is unknown. Appendix C reports a
        second-evaluator sensitivity check; human calibration remains absent.\\nThe
        emitted -grounded gap is an operational diagnostic of attribution laundering
        : claims receive credit against compressed text that is not supported through
        the source mappings accepted by our protocol. It does not by itself distinguish
        missing evidence from recovery or NLI errors.\\nNominal vs. achieved compression.
        Budgets are nominal fractions { 0 . 5 , 0 . 25 , 0 . 1 , 0 . 05 } of each
        example's retrieved context, enforced in generator-tokenizer tokens. Extractive
        families track their budgets closely, but abstractive compressors emit what
        their decoder emits: RECOMP realizes achieved ratios of 0 . 05 -0 . 08 on
        ASQA and \u2248 0 . 015 on QASPER across all four nominal budgets-distinct
        nominal operating points collapse together. All curves therefore use the achieved
        ratio on the compression axis; plotting against nominal budgets would misplace
        abstractive systems by more than an order of magnitude in the worst case.\",\"metadata\":{\"ingestion_version\":\"01a0fc54ff9a70d3af0e9b49e864b8b9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde-text-0006\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde\",\"chunk_type\":\"text\",\"section_path\":\"3.2
        Emitted vs. Grounded Citations\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":24,\"page_no\":3,\"filename\":\"2609.14245v1.pdf\"}}},{\"id\":\"5465c457-ca4b-5d77-839d-d3ad8983ca17\",\"version\":13,\"score\":0.49690688,\"payload\":{\"page_content\":\"B
        Complete Paired Comparisons\\nSection 4.2 describes the common cohorts, estimands,
        inference, and precision-code correction. Tables 6-10 report all 148 planned
        contrasts, including those not retained as claims; EF1 effects and intervals
        use four decimal places, and other effects and intervals use three.\\nTable
        notation. A/Q denote ASQA/QASPER; Id, RR, X, RC, and LL denote identity, reranking,
        extraction, RECOMP, and LLMLingua-2. Setting labels give compressor/nominal
        budget, optionally followed by the recovery threshold. P/R denote precision/recall,
        with e/g for emitted/grounded; EM is str-EM, EF1 is evidence F1, and Rec is
        reattribution rate. U s /U m /U r denote declared-span, summary, and recovered-source
        unsupported rates. \u2206 is the paired left-minus-right mean difference;
        a single endpoint applies to both settings, and a pair lists left-minus-right
        metrics. CI is a pointwise 95% bootstrap interval; p H is the two-sided randomization
        p -value after Holm adjustment across all 148 comparisons; n counts included
        questions.\\nRecovered-source verification. This extension reads existing
        NLI scores from the sealed cache and makes no new model calls. It uses the
        same recovered source IDs as citation scoring, but the claim verifier removes
        repeated source IDs before pooling evidence. Consequently, its unsupported
        rate need not equal one minus grounded citation recall, which retains repeated
        cited evidence. Both summary and recovered-source rates exclude the same zero-claim
        answers: two QASPER RECOMP answers at nominal 0.25; the other three comparisons
        use their full common cohorts. Input hashes, the extension plan, cache lookups,
        perquestion records, and all four comparisons are retained separately from
        the original analysis.\\n\",\"metadata\":{\"ingestion_version\":\"01a0fc54ff9a70d3af0e9b49e864b8b9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde-text-0028\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde\",\"chunk_type\":\"text\",\"section_path\":\"B
        Complete Paired Comparisons\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":133,\"page_no\":13,\"filename\":\"2609.14245v1.pdf\"}}},{\"id\":\"b23e9f67-cdcc-54fe-a4f0-6c338b605762\",\"version\":7,\"score\":0.49090725,\"payload\":{\"page_content\":\"D
        Judge Metrics\\nWe use Substring Match as the primary metric because it is
        deterministic and consistent with standard open-domain QA evaluation. However,
        it can overestimate answer quality when a model lists multiple candidate answers:
        the prediction receives full credit whenever it contains a gold-answer alias
        as a substring, even if the response is ambiguous, unsupported, or includes
        incorrect alternatives. We therefore additionally report LLM-as-a-judge scores,
        which evaluate the correctness of the generated answer in the context of the
        question and reference answer. The judge assigns a score of 1 for a correct
        answer, 0.5 for a partially correct answer, and 0 for a wrong answer; we report
        the mean score as a percentage. This complementary evaluation penalizes answer
        enumeration and verifies that improvements in Match correspond to genuinely
        correct answers rather than increased lexical overlap with the reference.\\nTable
        5: Training schedule for the three-stage procedure.\\n\\nStage 1, Examples
        = 2,000,000. Stage 1, Epochs = 1. Stage 2, Examples = 500,000. Stage 2, Epochs
        = 1. Stage 3 (KILT-SCR), Examples = 196,916. Stage 3 (KILT-SCR), Epochs =
        3\\nFor each example, we provide the judge with the question, the reference
        answer, and the model prediction. We use the following prompt:\\nSystem prompt:
        You are an evaluation tool. Answer with one of: 1: Correct, 0.5: Partially
        correct, 0: Wrong.\\nUser prompt: Here is a question, a golden answer, and
        an AI-generated answer. Can you judge whether the AIgenerated answer is correct
        according to the question and golden answer? Simply answer with one of: 1:
        Correct, 0.5: Partially correct, 0: Wrong.\\nQuestion:\\n{question}\\nGolden
        answer:\\n{answer}\\nGenerated answer: {prediction}\\nFigure 7 corroborates
        the Match-based robustness trends. At the training-time compression rate of
        16 \xD7 , AdaMem matches or exceeds OSCAR across all three benchmarks, improving
        by 1.8 points on TriviaQA and 2.4 points on NQ, while the methods are effectively
        tied on HotpotQA. The advantage grows under stronger inference-time compression.
        At 64 \xD7 , AdaMem exceeds OSCAR by 6.1 points on TriviaQA and NQ, and by
        7.1 points on HotpotQA. In contrast to OSCAR, AdaMem remains stable as the
        memory budget shrinks: its judge score decreases by only 0.9, 3.3, and 1.4
        points from 16 \xD7 to 64 \xD7 on TriviaQA, NQ, and HotpotQA, respectively,
        compared with drops of 5.2, 7.0, and 8.7 points for OSCAR. These results show
        that relevance-aware allocation preserves answer-critical information under
        severe compression, rather than merely improving lexical overlap with reference
        answers.\",\"metadata\":{\"ingestion_version\":\"01a0fc53885372038a1c6d0df171e569\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d-text-0026\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d\",\"chunk_type\":\"text\",\"section_path\":\"D
        Judge Metrics\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":148,\"page_no\":11,\"filename\":\"2609.22100v1.pdf\"}}},{\"id\":\"2e58c799-e2ab-5edb-98ef-808cd1e1ca71\",\"version\":13,\"score\":0.48778325,\"payload\":{\"page_content\":\"Table
