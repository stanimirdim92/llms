        and Results\\nKILT-SCR. Weconstruct KILT-SCR as a large-candidatepool resource
        with training and evaluation splits. Its training split is derived from the
        training sets of Natural Questions (Kwiatkowski et al. 2019), HotpotQA (Yang
        et al. 2018), and TriviaQA (Joshi et al. 2017). The evaluation split contains
        examples from the evaluation sets of these three datasets, together with PopQA
        (Mallen et al. 2023), ASQA (Stelmakh et al. 2022), and BioASQ (Krithara et
        al. 2023; Tsatsaronis et al. 2015). For every query, we retrieve a fixed pool
        of 25 passages from KILT-100w (Petroni et al. 2021) using BAAI/bge-large-en-v1.5
        (Xiao et al. 2024).\\nFor each training query, we score candidates with cross-encoder/ms-marco-MiniLM-L6-v2
        (Bajaj et al. 2018) and provide the ten highest-scoring passages to Mistral-7B-Instruct-v0.2
        (Jiang et al. 2023a) to generate answer targets. We retain only instances
        for which a goldanswer alias occurs both in at least one retrieved passage
        and in the generated target, yielding 196,916 examples; teacher scores are
        globally standardized over this split. In contrast, we apply no answer-support
        or teacher-target filtering to KILTSCR evaluation split, which contains 2,000
        examples each from Natural Questions, HotpotQA, TriviaQA, and PopQA, 948 from
        ASQA, and 1,609 from BioASQ. At evaluation time, the learned reranker scores
        the fixed candidate pool before answer generation.\\nExperimental Setup. AdaMem
        uses a Llama-3.2-1BInstruct (Grattafiori et al. 2024) compressor and a Mistral-7B-Instruct-v0.2
        decoder adapted with LoRA (Hu et al. 2022). We first pretrain the compressor
        and AdaMem projection module on two million examples sampled from EleutherAI/SmolLM2-135M-10B
        (Allal et al. 2025), using autoencoding and language-modeling objectives.
        We then perform query-dependent fine-tuning on maxoul/pisco_finetuning_data
        (Louis, D\xE9jean, and Clinchant 2025), following the OSCAR training setup.
        Finally, we train on KILT-SCR with the joint answergeneration and reranker-distillation
        objectives. For all experiments, we report Substring Match as the primary
        evaluation metric. We provide additional LLM-as-a-judge metrics in the Supplementary
        Material.\\nFigure 3: Match (%) versus retrieval depth. AdaMem benefits from
        deeper retrieval more consistently than OSCAR, particularly under stronger
        compression.\",\"metadata\":{\"ingestion_version\":\"01a0fc53885372038a1c6d0df171e569\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d-text-0009\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-905fbc39ac3a6f3cc7e45abf45c70d5d\",\"chunk_type\":\"text\",\"section_path\":\"Experiments
        and Results\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":47,\"page_no\":4,\"filename\":\"2609.22100v1.pdf\"}}},{\"id\":\"b9471911-87e0-56f1-b903-ce99862282fc\",\"version\":13,\"score\":0.4352449,\"payload\":{\"page_content\":\"4.2
        Statistical Analysis and Metric Audit\\nCommon cohorts and estimands. Primary
        summaries and comparisons use the intersection of successful question IDs
        across identity and all twenty compressed settings. Each question has equal
        weight in citation precision, citation recall, answer quality, and evidence
        F1; claims and citations are not pooled across questions. Undefined evidence
        or recovery metrics remain undefined rather than becoming zeros. Verification-rate
        means exclude answers with zero claims; paired verification comparisons exclude
        a question if ei- ther member has zero claims. The analysis artifacts report
        those exclusions and retain full-cohort descriptive means separately.\\nInference.
        We use pointwise 95% percentile bootstrap intervals for each paired mean difference
        (Dror et al., 2018), resampling 944 questions on ASQA and 271 papers on QASPER
        with replacement. All retained questions from a sampled QASPER paper travel
        together, and each replicate divides its total difference by the number of
        sampled questions, preserving the questionweighted estimand. Every QASPER
        contrast retains all 271 papers after metric-specific exclusions. Two-sided
        randomization tests swap paired labels within questions on ASQA and jointly
        within papers on QASPER. These tests assume label exchangeability within a
        resampling unit under the null. Both procedures use 10,000 replicates and
        seed 13, with independent random-number streams for bootstrap sampling and
        randomization. Monte Carlo p -values use ( b + 1) / (10 , 000 + 1) , where
        b counts randomizations at least as extreme as the observed absolute difference.
        The initial plan specified 134 core contrasts and 10 recoverythreshold contrasts
        before inspecting the revised inferential results. After that analysis and
        a cachecoverage audit, we added four recovered-source versus summary-verification
        contrasts at nominal 0.25 for RECOMP and LLMLingua-2 on both datasets. The
        extension plan was recorded before running these four tests, and Holm adjustment
        was recomputed over all 148 raw p -values. We denote Holm-adjusted values
        by p H . All reported adjusted values use this expanded family; original effects,
        intervals, and raw p -values are unchanged. This is a post hoc camera-ready
        analysis, not a preregistration. Intervals are pointwise, not simultaneous;
        statistical-support statements use p H < 0 . 05 . Failure to reject a difference
        does not establish equivalence or preservation. All inference is conditional
        on the fixed generator outputs, recovery procedure, and evaluator.\\nPrecision-code
        audit. The manuscript's precision definition requires the concatenated cited
        evidence to entail a claim before any individual citation receives credit.
        A code audit found that the previous implementation could credit an individually
        supporting citation even when joint entailment failed. A saved ASQA answer
        reproduced this discrepancy, and a regression test now checks the required
        gate through the evaluation pipeline.\\n\",\"metadata\":{\"ingestion_version\":\"01a0fc54ff9a70d3af0e9b49e864b8b9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde-text-0010\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde\",\"chunk_type\":\"text\",\"section_path\":\"4.2
        Statistical Analysis and Metric Audit\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":36,\"page_no\":4,\"filename\":\"2609.14245v1.pdf\"}}}]},\"status\":\"ok\",\"time\":0.001814919}"
