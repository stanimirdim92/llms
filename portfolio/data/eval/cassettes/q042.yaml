      string: "{\"result\":{\"points\":[{\"id\":\"018160fc-c9ca-5110-9fdd-b7268185ecea\",\"version\":13,\"score\":0.58346677,\"payload\":{\"page_content\":\"C
        Second-Evaluator Sensitivity Audit\\nWe sample 100 questions per dataset from
        sorted common-cohort IDs using a fresh Python seed13 random generator; QASPER
        spans 84 papers. Full-context identity and nominal-0.25 extraction, RECOMP,
        and LLMLingua-2 contribute 800 unchanged saved answers, with 1,627 claims
        and 1,890 citation markers. The prior DeBERTa values are the original scores
        for these same sampled answers.\\nModel and decoding. We use google/t5_xxl_true_nli_mixture
        (Honovich et al., 2022), revision aa6cfe1dd4 , with full revision and checkpoint
        hashes in the manifest. This released mixture uses SNLI, MNLI, FEVER, SciTail,
        PAWS, and VitaminC (Bowman et al., 2015; Williams et al., 2018; Thorne et
        al., 2018; Khot et al., 2018; Zhang et al., 2019; Schuster et al., 2021),
        rather than the original TRUE paper's ANLI recipe. MNLI and FEVER overlap
        DeBERTa's training mixture. Inference uses Transformers 4.57.6, the slow T5
        tokenizer, BF16, batch size four, and one NVIDIA B200. The prompt places compressed
        text or source evidence after premise: and the unit or claim after hypothesis:
        .\\nWe use an AutoAIS-style exact-one decision (Bohnet et al., 2022; Gao et
        al., 2023): generate at most ten tokens deterministically, strip surrounding
        whitespace, and count only 1 as entailment. Every other string scores zero;
        these are binary decisions, not calibrated probabilities. Unlike our rule,
        reference AutoAIS/ALCE code compares decoded strings without additional whitespace
        normalization. We retain normalized nonbinary strings, but not every raw output,
        so normalization's effect cannot be quantified from the cache.\\nEvidence
        mappings. Fixed recovery preserves declared provenance and DeBERTa-recovered
        source IDs while TRUE scores support. TRUE recovery reevaluates all top-10
        lexical candidates for undeclared units, including DeBERTa-rejected candidates,
        then scores with TRUE. Both retain the corrected precision gate. Fixed recovery
        retains selection dependence; TRUE recovery reuses one judge. Neither removes
        bounded-search errors or supplies human calibration.\\nRecorded amendments.
        Astrict-decoding pilot stopped on a nonbinary output; a second stopped on
        an overlong hypothesis. An input-only scan found five undeclared units exceeding
        2,048 tokens (maximum hypothesis plus prompt: 2,988), motivating a uniform
        4,096-token cap that preserves complete hypotheses and truncates only premises.
        A later batch-eight run exhausted GPU memory. All interrupted attempts and
        plans are preserved but excluded; the final batch-four run recomputes every
        input in a fresh cache. These amendments preceded inspection of any aggregate
        TRUE comparison report and left the sample, thresholds, and 24 comparisons
        unchanged. The cap exceeds original TRUE's 2,048 and DeBERTa's 512 tokens,
        so cross-evaluator differences do not isolate model family.\",\"metadata\":{\"ingestion_version\":\"01a0fc54ff9a70d3af0e9b49e864b8b9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde-text-0029\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde\",\"chunk_type\":\"text\",\"section_path\":\"C
        Second-Evaluator Sensitivity Audit\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":151,\"page_no\":19,\"filename\":\"2609.14245v1.pdf\"}}},{\"id\":\"a3d2f6a7-82ce-5245-a8ed-2520c9e5da50\",\"version\":13,\"score\":0.53195894,\"payload\":{\"page_content\":\"C
        Second-Evaluator Sensitivity Audit\\nInference and diagnostics. The separate
        24-test family uses pointwise 95% bootstrap intervals and two-sided randomization
        tests, each with 10,000 replicates and seed 13, question resampling on ASQA
        and paper clustering on QASPER, with question-weighted means and Holm adjustment.
        The original 148-test analysis is unchanged. Tables 11-12 report precision
        means and all planned contrasts. All 16 emitted-grounded gaps remain positive
        after adjustment; the eight cross-evaluator precision differences remain unresolved,
        which does not establish equivalence. ECR and other budgets are outside this
        audit.\\nThe run scored 6,015 unique pairs in 419 seconds of model inference
        (430 seconds including bookkeeping; setup and excluded attempts are additional).
        Four inputs required truncation, with maximum pre-truncation length 47,440
        tokens. After normalization, 122 pairs (2.03%) produced nonbinary strings,
        including 103 empty strings; assigning zero does not establish reliable nonentailment.
        These are pair counts, not fractions of questions affected; the full histogram
        accompanies the cache. Recovery can disagree substantially: QASPER LLMLingua-2
        has 50.3% agreement over 1,000 candidate decisions and mean recovery rates
        of 0.84 for DeBERTa versus 0.38 for TRUE. These descriptive results support
        sensitivity analysis, not accuracy against human judgments.\\n\",\"metadata\":{\"ingestion_version\":\"01a0fc54ff9a70d3af0e9b49e864b8b9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde-text-0030\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde\",\"chunk_type\":\"text\",\"section_path\":\"C
        Second-Evaluator Sensitivity Audit\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":156,\"page_no\":19,\"filename\":\"2609.14245v1.pdf\"}}},{\"id\":\"f45581fc-5f6f-5bbf-b3a8-6caaa982a248\",\"version\":13,\"score\":0.52695453,\"payload\":{\"page_content\":\"3.1
        Setup\\nOur pipeline is retrieve \u2192 compress \u2192 generate \u2192 evaluate.
        A compressor maps the retrieved snippets (sentence-segmented, each with a
        stable source id, sid ) to a sequence of units , and every unit either declares
        provenance-the set of sids it was selected from, as in extractive familiesor
        declares none, as in abstractive families. The generator sees the units as
        a numbered context and is prompted, ALCE-style, to attach bracketed unit citations
        to each answer sentence (Gao et al., 2023). Citation quality is scored per
        answer statement with an NLI evaluator in the attributableto-identified-sources
        sense (Rashkin et al., 2023; Bohnet et al., 2022): a statement is recalled
        iff the concatenation of its resolvable cited sources entails it, and a citation
        is precise iff that concatenation entails the statement and, in addition,
        the cited source alone entails it or removing that source breaks the concatenation's
        entailment (Gao et al., 2023). We use DeBERTa-v3-base (MNLI+FEVER+ANLI) at
        threshold \u03C4 =0 . 5 , truncating each NLI input to 512 model tokens. Entailment
        decisions below are this model's predictions, not independently validated
        judgments of source support. Per-example harness failures occur only in identity
        (4 of 948 on ASQA, 29 of 1,005 on QASPER); every primary setting excludes
        those same question IDs, with failure counts retained.\",\"metadata\":{\"ingestion_version\":\"01a0fc54ff9a70d3af0e9b49e864b8b9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde-text-0005\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde\",\"chunk_type\":\"text\",\"section_path\":\"3.1
