    body: '{"query": "What corpus and retriever does the poisoning study use?", "documents":
      ["V. CONCLUSION\nWe measured how a 4-bit Llama 3.1 8B model behaves when its
      retrieved context is poisoned, across three corruption strategies and four poisoning
      levels in a 588-run sweep. Accuracy falls from 77.9% to 43.5% as corruption
      goes from none to total. Entity swap flips the most answers. Numeric corruption
      shows a majority-leaning jump once two of three passages are poisoned, with
      a bootstrap interval on that jump that excludes zero but remains wide. The model''s
      main recorded response to attack is to abstain rather than to state a wrong
      answer, and the lexical-overlap proxy of unsupported generation falls under
      poisoning rather than rising.\nThe study has clear limits. It covers one small
      quantized model on a compact query set with rule-based corruption, so the absolute
      numbers should not be read as universal. Retrieval is shared across the pair,
      but decoding is not locked (temperature 0.1, two independent generations), and
      the 0 / 3 residual shows that background pair noise is non-trivial. Keyword
      matching is a weak correctness criterion, and the overlap proxy is not a semantic
      faithfulness judge. The added passages make retrieval easier than raw FEVER
      evidence would. Each limit points to a concrete next step: lock decoding seeds
      across the pair and add multi-seed and multi-corruption repeats with hierarchical
      resampling, replace keyword checks with structured FEVER-style labels and normalized
      entity or quantity scoring, adjudicate a stratified sample with blinded humans
      or a validated entailment model, and decompose answers into atomic claims so
      poison adoption can be separated from unsupported generation. We also plan to
      repeat the sweep on a larger instruction-tuned model and on a second corpus,
      to replace rule-based edits with model-generated adversarial\n- [5] K. Guu,
      K. Lee, Z. Tung, P. Pasupat, and M. Chang, ''REALM: retrievalaugmented language
      model pre-training,'' in Proc. Int. Conf. Machine Learning (ICML) , 2020, pp.
      3929-3938.\n- [6] N. Reimers and I. Gurevych, ''Sentence-BERT: sentence embeddings
      using Siamese BERT-networks,'' in Proc. Conf. Empirical Methods in Natural Language
      Processing (EMNLP) , 2019, pp. 3982-3992.\n- [7] J. Johnson, M. Douze, and H.
      J\u00b4 egou, ''Billion-scale similarity search with GPUs,'' IEEE Trans. Big
      Data , vol. 7, no. 3, pp. 535-547, 2019.", "H. Relation to Prior Work\nOur findings
      extend the RAG picture drawn by Lewis et al. [1] from the cooperative case to
      an adversarial one: retrieval that lifts accuracy on clean corpora becomes a
      liability on corrupted ones. Where Shi et al. [3] showed that off-topic context
      distracts a model, we show that on-topic but false context does more, because
      it wears the appearance of the evidence the model was told to trust. The abstention-overfabrication
      pattern we measure is an empirical answer, for a small quantized model, to how
      such a system fails when the context is corrupted rather than merely irrelevant.
      The retrieval-integrated pre-training of Guu et al. [5] shares the grounding
      assumption our attack targets. Zhou et al. [4] warn that evaluation can leak
      into training and inflate scores; we keep the FEVER-derived query set fixed
      and report every cell from the same 588-run table so strategy comparisons are
      not an artifact of shifting test items.\nFig. 4. Failure behaviour across poisoning
      levels. Panel (a): abstention rises with poisoning for every strategy, most
      steeply for entity swap. Panel (b): the lexical-overlap proxy of unsupported
      generation is higher on the clean arm than the poisoned arm for all three strategies.\nFig.
      5. Outcome of queries that were correct on clean context, split by strategy
      and poisoning level. Green is still correct, blue is abstained, red is fooled.
      The lost green area is absorbed mainly by abstention, and negation retains the
      most correct answers.", "References\n- Fatemeh Nazary, Yashar Deldjoo, and Tommaso
      di Noia. 2025. Poison-rag: Adversarial data poisoning attacks on retrieval-augmented
      generation in recommender systems. In European Conference on Information Retrieval
      , pages 239-251. Springer.\n- Chanhee Park, Hyeonseok Moon, Chanjun Park, and
      Heuiseok Lim. 2025. MIRAGE: A metric-intensive\nbenchmark for retrieval-augmented
      generation evaluation. In Findings of the Association for Computational Linguistics:
      NAACL 2025 , pages 2883-2900.", "I. INTRODUCTION\nLarge language models answer
      questions fluently but carry two well-known liabilities: their knowledge is
      frozen at training time, and they sometimes state false facts with full confidence.
      Retrieval-augmented generation, proposed by Lewis et al. [1], addresses both
      by fetching relevant documents at query time and placing them in the prompt
      as evidence. The model is then asked to answer from that evidence rather than
      from memory alone. This design has become the default recipe for question answering
      over private or fast-moving knowledge bases.\nThe same design introduces a dependency
      that is easy to overlook. A RAG answer is only as trustworthy as the documents
      it retrieves. If an attacker can edit, inject, or otherwise corrupt even part
      of the retrieved set, the grounding step that was meant to improve reliability
      becomes a channel for misinformation. Shi et al. [3] showed that irrelevant
      context alone can pull a model off track; corrupted but on-topic context is
      a stronger lever, because it looks exactly like the evidence the model was told
      to trust. What is still missing for We answer those three questions empirically.
      Our contribution is threefold. First, we build a reproducible poisoning testbed
      around a 4-bit Llama 3.1 8B model, a MiniLM retriever, and a FAISS index of
      nearly twenty thousand FEVER evidence sentences. Second, we run a full factorial
      experiment, three corruption strategies crossed with four poisoning levels over
      a fixed query set, and report accuracy, a fooled rate, abstention, and a lexical-overlap
      proxy of unsupported generation for every cell. Third, we characterise the failure
      surface: entity corruption flips the most answers, numeric corruption jumps
      once it reaches a majority of the context, and the model''s default response
      to contradiction is to abstain rather than to invent. Every point estimate reported
      here comes from the same 588-run table. Where we interpret a jump or a strategy
      ranking, we also report query-level bootstrap intervals and paired tests recomputed
      from that table.", "In RAG We Trust? Measuring Robustness of Retrieval-Augmented
      Generation Under Document Poisoning\nIliano Fasolino Department of Computer
      Science University of Milan Milan, Italy\nAbstract -Retrieval-augmented generation
      (RAG) grounds a language model in retrieved documents, which reduces hallucination
      but creates a new attack surface: if retrieved text is tampered with, the model
      may repeat the falsehood. We study how much a small quantized model, Llama 3.1
      8B, degrades when a fraction of its retrieved context is poisoned. Three corruption
      strategies are tested, entity swap, number swap, and negation, each applied
      to zero, one, two, or three of the three retrieved passages, over a factorial
      sweep of 588 runs on a fact-checking task built from FEVER. Accuracy falls from
      77.9% on clean context to 43.5% when all three passages are corrupted. Entity
      swap flips the largest share of answers that were correct on clean context.
      Number-based corruption stays flat while poisoned passages are a minority and
      jumps once they form a majority, a pattern we re-check with query-level bootstrap
      intervals. The model rarely invents new falsehoods; its dominant reaction is
      to abstain, and a lexical overlap proxy of unsupported generation falls under
