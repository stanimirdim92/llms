      (%) = 78.1. Negation, Poisoned acc. (%) = 60.2. Negation, Fooled rate (%) =
      19.4. Negation, Abstain rate (%) = 32.1", "B. Poisoning Strategies\nDocument
      poisoning here means rewriting a retrieved passage so that it states something
      false while remaining fluent and on-topic. The rewrite happens after retrieval
      and before the prompt is built, so the retriever itself is never attacked; only
      the evidence handed to the model is altered. Three strategies are implemented,
      each targeting a different class of fact.\nEntity swap replaces named entities
      with plausible alternatives of the same type. ''The Eiffel Tower is located
      in Paris, France'' becomes ''The Eiffel Tower is located in Madrid, Spain.''
      Grammar and register are untouched, so nothing flags the sentence as suspicious
      except the fact itself.\nNumber swap perturbs a numeric value to a nearby wrong
      one, for example turning ''over 13,000 miles'' into ''over 3,000 miles.'' A
      language model has no internal arithmetic check for such a claim and tends to
      echo whatever figure the context provides.\nNegation inserts a negation that
      flips the truth value of a statement, so ''Barack Obama was the 44th President''
      becomes ''Barack Obama was never the 44th President.'' The word ''never'' is
      a strong lexical signal, and we expected the model to treat it with more suspicion
      than a silent entity substitution.", "2 Related Work\nRetrieval-augmented generation
      Enabling LLMs to consult a database of trusted documents through retrieval-augmented
      generation (RAG) has many benefits: it reduces hallucination, allows companies
      to inject proprietary knowledge/documents into the system, supports the rapid
      update of information without retraining, and can enable source attribution
      (Lewis et al., 2020; Shuster et al., 2021; Fan et al., 2024). However, it also
      exposes new attack surfaces. Most research on the safety and security of RAG
      systems has focused on the security of the knowledge base: data poisoning attacks
      involve the injection of malicious (mis)information into the document store
      (Tan et al., 2024; Nazary et al., 2025; Zhang et al., 2025), and data extraction
      attacks aim to recover sensitive or private information from the documents through
      a RAG interface (Zeng et al., 2024a; Qi et al., 2024; Vonderhaar et al., 2025).
      However, the safety of RAG systems in non-adversarial settings has been less
      studied. An et al. (2025) were the first to highlight that RAG systems can output
      more harmful responses than non-RAG LLMs, even in the absence of any malicious
      intervention. Other work considers the related problem of safety degradation
      in AI agents that have been enabled with information retrieval or search capabilities
      (Yu et al., 2025; BehnamGhader et al., 2025; Zhan et al., 2026). Previous work
      measures the safety of the entire RAG system, but the information content and
      safety of the retrieved documents is an uncontrolled variable. Our work takes
      the next step towards a more scientific understanding of these observed phenomena
      by systematically altering one variable at a time (no retrieval, random retrieval,
      on-topic retrieval, exact-answer retrieval) to observe the effect on the safety
      of the LLM responses.\nLong-context safety The retrieval of harmful documents
      is one factor in the observed safety decline in RAG models. However, the literature
      suggests that another factor may be a behavioural shift induced by the inclusion
      of extended context. In fact, Yu et al. (2025) claim that ''safety degradation
      is largely independent of retrieved context itself.'' An et al. (2025) found
      that 94.7% of the retrieved documents in their study were safe, and therefore
      could not account for the much larger increase in unsafe responses. They hypothesize
      that the retrieved texts, though benign themselves, can trigger the recall of
      unsafe information from the model''s parametric knowledge. Other work has shown
      that LLMs are less capable of identifying harmful content in long contexts (Ghorbanpour
      and Fraser, 2025) and are more likely to answer harmful questions in long-context
      settings (Anil et al., 2024; Lu et al., 2025; Huang et al., 2025). In some cases,
      the model can drift away from its default ''helpful assistant'' persona even
      when the context itself is not harmful (e.g. a therapy conversation)\n(Lu et
      al., 2026). Therefore, in this study we design our benchmark to test the ''harmful
      documents'' and ''long context'' explanations separately.", "References\n- Zhenting
