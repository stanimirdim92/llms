      For each dataset we chunk the corpus into roughly 100-token passages and retrieve
      the top five per question with BM25 (Robertson and Zaragoza, 2009).", "B. Accuracy
      Degradation\nOne detail in Table I needs to be read carefully. The 0 / 3 row
