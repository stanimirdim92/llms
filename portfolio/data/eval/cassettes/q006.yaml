      "E. A Majority Pattern in Numeric Corruption\nFigure 3 isolates that pattern.
      For entity swap and negation the fooled rate grows in roughly even steps as
      poisoning increases. Number swap behaves differently. It stays at 10.2% for
      both zero and one corrupted passage (bootstrap 95% CI [2 . 0 , 18 . 4] in both
      cells), then rises to 26.5% at two ( [14 . 3 , 38 . 8] ) and 34.7% at three
      ( [22 . 5 , 49 . 0] ). The jump from one to two poisoned passages is 16.3 points
      with CI [2 . 0 , 30 . 6] , which excludes zero but is wide. Exact McNemar tests
      on clean-versus-poisoned correctness are significant at two and three poisoned
      passages ( p < 10 -3 ) and not at one ( p = 0 . 22 ). We read this as a majority-leaning
      pattern consistent with outvoting a single wrong figure, not as a sharp phase
      transition proven under locked pairs. Because a model cannot sanity-check a
      bare number the way it can catch ''Madrid, Spain,'' numeric corruption remains
      a quiet risk once it reaches critical mass.", "B. Accuracy Degradation\nTable
      I tracks the model as more of its context is corrupted. The clean arm stays
      near 78% throughout, which confirms that the query set itself is not drifting
      across rows. Poisoned accuracy still moves for reasons other than poisoning
      alone: the 0 / 3 cell is already 69.4%, nine points below the clean arm, before
      any passage is rewritten. From that residual baseline the poisoned arm falls
      further to 63.9% at one corrupted passage and to 43.5% when all three are corrupted.
      The fooled rate rises from 9.5% at 0 / 3 to 34.0% at 3 / 3 , and abstention
      climbs from 21% to 52%. Attack effects should be read against the 0 / 3 residual,
      not against a silent zero.\nTABLE I ACCURACY AND FAILURE BEHAVIOUR BY POISONING
