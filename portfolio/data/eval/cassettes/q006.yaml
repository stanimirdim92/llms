      describe three distinct bootstrap approaches, each tailored to a different study:\n\n**1.
      Poisoning/fooled-rate study (2609.09243v1):** Uncertainty was estimated via
      a query-level bootstrap. the authors resample the 49 indexed query slots with
      replacement (37 distinct texts), keep every run tied to a drawn slot, recompute
      the fooled rate, and repeat 10,000 times with a fixed seed to obtain percentile
      95% intervals. As a secondary check, exact McNemar tests on discordant clean/poisoned
      correctness pairs are reported as a secondary check; effect sizes and intervals
      remain primary. The resulting intervals are reported per poisoning level in
      Table II, e.g., at 3/3 poisoned passages the fooled rate was 34.0% with a 95%
      CI of [24.5, 44.2] over 147 runs.\n\n**2. Compression/citation-quality study
      (2609.14245v1):** This used a pointwise percentile bootstrap over paired mean
      differences. Specifically, the authors use pointwise 95% percentile bootstrap
      intervals for each paired mean difference (Dror et al., 2018), resampling 944
      questions on ASQA and 271 papers on QASPER with replacement. Importantly, all
      retained questions from a sampled QASPER paper travel together, and each replicate
      divides its total difference by the number of sampled questions, preserving
      the question-weighted estimand. This was paired with randomization tests: two-sided
      randomization tests swap paired labels within questions on ASQA and jointly
      within papers on QASPER. These tests assume label exchangeability within a resampling
      unit under the null. Both procedures use 10,000 replicates and seed 13, with
      independent random-number streams for bootstrap sampling and randomization.
      Monte Carlo p-values use (b + 1)/(10,000 + 1), where b counts randomizations
      at least as extreme as the observed absolute difference. A related second-evaluator
      audit in the same paper uses pointwise 95% bootstrap intervals and two-sided
      randomization tests, each with 10,000 replicates and seed 13, question resampling
      on ASQA and paper clustering on QASPER, with question-weighted means and Holm
      adjustment.\n\n**3. RL-agent citation-faithfulness study (2609.23053v1):** Here
      a cluster bootstrap over whole questions (not individual claims) was used, because
      a single question yields up to seven claims that share one context and one generated
      answer, so treating claims as independent would make our intervals look tighter
