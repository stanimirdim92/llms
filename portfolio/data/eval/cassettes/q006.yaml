        A Majority Pattern in Numeric Corruption\\nFigure 3 isolates that pattern.
        For entity swap and negation the fooled rate grows in roughly even steps as
        poisoning increases. Number swap behaves differently. It stays at 10.2% for
        both zero and one corrupted passage (bootstrap 95% CI [2 . 0 , 18 . 4] in
        both cells), then rises to 26.5% at two ( [14 . 3 , 38 . 8] ) and 34.7% at
        three ( [22 . 5 , 49 . 0] ). The jump from one to two poisoned passages is
        16.3 points with CI [2 . 0 , 30 . 6] , which excludes zero but is wide. Exact
        McNemar tests on clean-versus-poisoned correctness are significant at two
        and three poisoned passages ( p < 10 -3 ) and not at one ( p = 0 . 22 ). We
        read this as a majority-leaning pattern consistent with outvoting a single
        wrong figure, not as a sharp phase transition proven under locked pairs. Because
        a model cannot sanity-check a bare number the way it can catch 'Madrid, Spain,'
        numeric corruption remains a quiet risk once it reaches critical mass.\",\"metadata\":{\"ingestion_version\":\"01a0fc53392f724b972307d03a9f94d9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead-text-0012\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead\",\"chunk_type\":\"text\",\"section_path\":\"E.
        A Majority Pattern in Numeric Corruption\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":51,\"page_no\":3,\"filename\":\"2609.09243v1.pdf\"}}},{\"id\":\"42a63f01-9363-5584-b945-f23754d7697a\",\"version\":5,\"score\":0.2956459,\"payload\":{\"page_content\":\"B.
        Accuracy Degradation\\nTable I tracks the model as more of its context is
        corrupted. The clean arm stays near 78% throughout, which confirms that the
        query set itself is not drifting across rows. Poisoned accuracy still moves
        for reasons other than poisoning alone: the 0 / 3 cell is already 69.4%, nine
        points below the clean arm, before any passage is rewritten. From that residual
        baseline the poisoned arm falls further to 63.9% at one corrupted passage
        and to 43.5% when all three are corrupted. The fooled rate rises from 9.5%
        at 0 / 3 to 34.0% at 3 / 3 , and abstention climbs from 21% to 52%. Attack
        effects should be read against the 0 / 3 residual, not against a silent zero.\\nTABLE
        I ACCURACY AND FAILURE BEHAVIOUR BY POISONING LEVEL, AVERAGED OVER ALL THREE
        STRATEGIES. EACH LEVEL AGGREGATES 147 RUNS.\\n\\n0 / 3, Clean acc. (%) = 78.2.
        0 / 3, Poisoned acc. (%) = 69.4. 0 / 3, Fooled rate (%) = 9.5. 0 / 3, Abstain
        rate (%) = 21.1. 1 / 3, Clean acc. (%) = 77.6. 1 / 3, Poisoned acc. (%) =
        63.9. 1 / 3, Fooled rate (%) = 15.0. 1 / 3, Abstain rate (%) = 29.3. 2 / 3,
        Clean acc. (%) = 78.2. 2 / 3, Poisoned acc. (%) = 53.1. 2 / 3, Fooled rate
        (%) = 25.9. 2 / 3, Abstain rate (%) = 38.8. 3 / 3, Clean acc. (%) = 77.6.
        3 / 3, Poisoned acc. (%) = 43.5. 3 / 3, Fooled rate (%) = 34.0. 3 / 3, Abstain
        rate (%) = 51.7\\nTABLE II FOOLED RATE WITH QUERY-LEVEL BOOTSTRAP 95% INTERVALS
        (ALL STRATEGIES, 147 RUNS PER ROW).\\n\\n0 / 3, Fooled (%) = 9.5. 0 / 3, 95%
        CI = [5 . 4 , 14 . 3]. 0 / 3, n = 147. 1 / 3, Fooled (%) = 15.0. 1 / 3, 95%
        CI = [8 . 8 , 21 . 8]. 1 / 3, n = 147. 2 / 3, Fooled (%) = 25.9. 2 / 3, 95%
        CI = [18 . 4 , 33 . 3]. 2 / 3, n = 147. 3 / 3, Fooled (%) = 34.0. 3 / 3, 95%
        CI = [24 . 5 , 44 . 2]. 3 / 3, n = 147\\nFigure 1 plots the same trend per
        strategy. The three curves separate clearly. Entity swap drives the steepest
        fall, and by the full-poisoning level it sits below the other two. The right
        panel, which shows the gap against the clean arm, makes the ordering explicit
        and shows that no strategy is harmless once two of the three passages are
        corrupted.\",\"metadata\":{\"ingestion_version\":\"01a0fc53392f724b972307d03a9f94d9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead-text-0008\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead\",\"chunk_type\":\"text\",\"section_path\":\"B.
