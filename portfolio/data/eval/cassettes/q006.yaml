      Uncertainty on the Existing Runs\\nWe do not invent new generations for this
      revision. We reanalyse the same table with a query-level bootstrap: resample
      the 49 indexed query slots with replacement (37 distinct texts), keep every
      run tied to a drawn slot, recompute the fooled rate, and repeat 10 , 000 times
      with a fixed seed to obtain percentile 95% intervals. Exact McNemar tests on
      discordant clean/poisoned correctness pairs are reported as a secondary check;
      effect sizes and intervals remain primary.\\nTable II shows that the climb with
      poisoning level remains after accounting for query resampling, while neighbouring
      levels overlap. The comparison that matters for the numeric pattern is isolated
      next.\\nTABLE III BEHAVIOUR BY STRATEGY, AVERAGED OVER ALL FOUR POISONING LEVELS.
      EACH STRATEGY AGGREGATES 196 RUNS.\\n\\nEntity swap, Clean acc. (%) = 78.1.
      Entity swap, Poisoned acc. (%) = 54.6. Entity swap, Fooled rate (%) = 23.5.
      Entity swap, Abstain rate (%) = 43.4. Number swap, Clean acc. (%) = 77.6. Number
      swap, Poisoned acc. (%) = 57.7. Number swap, Fooled rate (%) = 20.4. Number
      swap, Abstain rate (%) = 30.1. Negation, Clean acc. (%) = 78.1. Negation, Poisoned
      acc. (%) = 60.2. Negation, Fooled rate (%) = 19.4. Negation, Abstain rate (%)
      = 32.1\"},\"title\":\"2609.09243v1.pdf [01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead]
      (text, page 3)\",\"citations\":{\"enabled\":true}},{\"type\":\"document\",\"source\":{\"type\":\"text\",\"media_type\":\"text/plain\",\"data\":\"4.2
      Statistical Analysis and Metric Audit\\nCommon cohorts and estimands. Primary
      summaries and comparisons use the intersection of successful question IDs across
      identity and all twenty compressed settings. Each question has equal weight
      in citation precision, citation recall, answer quality, and evidence F1; claims
      and citations are not pooled across questions. Undefined evidence or recovery
      metrics remain undefined rather than becoming zeros. Verification-rate means
      exclude answers with zero claims; paired verification comparisons exclude a
      question if ei- ther member has zero claims. The analysis artifacts report those
      exclusions and retain full-cohort descriptive means separately.\\nInference.
      We use pointwise 95% percentile bootstrap intervals for each paired mean difference
      (Dror et al., 2018), resampling 944 questions on ASQA and 271 papers on QASPER
      with replacement. All retained questions from a sampled QASPER paper travel
      together, and each replicate divides its total difference by the number of sampled
      questions, preserving the questionweighted estimand. Every QASPER contrast retains
      all 271 papers after metric-specific exclusions. Two-sided randomization tests
      swap paired labels within questions on ASQA and jointly within papers on QASPER.
      These tests assume label exchangeability within a resampling unit under the
      null. Both procedures use 10,000 replicates and seed 13, with independent random-number
      streams for bootstrap sampling and randomization. Monte Carlo p -values use
      ( b + 1) / (10 , 000 + 1) , where b counts randomizations at least as extreme
      as the observed absolute difference. The initial plan specified 134 core contrasts
      and 10 recoverythreshold contrasts before inspecting the revised inferential
      results. After that analysis and a cachecoverage audit, we added four recovered-source
      versus summary-verification contrasts at nominal 0.25 for RECOMP and LLMLingua-2
      on both datasets. The extension plan was recorded before running these four
      tests, and Holm adjustment was recomputed over all 148 raw p -values. We denote
      Holm-adjusted values by p H . All reported adjusted values use this expanded
      family; original effects, intervals, and raw p -values are unchanged. This is
      a post hoc camera-ready analysis, not a preregistration. Intervals are pointwise,
      not simultaneous; statistical-support statements use p H < 0 . 05 . Failure
      to reject a difference does not establish equivalence or preservation. All inference
      is conditional on the fixed generator outputs, recovery procedure, and evaluator.\\nPrecision-code
      audit. The manuscript's precision definition requires the concatenated cited
      evidence to entail a claim before any individual citation receives credit. A
      code audit found that the previous implementation could credit an individually
      supporting citation even when joint entailment failed. A saved ASQA answer reproduced
      this discrepancy, and a regression test now checks the required gate through
