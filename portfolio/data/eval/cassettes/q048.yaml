        Experimental Setup\\nLeakage drove the dataset choice. NQ is where the original
        probe ran, so we keep it for comparability, but Search-R1 trained on NQ's
        training split and we say so plainly. QAMPARI, HAGRID, and RAGTruth were not
        used to train any of the three agents, so on those datasets no gap can be
        waved away as familiarity with the data. They also sidestep a retrieval quirk
        in NQ: for 186 of 499 NQquestions (37.3%), all five passages come from one
        document, which leaves the model almost no choice about what to cite. The
        other three datasets have no such questions.\\nPrompt and generation. One
        prompt does all the work, byte-identical across models and across the clean
        and doctored runs. It tells the model to answer using only the numbered passages,
        to close every sentence with exactly one citation such as [2], and to reply
        'I don't know' when the passages fall short. Decoding is greedy, capped at
        300 new tokens. When any sentence of an answer breaks the one-citation rule
        we drop the whole answer rather than salvage the compliant half, because a
        partly rescued answer reintroduces the claim-to-citation ambiguity the format
        exists to prevent. Models differ sharply in how often they abstain, from 15%
        to 52% of questions; Appendix C takes that apart. The full prompt is in Appendix
        A.\\nReading our numbers. Three statistical choices shape every result, and
        each has a plain reason behind it.\\nWe resample questions, not claims. A
        single question yields up to seven claims that share one context and one generated
        answer, so treating claims as independent would make our intervals look tighter
        than they are. We use a cluster bootstrap instead: draw whole questions with
        replacement 2,000 times, recompute the planted and control conditions on the
        same draw so the pairing survives, and read off the 2.5th and 97.5th percentiles.
        Every 95% confidence interval in this paper is that band, the range of effects
        our data are consistent with.\\nWe compare each agent against its own base.
        Post-rationalization is common in the baseline, so reporting that an agent
        post-rationalizes tells us nothing about RL. The question is whether an agent
        diverges from the model it was trained from. That calls for a difference-in-differences:
        take the plantversus-control difference within a model (Equation 1), then
        difference those differences across models,\\n<!-- formula-not-decoded -->\\nNegative
        says RLVR made citations more faithful, positive says it made them worse,
        and zero says training left this behavior alone. Within each dataset we test
        all three agents against the baseline and correct the three comparisons with
        the Holm method, so that running three tests does not manufacture a significant
        one.\",\"metadata\":{\"ingestion_version\":\"01a0fc55257f7276be70b7b3d1501b36\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6-text-0011\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6\",\"chunk_type\":\"text\",\"section_path\":\"4
        Experimental Setup\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":64,\"page_no\":4,\"filename\":\"2609.23053v1.pdf\"}}},{\"id\":\"2f8a40b6-be17-5a91-a1a4-eeffcbaf50c8\",\"version\":13,\"score\":0.41478804,\"payload\":{\"page_content\":\"A
        Results on Common Questions\\nTables 4 and 5 report all primary settings.
        \u03C1 : nominal budget; \u02C6 \u03C1 : achieved ratio; P g /R g : grounded
        citation precision/recall; P e : emitted citation precision; reattr.: re-attribution
        rate (units without declared provenance recovering at least one source span
        under the NLI protocol); U s /U m : unsupported-claim rate under declared-span-only
        and summary-checked verification; str-EM: answer string exact match (ASQA);
        EF1: declaredevidence F1 (QASPER only). Every setting uses the same 944 ASQA
        or 976 QASPER successful questions; n denotes that common cohort, with metric-specific
        omissions identified in the tables. Scores are question-weighted means over
        defined values; superscript n = \xB7 \xB7 \xB7 gives the nonmissing count
        when smaller than the cohort, and dashes mark undefined metrics. QASPER verification
        rates exclude 1, 2, 3, and 2 zero-claim RECOMP answers at nominal budgets
        0.50, 0.25, 0.10, and 0.05, respectively; other settings use the full cohort.
        The 1 . 00 declared-span rates for noprovenance methods are structural; this
        verification mode does not attempt recovery. Exploratory slot-compressor runs
        are excluded. RECOMP emits identical per-question contexts at nominal budgets
        0.50 and 0.25 on ASQA, and at 0.50, 0.25, and 0.10 on QASPER. Separate generation
        passes are retained as distinct operating points.\",\"metadata\":{\"ingestion_version\":\"01a0fc54ff9a70d3af0e9b49e864b8b9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde-text-0027\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde\",\"chunk_type\":\"text\",\"section_path\":\"A
        Results on Common Questions\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":131,\"page_no\":13,\"filename\":\"2609.14245v1.pdf\"}}},{\"id\":\"5465c457-ca4b-5d77-839d-d3ad8983ca17\",\"version\":13,\"score\":0.4041701,\"payload\":{\"page_content\":\"B
        Complete Paired Comparisons\\nSection 4.2 describes the common cohorts, estimands,
        inference, and precision-code correction. Tables 6-10 report all 148 planned
        contrasts, including those not retained as claims; EF1 effects and intervals
        use four decimal places, and other effects and intervals use three.\\nTable
        notation. A/Q denote ASQA/QASPER; Id, RR, X, RC, and LL denote identity, reranking,
        extraction, RECOMP, and LLMLingua-2. Setting labels give compressor/nominal
        budget, optionally followed by the recovery threshold. P/R denote precision/recall,
        with e/g for emitted/grounded; EM is str-EM, EF1 is evidence F1, and Rec is
        reattribution rate. U s /U m /U r denote declared-span, summary, and recovered-source
        unsupported rates. \u2206 is the paired left-minus-right mean difference;
        a single endpoint applies to both settings, and a pair lists left-minus-right
        metrics. CI is a pointwise 95% bootstrap interval; p H is the two-sided randomization
        p -value after Holm adjustment across all 148 comparisons; n counts included
        questions.\\nRecovered-source verification. This extension reads existing
        NLI scores from the sealed cache and makes no new model calls. It uses the
        same recovered source IDs as citation scoring, but the claim verifier removes
        repeated source IDs before pooling evidence. Consequently, its unsupported
        rate need not equal one minus grounded citation recall, which retains repeated
        cited evidence. Both summary and recovered-source rates exclude the same zero-claim
        answers: two QASPER RECOMP answers at nominal 0.25; the other three comparisons
        use their full common cohorts. Input hashes, the extension plan, cache lookups,
        perquestion records, and all four comparisons are retained separately from
        the original analysis.\\n\",\"metadata\":{\"ingestion_version\":\"01a0fc54ff9a70d3af0e9b49e864b8b9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde-text-0028\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde\",\"chunk_type\":\"text\",\"section_path\":\"B
        Complete Paired Comparisons\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":133,\"page_no\":13,\"filename\":\"2609.14245v1.pdf\"}}},{\"id\":\"a9d96eb0-e563-5a4a-be72-fdfa293a765e\",\"version\":15,\"score\":0.40396383,\"payload\":{\"page_content\":\"4
        Experimental Setup\\nWe know what size of effect we could have caught. Our
        sample sizes give 80% power to detect a difference of roughly 7 percentage
        points (pp). Plainly: had RLVR moved post-rationalization by 7pp or more in
        either direction, this design would almost certainly have caught it. Shifts
        of a couple of points stay inside our blind spot, which is why we report a
        bounded null rather than a flat absence of effect. We fixed the primary outcome
        and the family of corrected comparisons in writing before the scorer ran.\\nCompute.
        Everything ran on Kaggle's free tier, two T4s or a single P100 per session:
        48 GPU jobs yielding 36,690 scored records across four models, four datasets,
        three variants, and both conditions. The original study used a 104B model;
        the controlled version of the same measurement fits on hardware anyone can
        get for free, and that is the part we would most like other groups to borrow.\",\"metadata\":{\"ingestion_version\":\"01a0fc55257f7276be70b7b3d1501b36\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6-text-0012\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6\",\"chunk_type\":\"text\",\"section_path\":\"4
