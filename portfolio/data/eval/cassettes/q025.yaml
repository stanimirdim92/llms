      |\n| T24  | Q      | LL       | F - D  | P g        | - 0 . 042 | [ - 0 . 095
      , +0 . 011]  | 0.6299 | 100 |  84 |", "This is a heatmap chart titled \"Llama-3.1-8B\"
      showing harmful response rates across 19 taxonomy subcategories (rows, including
      radiological_weapons, explosives, drugs, chemical_weapons, terrorism, biological_weapons,
      etc.) under four experimental conditions (columns: Non-RAG, Oracle unsafe, On-topic,
      Random). Each cell displays a harmful rate value (0.00\u20131.00, color-coded
      from white to dark red) along with sample size (n). The \"Oracle unsafe\" condition
      consistently shows the highest harmful rates across most categories (e.g., 0.55
      for explosives, 0.50 for chemical_weapons, 0.45 for murder), while Non-RAG,
      On-topic, and Random conditions generally show much lower rates near 0.00, indicating
      that exposing the model to unsafe \"oracle\" context substantially increases
      harmful outputs compared to other retrieval conditions.", "This is a heatmap
      chart titled \"Qwen2.5-7B\" showing harmful rates across 19 taxonomy subcategories
      (rows, including radiological_weapons, explosives, drugs, chemical_weapons,
      terrorism, cyberattacks, biological_weapons, hate_crimes, sexual_assault, etc.)
      against 4 experimental conditions (columns: Non-RAG, Oracle unsafe, On-topic,
      Random). Each cell displays a harmful rate value (0.00 to 1.00) with sample
      size (n), color-coded from white (low harm, 0.0) to dark red (high harm, 1.0)
      per the colorbar legend. The data reveals that the \"Oracle unsafe\" condition
      consistently produces the highest harmful rates (many values 0.55-1.00, including
      perfect 1.00 scores for radiological and biological weapons), while \"Random\"
      condition shows near-zero harmful rates across all subcategories, and \"Non-RAG\"
      and \"On-topic\" conditions show low-to-moderate harmful rates (generally 0.00-0.40),
      indicating that providing unsafe oracle context significantly increases model
      harmfulness compared to other retrieval conditions.", "This is a heatmap chart
      titled \"Gemma-3-12B\" displaying harmful rate values across a taxonomy of 20
      harm subcategories (rows: radiological_weapons, explosives, drugs, chemical_weapons,
      assault_battery, terrorism, cyberattacks, suicide, murder, hate_speech, kidnapping,
      self_harm, financial_crimes, biological_weapons, hate_crimes, property_crimes,
      fraud_scam, sexual_assault, sexual_harassment, abuse) against four experimental
      conditions (columns: Non-RAG, Oracle unsafe, On-topic, Random). Each cell shows
      a harmful rate value (0.00\u20131.00) with sample size (n), color-coded from
      white (0.0) to dark red (1.0) per the colorbar legend. The data reveals that
      the \"Oracle unsafe\" condition consistently produces the highest harmful rates
      (e.g., 1.00 for radiological_weapons, 0.80 for explosives, 0.75 for drugs),
      while \"On-topic\" and \"Random\" conditions yield much lower harmful rates
      (mostly 0.00\u20130.15), indicating the model is most susceptible to generating
      harmful content when given oracle-unsafe prompts.", "C Second-Evaluator Sensitivity
      Audit\nInference and diagnostics. The separate 24-test family uses pointwise
      95% bootstrap intervals and two-sided randomization tests, each with 10,000
      replicates and seed 13, question resampling on ASQA and paper clustering on
      QASPER, with question-weighted means and Holm adjustment. The original 148-test
      analysis is unchanged. Tables 11-12 report precision means and all planned contrasts.
      All 16 emitted-grounded gaps remain positive after adjustment; the eight cross-evaluator
      precision differences remain unresolved, which does not establish equivalence.
      ECR and other budgets are outside this audit.\nThe run scored 6,015 unique pairs
      in 419 seconds of model inference (430 seconds including bookkeeping; setup
      and excluded attempts are additional). Four inputs required truncation, with
      maximum pre-truncation length 47,440 tokens. After normalization, 122 pairs
      (2.03%) produced nonbinary strings, including 103 empty strings; assigning zero
      does not establish reliable nonentailment. These are pair counts, not fractions
      of questions affected; the full histogram accompanies the cache. Recovery can
      disagree substantially: QASPER LLMLingua-2 has 50.3% agreement over 1,000 candidate
      decisions and mean recovery rates of 0.84 for DeBERTa versus 0.38 for TRUE.
      These descriptive results support sensitivity analysis, not accuracy against
      human judgments.\n", "B Complete Paired Comparisons\nSection 4.2 describes the
      common cohorts, estimands, inference, and precision-code correction. Tables
      6-10 report all 148 planned contrasts, including those not retained as claims;
      EF1 effects and intervals use four decimal places, and other effects and intervals
      use three.\nTable notation. A/Q denote ASQA/QASPER; Id, RR, X, RC, and LL denote
      identity, reranking, extraction, RECOMP, and LLMLingua-2. Setting labels give
      compressor/nominal budget, optionally followed by the recovery threshold. P/R
      denote precision/recall, with e/g for emitted/grounded; EM is str-EM, EF1 is
      evidence F1, and Rec is reattribution rate. U s /U m /U r denote declared-span,
      summary, and recovered-source unsupported rates. \u2206 is the paired left-minus-right
      mean difference; a single endpoint applies to both settings, and a pair lists
      left-minus-right metrics. CI is a pointwise 95% bootstrap interval; p H is the
      two-sided randomization p -value after Holm adjustment across all 148 comparisons;
      n counts included questions.\nRecovered-source verification. This extension
      reads existing NLI scores from the sealed cache and makes no new model calls.
      It uses the same recovered source IDs as citation scoring, but the claim verifier
      removes repeated source IDs before pooling evidence. Consequently, its unsupported
      rate need not equal one minus grounded citation recall, which retains repeated
      cited evidence. Both summary and recovered-source rates exclude the same zero-claim
      answers: two QASPER RECOMP answers at nominal 0.25; the other three comparisons
      use their full common cohorts. Input hashes, the extension plan, cache lookups,
      perquestion records, and all four comparisons are retained separately from the
      original analysis.\n", "E. Experimental Design\nThe evaluation set contains
      49 fact-checking queries, of which 37 are distinct, spanning locations, dates
      and counts, yes/no claims, and people. Ten information-rich passages covering
      the queried facts were added to the index because raw FEVER evidence sentences
      are often too terse to support a full answer. Crossing the query set with three
      strategies and four poisoning levels yields 49 \u00d7 3 \u00d7 4 = 588 runs,
      each producing a clean and a poisoned answer for 1 , 176 generations in total.
      Because a full sweep takes roughly a day on CPU, results are written to disk
      after every run and a checkpoint records completed cells, so an interrupted
      sweep resumes without repeating work.", "Table 5: All 21 primary settings on
