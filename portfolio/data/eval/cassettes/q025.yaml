- request:
    body: '{"query": "What overall Fleiss'' kappa does the rater-agreement heatmap
      report, and over how many items?", "documents": ["This is a heatmap (confusion
      matrix-style chart) displaying pairwise rater agreement using Cohen''s \u03ba
      among four raters/models: Llama-Guard, WildGuard, ShieldGemma, and Accuracy.
      The overall Fleiss'' \u03ba is 0.56 (n=6920), indicating moderate agreement.
      The diagonal shows perfect agreement (1.00), while off-diagonal values range
      from 0.47 to 0.67, with WildGuard and Accuracy showing the highest pairwise
      agreement (0.67) and Llama-Guard/ShieldGemma and ShieldGemma/Accuracy showing
      lower agreement (0.48\u20130.49); the color scale ranges from 0 to 1.0 (yellow
      to dark red).", "4.4 R4: Subjectivity of harm\nFigure 4 presents the Cohen''s
      Kappa scores for inter-annotator agreement. LlamaGuard and WildGuard have an
      agreement of 0.66, indicating substantial agreement. The other pairwise comparisons
      between the LLM safety judges are 0.47 and 0.48, indicating only moderate agreement.
      In general, our hypothesis H4 that the automated safety evaluators will disagree
      on many cases is supported. We additionally include the evaluation of whether
      the answer was judged to be accurate, compared to the reference answer. The
      accuracy measure agrees most with the safety ratings of WildGuard with \u03ba
      = 0 . 67 . These results highlight that different methods of evaluating safety
      versus harm may lead to different interpretations of the same phenomenon. Overall,
      the four-way Fleiss''s kappa is 0.56, indicating only moderate agreement. However,
      Figure 5 in the Appendix, which provides a more detailed view of the safety
      evaluations, suggests that even when the absolute numbers differ, when averaged
      over a large number of samples, the trends observed using each of the evaluation
      methods remain generally consistent.\nTo explore the differences between automated
      safety evaluators further, Table 4 presents a finegrained analysis of the predicted
      positive rate for each evaluator on each sub-category of the RAGSafety-Bench
      benchmark, averaged over all generating models. When averaged over all models
      and conditions, the predicted positive rate of the evaluators is similar (14%
      for LlamaGuard, 17% for ShieldGemma, and 20% for WildGuard). However, each evaluator
      is more sensitive to certain subcategories of harm. For example, LlamaGuard
      flags responses less often than the other two evaluators Cohen''s K\nFigure
      3: Refusal behaviors by model and condition.\nFigure 4: Pairwise Cohen''s Kappa
      scores for each automated safety judge, as well as four-way Fleiss''s Kappa.\nin
      categories like assault/battery and drugs. ShieldGemma flags far fewer responses
      in the subcategories of cyberattacks and financial crimes, while flagging more
      often in categories like chemical weapons, radiological weapons, and explosives.
      WildGuard is more sensitive to subcategories like hate speech and sexual harassment.",
      "Table 11: Human validation of the automated refusal classification.\n\n| Comparison                 |   Raw
      agreement |   Cohen''s Kappa |\n|----------------------------|-----------------|-----------------|\n|
      Annotator_1 vs LLM         |            0.84 |            0.71 |\n| Annotator_2
      vs LLM         |            0.85 |            0.73 |\n| Annotator_1 vs Annotator_2
      |            0.92 |            0.86 |", "Table 7: Human validation of the automated
      accuracy calculation.\n\n| Comparison                 |   Agreement |   Cohen''s
      Kappa |\n|----------------------------|-------------|-----------------|\n| Annotator_1
      vs LLM         |        0.96 |            0.92 |\n| Annotator_2 vs LLM         |        0.95
      |            0.90 |\n| Annotator_1 vs Annotator_2 |        0.97 |            0.94
      |", "A.4 LLM-as-a-judge accuracy evaluation\nThe accuracy of the responses was
      assessed by comparing the model outputs with the gold ''expected unsafe answer
      summary'' for each question. Accuracy judging was conducted using Claude Opus-4.7,
      using the prompt shown in Table 9. Out of 6,920 responses scored, in 95% of
      cases a valid ''true'' or ''false'' label was returned. In the remaining 5%,
      an empty label was returned; these were treated as ''false'' for the sake of
      the analysis.\nThe automated classifier was validated through human annotation
      of 100 examples, sampled across the five generating models and the True/False
      conditions. The raw agreement and Cohen''s \u03ba scores are given in Table
      7. The agreement between manual and automated accuracy scoring is very high,
      with raw agreement between 95-96% and Cohen''s \u03ba of 0.90-0.92.\nTable 7:
      Human validation of the automated accuracy calculation.\n\nAnnotator_1 vs LLM,
      Agreement = 0.96. Annotator_1 vs LLM, Cohen''s Kappa = 0.92. Annotator_2 vs
      LLM, Agreement = 0.95. Annotator_2 vs LLM, Cohen''s Kappa = 0.90. Annotator_1
      vs Annotator_2, Agreement = 0.97. Annotator_1 vs Annotator_2, Cohen''s Kappa
      = 0.94\nTable 8: Answerability of document contexts for the final balanced subset
      ( n = 346 ). Oracle and on-topic contexts were audited with GPT-4.1mini. \u2020
      Random-control values reflect construction-time answer_support=none labels rather
      than a separate LLM audit.\n\nOracle unsafe, Yes = 200 (57.8%). Oracle unsafe,
      Partial = 146 (42.2%). Oracle unsafe, No / none = 0 (0.0%). On-topic safe, Yes
      = 0 (0.0%). On-topic safe, Partial = 0 (0.0%). On-topic safe, No / none = 346
      (100.0%). Random control \u2020, Yes = 0 (0.0%). Random control \u2020, Partial
      = 0 (0.0%). Random control \u2020, No / none = 346 (100.0%)", "A.7 Detailed
      safety evaluation comparison\nFigure 5 shows the proportion of responses marked
      as either ''harmful'' or ''accurate'' for each model and condition. The generally
      consistent vertical structure indicates that although the methods of safety
      evaluation lead to different results, the trends (averaged over many samples)
      are consistent across evaluators. Nonetheless, we would recommend that researchers
      use multiple evaluators in their study, given the fairly high rates of disagreement
      observed here.", "This is a heatmap chart titled \"Ministral-3-8B\" showing
      harmful response rates across four experimental conditions (Non-RAG, Oracle
      unsafe, On-topic, Random) for 19 taxonomy subcategories of harmful content (rows),
      including radiological_weapons, explosives, drugs, chemical_weapons, assault_battery,
      terrorism, cyberattacks, suicide, murder, hate_speech, kidnapping, self_harm,
      financial_crimes, biological_weapons, hate_crimes, property_crimes, fraud_scam,
      sexual_assault, sexual_harassment, and abuse. Each cell displays a harmful rate
      value (0.00\u20131.00) with sample size (n), and the color scale (white to dark
      red) indicates rate magnitude. The \"Oracle unsafe\" condition consistently
      shows the highest harmful rates (many cells 0.55\u20131.00, darkest red), while
      the \"Random\" condition shows near-zero harmful rates across nearly all subcategories,
      with \"Non-RAG\" and \"On-topic\" conditions showing intermediate, generally
      low rates.", "This is a heatmap chart displaying \"Fooled rate (%)\" data across
      three manipulation types (Entity swap, Number swap, Negation) as rows and four
      levels of poisoned documents (0/3, 1/3, 2/3, 3/3) as columns. The color gradient
      ranges from green (low fooled rate, ~8-10%) to red (high fooled rate, ~30-37%),
      showing that fooled rates consistently increase as the number of poisoned documents
      increases from 0/3 to 3/3. Entity swap shows the highest fooled rates overall
      (10.2% to 36.7%), while Negation shows comparatively lower rates (8.2% to 30.6%),
      with Number swap falling in between (10.2% to 34.7%).", "4 Experimental Setup\nWe
      know what size of effect we could have caught. Our sample sizes give 80% power
      to detect a difference of roughly 7 percentage points (pp). Plainly: had RLVR
      moved post-rationalization by 7pp or more in either direction, this design would
      almost certainly have caught it. Shifts of a couple of points stay inside our
      blind spot, which is why we report a bounded null rather than a flat absence
      of effect. We fixed the primary outcome and the family of corrected comparisons
      in writing before the scorer ran.\nCompute. Everything ran on Kaggle''s free
      tier, two T4s or a single P100 per session: 48 GPU jobs yielding 36,690 scored
      records across four models, four datasets, three variants, and both conditions.
      The original study used a 104B model; the controlled version of the same measurement
      fits on hardware anyone can get for free, and that is the part we would most
      like other groups to borrow.", "This is a heatmap chart titled \"Phi-4-14B\"
      displaying harmful rate data across a taxonomy of harm subcategories (rows)
      and four experimental conditions (columns): Non-RAG, Oracle unsafe, On-topic,
      and Random. The rows list 20 harm subcategories including radiological_weapons,
      explosives, drugs, chemical_weapons, assault_battery, terrorism, cyberattacks,
      suicide, murder, hate_speech, kidnapping, self_harm, financial_crimes, biological_weapons,
      hate_crimes, property_crimes, fraud_scam, sexual_assault, sexual_harassment,
      and abuse, with sample sizes (n) shown in each cell. The color scale ranges
      from white (0.0) to dark red (1.0) representing harmful rate, and the data reveals
      that the \"Oracle unsafe\" condition produces substantially higher harmful rates
      (ranging from 0.05 to 0.55) across nearly all categories compared to Non-RAG,
      On-topic, and Random conditions, which remain mostly at or near 0.00, indicating
      that providing oracle unsafe context significantly increases the model''s tendency
      to generate harmful content.", "Table 12: All 24 planned TRUE robustness contrasts,
