      -     | 1.00          | 0.67          | 976 |", "4.1 Experimental Setup\nWe
      evaluate on two attribution benchmarks with different retrieval granularities.
      ASQA comprises 948 ambiguous factoid questions from the ALCE release (Gao et
      al., 2023), each paired with the top-5 GTR-retrieved passages, sentencesegmented
      into citable snippets; answer quality is string exact match (str-EM). QASPER
      (Dasigi et al., 2021) is the 1,005-question dev split over 281 NLP papers, using
      each supplied paper''s abstract and full text. Gold evidence is paragraphlevel,
      so identity presents paragraphs as citable units while compressors operate on
      sentence snippets; declared sids map to paragraphs for setF1 against gold evidence,
      max over annotators. The generator is Qwen2.5-7B-Instruct served via vLLM with
      greedy decoding and ALCE-style numbered-context citation prompting (Gao et al.,
      2023). Primary entailment judgments use the development-grade DeBERTa NLI evaluator
      of \u00a73.1 at \u03c4 = 0 . 5 . We compare six compressors: identity (no compression;
      documentlevel on ASQA, paragraph-level on QASPER), cross-encoder rerank topk
      (ms-marco-MiniLML-6-v2), embedding-based extractive sentence selection (all-MiniLM-L6-v2),
