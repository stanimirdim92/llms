        271 papers, axes as in Figure 1. The third panel scores each compressor's
        declared evidence against gold paragraphs; it is undefined for no-provenance
        methods. Small plotted differences do not establish equivalence.\\nsion of
        0.12 against source spans; its mean perquestion recovery rate is 0.41. The
        paired precision gap is 0.740 (95% CI [0.711, 0.767], p H = 0 . 0148 ). The
        gap combines effects of compression, bounded recovery, and NLI judgments;
        these measurements do not separate their contributions. On QASPER the corresponding
        scores are 0.55 and 0.06 (achieved ratio 0.015), with gap 0.491 [0.457, 0.525]
        and p H = 0 . 0148 . LLMLingua2's grounded precision means decrease across
