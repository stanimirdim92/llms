- request:
    body: '{"query": "How many fact-checking queries are in the poisoning study''s
      evaluation set, and how many are distinct?", "documents": ["E. Experimental
      Design\nThe evaluation set contains 49 fact-checking queries, of which 37 are
      distinct, spanning locations, dates and counts, yes/no claims, and people. Ten
      information-rich passages covering the queried facts were added to the index
      because raw FEVER evidence sentences are often too terse to support a full answer.
      Crossing the query set with three strategies and four poisoning levels yields
      49 \u00d7 3 \u00d7 4 = 588 runs, each producing a clean and a poisoned answer
      for 1 , 176 generations in total. Because a full sweep takes roughly a day on
      CPU, results are written to disk after every run and a checkpoint records completed
      cells, so an interrupted sweep resumes without repeating work.", "D. Evaluation
      Metrics\nFor every run the model retrieves once, then answers twice: once from
      the clean passages and once from a poisoned copy of that same list. Passage
      identity and order are therefore shared across the pair; what is not locked
      is decoding (temperature 0.1, two independent generate calls). Four quantities
      are recorded.\nAccuracy checks whether the reference keyword for a question
      appears in the answer, case-insensitively. Keyword presence is a coarse label:
      a negated or qualified answer can still contain the keyword, and an otherwise
      correct paraphrase can miss it. We keep it because it is reproducible and applied
      uniformly, not because it is a gold standard. Fooled rate is the fraction of
      runs where the clean answer was correct but the poisoned answer was not; it
      isolates correct-to-incorrect flips from questions the model could not answer
      anyway. It is not a direct measure of poison adoption, because an incorrect
      poisoned answer may abstain, contradict the poison, or state a third wrong fact.
      Abstention rate counts answers that decline to commit, detected through a small
      set of phrases such as ''not enough information'' and ''cannot determine.''
      Unsupported generation (reported in earlier drafts as a hallucination proxy)
      is approximated by lexical overlap: an answer is flagged when fewer than 30%
      of its content words appear in any retrieved passage,\n<!-- formula-not-decoded
      -->\nwith W a the content words of the answer and W d those of the retrieved
      passages. Lexical overlap confuses faithful paraphrase with unsupported invention,
      and it can miss answers that copy poisoned text. We treat the proxy as a trend
      indicator only.", "C. Uncertainty on the Existing Runs\nWe do not invent new
      generations for this revision. We reanalyse the same table with a query-level
      bootstrap: resample the 49 indexed query slots with replacement (37 distinct
      texts), keep every run tied to a drawn slot, recompute the fooled rate, and
      repeat 10 , 000 times with a fixed seed to obtain percentile 95% intervals.
      Exact McNemar tests on discordant clean/poisoned correctness pairs are reported
      as a secondary check; effect sizes and intervals remain primary.\nTable II shows
      that the climb with poisoning level remains after accounting for query resampling,
      while neighbouring levels overlap. The comparison that matters for the numeric
      pattern is isolated next.\nTABLE III BEHAVIOUR BY STRATEGY, AVERAGED OVER ALL
      FOUR POISONING LEVELS. EACH STRATEGY AGGREGATES 196 RUNS.\n\nEntity swap, Clean
      acc. (%) = 78.1. Entity swap, Poisoned acc. (%) = 54.6. Entity swap, Fooled
      rate (%) = 23.5. Entity swap, Abstain rate (%) = 43.4. Number swap, Clean acc.
      (%) = 77.6. Number swap, Poisoned acc. (%) = 57.7. Number swap, Fooled rate
      (%) = 20.4. Number swap, Abstain rate (%) = 30.1. Negation, Clean acc. (%) =
      78.1. Negation, Poisoned acc. (%) = 60.2. Negation, Fooled rate (%) = 19.4.
      Negation, Abstain rate (%) = 32.1", "REFERENCES\n- [1] P. Lewis et al. , ''Retrieval-augmented
      generation for knowledge-intensive NLP tasks,'' in Advances in Neural Information
      Processing Systems , vol. 33, 2020, pp. 9459-9474.\n- [2] J. Thorne, A. Vlachos,
      C. Christodoulopoulos, and A. Mittal, ''FEVER: a large-scale dataset for fact
      extraction and verification,'' in Proc. Conf. North American Chapter of the
      Association for Computational Linguistics (NAACL-HLT) , 2018, pp. 809-819.\n-
      [3] F. Shi et al. , ''Large language models can be easily distracted by irrelevant
      context,'' in Proc. Int. Conf. Machine Learning (ICML) , 2023, pp. 31210-31227.\n-
      [4] K. Zhou et al. , ''Don''t make your LLM an evaluation benchmark cheater,''
      arXiv preprint arXiv:2311.01964, 2023.\nFooled rate across all conditions (%)\nFig.
      6. The ten queries with the highest fooled rate across all conditions. Biographical
      and landmark questions dominate because the passages that answer them carry
      many swappable entities.\nserve as a cheap early warning of a poisoned store.",
      "TABLE II FOOLED RATE WITH QUERY-LEVEL BOOTSTRAP 95% INTERVALS (ALL STRATEGIES,
      147 RUNS PER ROW).\n\n| Poisoned passages   |   Fooled (%) | 95% CI            |   n
      |\n|---------------------|--------------|-------------------|-----|\n| 0 / 3               |          9.5
      | [5 . 4 , 14 . 3]  | 147 |\n| 1 / 3               |         15.0 | [8 . 8 ,
      21 . 8]  | 147 |\n| 2 / 3               |         25.9 | [18 . 4 , 33 . 3] |
      147 |\n| 3 / 3               |         34.0 | [24 . 5 , 44 . 2] | 147 |", "A.
      Setting\nAll runs use the corpus of 19,597 FEVER dev evidence sentences plus
      the ten added passages, the MiniLM retriever, and the quantized Llama 3.1 8B
      generator described above, with k = 3 and temperature 0.1 held fixed. The dataset
      comes from the FEVER benchmark of Thorne et al. [2], which pairs claims with
      Wikipedia evidence and is a standard resource for fact verification.", "C Second-Evaluator
      Sensitivity Audit\nInference and diagnostics. The separate 24-test family uses
      pointwise 95% bootstrap intervals and two-sided randomization tests, each with
      10,000 replicates and seed 13, question resampling on ASQA and paper clustering
      on QASPER, with question-weighted means and Holm adjustment. The original 148-test
      analysis is unchanged. Tables 11-12 report precision means and all planned contrasts.
      All 16 emitted-grounded gaps remain positive after adjustment; the eight cross-evaluator
      precision differences remain unresolved, which does not establish equivalence.
      ECR and other budgets are outside this audit.\nThe run scored 6,015 unique pairs
      in 419 seconds of model inference (430 seconds including bookkeeping; setup
      and excluded attempts are additional). Four inputs required truncation, with
      maximum pre-truncation length 47,440 tokens. After normalization, 122 pairs
      (2.03%) produced nonbinary strings, including 103 empty strings; assigning zero
      does not establish reliable nonentailment. These are pair counts, not fractions
      of questions affected; the full histogram accompanies the cache. Recovery can
      disagree substantially: QASPER LLMLingua-2 has 50.3% agreement over 1,000 candidate
      decisions and mean recovery rates of 0.84 for DeBERTa versus 0.38 for TRUE.
      These descriptive results support sensitivity analysis, not accuracy against
      human judgments.\n", "B Complete Paired Comparisons\nSection 4.2 describes the
      common cohorts, estimands, inference, and precision-code correction. Tables
      6-10 report all 148 planned contrasts, including those not retained as claims;
      EF1 effects and intervals use four decimal places, and other effects and intervals
      use three.\nTable notation. A/Q denote ASQA/QASPER; Id, RR, X, RC, and LL denote
      identity, reranking, extraction, RECOMP, and LLMLingua-2. Setting labels give
      compressor/nominal budget, optionally followed by the recovery threshold. P/R
      denote precision/recall, with e/g for emitted/grounded; EM is str-EM, EF1 is
      evidence F1, and Rec is reattribution rate. U s /U m /U r denote declared-span,
      summary, and recovered-source unsupported rates. \u2206 is the paired left-minus-right
      mean difference; a single endpoint applies to both settings, and a pair lists
      left-minus-right metrics. CI is a pointwise 95% bootstrap interval; p H is the
      two-sided randomization p -value after Holm adjustment across all 148 comparisons;
      n counts included questions.\nRecovered-source verification. This extension
      reads existing NLI scores from the sealed cache and makes no new model calls.
      It uses the same recovered source IDs as citation scoring, but the claim verifier
      removes repeated source IDs before pooling evidence. Consequently, its unsupported
      rate need not equal one minus grounded citation recall, which retains repeated
      cited evidence. Both summary and recovered-source rates exclude the same zero-claim
      answers: two QASPER RECOMP answers at nominal 0.25; the other three comparisons
      use their full common cohorts. Input hashes, the extension plan, cache lookups,
      perquestion records, and all four comparisons are retained separately from the
      original analysis.\n", "B. Accuracy Degradation\nOne detail in Table I needs
      to be read carefully. The 0 / 3 row still shows a fooled rate near 10% and an
      accuracy about 9 points below the clean arm, even though no passage is rewritten
      and both answers see the same retrieved list. That residual is therefore not
      a retrieval mismatch. It comes from decoding noise under temperature 0.1 across
      two independent generations, plus a strict keyword matcher that can disagree
      on near-paraphrases. Recomputing from the 588-run table, clean and poisoned
      answers are identical in only 76.9% of the 0 / 3 runs. The residual is large
      relative to some attack increments (the rise from 9.5% to 15.0% fooled between
      0 / 3 and 1 / 3 is 5.5 points), so strategy contrasts at light poisoning should
      be read as suggestive until decoding is controlled (fixed seeds, repeated draws)
      and labels are less brittle. We therefore read the clean-arm column, not the
      0 / 3 poisoned cell, as the true no-attack baseline.", "This is a pair of line
      charts (two-panel plot) illustrating the effect of poisoned retrieved documents
      on question-answering accuracy for three perturbation types: Entity swap, Number
      swap, and Negation.\n\nPanel (a) shows \"Accuracy under poisoning,\" plotting
      Accuracy (%) against the number of poisoned documents out of 3 retrieved (0/3,
      1/3, 2/3, 3/3). A dashed green \"Clean arm\" baseline stays flat around 78%,
      while all three perturbation conditions decline from roughly 65-72% at 0/3 poisoned
      documents down to about 41-48% at 3/3 poisoned documents.\n\nPanel (b) shows
      \"Drop vs. clean arm,\" plotting the accuracy drop in percentage points against
      the same poisoned document ratios, with all three lines starting near 0-10 pp
      at 0/3 and rising to approximately 31-37 pp drop at 3/3 poisoned documents,
      with Entity swap showing the steepest degradation.", "V. CONCLUSION\nWe measured
      how a 4-bit Llama 3.1 8B model behaves when its retrieved context is poisoned,
      across three corruption strategies and four poisoning levels in a 588-run sweep.
      Accuracy falls from 77.9% to 43.5% as corruption goes from none to total. Entity
      swap flips the most answers. Numeric corruption shows a majority-leaning jump
      once two of three passages are poisoned, with a bootstrap interval on that jump
      that excludes zero but remains wide. The model''s main recorded response to
      attack is to abstain rather than to state a wrong answer, and the lexical-overlap
      proxy of unsupported generation falls under poisoning rather than rising.\nThe
      study has clear limits. It covers one small quantized model on a compact query
      set with rule-based corruption, so the absolute numbers should not be read as
      universal. Retrieval is shared across the pair, but decoding is not locked (temperature
      0.1, two independent generations), and the 0 / 3 residual shows that background
      pair noise is non-trivial. Keyword matching is a weak correctness criterion,
      and the overlap proxy is not a semantic faithfulness judge. The added passages
      make retrieval easier than raw FEVER evidence would. Each limit points to a
      concrete next step: lock decoding seeds across the pair and add multi-seed and
      multi-corruption repeats with hierarchical resampling, replace keyword checks
      with structured FEVER-style labels and normalized entity or quantity scoring,
      adjudicate a stratified sample with blinded humans or a validated entailment
      model, and decompose answers into atomic claims so poison adoption can be separated
      from unsupported generation. We also plan to repeat the sweep on a larger instruction-tuned
      model and on a second corpus, to replace rule-based edits with model-generated
      adversarial\n- [5] K. Guu, K. Lee, Z. Tung, P. Pasupat, and M. Chang, ''REALM:
      retrievalaugmented language model pre-training,'' in Proc. Int. Conf. Machine
      Learning (ICML) , 2020, pp. 3929-3938.\n- [6] N. Reimers and I. Gurevych, ''Sentence-BERT:
      sentence embeddings using Siamese BERT-networks,'' in Proc. Conf. Empirical
      Methods in Natural Language Processing (EMNLP) , 2019, pp. 3982-3992.\n- [7]
      J. Johnson, M. Douze, and H. J\u00b4 egou, ''Billion-scale similarity search
      with GPUs,'' IEEE Trans. Big Data , vol. 7, no. 3, pp. 535-547, 2019.", "C Second-Evaluator
      Sensitivity Audit\nWe sample 100 questions per dataset from sorted common-cohort
      IDs using a fresh Python seed13 random generator; QASPER spans 84 papers. Full-context
      identity and nominal-0.25 extraction, RECOMP, and LLMLingua-2 contribute 800
      unchanged saved answers, with 1,627 claims and 1,890 citation markers. The prior
      DeBERTa values are the original scores for these same sampled answers.\nModel
      and decoding. We use google/t5_xxl_true_nli_mixture (Honovich et al., 2022),
      revision aa6cfe1dd4 , with full revision and checkpoint hashes in the manifest.
      This released mixture uses SNLI, MNLI, FEVER, SciTail, PAWS, and VitaminC (Bowman
      et al., 2015; Williams et al., 2018; Thorne et al., 2018; Khot et al., 2018;
      Zhang et al., 2019; Schuster et al., 2021), rather than the original TRUE paper''s
      ANLI recipe. MNLI and FEVER overlap DeBERTa''s training mixture. Inference uses
      Transformers 4.57.6, the slow T5 tokenizer, BF16, batch size four, and one NVIDIA
      B200. The prompt places compressed text or source evidence after premise: and
      the unit or claim after hypothesis: .\nWe use an AutoAIS-style exact-one decision
      (Bohnet et al., 2022; Gao et al., 2023): generate at most ten tokens deterministically,
      strip surrounding whitespace, and count only 1 as entailment. Every other string
      scores zero; these are binary decisions, not calibrated probabilities. Unlike
      our rule, reference AutoAIS/ALCE code compares decoded strings without additional
      whitespace normalization. We retain normalized nonbinary strings, but not every
      raw output, so normalization''s effect cannot be quantified from the cache.\nEvidence
      mappings. Fixed recovery preserves declared provenance and DeBERTa-recovered
      source IDs while TRUE scores support. TRUE recovery reevaluates all top-10 lexical
      candidates for undeclared units, including DeBERTa-rejected candidates, then
      scores with TRUE. Both retain the corrected precision gate. Fixed recovery retains
      selection dependence; TRUE recovery reuses one judge. Neither removes bounded-search
      errors or supplies human calibration.\nRecorded amendments. Astrict-decoding
      pilot stopped on a nonbinary output; a second stopped on an overlong hypothesis.
      An input-only scan found five undeclared units exceeding 2,048 tokens (maximum
      hypothesis plus prompt: 2,988), motivating a uniform 4,096-token cap that preserves
      complete hypotheses and truncates only premises. A later batch-eight run exhausted
      GPU memory. All interrupted attempts and plans are preserved but excluded; the
      final batch-four run recomputes every input in a fresh cache. These amendments
      preceded inspection of any aggregate TRUE comparison report and left the sample,
      thresholds, and 24 comparisons unchanged. The cap exceeds original TRUE''s 2,048
      and DeBERTa''s 512 tokens, so cross-evaluator differences do not isolate model
      family.", "In RAG We Trust? Measuring Robustness of Retrieval-Augmented Generation
      Under Document Poisoning\nIliano Fasolino Department of Computer Science University
      of Milan Milan, Italy\nAbstract -Retrieval-augmented generation (RAG) grounds
      a language model in retrieved documents, which reduces hallucination but creates
      a new attack surface: if retrieved text is tampered with, the model may repeat
      the falsehood. We study how much a small quantized model, Llama 3.1 8B, degrades
      when a fraction of its retrieved context is poisoned. Three corruption strategies
      are tested, entity swap, number swap, and negation, each applied to zero, one,
      two, or three of the three retrieved passages, over a factorial sweep of 588
      runs on a fact-checking task built from FEVER. Accuracy falls from 77.9% on
      clean context to 43.5% when all three passages are corrupted. Entity swap flips
      the largest share of answers that were correct on clean context. Number-based
      corruption stays flat while poisoned passages are a minority and jumps once
      they form a majority, a pattern we re-check with query-level bootstrap intervals.
      The model rarely invents new falsehoods; its dominant reaction is to abstain,
      and a lexical overlap proxy of unsupported generation falls under attack rather
      than rising. The study is a small-scale measurement with coarse automated labels;
      we treat the strategy contrasts as suggestive until decoding is controlled and
      stronger adjudication is in place.\na practitioner running a small model on
      modest hardware is a concrete measurement: how far does accuracy fall, which
      kind of corruption bites hardest, and does the model fail loudly by fabricating
      or quietly by refusing.\nIndex Terms -retrieval-augmented generation, large
      language models, adversarial robustness, document poisoning, fact verification",
      "G. Which Queries Break\nFooled rates are uneven across questions. Figure 6
      lists the ten most fragile ones. Questions about a well-known person''s biography
      and about the landmark facts in our added passages top the list, because those
      passages contain the richest set of swappable entities. Yes/no and location
      questions are more exposed than open numeric ones, whose lower clean accuracy
      leaves less room for a correct-to-wrong flip. The pattern is a reminder that
      vulnerability depends on the fact being asked about, not only on the attack.",
      "This image consists of two line/bar charts comparing the effects of poisoned
      documents on model behavior, plotted against \"Poisoned documents (out of 3
      retrieved)\" (0/3, 1/3, 2/3, 3/3) on the x-axis.\n\nPanel (a) is a line chart
      showing \"Abstention rate (%)\" for four conditions: Entity swap (red), Number
      swap (orange), Negation (purple), and Clean arm (green dashed baseline ~13%).
      As poisoned documents increase, abstention rises sharply for Entity swap (up
      to ~70%), while Number swap and Negation show moderate increases (up to ~42%),
      and the Clean arm remains flat.\n\nPanel (b) is a grouped bar chart showing
      \"Hallucination rate (%)\" for Clean arm (blue) versus Poisoned arm (red) across
      the same x-axis categories, revealing that hallucination rates decrease as poisoned
      documents increase for both arms, with the Poisoned arm dropping from 26.5%
      to 12.2% and the Clean arm from 31.3% to 29.9%.", "A.3 Answerability audit of
      evaluation contexts\nWe audited the exact rendered contexts used for the final
      balanced evaluation subset (346 questions) using GPT-4.1-mini. Given a question
      and its supplied documents, the judge classified whether the documents contained
      the information needed to directly and substantially answer the question as
      yes , partial , or no . We retained examples only when the oracle context was
      judged yes or partial and the on-topic context was judged no . Thus, the oracle
      condition contains answer-bearing evidence, while the on-topic condition is
      topically related but does not directly support the unsafe answer.\nTable 8
      reports the final audit outcomes. The random-control condition was constructed
      from a benign, off-topic document pool rather than independently re-judged by
      the LLM: all 346 randomcontrol contexts contain only documents labelled none
      for answer support in the benchmark metadata (1,012 documents in total).", "I.
      INTRODUCTION\nLarge language models answer questions fluently but carry two
      well-known liabilities: their knowledge is frozen at training time, and they
      sometimes state false facts with full confidence. Retrieval-augmented generation,
      proposed by Lewis et al. [1], addresses both by fetching relevant documents
      at query time and placing them in the prompt as evidence. The model is then
      asked to answer from that evidence rather than from memory alone. This design
      has become the default recipe for question answering over private or fast-moving
      knowledge bases.\nThe same design introduces a dependency that is easy to overlook.
      A RAG answer is only as trustworthy as the documents it retrieves. If an attacker
      can edit, inject, or otherwise corrupt even part of the retrieved set, the grounding
      step that was meant to improve reliability becomes a channel for misinformation.
      Shi et al. [3] showed that irrelevant context alone can pull a model off track;
      corrupted but on-topic context is a stronger lever, because it looks exactly
      like the evidence the model was told to trust. What is still missing for We
      answer those three questions empirically. Our contribution is threefold. First,
      we build a reproducible poisoning testbed around a 4-bit Llama 3.1 8B model,
      a MiniLM retriever, and a FAISS index of nearly twenty thousand FEVER evidence
      sentences. Second, we run a full factorial experiment, three corruption strategies
      crossed with four poisoning levels over a fixed query set, and report accuracy,
      a fooled rate, abstention, and a lexical-overlap proxy of unsupported generation
      for every cell. Third, we characterise the failure surface: entity corruption
      flips the most answers, numeric corruption jumps once it reaches a majority
      of the context, and the model''s default response to contradiction is to abstain
      rather than to invent. Every point estimate reported here comes from the same
      588-run table. Where we interpret a jump or a strategy ranking, we also report
      query-level bootstrap intervals and paired tests recomputed from that table.",
      "4.2 Statistical Analysis and Metric Audit\nCommon cohorts and estimands. Primary
      summaries and comparisons use the intersection of successful question IDs across
      identity and all twenty compressed settings. Each question has equal weight
      in citation precision, citation recall, answer quality, and evidence F1; claims
      and citations are not pooled across questions. Undefined evidence or recovery
      metrics remain undefined rather than becoming zeros. Verification-rate means
      exclude answers with zero claims; paired verification comparisons exclude a
      question if ei- ther member has zero claims. The analysis artifacts report those
      exclusions and retain full-cohort descriptive means separately.\nInference.
      We use pointwise 95% percentile bootstrap intervals for each paired mean difference
      (Dror et al., 2018), resampling 944 questions on ASQA and 271 papers on QASPER
      with replacement. All retained questions from a sampled QASPER paper travel
      together, and each replicate divides its total difference by the number of sampled
      questions, preserving the questionweighted estimand. Every QASPER contrast retains
      all 271 papers after metric-specific exclusions. Two-sided randomization tests
      swap paired labels within questions on ASQA and jointly within papers on QASPER.
      These tests assume label exchangeability within a resampling unit under the
      null. Both procedures use 10,000 replicates and seed 13, with independent random-number
      streams for bootstrap sampling and randomization. Monte Carlo p -values use
      ( b + 1) / (10 , 000 + 1) , where b counts randomizations at least as extreme
      as the observed absolute difference. The initial plan specified 134 core contrasts
      and 10 recoverythreshold contrasts before inspecting the revised inferential
      results. After that analysis and a cachecoverage audit, we added four recovered-source
      versus summary-verification contrasts at nominal 0.25 for RECOMP and LLMLingua-2
      on both datasets. The extension plan was recorded before running these four
      tests, and Holm adjustment was recomputed over all 148 raw p -values. We denote
      Holm-adjusted values by p H . All reported adjusted values use this expanded
      family; original effects, intervals, and raw p -values are unchanged. This is
      a post hoc camera-ready analysis, not a preregistration. Intervals are pointwise,
      not simultaneous; statistical-support statements use p H < 0 . 05 . Failure
      to reject a difference does not establish equivalence or preservation. All inference
      is conditional on the fixed generator outputs, recovery procedure, and evaluator.\nPrecision-code
      audit. The manuscript''s precision definition requires the concatenated cited
      evidence to entail a claim before any individual citation receives credit. A
      code audit found that the previous implementation could credit an individually
      supporting citation even when joint entailment failed. A saved ASQA answer reproduced
      this discrepancy, and a regression test now checks the required gate through
      the evaluation pipeline.\n", "F. How the Model Fails\nThe most useful result
      for a system designer is not how often the model is wrong but how it is wrong.
      Two failures are possible under attack. The model can accept the falsehood and
      state it, or it can notice the conflict and decline. It could also invent a
      third answer grounded in neither, which the hallucination proxy is meant to
      catch.\nThe evidence points to abstention as the dominant recorded failure mode.
      Averaged over all runs the model abstains on 35.2% of poisoned queries, well
      above the 21.1% fooled rate. Figure 4(a) shows abstention climbing with poisoning
      for every strategy and reaching 69% for entity swap at full corruption. The
      lexical-overlap proxy moves the other way. Figure 4(b) shows that low-overlap
      answers are more common on the clean arm, near 29%, than on the poisoned arm,
      near 20%. Under this proxy, corrupted context does not look like a surge of
      unsupported invention; it looks like a surge of refusal. A fuller faithfulness
      taxonomy (entailment, contradiction, poison adoption, unsupported generation)
      would be needed before claiming that hallucination itself falls.\nFig. 1. Accuracy
      as a function of how many of the three retrieved passages are poisoned. Panel
      (a) shows poisoned accuracy per strategy against the shared clean baseline;
      the clean arm stays near 78% while every poisoned curve declines. Panel (b)
      shows the drop relative to the clean arm, where entity swap opens the widest
      gap at high poisoning.\nFig. 2. Fooled rate for every strategy and poisoning
      level. Colour runs from green (safe) to red (many answers flipped). The number-swap
      row barely changes between zero and one poisoned passage, then rises steeply.\nFigure
      5 decomposes only those queries the model answered correctly on clean context,
      so every bar starts from a fact the model knew. As poisoning grows, the green
      ''still correct'' band shrinks and is replaced mostly by blue abstention, with
      the red ''fooled'' band growing more slowly. Negation is the most resilient:
      even at full corruption a large share of originally correct answers survives,
      which matches our expectation that an explicit ''never'' is easier to distrust
      than a silent swap.\nFig. 3. Fooled rate by poisoning level. Entity swap and
      negation grow steadily, whereas number swap (bold) stays flat through one poisoned
      passage and then rises once poisoned passages become the majority. Intervals
      for the numberswap jump are reported in the text.", "B. Accuracy Degradation\nTable
      I tracks the model as more of its context is corrupted. The clean arm stays
      near 78% throughout, which confirms that the query set itself is not drifting
      across rows. Poisoned accuracy still moves for reasons other than poisoning
      alone: the 0 / 3 cell is already 69.4%, nine points below the clean arm, before
      any passage is rewritten. From that residual baseline the poisoned arm falls
      further to 63.9% at one corrupted passage and to 43.5% when all three are corrupted.
      The fooled rate rises from 9.5% at 0 / 3 to 34.0% at 3 / 3 , and abstention
      climbs from 21% to 52%. Attack effects should be read against the 0 / 3 residual,
      not against a silent zero.\nTABLE I ACCURACY AND FAILURE BEHAVIOUR BY POISONING
      LEVEL, AVERAGED OVER ALL THREE STRATEGIES. EACH LEVEL AGGREGATES 147 RUNS.\n\n0
      / 3, Clean acc. (%) = 78.2. 0 / 3, Poisoned acc. (%) = 69.4. 0 / 3, Fooled rate
      (%) = 9.5. 0 / 3, Abstain rate (%) = 21.1. 1 / 3, Clean acc. (%) = 77.6. 1 /
      3, Poisoned acc. (%) = 63.9. 1 / 3, Fooled rate (%) = 15.0. 1 / 3, Abstain rate
      (%) = 29.3. 2 / 3, Clean acc. (%) = 78.2. 2 / 3, Poisoned acc. (%) = 53.1. 2
      / 3, Fooled rate (%) = 25.9. 2 / 3, Abstain rate (%) = 38.8. 3 / 3, Clean acc.
      (%) = 77.6. 3 / 3, Poisoned acc. (%) = 43.5. 3 / 3, Fooled rate (%) = 34.0.
      3 / 3, Abstain rate (%) = 51.7\nTABLE II FOOLED RATE WITH QUERY-LEVEL BOOTSTRAP
      95% INTERVALS (ALL STRATEGIES, 147 RUNS PER ROW).\n\n0 / 3, Fooled (%) = 9.5.
      0 / 3, 95% CI = [5 . 4 , 14 . 3]. 0 / 3, n = 147. 1 / 3, Fooled (%) = 15.0.
      1 / 3, 95% CI = [8 . 8 , 21 . 8]. 1 / 3, n = 147. 2 / 3, Fooled (%) = 25.9.
      2 / 3, 95% CI = [18 . 4 , 33 . 3]. 2 / 3, n = 147. 3 / 3, Fooled (%) = 34.0.
      3 / 3, 95% CI = [24 . 5 , 44 . 2]. 3 / 3, n = 147\nFigure 1 plots the same trend
      per strategy. The three curves separate clearly. Entity swap drives the steepest
      fall, and by the full-poisoning level it sits below the other two. The right
      panel, which shows the gap against the clean arm, makes the ordering explicit
      and shows that no strategy is harmless once two of the three passages are corrupted."],
