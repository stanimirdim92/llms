    body: "{\"max_tokens\":16000,\"messages\":[{\"role\":\"user\",\"content\":\"You
      check whether an answer is supported by its sources.\\n\\nQuestion: How many
      fact-checking queries are in the poisoning study's evaluation set, and how many
      are distinct?\\n\\nSources the answer was written from:\\n[1] E. Experimental
      Design\\nThe evaluation set contains 49 fact-checking queries, of which 37 are
      distinct, spanning locations, dates and counts, yes/no claims, and people. Ten
      information-rich passages covering the queried facts were added to the index
      because raw FEVER evidence sentences are often too terse to support a full answer.
      Crossing the query set with three strategies and four poisoning levels yields
      49 \xD7 3 \xD7 4 = 588 runs, each producing a clean and a poisoned answer for
      1 , 176 generations in total. Because a full sweep takes roughly a day on CPU,
      results are written to disk after every run and a checkpoint records completed
      cells, so an interrupted sweep resumes without repeating work.\\n\\n[2] C. Uncertainty
      on the Existing Runs\\nWe do not invent new generations for this revision. We
      reanalyse the same table with a query-level bootstrap: resample the 49 indexed
      query slots with replacement (37 distinct texts), keep every run tied to a drawn
      slot, recompute the fooled rate, and repeat 10 , 000 times with a fixed seed
      to obtain percentile 95% intervals. Exact McNemar tests on discordant clean/poisoned
      correctness pairs are reported as a secondary check; effect sizes and intervals
      remain primary.\\nTable II shows that the climb with poisoning level remains
      after accounting for query resampling, while neighbouring levels overlap. The
      comparison that matters for the numeric pattern is isolated next.\\nTABLE III
      BEHAVIOUR BY STRATEGY, AVERAGED OVER ALL FOUR POISONING LEVELS. EACH STRATEGY
      AGGREGATES 196 RUNS.\\n\\nEntity swap, Clean acc. (%) = 78.1. Entity swap, Poisoned
      acc. (%) = 54.6. Entity swap, Fooled rate (%) = 23.5. Entity swap, Abstain rate
      (%) = 43.4. Number swap, Clean acc. (%) = 77.6. Number swap, Poisoned acc. (%)
      = 57.7. Number swap, Fooled rate (%) = 20.4. Number swap, Abstain rate (%) =
      30.1. Negation, Clean acc. (%) = 78.1. Negation, Poisoned acc. (%) = 60.2. Negation,
      Fooled rate (%) = 19.4. Negation, Abstain rate (%) = 32.1\\n\\n[3] In RAG We
      Trust? Measuring Robustness of Retrieval-Augmented Generation Under Document
      Poisoning\\nIliano Fasolino Department of Computer Science University of Milan
      Milan, Italy\\nAbstract -Retrieval-augmented generation (RAG) grounds a language
      model in retrieved documents, which reduces hallucination but creates a new
      attack surface: if retrieved text is tampered with, the model may repeat the
      falsehood. We study how much a small quantized model, Llama 3.1 8B, degrades
      when a fraction of its retrieved context is poisoned. Three corruption strategies
      are tested, entity swap, number swap, and negation, each applied to zero, one,
      two, or three of the three retrieved passages, over a factorial sweep of 588
      runs on a fact-checking task built from FEVER. Accuracy falls from 77.9% on
      clean context to 43.5% when all three passages are corrupted. Entity swap flips
      the largest share of answers that were correct on clean context. Number-based
      corruption stays flat while poisoned passages are a minority and jumps once
      they form a majority, a pattern we re-check with query-level bootstrap intervals.
      The model rarely invents new falsehoods; its dominant reaction is to abstain,
      and a lexical overlap proxy of unsupported generation falls under attack rather
      than rising. The study is a small-scale measurement with coarse automated labels;
      we treat the strategy contrasts as suggestive until decoding is controlled and
      stronger adjudication is in place.\\na practitioner running a small model on
      modest hardware is a concrete measurement: how far does accuracy fall, which
      kind of corruption bites hardest, and does the model fail loudly by fabricating
      or quietly by refusing.\\nIndex Terms -retrieval-augmented generation, large
      language models, adversarial robustness, document poisoning, fact verification\\n\\n[4]
      I. INTRODUCTION\\nLarge language models answer questions fluently but carry
      two well-known liabilities: their knowledge is frozen at training time, and
      they sometimes state false facts with full confidence. Retrieval-augmented generation,
      proposed by Lewis et al. [1], addresses both by fetching relevant documents
      at query time and placing them in the prompt as evidence. The model is then
      asked to answer from that evidence rather than from memory alone. This design
      has become the default recipe for question answering over private or fast-moving
      knowledge bases.\\nThe same design introduces a dependency that is easy to overlook.
      A RAG answer is only as trustworthy as the documents it retrieves. If an attacker
      can edit, inject, or otherwise corrupt even part of the retrieved set, the grounding
      step that was meant to improve reliability becomes a channel for misinformation.
      Shi et al. [3] showed that irrelevant context alone can pull a model off track;
      corrupted but on-topic context is a stronger lever, because it looks exactly
      like the evidence the model was told to trust. What is still missing for We
      answer those three questions empirically. Our contribution is threefold. First,
      we build a reproducible poisoning testbed around a 4-bit Llama 3.1 8B model,
      a MiniLM retriever, and a FAISS index of nearly twenty thousand FEVER evidence
      sentences. Second, we run a full factorial experiment, three corruption strategies
      crossed with four poisoning levels over a fixed query set, and report accuracy,
      a fooled rate, abstention, and a lexical-overlap proxy of unsupported generation
      for every cell. Third, we characterise the failure surface: entity corruption
      flips the most answers, numeric corruption jumps once it reaches a majority
      of the context, and the model's default response to contradiction is to abstain
      rather than to invent. Every point estimate reported here comes from the same
      588-run table. Where we interpret a jump or a strategy ranking, we also report
      query-level bootstrap intervals and paired tests recomputed from that table.\\n\\n[5]
      V. CONCLUSION\\nWe measured how a 4-bit Llama 3.1 8B model behaves when its
      retrieved context is poisoned, across three corruption strategies and four poisoning
      levels in a 588-run sweep. Accuracy falls from 77.9% to 43.5% as corruption
      goes from none to total. Entity swap flips the most answers. Numeric corruption
      shows a majority-leaning jump once two of three passages are poisoned, with
      a bootstrap interval on that jump that excludes zero but remains wide. The model's
      main recorded response to attack is to abstain rather than to state a wrong
      answer, and the lexical-overlap proxy of unsupported generation falls under
      poisoning rather than rising.\\nThe study has clear limits. It covers one small
      quantized model on a compact query set with rule-based corruption, so the absolute
      numbers should not be read as universal. Retrieval is shared across the pair,
      but decoding is not locked (temperature 0.1, two independent generations), and
      the 0 / 3 residual shows that background pair noise is non-trivial. Keyword
      matching is a weak correctness criterion, and the overlap proxy is not a semantic
      faithfulness judge. The added passages make retrieval easier than raw FEVER
      evidence would. Each limit points to a concrete next step: lock decoding seeds
      across the pair and add multi-seed and multi-corruption repeats with hierarchical
      resampling, replace keyword checks with structured FEVER-style labels and normalized
      entity or quantity scoring, adjudicate a stratified sample with blinded humans
      or a validated entailment model, and decompose answers into atomic claims so
      poison adoption can be separated from unsupported generation. We also plan to
      repeat the sweep on a larger instruction-tuned model and on a second corpus,
      to replace rule-based edits with model-generated adversarial\\n- [5] K. Guu,
      K. Lee, Z. Tung, P. Pasupat, and M. Chang, 'REALM: retrievalaugmented language
      model pre-training,' in Proc. Int. Conf. Machine Learning (ICML) , 2020, pp.
