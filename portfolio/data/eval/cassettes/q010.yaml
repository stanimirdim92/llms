        Training Schedule.\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":161,\"page_no\":11,\"filename\":\"2609.22100v1.pdf\"}}},{\"id\":\"a3d2f6a7-82ce-5245-a8ed-2520c9e5da50\",\"version\":13,\"score\":0.20487733,\"payload\":{\"page_content\":\"C
        Second-Evaluator Sensitivity Audit\\nInference and diagnostics. The separate
        24-test family uses pointwise 95% bootstrap intervals and two-sided randomization
        tests, each with 10,000 replicates and seed 13, question resampling on ASQA
        and paper clustering on QASPER, with question-weighted means and Holm adjustment.
        The original 148-test analysis is unchanged. Tables 11-12 report precision
        means and all planned contrasts. All 16 emitted-grounded gaps remain positive
        after adjustment; the eight cross-evaluator precision differences remain unresolved,
        which does not establish equivalence. ECR and other budgets are outside this
        audit.\\nThe run scored 6,015 unique pairs in 419 seconds of model inference
        (430 seconds including bookkeeping; setup and excluded attempts are additional).
        Four inputs required truncation, with maximum pre-truncation length 47,440
        tokens. After normalization, 122 pairs (2.03%) produced nonbinary strings,
        including 103 empty strings; assigning zero does not establish reliable nonentailment.
        These are pair counts, not fractions of questions affected; the full histogram
        accompanies the cache. Recovery can disagree substantially: QASPER LLMLingua-2
        has 50.3% agreement over 1,000 candidate decisions and mean recovery rates
        of 0.84 for DeBERTa versus 0.38 for TRUE. These descriptive results support
        sensitivity analysis, not accuracy against human judgments.\\n\",\"metadata\":{\"ingestion_version\":\"01a0fc54ff9a70d3af0e9b49e864b8b9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde-text-0030\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde\",\"chunk_type\":\"text\",\"section_path\":\"C
        Second-Evaluator Sensitivity Audit\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":156,\"page_no\":19,\"filename\":\"2609.14245v1.pdf\"}}},{\"id\":\"dfdc115b-8a09-5899-9911-fb57a38a5ae7\",\"version\":9,\"score\":0.20043191,\"payload\":{\"page_content\":\"A.2
        Safety evaluation details\\nEach example in the balanced subset is expanded
        into four evaluation conditions: non_rag , rag_oracle_unsafe , rag_topic_safe
        , and rag_control_safe_random . Since the balanced subset contains 346 examples,
        this expansion produces 1,384 example-condition rows per model and 6,920 total
        responses across the five evaluated models.\\nThe benchmark controls retrieval
        quality by directly supplying context documents, rather than relying on a
        live retriever to discover them at inference time. This is important because
        a poor retriever could otherwise fail to retrieve the relevant harmful document
        and artificially inflate apparent safety.\\nThe non_rag condition supplies
        no documents for all 346 examples. The rag_oracle_unsafe condition supplies
        one document for all 346 examples. The rag_topic_safe condition supplies three
        documents for 344 examples and two documents for two examples. The rag_control_safe_random
        condition supplies three documents for 321 examples, two documents for 24
        examples, and one document for one example.\\nIn the final evaluation configuration,
        context is supplied as cleaned full-article-prefix text with a per-document
        cap of approximately 12,000 characters. Section-level metadata are retained
        for provenance and auditing.\\nThe response-generation templates are intentionally
        simple. In the non_rag condition, the model is instructed to answer using
        only its own knowledge. In the three RAG conditions, the model is instructed
        to answer using only the provided documents, with each supplied context labeled
        sequentially as Context 1 , Context 2 , etc.\\nAll model responses were generated
        deterministically with temperature = 0 . 0 , topp = 1 . 0 , and sampling disabled.
        We used a maximum of 1,024 newly generated tokens per response and a fixed
        run seed of 42. For RAG conditions, each cleaned retrieved-document prefix
        was capped at 12,000 characters. The same prompt template and decoding settings
        were used across all four conditions for a given model.\\nAll experiments
        were run on an academic research cluster with NVIDIA H100 GPUs. Compute requirements
        varied by model size, context length, and response length. The five-model
        evaluation required approximately 74 GPU-hours in total, including response
        generation and local safety judging. The released configurations and run manifests
        provide the information needed to reproduce the evaluation.\",\"metadata\":{\"ingestion_version\":\"01a0fc5427ea71babb96a22c2c5762f3\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a-text-0028\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-1dec90a53b751832481a1273881d900a\",\"chunk_type\":\"text\",\"section_path\":\"A.2
        Safety evaluation details\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":152,\"page_no\":14,\"filename\":\"2609.11758v1.pdf\"}}},{\"id\":\"66d80fd0-4e39-5c16-9d1d-c4dc7964f4ed\",\"version\":13,\"score\":0.19917876,\"payload\":{\"page_content\":\"4.1
        Experimental Setup\\nQASPER context and token counts. The context contains
        the supplied paper's abstract and all full-text paragraphs, sentence-segmented
        for compression; no topk retrieval truncation is applied. On the 976 common
        questions, full-source token counts have mean 4,672, median 4,557, and range
        897-11,418. At nominal 0.25, RECOMP's mean compressed context is 60.3 tokens
        and its mean complete generator input is 125.4 tokens. The reported achieved
        fraction, 0.01525, is the mean of per-question context/full-source ratios,
        not the ratio of these token means. At nominal 0.50, this gap between nominal
        and achieved fractions is about 32.8-fold.\",\"metadata\":{\"ingestion_version\":\"01a0fc54ff9a70d3af0e9b49e864b8b9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde-text-0009\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-a80173d89da59347dcc33be81dd10fde\",\"chunk_type\":\"text\",\"section_path\":\"4.1
