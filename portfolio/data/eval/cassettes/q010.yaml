- request:
    body: '{"query": "How large was the total sweep?", "documents": ["E. Experimental
      Design\nThe evaluation set contains 49 fact-checking queries, of which 37 are
      distinct, spanning locations, dates and counts, yes/no claims, and people. Ten
      information-rich passages covering the queried facts were added to the index
      because raw FEVER evidence sentences are often too terse to support a full answer.
      Crossing the query set with three strategies and four poisoning levels yields
      49 \u00d7 3 \u00d7 4 = 588 runs, each producing a clean and a poisoned answer
      for 1 , 176 generations in total. Because a full sweep takes roughly a day on
      CPU, results are written to disk after every run and a checkpoint records completed
      cells, so an interrupted sweep resumes without repeating work.", "4 Experimental
      Setup\nWe know what size of effect we could have caught. Our sample sizes give
      80% power to detect a difference of roughly 7 percentage points (pp). Plainly:
      had RLVR moved post-rationalization by 7pp or more in either direction, this
      design would almost certainly have caught it. Shifts of a couple of points stay
      inside our blind spot, which is why we report a bounded null rather than a flat
      absence of effect. We fixed the primary outcome and the family of corrected
      comparisons in writing before the scorer ran.\nCompute. Everything ran on Kaggle''s
      free tier, two T4s or a single P100 per session: 48 GPU jobs yielding 36,690
      scored records across four models, four datasets, three variants, and both conditions.
      The original study used a 104B model; the controlled version of the same measurement
      fits on hardware anyone can get for free, and that is the part we would most
      like other groups to borrow.", "Table 5: Training schedule for the three-stage
      procedure.\n\n| Stage              |   Examples |   Epochs |\n|--------------------|------------|----------|\n|
      Stage 1            |  2,000,000 |        1 |\n| Stage 2            |    500,000
      |        1 |\n| Stage 3 (KILT-SCR) |    196,916 |        3 |", "Table 2: Mean
      input tokens on 944 ASQA questions at nominal budget 0.25 (identity: full context).
