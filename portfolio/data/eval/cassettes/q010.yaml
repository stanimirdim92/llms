      from a document registry (filenames, status, chunk counts), never from document
      content.\n- factual: a specific question whose answer sits in a handful of passages
      -- \"what electrolyte did they use?\", \"summarise report.pdf\". The default
      for an ordinary question about content.\n- aggregate: asks about themes, patterns,
      or a comparison spanning many or all of the user''s documents -- \"what themes
      run through my uploads?\", \"compare every paper''s methodology\".\n- out_of_scope:
      not about documents at all -- small talk, a coding request, the weather, or
      world knowledge with no document referent.\n\nYou cannot see the user''s documents,
      and you must not guess at their contents. An unfamiliar name, benchmark, method
      or term in the question is evidence FOR factual, not against it: a person naming
      something specific is naming something they uploaded. Only choose out_of_scope
      when the question would be off-topic whatever the user had uploaded.\n\nRespond
      with exactly one label.","thinking":{"type":"disabled"},"tool_choice":{"type":"tool","name":"_IntentLabel"},"tools":[{"name":"_IntentLabel","input_schema":{"properties":{"intent":{"description":"Exactly
