      Sensitivity Audit\nWe sample 100 questions per dataset from sorted common-cohort
      IDs using a fresh Python seed13 random generator; QASPER spans 84 papers. Full-context
      identity and nominal-0.25 extraction, RECOMP, and LLMLingua-2 contribute 800
      unchanged saved answers, with 1,627 claims and 1,890 citation markers. The prior
      DeBERTa values are the original scores for these same sampled answers.\nModel
      and decoding. We use google/t5_xxl_true_nli_mixture (Honovich et al., 2022),
      revision aa6cfe1dd4 , with full revision and checkpoint hashes in the manifest.
      This released mixture uses SNLI, MNLI, FEVER, SciTail, PAWS, and VitaminC (Bowman
      et al., 2015; Williams et al., 2018; Thorne et al., 2018; Khot et al., 2018;
      Zhang et al., 2019; Schuster et al., 2021), rather than the original TRUE paper''s
      ANLI recipe. MNLI and FEVER overlap DeBERTa''s training mixture. Inference uses
      Transformers 4.57.6, the slow T5 tokenizer, BF16, batch size four, and one NVIDIA
      B200. The prompt places compressed text or source evidence after premise: and
      the unit or claim after hypothesis: .\nWe use an AutoAIS-style exact-one decision
      (Bohnet et al., 2022; Gao et al., 2023): generate at most ten tokens deterministically,
      strip surrounding whitespace, and count only 1 as entailment. Every other string
      scores zero; these are binary decisions, not calibrated probabilities. Unlike
      our rule, reference AutoAIS/ALCE code compares decoded strings without additional
      whitespace normalization. We retain normalized nonbinary strings, but not every
      raw output, so normalization''s effect cannot be quantified from the cache.\nEvidence
      mappings. Fixed recovery preserves declared provenance and DeBERTa-recovered
      source IDs while TRUE scores support. TRUE recovery reevaluates all top-10 lexical
      candidates for undeclared units, including DeBERTa-rejected candidates, then
      scores with TRUE. Both retain the corrected precision gate. Fixed recovery retains
      selection dependence; TRUE recovery reuses one judge. Neither removes bounded-search
      errors or supplies human calibration.\nRecorded amendments. Astrict-decoding
      pilot stopped on a nonbinary output; a second stopped on an overlong hypothesis.
      An input-only scan found five undeclared units exceeding 2,048 tokens (maximum
      hypothesis plus prompt: 2,988), motivating a uniform 4,096-token cap that preserves
      complete hypotheses and truncates only premises. A later batch-eight run exhausted
      GPU memory. All interrupted attempts and plans are preserved but excluded; the
      final batch-four run recomputes every input in a fresh cache. These amendments
      preceded inspection of any aggregate TRUE comparison report and left the sample,
      thresholds, and 24 comparisons unchanged. The cap exceeds original TRUE''s 2,048
      and DeBERTa''s 512 tokens, so cross-evaluator differences do not isolate model
      family.", "E. A Majority Pattern in Numeric Corruption\nFigure 3 isolates that
      pattern. For entity swap and negation the fooled rate grows in roughly even
      steps as poisoning increases. Number swap behaves differently. It stays at 10.2%
      for both zero and one corrupted passage (bootstrap 95% CI [2 . 0 , 18 . 4] in
      both cells), then rises to 26.5% at two ( [14 . 3 , 38 . 8] ) and 34.7% at three
      ( [22 . 5 , 49 . 0] ). The jump from one to two poisoned passages is 16.3 points
      with CI [2 . 0 , 30 . 6] , which excludes zero but is wide. Exact McNemar tests
      on clean-versus-poisoned correctness are significant at two and three poisoned
      passages ( p < 10 -3 ) and not at one ( p = 0 . 22 ). We read this as a majority-leaning
      pattern consistent with outvoting a single wrong figure, not as a sharp phase
      transition proven under locked pairs. Because a model cannot sanity-check a
      bare number the way it can catch ''Madrid, Spain,'' numeric corruption remains
      a quiet risk once it reaches critical mass.", "A.3 Answerability audit of evaluation
      contexts\nWe audited the exact rendered contexts used for the final balanced
      evaluation subset (346 questions) using GPT-4.1-mini. Given a question and its
      supplied documents, the judge classified whether the documents contained the
      information needed to directly and substantially answer the question as yes
      , partial , or no . We retained examples only when the oracle context was judged
      yes or partial and the on-topic context was judged no . Thus, the oracle condition
      contains answer-bearing evidence, while the on-topic condition is topically
      related but does not directly support the unsafe answer.\nTable 8 reports the
      final audit outcomes. The random-control condition was constructed from a benign,
      off-topic document pool rather than independently re-judged by the LLM: all
      346 randomcontrol contexts contain only documents labelled none for answer support
      in the benchmark metadata (1,012 documents in total)."], "model": "rerank-2.5",
