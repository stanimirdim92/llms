      string: "{\"result\":{\"points\":[{\"id\":\"9f91e3cc-eb63-5067-9e2b-f325f5af07fc\",\"version\":5,\"score\":0.33252302,\"payload\":{\"page_content\":\"E.
        Experimental Design\\nThe evaluation set contains 49 fact-checking queries,
        of which 37 are distinct, spanning locations, dates and counts, yes/no claims,
        and people. Ten information-rich passages covering the queried facts were
        added to the index because raw FEVER evidence sentences are often too terse
        to support a full answer. Crossing the query set with three strategies and
        four poisoning levels yields 49 \xD7 3 \xD7 4 = 588 runs, each producing a
        clean and a poisoned answer for 1 , 176 generations in total. Because a full
        sweep takes roughly a day on CPU, results are written to disk after every
        run and a checkpoint records completed cells, so an interrupted sweep resumes
        without repeating work.\",\"metadata\":{\"ingestion_version\":\"01a0fc53392f724b972307d03a9f94d9\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead-text-0006\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-11cceaa84246e8e753a543a5d12c1ead\",\"chunk_type\":\"text\",\"section_path\":\"E.
        Experimental Design\",\"tenant_id\":\"01a0aa96b5ef7053a767b8ddabb5a961\",\"order_index\":30,\"page_no\":2,\"filename\":\"2609.09243v1.pdf\"}}},{\"id\":\"a9d96eb0-e563-5a4a-be72-fdfa293a765e\",\"version\":15,\"score\":0.32787186,\"payload\":{\"page_content\":\"4
        Experimental Setup\\nWe know what size of effect we could have caught. Our
        sample sizes give 80% power to detect a difference of roughly 7 percentage
        points (pp). Plainly: had RLVR moved post-rationalization by 7pp or more in
        either direction, this design would almost certainly have caught it. Shifts
        of a couple of points stay inside our blind spot, which is why we report a
        bounded null rather than a flat absence of effect. We fixed the primary outcome
        and the family of corrected comparisons in writing before the scorer ran.\\nCompute.
        Everything ran on Kaggle's free tier, two T4s or a single P100 per session:
        48 GPU jobs yielding 36,690 scored records across four models, four datasets,
        three variants, and both conditions. The original study used a 104B model;
        the controlled version of the same measurement fits on hardware anyone can
        get for free, and that is the part we would most like other groups to borrow.\",\"metadata\":{\"ingestion_version\":\"01a0fc55257f7276be70b7b3d1501b36\",\"chunk_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6-text-0012\",\"doc_id\":\"01a0aa96b5ef7053a767b8ddabb5a961-7b9f9dcf16004645549a905aaedd7de6\",\"chunk_type\":\"text\",\"section_path\":\"4
