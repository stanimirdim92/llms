      Experimental Design\\nThe evaluation set contains 49 fact-checking queries,
      of which 37 are distinct, spanning locations, dates and counts, yes/no claims,
      and people. Ten information-rich passages covering the queried facts were added
      to the index because raw FEVER evidence sentences are often too terse to support
      a full answer. Crossing the query set with three strategies and four poisoning
      levels yields 49 \xD7 3 \xD7 4 = 588 runs, each producing a clean and a poisoned
      answer for 1 , 176 generations in total. Because a full sweep takes roughly
