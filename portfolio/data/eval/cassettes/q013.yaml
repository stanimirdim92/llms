- request:
    body: '{"query": "What hardware were AdaMem''s experiments run on?", "documents":
      ["Top-25 QA robustness under stronger compression\nFigure 7: LLM-as-a-judge
      accuracy under increasingly strong inference-time compression. AdaMem consistently
      retains higher answer quality than OSCAR as the memory budget decreases.", "B
      Inference Efficiency\nTable 4 reports per-query latency, throughput, total compute,
      and peak GPU memory on TriviaQA with k = 25 retrieved passages, for all inference-time
      compression rates used in the main text.\nAll compressed configurations are
      substantially cheaper than Full Context: latency drops by 3 . 5 \u00d7 to 4
      . 9 \u00d7 and compute by 2 . 9 \u00d7 to 5 . 0 \u00d7 , confirming that soft
      compression removes the dominant cost of processing large retrieval pools. Relative
      to OSCAR at the same compression rate, AdaMem adds the cost of relevance scoring
      and of encoding the fixed candidate memory bank before selection. This overhead
      is confined to the compressor and does not grow with the decoder context, so
      its share shrinks as compression increases: from 36.3 ms (23%) at 16 \u00d7
      to 10.0 ms (7%) at 64 \u00d7 and 7.6 ms (6%) at 128 \u00d7 . Because the quality
      of AdaMem is nearly flat in the compression rate, it can be operated at aggressive
      compression where this overhead is smallest: at 64 \u00d7 and 128 \u00d7 , AdaMem
      matches or improves on OSCAR at 16 \u00d7 in latency, throughput, and compute
      while providing higher answer quality. Peak memory remains moderately higher
      than OSCAR because the candidate bank for the full pool is encoded before allocation,
      yet at 64 \u00d7 it is already below the Full Context footprint (44.4 versus
      53.5 GB), and the gap narrows further with compression.", "Table 4: Inference
      efficiency on TriviaQA with k = 25 : per-query latency, throughput, total compute,
      and peak GPU memory across inference-time compression rates.\n\n| Method       |
      Rate   |   Lat. (ms) |   Thr. (q/s) |   TFLOPs |   Mem. (GB) |\n|--------------|--------|-------------|--------------|----------|-------------|\n|
      Full Context | 1 \u00d7    |       667.4 |         1.50 |     59.9 |        53.5
      |\n| OSCAR        | 16 \u00d7   |       156.1 |         6.41 |     15.0 |        39.6
      |\n| OSCAR        | 32 \u00d7   |       149.3 |         6.70 |     13.4 |        39.0
      |\n| OSCAR        | 64 \u00d7   |       142.9 |         7.00 |     12.5 |        38.7
      |\n| OSCAR        | 128 \u00d7  |       136.4 |         7.33 |     12.1 |        38.5
      |\n| AdaMem       | 16 \u00d7   |       192.4 |         5.20 |     21.0 |        56.4
      |\n| AdaMem       | 32 \u00d7   |       167.5 |         5.97 |     16.6 |        48.4
      |\n| AdaMem       | 64 \u00d7   |       152.9 |         6.54 |     14.3 |        44.4
      |\n| AdaMem       | 128 \u00d7  |       144.0 |         6.95 |     13.0 |        42.3
      |", "B Inference Efficiency\nTable 4: Inference efficiency on TriviaQA with
      k = 25 : per-query latency, throughput, total compute, and peak GPU memory across
      inference-time compression rates.\n\nFull Context, Rate = 1 \u00d7. Full Context,
      Lat. (ms) = 667.4. Full Context, Thr. (q/s) = 1.50. Full Context, TFLOPs = 59.9.
      Full Context, Mem. (GB) = 53.5. OSCAR, Rate = 16 \u00d7. OSCAR, Lat. (ms) =
      156.1. OSCAR, Thr. (q/s) = 6.41. OSCAR, TFLOPs = 15.0. OSCAR, Mem. (GB) = 39.6.
      OSCAR, Rate = 32 \u00d7. OSCAR, Lat. (ms) = 149.3. OSCAR, Thr. (q/s) = 6.70.
      OSCAR, TFLOPs = 13.4. OSCAR, Mem. (GB) = 39.0. OSCAR, Rate = 64 \u00d7. OSCAR,
      Lat. (ms) = 142.9. OSCAR, Thr. (q/s) = 7.00. OSCAR, TFLOPs = 12.5. OSCAR, Mem.
      (GB) = 38.7. OSCAR, Rate = 128 \u00d7. OSCAR, Lat. (ms) = 136.4. OSCAR, Thr.
      (q/s) = 7.33. OSCAR, TFLOPs = 12.1. OSCAR, Mem. (GB) = 38.5. AdaMem, Rate =
      16 \u00d7. AdaMem, Lat. (ms) = 192.4. AdaMem, Thr. (q/s) = 5.20. AdaMem, TFLOPs
      = 21.0. AdaMem, Mem. (GB) = 56.4. AdaMem, Rate = 32 \u00d7. AdaMem, Lat. (ms)
      = 167.5. AdaMem, Thr. (q/s) = 5.97. AdaMem, TFLOPs = 16.6. AdaMem, Mem. (GB)
      = 48.4. AdaMem, Rate = 64 \u00d7. AdaMem, Lat. (ms) = 152.9. AdaMem, Thr. (q/s)
      = 6.54. AdaMem, TFLOPs = 14.3. AdaMem, Mem. (GB) = 44.4. AdaMem, Rate = 128
      \u00d7. AdaMem, Lat. (ms) = 144.0. AdaMem, Thr. (q/s) = 6.95. AdaMem, TFLOPs
      = 13.0. AdaMem, Mem. (GB) = 42.3", "This is a line chart comparing TriviaQA
      match performance against compression rate (16x, 32x, 64x, 128x on x-axis) for
      three memory allocation methods. The \"AdaMem (ours)\" method (blue line) maintains
      the highest accuracy across all compression rates, starting near 84 and ending
      around 82 (only -2.08% drop from full context), outperforming \"Uniform(Oscar)\"
      (orange line, dropping to -7.34%) and \"Uniform(Pisco)\" (purple line, dropping
      to -7.52%). A dashed green line at the top indicates \"Full Context\" performance
      (~84.5) as the reference baseline, and a schematic above the chart illustrates
      how AdaMem allocates variable-length document representations (d1-d4) compared
      to Uniform''s equal-length allocation.", "4 Experimental Setup\nWe know what
      size of effect we could have caught. Our sample sizes give 80% power to detect
      a difference of roughly 7 percentage points (pp). Plainly: had RLVR moved post-rationalization
      by 7pp or more in either direction, this design would almost certainly have
      caught it. Shifts of a couple of points stay inside our blind spot, which is
      why we report a bounded null rather than a flat absence of effect. We fixed
      the primary outcome and the family of corrected comparisons in writing before
      the scorer ran.\nCompute. Everything ran on Kaggle''s free tier, two T4s or
      a single P100 per session: 48 GPU jobs yielding 36,690 scored records across
      four models, four datasets, three variants, and both conditions. The original
      study used a 104B model; the controlled version of the same measurement fits
      on hardware anyone can get for free, and that is the part we would most like
      other groups to borrow.", "Experiments and Results\nBaselines. We compare AdaMem
      against hardcompression methods (RECOMP, LLMLingua, and LLMLingua-2), and soft-compression
      methods (xRAG, PISCO, and OSCAR). No Context answers without retrieved evidence,
      while Full Context provides all retrieved passages without compression. PISCO
      and OSCAR are the closest soft-compression baselines because they support large
      retrieved candidate pools and integrate compression with the retrieval pipeline.
      PISCO uses query-independent passage compression, whereas OSCAR, like AdaMem,
      performs query-conditioned compression and relevance scoring. Both assign memory
      uniformly across retained passages, while AdaMem allocates a fixed global budget
      according to passage relevance. To isolate this difference, we train PISCO,
      OSCAR, and AdaMem using identical data splits, hyperparameters, and training
      stages. Consequently, the comparison with OSCAR directly measures the effect
      of relevance-aware memory allocation under a matched setup.\nMain Results. Table
      1 reports results with 25 retrieved documents. At the reference compression
      rate of 16 \u00d7 , AdaMem achieves the best performance among compressed methods
      on five of six benchmarks. The only exception is BioASQ, where LLMLingua-2 achieves
      the strongest compressed result. Nevertheless, AdaMem outperforms all evaluated
      soft-compression baselines.\nHard-compression methods exhibit a clear trade-off
      between compression and answer quality. RECOMP achieves the highest compression
      rate (200 \u00d7 ), but its performance remains only moderately above the No
      Context baseline; for example, it improves HotpotQA from 32.3 to 37.0. Conversely,
      LLMLingua and LLMLingua-2 operate at only 2 \u00d7 compression, retaining a
      substantially larger text budget, yet generally remain below AdaMem. For instance,
      at 16 \u00d7 , AdaMem improves over LLMLingua-2 by 3.3 points on TriviaQA, 3.0
      points on HotpotQA, and 17.3 points on PopQA. Thus, hard compression either
      requires aggressive token removal, which leaves limited useful evidence, or
      preserves much larger context without reaching the effectiveness of soft compression.\nAmong
      soft-compression methods, AdaMem consistently outperforms OSCAR under the same
      16 \u00d7 memory budget and yields substantial gains over PISCO. xRAG performs
      poorly in this setting because it is designed to compress a single document.
      When applied to long multi-document contexts, its compressed tokens become less
      informative and fail to preserve passage-specific, query-relevant evidence.\nBoth
      AdaMem and OSCAR are trained at 16 \u00d7 compression. We evaluate higher compression
      ratios exclusively at inference time, without additional training or fine-tuning.
      At 32 \u00d7 , AdaMem outperforms OSCAR at its training-time compression ratio
      of 16 \u00d7 across all benchmarks, indicating that it can use approximately
      half as many memory embeddings while maintaining answer quality. Even at 64
      \u00d7 , AdaMemsurpasses OSCAR at 16 \u00d7 on five of six benchmarks. Moreover,
      AdaMem retains a clear advantage over OSCAR at the same\n64 \u00d7 compression
      rate. For example, on TriviaQA, increasing compression from 16 \u00d7 to 64
      \u00d7 reduces performance by only 0.7 points for AdaMem, compared with 5.3
      points for OSCAR. This robustness suggests that relevance-aware allocation preserves
      salient evidence when the memory budget is severely constrained.", "This is
      a grouped bar chart comparing the performance of two methods, AdaMem (blue)
      and OSCAR (yellow hatched), across three question-answering datasets: TriviaQA,
      NQ, and HotpotQA. The y-axis shows \"Llama-3 judge (%)\" scores ranging from
      0 to about 90, while the x-axis shows compression rates of 16\u00d7, 32\u00d7,
      and 64\u00d7 for each dataset. Across all datasets and compression rates, AdaMem
      consistently outperforms OSCAR, with the performance gap widening as compression
      rate increases (e.g., in HotpotQA, AdaMem scores 62.4% vs OSCAR''s 55.3% at
      64\u00d7 compression), indicating AdaMem maintains accuracy better under higher
      compression.", "Experiments and Results\nFinally, at 16 \u00d7 , AdaMem closely
      approaches Full Context performance despite replacing the retrieved text with
      a substantially shorter continuous representation. On TriviaQA, it is within
      0.4 points of Full Context, while on PopQA it exceeds Full Context by 1.4 points.
      Hence, selective memory allocation can both reduce computational cost and mitigate
      interference from irrelevant retrieved passages.\nFigure 4: Memory-token allocation
      by document relevance rank at 64 \u00d7 compression. The dashed line denotes
      OSCAR''s fixed 16 \u00d7 allocation.\nMemory Allocation Behavior. Figure 4 illustrates
      the allocation mechanism under this highly constrained 64 \u00d7 setting. For
      the most relevant documents, AdaMem allocates a median of roughly 10 memory
      tokens, already exceeding OSCAR''s fixed budget of 9 tokens per document at
      16 \u00d7 . The 90th percentile is substantially higher, indicating that for
      some queries, AdaMem assigns considerably more capacity to the most relevant
      document. In contrast, the allocation decreases sharply with relevance rank
      and approaches zero for lower-ranked documents. Thus, AdaMem concentrates capacity
      on query-relevant evidence while assigning minimal capacity to noisy passages,
      reducing their potential interference in the compressed context.\nRobustness
      to Retrieval Depth and Compression. Figure 3 compares AdaMem and OSCAR across
      retrieval depths k \u2208 { 5 , 10 , 15 , 20 , 25 } and compression ratios of
      16 \u00d7 , 32 \u00d7 , and 64 \u00d7 at \u03c4 =1. AdaMem benefits more consistently
      from deeper retrieval, whereas OSCAR remains nearly constant as additional lower-ranked
      documents are introduced.\nThis difference is most pronounced under aggressive
      compression. At 64 \u00d7 , increasing k from 5 to 25 improves AdaMem by 3.5
      points on TriviaQA, 5.4 on Natural Questions, and 4.2 on HotpotQA, while OSCAR
      changes only marginally over the same range. A similar pattern holds at 32 \u00d7
      , particularly on Natural Questions and HotpotQA.\nThese results suggest that
      AdaMem can extract useful evidence from less-relevant documents without allocating
      them the same budget as highly relevant ones. In contrast, OSCAR''s fixed per-document
      allocation provides limited benefit from deeper retrieval, as its representation
      capacity is uniformly spread over an increasingly noisy document set. The effect
      is weaker at 16 \u00d7 , where both methods have sufficient capacity for shallow
      retrieval pools, but becomes increasingly clear as the memory budget is reduced.\nFigure
      5: Quality-latency tradeoff on TriviaQA. AdaMem shows similar latency as OSCAR
      and matches Full Context quality at 4 . 0 \u00d7 lower latency.", "This is a
      line chart grid comparing two retrieval-augmented QA methods, OSCAR (red) and
      AdaMem (green), across three datasets (TriviaQA, NQ, HotpotQA) and three compression
      ratios (16x, 32x, 64x), forming a 3x3 panel layout. The x-axis in each subplot
      represents the number of retrieved documents (k = 5, 10, 15, 20, 25), while
      the y-axis shows task performance scores (ranging roughly from 36 to 84 depending
      on the dataset/compression level). Across nearly all panels, AdaMem consistently
      outperforms OSCAR, with the performance gap generally widening as compression
      increases (64x) and as more documents are retrieved, demonstrating AdaMem''s
      superior robustness under higher compression and larger retrieval sets.", "This
      is a line/scatter plot comparing retrieval or memory methods on a latency-accuracy
      tradeoff. The x-axis shows \"Latency per query (ms, log scale)\" ranging from
      about 140 to 670+, and the y-axis shows \"Match (%)\" ranging from roughly 76
      to 84. Three methods are plotted: AdaMem (green circles) and OSCAR (orange squares),
      each annotated with compression/sampling factors (128\u00d7, 64\u00d7, 32\u00d7,
      16\u00d7), showing that AdaMem achieves higher match scores at lower latencies
      than OSCAR; a \"Full Context\" baseline (purple star) achieves the highest match
      (~84%) but at much greater latency (~670 ms), labeled as \"4\u00d7 lower latency\"
      compared to the other methods, indicating AdaMem approaches Full Context accuracy
      while being significantly faster.", "C Hardware Settings\nAll experiments were
      conducted on a single node with eight NVIDIA A100-SXM4 GPUs (80GB each). We
      used bfloat16 , FlashAttention-2, and PyTorch distributed training via Accelerate
      and DeepSpeed with data parallelism. Pre-training used four GPUs with an effective
      batch size of 1,024, while both fine-tuning stages used eight GPUs with effective
      batch sizes of 512. Evaluation was distributed across eight GPUs, whereas latency
      and throughput were measured on a single A100 GPU.", "Experiments and Results\nEfficiency-Performance
      Tradeoff. Figure 5 relates TriviaQA Match to per-query inference latency across
      compression rates (theoretical optimal \u03c4 is used) . AdaMem operates at
      the same low latency as prior soft compression while delivering uncompressed-quality
      answers roughly 4 \u00d7 more efficiently than Full Context: at 32 \u00d7 compression
      it matches Full Context quality (84.4 Match) at 4 . 0 \u00d7 lower latency and
      3 . 6 \u00d7 less compute. The two methods also trade quality for speed in sharply
      different ways. Lowering the budget moves OSCAR down a steep curve, losing 5.3
      Match points between 16 \u00d7 and 64 \u00d7 compression, whereas AdaMem stays
      within 0.5 points over the same range: relevance-aware allocation converts compression
      into latency savings almost without quality cost. As a result, AdaMem at 64
      \u00d7 is both faster and more accurate than uniform compression at 16 \u00d7
      . Appendix B provides additional efficiency discussion with detailed measurements,
      including throughput, compute, and memory information.\nEffect of Training-Data
      Filtering. We evaluate the impact of filtered fine-tuning data. KILT-SCR retains
      instances where the retrieved pool contains a gold-answer alias and the teacher
      target is answer-consistent, reducing noise in both retrieval supervision and
      generation targets.\nFor a controlled comparison, we train the same AdaMem model
      for one epoch on either filtered or unfiltered data under identical settings.
      Using 25 passages and a compression rate of 16, Table 2 shows that KILT-SCR
      improves performance by 1.7 points on average, indicating better alignment between
      relevance estimation and answer generation.\nAblation of Training Stages. Table
      3 ablates the contribution of the three training stages. Removing Stage 1 causes
      the largest performance drop across all datasets, particularly on NQandHotpotQA.Thisresultshowsthatdirectly
      optimizing query-dependent generation and relevance-supervision objectives is
      insufficient to learn effective continuous passage representations from scratch.
      Removing either Stage 2 or Stage 3 produces smaller but consistent degradations.
      Without Stage 2, the model loses the intermediate adaptation from generic soft
      compression to query-conditioned evidence representation. Without Stage 3, it
      is not optimized for relevance estimation and memory allocation over the full
      retrieved candidate pools used at inference time.\nTable 2: Effect of filtered
      fine-tuning data on Match (%) at compression rate 16. Both models are trained
      for one epoch.\n\nUnfiltered, TriviaQA = 80.3. Unfiltered, NQ = 62.8. Unfiltered,
      HotpotQA = 42.6. Filtered, TriviaQA = 82.8. Filtered, NQ = 63.3. Filtered, HotpotQA
      = 44.5. Difference, TriviaQA = +2.5. Difference, NQ = +0.6. Difference, HotpotQA
      = +2.0", "AdaMem: Adaptive Memory Token Allocation for Soft Compression in Retrieval-Augmented
      Generation\nArtem Sakhno, Grigorii Davydenko, Omar Zoloev, Julia Belikova, Andrey
      Savchenko, Maksim Makarenko \u2217", "This is a schematic diagram illustrating
      the \"AdaMem\" adaptive memory compression method for retrieval-augmented language
      models, shown in three panels. Panel (a) depicts a shared compressor network
      that takes query-document pairs (d1\u2013d4) and outputs relevance scores (ranging
      from 2.1 to -1.9). Panel (b) shows the adaptive budget allocation formula (using
      softmax over relevance scores divided by temperature \u03c4) that distributes
      a fixed total memory budget (B=32 tokens) unevenly across documents based on
      relevance (m1=17, m2=9, m3=6, m4=0), contrasted with a uniform allocation baseline
      (8 tokens each). Panel (c) illustrates the decoder stage, where allocated memory
      tokens are fed into a LoRA-adapted Mistral-7B model to generate an answer, demonstrating
      that AdaMem''s adaptive allocation produces the correct answer (\"Kazuo Ishiguro\")
      while uniform budget allocation yields an incorrect answer (\"Frederick Forsyth\").",
      "6 Discussion\nHow to read the R-Search result. R-Search sits above its base
      on all four datasets and significantly above on the best-powered one, which
      is a real and consistent pattern. It is also one model, one base, one prompt,
      and one scorer, so four datasets are not four independent replications, and
      the effect softens under a stricter variant and a looser outcome. Two things
      would settle it: a cross-dataset test declared in advance, and an arm fine-tuned
      on the same data without RL, which would separate the contribution of RL from
      the contribution of fine-tuning on retrieval data at all.\nA note on cost. Everything
      here, four models, four datasets, three variants, both conditions, and the control
      that makes the comparison interpretable, ran on Kaggle''s T4 GPUs. Careful measurement
      was the cheap part of this project. The expensive part was reading the construction
      code closely enough to know which controls we did not have to run.", "Experiments
      and Results\nKILT-SCR. Weconstruct KILT-SCR as a large-candidatepool resource
      with training and evaluation splits. Its training split is derived from the
      training sets of Natural Questions (Kwiatkowski et al. 2019), HotpotQA (Yang
      et al. 2018), and TriviaQA (Joshi et al. 2017). The evaluation split contains
      examples from the evaluation sets of these three datasets, together with PopQA
      (Mallen et al. 2023), ASQA (Stelmakh et al. 2022), and BioASQ (Krithara et al.
      2023; Tsatsaronis et al. 2015). For every query, we retrieve a fixed pool of
      25 passages from KILT-100w (Petroni et al. 2021) using BAAI/bge-large-en-v1.5
      (Xiao et al. 2024).\nFor each training query, we score candidates with cross-encoder/ms-marco-MiniLM-L6-v2
      (Bajaj et al. 2018) and provide the ten highest-scoring passages to Mistral-7B-Instruct-v0.2
      (Jiang et al. 2023a) to generate answer targets. We retain only instances for
      which a goldanswer alias occurs both in at least one retrieved passage and in
      the generated target, yielding 196,916 examples; teacher scores are globally
      standardized over this split. In contrast, we apply no answer-support or teacher-target
      filtering to KILTSCR evaluation split, which contains 2,000 examples each from
      Natural Questions, HotpotQA, TriviaQA, and PopQA, 948 from ASQA, and 1,609 from
      BioASQ. At evaluation time, the learned reranker scores the fixed candidate
      pool before answer generation.\nExperimental Setup. AdaMem uses a Llama-3.2-1BInstruct
      (Grattafiori et al. 2024) compressor and a Mistral-7B-Instruct-v0.2 decoder
      adapted with LoRA (Hu et al. 2022). We first pretrain the compressor and AdaMem
      projection module on two million examples sampled from EleutherAI/SmolLM2-135M-10B
      (Allal et al. 2025), using autoencoding and language-modeling objectives. We
      then perform query-dependent fine-tuning on maxoul/pisco_finetuning_data (Louis,
      D\u00e9jean, and Clinchant 2025), following the OSCAR training setup. Finally,
      we train on KILT-SCR with the joint answergeneration and reranker-distillation
      objectives. For all experiments, we report Substring Match as the primary evaluation
      metric. We provide additional LLM-as-a-judge metrics in the Supplementary Material.\nFigure
      3: Match (%) versus retrieval depth. AdaMem benefits from deeper retrieval more
      consistently than OSCAR, particularly under stronger compression.", "Conclusion\nWe
      introduced AdaMem, a relevance-aware allocation framework for soft-compressed
      RAG. Instead of uniformly representing retained passages, AdaMem converts querydependent
      relevance scores into a non-uniform allocation of a fixed global memory budget,
      concentrating capacity on answer-bearing evidence while retaining limited capacity
      for complementary passages. The resulting allocation is the exact optimum of
      a proportional-fair objective under an assumed logarithmic utility model, and
      is a first-order approximation to the reverse-water-filling optimum of classical
      exponential-distortion bit allocation.\nFigure 6: Optimal allocation temperature
      on TriviaQA across compression rates. The analytically predicted schedule (
      \u03c4 \u221d B ( \u03c1 ) , anchored at 16 \u00d7 ) follows the empirical optimum
      and consistently outperforms a fixed \u03c4 = 1 .\nAdaMem establishes a new
      state of the art among softcompression methods across six evaluated QA benchmarks.
      At 16 \u00d7 compression, it improves over baselines, the strongest prior soft-compression
      method, by an average of 3 . 4% in relative terms. The advantage becomes substantially
      larger as the memory budget decreases. At 64 \u00d7 compression, the average
      relative improvement reaches 14 . 6% , with gains of up to 21 . 8% on HotpotQA.
      At 32 \u00d7 , AdaMem exceeds OSCAR at 16 \u00d7 on every benchmark, achieving
      an average relative improvement of 2 . 9% . These results show that adaptive
      allocation is particularly effective under aggressive compression, where large
      retrieval pools must be represented within strict memory constraints.\nFinally,
      we introduce KILT-SCR, a training and evaluation resource for the joint study
      of reranking and compression. Constructed to retain answer-bearing retrieved
      evidence and answer-consistent teacher targets, it enables controlled comparison
      of reranking and memory-allocation strategies over large candidate pools with
      heterogeneous passage utility.\nSeveral future research directions remain open.
      The temperature could be learned or predicted per query rather than set per
      compression rate, allowing allocation sharpness to adapt to the confidence of
      the relevance estimates. The budget-allocation view itself is not specific to
      QA or memory embeddings and extends naturally to other bounded representations,
      such as KV-cache compression and long-context summarization.\nAllal, L. B.;
      Lozhkov, A.; Bakouch, E.; Bl\u00e1zquez, G. M.; Penedo, G.; Tunstall, L.; Marafioti,
      A.; Kydl\u00ed\u010dek, H.; Lajar\u00edn, A. P.; Srivastav, V.; Lochner, J.;
      Fahlgren, C.; Nguyen, X.-S.; Fourrier, C.; Burtenshaw, B.; Larcher, H.; Zhao,
      H.; Zakka, C.; Morlon, M.; Raffel, C.; von Werra, L.; and Wolf, T. 2025. SmolLM2:
      When Smol Goes Big - Data-Centric Training of a Small Language Model. arXiv:2502.02737.",
      "4.2 Implementation Details\nWe conduct experiments using Qwen3-VL-4BInstruct
      and Qwen3-VL-8B-Instruct (Bai et al.,\n", "D Judge Metrics\nWe use Substring
      Match as the primary metric because it is deterministic and consistent with
      standard open-domain QA evaluation. However, it can overestimate answer quality
      when a model lists multiple candidate answers: the prediction receives full
      credit whenever it contains a gold-answer alias as a substring, even if the
      response is ambiguous, unsupported, or includes incorrect alternatives. We therefore
      additionally report LLM-as-a-judge scores, which evaluate the correctness of
      the generated answer in the context of the question and reference answer. The
      judge assigns a score of 1 for a correct answer, 0.5 for a partially correct
      answer, and 0 for a wrong answer; we report the mean score as a percentage.
      This complementary evaluation penalizes answer enumeration and verifies that
      improvements in Match correspond to genuinely correct answers rather than increased
      lexical overlap with the reference.\nTable 5: Training schedule for the three-stage
      procedure.\n\nStage 1, Examples = 2,000,000. Stage 1, Epochs = 1. Stage 2, Examples
      = 500,000. Stage 2, Epochs = 1. Stage 3 (KILT-SCR), Examples = 196,916. Stage
      3 (KILT-SCR), Epochs = 3\nFor each example, we provide the judge with the question,
      the reference answer, and the model prediction. We use the following prompt:\nSystem
      prompt: You are an evaluation tool. Answer with one of: 1: Correct, 0.5: Partially
      correct, 0: Wrong.\nUser prompt: Here is a question, a golden answer, and an
      AI-generated answer. Can you judge whether the AIgenerated answer is correct
      according to the question and golden answer? Simply answer with one of: 1: Correct,
      0.5: Partially correct, 0: Wrong.\nQuestion:\n{question}\nGolden answer:\n{answer}\nGenerated
      answer: {prediction}\nFigure 7 corroborates the Match-based robustness trends.
      At the training-time compression rate of 16 \u00d7 , AdaMem matches or exceeds
      OSCAR across all three benchmarks, improving by 1.8 points on TriviaQA and 2.4
      points on NQ, while the methods are effectively tied on HotpotQA. The advantage
      grows under stronger inference-time compression. At 64 \u00d7 , AdaMem exceeds
      OSCAR by 6.1 points on TriviaQA and NQ, and by 7.1 points on HotpotQA. In contrast
      to OSCAR, AdaMem remains stable as the memory budget shrinks: its judge score
      decreases by only 0.9, 3.3, and 1.4 points from 16 \u00d7 to 64 \u00d7 on TriviaQA,
      NQ, and HotpotQA, respectively, compared with drops of 5.2, 7.0, and 8.7 points
      for OSCAR. These results show that relevance-aware allocation preserves answer-critical
      information under severe compression, rather than merely improving lexical overlap
      with reference answers."], "model": "rerank-2.5", "top_k": 5, "truncation":
      true}'
