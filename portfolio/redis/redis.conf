# Bind all interfaces inside this container, not "127.0.0.1" -- other services reach
# Redis over the compose network via its service name (redis:6379), which resolves to
# a container-internal address, not loopback. Binding only to 127.0.0.1 would make this
# unreachable from api/streamlit. This is still not exposed to the internet: the port
# published in docker-compose.yml only reaches the host machine, not the public network.
bind 0.0.0.0
protected-mode no
port 6379

# Sized for a demo container, not a production box -- raise this (and consider
# `requirepass`, unset here since nothing in this app authenticates to Redis yet) once
# something actually depends on this cache holding meaningful data.
maxmemory 256mb
maxmemory-policy allkeys-lru

# Pure cache, no persistence needed -- nothing writes data here that must survive a
# restart. Skips both the AOF log and periodic RDB snapshots.
appendonly no
save ""

activedefrag yes
