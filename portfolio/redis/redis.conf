# Bind all interfaces inside this container, not "127.0.0.1" -- other services reach Redis
# over the compose network via its service name (redis:6379), which resolves to a
# container-internal address, not loopback. Binding only to 127.0.0.1 would make this
# unreachable from api/streamlit.
#
# This file used to claim that the compose port mapping "only reaches the host machine, not
# the public network". That was wrong, and it is the kind of wrong that reads as reassurance:
# `ports: ["6379:6379"]` binds 0.0.0.0 on the host, and Docker's forwarding rules sit ahead
# of the ones ufw/firewalld write -- so on any host with a public interface this was an open,
# unauthenticated Redis, with the host firewall still reporting the port closed. The mapping
# is now explicitly `127.0.0.1:...` in docker-compose.yml, which is what makes the rest of
# this file's posture (no password, `protected-mode no`) survivable.
bind 0.0.0.0
protected-mode no
port 6379

# Sized for a demo container, not a production box -- raise this (and consider
# `requirepass`, unset here since nothing in this app authenticates to Redis yet) once
# something actually depends on this cache holding meaningful data.
maxmemory 256mb
maxmemory-policy allkeys-lru

# Pure cache, no persistence needed -- nothing writes data here that must survive a
# restart. Skips both the AOF log and periodic RDB snapshots.
appendonly no
save ""

# Redis will still warn "Memory overcommit must be enabled!" at every boot regardless of the
# two lines above -- confirmed by running this image. The fork it warns about (for a BGSAVE,
# BGREWRITEAOF, or a manual DEBUG/replication command) isn't scheduled by this config, so the
# warning is currently low-stakes rather than silenced. Not fixable from this file, or from
# docker-compose.yml at all: `vm.overcommit_memory` is global kernel state, not a per-container
# (namespaced) sysctl, so Docker's `sysctls:` won't set it and a container writing it would
# mutate the whole host regardless. It's a one-line HOST prerequisite before real traffic:
# `sudo sysctl vm.overcommit_memory=1`, persisted via `/etc/sysctl.d/`.

activedefrag yes
