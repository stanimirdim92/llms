target-version = "py313"
line-length = 120
indent-width = 4
extend-exclude = [
    # Vendored verbatim -- not ours to format. `.claude/skills/VENDORED.md` lists what came from
    # where; every vendored directory needs a line here **and in `ty.toml`'s `[src] exclude`**. The
    # two lists must name the same directories: `slo-architect` was added here and not there, and
    # `ty` -- which runs with `error-on-warning` -- failed the gate on an operator inside a vendored
    # script nobody here wrote or can fix.
    #
    # The previous version of this comment covered only the qdrant set and called this a *future*
    # risk: "a future version that actually rewrites markdown would dirty the vendor diff and make
    # 'did upstream change?' unanswerable". That future is here -- ruff 0.16 reformats python code
    # blocks inside markdown, and `ruff format --check` went red on the four langchain files from
    # the commit that vendored them, unnoticed. Adding a vendored directory without adding it here
    # therefore breaks the gate, and *fixing* the gate by letting ruff rewrite the files would
    # destroy the verbatim property the refresh procedure depends on.
    ".claude/skills/qdrant-*",
    ".claude/skills/langchain-*",
    ".claude/skills/langgraph-*",
    ".claude/skills/langsmith-*",
    ".claude/skills/postgres-database-migration",
    # This one ships three executable Python scripts, not just markdown, so the exclusion covers
    # real .py files rather than fenced blocks inside .md.
    ".claude/skills/slo-architect",
    ".ruff_cache",
    ".env",
    "*.pyi",
    "site-packages",
    "**migrations/**",
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".ruff_cache",
    ".svn",
    ".tox",
    "__pypackages__",
    "_build",
    "buck-out",
]

[lint]
extend-select = [
    "ANN",
    "A",
    "SIM",
    "FAST",
    "ASYNC",
    "E",
    "W",
    "F",
    "C",
    "D",
    "DOC",
    "I",
    "ISC",
    "PD",
    "NPY",
    "TCH",
    "TID25",
    "PIE",
    "PT",
    "PTH",
    "T20",
    "UP",
    "PL",
    "RUF",
    "B",
]
ignore = [
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    "D202",
    "D203",
    "D205",
    "D206",
    "D213",
    "D407",
    "D212",
    "PT019",
]

[lint.isort]
combine-as-imports = true
known-third-party = ["fastapi", "pydantic", "starlette", "langchain"]

[lint.per-file-ignores]
# CLI scripts print by design; that's their whole output mechanism.
"scripts/*.py" = ["T201"]
# Test literals (expected counts, sample values) aren't "magic numbers" to name.
"tests/**/*.py" = ["PLR2004"]

[lint.pydocstyle]
convention = "google"

[lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = 90

[lint.flake8-tidy-imports]
# Disallow all relative imports.
ban-relative-imports = "all"
# Ban certain modules from being imported at module level, instead requiring
# that they're imported lazily (e.g., within a function definition).
banned-module-level-imports = ["numpy", "pandas"]
