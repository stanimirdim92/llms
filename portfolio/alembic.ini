# Alembic is driven programmatically from `app/db.py::init_db`, not from the CLI, on every api and
# worker boot. This file exists for the CLI path -- `uv run alembic revision --autogenerate -m "..."`
# when adding a migration -- and for `env.py` to find `script_location`.
#
# No `sqlalchemy.url` here on purpose. It would be a second source of truth for the connection
# string and, worse, a place a real password could be committed: `app/config.py` assembles
# `DATABASE_URL` from `POSTGRES_*` and holds it as a `SecretStr`. `migrations/env.py` reads it from
# there instead, so there is one source and nothing to leak.
[alembic]
# path to migration scripts
script_location = migrations
prepend_sys_path = .
# Explicit, or alembic 1.19 warns and falls back to splitting on spaces, commas AND colons.
path_separator = os
# Timestamped filenames so `ls versions/` is chronological. The revision hash is still the identity.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[post_write_hooks]
# Autogenerated files go through the same formatter as everything else, or the gate fails on a file
# alembic wrote.
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = uv
ruff_format.options = run ruff format REVISION_SCRIPT_FILENAME
